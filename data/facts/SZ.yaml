- id: SZ-005
  domain: SZ
  subdomain: 統合失調症
  assertion:
    plain_statement_ja: 治療抵抗性統合失調症に対するクロザピンの有効性は、治療抵抗性と前向きに定義された268例を対象にクロルプロマジンと比較した二重盲検試験で示された。反応率はクロザピン群30%に対しクロルプロマジン群4%で、クロザピンは簡易精神症状評価尺度（BPRS）などの指標で有意に優れ、陰性症状に対しても有意な優位性がみられた。この短期試験では無顆粒球症の発症はなかったが、そのリスクのためクロザピンの使用は治療抵抗性の患者に限るべきとされた
    condition:
      region: 米国
      対象: 治療抵抗性統合失調症の人
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3623
    source: 'Kane J, Honigfeld G, Singer J, Meltzer H. Clozapine for the treatment-resistant schizophrenic: a double-blind comparison with chlorpromazine. Arch Gen Psychiatry. 1988;45(9):789-796'
    doi: 10.1001/archpsyc.1988.01800330013001
    pmid: '3046553'
    pmcid: null
    url: https://doi.org/10.1001/archpsyc.1988.01800330013001
    source_license: CC 表示なし（購読誌）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 抄録で確認した範囲に限る。クロザピンは国内では治療抵抗性統合失調症の適応で2009年に承認され、適正使用の管理体制（CPMS）への登録と定期的な血液検査が求められる。国内ガイドライン（統合失調症薬物治療ガイドライン2022）でも治療抵抗性統合失調症に対するクロザピンの使用が推奨されている（英語版 NPR 2025 の CQ5-1 で確認）
  curriculum:
    kokushi: 医学各論 Ⅱ-2-B-①（妄想型統合失調症、a）
