- id: SZ-008
  domain: SZ
  subdomain: 統合失調感情障害
  assertion:
    plain_statement_ja: 統合失調感情障害の診断は DSM-IV では信頼性が低く、経過の中での安定性も低かった。DSM-5 では診断の考え方が一時点のエピソードに基づく診断から生涯の経過に基づく診断へ変更され、診断には完全な気分エピソードが、病気の活動期と残遺期を合わせた全経過の過半の期間に存在することが求められる。また、顕著な気分症状を伴わない妄想・幻覚が2週間以上存在することが、精神病性の特徴を伴う気分障害との鑑別点となる。この変更により診断される割合が減り、診断の安定性が高まると見込まれている
    condition:
      region: 米国
      対象: 統合失調感情障害の診断
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3626
    source: Malaspina D, Owen MJ, Heckers S, et al. Schizoaffective disorder in the DSM-5. Schizophr Res. 2013;150(1):21-25
    doi: 10.1016/j.schres.2013.04.026
    pmid: '23707642'
    pmcid: null
    url: https://doi.org/10.1016/j.schres.2013.04.026
    source_license: CC 表示なし（購読誌）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: DSM-5 の改訂を解説した論文の抄録で確認した範囲に限る。ICD-10 の統合失調感情障害は枠組みが異なるため、診断基準をそのまま同一視はできない
  curriculum:
    kokushi: 医学各論 Ⅱ-2-E（統合失調感情障害、b）
    core_curriculum: 'PS-02-17-02 (id: JkxnuTw)；TBL-02-16-002 (id: JlAKpy0)；TBL-02-16-005 (id: JlAKpzE)；PS-02-17-05 (id: JkxnuT8)'
