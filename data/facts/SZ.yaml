- id: SZ-001
  domain: SZ
  subdomain: 統合失調症
  assertion:
    plain_statement_ja: 統合失調症の亜型（妄想型・破瓜型・緊張型など）は ICD-10 の分類であり、DSM-5（2013年）では亜型分類が廃止され、ICD-11 でも亜型は採用されていない。DSM-5 では亜型に代えて症状の次元的評価で臨床像を捉える考え方が導入され、シュナイダーの一級症状に対する特別な扱いも廃止された。統合失調症の定義そのものは DSM-IV のものが概ね維持されている
    condition:
      region: 国際
      対象: 統合失調症の分類
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3621
    source: Tandon R, Gaebel W, Barch DM, et al. Definition and description of schizophrenia in the DSM-5. Schizophr Res. 2013;150(1):3-10
    doi: 10.1016/j.schres.2013.05.028
    pmid: '23800613'
    pmcid: null
    url: https://doi.org/10.1016/j.schres.2013.05.028
    source_license: CC 表示なし（購読誌）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 亜型は ICD-10 に基づく病名として国内臨床に残る場合があるが、現行の分類体系での位置づけは本カードのとおりである。DSM-5 の変更点は DSM-5 の定義を解説した論文の抄録で確認した範囲に限る
  curriculum:
    kokushi: 医学各論 Ⅱ-2-B-①（妄想型統合失調症、a）；医学各論 Ⅱ-2-B-②（破瓜型統合失調症、a）；医学各論 Ⅱ-2-B-③（緊張型統合失調症、a）
    core_curriculum: 'PS-02-17-02 (id: JkxnuTw)；PS-02-17-03 (id: JkxnuT0)；PS-02-17-04 (id: JkxnuT4)；TBL-01-00-538 (id: JlvnmUA)；TBL-02-16-005 (id: JlAKpzE)；PS-02-17-05 (id: JkxnuT8)'
