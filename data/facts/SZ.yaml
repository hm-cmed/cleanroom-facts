- id: SZ-004
  domain: SZ
  subdomain: 統合失調症
  assertion:
    plain_statement_ja: 『統合失調症薬物治療ガイドライン2022』は、急性期の統合失調症に対する抗精神病薬治療を推奨している（推奨の強さ1A）。抗精神病薬は全般的な精神症状・陽性症状・陰性症状を改善し、治療中止を減らし生活の質を改善する一方、体重増加・プロラクチン値の上昇・QTc 間隔の延長・抗パーキンソン薬使用の増加・鎮静などの有害事象は増える。維持期については、服薬アドヒアランスの低下による再発が問題となる場合、または本人が希望する場合に、持効性注射剤（LAI）の使用が望ましいとされている（弱い推奨）
    condition:
      region: 日本
      対象: 統合失調症の人
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3622
    source: Japanese Society of Neuropsychopharmacology. Guideline for pharmacological treatment of schizophrenia 2022. Neuropsychopharmacol Rep. 2025;45(1):e12497
    doi: 10.1002/npr2.12497
    pmid: '39587785'
    pmcid: PMC11666347
    url: https://doi.org/10.1002/npr2.12497
    source_license: CC BY-NC-ND 4.0
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 推奨文は英語版（NPR 2025）の CQ1-1 と CQ2-5 の本文を直接読んで確認した。持効性注射剤は国内でも承認されており、リスパリドン（2009年）、パリペリドン月1回製剤（2013年、3か月製剤は2020年）、アリピプラゾール（2015年）が該当する
  curriculum:
    kokushi: 医学各論 Ⅱ-2-B-①（妄想型統合失調症、a）
