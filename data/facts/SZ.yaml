- id: SZ-007
  domain: SZ
  subdomain: 急性一過性精神病性障害
  assertion:
    plain_statement_ja: ICD-10 の急性一過性精神病性障害と DSM-5 の短期精神病性障害に相当する短期間の精神病性障害はまれで、成人期の早期から中年にかけての女性に多い。前病前の機能障害や特徴的な家族素因とは関連せず、発展途上国や移民といった環境要因との関連が指摘されている。臨床的・機能的な転帰は良好なことが多い一方で、後になって他の精神病性障害へ移行する率が高く、移行先は主に統合失調症とその類縁疾患で、感情障害への移行は少ない。そのため長期間続く精神病性障害とは別のカテゴリーとして保持することが妥当とされている
    condition:
      region: 国際
      対象: 急性一過性精神病性障害の人
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3625
    source: Castagnini AC, Fusar-Poli P. Diagnostic validity of ICD-10 acute and transient psychotic disorders and DSM-5 brief psychotic disorder. Eur Psychiatry. 2017;45:104-113
    doi: 10.1016/j.eurpsy.2017.05.028
    pmid: '28756108'
    pmcid: null
    url: https://doi.org/10.1016/j.eurpsy.2017.05.028
    source_license: CC 表示なし（購読誌）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 100編の文献レビューに基づく論文の抄録で確認した範囲に限る。本論文が扱うのは ICD-10 と DSM-5 のカテゴリーであり、出題基準の項目名にある「非定型精神病」との対応は項目名に基づく位置づけである
