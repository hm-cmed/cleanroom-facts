- id: SZ-002
  domain: SZ
  subdomain: 統合失調症
  assertion:
    plain_statement_ja: 統合失調症の診断は本人と家族への問診が中心で、症状の内容・発症時期・経過・社会生活や日常生活への支障の程度を確認し、意識・見当識・知的レベル・思考・感情などの精神状態を評価するとともに、発育歴・既往歴・家族歴・物質使用歴も聴取する。DSM-5 の診断基準では、妄想・幻覚・解体した発話・著しく解体した行動または緊張病性行動・陰性症状のうち2つ以上が1か月の大半に存在し（少なくとも1つは妄想・幻覚・解体した発話のいずれか）、社会的・職業的機能の低下を伴い、持続的な徴候が少なくとも6か月続くことが求められる。身体疾患による精神障害を除外するため、身体所見の評価と血液・尿検査、心電図、必要に応じた脳画像などの検査を併せて行う
    condition:
      region: 日本
      対象: 統合失調症が疑われる人
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3622
    source: Japanese Society of Neuropsychopharmacology. Guideline for pharmacological treatment of schizophrenia 2022. Neuropsychopharmacol Rep. 2025;45(1):e12497
    doi: 10.1002/npr2.12497
    pmid: '39587785'
    pmcid: PMC11666347
    url: https://doi.org/10.1002/npr2.12497
    source_license: CC BY-NC-ND 4.0
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 国内ガイドライン『統合失調症薬物治療ガイドライン2022』（医学書院、ISBN 978-4-260-04987-0）の英語版（NPR 2025）第1部の診断の章で確認した範囲であり、個別の推奨文ではなく診断の枠組みの記述に基づく
  curriculum:
