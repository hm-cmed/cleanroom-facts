- id: SZ-006
  domain: SZ
  subdomain: 妄想性障害
  assertion:
    plain_statement_ja: 妄想性障害の薬物療法に関するエビデンスは限られている。臨床家評価尺度を用いた研究の系統的レビュー（6件・437例、うち第二世代抗精神病薬が投与されたのは318例）では、抗精神病薬への良好な反応（50%以上の改善）は32.3%にとどまった。第一世代抗精神病薬は第二世代よりわずかに良好な反応と関連したが差は小さく、ピモジドは全般に高い反応率を示したものの大半の亜型では優位性がみられなかった。入院治療を受けた患者で最も良好な転帰が報告されている
    condition:
      region: 国際
      対象: 妄想性障害の人
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3624
    source: Muñoz-Negro JE, Gómez-Sierra FJ, Peralta V, et al. A systematic review of studies with clinician-rated scales on the pharmacological treatment of delusional disorder. Int Clin Psychopharmacol. 2020;35(3):129-136
    doi: 10.1097/YIC.0000000000000306
    pmid: '32097136'
    pmcid: null
    url: https://doi.org/10.1097/YIC.0000000000000306
    source_license: CC 表示なし（購読誌）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 抄録で確認した範囲に限る。組み入れられた研究はいずれも小規模である。本カードは国際的な治療研究の集計であり、ピモジドを含む個別の抗精神病薬の国内承認・保険適用の状況を示すものではない
  curriculum:
    kokushi: 医学各論 Ⅱ-2-C（妄想性障害、b）
