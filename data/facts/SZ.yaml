- id: SZ-003
  domain: SZ
  subdomain: 統合失調症
  assertion:
    plain_statement_ja: 統合失調症の治療目標は回復（リカバリー）に置かれ、症状の寛解を維持し再発を防ぎながら、機能的回復と個人的回復の過程を支えることが目指される。そのためには薬物療法や電気けいれん療法などの生物学的治療と心理社会的治療を統合した包括的なアプローチが必要で、本人・家族・支援者と多職種チームが協働し、共同意思決定（SDM）を踏まえて治療を進める。臨床的回復と機能的回復の両方を達成する患者の割合の中央値は13.5%と報告されている
    condition:
      region: 日本
      対象: 統合失調症の人
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3622
    source: Japanese Society of Neuropsychopharmacology. Guideline for pharmacological treatment of schizophrenia 2022. Neuropsychopharmacol Rep. 2025;45(1):e12497
    doi: 10.1002/npr2.12497
    pmid: '39587785'
    pmcid: PMC11666347
    url: https://doi.org/10.1002/npr2.12497
    source_license: CC BY-NC-ND 4.0
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 国内ガイドライン英語版（NPR 2025）第1部の総論で確認した範囲。13.5% の数値はガイドライン本文が引用する報告の中央値で、原著の数値を直接照合したものではない（ガイドライン経由の数値）
  curriculum:
    kokushi: 医学各論 Ⅱ-2-B-①（妄想型統合失調症、a）
    core_curriculum: 'PS-02-17-04 (id: JkxnuT4)；TBL-01-00-538 (id: JlvnmUA)；TBL-02-16-017 (id: JuX-PEs)；PS-02-17-05 (id: JkxnuT8)'
