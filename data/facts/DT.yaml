- id: DT-007
  domain: DT
  subdomain: 乳児血管腫<イチゴ状血管腫>
  assertion:
    plain_statement_ja: 乳児血管腫は乳児期に最も多い良性腫瘍で、乳児の最大5%にみられる。多くは小さく自然に退縮し治療を要しないが、顔面の大きな病変、眼周囲の病変、気道や肝の病変、潰瘍を伴うものなどは、瘢痕や機能障害を残す可能性があり問題となりうる。増殖は生後1〜3か月が最も速く、ほとんどの症例で5か月までに増殖が完了する。問題となりうる病変は生後1か月までの早期の紹介・介入が推奨される。
    condition:
      region: 米国
      study: 診療ガイドライン（米国小児科学会）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1102
    source: Krowchuk DP, Frieden IJ, Mancini AJ, et al. Clinical Practice Guideline for the Management of Infantile Hemangiomas. Pediatrics. 2019;143(1):e20183475.
    doi: 10.1542/peds.2018-3475
    pmid: '30584062'
    pmcid: null
    url: https://doi.org/10.1542/peds.2018-3475
    source_license: ライセンス表示を確認できず
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 頻度（最大5%）と増殖の時期はガイドラインの抄録で確認した。日本の診療ガイドライン（血管腫・血管奇形・リンパ管奇形診療ガイドライン）での位置づけとの差異は本カードでは扱っていない。出典のライセンス表示は確認できなかった。
