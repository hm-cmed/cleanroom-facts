- id: DT-011
  domain: DT
  subdomain: 粉瘤
  assertion:
    plain_statement_ja: 粉瘤（表皮嚢腫、epidermoid cyst）は、ケラチンで満たされた被膜のある皮下結節で、顔面・頸部・体幹に好発するが、全身のどこにでも生じうる。毛包漏斗部から発生し、表皮封入嚢腫（epidermal inclusion cyst）、漏斗部嚢腫とも呼ばれる。通称の「脂腺嚢腫（sebaceous cyst）」は、脂腺由来ではないため誤称である。増大は緩徐で、年単位で存在し続けることがある。まれに嚢腫から悪性腫瘍が生じることがある。
