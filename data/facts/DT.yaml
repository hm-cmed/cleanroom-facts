- id: DT-012
  domain: DT
  subdomain: 脂漏性角化症
  assertion:
    plain_statement_ja: 脂漏性角化症は中高年に多い表皮腫瘍で、未熟な角化細胞の良性増殖によるものである。境界明瞭な円形〜楕円形の扁平な斑・局面として現れ、ゆっくり増大して厚みを増すことがあるが、自然に消退することはまれである。良性であるため治療を要しないことが多いが、希望により治療されることも多い。悪性皮膚腫瘍と形態が紛らわしい場合があるため、鑑別できることが重要とされる。
