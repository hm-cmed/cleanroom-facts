    plain_statement_ja: ケロイドと肥厚性瘢痕は、深部真皮への侵襲に対する生理的な創傷治癒の過程に異常が生じて形成される過剰な瘢痕である。疼痛や掻痒、拘縮を来し、患者の生活の質に身体的にも心理的にも大きな影響を与える。予防・軽減を目的とする治療戦略は数多く報告されているが、瘢痕形成と創収縮の機序の理解が不十分なこともあり、多くの治療法は臨床的にはいまだ十分に満足できるものではないとされる。
