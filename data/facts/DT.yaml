- id: DT-002
  domain: DT
  subdomain: 色素性母斑と太田母斑
  assertion:
    plain_statement_ja: 太田母斑は、三叉神経の第1枝・第2枝の支配領域に生じる良性のメラノーシス（ocular dermal melanosis）で、真皮にメラノサイトが留まることにより灰青色の色素沈着を呈する。同側の結膜・強膜にも色素沈着を伴い、片側性が多い。ぶどう膜悪性黒色腫と緑内障のリスクが高まることが知られ、口蓋に病変が及ぶこともある。分布が肩・上腕の領域であるものは伊東母斑と呼ばれる。
    condition:
      region: 国際
      study: 総説（StatPearls の章）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1097
    source: 'Agarwal P, Patel BC. Nevus of Ota and Ito. In: StatPearls [Internet]. Treasure Island (FL): StatPearls Publishing; 2023.'
    doi: null
    pmid: '32809409'
    pmcid: null
    url: https://pubmed.ncbi.nlm.nih.gov/32809409/
    source_license: ライセンス表示を確認できず
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 出典は太田母斑・伊東母斑を主題とする章で、記載は太田母斑を中心とした。色素性母斑そのもの（後天性・先天性のメラノサイト母斑）の分類や悪性化の数値は本出典の範囲外であり、本カードには含めていない。ダーモスコピーの所見は本出典で確認できなかったため記載していない。出典のライセンス表示は確認できなかった。
