- id: DT-001
  domain: DT
  subdomain: 母斑の総論
  assertion:
    plain_statement_ja: 表皮母斑は皮膚の過誤腫であり、角化細胞由来の角化細胞性（keratinocytic）母斑と、付属器などの要素を含む器官様（organoid）母斑に大別される。代表的な表皮母斑には、非表皮溶解性の角化細胞性母斑、脂腺母斑、面皰母斑（nevus comedonicus）、Becker母斑、CHILD母斑などがある。脂腺母斑は器官様母斑に含まれ、表皮母斑の一部は症候群に伴ってみられることがある。
    condition:
      region: 国際
      study: 総説（StatPearls の章）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1096
    source: 'Nicholson CL, Daveluy S. Epidermal Nevus Syndromes. In: StatPearls [Internet]. Treasure Island (FL): StatPearls Publishing; 2023.'
    doi: null
    pmid: '32644429'
    pmcid: null
    url: https://pubmed.ncbi.nlm.nih.gov/32644429/
    source_license: ライセンス表示を確認できず
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 出典は表皮母斑症候群を主題とする章で、分類と種類はその抄録で確認した範囲である。色素性母斑（メラノサイト性母斑）の詳細は本出典の範囲外であり、本カードでは母斑のうち表皮・付属器系のものを中心に記載した。出典のライセンス表示は確認できなかった。
