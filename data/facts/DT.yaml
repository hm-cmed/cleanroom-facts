  subdomain: リンパ管腫
  assertion:
    plain_statement_ja: リンパ管腫（リンパ管奇形）はリンパ管系の良性奇形で、皮膚や粘膜のどこにでも生じうる。異常なリンパ管の深さと大きさにより深部型と表在型に、また先天性と後天性に分類される。深部型には海綿状リンパ管腫と嚢胞性リンパ管腫（cystic hygroma）という2つの先天性病変があり、表在型には限局性リンパ管腫（lymphangioma circumscriptum）と後天性リンパ管腫（リンパ管拡張症）がある。嚢胞性リンパ管腫は13・18・21トリソミー、Noonan症候群、Turner症候群などの遺伝性疾患と関連する。頻度は低く、全血管性腫瘍の4%、小児の良性血管性腫瘍の約25%を占めるとされる。
    condition:
      region: 国際
      study: 総説（StatPearls の章）
