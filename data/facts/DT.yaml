- id: DT-033
  domain: DT
  subdomain: 粉瘤
  assertion:
    plain_statement_ja: 粉瘤（表皮嚢腫）はケラチンを満たした真皮・皮下の嚢腫であり、含有物は皮脂ではなくケラチンであるため「sebaceous cyst（皮脂嚢腫）」は誤った呼び方である。切除の際は嚢胞壁が残ると再発するため、嚢胞壁を含めて摘出することが重要である。
    condition:
      region: 米国
      study: 総説（StatPearls）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1123
    source: 'Weir CB, Sathe NC, St.Hilaire NJ. Epidermal Inclusion Cyst. In: StatPearls [Internet]. Treasure Island (FL): StatPearls Publishing; 2026.'
    doi: null
    pmid: '30335343'
    pmcid: null
    url: https://pubmed.ncbi.nlm.nih.gov/30335343/
    source_license: © StatPearls Publishing（CC表示を未確認）
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
