- id: DT-005
  domain: DT
  subdomain: Kasabach-Merritt症候群
  assertion:
    plain_statement_ja: Kasabach-Merritt現象は、急速に増大する血管性腫瘍に伴い、血小板減少、微小血管症性溶血性貧血、消費性凝固障害を来す、乳児のまれだが生命を脅かす凝固障害である。関連する血管性腫瘍はカポジ型血管内皮腫（KHE）と房状血管腫（tufted angioma）に限られ、両者は同一の腫瘍スペクトラム上にある。乳児血管腫に伴う現象ではない。治療は支持療法と原因となる腫瘍への対応が中心となる。
    condition:
      region: 国際
      study: 総説（StatPearls の章）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1100
    source: 'Lewis D, Vaidya R. Kasabach-Merritt Syndrome. In: StatPearls [Internet]. Treasure Island (FL): StatPearls Publishing; 2023.'
    doi: null
    pmid: '30085595'
    pmcid: null
    url: https://pubmed.ncbi.nlm.nih.gov/30085595/
    source_license: ライセンス表示を確認できず
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 記載は抄録で確認した範囲である。個別の治療薬（シロリムス等）の適応や用量、凝固検査値の具体的な基準は抄録の範囲外であり、本カードには薬剤名を含めていない。出典のライセンス表示は確認できなかった。
