- id: DT-004
  domain: DT
  subdomain: 結節性硬化症
  assertion:
    plain_statement_ja: 結節性硬化症（TSC）は常染色体優性遺伝の疾患で、多臓器に多彩な病変を来し、症状のばらつきが大きい。2021年の国際コンセンサス会議による診断基準の更新では、臨床診断基準の変更は2点のみで、「皮質異形成」という総称が「多発性皮質結節および／または放射状白質線状影（radial migration lines）」に置き換えられ、硬化性骨病変が副基準（minor criterion）として復活した。遺伝学的診断基準は再確認され、TSC1・TSC2バリアントのモザイク例が存在することも明記された。
    condition:
      region: 国際
      study: 国際コンセンサス会議による診断基準と管理推奨の更新
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1099
    source: Northrup H, Aronow ME, Bebin EM, et al. Updated International Tuberous Sclerosis Complex Diagnostic Criteria and Surveillance and Management Recommendations. Pediatr Neurol. 2021;123:50-66.
    doi: 10.1016/j.pediatrneurol.2021.07.011
    pmid: '34399110'
    pmcid: null
    url: https://doi.org/10.1016/j.pediatrneurol.2021.07.011
    source_license: CC BY-NC-ND 4.0
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 記載は抄録で確認した範囲である。大基準・副基準の全項目の一覧（葉状白斑、爪周囲線維腫などの皮膚所見を含む）とサーベイランスの詳細は本文の表にあり、本カードには含めていない。皮膚所見の個別の頻度も確認していない。
