- id: DT-017
  domain: DT
  subdomain: グロムス腫瘍
  assertion:
    plain_statement_ja: グロムス腫瘍は、体温調節に関わる動静脈シャントであるグロムス小体から生じるまれな良性腫瘍で、原発性軟部腫瘍の2%、手の軟部腫瘍の1〜5%を占める。約75%が手に生じ、その多くが爪下に発生する。発作性の疼痛、局所の圧痛（痛覚過敏）、寒冷過敏の三徴が約90%の症例にみられる。女性に約7倍多く、平均年齢は39歳とされる。爪下の病変は青みを帯びた3〜10 mmの結節として認められることがある。
