    source: Faries MB, Thompson JF, Cochran AJ, et al. Completion Dissection or Observation for Sentinel-Node Metastasis in Melanoma. New England Journal of Medicine. 2017;376(23):2211-2222.
    doi: 10.1056/NEJMoa1613210
    pmid: '28591523'
    pmcid: PMC5548388
    url: https://doi.org/10.1056/NEJMoa1613210
    source_license: © Massachusetts Medical Society（CC表示なし）
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 数値は抄録に記載された per-protocol 解析の3年時点の結果とリンパ浮腫の頻度である。センチネルリンパ節生検そのものの適応基準（腫瘍厚の閾値）はこの試験の対象外であり、本カードでは扱っていない。
