- id: DT-034
  domain: DT
  subdomain: 悪性黒色腫
  assertion:
    plain_statement_ja: センチネルリンパ節転移陽性の悪性黒色腫では、即時のリンパ節郭清は超音波検査による経過観察と比較してメラノーマ特異的生存を改善せず（3年時点で両群とも86%）、リンパ浮腫は郭清群で24.1%と観察群の6.3%より多かった（MSLT-II）。
    condition:
      region: 国際
      study: ランダム化比較試験（MSLT-II）
    differential: null
    common_misconception: null
  provenance:
