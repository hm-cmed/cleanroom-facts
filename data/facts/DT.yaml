- id: DT-013
  domain: DT
  subdomain: ケラトアカントーマ
  assertion:
    plain_statement_ja: ケラトアカントーマは、家庭医が評価する機会の多い皮膚腫瘍の一つであり、悪性化の可能性については議論がある（controversy exists）ため、良性腫瘍の総説でも悪性病変との鑑別を意識して扱われる。良性皮膚腫瘍全般に、診断は病変の外観と病歴に基づいて行われることが多いが、診断が不確かな病変は悪性を否定するために生検による病理組織学的検査を行うべきとされる。ケラトアカントーマに対しては、切除が治療の選択肢（treatment of choice）とされる。
