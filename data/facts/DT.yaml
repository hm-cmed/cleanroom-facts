- id: DT-018
  domain: DT
  subdomain: 色素性蕁麻疹
  assertion:
    plain_statement_ja: 色素性蕁麻疹は、肥満細胞症における代表的な皮膚病変（斑状丘疹性病変）である。国際的なコンセンサスでは、この斑状丘疹性病変を2つの亜型に分けることが提案されている。小型の斑状丘疹が均一にみられる単形型（monomorphic variant）は成人に典型的で、小児に生じた場合は成人まで持続することが多い。大きさや形が多様な大きな病変からなる多形型（polymorphic variant）は小児に典型的で、思春期頃に消退することがある。この区別は予後の予測に重要とされる。また、限局性肥満細胞症（telangiectasia macularis eruptiva perstans）は皮膚肥満細胞症の分類から外すことが提案された。
    condition:
      region: 国際
      study: 国際コンセンサス報告（欧州・米国の専門家組織）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1110
    source: 'Hartmann K, Escribano L, Grattan C, et al. Cutaneous manifestations in patients with mastocytosis: Consensus report of the European Competence Network on Mastocytosis; the American Academy of Allergy, Asthma & Immunology; and the European Academy of Allergology and Clinical Immunology. J Allergy Clin Immunol. 2016;137(1):35-45.'
    doi: 10.1016/j.jaci.2015.08.034
    pmid: '26476479'
    pmcid: null
    url: https://doi.org/10.1016/j.jaci.2015.08.034
    source_license: ライセンス表示を確認できず
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
