- id: DT-032
  domain: DT
  subdomain: 皮膚悪性腫瘍
  assertion:
    plain_statement_ja: 悪性黒色腫が疑われる皮膚病変の鑑別診断では、ダーモスコピーは肉眼診察よりも診断精度が高く、臨床現場で行われた研究のメタ解析では、肉眼診察に対するダーモスコピーの相対診断オッズ比は15.6（95%信頼区間 2.9〜83.7）であった。
    condition:
      region: 国際
      study: メタ解析
    differential: null
    common_misconception: null
  provenance:
