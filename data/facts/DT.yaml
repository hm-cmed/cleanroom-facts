- id: DT-009
  domain: DT
  subdomain: 乳児血管腫の治療
  assertion:
    plain_statement_ja: 乳児血管腫に全身治療が必要な場合、第一選択はプロプラノロール経口投与で、用量は2〜3 mg/kg/日とされる。治療は通常少なくとも6か月間続け、しばしば生後12か月まで維持される。小さく薄い表在性の病変にはチモロール外用が用いられることがある。手術やレーザーは、退縮後に残った皮膚変化の治療に最も有用とされる。高リスクの病変では、生後1か月までの早期紹介が治療の機会を逃さないために重要である。
    condition:
      region: 米国
      study: 診療ガイドライン（米国小児科学会）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1102
    source: Krowchuk DP, Frieden IJ, Mancini AJ, et al. Clinical Practice Guideline for the Management of Infantile Hemangiomas. Pediatrics. 2019;143(1):e20183475.
    doi: 10.1542/peds.2018-3475
    pmid: '30584062'
    pmcid: null
    url: https://doi.org/10.1542/peds.2018-3475
    source_license: ライセンス表示を確認できず
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 用量と治療期間はガイドラインの抄録で確認した。国内の承認・保険適用：プロプラノロール経口薬（ヘマンジオルシロップ小児用）は乳児血管腫を適応として2016年に国内で承認され、保険適用されていることを製造販売元の資料と総説で確認した。チモロール外用の乳児血管腫に対する国内の適応は未確認。投与中の低血糖・徐脈などの安全管理の詳細は本カードの範囲外とした。
