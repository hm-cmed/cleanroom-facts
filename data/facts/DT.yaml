- id: DT-003
  domain: DT
  subdomain: 神経線維腫症1型
  assertion:
    plain_statement_ja: 神経線維腫症1型（NF1）の2021年改訂診断基準では、NF1と診断された親を持たない個人について、次のうち2つ以上を満たす場合に診断が成立する：カフェオレ斑が6個以上（思春期前は最大径5 mm超、思春期後は15 mm超）、腋窩または鼠径部の雀卵斑様色素斑、神経線維腫が2個以上または叢状神経線維腫が1個、視神経膠腫、Lisch結節が2個以上（細隙灯検査）または脈絡膜異常が2個以上、特徴的な骨病変（蝶形骨形成不全、脛骨の前外側弯曲、長管骨の偽関節など）、正常組織で変異アレル頻度50%のヘテロ接合性病的NF1バリアント。改訂では遺伝学的検査と脈絡膜異常が組み込まれ、カフェオレ斑などの色素性所見が重なるLegius症候群との鑑別のための基準も設けられた。
    condition:
      region: 国際
      study: 国際コンセンサスによる診断基準の改訂
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1098
    source: 'Legius E, Messiaen L, Wolkenstein P, et al. Revised diagnostic criteria for neurofibromatosis type 1 and Legius syndrome: an international consensus recommendation. Genet Med. 2021;23(8):1506-1513.'
    doi: 10.1038/s41436-021-01170-5
    pmid: '34012067'
    pmcid: PMC8354850
    url: https://doi.org/10.1038/s41436-021-01170-5
    source_license: CC BY 4.0
    legal_basis: B
    source_class: OPEN
    corroboration: null
  uncertainty: 基準の項目と閾値は出典本文の診断基準の表（Table 1）から読み取った（表から読み取り）。親がNF1の場合の基準、モザイク型の基準、Legius症候群の基準の詳細は本文にあるが本カードには含めていない。
