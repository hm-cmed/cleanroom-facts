- id: DT-006
  domain: DT
  subdomain: 毛細血管奇形<単純性血管腫>
  assertion:
    plain_statement_ja: 単純性血管腫（ポートワイン母斑）は先天性の毛細血管奇形で、有病率は0.3〜0.5%とされる。治療の標準はパルス色素レーザー（PDL）であり、このほかアレキサンドライトレーザー（755 nm）、Nd:YAGレーザー（1064 nm）、IPLなどが病変の性状に応じて用いられる。光線力学療法は血管内皮を標的とし効果が高いとされるが費用も高い。治療効果は血管の深さや個人差により限界がある。評価にはダーモスコピーや高周波超音波などの非侵襲的検査が用いられる。
    condition:
      region: 国際
      study: 総説（診断・治療技術のレビュー）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1101
    source: Li M, Song Y, Zhou J. The Diagnosis and Treatment Technology of Port-Wine Stain, and the Prospect of Future Treatment. Dermatol Ther (Heidelb). 2026;16(2):875-894.
    doi: 10.1007/s13555-026-01651-y
    pmid: '41557111'
    pmcid: PMC12936304
    url: https://doi.org/10.1007/s13555-026-01651-y
    source_license: CC BY-NC 4.0
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 有病率と治療の位置づけは抄録で確認した。Sturge-Weber症候群など関連症候群との関係や、レーザー治療の具体的な奏効率は抄録の範囲外で本カードに含めていない。本カードで触れる光線力学療法に用いる光感受性薬剤等の国内の承認・保険適用は未確認。
