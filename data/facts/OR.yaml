- id: OR-006
  domain: OR
  subdomain: 前癌病変
  assertion:
    plain_statement_ja: 白板症は、他のいかなる疾患としても特徴づけることのできない白色の斑または局面を指す臨床用語であり、除外診断によって定義される。生検では研究により15.6〜39.2%の病変に上皮異形成または癌が認められ、真の白板症には生検が推奨される。悪性化率は研究により3.6〜17.5%と報告に幅がある。
