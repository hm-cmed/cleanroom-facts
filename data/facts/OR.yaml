- id: OR-001
  domain: OR
  subdomain: 口腔粘膜疾患
  assertion:
    plain_statement_ja: 口角炎は口腔カンジダ症の一型に分類され、主にCandida albicansの過増殖によって生じる。その危険因子には、免疫抑制、義歯装用、薬剤の使用、喫煙、乳幼児期と高齢期、内分泌機能異常、唾液分泌低下が含まれる。
    condition:
      region: 国際
      対象: 総説（口腔カンジダ症と口角炎）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1431
    source: Sharon V, Fazel N. Oral candidiasis and angular cheilitis. Dermatol Ther. 2010;23(3):230-242.
    doi: 10.1111/j.1529-8019.2010.01320.x
    pmid: '20597942'
    pmcid: null
    url: https://doi.org/10.1111/j.1529-8019.2010.01320.x
    source_license: ライセンス未確認
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 出典は口角炎を中心に扱っており、舌炎そのものの病因や分類の詳細は出典の範囲外のため、舌炎については本カードでは扱っていない。
