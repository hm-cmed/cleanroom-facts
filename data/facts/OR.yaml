    doi: 10.1186/s13099-025-00762-9
    pmid: '41189016'
    pmcid: PMC12584420
    url: https://doi.org/10.1186/s13099-025-00762-9
    source_license: CC BY-NC-ND 4.0
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 一地域・一時期の集団発生の報告であり、流行するウイルスの型は地域や年によって異なる。
