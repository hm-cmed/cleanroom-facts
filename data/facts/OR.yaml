  subdomain: 口腔感染症
  assertion:
    plain_statement_ja: 口腔カンジダ症について、米国感染症学会（IDSA）のガイドライン（2016年版）は、軽症にはクロトリマゾールトローチなどの局所療法を、中等症から重症にはフルコナゾール100〜200mgの1日1回経口投与を7〜14日間行うことを推奨している。
