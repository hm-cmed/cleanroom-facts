    corroboration: 自由に使える資料による裏づけ（GOV_US、作り手の調査バッチ22 2026-11-11）：CDC「Clinical Guidance for Group A Streptococcal Pharyngitis」：ウイルス性を示唆する所見では通常検査不要、検査で確認された例に抗菌薬、ペニシリン・アモキシシリンが第一選択。Centor 基準そのもの、投与期間10日、リウマチ熱予防の期限は対象外
  uncertainty: ガイドライン本文では臨床スコアは総称として論じられており、Centor基準（1981年）はその参考文献の一つであるため、主張では「Centor基準など」とした。A群溶連菌の占める割合と検査で確認する方針は OR-012 が担当する。ペニシリンとアモキシシリンはいずれも国内で承認され保険適用されており、溶連菌感染症は適応に含まれる。
