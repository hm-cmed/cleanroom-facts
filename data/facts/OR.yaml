- id: OR-003
  domain: OR
  subdomain: 口腔感染症
  assertion:
    plain_statement_ja: 単純ヘルペスウイルスの初感染による歯肉口内炎は小児に多く、発熱と口腔内潰瘍、歯肉の腫脹・出血を呈する。台湾の単一施設における18歳以下の入院例185例では、発熱が99.5%（平均持続期間5.11日）、口腔潰瘍が84.3%、歯肉の腫脹・出血が67.6%にみられ、入院時点で診断されていたのは35%にとどまった。口腔前方の潰瘍と歯肉所見が早期診断の手がかりとなる。
    condition:
      region: 台湾
      対象: 18歳以下の入院例（単一施設、2012〜2016年）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1433
    source: Huang CW, Hsieh CH, Lin MR, Huang YC. Clinical features of gingivostomatitis due to primary infection of herpes simplex virus in children. BMC Infect Dis. 2020;20(1):782.
    doi: 10.1186/s12879-020-05509-2
    pmid: '33081701'
    pmcid: PMC7573873
    url: https://doi.org/10.1186/s12879-020-05509-2
    source_license: CC BY 4.0
    legal_basis: B
    source_class: OPEN
    corroboration: null
  uncertainty: 単一施設の入院例を対象とした後方視的検討であり、外来の軽症例では頻度や経過が異なる可能性がある。
  curriculum:
