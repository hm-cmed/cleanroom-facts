- id: OR-008
  domain: OR
  subdomain: 口腔癌
  assertion:
    plain_statement_ja: 口腔癌の早期病変は自覚症状に乏しく見逃されやすい。疑わしい病変の確定診断には生検が最も確実な方法であり、ブラシ細胞診などの非侵襲的検査は生検の代替にはならない。原発巣の進展範囲や頸部リンパ節の評価には造影CTやMRIが用いられる。口腔癌では初診時に約30%の症例で、触知できるものと潜在性のものを合わせて頸部リンパ節転移が認められる。
