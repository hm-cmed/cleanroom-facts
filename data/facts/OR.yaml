  assertion:
    plain_statement_ja: 唾石症は唾液腺疾患の最大で50%を占める閉塞性疾患であり、唾石の80%以上は顎下腺に生じる。顎下腺はカルシウム塩・リン酸塩に富む粘稠な唾液を分泌し、導管が長く重力に逆らって流れるため結石が形成されやすい。脱水、栄養不良、薬剤、慢性疾患などによる唾液のうっ滞と炎症が関連し、治療は水分補給、腺マッサージ、温罨法、唾液分泌の促進などの保存的対応が基本で、腺を温存する唾液腺内視鏡による治療も行われる。
