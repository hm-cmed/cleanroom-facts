  subdomain: 頸部疾患
  assertion:
    plain_statement_ja: 頭頸部のリンパ管奇形（リンパ管腫）の治療の中心は外科的切除であり、病変の病期と画像による形態評価によって治療が精緻化されてきた。大嚢胞型（マクロシスティック型）病変には病変内硬化療法が有効である一方、舌骨上部の小嚢胞型（ミクロシスティック型）病変は、舌骨下部や後頸部の大嚢胞型病変より治療が難しい。両側の舌骨上部病変では合併症を避けるため段階的な治療が必要であり、治療計画は機能障害の有無とその可能性によって決まる。上気道・消化管への直接の進展は気道閉塞などの重大な機能障害を来しうる。
