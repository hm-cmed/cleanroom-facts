- id: OR-030
  domain: OR
  subdomain: 頸部疾患
  assertion:
    plain_statement_ja: 早期口腔扁平上皮癌（T1・T2で臨床的に頸部リンパ節転移がない例）において、原発巣手術時に待機的頸部郭清を行う方法と、経過観察して転移が出現してから治療的頸部郭清を行う方法を比較したランダム化比較試験では、解析対象500例（追跡期間中央値39か月）で、3年全生存率は待機的郭清群80.0%に対し治療的郭清群67.5%（死亡のハザード比0.64）、3年無病生存率も69.5%対45.9%と、待機的頸部郭清が優れていた。頸部の潜在性転移への早期対応が予後を改善することを示した試験である。
