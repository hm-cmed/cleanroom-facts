- id: OR-002
  domain: OR
  subdomain: 口腔粘膜疾患
  assertion:
    plain_statement_ja: 再発性アフタ性口内炎は口腔粘膜の潰瘍性疾患の中で最も頻度が高い。病因は解明されておらず、局所・全身・免疫・遺伝・アレルギー・栄養・微生物などの因子の関与が考えられている。臨床的にはminor型（85%を超え、直径1cm未満で瘢痕を残さず治癒する）、major型（直径1cmを超え、数週間から数か月持続して瘢痕を残す）、ヘルペス状型（多発する小潰瘍の集簇で、ヘルペスウイルス感染とは無関係）に分類される。治療は潰瘍の重症度、頻度、大きさ、個数に応じて選択され、疼痛と潰瘍の軽減、治癒の促進、再発頻度の低下が目標となる。
    condition:
      region: 国際
      対象: 総説
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1432
    source: Akintoye SO, Greenberg MS. Recurrent aphthous stomatitis. Dent Clin North Am. 2014;58(2):281-297.
    doi: 10.1016/j.cden.2013.12.002
    pmid: '24655523'
    pmcid: PMC3964366
    url: https://doi.org/10.1016/j.cden.2013.12.002
    source_license: ライセンス未確認
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 数値（85%超など）は出典本文で確認した。
