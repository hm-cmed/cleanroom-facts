- id: OR-001
  domain: OR
  subdomain: 口腔粘膜疾患
  assertion:
    plain_statement_ja: 口角炎は口腔カンジダ症の一型に分類され、主にCandida albicansの過増殖によって生じる。その危険因子には、免疫抑制、義歯装用、薬剤の使用、喫煙、乳幼児期と高齢期、内分泌機能異常、唾液分泌低下が含まれる。
    condition:
      region: 国際
      対象: 総説（口腔カンジダ症と口角炎）
    differential: null
    common_misconception: null
  provenance:
