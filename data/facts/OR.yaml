- id: OR-027
  domain: OR
  subdomain: 唾液腺疾患
  assertion:
    plain_statement_ja: 唾液腺悪性腫瘍は頭頸部癌の数%を占めるまれな腫瘍である。ASCOガイドラインでは、術前評価として頸部超音波、造影CT、MRIによる画像評価と、穿刺吸引生検またはコア針生検による組織診断を行うこと、治療の中心は外科的切除であり、顔面神経は腫瘍との間に剥離面が作れる場合に温存すること、術後放射線治療は腺様嚢胞癌の全例と、高悪性度、切除断端陽性、神経周囲浸潤、リンパ節転移、脈管浸潤、T3・T4腫瘍のある例に提示すること、臨床的に頸部転移のないT3・T4腫瘍と高悪性度癌では待機的頸部治療（頸部郭清または頸部照射）を行うことが推奨されている。
