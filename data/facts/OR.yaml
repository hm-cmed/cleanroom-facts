- id: OR-007
  domain: OR
  subdomain: 口腔癌
  assertion:
    plain_statement_ja: 口腔癌の最大の危険因子は喫煙と飲酒である。喫煙者の口腔癌のリスクは非喫煙者の5〜9倍（1日80本以上では最大17倍）に達し、口腔癌患者の約80%が喫煙者である。飲酒は単独でもリスクを3〜9倍に高め、大量喫煙と大量飲酒の併用では相乗作用によりリスクが100倍を超える。一部の口腔癌ではヒトパピローマウイルス16型が検出される（最大22%）。舌は口腔内癌の好発部位で、口腔内癌の約40%を占める。
    condition:
      region: 米国
      対象: 総説（2002年）
    differential: null
    common_misconception: null
  provenance:
