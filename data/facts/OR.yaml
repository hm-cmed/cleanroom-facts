- id: OR-004
  domain: OR
  subdomain: 口腔感染症
  assertion:
    plain_statement_ja: ヘルパンギーナは主にコクサッキーウイルスA群などのエンテロウイルスによる小児の急性熱性疾患で、口腔内に水疱や潰瘍を生じる。2024年に中国浙江省玉環市で発生した小児133例の集団発生では、年齢の中央値は3歳、エンテロウイルス陽性が88.7%（うちコクサッキーウイルスA2が78.0%と最多）で、発熱が95.5%、口腔水疱が98.5%にみられた。
    condition:
      region: 中国
      対象: 小児（2024年5〜6月の集団発生）
    differential: null
    common_misconception: null
  provenance:
