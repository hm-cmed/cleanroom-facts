- id: OR-031
  domain: OR
  subdomain: 頸部疾患
  assertion:
    plain_statement_ja: 先天性頸部腫瘤は、嚢胞性、充実性、血管性の発生異常や腫瘍からなり、小児で最も多いのは甲状舌管嚢胞、鰓原性嚢胞・瘻などの鰓裂奇形、類皮嚢胞（デルモイド）である。病歴と診察所見によって鑑別を絞り込むことができ、画像検査は病変の性状と原因の特定に重要な役割を果たす。鑑別には血管性病変のほか、奇形腫などの充実性腫瘍も含める必要がある。
