- id: GN-004
  domain: GN
  subdomain: 急性糸球体腎炎
  assertion:
    plain_statement_ja: 感染に関連する急性糸球体腎炎では、なお続いている感染への治療と、浮腫・高血圧・体液過剰に対する支持療法が管理の中心となり、典型的な経過をたどる溶連菌感染後糸球体腎炎に対して免疫抑制療法は用いない。国際ガイドラインは感染関連糸球体腎炎を独立した領域として扱い、診断、予後、治療、特殊な状況という枠組みで推奨を示している。
    condition:
