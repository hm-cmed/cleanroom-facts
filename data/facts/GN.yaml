    corroboration: null
  uncertainty: 本カードはガイドラインの一般原則であり、個別の薬剤名と用量は記載していない。支持療法で用いる利尿薬や降圧薬は国内承認薬であるが、個別製剤の適応確認はしていない。半月体形成を伴うなど非典型的な経過では扱いが異なる。
