  uncertainty: 各クラスの組織学的定義そのものは ISN/RPS 分類（2018年改訂で Class IV の S/G 細分が廃止され、活動性・慢性化指数が全クラスに適用されることになった）に従うものであり、本ガイドラインで定義の詳細までは確認していない。定義を扱うカードが要る場合は ISN/RPS 改訂報告を別途出典にすること。
