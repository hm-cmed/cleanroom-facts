  assertion:
    plain_statement_ja: 原発性巣状分節性糸球体硬化症の初期治療は高用量のグルココルチコイドであり、蛋白尿の寛解を目指して十分な期間継続し、反応をみて漸減する。ステロイドに抵抗性または不耐の例では、カルシニューリン阻害薬などの免疫抑制療法が検討される。これに対して二次性のものでは免疫抑制療法は行わず、原因への対処と血圧管理、レニン・アンジオテンシン系阻害による腎保護が中心となる。
