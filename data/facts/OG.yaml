- id: OG-004
  domain: OG
  subdomain: 肝性脳症、Wilson病、甲状腺機能障害、副腎皮質機能障害、全身性エリテマトーデス<SLE>
  assertion:
    plain_statement_ja: 全身性エリテマトーデス（SLE）では精神神経症状（精神神経SLE、NPSLE）が起こりやすく、累積頻度が5%を超えるものは脳血管障害とけいれんで、重度の認知機能障害、大うつ病、急性錯乱状態、精神病は1〜5%にみられる（EULAR推奨2010）。精神神経症状が疑われる場合の診断の進め方は、SLEのない患者が同じ症状を呈した場合と基本的に同じで、中枢神経感染症などSLE以外の原因を除外することが要点になる。
    condition:
      region: 国際
      対象: 全身性エリテマトーデス患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3611
    source: 'Bertsias GK, Ioannidis JP, Aringer M, et al. EULAR recommendations for the management of systemic lupus erythematosus with neuropsychiatric manifestations: report of a task force of the EULAR standing committee for clinical affairs. Ann Rheum Dis. 2010;69(12):2074-2082'
    doi: 10.1136/ard.2010.130476
    pmid: '20724309'
    pmcid: null
    url: https://doi.org/10.1136/ard.2010.130476
    source_license: CC 表示なし（購読誌）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 本カードは精神神経症状の側面のみを扱い、SLEそのものは第42〜45回（Ⅺ）が正。頻度は出典の抄録に記載された累積頻度の区分に基づく。免疫抑制療法など治療の個別の推奨は本文の確認範囲を超えるため扱っていない。
  curriculum:
    kokushi: 医学各論 Ⅱ-1-C-①（肝性脳症、Wilson病、甲状腺機能障害、副腎皮質機能障害、全身性エリテマトーデス<SLE>、a）
    core_curriculum: 'PS-02-17-05 (id: JkxnuT8)；PS-02-17-02 (id: JkxnuTw)；TBL-01-00-553 (id: JlvnmTY)；TBL-02-16-005 (id: JlAKpzE)'
