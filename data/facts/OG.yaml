- id: OG-006
  domain: OG
  subdomain: せん妄
  assertion:
    plain_statement_ja: 4AT（4 A's Test）は、せん妄を日常診療で迅速にスクリーニングするために開発された評価ツールである。70歳以上の入院患者を対象とした検証研究では、DSM-IV-TR基準による参照診断に対して感度89.7%、特異度84.1%を示し、ROC曲線下面積は0.93だった。認知症のある患者でも診断性能は大きくは低下しなかった（ROC曲線下面積0.89）。
    condition:
      region: 国際
      対象: 入院高齢者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3613
    source: 'Bellelli G, Morandi A, Davis DH, et al. Validation of the 4AT, a new instrument for rapid delirium screening: a study in 234 hospitalised older people. Age Ageing. 2014;43(4):496-502'
    doi: 10.1093/ageing/afu021
    pmid: '24590568'
    pmcid: PMC4066613
    url: https://doi.org/10.1093/ageing/afu021
    source_license: CC BY（Europe PMC のライセンス情報で確認）
    legal_basis: B
    source_class: OPEN
    corroboration: null
  uncertainty: 数値は出典の抄録で確認した。4ATの日本語版の検証状況は本カードでは未確認。
  curriculum:
    kokushi: 医学各論 Ⅱ-1-D（せん妄、a）
    core_curriculum: 'PS-02-17-05 (id: JkxnuT8)；PS-02-17-02 (id: JkxnuTw)；TBL-02-16-001 (id: JlAKpy8)；TBL-02-16-003 (id: JlAKpy4)'
