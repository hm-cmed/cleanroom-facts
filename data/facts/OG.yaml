- id: OG-005
  domain: OG
  subdomain: せん妄
  assertion:
    plain_statement_ja: せん妄は注意と認知の急性の障害と定義され、高齢患者に多く、重篤で致死的になりうる一方で認識されにくい。診断では、短時間の評価ツール（3分間診断評価、4AT、家族による評価FAM-CAMなど）と重症度尺度（CAM-S）が整備されてきた。治療と予防の基本は、不動、機能低下、視覚・聴覚障害、脱水、睡眠不足といったリスク因子への非薬物的アプローチであり、抗精神病薬などの鎮静薬は、患者やスタッフの安全を脅かす重度の興奮などに限って使うことが現在の推奨である。
    condition:
      region: 国際
      対象: 高齢入院患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3612
    source: 'Oh ES, Fong TG, Hshieh TT, Inouye SK. Delirium in Older Persons: Advances in Diagnosis and Treatment. JAMA. 2017;318(12):1161-1174'
    doi: 10.1001/jama.2017.12067
    pmid: '28973626'
    pmcid: PMC5717753
    url: https://doi.org/10.1001/jama.2017.12067
    source_license: CC 表示なし（購読誌）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 国内の基盤は日本総合病院精神医学会『せん妄の臨床指針 第2版増補改訂版』（2015）だが、本カードは国際的な総説に基づく。抗精神病薬について、国内でせん妄そのものを効能・効果とする抗精神病薬は確認できず、せん妄への投与は適応外使用にあたる。意識障害の評価そのものは第30回 NX が正。
  curriculum:
    kokushi: 医学各論 Ⅱ-1-D（せん妄、a）
    core_curriculum: 'PS-02-17-05 (id: JkxnuT8)；PS-02-17-02 (id: JkxnuTw)；TBL-02-16-001 (id: JlAKpy8)；TBL-02-16-003 (id: JlAKpy4)'
