- id: OG-003
  domain: OG
  subdomain: 肝性脳症、Wilson病、甲状腺機能障害、副腎皮質機能障害、全身性エリテマトーデス<SLE>
  assertion:
    plain_statement_ja: 肝性脳症は肝硬変に伴って起こる精神神経症状の総称で、目立ちにくい認知機能の変化から、見当識障害や意識障害を伴う状態まで幅があり、うつ病や認知症、せん妄などとの鑑別が問題になる。日本消化器病学会と日本肝臓学会の『肝硬変診療ガイドライン2020』は、肝性脳症を肝硬変の合併症の一つとして診断と治療の対象に位置づけている。
    condition:
      region: 日本
      対象: 肝硬変患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-018
    source: Yoshiji H, et al. Evidence-based clinical practice guidelines for Liver Cirrhosis 2020. J Gastroenterol 2021;56:593-619
    doi: 10.1007/s00535-021-01788-x
    pmid: '34231046'
    pmcid: PMC8280040
    url: https://doi.org/10.1007/s00535-021-01788-x
    source_license: CC BY（Europe PMC のライセンス情報で確認）
    legal_basis: B
    source_class: OPEN
    corroboration: null
  uncertainty: 本カードは精神症状の側面のみを扱い、肝硬変・肝性脳症そのものは消化器（LV）が正。マスター登録（SRC-018）では DOI・PMID が未登録で class は UNKNOWN だが、Europe PMC で DOI・PMID と CC BY を確認できたため、本カードには確認済みの値を書き、マスターへの補完・更新を申し送りに提案した。ガイドラインの肝性脳症の章の推奨文そのものは逐語確認していないため、主張は位置づけと病像の範囲に限った。
  curriculum:
    kokushi: 医学各論 Ⅱ-1-C-①（肝性脳症、Wilson病、甲状腺機能障害、副腎皮質機能障害、全身性エリテマトーデス<SLE>、a）
