- id: OG-001
  domain: OG
  subdomain: Parkinson病、進行性核上性麻痺、Wernicke脳症、多発性硬化症
  assertion:
    plain_statement_ja: Wernicke脳症はチアミン欠乏による急性の脳症で、予防と治療が可能でありながら生前に診断されないことが少なくない。アルコール依存症の患者では、食事欠乏、眼症状、小脳失調、精神状態の変化または軽度の記憶障害の4徴のうち2つ以上があれば臨床診断の根拠となり（EFNSガイドライン、推奨レベルB）、精神状態の変化そのものが診断の一要素になる。疑った場合は、炭水化物の投与前にチアミンを投与する（同ガイドラインでは静注200 mgを1日3回、推奨レベルC）。
    condition:
      region: 国際
      対象: チアミン欠乏のリスクがある患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1684
    source: Galvin R, Bråthen G, Ivashynka A, et al. EFNS guidelines for diagnosis, therapy and prevention of Wernicke encephalopathy. Eur J Neurol. 2010;17(12):1408-1418
    doi: 10.1111/j.1468-1331.2010.03153.x
    pmid: '20642790'
    pmcid: null
    url: https://doi.org/10.1111/j.1468-1331.2010.03153.x
    source_license: 表示なし
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 本カードは精神症状の側面のみを扱い、Wernicke脳症そのものは第29回 ND（Ⅸ）が正。出典はマスター登録（SRC-1684）の書誌・class（UNKNOWN）をそのまま使った。チアミン製剤は国内で承認され薬価収載されている（ビタミンB1製剤）。
  curriculum:
    kokushi: 医学各論 Ⅱ-1-B-①（Parkinson病、進行性核上性麻痺、Wernicke脳症、多発性硬化症、a）
