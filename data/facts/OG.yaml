- id: OG-007
  domain: OG
  subdomain: せん妄
  assertion:
    plain_statement_ja: 入院高齢者への多要素の非薬物的介入（Hospital Elder Life Programの原型）は、認知機能障害、睡眠不足、不動、視覚障害、聴覚障害、脱水の6つのリスク因子への標準化されたプロトコルで構成される。70歳以上の入院患者852人を対象とした研究で、せん妄の発症は介入群9.9%に対して通常ケア群15.0%と少なく（マッチドオッズ比0.60、95%信頼区間0.39〜0.92）、せん妄の総日数とエピソード数も有意に少なかった。
    condition:
      region: 米国
      対象: 70歳以上の入院患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3614
    source: Inouye SK, Bogardus ST Jr, Charpentier PA, et al. A multicomponent intervention to prevent delirium in hospitalized older patients. N Engl J Med. 1999;340(9):669-676
    doi: 10.1056/NEJM199903043400901
    pmid: '10053175'
    pmcid: null
    url: https://doi.org/10.1056/NEJM199903043400901
    source_license: CC 表示なし（購読誌）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 米国の単一施設の研究であり、日本の病棟への適用は体制に依存する。数値は出典の抄録で確認した。
  curriculum:
    kokushi: 医学各論 Ⅱ-1-D（せん妄、a）
    core_curriculum: 'PS-02-17-05 (id: JkxnuT8)；PS-02-17-02 (id: JkxnuTw)；TBL-02-16-001 (id: JlAKpy8)；TBL-02-16-003 (id: JlAKpy4)'
