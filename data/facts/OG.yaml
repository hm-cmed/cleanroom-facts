- id: OG-002
  domain: OG
  subdomain: Parkinson病、進行性核上性麻痺、Wernicke脳症、多発性硬化症
  assertion:
    plain_statement_ja: Parkinson病では運動症状に加えて、うつ・不安などの気分症状、幻覚・妄想を中心とする精神病症状、認知機能障害といった精神症状が高率に伴い、経過とともに患者の負担を大きくする。精神症状の評価では、ドパミン作動薬など治療薬による薬剤性の精神病症状、せん妄、認知症との鑑別が要点になり、『パーキンソン病診療ガイドライン2018』でも非運動症状の一つとして扱われる。
    condition:
      region: 日本
      対象: Parkinson病患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1666
    source: 日本神経学会（監修）, 「パーキンソン病診療ガイドライン」作成委員会（編）. パーキンソン病診療ガイドライン2018. 医学書院; 2018
    doi: null
    pmid: null
    pmcid: null
    url: null
    source_license: 表示なし（書籍）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 本カードは精神症状の側面のみを扱い、Parkinson病そのものと運動症状の治療は第29回 ND の既存カードが正。出典はマスター登録（SRC-1666）の書誌・class をそのまま使った。ドパミン作動薬を含む抗Parkinson病薬は国内で承認され薬価収載されているが、本カードでは個別薬剤の効能・用量は扱わない。進行性核上性麻痺と多発性硬化症の精神症状の側面は本パートでは個別に作らず、申し送りに残した。
  curriculum:
    kokushi: 医学各論 Ⅱ-1-B-①（Parkinson病、進行性核上性麻痺、Wernicke脳症、多発性硬化症、a）
