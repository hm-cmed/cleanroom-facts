- id: HF-031
  domain: HF
  subdomain: 右心不全
  assertion:
    plain_statement_ja: 右心不全の治療は原因となる病態生理によって異なり、体うっ血がある場合には特に利尿薬を用い、うっ血がない場合には慎重に輸液を行う。末梢の低灌流や持続する低血圧がある場合には強心薬を用い、それでも改善しなければ腎代替療法や右室補助人工心臓（RVAD）を含む機械的サポートを考慮する。
    condition:
      region: 日本
      対象: 右心不全の患者
    differential: null
    common_misconception: null
  provenance:
