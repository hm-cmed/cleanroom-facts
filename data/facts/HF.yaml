  domain: HF
  subdomain: 急性心不全
  assertion:
    plain_statement_ja: 急性非代償性心不全では、ドブタミンは肺うっ血に低心拍出・組織低灌流を伴う場合に（クラスIIa、レベルC-LD）、ノルアドレナリンは十分な輸液後もショックや低血圧が続く場合に（IIa、B-R）考慮できる。低心拍出・低灌流・ショックがない患者に強心薬をルーチンで使ってはならない（III（有害）、C-EO）。
