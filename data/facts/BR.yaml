- id: BR-010
  domain: BR
  subdomain: 乳腺炎
  assertion:
    plain_statement_ja: 乳腺炎は、乳管の狭窄から炎症性乳腺炎、細菌性乳腺炎、さらには蜂窩織炎や膿瘍へと進みうる連続した病態のスペクトラムとして捉えられる。主に授乳期に生じ、乳房の発赤、疼痛、腫脹や発熱を呈する。授乳に関連する乳房の問題への対応指針として、Academy of Breastfeeding Medicineの臨床プロトコル第36番（2022年改訂）がこのスペクトラムの考え方を示している。
    condition:
      region: 国際
      population: 授乳期の患者を中心とする乳腺炎患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1020
    source: 'Mitchell KB, Johnson HM, Rodríguez JM, et al. Academy of Breastfeeding Medicine Clinical Protocol #36: The Mastitis Spectrum, Revised 2022. Breastfeed Med. 2022;17(5):360-376.'
    doi: 10.1089/bfm.2022.29207.kbm
    pmid: '35576513'
    pmcid: null
    url: https://doi.org/10.1089/bfm.2022.29207.kbm
    source_license: ライセンス表示を確認できず
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: スペクトラムとしての捉え方は出典の題名と抄録で確認した。各段階の具体的な治療（抗菌薬の選択や排膿の適応）は本文を確認していないため書いていない。非授乳期の乳腺炎（肉芽腫性乳腺炎など）はこの出典の主対象ではない。出典のライセンス表示は確認できなかった。
