    url: https://doi.org/10.1007/s12282-023-01521-x
    source_license: CC BY 4.0
    legal_basis: B
    source_class: OPEN
    corroboration: null
  uncertainty: 主張は出典（検診・診断ガイドライン2022年版の英語ダイジェスト）の抄録に基づく。ホルモン受容体やHER2を含む病理診断の詳細は、同じガイドラインの病理診断編（別文献）が担う範囲であり、本カードでは画像診断を中心に書いた。各モダリティの診断能の数値は確認していないため書いていない。
