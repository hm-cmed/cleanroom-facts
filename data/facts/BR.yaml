- id: BR-009
  domain: BR
  subdomain: 遺伝性乳癌卵巣癌症候群（乳腺の側面）
  assertion:
    plain_statement_ja: BRCA1/2の生殖細胞系列病的バリアントを持つ人では、乳癌の生涯リスクは一般集団（約11%）と比べてはるかに高く、48〜76%とされる。BRCA1の病的バリアントではトリプルネガティブ乳癌が、BRCA2ではルミナルタイプが多い。乳腺のリスク管理には、一般集団より若い年齢から毎年行うMRIとマンモグラフィによるサーベイランスと、リスク低減乳房切除術があり、リスク低減乳房切除術は乳癌のリスクを90%以上下げるとされる。日本では2020年からHBOC関連診療の一部が保険適用となった。
    condition:
      region: 日本
      population: BRCA1/2病的バリアント保持者（HBOC）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1019
    source: 'Seki T, Kobayashi Y, Masuda K, et al. Exploring Breast Cancer Risk Management in HBOC Patients: Image Surveillance Versus Risk-reducing Surgery. Keio J Med. 2025;74(3):130-137.'
    doi: 10.2302/kjm.2024-0021-RE
    pmid: '40175132'
    pmcid: null
    url: https://doi.org/10.2302/kjm.2024-0021-RE
    source_license: ライセンス表示を確認できず
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 数値（生涯リスク48〜76%、一般集団約11%、リスク低減乳房切除による90%以上のリスク低下）は出典の抄録から確認した。本カードは境界に従い乳腺の側面（リスク管理と検診）に限る。卵巣癌のリスクとその管理は第18回 GY-042 が正であり、ここでは扱わない。保険適用の対象範囲（既発症の保持者など条件）は出典の抄録では詳述されていないため、主張では一部が保険適用となったことに留めた。出典のライセンス表示は確認できなかった。
