- id: BR-014
  domain: BR
  subdomain: 男性乳癌と女性化乳房
  assertion:
    plain_statement_ja: 男性の乳房腫大の多くは良性の女性化乳房であり、癌が見つかるのは男性の乳房腫大の約1%とされる。女性化乳房はエストロゲンとアンドロゲンのバランスの乱れによって生じ、思春期や高齢期の生理的な変化のほか、薬剤や内分泌疾患が原因となる。硬く片側に偏った腫瘤など悪性を疑う所見がある場合は、女性化乳房と決めつけず、画像検査と組織診断で男性乳癌との鑑別を行う必要がある。
    condition:
      region: 国際
      population: 乳房腫大や乳房腫瘤を呈する男性
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1024
    source: Niewoehner CB, Schorer AE. Gynaecomastia and breast cancer in men. BMJ. 2008;336(7646):709-713.
    doi: 10.1136/bmj.39511.493391.BE
    pmid: '18369226'
    pmcid: null
    url: https://doi.org/10.1136/bmj.39511.493391.BE
    source_license: ライセンス表示を確認できず
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 約1%という数値は出典の本文で確認した。出典は2008年の臨床レビューであり、男性乳癌の薬物療法など治療の最新状況は扱っていない。薬剤性の女性化乳房の個別の薬剤名は確認範囲を超えるため主張に挙げていない。出典のライセンス表示は確認できなかった。
