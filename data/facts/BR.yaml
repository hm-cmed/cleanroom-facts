- id: BR-004
  domain: BR
  subdomain: 乳癌のサブタイプと病期
  assertion:
    plain_statement_ja: 乳癌診療ガイドラインの一般的事項では、病期はDCIS（TisN0M0、stage 0）、早期乳癌（stage I〜IIIA）、局所進行乳癌（stage IIIB・IIIC）などに分けられる。早期乳癌の治療方針は、ホルモン受容体やHER2といった予測因子と、臨床病期や組織学的グレードなどの予後因子を総合的に評価して決める。ホルモン受容体とHER2の状態の組み合わせが、内分泌療法や抗HER2療法など薬物療法を選択する基盤になる。
    condition:
      region: 日本
      population: 乳癌患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1014
    source: 'Yamamoto Y, Yamauchi C, Toyama T, et al. The Japanese Breast Cancer Society Clinical Practice Guidelines for Breast Cancer, 2022 Edition: changes from the 2018 edition and general statements on breast cancer treatment. Breast Cancer. 2024;31(3):340-346.'
    doi: 10.1007/s12282-024-01566-6
    pmid: '38570435'
    pmcid: PMC11045566
    url: https://doi.org/10.1007/s12282-024-01566-6
    source_license: CC BY 4.0
    legal_basis: B
    source_class: OPEN
    corroboration: null
  uncertainty: 病期の区分と治療方針の決め方は、出典の一般的事項の本文で確認した。個々の分子サブタイプ（ルミナルA様・B様など）の定義やKi67のカットオフはこの出典の一般的事項には含まれないため、主張には書いていない。 本カードで触れる薬物療法（内分泌療法・抗HER2療法）の各薬剤の国内の承認・保険適用は未確認。
  curriculum:
    core_curriculum: 'PS-02-13-05 (id: JkxnuSs)；TBL-01-00-665 (id: JlvnmeQ)'
