    doi: 10.1186/s12943-023-01805-y
    pmid: '37415164'
    pmcid: PMC10324146
    url: https://doi.org/10.1186/s12943-023-01805-y
    source_license: CC BY 4.0
    legal_basis: B
    source_class: OPEN
    corroboration: null
  uncertainty: 主張は出典（総説）の抄録に基づき、標的の種類は抄録の記載どおりに書いた。薬剤名の出る領域のカードとして国内の承認・保険適用の確認状況を記す：CDK4/6阻害薬、PARP阻害薬、抗HER2薬、免疫チェックポイント阻害薬などの個別薬剤について、国内の承認・保険適用の最新状況は本カード作成時に一次資料で確認していないため、主張では個別の薬剤名と適応を挙げていない。出典の承認に関する記述は米国（FDA）についてのものである。
