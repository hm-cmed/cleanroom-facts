- id: BR-005
  domain: BR
  subdomain: 乳癌の手術療法
  assertion:
    plain_statement_ja: 乳癌の外科治療は、乳房の手術、腋窩の手術、乳房再建、再発・転移乳癌に対する手術の領域に分けられる。日本乳癌学会の診療ガイドライン2022年版では、術前化学療法後の腋窩の取り扱いに関する推奨が大きく改訂された。各領域の推奨は、利益と害のバランスを評価したシステマティックレビューに基づいて決められている。
    condition:
      region: 日本
      population: 手術適応のある乳癌患者
    differential: null
    common_misconception: null
  provenance:
