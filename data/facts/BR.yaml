- id: BR-001
  domain: BR
  subdomain: 乳癌の疫学（日本）
  assertion:
    plain_statement_ja: 日本乳癌学会の登録（全国臨床データベースに基づく乳癌登録）では、2019年に98,300例の乳癌が登録された。診断時年齢の中央値は61歳（四分位範囲49〜72歳）で、閉経前が30.6%を占めた。遠隔転移のない症例ではstage 0が15.0%、stage Iが44.8%であり、早期の段階で診断される症例が多い。
    condition:
      region: 日本
      population: 乳癌登録症例（2019年登録分）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1011
    source: Miyashita M, Kumamaru H, Niikura N, et al. Annual report of the Japanese Breast Cancer Registry for 2019. Breast Cancer. 2024;31(1):16-23.
    doi: 10.1007/s12282-023-01526-6
    pmid: '38044372'
    pmcid: null
    url: https://doi.org/10.1007/s12282-023-01526-6
    source_license: ライセンス表示を確認できず
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 数値は出典の抄録から確認した（登録症例数・年齢中央値・閉経前割合・病期分布）。登録ベースの集計であり、人口ベースの罹患率・死亡率ではない。出典のライセンス表示は確認できなかった。
