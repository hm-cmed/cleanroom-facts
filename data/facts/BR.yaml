- id: BR-011
  domain: BR
  subdomain: 乳管内乳頭腫
  assertion:
    plain_statement_ja: 乳管内乳頭腫は、乳管内に生じる乳頭状の良性腫瘍で、乳頭からの分泌、とくに血性分泌をきっかけに見つかることが多い。乳頭近くの大きな乳管に単発する中枢型と、末梢に多発する末梢型がある。診断では画像検査と病理検査で異型病変や癌の合併を評価し、その結果によって切除するか経過をみるかを判断する。
