    doi: 10.1007/s12282-023-01510-0
    pmid: '37843765'
    pmcid: null
    url: https://doi.org/10.1007/s12282-023-01510-0
    source_license: ライセンス表示を確認できず
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 主張は出典（外科治療ガイドライン2022年版の英語ダイジェスト）の抄録に基づく。個別の臨床疑問に対する推奨の強さや、乳房温存手術と全切除術の適応条件などの本文の詳細は確認していないため書いていない。出典のライセンス表示は確認できなかった。
