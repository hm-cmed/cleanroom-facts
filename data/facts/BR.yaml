- id: BR-007
  domain: BR
  subdomain: 乳癌の分子標的療法と免疫療法
  assertion:
    plain_statement_ja: 乳癌の分子標的療法では、AKT、サイクリン依存性キナーゼ、PARP、各種の増殖因子経路などが治療標的となり、サブタイプに応じて単独療法または他の治療との併用で使われる薬剤が開発されている。免疫療法を含む新しい治療の開発も進んでいるが、標的薬が十分な効果を示さないサブタイプも残っており、臨床試験が続けられている。
    condition:
      region: 国際
      population: 乳癌患者（サブタイプ別）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1017
