- id: BR-013
  domain: BR
  subdomain: 乳腺症
  assertion:
    plain_statement_ja: 乳腺症（線維嚢胞性変化）は、乳房の痛みやしこり感、嚢胞の形成などを呈する良性の変化の総称で、性ホルモンの変動と関連して生じる。臨床で重要なのは、症状や画像所見が乳癌と紛らわしいことがあるため、画像検査によって悪性でないことを確認することであり、典型的な良性所見では過剰な介入は不要とされる。
    condition:
