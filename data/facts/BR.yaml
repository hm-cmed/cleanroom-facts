- id: BR-002
  domain: BR
  subdomain: 乳癌検診（日本）
  assertion:
    plain_statement_ja: 日本の乳癌検診ガイドラインでは、対策型検診と任意型検診のいずれでも、40〜74歳の女性に対するマンモグラフィ（視触診なし）が推奨され、40〜64歳では視触診を併用するマンモグラフィも推奨される。根拠となった無作為化比較試験の統合では、マンモグラフィ検診による乳癌死亡の相対リスクは40〜74歳で0.75（95%信頼区間0.67〜0.83）だった。視触診のみの検診と超音波検診は対策型検診には推奨されず、放射線被曝、偽陽性、過剰診断が検診の害として挙げられる。
    condition:
      region: 日本
      population: 検診対象の女性（40歳以上）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1012
    source: Hamashima C, et al; Japanese Research Group for the Development of the Breast Cancer Screening Guidelines. The Japanese Guidelines for Breast Cancer Screening. Jpn J Clin Oncol. 2016;46(5):482-492.
    doi: 10.1093/jjco/hyw008
    pmid: '27207993'
    pmcid: null
    url: https://doi.org/10.1093/jjco/hyw008
    source_license: ライセンス表示を確認できず
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 推奨年齢と相対リスクは出典の抄録から確認した。検診間隔（2年に1回）や自治体検診の運用は厚生労働省の指針によるもので、この出典の抄録には含まれないため主張には書いていない。検診の推奨年齢・方法は国や団体により異なるため、本カードは日本のガイドラインに限る。出典のライセンス表示は確認できなかった。
  curriculum:
    core_curriculum: 'PS-02-13-05 (id: JkxnuSs)；TBL-02-12-008 (id: JlAKpro)'
