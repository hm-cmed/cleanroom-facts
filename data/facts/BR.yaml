    source: Kubota K, Nakashima K, Nakashima K, et al. The Japanese Breast Cancer Society Clinical Practice Guidelines for Breast Cancer Screening and Diagnosis, 2022 Edition. Breast Cancer. 2024;31(2):157-164.
