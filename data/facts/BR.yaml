- id: BR-003
  domain: BR
  subdomain: 乳癌の診断（画像と病理）
  assertion:
    plain_statement_ja: 乳癌の検診と診断に関するガイドラインでは、マンモグラフィ、超音波、MRI、PET/CTなどの画像モダリティを、検診、サーベイランス、術前・術後の診断といった場面に応じて統合的に使い分けることが求められる。トモシンセシス、エラストグラフィ、造影超音波などの新しい技術についても、患者ごとに適応を考えて用いる。
    condition:
      region: 日本
      population: 乳癌が疑われる、または乳癌と診断された患者
    differential: null
    common_misconception: null
  provenance:
