- id: BR-015
  domain: BR
  subdomain: 妊娠・授乳期の乳腺疾患
  assertion:
    plain_statement_ja: 妊娠・授乳期には、ホルモンの影響による乳腺の生理的変化のために、乳腺疾患の診断が難しくなる。この時期にも乳腺炎や乳瘤、授乳期腺腫などの良性疾患と、妊娠や授乳に関連して見つかる乳癌が生じうる。持続する腫瘤や血性乳頭分泌がある場合は、妊娠・授乳中であることを理由に画像検査や組織診断を遅らせるべきではなく、良性疾患との鑑別を進める必要がある。
    condition:
      region: 国際
      population: 妊娠中・授乳中の女性
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1025
    source: Yu JH, Kim MJ, Cho H, et al. Breast diseases during pregnancy and lactation. Obstet Gynecol Sci. 2013;56(3):143-159.
    doi: 10.5468/ogs.2013.56.3.143
    pmid: '24327995'
    pmcid: null
    url: https://doi.org/10.5468/ogs.2013.56.3.143
    source_license: CC BY-NC 3.0
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 主張は出典（総説）の抄録で確認した範囲（この時期は悪性との鑑別が難しいこと、良性疾患と乳癌の双方が生じうること）に基づく。各疾患の頻度や、妊娠週数に応じた治療の可否などの数値・詳細は確認していないため書いていない。出典は2013年の総説である。
