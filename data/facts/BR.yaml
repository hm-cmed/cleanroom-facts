- id: BR-016
  domain: BR
  subdomain: 非浸潤性乳管癌（DCIS）の管理
  assertion:
    plain_statement_ja: 非浸潤性乳管癌（DCIS）は、癌細胞が乳管内にとどまる病変で、乳管内癌とも呼ばれ、TisN0M0、stage 0とされる。治療の主体は局所療法であり、手術および/または放射線療法が中心となる。ホルモン受容体陽性のDCISでは、内分泌療法が同側乳癌の再発を抑える選択肢となるが、遠隔転移を減らす効果はないとされる。
    condition:
      region: 日本
      population: DCISと診断された患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1014
    source: 'Yamamoto Y, Yamauchi C, Toyama T, et al. The Japanese Breast Cancer Society Clinical Practice Guidelines for Breast Cancer, 2022 Edition: changes from the 2018 edition and general statements on breast cancer treatment. Breast Cancer. 2024;31(3):340-346.'
    doi: 10.1007/s12282-024-01566-6
    pmid: '38570435'
    pmcid: PMC11045566
    url: https://doi.org/10.1007/s12282-024-01566-6
    source_license: CC BY 4.0
    legal_basis: B
    source_class: OPEN
    corroboration: null
  uncertainty: 定義と治療方針は出典の一般的事項の本文で確認した。低リスクDCISに対する積極的サーベイランス（手術省略）の臨床試験の結果など、本文にない新しい論点は扱っていない。薬剤名は挙げていないが、内分泌療法の個別薬剤の国内承認・保険適用の確認は本カードでは行っていない。
