- id: BR-006
  domain: BR
  subdomain: 乳癌の薬物療法（内分泌療法と化学療法）
  assertion:
    plain_statement_ja: ホルモン受容体陽性の早期乳癌では、内分泌療法が有効である。タモキシフェンは主に閉経後の女性で子宮内膜癌のリスクを上げることが示されているが、死亡リスクの有意な増加は示されておらず、不正性器出血などの症状がある場合は婦人科での診察が推奨される。化学療法を含む全身療法の個別の選択は、日本乳癌学会の薬物療法ガイドラインで臨床疑問ごとに推奨が示されている。
    condition:
      region: 日本
      population: 早期乳癌患者（内分泌療法についてはホルモン受容体陽性）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1016
    source: Terada M, Ito A, Kikawa Y, et al. The Japanese Breast Cancer Society Clinical Practice Guidelines for Systemic Treatment of Breast Cancer, 2022 Edition. Breast Cancer. 2023;30(6):872-884.
    doi: 10.1007/s12282-023-01505-x
    pmid: '37804479'
    pmcid: PMC10587293
    url: https://doi.org/10.1007/s12282-023-01505-x
    source_license: CC BY 4.0
    legal_basis: B
    source_class: OPEN
    corroboration: null
  uncertainty: 内分泌療法の有効性とタモキシフェンの子宮内膜癌リスクは、出典の背景疑問（BQ）一覧の記載で確認した。薬剤名の出るカードとして国内の承認・保険適用の確認状況を記す：タモキシフェンをはじめとする乳癌の内分泌療法薬・化学療法薬は国内で承認された薬剤がガイドラインの前提だが、個別薬剤の承認・保険適用の最新状況は本カード作成時に一次資料（添付文書・保険資料）で確認していない。化学療法レジメンごとの推奨の強さは確認していないため書いていない。
