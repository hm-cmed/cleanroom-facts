    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 開始基準はガイドラインの図4-2から読み取り。FRAXの値はそれ単独では治療開始の判断に用いず、診断基準を補う情報として用いる位置づけであることが本文に明記されている。
