  assertion:
    plain_statement_ja: 骨Paget病の診断と評価では、疑わしい骨格部位の単純X線写真で診断を行い、診断が確定したら骨シンチグラフィで病変の広がりを評価し、血清総ALPを測定して疾患の活動性の評価や治療反応・未治療例の経過観察に用いることが、米国内分泌学会のガイドラインで推奨されている。
    condition:
