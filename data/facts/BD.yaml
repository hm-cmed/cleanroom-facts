- id: BD-016
  domain: BD
  subdomain: 骨形成不全症
  assertion:
    plain_statement_ja: 骨形成不全症は骨脆弱性と骨格変形を特徴とする疾患で、その約85%はI型コラーゲンをコードするCOL1A1・COL1A2遺伝子の常染色体優性変異によって生じ、コラーゲンの量または構造の異常が原因となる。診断は家族歴と、出生前・出生時・小児期早期の骨折などの臨床像に基づいて行われ、遺伝子検査で確認できる。
