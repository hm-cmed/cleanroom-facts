  domain: NL
  subdomain: 副鼻腔炎
  assertion:
    plain_statement_ja: 慢性副鼻腔炎は、鼻閉と鼻漏（前鼻漏・後鼻漏）の少なくとも一方を含む2つ以上の症状が12週以上続き、顔面痛・圧迫感や嗅覚の低下を伴うことがある、鼻と副鼻腔の炎症である。EPOS 2020では、慢性副鼻腔炎を一次性と二次性に分け、さらに解剖学的な広がりに基づいて局在性（片側性）とびまん性（両側性）に細分する分類が提案され、一次性ではエンドタイプ（タイプ2炎症が優位かどうか）が重視される。治療は鼻腔内ステロイドと生理食塩水による鼻洗浄を中心とする薬物療法が基本であり、十分な薬物療法を行っても制御できない場合に内視鏡下副鼻腔手術が推奨される。
