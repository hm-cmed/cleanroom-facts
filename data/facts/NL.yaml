- id: NL-015
  domain: NL
  subdomain: 喉頭腫瘍
  assertion:
    plain_statement_ja: 喉頭癌は男性に多く（発生率は人口10万人あたり男性5.8人、女性1.2人）、約60%の患者は進行期（III期またはIV期）の状態で診断される。最も重要な危険因子は喫煙と飲酒で、喫煙者のリスクは非喫煙者の10〜15倍（最も喫煙量が多い者では最大30倍）に達し、飲酒量とも直線的な関係があり、両者には相乗効果がある。発生部位によって症状の出方が異なり、声門の腫瘍は早期から声に影響するのに対し、声門上の腫瘍は長期間無症状に大きくなり呼吸困難や声の変化で見つかることが多く、声門下の腫瘍は部位が狭いため早期から気道閉塞を呈しやすい。さらなる精査を促す症状は、嗄声、発声障害、呼吸困難、嚥下障害である。初期評価には軟性鼻咽喉頭鏡による喉頭粘膜の観察が含まれ、確定のためには手術室で全身麻酔下に直達喉頭鏡による生検が必要になることが多い。病期の評価にはCT、MRI、PETが用いられる。
    condition:
      region: 米国
      study: 総説
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1382
    source: Steuer CE, El-Deiry M, Parks JR, Higgins KA, Saba NF. An update on larynx cancer. CA Cancer J Clin. 2017;67(1):31-50
    doi: 10.3322/caac.21386
    pmid: '27898173'
    pmcid: null
    url: https://acsjournals.onlinelibrary.wiley.com/doi/10.3322/caac.21386
    source_license: © American Cancer Society（CC 表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ59 2026-11-13）：Hut A-R, Boia ER, Para D, Iovanescu G, Horhat D, Mikša L, Chiriac M, Galant R, Motofelea AC, Balica NC. Laryngeal Cancer in the Modern Era. Journal of Clinical Medicine. 2025;14(10):3367 補助：National Cancer Institute. Laryngeal Cancer Treatment (PDQ®) – Health Professional Version. NCI PDQ® Cancer Information Summary (cancer.gov)／NCBI Bookshelf NBK65746, 2026-11-13 閲覧（PMID: 26389189） 補助：Shi L, Kuang Z, Tu J, Wang T, Liu T, Liu J, Liu J. Global, regional, and national burden of laryngeal cancer attributable to smoking, 1990–2021, and projections to 2036. Frontiers in Public Health. 2025;13:1583045（PMID: 40416653、DOI: 10.3389/fpubh.2025.1583045、PMCID: PMC12098609）（PMID: 40429363、DOI: 10.3390/jcm14103367、PMCID: PMC12112285、https://www.ebi.ac.uk/europepmc/webservices/rest/PMC12112285/fullTextXML）。裏づける部分：主候補（Hut 2025）で、危険因子（喫煙・飲酒・HPV・職業曝露）と部位別症状の枠組みを確認した。 補助候補（NCI PDQ）：喫煙・過量飲酒との関連、部位別症状、病期評価（内視鏡、生検、CT／MRI／PET）が記載されている。補助候補（Shi 2025）：喫煙リスク10〜15倍、最も喫煙量が多い者で最大30倍が記載されている。。数値の照合：喫煙リスク10〜15倍（最大30倍）は補助候補と完全一致する。進行期の割合は主候補が約2／3としており、カードの約60%とは表現が異なる。発生率（男性5.8／女性1.2、10万人あたり）は自由全文では未確認である。。留保：主出典 SRC-1382 の区分訂正は別枠の節に分離した。進行期割合の表現の差はフラグに挙げた。'
