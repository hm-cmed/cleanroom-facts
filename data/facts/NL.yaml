- id: NL-008
  domain: NL
  subdomain: 副鼻腔炎
  assertion:
    plain_statement_ja: 副鼻腔真菌症は、真菌の菌糸が組織へ浸潤するかどうかによって非浸潤性と浸潤性に大別される。非浸潤性には真菌球（fungal ball）やアレルギー性真菌性副鼻腔炎などがあり、浸潤性には急性浸潤性（経過4週間以内）、慢性浸潤性、慢性肉芽腫性浸潤性がある。真菌球は免疫能が正常な患者に生じ、上顎洞に最も多く（94%）、原因真菌はアスペルギルスが90%以上を占める。CTでは洞内の高吸収域や石灰化が手がかりとなり、治療は内視鏡下手術による真菌塊の除去で、抗真菌薬は適応とならない。一方、急性浸潤性真菌性副鼻腔炎は、糖尿病患者（約半数を占め、特にケトアシドーシスに合併）や好中球減少・血液悪性腫瘍などの免疫不全患者に生じ、ムーコル目やアスペルギルスが神経や血管の構造へ浸潤して血栓と壊死を起こし、眼窩や頭蓋内へ進展しうる。致死率は約50%（報告により最大80%）と高く、素因の是正、壊死組織の外科的デブリードマン、全身抗真菌薬投与の3つを組み合わせた迅速な治療が必要で、抗真菌薬の中心はアムホテリシンBである。
    condition:
      region: 全般
      study: 総説
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1376
    source: Deutsch PG, Whittaker J, Prasad S. Invasive and Non-Invasive Fungal Rhinosinusitis—A Review and Update of the Evidence. Medicina (Kaunas). 2019;55(7):319
    doi: 10.3390/medicina55070319
    pmid: '31261788'
    pmcid: PMC6681352
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC6681352/
    source_license: CC BY 4.0
    legal_basis: B
    source_class: OPEN
    corroboration: null
  uncertainty: 割合（94%、90%以上、約50%、最大80%）はいずれも総説の本文で確認した値で、引用元の研究により幅がある。アムホテリシンBなど抗真菌薬の国内承認・保険適用は未確認である。　【承認状況の再点検 2026-10-31（作り手、PMDA・厚生労働省などの公的情報）】アムホテリシンB（ファンギゾン、リポソーム製剤アムビゾーム）は真菌症の適応で承認済み。「未確認」は解消できる
