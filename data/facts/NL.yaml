- id: NL-002
  domain: NL
  subdomain: 鼻炎
  assertion:
    plain_statement_ja: 鼻炎はアレルギー性鼻炎と非アレルギー性鼻炎に大別される。アレルギー性鼻炎は最も多い型で、季節性・通年性・職業性があり、詳細な問診と身体診察によって非アレルギー性鼻炎と鑑別できる。非アレルギー性鼻炎の原因として最も多いのは急性ウイルス感染で、そのほかに血管運動性、ホルモン性、薬剤性、構造性、職業性（刺激性）の鼻炎、鼻閉改善薬の連用による薬剤性鼻炎、好酸球増多を伴う非アレルギー性鼻炎症候群がある。アレルギー検査（経皮テストや特異的IgE抗体測定）は全例に必要なわけではなく、鑑別が曖昧な例や複雑な例で有用である。
    condition:
      region: 米国（プライマリケア）
      study: 総説
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1372
    source: 'Quillen DM, Feller DB. Diagnosing rhinitis: allergic vs. nonallergic. Am Fam Physician. 2006;73(9):1583-1590'
    doi: null
    pmid: '16719251'
    pmcid: null
    url: https://pubmed.ncbi.nlm.nih.gov/16719251/
    source_license: © American Academy of Family Physicians
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ59 2026-11-13）：Liva GA, Karatzanis AD, Prokopakis EP. Review of Rhinitis: Classification, Types, Pathophysiology. Journal of Clinical Medicine. 2021;10(14):3183（PMID: 34300349、DOI: 10.3390/jcm10143183、PMCID: PMC8303640、https://pmc.ncbi.nlm.nih.gov/articles/PMC8303640/）。裏づける部分：鼻炎の3表現型（アレルギー性／感染性／非アレルギー性・非感染性）という分類の枠組み、非アレルギー性鼻炎の下位型（薬剤性・ホルモン性・職業性・特発性・NARES・薬剤性鼻炎など）、経皮テストと特異的IgEが一般的なアレルギー検査であることを確認した。。数値の照合：数値なし（分類・鑑別・検査適応のカード）。。留保：分類の枠組みが主出典（2006年の二分法）と異なるため部分裏づけにとどまる。主出典 SRC-1372 の区分訂正は別枠の節に分離した。'
  uncertainty: 2006年の総説であり、分類の骨格を示すものとして用いた。DOI は PubMed レコードに記載がなく確認できなかったため null とした。個別の検査・治療の推奨は最新のガイドラインで確認が必要である。
