- id: NL-007
  domain: NL
  subdomain: 副鼻腔炎
  assertion:
    plain_statement_ja: 歯性上顎洞炎は、上顎の歯の病変に起因する上顎洞炎である。片側性の上顎洞炎のうち約30%には、背景に歯性の病変が存在しうる。歯科的な原因が見逃されると副鼻腔炎は難治化し、重篤な合併症を来すことがある。治療は、歯科的治療と内視鏡下副鼻腔手術を組み合わせて感染を取り除き、上顎洞の生理的な排泄路を回復させ、再発を防ぐことが基本であり、耳鼻咽喉科と歯科が連携するチームによる管理が必須である。
    condition:
      region: 全般
      study: 総説
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1375
    source: 'Psillas G, Papaioannou D, Petsali S, Dimas GG, Constantinidis J. Odontogenic maxillary sinusitis: A comprehensive review. J Dent Sci. 2021;16(1):474-481'
    doi: 10.1016/j.jds.2020.08.001
    pmid: '33384837'
    pmcid: PMC7770314
    url: https://doi.org/10.1016/j.jds.2020.08.001
    source_license: CC BY-NC-ND 4.0
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ59 2026-11-13）：Nelke K, Morawska-Kochman M, Janeczek M, Małyszek A, Uranbey Ö, Łuczak K, Nienartowicz J, Maag I, Caso AR, Dobrzyński M. Radiologic Evaluation of Odontogenic Sinusitis and Its Etiologic Factors: Lessons Learned from a Retrospective Study with a Proposed Imaging-Guided Management Pathway. Journal of Clinical Medicine. 2026;15(10):3724 補助：Albu S, Roman A. Navigating the Treatment Landscape of Odontogenic Sinusitis: Current Trends and Future Directions. Medicina (Kaunas). 2025;61(12):2175（PMID: 41470177、DOI: 10.3390/medicina61122175、PMCID: PMC12734476）（PMID: 42194684、DOI: 10.3390/jcm15103724、PMCID: PMC13207049、https://pmc.ncbi.nlm.nih.gov/articles/PMC13207049/）。裏づける部分：主候補（Nelke 2026）で、片側性上顎洞炎の約30%に歯性の病変が存在しうること（主出典への帰属を明記した再掲）、多職種治療とチームアプローチが必須であることを確認した。 補助候補（Albu 2025）：歯科治療と内視鏡下副鼻腔手術の組合せ、耳鼻科と歯科の協力、感染源治療による再発予防が記載されている。。数値の照合：約30%は主候補の再掲と一致する。ただし主候補自身の新規測定値ではなく主出典値の引用である。補助候補の頻度（25–40%、45–75%）は分母が異なり照合には使えない。。留保：主出典 SRC-1375 は CC BY-NC-ND のため現行の RESTRICTED が正しい。マスターの pmcid が null のため、PMC7770314 を補完候補として申し送りに記録した。'
  uncertainty: 「約30%」は総説の抄録に示された割合であり、対象とする集団や歯性病変の定義により異なる可能性がある。個別の歯科的原因（根尖病変、上顎洞への穿孔など）の頻度の内訳は抄録では確認できなかった。
