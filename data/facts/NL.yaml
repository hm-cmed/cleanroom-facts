- id: NL-013
  domain: NL
  subdomain: 喉頭疾患
  assertion:
    plain_statement_ja: 急性喉頭蓋炎は、気道閉塞によって罹患率・死亡率が高い救急疾患であり、ワクチンが普及した現在の時代には小児よりも成人に多くみられる。小児は急性の呼吸困難と発熱を呈することが多いのに対し、成人は亜急性の経過で強い嚥下痛を呈することが最も多く、そのほかに流涎、くぐもった声、呼吸困難がみられる。原因としてはレンサ球菌属とブドウ球菌属の細菌が最も多く、ウイルス、真菌、腐食性・熱性の傷害、自己免疫性のものもある。側面頸部X線写真は診断の助けになるが偽陰性がありうるため、診断の鍵は喉頭蓋を直接観察することである。管理では気道の評価と確保が最優先であり、抗菌薬を投与し、集中治療の場で気道を厳重に観察する。
