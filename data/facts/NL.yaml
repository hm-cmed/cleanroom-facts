- id: NL-005
  domain: NL
  subdomain: 副鼻腔炎
  assertion:
    plain_statement_ja: 急性副鼻腔炎は、鼻閉と鼻漏（前鼻漏・後鼻漏）の少なくとも一方を含む2つ以上の症状が突然に発症し、顔面痛・圧迫感や嗅覚の低下を伴うことがあり、12週未満で治まるものと定義される。経過による分類では、症状が10日未満のウイルス性（感冒）、5日を過ぎて症状が増悪するか10日を超えて持続するウイルス感染後、そして細菌性に分けられる。細菌性であることが示唆されるのは、着色した鼻漏、強い局所の痛み、38℃を超える発熱、炎症反応の上昇、一度改善した症状の再増悪（double worsening）のうち、少なくとも3つがそろう場合である。
    condition:
      region: 欧州（国際的なポジションペーパー）
      study: ガイドライン（ポジションペーパー）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1374
    source: Fokkens WJ, Lund VJ, Hopkins C, Hellings PW, Kern R, Reitsma S, et al. European Position Paper on Rhinosinusitis and Nasal Polyps 2020. Rhinology. 2020;58(Suppl S29):1-464
    doi: 10.4193/Rhin20.600
    pmid: '32077450'
    pmcid: null
    url: https://doi.org/10.4193/Rhin20.600
    source_license: ライセンス表示を確認できず（誌のウェブサイトで全文が無料公開）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ59 2026-11-13）：Romano FR, Anselmo-Lima WT, Kosugi EM, et al. Rhinosinusitis: Evidence and experience – 2024. Brazilian Journal of Otorhinolaryngology. 2025;91(5):101595（PMID: 40398368、DOI: 10.1016/j.bjorl.2025.101595、PMCID: PMC12148406、https://pmc.ncbi.nlm.nih.gov/articles/PMC12148406/）。裏づける部分：急性副鼻腔炎の定義（2症状以上、12週未満）、経過による分類、細菌性を示唆する5所見（着色した鼻漏、強い局所痛、発熱38℃超、炎症反応の上昇、double worsening）のうち少なくとも3つという EPOS 2020 基準が、CC BY の2025年総説に EPOS 2020 基準として明記されていることを確認した。。数値の照合：12週未満、10日、5所見中3つ、発熱38℃超はいずれもカードと一致する。。留保：主出典 SRC-1374（EPOS 2020）の区分訂正は別枠の節に分離した。'
  uncertainty: 定義と経過による分類は、EPOS 2020 の抄録および同文書の基準を引用する複数の論文で確認した。本カードでは個別の抗菌薬名は挙げていない。抗菌薬をはじめとする薬物療法の国内承認・保険適用は未確認である。
