- id: NL-011
  domain: NL
  subdomain: 上気道症状の鑑別
  assertion:
    plain_statement_ja: 感冒（ウイルス性急性副鼻腔炎）は、上気道症状が10日未満で治まるものである。発症から5日を過ぎて症状が増悪する場合、または10日を超えて症状が持続する場合はウイルス感染後の急性副鼻腔炎と位置づけられ、そのうち細菌によるものは一部にすぎない。着色した鼻漏、強い局所の痛み、38℃を超える発熱、炎症反応の上昇、一度改善した症状の再増悪といった所見がそろう場合は細菌性副鼻腔炎を疑い、感冒と区別する。すなわち、感冒と急性副鼻腔炎の見分けは、個々の症状の種類よりも、経過の期間と増悪のパターンに基づいて行う。
    condition:
      region: 欧州（国際的なポジションペーパー）
