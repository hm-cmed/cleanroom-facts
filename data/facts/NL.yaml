- id: NL-003
  domain: NL
  subdomain: 鼻炎
  assertion:
    plain_statement_ja: アレルギー性鼻炎は鼻粘膜のI型アレルギー疾患で、発作性反復性のくしゃみ、水様性鼻漏、鼻閉を3主徴とする。原因抗原により季節性と通年性に分類され、症状の病型として、ヒスタミンが主に関与するくしゃみ・鼻漏型、ロイコトリエンなどの脂質メディエーターが主に関与する鼻閉型、両方の特徴を併せ持つ充全型に分けられる。感作された鼻粘膜で抗原がIgE抗体と反応すると、肥満細胞からヒスタミンやロイコトリエンが放出される即時相反応が起こり、6〜10時間後には好酸球などの細胞浸潤による遅発相反応が続く。確定診断は、3主徴に加え、鼻汁好酸球検査の陽性と、皮膚反応または血清特異的IgE抗体測定による原因抗原の同定に基づいて行う。
    condition:
      region: 日本
      study: 学会ガイドライン（英語版）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-4432
    source: 日本耳鼻咽喉科免疫アレルギー感染症学会 編. 鼻アレルギー診療ガイドライン―通年性鼻炎と花粉症―2024年版（改訂第10版）. 金原出版. 2024（ISBN 978-4-307-37140-7）
    doi: null
    pmid: null
    pmcid: null
    url: null
    source_license: 書籍（学会の著作物、CC 表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ59 2026-11-13）：Liva GA, Karatzanis AD, Prokopakis EP. Review of Rhinitis: Classification, Types, Pathophysiology. Journal of Clinical Medicine. 2021;10(14):3183（PMID: 34300349、DOI: 10.3390/jcm10143183、PMCID: PMC8303640、https://pmc.ncbi.nlm.nih.gov/articles/PMC8303640/）。裏づける部分：I型／IgE介在性の定義、3主徴（くしゃみ・鼻漏・鼻閉）、即時相の肥満細胞脱顆粒とヒスタミン放出、遅発相の好酸球等の細胞浸潤、季節性・通年性、皮膚反応と血清特異的IgEによる抗原同定の位置づけを確認した。。数値の照合：遅発相の6〜10時間という時刻は候補では未確認。。留保：2024年版の英語要約版（Okano M, Okubo K, et al. Auris Nasus Larynx. 2025;52(4):426-441、DOI: 10.1016/j.anl.2025.05.005、PMID: 40544726）は内容面ではほぼ全項目をカバーするが、刊行版に「© 2025 Japanese Society of Otorhinolaryngology-Head and Neck Surgery, Inc. Published by Elsevier B.V. All rights are reserved」とあり CC 表示がないため候補にできない。主出典 SRC-4432 は書籍で現行の RESTRICTED が正しい。'
  uncertainty: 出典を2024年版（改訂第10版）に付け替えた。定義・3主徴・病型分類・確定診断の骨格は第10版でも維持されている（作り手が英語要約版〈Auris Nasus Larynx 2025〉と学会誌の解説で確認）。第10版で分類に加わった局所アレルギー性鼻炎（LAR）は本カードでは扱っていない。
