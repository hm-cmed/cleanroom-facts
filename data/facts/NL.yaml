- id: NL-010
  domain: NL
  subdomain: 鼻・副鼻腔腫瘍
  assertion:
    plain_statement_ja: 鼻・副鼻腔癌はまれな腫瘍で、世界での年間発生率は人口10万人あたり約1人である。組織型では扁平上皮癌と腺癌が合わせて全体の80%を占める。これらの腫瘍は木材や革の粉塵、その他の工業化合物への職業性曝露と病因的に関連し、職業病として公式に認められている。鼻・副鼻腔の腫瘍は、臨床像、病因、病理、遺伝的特徴が他の頭頸部癌と異なるため、それらとは別の独立した疾患群として扱うべきものである。その臨床管理は、画像診断技術、内視鏡手術アプローチ、放射線治療の進歩によって改善してきた。
    condition:
      region: 全般（世界）
      study: 総説
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1378
    source: 'Llorente JL, López F, Suárez C, Hermsen MA. Sinonasal carcinoma: clinical, pathological, genetic and therapeutic advances. Nat Rev Clin Oncol. 2014;11(8):460-472'
    doi: 10.1038/nrclinonc.2014.97
    pmid: '24935016'
    pmcid: null
    url: https://doi.org/10.1038/nrclinonc.2014.97
    source_license: © Nature Portfolio（CC 表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ59 2026-11-13）：Lucidi D, et al. Tumors of the Nose and Paranasal Sinuses: Promoting Factors and Molecular Mechanisms—A Systematic Review. International Journal of Molecular Sciences. 2023;24(3):2670 補助：National Cancer Institute. Paranasal Sinus and Nasal Cavity Cancer Treatment (PDQ®) — Health Professional Version. NCI PDQ® Cancer Information Summary (cancer.gov), 2026-11-13 閲覧（PMID: 26389272） 補助：Ferrari M, Orlandi E, Bossi P. Sinonasal cancers treatments: state of the art. Current Opinion in Oncology. 2021;33(3):196-205（PMID: 33756515、DOI: 10.1097/CCO.0000000000000726、PMCID: PMC9904434）（PMID: 36768990、DOI: 10.3390/ijms24032670、PMCID: PMC9916834、https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9916834/fullTextXML）。裏づける部分：主候補（Lucidi 2023）で、異種混交の疾患群であること、扁平上皮癌が最頻であること、職業曝露が病因に関与すること、進行期受診と管理の進歩を確認した。 補助候補（NCI PDQ）：扁平上皮癌が最頻で70–80%、産業曝露との関連、多職種による治療計画が記載されている。補助候補（Ferrari 2021）：希少・異種混交であることと管理の進歩が記載されている。。数値の照合：発生率は主候補に0.83／100,000とあり、カードの「約1／100,000」と近似だが厳密には不一致である。「扁平上皮癌と腺癌で合わせて80%」という合算表記は候補のいずれにもない。。留保：内容が最も近い Perri F, et al. Oncol Lett. 2017（DOI: 10.3892/ol.2017.5598、PMID: 28454258、PMCID: PMC5403341）は、PMC 全文に Creative Commons のライセンス表示が確認できず（表示は Copyright © 2017, Spandidos Publications のみ）候補にできない。主出典 SRC-1378 の区分訂正は別枠の節に分離した。'
  uncertainty: 発生率と組織型の割合は2014年の総説の抄録に基づく。日本の癌登録による最新の頻度や部位別の内訳は未確認である。
