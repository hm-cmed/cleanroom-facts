- id: NL-018
  domain: NL
  subdomain: 喉頭疾患
  assertion:
    plain_statement_ja: 声帯ポリープは声帯の良性病変の一つで、一般に片側性に生じ、無茎性または有茎性で、ゼラチン状、線維性、血管腫様といった組織像をとる。主因は声の酷使による音声外傷であり、喫煙や咽喉頭逆流も関与しうる。症状は嗄声や気息声、発声疲労である。韓国の調査では、声帯結節が喉頭病変の中で最も有病率が高く（1.0〜1.7%）、ポリープはこれに次いだ（0.3〜0.6%）。ポリープと結節は組織学的には鑑別が難しく、片側性か両側性かという肉眼的特徴によって区別される。治療では、音声治療が手術と併用される確立した治療であり、音声治療の単独でも病変の退縮が得られる場合がある。病変が持続する場合には手術が選択される。
