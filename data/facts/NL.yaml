- id: NL-009
  domain: NL
  subdomain: 副鼻腔炎
  assertion:
    plain_statement_ja: 術後副鼻腔囊胞の代表である術後性上顎囊胞（術後上顎粘液囊胞）は、上顎洞手術の術後に生じる囊胞性病変である。治療には経鼻内視鏡下の開窓術（marsupialization）が有効である。術後上顎粘液囊胞39例を対象とした後方視的検討では、経鼻内視鏡下開窓術が32例（34側）に行われ、12か月以上の経過観察で再発は5例（14.9%）にみられた。再発はすべて下鼻道に開窓した例であり、中鼻道に開窓した例では再発がなく、両群の差は統計学的に有意であった（p=0.04）。
    condition:
      region: 台湾（3次医療機関）
      study: 後ろ向き症例集積（39例）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1377
    source: 'Huang CC, Chen CW, Lee TJ, Chang PH, Chen YW. Transnasal endoscopic marsupialization of postoperative maxillary mucoceles: middle meatal antrostomy versus inferior meatal antrostomy. Eur Arch Otorhinolaryngol. 2011;268(11):1583-1587'
    doi: 10.1007/s00405-011-1636-5
    pmid: '21607579'
    pmcid: null
    url: https://doi.org/10.1007/s00405-011-1636-5
    source_license: © Springer（CC 表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 出典は台湾の単施設の後方視的検討で、対象は術後上顎粘液囊胞（postoperative maxillary mucoceles）である。囊胞の成因や、術後から発症までの期間については、本出典の抄録では確認できなかった。
