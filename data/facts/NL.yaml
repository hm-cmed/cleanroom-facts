- id: NL-014
  domain: NL
  subdomain: 喉頭疾患
  assertion:
    plain_statement_ja: 急性喉頭炎は一般的な疾患で、通常は上気道感染に関連して生じ、嗄声をしばしば伴い、一般に自然に軽快する。喉頭炎の原因は多様であり、適切な治療は原因によって決まる。初期評価では、気道の開存を確認し、悪性腫瘍を除外することが必須である。症状が持続する場合や危険兆候が現れた場合は、診断を見直し、喉頭の内視鏡検査が行われたことを確認すべきである。免疫が低下した患者では、感染性の原因のリスクが高い。
