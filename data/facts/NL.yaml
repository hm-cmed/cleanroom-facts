- id: NL-020
  domain: NL
  subdomain: 喉頭腫瘍
  assertion:
    plain_statement_ja: 喉頭乳頭腫（再発性呼吸器乳頭腫症）は、ヒトパピローマウイルス（HPV）感染によって生じる上気道の良性疾患で、小児と若年成人に発症する。小児の感染は、主に感染した母親の産道を通過する際の感染であり、成人の感染は性的接触によるとされる。乳頭腫は外向性の結節として主に喉頭に生じ、鼻咽頭、気管気管支樹、肺実質に及ぶこともある。臨床症状は慢性咳嗽、嗄声、喘鳴、声の変化、吸気性喘鳴、慢性の呼吸困難など気道症状全般にわたり非特異的である。経過は予測が難しく、自然寛解から、持続・再発を繰り返す攻撃的な経過まで幅があり、まれに扁平上皮癌への悪性転化を生じる。診断では気管支鏡が最も確実な方法で、病変の直接観察と病理組織学的診断のための生検材料の採取ができ、確定診断は病理組織学的所見に基づく。現在、確立した根治的治療はなく、補助的治療があるものの、外科的切除が治療の主体である。
    condition:
      region: 全般
      study: 総説
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1385
    source: 'Fortes HR, von Ranke FM, Escuissato DL, Araújo Neto CA, Zanetti G, Hochhegger B, Marchiori E. Recurrent respiratory papillomatosis: A state-of-the-art review. Respir Med. 2017;126:116-121'
    doi: 10.1016/j.rmed.2017.03.030
    pmid: '28427542'
    pmcid: null
    url: https://doi.org/10.1016/j.rmed.2017.03.030
    source_license: © Elsevier（CC 表示を確認できず）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ59 2026-11-13）：Tomecka P, Karwowska A, Kuźnicki J, Skinderowicz K, Wojno A, Markut K, Typek P, Ciesielska U, Kulbacka J, Drąg-Zalesińska M. HPV Infection in Children and Adolescents—A Comprehensive Review. Journal of Clinical Medicine. 2025;14(7):2425 補助：Sporeni S, Rifaldi F, Lanzetta I, Imarisio I, Montagna B, Serra F, Agustoni F, Pedrazzoli P, Benazzo M, Bertino G. Recurrent respiratory papillomatosis: role of bevacizumab and HPV vaccination. A literature review with case presentations. Radiology and Oncology. 2025;59(1):23-30（PMID: 40014785、DOI: 10.2478/raon-2025-0010、PMCID: PMC11867566）（PMID: 40217872、DOI: 10.3390/jcm14072425、PMCID: PMC11989703、https://www.ebi.ac.uk/europepmc/webservices/rest/PMC11989703/fullTextXML）。裏づける部分：主候補（Tomecka 2025）で、HPV 6／11 感染による良性喉頭腫瘍であること、周産期伝播、喉頭・気管等への分布、嗄声・咳嗽・喘鳴などの非特異的な気道症状を確認した。 補助候補（Sporeni 2025）：根治的治療はなく外科的切除が主体であることが記載されている。。数値の照合：数値なし（定性的な主張）。。留保：気管支鏡と病理組織学的所見による確定診断の明示、成人型の感染経路（性的接触）、経過の詳細（自然寛解から攻撃的な再発、まれな悪性転化）は自由全文では未確認である。主出典 SRC-1385 の区分訂正は別枠の節に分離した。'
