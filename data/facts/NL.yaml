- id: NL-016
  domain: NL
  subdomain: 喉頭腫瘍
  assertion:
    plain_statement_ja: 早期（Tis、T1、T2）の声門・声門上癌に対しては、経口的レーザー顕微鏡手術（TLM）が手術治療の中心となっており、局所制御率は研究により80〜100%で、全生存率は放射線治療単独と同等であり、再発時には放射線治療を温存できる利点がある。進行癌では、かつて喉頭全摘が治療の中心であったが、化学療法と放射線治療による非手術的な喉頭温存のアプローチが確立した。一方、T4腫瘍については臓器温存の根拠が十分でなく、喉頭の機能障害が著しい例を含め、喉頭全摘を第一に考慮すべき場合がある。治療計画は集学的なチームで立てることが求められる。頸部リンパ節については、潜在転移のリスクが20%を超える場合に予防的治療の対象となり、声門上癌ではT2以上で、声門癌ではT3以上でその閾値に達する。
