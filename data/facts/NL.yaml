- id: NL-012
  domain: NL
  subdomain: 喉頭疾患
  assertion:
    plain_statement_ja: クループは、喉頭・気管・気管支の腫脹による上気道閉塞を来す疾患で、生後6か月から3歳の小児の3%が罹患する一般的な呼吸器疾患であり、5歳未満の小児における発熱・急性呼吸器疾患による入院の7%を占める。吸気性喘鳴（stridor）と犬吠様咳嗽が特徴で、微熱を伴うことが多いが、発熱は診断に必須ではない。喘鳴を来す病態として、急性喉頭蓋炎、細菌性気管炎、気道異物も鑑別に挙がる。診断に検査は通常不要で、画像検査や喉頭鏡は他の診断が疑われる場合に限る。治療については、重症度にかかわらずデキサメタゾンの単回投与（経口、筋肉内、静脈内のいずれか）が症状を改善し、再受診と入院期間を減らすことが無作為化比較試験で示されており、中等症から重症ではアドレナリン吸入の追加により症状が改善し入院期間が短縮する。
