- id: NL-004
  domain: NL
  subdomain: 鼻炎
  assertion:
    plain_statement_ja: 花粉症は、花粉抗原による季節性アレルギー性鼻炎であり、アレルギー性結膜炎を合併することが多い。日本では特にスギ花粉症が著しく増加しており、1998年から2008年にかけてアレルギー性鼻炎全体の有病率も増加した。年齢別では、通年性アレルギー性鼻炎は若年層に多く、スギ花粉症は中年層に多い。対策の基本は抗原の回避で、花粉飛散情報の活用や、飛散の多い日の外出時のマスク・眼鏡の着用などが推奨される。
    condition:
      region: 日本
      study: 学会ガイドライン（英語版）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1373
    source: Okubo K, Kurono Y, Ichimura K, Enomoto T, Okamoto Y, Kawauchi H, Fujieda S, Masuyama K; Japanese Society of Allergology. Japanese guidelines for allergic rhinitis 2020. Allergol Int. 2020;69(3):331-345
    doi: 10.1016/j.alit.2020.04.001
    pmid: '32473790'
    pmcid: null
    url: https://www.jstage.jst.go.jp/article/allergolint/69/3/69_331/_pdf
    source_license: CC BY-NC-ND 4.0
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ59 2026-11-13）：Uchida K, Iida K, Fujioka I, Hachimura S, Kaminuma O. Suppressive Effect of Lactococcus lactis subsp. cremoris YRC3780 on a Murine Model of Japanese Cedar Pollinosis. Pathogens. 2022;11(11):1347 補助：環境省. 花粉症環境保健マニュアル2022. 環境省環境保健部環境安全課. 2022年3月改訂（https://www.env.go.jp/chemi/anzen/kafun/2022_full.pdf） 補助：環境省・厚生労働省. 花粉症対策 スギ花粉症について日常生活でできること. 環境省・厚生労働省リーフレット. 2024年1月作成（https://www.env.go.jp/content/000194676.pdf）（PMID: 36422599、DOI: 10.3390/pathogens11111347、PMCID: PMC9698324、https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9698324/fullTextXML）。裏づける部分：主候補（Uchida 2022）の序文で、日本のアレルギー性鼻炎有病率は2019年49.2%で10年間に約10ポイント増加したこと、スギ花粉症が全人口の38.8%に相当することを確認した。 補助候補（環境省マニュアル2022）：花粉症全体の有病率の増加（1998年19.6%→2008年29.8%→2019年42.5%）、スギ花粉症2019年38.8%、花粉飛散情報の活用やマスク・眼鏡を含む抗原回避策が記載されている。補助候補（環境省・厚労省リーフレット2024）：スギ花粉症の推移16.2→26.5→38.8%が図に示されている。。数値の照合：増加の方向と2019年の値（花粉症全体42.5%、スギ花粉症38.8%）は政府資料と一致する。カード自体は個別の有病率数値を置いていない。。留保：アレルギー性結膜炎の合併の明示は候補で確認できなかった。年齢別分布の表現（通年性アレルギー性鼻炎は若年層に多く、スギ花粉症は中年層に多い）は、2019年調査ではスギ花粉症が10代から50代で45%以上とされることと緊張があり、NL-022 とあわせて再照合候補とする（フラグ参照）。主出典 SRC-1373 は CC BY-NC-ND のため現行の RESTRICTED が正しい。'
  uncertainty: 有病率の増加は、ガイドラインが引用する1998年と2008年の疫学調査に基づく記述であり、図中の個別の数値は本文の文章では確認できなかったため含めていない。それ以降の最新の有病率は未確認である。
