- id: NL-021
  domain: NL
  subdomain: 鼻炎
  assertion:
    plain_statement_ja: アレルギー性鼻炎の治療は、重症度と病型に基づいて選択する。軽症では、第2世代抗ヒスタミン薬、肥満細胞安定薬（ケミカルメディエーター遊離抑制薬）、Th2サイトカイン阻害薬、鼻噴霧用ステロイド薬のいずれかが第一選択となる。くしゃみ・鼻漏型の中等症では、これらの薬剤から1剤を選び、必要に応じて鼻噴霧用ステロイド薬と組み合わせる。鼻閉型や充全型では、ロイコトリエン受容体拮抗薬、プロスタグランジンD2・トロンボキサンA2受容体拮抗薬、Th2サイトカイン阻害薬、鼻噴霧用ステロイド薬の中から選び、必要に応じて組み合わせる。重症のくしゃみ・鼻漏型では第2世代抗ヒスタミン薬と鼻噴霧用ステロイド薬を併用し、重症の鼻閉型では鼻噴霧用ステロイド薬にロイコトリエン受容体拮抗薬などを追加する。鼻噴霧用ステロイド薬は、くしゃみ、水様性鼻漏、鼻粘膜腫脹のすべてに強力に作用し、1〜3日で効果が現れ、全身性の副作用は少ない。血管収縮薬の点鼻は一時的な使用にとどめ（最重症の花粉症でも1〜2週間を限度とする）、長期の連用は薬剤性鼻炎を招く。すべての症例で抗原の除去と回避を行い、治療を継続できる症例ではアレルゲン免疫療法も選択できる。日本ではスギ花粉とダニに対する舌下免疫療法が認められており、皮膚反応または特異的IgE抗体で原因抗原が確認された5歳以上が適応となり、少なくとも2〜3年間、連日投与する。薬物療法の効果が不十分な鼻閉型では、手術治療も選択できる。
    condition:
      region: 日本
      study: 学会ガイドライン（英語版）
    differential: null
    common_misconception: null
