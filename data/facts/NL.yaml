- id: NL-001
  domain: NL
  subdomain: 鼻・外鼻疾患
  assertion:
    plain_statement_ja: 鼻せつは鼻前庭の毛包に生じる感染症で、鼻前庭炎の範疇に含まれる。入院を要した鼻前庭炎118例の検討では、危険因子として鼻毛を抜く行為（14.4%）、鼻をかむ行為、鼻をほじる行為、鼻ピアスが挙がり、10.2%が糖尿病患者であった。細菌培養で最も多く分離されたのはメチシリン感受性黄色ブドウ球菌で（分離された菌の81.3%）、顔面の蜂巣炎を78.8%、鼻前庭の膿瘍を48.3%に伴ったが、この集団では重篤な合併症はみられなかった。
    condition:
      region: イスラエルの3次医療機関
      study: 後ろ向き症例集積（118例）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1371
    source: 'Lipschitz N, Yakirevitch A, Sagiv D, Migirov L, et al. Nasal vestibulitis: etiology, risk factors, and clinical characteristics: A retrospective study of 118 cases. Diagn Microbiol Infect Dis. 2017;89(2):131-134'
    doi: 10.1016/j.diagmicrobio.2017.06.007
    pmid: '28780999'
    pmcid: null
    url: https://doi.org/10.1016/j.diagmicrobio.2017.06.007
    source_license: © Elsevier（CC 表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 単施設の後方視的検討に基づく数値であり、軽症例を含む一般集団の頻度とは異なる可能性がある。海綿静脈洞血栓症などの重篤な合併症については、本検討では合併症なしと報告されており、その頻度は確認できなかった。
