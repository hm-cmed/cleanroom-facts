  assertion:
    plain_statement_ja: 急性声門下喉頭炎は、声門下を含む喉頭・気管・気管支の腫脹によって上気道閉塞を来す疾患で、クループと呼ばれる病態の主体をなす。生後6か月から3歳の小児に多く（この年齢層の3%が罹患する）、吸気性喘鳴（stridor）と犬吠様咳嗽を特徴とし、微熱を伴うことが多い。診断に検査は通常不要で、治療は重症度にかかわらずデキサメタゾンの単回投与が症状の改善に有効であり、中等症から重症ではアドレナリン吸入の追加により症状が改善し入院期間が短縮する。喘鳴の鑑別として、急性喉頭蓋炎、細菌性気管炎、気道異物が重要である。
