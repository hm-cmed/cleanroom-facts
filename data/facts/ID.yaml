- id: ID-016
  domain: ID
  subdomain: 自己免疫疾患による免疫不全症
  assertion:
    plain_statement_ja: 全身性エリテマトーデス（SLE）では、疾患自体に伴う細胞性・液性の免疫機能障害のため、感染が罹患と死亡の主因のひとつとなり、細菌感染が最も多く、ウイルス感染、真菌感染が続く。確立したリスク因子は、疾患活動性、プレドニゾンで7.5〜10 mg/日を超える用量、高用量メチルプレドニゾロン、シクロホスファミドであり、リツキシマブは投与後6か月間と3コースを超える使用が感染感受性の増加と関連する。予防の骨格として、慢性治療ではプレドニゾンを5 mg/日を超えないことが望ましく、インフルエンザワクチンと肺炎球菌ワクチンが普遍的に推奨され、生ワクチンは禁忌で、接種は疾患活動期を避ける。
    condition:
      region: 国際
      対象: 成人
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3096
    source: 'Danza A, Ruiz-Irastorza G. Infection risk in systemic lupus erythematosus patients: susceptibility factors and preventive strategies. Lupus. 2013;22(12):1286-1294.'
    doi: 10.1177/0961203313493032
    pmid: '24098001'
    pmcid: null
    url: https://doi.org/10.1177/0961203313493032
    source_license: 出版社の TDM 案内のみ（CC 表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: プレドニゾン、メチルプレドニゾロン、シクロホスファミド、リツキシマブはいずれも国内で承認・販売されている薬剤であるが、本カードの用量閾値や期間は出典（国際的な総説）に基づく感染リスクの記述であり、国内の用法・用量や保険適用の範囲を示すものではない。SLE の疾患各論は第43回 CT の範囲であり、本カードは自己免疫疾患に伴う免疫不全という状態と感染予防の骨格に限る。
