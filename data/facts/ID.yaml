- id: ID-018
  domain: ID
  subdomain: 医原性免疫不全症
  assertion:
    plain_statement_ja: 糖質コルチコイドによる感染リスクは用量依存的である。短期・低用量の使用を対象とした無作為化試験では感染リスクの増加はほとんど、あるいは全く示されなかった一方、実臨床の観察研究では、重症感染と一部の日和見感染について用量依存性のリスク増加が一貫して示されている。慢性の糖質コルチコイド治療を始める患者では、リスクを下げるためにワクチン接種とスクリーニングの戦略を用いるべきとされる。
    condition:
      region: 国際
      対象: 成人
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3098
    source: Youssef J, Novosad SA, Winthrop KL. Infection Risk and Safety of Corticosteroid Use. Rheum Dis Clin North Am. 2016;42(1):157-176.
    doi: 10.1016/j.rdc.2015.08.004
    pmid: '26611557'
    pmcid: PMC4751577
    url: https://doi.org/10.1016/j.rdc.2015.08.004
    source_license: Elsevier の TDM ライセンスのみ（CC 表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 糖質コルチコイドは国内でも承認・使用されている薬剤群であるが、本カードは医原性免疫不全の代表要因としての感染リスクの用量依存性に限る。用量の具体的な閾値は出典の抄録では確認できなかったため、主張に入れていない。
