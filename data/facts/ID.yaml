    doi: null
    pmid: null
    pmcid: null
    url: null
    source_license: 学会誌の著作物（CC 表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 数値と診断の根拠は出典の本文（学会公式サイトの PDF）で確認した。国内ではイカチバント（2018年承認、発作時治療）、C1インヒビター製剤（発作時治療と発症抑制）、皮下注C1インヒビター製剤・ベロトラルスタット・ラナデルマブ（長期予防）が承認・保険適用されている。経口の発作時治療薬（セベトラルスタット）の国内の薬価収載・発売時期は未確認のため主張に入れていない。出典のページ数は公開 PDF で未確定である。
