- id: ID-014
  domain: ID
  subdomain: 悪性腫瘍による免疫不全症
  assertion:
    plain_statement_ja: 血液悪性腫瘍の領域では、続発性免疫不全は腫瘍性疾患そのものと、その治療の双方によって生じうる。血球減少や一部のリンパ増殖性疾患が診断の手がかりとなり、診断は詳細な病歴、身体診察、血算と標準的な検査に基づき、免疫学的検査は診療のレベルに応じて選択する。免疫グロブリン補充療法の候補者は慎重に選ぶ必要があり、合併症を防ぐため可能な限り早期に治療を提供すべきとされる。
    condition:
      region: 国際
      対象: 成人
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3094
    source: 'Sánchez-Ramón S, Bermúdez A, González-Granado LI, et al. Primary and Secondary Immunodeficiency Diseases in Oncohaematology: Warning Signs, Diagnosis, and Management. Front Immunol. 2019;10:586.'
    doi: 10.3389/fimmu.2019.00586
    pmid: '30984175'
    pmcid: PMC6448689
    url: https://doi.org/10.3389/fimmu.2019.00586
    source_license: CC BY 4.0（Crossref・Europe PMC で確認）
    legal_basis: B
    source_class: OPEN
    corroboration: null
  uncertainty: 主張は腫瘍血液領域の専門家合意文書の抄録で確認した範囲（警告サイン、診断と管理の骨格）に限る。免疫グロブリン補充療法について、続発性免疫不全に対する国内の保険適用の範囲は確認していない。個々の悪性腫瘍の各論は扱わず、発熱性好中球減少症の疾患としての扱いは Ⅶ 血液の範囲である。
