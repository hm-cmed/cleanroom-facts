- id: ID-006
  domain: ID
  subdomain: 毛細血管拡張性失調症<ataxia telangiectasia>
  assertion:
    plain_statement_ja: 毛細血管拡張性失調症は、ATM遺伝子変異による常染色体潜性遺伝疾患で、小脳変性による失調、毛細血管拡張、免疫不全、悪性腫瘍への感受性と放射線高感受性を特徴とするDNA損傷応答の症候群であり、世界的な出生頻度は4万から10万出生に1人と推定される。αフェトプロテインの上昇、IgA欠損、Tリンパ球の減少が診断の手がかりになる。
