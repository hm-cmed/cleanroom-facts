- id: ID-002
  domain: ID
  subdomain: 選択的IgA欠損症
  assertion:
    plain_statement_ja: 選択的IgA欠損症は最も多い原発性免疫不全症で、4歳を超えた者で血清IgAが7mg/dL未満かつIgG・IgMが正常であり、二次性原因とT細胞欠損を除外して定義される。無症状のことも多いが、副鼻腔・肺の感染症や自己免疫疾患を合併しやすく、完全欠損例では抗IgA抗体によりIgAを含む血液製剤でアナフィラキシーを起こすことがある。
    condition:
      region: 国際
      対象: 小児・成人
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3082
    source: Swain S, Selmi C, Gershwin ME, Teuber SS. The clinical implications of selective IgA deficiency. J Transl Autoimmun. 2019;2:100025.
    doi: 10.1016/j.jtauto.2019.100025
    pmid: '32743511'
    pmcid: PMC7388344
    url: https://doi.org/10.1016/j.jtauto.2019.100025
    source_license: CC BY-NC-ND 4.0（Crossref・Europe PMC で確認）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 定義の基準値（IgA 7mg/dL）は出典の本文（PMC 全文）で確認した ESID 定義に基づく。頻度は白人集団で1:150から1:3,000と幅が大きく、日本人集団の頻度は未確認のため主張に入れていない。免疫グロブリン補充が必要になるのはごく稀であり、特定製剤の国内承認・適応の個別確認は本カードでは行っていない。
  curriculum:
    kokushi: 医学各論 Ⅺ-3-B-①（選択的IgA欠損症、b）
    core_curriculum: 'PS-01-03-27 (id: JkxnuMw)；PS-01-03-21 (id: JkxnuMY)；PS-01-03-23 (id: JkxnuMg)；PS-03-02-05 (id: JnGUA2s)；TBL-01-00-587 (id: JmxLo1E)'
