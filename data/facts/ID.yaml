      region: 国際
      対象: 小児
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3090
    source: Skokowa J, Dale DC, Touw IP, Zeidler C, Welte K. Severe congenital neutropenias. Nat Rev Dis Primers. 2017;3:17032.
    doi: 10.1038/nrdp.2017.32
    pmid: '28593997'
    pmcid: PMC5821468
    url: https://doi.org/10.1038/nrdp.2017.32
    source_license: CC 表示なし（Springer Nature の TDM 案内のみ）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: G-CSF製剤は国内で承認されているが、先天性好中球減少症に対する効能・効果の文言は PMDA の添付文書での逐語確認が未了である。
