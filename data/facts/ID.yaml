- id: ID-017
  domain: ID
  subdomain: 医原性免疫不全症
  assertion:
    plain_statement_ja: 続発性免疫不全の原因として免疫抑制薬の使用は主要な位置を占め、炎症性疾患と悪性腫瘍の治療に生物学的製剤を使うことが、続発性免疫不全のますます重要な原因になっている。CD20陽性B細胞を標的とするリツキシマブの使用は、持続性の低ガンマグロブリン血症をもたらしうる。再発性感染があり免疫学的評価に異常がある患者では、続発性免疫不全を鑑別に挙げるべきとされる。
    condition:
      region: 国際
      対象: 成人・小児
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3097
    source: 'Tuano KS, Seth N, Chinen J. Secondary immunodeficiencies: An overview. Ann Allergy Asthma Immunol. 2021;127(6):617-626.'
    doi: 10.1016/j.anai.2021.08.413
    pmid: '34481993'
    pmcid: null
    url: https://doi.org/10.1016/j.anai.2021.08.413
    source_license: Elsevier の TDM ライセンスのみ（CC 表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: リツキシマブは国内で承認・販売されている薬剤である（適応は疾患ごとに定められている）。本カードは医原性免疫不全という状態の原因分類に限る。個々の免疫抑制薬・生物学的製剤の使い方の詳細と、発熱性好中球減少症の疾患としての扱いは本カードの範囲外である（後者は Ⅶ 血液が正）。
  curriculum:
