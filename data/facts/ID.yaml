    pmid: '27884168'
    pmcid: PMC5123280
    url: https://doi.org/10.1186/s13023-016-0543-7
    source_license: CC BY 4.0（Europe PMC で確認）
    legal_basis: B
    source_class: OPEN
    corroboration: null
  uncertainty: 出生頻度は海外の推定値であり、日本での頻度は未確認。
