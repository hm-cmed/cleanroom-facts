- id: ID-015
  domain: ID
  subdomain: 悪性腫瘍による免疫不全症
  assertion:
    plain_statement_ja: 多発性骨髄腫では、腫瘍そのものに伴って感染のリスクが大きく上がる。スウェーデンの人口ベース研究（骨髄腫患者9,253人とマッチした対照34,931人の比較）では、感染発症のハザード比は全体で7.1（95%信頼区間6.8〜7.4）、細菌感染で7.1、ウイルス感染で10.0（同8.9〜11.4）であり、追跡の最初の1年間における死亡の22%で感染が原死因だった。
    condition:
      region: 欧州
      対象: 成人
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3095
    source: 'Blimark C, Holmberg E, Mellqvist UH, et al. Multiple myeloma and infections: a population-based study on 9253 multiple myeloma patients. Haematologica. 2015;100(1):107-113.'
    doi: 10.3324/haematol.2014.107714
    pmid: '25344526'
    pmcid: PMC4281323
    url: https://doi.org/10.3324/haematol.2014.107714
    source_license: CC 表示を確認できず（Crossref・Europe PMC）
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 数値はスウェーデンで1988〜2004年に診断された患者集団のものであり、現在の国内の患者集団への直接の当てはめではない。多発性骨髄腫の疾患各論は Ⅶ 血液の範囲であり、本カードは悪性腫瘍に伴う感染リスクの大きさに限る。
