- id: ID-003
  domain: ID
  subdomain: 無ガンマグロブリン血症
  assertion:
    plain_statement_ja: X連鎖無ガンマグロブリン血症は、BTK遺伝子変異によりB細胞の分化が骨髄で止まる疾患で、末梢血B細胞は2%未満に著減し全クラスの免疫グロブリンが低下するため、乳幼児期から細菌感染症を反復する。治療の柱は免疫グロブリン補充である。
    condition:
      region: 国際
      対象: 小児
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3083
    source: 'El-Sayed ZA, Abramova I, Aldave JC, et al. X-linked agammaglobulinemia (XLA): Phenotype, diagnosis, and therapeutic challenges around the world. World Allergy Organ J. 2019;12(3):100018.'
    doi: 10.1016/j.waojou.2019.100018
    pmid: '30937141'
    pmcid: PMC6439403
    url: https://doi.org/10.1016/j.waojou.2019.100018
    source_license: CC BY-NC-ND 4.0（Crossref・Europe PMC で確認）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 免疫グロブリン補充療法（静注・皮下注）は国内の標準治療として確立している。促進型皮下注製剤（ヒアルロニダーゼ併用免疫グロブリン）は無ガンマグロブリン血症・低ガンマグロブリン血症の適応で2024年12月に国内承認されたと企業発表で確認したが、PMDA の審査資料での直接照合は未実施。
  curriculum:
    kokushi: 医学各論 Ⅺ-3-B-②（無ガンマグロブリン血症、c）
    core_curriculum: 'PS-01-03-27 (id: JkxnuMw)；PS-01-03-23 (id: JkxnuMg)；PS-03-02-05 (id: JnGUA2s)；TBL-01-00-587 (id: JmxLo1E)'
