- id: ID-012
  domain: ID
  subdomain: 遺伝性血管性浮腫
  assertion:
    plain_statement_ja: 2025年のWAOガイドラインでは、遺伝性血管性浮腫の分類はC1インヒビター欠損を伴うHAE-C1-INHと、C1インヒビター正常型のHAE-nC1-INHに整理され、後者にはF12・PLG・ANGPT1など複数の遺伝子の病原性バリアントに関連する型が含まれる。致死的な喉頭浮腫のリスクが生涯続くため、無症状の患者を含め確定した全患者に発作時治療へのアクセスを確保し、長期予防は完全な疾患コントロールを目標とすることが示されている。
