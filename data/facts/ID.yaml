  subdomain: 慢性肉芽腫症、重症先天性好中球減少症
  assertion:
    plain_statement_ja: 重症先天性好中球減少症は、好中球の成熟障害を特徴とする希少疾患の一群で、生後数か月からしばしば生命を脅かす感染症を反復し、最も多い原因はELANEの常染色体顕性変異とHAX1の常染色体潜性変異である。治療の第一選択はG-CSFの連日皮下投与であり、骨髄異形成症候群・急性骨髄性白血病への素因があるため定期的な骨髄検査を含む評価が推奨される。
