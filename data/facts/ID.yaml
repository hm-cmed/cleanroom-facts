- id: ID-004
  domain: ID
  subdomain: 高IgM症候群
  assertion:
    plain_statement_ja: 高IgM症候群は、免疫グロブリンのクラススイッチ組換えの欠損による疾患群で、典型例ではIgMが単独に上昇しIgG・IgA・IgEが低値から欠如するが、IgMが正常から軽度上昇で他の免疫グロブリンだけが年齢基準より低い形もありうる。DNA修復機構の欠損でも同様の検査像を呈することがある。
    condition:
      region: 国際
      対象: 小児
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3084
    source: de la Morena MT. Clinical Phenotypes of Hyper-IgM Syndromes. J Allergy Clin Immunol Pract. 2016;4(6):1023-1036.
    doi: 10.1016/j.jaip.2016.09.013
    pmid: '27836054'
    pmcid: null
    url: https://doi.org/10.1016/j.jaip.2016.09.013
    source_license: CC 表示なし（Crossref は Elsevier TDM のみ）
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 本カードは表現型の整理に限る。CD40リガンド欠損症では造血幹細胞移植・免疫グロブリン補充が行われるが、その国内の実施・承認状況と、遺伝子治療の国内承認は未確認。
  curriculum:
    kokushi: 医学各論 Ⅺ-3-B-③（高IgM症候群、c）
    core_curriculum: 'PS-01-03-27 (id: JkxnuMw)；PS-01-03-21 (id: JkxnuMY)；PS-01-03-23 (id: JkxnuMg)；PS-03-02-05 (id: JnGUA2s)；TBL-01-00-587 (id: JmxLo1E)'
