- id: ID-019
  domain: ID
  subdomain: 免疫不全の総論（欠損と感染の対応）
  assertion:
    plain_statement_ja: 免疫不全は、生まれつきの免疫系の欠陥による原発性免疫不全症と、特定の疾患や状態に伴って生じる、あるいは治療に関連して生じる続発性免疫不全に大別される。続発性免疫不全では、悪性腫瘍、自己免疫疾患、臓器移植、造血幹細胞移植などに対する治療そのものが宿主防御を障害する要因となる。免疫不全が疑われる場合には、検査によるスクリーニングで欠損の所在を評価するアプローチがとられる。
    condition:
      region: 国際
      対象: 成人・小児
