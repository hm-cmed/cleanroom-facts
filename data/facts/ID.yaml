- id: ID-001
  domain: ID
  subdomain: 重症複合免疫不全症
  assertion:
    plain_statement_ja: 重症複合免疫不全症は、Tリンパ球の発生に深い障害をきたす単一遺伝子疾患の総称で、適応免疫が失われるため乳幼児期から日和見感染を含む反復感染を起こし、造血幹細胞移植などで免疫を回復しなければ早期に死亡する。
    condition:
      region: 国際
      対象: 小児
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3081
    source: Fischer A, Notarangelo LD, Neven B, Cavazzana M, Puck JM. Severe combined immunodeficiencies and related disorders. Nat Rev Dis Primers. 2015;1:15061.
    doi: 10.1038/nrdp.2015.61
    pmid: '27189259'
    pmcid: null
    url: https://doi.org/10.1038/nrdp.2015.61
    source_license: CC 表示なし（Crossref は TDM ライセンスのみ）
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 造血幹細胞移植は国内で確立した保険診療である。遺伝子治療は有効な選択肢になりつつあるが、ADA欠損症に対する遺伝子治療製剤の国内承認は未確認。日本の新生児スクリーニング（TREC/KREC）の実績は別文献で確認しており、本カードの主張には含めていない。
  curriculum:
    kokushi: 医学各論 Ⅺ-3-A-①（重症複合免疫不全症、c）
    core_curriculum: 'PS-01-03-27 (id: JkxnuMw)；PS-01-03-22 (id: JkxnuMc)；PS-03-02-05 (id: JnGUA2s)；TBL-01-00-587 (id: JmxLo1E)'
