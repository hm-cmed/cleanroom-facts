- id: ID-005
  domain: ID
  subdomain: Wiskott-Aldrich症候群
  assertion:
    plain_statement_ja: Wiskott-Aldrich症候群は、反復感染・湿疹・小血小板性血小板減少を特徴とする原発性免疫不全症で、古典的WASでは著しい複合免疫不全に加えて自己免疫合併症と血液悪性腫瘍のリスクがあるため、幹細胞移植または遺伝子治療による早期の是正が必要になる。軽症型のX連鎖血小板減少症は出血リスクを共有するが他の大きな臨床特徴を伴わず、通常は保存的に管理される。
    condition:
      region: 国際
      対象: 小児
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3085
    source: Rivers E, Worth A, Thrasher AJ. How I manage patients with Wiskott Aldrich syndrome. Br J Haematol. 2019;185(4):647-655.
    doi: 10.1111/bjh.15831
    pmid: '30864154'
    pmcid: PMC7612067
    url: https://doi.org/10.1111/bjh.15831
    source_license: CC 表示なし（Wiley の利用条件）
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 造血幹細胞移植は国内で実施体制がある。遺伝子治療（etuvetidigene autotemcel）は2025年12月に米国、2026年1月にEUで承認されたが、国内承認は未確認。
  curriculum:
    kokushi: 医学各論 Ⅺ-3-C-①（Wiskott-Aldrich症候群、c）
    core_curriculum: 'PS-01-03-27 (id: JkxnuMw)；PS-03-02-05 (id: JnGUA2s)；TBL-01-00-587 (id: JmxLo1E)'
