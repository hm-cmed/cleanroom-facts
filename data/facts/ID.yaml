- id: ID-011
  domain: ID
  subdomain: 遺伝性血管性浮腫
  assertion:
    plain_statement_ja: 遺伝性血管性浮腫（HAE-C1-INH）は頻度が5万人に1人とされる疾患で、1型（約85%）はC1インヒビターの蛋白量と機能がともに低下し、2型（約15%）は蛋白量が正常で機能のみが低下する。血管性浮腫による症状があり、C1インヒビター活性が50%未満に低下し、家族歴があることが診断の根拠となり、発作は24時間で最大になって数日で自然に消えることを繰り返す。患者の50%は生涯に一度は喉頭浮腫を経験するとされ、発作に対して抗ヒスタミン薬とステロイドは無効である。
    condition:
