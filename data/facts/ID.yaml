- id: ID-013
  domain: ID
  subdomain: 先天性補体欠損症
  assertion:
    plain_statement_ja: 先天性補体欠損症では、欠損する成分により感染の像が予測可能に異なり、古典経路成分の欠損は自己免疫疾患と莢膜菌による反復性の呼吸器感染を、C3の完全欠損は髄膜炎菌と肺炎球菌を含む重症感染を、代替経路と終末経路の欠損は侵襲性髄膜炎菌感染症への素因をもたらす。管理の要は、感染への素因についての患者教育、予防接種、体調不良時の迅速な受診である。
    condition:
      region: 国際
      対象: 小児・成人
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3093
    source: Ram S, Lewis LA, Rice PA. Infections of people with complement deficiencies and patients who have undergone splenectomy. Clin Microbiol Rev. 2010;23(4):740-780.
    doi: 10.1128/CMR.00048-09
    pmid: '20930072'
    pmcid: PMC2952982
    url: https://doi.org/10.1128/CMR.00048-09
    source_license: CC 表示なし（ASM の非商用 TDM ライセンスのみ）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 髄膜炎菌ワクチンの具体的な推奨は米国の資料に基づくものがあり、国内の承認・接種体制は未確認のため主張に入れていない。日本のC9欠損の頻度（献血者で0.095%）は別文献で確認しているが、本カードの出典には含めていない。
