- id: IH-008
  domain: IH
  subdomain: 冠攣縮性狭心症
  assertion:
    plain_statement_ja: 冠攣縮が原因の場合や冠攣縮性狭心症には、発作予防のため長時間作用型のカルシウム拮抗薬が推奨される（クラスI、レベルB）。冠攣縮が基礎にある患者にβ遮断薬を単独で使ってはならない（III（有害）、B）。日本人の心筋梗塞患者では、発症早期の誘発試験で冠攣縮が欧米人の約3倍多いと報告されている。
    condition:
      guideline: JCS 2018 急性冠症候群GL 表47・表84
      region: 日本
    differential: null
    common_misconception: 冠攣縮性狭心症にはβ遮断薬単独が第一選択である
  provenance:
    source_ref: SRC-206
    source: Kimura K, Kimura T, Ishihara M, et al. JCS 2018 Guideline on Diagnosis and Treatment of Acute Coronary Syndrome. Circ J 2019;83:1085-1196
    doi: 10.1253/circj.CJ-19-0133
    pmid: '30930428'
    pmcid: null
    url: https://doi.org/10.1253/circj.CJ-19-0133
    source_license: © 日本循環器学会（J-STAGE 掲載ページの表示。CC の表示なし。Crossref に license 欄なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ41 2026-11-11）：El Khatib O, Al Azzoni A, Shantouf R, Atallah B. Functional coronary vascular disease: endotype-based classification, diagnosis, and targeted management. Front Cardiovasc Med. 2026（CC BY、PMID 42548607、DOI 10.3389/fcvm.2026.1811419、PMC13429502、新規 SRC 候補）。裏づける部分：主候補の総説に、心外膜の冠攣縮性狭心症ではカルシウム拮抗薬が発作予防の第一選択であること、β遮断薬は攣縮を悪化させうるため冠攣縮性狭心症では一般に避けることが明記される。補助候補（Caffè ら、Rev Cardiovasc Med 2026、CC BY）にも、β遮断薬は攣縮の存在下では有害でありうること、日本人のコホートで冠攣縮の頻度が高いことが述べられる。数値の照合：「日本人では欧米人の約3倍」という数値は自由な全文に再掲がなかった（定性的な頻度の高さのみ）。留保：JCS 2018 のクラスI（レベルB）・クラスIII（有害）という割当てと、長時間作用型という指定、約3倍の数値は候補になく、その部分を留保して B'
