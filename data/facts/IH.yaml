- id: IH-026
  domain: IH
  subdomain: 川崎病
  assertion:
    plain_statement_ja: 川崎病の急性期（発症30日未満）の冠動脈病変は、心エコーで測ったZスコアで分類し、2.5以上5未満を小動脈瘤、5以上10未満を中等瘤、10以上を巨大瘤とする。実測値では内径8 mm以上を巨大瘤とする。5歳以上ではZスコアによる判定を優先する。
    condition:
      guideline: JCS/JSCS 2020 川崎病心臓血管後遺症GL
      region: 日本
    differential: 急性期に内径が6 mmを超えると遠隔期に狭窄性病変が増えると報告されている
    common_misconception: 冠動脈病変の大きさは年齢によらず実測値だけで判定する
  provenance:
    source_ref: SRC-213
    source: Fukazawa R, Kobayashi J, Ayusawa M, et al. JCS/JSCS 2020 Guideline on Diagnosis and Management of Cardiovascular Sequelae in Kawasaki Disease. Circ J 2020;84:1348-1407
    doi: 10.1253/circj.CJ-19-1094
    pmid: '32641591'
    pmcid: null
    url: https://doi.org/10.1253/circj.CJ-19-1094
    source_license: © 日本循環器学会（J-STAGE 掲載ページの表示。CC の表示なし。Crossref に license 欄なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ41 2026-11-11）：Musolino A, Marchesi A, Antonelli G, et al. Long-Term Coronary Outcomes and Follow-Up After Kawasaki Disease: Insights from a 25-Year Follow-Up Cohort. J Clin Med. 2026（CC BY、PMID 42652559、DOI 10.3390/jcm15166155、PMC13513250、新規 SRC 候補）。裏づける部分：主候補のコホート研究に AHA 分類として、Z スコア ≥2.5〜<5 を小動脈瘤、≥5〜<10 を中等瘤、≥10 または実測値 ≥8 mm を巨大瘤とする分類が明記され、カードの閾値と一致する。補助候補（Pastor-Villaescusa B, Mandilaras G, Weißer J, et al. Diagnosis of Coronary Artery Aneurysm in a Caucasian Population Cohort: Evaluating the Agreement Between Japanese Criteria. J Clin Med. 2025、PMID 41010782、CC BY）は日本の基準における Z スコア分類（小動脈瘤 2.5〜<5、中等瘤 5〜<10、大動脈瘤は Z ≥10 または実測値 ≥8 mm）を併記する。数値の照合：Z スコアの閾値（2.5・5・10）と実測値 8 mm はカードと一致。留保：「急性期（発症30日未満）」という時期の区切りと、5歳以上では Z スコアによる判定を優先するという運用は JCS/JSCS 固有で、候補にその形では再掲がなく、その部分を留保して B'
