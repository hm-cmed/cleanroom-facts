- id: IH-007
  domain: IH
  subdomain: 冠攣縮性狭心症
  assertion:
    plain_statement_ja: アセチルコリンまたはエルゴノビンによる冠攣縮誘発試験は、心筋虚血の徴候・症状（胸痛と虚血性の心電図変化）を伴って冠動脈が一時的に完全または亜完全に閉塞する（90%を超える狭窄）か、連続する2つ以上の区域に90%のびまん性の収縮が起きた場合を陽性とする。
