- id: IH-001
  domain: IH
  subdomain: 労作性狭心症
  assertion:
    plain_statement_ja: 安定冠動脈疾患が疑われ、検査前確率が中等度以上の患者には、診断とイベントリスク評価のために、冠動脈CT（解剖学的評価）または負荷心筋シンチグラフィ・負荷心臓MRI・負荷心エコー（機能的評価）による非侵襲的画像検査が推奨される（クラスI、レベルA）。
