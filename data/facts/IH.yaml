  assertion:
    plain_statement_ja: 下壁のST上昇型心筋梗塞では右側胸部誘導（特にV4R）を追加記録し、V4Rで1.0 mm（0.1 mV）以上のST上昇があれば右室梗塞と診断できる。標準12誘導で捉えにくい後壁梗塞は、背部誘導（V7〜V9）の連続する2誘導以上で0.5 mm（0.05 mV）以上のST上昇で診断される。
