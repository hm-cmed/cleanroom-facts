  assertion:
    plain_statement_ja: 心筋梗塞後の二次予防では、最大耐用量のストロングスタチンを使う（クラスI、レベルA）。それでもLDLコレステロールが70 mg/dL未満にならない高リスク患者にはエゼチミブを考慮すべきとされる（IIa、B）。心不全の徴候があるか駆出率40%以下ならβ遮断薬とACE阻害薬の長期投与が推奨される（いずれもI、A）。
