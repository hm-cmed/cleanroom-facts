- id: IH-010
  domain: IH
  subdomain: 急性冠症候群
  assertion:
    plain_statement_ja: ST上昇型心筋梗塞の再灌流は発症から120分以内を目標とし、そのために線溶療法を選ぶ場合は医療者との最初の接触（救急隊を含む）から30分以内、PCIを選ぶ場合は90分以内に治療を始めることを目標とする。再灌流療法のできない施設では、到着から転送までの時間を30分以内にすることが目標とされる。
    condition:
      guideline: JCS 2018 急性冠症候群GL（本文）
      region: 日本
    differential: null
    common_misconception: door-to-balloon時間を短くすることだけが目標である
  provenance:
    source_ref: SRC-206
    source: Kimura K, Kimura T, Ishihara M, et al. JCS 2018 Guideline on Diagnosis and Treatment of Acute Coronary Syndrome. Circ J 2019;83:1085-1196
    doi: 10.1253/circj.CJ-19-0133
    pmid: '30930428'
    pmcid: null
    url: https://doi.org/10.1253/circj.CJ-19-0133
    source_license: © 日本循環器学会（J-STAGE 掲載ページの表示。CC の表示なし。Crossref に license 欄なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ41 2026-11-11）：Stolic S, George S, Mbuzi V, et al. Barriers to the Implementation of Acute Coronary Syndrome Guidelines in Healthcare: A Systematic Review. Rev Cardiovasc Med. 2026（CC BY、PMID 42110169、DOI 10.31083/rcm46736、PMC13155982、新規 SRC 候補）。裏づける部分：主候補の系統的レビューに、STEMI のプライマリーPCI は来院後90分以内、転送が120分以内に達成できない場合は線溶療法が推奨されること、線溶の door-to-needle は30分未満を保つことが AHA の推奨として明記される。補助候補（Kwok CS, Potluri R, Sarma J, et al. Pathways of Care for Patients Who Undergo Primary Percutaneous Coronary Intervention for STEMI. Rev Cardiovasc Med. 2026、PMID 41923721、CC BY）には、症状発症から再灌流までの理想は120分未満であること、初回医療接触からデバイスまで直接搬送90分以内・転送120分以内という目標が明記される。数値の照合：120分・90分・30分の数値群は候補と概ね一致するが、起点の定義が異なる（カードは発症・初回医療接触を起点とし、候補は来院起点の記述が中心）。留保：再灌流のできない施設での到着から転送まで（door-in-door-out）30分という目標は候補に再掲がなく、その部分を留保して B'
  uncertainty: 日本のCREDO-Kyoto AMIレジストリでは、door-to-balloon 90分未満と以上で長期予後に差がなかったと引用されている。
