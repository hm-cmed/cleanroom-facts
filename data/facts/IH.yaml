- id: IH-003
  domain: IH
  subdomain: 労作性狭心症
  assertion:
    plain_statement_ja: 安定冠動脈疾患の血行再建は、左主幹部病変で心血管イベントを減らすため（クラスI、レベルB）、非侵襲的画像で広範な虚血がある患者で予後改善のため（I、B）、至適薬物治療でも日常生活を制限する狭心症が残る患者で症状改善のため（I、A）に推奨される。後の2つは共同意思決定にもとづく。
    condition:
      guideline: JCS 2022 安定冠動脈疾患 フォーカスアップデート 表10
      region: 日本
    differential: null
    common_misconception: 安定狭心症はすべてPCIで治療すべきである
  provenance:
    source_ref: SRC-202
    source: Nakano S, Kohsaka S, Chikamori T, et al. JCS 2022 Guideline Focused Update on Diagnosis and Treatment in Patients With Stable Coronary Artery Disease. Circ J 2022;86:882-915
    doi: 10.1253/circj.CJ-21-1041
    pmid: '35283401'
    pmcid: null
    url: https://doi.org/10.1253/circj.CJ-21-1041
    source_license: CC BY-NC-ND 4.0（J-STAGE 掲載ページの表示。Crossref に license 欄なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ41 2026-11-11）：Hirsch A, Baur LHB, Damman P, et al. 2024 European Society of Cardiology guidelines for the management of chronic coronary syndromes: Statement of endorsement from the Netherlands Society of Cardiology. Neth Heart J. 2026（CC BY、PMID 42429920、DOI 10.1007/s12471-026-02059-1、PMC13376111、新規 SRC 候補）。裏づける部分：2024年 ESC 慢性冠症候群ガイドラインの推奨として、至適薬物治療でも難治性の症状がある患者では血行再建の主目的は狭心症症状の緩和であること、選択されたサブグループでは予後改善もありうること、非侵襲的検査で高リスクの解剖・広範な虚血が示される場合は血行再建の検討対象となること、血行再建の戦略は共同意思決定に基づくべきことが明記される。数値の照合：数値なし（該当なし）。留保：左主幹部病変を心血管イベント減少のための適応として特定する推奨と、JCS のクラス・レベルの割当ては候補に再掲がなく、その部分を留保して B'
