    corroboration: 自由に使える資料による裏づけ（OPEN、作り手の調査バッチ41 2026-11-11）：Komaki S, Matsuura Y, Tanaka H, et al. Nitroglycerin use and adverse clinical outcomes in elderly patients with acute coronary syndrome. Open Heart. 2024（CC BY、PMID 38216173、DOI 10.1136/openhrt-2023-002494、PMC10806511、新規 SRC 候補）。裏づける部分：ACC/AHA の推奨として、硝酸薬は著明な低血圧・徐脈・合併した右室梗塞などの禁忌がない限り、ACS の初期治療に投与することが明記される。数値の照合：収縮期血圧90 mmHg未満（または基礎値から30 mmHg以上の低下）、心拍数50/分未満・100/分超という数値の閾値は候補に明示がない。留保：勃起不全治療薬の服用後24時間以内という禁忌も候補になく、その部分を留保して B。禁忌の骨格（右室梗塞・低血圧・徐脈）は裏づけられる
