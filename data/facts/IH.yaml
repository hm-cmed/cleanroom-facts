- id: IH-009
  domain: IH
  subdomain: 急性冠症候群
  assertion:
    plain_statement_ja: 急性冠症候群を疑う症状がある患者には、到着後10分以内に12誘導心電図を記録する（クラスI、レベルC）。診断には心筋トロポニン（IまたはT）を測定し（I、C）、トロポニンが測れる場合はCK-MBやミオグロビンを診断に使うことは推奨されない（III（無益）、A）。
    condition:
      guideline: JCS 2018 急性冠症候群GL 表5・表6
      region: 日本
    differential: 初回の心電図で診断がつかない場合は5〜10分ごとに繰り返し記録する
    common_misconception: トロポニンが正常なら1回の測定で心筋梗塞を否定できる
  provenance:
    source_ref: SRC-206
    source: Kimura K, Kimura T, Ishihara M, et al. JCS 2018 Guideline on Diagnosis and Treatment of Acute Coronary Syndrome. Circ J 2019;83:1085-1196
    doi: 10.1253/circj.CJ-19-0133
    pmid: '30930428'
    pmcid: null
    url: https://doi.org/10.1253/circj.CJ-19-0133
    source_license: © 日本循環器学会（J-STAGE 掲載ページの表示。CC の表示なし。Crossref に license 欄なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ41 2026-11-11）：Stolic S, George S, Mbuzi V, et al. Barriers to the Implementation of Acute Coronary Syndrome Guidelines in Healthcare: A Systematic Review. Rev Cardiovasc Med. 2026（CC BY、PMID 42110169、DOI 10.31083/rcm46736、PMC13155982、新規 SRC 候補）。裏づける部分：主候補の系統的レビューに、ガイドライン上すべての胸痛患者に来院後10分以内に心電図を記録することが推奨される旨が明記される。トロポニンについては、第5版の心筋梗塞の普遍的定義（Mills NL, Newby LK, Zaman S, et al. Fifth Universal Definition of Myocardial Infarction (2026). Glob Heart. 2026、PMID 42666939、DOI 10.5334/gh.1578、CC BY）が、心トロポニン I・T が心筋梗塞診断の優先バイオマーカーであること、高感度でないトロポニンでも特異度・感度の劣る CK-MB より優先されることを明記する。数値の照合：10分という時間は候補と一致。留保：ミオグロビンへの言及と、「トロポニンが測れる場合は CK-MB・ミオグロビンを診断に使うな（III・無益）」という推奨の形、クラス・レベルの割当ては候補に再掲がなく、その部分を留保して B'
