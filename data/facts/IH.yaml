- id: IH-002
  domain: IH
  subdomain: 労作性狭心症
  assertion:
    plain_statement_ja: 冠内圧の評価では、FFRが0.80を超える病変は一般に血行再建の対象とならず、iFRでは0.89がカットオフとして妥当とされる。日本のCVIT-DEFER研究では、FFRの測定で39%の患者の治療方針が変わり、PCIの実施が22%減った。
    condition:
      guideline: JCS 2022 安定冠動脈疾患 フォーカスアップデート
      region: 日本
    differential: null
    common_misconception: 冠動脈造影で狭窄が強く見えれば虚血の評価なしにステントを入れてよい
  provenance:
    source_ref: SRC-202
    source: Nakano S, Kohsaka S, Chikamori T, et al. JCS 2022 Guideline Focused Update on Diagnosis and Treatment in Patients With Stable Coronary Artery Disease. Circ J 2022;86:882-915
    doi: 10.1253/circj.CJ-21-1041
    pmid: '35283401'
    pmcid: null
    url: https://doi.org/10.1253/circj.CJ-21-1041
    source_license: CC BY-NC-ND 4.0（J-STAGE 掲載ページの表示。Crossref に license 欄なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: 自由に使える資料による裏づけ（OPEN、作り手の調査バッチ41 2026-11-11）：Berntorp K, Mohammad MA, Koul S, et al. A Vessel-Specific Analysis of Deferred Lesions Using the Instantaneous Wave-Free Ratio and Fractional Flow Reserve. J Soc Cardiovasc Angiogr Interv. 2025（CC BY、PMID 41040437、DOI 10.1016/j.jscai.2025.103823、PMC12485520、新規 SRC 候補）。裏づける部分：「FFR <0.80 と iFR <0.89 が血行再建の閾値として一般に用いられる」と明記される。補助候補（Lee JM, Shin D, Lee SH, et al. Differential predictability for high-risk plaque characteristics between fractional flow reserve and instantaneous wave-free ratio. Sci Rep. 2023、PMID 37749337、CC BY）も FFR ≤0.80・iFR ≤0.89 をカットオフとして用いる。数値の照合：カットオフ値（FFR 0.80・iFR 0.89）は候補と一致。留保：CVIT-DEFER 研究の数値（FFR 測定で39%の患者の治療方針が変わり、PCI が22%減った）は日本の研究固有で再掲がなく、その部分を留保して B
