- id: IH-004
  domain: IH
  subdomain: 労作性狭心症
  assertion:
    plain_statement_ja: 心筋虚血のある安定冠動脈疾患患者2,287人を対象としたCOURAGE試験では、至適薬物治療にPCIを加えても、死亡または非致死性心筋梗塞は減らなかった（中央値4.6年で19.0%対18.5%、ハザード比1.05）。
    condition:
      region: 米国・カナダ
      study: COURAGE
    differential: null
    common_misconception: 安定狭心症にPCIを行うと心筋梗塞と死亡が減る
  provenance:
    source_ref: SRC-203
    source: Boden WE, O'Rourke RA, Teo KK, et al. Optimal medical therapy with or without PCI for stable coronary disease (COURAGE). N Engl J Med 2007;356:1503-1516
    doi: 10.1056/NEJMoa070829
    pmid: '17387127'
    pmcid: null
    url: https://doi.org/10.1056/NEJMoa070829
    source_license: 出版社の著作物（Crossref に license 欄なし。CC の表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: 自由に使える資料による裏づけ（OPEN、作り手の調査バッチ41 2026-11-11）：Niemierko J, Nicol E, Weir-McCall JR. The role of cardiac imaging in the post-ISCHEMIA world. Br J Radiol. 2025（CC BY、PMID 40272895、DOI 10.1093/bjr/tqaf085、PMC12199363、新規 SRC 候補）。裏づける部分：主候補の総説に、主要評価項目（全死亡と非致死性心筋梗塞の複合）と累積イベント率 19.0%（PCI群）対 18.5%（至適薬物治療群）が明記される。補助候補（Bi L, Geng Y, Wang Y, et al. An updated meta-analysis of optimal medical therapy with or without invasive therapy in patients with stable coronary artery disease. BMC Cardiovasc Disord. 2024、PMID 38961354、CC BY）の表に、COURAGE の症例数 2,287人（PCI 1,149／薬物治療 1,138）、追跡 4.6年、主要評価項目の定義が明記される。数値の照合：イベント率 19.0%・18.5%、症例数 2,287人、追跡の中央値 4.6年はカードと一致（抄録でも全数値の一致を確認）。ハザード比 1.05 は自由な全文に再掲がなかった。留保：ハザード比 1.05 が候補のいずれにも明記されないため A とせず B。ClinicalTrials.gov の COURAGE 登録（NCT00007657）には結果が未掲載（hasResults=false）で、登録では裏づけられない
