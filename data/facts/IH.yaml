    corroboration: 自由に使える資料による裏づけ（OPEN、作り手の調査バッチ41 2026-11-11）：Niemierko J, Nicol E, Weir-McCall JR. The role of cardiac imaging in the post-ISCHEMIA world. Br J Radiol. 2025（CC BY、PMID 40272895、DOI 10.1093/bjr/tqaf085、PMC12199363、新規 SRC 候補）。裏づける部分：低リスクでは追加検査は不要で、中等度から高リスクの検査前確率ではさらなる検査が必要とされ、下流の画像検査として非侵襲的検査が推奨されること、CCTA が ESC・ACC/AHA でレベル1の推奨と位置づけられ機能的検査も推奨されることが明記される。数値の照合：数値なし（該当なし）。留保：JCS 2022 のクラスI・レベルA という割当てと、機能的評価の個別モダリティ（負荷心筋シンチ・負荷心臓MRI・負荷心エコー）の列挙そのものは候補に再掲がなく、その部分を留保して B。候補は ESC・ACC/AHA・NICE の枠組みを扱う総説
