- id: IH-012
  domain: IH
  subdomain: 急性冠症候群
  assertion:
    plain_statement_ja: 心筋虚血による胸部症状にはニトログリセリンの舌下投与またはスプレーを使う（クラスI、レベルC）。ただし、右室梗塞を合併した下壁梗塞、収縮期血圧90 mmHg未満（または基礎値から30 mmHg以上の低下）、高度の徐脈（50/分未満）、頻脈（100/分超）では使ってはならず（III（有害）、C）、勃起不全治療薬の服用後24時間以内も使ってはならない（III（有害）、B）。
