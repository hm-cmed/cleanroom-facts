  assertion:
    plain_statement_ja: 高安動脈炎の病変分布による分類（沼野分類）では、I 型は大動脈弓の分枝、IIa 型は上行大動脈・弓部とその分枝、IIb 型は IIa 型に下行胸部大動脈を加えたもの、III 型は下行胸部大動脈・腹部大動脈・腎動脈、IV 型は腹部大動脈と腎動脈の一方または両方、V 型は IIb 型と IV 型を合わせたものである。
