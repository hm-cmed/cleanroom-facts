- id: VS-026
  domain: VS
  subdomain: Buerger病
  assertion:
    plain_statement_ja: バージャー病（閉塞性血栓血管炎）は四肢、主に下肢の動脈に分節的な閉塞を起こす血管炎で、遊走性静脈炎を伴うことがある。原因は不明だが喫煙との関係が強く、最近の調査では患者の93%に明らかな喫煙歴があった。2019年度の指定難病の受給者証所持者は2,259人である。症状は冷感・しびれ・寒冷時のレイノー現象から、間歇性跛行、安静時痛、潰瘍・壊死へ進む。
