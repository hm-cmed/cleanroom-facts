  assertion:
    plain_statement_ja: 基礎疾患のない一次性レイノー現象は通常15〜25歳で始まり、二次性は30歳以降に始まることが多い。二次性の原因には、全身性エリテマトーデス、強皮症、関節リウマチ、Sjögren 症候群などの自己免疫疾患のほか、甲状腺機能低下症、一部の血液腫瘍、薬剤、喫煙、振動工具の長期使用などがある。重い二次性では指尖の潰瘍や壊死を起こすことがある。
    condition:
