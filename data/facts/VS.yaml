- id: VS-029
  domain: VS
  subdomain: 閉塞性動脈硬化症
  assertion:
    plain_statement_ja: 安静時の足関節上腕血圧比（ABI）は、0.90以下を異常低値、0.91〜0.99を境界域、1.00〜1.40を正常、1.40を超えるものを異常高値とする。0.90以下は主幹動脈の狭窄または閉塞を示す。安静時 ABI によるスクリーニングと、安静時 ABI が正常で間歇性跛行がある場合の運動後 ABI はいずれもクラス I・エビデンスレベル B である。
