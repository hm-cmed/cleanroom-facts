  assertion:
    plain_statement_ja: 無症候性の下行大動脈瘤・胸腹部大動脈瘤では、最大径6.0 cm以上で修復が推奨され、経験豊富な多職種の大動脈センターでは5.5 cmでの修復も妥当とされる（2022年 ACC/AHA ガイドライン）。
    condition:
      region: 米国
      対象: 成人
    differential: null
    common_misconception: null
