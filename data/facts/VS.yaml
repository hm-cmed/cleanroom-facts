- id: VS-051
  domain: VS
  subdomain: リンパ浮腫
  assertion:
    plain_statement_ja: 国内では、リンパ浮腫の複合的理学療法にリンパ浮腫複合的治療料（重症200点、それ以外100点、1日あたり）が算定でき、弾性着衣等は療養費の対象になる。療養費の対象は、悪性腫瘍の手術に伴うリンパ節郭清後の四肢リンパ浮腫と原発性四肢リンパ浮腫で、支給上限（弾性ストッキング28,000円など）と、再購入は6か月以降という定めがある。
    condition:
      region: 日本
      対象: 成人
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-4392
    source: 厚生労働省. 診療報酬点数表 H007-4 リンパ浮腫複合的治療料／弾性着衣等に係る療養費について（保発0327第4号、2020年改正）
    doi: null
    pmid: null
    pmcid: null
    url: null
    source_license: 政府標準利用規約
    legal_basis: B
    source_class: GOV_JP
    corroboration: null
  uncertainty: 点数・支給上限額は診療報酬改定や通知改正で変わりうるため、本カードの値は2026-10-31時点で厚生労働省の公開資料により確認したもので、使用時は最新の点数表・通知で再確認が必要。弾性着衣の上限は品目により異なる（弾性スリーブ16,000円、弾性グローブ15,000円など）。
