    source: Ponte C, Grayson PC, Robson JC, et al. 2022 American College of Rheumatology/EULAR classification criteria for giant cell arteritis. Ann Rheum Dis. 2022;81(12):1647-1653.
    doi: 10.1136/ard-2022-223480
    pmid: '36351706'
    pmcid: null
    url: https://doi.org/10.1136/ard-2022-223480
