- id: VA-007
  domain: VA
  subdomain: Behçet病
  assertion:
    plain_statement_ja: 国内の診断基準（指定難病56、厚生労働省ベーチェット病診断基準2024年小改訂）では、主症状は口腔粘膜のアフタ性潰瘍、皮膚症状、眼のぶどう膜炎、外陰部潰瘍の4つで、経過中に4主症状が出現したものを完全型、3主症状（あるいは2主症状と2副症状）などを不全型とし、腸管・血管・中枢神経の病変を伴う場合を特殊型とする。副症状は関節炎、精巣上体炎、消化器病変、血管病変、中枢神経病変で、HLA-B51 陽性（患者の約60%）は参考所見であり診断に必須ではない。
    condition:
      region: 日本
      対象: 成人
    differential: null
    common_misconception: null
  provenance:
