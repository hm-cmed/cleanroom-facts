- id: VA-001
  domain: VA
  subdomain: 巨細胞性動脈炎
  assertion:
    plain_statement_ja: 2022年 ACR/EULAR 巨細胞性動脈炎分類基準では、診断時の年齢50歳以上が絶対要件で、側頭動脈生検陽性または側頭動脈の halo サインに5点、赤沈50 mm/h以上または CRP 10 mg/L以上に3点、突然の視力障害に3点、肩・頸部の朝のこわばり、顎・舌の跛行、新規の側頭部痛、頭皮の圧痛、側頭動脈の触診異常、画像での両側腋窩動脈病変、大動脈全体の FDG-PET 集積に各2点を配点し、合計6点以上で巨細胞性動脈炎と分類する（検証セットで感度87.0%・特異度94.8%）。
    condition:
      region: 国際
      対象: 成人
    differential: null
    common_misconception: null
  provenance:
