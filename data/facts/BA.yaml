- id: BA-004
  domain: BA
  subdomain: 腸球菌感染症
  assertion:
    plain_statement_ja: 腸球菌は院内感染の多剤耐性菌として最も重要なものの一つで、とくに Enterococcus faecium が新たに問題となっている。抗菌薬が腸内のグラム陰性菌を除去することがバンコマイシン耐性腸球菌の定着を助けることや、病院環境に適応した遺伝的系統（clonal complex 17系統を含む）の存在が示されている。
