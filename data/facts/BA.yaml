    url: https://doi.org/10.1186/s12879-016-2113-y
    source_license: CC BY
    legal_basis: B
    source_class: OPEN
    corroboration: null
  uncertainty: ワクチンの国内制度そのものは呼吸器分野の既存カードの範囲とし、本カードは疾患の疫学と血清型分布に絞った。対象は10都府県の強化サーベイランスで把握された症例である。
