    doi: 10.3389/fmicb.2014.00705
    pmid: '25566219'
    pmcid: PMC4263241
    url: https://doi.org/10.3389/fmicb.2014.00705
    source_license: CC BY（論文ページ末尾のライセンス表示を確認）
    legal_basis: B
