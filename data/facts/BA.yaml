- id: BA-007
  domain: BA
  subdomain: 肺炎球菌感染症
  assertion:
    plain_statement_ja: 日本の成人の侵襲性肺炎球菌感染症について、2013年4月〜2015年3月に10都府県の強化サーベイランスで把握された291例では、年齢中央値は70歳、全体の致命率は20%だった。原因菌の血清型は3型（17%）、19A型（13%）、22F型（10%）の順に多く、PCV13対応型が46%、PPSV23対応型が66%を占めた。
