- id: BA-016
  domain: BA
  subdomain: サルモネラ感染症
  assertion:
    plain_statement_ja: 侵襲性非チフス性サルモネラ感染症は、2010年の世界推計で年間約340万例（範囲 210万〜650万例）とされ、発症率は人口10万人あたり49であった。アフリカで最も高く（10万人あたり227、約190万例）、乳児・幼児と若年成人が中心で、HIV 感染症の患者やマラリアに感染した小児が高リスクである。
