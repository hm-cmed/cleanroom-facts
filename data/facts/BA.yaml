- id: BA-021
  domain: BA
  subdomain: 大腸菌感染症
  assertion:
    plain_statement_ja: 下痢原性大腸菌は少なくとも6つのカテゴリーに分類され、それぞれ異なる病原様式を持つ。毒素原性大腸菌（ETEC）は旅行者下痢、腸管病原性大腸菌（EPEC）は乳児の水様性下痢、腸管凝集性大腸菌（EAEC）は遷延性下痢に関連する。これら全体で、世界の小児下痢の最も一般的な原因の一つと考えられている。
    condition:
      region: 国際
      対象: 一般
    differential: null
    common_misconception: null
  provenance:
