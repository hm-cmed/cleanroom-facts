- id: TH-027
  domain: TH
  subdomain: 骨軟化症（成人）
  assertion:
    plain_statement_ja: ビタミンDの作用不足は、骨折や二次性副甲状腺機能亢進症と並んで、くる病・骨軟化症や低カルシウム血症といった骨・ミネラル異常のリスクを高める。日本におけるビタミンD状態の判定では、血清25-ヒドロキシビタミンDが30 ng/mL以上を充足、20 ng/mL以上30 ng/mL未満を不足、20 ng/mL未満を欠乏とする。成人の骨軟化症の評価では、この判定基準に照らしたビタミンD欠乏の有無が手がかりの一つになる。
