  uncertainty: ガイドライン本文で重症の目安とされる血清カルシウム値の具体的な数値は、抄録では確認できなかったため本カードには書いていない。デノスマブ、静注ビスホスホネート製剤、カルシトニン製剤について、悪性腫瘍に伴う高カルシウム血症に対する国内の承認・保険適用の状況は本調査では確認できていない。PMCIDはPMC未収載のため null とした。
