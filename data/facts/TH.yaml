    doi: 10.1007/s11657-012-0109-9
    pmid: '23203733'
    pmcid: PMC3517709
    url: https://doi.org/10.1007/s11657-012-0109-9
    source_license: Creative Commons Attribution Noncommercial License
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 糖質コルチコイドの用量（プレドニゾロン換算1日5mg以上）と期間（3か月以上）、および長期使用者の約50%という割合は本文の記載から読み取った値である。 この出典は2011年版ガイドラインの要約であり、糖質コルチコイド誘発性骨粗鬆症に特化した最新のリスクスコアによる治療開始基準はこのカードには含めていない。 甲状腺機能亢進症や性腺機能低下症、消化管の吸収不良など、この出典の続発性の章で詳しく扱われていない原因については、このカードでは列挙していない。
