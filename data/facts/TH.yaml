- id: TH-006
  domain: TH
  subdomain: 粘液水腫性昏睡
  assertion:
    plain_statement_ja: 粘液水腫性昏睡は甲状腺機能低下症の最も重い病態で、感染症や甲状腺ホルモン補充の中断などが誘因となり、低体温、意識障害、呼吸抑制、循環不全を呈する。集中治療のもとで甲状腺ホルモンの補充をできるだけ早期に開始し、副腎皮質ステロイドの補充や誘因への対応を併せて行う。
    condition:
      region: 国際
      design: 総説
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-906
    source: 'Mathew V, Misgar RA, Ghosh S, Mukhopadhyay P, Roychowdhury P, Pandit K, Mukhopadhyay S, Chowdhury S. Myxedema Coma: A New Look into an Old Crisis. J Thyroid Res. 2011;2011:493462.'
    doi: 10.4061/2011/493462
    pmid: '21941682'
    pmcid: PMC3175396
    url: https://doi.org/10.4061/2011/493462
    source_license: CC BY 3.0 (http://creativecommons.org/licenses/by/3.0/)
    legal_basis: B
    source_class: OPEN
    corroboration: null
  uncertainty: 出典は総説であり、死亡率の具体的数値は抄録に記載がなかったため主張に含めていない。甲状腺ホルモン製剤（レボチロキシン、リオチロニン）と副腎皮質ステロイドの国内承認・保険適用は、本作業では一次確認を行っていない。
