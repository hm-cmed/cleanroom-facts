- id: TH-001
  domain: TH
  subdomain: Basedow病
  assertion:
    plain_statement_ja: Basedow病はTSH受容体に対する自己抗体が甲状腺を刺激して起こる自己免疫性甲状腺機能亢進症であり、診断は甲状腺中毒症の生化学的確認に、TSH受容体抗体の検出とびまん性甲状腺腫などの臨床所見を組み合わせて行う。
