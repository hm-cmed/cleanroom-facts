- id: TH-025
  domain: TH
  subdomain: 続発性骨粗鬆症
  assertion:
    plain_statement_ja: 続発性骨粗鬆症は、遺伝、生活習慣、閉経、加齢に加えて、他の疾患やその治療が原因となって骨密度が低下し骨質が悪化した状態である。 原因となる疾患には、原発性および続発性の副甲状腺機能亢進症、関節リウマチ、糖尿病や慢性腎臓病などの生活習慣病がある。 治療に伴うものでは糖質コルチコイドと、乳癌や前立腺癌に対する性ホルモン低下療法が重要であり、全身性の糖質コルチコイドをプレドニゾロン換算で1日5mg以上、3か月以上使う場合は骨量の評価と治療の必要性を検討する。 長期に糖質コルチコイドを使う人の約50%が骨粗鬆症になるとされる。 続発性骨粗鬆症は閉経前の女性や男性で比較的多く、原因疾患を治療することで改善しうるため、原発性骨粗鬆症との鑑別が重要である。
    condition:
      region: 日本
      population: 続発性骨粗鬆症が疑われる患者（閉経前女性と男性で相対的に多い）
      study: 日本の骨粗鬆症の予防と治療ガイドライン2011年版の英語エグゼクティブサマリー（続発性骨粗鬆症の章）
    differential: null
    common_misconception: null
  provenance:
