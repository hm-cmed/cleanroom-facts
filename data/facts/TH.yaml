    doi: 10.1507/endocrj.EJ21-0238
    pmid: '34321366'
    pmcid: null
    url: https://doi.org/10.1507/endocrj.EJ21-0238
    source_license: ライセンス表示を確認できず
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 数値は出典の抄録に記載された集計値である。チアマゾールは国内で承認・保険適用のある抗甲状腺薬として用いられているが、本作業では添付文書等による一次確認は行っていない。
