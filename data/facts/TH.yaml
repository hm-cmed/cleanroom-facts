- id: TH-029
  domain: TH
  subdomain: 腫瘍性低リン血症性骨軟化症
  assertion:
    plain_statement_ja: 腫瘍性骨軟化症は、腫瘍が線維芽細胞増殖因子23（FGF23）を過剰に産生することで起こる腫瘍随伴症候群で、腎臓からのリン排泄が進み、低リン血症と骨軟化症をきたす。血液検査では低リン血症に加えてFGF23の高値（または病態にそぐわない正常値）がみられ、1,25-ジヒドロキシビタミンDは低値から低めの正常値を示す。原因腫瘍の主体はリン酸塩排泄性間葉系腫瘍で、約半数の腫瘍にFN1-FGFR1またはFN1-FGF1の融合遺伝子が認められる。腫瘍は小さく緩やかに増大し、全身のどこにでも生じうるため局在診断が難しいが、68Ga標識のDOTA系イメージングが比較的感度がよい。治療の第一選択は腫瘍の外科的切除で、腫瘍が同定できない場合や完全切除できない場合には、ブロスマブを含む薬物療法が選択肢になる。
    condition:
      region: 国際
      study: 腫瘍性骨軟化症に関する包括的総説（2023年）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-935
    source: 'Minisola S, Fukumoto S, Xia W, Corsi A, Colangelo L, Scillitani A, et al. Tumor-induced Osteomalacia: A Comprehensive Review. Endocr Rev. 2023;44(2):323-353.'
    doi: 10.1210/endrev/bnac026
    pmid: '36327295'
    pmcid: null
    url: https://pubmed.ncbi.nlm.nih.gov/36327295/
    source_license: Oxford University Press の standard publication reuse rights（Crossrefのライセンス情報。CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: FGF23の具体的な測定値やカットオフは測定法に依存し、抄録では確認できなかったため本カードには書いていない。ブロスマブおよび併用されるリン製剤・活性型ビタミンD製剤の国内の承認・保険適用の状況は本調査では確認できていない。PMCIDはPMC未収載のため null とした。
