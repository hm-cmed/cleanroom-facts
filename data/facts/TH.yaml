- id: TH-030
  domain: TH
  subdomain: 低カルシウム血症
  assertion:
    plain_statement_ja: 低カルシウム血症では、まず血清カルシウムをアルブミンとあわせて解釈する。基準となるアルブミン40g/Lから1g/Lずれるごとにカルシウムを0.02mmol/L補正して評価し、判断に迷う場合はイオン化カルシウムを直接測る。 原因として最も多いのはビタミンD欠乏であり、副甲状腺機能低下症は甲状腺や副甲状腺の手術後が最も多く、そのほか腎疾患、低マグネシウム血症、副甲状腺ホルモンへの抵抗性（偽性副甲状腺機能低下症）などがある。 原因の切り分けでは副甲状腺ホルモンが中心となり、腎機能が正常で副甲状腺ホルモンが高ければビタミンD欠乏やカルシウム吸収不良が、低ければ副甲状腺機能低下症が示唆される。あわせてリン、マグネシウム、腎機能、25-ヒドロキシビタミンDを測る。 低マグネシウム血症がある場合は、先にマグネシウムを補正しないと低カルシウム血症は改善しにくい。 補正カルシウムが1.9mmol/L未満の場合は緊急の評価と入院の検討が必要で、神経筋の興奮症状がある急性例ではグルコン酸カルシウムの静注が優先される。副甲状腺ホルモンが不足するタイプでは、通常量のビタミンDではなくカルシトリオールやアルファカルシドールが必要になる。
    condition:
      region: 日本国外（英国の総説に基づく。カルシウムの単位と基準範囲は出典の表記に従う）
      population: 成人の低カルシウム血症
      study: 臨床総説（BMJ）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-660
    source: Cooper MS, Gittoes NJL. Diagnosis and management of hypocalcaemia. BMJ. 2008;336(7656):1298–1302
    doi: 10.1136/bmj.39582.589433.BE
    pmid: '18535072'
    pmcid: null
    url: null
    source_license: null
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 血清カルシウムの基準範囲（2.10〜2.60mmol/L）、アルブミン補正の係数（1g/Lあたり0.02mmol/L）、緊急評価の目安（補正カルシウム1.9mmol/L未満）は本文の記載から読み取った値であり、日本の検査基準とは単位や運用が異なる場合がある。 原因ごとの副甲状腺ホルモン・リン・カルシウムの組み合わせは本文の原因表から読み取った内容を文章化したものである。 薬剤名（グルコン酸カルシウム、カルシトリオール、アルファカルシドール）については、この出典の適応に対する国内の承認・保険適用を今回確認していない。 この出典は2008年の総説であり、その後の副甲状腺機能低下症に対するホルモン補充などの新しい治療は含まれない。
