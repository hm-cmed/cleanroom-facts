- id: TH-023
  domain: TH
  subdomain: 骨粗鬆症の診断
  assertion:
    plain_statement_ja: 日本の原発性骨粗鬆症の診断基準（2012年改訂版）では、低骨量を来す他の疾患や続発性骨粗鬆症がないことを前提に、脆弱性骨折があれば骨粗鬆症と診断する。 椎体骨折または大腿骨近位部骨折があれば骨密度にかかわらず診断でき、その他の脆弱性骨折がある場合は骨密度が若年成人平均（YAM）の80%未満で診断する。 脆弱性骨折がない場合は、骨密度がYAMの70%以下または-2.5 SD以下で診断する。 骨密度は原則として腰椎または大腿骨近位部で測り、複数部位で測った場合は低い方の値を採用する。 なお骨密度が-1.0 SD以下で-2.5 SDを超える範囲は低骨量と分類される。
    condition:
      region: 日本
      population: 原発性骨粗鬆症の診断基準（2012年改訂版）の適用対象
      study: 学会合同委員会による診断基準（ガイドライン文書）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-927
    source: 'Soen S, Fukunaga M, Sugimoto T, Sone T, Fujiwara S, Endo N, Gorai I, Shiraki M, Hagino H, Hosoi T, Ohta H, Yoneda T, Tomomitsu T; Japanese Society for Bone and Mineral Research and Japan Osteoporosis Society Joint Review Committee for the Revision of the Diagnostic Criteria for Primary Osteoporosis. Diagnostic criteria for primary osteoporosis: year 2012 revision. J Bone Miner Metab. 2013;31(3):247-257.'
    doi: 10.1007/s00774-013-0447-8
    pmid: '23553500'
    pmcid: null
    url: https://doi.org/10.1007/s00774-013-0447-8
    source_license: © The Japanese Society for Bone and Mineral Research and Springer Japan 2013
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 骨密度のカットオフ値（80%未満、70%以下、-2.5 SD以下、-1.0 SD）は診断基準の表から読み取った値である。 YAMの年齢範囲は腰椎が20〜44歳、大腿骨近位部が20〜29歳と表の脚注に示されている。 この基準は日本の基準であり、海外の診断基準とは骨密度の表し方（YAMに対する割合の併記など）が異なる。 本文がPMCに収載されていないためPMCIDはnullである。
