- id: TH-004
  domain: TH
  subdomain: 甲状腺クリーゼ
  assertion:
    plain_statement_ja: 甲状腺クリーゼは重症の甲状腺中毒症により多臓器不全を来す内分泌緊急症であり、日本の全国調査356例の解析では死亡率は約11%と高く、抗甲状腺薬、無機ヨウ素、副腎皮質ステロイド、β遮断薬を組み合わせた集学的治療が死亡率を改善しうることが示唆された。
    condition:
      region: 日本
      design: 診療ガイドライン（2016年・初版、全国調査に基づく）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-903
    source: Satoh T, Isozaki O, Suzuki A, Wakino S, Iburi T, Tsuboi K, Kanamoto N, Otani H, Furukawa Y, Teramukai S, Akamizu T. 2016 Guidelines for the management of thyroid storm from The Japan Thyroid Association and Japan Endocrine Society (First edition). Endocr J. 2016;63(12):1025-1064.
    doi: 10.1507/endocrj.EJ16-0336
    pmid: '27746415'
    pmcid: null
    url: https://doi.org/10.1507/endocrj.EJ16-0336
    source_license: CC 表示なし（日本甲状腺学会・日本内分泌学会のガイドライン）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 対象例数（356例）と死亡率（約11%）は出典の抄録に記載された日本の全国調査の集計値である。抗甲状腺薬、無機ヨウ素、副腎皮質ステロイド、β遮断薬はいずれも国内で用いられる薬剤だが、本作業では個別の承認・保険適用の一次確認は行っていない。
