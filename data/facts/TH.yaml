- id: TH-019
  domain: TH
  subdomain: 副甲状腺疾患
  assertion:
    plain_statement_ja: 原発性副甲状腺機能亢進症の高カルシウム血症型は、アルブミンで補正した血清カルシウムが高値で、intact PTH が高値またはカルシウム値に対して不適切に正常であることを、少なくとも2週間の間隔をあけた2回の測定で確認して診断する。正常カルシウム型は、補正総カルシウムとイオン化カルシウムが正常で intact PTH が高値であることを3〜6か月の間に少なくとも2回確認し、二次性副甲状腺機能亢進症の原因をすべて除外して診断する。
