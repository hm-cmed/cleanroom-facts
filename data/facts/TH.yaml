- id: TH-024
  domain: TH
  subdomain: 骨粗鬆症の薬物療法
  assertion:
    plain_statement_ja: 骨粗鬆症の薬物療法の目的は脆弱性骨折の予防であり、骨吸収を抑える薬と骨形成を促す薬が柱になる。 日本のガイドラインでは、骨粗鬆症と診断された人に加えて、脆弱性骨折がなく低骨量にとどまる人でも、FRAXによる主要骨粗鬆症性骨折の10年確率が15%を目安に達すれば薬物療法の開始を検討する（この15%の値は75歳未満に適用される）。 基礎治療として、カルシウムは1日700〜800mg、ビタミンDは1日10〜20μgの摂取が推奨される。 薬剤の推奨度では、ビスホスホネートのアレンドロネートとリセドロネートが、骨密度の増加と椎体骨折・非椎体骨折・大腿骨近位部骨折の抑制のいずれでも最も高い推奨度（グレードA）とされた。
    condition:
      region: 日本
      population: 原発性骨粗鬆症（閉経後女性および50歳以上の男性を中心とするガイドラインの対象）
      study: 日本の骨粗鬆症の予防と治療ガイドライン2011年版の英語エグゼクティブサマリー
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-928
    source: Orimo H, Nakamura T, Hosoi T, Iki M, Uenishi K, Endo N, Ohta H, Shiraki M, Sugimoto T, Suzuki T, Soen S, Nishizawa Y, Hagino H, Fukunaga M, Fujiwara S. Japanese 2011 guidelines for prevention and treatment of osteoporosis—executive summary. Arch Osteoporos. 2012;7(1-2):3-20.
    doi: 10.1007/s11657-012-0109-9
    pmid: '23203733'
    pmcid: PMC3517709
    url: https://doi.org/10.1007/s11657-012-0109-9
    source_license: Creative Commons Attribution Noncommercial License
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: FRAXの10年確率15%という治療開始の目安は本文の記載から読み取った値であり、図に示された開始基準の詳細（骨折部位ごとの条件など）はこのカードには含めていない。 薬剤の推奨グレードはガイドラインの表から読み取ったものである。 国内の承認・保険適用については、この出典自体が2011年9月時点で日本の公的医療保険の対象だった薬剤の一覧を示しているが、現在の承認・保険適用の状況を今回あらためて個別には確認していない。 デノスマブやロモソズマブなど、このガイドラインの後に登場した薬剤はこの出典には含まれない。
