- id: TH-032
  domain: TH
  subdomain: ビタミンD代謝異常（欠乏と過剰）
  assertion:
    plain_statement_ja: ビタミンDの状態は血清25-ヒドロキシビタミンDの値で分類され、50 nmol/L超を充足、30〜50 nmol/Lを不足、30 nmol/L未満を欠乏とする。一方、ビタミンD中毒は、高カルシウム血症を呈し、血清25-ヒドロキシビタミンDが250 nmol/Lを超え、高カルシウム尿症と副甲状腺ホルモンの抑制を伴う状態と定義される。欠乏側と過剰側のいずれでも、カルシウム代謝の異常が骨の石灰化障害や高カルシウム血症として現れる。
    condition:
      region: 国際
      study: 栄養性くる病の予防と管理に関する国際コンセンサス文書（2016年）におけるビタミンD状態と中毒の定義
