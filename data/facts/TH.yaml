- id: TH-021
  domain: TH
  subdomain: 副甲状腺疾患
  assertion:
    plain_statement_ja: 慢性副甲状腺機能低下症は、低カルシウム血症があり、intact PTH が検出できないか低値、または不適切に正常であることを、少なくとも2週間の間隔をあけた2回で確認して診断する。術後例では、12か月を超えて持続すれば永続性とみなす。甲状腺全摘後12〜24時間の PTH が10 pg/mL（1.05 pmol/L）を超えていれば、長期の副甲状腺機能低下症になることはほぼない。治療の第一選択はカルシウムと活性型ビタミンD代謝物による従来療法で、血清カルシウムを正常範囲の下半分または正常下限のやや下に保ち、高カルシウム尿症を避けることを目標とし、24時間尿中カルシウムは成人女性で250 mg未満、成人男性で300 mg未満を目安とする。従来療法で不十分な場合に PTH 製剤の使用が検討される。
    condition:
      region: 国際
      population: 慢性副甲状腺機能低下症の患者および甲状腺全摘後の患者
      setting: 第2回国際ワークショップのガイドラインによる診断と管理
    differential: null
    common_misconception: null
