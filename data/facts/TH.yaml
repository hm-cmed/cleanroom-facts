- id: TH-031
  domain: TH
  subdomain: 副甲状腺疾患
  assertion:
    plain_statement_ja: 家族性低カルシウム尿性高カルシウム血症は、カルシウム感知受容体の不活性化変異によりカルシウムと PTH の設定点が右方へ移る遺伝性疾患で、小児期から軽度の高カルシウム血症と腎からのカルシウム排泄の低下を示す。カルシウム・クレアチニンクリアランス比は典型的には0.01未満で、原発性副甲状腺機能亢進症では0.02を超えることが多いが、どちらの疾患でも0.01から0.02の間に入る例があるため、比だけで確定はできない。この疾患では臓器障害はみられず、副甲状腺摘出術では高カルシウム血症は治癒しないため手術は行わないことが原発性副甲状腺機能亢進症との鑑別で重要になる。
    condition:
      region: 国際
      population: PTH 依存性高カルシウム血症の鑑別対象となる患者
      setting: 第5回国際ワークショップのガイドラインをまとめた総説における鑑別診断
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-922
    source: 'Kochman M. Primary hyperparathyroidism: clinical manifestations, diagnosis and evaluation according to the Fifth International Workshop guidelines. Reumatologia. 2023;61(4):256-263'
    doi: 10.5114/reum/170705
    pmid: '37745146'
    pmcid: PMC10515122
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC10515122/
    source_license: Creative Commons Attribution-NonCommercial-ShareAlike 4.0 International (CC BY-NC-SA 4.0)
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: カルシウム・クレアチニンクリアランス比の0.01未満・0.02超という値は出典本文から確認したもので、両疾患で0.01から0.02の重なりがあることは本文にも明記されている。CASR 以外の原因遺伝子ごとの頻度は本カードの出典本文では確認していないため記載していない。
