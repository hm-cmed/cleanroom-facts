- id: TH-003
  domain: TH
  subdomain: 甲状腺機能亢進症
  assertion:
    plain_statement_ja: 米国甲状腺学会の2016年ガイドラインは、Basedow病による甲状腺機能亢進症の治療として放射性ヨウ素内用療法、抗甲状腺薬、手術の3つの選択肢を提示し、併存疾患や患者の希望を踏まえて治療法を選択することを求めている（推奨は計124項目）。
    condition:
      region: 米国
      design: 診療ガイドライン（2016年版）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-902
    source: Ross DS, Burch HB, Cooper DS, Greenlee MC, Laurberg P, Maia AL, Rivkees SA, Samuels M, Sosa JA, Stan MN, Walter MA. 2016 American Thyroid Association Guidelines for Diagnosis and Management of Hyperthyroidism and Other Causes of Thyrotoxicosis. Thyroid. 2016;26(10):1343-1421.
    doi: 10.1089/thy.2016.0229
    pmid: '27521067'
    pmcid: null
    url: https://doi.org/10.1089/thy.2016.0229
    source_license: CC BY 4.0 (https://creativecommons.org/licenses/by/4.0/)
    legal_basis: B
    source_class: OPEN
    corroboration: null
  uncertainty: 本カードは2016年版ガイドラインに基づく米国の推奨であり、日本での治療選択の実態（チアマゾールの薬物療法が中心）とは異なる。抗甲状腺薬の国内承認・保険適用は、本作業では添付文書等による一次確認を行っていない。
