- id: TH-028
  domain: TH
  subdomain: 悪性腫瘍に伴う高カルシウム血症
  assertion:
    plain_statement_ja: 悪性腫瘍に伴う高カルシウム血症は、悪性腫瘍の代謝性合併症の中で最も多いものである。成人の治療では、デノスマブまたは静注ビスホスホネートによる治療が強く推奨される。重症例では、カルシトニンと静注ビスホスホネートまたはデノスマブの併用を初期治療とすることが提案され、ビスホスホネートによる治療にもかかわらず抵抗性または再発を示す場合にはデノスマブの使用が提案される。高カルシウム血症の制御と再発予防には、原疾患である悪性腫瘍自体の治療が重要である。
    condition:
      region: 国際
      study: 成人の悪性腫瘍に伴う高カルシウム血症の治療に関する学会診療ガイドライン（2023年）
