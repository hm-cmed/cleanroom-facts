- id: TH-022
  domain: TH
  subdomain: 副甲状腺疾患
  assertion:
    plain_statement_ja: 高カルシウム血症の鑑別は intact PTH の測定が要点であり、PTH が高値またはカルシウム値に対して不適切に正常であれば原発性副甲状腺機能亢進症などの PTH 依存性の原因を考え、PTH が抑制されていれば PTH 非依存性の原因を探す。PTH が抑制される原因には、骨溶解性転移や腫瘍による PTHrP または活性型ビタミンDの過剰産生を伴う悪性腫瘍に伴う高カルシウム血症のほか、サルコイドーシスや結核などの肉芽腫性疾患による活性型ビタミンD産生がある。悪性腫瘍で PTH 自体が異所性に分泌されることは極めてまれで、多くは PTHrP の分泌による。
