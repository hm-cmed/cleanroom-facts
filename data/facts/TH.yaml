- id: TH-026
  domain: TH
  subdomain: くる病（小児）
  assertion:
    plain_statement_ja: 栄養性くる病は、ビタミンD欠乏やカルシウム摂取不足によって成長板の軟骨細胞の分化と石灰化、および類骨の石灰化が障害される小児の疾患である。診断は病歴、身体所見、生化学検査に基づいて行い、X線所見で確定する。予防には生後から12か月までビタミンD 400 IU/日（10 μg/日）が推奨され、治療ではビタミンDの最小用量として2000 IU/日（50 μg/日）を最低3か月間投与し、年齢や体重にかかわらずカルシウム500 mg/日を食事またはサプリメントで併用する。
