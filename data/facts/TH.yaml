- id: TH-002
  domain: TH
  subdomain: Basedow病
  assertion:
    plain_statement_ja: 日本ではBasedow病に対する抗甲状腺薬としてチアマゾールが第一選択とされ、日本甲状腺学会会員を対象とした実態調査（収集症例11,663例）では、成人症例の74.4%（2,526/3,397例）でチアマゾール15 mgの1日1回投与から開始され、日本甲状腺学会のガイドラインに沿った投与が行われていた。
    condition:
      region: 日本
      design: 学会会員対象の実態調査（2019年9月〜2020年2月受診症例）
    differential: null
    common_misconception: null
  provenance:
