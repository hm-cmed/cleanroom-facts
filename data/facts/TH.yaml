- id: TH-020
  domain: TH
  subdomain: 副甲状腺疾患
  assertion:
    plain_statement_ja: 副甲状腺摘出術は原発性副甲状腺機能亢進症を治癒させうる治療で、症候性では手術が勧められ、無症候性でも次のいずれか1つを満たせば手術が推奨される。血清カルシウムが正常上限を1 mg/dL（0.25 mmol/L）より大きく上回ること、骨密度のTスコアが腰椎・大腿骨・橈骨遠位3分の1のいずれかで-2.5以下であること、椎体骨折があること、eGFRまたはクレアチニンクリアランスが60 mL/min未満であること、腎石灰化または腎結石があること、尿中カルシウム排泄が女性で250 mg/日超・男性で300 mg/日超であること、年齢が50歳未満であること。手術を行わない場合、血清カルシウムを下げる目的ではシナカルセトが、骨密度を上げる目的ではビスホスホネートまたはデノスマブが選択肢となり、両方の目的がある場合は併用も考慮される。
    condition:
      region: 国際
      population: 原発性副甲状腺機能亢進症の成人（手術適応は主に無症候性）
      setting: 第5回国際ワークショップのガイドラインによる手術適応と非手術療法
    differential: null
    common_misconception: null
