- id: AB-112
  domain: AB
  subdomain: 胆道損傷
  assertion:
    plain_statement_ja: 臨床的に問題となる胆道損傷の多くは胆嚢摘出術に伴う医原性損傷である。術中に発見された場合は専門医による修復（肝管空腸吻合など）が原則で、不完全な修復は術後の狭窄や胆管炎を招く。術後に胆汁漏を認めた場合は、まずドレナージと胆道減圧（内視鏡的ステントなど）を行い、炎症が治まってから根治的な修復を行う。
