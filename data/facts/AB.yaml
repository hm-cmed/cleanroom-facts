- id: AB-109
  domain: AB
  subdomain: 肝損傷
  assertion:
    plain_statement_ja: 肝損傷の治療方針を決める軸は解剖学的な重症度ではなく循環動態である。AAST 分類で IV〜V 度の重症例でも、循環動態が安定していれば、手術室・血管造影・輸血の体制が整った施設では非手術的管理（NOM）が選択できる。重症度分類には AAST-OIS と WSES 分類（I〜IV）が併用される。
