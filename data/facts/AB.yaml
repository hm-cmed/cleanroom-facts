- id: AB-104
  domain: AB
  subdomain: 腸管軸捻転症
  assertion:
    plain_statement_ja: 大腸軸捻転症は、過長な腸管が腸間膜を軸に捻転して閉塞と絞扼を来たす疾患である。部位別では S状結腸が60〜75%、盲腸が25〜40%を占め、横行結腸・脾彎曲部は稀である。初期評価では病歴・身体所見・血液検査に加え、安定した症例では腹部単純X線とCTで部位の確定と虚血・穿孔の有無を確認する。腹膜炎・穿孔・ショックを伴う場合は緊急手術が優先される。
    condition:
      region: 国際
      対象: 成人
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-4241
    source: Alavi K, Poylin V, Davids JS, et al. The American Society of Colon and Rectal Surgeons Clinical Practice Guidelines for the Management of Colonic Volvulus and Acute Colonic Pseudo-Obstruction. Dis Colon Rectum. 2021;64(9):1046-1057.
    doi: 10.1097/DCR.0000000000002159
    pmid: '34016826'
    pmcid: null
    url: https://doi.org/10.1097/DCR.0000000000002159
    source_license: CC 表示なし（購読誌）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: ASCRS ガイドライン2021 の大腸軸捻転に関する範囲の記述。同ガイドラインは急性大腸偽性閉塞（ACPO）も対象とするが、本カードでは軸捻転の部分のみを用いた。腸閉塞の総論は既存カードと重ならないよう、軸捻転に特化した。
  curriculum:
    kokushi: 医学各論 Ⅵ-10-A-②（腸管軸捻転症、a）
