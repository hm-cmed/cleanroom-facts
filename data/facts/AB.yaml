- id: AB-113
  domain: AB
  subdomain: 膵損傷
  assertion:
    plain_statement_ja: 膵損傷の治療方針を分けるのは主膵管損傷の有無である。評価では受傷後3〜6時間以降に繰り返し測定するアミラーゼ・リパーゼと造影CTが中心となり、主膵管の評価には MRCP や ERCP を用いる。主膵管損傷のない軽症例では保存的治療やドレナージが管理の中心となる。
