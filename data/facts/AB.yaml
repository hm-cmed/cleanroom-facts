- id: AB-098
  domain: AB
  subdomain: 癌性腹膜炎
  assertion:
    plain_statement_ja: 腹膜播種に伴う大量腹水は、骨盤底から横隔膜下まで連続する腹水と定義される。単純排液では1回あたり1〜3Lが安全域の目安とされる。腹水濾過濃縮再静注法（CART）は1981年から保険適用があるが実施施設は限られ、Denverシャントは多施設報告で症状緩和が83%にみられた一方、DIC・血栓症・感染などのリスクがある。
    condition:
      region: 日本
      対象: 成人
    differential: null
    common_misconception: null
  provenance:
