    plain_statement_ja: 急性腹症の診断で直腸診をルーチンに行う意義は限られている。ただし、排便障害、便の性状の確認、肛門疾患、消化管出血、直腸癌、前立腺癌・前立腺炎が疑われる場合は適応がある。女性の内診（双合診）もルーチンには勧められないが、異所性妊娠や骨盤内炎症性疾患を疑うときは子宮頸部の可動痛や付属器の圧痛が参考になる。
