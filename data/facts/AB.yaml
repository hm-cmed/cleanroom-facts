- id: AB-096
  domain: AB
  subdomain: 横隔膜下・Douglas窩膿瘍
  assertion:
    plain_statement_ja: 手術後や穿孔性腹膜炎の後に残存・再発する局在性腹腔内膿瘍（横隔膜下膿瘍、Douglas窩膿瘍など）は、持続する発熱や炎症反応で疑い、造影CTで診断する。治療の原則は感染源の制御（ソースコントロール）で、画像ガイド下の経皮ドレナージが第一選択となり、抗菌薬は補助的に用いる。ドレナージが不能・無効な場合、多房性の場合、壊死組織を含む場合は外科的ドレナージを検討する。
    condition:
      region: 国際
      対象: 成人
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-157
    source: 'Sartelli M, Chichom-Mefire A, Labricciosa FM, et al. The management of intra-abdominal infections from a global perspective: 2017 WSES guidelines for management of intra-abdominal infections. World J Emerg Surg. 2017;12:29.'
    doi: 10.1186/s13017-017-0141-6
    pmid: '28702076'
    pmcid: PMC5504840
    url: https://doi.org/10.1186/s13017-017-0141-6
    source_license: CC BY 4.0
    legal_basis: B
    source_class: OPEN
    corroboration: null
  uncertainty: WSES 腹腔内感染症ガイドライン2017 の範囲の記述。腹膜炎の総論は既存カードと重ならないよう、局在性膿瘍の発生部位とドレナージの適応に絞った。マスターの SRC-157 は PMID・PMCID が null 登録のため、カード側には PubMed で確認した値を記入した（マスター補完を申し送り）。
