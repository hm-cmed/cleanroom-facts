- id: AB-105
  domain: AB
  subdomain: 腸管軸捻転症
  assertion:
    plain_statement_ja: S状結腸軸捻転では、虚血や穿孔が疑われない場合に内視鏡的減圧（整復）が第一選択である。減圧に成功した後は再発予防のため S状結腸切除を提案し、可能であれば同一入院中に行うことが望ましい。内視鏡整復のみでは再発率が45〜71%と高い。CT の診断陽性率は89%とされる。
    condition:
      region: 国際
      対象: 成人
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-4242
    source: Tian BWCA, Vigutto G, Tan E, et al. WSES consensus guidelines on sigmoid volvulus management. World J Emerg Surg. 2023;18(1):34.
    doi: 10.1186/s13017-023-00502-x
    pmid: '37189134'
    pmcid: PMC10186802
    url: https://doi.org/10.1186/s13017-023-00502-x
    source_license: CC BY 4.0（PMC の表示で確認）
    legal_basis: B
    source_class: OPEN
    corroboration: null
  uncertainty: WSES コンセンサスガイドライン2023 の推奨4（内視鏡的減圧の第一選択）と推奨6（減圧後の切除提案）に基づく。いずれも強い推奨だがエビデンスの質は低い。国内に軸捻転症専用のガイドラインはない。
  curriculum:
    kokushi: 医学各論 Ⅵ-10-A-②（腸管軸捻転症、a）
