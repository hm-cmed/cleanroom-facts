  assertion:
    plain_statement_ja: 腹腔内感染症の治療では、感染源の制御を可能な限り早く完全に行うことが重要で、手術などの処置が遅れたり不十分だったりすると転帰が大きく悪化する。適切な抗菌薬を早く始めることも治療の柱の1つである。世界の多施設研究（WISS）では、腹腔内感染症の全体の死亡率は9.2%だった。
