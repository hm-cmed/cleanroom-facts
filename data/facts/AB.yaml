- id: AB-115
  domain: AB
  subdomain: 横隔膜損傷
  assertion:
    plain_statement_ja: 外傷性横隔膜損傷は、鈍的外傷では大きな裂傷となり、穿通性外傷では小さな裂傷となる。当初は1/3〜2/3が見逃され、数年後に横隔膜ヘルニアや絞扼として発症することがある（急性期・潜伏期・閉塞期の経過をたどる）。診断の標準は胸腹部CTで、全身状態が許せば横隔膜の修復を行うことが強く推奨される。急性期の修復は経腹アプローチで行い、修復後に胸腔ドレーンを留置する。
