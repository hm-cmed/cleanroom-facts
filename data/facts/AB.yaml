- id: AB-043
  domain: AB
  subdomain: 急性腹症の検査
  assertion:
    plain_statement_ja: 急性腹症の多くは単純 CT で診断できる。臓器虚血、血管性病変、急性膵炎の重症度判定、急性胆管炎・胆嚢炎、複雑性虫垂炎などでは単純 CT だけでは評価が難しく、造影 CT が勧められる（強い推奨、エビデンスの確実性 B）。絞扼性腸閉塞による腸管壁内の血腫や、血栓閉塞型の大動脈解離・切迫破裂の大動脈瘤の評価には、単純 CT も併せて撮るのが望ましい。
