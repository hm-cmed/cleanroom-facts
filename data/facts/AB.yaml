  subdomain: 腹壁瘢痕ヘルニア
  assertion:
    plain_statement_ja: 正中切開後の腹壁瘢痕ヘルニアの発生率は高く、14,000例超を含むメタ解析では術後2年時点の加重平均発生率は12.8%であった。危険因子として肥満、創感染、糖尿病、喫煙、閉腹法が挙げられ、修復後の再発率は23〜50%とされる。
