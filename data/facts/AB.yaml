- id: AB-102
  domain: AB
  subdomain: 腹膜偽粘液腫
  assertion:
    plain_statement_ja: 腹膜偽粘液腫の多くは虫垂粘液性腫瘍（低異型度虫垂粘液性腫瘍 LAMN など）の破裂・播種によるもので、粘液性腹水の貯留を来たす。増殖活性は低く遠隔転移は稀だが腹腔内で進行するため、専門施設での完全な腫瘍減量手術（CRS）と腹腔内温熱化学療法（HIPEC）が標準治療とされ、完全減量の程度（CCスコア）が予後を規定する。病理組織の悪性度（低異型度・高異型度・印環細胞成分の有無）が治療方針と予後を左右する。
