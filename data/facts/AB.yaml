- id: AB-003
  domain: AB
  subdomain: 急性腹症の定義と分類
  assertion:
    plain_statement_ja: 日本のガイドラインは、機械的な閉塞を伴うものを「腸閉塞症」、機械的な閉塞がなく腸の蠕動や運動の欠如によるものを「イレウス」として、明確に区別して定義している。日本では両者を区別せずに使ってきた経緯があり、英語の ileus を「腸閉塞」と訳す誤りがしばしばみられる。
