- id: AB-016
  domain: AB
  subdomain: 緊急度の判断と緊急処置
  assertion:
    plain_statement_ja: 短時間で命にかかわる腹痛として、大動脈瘤破裂や大動脈解離による出血があり、敗血症性ショックを起こす急性腹症も速やかな対応が必要である。ショックを伴う腹部中央の激痛では、急性膵炎、腸間膜動脈閉塞症、腹腔内出血、大動脈瘤破裂、大動脈解離、消化管穿孔や腸管壊死、急性冠症候群、異所性妊娠を鑑別する。
