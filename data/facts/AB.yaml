- id: AB-108
  domain: AB
  subdomain: 消化管損傷
  assertion:
    plain_statement_ja: 小腸損傷では可能な限り一期的修復が優先される。結腸損傷では、循環が安定し汚染が軽度な選ばれた症例では一期的吻合が可能であり、高リスク例やダメージコントロール手術の症例ではストーマ造設が安全な選択肢となる。診断の遅延は腹膜炎や敗血症を招くため、不確実な場合は診断的腹腔鏡や開腹をためらわないことが重要である。
