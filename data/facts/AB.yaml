- id: AB-083
  domain: AB
  subdomain: 腹腔内圧上昇と腹部コンパートメント症候群
  assertion:
    plain_statement_ja: 腹腔内圧は膀胱内圧で測るのが標準で、滅菌生理食塩水を最大25 mL 注入し、仰臥位で腹筋の収縮がないことを確かめ、中腋窩線で零点を合わせ、呼気終末に mmHg で表す。腹部灌流圧は平均動脈圧から腹腔内圧を引いて求める。明らかな腹部コンパートメント症候群には減圧開腹術が推奨されている。
