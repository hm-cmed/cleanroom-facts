    source: 'Matsusaki K, Aridome K, Emoto S, et al. Clinical practice guideline for the treatment of malignant ascites: section summary in Clinical Practice Guideline for peritoneal dissemination (2021). Int J Clin Oncol. 2022;27(1):1-6.'
    doi: 10.1007/s10147-021-02077-6
    pmid: '34800177'
    pmcid: PMC8732893
    url: https://doi.org/10.1007/s10147-021-02077-6
    source_license: CC BY 4.0（PMC の表示で確認）
    legal_basis: B
    source_class: OPEN
    corroboration: null
  uncertainty: 定義と数値は『腹膜播種診療ガイドライン 2021年版』の悪性腹水セクション要約（Int J Clin Oncol 2022）の本文で確認した。CART は KM-CART による改良が行われているが、実施できる施設は限られる。
