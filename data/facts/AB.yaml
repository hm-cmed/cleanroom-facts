- id: AB-099
  domain: AB
  subdomain: 癌性腹膜炎
  assertion:
    plain_statement_ja: 胃癌腹膜転移に対する腹腔内パクリタキセル併用療法は、第III相試験（PHOENIX-GC、183例）で全生存期間の中央値が17.7か月対15.2か月と優越性が示されず、確立した標準治療ではない。
