  assertion:
    plain_statement_ja: 急性腹症で腹腔内感染症と診断したら、循環動態が安定していても初期輸液をすぐに始める。輸液はまず末梢静脈路から始め、成人の敗血症性ショックでは中心静脈路の確保を待たずに末梢静脈から昇圧薬を始めて平均血圧を回復させることが勧められている（短期間に限り、肘窩かそれより中枢の静脈を使う）。末梢静脈路がとれなければ、小児・成人とも骨髄輸液を考える。
