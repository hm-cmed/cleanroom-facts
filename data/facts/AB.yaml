- id: AB-095
  domain: AB
  subdomain: 腹壁瘢痕ヘルニア
  assertion:
    plain_statement_ja: 腹壁瘢痕ヘルニアの修復では筋膜の閉鎖が推奨され、メッシュによるブリッジング（欠損を架橋するだけの修復）は避ける。メッシュの使用は再発を減らし、手術アプローチとメッシュの留置位置は欠損の大きさと汚染の有無に応じて選択する。
