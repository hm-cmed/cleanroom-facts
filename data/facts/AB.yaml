- id: AB-107
  domain: AB
  subdomain: 消化管損傷
  assertion:
    plain_statement_ja: 外傷による管腔臓器・腸間膜損傷の頻度は鈍的外傷の約1%、穿通性外傷の約17%とされる。シートベルトサインを認める場合はCT検査と高い臨床的疑いが必要である。管腔外のガスや造影剤の漏出、腸管壁の欠損など特異度の高いCT所見があれば試験開腹に進み、循環動態が保たれた症例で感度の高い所見がある場合は診断的腹腔鏡も選択肢となる。
    condition:
      region: 国際
      対象: 成人
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-4244
    source: 'Smyth L, Bendinelli C, Lee N, et al. WSES guidelines on blunt and penetrating bowel injury: diagnosis, investigations, and treatment. World J Emerg Surg. 2022;17(1):13.'
    doi: 10.1186/s13017-022-00418-y
    pmid: '35246190'
    pmcid: PMC8896237
    url: https://doi.org/10.1186/s13017-022-00418-y
    source_license: CC BY 4.0（PMC の表示で確認）
    legal_basis: B
    source_class: OPEN
    corroboration: null
  uncertainty: WSES 腸管損傷ガイドライン2022 の範囲の記述で、頻度は同ガイドライン本文で確認した。外傷初期診療の総論は作り直さず、管腔臓器損傷の評価に絞った。
