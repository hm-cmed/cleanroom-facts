- id: AB-078
  domain: AB
  subdomain: 急性腸間膜虚血
  assertion:
    plain_statement_ja: 急性腸間膜虚血は、緊急外科入院の0.09〜0.2%とまれだが、年齢とともに増え、死亡率は50%を超える。原因は、上腸間膜動脈の塞栓症が約50%、血栓症が15〜25%、静脈血栓症が5〜15%で、非閉塞性腸間膜虚血（NOMI）は約20%を占める。
