- id: AB-101
  domain: AB
  subdomain: 腹膜中皮腫
  assertion:
    plain_statement_ja: 腹膜中皮腫では、上皮型で播種が限局し全身状態が良好な選ばれた症例に対し、専門施設での腫瘍減量手術（CRS）と腹腔内温熱化学療法（HIPEC）の併用が検討される。切除不能例には胸膜中皮腫に準じた全身化学療法（ペメトレキセドとプラチナ製剤の併用など）が行われる。
    condition:
      region: 国際
      対象: 成人
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-4238
    source: 'Kusamura S, Kepenekian V, Villeneuve L, et al. Peritoneal mesothelioma: PSOGI/EURACAN clinical practice guidelines for diagnosis, treatment and follow-up. Eur J Surg Oncol. 2021;47(1):36-59.'
    doi: 10.1016/j.ejso.2020.02.011
    pmid: '32209311'
    pmcid: null
    url: https://doi.org/10.1016/j.ejso.2020.02.011
    source_license: CC 表示なし（購読誌）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: HIPEC は日本では保険適用外であり、実施は一部の施設における研究レベルの治療にとどまる。ペメトレキセドの国内承認は悪性胸膜中皮腫と非小細胞肺癌であり、腹膜中皮腫への使用は適応外（保険適用外）である。
