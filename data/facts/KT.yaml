  subdomain: 慢性間質性腎炎
  assertion:
    plain_statement_ja: 間質性腎炎では、間質への炎症細胞浸潤が急速に間質の線維化した領域へと移行しうるため、炎症の段階での治療が遅れると慢性の腎障害として残る。急性の薬剤性間質性腎炎が慢性化する経路もこの線維化であり、原因の除去と早期治療が慢性間質性腎炎への進行を防ぐうえで重要である。
