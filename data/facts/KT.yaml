- id: KT-017
  domain: KT
  subdomain: 尿酸腎症
  assertion:
    plain_statement_ja: 尿酸は1日に産生される量の約70%が腎臓から排泄され、産生が排泄を上回ると高尿酸血症になる。高尿酸血症は、炎症、内皮障害、血管平滑筋の増殖、レニン・アンギオテンシン系の活性化を介して慢性腎臓病の発症と進展に関連するとされ、痛風に伴う腎障害の背景になる。
