  provenance:
    source_ref: SRC-2735
    source: Kattamis A, Kwiatkowski JL, Aydinok Y. Thalassaemia. Lancet. 2022;399(10343):2310-2324.
    doi: 10.1016/S0140-6736(22)00536-0
    pmid: '35691301'
    pmcid: null
    url: https://doi.org/10.1016/S0140-6736(22)00536-0
    source_license: Crossref の登録は Elsevier の TDM ライセンスのみ（CC 表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ70 2026-11-15）：Zainab F, Hasan AH, Abid MH, Abid MA. Contemporary Management of Thalassemia: A Perspective on Current Standards and the Emergence of FDA-Approved Oral Therapy. Health Sci Rep. 2026;9(9):e73178（PMID: 42698910、DOI: 10.1002/hsr2.73178、PMCID: PMC13543164、https://pmc.ncbi.nlm.nih.gov/articles/PMC13543164/）。裏づける部分：候補（CC BY 総説）が、サラセミアはグロビン鎖合成の欠陥による遺伝性疾患群で無効造血と慢性貧血を来すこと、治療は定期輸血と鉄キレート療法が中心で同種造血幹細胞移植が適した患者への根治的選択肢であること、輸血に伴う進行性の鉄過剰が管理の中心課題であることを明記し、カードの骨格と一致する。数値の照合：数値なし。留保：「溶血の増加」「鉄恒常性の破綻」の逐語の再掲はない（候補は無効造血・慢性貧血と鉄過剰の枠組みで述べる）。主出典 SRC-2735 は区分訂正あり（UNKNOWN→RESTRICTED、区分訂正の節参照）'
  uncertainty: ルスパテルセプトは米国・EU で β サラセミアに承認されているが、国内では骨髄異形成症候群に伴う貧血の適応のみ確認でき、サラセミアへの国内適応は未確認のため主張に入れていない。
