    doi: 10.1182/blood.2019000944
    pmid: '32702756'
    pmcid: null
    url: https://doi.org/10.1182/blood.2019000944
    source_license: Crossref にライセンス登録なし
    legal_basis: B
    source_class: RESTRICTED
