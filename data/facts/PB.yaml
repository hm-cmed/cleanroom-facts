- id: PB-015
  domain: PB
  subdomain: 白血病
  assertion:
    plain_statement_ja: 小児の急性リンパ性白血病の標準治療は、寛解導入療法、再寛解導入を含む強化療法、維持療法から構成され、年齢、初診時白血球数、中枢神経系・精巣浸潤の有無、免疫学的分類、染色体・遺伝子異常の検査と、寛解後の微小残存病変（MRD）検査によるリスクに応じた層別化治療が行われる。治療成績は向上し、長期生存率は80%を超え、80〜90%の患者で治癒が得られるようになった。
    condition:
      region: 日本
      対象: 小児
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2742
    source: 日本小児血液・がん学会 編. 小児白血病・リンパ腫診療ガイドライン 2016年版. 金原出版. 2016.
    doi: null
    pmid: null
    pmcid: null
    url: null
    source_license: 書籍（CC 表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ70 2026-11-15）：Inaba H, Pui CH. Advances in the Diagnosis and Treatment of Pediatric Acute Lymphoblastic Leukemia. J Clin Med. 2021;10(9):1926（PMID: 33946897、DOI: 10.3390/jcm10091926、PMCID: PMC8124693、https://pmc.ncbi.nlm.nih.gov/articles/PMC8124693/）。裏づける部分：候補（CC BY 総説）が、小児 ALL の化学療法は寛解導入・強化・再寛解導入（遅延強化）・維持（継続）の相から構成されること、年齢・初診時白血球数・細胞遺伝学・ゲノム異常と微小残存病変（MRD）の評価によるリスク層別化に基づいて行われることを明記し、カードの治療構造と一致する。数値の照合：生存率は候補では高所得国で5年生存率90%超。カードの「長期生存率は80%を超え、80〜90%で治癒」とは指標（5年生存率と長期生存・治癒）が異なり、同一数値の再掲ではないが方向は一致する。留保：層別化因子としての中枢神経系・精巣浸潤の有無の明示は候補で確認できなかった。主出典 SRC-2742 は区分訂正あり（UNKNOWN→RESTRICTED、区分訂正の節参照）'
  uncertainty: 日本小児血液・がん学会『小児白血病・リンパ腫診療ガイドライン』2016年版に基づく。同ガイドラインは『小児がん(血液腫瘍・固形腫瘍)診療ガイドライン 2026年版』に統合・改訂されており、2016年版は現行版ではない。数値は2016年版の Web 公開版（2026年10月に公開終了）で確認したもので、2026年版の本文での再照合が必要。 層別化の推奨は2016年版 CQ1 で推奨グレード1A とされている。
