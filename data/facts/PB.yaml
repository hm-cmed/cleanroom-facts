    plain_statement_ja: フィラデルフィア染色体陽性の小児急性リンパ性白血病は、チロシンキナーゼ阻害薬を併用した化学療法が有効で、他の病型とは別個のプロトコールで治療する。1歳未満の乳児の急性リンパ性白血病は KMT2A（MLL）遺伝子再構成を高率に伴うなど生物学的に特徴的で、1歳以上とは別のプロトコールで治療するのが一般的である。
