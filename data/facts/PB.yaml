- id: PB-011
  domain: PB
  subdomain: 赤血球酵素異常症
  assertion:
    plain_statement_ja: ピルビン酸キナーゼ欠損症は、常染色体劣性の解糖系酵素異常で、慢性先天性非球状性溶血性貧血の最も多い原因であり、有病率は10万〜30万人に1人と推定される。臨床像は胎児水腫から生涯輸血を要する例、完全に代償された溶血まで幅広く、2024年に国際専門家ガイドラインとして31の推奨がまとめられた。
    condition:
      region: 国際
      対象: 小児
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2740
    source: 'Al-Samkari H, Shehata N, Lang-Robertson K, et al. Diagnosis and management of pyruvate kinase deficiency: international expert guidelines. Lancet Haematol. 2024;11(3):e228-e239.'
    doi: 10.1016/S2352-3026(23)00377-0
    pmid: '38330977'
    pmcid: null
    url: https://doi.org/10.1016/S2352-3026(23)00377-0
    source_license: Crossref の登録は Elsevier の TDM ライセンス等のみ（CC 表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ70 2026-11-15）：Zhao W, Wang Y, Gao N, Yu W, Liu Z. Global research landscape and thematic transitions in pyruvate kinase deficiency: a decadal bibliometric analysis (2015-2025). Front Med. 2026;13:1865929（PMID: 42422835、DOI: 10.3389/fmed.2026.1865929、PMCID: PMC13342182、https://pmc.ncbi.nlm.nih.gov/articles/PMC13342182/）。裏づける部分：候補（CC BY の文献計量学論文）が、ピルビン酸キナーゼ欠損症は先天性非球状性溶血性貧血の最も多い原因で、有病率は10万〜30万人に1人と推定されることを明記し、2024年の国際専門家ガイドライン（主出典）を引用しており、カードの中核と一致する。Qadah 2026（CC BY）も本症を非球状性溶血性貧血を来す赤血球酵素異常症として分類する。数値の照合：有病率（10万〜30万人に1人）は候補と一致。留保：常染色体劣性・解糖系酵素異常という定義要素、胎児水腫から完全に代償された溶血までの臨床像の幅、「31の推奨」という件数は候補に再掲なし。主出典 SRC-2740 は区分訂正あり（UNKNOWN→RESTRICTED、区分訂正の節参照）'
