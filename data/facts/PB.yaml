- id: PB-002
  domain: PB
  subdomain: ビタミンK欠乏症
  assertion:
    plain_statement_ja: 晩発型のビタミンK欠乏性出血症は生後3〜8週にピークがあり、典型的には頭蓋内出血で発症し、背景に未診断の胆汁うっ滞を伴うことが多い。診断には PIVKA-II の測定が有用で、ビタミンK予防投与が行われない場合の晩発型の発生率は欧州で出生10万あたり4〜7件とされる。
    condition:
      region: 国際
      対象: 乳児
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2732
    source: Shearer MJ. Vitamin K deficiency bleeding (VKDB) in early infancy. Blood Rev. 2009;23(2):49-59.
    doi: 10.1016/j.blre.2008.06.001
    pmid: '18804903'
    pmcid: null
    url: https://doi.org/10.1016/j.blre.2008.06.001
    source_license: Crossref の登録は Elsevier の TDM ライセンスのみ（CC 表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ70 2026-11-15）：Araki S, Shirahata A. Vitamin K Deficiency Bleeding in Infancy. Nutrients. 2020;12(3):780（PMID: 32187975、DOI: 10.3390/nu12030780、PMCID: PMC7146284、https://pmc.ncbi.nlm.nih.gov/articles/PMC7146284/）。裏づける部分：候補（CC BY 総説）が、晩発型は生後2週〜6か月に起こり「3〜8週に発生が増える」こと、主な出血部位として頭蓋内が筆頭に挙がること、背景に胆道閉鎖症などの胆汁うっ滞性疾患が関わること、診断の文脈で PIVKA-II がビタミンK状態の指標として論じられることを明記し、カードの主張と一致する。数値の照合：発生率は候補の国別データ（英国 4.4／出生10万、ドイツ 7.2／出生10万）がカードの「欧州で出生10万あたり4〜7件」を挟む範囲で整合する。留保：PIVKA-II は候補では状態指標・スクリーニングの位置づけで、「診断に有用」という表現は主出典より弱い。主出典 SRC-2732 は区分訂正あり（UNKNOWN→RESTRICTED、区分訂正の節参照）'
  uncertainty: 発生率の数値は欧州の報告に基づくもので、日本の発生率は本出典では確認していない。古典型が生後1週以内に哺乳の遅れ・不足と関連して起こる点も同文献にある。
