- id: PB-005
  domain: PB
  subdomain: サラセミア
  assertion:
    plain_statement_ja: サラセミアはグロビン鎖合成の異常による遺伝性疾患群で、病態の中心はグロビン鎖産生のアンバランスであり、無効造血、溶血の増加、鉄恒常性の破綻を来す。治療は輸血と鉄キレート療法による保存的治療が中心で、根治的治療として同種造血幹細胞移植が適した患者に推奨される。
