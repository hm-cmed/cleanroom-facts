- id: PB-004
  domain: PB
  subdomain: サラセミア
  assertion:
    plain_statement_ja: 輸血依存性サラセミアは生涯にわたるケアを要する病態であり、専門施設での多職種によるフォローアップが必要とされる。Thalassaemia International Federation のガイドラインは2021年に第4版が刊行され、診断・治療・合併症管理・心理社会的課題までを含む。
