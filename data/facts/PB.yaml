  subdomain: 赤血球酵素異常症
  assertion:
    plain_statement_ja: ピルビン酸キナーゼ欠損症は、常染色体劣性の解糖系酵素異常で、慢性先天性非球状性溶血性貧血の最も多い原因であり、有病率は10万〜30万人に1人と推定される。臨床像は胎児水腫から生涯輸血を要する例、完全に代償された溶血まで幅広く、2024年に国際専門家ガイドラインとして31の推奨がまとめられた。
