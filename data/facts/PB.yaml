    plain_statement_ja: 血小板無力症と Bernard-Soulier 症候群では予防的（定期）治療は行わず、管理の中心は高リスク手技の前の予防的対応と非外科的出血イベントへの対応であり、対応は事故や侵襲的手技の種類、出血の程度、血小板不応の有無によってイベントごとに個別化される。女性では月経過多と妊娠の管理が課題となる。
