  subdomain: 悪性リンパ腫
  assertion:
    plain_statement_ja: 非ホジキンリンパ腫は小児で4番目に多い悪性腫瘍で、思春期ではさらに頻度が高い。小児の組織型は Burkitt リンパ腫、びまん性大細胞型 B 細胞リンパ腫、リンパ芽球性リンパ腫、未分化大細胞型リンパ腫など少数の亜型に限られ、成人の病型構成とは大きく異なる。
