  assertion:
    plain_statement_ja: 血小板無力症と Bernard-Soulier 症候群では予防的（定期）治療は行わず、管理の中心は高リスク手技の前の予防的対応と非外科的出血イベントへの対応であり、対応は事故や侵襲的手技の種類、出血の程度、血小板不応の有無によってイベントごとに個別化される。女性では月経過多と妊娠の管理が課題となる。
    condition:
      region: 国際
      対象: 小児
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2741
    source: Grainger JD, Thachil J, Will AM. How we treat the platelet glycoprotein defects; Glanzmann thrombasthenia and Bernard Soulier syndrome in children and adults. Br J Haematol. 2018;182(5):621-632.
    doi: 10.1111/bjh.15409
    pmid: '30117143'
    pmcid: null
    url: https://doi.org/10.1111/bjh.15409
    source_license: Crossref の登録は Wiley の利用条件のみ（CC 表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ70 2026-11-15）：Zibara V, Machin N. Inherited Platelet Disorders During Pregnancy and Delivery: Overview of Management Strategies and Emerging Therapeutic Considerations. Hematol Rep. 2026;18(2):16（PMID: 41874099、DOI: 10.3390/hematolrep18020016、PMCID: PMC13010773、https://pmc.ncbi.nlm.nih.gov/articles/PMC13010773/）。裏づける部分：候補（CC BY 総説）が、先天性血小板異常症（血小板無力症・Bernard-Soulier 症候群を含む）では出血イベントと手技・分娩の場面ごとに止血対応を組み立てること、血小板不応・同種免疫の有無が対応の選択を左右すること、出産は専門施設で多職種の計画のもとで行うこと、妊娠・分娩が管理の課題になることを明記し、カードの管理方針の骨格と一致する。月経過多が両疾患の女性の課題であることは Raheja ら（Res Pract Thromb Haemost. 2026、CC BY、PMC12925065）も再掲し、周術期の予防的対応の実態は Fiore ら 2025（CC BY）が示す。数値の照合：数値なし。留保：「予防的（定期）治療は行わず」という否定の明示は自由全文になく、管理がイベント・手技単位であることとの整合にとどまる。主出典 SRC-2741 は区分訂正あり（UNKNOWN→RESTRICTED、区分訂正の節参照）'
