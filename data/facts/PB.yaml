    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2734
    source: Farmakis D, Porter J, Taher A, Cappellini MD, Angastiniotis M, Eleftheriou A. 2021 Thalassaemia International Federation Guidelines for the Management of Transfusion-dependent Thalassemia. Hemasphere. 2022;6(8):e732.
    doi: 10.1097/HS9.0000000000000732
    pmid: '35928543'
    pmcid: null
    url: https://doi.org/10.1097/HS9.0000000000000732
    source_license: CC BY-NC-ND 4.0（Europe PMC・Crossref で確認）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ70 2026-11-15）：Zainab F, Hasan AH, Abid MH, Abid MA. Contemporary Management of Thalassemia: A Perspective on Current Standards and the Emergence of FDA-Approved Oral Therapy. Health Sci Rep. 2026;9(9):e73178（PMID: 42698910、DOI: 10.1002/hsr2.73178、PMCID: PMC13543164、https://pmc.ncbi.nlm.nih.gov/articles/PMC13543164/）。裏づける部分：候補（CC BY 総説）が、輸血依存性サラセミアは生涯にわたる管理を要する病態で、現在の管理は定期輸血・鉄キレート療法と多職種による支持的ケアからなることを明記し、2021年の Thalassaemia International Federation ガイドライン（主出典）を引用して位置づけており、カードの骨格と一致する。数値の照合：数値なし（ケア体制のカード）。留保：「専門施設でのフォローアップ」という限定と「2021年に第4版」という版の明示は候補に再掲なし。主出典 SRC-2734 の区分は現行 RESTRICTED が正しい（CC BY-NC-ND 4.0 を Crossref・Europe PMC で個別確認）。PMCID の補完候補あり（補完候補の節参照）'
