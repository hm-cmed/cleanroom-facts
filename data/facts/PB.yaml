- id: PB-001
  domain: PB
  subdomain: ビタミンK欠乏症
  assertion:
    plain_statement_ja: ビタミンK欠乏性出血症（VKDB）は、ビタミンK依存性凝固因子（II・VII・IX・X）の活性不足による出血で、ビタミンKの補充により是正されるものと定義され、発症時期により早発型（生後24時間以内）、古典型（生後1〜7日）、晩発型（生後1週以降〜6か月）に分類される。
    condition:
      region: 国際
      対象: 乳児
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2731
    source: Sutor AH, von Kries R, Cornelissen EA, McNinch AW, Andrew M. Vitamin K deficiency bleeding (VKDB) in infancy. ISTH Pediatric/Perinatal Subcommittee. Thromb Haemost. 1999;81(3):456-461.
    doi: 10.1055/s-0037-1614494
    pmid: '10102477'
    pmcid: null
    url: https://doi.org/10.1055/s-0037-1614494
    source_license: Crossref にライセンス登録なし
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ70 2026-11-15）：Araki S, Shirahata A. Vitamin K Deficiency Bleeding in Infancy. Nutrients. 2020;12(3):780（PMID: 32187975、DOI: 10.3390/nu12030780、PMCID: PMC7146284、https://pmc.ncbi.nlm.nih.gov/articles/PMC7146284/）。裏づける部分：候補（CC BY 総説）が、VKDB はビタミンK補充で凝固パラメータが速やかに是正される止血障害であること、発症時期により早発型（生後24時間以内）・古典型・晩発型（生後2〜12週、最長6か月）に分類されることを明記し、カードの定義と分類の骨格と一致する。同じく CC BY の Mirone ら（Int J Mol Sci. 2026、PMC12941253）は、ビタミンK依存性凝固因子（II・VII・IX・X）の活性低下という定義要素をほぼ逐語で再掲する。数値の照合：分類の境界に表記差がある。古典型はカード（ISTH 1999）が生後1〜7日、候補は2〜7日。晩発型の開始はカードが生後1週以降、候補は2週以降。分類の構造そのものは一致する。留保：主出典 SRC-2731 は区分訂正あり（UNKNOWN→RESTRICTED、区分訂正の節参照）'
  uncertainty: ISTH 小児・周産期分科会による定義と分類（1999年）に基づく。病因による特発性と二次性の区別も同文献にあるが、本カードは発症時期による分類に絞った。
  curriculum:
    kokushi: 医学各論 Ⅶ-5-A-①（ビタミンK欠乏症、a）
