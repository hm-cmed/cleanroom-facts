    plain_statement_ja: 胆道閉鎖症などの胆汁うっ滞性疾患は、ビタミンKの吸収不全を介して二次性のビタミンK欠乏性出血症の背景となる。日本の胆道閉鎖症登録研究では、3か月法による予防を行った群ではビタミンK欠乏性出血症の発生がなく、3回法の群より有意に少なかった。
    condition:
      region: 日本
      対象: 乳児
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2736
    source: 'Okubo R, Shirota C, Wada M, et al. Vitamin K deficiency bleeding and optimal prophylaxis methods in biliary atresia: a surveillance study in Japan. Pediatr Int. 2025;67(1):e70075.'
    doi: 10.1111/ped.70075
    pmid: '40390459'
    pmcid: null
    url: https://doi.org/10.1111/ped.70075
    source_license: CC BY-NC-ND 4.0（Europe PMC で確認）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ70 2026-11-15）：Araki S, Shirahata A. Vitamin K Deficiency Bleeding in Infancy. Nutrients. 2020;12(3):780（PMID: 32187975、DOI: 10.3390/nu12030780、PMCID: PMC7146284、https://pmc.ncbi.nlm.nih.gov/articles/PMC7146284/）。裏づける部分：候補（CC BY 総説）が、晩発型 VKDB は主に二次性で背景疾患として胆道閉鎖症・嚢胞性線維症などの胆汁うっ滞を伴う肝疾患が挙がること、母乳栄養と胆汁うっ滞が晩発型 VKDB と密接に関連することを明記し、カードの病態部分（胆汁うっ滞性疾患がビタミンK吸収不全を介して二次性 VKDB の背景となる）と一致する。数値の照合：日本の胆道閉鎖症登録研究の比較結果（3か月法群で VKDB の発生なし、3回法群より有意に少ない、傾向スコアマッチング p=0.029、解析対象289例）は主出典（Okubo ら 2025）固有の結果で、自由全文に再掲なし。留保：主出典 SRC-2736 の区分は現行 RESTRICTED が正しい（CC BY-NC-ND 4.0 を Crossref・Europe PMC で個別確認）。PMCID の補完候補あり（補完候補の節参照）'
