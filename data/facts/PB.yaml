  assertion:
    plain_statement_ja: 小児の Burkitt リンパ腫とびまん性大細胞型 B 細胞リンパ腫の多くは短期間の強力なパルス化学療法で治癒し、リンパ芽球性リンパ腫は白血病に準じた長期間の強力なプロトコールで治療される。未分化大細胞型リンパ腫では無イベント生存率約75%が得られており、小児非ホジキンリンパ腫全体の生存率は80%を超えるまで改善した。
    condition:
      region: 国際
      対象: 小児
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2743
    source: 'Minard-Colin V, Brugières L, Reiter A, et al. Non-Hodgkin Lymphoma in Children and Adolescents: Progress Through Effective Collaboration, Current Knowledge, and Challenges Ahead. J Clin Oncol. 2015;33(27):2963-2974.'
    doi: 10.1200/JCO.2014.59.5827
    pmid: '26304908'
    pmcid: null
    url: https://doi.org/10.1200/JCO.2014.59.5827
    source_license: Crossref にライセンス登録なし
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（GOV_US、作り手の調査バッチ70 2026-11-15）：PDQ Pediatric Treatment Editorial Board. Childhood Non-Hodgkin Lymphoma Treatment (PDQ®): Health Professional Version. National Cancer Institute（NCBI Bookshelf NBK65738）（PMID: 26389181、https://www.ncbi.nlm.nih.gov/books/NBK65738.1/）。裏づける部分：候補（NCI PDQ、米国政府の全文文書）が、リンパ芽球性リンパ腫では白血病に準じた長期の ALL 型治療が優れ、Burkitt リンパ腫では短期間の強力なパルス療法が優れることを明記し、高所得国では小児・思春期の非ホジキンリンパ腫の80%超が5年以上生存することを示す。未分化大細胞型リンパ腫の無イベント生存率約75%は、Mussolin ら（Cancers. 2020、CC BY、PMC7598675）の ALCL99 試験長期結果（2年無イベント生存率が70〜75%の範囲）が再掲する。数値の照合：全体の生存率「80%超」は候補（PDQ）と一致。未分化大細胞型リンパ腫の無イベント生存率は候補（Mussolin ら）では70〜75%の範囲表記で、カードの「約75%」はその上限側に当たる。留保：主出典 SRC-2743 は区分訂正あり（UNKNOWN→RESTRICTED、区分訂正の節参照）。PMCID の補完候補あり（補完候補の節参照）'
