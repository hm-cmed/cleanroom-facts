- id: PB-016
  domain: PB
  subdomain: 白血病
  assertion:
    plain_statement_ja: フィラデルフィア染色体陽性の小児急性リンパ性白血病は、チロシンキナーゼ阻害薬を併用した化学療法が有効で、他の病型とは別個のプロトコールで治療する。1歳未満の乳児の急性リンパ性白血病は KMT2A（MLL）遺伝子再構成を高率に伴うなど生物学的に特徴的で、1歳以上とは別のプロトコールで治療するのが一般的である。
    condition:
      region: 日本
      対象: 小児（乳児を含む）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2742
    source: 日本小児血液・がん学会 編. 小児白血病・リンパ腫診療ガイドライン 2016年版. 金原出版. 2016.
    doi: null
    pmid: null
    pmcid: null
    url: null
    source_license: 書籍（CC 表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ70 2026-11-15）：Inaba H, Pui CH. Advances in the Diagnosis and Treatment of Pediatric Acute Lymphoblastic Leukemia. J Clin Med. 2021;10(9):1926（PMID: 33946897、DOI: 10.3390/jcm10091926、PMCID: PMC8124693、https://pmc.ncbi.nlm.nih.gov/articles/PMC8124693/）。裏づける部分：候補（CC BY 総説）が、フィラデルフィア染色体陽性（BCR/ABL1 陽性）ALL は小児 ALL の約2〜3%を占める独立した病型で、チロシンキナーゼ阻害薬を併用した化学療法で治療されること、乳児 ALL では KMT2A 再構成が約75%を占め生物学的に特徴的で、Interfant 研究のような乳児専用のプロトコールで治療されてきたことを明記し、カードの主張と一致する。数値の照合：乳児 ALL における KMT2A 再構成の割合（候補では約75%）は、カードの「高率に伴う」と整合する。留保：主出典 SRC-2742 は区分訂正あり（UNKNOWN→RESTRICTED、区分訂正の節参照）'
