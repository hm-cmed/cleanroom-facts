- id: PB-017
  domain: PB
  subdomain: 悪性リンパ腫
  assertion:
    plain_statement_ja: 非ホジキンリンパ腫は小児で4番目に多い悪性腫瘍で、思春期ではさらに頻度が高い。小児の組織型は Burkitt リンパ腫、びまん性大細胞型 B 細胞リンパ腫、リンパ芽球性リンパ腫、未分化大細胞型リンパ腫など少数の亜型に限られ、成人の病型構成とは大きく異なる。
    condition:
      region: 国際
      対象: 小児
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2743
    source: 'Minard-Colin V, Brugières L, Reiter A, et al. Non-Hodgkin Lymphoma in Children and Adolescents: Progress Through Effective Collaboration, Current Knowledge, and Challenges Ahead. J Clin Oncol. 2015;33(27):2963-2974.'
    doi: 10.1200/JCO.2014.59.5827
    pmid: '26304908'
    pmcid: null
    url: https://doi.org/10.1200/JCO.2014.59.5827
    source_license: Crossref にライセンス登録なし
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（GOV_US、作り手の調査バッチ70 2026-11-15）：PDQ Pediatric Treatment Editorial Board. Childhood Non-Hodgkin Lymphoma Treatment (PDQ®): Health Professional Version. National Cancer Institute（NCBI Bookshelf NBK65738）（PMID: 26389181、https://www.ncbi.nlm.nih.gov/books/NBK65738.1/）。裏づける部分：候補（NCI PDQ 医療者版、米国政府の全文文書）が、小児非ホジキンリンパ腫は主に3群（成熟B細胞性：Burkitt リンパ腫・びまん性大細胞型B細胞リンパ腫・原発性縦隔B細胞リンパ腫／リンパ芽球性リンパ腫／未分化大細胞型リンパ腫）に分類されること、高所得国で小児がんの約7%を占め2番目の10年（思春期）に最も多いこと、成人とは病型構成・病態が異なることを明記し、カードの骨格と一致する。数値の照合：「小児で4番目に多い悪性腫瘍」という順位そのものは候補に再掲なし（候補はリンパ腫全体（ホジキン＋非ホジキン）が小児悪性腫瘍で3番目、NHL は約7%とする）。留保：主出典 SRC-2743 は区分訂正あり（UNKNOWN→RESTRICTED、区分訂正の節参照）。PMCID の補完候補あり（補完候補の節参照）'
  uncertainty: 2015年の総説に基づく国際的な病型構成で、日本国内の小児リンパ腫の登録統計による裏づけは未確認。小児 Hodgkin リンパ腫に絞った総説級の一次資料は確認できなかったため、本項目は非ホジキンリンパ腫を中心に構成した。
