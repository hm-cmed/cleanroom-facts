    doi: 10.1016/S2352-3026(23)00377-0
    pmid: '38330977'
    pmcid: null
    url: https://doi.org/10.1016/S2352-3026(23)00377-0
    source_license: Crossref の登録は Elsevier の TDM ライセンス等のみ（CC 表示なし）
