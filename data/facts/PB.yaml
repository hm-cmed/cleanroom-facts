    source_class: UNKNOWN
    corroboration: null
  uncertainty: 2015年の総説に基づく国際的な病型構成で、日本国内の小児リンパ腫の登録統計による裏づけは未確認。小児 Hodgkin リンパ腫に絞った総説級の一次資料は確認できなかったため、本項目は非ホジキンリンパ腫を中心に構成した。
