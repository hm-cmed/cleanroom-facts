- id: PB-006
  domain: PB
  subdomain: 新生児出血性疾患
  assertion:
    plain_statement_ja: 新生児期の出血がすべてビタミンK欠乏によるわけではなく、逆にビタミンK欠乏性出血症は生後4週を超えた乳児期にも起こるため、ISTH 小児・周産期分科会は従来の「新生児出血性疾患」という総称に代えて、ビタミンK欠乏性出血症（VKDB）の用語を用いることを提案した。
    condition:
      region: 国際
      対象: 新生児
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2731
    source: Sutor AH, von Kries R, Cornelissen EA, McNinch AW, Andrew M. Vitamin K deficiency bleeding (VKDB) in infancy. ISTH Pediatric/Perinatal Subcommittee. Thromb Haemost. 1999;81(3):456-461.
    doi: 10.1055/s-0037-1614494
    pmid: '10102477'
    pmcid: null
    url: https://doi.org/10.1055/s-0037-1614494
    source_license: Crossref にライセンス登録なし
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ70 2026-11-15）：Araki S, Shirahata A. Vitamin K Deficiency Bleeding in Infancy. Nutrients. 2020;12(3):780（PMID: 32187975、DOI: 10.3390/nu12030780、PMCID: PMC7146284、https://pmc.ncbi.nlm.nih.gov/articles/PMC7146284/）。裏づける部分：候補（CC BY 総説）が、「VKDB という用語は、VKDB が新生児期の後にも起こりうるため、新生児出血性疾患（HDN）という用語に取って代わった」と明記し、カードの用語置き換えの趣旨と一致する。数値の照合：数値なし（用語整理のカード）。留保：置き換えの提案主体が ISTH 小児・周産期分科会である点と、「新生児期の出血のすべてがビタミンK欠乏によるわけではない」という前段は候補に再掲なし。主出典 SRC-2731 は区分訂正あり（UNKNOWN→RESTRICTED、区分訂正の節参照）'
  uncertainty: 新生児の出血性疾患全般（凝固因子欠乏、血小板異常、DIC など）を総論として扱うガイドライン級の一次資料は確認できなかったため、本項目は用語の整理と二次性の原因（PB-007）の範囲に絞った。
