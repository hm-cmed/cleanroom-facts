  subdomain: 異常ヘモグロビン症
  assertion:
    plain_statement_ja: 鎌状赤血球症を持って生まれた新生児は2021年に世界で515,000人と推計され、鎌状赤血球症とともに生きる人の総数は774万人に達する。5歳未満の死亡は2021年に81,100人と推計されており、小児の死亡負担が大きい疾患である。
