- id: PB-010
  domain: PB
  subdomain: 赤血球酵素異常症
  assertion:
    plain_statement_ja: G6PD 欠損症は X 染色体上の G6PD 遺伝子の変異による最もありふれた酵素異常症の一つで、変異を持つ人は世界で約5億人とされる。大半は生涯無症候だが、欠損した赤血球は酸化ストレスに弱く、ソラマメの摂取、プリマキンやラスブリカーゼなどの薬剤、まれに感染を契機に急性溶血性貧血を起こしうる。
    condition:
      region: 国際
      対象: 小児
    differential: null
    common_misconception: null
  provenance:
