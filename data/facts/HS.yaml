    source_ref: SRC-2655
    source: 'Yamakawa K, Okamoto K, Seki Y, et al. Clinical practice guidelines for management of disseminated intravascular coagulation in Japan 2024. Part 1: sepsis. Int J Hematol. 2025;121(5):592-604'
    doi: 10.1007/s12185-024-03896-9
    pmid: '39676120'
    pmcid: null
    url: https://doi.org/10.1007/s12185-024-03896-9
    source_license: Springer（購読制、CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ43 2026-11-11）：Yang H, Ma X, Li X. The diagnosis of DIC: a current overview. Front Med. 2025（CC BY、PMID 39958822、DOI 10.3389/fmed.2025.1502628、PMC11825743、新規 SRC 候補）。裏づける部分：候補（CC BY の総説）に、DIC の診断がスコアリングシステムに基づくことが、旧厚生省（JMHW）基準（1983年）、ISTH 基準（2001年）、JAAM 基準（2006年）、日本血栓止血学会（JSTH）基準、敗血症性凝固障害（SIC）基準（2017年）の一覧とともに明記され、各基準の利点・欠点の比較表もある。カードに挙がる4系統の基準（JSTH・ISTH overt・JAAM・SIC）が併存することは裏づけられる。数値の照合：JSTH 基準の年次は候補が2016年としており、カードとガイドラインの「2017年版」という表記と異なる（基準自体は同一系統のもの。両表記を記録）。留保：「2024年版 DIC 診療ガイドラインは、それぞれの診断特性を理解したうえで適切な基準を選ぶことを推奨する」という推奨文そのものは候補になく、その部分を留保して B。主出典の英語版（Int J Hematol）は Crossref のライセンスが Springer の TDM リンクのみで CC BY ではないことを個別に確認した。バッチ42 で JSH ガイドライン英語版に章ごとの CC BY があったのとは異なり、本ガイドラインの Part 1・2 はいずれも自由利用ではない'
