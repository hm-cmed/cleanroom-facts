- id: HS-019
  domain: HS
  subdomain: 血友病
  assertion:
    plain_statement_ja: 血友病の管理では、低年齢からの凝固因子製剤の定期補充（予防投与）による出血抑制が標準治療と位置づけられ、関節内出血の反復による血友病性関節症の予防が重要な目標となる。
