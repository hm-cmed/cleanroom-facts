      対象: 血友病患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1857
    source: Srivastava A, Santagostino E, Dougall A, et al. WFH Guidelines for the Management of Hemophilia, 3rd edition. Haemophilia. 2020;26 Suppl 6:1-158
    doi: 10.1111/hae.14046
    pmid: '32744769'
    pmcid: null
    url: https://doi.org/10.1111/hae.14046
    source_license: Wiley（CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ43 2026-11-11）：Dushimova Z, Pashimov M, Kaibullayeva J, et al. Therapeutic advances in hemophilia: from molecular innovation to patient-centered global care. Front Med. 2025（CC BY、PMID 41080961、DOI 10.3389/fmed.2025.1618464、PMC12507939、新規 SRC 候補）。裏づける部分：候補（CC BY の総説）に、2歳前に開始する一次予防（定期補充）が血友病性関節症の回避に重要であること（Nilsson らの先駆的研究への言及）、予防投与が長期の関節障害を抑えること、関節内出血の反復が慢性の関節症に進むことが明記され、低年齢からの定期補充による出血抑制と関節症の予防という主張の実質は裏づけられる。数値の照合：該当なし。留保：「標準治療と位置づけられる」という WFH ガイドラインの格付けそのものは候補に再掲がなく、その部分を留保して B。主出典（SRC-1857）は Crossref が Wiley の VoR 利用条件のみで自由利用ではない'
  uncertainty: WFH ガイドライン第3版（2020年）に基づく。同ガイドラインは PubMed に抄録がなく、定期補充の位置づけはリサーチで国内公的資料・企業公表資料による紹介を通じて確認した範囲である。エミシズマブ（第VIII因子の補因子機能を代替する二重特異性抗体）は国内で2018年3月にインヒビター保有の先天性血友病Aで承認され、その後インヒビター非保有例にも適応が拡大され、保険適用がある（中外製薬の公表資料で確認）。
