- id: HS-009
  domain: HS
  subdomain: 溶血性尿毒症症候群<HUS>
  assertion:
    plain_statement_ja: 非典型溶血性尿毒症症候群（aHUS）は、微小血管症性溶血性貧血、血小板減少、急性腎障害の三徴を特徴とする血栓性微小血管症であり、補体制御異常によるものを含む。日本のaHUS診断基準は2013年に日本腎臓学会と日本小児科学会が合同で策定し、2016年の改訂版ガイドでは二次性TMAをaHUSの定義から除く再定義が行われた。
    condition:
      region: 日本
      対象: aHUS患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2648
    source: Kato H, Nangaku M, Hataya H, et al. Clinical guides for atypical hemolytic uremic syndrome in Japan. Clin Exp Nephrol. 2016;20(4):536-543.
    doi: 10.1007/s10157-016-1276-6
    pmid: '27422619'
    pmcid: null
    url: https://doi.org/10.1007/s10157-016-1276-6
    source_license: CC BY 4.0（Crossref の license 欄で確認）
    legal_basis: B
    source_class: OPEN
    corroboration: null
  uncertainty: 国内の現行の診療ガイドは「非典型溶血性尿毒症症候群（aHUS）診療ガイド2023」（書籍、2023年）であり、本カードの出典（2016年）はその前の改訂版ガイドの誌上版であるため、定義の細部は2023年版での再照合が望ましい。腎不全の管理の詳細は腎分野の既存カードを正とし、ここでは扱わない。
