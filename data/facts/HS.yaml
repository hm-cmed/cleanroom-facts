- id: HS-010
  domain: HS
  subdomain: 溶血性尿毒症症候群<HUS>
  assertion:
    plain_statement_ja: aHUSに対するエクリズマブの前向き第2相試験2件（12歳以上、計37例）では、血漿療法に抵抗性の群で26週時点の血小板数が平均73×10⁹/L増加し、透析を受けていた5例中4例が透析を離脱した。血漿交換・輸注を継続していた群では80%がTMAイベントフリー（血小板数の25%を超える低下なし、血漿療法なし、新たな透析導入なし）を達成し、エクリズマブの開始が早いほど推算GFRの改善が大きかった。
    condition:
      region: 国際
      対象: 12歳以上のaHUS患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-638
    source: Legendre CM, Licht C, Muus P, et al. Terminal Complement Inhibitor Eculizumab in Atypical Hemolytic-Uremic Syndrome. N Engl J Med. 2013;368(23):2169-2181.
    doi: 10.1056/NEJMoa1208981
    pmid: '23738544'
    pmcid: null
    url: https://doi.org/10.1056/NEJMoa1208981
    source_license: 出版社の著作物（CC の表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: 自由に使える資料による裏づけ（GOV_US、作り手の調査バッチ43 2026-11-11）：ClinicalTrials.gov 登録・結果レコード NCT00844545（血漿療法抵抗性の成人 aHUS）および NCT00838513（血漿療法継続中の成人 aHUS）（GOV_US、https://clinicaltrials.gov/study/NCT00844545、新規 SRC 候補）。裏づける部分：2試験の登録・結果レコードに、TMA イベントフリー割合、血小板数のベースラインからの変化、完全 TMA 反応などの結果が掲載される。血漿療法を継続していた群（NCT00838513）の TMA イベントフリー割合は80%で、カードと一致する。数値の照合：主張チェック：血漿療法抵抗性群の26週時点の血小板数変化は登録（NCT00844545）が +65.18×10⁹/L で、カードの +73×10⁹/L と異なる（解析集団・推定方法の違いによる可能性。両値を記録）。TMA イベントフリー 80% は登録と一致。留保：透析を受けていた5例中4例が透析を離脱したことと、「エクリズマブの開始が早いほど推算 GFR の改善が大きかった」という解析は登録の評価項目になく、その部分を留保して B。登録の2試験はいずれも成人対象で、カードの「12歳以上、計37例」（原著の2試験の合計）とは対象の枠組みが異なる
  uncertainty: 数値は抄録から読み取った。エクリズマブは国内で2013年9月にaHUSへの適応が承認され、保険適用がある（企業公表資料で確認）。効能は「非典型溶血性尿毒症症候群における血栓性微小血管症の抑制」であり、志賀毒素産生性大腸菌によるHUSは適応に含まれない。本出典は出典マスター登録済みのSRC-638を再利用した。
