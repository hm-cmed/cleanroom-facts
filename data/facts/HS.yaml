- id: HS-031
  domain: HS
  subdomain: 遺伝性出血性末梢血管拡張症<Osler病>
  assertion:
    plain_statement_ja: 遺伝性出血性末梢血管拡張症（Osler病）は常染色体優性遺伝の疾患で、有病率は約5,000人に1人と推定され、血管奇形によって慢性出血、急性出血、シャントによる合併症を来す。国際ガイドライン第2版は、鼻出血、消化管出血、貧血と鉄欠乏、肝血管奇形、小児医療、妊娠と分娩の6領域について計36件の推奨を示している。
    condition:
      region: 国際
      対象: 遺伝性出血性末梢血管拡張症の患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-449
    source: Faughnan ME, Mager JJ, Hetts SW, et al. Second International Guidelines for the Diagnosis and Management of Hereditary Hemorrhagic Telangiectasia. Ann Intern Med. 2020;173(12):989-1001
    doi: 10.7326/M20-1443
    pmid: '32894695'
    pmcid: null
    url: https://doi.org/10.7326/M20-1443
    source_license: 未確認
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 国際ガイドライン第2版（2020年）の抄録で確認した範囲である。診断基準（Curaçao criteria）の文面は抄録の範囲では確認できなかったため主張に入れていない。出典マスターの登録では PMID が未登録だが、リサーチで PubMed 照合により PMID 32894695 を特定した。ガイドラインは妊娠・分娩に関する推奨を含むが、妊娠管理の詳細は Ⅰ の範囲である。
  curriculum:
