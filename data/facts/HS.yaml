- id: HS-006
  domain: HS
  subdomain: 血栓性血小板減少性紫斑病<TTP>
  assertion:
    plain_statement_ja: TTPの診断ではADAMTS13検査（活性、抗ADAMTS13 IgGまたはインヒビター）が重要であり、臨床評価に加えてPLASMICスコアやFrenchスコアによる事前確率の評価が位置づけられている。ADAMTS13検査の結果が判明するまでの時間は、早期診断とカプラシズマブ使用の判断に影響する。
    condition:
      region: 国際
      対象: 患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2645
    source: Zheng XL, Vesely SK, Cataland SR, et al. ISTH guidelines for the diagnosis of thrombotic thrombocytopenic purpura. J Thromb Haemost. 2020;18(10):2486-2495.
    doi: 10.1111/jth.15006
    pmid: '32914582'
    pmcid: PMC8146131
    url: https://doi.org/10.1111/jth.15006
    source_license: 出版社の著作物（CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ43 2026-11-11）：Ismaiel R, AlMaqaleh A, Hussain RH, et al. Advances in rapid ADAMTS13 testing for thrombotic thrombocytopenic purpura: a systematic review of diagnostic assays and clinical prediction tools. Front Med. 2026（CC BY、PMID 42787177、DOI 10.3389/fmed.2026.1896867、PMC13600968、新規 SRC 候補）と Coppo P, Schwarzinger M, Buffet M, et al. Predictive features of severe acquired ADAMTS13 deficiency in idiopathic thrombotic microangiopathies: the French TMA reference center experience. PLoS One. 2010（CC BY、PMID 20436664、DOI 10.1371/journal.pone.0010208、PMC2859048、新規 SRC 候補）。裏づける部分：ADAMTS13 活性10%未満が診断の鍵となる閾値であること、PLASMIC・French・Bentley の臨床予測スコアの位置づけ、検査結果がすぐ得られないことが経験的治療の開始判断に影響すること（French スコアは Coppo 2010 が原典）。留保：ISTH の推奨文そのものとカプラシズマブ使用の判断への影響は載らない。作り手が併記した難病情報センターのページは政府資料でないため使わない'
  uncertainty: ISTHの診断ガイドライン（2020）の推奨は3件で、内容は抄録で確認した。カプラシズマブは後天性TTPの適応で2022年に国内承認され、薬価収載されている（承認番号と企業公表資料で確認）。
