- id: HS-024
  domain: HS
  subdomain: von Willebrand病
  assertion:
    plain_statement_ja: von Willebrand病は最も頻度の高い先天性出血性疾患で、1型と3型は von Willebrand因子の量的欠乏（3型はほぼ完全な欠乏）、2型は質的異常であり、2A・2B・2M・2Nに分かれる。診断では、VWF レベル 0.30 IU/mL 未満は出血の有無にかかわらず1型と診断し、異常出血がある患者では 0.50 IU/mL 未満で1型の診断が確定する。
    condition:
      region: 国際
      対象: von Willebrand病が疑われる患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2658
    source: James PD, Connell NT, Ameer B, et al. ASH ISTH NHF WFH 2021 guidelines on the diagnosis of von Willebrand disease. Blood Adv. 2021;5(1):280-300
    doi: 10.1182/bloodadvances.2020003265
    pmid: '33570651'
    pmcid: PMC7805340
    url: https://doi.org/10.1182/bloodadvances.2020003265
    source_license: Blood Advances の標準ライセンスは CC BY-NC-ND（Crossref の license 欄は空）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ43 2026-11-11）：Casari C, Sadler B, Susen S, Lassila R. Von Willebrand disease: A century of progress. Res Pract Thromb Haemost. 2026（CC BY、PMID 42405180、DOI 10.1016/j.rpth.2026.106790、PMC13330522、新規 SRC 候補）。裏づける部分：候補（CC BY の総説）に、von Willebrand 病が最も頻度の高い先天性（遺伝性）出血性疾患であること、1型と3型は量的欠乏（3型はほぼ完全な欠乏による）、2型は質的異常でサブタイプ A・B・M・N に分かれることが明記され、分類の要素は裏づけられる。数値の照合：候補は 30〜50 IU/dL を「軽度に低い VWF」の範囲として論じるが、カードの診断規則（VWF レベル 0.30 IU/mL 未満は出血の有無にかかわらず1型と診断し、異常出血がある患者では 0.50 IU/mL 未満で1型の診断が確定する）そのものの再掲はない（枠組みの違いを記録）。留保：診断閾値の要素を留保して B。主出典（SRC-2658）は Blood Advances の標準ライセンスが CC BY-NC-ND で、マスターの RESTRICTED と矛盾しない'
  uncertainty: ASH ISTH NHF WFH 2021 診断ガイドラインの推奨6（強い推奨）に基づく数値で、PMC 全文で確認した。頻度は人口の最大約1%とされる。国内では日本血栓止血学会の診療ガイドライン（2021年）があり、その正確な書誌は組み立て時の確認事項である。
