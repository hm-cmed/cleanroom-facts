- id: HS-006
  domain: HS
  subdomain: 血栓性血小板減少性紫斑病<TTP>
  assertion:
    plain_statement_ja: TTPの診断ではADAMTS13検査（活性、抗ADAMTS13 IgGまたはインヒビター）が重要であり、臨床評価に加えてPLASMICスコアやFrenchスコアによる事前確率の評価が位置づけられている。ADAMTS13検査の結果が判明するまでの時間は、早期診断とカプラシズマブ使用の判断に影響する。
    condition:
      region: 国際
      対象: 患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2645
    source: Zheng XL, Vesely SK, Cataland SR, et al. ISTH guidelines for the diagnosis of thrombotic thrombocytopenic purpura. J Thromb Haemost. 2020;18(10):2486-2495.
    doi: 10.1111/jth.15006
    pmid: '32914582'
    pmcid: PMC8146131
    url: https://doi.org/10.1111/jth.15006
    source_license: 出版社の著作物（CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: ISTHの診断ガイドライン（2020）の推奨は3件で、内容は抄録で確認した。カプラシズマブは後天性TTPの適応で2022年に国内承認され、薬価収載されている（承認番号と企業公表資料で確認）。
  curriculum:
