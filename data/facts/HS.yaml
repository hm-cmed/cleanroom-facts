    doi: null
    pmid: null
    pmcid: null
    url: null
    source_license: 厚生労働省の研究事業成果物（政府資料）
    legal_basis: B
    source_class: GOV_JP
    corroboration: null
  uncertainty: 数値は救急領域における止血機能異常症の診療ガイド第2版のITPの章から読み取った。除菌療法は国内の診療ガイドに位置づけられた治療であり、用いる抗菌薬等はいずれも国内承認薬である。
  curriculum:
