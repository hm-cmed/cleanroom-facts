- id: HS-005
  domain: HS
  subdomain: 血栓性血小板減少性紫斑病<TTP>
  assertion:
    plain_statement_ja: 血栓性血小板減少性紫斑病（TTP）はADAMTS13活性の著減（10%未満）によって診断され、日本の指定難病の診断基準もADAMTS13活性10%未満である。抗ADAMTS13自己抗体が陽性の場合は免疫性（後天性）TTP、ADAMTS13の遺伝子異常がある場合は先天性TTP（Upshaw-Schulman症候群）に分類される。古典的な5徴候のみに基づく診断は歴史的な方法である。
    condition:
      region: 日本
      対象: 患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2644
    source: Matsumoto M, Miyakawa Y, Kokame K, et al. Diagnostic and treatment guidelines for thrombotic thrombocytopenic purpura (TTP) in Japan 2023. Int J Hematol. 2023;118(5):529-546.
    doi: 10.1007/s12185-023-03657-0
    pmid: '37689812'
    pmcid: null
    url: https://doi.org/10.1007/s12185-023-03657-0
    source_license: CC BY 4.0（Crossref の license 欄で確認）
    legal_basis: B
    source_class: OPEN
    corroboration: null
  uncertainty: 国内では厚生労働科学研究班の「TTP診療ガイド2026」が最新だが、誌上版の書誌（掲載誌・巻号）を確認できなかったため、本カードは英語版ガイドライン（2023）を出典とした。日本での発症は年間約500人と推計されている（厚生労働省の指定難病ページに記載された研究班の推計）。
  curriculum:
    kokushi: 医学各論 Ⅶ-4-A-②（血栓性血小板減少性紫斑病<TTP>、a）
    core_curriculum: 'PS-02-02-05 (id: JkxnuPc)；PS-02-02-03 (id: JkxnuPU)；TBL-01-00-016 (id: JlvnlZQ)；TBL-02-01-017 (id: JlAKpWk)'
