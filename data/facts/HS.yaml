    plain_statement_ja: 2025年のfocused updateで、免疫性TTPに対する2020年ガイドラインの推奨は変更されなかった。一方、寛解期の先天性TTPに対しては、遺伝子組換えADAMTS13を新鮮凍結血漿より用いることが新たに強く推奨された（中等度の確実性）。
    condition:
      region: 国際
      対象: 寛解期の先天性TTP患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2647
    source: Zheng XL, Al-Housni Z, Cataland SR, et al. 2025 focused update of the 2020 ISTH guidelines for management of thrombotic thrombocytopenic purpura. J Thromb Haemost. 2025;23(11):3711-3732.
    doi: 10.1016/j.jtha.2025.06.002
    pmid: '40533296'
    pmcid: PMC13470878
    url: https://doi.org/10.1016/j.jtha.2025.06.002
    source_license: ライセンス表示を確認できず（購読誌）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: 自由に使える資料による裏づけ（OPEN、作り手の調査バッチ43 2026-11-11）：Rodgers GM. Update in treatment options for congenital and immune thrombotic thrombocytopenic purpura. Front Pharmacol. 2026（CC BY、PMID 42422077、DOI 10.3389/fphar.2026.1841673、PMC13342277、新規 SRC 候補）。裏づける部分：候補の表2は、2025年 focused update（Zheng ら 2025）に基づく免疫性 TTP の推奨として2020年版と同一の強さを掲げており、「推奨は変更されなかった」という要素と整合する。表1と本文には、先天性 TTP では遺伝子組換え ADAMTS13 が優先される治療で、新鮮凍結血漿は遺伝子組換え ADAMTS13 が利用できない場合の選択肢であることが明記される（本文に「the preferred cTTP treatment at this time is rADAMTS13, or FFP infusions if rADAMTS13 is not available (Zheng et al., 2025)」）。数値の照合：該当なし。留保：「強い推奨（中等度の確実性）」という格付けの文言と「寛解期」という限定は候補に明記がなく、その部分を留保して B。ClinicalTrials.gov の遺伝子組換え ADAMTS13 第III相試験（NCT03393975）には結果が掲載されているが、推奨の格付け自体は裏づけない。遺伝子組換え ADAMTS13 製剤（アジンマ®）は日本血栓止血学会誌の総説によれば2024年3月に先天性 TTP の適応で国内承認されており、カードの「国内承認・保険適用は確認できなかった」は PMDA の全文文書で解消できる見込みである（学会誌の記載は判定根拠に使わず、登録時の確認事項として申し送る）
  uncertainty: 遺伝子組換えADAMTS13製剤の国内承認・保険適用の状況は、本リサーチでは確認できなかった。
