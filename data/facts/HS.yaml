- id: HS-002
  domain: HS
  subdomain: 免疫性血小板減少症<ITP>
  assertion:
    plain_statement_ja: 成人の新規診断ITPでは、血小板数3万/µL未満で無症状または軽微な皮膚粘膜出血のみの場合、経過観察より副腎皮質ステロイドの投与が提案される（条件付き推奨）。血小板数3万/µL以上の場合はステロイドを用いない経過観察が強く推奨され、2万/µL未満の場合は入院管理が提案される。プレドニゾンを用いる場合は漸減を含め6週間以内の短期コースとする。
    condition:
      region: 国際
      対象: 成人
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2642
    source: Neunert C, Terrell DR, Arnold DM, et al. American Society of Hematology 2019 guidelines for immune thrombocytopenia. Blood Adv. 2019;3(23):3829-3866.
    doi: 10.1182/bloodadvances.2019000966
    pmid: '31794604'
    pmcid: PMC6963252
    url: https://doi.org/10.1182/bloodadvances.2019000966
    source_license: CC BY-NC-ND（誌の標準ライセンス。個別レコードでは license 表示を確認できず）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 推奨の強さと条件はASH 2019ガイドラインの抄録・本文で確認した表記どおり。初期治療の選択肢としてプレドニゾン0.5〜2.0 mg/kg/日またはデキサメタゾン40 mg/日×4日が本文に記載されている。副腎皮質ステロイドは国内でも成人ITPの第一選択と位置づけられている（成人ITP治療の参照ガイド2019年改訂版で確認）。
  curriculum:
    kokushi: 医学各論 Ⅶ-4-A-①（免疫性血小板減少症<ITP>、a）；医学各論 Ⅰ-1-C-④（免疫性血小板減少症<ITP>、c）
