- id: HS-001
  domain: HS
  subdomain: 免疫性血小板減少症<ITP>
  assertion:
    plain_statement_ja: 免疫性血小板減少症（ITP）に疾患特異的な診断法はなく、他の原因による血小板減少を除外して診断する。病期は、診断後3か月以内を新規診断、3〜12か月を持続性、12か月以上を慢性と分類する。出血症状は一般に血小板数が5万/µL以下で明らかになり、1万/µL以下に減少した例では口腔内出血・鼻出血・下血・血尿などが多い。
    condition:
      region: 日本
      対象: 成人
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2641
    source: 厚生労働科学研究費補助金（エイズ対策政策研究事業）研究班. 救急領域における止血機能異常症の診療ガイド 第2版（ITPの章）. 厚生労働省研究成果公開ページ掲載PDF.
    doi: null
    pmid: null
    pmcid: null
    url: null
    source_license: 厚生労働省の研究事業成果物（政府資料）
    legal_basis: B
    source_class: GOV_JP
    corroboration: null
  uncertainty: 致命的な脳出血は成人では約1%に起こると同ガイドに記載がある。2023年版の国内診断参照ガイドで診断基準に加えられた血漿トロンボポエチン濃度と幼若血小板比率（IPF%）は、2025年末時点で保険収載されていない（同ガイドで確認）。出典は厚生労働省の研究事業成果物のPDFで、DOI・PMIDはない。
  curriculum:
    kokushi: 医学各論 Ⅶ-4-A-①（免疫性血小板減少症<ITP>、a）；医学各論 Ⅰ-1-C-④（免疫性血小板減少症<ITP>、c）
