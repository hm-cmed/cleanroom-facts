  assertion:
    plain_statement_ja: 成人発症の IgA血管炎は小児発症より頻度が低く予後が悪く、成人には検証された診断基準がない。短期予後は主に消化管合併症によって、長期予後は腎障害と慢性腎臓病への進行によって決まる。
    condition:
      region: 国際
      対象: 成人
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2663
    source: Evidence-based guidelines for the diagnosis and management of adult-onset IgA vasculitis. Nat Rev Rheumatol. 2026;22:643-662
    doi: 10.1038/s41584-026-01420-3
    pmid: '42625065'
    pmcid: null
    url: https://doi.org/10.1038/s41584-026-01420-3
    source_license: Springer Nature の TDM ライセンスのみ（CC表示なし）
    legal_basis: B
