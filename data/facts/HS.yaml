    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ43 2026-11-11）：Gage A, Pepper RJ, Marro J, Salama AD, Oni L. IgA Vasculitis Across the Ages: Is It Time for a Precision Medicine Approach? ACR Open Rheumatol. 2025（CC BY、PMID 40937635、DOI 10.1002/acr2.70083、PMC12426765、新規 SRC 候補）。裏づける部分：候補（CC BY の総説）に、小児ではおおむね自己限定的であるのに対し成人では罹患・死亡が有意に多く、より進行した腎疾患の形で現れること、再発率が小児の平均約15%に対し成人で約30%であること、成人の死亡リスクは重症の消化管病変などと関連すること、腎炎（持続する蛋白尿・腎機能障害）がある例で予後が悪く慢性腎臓病のリスク因子となることが明記され、成人発症は頻度が低く予後が悪く、予後が消化管合併症と腎障害・CKD への進行に左右されるという主張の方向は裏づけられる。数値の照合：再発率（成人約30%・小児約15%）は候補の記載で、カードの主張にない周辺の数値であり、主張の数値との食い違いではない。留保：「短期予後は主に消化管合併症によって、長期予後は腎障害と CKD への進行によって決まる」という時間軸での整理と、「成人には検証された診断基準がない」という要素は候補にその形ではなく、その部分を留保して B。主出典（SRC-2663）は Crossref が Springer Nature の TDM のみで自由利用ではない'
