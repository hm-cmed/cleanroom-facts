    corroboration: 自由に使える資料による裏づけ（OPEN、作り手の調査バッチ43 2026-11-11）：Ito T, Thachil J, Asakura H, Levy JH, Iba T. Thrombomodulin in disseminated intravascular coagulation and other critical conditions-a multi-faceted anticoagulant protein. Crit Care. 2019（CC BY、PMID 31416465、DOI 10.1186/s13054-019-2552-0、PMC6694689、新規 SRC 候補）。裏づける部分：候補（CC BY の総説）に、日本で造血器腫瘍または感染症に伴う DIC の234例を対象とした第III相・無作為化・二重盲検・並行群間試験（Saito ら）で、DIC 解消率が遺伝子組換えトロンボモジュリン群 66.1% 対 ヘパリン群 49.9% であったこと、出血関連有害事象が 43.1% 対 56.5% でトロンボモジュリン群で少なかったことが明記される。数値の照合：DIC 解消率 66.1%・49.9% と出血関連有害事象 43.1%・56.5% は候補と一致。候補の表にある 65.6%・45.9% は造血器腫瘍のサブグループの集計で、カードの全体の値とは対象集団が異なる（混同しないよう記録）。留保：対照群が「低用量ヘパリン」であるという修飾は候補に明記がなく、その部分を留保して B とした（バッチ42 LY-017 の扱いに同じ）。ClinicalTrials.gov に本試験の登録はなく（2007年の国内試験）、国内の登録レコードでも裏づけは得られなかった。候補のライセンスは Europe PMC と Crossref の VoR の両方で CC BY 4.0 を確認
