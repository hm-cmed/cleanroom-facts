- id: HS-003
  domain: HS
  subdomain: 免疫性血小板減少症<ITP>
  assertion:
    plain_statement_ja: 成人の原発性ITPでは、初期治療として副腎皮質ステロイド単独よりも、リツキシマブの併用またはトロンボポエチン受容体作動薬の併用が条件付きで推奨される。第一選択のステロイドが無効な場合の第二選択では、トロンボポエチン受容体作動薬が強く推奨され、リツキシマブが条件付きで推奨される。
    condition:
      region: 国際
      対象: 成人
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2643
    source: 'American Society of Hematology 2026 guidelines for immune thrombocytopenia: initial and second-line therapy for adults with primary ITP. Blood Adv. 2026;10:7076-7097.'
    doi: 10.1182/bloodadvances.2026021269
    pmid: '42617047'
    pmcid: null
    url: https://doi.org/10.1182/bloodadvances.2026021269
    source_license: CC BY-NC-ND（誌の標準ライセンス。個別レコードでは license 表示を確認できず）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 本出典はASH 2019年版のfocused updateで、成人の初期治療と第二選択に限る。リツキシマブは2017年に国内で成人ITPへの適応が拡大し、現行の添付文書（PMDA）の効能に「持続性及び慢性免疫性血小板減少症」が含まれ、発症又は診断後6か月以上経過した例が対象であることを確認した。トロンボポエチン受容体作動薬は国内で慢性ITPに承認・保険適用がある（成人ITP治療の参照ガイド2019年改訂版の記載で確認）。
  curriculum:
    kokushi: 医学各論 Ⅶ-4-A-①（免疫性血小板減少症<ITP>、a）；医学各論 Ⅰ-1-C-④（免疫性血小板減少症<ITP>、c）
    core_curriculum: 'PS-02-02-05 (id: JkxnuPc)；TBL-01-00-012 (id: JlvnlYs)；TBL-02-01-014 (id: JlAKpWU)'
