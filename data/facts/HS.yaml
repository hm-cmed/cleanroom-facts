  uncertainty: 厚労省関連の公的資料に基づく記載で、数値はリサーチ段階で同文書の抜粋により確認した（本文の精読は組み立て時の確認事項）。同文書では、第VIII因子は1単位/kg投与で活性が約2%、第IX因子は約0.7〜1%上昇するとされる。凝固因子製剤は国内で承認・保険適用がある。
