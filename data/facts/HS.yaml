- id: HS-032
  domain: HS
  subdomain: 先天性血栓形成傾向
  assertion:
    plain_statement_ja: 遺伝性および後天性の血栓形成傾向（血栓性素因）は静脈血栓塞栓症のリスク因子である。ASH の2023年ガイドラインは血栓性素因検査に関する23件の推奨を示し、一般集団に対する経口避妊薬開始前のスクリーニング検査には強く反対している。
    condition:
      region: 国際
      対象: 静脈血栓塞栓症の患者とその家族
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2664
    source: 'Middeldorp S, Nieuwlaat R, Baumann Kreuziger L, et al. American Society of Hematology 2023 guidelines for management of venous thromboembolism: thrombophilia testing. Blood Adv. 2023;7(22):7101-7138'
    doi: 10.1182/bloodadvances.2023010177
    pmid: '37195076'
    pmcid: PMC10709681
    url: https://doi.org/10.1182/bloodadvances.2023010177
    source_license: CC BY-NC-ND 4.0（抄録の著作権表示で確認）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: ASH 2023 ガイドライン（血栓性素因検査）の抄録で確認した。ガイドライン自身が、推奨の多くはエビデンスの確実性が非常に低いことに言及している。国内での血栓性素因検査の保険適用の詳細は未確認である。
