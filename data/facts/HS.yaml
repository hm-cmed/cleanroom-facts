- id: HS-015
  domain: HS
  subdomain: 二次性血小板減少症
  assertion:
    plain_statement_ja: 薬剤性免疫性血小板減少症（DITP）は、薬剤の存在下でのみ血小板に結合する薬剤依存性抗体による血小板破壊で起こり、通常は新規薬剤の開始後1〜2週間以内に、急性でしばしば重症の血小板減少として発症する。
    condition:
      region: 国際
      対象: 成人
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2652
    source: 'Aster RH, Curtis BR, McFarland JG, Bougie DW. Drug-induced immune thrombocytopenia: pathogenesis, diagnosis, and management. J Thromb Haemost. 2009;7(6):911-918.'
    doi: 10.1111/j.1538-7836.2009.03360.x
    pmid: '19344362'
    pmcid: PMC2935185
    url: https://doi.org/10.1111/j.1538-7836.2009.03360.x
    source_license: 出版社の著作物（CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ43 2026-11-11）：Pan Y, Yao D, Le M, Tan Z, Liu J, Ni J, Chen Z, Ye B. Thrombocytopenia: from physiological homeostasis imbalance to mechanism-driven precision diagnosis and therapy. Front Immunol. 2026（CC BY、DOI 10.3389/fimmu.2026.1907704、PMC13656083、新規 SRC 候補）。裏づける部分：候補（CC BY の総説）に、薬剤がハプテンとして働くか血小板膜糖タンパク質の立体構造を変えることで薬剤依存性抗体が生じ、補体の活性化と網内系による貪食によって血小板が破壊されるという DITP の機序が明記され、カードの機序の要素（薬剤の存在下でのみ血小板に結合する薬剤依存性抗体による血小板破壊）は裏づけられる。数値の照合：該当なし。留保：「通常は新規薬剤の開始後1〜2週間以内に、急性でしばしば重症の血小板減少として発症する」という経過の要素は、自由な全文に一般論としての再掲が確認できず、その部分を留保して B。候補は2026年9月公開で Europe PMC では PMID が未割当のため、PMCID と DOI で同定した。候補のライセンスは Europe PMC の表示と全文のライセンス表示で CC BY 4.0 を確認（Crossref のライセンス欄は本調査時点で未登録）'
  uncertainty: 内容は抄録と本文冒頭で確認した。DITPの原因薬剤は多岐にわたり、薬剤ごとの因果関係の証拠の強さは、公表報告を集めたデータベースで整理されている（本文で確認）。
