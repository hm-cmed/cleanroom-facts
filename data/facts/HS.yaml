- id: HS-034
  domain: HS
  subdomain: 後天性血栓形成傾向
  assertion:
    plain_statement_ja: 2023年 ACR/EULAR 抗リン脂質抗体症候群分類基準は、抗リン脂質抗体検査の陽性（臨床基準の確認から3年以内）を必須の入口基準とし、6つの臨床ドメインと2つの検査ドメインの重み付きスコアで、臨床・検査の両ドメインで各3点以上を集めた場合に抗リン脂質抗体症候群と分類する。検証コホートでの特異度は99%で改訂札幌基準（2006年）の86%より高く、感度は84%で低かった。
    condition:
      region: 国際
      対象: 抗リン脂質抗体症候群が疑われる患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2665
    source: Barbhaiya M, Zuily S, Naden R, et al. 2023 ACR/EULAR antiphospholipid syndrome classification criteria. Ann Rheum Dis. 2023;82(10):1258-1270
    doi: 10.1136/ard-2023-224609
    pmid: '37640450'
    pmcid: null
    url: https://doi.org/10.1136/ard-2023-224609
    source_license: BMJ（© Author(s) 2023、CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 研究・治験のための分類基準であり、診断基準そのものではない。数値は抄録で確認した。全身性エリテマトーデスなど基礎疾患としての側面は Ⅺ の範囲であり、本カードは血栓形成傾向としての側面に限る。
  curriculum:
