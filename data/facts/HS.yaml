    doi: 10.1093/nutrit/nuab061
    pmid: '34472618'
    pmcid: PMC8907489
    url: https://doi.org/10.1093/nutrit/nuab061
    source_license: CC BY-NC-ND 4.0（Crossref の license 欄で確認）
