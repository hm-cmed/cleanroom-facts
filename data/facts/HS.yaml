    source: 'Saito H, Maruyama I, Shimazaki S, et al. Efficacy and safety of recombinant human soluble thrombomodulin (ART-123) in disseminated intravascular coagulation: results of a phase III, randomized, double-blind clinical trial. J Thromb Haemost. 2007;5(1):31-41'
    doi: 10.1111/j.1538-7836.2006.02267.x
    pmid: '17059423'
