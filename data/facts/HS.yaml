- id: HS-004
  domain: HS
  subdomain: 免疫性血小板減少症<ITP>
  assertion:
    plain_statement_ja: 成人のITPでHelicobacter pylori感染があれば除菌療法を行い、約半数の症例で血小板数の増加が得られる。除菌で血小板数が2〜3万/µL以上に回復しない場合に副腎皮質ステロイドを開始する。治療目標は血小板数の正常化ではなく、重篤な出血を予防できる血小板数（通常3万/µL以上）の維持である。
    condition:
      region: 日本
      対象: 成人
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2641
    source: 厚生労働科学研究費補助金（エイズ対策政策研究事業）研究班. 救急領域における止血機能異常症の診療ガイド 第2版（ITPの章）. 厚生労働省研究成果公開ページ掲載PDF.
    doi: null
    pmid: null
    pmcid: null
    url: null
    source_license: 厚生労働省の研究事業成果物（政府資料）
    legal_basis: B
    source_class: GOV_JP
    corroboration: null
  uncertainty: 数値は救急領域における止血機能異常症の診療ガイド第2版のITPの章から読み取った。除菌療法は国内の診療ガイドに位置づけられた治療であり、用いる抗菌薬等はいずれも国内承認薬である。
  curriculum:
    kokushi: 医学各論 Ⅶ-4-A-①（免疫性血小板減少症<ITP>、a）；医学各論 Ⅰ-1-C-④（免疫性血小板減少症<ITP>、c）
