  uncertainty: 総説（Nutrition Reviews 2022）に基づく総論の範囲に限る。成人のビタミンK欠乏症に絞ったガイドライン級の一次資料はリサーチで確定できず、背景疾患（吸収障害、肝胆道疾患、抗菌薬使用など）別の詳細は本リサーチでは未確認のため主張に入れていない。小児・新生児のビタミンK欠乏性出血は第41回 PB の範囲であり、本カードは成人の欠乏症の総論である。ビタミンK製剤は国内で承認・保険適用のある薬剤である。
