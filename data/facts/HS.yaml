- id: HS-034
  domain: HS
  subdomain: 後天性血栓形成傾向
  assertion:
    plain_statement_ja: 2023年 ACR/EULAR 抗リン脂質抗体症候群分類基準は、抗リン脂質抗体検査の陽性（臨床基準の確認から3年以内）を必須の入口基準とし、6つの臨床ドメインと2つの検査ドメインの重み付きスコアで、臨床・検査の両ドメインで各3点以上を集めた場合に抗リン脂質抗体症候群と分類する。検証コホートでの特異度は99%で改訂札幌基準（2006年）の86%より高く、感度は84%で低かった。
    condition:
      region: 国際
      対象: 抗リン脂質抗体症候群が疑われる患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2665
    source: Barbhaiya M, Zuily S, Naden R, et al. 2023 ACR/EULAR antiphospholipid syndrome classification criteria. Ann Rheum Dis. 2023;82(10):1258-1270
    doi: 10.1136/ard-2023-224609
    pmid: '37640450'
    pmcid: null
    url: https://doi.org/10.1136/ard-2023-224609
    source_license: BMJ（© Author(s) 2023、CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: 自由に使える資料による裏づけ（OPEN、作り手の調査バッチ43 2026-11-11）：Stańczewska A, Szewczyk-Golec K, Hołyńska-Iwan I. Antiphospholipid Syndrome-Diagnostic and Methodologic Approach. Metabolites. 2025（CC BY、PMID 40863119、DOI 10.3390/metabo15080500、PMC12388502、新規 SRC 候補）。裏づける部分：候補（CC BY の総説）に、2023年 ACR/EULAR 分類基準の入口基準（文書化された臨床基準を少なくとも1つ満たし、その確認から3年以内に抗リン脂質抗体検査が陽性であること）が基準の図の形で明記され、臨床ドメイン（D1〜D6 の6つ）と検査ドメインの重み付きスコアで、臨床・検査の両ドメインで各3点以上を集めた場合に抗リン脂質抗体症候群と分類することが示される。検証での特異度99%・感度84%も本文に明記される（「99% specificity and 84% sensitivity」）。数値の照合：特異度99%・感度84% は候補と一致。改訂札幌基準（2006年）の特異度86%という比較値は候補になく、その部分は裏づけられていない（両値のうち片方のみ確認）。留保：改訂札幌基準との比較の要素を留保して B。本カードの主張が研究・治験のための分類基準であって診断基準そのものではない点は、カードの uncertainty の記載どおり。候補のライセンスは Europe PMC と Crossref の VoR の両方で CC BY 4.0 を確認
  uncertainty: 研究・治験のための分類基準であり、診断基準そのものではない。数値は抄録で確認した。全身性エリテマトーデスなど基礎疾患としての側面は Ⅺ の範囲であり、本カードは血栓形成傾向としての側面に限る。
