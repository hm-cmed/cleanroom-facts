    pmid: '31747214'
    pmcid: null
    url: https://www.ncbi.nlm.nih.gov/books/NBK549807/
    source_license: © StatPearls Publishing LLC（CCライセンス表示を確認できず）
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 出典は StatPearls の章であり、DOI は付与されていない（PubMed の Bookshelf レコードで確認）。ライセンス表示は確認できなかった。関連する薬剤として出典が挙げる利尿薬、シメチジン、パクリタキセルなどの国内承認・保険適用は未確認。内容は抄録で確認した範囲に限った。
