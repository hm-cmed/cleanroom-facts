    source_license: ライセンス表示を確認できず
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 本カードに名前の出る薬剤（プレドニゾロン、シクロスポリン、免疫グロブリン製剤など）の重症薬疹に対する国内の承認・保険適用は未確認。推奨はインドの診療環境に合わせて作られたもので、日本の診療方針と異なる場合がある。用量はガイドラインの推奨文（抄録）から読み取った。
