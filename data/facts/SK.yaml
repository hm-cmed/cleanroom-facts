- id: SK-026
  domain: SK
  subdomain: 血栓性静脈炎
  assertion:
    plain_statement_ja: 下肢の表在性静脈血栓症（血栓性静脈炎）は、表在静脈に血栓ができる疾患である。急性で症候性の下肢表在性静脈血栓症の患者3,002人を対象とした二重盲検のランダム化比較試験（CALISTO）では、フォンダパリヌクス2.5 mgを1日1回45日間皮下投与した群で、主要評価項目（全死因死亡、症候性肺塞栓症、症候性深部静脈血栓症、大伏在静脈接合部への症候性の進展、表在性静脈血栓症の症候性再発の複合）の発生は0.9%で、プラセボ群の5.9%より少なかった（相対リスク減少85%）。肺塞栓症または深部静脈血栓症の発生は0.2%対1.3%で、大出血は両群とも1人であった。
    condition:
      region: 国際
      study: 下肢の急性症候性表在性静脈血栓症を対象とした二重盲検ランダム化比較試験（CALISTO、3,002人）
    differential: null
