    source: 'Tramontana M, Hansel K, Bianchi L, Sensini C, et al. Advancing the understanding of allergic contact dermatitis: from pathophysiology to novel therapeutic approaches. Frontiers in Medicine. 2023;10:1184289.'
    doi: 10.3389/fmed.2023.1184289
    pmid: '37283623'
    pmcid: PMC10239928
    url: https://doi.org/10.3389/fmed.2023.1184289
    source_license: CC BY 4.0
    legal_basis: B
    source_class: OPEN
    corroboration: null
  uncertainty: 陽性率18.1%は出典の本文で確認した。ICDRGの判定基準は出典の表に示されたものであり、表から読み取りにあたる。パッチテストの具体的な貼付・判定の手順の細目は出典で確認した範囲に限った。検査に用いるアレルゲン製剤の国内承認・保険適用は未確認。
