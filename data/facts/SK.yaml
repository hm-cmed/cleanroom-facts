- id: SK-023
  domain: SK
  subdomain: 薬剤性過敏症症候群
  assertion:
    plain_statement_ja: 薬剤性過敏症症候群（DiHS）は、好酸球増多と全身症状を伴う薬物反応（DRESS）と同一の疾患概念で、重症薬疹の一つである。病態にはヘルペスウイルスの再活性化が関わり、その評価は診断や重症度の判定に用いられるようになっている。経過では、サイトメガロウイルス感染症のような致死的な合併症や、回復した後の自己免疫疾患の発症が問題になるため、重症度を評価し予後を予測するためのスコアリングが提案されている。
