    doi: 10.1007/s40257-023-00818-z
    pmid: '37717255'
    pmcid: PMC10796623
    url: https://doi.org/10.1007/s40257-023-00818-z
    source_license: CC BY-NC 4.0
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 薬剤（デュピルマブ、ネモリズマブなど）の国内承認・保険適用は未確認。デュピルマブの承認に関する記載は EMA と FDA におけるものであり、日本で結節性痒疹に適用があるかどうかは出典では確認していない。　【承認状況の再点検 2026-10-31（作り手、PMDA・厚生労働省などの公的情報）】デュピルマブ（デュピクセント）は2023年6月26日に「既存治療で効果不十分な結節性痒疹」の適応追加、ネモリズマブ（ミチーガ）は2024年3月26日に結節性痒疹（成人および13歳以上の小児）で承認済み
