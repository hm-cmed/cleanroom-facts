    source: 'Shiohara T, Mizukawa Y. Drug-induced hypersensitivity syndrome (DiHS)/drug reaction with eosinophilia and systemic symptoms (DRESS): An update in 2019. Allergol Int. 2019;68(3):301-308.'
    doi: 10.1016/j.alit.2019.03.006
    pmid: '31000444'
