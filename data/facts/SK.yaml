- id: SK-006
  domain: SK
  subdomain: 接触皮膚炎
  assertion:
    plain_statement_ja: アレルギー性接触皮膚炎の診断には、被疑アレルゲンを用いるパッチテストが必要である。欧州のサーベイランス（ESSCAによる2013/2014年の欧州ベースラインシリーズの集計）では、ニッケルが陽性率18.1%で最も頻度の高いアレルゲンであった。パッチテストの反応の判定には、ICDRG（国際接触皮膚炎研究グループ）の判定基準が用いられる。
    condition:
      region: 国際
      study: 総説（欧州のサーベイランスデータを含む）
    differential: null
    common_misconception: null
  provenance:
