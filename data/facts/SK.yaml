- id: SK-031
  domain: SK
  subdomain: 皮脂欠乏性湿疹
  assertion:
    plain_statement_ja: 皮脂欠乏性湿疹は、角層バリア機能の変化に伴う乾皮症（乾燥した皮膚）を背景とする湿疹であり、老人性乾皮症とも呼ばれる。皮膚は乾燥して粗く、軽度の鱗屑を伴い、瘙痒や、つっぱるような感覚を伴う。本症の患者30例（男性11例、女性19例）を対象とした臨床研究では、保湿作用をもつ外用軟膏の塗布により、乾燥、粗糙（粗さ）、落屑の所見と瘙痒が、治療7日目と21日目の時点で有意に軽減し、軽減の程度は治療期間が長いほど大きかった。
    condition:
      region: イタリア
      study: 原著論文（患者30例を対象とした臨床研究）
    differential: null
    common_misconception: null
