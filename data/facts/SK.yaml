- id: SK-021
  domain: SK
  subdomain: Stevens-Johnson症候群
  assertion:
    plain_statement_ja: Stevens-Johnson症候群（SJS）と中毒性表皮壊死症（TEN）は、生命を脅かしうる重症の疾患である。米国の全国入院データ（2009〜2012年、成人）の解析では、推定発症頻度はSJSが100万人あたり年9.2人、SJS/TENオーバーラップが1.6人、TENが1.9人で、調整した入院中の死亡割合はSJS 4.8%、オーバーラップ19.4%、TEN 14.8%であった。死亡の予測因子には、年齢の上昇、慢性疾患の数の増加、感染症（敗血症、肺炎、結核）、血液悪性腫瘍、腎不全が挙げられた。
    condition:
      region: 米国
      study: 全国入院データベース（Nationwide Inpatient Sample 2009〜2012年、成人）の解析
