- id: SK-005
  domain: SK
  subdomain: 接触皮膚炎
  assertion:
    plain_statement_ja: アレルギー性接触皮膚炎は、既に感作された個体がアレルゲンと接触することで起こるIV型の遅発型過敏反応であり、急性期には紅斑、浮腫、小水疱、びらんと強い瘙痒を伴う湿疹病変を呈し、アレルゲンが同定・除去されなければ慢性化して苔癬化する。アレルギー性と刺激性を合わせた接触皮膚炎は、職業性皮膚障害の約90%を占めるとされる。頻度の高いアレルゲンは、金属（特にニッケル）、香料、防腐剤（イソチアゾリノン類）、パラフェニレンジアミンなどである。治療の目標は、原因物質との接触回避と、外用または全身のコルチコステロイドによる炎症の制御である。
    condition:
      region: 国際
      study: 総説（病態から治療まで）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1072
    source: 'Tramontana M, Hansel K, Bianchi L, Sensini C, et al. Advancing the understanding of allergic contact dermatitis: from pathophysiology to novel therapeutic approaches. Frontiers in Medicine. 2023;10:1184289.'
    doi: 10.3389/fmed.2023.1184289
    pmid: '37283623'
    pmcid: PMC10239928
    url: https://doi.org/10.3389/fmed.2023.1184289
    source_license: CC BY 4.0
    legal_basis: B
    source_class: OPEN
    corroboration: null
  uncertainty: 薬剤（外用・全身コルチコステロイド）の国内承認・保険適用は未確認。約90%という数値は出典の抄録に基づく（アレルギー性と刺激性の合計としての記載）。　【承認状況の再点検 2026-10-31（作り手、PMDA・厚生労働省などの公的情報）】外用コルチコステロイドの効能・効果には湿疹・皮膚炎群（接触皮膚炎を含む）が含まれ、承認・保険収載済み（PMDA添付文書情報、2026-10-31確認）
