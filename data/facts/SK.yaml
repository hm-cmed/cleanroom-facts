- id: SK-030
  domain: SK
  subdomain: アトピー性皮膚炎の合併症
  assertion:
    plain_statement_ja: アトピー性皮膚炎の重要な合併症として、日本皮膚科学会の診断基準では、眼症状（白内障、網膜剝離など：とくに顔面の重症例）、伝染性軟属腫、伝染性膿痂疹、カポジ水痘様発疹症が挙げられている。診療ガイドライン2024では、主な眼合併症として眼瞼炎、角結膜炎、円錐角膜、白内障、緑内障、網膜剝離、細菌およびウイルス感染症等が示され（CQ6）、重症のアトピー性皮膚炎、特に顔面の皮疹が重症な症例では、適宜眼科医の診察を受けさせることが望ましいとしている。また、眼合併症の予防のためには、顔面、とくに眼囲の皮疹を早期に十分にコントロールすることが重要とされる。網膜剝離はステロイドの影響ではなく、眼を擦る・叩くといった物理的刺激と関連するとされる。
    condition:
      region: 日本
      study: アトピー性皮膚炎診療ガイドライン2024（日本皮膚科学会・日本アレルギー学会）の診断基準表と CQ6 に基づく
    differential: null
    common_misconception: null
  provenance:
