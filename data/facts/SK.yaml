- id: SK-025
  domain: SK
  subdomain: 壊疽性膿皮症
  assertion:
    plain_statement_ja: 壊疽性膿皮症は診断が難しい炎症性皮膚疾患で、従来は除外診断とされてきた。潰瘍型壊疽性膿皮症について国際的な Delphi コンセンサスで作られた診断基準では、大基準は潰瘍辺縁の生検で好中球浸潤を認めることの1項目で、小基準は、感染の除外、パテルギー、炎症性腸疾患または炎症性関節炎の既往、出現から4日以内に潰瘍化した丘疹・膿疱・水疱の既往、潰瘍部位の周囲の紅斑・辺縁の掘り下げ・圧痛、少なくとも1つが下腿前面にある複数の潰瘍、治癒した潰瘍部位の篩状または「しわ紙」様の瘢痕、免疫抑制薬の開始後1か月以内の潰瘍の縮小、の8項目である。大基準を満たし小基準を4項目以上満たすと、感度86%、特異度90%であった。
    condition:
      region: 国際
      study: 潰瘍型壊疽性膿皮症の診断基準に関する国際専門家の Delphi コンセンサスと検証
    differential: null
