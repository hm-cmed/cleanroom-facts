    doi: 10.1111/1346-8138.17544
    pmid: '39707640'
    pmcid: null
    url: https://doi.org/10.1111/1346-8138.17544
    source_license: 日本皮膚科学会ガイドライン英語版（CCライセンス表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 湿疹反応の総論としての記述は、アトピー性皮膚炎ガイドラインにおける定義と治療戦略の記載に基づいており、湿疹の形態学的な分類（急性・慢性の病変の要素など）の詳細は出典の抄録の範囲では確認できていない。
