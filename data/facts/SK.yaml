- id: SK-001
  domain: SK
  subdomain: アトピー性皮膚炎
  assertion:
    plain_statement_ja: アトピー性皮膚炎は、瘙痒を伴う再発性の湿疹を主症状とする疾患であり、日本皮膚科学会のアトピー性皮膚炎診療ガイドライン2024ではこの定義に基づいて診断と治療方針を組み立てる。治療の要点は、既存の皮膚炎症と瘙痒を速やかに抑えて寛解を導入することであり、外用療法を基本として、重症度や難治性に応じて全身療法の追加を検討する。
