- id: SK-032
  domain: SK
  subdomain: 貨幣状湿疹
  assertion:
    plain_statement_ja: 貨幣状湿疹は、瘙痒を伴う硬貨状の湿疹性局面を特徴とする、慢性の炎症性皮膚症である。病因には接触アレルゲンへの感作が関与する可能性があり、観察研究10件を統合した系統的レビューでは、貨幣状湿疹患者のパッチテスト陽性率の中央値は47.8%（範囲26.7〜56.0%）で、ニッケル（硫酸ニッケルを含む）、重クロム酸カリウム、塩化コバルト、香料ミックス、ネオマイシンなどが多く報告された。アレルギー性接触皮膚炎の併存または既往は、中央値33.5%にみられた。重症例や治療に抵抗する例では、関連するアレルゲンの同定と回避の指導のために、パッチテストの実施が検討される。
    condition:
      region: 海外（系統的レビューに含まれた観察研究10件の集団）
      study: 系統的レビュー（観察研究10件、PRISMA 準拠）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1548
    source: 'Joerg L, Stolyar J, Jagdeo J. Contact Allergens Associated With Nummular Eczema: A Systematic Review. J Drugs Dermatol. 2026;25(10):914-918.'
    doi: 10.36849/JDD.10209
    pmid: '42826143'
    pmcid: null
    url: https://doi.org/10.36849/JDD.10209
    source_license: ライセンス表示なし
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 元のカードの「四肢に多い」「外用コルチコステロイドで治療でき、予後は良好」という記述は、本出典では確認できなかったため含めていない。パッチテスト陽性率などの数値は海外の観察研究を統合したものであり、日本の患者集団での値ではない。ネオマイシンは治療薬としてではなく、パッチテストで報告されたアレルゲンとしての記載である。
