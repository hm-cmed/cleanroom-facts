- id: SK-022
  domain: SK
  subdomain: 中毒性表皮壊死症
  assertion:
    plain_statement_ja: 中毒性表皮壊死症（TEN）の死亡率は約30%とされる。重症度の予測には SCORTEN が用いられ、40歳超、悪性腫瘍の合併、心拍数120/分超、発症時の表皮剝離が体表面積の10%超、血清尿素10 mmol/L超、血清グルコース14 mmol/L超、重炭酸20 mmol/L未満の7項目からなる。スコアが1点上がるごとの死亡のオッズ比は3.45であった。
    condition:
      region: 国際
      study: TEN専門施設に入院した患者（開発165人、検証75人）での重症度スコアの開発・検証研究
