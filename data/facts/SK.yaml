- id: SK-027
  domain: SK
  subdomain: 凍瘡
  assertion:
    plain_statement_ja: 凍瘡は、凍結しない程度の冷たく湿った天候への曝露で起こる皮膚の局所的な炎症で、通常は自然に軽快する。病態には血管攣縮が関わると考えられている。診断は臨床像によることが多く、判断に迷う場合は皮膚生検が有用で、真皮の浮腫と炎症細胞浸潤、とくにエクリン腺周囲への浸潤が典型とされる。全身症状や背景にある自己免疫疾患がないかを確認することが勧められる。管理は、寒冷を避けて四肢を保温することが第一で、禁煙も勧められる。薬物療法ではカルシウム拮抗薬（とくにニフェジピン）が最もよく評価されているが、その効果はすべての研究で確認されているわけではない。
