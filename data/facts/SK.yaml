- id: SK-024
  domain: SK
  subdomain: Sweet病
  assertion:
    plain_statement_ja: Sweet病は、発熱、好中球増多、圧痛のある紅斑性の病変（丘疹、結節、局面）を特徴とし、病理組織では真皮上層に成熟好中球の密な浸潤を示す、急性熱性好中球性皮膚症である。臨床像は、古典型（特発性）、悪性腫瘍関連、薬剤誘発性の3つに分けられる。古典型は30〜50歳の女性に多く、上気道感染に続いて起こることがあり、炎症性腸疾患や妊娠との関連もみられ、約3分の1の患者で再発する。診断基準は、SuとLiuが提唱し von den Driesch が改訂した基準が用いられる。
