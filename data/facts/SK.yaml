- id: SK-008
  domain: SK
  subdomain: 皮脂欠乏性湿疹
  assertion:
    plain_statement_ja: 皮脂欠乏性湿疹は、乾燥した皮膚（乾皮症）を背景に生じる湿疹性皮膚炎で、高齢者に多く、瘙痒を伴い、乾燥と鱗屑に細かい亀裂が加わって「ひび割れた舗装」や「乾いた河床」に例えられる特徴的な外観を呈する。下腿に最も多く、腕や体幹にも広がりうる。背景には加齢による角層脂質の減少などの表皮バリア機能障害があり、寒冷や頻回の入浴といった環境要因が誘因となり、冬季に悪化しやすい。甲状腺機能低下症や栄養不良、リンパ腫などの全身疾患の手がかりとなることもある。
    condition:
      region: 米国
      study: 教科書的総説（StatPearls）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1074
    source: 'Srivastava D, Sathe NC, Persaud Y. Asteatotic Eczema. In: StatPearls [Internet]. Treasure Island (FL): StatPearls Publishing; 2026.'
    doi: null
    pmid: '31747214'
    pmcid: null
    url: https://www.ncbi.nlm.nih.gov/books/NBK549807/
    source_license: © StatPearls Publishing LLC（CCライセンス表示を確認できず）
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
