- id: SK-014
  domain: SK
  subdomain: 結節性痒疹
  assertion:
    plain_statement_ja: 慢性痒疹は、6週を超える慢性の瘙痒、繰り返す掻破、および掻破に伴う痒疹病変によって定義される神経炎症性・線維性の皮膚症であり、結節型（結節性痒疹）が最も多い亜型である。デュピルマブは、結節性痒疹に対して欧州医薬品庁（EMA）と米国食品医薬品局（FDA）で承認された最初の全身療法である。ネモリズマブをはじめとする生物学的製剤や小分子薬が、臨床試験で検討されている。
    condition:
      region: 国際
      study: 総説（慢性痒疹の最新知見と治療）
    differential: null
    common_misconception: null
  provenance:
