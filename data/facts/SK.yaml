- id: SK-007
  domain: SK
  subdomain: 脂漏性皮膚炎
  assertion:
    plain_statement_ja: 脂漏性皮膚炎は、脂腺の多い部位（頭部、顔面、体幹）に好発する慢性の炎症性皮膚疾患で、若年成人に多くみられる。乳児では頭部に黄色い鱗屑を伴う病変（いわゆるゆりかご帽）として現れる。発症にはマラセチアの定着や皮脂腺の活動などが関与するとされ、診断は通常は臨床的に行われる。軽症から中等症では、外用抗真菌薬（ケトコナゾール、シクロピロクスなど）や弱いから中等度の外用コルチコステロイドなどが用いられる。
