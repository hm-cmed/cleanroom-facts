- id: SK-018
  domain: SK
  subdomain: 固定薬疹
  assertion:
    plain_statement_ja: 固定薬疹は、薬疹の代表的な反応パターンの一つであり、斑状丘疹性発疹（発疹型）、蕁麻疹・血管性浮腫と並んで、最も頻繁に報告される皮膚の薬物有害反応のパターンに数えられる。薬疹は、即時型か遅発型か、免疫介在性か非免疫性か、重症度、皮疹の形態といった観点から分類され、固定薬疹はこの分類の中で形態学的に特徴的な位置を占める。
    condition:
      region: 国際
      study: 総説（皮膚の薬物有害反応）
    differential: null
    common_misconception: null
  provenance:
