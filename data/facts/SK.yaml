- id: SK-020
  domain: SK
  subdomain: 結節性紅斑
  assertion:
    plain_statement_ja: 結節性紅斑は、脂肪織炎の中で最も多い病型で、主に下腿の前脛部に圧痛を伴う紅斑性結節を呈する中隔性の脂肪織炎である。種々の抗原刺激に対する過敏反応と考えられ、原因不明の特発性が32〜72%を占めるが、溶連菌感染、サルコイドーシス、初発結核、炎症性腸疾患、薬剤、妊娠などが誘因となり、全身疾患の最初の徴候となることがあるため、特発性と判断する前に基礎疾患の検索が重要である。成人では女性に多く（男女比は約1対5）、病変は通常1〜6週で、潰瘍や瘢痕、萎縮を残さずに消退する。
