- id: SK-029
  domain: SK
  subdomain: 重症薬疹の全身管理
  assertion:
    plain_statement_ja: Stevens-Johnson症候群と中毒性表皮壊死症は、罹患率と死亡率が高く、直ちに医療を要する重症の皮膚粘膜の薬物反応である。管理の基本は、被疑薬の速やかな中止と入念な支持療法で、全身性の疾患であるため多診療科での対応が有用である。特異的治療として、全身ステロイド、シクロスポリン、免疫グロブリン静注、シクロホスファミド、血漿交換、TNF-α阻害薬などが用いられるが、質の高い比較研究は限られており、最適な治療はなお議論がある。インドの診療ガイドラインでは、中等量から高用量のステロイド（プレドニゾロン1〜2 mg/kg/日、または同等量）を発症早期（72時間以内が望ましい）に開始し7〜10日で速やかに減量すること、シクロスポリン（3〜5 mg/kg/日、10〜14日）を単独またはステロイドと併用して用いることが推奨されている。用量はガイドラインの推奨文から読み取った。
