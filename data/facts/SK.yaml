- id: SK-021
  domain: SK
  subdomain: Stevens-Johnson症候群
  assertion:
    plain_statement_ja: Stevens-Johnson症候群（SJS）と中毒性表皮壊死症（TEN）は、生命を脅かしうる重症の疾患である。米国の全国入院データ（2009〜2012年、成人）の解析では、推定発症頻度はSJSが100万人あたり年9.2人、SJS/TENオーバーラップが1.6人、TENが1.9人で、調整した入院中の死亡割合はSJS 4.8%、オーバーラップ19.4%、TEN 14.8%であった。死亡の予測因子には、年齢の上昇、慢性疾患の数の増加、感染症（敗血症、肺炎、結核）、血液悪性腫瘍、腎不全が挙げられた。
    condition:
      region: 米国
      study: 全国入院データベース（Nationwide Inpatient Sample 2009〜2012年、成人）の解析
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1084
    source: Hsu DY, Brieva J, Silverberg NB, Silverberg JI. Morbidity and Mortality of Stevens-Johnson Syndrome and Toxic Epidermal Necrolysis in United States Adults. J Invest Dermatol. 2016;136(7):1387-1397
    doi: 10.1016/j.jid.2016.03.023
    pmid: '27039263'
    pmcid: null
    url: https://doi.org/10.1016/j.jid.2016.03.023
    source_license: © The Authors / Elsevier（CC表示なし）
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 米国の成人の入院データに基づく数値で、日本の発症頻度や死亡割合とは異なる可能性がある。症例の同定は ICD コードによるため、臨床診断とのずれがありうる。
