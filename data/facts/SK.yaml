    source: 'Del Pozzo-Magaña BR, Liy-Wong C. Drugs and the skin: A concise review of cutaneous adverse drug reactions. British Journal of Clinical Pharmacology. 2024;90(8):1838-1855.'
    doi: 10.1111/bcp.15490
    pmid: '35974692'
    pmcid: null
    url: https://doi.org/10.1111/bcp.15490
    source_license: Wiley（CCライセンス表示を確認できず）
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 固定薬疹に特有の臨床像（同一部位への再発、円形の紅斑、炎症後の色素沈着など）や頻度の高い原因薬の個別名は、出典の抄録の範囲では確認できなかったため、本カードは薬疹パターンとしての位置づけに限定した。固定薬疹の専門総説（例：Medicina 2021年の固定薬疹レビュー）での補完が望ましい。
