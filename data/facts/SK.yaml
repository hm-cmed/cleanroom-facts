    doi: 10.1046/j.1523-1747.2000.00061.x
    pmid: '10951229'
    pmcid: null
    url: https://doi.org/10.1046/j.1523-1747.2000.00061.x
    source_license: Elsevier（CC表示なし）
    legal_basis: B
    source_class: UNKNOWN
