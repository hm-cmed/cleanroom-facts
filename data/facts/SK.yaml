- id: SK-029
  domain: SK
  subdomain: 重症薬疹の全身管理
  assertion:
    plain_statement_ja: Stevens-Johnson症候群と中毒性表皮壊死症は、罹患率と死亡率が高く、直ちに医療を要する重症の皮膚粘膜の薬物反応である。管理の基本は、被疑薬の速やかな中止と入念な支持療法で、全身性の疾患であるため多診療科での対応が有用である。特異的治療として、全身ステロイド、シクロスポリン、免疫グロブリン静注、シクロホスファミド、血漿交換、TNF-α阻害薬などが用いられるが、質の高い比較研究は限られており、最適な治療はなお議論がある。インドの診療ガイドラインでは、中等量から高用量のステロイド（プレドニゾロン1〜2 mg/kg/日、または同等量）を発症早期（72時間以内が望ましい）に開始し7〜10日で速やかに減量すること、シクロスポリン（3〜5 mg/kg/日、10〜14日）を単独またはステロイドと併用して用いることが推奨されている。用量はガイドラインの推奨文から読み取った。
    condition:
      region: インド
      study: SJS/TEN の管理ガイドライン（インド皮膚科・性病・ハンセン病学会の作業部会による、104論文の評価に基づく）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1092
    source: 'Gupta LK, Martin AM, Agarwal N, et al. Guidelines for the management of Stevens-Johnson syndrome/toxic epidermal necrolysis: An Indian perspective. Indian J Dermatol Venereol Leprol. 2016;82(6):603-625'
    doi: 10.4103/0378-6323.191134
    pmid: '27716721'
    pmcid: null
    url: https://doi.org/10.4103/0378-6323.191134
    source_license: ライセンス表示を確認できず
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 本カードに名前の出る薬剤（プレドニゾロン、シクロスポリン、免疫グロブリン製剤など）の重症薬疹に対する国内の承認・保険適用は未確認。推奨はインドの診療環境に合わせて作られたもので、日本の診療方針と異なる場合がある。用量はガイドラインの推奨文（抄録）から読み取った。
