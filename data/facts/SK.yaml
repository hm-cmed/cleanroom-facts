    source: Saeki H, Ohya Y, Arakawa H, Ichiyama S, et al. English version of clinical practice guidelines for the management of atopic dermatitis 2024. The Journal of Dermatology. 2025;52(2):e70-e142.
    doi: 10.1111/1346-8138.17544
    pmid: '39707640'
    pmcid: null
    url: https://doi.org/10.1111/1346-8138.17544
    source_license: 日本皮膚科学会ガイドライン英語版（CCライセンス表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
