- id: SK-016
  domain: SK
  subdomain: 湿疹反応
  assertion:
    plain_statement_ja: 湿疹は、瘙痒を伴う皮膚の炎症反応の総称であり、再発を繰り返す経過が特徴である。日本皮膚科学会のアトピー性皮膚炎診療ガイドライン2024では、アトピー性皮膚炎は「瘙痒を伴う再発性の湿疹」を主病変とする疾患と位置づけられており、湿疹反応の治療では、既存の炎症と瘙痒を速やかに抑えて寛解を導入し、それを維持することが基本戦略となる。
    condition:
      region: 日本
      study: 診療ガイドライン（日本皮膚科学会、2024年版の英語版）
    differential: null
    common_misconception: null
  provenance:
