- id: SK-028
  domain: SK
  subdomain: 網状皮斑
  assertion:
    plain_statement_ja: 網状皮斑は、紫紅色の斑が互いにつながって網目状のパターンを示す、比較的よくみられる身体所見である。多くの場合は寒冷への曝露に関連した良性の所見であるが、背景にありうる原因は多岐にわたるため、この所見を示す患者の評価は難しいことがある。生理的で良性のものと、基礎疾患に伴うものとを見分ける視点で評価することが大切である。
