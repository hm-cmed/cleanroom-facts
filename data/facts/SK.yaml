  assertion:
    plain_statement_ja: 結節性紅斑の治療は、基礎疾患が同定されればその治療を行い、原因薬剤が疑われれば可能な範囲で中止することが前提となる。対症療法として圧迫包帯と下肢挙上が浮腫と疼痛の軽減に用いられる。薬物療法ではNSAIDs（インドメタシン1日100-150 mg、ナプロキセン1日500-1,000 mgなど）が用いられるが、炎症性腸疾患の病勢を悪化させることがあるため注意する。難治例にはヨウ化カリウム（1日300-900 mg）が、Behçet病に伴うものなどにはコルヒチン（1日1-2 mg）やダプソン（1日50-75 mg）が選択肢となり、重症例では感染症や悪性腫瘍を除外したうえで経口コルチコステロイド（プレドニゾン1日40-60 mg程度）が用いられる。
