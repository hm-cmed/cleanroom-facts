- id: SK-038
  domain: SK
  subdomain: 薬剤性過敏症症候群
  assertion:
    plain_statement_ja: 薬剤性過敏症症候群（DiHS）は、限られた種類の薬剤により発症する重症薬疹である。日本の診断基準は、(1) 限られた薬剤の投与開始後3週以降に生じる斑状丘疹状の皮疹、(2) 原因薬剤の中止後も遷延する臨床症状、(3) 38℃を超える発熱、(4) 肝障害（ALT 100 U/L超）などの臓器障害、(5) 白血球異常（白血球増多 11×10⁹/L超、異型リンパ球 5%超、好酸球増多 1.5×10⁹/L超のうち1つ以上）、(6) リンパ節腫脹、(7) HHV-6の再活性化、の7項目からなり、7項目すべてを満たすものを典型DiHS、(1)から(5)の5項目を満たすものを非典型DiHSとする。初期には顔面・眼窩周囲の浮腫が特徴的で、リンパ節腫脹は頸部・腋窩・鼠径部に多い。原因となりやすい薬剤はカルバマゼピン、フェニトイン、フェノバルビタール、ゾニサミド、メキシレチン、ラモトリギン、ダプソン、サラゾスルファピリジン、アロプリノール、ミノサイクリンなどであり、抗てんかん薬が中心である。治療の中心は全身性コルチコステロイド投与であり、多くの症例で有効だが、一部に治療抵抗性の症例がある。
    condition:
      region: 日本
      対象: 成人および小児
    differential: null
    common_misconception: null
  provenance:
