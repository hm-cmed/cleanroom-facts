- id: SK-015
  domain: SK
  subdomain: 色素性痒疹
  assertion:
    plain_statement_ja: 色素性痒疹（長島病）は、原因不明のまれな炎症性皮膚疾患で、背部、胸部、頸部に、網目状の配列をとる瘙痒性の紅斑性丘疹や丘疹小水疱、小水疱を呈する。組織像は病期により異なり、初期には好中球の表層性血管周囲浸潤が、後期には海綿状態や壊死性の角化細胞がみられる。治療は通常、ミノサイクリンの内服が第一選択とされ、ドキシサイクリン、マクロライド系抗菌薬、ダプソンが適応となる場合もある。
