    doi: 10.1001/jamadermatol.2017.5980
    pmid: '29450466'
    pmcid: null
    url: https://doi.org/10.1001/jamadermatol.2017.5980
    source_license: © American Medical Association（CC表示なし）
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 対象は潰瘍型の壊疽性膿皮症であり、水疱型や膿疱型などの他の臨床型にそのまま当てはまるかは未検証である。基準は専門家コンセンサスに基づく。
