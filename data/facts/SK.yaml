- id: SK-036
  domain: SK
  subdomain: Stevens-Johnson症候群
  assertion:
    plain_statement_ja: Stevens-Johnson症候群（SJS）は、主に薬剤を原因として発症する重症の薬疹で、高熱と、眼・口唇・外陰部などの皮膚粘膜移行部の重症粘膜病変、表皮壊死によるびらん・水疱を伴う紅斑を特徴とする。診断の主要所見は、出血性びらんを伴う重症の粘膜病変、全身に広がる表皮壊死によるびらん・水疱（体表面積の10%未満）、発熱、病理組織学的な表皮壊死であり、多形滲出性紅斑重症型は除外される。分類は、日本では表皮剥離面積が体表面積の10%未満をSJS、10%以上を中毒性表皮壊死症（TEN）とし、国際分類では10%未満がSJS、10%以上30%未満がSJS/TENオーバーラップ、30%以上がTENとされる。国内調査におけるSJSの被疑薬は抗菌薬（16.3%）、解熱鎮痛薬（14.6%）、抗てんかん薬（14.0%）の順に多く、薬剤のほかマイコプラズマやウイルス感染も発症契機となりうる。臨床像として高熱、全身倦怠感、食欲不振を伴い、滲出性紅斑や紫紅色斑、水疱、口唇・口腔の出血性痂皮、結膜充血・偽膜形成・眼表面の上皮欠損などの眼症状を呈し、上気道や消化管の粘膜に及ぶこともある。
    condition:
      region: 日本
      対象: 成人および小児
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-4522
    source: 重症多形滲出性紅斑ガイドライン作成委員会. 日本皮膚科学会ガイドライン 重症多形滲出性紅斑 スティーヴンス・ジョンソン症候群・中毒性表皮壊死症診療ガイドライン. 日本皮膚科学会雑誌. 2016;126(9):1637-1685.
    doi: null
    pmid: null
    pmcid: null
    url: https://www.dermatol.or.jp/uploads/uploads/files/EM%20major(1).pdf
    source_license: 日本皮膚科学会の著作物（CCライセンス表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: 自由に使える資料による裏づけ（GOV_JP（PMDA、公共データ利用規約第1.0版。要約して記載）、作り手の調査バッチ26 2026-11-11）：厚生労働省. 重篤副作用疾患別対応マニュアル「スティーヴンス・ジョンソン症候群（皮膚粘膜眼症候群）」。平成18年11月（平成29年6月改定）（GOV_JP、PMDA 掲載の全文 PDF、新規 SRC 候補）。裏づける部分と留保：SJS の定義（高熱を伴い、皮膚粘膜移行部に重症の粘膜病変を生じ、表皮壊死によるびらん・水疱を伴う）、主要徴候（発熱・粘膜症状・多発する紅斑）、被疑薬は抗菌薬・解熱消炎鎮痛薬・抗てんかん薬など広範囲にわたること、マイコプラズマやウイルス感染も発症契機となりうることは政府の全文文書で裏づけられる。JDA の主要所見の文言、日本の分類（表皮剥離面積10%未満/以上）の数値境界、国内調査の被疑薬割合（16.3%・14.6%・14.0%）は対象外
  uncertainty: 分類・診断の主要所見・臨床像は出典の本文で、被疑薬の割合は出典が引用する国内調査の値として確認した。原因薬剤として挙げた抗菌薬・解熱鎮痛薬・抗てんかん薬はいずれも国内で承認された医薬品であり、その承認・保険適用の有無は本カードの論点ではない（重症薬疹の原因としての位置づけ）。同ガイドラインには2025年の補遺があるが、本カードは2016年版の本文で確認した範囲に限る。既存のSK-021（米国の疫学・死亡）と重複しないよう、本カードは定義・分類・原因・臨床像に絞った。
