- id: SK-035
  domain: SK
  subdomain: 結節性痒疹
  assertion:
    plain_statement_ja: 結節性痒疹は慢性痒疹の一病型で、強い瘙痒を伴う丘疹（1 cm未満）・結節（1 cm以上）・局面を呈し、瘙痒は他の慢性瘙痒性疾患より強く、睡眠障害を伴うことが多い。診断は臨床像による。背景疾患の検索として、血算・白血球分画、CRP、肝機能（AST、ALT、γ-GTP、ALP）、腎機能（クレアチニン、eGFR）、LDH、TSHを調べ、瘙痒の経過が1年未満の場合やB症状（発熱、6か月で10%を超える体重減少、盗汗）がある場合は悪性腫瘍を除外するための画像検査（リンパ節・腹部の超音波検査、胸部X線など）を行う。従来治療は段階的に進め、第1段階は外用コルチコステロイド、外用カルシニューリン阻害薬、H1抗ヒスタミン薬、第2段階は外用カプサイシン、コルチコステロイドの病変内注射、紫外線療法（ナローバンドUVB、PUVA）、第3段階は神経障害性の要素にはガバペンチン・プレガバリンや抗うつ薬、炎症性の要素にはシクロスポリンやメトトレキサートを用いる。
    condition:
      region: 国際
      対象: 成人
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1079
    source: 'Müller S, Zeidler C, Ständer S. Chronic Prurigo Including Prurigo Nodularis: New Insights and Treatments. American Journal of Clinical Dermatology. 2024;25(1):15-33.'
    doi: 10.1007/s40257-023-00818-z
    pmid: '37717255'
    pmcid: PMC10796623
    url: https://doi.org/10.1007/s40257-023-00818-z
    source_license: CC BY-NC 4.0
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 臨床像・背景疾患検索の検査項目・段階的治療は出典の本文で確認した。外用カプサイシン製剤は国内では承認された医療用医薬品がない。その他の薬剤（外用コルチコステロイド、外用タクロリムス、H1抗ヒスタミン薬、ガバペンチン、プレガバリン、シクロスポリン、メトトレキサート）はいずれも国内で承認された医薬品だが、結節性痒疹自体を適応とする承認ではなく、各薬剤の承認適応の範囲での使用が前提となる。既存のSK-014（慢性痒疹の定義とデュピルマブ等の生物学的製剤）と重複しないよう、本カードは臨床像・背景検索・従来治療に絞った。
