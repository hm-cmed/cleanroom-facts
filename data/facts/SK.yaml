    doi: 10.1016/j.waojou.2022.100627
    pmid: '35497649'
    pmcid: PMC9023902
    url: https://doi.org/10.1016/j.waojou.2022.100627
    source_license: CC BY-NC-ND 4.0
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 薬剤（C1インヒビター製剤、イカチバント、エカランタイド、ラナデルマブ、ベロトラルスタット）の国内承認・保険適用は未確認であり、承認状況は地域により異なる（エカランタイドなど）。推奨事項と薬剤名はガイドライン全文（PMC の WAOJ 版）で確認した。診断の検査手順の細目は本カードには含めていない。
