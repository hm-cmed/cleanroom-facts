- id: SK-019
  domain: SK
  subdomain: 多形滲出性紅斑
  assertion:
    plain_statement_ja: 多形滲出性紅斑は、皮膚または粘膜の病変を呈する免疫介在性の疾患であり、同心円状の色調変化を示す標的病変（ターゲット病変）が特徴的な皮膚所見である。誘因としては単純ヘルペスウイルス感染が最も多く、HSV関連の多形滲出性紅斑では、ウイルス抗原を含む細胞に対する細胞性免疫反応が関与すると考えられている。軽度の皮膚病変では対症的な改善を目標とした治療が中心となるが、再発性のHSV関連型などでは抗ウイルス薬による予防投与が必要となり、重い粘膜病変で経口摂取が困難な場合は入院が必要になることがある。
