- id: SK-001
  domain: SK
  subdomain: アトピー性皮膚炎
  assertion:
    plain_statement_ja: アトピー性皮膚炎は、瘙痒を伴う再発性の湿疹を主症状とする疾患であり、日本皮膚科学会のアトピー性皮膚炎診療ガイドライン2024ではこの定義に基づいて診断と治療方針を組み立てる。治療の要点は、既存の皮膚炎症と瘙痒を速やかに抑えて寛解を導入することであり、外用療法を基本として、重症度や難治性に応じて全身療法の追加を検討する。
    condition:
      region: 日本
      study: 診療ガイドライン（日本皮膚科学会、2024年版の英語版）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1071
    source: Saeki H, Ohya Y, Arakawa H, Ichiyama S, et al. English version of clinical practice guidelines for the management of atopic dermatitis 2024. The Journal of Dermatology. 2025;52(2):e70-e142.
    doi: 10.1111/1346-8138.17544
    pmid: '39707640'
    pmcid: null
    url: https://doi.org/10.1111/1346-8138.17544
    source_license: 日本皮膚科学会ガイドライン英語版（CCライセンス表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
