    source: Zuberbier T, Abdul Latiff AH, Abuzakouk M, Aquilina S, et al. The international EAACI/GA²LEN/EuroGuiDerm/APAAACI guideline for the definition, classification, diagnosis, and management of urticaria. Allergy. 2022;77(3):734-766.
    doi: 10.1111/all.15090
    pmid: '34536239'
    pmcid: null
    url: https://doi.org/10.1111/all.15090
    source_license: CC BY-NC 4.0
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 血管性浮腫の治療の段階的アプローチの詳細は抄録の範囲では確認できず、本カードは定義と位置づけに限った。蕁麻疹を伴わない血管性浮腫では、遺伝性血管性浮腫などブラジキニンが関与する病態との鑑別が重要であり、それらは SK-013 を参照されたい。約20%という数値は急性蕁麻疹の生涯有病率として抄録に記載されたもの。
