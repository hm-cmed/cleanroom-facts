    plain_statement_ja: SJSおよびTENの治療の第一歩は被疑薬の速やかな中止である。治療は皮膚科専門医のいる入院施設で行い、輸液・栄養管理などの全身管理（TENでは熱傷に準じた管理）、進行する炎症の抑制、皮膚・粘膜病変の感染予防、厳密な眼科的管理を原則とする。第一選択は早期の副腎皮質ステロイド全身投与で、発症後おおよそ7日以内に開始し、プレドニゾロン換算で中等症0.5-1.0 mg/kg/日、重症1-2 mg/kg/日を用い、重症例・急速進行例や重症の眼症状がある場合はメチルプレドニゾロン500-1,000 mg/日のパルス療法を3日間行う。補助療法としてヒト免疫グロブリン400 mg/kg/日を5日間投与する大量静注療法があり、ステロイドや免疫グロブリンで効果が得られない場合やステロイドの使用が難しい場合には血漿交換を行う。皮膚の局所管理は熱傷に準じて無菌的に行い、感染のない水疱蓋は早期には除去しない。眼表面の上皮欠損や偽膜がある例は眼科的に重症であり、0.1%ベタメタゾン点眼・眼軟膏を1日6-10回と抗菌薬点眼を行う。
