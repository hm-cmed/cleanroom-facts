- id: SK-040
  domain: SK
  subdomain: 血栓性静脈炎
  assertion:
    plain_statement_ja: 表在性静脈血栓症（血栓性静脈炎）は、表在静脈に血栓が形成され周囲に炎症を伴う病態で、多くは静脈瘤のある静脈に自然発症し、疼痛と圧痛を伴う索状の硬結として現れ、発赤と熱感を伴って大伏在静脈の走行に沿ってみられることが多い。良性疾患とみなされがちだが、前向き観察研究（POST）では診断時点で約25%に深部静脈系への血栓の進展または肺塞栓症が既にみられ、3か月以内に約10%が血栓塞栓性の合併症を生じたとされ、深部静脈との接合部に近い病変、広範な血栓、悪性腫瘍に伴うものではリスクが高い。診断には下肢全体の超音波検査で血栓の範囲を確認し、無症候性の深部静脈血栓症を除外することが推奨される。抗凝固療法の適応は血栓の長さと接合部からの距離で決まり、長さ5 cm未満で高リスク所見（悪性腫瘍、血栓性素因、深部静脈系への近接）のない孤立性病変には抗凝固療法は推奨されず、接合部から3 cm以上離れ長さ5 cm以上の病変にはフォンダパリヌクス2.5 mgの1日1回投与を45日間行うことが推奨され（代替として低分子量ヘパリンの中間用量）、接合部から3 cm以内の病変には治療量の抗凝固療法が推奨される。高リスクの臨床的・解剖学的特徴がある場合は3か月間の抗凝固療法が考慮される。
    condition:
      region: 欧州
      対象: 成人
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-4523
    source: Kakkos SK, Gohel M, Baekgaard N, Bauersachs R, Bellmunt-Montoya S, Black SA, ten Cate-Hoek A, Elalamy I, Enzmann FK, Geroulakos G, Gottsäter A, Hunt BJ, Mansilha A, Nicolaides A, Sandset PM, Stansby G. Editor's Choice – European Society for Vascular Surgery (ESVS) 2021 Clinical Practice Guidelines on the Management of Venous Thrombosis. Eur J Vasc Endovasc Surg. 2021;61(1):9-82.
    doi: 10.1016/j.ejvs.2020.09.023
    pmid: '33334670'
    pmcid: null
    url: https://doi.org/10.1016/j.ejvs.2020.09.023
    source_license: Elsevier（CCライセンス表示を確認できず）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 表在性静脈血栓症の節（病態・臨床像・血栓塞栓リスク）と推奨43-49を出典の全文で確認した。出典の本文中にあるCALISTO試験の紹介文にはフォンダパリヌクス2.5 mg 1日2回とあるが、推奨45の正式な表記である1日1回に従った。フォンダパリヌクスは国内では静脈血栓塞栓症の発症抑制（下肢整形外科手術・腹部手術施行患者）と急性深部静脈血栓症・急性肺血栓塞栓症の治療の適応のみであり、表在性静脈血栓症への適応・保険適用はない（欧州では表在静脈血栓症の適応がある）。低分子量ヘパリンも国内では表在性静脈血栓症を適応としていない。既存のSK-026（CALISTO試験の結果）と重複しないよう、本カードは定義・臨床像・進展リスクと抗凝固療法の適応の原則に絞った。
