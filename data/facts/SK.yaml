- id: SK-013
  domain: SK
  subdomain: 遺伝性血管性浮腫
  assertion:
    plain_statement_ja: 遺伝性血管性浮腫は、C1インヒビターの欠損（1型）または機能不全（2型）によるまれな疾患である。国際ガイドライン（WAO/EAACI、2021年改訂版）では、発作に対しては静脈内C1インヒビター製剤、エカランタイド、またはイカチバントによる早期のオンデマンド治療が推奨され、早期に治療するほど速やかに改善する。上気道に及ぶ発作は特に速やかな治療を要する。長期予防としては、皮下C1インヒビター製剤、ラナデルマブ、ベロトラルスタットなどが選択肢となる。
