- id: SK-034
  domain: SK
  subdomain: 皮脂欠乏性湿疹
  assertion:
    plain_statement_ja: 皮脂欠乏症（皮脂欠乏性湿疹）の管理は保湿剤によるスキンケアを基本とする。軽度の鱗屑や皮膚の粗糙化のみで痒みがない一過性の軽症例では、環境因子の除去や患者指導とセルフメディケーションによる経過観察が可能な場合があるが、明らかな鱗屑や掻破痕がみられれば痒みがなくても医療用保湿剤による治療を検討する。保湿剤にはモイスチャライザー型（ヘパリン類似物質、尿素など）と皮膚を被覆するエモリエント型（白色ワセリンなど）がある。保湿剤を用いても湿疹化する場合には、外用コルチコステロイド等の抗炎症薬を追加する。患者指導では、入浴後に保湿剤を塗布すること、ナイロンタオルやブラシで擦らず石鹸をよく泡立てて手で優しく洗うこと、石鹸の過剰な使用と洗い残しを避けること、冬季の暖房使用時の加湿、ウールなど刺激のある衣類を避けることを伝える。予後は良好だが、保湿剤の中止や季節変化で再燃することがある。
