    corroboration: 自由に使える資料による裏づけ（GOV_JP（PMDA、公共データ利用規約第1.0版。要約して記載）、作り手の調査バッチ26 2026-11-11）：厚生労働省. 重篤副作用疾患別対応マニュアル「薬剤性過敏症症候群」。平成19年6月（GOV_JP、PMDA 掲載の全文 PDF、新規 SRC 候補）。同マニュアルが採用する研究班の診断基準は公的資料に全文掲載されている。裏づける部分と留保：日本の診断基準7項目（限られた薬剤の投与開始後3週以降の斑状丘疹状皮疹、中止後も遷延する症状、38℃を超える発熱、肝障害などの臓器障害、白血球異常［白血球増多・異型リンパ球・好酸球増多のうち1つ以上］、リンパ節腫脹、HHV-6の再活性化）と、7項目すべてを満たす典型DiHS・1〜5を満たす非典型DiHS の区分、原因薬剤の一覧（カルバマゼピン、フェニトイン、フェノバルビタール、ゾニサミド、メキシレチン、ラモトリギン、ダプソン、サラゾスルファピリジン、アロプリノール、ミノサイクリン）は政府全文・公的基準で裏づけられる。初期の顔面・眼窩周囲浮腫の特徴と治療の有効性・治療抵抗性は対象外
  uncertainty: 診断基準は出典の本文の表（日本のコンセンサス診断基準）、原因薬剤は出典の本文の表（DiHS/DRESSを起こしやすい薬剤の一覧）から読み取り、治療は出典の結論部で確認した。原因薬剤として挙げた薬剤（カルバマゼピン、フェニトイン、フェノバルビタール、ゾニサミド、メキシレチン、ラモトリギン、ダプソン、サラゾスルファピリジン、アロプリノール、ミノサイクリン）はいずれも国内で承認された医薬品であり、その承認状況は本カードの論点ではない（重症薬疹の原因薬剤としての位置づけ）。治療に挙げた全身性コルチコステロイドも国内で承認された医薬品である。既存のSK-023（DRESSと同一概念であること、ウイルス再活性化、合併症、重症度スコア）と重複しないよう、本カードは診断基準・原因薬剤・治療に絞った。
