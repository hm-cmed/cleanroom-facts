- id: SK-017
  domain: SK
  subdomain: 薬疹
  assertion:
    plain_statement_ja: 薬疹は、薬剤またはその代謝物によって引き起こされる皮膚、粘膜、皮膚付属器の反応の総称であり、皮膚は薬物反応が最も現れやすい臓器である。入院患者の最大10%、多剤併用患者の1〜3%に起こりうるとされる。多くは軽症で自然に軽快するが、2〜6.7%は生命を脅かす重症型に発展しうる。原因薬として頻度が高いのは、抗菌薬、非ステロイド性抗炎症薬、抗てんかん薬である。診断と初期対応では、詳細な臨床所見の把握と皮疹の形態の正確な記載が、反応パターンの特定と重症度の判断の基盤となる。
