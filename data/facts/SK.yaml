- id: SK-012
  domain: SK
  subdomain: 血管性浮腫
  assertion:
    plain_statement_ja: 血管性浮腫は、皮膚や粘膜の深部に生じる腫脹であり、蕁麻疹に伴って現れる場合と、蕁麻疹を伴わずに現れる場合がある。国際ガイドラインでは、蕁麻疹は膨疹、血管性浮腫、またはその両方を呈する肥満細胞が駆動する疾患と定義されており、蕁麻疹に伴う血管性浮腫はこの枠組みで理解される。なお、急性蕁麻疹の生涯有病率は約20%とされる。
    condition:
      region: 国際
      study: 国際ガイドライン（蕁麻疹ガイドライン、2022年版）
    differential: null
    common_misconception: null
  provenance:
