- id: PX-007
  domain: PX
  subdomain: 精神保健福祉法と入院形態
  assertion:
    plain_statement_ja: 精神保健及び精神障害者福祉に関する法律の入院形態は、本人の同意に基づいて行われる任意入院を原則とし（第20条）、任意入院者が退院を申し出た場合も指定医の診察により医療・保護のため入院継続が必要と認められるときは72時間を限り退院させないことができる（第21条）。本人の同意が得られない医療保護入院は、指定医の診察で入院が必要と判定された者について家族等の同意があるときに、6月以内で省令で定める期間の範囲内の期間を定めて行われ、家族等がいない場合等のほか家族等が同意・不同意の意思表示を行わない場合には市町村長の同意によることができる（第33条）。都道府県知事による措置入院は、2人以上の指定医の診察結果が、精神障害のために自身を傷つけ又は他人に害を及ぼすおそれがあるとの認定で一致することが要件である（第29条）。
    condition:
      region: 日本
      対象: 精神障害者の入院
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3861
    source: 精神保健及び精神障害者福祉に関する法律（昭和25年法律第123号）. 現行施行版（最終改正：令和7年法律第87号、2026年10月1日施行）
    doi: null
    pmid: null
    pmcid: null
    url: https://laws.e-gov.go.jp/law/325AC0100000123
    source_license: 法令本文（著作権法第13条により著作権の目的とならない）
    legal_basis: B
    source_class: GOV_JP
    corroboration: null
  uncertainty: 入院制度の実質は令和4年改正（令和4年法律第104号、2024年4月1日施行）後の条文で確認した。医療保護入院の更新時の期間区分（入院開始から6か月までは3か月以内、その後は6か月以内）などの運用の細目は省令・通知に基づくため、本カードの主張には含めていない。緊急措置入院・応急入院の条文の詳細も本カードでは扱っていない。
