- id: PX-011
  domain: PX
  subdomain: 老年期の精神医学的評価の総論
  assertion:
    plain_statement_ja: 認知症を検出するための認知機能スクリーニング検査の系統的レビュー・メタ解析（149研究、49,000人超）では、最も多く使われた MMSE の認知症検出の統合感度は0.81、特異度は0.89であり、他の検査のうち Mini-Cog と Addenbrooke 式認知検査改訂版（ACE-R）が MMSE に匹敵する最良の診断性能を示した。スクリーニング検査は評価の一要素であり、単一の検査で認知症の確定診断にはならない。
