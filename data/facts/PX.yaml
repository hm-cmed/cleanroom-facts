  uncertainty: 認知症そのものの診断・治療と、せん妄そのものの評価は本カードの範囲外である（いずれも既存の疾患別カードが正）。境界情報として、国内の認知症疾患診療ガイドラインは2026年版が現行である。高齢者のうつ病評価の尺度（GDS、Cornell Scale）の原著は未使用の候補として申し送りに残した。
