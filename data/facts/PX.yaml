- id: PX-013
  domain: PX
  subdomain: 依存症治療・回復支援の総論
  assertion:
    plain_statement_ja: 国の依存症対策では、アルコール・薬物・ギャンブルなどの依存症は適切な治療とその後の支援によって回復可能な疾患と位置づけられている。相談の拠点は保健所と精神保健福祉センターが担い、医療は都道府県等が選定する依存症専門医療機関と依存症治療拠点機関が担って、全国拠点機関として国立病院機構久里浜医療センターが指導者の養成や情報提供を行い、自助グループや回復支援施設も回復支援の構成要素として案内されている。
