    plain_statement_ja: 精神障害者のリハビリテーションと地域生活への支援は、医療保険による精神科デイケア等の通所型の治療・リハビリテーション（医療側）と、障害者総合支援法に基づく障害福祉サービス（福祉側）の二層で提供される。福祉側の訓練等給付には自立訓練、就労移行支援、雇用契約に基づく就労継続支援A型と非雇用のB型、就労定着支援などがあり、共同生活援助（グループホーム）や自立生活援助とあわせて、一人一人に作成される個別支援計画に基づいて提供される。
