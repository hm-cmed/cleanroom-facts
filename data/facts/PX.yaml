- id: PX-014
  domain: PX
  subdomain: 依存症治療・回復支援の総論
  assertion:
    plain_statement_ja: アルコール健康障害対策基本法に基づく第3期アルコール健康障害対策推進基本計画（2026年3月27日閣議決定、計画期間は令和8〜12年度）は、正しい知識の普及と不適切な飲酒を防止する社会づくり、相談支援体制づくり、医療の質の向上と連携の促進、回復・社会復帰のための社会づくり、当事者及び家族への支援を基本的な方向性とし、生活習慣病のリスクを高める量（1日当たり純アルコール摂取量で男性40g以上、女性20g以上）を飲酒している者の割合を令和6年の全体11.4%から全体で10%まで減少させること、20歳未満の飲酒と妊娠中の飲酒をなくすことを目標に掲げている。
