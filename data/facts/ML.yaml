- id: ML-002
  domain: ML
  subdomain: 薬剤性無顆粒球症
  assertion:
    plain_statement_ja: 発熱性好中球減少症の管理では、合併症のリスクを高リスクと低リスクに層別化することが出発点となり、すべての患者に対してグラム陽性菌とグラム陰性菌の双方をカバーする広域抗菌薬を速やかに経験的に投与する。
    condition:
      region: 米国
      対象: 成人
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2552
    source: 'Freifeld AG, Bow EJ, Sepkowitz KA, et al. Clinical Practice Guideline for the Use of Antimicrobial Agents in Neutropenic Patients with Cancer: 2010 Update by the Infectious Diseases Society of America. Clin Infect Dis. 2011;52(4):e56-e93.'
    doi: 10.1093/cid/cir073
    pmid: '21258094'
    pmcid: null
    url: https://doi.org/10.1093/cid/cir073
    source_license: CC 表示なし
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（CC BY 3.0（OPEN）、作り手の調査バッチ81 2026-11-15）：Villafuerte-Gutierrez P, Villalon L, Losa JE, Henriquez-Camacho C. Treatment of febrile neutropenia and prophylaxis in hematologic malignancies: a critical review and update. Adv Hematol. 2014;2014:986938.（PMID: 25525436、DOI: 10.1155/2014/986938、PMCID: PMC4265549、https://creativecommons.org/licenses/by/3.0/）。裏づける部分：部分：IDSA の高リスク・低リスクの定義（MASCC スコア21超は低リスクを含む）を再掲し、好中球減少性発熱の全患者への60分以内の経験的広域抗菌薬投与、最も多いグラム陽性菌と最も重篤なグラム陰性菌、高リスク例への抗緑膿菌βラクタム単剤を再掲する。数値の照合：数値の主張なし（MASCC の閾値21は一致）。留保：主出典は RESTRICTED で確定（非OA）'
  uncertainty: 米国感染症学会（IDSA）ガイドラインの抄録で確認した範囲である。発熱の定義は国内の発熱性好中球減少症診療ガイドライン（腋窩温37.5℃以上等）と異なるため、日本の診療では国内ガイドラインを併せて参照すること。個別の抗菌薬の国内承認・保険適用は本カードでは扱っていない。
