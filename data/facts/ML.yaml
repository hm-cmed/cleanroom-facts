    corroboration: '自由に使える資料による裏づけ（CC BY 4.0（OPEN）、作り手の調査バッチ81 2026-11-15）：Nguyen L, Saha A, Kuykendall A, Zhang L. Clinical and Therapeutic Intervention of Hypereosinophilia in the Era of Molecular Diagnosis. Cancers. 2024;16(7):1383.（PMID: 38611061、DOI: 10.3390/cancers16071383、PMCID: PMC11011008、https://creativecommons.org/licenses/by/4.0/）。裏づける部分：部分：FIP1L1::PDGFRA 融合（4q12 の潜性欠失）が好酸球増多を伴う骨髄系腫瘍で最も多い分子異常であり、陽性例ではイマチニブが第一選択で速やかな反応と良好な予後が得られることを再掲する。数値の照合：主出典の具体数（特発性好酸球増多症候群16例中9例に融合を検出、イマチニブ治療11例中9例が3か月を超えて反応）は候補に再掲がない。留保：主出典は RESTRICTED で確定（非OA）'
  uncertainty: 原著の抄録で確認した内容である。融合遺伝子は染色体4q12の間質性欠失により生じる。イマチニブは国内承認・保険適用のある薬剤だが、好酸球増多症候群・慢性好酸球性白血病に対する国内適応の有無は未確認である。慢性好酸球性白血病とチロシンキナーゼ融合遺伝子で定義される腫瘍群との切り分けはWHO分類第5版（HAEM5）のカテゴリ構成に基づく。別表1には本項目に対応する行がないため付けていない。
