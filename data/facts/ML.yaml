  domain: ML
  subdomain: 慢性好酸球性白血病
  assertion:
    plain_statement_ja: FIP1L1とPDGFRAの融合遺伝子は恒常的に活性化したチロシンキナーゼを作りイマチニブで阻害され、特発性好酸球増多症候群16例中9例に検出され、イマチニブを投与された11例中9例で3か月を超える奏効（好酸球数の正常化）が得られた。
