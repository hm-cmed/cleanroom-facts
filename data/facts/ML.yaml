- id: ML-006
  domain: ML
  subdomain: 急性骨髄性白血病
  assertion:
    plain_statement_ja: 低〜中間リスクの急性前骨髄球性白血病では、全トランスレチノイン酸と三酸化二ヒ素の併用は、全トランスレチノイン酸と化学療法の併用と比べて2年無イベント生存率が高く（97%対86%）、血液毒性と感染は少なかった。
    condition:
      region: 国際
      対象: 成人
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2556
    source: Lo-Coco F, Avvisati G, Vignetti M, et al. Retinoic Acid and Arsenic Trioxide for Acute Promyelocytic Leukemia. N Engl J Med. 2013;369(2):111-121.
    doi: 10.1056/NEJMoa1300874
    pmid: '23841729'
    pmcid: null
    url: https://doi.org/10.1056/NEJMoa1300874
    source_license: CC 表示なし
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（CC BY 4.0（OPEN）、作り手の調査バッチ81 2026-11-15）：Langdon K, Cosentino S, Wawryk O. Superiority of anthracycline-free treatment in standard-risk acute promyelocytic leukemia: A systematic review and comparative epidemiological analysis. Cancer Rep (Hoboken). 2024;7(3):e2035.（PMID: 38507294、DOI: 10.1002/cnr2.2035、PMCID: PMC10953833、https://creativecommons.org/licenses/by/4.0/）。裏づける部分：部分：低・中間リスク APL に対する ATRA＋三酸化ヒ素と ATRA＋化学療法の比較（主出典 Lo-Coco 2013）について、完全寛解率と2年無イベント生存・全生存を表で再掲し、ATRA＋三酸化ヒ素で好中球減少・血小板減少が少ない方向性を再掲する。数値の照合：完全寛解率 100% vs 95% は一致。2年 EFS は候補の表が「97% vs 85%」とし、カード・主出典の 86% と1ポイント異なる（候補側の相違。カードは主出典に従う）。留保：APL0406 の登録レコード（NCT00482833）は結果が掲載されておらず、登録経路の裏づけは使えなかった。主出典は RESTRICTED で確定（非OA）'
  uncertainty: APL0406試験（白血球数10×10⁹/L以下の低〜中間リスクが対象）の抄録で確認した数値である。完全寛解は併用群で評価可能例の全例、化学療法群で95%であった。三酸化二ヒ素製剤の国内適応範囲（初回治療への拡大の有無）は未確認であり、組み立て時にPMDAで確認すること。
