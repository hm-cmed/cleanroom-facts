- id: ML-003
  domain: ML
  subdomain: 急性骨髄性白血病
  assertion:
    plain_statement_ja: ELNの2022年勧告では、急性骨髄性白血病の遺伝子リスク分類と治療効果判定の基準が改訂され、ゲノム診断と測定可能残存病変（MRD）の評価が診療に組み込まれた。
    condition:
      region: 国際
      対象: 成人
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2553
    source: 'Döhner H, Wei AH, Appelbaum FR, et al. Diagnosis and management of AML in adults: 2022 recommendations from an international expert panel on behalf of the ELN. Blood. 2022;140(12):1345-1377.'
    doi: 10.1182/blood.2022016867
    pmid: '35797463'
    pmcid: null
    url: https://doi.org/10.1182/blood.2022016867
    source_license: CC BY-NC-ND 4.0（Crossref の license 欄で確認）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（CC BY 4.0（OPEN）、作り手の調査バッチ81 2026-11-15）：Liga M, Georgopoulou AN, Tsokanas D, Spyridonidis A, Labropoulou VT. ELN vs. IPSS-M in MDS/AML: Which Prognostic System Should Guide Clinical Decision-Making? Cancers. 2026;18(18):2993.（PMID: 42794960、DOI: 10.3390/cancers18182993、PMCID: PMC13604652、https://creativecommons.org/licenses/by/4.0/）。裏づける部分：部分：ELN 分類が2017年から2022年にかけて細胞遺伝学中心から分子情報を組み込んだ体系へ改訂されたこと、ELN 2022 の favorable・intermediate・adverse の3層、ELN が効果判定と MRD 評価・移植計画の指針となることを再掲する。数値の照合：数値の主張なし。留保：候補は MDS/AML の予後システム比較が主題のため、効果判定基準の改訂そのものは間接的な裏づけにとどまる。主出典は刊行版が CC BY-NC-ND で RESTRICTED のままで正しい（マスターの license_note と一致）'
  uncertainty: 抄録で確認した範囲である。遺伝子リスク分類の個別の遺伝子異常の一覧は抄録の範囲外であり、主張に含めていない（組み立て時に全文で照合すること）。分類の土台にはWHO分類第5版（HAEM5、2022）とICC 2022も併存し、版による食い違いがありうる。
