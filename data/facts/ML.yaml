- id: ML-004
  domain: ML
  subdomain: 急性骨髄性白血病
  assertion:
    plain_statement_ja: 強力化学療法が適応とならない未治療の急性骨髄性白血病では、アザシチジンにベネトクラクスを併用すると、アザシチジン単独と比べて全生存期間が延長し（中央値14.7か月対9.6か月、死亡のハザード比0.66）、完全寛解率も高かった（36.7%対17.9%）。
    condition:
      region: 国際
      対象: 成人
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2554
    source: DiNardo CD, Jonas BA, Pullarkat V, et al. Azacitidine and Venetoclax in Previously Untreated Acute Myeloid Leukemia. N Engl J Med. 2020;383(7):617-629.
    doi: 10.1056/NEJMoa2012971
    pmid: '32786187'
    pmcid: null
    url: https://doi.org/10.1056/NEJMoa2012971
    source_license: CC 表示なし
    legal_basis: B
    source_class: RESTRICTED
    corroboration: 自由に使える資料による裏づけ（GOV_US（OPEN、米国国立医学図書館の運営する試験登録）、作り手の調査バッチ81 2026-11-15）：ClinicalTrials.gov 登録レコード NCT02993523（VIALE-A試験、結果掲載あり）（https://clinicaltrials.gov/study/NCT02993523）。裏づける部分：部分：未治療で強力化学療法に不適な AML に対するアザシチジン＋ベネトクラクス併用とアザシチジン単独の比較で、全生存期間中央値を再掲する。数値の照合：OS 中央値 14.7 vs 9.6 か月はカードと完全一致。登録側の死亡 HR は 0.58 で論文・カードの 0.66 と異なり、完全寛解率も登録 38.8% vs 17.9% に対しカード 36.7% vs 17.9% とわずかに異なる（登録は更新解析）。留保：裏づけは OS 中央値にとどめる。主出典は RESTRICTED で確定（非OA）
  uncertainty: VIALE-A試験（431例、年齢中央値76歳）の抄録で確認した数値である。発熱性好中球減少症は併用群で多かった（42%対19%）。ベネトクラクスは2021年3月23日に国内で急性骨髄性白血病の適応追加承認を取得している（発売元の発表で確認）。
  curriculum:
