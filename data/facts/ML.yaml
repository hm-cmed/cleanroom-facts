  subdomain: 急性骨髄性白血病
  assertion:
    plain_statement_ja: 強力化学療法が適応とならない未治療の急性骨髄性白血病では、アザシチジンにベネトクラクスを併用すると、アザシチジン単独と比べて全生存期間が延長し（中央値14.7か月対9.6か月、死亡のハザード比0.66）、完全寛解率も高かった（36.7%対17.9%）。
