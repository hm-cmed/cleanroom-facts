    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: VIALE-A試験（431例、年齢中央値76歳）の抄録で確認した数値である。発熱性好中球減少症は併用群で多かった（42%対19%）。ベネトクラクスは2021年3月23日に国内で急性骨髄性白血病の適応追加承認を取得している（発売元の発表で確認）。
