- id: BT-014
  domain: BT
  subdomain: 下垂体腫瘍
  assertion:
    plain_statement_ja: 下垂体卒中は、突然発症の頭痛などを呈する臨床症候群であり医学的緊急事態である。速やかなヒドロコルチゾンの補充が救命的となりうる。
