      population: 頭蓋咽頭腫患者
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-874
    source: Müller HL, Merchant TE, Warmuth-Metz M, Martinez-Barbera JP, Puget S. Craniopharyngioma. Nature Reviews Disease Primers. 2019;5(1):75.
    doi: 10.1038/s41572-019-0125-9
    pmid: '31699993'
    pmcid: null
    url: https://doi.org/10.1038/s41572-019-0125-9
    source_license: ライセンス表示を確認できず（Nature Reviews Disease Primers誌、TDM のみ）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ66 2026-11-14）：Pires de Oliveira Neto C, Nascimento GC, Damianse SDSP, Faria MDS. Recent advances in craniopharyngioma pathophysiology and emerging therapeutic approaches. Front Endocrinol. 2025;16:1562942（PMID: 40433410、DOI: 10.3389/fendo.2025.1562942、PMCID: PMC12106005、https://pmc.ncbi.nlm.nih.gov/articles/PMC12106005/）。裏づける部分：候補（CC BY 総説）が、頭蓋咽頭腫はエナメル上皮腫型と乳頭型に分けられること、エナメル上皮腫型は 5〜15歳と45〜60歳の二峰性の発症ピークを示し小児に多く乳頭型は成人に限られること、視路と視床下部‐下垂体系への近接により内分泌・視覚・神経の障害と視床下部症候群を来すことを明記し、カードの骨格と一致する。補助候補（Javidialsaadi M, Luy DD, Smith HL, et al. Advances in the Management of Craniopharyngioma: A Narrative Review of Recent Developments and Clinical Strategies. J Clin Med. 2025;14(4):1101、CC BY）は、5年生存率約80%と生存が良好な一方で視床下部性肥満など視床下部障害による生活の質の問題を述べる。数値の照合：エナメル上皮腫型のピーク（5〜15歳・45〜60歳）は候補と一致。留保：「長期生存率は高い一方で視床下部の障害による生活の質の低下が問題となる」という一体の記述は単一の候補にはなく、候補と補助候補の組み合わせによる裏づけにとどまる。補助候補が頭蓋咽頭腫全体について述べる二峰性（5〜14歳・50〜74歳）は母集団が異なり、カードの型別の値とは異なる（申し送り参照）。主出典 SRC-874 は区分訂正あり（UNKNOWN→RESTRICTED）'
