- id: BT-018
  domain: BT
  subdomain: 髄膜癌腫症
  assertion:
    plain_statement_ja: 髄膜癌腫症（癌性髄膜炎）では、頭痛、悪心・嘔吐、認知機能の変化、歩行困難、脳神経麻痺、神経根症状、頸部・背部痛など多彩な症状がみられる。確定診断は髄液中の腫瘍細胞の証明（type I）によるもので、初回の髄液検査が陰性でも2回目の検査を行うことが推奨される。予後は不良で、治療目標は神経症状の進行を防ぎつつ生活の質を保って生存を延長することにある。
    condition:
      population: 固形癌の髄膜転移患者
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1623
    source: 'Le Rhun E, et al. Leptomeningeal metastasis from solid tumours: EANO-ESMO Clinical Practice Guideline for diagnosis, treatment and follow-up. ESMO Open. 2023;8(5):101624'
    doi: 10.1016/j.esmoop.2023.101624
    pmid: '37863528'
    pmcid: null
    url: https://doi.org/10.1016/j.esmoop.2023.101624
    source_license: CC BY-NC-ND 4.0（ESMO Open誌）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ66 2026-11-14）：Lim SW, Ku BM, Ahn MJ. Leptomeningeal Metastasis in Non-Small-Cell Lung Cancer with Actionable Genomic Alterations: Pathogenesis, Diagnosis, and Emerging Therapeutic Strategies. Cancers. 2026;18(13):2169（PMID: 42449711、DOI: 10.3390/cancers18132169、PMCID: PMC13360412、https://pmc.ncbi.nlm.nih.gov/articles/PMC13360412/）。裏づける部分：候補（CC BY 総説）が EANO-ESMO の分類を再掲し、type I は髄液中の悪性細胞の証明によるものと定義すること、初回の髄液検査が陰性でも最適条件で2回目の腰椎穿刺を行うことが推奨され感度が初回の約50〜60%から反復で約80%に上がること、症状として頭痛・悪心嘔吐・認知や精神状態の変化・歩行障害・脳神経麻痺・神経根症状が典型的であること、細胞診陽性例の生存期間中央値は週単位（予後良好群 15.5 週・不良群 6 週）であることを述べ、カードの骨格と一致する。数値の照合：候補の感度（初回約50〜60%→反復で約80%）はカードに含まれない追加情報であり、カード側の数値との矛盾はない。留保：候補は非小細胞肺癌に限った総説である。頸部・背部痛の明示と、「神経症状の進行を防ぎつつ生活の質を保って生存を延長する」という治療目標の文言そのものは候補では未確認。主出典 SRC-1623 の刊行版ライセンスは CC BY-NC-ND 4.0（Crossref の版データ・PMC 全文で確認）であり自由区分には当たらず、現行 RESTRICTED が正しい。PMCID は補完候補（PMC10619142）'
  uncertainty: ガイドライン本文で確認。生存期間の具体的な中央値は本作成で一次資料から確認できなかったため本カードには含めていない。
