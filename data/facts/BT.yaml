- id: BT-015
  domain: BT
  subdomain: 神経鞘腫
  assertion:
    plain_statement_ja: 前庭神経鞘腫の診断はMRIによるもので、組織診断は必ずしも必要ない。治療の選択肢は経過観察、外科的切除、分割照射、定位放射線治療であり、小さな腫瘍では経過観察と定位放射線治療が比較検討され、大きな腫瘍では外科的な圧迫解除が必須で、術後に分割照射や定位放射線治療が追加されることがある。
    condition:
      population: 前庭神経鞘腫患者
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1621
    source: Goldbrunner R, et al. EANO guideline on the diagnosis and treatment of vestibular schwannoma. Neuro Oncol. 2020;22(1):31-45
    doi: 10.1093/neuonc/noz153
    pmid: '31504802'
    pmcid: null
    url: https://doi.org/10.1093/neuonc/noz153
    source_license: Oxford University Press 標準出版モデル（Neuro-Oncology誌、CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ66 2026-11-14）：Lally AR, Welch RL, Terraciano A, et al. Socioeconomic disparities in vestibular schwannoma diagnosis and management: A systematic review. Neurosurg Rev. 2026;49(1):580（PMID: 42771071、DOI: 10.1007/s10143-026-04478-5、PMCID: PMC13597603、https://pmc.ncbi.nlm.nih.gov/articles/PMC13597603/）。裏づける部分：候補（CC BY の系統的レビュー）が、診断は MRI で確定すること、治療の選択肢は手術・放射線手術・経過観察であること、定位放射線手術は圧迫のない中等大の腫瘍に、外科的切除は大きな圧迫性腫瘍に適応されることを述べる。補助候補（Boyke AE, Al-Saadi T, Menaker SA, et al. Comparative analysis of stereotactic radiosurgery and microsurgery for vestibular schwannoma: a clinical and radiological evaluation. J Neurooncol. 2026;179(1):3、CC BY）も選択肢として経過観察・定位放射線手術・顕微鏡下切除を挙げ、小〜中等大（2〜3 cm 未満）への定位放射線手術の位置づけを示す。数値の照合：数値なし（管理方針のカード）。留保：分割照射の明示、術後に分割照射や定位放射線治療が追加されることがある点、「組織診断は必ずしも必要ない」という表現そのものは候補では未確認。主出典 SRC-1621 の区分は現行 RESTRICTED が正しい（OUP の標準出版モデル・非 OA）。PMCID は補完候補（PMC6954440）'
