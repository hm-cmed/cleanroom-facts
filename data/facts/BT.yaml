    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ66 2026-11-14）：Liu S, Shan B, Zhang Y, et al. Mechanisms, Imaging Phenotypes, and Therapeutic Advances of Neovascularization in Brain Metastases. Biomedicines. 2026;14(1):119（PMID: 41595655、DOI: 10.3390/biomedicines14010119、PMCID: PMC12839111、https://pmc.ncbi.nlm.nih.gov/articles/PMC12839111/）。裏づける部分：候補（CC BY 総説）が、脳転移は全癌患者の約20〜40%に生じ、原発巣は肺癌（約40〜50%）・乳癌（約15〜25%）・悪性黒色腫（約5〜20%）が多く、大腸癌と腎細胞癌がこれに次ぐことを明記し、カードの原発巣の構成（肺癌・乳癌・大腸癌・悪性黒色腫・腎細胞癌）と一致する。数値の照合：頻度はカードの「約20%」に対し候補は「約20〜40%」という範囲表記で、下限は一致するが上限側が異なる（申し送り参照）。留保：主出典 SRC-4813 の区分は現行 RESTRICTED が正しい（Springer Nature、Crossref のライセンスはテキスト・データマイニング用のみ・Europe PMC で非 OA）'
