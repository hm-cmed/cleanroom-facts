    doi: 10.1056/NEJMoa043330
    pmid: '15758009'
    pmcid: null
    url: https://doi.org/10.1056/NEJMoa043330
    source_license: NEJM（Massachusetts Medical Society、CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ66 2026-11-14）：Ribeiro A, Fote G, Himstead A, et al. Glioblastoma: From Pathophysiology to Novel Therapeutic Approaches. Biomedicines. 2025;13(8):1963（PMID: 40868217、DOI: 10.3390/biomedicines13081963、PMCID: PMC12384051、https://pmc.ncbi.nlm.nih.gov/articles/PMC12384051/）。裏づける部分：候補（CC BY 総説）が Stupp レジメンを逐語的に述べる：放射線治療（60 Gy）に連日テモゾロミド（75 mg/m²）を併用し、その後、補助テモゾロミド（150〜200 mg/m²、5日間投与・28日周期）6サイクル。生存期間中央値は放射線単独の 12.1 か月から併用の 14.6 か月に延長し、2年生存率は 10.4% から 26.5% に上昇したとする。数値の照合：生存期間中央値 14.6 対 12.1 か月、2年生存率 26.5% 対 10.4% は候補と一致。用量・投与法・サイクル数も一致。留保：試験登録レコード（ClinicalTrials.gov NCT00006353）には結果投稿がなく、登録レコードによる裏づけは使えなかった。主出典 SRC-1612 の区分は現行 RESTRICTED が正しい（NEJM、Crossref にライセンス表示なし・Europe PMC で非 OA）'
