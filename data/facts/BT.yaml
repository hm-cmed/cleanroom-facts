- id: BT-015
  domain: BT
  subdomain: 神経鞘腫
  assertion:
    plain_statement_ja: 前庭神経鞘腫の診断はMRIによるもので、組織診断は必ずしも必要ない。治療の選択肢は経過観察、外科的切除、分割照射、定位放射線治療であり、小さな腫瘍では経過観察と定位放射線治療が比較検討され、大きな腫瘍では外科的な圧迫解除が必須で、術後に分割照射や定位放射線治療が追加されることがある。
    condition:
      population: 前庭神経鞘腫患者
      region: 国際
    differential: null
    common_misconception: null
  provenance:
