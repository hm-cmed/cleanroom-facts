- id: BT-012
  domain: BT
  subdomain: 髄膜腫
  assertion:
    plain_statement_ja: 髄膜腫は最も頻度の高い原発性頭蓋内腫瘍であり、無症状で偶然発見された場合は画像による経過観察（watch-and-scan）が選択でき、手術を行う場合は被膜・付着部硬膜を含めた全摘出がしばしば根治的となる。手術不能例や再発例では、病変の大きさと部位が許せば定位放射線治療や分割照射が用いられる。
    condition:
      population: 髄膜腫患者
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1620
