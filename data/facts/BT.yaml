- id: BT-017
  domain: BT
  subdomain: 転移性脳腫瘍
  assertion:
    plain_statement_ja: 転移性脳腫瘍では、腫瘤効果の強い大きな病変には手術が妥当であり、未切除の1〜4個の転移（小細胞肺癌を除く）には定位放射線治療単独が、切除された1〜2個の転移には術後腔への定位放射線治療が選択肢となる。全脳照射を行う場合は、海馬を避けメマンチンを併用することが、生存期間4か月以上が見込まれ海馬近傍に病変がない患者で提案される。
    condition:
      population: 転移性脳腫瘍患者
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1622
    source: 'Vogelbaum MA, et al. (Schiff D, et al.) Treatment for Brain Metastases: ASCO-SNO-ASTRO Guideline. J Clin Oncol. 2022;40(3):242-264'
    doi: 10.1200/JCO.21.02314
    pmid: '34932393'
    pmcid: null
    url: https://doi.org/10.1200/JCO.21.02314
    source_license: Journal of Clinical Oncology（ASCO、CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ66 2026-11-14）：Bao J, Xu X, Wei S, Pan Z. Tailored radiotherapy for brain metastases improves precision and outcomes. Discover Oncol. 2025;16(1):2306（PMID: 41296115、DOI: 10.1007/s12672-025-03954-6、PMCID: PMC12748433、https://pmc.ncbi.nlm.nih.gov/articles/PMC12748433/）。裏づける部分：候補（CC BY 総説）が、限局性脳転移には定位放射線治療または手術が全脳照射より優先されること、腫瘤効果の強い大きな病変には手術または定位放射線治療を先行させること、切除例では術後照射が局所制御のために一般に推奨されること、海馬回避全脳照射＋メマンチンは海馬内・海馬から 5 mm 以内に病変がなく髄膜播種のない例が適格であることを述べ、カードの骨格と一致する。数値の照合：数値なし（推奨のカード）。留保：個数の条件（未切除の1〜4個に定位放射線治療単独・小細胞肺癌の除外、切除された1〜2個に術後腔への定位放射線治療）と、生存期間4か月以上が見込まれることが海馬回避＋メマンチンの条件である点は、候補では未確認。主出典 SRC-1622 の区分は現行 RESTRICTED が正しい（ASCO、ライセンス表示なし・Europe PMC で非 OA）'
  uncertainty: ガイドラインの抄録に基づく。原発巣の全身治療は本カードの範囲外。原発巣としては肺癌が最も多いことは脳転移の疫学として確立しているが、本ガイドラインの抄録の範囲では割合の数値を確認できなかったため数値は含めていない。メマンチンの国内承認は認知症に対するものであり、脳転移の全脳照射併用としての国内保険適用は本作成では確認未実施。
