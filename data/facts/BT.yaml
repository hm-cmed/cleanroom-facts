- id: BT-016
  domain: BT
  subdomain: 頭蓋咽頭腫
  assertion:
    plain_statement_ja: 頭蓋咽頭腫にはエナメル上皮腫型と乳頭型があり、エナメル上皮腫型は5〜15歳と45〜60歳の二峰性の発症ピークを示し小児にみられる型である。視交叉、視床下部、下垂体に近接するため、視力障害、内分泌障害、頭蓋内圧亢進症状を来し、長期生存率は高い一方で視床下部の障害による生活の質の低下が問題となる。
    condition:
      population: 頭蓋咽頭腫患者
      region: 国際
    differential: null
    common_misconception: null
  provenance:
