- id: BT-002
  domain: BT
  subdomain: 神経膠腫
  assertion:
    plain_statement_ja: 新規診断膠芽腫に対する放射線治療（60 Gy/30回）へのテモゾロミドの連日併用（75 mg/m²/日）と、その後のテモゾロミド補助療法（150〜200 mg/m²、5日間投与・28日周期、6サイクル）の追加は、放射線治療単独と比べて全生存期間を延長した（生存期間中央値14.6か月対12.1か月、2年生存率26.5%対10.4%）。
