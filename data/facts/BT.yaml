    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ66 2026-11-14）：Calaminus G, Alapetite C, Kortmann RD, et al. Final report of the SIOP-CNS-GCT II protocol for germinoma: Omitting radiotherapy boost is safe in localized disease in complete remission after chemotherapy. Neuro Oncol. 2026;28(9):2234-2247（PMID: 42234858、DOI: 10.1093/neuonc/noag127、PMCID: PMC13550669、https://pmc.ncbi.nlm.nih.gov/articles/PMC13550669/）。裏づける部分：候補（SIOP-CNS-GCT II 最終報告、CC BY）が、診断は血清・髄液の AFP と HCG の水準を踏まえた生検に基づくこと、転移性病変は神経軸全体の画像での非連続病変および／または髄液細胞診陽性によって定義されることを明記する。補助候補（Takami H, Shing MMK. Epidemiology of central nervous system germ cell tumors: global patterns, geographic variation, and methodological challenges. Front Oncol. 2026;16:1962617、CC BY）は、ジャーミノーマと非ジャーミノーマ性胚細胞腫瘍が予後も治療強度も異なる別個の entity として管理されることを述べる。数値の照合：数値なし（診断・病期の枠組みのカード）。留保：主出典 SRC-1617 の刊行版ライセンスは CC BY-NC 4.0（Crossref の版データ・Europe PMC レコード・PMC 全文のライセンス文で確認）であり自由区分には当たらず、現行 RESTRICTED が正しい。PMCID は補完候補（PMC8972311）'
