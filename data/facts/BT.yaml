    doi: 10.1038/s41572-019-0125-9
    pmid: '31699993'
    pmcid: null
    url: https://doi.org/10.1038/s41572-019-0125-9
    source_license: ライセンス表示を確認できず（Nature Reviews Disease Primers誌、TDM のみ）
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
