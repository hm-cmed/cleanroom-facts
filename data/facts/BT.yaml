- id: BT-009
  domain: BT
  subdomain: 胚細胞腫瘍
  assertion:
    plain_statement_ja: 限局性ジャーミノーマは放射線感受性が高く、化学療法後に全脳室照射と局所追加照射を行う治療で5年無イベント生存率が90%を超え、転移性ジャーミノーマは全頭蓋脊髄照射で治癒が期待できる。
    condition:
      population: 頭蓋内ジャーミノーマ患者
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1617
    source: Frappaz D, et al. EANO, SNO and Euracan consensus review on the current management and future development of intracranial germ cell tumors in adolescents and young adults. Neuro Oncol. 2022;24(4):516-527
    doi: 10.1093/neuonc/noab252
    pmid: '34724065'
    pmcid: null
    url: https://doi.org/10.1093/neuonc/noab252
    source_license: CC BY-NC 4.0（Neuro-Oncology誌）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ66 2026-11-14）：Calaminus G, Alapetite C, Kortmann RD, et al. Final report of the SIOP-CNS-GCT II protocol for germinoma: Omitting radiotherapy boost is safe in localized disease in complete remission after chemotherapy. Neuro Oncol. 2026;28(9):2234-2247（PMID: 42234858、DOI: 10.1093/neuonc/noag127、PMCID: PMC13550669、https://pmc.ncbi.nlm.nih.gov/articles/PMC13550669/）。裏づける部分：候補（SIOP-CNS-GCT II 最終報告、CC BY）が、限局性ジャーミノーマでは化学療法後に全脳室照射 24 Gy を行い（完全寛解例では局所追加照射の省略が安全）、5年無イベント生存率 0.94 であったこと、転移性ジャーミノーマでは全頭蓋脊髄照射 24 Gy＋追加照射で5年無イベント生存率 0.98・全生存率 1.00 であったことを報告する。限局性は化学療法＋全脳室照射で5年無イベント生存率が90%を超え、転移性は全頭蓋脊髄照射で治癒が期待できるというカードの骨格と一致する。数値の照合：限局性の5年無イベント生存率 0.94 はカードの「90%超」と一致。転移性の5年無イベント生存率 0.98・全生存率 1.00。留保：候補のプロトコルでは完全寛解例で局所追加照射を省略しており、カードの「全脳室照射と局所追加照射を行う治療」という記述とは運用に差がある（追加照射は残存例に実施。申し送り参照）。主出典は BT-008 と同じ SRC-1617（CC BY-NC、現行 RESTRICTED が正しい）'
  uncertainty: 数値は抄録で確認（5年無イベント生存率90%超は限局性ジャーミノーマに対する化学療法＋全脳室照射の成績）。NGGCTの5年無イベント生存率は70%超と同抄録に記載されている。 化学療法の個別薬剤の国内承認・保険適用は未確認。　【承認状況の再点検 2026-10-31（作り手、PMDA・厚生労働省などの公的情報）】カードの主張の中心は放射線治療で化学療法薬は名指しされていないが、ジャーミノーマの標準化学療法（カルボプラチン＋エトポシドを中心とするレジメン）に用いる薬剤はいずれも国内承認薬であり、「個別薬剤の承認・保険適用は未確認」は解消できる
