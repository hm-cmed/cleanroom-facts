- id: BT-001
  domain: BT
  subdomain: 神経膠腫
  assertion:
    plain_statement_ja: WHO中枢神経系腫瘍分類第5版（2021年）では、成人びまん性神経膠腫は分子診断に基づいて分類され、IDH変異の有無が分類の軸となり、IDH変異型では1p/19q共欠失の有無により星細胞腫と乏突起膠腫が分けられるなど、組織像と分子所見を統合した診断（統合診断）が行われる。
    condition:
      population: 成人びまん性神経膠腫患者
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1611
    source: 'Louis DN, et al. The 2021 WHO Classification of Tumours of the Central Nervous System: a summary. Neuro Oncol. 2021;23(8):1231-1251'
    doi: 10.1093/neuonc/noab106
    pmid: '34185076'
    pmcid: null
    url: https://doi.org/10.1093/neuonc/noab106
    source_license: Oxford University Press 標準出版モデル（Neuro-Oncology誌、CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ66 2026-11-14）：Kurokawa R, Takami H, Kurokawa M, et al. Imaging diagnosis of adult-type diffuse gliomas in the era of WHO CNS5 and cIMPACT-NOW updates 8-11: a narrative review. Jpn J Radiol. 2026;44(9):1534-1542（PMID: 42159911、DOI: 10.1007/s11604-026-02013-6、PMCID: PMC13526116、https://pmc.ncbi.nlm.nih.gov/articles/PMC13526116/）。裏づける部分：候補（CC BY の画像総説）が、WHO CNS5 が成人型びまん性神経膠腫を3つの統合診断型（星細胞腫 IDH変異型／乏突起膠腫 IDH変異・1p/19q共欠失型／膠芽腫 IDH野生型）に再編し、分子所見に基づく分類を導入したことを明記する。IDH の有無が軸となり、IDH変異型では 1p/19q 共欠失の有無で星細胞腫と乏突起膠腫が分けられるというカードの骨格と一致する。数値の照合：数値なし（分類のカード）。留保：MGMT プロモーターのメチル化が分類そのものの軸ではない点は候補では未確認。主出典 SRC-1611 の区分は現行 RESTRICTED が正しい（OUP の標準出版モデル、Europe PMC で非 OA）。PMCID は補完候補（PMC8328013、識別子補完候補の節参照）'
  uncertainty: 分類の枠組みは2021年版の総説に基づく。MGMTプロモーターのメチル化は主に膠芽腫の治療反応性の指標として用いられる点であり、分類そのものの軸ではない。
