- id: NI-003
  domain: NI
  subdomain: HIV関連神経認知障害
  assertion:
    plain_statement_ja: HIV 関連神経認知障害は、無症候性神経認知障害、軽度神経認知障害、HIV 関連認知症の 3 段階に分類され、抗レトロウイルス療法の時代にも軽症型が残存する。
