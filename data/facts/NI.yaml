    legal_basis: B
    source_class: GOV_JP
    corroboration: null
  uncertainty: 変異型 CJD の国内発生はこれまで 1 例のみであり、記載は主に英国症例に基づく WHO 診断基準（2001）・EU 診断基準の紹介である。
