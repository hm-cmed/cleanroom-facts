  uncertainty: 本分類は研究用の操作的定義であり、臨床現場では他の認知症原因の除外を前提とする。 抗レトロウイルス薬の個別薬剤の国内承認・保険適用は未確認（本分類そのものは特定の薬剤に依存しない）。　【承認状況の再点検 2026-10-31（作り手、PMDA・厚生労働省などの公的情報）】抗レトロウイルス薬はHIV感染症の適応で国内承認・保険収載済みの薬剤群である（PMDA添付文書情報、2026-10-31確認）
