- id: NI-005
  domain: NI
  subdomain: プリオン病
  assertion:
    plain_statement_ja: 孤発性 Creutzfeldt-Jakob 病の臨床診断基準には頭部 MRI 所見が組み込まれており、拡散強調画像または FLAIR 画像で大脳皮質の 2 領域以上、または尾状核と被殻の両方に高信号を認めることが診断を支持し、この所見は孤発性 CJD 症例の 83% で陽性となる。
    condition:
      population: 急速進行性認知症の患者
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1635
    source: Zerr I, Kallenberg K, Summers DM, et al. Updated clinical diagnostic criteria for sporadic Creutzfeldt-Jakob disease. Brain. 2009;132(Pt 10):2659-2668
    doi: 10.1093/brain/awp191
    pmid: '19773352'
    pmcid: null
    url: https://doi.org/10.1093/brain/awp191
    source_license: ライセンス未確認（Brain 誌、PMC に著者原稿が収載）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: 自由に使える資料による裏づけ（GOV_US、作り手の調査バッチ49 2026-11-12）：Centers for Disease Control and Prevention. Clinical Overview of Creutzfeldt-Jakob Disease (CJD)（GOV_US、https://www.cdc.gov/creutzfeldt-jakob/hcp/clinical-overview/、新規 SRC 候補）。裏づける部分：候補（米国 CDC の CJD 臨床概要、実際に開いて本文を確認）に、孤発性 CJD の probable 診断の検査所見として「MRI で尾状核・被殻の高信号、または拡散強調画像（DWI）・FLAIR で少なくとも2つの皮質領域（側頭葉・頭頂葉・後頭葉）の高信号」が明記され、同ページは本カードの主出典（Zerr 2009）を引用している。MRI 所見が臨床診断基準に組み込まれているという主張の核が裏づけられる。数値の照合：孤発性 CJD 症例の83%で陽性という数値は候補に再掲がなく、その数値を留保する（未再掲として記録）。留保：主出典（SRC-1635）は区分の訂正対象（Europe PMC で CC BY-NC を確認、UNKNOWN → RESTRICTED）。CDC の現行ページは RT-QuIC 陽性を軸とする probable 診断の経路も併記しており、診断基準の枠組みの変化としてフラグに記録した。候補は出典マスター未登録のため新規 SRC 登録候補
  uncertainty: 髄液 14-3-3 蛋白や脳波の周期性同期性放電は従来の診断基準の要素であり、分子サブタイプにより有用性が異なることが同論文で示されている。数値（83%）は抄録から読み取った。
  curriculum:
    kokushi: 医学各論 Ⅸ-3-B-①（Creutzfeldt-Jakob病、b）；医学各論 Ⅻ-4-A-⑱（プリオン病、c）
    core_curriculum: 'PS-02-03-05 (id: JkxnuP0)；TBL-01-00-033 (id: Jlvnlcw)'
