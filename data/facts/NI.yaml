- id: NI-002
  domain: NI
  subdomain: 進行性多巣性白質脳症
  assertion:
    plain_statement_ja: 進行性多巣性白質脳症は、HIV 感染症やナタリズマブなどの免疫抑制治療に伴う細胞性免疫不全を背景に JC ウイルスが再活性化して生じる脱髄疾患であり、診断は臨床・画像所見に髄液 PCR での JC ウイルス検出を組み合わせて確立できる。
    condition:
      population: 免疫不全状態にある患者
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-5024
    source: Jia DT. Progressive multifocal leukoencephalopathy - a diagnostic guide for the clinical neurologist. Front Neurol. 2026;17
    doi: 10.3389/fneur.2026.1692522
    pmid: '41988494'
    pmcid: PMC13076114
    url: https://europepmc.org/article/MED/41988494
    source_license: CC BY
    legal_basis: B
    source_class: OPEN
    corroboration: '元の主出典：SRC-1632（Berger JR, Aksamit AJ, Clifford DB, et al. PML diagnostic criteria: consensus statement from the AAN Neuroinfectious Disease Section. Neurology. 2013;80(15):1430-1438）'
  uncertainty: 免疫再構築に伴う IRIS（免疫再構築炎症反応症候群）は PML の経過上の重要な論点だが、採用した診断基準論文の抄録には明示がなく、本文での確認を要する。ナタリズマブは国内承認薬（多発性硬化症）である。
