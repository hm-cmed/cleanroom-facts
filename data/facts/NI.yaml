- id: NI-015
  domain: NI
  subdomain: 真菌性髄膜炎
  assertion:
    plain_statement_ja: 非 HIV のクリプトコックス髄膜炎では、導入療法としてリポソーマルアムホテリシン B 3〜4 mg/kg/日とフルシトシン 25 mg/kg を 1 日 4 回、2 週間以上の投与が推奨され（Cryptococcus gattii 感染症やクリプトコッコーマでは 4〜6 週間への延長を考慮）、その後はフルコナゾールによる 8 週間の地固め療法と 12 か月間の維持療法に移行する。
    condition:
      population: 非 HIV のクリプトコックス髄膜炎患者
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1641
    source: 'Chang CC, Harrison TS, Bicanic TA, et al. Global guideline for the diagnosis and management of cryptococcosis: an initiative of the ECMM and ISHAM in cooperation with the ASM. Lancet Infect Dis. 2024;24(8):e495-e512'
    doi: 10.1016/S1473-3099(23)00731-4
    pmid: '38346436'
    pmcid: null
    url: https://doi.org/10.1016/S1473-3099(23)00731-4
    source_license: © Elsevier（The Lancet Infectious Diseases、CC 表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ49 2026-11-12）：Sultan A, Raja H, Abrar A, et al. Cryptococcal Meningitis Beyond Immunosuppression: A Case Report in an Immunocompetent Individual. Case Rep Infect Dis. 2026;2026（CC BY、PMID 42518947、DOI 10.1155/crdi/8630525、PMC13383004、新規 SRC 候補）。裏づける部分：候補（CC BY の症例報告）の全文の治療フェーズ表に、導入療法はリポソーマルアムホテリシン B＋フルコナゾール／フルシトシンを2週間、地固め療法はフルコナゾール 400 mg/日を8週間、維持療法はフルコナゾール 200 mg/日を6〜12か月と明記され、本文でも推奨導入療法としてリポソーマルアムホテリシン B（3〜6 mg/kg/日）とフルシトシン 100 mg/kg/日（＝25 mg/kg を1日4回）の併用が述べられ、非 HIV 例の導入→地固め8週間→維持療法という治療の流れの核が裏づけられる。数値の照合：地固め療法8週間はカードと一致。導入の用量はカード 3〜4 mg/kg/日に対し候補 3〜6 mg/kg/日（候補の範囲が広い）。維持期間はカード12か月に対し候補6〜12か月（カードの値は候補の範囲内）。留保：候補は症例報告で、本文中の併用期間の記述（4〜6週間）とフェーズ表（導入2週間）の間に内部の揺れがある。Cryptococcus gattii 感染症やクリプトコッコーマで4〜6週間への延長を考慮するという要素は候補に明記がなく、その部分を留保して B。候補は出典マスター未登録のため新規 SRC 登録候補'
  uncertainty: 抗真菌薬の国内承認状況は NI-014 の uncertainty と同様である。導入期間の延長は患者背景（臓器移植後など）によっても判断される。
