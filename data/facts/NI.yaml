    doi: 10.1212/01.WNL.0000287431.88658.8b
    pmid: '17914061'
    pmcid: null
    url: https://doi.org/10.1212/01.WNL.0000287431.88658.8b
    source_license: ライセンス未確認（Neurology 誌、PMC に著者原稿が収載）
