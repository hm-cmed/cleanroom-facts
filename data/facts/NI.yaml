    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ49 2026-11-12）：Meyding-Lamadé U, Craemer EM, Aydin K, et al. S1 guidelines of the German Society of Neurology for Viral Meningoencephalitis - AWMF Registration No.: 030-100. Neurol Res Pract. 2026;8(1)／Alnomasy SF, Alotaibi BS, Mujamammi AH, et al. Microbial aspects and potential markers for differentiation between bacterial and viral meningitis among adult patients. PLoS One. 2021;16(6)（CC BY、PMID 41998791、DOI 10.1186/s42466-026-00487-3、PMC13091275、新規 SRC 候補）。裏づける部分：候補1（ドイツ神経学会 S1 ガイドライン、CC BY）の全文に、ウイルス性では中等度の細胞増多（通常1000個/µL未満）で蛋白・乳酸の上昇は軽度か無いという髄液像と、髄液乳酸・プロカルシトニンが細菌性とウイルス性の鑑別に有用であることが明記される。候補2（CC BY の比較研究、PMID 34115780、DOI 10.1371/journal.pone.0251518、PMCID PMC8195399）の全文では、細菌性髄膜炎はウイルス性に比べ髄液の白血球数・蛋白が高く糖が低いことが実データで示され、蛋白上昇・糖低下という化学所見の方向は裏づけられる。数値の照合：—。留保：「細菌性＝好中球優位、ウイルス性＝リンパ球優位」という細胞型の対比そのものは、自由な全文（ガイドライン・総説・比較研究）には再掲が見つからなかった（この型の表は MSD マニュアル等の医学百科と制限付きガイドラインにのみ現れる。新ルールでは医学百科を根拠にしない）。その中心要素を留保して B。候補はいずれも出典マスター未登録のため新規 SRC 登録候補'
  uncertainty: ガイドライン本文（書籍）は未入手のため、記載内容は学会の公開資料および本ガイドラインを引用する公的資料で確認した範囲に限った。取り込み時に本文での最終確認を推奨する。
