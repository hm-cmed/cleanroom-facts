- id: NI-025
  domain: NI
  subdomain: 化膿性関節炎
  assertion:
    plain_statement_ja: 化膿性関節炎は、急性の非外傷性の関節痛・腫脹・発熱を呈する患者では直ちに鑑別に挙げるべき緊急疾患であり、診断には関節穿刺による関節液検査が必須で、関節液を採取した後に経験的抗菌薬を開始し、起因菌は黄色ブドウ球菌が最も多く、治療期間は通常 2〜6 週間である。
