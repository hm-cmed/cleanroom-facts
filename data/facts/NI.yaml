    legal_basis: B
    source_class: RESTRICTED
    corroboration: 自由に使える資料による裏づけ（OPEN、作り手の調査バッチ49 2026-11-12）：Bozzola E, Spina G, Valeriani M, et al. Management of pediatric post-infectious neurological syndromes. Ital J Pediatr. 2021;47(1)（CC BY、PMID 33494818、DOI 10.1186/s13052-021-00968-y、PMC7836589、新規 SRC 候補）。裏づける部分：候補（CC BY の総説）の全文に、IPMSSG の2013年改訂の定義が引用され、小児 ADEM は「炎症性脱髄が推定される最初の多巣性の中枢神経イベント」で「発熱・全身疾患・痙攣後症状では説明できない脳症」を伴うこと、ADEM は単相性の経過を取りうること、感染後神経症候群としての位置づけが明記され、主張の核が裏づけられる。数値の照合：—。留保：「ワクチン接種に続いて生じる」という要素は候補では感染後の枠組みが中心で、ワクチン後の文脈の逐語の確認が弱く、その部分を留保して B。主出典（SRC-1644）は Crossref・Europe PMC のいずれでも CC ライセンスの表示がなく RESTRICTED と矛盾しない。候補は出典マスター未登録のため新規 SRC 登録候補
