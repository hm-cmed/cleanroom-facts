      population: 脳炎が疑われる患者
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1625
    source: Graus F, Titulaer MJ, Balu R, et al. A clinical approach to diagnosis of autoimmune encephalitis. Lancet Neurol. 2016;15(4):391-404
    doi: 10.1016/S1474-4422(15)00401-9
    pmid: '26906964'
    pmcid: null
    url: https://doi.org/10.1016/S1474-4422(15)00401-9
    source_license: © Elsevier Ltd（Lancet Neurology、CC 表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ49 2026-11-12）：Karabulut S, Uyaroğlu HO, Barçın E. Seronegative Autoimmune Encephalitis: A Case Report and Literature Review on Psychiatric Presentations. Case Rep Psychiatry. 2026;2026（CC BY、PMID 42516543、DOI 10.1155/crps/9618597、PMC13402879、新規 SRC 候補）。裏づける部分：候補1（CC BY の症例報告・文献レビュー）の全文に、Graus 2016 の possible autoimmune encephalitis の基準がほぼそのまま再掲される：3か月未満の亜急性の経過で記憶障害・精神状態の変化・精神症状のいずれかが現れ、新規の局所神経所見・新規発症のけいれん発作・髄液細胞増多・脳炎を示唆する MRI 所見のうち少なくとも1つを伴うこと。候補2（CC BY の総説、PMID 41904946、DOI 10.1002/advs.202519049、PMCID PMC13326022）の全文には、Graus らの基準は特異的抗体結果が得られる前でも適用でき、早期の治療開始につながる枠組みであることが明記され、「抗体検査の結果を待たずに臨床症候群から診断を進める」という主張の枠組みも裏づけられる。数値の照合：—。留保：髄液細胞増多の閾値（5個/mm³超）と「他の原因が合理的に除外できる」という要素は候補1の再掲には含まれず、その部分を留保して B。主出典（SRC-1625）は PMC に著者原稿が収載されるがライセンス表示はなく RESTRICTED が正しい（PMCID は補完候補として区分訂正の節に記録）。候補はいずれも出典マスター未登録のため新規 SRC 登録候補'
  uncertainty: 本基準は専門家コンセンサスに基づく操作的基準であり、確定診断には自己抗体の検出等が別途必要となる。免疫療法の内容は NI-029 を参照。 免疫療法に用いる薬剤の国内承認・保険適用の確認状況は NI-029 に記載した。
