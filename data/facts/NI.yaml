- id: NI-004
  domain: NI
  subdomain: HTLV-Ⅰ関連脊髄症
  assertion:
    plain_statement_ja: HTLV-Ⅰ関連脊髄症の診断は、進行性の痙性対麻痺を呈する患者で、血液および脳脊髄液中に抗 HTLV-Ⅰ抗体または HTLV-Ⅰゲノム（プロウイルス）を検出することに基づく。
