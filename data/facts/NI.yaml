- id: NI-007
  domain: NI
  subdomain: プリオン病
  assertion:
    plain_statement_ja: プリオンは通常の滅菌・消毒に抵抗性を示すため、プリオン病患者のハイリスク手技に用いた手術器具には、十分な洗浄のうえプレバキューム式高圧蒸気滅菌 134℃・18 分間など、通常より強力な専用の不活性化処理が必要である。
    condition:
      population: プリオン病患者・疑い患者に使用した医療器具
      region: 日本
    differential: null
    common_misconception: null
  provenance:
