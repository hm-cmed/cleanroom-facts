  assertion:
    plain_statement_ja: 日本の細菌性髄膜炎診療ガイドラインは、新生児を除く乳幼児・学童および成人に対して、デキサメタゾン 0.15 mg/kg を 6 時間ごとに、最初の抗菌薬投与の 10〜20 分前（または同時）に開始する副腎皮質ステロイド薬の併用を推奨する。
    condition:
      population: 新生児を除く細菌性髄膜炎の小児・成人患者
      region: 日本
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1638
    source: 日本神経学会・日本神経治療学会・日本神経感染症学会 監修、「細菌性髄膜炎診療ガイドライン」作成委員会 編. 細菌性髄膜炎診療ガイドライン2014. 南江堂. 2014
    doi: null
    pmid: null
    pmcid: null
    url: null
    source_license: © 日本神経学会・日本神経治療学会・日本神経感染症学会（南江堂、CC 表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ49 2026-11-12）：Zambelli G, Masetti M, Diona S, et al. Adjunctive Corticosteroids in Pediatric Meningitis: Current Evidence, Clinical Controversies, and Future Directions. Pharmaceuticals. 2026;19(10)（CC BY、PMID 42943260、DOI 10.3390/ph19101563、PMC13708625、新規 SRC 候補）。裏づける部分：候補（CC BY の総説）の全文に、小児ではデキサメタゾン 0.15 mg/kg を6時間ごとに2〜4日間静注するレジメンが一般的に推奨されること、初回量は最初の抗菌薬投与の直前か同時であるべきことが明記され、用量・間隔・投与タイミングの核が裏づけられる。数値の照合：—。留保：カードは日本のガイドラインが新生児を除く乳幼児・学童および成人にこの併用を推奨するという国内ガイドライン固有の表明であり、候補は小児中心の記述で、成人への適用と「10〜20分前」という時間指定までは再掲がないため、その部分を留保して B。候補は出典マスター未登録のため新規 SRC 登録候補'
  uncertainty: デキサメタゾンは国内承認薬だが、細菌性髄膜炎への補助療法としての用法は添付文書の効能・効果に明示されておらず、保険適用の扱いは取り込み側で確認を推奨する。推奨内容は学会公開資料および本ガイドラインを引用する資料で確認した。
