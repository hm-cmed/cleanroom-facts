- id: NI-029
  domain: NI
  subdomain: 自己免疫性脳炎
  assertion:
    plain_statement_ja: 抗体介在性脳炎の治療は、副腎皮質ステロイド・免疫グロブリン静注療法・血漿交換による第一選択免疫療法と、腫瘍がある場合の腫瘍摘出が基本であり、抗 NMDA 受容体脳炎の観察コホート（577 例）では第一選択免疫療法または腫瘍摘出により 53% が 4 週以内に改善し、第一選択で改善しない例へのリツキシマブやシクロホスファミドによる第二選択免疫療法は良好な転帰と関連し、治療開始が早いことが転帰良好の予測因子であった。
    condition:
      population: 抗体介在性脳炎（抗 NMDA 受容体脳炎）患者
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1626
    source: 'Titulaer MJ, McCracken L, Gabilondo I, et al. Treatment and prognostic factors for long-term outcome in patients with anti-NMDA receptor encephalitis: an observational cohort study. Lancet Neurol. 2013;12(2):157-165'
    doi: 10.1016/S1474-4422(12)70310-1
    pmid: '23290630'
    pmcid: null
    url: https://doi.org/10.1016/S1474-4422(12)70310-1
    source_license: © Elsevier Ltd（Lancet Neurology、CC 表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ49 2026-11-12）：Liu CY, Zhu J, Zheng XY, et al. Anti-N-Methyl-D-aspartate Receptor Encephalitis: A Severe, Potentially Reversible Autoimmune Encephalitis. Mediators Inflamm. 2017;2017（CC BY、PMID 28698711、DOI 10.1155/2017/6361479、PMC5494059、新規 SRC 候補）。裏づける部分：候補（CC BY の総説）の全文に、第一選択免疫療法は副腎皮質ステロイド・免疫グロブリン静注・血漿交換で、腫瘍が見つかれば摘出を検討すること、第一選択で改善しない例にはリツキシマブ・シクロホスファミドなどの第二選択免疫療法が用いられることが明記され、さらに本カードの主出典のコホートについて、追跡された501例のうち472例（94%）が第一選択免疫療法または腫瘍摘出を受け、その約50%が4週以内に改善し、第一選択に反応しなかった221例中125例が第二選択を受けて、受けなかった例より転帰が良かったことが明記され、主張の核が裏づけられる。数値の照合：4週以内の改善はカード53%（577例コホート）に対し、候補は「約50%」（追跡された501例を分母とする概数表記）で実質一致する。留保：「治療開始が早いことが転帰良好の予測因子」という要素は、候補では抗体価の早期低下と転帰の関係などの形で論じられ、逐語の再掲は弱いため、その一点を留保して B。主出典（SRC-1626）は PMC に著者原稿が収載されるがライセンス表示はなく RESTRICTED が正しい（PMCID は補完候補として区分訂正の節に記録）。候補は出典マスター未登録のため新規 SRC 登録候補'
