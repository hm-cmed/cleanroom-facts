    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ49 2026-11-12）：Mihailov MD, Manea MS, Olariu IC, Doros GS. The Anti-Vaccine Legacy: Re-Emergence of Subacute Sclerosing Panencephalitis in Children. NeuroSci. 2026;7(2)（CC BY、PMID 42042625、DOI 10.3390/neurosci7020044、PMC13118877、新規 SRC 候補）。裏づける部分：候補（CC BY の総説）の全文に、SSPE は麻疹ウイルスの持続感染による慢性進行性の中枢神経変性疾患で、発症は初感染の数年後であること、症状は認知低下や行動・性格の変化に始まり周期性ミオクローヌスなどの運動症状へ進むこと、診断は髄液／血清の抗麻疹抗体価上昇という免疫学的証拠と脳波の周期性放電に支えられること、死亡率は約95%と極めて高く、第I期から最終期まで1〜5年で死亡に至ることが明記され、主張の核が裏づけられる。数値の照合：発症までの期間はカード「麻疹罹患から平均6年後」に対し、候補の症例集積では平均潜伏期間7.1年（範囲4〜9年）。一般論としての「数年後」は一致するが、平均値の置き方は出典により異なる（両値を記録）。留保：候補は出典マスター未登録のため新規 SRC 登録候補'
