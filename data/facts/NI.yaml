- id: NI-012
  domain: NI
  subdomain: 脳膿瘍
  assertion:
    plain_statement_ja: 脳膿瘍は副鼻腔・中耳・歯などの隣接感染巣からの直接波及、血行性播種、外傷・脳神経外科手術後などの経路で生じ、診断には MRI が推奨され、典型的にはリング状増強と拡散制限を示す病変として描出される。
    condition:
      population: 脳膿瘍が疑われる小児・成人患者
      region: 国際
    differential: null
    common_misconception: null
  provenance:
