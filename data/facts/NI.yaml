    legal_basis: B
    source_class: GOV_JP
    corroboration: null
  uncertainty: 滅菌条件は器具の耐熱性や洗浄方法により複数のパターンが示されており、134℃・18 分間はアルカリ洗浄を用いない場合の代表的な条件である。ガイドライン 2020 年版以降の改訂の有無は取り込み側で再確認を推奨する。
