- id: NI-030
  domain: NI
  subdomain: 髄膜炎
  assertion:
    plain_statement_ja: 成人の細菌性髄膜炎で最も多い臨床所見は発熱、頭痛、項部硬直、意識障害であり、発熱・項部硬直・意識障害の古典的三徴がそろうのは患者の半数以下で、個々の所見が欠けても細菌性髄膜炎は否定できない。診断の確定には腰椎穿刺による髄液検査が中心となる。穿刺に先立って頭部CTを行うのは、局所神経脱落所見（脳神経麻痺を除く）、新規発症のけいれん、Glasgow Coma Scale 10未満の高度の意識障害、高度の免疫不全のいずれかがある場合に限られ、これらがなければCTを待たずに穿刺する。穿刺が遅れる場合は血液培養を採取したうえで経験的抗菌薬投与を先行させ、抗菌薬投与は来院後1時間以内が目標とされる。
    condition:
      region: 欧州
      対象: 細菌性髄膜炎が疑われる成人
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-4815
    source: 'van de Beek D, Cabellos C, Dzupova O, et al. ESCMID guideline: diagnosis and treatment of acute bacterial meningitis. Clin Microbiol Infect. 2016;22 Suppl 3:S37-S62'
    doi: 10.1016/j.cmi.2016.01.007
    pmid: '27062097'
    pmcid: null
    url: https://doi.org/10.1016/j.cmi.2016.01.007
    source_license: © European Society of Clinical Microbiology and Infectious Diseases（Elsevier、CC 表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ49 2026-11-12）：Zambelli G, Masetti M, Diona S, et al. Adjunctive Corticosteroids in Pediatric Meningitis: Current Evidence, Clinical Controversies, and Future Directions. Pharmaceuticals. 2026;19(10)／Román-Montes CM, Pérez-López VA, Avalos-Celis NE, et al. Outcomes of acute meningitis according to immunosuppression status: 15-year retrospective cohort. PLoS One. 2026;21(3)（CC BY、PMID 42943260、DOI 10.3390/ph19101563、PMC13708625、新規 SRC 候補）。裏づける部分：候補1（CC BY の総説）の全文に、古典的三徴がそろうのを待たずに評価と治療を開始すること、穿刺前の画像検査は適応を限って行うこと、穿刺が遅れる場合は血液培養を採取して直ちに治療を開始すること、経験的抗菌薬は受診後1時間以内を理想とすることが明記される。候補2（CC BY のコホート研究、PMID 41875396、DOI 10.1371/journal.pone.0344150、PMCID PMC13012731）の全文では、古典的三徴がそろったのは免疫抑制の有無にかかわらず約2割（19〜21%）にとどまり、カードの「半数以下」という記述と一致する。数値の照合：三徴の頻度はカード「半数以下」に対し、候補2は19〜21%で、カードの範囲内に収まる。留保：ESCMID ガイドライン固有の CT 先行の4条件（局所神経脱落所見・新規発症のけいれん発作・GCS 10未満・高度の免疫不全）の逐条の再掲は候補になく、その細部を留保して B。候補1は小児中心の総説だが、1時間以内の目標や血液培養先行の原則は年齢を問わない形で述べられている。候補はいずれも出典マスター未登録のため新規 SRC 登録候補'
  uncertainty: 本カードは ESCMID ガイドライン（2016年）の本文で確認した範囲に基づく。既存カード NI-008 の出典である細菌性髄膜炎診療ガイドライン2014（国内）は本文未入手のため、臨床像と初期評価の逐語確認が可能な本ガイドラインを新規出典とした。Kernig 徴候・Brudzinski 徴候などの髄膜刺激徴候は感度が低く診断への寄与は限られることが同ガイドラインに記載されている。小児では発熱・頭痛・項部硬直・嘔吐が多いとされるが、本カードは成人の所見に絞った。経験的抗菌薬の具体的な薬剤選択は既存カード NI-009〜011 が担い、本カードでは薬剤名は含めていない（国内で承認された抗菌薬製剤を用いる）。
