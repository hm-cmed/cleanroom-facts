- id: NI-017
  domain: NI
  subdomain: 結核性髄膜炎
  assertion:
    plain_statement_ja: 結核性髄膜炎に対するデキサメタゾンの併用は、14 歳超の患者を対象とした無作為化比較試験で死亡のリスクを下げた（相対危険度 0.69）が、生存者における重度障害の割合は有意には減らさなかった。
    condition:
      population: 結核性髄膜炎の青年・成人患者
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1643
    source: Thwaites GE, Nguyen DB, Nguyen HD, et al. Dexamethasone for the treatment of tuberculous meningitis in adolescents and adults. N Engl J Med. 2004;351(17):1741-1751
    doi: 10.1056/NEJMoa040573
    pmid: '15496623'
    pmcid: null
    url: https://doi.org/10.1056/NEJMoa040573
    source_license: © Massachusetts Medical Society（CC 表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ49 2026-11-12）：Younas A, Noor R, Shaukat MT, et al. Efficacy and Safety of Corticosteroids in Tuberculous Meningitis: Systematic Review, Meta-Analysis, and Meta-Regression. Brain Behav. 2026;16(8)（CC BY、PMID 42517870、DOI 10.1002/brb3.71639、PMC13411294、新規 SRC 候補）。裏づける部分：候補（CC BY の系統的レビュー・メタ解析、11研究1917例）の全文に、副腎皮質ステロイド併用が全原因死亡を有意に減らすこと（統合相対危険度0.84、95%信頼区間0.76〜0.94）、HIV 非感染例では長期神経学的障害への有意な効果がなかったとする Cochrane レビューの結論が明記され、「死亡は減るが生存者の重度障害は有意には減らない」という主張の結論の方向が裏づけられる。数値の照合：カードの相対危険度0.69は単一の無作為化比較試験（主出典）の値で、候補の統合値は0.84（11研究）。対象が異なるため同一の数値ではないが、方向は一致する（両値を記録）。留保：2025年に刊行された結核性髄膜炎の国際診療ガイドライン（Lancet Infect Dis. 2026;26(2)、CC BY、PMID 40840485、DOI 10.1016/S1473-3099(25)00364-0、PMCID PMC12419961）も HIV 非感染例へのステロイド併用を強い推奨としており、追加の裏づけ候補になる。候補はいずれも出典マスター未登録のため新規 SRC 登録候補'
  uncertainty: 本試験はベトナムで実施され、HIV 合併例を含む。抗結核薬（イソニアジド、リファンピシン等）はいずれも国内承認薬であり、結核性髄膜炎は保険適用の範囲内である。デキサメタゾンの位置づけは NI-010 の uncertainty と同様である。
