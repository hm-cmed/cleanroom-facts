    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ49 2026-11-12）：Govender NP, Meintjes G, Falconer J, et al. SAHCS Guideline for the prevention, diagnosis and management of cryptococcal disease among persons living with HIV: Update to induction treatment for cryptococcal meningitis. S Afr J HIV Med. 2026;27(1)（CC BY、PMID 41960304、DOI 10.4102/sajhivmed.v27i1.1789、PMC13058496、新規 SRC 候補）。裏づける部分：候補（南アフリカ HIV 臨床学会のガイドライン更新版、CC BY）の全文に、導入療法の第一選択としてリポソーマルアムホテリシン B 10 mg/kg 単回投与＋フルシトシン（100 mg/kg/日を4分割＝25 mg/kg を1日4回）14日間＋フルコナゾール 1200 mg/日が明記され、カードの単回投与レジメンが用量まで含めて裏づけられる（WHO 2022 ガイドラインと整合する推奨と位置づけられている）。数値の照合：単回レジメンの用量（10 mg/kg、フルシトシン 100 mg/kg/日、フルコナゾール 1200 mg/日）はカードと一致。留保：カードのもう一つのレジメン（リポソーマルアムホテリシン B 3〜4 mg/kg/日＋フルシトシンの2週間投与）は候補に再掲がなく（候補の代替レジメンはデオキシコール酸アムホテリシン B ベース）、その部分を留保して B。主出典（SRC-1641）は PMC に収載があるがライセンス表示はなく RESTRICTED が正しい（PMCID は補完候補として区分訂正の節に記録）。候補は出典マスター未登録のため新規 SRC 登録候補'
  uncertainty: リポソーマルアムホテリシン B、フルシトシン、フルコナゾールはいずれも国内承認薬だが、単回 10 mg/kg 投与などの用法は国内添付文書の用法・用量と異なるため、保険適用の扱いは取り込み側で確認を推奨する。
