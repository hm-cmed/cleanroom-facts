- id: NI-011
  domain: NI
  subdomain: 細菌性髄膜炎
  assertion:
    plain_statement_ja: 成人の急性細菌性髄膜炎に対するデキサメタゾン併用（10 mg を 6 時間ごと 4 日間、最初の抗菌薬投与の 15〜20 分前または同時開始）は無作為化比較試験で予後不良のリスクを下げ（相対危険度 0.59）、死亡も減らし（相対危険度 0.48）、効果は肺炎球菌性髄膜炎で最も大きかった（予後不良 26% 対 52%）。
    condition:
      population: 急性細菌性髄膜炎の成人患者
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1639
    source: de Gans J, van de Beek D; European Dexamethasone in Adulthood Bacterial Meningitis Study Investigators. Dexamethasone in adults with bacterial meningitis. N Engl J Med. 2002;347(20):1549-1556
    doi: 10.1056/NEJMoa021334
    pmid: '12432041'
    pmcid: null
    url: https://doi.org/10.1056/NEJMoa021334
    source_license: © Massachusetts Medical Society（CC 表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ49 2026-11-12）：Wald ER. Dexamethasone as Adjuvant Therapy for Bacterial Meningitis in Children: What About Streptococcus pneumoniae? Open Forum Infect Dis. 2025;12(8)（CC BY、PMID 40874187、DOI 10.1093/ofid/ofaf456、PMC12378231、新規 SRC 候補）。裏づける部分：候補（CC BY のレビュー）の全文に、2002年の欧州試験（本カードの主出典）について、肺炎球菌性髄膜炎では予後不良がデキサメタゾン群26%・プラセボ群52%（相対危険度0.50）、死亡が14%対34%であったことが明記され、「効果は肺炎球菌性髄膜炎で最も大きかった（予後不良26%対52%）」というカードの数値がそのまま裏づけられる。数値の照合：肺炎球菌性髄膜炎の予後不良26%対52%はカードと一致。全体の予後不良の相対危険度0.59と死亡の相対危険度0.48は候補に再掲がなく、その2数値を留保する。留保：候補は出典マスター未登録のため新規 SRC 登録候補'
  uncertainty: 本試験は欧州で実施され、髄膜炎菌性を含む成人例が対象である。低所得国での再現性は限定的とされ、欧州のガイドラインでは高所得国での使用が強く推奨される位置づけである。デキサメタゾンの国内承認・保険適用については NI-010 の uncertainty を参照。
