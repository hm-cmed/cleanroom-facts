- id: NI-016
  domain: NI
  subdomain: 結核性髄膜炎
  assertion:
    plain_statement_ja: 結核性髄膜炎は 5 日を超える亜急性の経過をとることが診断の手がかりとなり、その統一症例定義では髄液のリンパ球優位の細胞増多、蛋白上昇、糖低下（髄液・血漿糖比の低下）などの所見を臨床像や画像所見と組み合わせて診断を階層化する。
    condition:
      population: 結核性髄膜炎が疑われる小児・成人患者
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1642
    source: 'Marais S, Thwaites G, Schoeman JF, et al. Tuberculous meningitis: a uniform case definition for use in clinical research. Lancet Infect Dis. 2010;10(11):803-812'
    doi: 10.1016/S1473-3099(10)70138-9
    pmid: '20822958'
    pmcid: null
    url: https://doi.org/10.1016/S1473-3099(10)70138-9
    source_license: © Elsevier（The Lancet Infectious Diseases、CC 表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ49 2026-11-12）：Leiva-Ordoñez JE, Quintero B. Diagnosis of Tuberculous Meningitis: Integrating Clinical Assessment and Molecular Diagnostics. Diagnostics. 2026;16(4)（CC BY、PMID 41750700、DOI 10.3390/diagnostics16040552、PMC12939813、新規 SRC 候補）。裏づける部分：候補（CC BY の総説）の全文に、Marais らの統一症例定義（Lancet コンセンサススコア）が臨床・髄液・画像の所見を統合した構造化された診断分類で、definite／probable／possible／非結核性髄膜炎に階層化すること、典型的な髄液像はリンパ球優位の細胞増多・蛋白上昇・糖低下であることが明記され、主張の核が裏づけられる。数値の照合：—。留保：「5日を超える経過」が診断の手がかりになるという要素は候補の本文に逐語の再掲を確認できず（コンセンサススコアの臨床ドメイン自体には症状持続期間が含まれるが、本総説は項目の列挙をしていない）、その部分を留保して B。結核性髄膜炎の国際的な診療ガイドラインが新たに刊行されており（フラグ参照）、次回改訂時の照合対象となる。候補は出典マスター未登録のため新規 SRC 登録候補'
  uncertainty: 髄液 ADA（アデノシンデアミナーゼ）は結核性髄膜炎の補助診断として臨床で用いられるが、本統一症例定義の診断要素には含まれておらず、カットオフ値の裏付けには別途一次資料が必要なため assertion には含めなかった。本定義は研究用の症例定義であり、臨床診断では抗酸菌検査・培養や核酸増幅検査と合わせて判断する。
