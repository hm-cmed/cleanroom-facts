- id: NI-001
  domain: NI
  subdomain: 脳炎
  assertion:
    plain_statement_ja: 単純ヘルペス脳炎は側頭葉を中心とする壊死性脳炎であり、診断には髄液の単純ヘルペスウイルス PCR 検査が用いられ、疑った時点で PCR の結果を待たずにアシクロビルの静脈内投与を直ちに開始する。
    condition:
      population: 脳炎が疑われる成人および小児
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1631
    source: 'Tunkel AR, Glaser CA, Bloch KC, et al. The management of encephalitis: clinical practice guidelines by the Infectious Diseases Society of America. Clin Infect Dis. 2008;47(3):303-327'
    doi: 10.1086/589747
    pmid: '18582201'
    pmcid: null
    url: https://doi.org/10.1086/589747
    source_license: © Infectious Diseases Society of America（Oxford University Press、CC 表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ49 2026-11-12）：Meyding-Lamadé U, Craemer EM, Aydin K, et al. S1 guidelines of the German Society of Neurology for Viral Meningoencephalitis - AWMF Registration No.: 030-100. Neurol Res Pract. 2026;8(1)（CC BY、PMID 41998791、DOI 10.1186/s42466-026-00487-3、PMC13091275、新規 SRC 候補）。裏づける部分：候補（ドイツ神経学会の S1 ガイドライン、CC BY）の全文に、側頭葉病変（前頭葉基底部への進展を伴う T2 高信号・拡散制限）が単純ヘルペス脳炎に典型的であること、髄液 HSV PCR がウイルス学的確認の方法で感度95〜100%であること、「抗ウイルス療法は臨床的疑いの時点で直ちに開始し、PCR などの検査結果を待ってはならない」「静注アシクロビルは遅滞なく開始する」ことが明記され、主張の核（側頭葉中心・髄液 PCR・結果を待たない即時投与）が裏づけられる。数値の照合：—。留保：「壊死性」という病理学的な形容は、候補の本文では皮膚病変の文脈に現れるのみで、脳炎自体への逐語の再掲は確認できなかったため、その一点を留保して B。主出典（SRC-1631、IDSA 2008 ガイドライン）は Crossref・Europe PMC のいずれでも CC ライセンスの表示がなく RESTRICTED が正しい。候補は出典マスター未登録のため新規 SRC 登録候補'
  uncertainty: アシクロビルは国内承認薬であり、単純ヘルペス脳炎は国内の保険適用の範囲内である。
  curriculum:
    kokushi: 医学各論 Ⅸ-3-A-①（脳炎、a）
