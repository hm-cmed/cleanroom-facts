    source_class: RESTRICTED
    corroboration: null
  uncertainty: 国内では HTLV-Ⅰ感染が九州・沖縄を中心とする南日本に多いことは周知だが、今回確認した出典の抄録には国内分布の数値が含まれないため、assertion には含めなかった。国内分布の裏付けは取り込み側で診療ガイドライン等の本文確認を推奨する。
