- id: HV-022
  domain: HV
  subdomain: 伝染性軟属腫
  assertion:
    plain_statement_ja: 伝染性軟属腫はポックスウイルスによる皮膚感染症で、主に小児にみられ、免疫正常者では通常数か月以内に自然消退する。系統的レビューでは、イミキモド5%クリームは基剤と比較して短期の治癒に有益性を示さなかった（リスク比 1.33、95%CI 0.92–1.93）。
    condition:
      region: 国際
      対象: 小児
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2071
    source: van der Wouden JC, van der Sande R, Kruithof EJ, Sollie A, van Suijlekom-Smit LW, Koning S. Interventions for cutaneous molluscum contagiosum. Cochrane Database Syst Rev. 2017;(5):CD004767.
    doi: 10.1002/14651858.CD004767.pub4
    pmid: '28513067'
    pmcid: PMC6481355
    url: https://doi.org/10.1002/14651858.CD004767.pub4
    source_license: CC 表示なし（Europe PMC で OA でないことを確認）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ76 2026-11-15）：Oganesyan A, Sivesind TE, Dellavalle R. From the Cochrane Library: Interventions for Cutaneous Molluscum Contagiosum. JMIR Dermatol. 2023;6:e41514（PMID: 37632925、DOI: 10.2196/41514、PMCID: PMC10335125、https://pmc.ncbi.nlm.nih.gov/articles/PMC10335125/）。裏づける部分：候補（Cochrane レビューの CC BY 要約）が、伝染性軟属腫はポックスウイルスによる皮膚・粘膜の病態で主に小児にみられ自然消退が一般に起こること、主要アウトカムである短期の臨床的治癒についてイミキモド5%クリームは基剤（プラセボ）との比較で「どちらの介入も優れなかった」とする比較表（4研究・850例、リスク比1.33、95%CI 0.92–1.93）を載せる。カードの主張と一致する。数値の照合：リスク比1.33・95%CI 0.92–1.93は候補と一致する。「通常数か月以内に自然消退」は候補では自然消退が一般に起こるという表現で、期間（数か月以内）の明示はない。留保：候補は Cochrane レビュー自体ではなく、その公認の要約（JMIR Dermatology の From the Cochrane Library）で、数値はレビューへ帰属を明示して再掲されている。主出典 SRC-2071 の区分は現行 RESTRICTED が正しい（Cochrane Database Syst Rev、Wiley。PMC 収載分 PMC6481355 に CC 表示なし）。識別子補完候補あり'
