    corroboration: 自由に使える資料による裏づけ（GOV_US、作り手の調査バッチ76 2026-11-15）：ClinicalTrials.gov 登録レコード NCT00867048：Strategic Timing of Antiretroviral Treatment (START)（結果投稿済み）（https://clinicaltrials.gov/study/NCT00867048）。裏づける部分：候補（試験登録レコード）が、CD4 数500/µL を超える無症候の HIV 陽性成人を、即時に ART を開始する群（2,326例）と、CD4 数が350/µL 以下への低下や AIDS 発症まで開始を延期する群に割り付けた試験の設計と、複合エンドポイント（重篤な AIDS 関連イベント、重篤な非 AIDS 関連イベント、全死亡）のイベント件数を記録する。カードの主張のうち、試験の設計と即時開始群で複合エンドポイントが少なかったという方向の範囲と一致する。数値の照合：登録レコードの総登録数は4,688例で、カード・主出典の4,685人と3例異なる（延期群は登録上2,362例、論文は2,359人）。登録レコードの複合エンドポイント件数（即時群133件・延期群215件）は、主出典の初回報告の件数（42例対96例）と一致せず、延長追跡後の集計とみられる。即時群1.8%・延期群4.1%・ハザード比0.43そのものはレコードに記載なし（申し送りの節参照）。留保：裏づけは試験の設計と結果の方向の範囲に限る。主出典 SRC-2057 の区分は現行 RESTRICTED が正しい（N Engl J Med。PMC 収載分 PMC4569751 は CC 表示なし）。識別子補完候補あり
  uncertainty: 数値は抄録の Results で確認した（平均追跡 3.0 年）。抗HIV薬は国内で多数承認され保険適用がある（日本エイズ学会の公開資料で確認）。国内の治療指針における具体的な推奨レジメンは本カードの範囲外とした。
