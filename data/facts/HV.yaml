- id: HV-024
  domain: HV
  subdomain: ジカウイルス感染症
  assertion:
    plain_statement_ja: ジカウイルスはフラビウイルスで、ヤブカ属の蚊が媒介する。2013〜2014年のフランス領ポリネシアの流行では重篤な神経合併症が報告され、ブラジルでは小頭症を含む重篤な先天異常の劇的な増加がみられた。診断はウイルス RNA の検出が主体で、血清学的診断はフラビウイルス間の交差反応のため解釈が複雑である。
    condition:
      region: 国際
      対象: 一般
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2073
    source: Musso D, Gubler DJ. Zika Virus. Clin Microbiol Rev. 2016;29(3):487-524.
    doi: 10.1128/CMR.00072-15
    pmid: '27029595'
    pmcid: PMC4861986
    url: https://doi.org/10.1128/CMR.00072-15
    source_license: CC 表示なし
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ76 2026-11-15）：Rabe IB, Hills SL, Haussig JM, et al. A Review of the Recent Epidemiology of Zika Virus Infection. Am J Trop Med Hyg. 2025;112(5):1026-1035（PMID: 39933180、DOI: 10.4269/ajtmh.24-0420、PMCID: PMC12062665、https://pmc.ncbi.nlm.nih.gov/articles/PMC12062665/）。裏づける部分：候補（CC BY 総説）が、ジカウイルスはフラビウイルスで主に感染したヤブカ属の蚊の刺咬で伝播すること、2013年にフランス領ポリネシアで大規模な流行が始まったこと、ギラン・バレー症候群を含む重篤な神経学的転帰がありうること、妊娠中の感染で小頭症を含む先天性ジカウイルス症候群を生じ、フランス領ポリネシアでも同様の奇形が遡及的に確認されたこと、検査による確定はウイルスまたはウイルス RNA の検出（核酸増幅検査）か、交差反応するフラビウイルスへの検査を伴う血清学的確認によることを述べ、カードの主張の骨格と一致する。数値の照合：数値なし（病原体・疫学の枠組みのカード）。留保：ブラジルでの小頭症を含む先天異常の「劇的な増加」という規模感の表現と、フランス領ポリネシアの流行での神経合併症の報告という対応づけは、候補では本文中に分散した記載である。主出典 SRC-2073 の区分は現行 RESTRICTED が正しい（Clin Microbiol Rev、ASM。Crossref は非商用 TDM ライセンスのみ、PMC 収載分 PMC4861986 は CC 表示なし）。識別子補完候補あり'
  uncertainty: 本カードは病原体・感染経路・先天感染のリスクの原則までに絞り、妊婦・周産期管理の詳細は扱わない。
