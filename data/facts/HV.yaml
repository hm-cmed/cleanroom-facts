- id: HV-014
  domain: HV
  subdomain: ウイルス性肝炎
  assertion:
    plain_statement_ja: 日本では B型肝炎ワクチンが2016年10月1日から定期接種となり、2016年4月1日以降に生まれた0歳児を対象に、標準的には生後2か月・3か月・7〜8か月の3回接種が行われる。一方、母子感染予防は定期接種ではなく保険診療の対象であり、HBs抗原陽性の母体から生まれる児に、HBワクチン（初回は生後12時間以内を目安）と抗HBs人免疫グロブリン（HBIG）を併用し、HBワクチンは初回接種の1か月後と6か月後にも接種する。1985年に始まった母子感染防止事業の結果、小児期の HBs抗原陽性率は 0.02〜0.06% まで低下した。
