- id: HV-005
  domain: HV
  subdomain: 水痘・帯状疱疹
  assertion:
    plain_statement_ja: 日本では2025年度から、帯状疱疹ワクチンが予防接種法に基づく定期接種（B類疾病）の対象となった。対象は65歳を迎える人と、60〜64歳でヒト免疫不全ウイルスによる免疫の機能に障害がある人で、2025年度から2029年度までの経過措置として、その年度内に70、75、80、85、90、95、100歳となる人も対象になる。定期接種に使うワクチンは、生ワクチン（皮下に1回）と組換えワクチン（2か月以上の間隔をあけて2回筋肉内接種）の2種類である。
    condition:
      region: 日本
      対象: 高齢者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2050
    source: 厚生労働省. 帯状疱疹ワクチン（予防接種のページ）.
    doi: null
    pmid: null
    pmcid: null
    url: null
    source_license: 政府標準利用規約（厚生労働省ウェブサイト）
    legal_basis: B
    source_class: GOV_JP
    corroboration: null
  uncertainty: 予防効果の目安（接種後1年時点で生ワクチン6割程度・組換えワクチン9割以上、10年時点で組換えワクチン7割程度など）は、厚生労働省ページの効果の表から読み取った。対象者・接種方法はページ本文で確認した。ページの URL はリサーチメモに記録がなかったため未記載である。組換えワクチン（シングリックス）は国内で承認されている（2018年承認、PMDA で確認）。
