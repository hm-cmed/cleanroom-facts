- id: HV-003
  domain: HV
  subdomain: 水痘・帯状疱疹
  assertion:
    plain_statement_ja: 水痘・帯状疱疹ウイルスの初感染は水痘を起こし、免疫不全者・乳児・成人では重症化しうる。初感染の後にウイルスは神経節のニューロンに潜伏し、再活性化するとその神経の支配領域に帯状疱疹を生じ、帯状疱疹後神経痛のほか、脊髄炎、脳神経麻痺、髄膜炎、脳卒中（血管障害）、網膜炎などの合併症を起こしうる。
    condition:
      region: 国際
      対象: 一般
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2048
    source: Gershon AA, Breuer J, Cohen JI, et al. Varicella zoster virus infection. Nat Rev Dis Primers. 2015;1:15016.
    doi: 10.1038/nrdp.2015.16
    pmid: '27188665'
    pmcid: PMC5381807
    url: https://doi.org/10.1038/nrdp.2015.16
    source_license: CC表示なし（Crossref は TDM ライセンスのみ）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ76 2026-11-15）：D''Elia MPB, Moura CRLP, Moura RD, Carvalho JSP, Pott H. Varicella-zoster virus infection: a review about varicella and herpes zoster. An Bras Dermatol. 2026;101(3):501367（PMID: 42107925、DOI: 10.1016/j.abd.2026.501367、PMCID: PMC13187954、https://pmc.ncbi.nlm.nih.gov/articles/PMC13187954/）。裏づける部分：候補（CC BY 総説）が、水痘は成人・高齢者・免疫不全者で特に健康上の問題となること、初感染後にウイルスが知覚神経節（脊髄神経節・脳神経節）に終生潜伏すること、再活性化がその神経の支配領域の帯状疱疹として現れること、合併症として帯状疱疹後神経痛のほか髄膜脳炎、横断性脊髄炎、脳神経麻痺、脳動脈への侵襲による血管障害（脳卒中）、網膜炎を述べ、カードの主張の骨格と一致する。数値の照合：数値なし（病態の枠組みのカード）。留保：カードの「髄膜炎」は候補では髄膜脳炎として記載されている。乳児で重症化しうることの明示は候補で確認できなかった。主出典 SRC-2048 の区分は現行 RESTRICTED が正しい（Nat Rev Dis Primers。Crossref は TDM ライセンスのみ、PMC 収載分は著者稿で CC 表示なし）。識別子補完候補あり（補完候補の節参照）'
  uncertainty: 総説の抄録で確認した範囲に限る。帯状疱疹後神経痛そのものは既存カード（PN-020〜023）の範囲のため、本カードでは合併症の一つとして挙げるにとどめた。
  curriculum:
