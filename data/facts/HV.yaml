  uncertainty: 母子感染予防を受けた児は定期接種の対象から除かれる。記載は厚生労働省の予防接種ページと国立健康危機管理研究機構（感染症情報提供サイト）の本文で確認した。B型肝炎ワクチンと HBIG はいずれも国内で承認され、定期接種は公費、母子感染予防は保険診療で実施される。
