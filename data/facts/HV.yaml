- id: HV-015
  domain: HV
  subdomain: ヒトT細胞白血病ウイルス感染症
  assertion:
    plain_statement_ja: HTLV-1 は最初に同定されたヒトの腫瘍原性レトロウイルスで、感染は世界に一様に分布せず、高浸淫地域がクラスター状に分布する。主な高浸淫地域は日本南西部、サハラ以南アフリカ、南米、カリブ海地域などであり、世界の感染者数は 500万〜1,000万人と推計される。感染経路は、母子感染、性感染、汚染された血液製剤による感染の3つである。
    condition:
      region: 国際
      対象: 成人
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2062
    source: Gessain A, Cassar O. Epidemiological Aspects and World Distribution of HTLV-1 Infection. Front Microbiol. 2012;3:388.
    doi: 10.3389/fmicb.2012.00388
    pmid: '23162541'
    pmcid: PMC3498738
    url: https://doi.org/10.3389/fmicb.2012.00388
    source_license: CC BY（Europe PMC の license 欄で確認）
    legal_basis: B
    source_class: OPEN
    corroboration: null
  uncertainty: 感染者数の推計と分布は抄録で確認した。高浸淫地域では罹患率は年齢とともに上昇し特に女性で高いとされる。HTLV-1 キャリアにおける ATL の生涯発症率（一般に約5%とされる数値）は、照合した抄録・公的資料の範囲では確認できなかったため主張に入れていない。HAM など関連疾患の詳細は既存カード（NI-004）の範囲とした。
  curriculum:
