- id: HV-011
  domain: HV
  subdomain: ヒト免疫不全ウイルス感染症
  assertion:
    plain_statement_ja: 医療従事者が HIV を含みうる血液・体液に職業曝露した場合、曝露後予防（PEP）が推奨される。PEP は曝露後できるだけ早く開始し、3剤以上を含むレジメンを4週間継続する。職業曝露は緊急の医学的対応事項として扱い、曝露源患者の HIV 状態の確認、迅速な報告と専門医への相談、服薬継続と有害事象・感染徴候のフォローアップが求められる。
    condition:
      region: 米国
      対象: 医療従事者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2059
    source: Kuhar DT, Henderson DK, Struble KA, et al. Updated US Public Health Service guidelines for the management of occupational exposures to human immunodeficiency virus and recommendations for postexposure prophylaxis. Infect Control Hosp Epidemiol. 2013;34(9):875-892.
    doi: 10.1086/672271
    pmid: '23917901'
    pmcid: null
    url: https://doi.org/10.1086/672271
    source_license: CC表示なし
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ76 2026-11-15）：Kofman AD, Struble KA, Heneine W, et al. 2025 US Public Health Service Guidelines for the Management of Occupational Exposures to Human Immunodeficiency Virus and Recommendations for Post-exposure Prophylaxis in Healthcare Settings. Infect Control Hosp Epidemiol. 2025;46(9):863-873（PMID: 41569270、DOI: 10.1017/ice.2025.10254、PMCID: PMC12616222、https://pmc.ncbi.nlm.nih.gov/articles/PMC12616222/）。裏づける部分：候補（主出典の後継にあたる米国公衆衛生局ガイドライン2025年版、刊行版が CC BY）が、医療従事者の職業曝露に PEP が推奨されること、曝露後できるだけ早く（72時間以内に）開始すること、3剤レジメンを28日間処方すること、曝露への対応は緊急の医学的対応事項であること、曝露源患者の HIV 状態を確認すること、迅速な報告と専門家への相談経路、服薬継続とフォローアップを求めることを述べ、カードの主張（2013年版に基づく）の全範囲と実質的に一致する。数値の照合：数値なし（推奨の内容のカード）。期間はカードの「4週間継続」と候補の「28日間」で一致する。薬剤数はカードの「3剤以上を含むレジメン」に対し、候補は3剤レジメンを推奨する（2025年版でも2剤への格下げはされていない）。留保：主出典 SRC-2059（2013年版）の区分は現行 RESTRICTED が正しい（Infect Control Hosp Epidemiol、Cambridge University Press。Crossref は利用条件へのリンクのみ、Europe PMC の個別レコードで非 OA）。後継ガイドラインが刊行済みである点は申し送りに記す'
  uncertainty: 米国の公衆衛生局ガイドラインに基づく推奨であり、日本の医療機関における具体的な運用とは異なる場合がある。針刺し事故後の HIV PEP について国内の一次指針の文面確認は未了である。PEP に用いる抗HIV薬そのものは国内で承認され保険適用があるが、曝露後予防としての保険適用の扱いは本カードでは確認していない。
