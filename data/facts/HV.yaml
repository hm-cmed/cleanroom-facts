- id: HV-018
  domain: HV
  subdomain: 新型コロナウイルス感染症
  assertion:
    plain_statement_ja: BNT162b2 mRNA ワクチンの無作為化比較試験（43,548人を無作為化）では、2回目接種から7日以降の COVID-19 発症に対するワクチン有効率は95%（95% credible interval 90.3–97.6）で、1回目接種以降の重症例はワクチン群1例に対しプラセボ群9例であった。
