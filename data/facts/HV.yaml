- id: HV-016
  domain: HV
  subdomain: ヒトT細胞白血病ウイルス感染症
  assertion:
    plain_statement_ja: 日本では、HTLV-1 母子感染の主な経路は感染 T リンパ球を含む母乳を介した感染であり、母子感染率は長期母乳栄養（6か月以上）で約20%だが、人工栄養にすると約3〜6%に低下する。妊婦健康診査における HTLV-1 抗体検査は2010年から標準的な検査項目に追加され公費負担の対象となり、妊娠30週頃までに実施される。母子感染予防のための乳汁栄養の選択肢は、完全人工栄養（原則として勧められる）、生後90日までの短期母乳栄養、凍結解凍母乳栄養の3つである。
    condition:
      region: 日本
      対象: 妊婦・新生児
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2063
    source: 厚生労働省「HTLV-1総合対策」関係資料；HTLV-1母子感染予防対策マニュアル（第2版、こども家庭庁）.
    doi: null
    pmid: null
    pmcid: null
    url: https://www.mhlw.go.jp/bunya/kenkou/kekkaku-kansenshou29/wakaru.html
    source_license: 政府標準利用規約
    legal_basis: B
    source_class: GOV_JP
    corroboration: null
  uncertainty: スクリーニング検査の陽性だけではキャリアと判定せず確認検査が必要であり、確認検査としてのラインブロット（LIA）法は2017年11月に保険適応となった（母子感染予防対策マニュアル第2版の記載）。また同マニュアルでは、献血時の HTLV-1 抗体スクリーニングが1986年に導入され、輸血による感染は現在では撲滅されたと記載されている。数値と制度は厚生労働省の総合対策資料と同マニュアルの本文で確認した。
