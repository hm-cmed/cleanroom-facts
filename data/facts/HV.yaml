- id: HV-006
  domain: HV
  subdomain: ヒトパピローマウイルス感染症
  assertion:
    plain_statement_ja: ヒトパピローマウイルス感染の大多数は2年以内に消失するが、系統的に近縁な13の型（とりわけ16型）は発癌性であり、持続する高リスク型感染は癌タンパク E6 と E7 の作用により、ウイルス産生性の感染から形質転換性の感染へ移行しうる。発癌性 HPV は世界の子宮頸癌のほぼ全てと、他の肛門性器癌の大きな割合、中咽頭癌の増えつつある割合の原因となる。
    condition:
      region: 国際
      対象: 一般
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2051
    source: Schiffman M, Doorbar J, Wentzensen N, et al. Carcinogenic human papillomavirus infection. Nat Rev Dis Primers. 2016;2:16086.
    doi: 10.1038/nrdp.2016.86
    pmid: '27905473'
    pmcid: null
    url: https://doi.org/10.1038/nrdp.2016.86
    source_license: CC表示なし（Crossref は TDM ライセンスのみ）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ76 2026-11-15）：Boldeanu L, Assani MZ, Boldeanu MV, et al. Cervical Cancer in the Era of HPV: Translating Molecular Mechanisms into Preventive Public Health Action. Int J Mol Sci. 2025;26(17):8463（PMID: 40943384、DOI: 10.3390/ijms26178463、PMCID: PMC12429327、https://pmc.ncbi.nlm.nih.gov/articles/PMC12429327/）。裏づける部分：候補（CC BY 総説）が、高リスク型 HPV の持続感染が子宮頸癌の99%超に結びつくこと、癌タンパク E6 と E7 が p53 と網膜芽細胞腫タンパクを不活化して形質転換を駆動すること、感染の多くは自然に消失し持続感染が前癌病変・癌への分岐点であること、HPV が子宮頸癌のほか肛門性器癌・中咽頭癌に関連することを述べ、カードの主張の骨格と一致する。数値の照合：子宮頸癌のほぼ全てが発癌性 HPV によるという点は候補（99%超）と一致する。「系統的に近縁な13の型」という型の数え方と、「大多数は2年以内に消失」という期間の明示は候補に再掲なし（候補には持続感染の約半数が2年以内に解消するという別の記述がある）。留保：主出典 SRC-2051 の区分は現行 RESTRICTED が正しい（Nat Rev Dis Primers。Crossref は TDM ライセンスのみ、Europe PMC の個別レコードで非 OA）'
  uncertainty: 総説の抄録で確認した範囲に限る。日本の HPV ワクチンの承認・定期接種の制度は既存カード（GY-016）の範囲のため、本カードでは扱わない。
  curriculum:
    kokushi: 医学各論 Ⅻ-1-A-⑮（ヒトパピローマウイルス<HPV>感染症、a）
