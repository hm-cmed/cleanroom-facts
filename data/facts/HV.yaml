      対象: 成人
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2067
    source: Polack FP, Thomas SJ, Kitchin N, et al. Safety and Efficacy of the BNT162b2 mRNA Covid-19 Vaccine. N Engl J Med. 2020;383(27):2603-2615.
    doi: 10.1056/NEJMoa2034577
    pmid: '33301246'
    pmcid: PMC7745181
    url: https://doi.org/10.1056/NEJMoa2034577
    source_license: CC 表示なし
    legal_basis: B
    source_class: RESTRICTED
    corroboration: 自由に使える資料による裏づけ（GOV_US、作り手の調査バッチ76 2026-11-15）：ClinicalTrials.gov 登録レコード NCT04368728：Study to Describe the Safety, Tolerability, Immunogenicity, and Efficacy of RNA Vaccine Candidates Against COVID-19 in Healthy Individuals（結果投稿済み）（https://clinicaltrials.gov/study/NCT04368728）。裏づける部分：候補（試験登録レコード）が、BNT162b2 の第2/3相の主要有効性解析（感染の血清学的・ウイルス学的証拠のない参加者で、2回目接種から7日以降の発症）を記録し、その分析値としてワクチン有効率95.0%（β二項モデルによる95%信用区間90.3–97.6）を載せる。カードの中核の値と完全一致する。数値の照合：ワクチン有効率95%・95% credible interval 90.3–97.6は候補と完全一致する。無作為化43,548人は候補に再掲なし（レコードの総登録数46,969人は第1相を含む全体で、相ごとの内訳は記録されていない）。1回目接種以降の重症例がワクチン群1例・プラセボ群9例という内訳はレコードに記載なし（重症例のアウトカムは2回目接種以降の発生率のみが記録されている）。留保：主出典 SRC-2067 の区分は現行 RESTRICTED が正しい（N Engl J Med。PMC 収載分 PMC7745181 に CC 表示なし）。識別子補完候補あり
