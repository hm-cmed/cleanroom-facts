- id: HV-004
  domain: HV
  subdomain: 水痘・帯状疱疹
  assertion:
    plain_statement_ja: 帯状疱疹の発症率は、北米・欧州・アジア太平洋を対象とした系統的レビューで人口1,000人年あたり3〜5であり、過去数十年で増加傾向にある。帯状疱疹後神経痛のリスクは研究により5%から30%を超える範囲まで幅があり、帯状疱疹の再発のリスクは1〜6%とされる。
    condition:
      region: 国際
      対象: 成人
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2049
    source: 'Kawai K, Gebremeskel BG, Acosta CJ. Systematic review of incidence and complications of herpes zoster: towards a global perspective. BMJ Open. 2014;4(6):e004833.'
    doi: 10.1136/bmjopen-2014-004833
    pmid: '24916088'
    pmcid: PMC4067812
    url: https://doi.org/10.1136/bmjopen-2014-004833
    source_license: CC BY-NC（Europe PMC の license 欄で確認）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ76 2026-11-15）：Recart D, Scibona P, Caruso D, et al. Herpes zoster burden in a private healthcare setting of Argentina. Front Public Health. 2026;14:1748267（PMID: 42293575、DOI: 10.3389/fpubh.2026.1748267、PMCID: PMC13260107、https://pmc.ncbi.nlm.nih.gov/articles/PMC13260107/）。裏づける部分：候補（CC BY の原著研究）が、主出典（Kawai ら）への帰属を明示して、帯状疱疹後神経痛は帯状疱疹患者の約5〜30%に生じること、世界の発症率の系統的レビューで再発率は1〜6%（長期追跡の研究では5〜6%）と報告されたことを再掲する。カードの主張のうち、帯状疱疹後神経痛と再発のリスクの範囲と一致する。数値の照合：帯状疱疹後神経痛5%から30%超、再発1〜6%は候補と一致する。発症率（人口1,000人年あたり3〜5）と「過去数十年で増加傾向」は候補に再掲なし（候補自身の測定値4.50/1,000人年は範囲内だが、一次データであり再掲ではない）。留保：主出典 SRC-2049 の刊行版ライセンスは CC BY-NC で自由区分に当たらず、現行 RESTRICTED が正しい（Europe PMC の個別レコードで確認。マスターの license_note の記載とも一致）。識別子補完候補あり'
  uncertainty: 日本の帯状疱疹の発症率の一次統計は未確認で、主張は海外の系統的レビューの範囲に限る。
