- id: HV-009
  domain: HV
  subdomain: ヒト免疫不全ウイルス感染症
  assertion:
    plain_statement_ja: CD4 数が 500/µL を超える無症候の HIV 陽性成人 4,685 人を対象としたランダム化比較試験（START 試験）では、即時に抗レトロウイルス療法を開始した群は、CD4 数が 350/µL 以下への低下や AIDS 発症まで開始を延期した群に比べ、重篤な AIDS 関連イベント、重篤な非 AIDS 関連イベント、全死亡の複合エンドポイントの発生が少なかった（即時群 1.8%、延期群 4.1%、ハザード比 0.43）。この結果は、CD4 数にかかわらず診断後早期に ART を開始する現行原則の根拠となっている。
    condition:
      region: 国際
      対象: 成人
    differential: null
    common_misconception: null
  provenance:
