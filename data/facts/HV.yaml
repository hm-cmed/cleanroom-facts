  assertion:
    plain_statement_ja: エボラウイルス病の無作為化比較試験（PALM、コンゴ民主共和国で681例を登録）では、28日死亡率は抗体医薬 MAb114 群で35.1%、REGN-EB3 群で33.5%と、対照の ZMapp 群（49.7%および部分群51.3%）より有意に低かった。
