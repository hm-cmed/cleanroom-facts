- id: HV-001
  domain: HV
  subdomain: 単純ヘルペスウイルス感染症
  assertion:
    plain_statement_ja: 単純ヘルペスウイルス1型（HSV-1）は主に口腔唇の病変、2型（HSV-2）は主に性器病変の原因であるが、HSV-1 が性器感染の原因となる割合が増えている。2012年の推計では、0〜49歳の HSV-1 有病感染者は約37億人（全体の67%）に上り、性器 HSV-1 の有病感染者は約1億4,000万人と推計された。
    condition:
      region: 国際
      対象: 一般（0〜49歳）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2046
    source: Looker KJ, Magaret AS, May MT, et al. Global and Regional Estimates of Prevalent and Incident Herpes Simplex Virus Type 1 Infections in 2012. PLoS One. 2015;10(10):e0140765.
    doi: 10.1371/journal.pone.0140765
    pmid: '26510007'
    pmcid: PMC4624804
    url: https://doi.org/10.1371/journal.pone.0140765
    source_license: CC0（Crossref の license 欄で確認）
    legal_basis: B
    source_class: OPEN
    corroboration: null
  uncertainty: 数値は2012年時点のモデル推計で、抄録で確認した範囲に限る。HSV に対するワクチンの国内承認状況は未確認である。
  curriculum:
    kokushi: 医学各論 Ⅻ-1-A-⑩（単純ヘルペスウイルス感染症、a）
