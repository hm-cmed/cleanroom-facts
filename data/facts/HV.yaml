- id: HV-013
  domain: HV
  subdomain: ウイルス性肝炎
  assertion:
    plain_statement_ja: 米国 ACIP の推奨では、全ての妊婦に HBs抗原検査を行い、HBs抗原陽性の妊婦には HBV DNA 検査を行う。HBV 感染母体から生まれた児には、出生後12時間以内に B型肝炎ワクチンと抗HBs人免疫グロブリン（HBIG）を投与し、その後ワクチンシリーズを完了して接種後の血清学的検査を行う。また、全ての児への出生後24時間以内のユニバーサルな B型肝炎ワクチン接種が推奨される。
    condition:
      region: 米国
      対象: 妊婦・新生児
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2060
    source: 'Schillie S, Vellozzi C, Reingold A, et al. Prevention of Hepatitis B Virus Infection in the United States: Recommendations of the Advisory Committee on Immunization Practices. MMWR Recomm Rep. 2018;67(1):1-31.'
    doi: 10.15585/mmwr.rr6701a1
    pmid: '29939980'
