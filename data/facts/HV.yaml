    source: INSIGHT START Study Group. Initiation of Antiretroviral Therapy in Early Asymptomatic HIV Infection. N Engl J Med. 2015;373(9):795-807.
    doi: 10.1056/NEJMoa1506816
    pmid: '26192873'
    pmcid: PMC4569751
    url: https://doi.org/10.1056/NEJMoa1506816
    source_license: CC表示なし
    legal_basis: B
