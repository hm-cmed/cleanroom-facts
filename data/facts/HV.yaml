- id: HV-008
  domain: HV
  subdomain: ヒト免疫不全ウイルス感染症
  assertion:
    plain_statement_ja: 未治療の HIV 感染では、ウイルスの複製が続くことで CD4 陽性 T 細胞が進行性に減少し、広範な免疫異常が生じて感染症や腫瘍性合併症のリスクが高まる。抗レトロウイルス療法（ART）は HIV の複製を強力に抑制し、服薬を継続できる者ではほぼ生涯にわたるウイルス抑制が得られ、免疫の回復により AIDS 発症のリスクはほぼ消失する。また、感染者と非感染者における抗レトロウイルス薬の最適な使用により、HIV 伝播のリスクは実質的に消失する。
    condition:
      region: 国際
      対象: 成人
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2056
    source: Deeks SG, Overbaugh J, Phillips A, Buchbinder S. HIV infection. Nat Rev Dis Primers. 2015;1:15035.
    doi: 10.1038/nrdp.2015.35
    pmid: '27188527'
    pmcid: null
    url: https://doi.org/10.1038/nrdp.2015.35
    source_license: CC表示なし（Crossref の license 欄はテキストマイニング用ライセンスのみ）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: 自由に使える資料による裏づけ（GOV_US、作り手の調査バッチ76 2026-11-15）：Centers for Disease Control and Prevention. HIV Treatment as Prevention（CDC 公式ページ）（https://www.cdc.gov/hivpartners/php/hiv-treatment/index.html）。裏づける部分：候補（CDC 公式ページ、GOV_US）が、抗レトロウイルス療法（ART）を処方どおりに続けてウイルス量が検出限界未満になれば免疫機能が保たれて健康を維持でき、性パートナーへ HIV を伝播しないこと、治療を遅らせると発病・AIDS への進展と伝播の機会が増えることを述べる。カードの主張のうち、ART が HIV の複製を抑制し免疫の回復により AIDS 発症のリスクがほぼ消失すること、伝播のリスクが実質的に消失することの範囲と一致する。数値の照合：数値なし（総論のカード）。留保：未治療の HIV 感染でウイルスの複製が続くことによる CD4 陽性 T 細胞の進行性減少と広範な免疫異常という自然経過の機序の詳述は、候補では一般的な表現にとどまる。主出典 SRC-2056 の区分は現行 RESTRICTED が正しい（Nat Rev Dis Primers。Crossref は TDM ライセンスのみ、Europe PMC の個別レコードで非 OA）
  uncertainty: 抗HIV薬は国内で多数承認され保険適用があり、国内の標準的治療指針である日本エイズ学会「HIV感染症『治療の手引き』」（第29版、2025年12月）では初回治療で INSTI と NRTI の組合せが推奨の中心である（学会の公開資料で確認）。曝露前予防（PrEP）の国内承認状況は一次資料で確認できていないため主張に入れていない。HIV 関連中枢神経合併症は NI の範囲として本カードでは扱わない。
