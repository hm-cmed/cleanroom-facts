- id: HV-002
  domain: HV
  subdomain: 単純ヘルペスウイルス感染症
  assertion:
    plain_statement_ja: HSV-2 感染者と非感染パートナーのカップル1,484組を対象とした試験では、バラシクロビル500mg の1日1回投与による抑制療法で、症候性の性器ヘルペス感染のハザード比は0.25、HSV-2 獲得全体では0.52となり、性器分泌物から HSV DNA が検出される日の割合も2.9%と、プラセボ群の10.8%より低かった。
    condition:
      region: 国際
      対象: 成人
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2047
    source: Corey L, Wald A, Patel R, et al. Once-daily valacyclovir to reduce the risk of transmission of genital herpes. N Engl J Med. 2004;350(1):11-20.
    doi: 10.1056/NEJMoa035144
    pmid: '14702423'
    pmcid: null
    url: https://doi.org/10.1056/NEJMoa035144
    source_license: CC表示なし
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（GOV_US、作り手の調査バッチ76 2026-11-15）：Workowski KA, Bachmann LH, Chan PA, et al. Sexually Transmitted Infections Treatment Guidelines, 2021. MMWR Recomm Rep. 2021;70(4):1-187（PMID: 34292926、DOI: 10.15585/mmwr.rr7004a1、PMCID: PMC8344968、https://pmc.ncbi.nlm.nih.gov/articles/PMC8344968/）。裏づける部分：候補（CDC の性感染症治療ガイドライン2021、MMWR、GOV_US）が、「バラシクロビル500 mg の1日1回投与は、パートナーに性器 HSV-2 感染の既往がある異性愛の不一致カップルにおける HSV-2 伝播率を下げる」と述べ、抑制療法による伝播抑制という方向と、用量・用法（500 mg 1日1回）はカードと一致する。数値の照合：症候性性器ヘルペス感染のハザード比0.25、HSV-2 獲得全体の0.52、性器分泌物から HSV DNA が検出される日の割合2.9%対10.8%はいずれも候補に再掲なし（候補の記載は効果の定性的な範囲にとどまる）。留保：主出典の試験の登録レコード（NCT00001649）は存在するが結果は投稿されておらず使えなかった。主出典 SRC-2047 の区分は現行 RESTRICTED が正しい（N Engl J Med。Crossref にライセンス登録がなく、Europe PMC の個別レコードで非 OA）'
  uncertainty: バラシクロビル塩酸塩は国内で承認されており、PMDA の添付文書で性器ヘルペスの再発抑制などの効能と、パートナーへの感染を抑制することが認められている旨を確認した。投与中も感染リスクが残るため、添付文書ではコンドーム使用等も推奨されている。
