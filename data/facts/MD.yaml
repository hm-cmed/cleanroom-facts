- id: MD-018
  domain: MD
  subdomain: うつ病
  assertion:
    plain_statement_ja: CANMAT 2023 ガイドラインは、大うつ病エピソードに対して、運動・身体活動の増加、より健康的な食事、禁煙、睡眠衛生といった生活習慣の修正が有益であるとしている。運動については、監督下の運動（低〜中等強度、1回30〜40分、週3〜4回、最低9週間）が、軽症うつ病に対する第一選択の単独療法、中等症に対する第二選択の補助療法と位置づけられている。睡眠については、睡眠衛生の指導が有益と考えられ、不眠に特化した認知行動療法（CBT-I）も有望とされる一方、断眠（覚醒）療法は第三選択とされる。光療法は、季節性（冬季）うつ病に対する第一選択の単独療法、非季節性の軽症うつ病に対する第二選択、中等症に対する薬物療法への併用と位置づけられている。食事については地中海式食事が第三選択とされ、プロバイオティクスは推奨する根拠が不十分とされる
    condition:
      region: 国際
      対象: 大うつ病性障害の成人
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3627
    source: Lam RW, Kennedy SH, Adams C, et al. Canadian Network for Mood and Anxiety Treatments (CANMAT) 2023 Update on Clinical Guidelines for Management of Major Depressive Disorder in Adults. Can J Psychiatry. 2024;69(9):641-687
    doi: 10.1177/07067437241245384
    pmid: '38711351'
    pmcid: PMC11351064
    url: https://doi.org/10.1177/07067437241245384
    source_license: CC BY 4.0
    legal_basis: B
    source_class: OPEN
    corroboration: null
  uncertainty: ガイドライン本文（PMC 全文）の Q.2 の生活習慣介入の項および Table 2.4 で確認した範囲に限る。運動の具体的な処方（強度・時間・頻度・最低期間）と各介入の選択順位（第一選択・第二選択・第三選択）は本文の記載どおりである。光療法の標準的な実施方法（10,000ルクス、起床後の朝30分）は本文に記載があるが、本カードの主張には含めていない。睡眠衛生の指導は臨床試験のエビデンスが限られる中で「有益と考えられる」と本文が述べる位置づけであり、CBT-I の効果は小規模な無作為化比較試験に基づく「有望」の段階である。各介入の国内での実施体制や保険適用は本カードでは扱っていない
