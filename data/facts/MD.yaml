- id: MD-006
  domain: MD
  subdomain: 双極性障害
  assertion:
    plain_statement_ja: 双極性障害の急性躁病に対する第一選択の治療として、CANMAT/ISBD 2018 ガイドラインは、リチウム、クエチアピン、バルプロ酸（ジバルプロエクス）、アセナピン、アリピプラゾール、パリペリドン、リスパリドン、カリプラジンを挙げており、いずれも単剤療法または併用療法で用いられる
    condition:
      region: 国際
      対象: 双極性障害の躁病エピソードの人
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3631
    source: Yatham LN, Kennedy SH, Parikh SV, et al. Canadian Network for Mood and Anxiety Treatments (CANMAT) and International Society for Bipolar Disorders (ISBD) 2018 guidelines for the management of patients with bipolar disorder. Bipolar Disord. 2018;20(2):97-170
    doi: 10.1111/bdi.12609
    pmid: '29536616'
    pmcid: PMC5947163
    url: https://doi.org/10.1111/bdi.12609
    source_license: CC BY-NC-ND 4.0
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 抄録で確認した範囲に限る。国内適応は薬剤ごとに異なり、リチウムとバルプロ酸は「躁病および躁うつ病の躁状態」の適応を持つ一方、アセナピンに双極性障害の国内適応はなく（適応は統合失調症のみ）、カリプラジンは国内未承認である
