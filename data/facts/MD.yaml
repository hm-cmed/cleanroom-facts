- id: MD-002
  domain: MD
  subdomain: うつ病
  assertion:
    plain_statement_ja: 成人の大うつ病性障害の急性期治療について、522件の無作為化比較試験（参加者116,477人）を統合したネットワークメタ解析では、対象となった21種類の抗うつ薬すべてがプラセボより有効で、プラセボに対する反応のオッズ比は1.37（レボキセチン）から2.13（アミトリプチリン）の範囲だった。忍容性の指標である脱落の少なさでプラセボを上回ったのはアゴメラチン（オッズ比0.84）とフルオキセチン（同0.88）のみで、有効性と忍容性のバランスは薬剤間で異なっていた
    condition:
      region: 国際
      対象: 大うつ病性障害の成人
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3628
    source: 'Cipriani A, Furukawa TA, Salanti G, et al. Comparative efficacy and acceptability of 21 antidepressant drugs for the acute treatment of adults with major depressive disorder: a systematic review and network meta-analysis. Lancet. 2018;391(10128):1357-1366'
    doi: 10.1016/S0140-6736(17)32802-7
    pmid: '29477251'
    pmcid: PMC5889788
    url: https://doi.org/10.1016/S0140-6736(17)32802-7
    source_license: CC BY 4.0
    legal_basis: B
    source_class: OPEN
    corroboration: null
  uncertainty: 抄録で確認した範囲に限る。対象21剤にはレボキセチン・アゴメラチンのような国内未承認の薬剤も含まれ、国内で使用できる抗うつ薬とその適応は薬剤ごとに異なる。本解析の対象外のエスケタミンも国内では未承認である（2026年10月時点）
  curriculum:
    kokushi: 医学各論 Ⅱ-2-A-①（うつ病、a）
    core_curriculum: 'PS-02-17-04 (id: JkxnuT4)；TBL-01-00-536 (id: JlvnmT0)；TBL-02-16-017 (id: JuX-PEs)；PS-02-17-05 (id: JkxnuT8)'
