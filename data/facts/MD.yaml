- id: MD-005
  domain: MD
  subdomain: 双極性障害
  assertion:
    plain_statement_ja: 日本うつ病学会（JSMD）の双極性障害診療ガイドライン（2023年版）は、米国医学アカデミーの基準に準拠して作成され、系統的レビューとメタ解析に基づくとともに、患者・家族の意見も取り入れられている。治療については多くの臨床局面で気分安定薬と第二世代抗精神病薬の併用療法を支持する内容となっている。一方で、メタ解析の中で気分安定薬と第二世代抗精神病薬が一括りに扱われている点が、ガイドラインの限界として挙げられている
