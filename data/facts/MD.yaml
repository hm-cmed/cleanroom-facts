- id: MD-003
  domain: MD
  subdomain: うつ病
  assertion:
    plain_statement_ja: 日本うつ病学会『うつ病診療ガイドライン2025』は、従来版とは別にゼロベースで全面的に再構築された国内のうつ病診療ガイドラインで、系統的レビューによりエビデンスの総体を評価し、益と害のバランスを勘案して推奨を提示する方法を採っている。構成は治療計画の策定に始まり、重症度別（軽度、中等度/重度）、ライフステージ別（児童・思春期、周産期、老年期）、不眠症状を伴ううつ病、後続治療、さらなる段階の治療、維持期治療の各章からなり、ライフステージ・重症度・治療フェーズに応じた個別性の高い診療と、患者と医療者の共同意思決定を支援する位置づけである
    condition:
      region: 日本
      対象: うつ病の人
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3629
    source: 日本うつ病学会（監修）, うつ病診療ガイドライン作成ワーキンググループ（編）. 日本うつ病学会 うつ病診療ガイドライン2025. 医学書院; 2026
    doi: null
    pmid: null
    pmcid: null
    url: null
    source_license: 表示なし（書籍）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 書誌は発行者（医学書院）の公式書籍ページで確認した（日本うつ病学会監修、医学書院、2026年6月刊行、B5判296頁、ISBN 978-4-260-06533-7）。ガイドラインの公表自体は2025年12月25日で、学会ウェブサイトで PDF が公開されており、書籍のタイトルは2025のままである。本カードの主張は書籍の目次構成と発行者によるガイドラインの位置づけの範囲に限っており、個別の推奨文は書籍本文を直接照合していないため主張に含めていない
