    plain_statement_ja: CANMAT 2023 ガイドラインでは、症状の寛解が得られた後も抗うつ薬を6〜12か月間維持することが推奨され、維持期の薬物療法はプラセボと比べて再発率を約50%低下させるとされる。再発の危険因子（残遺症状、小児期の被虐待歴、エピソードの重症度や回数の多さ、慢性の経過、併存疾患、社会的支援の乏しさ、持続するストレスなど）がある人では、抗うつ薬を2年以上継続することが示されている。維持期の心理療法（認知行動療法、マインドフルネス認知療法、対人関係療法など）も再発予防に有効で、その過程では定期的なブースターセッションが用いられることがある。寛解の維持には、症状の定期的なモニタリングと、運動・食事・睡眠などの生活習慣への注意も重要とされる
