- id: MD-001
  domain: MD
  subdomain: うつ病
  assertion:
    plain_statement_ja: 成人の大うつ病性障害の診療について、CANMAT 2023 ガイドラインは、評価から治療選択、再発予防、反応が不十分な場合の戦略まで、患者の診療経路に沿った8つのトピックで推奨を示している。心理療法・薬物療法・生活習慣への介入・補完代替療法・デジタルヘルス・神経刺激療法といった各治療の推奨は表にまとめられ、個別化された治療と患者との共同意思決定が基盤に置かれている
    condition:
      region: 国際
      対象: 大うつ病性障害の成人
