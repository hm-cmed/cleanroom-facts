- id: MD-009
  domain: MD
  subdomain: うつ病
  assertion:
    plain_statement_ja: DSM-5-TR の大うつ病性障害の診断基準では、大うつ病エピソードは、同じ2週間の期間に、それまでの機能からの変化として9つの症状のうち5つ以上がほぼ毎日存在し、そのうち少なくとも1つが中核症状（抑うつ気分、または興味・喜びの喪失）であることとされる。9症状は中核症状の2つに加えて、体重・食欲の変化、睡眠障害（不眠または過眠）、精神運動の焦燥または制止、易疲労性・気力の減退、無価値感・過度の罪責感、思考力・集中力の低下または決断困難、死についての反復思考・自殺念慮である。あわせて、症状が臨床的に意味のある苦痛、または社会的・職業的などの重要な機能領域の障害を引き起こしていること、そのエピソードが物質や他の身体疾患の生理学的作用では説明されないこと、他の精神病性障害でよりよく説明されないこと、躁病エピソードまたは軽躁病エピソードの既往がないことが求められる
    condition:
      region: 国際
      対象: うつ病エピソードの診断評価を受ける人
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-4976
    source: 'American Psychiatric Association. Diagnostic and Statistical Manual of Mental Disorders, Fifth Edition, Text Revision (DSM-5-TR). Washington, DC: American Psychiatric Association Publishing; 2022'
    doi: null
    pmid: null
    pmcid: null
    url: null
    source_license: 表示なし（書籍）
    legal_basis: B
