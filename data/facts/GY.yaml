- id: GY-060
  domain: GY
  subdomain: 女性性器損傷
  assertion:
    plain_statement_ja: 非産科性の女性性器損傷はまれで、米国の外傷データバンク（2007〜2015年）に登録された女性の外傷患者2,040,235人のうち、腟・外陰の外傷は2,445人（0.2%未満）で、損傷部位は腟が68.6%を占めた。腟損傷では高齢、重症外傷、性的暴行の被害は手術介入に至る可能性の低さと関連し、外陰損傷では腟損傷を合併した場合に手術介入の可能性が高かった（オッズ比2.56）。
    condition:
      region: 米国
      study: 2007〜2015年の全国外傷登録の後方視解析
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-804
    source: 'Gambhir S, Grigorian A, Schubl S, Barrios C, Bernal N, Joe V, Gabriel V, Nahmias J. Analysis of non-obstetric vaginal and vulvar trauma: risk factors for operative intervention. Updates Surg. 2019;71(4):735-740'
    doi: 10.1007/s13304-019-00679-4
    pmid: '31538318'
    pmcid: null
    url: https://doi.org/10.1007/s13304-019-00679-4
    source_license: 出版社の著作物（CC の表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 外傷登録に基づく解析で、分娩に伴う損傷や小児の外傷は対象ではない。性暴力被害者への評価・支援の国内の実務体制は本出典では未確認。
