- id: GY-051
  domain: GY
  subdomain: 子宮腺筋症
  assertion:
    plain_statement_ja: 子宮腺筋症の最も多い症状は過多月経と月経困難症だが、無症状のこともあり、子宮内膜症や子宮筋腫を合併しやすいため診断や治療効果の判定が難しい。病態は、子宮内膜が筋層内へ入り込んで接合部（junctional zone）に変化を来すとする説が有力である。従来は子宮摘出後の病理でしか診断できなかったが、経腟超音波や MRI などの画像所見から術前に診断できるようになってきており、この総説の時点では確立した根治療法は子宮摘出とされていた。
    condition:
      region: カナダ
      study: 子宮腺筋症に関する臨床レビュー（2016年）
    differential: null
    common_misconception: null
  provenance:
