    doi: 10.15585/mmwr.rr7004a1
    pmid: '34292926'
    pmcid: PMC8344968
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC8344968/
    source_license: 米国政府機関（CDC）資料
    legal_basis: B
    source_class: GOV_US
    corroboration: null
  uncertainty: 本カードは米国のガイドラインのレジメンである。セフトリアキソン、ドキシサイクリン、メトロニダゾールの PID に対する国内の承認・保険適用の状況は、本調査では添付文書等で個別に確認していない。日本では淋菌の薬剤感受性の動向により選択が異なる場合がある。
