- id: GY-062
  domain: GY
  subdomain: 月経瘻（子宮膀胱瘻）
  assertion:
    plain_statement_ja: 月経瘻（子宮膀胱瘻、Youssef 症候群）は、子宮と膀胱の間に瘻孔ができ、月経血が膀胱へ流れて周期性の血尿（menouria）を呈し、無月経を伴う一方で尿失禁がないことがある状態である。症例報告と文献レビューによれば、最も多い原因は帝王切開、特に反復帝王切開で、診断は画像検査や膀胱鏡で瘻孔を確認して行い、治療の中心は外科的修復である。文献レビューの集計では、自然治癒は5.1%（796例中41例）にとどまったのに対し、ホルモンで月経を止める保存的治療では9例中8例（88.9%）が治癒し、月経抑制をしなかった群の治癒割合4.2%と差があった。
    condition:
      region: 国際（文献レビュー。報告症例はブラジル）
      study: 症例報告と文献レビュー（2018年）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-806
    source: 'Machado Junior LC, et al. Vesicouterine Fistula (Youssef Syndrome): Case Report and Literature Review. Rev Bras Ginecol Obstet. 2018;40(9):563-569'
    doi: 10.1055/s-0038-1666998
    pmid: '30231295'
    pmcid: PMC10316893
    url: https://doi.org/10.1055/s-0038-1666998
    source_license: CC BY（欧州の学術データベースの license 欄）
    legal_basis: B
    source_class: OPEN
    corroboration: null
  uncertainty: 治癒割合は症例報告を中心とした文献レビューの集計であり、比較試験の値ではない。月経を止める保存的治療に用いる薬剤（黄体ホルモン製剤、経口避妊薬、GnRH アナログなど）の国内承認・保険適用は未確認。
  curriculum:
