- id: GY-056
  domain: GY
  subdomain: 骨盤臓器脱
  assertion:
    plain_statement_ja: 骨盤臓器脱は、骨盤内の臓器が腟壁の支持を失って下垂・脱出する状態である。米国の2007〜2011年の医療請求データで18〜89歳の女性10,177,480人を解析した研究では、80歳までの骨盤臓器脱手術の生涯リスクは12.6%と推計され、腹圧性尿失禁手術と合わせた生涯リスクは20.0%だった。骨盤臓器脱手術の年間リスクは年齢とともに増え、71〜73歳で最大（1,000人あたり4.3人）になった。
    condition:
      region: 米国
      study: 2007〜2011年の請求データに基づく集団研究
    differential: null
    common_misconception: null
  provenance:
