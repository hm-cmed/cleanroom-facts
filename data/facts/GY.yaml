  uncertainty: 本カードは米国のガイドラインに基づく。メトロニダゾールおよびクリンダマイシンの細菌性腟症に対する国内の承認・保険適用の状況は、本調査では添付文書等で確認していない。日本の診療では腟錠など剤形や用法が異なる場合がある。
