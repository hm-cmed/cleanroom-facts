- id: GY-053
  domain: GY
  subdomain: 存続絨毛症
  assertion:
    plain_statement_ja: 存続絨毛症を含む絨毛性腫瘍（GTN）は、全体の治癒率が90%を超える腫瘍である。治療は病期と予後スコアで選び、非転移性（I期）と低リスクの転移性（II・III期でスコアが7未満）は単剤の化学療法で生存率がほぼ100%に近づき、高リスク（スコアが7以上）では多剤併用化学療法を基本に、必要に応じて手術や放射線治療を組み合わせて生存率80〜90%が得られる。
