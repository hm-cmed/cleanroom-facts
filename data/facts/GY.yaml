- id: GY-005
  domain: GY
  subdomain: 骨盤内炎症性疾患（治療）
  assertion:
    plain_statement_ja: 骨盤内炎症性疾患（PID）の治療は、淋菌、クラミジアに加えて嫌気性菌をカバーする広域の経験的抗菌薬療法を、推定診断がついた時点で速やかに開始する。軽症から中等症の筋注・経口レジメンの一つは、セフトリアキソン500mg筋注単回に、ドキシサイクリン100mg 1日2回14日間経口とメトロニダゾール500mg 1日2回14日間経口を組み合わせる方法であり、72時間以内に反応がなければ診断の再評価と静注療法への変更を行う。
    condition:
      region: 米国（CDC 性感染症治療ガイドライン2021）
      study: ガイドラインの推奨レジメン（軽症〜中等症、筋注・経口）
    differential: null
    common_misconception: null
  provenance:
