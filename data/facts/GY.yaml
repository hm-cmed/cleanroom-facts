    source: 'Berek JS, Matias-Guiu X, Creutzberg C, Fotopoulou C, Gaffney D, Kehoe S, Lindemann K, Mutch D, Concin N; FIGO Women''s Cancer Committee. FIGO staging of endometrial cancer: 2023. J Gynecol Oncol. 2023;34(5):e85.'
