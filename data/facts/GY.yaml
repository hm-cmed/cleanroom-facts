- id: GY-059
  domain: GY
  subdomain: 子宮腔癒着症（Asherman症候群）
  assertion:
    plain_statement_ja: 子宮腔癒着症（Asherman 症候群）は、子宮内操作などで子宮内膜が傷つき、子宮腔内に癒着ができて過少月経・無月経や不妊を来す状態である。流産後に12か月以内に子宮鏡で評価した前向き研究10件・912人をまとめたメタ解析では、子宮内癒着の合算有病率は19.1%（183人）で、程度は軽度58.1%、中等度28.2%、重度13.7%だった。癒着のリスクは流産の回数が多いほど高く（2回でオッズ比1.41、3回以上で2.1）、主な要因は掻爬の回数とされた。
    condition:
      region: 国際（系統的レビューの対象研究全体）
      study: 流産後の女性を対象とした前向き研究10件の系統的レビューとメタ解析
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-803
    source: 'Hooker AB, Lemmers M, Thurkow AL, Heymans MW, Opmeer BC, Brölmann HAM, Mol BW, Huirne JAF. Systematic review and meta-analysis of intrauterine adhesions after miscarriage: prevalence, risk factors and long-term reproductive outcome. Hum Reprod Update. 2014;20(2):262-278'
    doi: 10.1093/humupd/dmt045
    pmid: '24082042'
    pmcid: null
    url: https://doi.org/10.1093/humupd/dmt045
    source_license: 出版社の著作物（CC の表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 数値は流産後の集団での値で、一般集団の有病率ではない。子宮鏡下癒着剥離術などの治療成績は本出典の主な対象ではない。
  curriculum:
    core_curriculum: 'PS-02-10-05 (id: JkxnuSA)'
