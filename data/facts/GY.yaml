    doi: 10.1016/j.jmig.2015.09.018
    pmid: '26427702'
    pmcid: null
    url: https://doi.org/10.1016/j.jmig.2015.09.018
    source_license: 出版社（Elsevier）の著作物（論文の著作権表示。CC の表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 2016年のレビューであり、「確立した治療は子宮摘出」という位置づけは当時の記載である。子宮温存治療や薬物療法の現在の位置づけは別途確認が必要。画像診断の感度・特異度の定量値は抄録で確認していないため書いていない。
