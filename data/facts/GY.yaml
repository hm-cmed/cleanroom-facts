- id: GY-058
  domain: GY
  subdomain: 直腸腟瘻・膀胱腸瘻
  assertion:
    plain_statement_ja: 直腸腟瘻は直腸と腟の間に瘻孔ができ、腟からの排ガスや便の漏れを来す状態である。フランスの単一施設で1996〜2014年に手術を受けた直腸腟瘻79例（計286手技）では、原因は Crohn 病が43%、術後が32%、分娩外傷が9%、放射線性直腸炎が5%で、平均33か月の追跡で全体の成功率は72%（57例）だった。手技ごとの解析では、大きな修復手技や一時的人工肛門造設を組み合わせた治療が成功と関連していた。
    condition:
      region: フランス
      study: 1996〜2014年に単一施設で手術を受けた79例の後方視研究
    differential: null
    common_misconception: null
