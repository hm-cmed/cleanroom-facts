- id: GY-057
  domain: GY
  subdomain: 膀胱腟瘻
  assertion:
    plain_statement_ja: 膀胱腟瘻は膀胱と腟の間に瘻孔ができ、腟から持続的に尿が漏れる状態である。インドの三次医療機関で1999〜2019年に経腟修復を受けた単純性膀胱腟瘻202例では、原因は子宮摘出後が60.4%（122例）、緊急帝王切開時の外傷が39.6%（80例）で、経腟修復の成功率は99.5%と、文献上の低侵襲手術コホートの96.5%を上回り、平均手術時間も63±16分と低侵襲手術の161.6±41.0分より短かった。
    condition:
      region: インド
      study: 1999〜2019年に単一施設で経腟修復を受けた202例の後方視研究
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-801
    source: 'Kumar M, et al. Vesicovaginal Fistula Repair by Transvaginal Route: Comparison of Resource Utilisation and Outcome with Literature Reported Population Matched Cohort of Patients Operated by Minimally Invasive Route. J Obstet Gynaecol India. 2022;72(5):414-419'
    doi: 10.1007/s13224-021-01549-z
    pmid: '36458065'
    pmcid: PMC9568645
    url: https://doi.org/10.1007/s13224-021-01549-z
    source_license: 出版社の著作物（CC の表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 単一施設の後方視研究で、比較相手は文献コホートであり無作為比較ではない。対象は単純性膀胱腟瘻で、放射線性などの複雑な瘻孔の成績は示されていない。
  curriculum:
