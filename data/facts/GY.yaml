- id: GY-001
  domain: GY
  subdomain: 細菌性腟症
  assertion:
    plain_statement_ja: 細菌性腟症は、Amsel 基準4項目（腟壁に均一に付着する薄い帯下、clue cell、腟液 pH 4.5超、10% KOH 添加時の魚臭）のうち3項目以上を満たせば臨床診断でき、グラム染色による Nugent スコアが参照標準である。症状のある女性への推奨治療はメトロニダゾール500mgの1日2回7日間経口投与、メトロニダゾール0.75%ゲルの1日1回5日間腟内投与、またはクリンダマイシン2%クリームの就寝時1回7日間腟内投与である。
    condition:
      region: 米国（CDC 性感染症治療ガイドライン2021）
      study: ガイドラインの推奨レジメン
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-703
    source: Workowski KA, Bachmann LH, Chan PA, et al. Sexually Transmitted Infections Treatment Guidelines, 2021. MMWR Recomm Rep. 2021;70(4):1-187.
    doi: 10.15585/mmwr.rr7004a1
    pmid: '34292926'
    pmcid: PMC8344968
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC8344968/
    source_license: 米国政府機関（CDC）資料
    legal_basis: B
    source_class: GOV_US
