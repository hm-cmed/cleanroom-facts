- id: GY-021
  domain: GY
  subdomain: 子宮体癌
  assertion:
    plain_statement_ja: 子宮体癌のFIGO 2023病期では、I期は子宮体部に限局する病変で、IA1は非侵襲的組織型がポリープ内または内膜に限局するもの、IA2は非侵襲的組織型で筋層浸潤が1/2未満かつ脈管侵襲がないか局所的なもの、IA3は低悪性度類内膜癌の子宮と卵巣の同時病変、IBは筋層浸潤が1/2以上、ICは侵襲的組織型で筋層浸潤がないものとされる。II期はIIAが頸部間質浸潤、IIBが多量の脈管侵襲、IICが侵襲的組織型で筋層浸潤を伴うもの、III期はIIIAが付属器・漿膜進展、IIIBが腟・子宮傍組織・骨盤腹膜進展、IIICがリンパ節転移、IVA期は膀胱・腸粘膜浸潤、IVB期は骨盤外の腹膜転移、IVC期は遠隔転移である。標準手術は単純子宮全摘と両側付属器切除で低侵襲アプローチによる実施が推奨され、センチネルリンパ節生検は系統的リンパ節郭清の代替として適切とされる。
    condition:
      region: 国際（FIGO分類）
      study: FIGO Women's Cancer Committeeによる病期分類の改訂論文
    differential: null
    common_misconception: null
  provenance:
