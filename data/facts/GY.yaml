  uncertainty: 個別の薬剤（低用量エストロゲン・プロゲスチン配合薬、プロゲスチン製剤、GnRH アナログ・アンタゴニスト等）の国内承認・保険適用は本調査では未確認で、取り込み時に PMDA の添付文書で確認が必要。欧州のガイドラインであり、国内の推奨や保険適用の範囲と異なる場合がある。
