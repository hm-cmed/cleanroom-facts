    plain_statement_ja: 子宮内膜症の管理について、ESHRE のガイドラインは診断から疼痛・不妊の治療、再発への対応まで109件の推奨を示している。疼痛の治療の選択肢には鎮痛薬、ホルモン療法を含む薬物療法、手術があり、同ガイドラインは腹腔鏡と組織診が診断の絶対的な基準ではないことも明示している。どの治療が最も適切かについては、根拠が不足して強い推奨ができない領域も残されている。
