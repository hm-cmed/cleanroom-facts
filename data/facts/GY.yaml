    plain_statement_ja: 性索間質性腫瘍の代表である成人型顆粒膜細胞腫は、エストロゲンを産生する腫瘍が多く、腫瘍由来のエストロゲンへの長期曝露によって子宮内膜増殖症や子宮体癌を合併し、不正出血で見つかることがある。治療は手術が基本で、高齢女性では子宮全摘と両側付属器摘出が行われ、若年女性では病変が片側の卵巣に限局し子宮体癌の合併が除外できれば、片側付属器摘出による温存が可能である。予後は進行期が最も重要な因子で、多くは早期に見つかるため生存は概して良好である。
