- id: GY-061
  domain: GY
  subdomain: 尿管腟瘻
  assertion:
    plain_statement_ja: 尿管腟瘻は尿管と腟の間に瘻孔ができ、腟から尿が漏れる状態で、主な原因は婦人科・産科の手術である。サウジアラビアの単一施設の尿管腟瘻20例では、内視鏡的に尿管ステントを留置した11例のうち7例（64%）がステントのみで治り、残りの4例を含む13例に行った尿管再植術は全例で成功した。膀胱鏡検査で膀胱腟瘻の合併が2例（10%）に見つかったため、評価には膀胱鏡が勧められている。
    condition:
