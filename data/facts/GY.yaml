  assertion:
    plain_statement_ja: Bartholin 腺では膿瘍は導管嚢胞の約3倍の頻度でみられる。小さな無症状の嚢胞は無治療で経過観察できる一方、膿瘍には Word カテーテル留置（4〜6週間）などのドレナージを行い、造袋術は膿瘍には行わない。40歳を超える女性では癌を除外するため、ドレナージに加えて生検が推奨される。
