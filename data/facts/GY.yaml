- id: GY-004
  domain: GY
  subdomain: 骨盤内炎症性疾患（診断）
  assertion:
    plain_statement_ja: 骨盤内炎症性疾患（PID）は単一の所見では感度・特異度を両立できないため、性活動のある女性が骨盤痛・下腹痛を訴え、他に原因が特定できず、内診で子宮頸部移動痛、子宮圧痛、付属器圧痛のいずれか1つ以上（最小基準）を認めれば、低い閾値で PID を疑い推定治療の開始を検討する。口腔温38.3℃超、粘液膿性の頸管分泌物、腟分泌物の生理食塩水鏡検での白血球増加、赤沈・CRP の上昇、頸管の淋菌・クラミジア感染の証明は、特異度を高める追加基準である。
