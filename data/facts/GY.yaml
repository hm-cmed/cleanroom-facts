- id: GY-052
  domain: GY
  subdomain: 胞状奇胎
  assertion:
    plain_statement_ja: 絨毛性疾患は妊娠に関連する疾患群の総称で、前悪性病変である全胞状奇胎と部分胞状奇胎と、悪性病変である侵入奇胎、絨毛癌、胎盤部トロホブラスト腫瘍からなる。管理と経過観察体制の進歩により、妊孕性を温存しながら絨毛性疾患全体の治癒率が98%を超えるようになっており、その背景には有効な治療法の開発、hCG をバイオマーカーとして用いる管理、診療の集約化がある。
    condition:
