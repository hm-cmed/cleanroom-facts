- id: GY-002
  domain: GY
  subdomain: 腟カンジダ症
  assertion:
    plain_statement_ja: 外陰腟カンジダ症は Candida albicans が主な原因で、掻痒、腟の痛み、性交痛、外性器の排尿痛、異常帯下を呈するが、いずれも特異的な症状ではない。診断は、帯下の湿式標本（生理食塩水または10% KOH）で出芽酵母・菌糸・偽菌糸を確認するか、培養等で酵母が陽性となることで行い、腟 pH は正常範囲（4.5未満）であることが多い。単純性例の治療はフルコナゾール150mg単回経口投与またはアゾール系腟剤である。
