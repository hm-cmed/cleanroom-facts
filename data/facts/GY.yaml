- id: GY-043
  domain: GY
  subdomain: 茎捻転
  assertion:
    plain_statement_ja: 付属器捻転は女性の外科的緊急症の2.7%を占め、成人の最大の危険因子は付属器囊胞の存在である。画像検査の第一選択は経腟超音波で、片側の卵巣腫大やドプラでの血流低下が手がかりになるが、所見がなくても捻転は否定できない。治療は緊急手術が原則で、術中に壊死様に見える卵巣でも捻転解除後に機能が回復することが多いため、卵巣摘出ではなく捻転解除による温存が推奨される。
