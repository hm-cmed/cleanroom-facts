- id: GY-010
  domain: GY
  subdomain: 子宮留膿症
  assertion:
    plain_statement_ja: 子宮留膿症は子宮腔内に膿が貯留する状態で、閉経後の女性に多く、主な発生機序は頸管の閉塞であり、その原因には頸管狭窄、良性・悪性の腫瘍、萎縮性（老人性）頸管炎、放射線治療後変化、子宮内避妊器具などが含まれる。穿孔していない例は経頸管ドレナージと広域抗菌薬で管理するが、自然穿孔により汎発性腹膜炎を生じた例では緊急開腹と子宮摘出が必要であり、診療にあたっては婦人科悪性腫瘍の合併率が高い点に注意する。
