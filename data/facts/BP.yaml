    plain_statement_ja: 日本の急性膵炎の診断基準では、①上腹部の急性腹痛発作と圧痛、②血中または尿中の膵酵素の上昇、③超音波・CT・MRIでの急性膵炎に伴う膵の異常所見、の3項目のうち2項目以上を満たし、他の膵疾患と急性腹症を除外したものを急性膵炎とする。慢性膵炎の急性増悪も急性膵炎に含める。
