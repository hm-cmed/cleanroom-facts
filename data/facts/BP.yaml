- id: BP-071
  domain: BP
  subdomain: 胆囊ポリープ
  assertion:
    plain_statement_ja: 胆囊ポリープの初期評価は腹部超音波検査である。大半はコレステロールポリープなどの偽ポリープで、悪性化しない。
