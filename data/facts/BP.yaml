- id: BP-074
  domain: BP
  subdomain: 胆囊腺筋腫症
  assertion:
    plain_statement_ja: 胆囊腺筋腫症は、粘膜の壁内陥入（Rokitansky-Aschoff洞）を伴う胆囊壁の過形成性変化による良性病変である。超音波でのcomet-tail artifact、MRI や MRCP でのpearl-necklace sign が特徴的所見で、胆囊癌との鑑別が要点である。
    condition:
      region: 国際
      対象: 成人
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-4232
    source: Hammad AY, Miura JT, Turaga KK, et al. A literature review of radiological findings to guide the diagnosis of gallbladder adenomyomatosis. HPB (Oxford). 2016;18(2):129-135.
    doi: 10.1016/j.hpb.2015.09.006
    pmid: '26902131'
    pmcid: PMC4814619
    url: https://doi.org/10.1016/j.hpb.2015.09.006
    source_license: CC表示なし（購読誌）
