- id: BP-070
  domain: BP
  subdomain: 膵・胆管合流異常症
  assertion:
    plain_statement_ja: 膵・胆管合流異常症は胆道癌の高リスク病態で、予防的手術が原則である。胆管拡張型では胆囊摘出と肝外胆管切除・分流手術、胆管非拡張型では予防的胆囊摘出が推奨される（いずれも推奨グレード1）。発癌部位は、胆管拡張型では胆管と胆囊の双方、胆管非拡張型では主に胆囊である。
    condition:
      region: 日本
      対象: 成人
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-4230
    source: Kamisawa T, Ando H, Suyama M, et al. Japanese clinical practice guidelines for pancreaticobiliary maljunction. J Gastroenterol. 2012;47(7):731-759.
    doi: 10.1007/s00535-012-0611-2
    pmid: '22722902'
    pmcid: null
    url: https://doi.org/10.1007/s00535-012-0611-2
    source_license: 学会の著作物（CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 推奨グレードは同ガイドラインの表記どおり。2012年版以降の改訂の有無は未確認。
  curriculum:
    kokushi: 医学各論 Ⅵ-7-A-①（膵・胆管合流異常症、c）
