    plain_statement_ja: ビリルビンカルシウム石の主な原因は胆道感染である。コレステロール石は胆汁のコレステロール過飽和、結晶化、胆嚢の収縮能低下と関係し、黒色石は非抱合型ビリルビンの過剰と関係して肝硬変でもみられる。
