- id: BP-072
  domain: BP
  subdomain: 胆囊ポリープ
  assertion:
    plain_statement_ja: 胆囊ポリープは、径10mm以上で胆囊摘出を推奨する。6〜9mmでも、悪性リスク因子（60歳超、原発性硬化性胆管炎の既往、アジア人、無茎性、限局性壁肥厚4mm超）があれば胆囊摘出を推奨する。
    condition:
      region: 欧州
      対象: 成人
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-4231
    source: 'Foley KG, Lahaye MJ, Thoeni RF, et al. Management and follow-up of gallbladder polyps: updated joint guidelines between the ESGAR, EAES, EFISDS and ESGE. Eur Radiol. 2022;32(5):3358-3368.'
    doi: 10.1007/s00330-021-08384-w
    pmid: '34918177'
    pmcid: null
    url: https://doi.org/10.1007/s00330-021-08384-w
    source_license: CC表示なし（学会合同ガイドライン・購読誌）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: リスク因子に「アジア人」が含まれる点は、日本の診療でも重要である。
  curriculum:
    kokushi: 医学各論 Ⅵ-7-C-①（胆囊ポリープ、a）
