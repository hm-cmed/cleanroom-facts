- id: BP-007
  domain: BP
  subdomain: 原発性硬化性胆管炎
  assertion:
    plain_statement_ja: 原発性硬化性胆管炎（PSC）は、肝内外の胆管に線維性狭窄を生じる進行性の慢性炎症性疾患で、二次性硬化性胆管炎やIgG4関連硬化性胆管炎は除外する。令和元年度の医療受給者証保持者数は892人で、発症年齢は30歳代と60歳代の二峰性を示す。
