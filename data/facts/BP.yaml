  subdomain: 胆囊ポリープ
  assertion:
    plain_statement_ja: 悪性リスク因子のない6〜9mmの胆囊ポリープは、超音波検査で6か月後、1年後、2年後にフォローし、増大がなければフォローを終了する。悪性リスク因子のない5mm以下のポリープはフォロー不要である。
