- id: SP-002
  domain: SP
  subdomain: 椎間板ヘルニア
  assertion:
    plain_statement_ja: 保存治療下の腰椎椎間板ヘルニアは自然退縮しうる。系統的レビューでは自然退縮率は遊離型（sequestration）96%、脱出型（extrusion）70%、突出型（protrusion）41%、膨隆型（bulging）13%で、完全消失率は遊離型43%、脱出型15%であった。
    condition:
      population: 保存治療を受けた腰椎椎間板ヘルニア患者
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1782
    source: 'Chiu CC, Chuang TY, Chang KH, et al. The probability of spontaneous regression of lumbar herniated disc: a systematic review. Clin Rehabil. 2015;29(2):184-195'
    doi: 10.1177/0269215514540919
    pmid: '25009200'
    pmcid: null
    url: https://doi.org/10.1177/0269215514540919
    source_license: SAGE（Clinical Rehabilitation）、CC 表示なし
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ47 2026-11-13）：Golubović J, Jelača B, Rodić D, Torbica S, Stošić S, Đilvesi Đ. Spontaneous Resorption of Lumbar Disc Herniation: A Narrative Review of Pathophysiology, Predictive Factors, and Clinical Decision-Making. NeuroSci. 2026;7(2):30（PMID: 41874033、DOI: 10.3390/neurosci7020030、PMCID: PMC13010770、https://europepmc.org/article/MED/41874033）。裏づける部分：候補（CC BY の叙述的総説）の全文に、保存治療下でヘルニアの自然退縮が起こること、脱出型・遊離型はよく退縮し（脱出型で約60〜70%と観察研究の範囲が示される）、膨隆・突出型では退縮が乏しいことが明記され、型による退縮しやすさの順序が裏づけられる。数値の照合：候補は Chiu ら 2015 の統合値そのもの（遊離型96%・脱出型70%・突出型41%・膨隆型13%、完全消失率43%・15%）は再掲しておらず、観察研究の範囲として脱出型約60〜70%等を示すにとどまる。カードの統合値と矛盾する値ではないため主張チェックとはせず、数値部分を留保して B。留保：候補は SP-003 と同一で、出典マスター未登録のため新規 SRC 登録候補。主出典（SRC-1782）は Crossref で TDM ライセンスのみ、Europe PMC でもライセンス表示がなく自由利用ではない'
  uncertainty: 画像で2回以上評価された保存治療例の研究を統合した値。国内ガイドライン（SRC-1781）でも、症候性ヘルニアの60%以上の例で画像上の退縮が認められ、遊離型・脱出型は吸収されやすいとされる。
  curriculum:
