- id: SP-022
  domain: SP
  subdomain: 強直性脊椎炎
  assertion:
    plain_statement_ja: 体軸性脊椎関節炎の ASAS 分類基準は、45歳未満で発症した3か月以上の慢性腰痛を対象とし、画像（X線または MRI）で仙腸関節炎を認め脊椎関節炎の特徴を1つ以上伴う「画像 arm」、または HLA-B27 陽性で特徴を2つ以上伴う「臨床 arm」のいずれかで分類する。基準全体の感度は82.9%、特異度は84.4%である。
    condition:
      population: 45歳未満発症の慢性腰痛患者
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-5029
    source: 'Newby BN, Weiss PF. Advancing Juvenile Spondyloarthritis: Closing Knowledge Gaps with New Axial JSpA Classification Criteria. Curr Rheumatol Rep. 2025;27(1):39'
    doi: 10.1007/s11926-025-01206-8
    pmid: '41251853'
    pmcid: PMC12627101
    url: https://europepmc.org/article/MED/41251853
    source_license: CC BY
    legal_basis: B
    source_class: OPEN
    corroboration: '元の主出典：SRC-1798（Rudwaleit M, van der Heijde D, Landewé R, et al. The development of Assessment of SpondyloArthritis international Society classification criteria for axial spondyloarthritis (part II): validation and final selection. Ann Rheum Dis. 2009;68(6):777-783）'
  uncertainty: 本カードは脊椎病変を中心とする分類基準の骨格のみを扱い、強直性脊椎炎の全身像の総論は対象外とした。感度・特異度は分類基準の検証コホート（649例）に基づく。
  curriculum:
    kokushi: 医学各論 Ⅸ-7-A-⑫（強直性脊椎炎、b）
