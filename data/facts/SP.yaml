- id: SP-028
  domain: SP
  subdomain: 横断性脊髄炎
  assertion:
    plain_statement_ja: 急性横断性脊髄炎は、脊髄の局所的な炎症により運動、感覚、自律神経の障害を生じる疾患であり、診断の枠組みでは圧迫性病変の検出・除外と、特発性か、多発性硬化症などの基礎疾患に伴う二次性かの区別が重視される。
    condition:
      population: 急性横断性脊髄症を呈する患者
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1804
    source: Transverse Myelitis Consortium Working Group. Proposed diagnostic criteria and nosology of acute transverse myelitis. Neurology. 2002;59(4):499-505
    doi: 10.1212/wnl.59.4.499
    pmid: '12236201'
    pmcid: null
    url: https://doi.org/10.1212/wnl.59.4.499
    source_license: Wolters Kluwer（Neurology）、CC 表示なし
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 出典は2002年の診断基準提案であり、個別の必須項目（髄液所見・増強所見など）の細目は本文に依拠する。多発性硬化症・NMOSD の診断基準そのものは ND 側の領域であり、本カードでは鑑別の枠組みのみを扱った。
