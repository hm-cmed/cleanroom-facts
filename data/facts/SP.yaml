- id: SP-003
  domain: SP
  subdomain: 椎間板ヘルニア
  assertion:
    plain_statement_ja: 腰椎椎間板ヘルニアに対する手術は、保存的治療を一定期間行っても改善しない場合に適応となるが、重篤な運動障害や馬尾障害が出現した場合は、重症度と時間的要素を考慮して早期に手術を行うことが望ましい場合がある。
    condition:
      population: 腰椎椎間板ヘルニア患者
      region: 日本
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-5026
    source: 'Golubović J, Jelača B, Rodić D, Torbica S, Stošić S, Đilvesi Đ. Spontaneous Resorption of Lumbar Disc Herniation: A Narrative Review of Pathophysiology, Predictive Factors, and Clinical Decision-Making. NeuroSci. 2026;7(2):30'
    doi: 10.3390/neurosci7020030
    pmid: '41874033'
    pmcid: PMC13010770
    url: https://europepmc.org/article/MED/41874033
    source_license: CC BY
    legal_basis: B
    source_class: OPEN
    corroboration: 元の主出典：SRC-1781（Haro H, Ebata S, Inoue G, et al. Japanese Orthopaedic Association (JOA) clinical practice guidelines on the management of lumbar disc herniation, third edition - secondary publication. J Orthop Sci. 2022;27(1):31-78）
  uncertainty: 方針に従い、馬尾障害に伴う排尿障害の詳細（評価・管理）は本カードでは扱っていない。
