- id: SP-026
  domain: SP
  subdomain: 脊髄血管障害
  assertion:
    plain_statement_ja: 自然発症の脊髄梗塞は、重度の神経障害が12時間以内に最大に達する急速な発症が典型的（77%）であり、感覚障害のある例の約4割では痛覚・温度覚が選択的に障害される解離性所見を示し、横断性脊髄炎としばしば誤診される。
    condition:
      population: 自然発症の脊髄梗塞患者
      region: 米国
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1802
    source: Zalewski NL, Rabinstein AA, Krecke KN, et al. Characteristics of Spontaneous Spinal Cord Infarction and Proposed Diagnostic Criteria. JAMA Neurol. 2019;76(1):56-63
    doi: 10.1001/jamaneurol.2018.2734
    pmid: '30264146'
    pmcid: null
    url: https://doi.org/10.1001/jamaneurol.2018.2734
    source_license: AMA（JAMA Neurology）、CC 表示なし
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 数値は Mayo Clinic の単施設シリーズ133例に基づく。痛覚・温度覚の選択的障害は前脊髄動脈領域の梗塞（前脊髄動脈症候群）のパターンに相当する。
