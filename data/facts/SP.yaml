- id: SP-012
  domain: SP
  subdomain: 腰痛症
  assertion:
    plain_statement_ja: 腰痛の大多数は、特異的な侵害受容の原因を同定できない非特異的腰痛であり、椎体骨折、悪性腫瘍、感染のように病理学的原因が明確な例は少数にとどまる。
    condition:
      population: 腰痛を訴える患者
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1790
    source: Hartvigsen J, Hancock MJ, Kongsted A, et al. What low back pain is and why we need to pay attention. Lancet. 2018;391(10137):2356-2367
    doi: 10.1016/S0140-6736(18)30480-X
