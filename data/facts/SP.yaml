  domain: SP
  subdomain: 脊椎すべり症
  assertion:
    plain_statement_ja: すべりの程度はすべり率（%）で表され、Meyerding 分類では I 度（0〜25%）、II 度（25〜50%）、III 度（50〜75%）、IV 度（75〜100%）、V 度（完全なすべり、spondyloptosis）に分類される。
    condition:
      population: 脊椎すべり症患者
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1797
    source: Da W, Jian Q, Evan J, et al. Quantitative Analysis of Relationship Between Paraspinal Muscle Degeneration and Degree of Degenerative Lumbar Spondylolisthesis. Spine. 2025;50(19):1327-1335
    doi: 10.1097/BRS.0000000000005270
    pmid: '39895123'
    pmcid: null
    url: https://doi.org/10.1097/BRS.0000000000005270
    source_license: CC BY-NC-ND 4.0
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の判定 A を B として反映、作り手の調査バッチ47 2026-11-13）：Helenius I, Virkki E, Toomela T, Studer D, Gehrchen M, Ahonen M. An Acta Orthopaedica educational article: Treatment of pediatric spondylolysis and spondylolisthesis. Acta Orthop. 2025;96:80-86（PMID: 39804815、DOI: 10.2340/17453674.2024.42450、PMCID: PMC11734530、https://europepmc.org/article/MED/39804815）。裏づける部分：主張全体：候補（CC BY の教育論文）の全文に、Meyerding 分類がすべりの程度による分類として、I 度は25%未満、II 度は25〜49%、III 度は50〜74%、IV 度は75〜99%、spondyloptosis（完全なすべり、100%）が V 度であることが明記される。カードの分類の全要素が裏づけられる。数値の照合：区間の境界の表記が候補とカードでわずかに異なる（候補 II 度 25〜49%・IV 度 75〜99% に対し、カード II 度 25〜50%・IV 度 75〜100%。カード側も主出典の表で IV 度の上限を「100%未満」と注記しており、実質は同一の分類）。両表記を記録する。留保：候補は小児を対象とした教育論文だが、Meyerding 分類自体は年齢を問わない分類として記載される。候補は出典マスター未登録のため新規 SRC 登録候補'
  uncertainty: 数値は出典の表から読み取り。IV 度の上限は出典本文で「75%〜100%未満」と記載され、V 度は完全すべりとされる。
