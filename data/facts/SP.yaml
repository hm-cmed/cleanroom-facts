- id: SP-008
  domain: SP
  subdomain: 脊柱管狭窄症
  assertion:
    plain_statement_ja: 腰部脊柱管狭窄症の神経性間欠性跛行は、歩行や立位で下肢痛・しびれが増悪し、前屈や座位で軽快することを特徴とし、姿勢にかかわらず短時間の休息で軽快する血管性間欠性跛行（末梢動脈疾患）との鑑別が重要である。
    condition:
      population: 腰部脊柱管狭窄症患者
      region: 日本
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1786
    source: Kawakami M, Takeshita K, Inoue G, et al. Japanese Orthopaedic Association (JOA) clinical practice guidelines on the management of lumbar spinal stenosis, 2021 - Secondary publication. J Orthop Sci. 2023;28(1):46-91
    doi: 10.1016/j.jos.2022.03.013
    pmid: '35597732'
    pmcid: null
    url: https://doi.org/10.1016/j.jos.2022.03.013
    source_license: CC BY-NC-ND 4.0（Journal of Orthopaedic Science）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 末梢動脈疾患の除外に足関節上腕血圧比（ABI）を用いる点は、診断サポートツール研究（SRC-1787 および DISTO プロジェクト）でも組み込まれている。方針に従い、馬尾型に伴う排尿障害の詳細は扱っていない。
  curriculum:
    kokushi: 医学各論 Ⅸ-7-A-④（脊柱管狭窄症、a）
