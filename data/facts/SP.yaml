  subdomain: 強直性脊椎炎
  assertion:
    plain_statement_ja: 体軸性脊椎関節炎の ASAS 分類基準は、45歳未満で発症した3か月以上の慢性腰痛を対象とし、画像（X線または MRI）で仙腸関節炎を認め脊椎関節炎の特徴を1つ以上伴う「画像 arm」、または HLA-B27 陽性で特徴を2つ以上伴う「臨床 arm」のいずれかで分類する。基準全体の感度は82.9%、特異度は84.4%である。
