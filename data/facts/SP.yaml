- id: SP-029
  domain: SP
  subdomain: 横断性脊髄炎
  assertion:
    plain_statement_ja: 視神経脊髄炎スペクトラム障害（NMOSD）の脊髄炎では、病変が3椎体以上に及ぶ縦長の横断性脊髄炎（LETM）が典型的にみられ、横断性脊髄炎の鑑別では NMOSD を念頭に抗 AQP4 抗体の評価が重要である。
    condition:
      population: 横断性脊髄炎を呈する患者
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1697
    source: Wingerchuk DM, Banwell B, Bennett JL, et al. International consensus diagnostic criteria for neuromyelitis optica spectrum disorders. Neurology. 2015;85(2):177-189
    doi: 10.1212/WNL.0000000000001729
    pmid: '26092914'
    pmcid: null
    url: https://doi.org/10.1212/WNL.0000000000001729
    source_license: CC BY-NC-ND 4.0
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: LETM の定義（3椎体以上）は出典の全文で確認した。NMOSD の診断基準の全体像は ND 側で扱うため、本カードでは脊髄病変の特徴に絞った。
