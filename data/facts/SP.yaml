    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ47 2026-11-13）：Thoomes EJ, Arvanitidis M, van Geest S, van der Windt DA, Verhagen AP, de Graaf M, Kuijper B, et al. Diagnostic accuracy of physical examination tests for painful cervical radiculopathy: update of a systematic review and meta-analysis. BMC Musculoskelet Disord. 2026;27(1):338（PMID: 41680685、DOI: 10.1186/s12891-026-09551-0、PMCID: PMC13088722、https://europepmc.org/article/MED/41680685）。裏づける部分：候補（CC BY の系統的レビュー更新版。主出典の筆頭著者と同一グループ）の全文に、Spurling テストは5研究で特異度が高く（0.84〜1.00）、感度は0.38〜0.98とばらつくこと、診断精度のエビデンスは乏しく確実性が非常に低いことが明記され、単独所見で診断を確定できないというカードの結論が裏づけられる。数値の照合：特異度はカード 0.89〜1.00 に対し候補 0.84〜1.00、感度はカード 0.38〜0.97 に対し候補 0.38〜0.98。候補は主出典（2018年版）を更新した系統的レビューで対象研究の組が異なるため範囲がわずかに広がっている。両値を記録する（主張チェック／サーベイランス：主出典の後継版が2026年に出ている）。留保：候補は出典マスター未登録のため新規 SRC 登録候補。主出典（SRC-1785）は Crossref で TDM ライセンスのみ、Europe PMC でもライセンス表示がなく自由利用ではない'
  uncertainty: 系統的レビューに含まれた診断精度研究は5件のみで、信頼区間は広い。頸椎椎間板ヘルニアによる神経根症も本項目の対象に含まれるが、ヘルニア単独のカードは作成していない。
