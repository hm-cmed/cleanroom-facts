- id: SP-008
  domain: SP
  subdomain: 脊柱管狭窄症
  assertion:
    plain_statement_ja: 腰部脊柱管狭窄症の神経性間欠性跛行は、歩行や立位で下肢痛・しびれが増悪し、前屈や座位で軽快することを特徴とし、姿勢にかかわらず短時間の休息で軽快する血管性間欠性跛行（末梢動脈疾患）との鑑別が重要である。
    condition:
      population: 腰部脊柱管狭窄症患者
      region: 日本
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1786
    source: Kawakami M, Takeshita K, Inoue G, et al. Japanese Orthopaedic Association (JOA) clinical practice guidelines on the management of lumbar spinal stenosis, 2021 - Secondary publication. J Orthop Sci. 2023;28(1):46-91
    doi: 10.1016/j.jos.2022.03.013
    pmid: '35597732'
    pmcid: null
    url: https://doi.org/10.1016/j.jos.2022.03.013
    source_license: CC BY-NC-ND 4.0（Journal of Orthopaedic Science）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ47 2026-11-13）：Roseen EJ, Smith CN, Rahim A, Deal C, Fischer R, Morone NE, Flack A, Penza C, Suri P, Douglas S, et al. Which lumbar spinal stenosis patients will improve with nonsurgical treatment? A secondary analysis of a randomized controlled trial of manual therapy and individualized exercise. Chiropr Man Therap. 2025;33(1):57（PMID: 41366694、DOI: 10.1186/s12998-025-00620-0、PMCID: PMC12690792、https://europepmc.org/article/MED/41366694）。裏づける部分：候補（CC BY のランダム化試験の二次解析）の全文に、腰部脊柱管狭窄症は腰椎伸展で症状が悪化し屈曲で改善すること（対象者の適格条件も「屈曲で症状が少ない神経性跛行」）、末梢動脈疾患の同定に足関節上腕血圧比（ABI）を用いることが明記され、姿勢依存性という特徴の核が裏づけられる。留保：「血管性間欠性跛行は姿勢にかかわらず短時間の休息で軽快する」という対比の文言そのものは候補になく、その部分を留保して B。主出典（SRC-1786）は Crossref の version-of-record と Europe PMC の双方で CC BY-NC-ND を確認し、自由利用ではなく、マスターの RESTRICTED と一致する。候補は出典マスター未登録のため新規 SRC 登録候補'
  uncertainty: 末梢動脈疾患の除外に足関節上腕血圧比（ABI）を用いる点は、診断サポートツール研究（SRC-1787 および DISTO プロジェクト）でも組み込まれている。方針に従い、馬尾型に伴う排尿障害の詳細は扱っていない。
