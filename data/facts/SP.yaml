    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の判定 A を B として反映、作り手の調査バッチ47 2026-11-13）：Jakubowicz-Lachowska D, Wierciński M, Kapica-Topczewska K, Kułakowska A, Tarasow E, Kochaniak A, et al. When Flow Voids Are Missed: Delayed Diagnosis of Foix-Alajouanine Syndrome-A Case Report. Neurol Int. 2026;18(10):188／Vukašinović I, Zivkovic B, Nedeljkovic Z, Micovic M, Petrovic M, Stanic L, Nedeljkovic A, Bascarevic V. Multidisciplinary Management of Spinal Dural Arteriovenous Fistulas Using an Endovascular-First Treatment Strategy: A Nine-Year Single-Center Retrospective Analysis. Neurol Int. 2026;18(7):137（PMID: 42931142、DOI: 10.3390/neurolint18100188、PMCID: PMC13708201、https://europepmc.org/article/MED/42931142）。裏づける部分：主張全体：候補1（CC BY の症例報告）の全文に、脊髄硬膜動静脈瘻は脊髄血管奇形の約70%を占め、中高年男性に多く、静脈うっ血による進行性の虚血性脊髄症を呈することが明記される。治療については候補2（CC BY の症例集積）の全文に、血管内塞栓を第一選択とし、不成功・禁忌の場合に外科的遮断を行う集学的アルゴリズムが明記され、瘻孔の閉塞が治療であることが裏づけられる。カードの全要素が裏づけられる。数値の照合：約70%はカードの値と一致。留保：候補2の識別子は PMID 42506059、DOI 10.3390/neurolint18070137、PMCID PMC13415202（Europe PMC の個別レコードで確認）。候補はいずれも出典マスター未登録のため新規 SRC 登録候補。主出典（SRC-1803）は Crossref・Europe PMC のいずれでもライセンス表示がなく自由利用とは確認できない'
