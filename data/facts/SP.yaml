    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ47 2026-11-13）：Storari L, Piai J, Zitti M, Raffaele G, Fiorentino F, Paciotti R, Garzonio F, Ganassin G, Mourad F, Rossettini G. Standardized Definition of Red Flags in Musculoskeletal Care: A Comprehensive Review of Clinical Practice Guidelines. Medicina (Kaunas). 2025;61(6):1002（PMID: 40572690、DOI: 10.3390/medicina61061002、PMCID: PMC12195327、https://europepmc.org/article/MED/40572690）。裏づける部分：候補（CC BY の診療ガイドライン総説）の全文に、腰痛の red flags は悪性腫瘍・骨折・感染・馬尾症候群などの重篤な病態を示唆する徴候として分類され、さらなる精査・専門医紹介を要する患者の同定に用いられることが、各ガイドラインの定義の総説として明記される。留保：「初期評価で確認し疑われれば画像を含む精査を行う」という診療の進め方そのものは日本のガイドライン書籍固有で、その部分を留保して B。候補は出典マスター未登録のため新規 SRC 登録候補'
