- id: SP-006
  domain: SP
  subdomain: 脊髄症
  assertion:
    plain_statement_ja: 頚椎症性脊髄症では、中等度以上の脊髄症状を呈する例や進行性の経過を示す例で手術治療を検討し、軽度で安定した例では保存的治療も選択肢となる。
    condition:
      population: 頚椎症性脊髄症患者
      region: 日本
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1784
    source: Watanabe M, Chikuda H, Fujiwara Y, et al. Japanese Orthopaedic Association (JOA) Clinical practice guidelines on the Management of Cervical Spondylotic Myelopathy, 2020 - Secondary publication. J Orthop Sci. 2023;28(1):1-45
    doi: 10.1016/j.jos.2022.03.012
    pmid: '35618542'
    pmcid: null
    url: https://doi.org/10.1016/j.jos.2022.03.012
    source_license: CC BY-NC-ND 4.0（Journal of Orthopaedic Science）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ47 2026-11-13）：Incerti M, Cristaldi PMF, Parlangeli A, Ricciuti V, Balletti F, Nicoli D, Cavadoli C, Servadei F, et al. Does Early Surgical Treatment in Degenerative Cervical Myelopathy Have a Favorable Clinical Outcome and Impact on Quality of Life? A Systematic Review. J Clin Med. 2026;15(12):4844（PMID: 42356012、DOI: 10.3390/jcm15124844、PMCID: PMC13302026、https://europepmc.org/article/MED/42356012）。裏づける部分：候補（CC BY の系統的レビュー）の全文に、中等症・重症の変性性頸髄症では手術が推奨され（AOSpine ガイドラインでも中等症・重症は禁忌でなければ手術へ紹介）、軽症では手術が系統的には推奨されないことが明記される。留保：「進行性の経過を示す例で手術を検討する」という要素は、候補では保存的に管理した軽症例の23〜54%が2〜6年以内に悪化して手術を要したという経過データの形で触れられるにとどまり、推奨の文言としては再掲がないため、その部分を留保して B。カードの uncertainty が引く Fehlings ら 2017 の国際ガイドライン（Global Spine J）は Europe PMC で CC BY-NC-ND を確認し、候補にはできない。候補は出典マスター未登録のため新規 SRC 登録候補'
  uncertainty: 同趣旨の位置づけは、国際的な変性性頸髄症ガイドライン（Fehlings ら, Global Spine J. 2017；中等症・重症への手術推奨）および脊柱靱帯骨化症診療ガイドライン2019の要約（中等度・進行性の脊髄症状で手術を検討）でも確認した。
