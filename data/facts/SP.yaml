- id: SP-005
  domain: SP
  subdomain: 脊髄症
  assertion:
    plain_statement_ja: 頚椎症性脊髄症の重症度評価には JOA スコアが用いられる。JOA スコアは満点17点で、上肢（手指・肩肘）・下肢の運動機能、上肢・体幹・下肢の感覚機能、膀胱機能を評価する。
    condition:
      population: 頚椎症性脊髄症患者
      region: 日本
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1784
    source: Watanabe M, Chikuda H, Fujiwara Y, et al. Japanese Orthopaedic Association (JOA) Clinical practice guidelines on the Management of Cervical Spondylotic Myelopathy, 2020 - Secondary publication. J Orthop Sci. 2023;28(1):1-45
    doi: 10.1016/j.jos.2022.03.012
    pmid: '35618542'
    pmcid: null
    url: https://doi.org/10.1016/j.jos.2022.03.012
    source_license: CC BY-NC-ND 4.0（Journal of Orthopaedic Science）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: JOA スコアの項目構成と満点17点は、スコアの信頼性を検討した Yonenobu らの報告（Spine. 2001）の抄録でも確認した。
