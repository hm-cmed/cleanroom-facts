- id: SP-001
  domain: SP
  subdomain: 椎間板ヘルニア
  assertion:
    plain_statement_ja: 腰椎椎間板ヘルニアの好発高位は L4/5 と L5/S1 であり、有病率はおおむね1%前後とされる。
    condition:
      population: 腰椎椎間板ヘルニア患者
      region: 日本
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1781
    source: Haro H, Ebata S, Inoue G, et al. Japanese Orthopaedic Association (JOA) clinical practice guidelines on the management of lumbar disc herniation, third edition - secondary publication. J Orthop Sci. 2022;27(1):31-78
    doi: 10.1016/j.jos.2021.07.028
    pmid: '34865915'
    pmcid: null
    url: https://doi.org/10.1016/j.jos.2021.07.028
    source_license: CC BY-NC-ND 4.0（Journal of Orthopaedic Science）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ47 2026-11-13）：Wahlström J, Liv P, Stjernbrandt A, Sayed-Noor AS, Mukka S, Lewis C, Jackson JA. Occupational risk factors for surgically treated lumbar disc herniation - a 33-year follow-up. Scand J Work Environ Health. 2025;51(6):550-558（PMID: 40996296、DOI: 10.5271/sjweh.4253、PMCID: PMC12593708、https://europepmc.org/article/MED/40996296）。裏づける部分：候補（CC BY のコホート研究）の全文に、腰椎椎間板ヘルニアは最下位の L4-L5 と L5-S1 に最も多いことが明記される。留保：有病率「おおむね1%前後」は自由な全文では確認できず、その部分を留保して B。主出典（SRC-1781）は Crossref で TDM ライセンスのみ、Europe PMC でもライセンス表示がなく自由利用ではない。候補は出典マスター未登録のため新規 SRC 登録候補'
  uncertainty: 数値・好発高位はガイドライン原典（2021 改訂第3版）の Minds 公開版要約でも同一内容を確認した。
