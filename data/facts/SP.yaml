    pmcid: null
    url: https://doi.org/10.1016/j.jos.2021.07.028
    source_license: CC BY-NC-ND 4.0（Journal of Orthopaedic Science）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 方針に従い、馬尾障害に伴う排尿障害の詳細（評価・管理）は本カードでは扱っていない。
