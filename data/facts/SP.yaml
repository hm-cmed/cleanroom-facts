- id: SP-024
  domain: SP
  subdomain: 脊椎腫瘍・脊髄腫瘍
  assertion:
    plain_statement_ja: 原発性脊髄腫瘍の手術症例104例の検討では、硬膜内髄外腫瘍が52.9%と最も多く、組織型では神経鞘腫（26.9%）と髄膜腫（18.3%）が主体で、髄内腫瘍の中では上衣腫が最も多かった。
    condition:
