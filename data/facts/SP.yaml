    doi: 10.1177/03635465241264804
    pmid: '39129296'
    pmcid: null
    url: https://doi.org/10.1177/03635465241264804
    source_license: SAGE（American Journal of Sports Medicine）、CC 表示なし
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ47 2026-11-13）：Madden V, Ayoub A, Thomas J, Thomas I. Spondylolysis: A Narrative Review of Etiology, Diagnosis, and Management. Int J Environ Res Public Health. 2026;23(2):153（PMID: 41752236、DOI: 10.3390/ijerph23020153、PMCID: PMC12940356、https://europepmc.org/article/MED/41752236）。裏づける部分：候補（CC BY の叙述的総説）の全文に、分離症は関節突起間部のストレス骨折であること、好発部位は L5（最大で95%）で次いで L4 であること、若年アスリートに多く、早期の診断と治療がすべり症への進行を防ぐうえで重要で、理学療法と装具による保存治療は早期に開始すると有効であることが明記される。留保：「早期に発見することで骨癒合が得られやすい」という骨癒合そのものの言及は候補では保存治療の有効性として述べられるにとどまり、その部分を留保して B。主出典（SRC-1796）は Crossref で TDM ライセンスのみ、Europe PMC でもライセンス表示がなく自由利用ではない。候補は出典マスター未登録のため新規 SRC 登録候補'
