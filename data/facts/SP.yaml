- id: SP-007
  domain: SP
  subdomain: 神経根症
  assertion:
    plain_statement_ja: 頸椎神経根症の身体検査所見のうち、Spurling テストは特異度が高い（0.89〜1.00）が、感度は研究間で0.38〜0.97とばらつきが大きく、単独の所見で診断を確定することはできない。
    condition:
      population: 頸椎神経根症が疑われる患者
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1785
    source: 'Thoomes EJ, van Geest S, van der Windt DA, et al. Value of physical tests in diagnosing cervical radiculopathy: a systematic review. Spine J. 2018;18(1):179-189'
    doi: 10.1016/j.spinee.2017.08.241
    pmid: '28838857'
    pmcid: null
    url: https://doi.org/10.1016/j.spinee.2017.08.241
    source_license: Elsevier（The Spine Journal）、CC 表示なし
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 系統的レビューに含まれた診断精度研究は5件のみで、信頼区間は広い。頸椎椎間板ヘルニアによる神経根症も本項目の対象に含まれるが、ヘルニア単独のカードは作成していない。
