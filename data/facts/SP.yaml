    source: 'Abedellatif SE, Janjic M, Khalafov L, Asoglu H, Dittmer J, Alenezi H, Maiseyeu I, Jaber M, Kobeissi H, El Ghazi M, Kobeissi L, Dib JE. Spinal metastases in geriatric patients: a retrospective single-center comparison of mortality and surgical outcomes following neurological decompression. Front Med (Lausanne). 2026;13:1897474'
