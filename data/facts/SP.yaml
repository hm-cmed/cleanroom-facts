    condition:
      population: 先天性筋性斜頸の乳児
      region: 米国
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1791
    source: 'Sargent B, Coulter C, Cannoy J, Kaplan SL, et al. Physical Therapy Management of Congenital Muscular Torticollis: A 2024 Evidence-Based Clinical Practice Guideline From the American Physical Therapy Association Academy of Pediatric Physical Therapy. Pediatr Phys Ther. 2024;36(4):370-421'
    doi: 10.1097/PEP.0000000000001114
    pmid: '39356257'
    pmcid: null
