- id: SP-026
  domain: SP
  subdomain: 脊髄血管障害
  assertion:
    plain_statement_ja: 自然発症の脊髄梗塞は、重度の神経障害が12時間以内に最大に達する急速な発症が典型的（77%）であり、感覚障害のある例の約4割では痛覚・温度覚が選択的に障害される解離性所見を示し、横断性脊髄炎としばしば誤診される。
    condition:
      population: 自然発症の脊髄梗塞患者
      region: 米国
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1802
    source: Zalewski NL, Rabinstein AA, Krecke KN, et al. Characteristics of Spontaneous Spinal Cord Infarction and Proposed Diagnostic Criteria. JAMA Neurol. 2019;76(1):56-63
    doi: 10.1001/jamaneurol.2018.2734
    pmid: '30264146'
    pmcid: null
    url: https://doi.org/10.1001/jamaneurol.2018.2734
    source_license: AMA（JAMA Neurology）、CC 表示なし
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ47 2026-11-13）：Abd Manap N, Mat Rabi M, Zainon R. Spinal Cord Infarction in a Young Patient After a Simple Stretching Maneuver: A Case Report of Rare Etiology and Diagnostic Challenges. Cureus. 2026;18(7):e112620（PMID: 42598034、DOI: 10.7759/cureus.112620、PMCID: PMC13471149、https://europepmc.org/article/MED/42598034）。裏づける部分：候補（CC BY の症例報告）の全文に、脊髄梗塞は通常は数時間以内に最大の重症度に達する突然の神経障害で発症すること、Zalewski らの診断基準が超急性の発症を重視すること、初期には横断性脊髄炎と誤診されうることが明記される。留保：「12時間以内に最大に達する例が77%」「感覚障害のある例の約4割で解離性所見」という主出典コホート固有の数値は候補に再掲がなく、その部分を留保して B。主出典（SRC-1802）自体は PMC に著者稿（PMC6440254）が収載されるがライセンス表示がなく自由利用ではない。PMCID は補完候補として申し送る。候補は出典マスター未登録のため新規 SRC 登録候補'
  uncertainty: 数値は Mayo Clinic の単施設シリーズ133例に基づく。痛覚・温度覚の選択的障害は前脊髄動脈領域の梗塞（前脊髄動脈症候群）のパターンに相当する。
