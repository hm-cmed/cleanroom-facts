- id: SP-010
  domain: SP
  subdomain: 脊柱管狭窄症
  assertion:
    plain_statement_ja: 画像で確認されたすべりを伴わない腰部脊柱管狭窄症に対し、除圧手術は SPORT 試験の as-treated 解析で非手術治療より疼痛と身体機能の改善が大きく、その差は3か月時点で有意となり2年時まで維持された。一方、intention-to-treat 解析で有意差があったのは身体の痛みのみであった。
    condition:
      population: 12週間以上症状が持続する腰部脊柱管狭窄症の手術候補患者
      region: 米国
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1788
    source: Weinstein JN, Tosteson TD, Lurie JD, et al. Surgical versus nonsurgical therapy for lumbar spinal stenosis. N Engl J Med. 2008;358(8):794-810
    doi: 10.1056/NEJMoa0707136
    pmid: '18287602'
    pmcid: null
    url: https://doi.org/10.1056/NEJMoa0707136
    source_license: Massachusetts Medical Society（New England Journal of Medicine）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ47 2026-11-13）：Patrekar S, Shinde S, Shinde A, Jagdale D, Shetty N. Comparative Clinical Outcomes of Non-surgical and Surgical Treatment Methods for Lumbar Canal Stenosis: A Systematic Review. Cureus. 2026;18(7):e111963（PMID: 42544109、DOI: 10.7759/cureus.111963、PMCID: PMC13428670、https://europepmc.org/article/MED/42544109）。裏づける部分：候補（CC BY の系統的レビュー）の全文に、SPORT 試験で手術治療が非手術治療より疼痛・身体機能・障害の改善が大きく、利益の多くが長期追跡でも維持されたことが明記される。留保：as-treated 解析と intention-to-treat 解析で結論の強さが異なるというカードの核の区別は候補に再掲がなく、その部分を留保して B。試験登録（ClinicalTrials.gov NCT00000411）は API で確認し結果未掲載（hasResults=false）のため登録では裏づけられない。主出典（SRC-1788）自体は PMC に著者稿（PMC2576513）が収載されるがライセンス表示がなく自由利用ではない。PMCID は補完候補として申し送る。候補は出典マスター未登録のため新規 SRC 登録候補'
  uncertainty: ランダム化コホートでは治療のクロスオーバーが多かった（2年時に手術群の67%、非手術群の43%が手術を受けた）ため、解析方法によって結論の強さが異なる。
