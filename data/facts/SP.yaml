    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ47 2026-11-13）：Rhon DI, Parsons NA, Boeth R, Yuan X. Prevalence of non-spinal pathology and red flag diagnoses associated with care seeking for low back pain in the Military Health System. Sci Rep. 2026;16(1):25587（PMID: 42604939、DOI: 10.1038/s41598-026-51658-w、PMCID: PMC13478311、https://europepmc.org/article/MED/42604939）。裏づける部分：候補（CC BY の大規模コホート研究）の全文に、腰痛で受診した患者で重篤な病態はまれであり（red flag 診断は2.9%）、red flags は非特異的腰痛と全身性・重篤な疾患とを区別するための徴候であることが明記され、病理学的原因が明確な例は少数にとどまるというカードの主張が裏づけられる。数値の照合：候補の 2.9% は red flag 診断の割合であり、カードは割合を示していないため数値の食い違いではない。留保：候補は出典マスター未登録のため新規 SRC 登録候補。主出典（SRC-1790）は Crossref で TDM ライセンスのみ、Europe PMC でもライセンス表示がなく自由利用ではない'
