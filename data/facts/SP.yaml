- id: SP-025
  domain: SP
  subdomain: 脊椎腫瘍・脊髄腫瘍
  assertion:
    plain_statement_ja: 転移性腫瘍による脊髄圧迫に対しては、直接除圧手術に術後放射線治療を組み合わせる治療が放射線治療単独より歩行能力の維持に優れ、治療後に歩行可能であった患者は手術群84%に対して放射線単独群57%であった（無作為化比較試験）。
    condition:
      population: 転移性腫瘍による脊髄圧迫患者
      region: 米国
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1801
    source: 'Patchell RA, Tibbs PA, Regine WF, et al. Direct decompressive surgical resection in the treatment of spinal cord compression caused by metastatic cancer: a randomised trial. Lancet. 2005;366(9486):643-648'
    doi: 10.1016/S0140-6736(05)66954-1
    pmid: '16112300'
    pmcid: null
    url: https://doi.org/10.1016/S0140-6736(05)66954-1
    source_license: Elsevier（The Lancet）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 対象は単一病変による脊髄圧迫で手術適応と判断された患者であり、全ての転移性脊髄圧迫に当てはまるわけではない。転移性腫瘍そのものの総論は扱っていない。
