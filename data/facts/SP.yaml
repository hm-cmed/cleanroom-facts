- id: SP-023
  domain: SP
  subdomain: 強直性脊椎炎
  assertion:
    plain_statement_ja: 体軸性脊椎関節炎の薬物治療では NSAIDs が第一選択であり、2剤以上の NSAIDs で効果が不十分かつ疾患活動性が高い（ASDAS 2.1 以上で、CRP 上昇、MRI での仙腸関節炎、X線での仙腸関節炎のいずれかを伴う）患者では、生物学的製剤（TNF 阻害薬または IL-17 阻害薬）の開始が推奨される（ASAS-EULAR 推奨 2022年改訂版）。
    condition:
      population: 体軸性脊椎関節炎（強直性脊椎炎を含む）患者
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1799
    source: 'Ramiro S, Nikiphorou E, Sepriano A, et al. ASAS-EULAR recommendations for the management of axial spondyloarthritis: 2022 update. Ann Rheum Dis. 2023;82(1):19-34'
    doi: 10.1136/ard-2022-223296
    pmid: '36270658'
    pmcid: null
    url: https://doi.org/10.1136/ard-2022-223296
    source_license: BMJ（Annals of the Rheumatic Diseases）、フリー公開だが CC 表示は未確認
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 薬剤について：TNF 阻害薬・IL-17 阻害薬には強直性脊椎炎に対して国内で承認・保険適用されている薬剤が含まれるが、個別薬剤ごとの最新の承認内容・適用範囲は本作成では未確認である。NSAIDs は国内でも脊椎関節炎の疼痛治療に用いられる一般的薬剤である。
  curriculum:
