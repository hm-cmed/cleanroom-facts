    doi: 10.1056/NEJMoa1307337
    pmid: '24047455'
    pmcid: null
    url: https://doi.org/10.1056/NEJMoa1307337
    source_license: Massachusetts Medical Society（New England Journal of Medicine）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: 自由に使える資料による裏づけ（GOV_US、作り手の調査バッチ47 2026-11-13）：ClinicalTrials.gov. Bracing in Adolescent Idiopathic Scoliosis Trial (BrAIST). NCT00448448（結果レコード）（https://clinicaltrials.gov/study/NCT00448448）。裏づける部分：試験登録の結果レコード（米国政府 ClinicalTrials.gov）に、主要評価項目「Cobb 角50度未満で骨格成熟に至る（治療成功）」の結果が装具群72%・観察群48%と掲載され、オッズ比 1.93（95%CI 1.08〜3.46、p<0.0267）で有意であることが裏づけられる。数値の照合：成功率 72% 対 48% はカードの値と一致。留保：装着時間が長いほど成功率が高いという用量反応の解析は登録レコードに掲載がなく、その部分を留保して B。主出典（SRC-1792）自体は PMC に著者稿（PMC3913566）が収載されるがライセンス表示がなく自由利用ではない。PMCID は補完候補として申し送る。ClinicalTrials.gov の当該レコードは出典マスター未登録のため新規 SRC 登録候補
