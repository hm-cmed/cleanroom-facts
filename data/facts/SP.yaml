- id: SP-003
  domain: SP
  subdomain: 椎間板ヘルニア
  assertion:
    plain_statement_ja: 腰椎椎間板ヘルニアに対する手術は、保存的治療を一定期間行っても改善しない場合に適応となるが、重篤な運動障害や馬尾障害が出現した場合は、重症度と時間的要素を考慮して早期に手術を行うことが望ましい場合がある。
    condition:
      population: 腰椎椎間板ヘルニア患者
      region: 日本
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1781
    source: Haro H, Ebata S, Inoue G, et al. Japanese Orthopaedic Association (JOA) clinical practice guidelines on the management of lumbar disc herniation, third edition - secondary publication. J Orthop Sci. 2022;27(1):31-78
