- id: SP-015
  domain: SP
  subdomain: 側弯症
  assertion:
    plain_statement_ja: 思春期特発性側弯症に対する装具治療は、Cobb 角50°以上への進行（治療失敗）を有意に抑制し、治療成功率は装具群72%に対して観察群48%であり、装着時間が長いほど成功率が高かった（BrAIST 試験）。
    condition:
