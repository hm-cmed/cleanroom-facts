- id: SP-004
  domain: SP
  subdomain: 変形性脊椎症
  assertion:
    plain_statement_ja: 脊椎の変性所見は無症状の者にも高頻度にみられ、加齢とともに増加する。無症状者における椎間板変性の頻度は20歳代の37%から80歳代の96%へ、椎間板膨隆は30%から84%へ増加するため、画像上の変性所見のみをもって症状の原因と判断することはできない。
    condition:
      population: 無症状の成人
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1783
    source: Brinjikji W, Luetmer PH, Comstock B, et al. Systematic literature review of imaging features of spinal degeneration in asymptomatic populations. AJNR Am J Neuroradiol. 2015;36(4):811-816
    doi: 10.3174/ajnr.A4173
    pmid: '25430861'
    pmcid: null
    url: https://doi.org/10.3174/ajnr.A4173
    source_license: AJNR（American Journal of Neuroradiology）、CC 表示なし
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 数値は CT・MRI 所見を対象とした33研究・3,110例の系統的レビューの年齢別推定値。
  curriculum:
    kokushi: 医学各論 Ⅸ-7-A-②（変形性脊椎症、a）
    core_curriculum: 'PS-02-05-05 (id: JkxnuQc)；TBL-01-00-138 (id: JlvnlpU)'
