    pmid: '35618542'
    pmcid: null
    url: https://doi.org/10.1016/j.jos.2022.03.012
    source_license: CC BY-NC-ND 4.0（Journal of Orthopaedic Science）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 同趣旨の位置づけは、国際的な変性性頸髄症ガイドライン（Fehlings ら, Global Spine J. 2017；中等症・重症への手術推奨）および脊柱靱帯骨化症診療ガイドライン2019の要約（中等度・進行性の脊髄症状で手術を検討）でも確認した。
