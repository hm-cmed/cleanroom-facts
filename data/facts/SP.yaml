- id: SP-010
  domain: SP
  subdomain: 脊柱管狭窄症
  assertion:
    plain_statement_ja: 画像で確認されたすべりを伴わない腰部脊柱管狭窄症に対し、除圧手術は SPORT 試験の as-treated 解析で非手術治療より疼痛と身体機能の改善が大きく、その差は3か月時点で有意となり2年時まで維持された。一方、intention-to-treat 解析で有意差があったのは身体の痛みのみであった。
    condition:
      population: 12週間以上症状が持続する腰部脊柱管狭窄症の手術候補患者
      region: 米国
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1788
    source: Weinstein JN, Tosteson TD, Lurie JD, et al. Surgical versus nonsurgical therapy for lumbar spinal stenosis. N Engl J Med. 2008;358(8):794-810
    doi: 10.1056/NEJMoa0707136
    pmid: '18287602'
    pmcid: null
    url: https://doi.org/10.1056/NEJMoa0707136
    source_license: Massachusetts Medical Society（New England Journal of Medicine）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: ランダム化コホートでは治療のクロスオーバーが多かった（2年時に手術群の67%、非手術群の43%が手術を受けた）ため、解析方法によって結論の強さが異なる。
  curriculum:
