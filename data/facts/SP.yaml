  subdomain: 腰痛症
  assertion:
    plain_statement_ja: 腰痛の初期評価では、悪性腫瘍、感染、骨折、馬尾症候群などの重篤な脊椎疾患を示唆する警告徴候（red flags）の有無を確認し、疑われる場合には画像検査を含む精査を行う。
