- id: SP-019
  domain: SP
  subdomain: 脊椎分離症
  assertion:
    plain_statement_ja: 若年アスリートの腰痛では、椎弓の関節突起間部（pars interarticularis）のストレス損傷（疲労骨折）が重要な原因であり、その好発部位は L5 と L4 で、早期に発見することで骨癒合が得られやすく、すべり症への進行を抑えやすい。
