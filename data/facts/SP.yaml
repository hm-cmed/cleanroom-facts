- id: SP-028
  domain: SP
  subdomain: 横断性脊髄炎
  assertion:
    plain_statement_ja: 急性横断性脊髄炎は、脊髄の局所的な炎症により運動、感覚、自律神経の障害を生じる疾患であり、診断の枠組みでは圧迫性病変の検出・除外と、特発性か、多発性硬化症などの基礎疾患に伴う二次性かの区別が重視される。
    condition:
      population: 急性横断性脊髄症を呈する患者
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1804
    source: Transverse Myelitis Consortium Working Group. Proposed diagnostic criteria and nosology of acute transverse myelitis. Neurology. 2002;59(4):499-505
    doi: 10.1212/wnl.59.4.499
    pmid: '12236201'
    pmcid: null
    url: https://doi.org/10.1212/wnl.59.4.499
    source_license: Wolters Kluwer（Neurology）、CC 表示なし
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ47 2026-11-13）：Ji Z, Zhang J, Shi Y, Shan S, Du Y, Li G, Jin Y, Zhang Y, Wang C, Lin Y, Guo Y, Tian D, Zhang P, et al. Spinal Cord Infarction Versus Idiopathic Transverse Myelitis: Clinical, Radiological, and Functional Insights From a Retrospective Cohort. Ann Clin Transl Neurol. 2026;13(7):1388-1397（PMID: 41589644、DOI: 10.1002/acn3.70312、PMCID: PMC13358551、https://europepmc.org/article/MED/41589644）。裏づける部分：候補（CC BY のコホート研究）の全文に、特発性横断性脊髄炎の診断は Transverse Myelitis Consortium Working Group の2002年診断基準に従い、4時間から21日で進展する両側性の脊髄機能障害、体幹の感覚レベル、炎症の証拠（造影増強または髄液所見）を含み、圧迫性脊髄症・自己免疫性・感染性などの他の病因を除外することが明記され、圧迫性病変の除外と特発性か二次性かの区別というカードの枠組みが裏づけられる。留保：疾患の定義文そのもの（局所的炎症による運動・感覚・自律神経障害）は候補では診断基準の運用として述べられるにとどまり、その部分を留保して B。主出典（SRC-1804）は Crossref・Europe PMC のいずれでもライセンス表示がなく自由利用とは確認できない。候補は出典マスター未登録のため新規 SRC 登録候補'
  uncertainty: 出典は2002年の診断基準提案であり、個別の必須項目（髄液所見・増強所見など）の細目は本文に依拠する。多発性硬化症・NMOSD の診断基準そのものは ND 側の領域であり、本カードでは鑑別の枠組みのみを扱った。
