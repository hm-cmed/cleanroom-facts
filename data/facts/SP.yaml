- id: SP-002
  domain: SP
  subdomain: 椎間板ヘルニア
  assertion:
    plain_statement_ja: 保存治療下の腰椎椎間板ヘルニアは自然退縮しうる。系統的レビューでは自然退縮率は遊離型（sequestration）96%、脱出型（extrusion）70%、突出型（protrusion）41%、膨隆型（bulging）13%で、完全消失率は遊離型43%、脱出型15%であった。
    condition:
      population: 保存治療を受けた腰椎椎間板ヘルニア患者
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1782
    source: 'Chiu CC, Chuang TY, Chang KH, et al. The probability of spontaneous regression of lumbar herniated disc: a systematic review. Clin Rehabil. 2015;29(2):184-195'
    doi: 10.1177/0269215514540919
    pmid: '25009200'
    pmcid: null
    url: https://doi.org/10.1177/0269215514540919
    source_license: SAGE（Clinical Rehabilitation）、CC 表示なし
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 画像で2回以上評価された保存治療例の研究を統合した値。国内ガイドライン（SRC-1781）でも、症候性ヘルニアの60%以上の例で画像上の退縮が認められ、遊離型・脱出型は吸収されやすいとされる。
  curriculum:
    kokushi: 医学各論 Ⅸ-7-A-①（椎間板ヘルニア、a）
    core_curriculum: 'PS-02-05-05 (id: JkxnuQc)；TBL-01-00-139 (id: Jlvnlpg)'
