    source: Christ-Crain M, Bichet DG, Fenske WK, et al. Diabetes Insipidus. Nature Reviews Disease Primers. 2019;5(1):54.
    doi: 10.1038/s41572-019-0103-2
    pmid: '31395885'
    pmcid: null
    url: https://doi.org/10.1038/s41572-019-0103-2
    source_license: ライセンス表示を確認できず（Crossref には TDM のライセンスのみ）
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
