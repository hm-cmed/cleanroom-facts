    pmid: '18334580'
    pmcid: PMC2386281
    url: https://doi.org/10.1210/jc.2008-0125
    source_license: CC BY-NC-ND 4.0
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: ガイドラインは2008年版であり、その後の改訂状況は未確認。各検査の感度・特異度の数値は抄録に記載がなく、主張文には含めていない。
