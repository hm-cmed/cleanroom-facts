- id: EN-030
  domain: EN
  subdomain: 褐色細胞腫の診断
  assertion:
    plain_statement_ja: 褐色細胞腫・傍神経節腫の最初の生化学検査には、血漿遊離メタネフリンまたは尿中分画メタネフリンの測定を含める。偽陽性・偽陰性を招く検査前の因子に注意し、陽性結果には必ず追跡評価を行う。画像検査はまずCTを行い、転移性疾患のある患者や放射線被曝を避けたい患者ではMRIが適する。転移性病変の評価には123I-MIBGシンチグラフィが有用である。遺伝子検査は全例で考慮し、傍神経節腫ではSDHx遺伝子、転移性疾患ではSDHB遺伝子の変異を調べる。
