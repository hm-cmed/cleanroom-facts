    doi: 10.1038/nrdp.2016.78
    pmid: '27830764'
    pmcid: null
    url: https://doi.org/10.1038/nrdp.2016.78
    source_license: ライセンス表示を確認できず
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
