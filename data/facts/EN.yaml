- id: EN-039
  domain: EN
  subdomain: ホルモン受容体異常症
  assertion:
    plain_statement_ja: ホルモン受容体異常症は、ホルモンの受容体やその後の細胞内シグナル伝達の異常により、ホルモンが分泌されているにもかかわらず作用が発揮されない「ホルモン抵抗性」を呈する疾患群である。代表例である偽性副甲状腺機能低下症とその関連疾患は、副甲状腺ホルモン（PTH）やTSHへの抵抗性に加え、短骨、短身長、がっしりした体格、早期発症の肥満、異所性骨化などを特徴とする。診断は、PTH抵抗性、異所性骨化、短指症、早期発症の肥満といった主要基準に基づいて行い、分子遺伝学的解析で確定する。初回の国際コンセンサス声明（2018年）では、診断時と経過観察中に、PTH・TSH抵抗性、成長ホルモン欠乏、性腺機能低下、骨格変形、体重増加、耐糖能異常、高血圧、皮下や深部の異所性骨化、神経認知面の問題について系統的に評価し、乳幼児期から成人まで多職種で継続的に管理することが示されている。
    condition:
      region: 国際
      study: 偽性副甲状腺機能低下症と関連疾患の国際コンセンサス声明（2018年）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-900
    source: 'Mantovani G, Bastepe M, Monk D, et al. Diagnosis and management of pseudohypoparathyroidism and related disorders: first international Consensus Statement. Nat Rev Endocrinol. 2018;14(8):476-500.'
    doi: 10.1038/s41574-018-0042-0
    pmid: '29959430'
    pmcid: PMC6541219
    url: https://doi.org/10.1038/s41574-018-0042-0
    source_license: CC BY 4.0
    legal_basis: B
    source_class: OPEN
    corroboration: null
  uncertainty: 割当出典は偽性副甲状腺機能低下症のコンセンサス声明であり、甲状腺ホルモン不応症、アンドロゲン不応症、腎性尿崩症（バソプレシン抵抗性）など他の受容体異常症の個別の内容はこの出典では確認していない。GNAS遺伝子異常の型別の頻度などの数値も未確認で、主張文には含めていない。
