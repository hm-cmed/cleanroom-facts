- id: EN-029
  domain: EN
  subdomain: 副腎皮質癌
  assertion:
    plain_statement_ja: 副腎皮質癌はまれで、多くの場合ステロイドホルモンを産生する腫瘍であり、予後はさまざまである。疑い例と確定例はすべて多職種の専門家チームで協議し、自律性ホルモン過剰の評価を含む内分泌学的評価と副腎に焦点を当てた画像評価を行う。手術は完全な一括切除（en bloc切除）を目標とし、病理診断では専門家がWeissスコアとKi67指数を評価する。根治切除後も再発リスクが高い患者（ENSAT病期III、R1切除、Ki67が10%を超える場合）にはミトタンによる術後補助療法が提案される。完全切除ができない進行例では、局所治療が有用な場合があり、全身療法としてミトタン単独療法、またはミトタンにエトポシド、ドキソルビシン、シスプラチンを併用する治療が推奨される。
