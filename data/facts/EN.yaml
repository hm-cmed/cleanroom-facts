- id: EN-040
  domain: EN
  subdomain: 副腎不全の維持療法と患者教育
  assertion:
    plain_statement_ja: 原発性副腎不全の維持療法では、成人の糖質コルチコイド補充としてヒドロコルチゾン15〜25 mg/日（またはコルチゾン酢酸エステル20〜35 mg/日）を1日2〜3回に分けて投与し、最も多い用量を朝の覚醒時に配分する。代替としてプレドニゾロン3〜5 mg/日の1日1〜2回投与もありうるが、デキサメタゾンは用量調整が難しく過剰投与によるCushing様副作用のリスクがあるため避ける。鉱質コルチコイド補充にはフルドロコルチゾンを用い、開始量は成人で50〜100 μg/日（中央値0.1 mg/日）とし、食塩摂取は制限しない。補充量の調整はホルモン値ではなく、体重、体位性血圧、活力、過剰投与の徴候や、塩分欲求、起立性低血圧、浮腫、電解質といった臨床評価に基づいて行う。すべての患者に、発熱や手術などのストレス時の増量（ストレスドーズ）の教育を行い、ステロイドカードと緊急用の非経口糖質コルチコイド製剤を携行させる。経過観察では自己免疫性甲状腺疾患をはじめとする合併する自己免疫疾患のモニタリングも行う。
    condition:
      region: 国際
      study: Endocrine Society 診療ガイドライン（2016年）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-889
    source: 'Bornstein SR, Allolio B, Arlt W, Barthel A, Don-Wauchope A, Hammer GD, Husebye ES, Merke DP, Murad MH, Stratakis CA, Torpy DJ. Diagnosis and Treatment of Primary Adrenal Insufficiency: An Endocrine Society Clinical Practice Guideline. J Clin Endocrinol Metab. 2016;101(2):364-389.'
    doi: 10.1210/jc.2015-1710
    pmid: '26760044'
    pmcid: PMC4880116
    url: https://doi.org/10.1210/jc.2015-1710
    source_license: 学会ガイドライン（CC 表示を確認できず）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 数値は PMC 本文の推奨事項の要約で確認した（表から読み取った値ではない）。ヒドロコルチゾン、フルドロコルチゾン、プレドニゾロンなどの国内承認・保険適用（副腎不全への適応と製剤の規格を含む）の確認は本調査では行っていない。ストレスドーズの具体的な増量幅は本文の該当節を本調査では確認していないため、主張文には含めていない。
