- id: EN-014
  domain: EN
  subdomain: 下垂体前葉機能低下症
  assertion:
    plain_statement_ja: 下垂体前葉機能低下症は、前葉ホルモンの1つ以上の欠落による症候群で、成人では下垂体腺腫そのもの、あるいはその手術・放射線治療が最も多い原因である。過剰な死亡と関連し、特に ACTH 欠落によるコルチゾール欠乏が重要な危険因子である。診断では、TSH、ゴナドトロピン、プロラクチンの欠落は基礎値の測定で評価できる一方、ACTH、GH、ADH の欠落の評価には通常、刺激試験が必要である。緩徐に進行する型もあるため、定期的な下垂体機能の再評価が求められる。
