- id: EN-034
  domain: EN
  subdomain: 多発性内分泌腫瘍症1型
  assertion:
    plain_statement_ja: 多発性内分泌腫瘍症1型（MEN1）は、腫瘍抑制遺伝子MEN1の変異による常染色体優性遺伝の疾患で、副甲状腺腫瘍、膵島腫瘍、下垂体前葉腫瘍の3つを主徴とする。ほかにカルチノイド、副腎皮質腫瘍、髄膜腫、顔面血管線維腫、コラーゲノーマ、脂肪腫などを伴うことがある。患者の一親等は発症リスクが50%であり、MEN1遺伝子の変異解析で同定できることが多いため、患者と家族は内分泌腫瘍の診療経験のある多職種チームで管理する。腫瘍が多発し大きく攻撃的になりやすいため、非MEN1の同種腫瘍と同じ治療でも成績は劣り、発症前からの腫瘍検出が予後改善につながるとされる。
    condition:
      region: 国際
      study: Endocrine Society 診療ガイドライン（2012年）
