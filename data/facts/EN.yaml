- id: EN-006
  domain: EN
  subdomain: 先端巨大症
  assertion:
    plain_statement_ja: 先端巨大症の治療の第一選択は、経蝶形骨洞アプローチによる腫瘍の外科的切除である。手術で生化学的コントロールが得られない場合などには薬物療法が行われ、ソマトスタチンアナログ、GH 受容体拮抗薬（ペグビソマント）、ドパミン作動薬（カベルゴリン）が単独または併用で用いられる。放射線治療は、手術・薬物療法で不十分な場合の選択肢である。治療は腫瘍の大きさや浸潤、合併症に応じて個別化される。
    condition:
      region: 米国
      study: ガイドライン（Endocrine Society、2014年版）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-875
    source: 'Katznelson L, Laws ER Jr, Melmed S, et al. Acromegaly: An Endocrine Society Clinical Practice Guideline. The Journal of Clinical Endocrinology & Metabolism. 2014;99(11):3933-3951.'
    doi: 10.1210/jc.2014-2700
    pmid: '25356808'
    pmcid: null
    url: https://doi.org/10.1210/jc.2014-2700
    source_license: ライセンス表示を確認できず
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 治療アルゴリズムの骨格はガイドラインに基づく。ソマトスタチンアナログ、ペグビソマント、カベルゴリンなど個別薬剤の国内承認・保険適用（先端巨大症への適応の有無を含む）は未確認である。各薬剤の有効率などの数値は抄録で確認していないため主張文には入れていない。
