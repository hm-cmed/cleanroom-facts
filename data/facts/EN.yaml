    url: https://doi.org/10.1093/ejendo/lvad066
    source_license: CC BY 4.0
    legal_basis: B
    source_class: OPEN
    corroboration: null
  uncertainty: 数値は抄録の推奨事項の要約で確認した（表から読み取った値ではない）。手術適応は多職種の専門家会議での協議が前提とされており、日本の診療体制での運用との差異は未確認。
