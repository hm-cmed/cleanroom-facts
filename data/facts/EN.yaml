- id: EN-038
  domain: EN
  subdomain: 異所性ホルモン産生腫瘍
  assertion:
    plain_statement_ja: 内分泌腫瘍随伴症候群は、腫瘍が本来の産生部位とは異なるホルモンやホルモン様物質を分泌して生じる病態で、異所性ACTH分泌によるCushing症候群がその代表である。神経内分泌腫瘍834例を対象とした後方視的解析では、内分泌腫瘍随伴症候群は21例に認められ、その内訳は異所性Cushing症候群が16例と最も多く、PTHrP分泌による高カルシウム血症などがこれに次いだ。対象となった腫瘍はいずれも高分化型で、ギリシャのコホートにおける有病率は1.9%、肺カルチノイドの患者では異所性Cushing症候群の合併が6.7%にみられた。原因不明の高コルチコール血症などでは、原因として異所性ホルモン産生腫瘍を鑑別に挙げる必要がある。
    condition:
      region: 欧州
      study: 神経内分泌腫瘍834例の後方視的コホート研究（ギリシャ・スウェーデン、2019年）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-899
    source: Dimitriadis GK, et al. Endocrine paraneoplastic syndromes in patients with neuroendocrine neoplasms. Endocrine. 2019;64(2):384-392.
    doi: 10.1007/s12020-018-1773-3
    pmid: '30280284'
    pmcid: PMC6531606
    url: https://doi.org/10.1007/s12020-018-1773-3
    source_license: CC BY 4.0
    legal_basis: B
    source_class: OPEN
    corroboration: null
  uncertainty: 数値は抄録で確認したが、単一の後方視的コホート研究（神経内分泌腫瘍に限った集団）の値であり、腫瘍全体における異所性ホルモン産生の頻度をそのまま表すものではない。SIADH（異所性ADH産生）など、この研究の対象に含まれなかった病態の頻度は未確認。
