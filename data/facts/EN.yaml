    plain_statement_ja: プロラクチノーマの治療はドパミン作動薬が中心で、プロラクチン値の正常化と腫瘍の縮小が得られる。薬剤性高プロラクチン血症では、原因薬剤の中止や変更が可能かを検討する。治療薬の選択では有効性と副作用（悪心などの消化器症状、起立性低血圧など）を考慮し、妊娠を希望する場合や妊娠中の管理は別途ガイドラインで扱われる。ドパミン作動薬で効果不十分な場合や副作用で継続できない場合は、手術などが検討される。
