    doi: 10.1210/jc.2014-2700
    pmid: '25356808'
    pmcid: null
    url: https://doi.org/10.1210/jc.2014-2700
    source_license: ライセンス表示を確認できず
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 診断の進め方の骨格はガイドラインの推奨に沿ったが、GH の抑制基準などの具体的なカットオフ値は抄録では確認しておらず、本文の数値をそのまま転記はしていない。日本の難病指定における診断基準との差異は未確認である。
