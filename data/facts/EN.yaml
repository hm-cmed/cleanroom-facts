- id: EN-032
  domain: EN
  subdomain: 神経芽腫
  assertion:
    plain_statement_ja: 神経芽腫は小児で最も多い頭蓋外固形腫瘍で、発症年齢が低く、診断時に転移を伴うことが多く、乳児期の腫瘍には自然退縮の傾向があることが特徴である。予後を左右する生物学的因子としてMYCN遺伝子の増幅が重要で、増幅がある腫瘍は局在性であっても生存率が低い。まれな家族性神経芽腫はALK遺伝子の生殖細胞系列変異と関連し、ALK変異は原発腫瘍の10〜15%にもみられ、治療標的となりうる。治療はリスク分類に基づいて行われ、高リスク群では強力な導入化学療法と大量化学療法に分化療法や免疫療法を組み合わせることで、5年全生存率は50%まで改善した。
    condition:
      region: 国際
      study: 疾患総説（Nature Reviews Disease Primers、2016年）
    differential: null
    common_misconception: null
  provenance:
