- id: EN-037
  domain: EN
  subdomain: 消化管神経内分泌腫瘍
  assertion:
    plain_statement_ja: 消化管神経内分泌腫瘍は、消化管に発生する神経内分泌腫瘍（NEN）で、膵を含む消化器系はNENの好発部位の一つである。NENは高分化型の神経内分泌腫瘍（NET）と低分化型の神経内分泌癌（NEC）に大別され、見た目が低悪性度の腫瘍でも高悪性度に近い経過をとるものがあるため、この組織学的な区別は治療と予後の判断に重要である。ホルモンを分泌する機能性腫瘍では分泌されるホルモンに応じた症候が現れ、病期、病理所見、増殖能を踏まえて治療が組み立てられる。
    condition:
      region: 国際
      study: 神経内分泌腫瘍の総説（2017年）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-898
    source: 'Oronsky B, Ma PC, Morgensztern D, Carter CA. Nothing But NET: A Review of Neuroendocrine Tumors and Carcinomas. Neoplasia. 2017;19(12):991-1002.'
    doi: 10.1016/j.neo.2017.09.002
    pmid: '29091800'
    pmcid: PMC5678742
    url: https://doi.org/10.1016/j.neo.2017.09.002
    source_license: CC BY-NC-ND 4.0
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 割当出典はNEN全般の総説であり、消化管NETに特化した発生部位別の頻度、カルチノイド症候群の発症率、Ki67によるグレード分類の閾値などの数値は抄録では確認しておらず、主張文には含めていない。個別治療薬の国内承認・保険適用も未確認。
