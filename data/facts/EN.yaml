- id: EN-020
  domain: EN
  subdomain: 下垂体卒中
  assertion:
    plain_statement_ja: 下垂体卒中は、下垂体の出血または梗塞によって突然の頭痛、嘔吐、視力・視野障害、意識レベルの低下を来す臨床症候群であり、内科的緊急症である。副腎不全を伴うことが多く、ヒドロコルチゾンの迅速な補充が救命的となりうる。診断後は脳神経外科と内分泌科を含む集学的チームで管理し、神経症状が悪化する患者では手術が適応となるが、それ以外では保存的管理と外科的管理のどちらが優れるかは確立していない。回復後も腫瘍の再増大に対する監視と下垂体機能の評価が必要である。
