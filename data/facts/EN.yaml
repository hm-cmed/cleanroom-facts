- id: EN-007
  domain: EN
  subdomain: ADH不適合分泌症候群
  assertion:
    plain_statement_ja: ADH 不適合分泌症候群（SIADH）は、低浸透圧性の低ナトリウム血症（血清ナトリウム135 mmol/L未満）の原因の1つで、バソプレシンの不適切な分泌により腎臓で水が保持されて生じる。診断では、体液量が臨床的に正常（溢水でも脱水でもない）であること、低浸透圧に対して尿が不適切に濃縮され尿中ナトリウム排泄が保たれていることを確認し、甲状腺機能低下症、副腎機能低下症、利尿薬の使用など他の原因を除外する。低ナトリウム血症は最も頻度の高い電解質異常であり、SIADH の背景には腫瘍、肺疾患、中枢神経疾患、薬剤など多様な原因がある。
    condition:
      region: 欧州
      study: ガイドライン（欧州の3学会による低ナトリウム血症ガイドライン、2014年版）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-655
    source: Spasovski G, Vanholder R, Allolio B, et al. Clinical practice guideline on diagnosis and treatment of hyponatraemia. Eur J Endocrinol. 2014;170(3):G1–G47
    doi: 10.1530/EJE-13-1020
    pmid: '24569125'
    pmcid: null
    url: null
    source_license: null
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 低ナトリウム血症の定義（135 mmol/L未満）は抄録で確認した。SIADH の診断基準の各項目（尿浸透圧・尿中ナトリウムの具体的な閾値）はガイドライン本文の基準に沿ったもので、抄録では数値を確認していない。第16回 KF で扱った電解質異常としての低ナトリウム血症との重なりは、取り込み側で調整されたい。
