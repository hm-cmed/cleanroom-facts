- id: EN-036
  domain: EN
  subdomain: 膵神経内分泌腫瘍
  assertion:
    plain_statement_ja: 膵神経内分泌腫瘍は、神経内分泌腫瘍（NEN）の一型である。NENは全悪性腫瘍の約2%を占めるまれで多様な腫瘍群で、臨床経過、組織像、増殖能に基づいて、高分化型の神経内分泌腫瘍（NET）と低分化型の神経内分泌癌（NEC）に大別され、この区別は治療方針と予後を大きく左右する。膵NETには、過剰に分泌されるホルモンによる症候を呈する機能性腫瘍（インスリノーマ、ガストリノーマなど）と、ホルモン症候を呈さない非機能性腫瘍がある。また膵島腫瘍は多発性内分泌腫瘍症1型（MEN1）の主徴の一つであり、遺伝性疾患に合併する膵NETでは、その背景を踏まえた評価が必要である。
    condition:
      region: 国際
      study: 神経内分泌腫瘍の総説（2017年）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-898
    source: 'Oronsky B, Ma PC, Morgensztern D, Carter CA. Nothing But NET: A Review of Neuroendocrine Tumors and Carcinomas. Neoplasia. 2017;19(12):991-1002.'
    doi: 10.1016/j.neo.2017.09.002
    pmid: '29091800'
    pmcid: PMC5678742
    url: https://doi.org/10.1016/j.neo.2017.09.002
    source_license: CC BY-NC-ND 4.0
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 「全悪性腫瘍の約2%」は抄録に引用された先行報告に基づく値で、米国の有病者数（200,000人未満）も同抄録の記載による。MEN1の主徴としての膵島腫瘍の位置づけは EN-034 の出典（SRC-896）で確認した内容であり、本カードの出典はNEN全般の総説である。膵NETの個別の治療薬（ソマトスタチンアナログなど）の有効性の数値と国内承認・保険適用は未確認で、主張文には含めていない。
