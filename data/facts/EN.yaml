- id: EN-005
  domain: EN
  subdomain: 先端巨大症
  assertion:
    plain_statement_ja: 先端巨大症は、成長ホルモン（GH）産生下垂体腫瘍による GH・IGF-1 の過剰が、手足や顔貌の変化に加え、心血管・代謝・呼吸器などの全身合併症をもたらす疾患である。診断は、臨床所見から疑ったうえで、IGF-1 の高値と、経口ブドウ糖負荷試験で GH が十分に抑制されないことを生化学的に確認し、MRI で下垂体腫瘍を評価して行う。あわせて、合併症の評価と、治療後の生化学的コントロールの判定基準に基づく経過観察が必要である。
    condition:
      region: 米国
      study: ガイドライン（Endocrine Society、2014年版）
    differential: null
    common_misconception: null
  provenance:
