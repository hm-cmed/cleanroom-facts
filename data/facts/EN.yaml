- id: EN-008
  domain: EN
  subdomain: ADH不適合分泌症候群
  assertion:
    plain_statement_ja: SIADH の治療は、原因（腫瘍、薬剤、肺・中枢神経疾患など）への対応と、水分摂取の制限が基本である。重症の症状を伴う低ナトリウム血症では高張食塩水の投与が行われる。血清ナトリウムの補正は速くしすぎると浸透圧性脱髄症候群の危険があるため、補正速度に上限を設けて慎重に行う。欧州のガイドラインでは、バソプレシン受容体拮抗薬は補正の速さの調整が難しいことなどから、SIADH への使用は推奨されていない。
    condition:
      region: 欧州
      study: ガイドライン（欧州の3学会による低ナトリウム血症ガイドライン、2014年版）
    differential: null
    common_misconception: null
  provenance:
