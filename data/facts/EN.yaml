- id: EN-001
  domain: EN
  subdomain: 中枢性摂食異常症
  assertion:
    plain_statement_ja: 視床下部の主要な核の発生異常や損傷によってエネルギー摂取と消費の調節が崩れると、過食とエネルギー消費の低下を背景に、急速で過度の体重増加（視床下部性肥満）を来す。鞍上部腫瘍の中では頭蓋咽頭腫が後天性視床下部性肥満の最も多い原因で、腫瘍そのものだけでなく手術や放射線治療によっても生じる。下垂体ホルモンの補充の最適化、食事制限、身体活動、行動療法、薬物療法、肥満外科手術が試みられるが、効果は限定的でばらつきが大きく、確立した治療法はない。
    condition:
      region: 国際
      study: 総説（後天性視床下部性肥満の治療、2022年）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-871
    source: 'Dimitri P. Treatment of Acquired Hypothalamic Obesity: Now and the Future. Frontiers in Endocrinology. 2022;13:846880.'
    doi: 10.3389/fendo.2022.846880
    pmid: '35464063'
    pmcid: PMC9019363
    url: https://doi.org/10.3389/fendo.2022.846880
    source_license: CC BY 4.0（Crossref のライセンス情報）
    legal_basis: B
    source_class: OPEN
    corroboration: null
  uncertainty: 出典は小児・若年者を中心とした総説であり、成人での頻度や治療成績の数値は確認していない。薬物療法の個別の薬剤（オクトレオチド、糖尿病治療薬など）の国内承認・保険適用（視床下部性肥満への適応の有無を含む）は未確認である。
