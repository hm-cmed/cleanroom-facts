    pmid: '29562364'
    pmcid: null
    url: https://doi.org/10.1210/jc.2018-00229
    source_license: 学会ガイドライン（CC 表示を確認できず）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 割当出典は男性のテストステロン療法に関するガイドラインで、診断の原則はそこから確認した。Turner症候群をはじめとする女性の原発性性腺機能低下症や、Klinefelter症候群の頻度・表現型の数値はこの出典では確認しておらず、主張文には含めていない。テストステロン製剤の国内承認・保険適用の確認は本調査では行っていない。
