- id: EN-025
  domain: EN
  subdomain: 慢性副腎不全（Addison病）
  assertion:
    plain_statement_ja: 原発性副腎不全は、示唆する症状・徴候（体重減少、疲労、低血圧、低ナトリウム血症、高カリウム血症、色素沈着など）がある患者で積極的に検査を行って診断する。確定診断の標準は迅速コルチコトロピン（ACTH）刺激試験（250 μg）で、刺激後30分または60分の血中コルチコールのピークが500 nmol/L（18 μg/dL）未満であれば副腎不全を示す。実施できない場合は朝の血漿ACTHとコルチコールの測定で代用し、朝のコルチコール140 nmol/L（5 μg/dL）未満とACTH高値の組み合わせが副腎不全を示唆する。原因検索には21-水酸化酵素自己抗体の測定を含め、レニンとアルドステロンを同時に測定して鉱質コルチコイド欠乏の有無を判断する。
    condition:
      region: 国際
      study: Endocrine Society 診療ガイドライン（2016年）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-889
    source: 'Bornstein SR, Allolio B, Arlt W, Barthel A, Don-Wauchope A, Hammer GD, Husebye ES, Merke DP, Murad MH, Stratakis CA, Torpy DJ. Diagnosis and Treatment of Primary Adrenal Insufficiency: An Endocrine Society Clinical Practice Guideline. J Clin Endocrinol Metab. 2016;101(2):364-389.'
    doi: 10.1210/jc.2015-1710
    pmid: '26760044'
    pmcid: PMC4880116
    url: https://doi.org/10.1210/jc.2015-1710
    source_license: 学会ガイドライン（CC 表示を確認できず）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 数値は PMC 本文の推奨事項の要約で確認した（本文の表から読み取った値ではない）。コルチコールの閾値は測定法に依存すると本文に明記されている。ヒドロコルチゾンやフルドロコルチゾンなどの補充薬の国内承認・保険適用の確認は本調査では行っていない。
