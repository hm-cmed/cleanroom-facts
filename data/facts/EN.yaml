- id: EN-012
  domain: EN
  subdomain: 高プロラクチン血症
  assertion:
    plain_statement_ja: 高プロラクチン血症の原因は、プロラクチノーマのほか、ドパミン拮抗作用を持つ薬剤による薬剤性、下垂体茎の圧迫による茎効果（stalk effect）、甲状腺機能低下症など多様である。診断では、まず静脈血のプロラクチン値を測定し、薬剤歴の確認、妊娠の除外、甲状腺機能の評価など原因の検索を行う。プロラクチノーマでは腫瘍の大きさに応じて乳汁漏出、無月経、性腺機能低下などを呈する。腫瘍効果による軽度の上昇とプロラクチノーマによる上昇とを区別することが、治療方針の決定に重要である。
    condition:
      region: 米国
      study: ガイドライン（Endocrine Society、2011年版）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-828
    source: 'Melmed S, Casanueva FF, Hoffman AR, et al. Diagnosis and Treatment of Hyperprolactinemia: An Endocrine Society Clinical Practice Guideline. The Journal of Clinical Endocrinology & Metabolism. 2011;96(2):273-288.'
    doi: 10.1210/jc.2010-1692
    pmid: '21296991'
    pmcid: null
    url: https://doi.org/10.1210/jc.2010-1692
    source_license: ライセンス表示を確認できず
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 原因の評価の進め方はガイドラインの対象範囲に基づく。プロラクチン値の具体的な解釈基準（茎効果でみられる上昇の上限など）は抄録で確認していないため、数値は主張文に入れていない。第19回 RP-025（排卵障害としての高プロラクチン血症）とは、下垂体疾患としての評価に絞ることで重なりを避けた。
