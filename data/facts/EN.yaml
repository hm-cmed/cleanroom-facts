- id: EN-016
  domain: EN
  subdomain: 中枢性尿崩症
  assertion:
    plain_statement_ja: 中枢性尿崩症は、視床下部・下垂体後葉系の障害によるバソプレシン（AVP）の欠乏で、大量の低張尿を排泄する疾患である。腎臓側の AVP 抵抗性による腎性尿崩症と、AVP の分泌・作用が正常なのに大量に飲水する原発性多飲症との鑑別が診断の中心になる。鑑別には、水制限試験、または高張食塩水負荷とコペプチン（AVP の代替マーカー）の測定が用いられ、あわせて病歴、身体所見、画像検査で原因を検索する。
    condition:
      region: 国際
      study: 総説（Nature Reviews Disease Primers、2019年）
    differential: null
    common_misconception: null
  provenance:
