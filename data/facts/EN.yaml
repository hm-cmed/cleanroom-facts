- id: EN-033
  domain: EN
  subdomain: 原発性性腺機能低下症
  assertion:
    plain_statement_ja: 男性の性腺機能低下症の診断は、テストステロン欠乏に一致する症状・徴候があり、信頼できる測定法で測定した早朝空腹時の血中総テストステロンが一貫して明らかに低い場合にのみ行い、別の日の早朝の測定で確認する。総テストステロンが基準下限付近の場合や、性ホルモン結合グロブリンに影響する病態がある場合は、遊離テストステロンを測定する。アンドロゲン欠乏と診断したら、原因を明らかにするための追加評価を行い、精巣自体の障害による原発性（高ゴナドトロピン性）か、視床下部・下垂体の障害による中枢性かを区別する。原発性の代表であるKlinefelter症候群などでは、病因に応じた管理と長期の経過観察が必要である。
    condition:
      region: 国際
      study: Endocrine Society 診療ガイドライン（2018年、男性のテストステロン療法）
    differential: null
    common_misconception: null
  provenance:
