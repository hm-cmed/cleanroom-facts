- id: EN-021
  domain: EN
  subdomain: Cushing症候群の診断
  assertion:
    plain_statement_ja: Cushing症候群の検査は、まず外因性糖質コルチコイドの使用を除外したうえで、複数の進行性の特徴（とくに鑑別価値の高い所見）を呈する患者や副腎偶発腫の患者などを対象に行う。初回検査は、24時間尿中遊離コルチコール、深夜唾液中コルチコール、1 mg一晩デキサメタゾン抑制試験、2 mg 48時間デキサメタゾン抑制試験のうち、診断精度の高いいずれか1つを用いる。異常があれば別の検査を追加し、結果が一致して異常であれば原因の検索に進み、一致して正常であればそれ以上の評価は行わない。
    condition:
      region: 国際
      study: Endocrine Society 診療ガイドライン（2008年）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-886
    source: 'Nieman LK, Biller BMK, Findling JW, Newell-Price J, Savage MO, Stewart PM, Montori VM. The Diagnosis of Cushing''s Syndrome: An Endocrine Society Clinical Practice Guideline. J Clin Endocrinol Metab. 2008;93(5):1526-1540.'
