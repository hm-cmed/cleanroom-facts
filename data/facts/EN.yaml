- id: EN-003
  domain: EN
  subdomain: 低ゴナドトロピン性性腺機能低下症
  assertion:
    plain_statement_ja: 先天性低ゴナドトロピン性性腺機能低下症は、GnRH の産生・分泌・作用の欠損によって思春期発来の欠如と不妊を呈するまれな疾患で、原因遺伝子は25種類以上が同定されている。嗅覚の障害（無嗅覚症・嗅覚低下）を伴うものが Kallmann 症候群で、全体の約50%を占める。体質性の思春期遅発との鑑別が難しいことがある。専門的な治療で思春期の誘導と妊孕性の獲得が可能な場合が多い一方、約10〜20%の患者では生殖機能の自然回復がみられるため、長期の経過観察が必要である。
    condition:
      region: 欧州
      study: コンセンサス声明（European Consensus Statement、2015年）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-873
    source: 'Boehm U, Bouloux PM, Dattani MT, et al. Expert Consensus Document: European Consensus Statement on Congenital Hypogonadotropic Hypogonadism—Pathogenesis, Diagnosis and Treatment. Nature Reviews Endocrinology. 2015;11(9):547-564.'
    doi: 10.1038/nrendo.2015.112
    pmid: '26194704'
    pmcid: null
    url: https://doi.org/10.1038/nrendo.2015.112
    source_license: CC BY-NC-SA 4.0（Crossref のライセンス情報）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 数値（原因遺伝子25種類以上、嗅覚障害約50%、自然回復約10〜20%）は出典の抄録で確認した。個別の遺伝子の頻度や、日本における遺伝子診断の実施体制は未確認である。治療に用いるゴナドトロピン製剤などの国内承認・保険適用は未確認である。
  curriculum:
    core_curriculum: 'PS-02-14-05 (id: JkxnuTA)'
