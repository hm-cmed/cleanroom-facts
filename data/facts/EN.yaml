- id: EN-026
  domain: EN
  subdomain: 急性副腎不全（副腎クリーゼ）
  assertion:
    plain_statement_ja: 急性副腎不全（副腎クリーゼ）は、循環不全や低血圧、電解質異常などを呈する急性期の患者で常に鑑別に入れるべき病態で、ガイドラインは重症の副腎不全症状や副腎クリーゼが疑われる患者では、診断検査の結果を待たずに、適切なストレスドーズのヒドロコルチゾン静注による治療を直ちに開始することを推奨している。急性期の患者や素因のある患者では、診断と治療のいずれについても閾値を低く保つことが求められる。
    condition:
      region: 国際
      study: Endocrine Society 診療ガイドライン（2016年）
    differential: null
    common_misconception: null
