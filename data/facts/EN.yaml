- id: EN-011
  domain: EN
  subdomain: Cushing病
  assertion:
    plain_statement_ja: Cushing 病は、ACTH 産生下垂体腺腫によってコルチゾール過剰（Cushing 症候群）を来す疾患である。治療の目標は、コルチゾールの値または作用を正常化し、死亡率の低減と合併症（高血圧、糖尿病など）の改善を図ることである。第一選択は原因病変の外科的切除、すなわち下垂体腺腫の摘出である。手術で寛解しない場合の第二選択には、薬物療法、放射線治療、両側副腎摘除術があり、患者ごとに個別化して選択する。
    condition:
      region: 米国
      study: ガイドライン（Endocrine Society、Cushing 症候群の治療、2015年版）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-878
    source: 'Nieman LK, Biller BMK, Findling JW, et al. Treatment of Cushing''s Syndrome: An Endocrine Society Clinical Practice Guideline. The Journal of Clinical Endocrinology & Metabolism. 2015;100(8):2807-2831.'
    doi: 10.1210/jc.2015-1818
    pmid: '26222757'
    pmcid: PMC4525003
    url: https://doi.org/10.1210/jc.2015-1818
    source_license: ライセンス表示を確認できず
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 治療の位置づけはガイドライン抄録の結論で確認した。薬物療法の個別薬剤（ケトコナゾール、パシレオチド、ミフェプリストンなど）の国内承認・保険適用（Cushing 病への適応の有無を含む）は未確認である。Cushing 病と異所性 ACTH 症候群の鑑別（下垂静脈洞サンプリングを含む）の詳細は EN-009 の範囲と重なるため、ここでは治療の骨格に絞った。
