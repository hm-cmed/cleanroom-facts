- id: EN-019
  domain: EN
  subdomain: 成長ホルモン分泌不全症
  assertion:
    plain_statement_ja: 成人の成長ホルモン分泌不全症（GHD）は、小児期からの持続例と成人期の新規発症例がある。診断には通常、GH 刺激試験による分泌低下の確認が必要である（小児期から持続する遺伝的・構造的病変が証明されている場合を除く）。GH 補充療法は、体組成、運動能力、骨の健全性、生活の質の各指標を改善し、効果は GHD が重症な患者で大きい。治療のリスクは低く、投与量は個別化されるべきである。
    condition:
      region: 米国
      study: ガイドライン（Endocrine Society、成人 GHD、2011年版）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-883
    source: 'Molitch ME, Clemmons DR, Malozowski S, et al. Evaluation and Treatment of Adult Growth Hormone Deficiency: An Endocrine Society Clinical Practice Guideline. The Journal of Clinical Endocrinology & Metabolism. 2011;96(6):1587-1609.'
    doi: 10.1210/jc.2011-0179
    pmid: '21602453'
    pmcid: null
    url: https://doi.org/10.1210/jc.2011-0179
    source_license: ライセンス表示を確認できず
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 診断と治療の骨格はガイドライン抄録の結論で確認した。刺激試験の種類やカットオフ値、GH 製剤の用量設定は抄録の範囲を超えるため入れていない。成長ホルモン製剤の国内承認・保険適用（成人 GHD への適応を含む）は未確認である。小児の低身長としての GHD（Ⅹ-10-A-①）は第22回 IE の範囲であり、ここでは成人に絞った。
