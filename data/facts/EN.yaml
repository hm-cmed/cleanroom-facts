- id: EN-004
  domain: EN
  subdomain: 視床下部腫瘍
  assertion:
    plain_statement_ja: 頭蓋咽頭腫は組織学的には良性のまれな腫瘍で、エナメル上皮腫型と乳頭型の2型がある。エナメル上皮腫型は CTNNB1 遺伝子変異を背景とし、5〜15歳と45〜60歳の二峰性の分布で、主に嚢胞性である。乳頭型は BRAF V600E 変異を伴うことが多く、成人（主に50〜60代）に限られ、主に充実性である。頭蓋内圧亢進症状、視覚障害、内分泌機能低下が診断のきっかけとなり、画像検査は MRI が優先される。治療は神経外科手術と放射線治療が中心で、長期生存率は高い一方、視交叉・視床下部・下垂体に近接するため、視床下部性肥満をはじめとする生活の質の障害がしばしば残る。
    condition:
      region: 国際
      study: 総説（Nature Reviews Disease Primers、2019年）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-874
    source: Müller HL, Merchant TE, Warmuth-Metz M, Martinez-Barbera JP, Puget S. Craniopharyngioma. Nature Reviews Disease Primers. 2019;5(1):75.
    doi: 10.1038/s41572-019-0125-9
    pmid: '31699993'
    pmcid: null
    url: https://doi.org/10.1038/s41572-019-0125-9
    source_license: ライセンス表示を確認できず（Crossref には TDM のライセンスのみ）
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 年齢分布と遺伝子変異は出典の抄録で確認した。乳頭型に対する BRAF 阻害薬などの分子標的治療の位置づけや、国内の治療成績は本調査では確認していない。
  curriculum:
