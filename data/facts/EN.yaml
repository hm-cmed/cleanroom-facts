- id: EN-002
  domain: EN
  subdomain: 中枢性性早熟症
  assertion:
    plain_statement_ja: 中枢性性早熟症は、視床下部・下垂体系が早期に活性化して二次性徴が年齢不相応に早く進む状態で、治療の標準は GnRH アナログによる下垂体性ゴナドトロピンの抑制である。GnRH アナログによる成人身長の改善が確立しているのは早期発症例（女児で6歳未満の発症）であり、それ以外の開始年齢では身長への利益は確実とはいえない。治療によって体重増加が促される、あるいは長期的に骨密度が低下するといった懸念は、専門家コンセンサスでは支持されなかった。
    condition:
      region: 国際
      study: コンセンサス声明（北米・欧州の小児内分泌学会、2009年）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-872
    source: Carel JC, Eugster EA, Rogol A, et al. Consensus Statement on the Use of Gonadotropin-Releasing Hormone Analogs in Children. Pediatrics. 2009;123(4):e752-e762.
    doi: 10.1542/peds.2008-1783
    pmid: '19332438'
    pmcid: null
    url: https://doi.org/10.1542/peds.2008-1783
    source_license: ライセンス表示を確認できず
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 出典は2009年のコンセンサス声明であり、その後のエビデンス（遺伝子診断の進歩や製剤の長期成績）との差分は未確認である。GnRH アナログ製剤の国内承認・保険適用（中枢性性早熟症への適応を含む）は未確認である。診断基準となる年齢の定義は出典の抄録範囲では確認していない。
