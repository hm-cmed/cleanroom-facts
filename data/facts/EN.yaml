- id: EN-035
  domain: EN
  subdomain: 多発性内分泌腫瘍症2型
  assertion:
    plain_statement_ja: 多発性内分泌腫瘍症2型（MEN2）は、甲状腺髄様癌を中核とする遺伝性腫瘍症候群であり、褐色細胞腫や原発性副甲状腺機能亢進症の合併が問題となる。髄様癌はMEN2における主要な死因に関わる腫瘍であり、その診断、病期評価、手術と経過観察の進め方については、米国甲状腺学会の甲状腺髄様癌ガイドライン（2015年改訂版）が推奨をまとめている。MEN2が疑われる、または診断された患者では、髄様癌の管理と並行して、合併する内分泌腫瘍の評価を計画的に行う必要がある。
    condition:
      region: 米国
      study: 米国甲状腺学会ガイドライン（2015年改訂版、甲状腺髄様癌）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-897
    source: Wells SA Jr, et al. Revised American Thyroid Association Guidelines for the Management of Medullary Thyroid Carcinoma. Thyroid. 2015;25(6):567-610.
    doi: 10.1089/thy.2014.0335
    pmid: '25810047'
    pmcid: null
    url: https://doi.org/10.1089/thy.2014.0335
    source_license: CC BY 4.0
    legal_basis: B
    source_class: OPEN
    corroboration: null
  uncertainty: 割当出典は甲状腺髄様癌のガイドラインであり、RET遺伝子変異の型に応じた予防的甲状腺全摘の時期や、褐色細胞腫・副甲状腺機能亢進症の浸透率などの数値は本調査で本文を確認していないため、主張文には含めていない。カルシトニン値のカットオフなど髄様癌の個別の判定基準も同様に未確認。
