- id: EN-027
  domain: EN
  subdomain: 医原性副腎皮質機能低下症
  assertion:
    plain_statement_ja: 糖質コルチコイドは広く処方されており、人口の少なくとも1%が慢性的な糖質コルチコイド療法を受けていて、糖質コルチコイド誘発性副腎不全のリスクにさらされている。発症リスクは糖質コルチコイドの用量、期間、力価、投与経路と個人の感受性によって決まる。減量は、生理量を超える用量の範囲では比較的速く進め、生理量の範囲では緩やかに行う。減量中に生じる糖質コルチコイド離脱症状は副腎不全の症状と重なるため、両者の区別に注意し、患者教育と慎重な管理が必要である。
    condition:
      region: 国際
      study: 欧州内分泌学会・Endocrine Society 合同診療ガイドライン（2024年）
    differential: null
    common_misconception: null
  provenance:
