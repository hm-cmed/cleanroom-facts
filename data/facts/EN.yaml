- id: EN-022
  domain: EN
  subdomain: Cushing症候群の治療
  assertion:
    plain_statement_ja: Cushing症候群の治療の目標は、コルチコールの値または作用を正常化して症候を消失させることと、高血圧・糖尿病などの合併症を治療することである。第一選択は原則として原因病変の外科的切除で、Cushing病では経蝶形骨洞的下垂体腺腫摘出術、良性の片側副腎病変では片側副腎摘出術、異所性ACTH産生腫瘍では腫瘍の摘出が中心となる。手術で治癒しない場合や手術ができない場合の第二選択には、再手術、放射線治療、薬物療法（ステロイド合成阻害薬、下垂体に作用する薬、糖質コルチコイド受容体拮抗薬など）、両側副腎摘出術があり、個々の患者に応じて選択する。寛解後も再発の経過観察を生涯続ける。
    condition:
      region: 国際
      study: Endocrine Society 診療ガイドライン（2015年）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-878
    source: 'Nieman LK, Biller BMK, Findling JW, Murad MH, Newell-Price J, Savage MO, Tabarin A. Treatment of Cushing''s Syndrome: An Endocrine Society Clinical Practice Guideline. J Clin Endocrinol Metab. 2015;100(8):2807-2831.'
    doi: 10.1210/jc.2015-1818
    pmid: '26222757'
    pmcid: PMC4525003
    url: https://doi.org/10.1210/jc.2015-1818
    source_license: 学会ガイドライン（CC 表示を確認できず）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 薬物療法は薬剤の分類までを PMC 本文の推奨事項で確認し、個別薬剤名は主張文に入れていない。各薬剤の国内承認・保険適用（Cushing症候群への適応の有無を含む）は未確認。ガイドラインは2015年版で、その後に承認された薬剤の位置づけは反映されていない。
