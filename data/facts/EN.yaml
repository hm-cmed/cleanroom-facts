    doi: 10.1530/EJE-13-1020
    pmid: '24569125'
    pmcid: null
    url: null
    source_license: null
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 治療の骨格は欧州ガイドラインの推奨に沿ったが、補正速度の具体的な上限値（24時間あたりの上昇幅）は抄録で確認していない。バソプレシン受容体拮抗薬（トルバプタン）の国内承認・保険適用（SIADH への適応を含む）は未確認であり、日本の診療との違いは取り込み側で確認されたい。
