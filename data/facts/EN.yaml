- id: EN-018
  domain: EN
  subdomain: 視床下部下垂体炎
  assertion:
    plain_statement_ja: 下垂体炎は下垂体の炎症によって下垂体の腫大と機能低下を来すまれな疾患である。原発性（リンパ球性、肉芽腫性、黄色腫性など）と、全身疾患、免疫療法（免疫チェックポイント阻害薬）、IgG4 関連疾患などに伴う続発性に分けられる。非侵襲的な確定診断は難しく、血清の抗下垂体抗体は感度・特異度が低く診断価値が限られる。治療は炎症による腫瘤のコントロールが目的で、薬物療法の中心はグルココルチコイドであり、症例によっては他の免疫抑制薬（アザチオプリン、リツキシマブなど）が用いられる。欠落した下垂体ホルモンは長期の補充が必要になることが多い。
    condition:
      region: 欧州
      study: 総説（European Journal of Endocrinology、2018年）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-882
    source: 'Joshi MN, Whitelaw BC, Carroll PV. Mechanisms in Endocrinology: Hypophysitis: Diagnosis and Treatment. European Journal of Endocrinology. 2018;179(3):R151-R163.'
    doi: 10.1530/EJE-17-0009
    pmid: '29880706'
    pmcid: null
    url: https://doi.org/10.1530/EJE-17-0009
    source_license: ライセンス表示を確認できず
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 分類と治療の骨格は出典の抄録で確認した。免疫チェックポイント阻害薬による下垂体炎の頻度などの数値は、この出典の抄録には含まれないため入れていない。グルココルチコイドや免疫抑制薬の国内承認・保険適用（下垂体炎への適応の有無を含む）は未確認である。
