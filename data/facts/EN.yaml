- id: EN-028
  domain: EN
  subdomain: 副腎偶発腫
  assertion:
    plain_statement_ja: 副腎偶発腫は、副腎疾患を疑わない理由で行われた画像検査で偶然発見される副腎腫瘤で、その多くは非機能性副腎皮質腺腫だが、副腎皮質癌、褐色細胞腫、ホルモン産生腺腫、転移との鑑別が必要である。すべての腫瘤に専用の副腎画像評価を行い、単純CTで均一かつ10 HU以下の病変は良性であり、大きさにかかわらず追加の画像検査は不要である。一方、4 cmを超え、不均一で、20 HUを超える病変は悪性のリスクが十分に高く、通常は手術が選択される。全例でホルモン過剰の評価を行い、血漿または尿中メタネフリンと、1 mg一晩デキサメタゾン抑制試験（抑制後の血中コルチコール50 nmol/L［1.8 μg/dL］以下をカットオフ）を含める。明らかなCushing症候群の徴候がなくても抑制後のコルチコールがこの値を超える状態は軽度自律性コルチコール分泌（MACS）と呼ばれ、関連する合併症の評価と個別化した手術適応の判断が求められる。
    condition:
      region: 欧州
      study: 欧州内分泌学会診療ガイドライン（2023年改訂版）
    differential: null
    common_misconception: null
  provenance:
