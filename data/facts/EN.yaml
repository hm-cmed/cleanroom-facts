- id: EN-031
  domain: EN
  subdomain: 褐色細胞腫の周術期管理と治療
  assertion:
    plain_statement_ja: 機能性の褐色細胞腫・傍神経節腫の患者は全員、周術期合併症を防ぐために術前に薬物による前処置（カテコールアミン作用の遮断）を受けるべきである。術後の低血圧を防ぐため、高ナトリウム食と十分な水分摂取による準備を組み合わせる。手術は、褐色細胞腫の大部分では低侵襲（腹腔鏡下）副腎摘出術、傍神経節腫の大部分では開腹切除が選択され、症例によっては副腎部分摘出術も選択肢となる。治療後も再発や転移の検出のため生涯にわたる経過観察が推奨される。
