- id: PL-030
  domain: PL
  subdomain: 横隔神経麻痺
  assertion:
    plain_statement_ja: 一側の横隔膜麻痺は無症状のことが多く胸部エックス線で偶然見つかるが、両側麻痺では起坐呼吸、安静時の呼吸困難、吸気時の腹部の奇異性運動が特徴で、レム睡眠中の低換気も起こる。原因には心臓手術を含む胸部手術、外傷、縦隔腫瘍による圧迫・浸潤、神経痛性筋萎縮症（Parsonage-Turner 症候群）、帯状疱疹、Guillain-Barré 症候群などがあり、特発性もある。透視下の sniff test は一側麻痺の評価に有用だが両側麻痺には向かず、臥位での肺活量の低下（一側で15%超、両側で30%超）も手がかりになる。
    condition:
      region: global
      guideline: null
    differential:
    - 超音波検査では、吸気時に横隔膜が尾側へ動かないことが麻痺を示す
    - 症状のある両側麻痺には非侵襲的換気が用いられる
    common_misconception: 横隔膜麻痺は一側でも必ず強い呼吸困難を起こす
  provenance:
    source_ref: SRC-570
    source: Ricoy J, Rodríguez-Núñez N, Álvarez-Dobaño JM, et al. Diaphragmatic dysfunction. Pulmonology 2019
    doi: null
    pmid: null
    pmcid: null
    url: https://www.journalpulmonology.org/en-diaphragmatic-dysfunction-articulo-S2531043718301624
    source_license: 未確認
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ65 2026-11-14）：Sivananthan TP, Falak U, Asim A. Unilateral Diaphragmatic Paralysis Presumed Secondary to Parsonage-Turner Syndrome Presenting as Orthopnea. Cureus. 2026;18（PMID: 42434666、DOI: 10.7759/cureus.110618、PMCID: PMC13354110、https://pmc.ncbi.nlm.nih.gov/articles/PMC13354110/）。裏づける部分：候補（CC BY の症例報告）が、片側横隔膜麻痺は無症状のことがあり、横隔膜機能障害の呈示は無症状の画像所見から労作時呼吸困難・起座呼吸・睡眠呼吸障害・呼吸不全まで幅があること、神経痛性筋萎縮症（Parsonage-Turner 症候群）が原因となりうること、臥位での FVC 低下（20〜30%超で横隔膜の弱化を示唆）を体位肺機能で確認したことを述べる。補助候補（El Kilali R, et al. Cureus. 2026、CC BY、両側例）は起座呼吸・臥位での胸腹部の奇異性運動・臥位 FVC 約34%低下を報告する。数値の照合：カードの閾値（臥位 VC 低下が片側15%超・両側30%超）そのものの再掲はなく、候補の「20〜30%超」という範囲表現と両側例の実測約34%が近接する裏づけにとどまる。留保：原因の全列挙（胸部・心臓手術、外傷、縦隔腫瘍の圧迫・浸潤、帯状疱疹、Guillain-Barré）、透視下 sniff test が片側に有用で両側に適さない点、REM 睡眠中の低換気は候補で未確認。主出典 SRC-570 は区分訂正あり（UNKNOWN→RESTRICTED、CC BY-NC-ND と特定）'
  uncertainty: 臥位肺活量の閾値は表から読み取り（本文では15〜30%と幅で記載）。DOI とライセンスは未確認
