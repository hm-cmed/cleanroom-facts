    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ65 2026-11-14）：Alkhalil N, Kawtharani AA, Nahas C, Abou Rached A. Post-intubation Tracheoesophageal Fistula Following Meningioma Excision: A Case Report and Literature Review. Cureus. 2025;17(5):e83748（PMID: 40486317、DOI: 10.7759/cureus.83748、PMCID: PMC12145205、https://pmc.ncbi.nlm.nih.gov/articles/PMC12145205/）。裏づける部分：候補（CC BY の症例報告・文献レビュー）が、主出典と同じ Burt らの200例超のシリーズから症状頻度を再掲する：咳56%・誤嚥37%・発熱25%・嚥下困難19%・肺炎5%。さらに、Ono 徴候（嚥下で誘発される発作性の咳）が既知の瘻孔例の81%にみられること、良性の瘻孔の約75%が医原性（カフによる圧迫壊死が主体）であること、悪性が成人の後天性瘻孔の50%超を占め食道癌・肺癌が主な原因であることも明記し、カードと広く一致する。数値の照合：症状頻度（咳56%・誤嚥37%・発熱25%・嚥下困難19%・肺炎5%）、Ono 徴候81%、良性の約75%が医原性は候補と一致。留保：悪性のうち食道癌が77%（207例のシリーズ）という内訳と、食道造影で約70%に瘻孔が描出される点は候補では未確認。治療の方向（悪性はステントによる緩和が主体、良性は根治手術が可能でステントは橋渡し）は、候補がステントを緩和的介入とし手術の閉鎖成功率75〜94%を述べる範囲で概ね支持される。主出典 SRC-4894 の区分は現行 RESTRICTED が正しい（CC BY-NC 4.0 を Crossref・Europe PMC で再確認）'
