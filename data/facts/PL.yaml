- id: PL-029
  domain: PL
  subdomain: 横隔膜弛緩症
  assertion:
    plain_statement_ja: 横隔膜弛緩症は、横隔膜に解剖学的な欠損がないにもかかわらず片側の横隔膜が持続的に挙上する状態で、横隔膜ヘルニアとは区別される。先天性は横隔膜の筋構造の形成不全によるもの、後天性は横隔神経障害に続発するもので、横隔膜麻痺とは別の病態とされるが、画像所見や臨床像は似る。症状のある成人42例に縫縮術を行った検討では、左側が33例と多く、原因は特発性45.2%、外傷33.3%、手術21.4%で、術前の1秒量は予測値の62%、FVCは61%だった。縫縮術の1年後に1秒量は23%、FVCは24%改善し、呼吸困難のスコア（mMRC）は3.0から0.9に下がり、平均28か月の観察で再発はなかった。
    condition: null
    differential: 横隔膜ヘルニア、横隔膜麻痺
    common_misconception: 横隔膜の挙上はすべて横隔膜ヘルニアによるものである
  provenance:
    source_ref: SRC-567
    source: Evman S, et al. Comparison of Mid-Term Clinical Outcomes of Different Surgical Approaches in Symptomatic Diaphragmatic Eventration. Ann Thorac Cardiovasc Surg 2016;22:224-229
    doi: 10.5761/atcs.oa.16-00018
    pmid: '27076066'
    pmcid: PMC5045849
    url: https://doi.org/10.5761/atcs.oa.16-00018
    source_license: 未確認（PMC と J-STAGE の論文ページ、Crossref のいずれにもライセンス表示なし。©2016 Annals of Thoracic and Cardiovascular Surgery）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ65 2026-11-14）：Rafiei Y, Movahedi B, Bayat F, Zohrian F. Diagnosing Congenital Diaphragmatic Eventration Presenting With Transient Cardiac Dextroposition in an Adult: A Case Report and Literature Review. Case Rep Pulmonol. 2026（PMID: 42559125、DOI: 10.1155/crpu/1851328、PMCID: PMC13439979、https://pmc.ncbi.nlm.nih.gov/articles/PMC13439979/）。裏づける部分：候補（CC BY の症例報告・文献レビュー）が、横隔膜挙上症を「筋の発達不全により、解剖学的に欠損のない横隔膜が永続的に挙上した状態」と定義し、離断（欠損）のあるヘルニアとは区別されること、持続する呼吸困難・反復感染・縦隔偏位の進行がある成人では外科的縫縮術が治療として支持されることを明記し、カードの定義部分と一致する。数値の照合：主出典 Evman らの手術例42例のコホート数値（左側33例、原因は特発性45.2%・外傷33.3%・手術21.4%、術前 FEV1 62%・FVC 61%、1年で FEV1 +23%・FVC +24%、mMRC 3.0→0.9、平均28か月で再発なし）は候補に再掲がなかった。留保：主出典 SRC-567 は区分訂正あり（UNKNOWN→RESTRICTED。PMC に全文があるがライセンス表示がなく自由とはみなさない）。PMCID は補完候補（PMC5045849、識別子補完候補の節参照）'
  uncertainty: 対象は単一施設で縫縮術を受けた有症状の成人42例に限られる後ろ向き検討で、無症状例の経過は示されていない
