- id: PL-001
  domain: PL
  subdomain: 気胸
  assertion:
    plain_statement_ja: BTS 2023 は、成人の原発性自然気胸で症状がないか軽い（強い痛み・息切れ・生理学的な悪化がない）場合は、虚脱の大きさにかかわらず経過観察を考慮できるとした（Conditional – by consensus）。治療の選択は大きさより症状で決める。
    condition:
      guideline: BTS Guideline for pleural disease 2023
      region: 英国
    differential: null
    common_misconception: 気胸の治療方針は虚脱の大きさだけで決まる
  provenance:
    source_ref: SRC-370
    source: Roberts ME, Rahman NM, Maskell NA, et al. British Thoracic Society Guideline for pleural disease. Thorax 2023;78:1143-1156
    doi: 10.1136/thorax-2023-220304
    pmid: null
    pmcid: null
    url: https://thorax.bmj.com/content/78/11/1143.full.pdf
    source_license: © Author(s) (or their employer(s)) 2023. No commercial re-use.
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ65 2026-11-14）：Vyas YK, Mansuriya J, Patel KA, Jani YB, Anushika. Conservative management of spontaneous pneumothorax: A review of evidence and guidelines. Bioinformation. 2025;21(3):471-484（PMID: 40599916、DOI: 10.6026/973206300210471、PMCID: PMC12208270、https://pmc.ncbi.nlm.nih.gov/articles/PMC12208270/）。裏づける部分：候補（CC BY の総説）が BTS 2023 を含む各ガイドラインの比較表（Table 6）で BTS の初期対応を整理し、安定した原発性自然気胸では観察・酸素療法・症状に基づくケアによる保存的管理が侵襲的治療と同等の転帰を示すことを本文で述べる。補助候補（Raza MZ, et al. BMJ Open Respir Res. 2025、CC BY）も「最近改訂された BTS ガイドラインは、症状のある気胸に治療を提供すべきことを示唆する」と症状駆動の原則を明記する。数値の照合：数値なし（管理方針のカード）。留保：「大きさによらず保存的に管理しうる」という BTS 固有の基準と、重い症状や生理学的悪化がないことという条件の逐語再掲は候補にない。主出典 SRC-370 の区分は現行 RESTRICTED が正しい（BMJ 刊行、Crossref にライセンス表示なし・Europe PMC で非 OA）'
  uncertainty: BTS 2023 の推奨文の要旨（英国）。日本の気胸・胸水診療の指針（日本気胸・囊胞性肺疾患学会など）は今回確認していない
