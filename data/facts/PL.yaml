- id: PL-002
  domain: PL
  subdomain: 気胸
  assertion:
    plain_statement_ja: BTS 2023 は、十分な支援と経過観察の体制がある成人の原発性自然気胸では、外来での管理（携帯型の脱気器具）を初期治療として考慮し、経過観察や外来管理が適さない場合は穿刺吸引か胸腔ドレナージを考慮するとした（いずれも Conditional）。
