- id: PL-026
  domain: PL
  subdomain: 過換気症候群
  assertion:
    plain_statement_ja: 紙袋再呼吸の検討では、過換気をした健常者20人が紙袋で再呼吸すると酸素分圧が3分で平均26.6 mmHg低下し、最大42 mmHg低下した。低酸素血症や心筋虚血が見逃されたまま紙袋再呼吸が行われ死亡した3例も報告されている。
    condition:
      guideline: null
      region: 米国
    differential: null
    common_misconception: 過換気発作には紙袋再呼吸が安全で標準的な対処法である
  provenance:
