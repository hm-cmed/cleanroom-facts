    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ65 2026-11-14）：Vyas YK, Mansuriya J, Patel KA, Jani YB, Anushika. Conservative management of spontaneous pneumothorax: A review of evidence and guidelines. Bioinformation. 2025;21(3):471-484（PMID: 40599916、DOI: 10.6026/973206300210471、PMCID: PMC12208270、https://pmc.ncbi.nlm.nih.gov/articles/PMC12208270/）。裏づける部分：候補の比較表（Table 6）が BTS 欄で、携帯型ドレナージ機器による外来管理（ambulatory management）を安定した二次性自然気胸と大きな原発性自然気胸への推奨として位置づけ、穿刺吸引と胸腔ドレナージを代替手技として整理する。外来管理を初期治療に用いる枠組み自体はカードと一致する。数値の照合：数値なし。留保：十分な支援・フォローアップ体制を条件に原発性自然気胸の初期治療として外来管理を用いうる、というカードの適用範囲までは候補で再掲されていない（候補の BTS 欄の推奨範囲は安定した二次性と大きな原発性）'
  uncertainty: BTS 2023 の推奨文の要旨（英国）。日本の気胸・胸水診療の指針（日本気胸・囊胞性肺疾患学会など）は今回確認していない。携帯型脱気器具の国内での使用状況は未確認
