- id: PL-006
  domain: PL
  subdomain: 乳び胸
  assertion:
    plain_statement_ja: 胸水の中性脂肪が110 mg/dLを超えると乳び胸水が強く疑われ、50〜110 mg/dLのときはリポ蛋白電気泳動でカイロミクロンの帯を確認して判定する。141例の胸水を検討した研究にもとづく。
    condition:
      guideline: null
      region: 日本
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-487
    source: Staats BA, et al. The lipoprotein profile of chylous and nonchylous pleural effusions. Mayo Clin Proc 1980;55(11):700-704
    doi: null
    pmid: '7442324'
    pmcid: null
    url: https://pubmed.ncbi.nlm.nih.gov/7442324/
    source_license: 未確認
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ65 2026-11-14）：Mikołajczyk-Solińska M, Czyżak B, Zdaniewicz M, Węgiel A, Gajczak M, Szpotan T, Majos A, Kasznicki J. Chylothorax in a 57-Year-Old Female Patient After a Car Accident. J Clin Med. 2026;15(15):5877（PMID: 42589981、DOI: 10.3390/jcm15155877、PMCID: PMC13467419、https://pmc.ncbi.nlm.nih.gov/articles/PMC13467419/）。裏づける部分：候補（CC BY の症例報告の考察）が診断アルゴリズムを逐語的に述べる：胸水トリグリセリドが1.24 mmol/L（110 mg/dL）超であれば乳び胸の診断基準を満たし、中間域0.56〜1.24 mmol/L（50〜110 mg/dL）ではリポ蛋白電気泳動でカイロミクロンを確認すべきである。補助候補（Pizarro Peña E, et al. Case Rep Immunol. 2026、CC BY）もリポ蛋白電気泳動を確定診断の標準とし、トリグリセリド110超と50未満の対比を示す。数値の照合：閾値110 mg/dL と中間域50〜110 mg/dL は候補と一致（候補は mmol/L を併記）。留保：主出典 SRC-487 は区分訂正あり（UNKNOWN→RESTRICTED、区分訂正の節参照）'
