    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ64 2026-11-14）：Aggarwal P, Yannamani A, Jain J, Klipa I, Oehler A, Kassis-George H. Cardiac Rehabilitation in Heart Failure: Evidence, Coverage, and Implementation. J Clin Med. 2026;15(17):6576／補助：Krishnan S, Goddard ACN, Annals M, Squire IB, Sze S. Exercise for older people with heart failure and frailty: should we even try? ESC Heart Fail. 2026;13(6)（PMID: 42739581、DOI: 10.3390/jcm15176576、PMCID: PMC13566242、https://pmc.ncbi.nlm.nih.gov/articles/PMC13566242/）。裏づける部分：主候補（CC BY）が、運動療法により最高酸素摂取量が改善することは一貫した知見であるとする。補助候補（CC BY）は有酸素運動の用量として週3〜5日・1回20〜60分の範囲を表に示す。カードの頻度（週3〜5回）の骨格と、続けると最高酸素摂取量が改善するという方向は候補と一致する。数値の照合：カードの改善幅8〜16%に対し、主候補の統合値は HFrEF で15〜17%であり、研究集合の異なる別推計のため値そのものの裏づけにはならない（申し送り参照）。留保：1回40〜50分・3か月というカードの用量パッケージ自体の逐語再掲は見つからなかった'
