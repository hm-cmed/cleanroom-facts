    pmcid: null
    url: https://www.jacr.jp/cms/wp-content/uploads/2015/04/JCS2021_Makita2.pdf
    source_license: （無断転載を禁ずる）© 日本循環器学会・日本心臓リハビリテーション学会
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
