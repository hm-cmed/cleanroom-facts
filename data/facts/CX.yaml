- id: CX-017
  domain: CX
  subdomain: 心臓リハビリテーション
  assertion:
    plain_statement_ja: 心臓リハビリテーションは、心血管疾患の患者の身体的・心理的・社会的・職業的な状態を改善し、再発・再入院・死亡を減らすための長期的で包括的なプログラムである。医学的評価、運動処方にもとづく運動療法、冠危険因子の是正、患者教育とカウンセリング、最適な薬物療法から成り、2021年版では疾病管理が加わった。対象には、急性冠症候群、安定狭心症・PCI 後、心不全、心臓手術後、TAVI 後、不整脈・デバイス植込み後、肺高血圧症、大動脈瘤・大動脈解離、末梢動脈疾患が含まれる。
    condition:
      guideline: JCS/JACR 2021 心血管疾患リハビリテーション GL
      region: 日本
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-312
    source: 日本循環器学会・日本心臓リハビリテーション学会ほか. 心血管疾患におけるリハビリテーションに関するガイドライン（2021年改訂版）. 2021年3月27日発行
    doi: null
    pmid: null
    pmcid: null
    url: https://www.jacr.jp/cms/wp-content/uploads/2015/04/JCS2021_Makita2.pdf
    source_license: （無断転載を禁ずる）© 日本循環器学会・日本心臓リハビリテーション学会
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ64 2026-11-14）：Mauriello A, Correra A, Maratea AC, Russo V, Liccardo B, Gragnano F, et al. The Evolution of Cardiac Rehabilitation from Supervised Models to New Frontiers in Digital Health. J Clin Med. 2026;15(7):2515（PMID: 41976816、DOI: 10.3390/jcm15072515、PMCID: PMC13073996、https://pmc.ncbi.nlm.nih.gov/articles/PMC13073996/）。裏づける部分：候補（CC BY）が心臓リハビリテーションを、運動療法・冠危険因子の是正・心理社会的評価・成果評価を含む多職種の包括的プログラムと定義し、中核構成要素の枠組みを示す。カードの構成要素（医学的評価、運動処方にもとづく運動療法、冠危険因子の是正、患者教育とカウンセリング、最適な薬物療法）の骨格と概ね一致する。数値の照合：数値なし。留保：2021年版で加わった「疾病管理」と、対象疾患の列挙（TAVI 後・肺高血圧症・大動脈瘤/大動脈解離・末梢動脈疾患を含む）は JCS ガイドライン固有で候補では未確認。主出典 SRC-312 の区分は現行 RESTRICTED が正しい'
