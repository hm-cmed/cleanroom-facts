- id: CX-004
  domain: CX
  subdomain: 失神
  assertion:
    plain_statement_ja: 失神の初期評価では、詳しい病歴と身体診察（クラス I）と安静時12誘導心電図（クラス I）を行う。ルーチンの包括的な血液検査と、心原性が疑われない場合のルーチンの心臓画像検査は有用でない（クラス III）。構造的心疾患が疑われる患者では経胸壁心エコーが有用でありうる（クラス IIa）。
