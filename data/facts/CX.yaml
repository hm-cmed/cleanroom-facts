- id: CX-005
  domain: CX
  subdomain: 失神
  assertion:
    plain_statement_ja: 心原性失神を示唆する特徴として、60歳を超える年齢、男性、虚血性・構造的・先天性心疾患や心機能低下の既往、前兆が短い（動悸など）か前兆のない突然の意識消失、労作中や臥位での失神、少ない発作回数（1〜2回）、心臓の診察所見の異常、遺伝性疾患や50歳未満の突然死の家族歴が挙げられる。
    condition:
      guideline: 2017 ACC/AHA/HRS 失神 GL
