- id: CX-007
  domain: CX
  subdomain: 心電図の基本所見
  assertion:
    plain_statement_ja: QT 間隔の心拍数補正には Bazett の式より線形回帰の式が勧められ、報告には補正法を明記する。Bazett の式は特に心拍数が速いときに大きな誤差を生む。心房細動など RR 間隔の変動が大きいときや T 波の終末が不明瞭なときは補正しない。
    condition:
      guideline: AHA/ACCF/HRS 心電図の標準化と判読の勧告 Part IV（2009）
      region: 米国の学会の勧告
    differential: null
    common_misconception: QTc はどの心拍数でも Bazett の式で正しく補正できる
  provenance:
    source_ref: SRC-309
    source: 'Rautaharju PM, Surawicz B, Gettes LS. AHA/ACCF/HRS recommendations for the standardization and interpretation of the electrocardiogram: part IV: the ST segment, T and U waves, and the QT interval. Circulation 2009;119:e241-e250'
    doi: 10.1161/CIRCULATIONAHA.108.191096
    pmid: null
    pmcid: null
    url: https://hrsonline.org/documents/interpretation-electrocardiogram-part-iv-st-segment-t-and-u-waves-and-qt-intervalpdf/download
    source_license: © 2009 AHA, ACCF, HRS
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ64 2026-11-14）：Mahendran S, Gupta I, Davis J, Davis AJ, Orchard JW, Orchard J. Comparison of methods for correcting QT interval in athletes and young people: A systematic review. Clin Cardiol. 2023;46(9):1106-1115（PMID: 37470093、DOI: 10.1002/clc.24093、PMCID: PMC10540007、https://pmc.ncbi.nlm.nih.gov/articles/PMC10540007/）。裏づける部分：候補（CC BY のシステマティックレビュー）が、Bazett 式は心拍数の高い範囲で QTc を過大評価し低い範囲で過小評価すること、線形補正式（Framingham・Hodges）が心拍数の両端でより正確でありうる代替であることを明記し、カードの「Bazett の式は特に心拍数が速いときに大きな誤差を生む」という中心点と一致する。数値の照合：数値なし。留保：「線形回帰の式が勧められ、報告には補正法を明記する」という AHA の推奨文自体と、RR 間隔の変動が大きいときや T 波の終末が不明瞭なときは補正しない点は候補では未確認'
