- id: CX-019
  domain: CX
  subdomain: 心臓リハビリテーション
  assertion:
    plain_statement_ja: 有酸素運動の強度は、ランプ負荷の心肺運動負荷試験（CPX）で求めた嫌気性代謝閾値（AT）の1分前の仕事率で処方する。AT は最高酸素摂取量の約50〜55%にあたる。予測最高心拍数を使うと誤差が大きいため実測値を使うべきで、β遮断薬を飲んでいる患者では特に重要である。
    condition:
      guideline: JCS/JACR 2021 心血管疾患リハビリテーション GL
      region: 日本
    differential: null
    common_misconception: 運動強度は年齢からの予測最高心拍数で処方すれば十分である
  provenance:
    source_ref: SRC-312
    source: 日本循環器学会・日本心臓リハビリテーション学会ほか. 心血管疾患におけるリハビリテーションに関するガイドライン（2021年改訂版）. 2021年3月27日発行
    doi: null
    pmid: null
    pmcid: null
    url: https://www.jacr.jp/cms/wp-content/uploads/2015/04/JCS2021_Makita2.pdf
    source_license: （無断転載を禁ずる）© 日本循環器学会・日本心臓リハビリテーション学会
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ64 2026-11-14）：Carvalho T, Freitas OGA, Chalela WA, Hossri CAC, Milani M, Buglia S, et al. Brazilian Guideline for Exercise Test in the Adult Population - 2024. Arq Bras Cardiol. 2024;121(3):e20240110（PMID: 38896581、DOI: 10.36660/abc.20240110、PMCID: PMC11656589、https://pmc.ncbi.nlm.nih.gov/articles/PMC11656589/）。裏づける部分：候補（CC BY の運動負荷試験ガイドライン）が、嫌気性代謝閾値（AT）には心不全での予後価値があり、心血管リハビリテーションとスポーツにおける運動処方の根拠として重要であると位置づける。カードの「ランプ負荷 CPX で求めた AT に基づいて有酸素運動の強度を処方する」という原則部分と一致する。数値の照合：AT が最高酸素摂取量の約50〜55%にあたるという値は候補では未確認。留保：AT の1分前の仕事率で処方する具体的手法、予測最高心拍数でなく実測値を使うべき点、β 遮断薬服用患者で特に重要という点は、いずれも候補では未確認（日本の CPX 運用に固有）'
  uncertainty: Borg 指数や Karvonen 法の係数は今回の抽出範囲になく未確認
