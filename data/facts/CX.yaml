- id: CX-003
  domain: CX
  subdomain: 失神
  assertion:
    plain_statement_ja: 失神は、脳の低灌流によって起こる突然の一過性の意識消失で、姿勢を保てなくなり、速やかに自然に回復するものをいう。原因は、反射性（神経調節性。血管迷走神経性が最も多い）、起立性低血圧、心原性（徐脈、頻脈、心拍出量の低下、血流の閉塞、大動脈解離など）に分けられる。
    condition:
      guideline: 2017 ACC/AHA/HRS 失神 GL
      region: 米国の診療を前提とした推奨
    differential: てんかん発作、低血糖、頭部外傷などの失神以外の一過性意識障害
    common_misconception: null
  provenance:
    source_ref: SRC-297
    source: 'Shen WK, Sheldon RS, Benditt DG, et al. 2017 ACC/AHA/HRS guideline for the evaluation and management of patients with syncope: executive summary. Heart Rhythm 2017;14:e218-e254'
    doi: 10.1016/j.hrthm.2017.03.005
    pmid: null
    pmcid: null
    url: https://hrsonline.org/documents/2017-acc-aha-hrs-syncope-guideline-executive-summarypdf-0/download
    source_license: © 2017 American College of Cardiology Foundation, AHA, HRS
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ64 2026-11-14）：Taoussi O, Kamri HA, Scadi S, Ghali B, Merzouk F. Phenotyping Dysautonomia in Unexplained Syncope: Diagnostic Yield and Therapeutic Implications in a Moroccan Cohort. Cureus. 2026;18(1):e101268／補助：Antonazzo B, Sirignano A, Salvini M, Rossi FF, Ronzoni S, Dorizzi A, et al. Management of Syncope in Geriatric Patients: Are 2018 European Society of Cardiology Guidelines Still Relevant? J Clin Med. 2026;15(16):6303（PMID: 41674764、DOI: 10.7759/cureus.101268、PMCID: PMC12887543、https://pmc.ncbi.nlm.nih.gov/articles/PMC12887543/）。裏づける部分：主候補（CC BY）が失神の定義を逐語再掲する：脳全体の低灌流による一過性意識消失で、急速な発症・短い持続・自然で完全な回復を特徴とする。補助候補（CC BY）は反射性・起立性低血圧・心原性の3分類の枠組みで整理し、心原性の原因として徐脈性不整脈・伝導障害・構造的病変を挙げる。血管迷走神経性が反射性の最多の型である点は血管迷走神経性失神の総説（Laranjo S, et al. J Clin Med. 2026）も明記する。数値の照合：数値なし（定義・分類のカード）。留保：心原性の内訳のうち心拍出量の低下・血流の閉塞・大動脈解離という列挙は候補では未確認。主出典 SRC-297 の区分は現行 RESTRICTED が正しい（区分訂正の節参照）'
  uncertainty: null
