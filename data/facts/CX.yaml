    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ64 2026-11-14）：Antonazzo B, Sirignano A, Salvini M, Rossi FF, Ronzoni S, Dorizzi A, et al. Management of Syncope in Geriatric Patients: Are 2018 European Society of Cardiology Guidelines Still Relevant? J Clin Med. 2026;15(16):6303（PMID: 42652707、DOI: 10.3390/jcm15166303、PMCID: PMC13513275、https://pmc.ncbi.nlm.nih.gov/articles/PMC13513275/）。裏づける部分：候補（CC BY）が初期評価の構成（目撃者を含む詳しい病歴、身体診察、起立血圧、12誘導心電図）を明記し、ルーチンの神経画像や頸動脈超音波ではなくリスク所見に基づく標的検査を置くこと、包括的な血液検査パネルはリスク層別に寄与しないこと、心エコーは条件付きの位置づけであることを述べ、カードの評価骨格と概ね一致する。数値の照合：数値なし。留保：推奨クラス（病歴・診察と心電図＝クラス I、ルーチン検査＝クラス III、心エコー＝クラス IIa）という ACC のクラス付け自体は候補では再掲されていない（候補は ESC 2018 の枠組み）'
