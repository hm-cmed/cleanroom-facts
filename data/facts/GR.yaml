- id: GR-001
  domain: GR
  subdomain: 成長・発達の障害
  assertion:
    plain_statement_ja: 小児の成長の評価では、病歴と身体所見に加えて、身長・体重などの計測値を成長曲線上で経時的に追う評価（オークソロジー）が最も重要な方法である。低身長は小児内分泌医への紹介理由として最も頻度が高く、単一時点の身長だけでなく、成長の経過そのものを評価することが診断の出発点となる
    condition:
      region: 国際
      対象: 低身長・成長障害の評価を受ける小児
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1027
    source: 'Collett-Solberg PF, Ambler G, Backeljauw PF, et al. Diagnosis, Genetics, and Therapy of Short Stature in Children: A Growth Hormone Research Society International Perspective. Horm Res Paediatr. 2019;92(1):1-14'
    doi: 10.1159/000502231
    pmid: '31514194'
    pmcid: null
    url: https://doi.org/10.1159/000502231
    source_license: CC BY-NC-ND 4.0（Crossref・Europe PMC で確認）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN／OPEN、作り手の調査バッチ98 2026-11-15）：Paparella R, Bei A, Bernabei I, et al. Idiopathic Short Stature in the Genomic Era: Integrating Auxology, Endocrinology, and Emerging Genetic Insights. Children (Basel). 2025;12(7):855／Linglart A, Cianfarani S, Dattani MT, et al. International Consensus on the Diagnosis and Clinical Management of Idiopathic Short Stature: A Modified Delphi Method. Horm Res Paediatr. 2026（PMID: 40723048／42658741、DOI: 10.3390/children12070855／10.1159/hrp/adaag008、PMCID: PMC12294097／PMC13713050、https://creativecommons.org/licenses/by/4.0/）。裏づける部分：部分：候補1（CC BY 総説）は「オークソロジーによる評価は低身長評価の要（cornerstone）であり、身長・成長速度・思春期の経過の精密な縦断的計測と標的身長の評価によって異常な成長の経過を早期に捉えられる」と述べ、カードの主張の中核（病歴・身体所見に加えて、計測値を成長曲線上で経時的に追う評価が最も重要な方法であり、単一時点の身長だけでなく成長の経過そのものを評価することが診断の出発点）と一致する。また「低身長は小児内分泌への紹介の一般的な理由（a common reason for pediatric endocrinology referral）」とも述べる。候補2（CC BY の国際コンセンサス）は、集団の成長曲線で身長 SDS を解釈すること、身長速度の評価には最低6か月空けた2回以上の計測が必要なこと、評価は病歴・身体所見・成長速度の文脈で解釈することを推奨として再掲する。ただし「小児内分泌医への紹介理由として最も頻度が高い」という最上級の表現そのものは候補のいずれにも再掲がない（候補1は common reason の表現にとどまる）。数値の照合：数値的主張はカードにない（身長 −2 SDS の定義はカードの uncertainty にあるとおり主張に入れられていない）。候補2の身長速度評価の条件（2回以上の計測・最低6か月間隔）はカードの主張の数値照合の対象ではない。留保：主出典 SRC-1027 の区分訂正（UNKNOWN→RESTRICTED）と license_note の更新、PMCID の補完はいずれもバッチ77で提案済みの再掲（区分訂正・識別子補完の節参照）。カード側はすでに source_class が RESTRICTED、source_license に「CC BY-NC-ND 4.0（Crossref・Europe PMC で確認）」の記載があり、マスター側の反映待ち。候補のライセンスはいずれも Crossref の版データ・Europe PMC の個別レコード・PMC 全文のライセンス要素で CC BY 4.0 と個別確認した。候補2は主出典と著者陣の重なる後継的なコンセンサス文書で、バッチ77で次回改訂時の出典差し替え（OPEN 化）候補として申し送り済み'
  uncertainty: 身長 −2 SDS 未満を低身長の目安とする定義は広く用いられるが、本出典について確認できた範囲（抄録）ではその文言を照合できなかったため、主張に数値は入れていない。日本で使われる標準成長曲線（国内標準値）との対応は本カードでは扱っていない。誌面発行は2019年で、2018年はオンライン先行の年である
