- id: GR-002
  domain: GR
  subdomain: 成長・発達の障害
  assertion:
    plain_statement_ja: 低身長・成長障害の鑑別では、成長ホルモン分泌不全症（GHD）、特発性低身長症（ISS）、原発性IGF-I欠損症（PIGFD）の3つの病態の区別がしばしば困難である。小児内分泌学会のガイドライン（2016）はこの3病態を対象とし、IGF-Iの測定を含む評価の進め方と、成長ホルモン治療および組換えIGF-I治療の適応判断に関する推奨を示している
    condition:
      region: 国際
      対象: 成長障害のある小児・青年
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1026
    source: 'Grimberg A, DiVall SA, Polychronakos C, et al. Guidelines for Growth Hormone and Insulin-Like Growth Factor-I Treatment in Children and Adolescents: Growth Hormone Deficiency, Idiopathic Short Stature, and Primary Insulin-Like Growth Factor-I Deficiency. Horm Res Paediatr. 2016;86(6):361-397'
    doi: 10.1159/000452150
    pmid: '27884013'
    pmcid: null
    url: https://doi.org/10.1159/000452150
    source_license: © S. Karger AG（CC表示なし）
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 薬剤の国内承認：成長ホルモン（ソマトロピン）の国内承認適応は、成長ホルモン分泌不全性低身長症、ターナー症候群・慢性腎不全における低身長、SGA性低身長症、プラダー・ウィリ症候群であり（PMDA 添付文書で確認した先行リサーチに基づく）、特発性低身長症（ISS）は国内の承認適応に含まれない。したがって本ガイドラインの ISS への成長ホルモン治療の議論は、国内の保険適用とは一致しない。長時間作用型の成長ホルモン製剤の国内承認状況は未確認
  curriculum:
    kokushi: 医学各論 Ⅰ-4-D（成長・発達の障害、a）
    core_curriculum: 'PS-02-12-01 (id: Jli53Ic)；TBL-02-11-019 (id: Jli6Jng)；PS-02-12-04 (id: Jli53IM)'
