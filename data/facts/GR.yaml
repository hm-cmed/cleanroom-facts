- id: GR-002
  domain: GR
  subdomain: 成長・発達の障害
  assertion:
    plain_statement_ja: 低身長・成長障害の鑑別では、成長ホルモン分泌不全症（GHD）、特発性低身長症（ISS）、原発性IGF-I欠損症（PIGFD）の3つの病態の区別がしばしば困難である。小児内分泌学会のガイドライン（2016）はこの3病態を対象とし、IGF-Iの測定を含む評価の進め方と、成長ホルモン治療および組換えIGF-I治療の適応判断に関する推奨を示している
    condition:
      region: 国際
      対象: 成長障害のある小児・青年
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1026
    source: 'Grimberg A, DiVall SA, Polychronakos C, et al. Guidelines for Growth Hormone and Insulin-Like Growth Factor-I Treatment in Children and Adolescents: Growth Hormone Deficiency, Idiopathic Short Stature, and Primary Insulin-Like Growth Factor-I Deficiency. Horm Res Paediatr. 2016;86(6):361-397'
    doi: 10.1159/000452150
    pmid: '27884013'
    pmcid: null
    url: https://doi.org/10.1159/000452150
    source_license: © S. Karger AG（CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN／OPEN、作り手の調査バッチ98 2026-11-15）：Linglart A, Cianfarani S, Dattani MT, et al. International Consensus on the Diagnosis and Clinical Management of Idiopathic Short Stature: A Modified Delphi Method. Horm Res Paediatr. 2026／Backeljauw PF, Andrews M, Bang P, et al. Challenges in the care of individuals with severe primary insulin-like growth factor-I deficiency (SPIGFD): an international, multi-stakeholder perspective. Orphanet J Rare Dis. 2023;18(1):312（PMID: 42658741／37805563、DOI: 10.1159/hrp/adaag008／10.1186/s13023-023-02928-7、PMCID: PMC13713050／PMC10559630、https://creativecommons.org/licenses/by/4.0/）。裏づける部分：部分：候補1（CC BY の国際コンセンサス）は主出典（Grimberg et al. 2016）を引用文献として挙げ、特発性低身長症（ISS）は除外診断であること、ISS の診断は GH 刺激試験で刺激時 GH が欠乏の閾値を超え、IGF-1・IGFBP-3 が正常範囲であることを確認して行うこと（すなわち成長ホルモン分泌不全症（GHD）との区別に IGF-I の測定を含む評価が必要なこと）、思春期前の低身長では ISS と体質性思春期遅延が初回評価で区別できない場合があることを述べ、鑑別の困難さと IGF-I を含む評価の進め方の骨格を裏づける。候補2（CC BY）は、原発性 IGF-I 欠損症（PIGFD）の重症型（SPIGFD）が GH 不感受性の枠組みに位置づけられること、診断の道筋自体が困難（challenging）であること、組換えヒト IGF-1（rhIGF-1）が SPIGFD に対する唯一の有効な治療であることを述べ、PIGFD 側の位置づけと組換え IGF-I 治療の位置づけを裏づける。ただし、2016年の小児内分泌学会ガイドラインがこの3病態を対象とし、評価の進め方と成長ホルモン治療・組換え IGF-I 治療の適応判断に関する推奨を示したというガイドライン自身の範囲表明そのものは、自由な全文には再掲がない（両候補とも主出典を引用文献として挙げるにとどまる）。数値の照合：数値的主張はカードにない。候補1の GH 刺激試験の閾値（ピーク GH 7.5〜10 µg/L、測定法・地域で異なると注記）は候補側の値であり、主出典の数値として裏づけ登録しないこと（申し送り参照）。留保：主出典 SRC-1026 の区分訂正（UNKNOWN→RESTRICTED）はバッチ77で提案済みの再掲（区分訂正の節参照）。候補のライセンスはいずれも Crossref の版データ・Europe PMC の個別レコード・PMC 全文のライセンス要素で CC BY 4.0 と個別確認した。カードの uncertainty にある国内承認の注記（特発性低身長症は国内の成長ホルモン承認適応に含まれない）は本棚卸しの対象外であり、変更していない'
  uncertainty: 薬剤の国内承認：成長ホルモン（ソマトロピン）の国内承認適応は、成長ホルモン分泌不全性低身長症、ターナー症候群・慢性腎不全における低身長、SGA性低身長症、プラダー・ウィリ症候群であり（PMDA 添付文書で確認した先行リサーチに基づく）、特発性低身長症（ISS）は国内の承認適応に含まれない。したがって本ガイドラインの ISS への成長ホルモン治療の議論は、国内の保険適用とは一致しない。長時間作用型の成長ホルモン製剤の国内承認状況は未確認
