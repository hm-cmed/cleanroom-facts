- id: GR-003
  domain: GR
  subdomain: 成長・発達の障害
  assertion:
    plain_statement_ja: 発達の遅れの早期発見では、すべての健診の機会に発達サーベイランスを行い、標準化された発達スクリーニング検査を生後9か月・18か月・30か月の健診で実施する体制が、米国小児科学会の臨床報告（2020）で示されている。サーベイランスで発達の懸念が得られた場合は、月齢を問わず、スクリーニング検査の実施または早期介入・専門医療への紹介に進める
    condition:
      region: 米国
      対象: 乳幼児
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3529
    source: 'Lipkin PH, Macias MM; Council on Children With Disabilities. Promoting Optimal Development: Identifying Infants and Young Children With Developmental Disorders Through Developmental Surveillance and Screening. Pediatrics. 2020;145(1):e20193449'
    doi: 10.1542/peds.2019-3449
    pmid: '31843861'
    pmcid: null
    url: https://doi.org/10.1542/peds.2019-3449
    source_license: 表示なし（American Academy of Pediatrics の著作物）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 本カードは米国の枠組みを示す。日本では母子保健法に基づく1歳6か月児健康診査と3歳児健康診査が法定健診であり、発達の確認はこれらの場でも行われる。本カードは発達の評価と早期発見の総論に留め、自閉スペクトラム症などの発達障害そのものの診断・療育は扱わない（Ⅱの範囲）
  curriculum:
    kokushi: 医学各論 Ⅰ-4-D（成長・発達の障害、a）
    core_curriculum: 'PS-02-12-01 (id: Jli53Ic)；TBL-02-11-023 (id: Jli6Jn8)；PS-02-12-04 (id: Jli53IM)'
