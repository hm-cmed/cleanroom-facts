- id: GR-003
  domain: GR
  subdomain: 成長・発達の障害
  assertion:
    plain_statement_ja: 発達の遅れの早期発見では、すべての健診の機会に発達サーベイランスを行い、標準化された発達スクリーニング検査を生後9か月・18か月・30か月の健診で実施する体制が、米国小児科学会の臨床報告（2020）で示されている。サーベイランスで発達の懸念が得られた場合は、月齢を問わず、スクリーニング検査の実施または早期介入・専門医療への紹介に進める
    condition:
      region: 米国
      対象: 乳幼児
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3529
    source: 'Lipkin PH, Macias MM; Council on Children With Disabilities. Promoting Optimal Development: Identifying Infants and Young Children With Developmental Disorders Through Developmental Surveillance and Screening. Pediatrics. 2020;145(1):e20193449'
    doi: 10.1542/peds.2019-3449
    pmid: '31843861'
    pmcid: null
    url: https://doi.org/10.1542/peds.2019-3449
    source_license: 表示なし（American Academy of Pediatrics の著作物）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: 自由に使える資料による裏づけ（GOV_US、作り手の調査 2026-11-08）：Centers for Disease Control and Prevention. Developmental Monitoring and Screening / Clinical Screening for Autism Spectrum Disorder（CDC公式ページ）（https://www.cdc.gov/autism/hcp/diagnosis/screening.html）。裏づける部分：発達スクリーニングを9・18・30か月で行う体制と、サーベイランスで懸念があれば月齢を問わず対応する枠組みがCDC資料でも示されていること。CDCのマイルストーン資料（https://www.cdc.gov/act-early/milestones/?msclkid=bce69c0da6c711ecb71bcd9f33a5d9fb）も同月齢を掲載。数値の照合：一致（月齢：カード9・18・30か月／CDC資料9・18・30か月）。自由に使える資料による裏づけ（GOV_US、作り手の調査バッチ98 2026-11-15）：CDC（National Center on Birth Defects and Developmental Disabilities）「Developmental Monitoring and Screening」（公式ページ、2026-02-16更新。参照文献1として主出典 Lipkin & Macias 2020 を明示）（https://www.cdc.gov/act-early/about/developmental-monitoring-and-screening.html）。裏づける部分：部分：候補（米国政府 CDC の公式ページ、GOV_US）は、主出典（Lipkin & Macias 2020）を参照文献1として明示したうえで、健診のたびに発達について確認し、到達の遅れや懸念があればスクリーニング検査を次の段階とする発達モニタリング（主出典のいうサーベイランスに相当）の進め方と、米国小児科学会（AAP）が標準化された発達スクリーニング検査を生後9か月・18か月・30か月の健診で実施するよう推奨していることをそのまま再掲し、懸念がある場合は予定の月齢以外でもスクリーニングを行うこと、発達の懸念が特定された場合は州の早期介入システムへの紹介・評価が次の段階であることを述べ、カードの主張の骨格（すべての健診の機会に発達サーベイランスを行うこと、標準化されたスクリーニングを9か月・18か月・30か月に実施する体制、懸念が得られた場合は月齢を問わずスクリーニングの実施または早期介入・専門医療への紹介に進めること）と一致する。ただし候補は保護者向けの平易な説明であり、AAP 臨床報告自身の推奨文の形（サーベイランスの構成要素の定義など）までは再掲がなく、サーベイランスに当たる概念は developmental monitoring の語で説明されている。数値の照合：スクリーニング実施月齢（生後9か月・18か月・30か月）は候補の再掲と完全一致する。留保：主出典 SRC-3529 は Crossref の版データにライセンス登録がなく、Europe PMC の個別レコードでも非 OA・PMC 未収載で、© AAP の著作物として現行 RESTRICTED が正しい（区分訂正なし）。識別子補完候補あり（識別子補完の節参照）。候補は米国政府の公式ページで、その内容は政府の全文として読める（GOV_US）
  uncertainty: 本カードは米国の枠組みを示す。日本では母子保健法に基づく1歳6か月児健康診査と3歳児健康診査が法定健診であり、発達の確認はこれらの場でも行われる。本カードは発達の評価と早期発見の総論に留め、自閉スペクトラム症などの発達障害そのものの診断・療育は扱わない（Ⅱの範囲）
