- id: GR-001
  domain: GR
  subdomain: 成長・発達の障害
  assertion:
    plain_statement_ja: 小児の成長の評価では、病歴と身体所見に加えて、身長・体重などの計測値を成長曲線上で経時的に追う評価（オークソロジー）が最も重要な方法である。低身長は小児内分泌医への紹介理由として最も頻度が高く、単一時点の身長だけでなく、成長の経過そのものを評価することが診断の出発点となる
    condition:
      region: 国際
      対象: 低身長・成長障害の評価を受ける小児
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1027
    source: 'Collett-Solberg PF, Ambler G, Backeljauw PF, et al. Diagnosis, Genetics, and Therapy of Short Stature in Children: A Growth Hormone Research Society International Perspective. Horm Res Paediatr. 2019;92(1):1-14'
    doi: 10.1159/000502231
    pmid: '31514194'
    pmcid: null
    url: https://doi.org/10.1159/000502231
    source_license: CC BY-NC-ND 4.0（Crossref・Europe PMC で確認）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 身長 −2 SDS 未満を低身長の目安とする定義は広く用いられるが、本出典について確認できた範囲（抄録）ではその文言を照合できなかったため、主張に数値は入れていない。日本で使われる標準成長曲線（国内標準値）との対応は本カードでは扱っていない。誌面発行は2019年で、2018年はオンライン先行の年である
  curriculum:
    kokushi: 医学各論 Ⅰ-4-D（成長・発達の障害、a）
    core_curriculum: 'PS-02-12-01 (id: Jli53Ic)；TBL-02-11-019 (id: Jli6Jng)；PS-02-12-04 (id: Jli53IM)'
  publication_info:
    created: '2026-10-31'
    verifier: null
    verified_at: null
    status: draft
    superseded_by: null
