- id: PG-017
  domain: PG
  subdomain: 前置胎盤、癒着胎盤
  assertion:
    plain_statement_ja: 癒着胎盤スペクトラム（癒着胎盤・嵌入胎盤・穿通胎盤を含む胎盤の病的付着）は、帝王切開の既往がもっとも多い危険因子で、その頻度は既往帝王切開の回数とともに増える。出生前に診断し、専門施設で陣痛や出血の発来前に分娩することが望ましく、一般にもっとも受け入れられた対応は、胎児娩出後に胎盤を子宮内に残したまま帝王切開と同時に子宮全摘を行う方法である。胎盤の剝離操作は大量出血のリスクを伴う
