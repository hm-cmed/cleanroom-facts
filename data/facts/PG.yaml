  subdomain: 妊娠悪阻
  assertion:
    plain_statement_ja: 妊娠悪阻の重症度は、PUQEやHELPなどの検証された指標で評価する。尿中ケトンは脱水の指標ではないため、重症度評価には用いない。制吐薬はH1受容体拮抗薬などを第一選択とし、オンダンセトロンは第一選択が効かない場合の第二選択として使用を控えるべきではない
