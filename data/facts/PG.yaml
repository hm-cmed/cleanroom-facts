  assertion:
    plain_statement_ja: 米国の周産期 HIV ガイドラインでは、分娩中も妊娠中の抗レトロウイルス療法（ART）を継続する。分娩近傍の HIV RNA が1,000 copies/mLを超える場合、不明な場合、または服薬不遵守が疑われる場合は分娩時にジドブジン静注を行い（予定帝王切開では少なくとも3時間前から開始する）、RNA が1,000 copies/mLを超えるか不明な場合は妊娠38週の予定帝王切開を行う。ART で分娩近傍にウイルス量が50 copies/mL未満に抑制されていれば、周産期感染は1%以下になる
