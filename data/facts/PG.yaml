- id: PG-025
  domain: PG
  subdomain: 胎盤機能不全
  assertion:
    plain_statement_ja: 胎盤由来の胎児発育不全の病態の中心は、妊娠初期の子宮螺旋動脈のリモデリング不全による胎盤の灌流不全である。灌流不全は胎盤組織の細胞ストレスを起こして蛋白合成の選択的抑制と細胞増殖の低下をもたらし、その結果、絨毛の体積と母児交換の表面積が減少する。
    condition:
      region: 国際
      対象: 胎盤機能不全を伴う妊娠
    differential: null
    common_misconception: null
  provenance:
