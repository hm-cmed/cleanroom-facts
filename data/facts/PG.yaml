    plain_statement_ja: SMFM は単胎の羊水過多を、最大羊水深度8cm以上またはAFI 24cm以上のいずれかで定義することを提案する（GRADE 2C）。軽症の羊水過多の多くは特発性だが、病的な原因として最も多いのは母体糖尿病と胎児形態異常である。羊水除去は、重症の羊水過多で母体の強い不快感や呼吸困難がある場合にのみ検討する（GRADE 1C）。
    condition:
      region: 米国
      対象: 羊水過多の妊婦
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3183
    source: 'Dashe JS, Pressman EK, Hibbard JU; Society for Maternal-Fetal Medicine. SMFM Consult Series #46: Evaluation and management of polyhydramnios. Am J Obstet Gynecol. 2018;219(4):B2-B8.'
    doi: 10.1016/j.ajog.2018.07.016
    pmid: '30048635'
    pmcid: null
    url: https://doi.org/10.1016/j.ajog.2018.07.016
    source_license: CC 表示なし・非OA（Elsevier）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: '定義と推奨は SMFM Consult Series #46 の抄録に基づき、推奨グレードは同文書の表記どおりである。同文書は羊水を減らす目的だけのインドメタシン使用を推奨しない（GRADE 1B）としているが、インドメタシンの羊水過多に対する国内の適応・保険適用は未確認であり、本カードは SMFM の推奨の紹介に留まる。'
