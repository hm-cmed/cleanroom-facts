- id: PG-027
  domain: PG
  subdomain: ハイリスク妊娠
  assertion:
    plain_statement_ja: 米国では母体ケアは基礎ケア（レベルI）、専門ケア（レベルII）、subspecialtyケア（レベルIII）、地域周産期医療センター（レベルIV）の4段階に層別化され、妊婦のリスクに応じた適切なケア（risk-appropriate care）を提供する体制が標準化されている。この層別化の目的は、母体の罹患・死亡とその格差の低減である。
