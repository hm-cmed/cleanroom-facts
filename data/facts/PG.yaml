    pmid: null
    pmcid: null
    url: null
    source_license: 学会の著作物（CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 内容は学会公式のパブリックコメント原案（2025-06-20）の CQ201 で確認した範囲であり、2026年版の刊行版本文での再照合は未了（書籍の ISBN・奥付も未確認）。制吐薬（ドパミン拮抗薬、H1受容体拮抗薬、5-HT3受容体拮抗薬など）は国内では保険適用になっていないものが多く、適応外使用となる（CQ201 解説）。ドキシラミンは国内未発売で、海外の第一選択（ビタミンB6とドキシラミンの併用）は国内ではそのまま実施できない
