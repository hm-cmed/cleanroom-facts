- id: PG-007
  domain: PG
  subdomain: 胞状奇胎
  assertion:
    plain_statement_ja: 胞状奇胎の除去後は、1〜2週ごとに血中hCGを測定して経過をみる。判別線の目安は除去術後5週で1,000 mIU/mL未満、8週で100 mIU/mL未満、24週でカットオフ値以下で、これを上回る場合は侵入奇胎や奇胎後hCG存続症を疑う。hCGがカットオフ値以下になった後も3〜4年間の二次管理を行う。全胞状奇胎では一次管理中に10〜20%で侵入奇胎などが続発する
    condition:
      region: 日本
      対象: 妊婦
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3161
    source: 日本産科婦人科学会／日本産婦人科医会 編・監修. 産婦人科診療ガイドライン 産科編 2026. 東京：日本産科婦人科学会、2026
    doi: null
    pmid: null
    pmcid: null
    url: null
    source_license: 学会の著作物（CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 国内の管理方式は絨毛性疾患取扱い規約第3版（2011、金原出版）に準じた運用で、内容は CQ207 のパブリックコメント原案で確認した（刊行版本文は未照合）。規約第3版の奥付・ISBN は未確認
