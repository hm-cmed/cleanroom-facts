- id: PG-031
  domain: PG
  subdomain: 絨毛膜羊膜炎
  assertion:
    plain_statement_ja: 羊膜内感染（絨毛膜羊膜炎）は、羊水・胎盤・胎児・卵膜・脱落膜のいずれかの組み合わせの感染とそれに伴う炎症であり、早産期・正期産のいずれにも起こるが、分娩中に見つかる症例の多くは正期産である。新生児側の合併症には肺炎、髄膜炎、敗血症、死亡が含まれ、母体側には分娩経過の異常とそれに伴う介入の増加、産後の子宮収縮不良と出血、子宮内膜炎、敗血症などが含まれる。羊膜内感染だけを理由とする帝王切開は、ほぼ適応にならない。
    condition:
      region: 米国
      対象: 分娩中の妊婦
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3185
    source: 'American College of Obstetricians and Gynecologists. Committee Opinion No. 712: Intrapartum Management of Intraamniotic Infection. Obstet Gynecol. 2017;130(2):e95-e101.'
    doi: 10.1097/AOG.0000000000002236
    pmid: '28742677'
    pmcid: null
    url: https://doi.org/10.1097/AOG.0000000000002236
    source_license: © ACOG（Crossref に CC 登録なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 定義と転帰は Committee Opinion No. 712 の抄録に基づく。臨床診断は母体発熱などの臨床所見に基づく診断であり、羊水培養や胎盤病理による確定診断とは区別される。具体的な診断基準の組み合わせは2024年の更新文書（PG-064）の範囲とし、本カードでは扱っていない。Committee Opinion No. 712 の再確認年は未確認である。
