  uncertainty: 数値は ACOG Practice Bulletin No. 181 の抄録に基づく。weak D 表現型の扱いなどの詳細は本文未照合である。抗D免疫グロブリンは国内でも承認された製剤があり（PG-056）、日本の投与場面と用法はそちらに基づく。感作後の胎児評価・治療は第48回 FT の範囲。
