- id: PG-005
  domain: PG
  subdomain: 流産、切迫流産
  assertion:
    plain_statement_ja: 流産の診断は原則として1回のみの検査では確定せず、1〜2週間以内の適切な間隔で複数回診察して診断する（経腟超音波で胎嚢平均径25mm以上で胎芽がない場合などは1度の検査で診断可能な精度とされる）。日本では妊娠12週未満の稽留流産・不全流産にミフェプリストンやミソプロストールなどの薬剤使用は認められておらず、管理は待機的管理か外科的治療（子宮内容除去術）となる。切迫流産については、薬物療法を含め流産予防効果が確立された治療法はない
    condition:
      region: 日本
      対象: 妊婦
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3161
    source: 日本産科婦人科学会／日本産婦人科医会 編・監修. 産婦人科診療ガイドライン 産科編 2026. 東京：日本産科婦人科学会、2026
    doi: null
    pmid: null
    pmcid: null
    url: null
    source_license: 学会の著作物（CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 内容はパブリックコメント原案の CQ202・CQ206 で確認した範囲で、刊行版本文は未照合。胎嚢平均径25mmの基準は CQ202 解説が引用する SRU の基準（Doubilet ら、2013）による。国内で承認されたミフェプリストン／ミソプロストール合剤（メフィーゴパック）の効能は人工妊娠中絶（妊娠63日以下）のみで、流産の管理は承認の範囲外である
