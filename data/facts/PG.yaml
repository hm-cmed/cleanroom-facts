- id: PG-033
  domain: PG
  subdomain: 耐糖能異常合併妊娠(妊娠糖尿病、糖尿病、妊娠中の明らかな糖尿病)
  assertion:
    plain_statement_ja: 妊娠中の糖代謝異常は妊娠糖尿病（GDM）、妊娠中の明らかな糖尿病、糖尿病合併妊娠の3つに分類される。GDM は75g経口ブドウ糖負荷試験で空腹時血糖92 mg/dL以上、1時間値180 mg/dL以上、2時間値153 mg/dL以上のいずれか1点以上を満たす場合に診断する。妊娠中の明らかな糖尿病は空腹時血糖126 mg/dL以上またはHbA1c 6.5%以上で診断する
