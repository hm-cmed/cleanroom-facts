  domain: PG
  subdomain: 流産、切迫流産
  assertion:
    plain_statement_ja: 早期妊娠喪失（無胚胎嚢または胎芽・胎児死亡が確認された妊娠）の薬物管理では、ミソプロストール800µgの腟投与の前にミフェプリストン200mgを経口投与すると、追加介入なしに胎嚢が排出される割合がミソプロストール単独より高かった（83.8%対67.1%、相対リスク1.25）。子宮内容除去術（吸引）の実施も前投与群で少なかった（8.8%対23.5%）
