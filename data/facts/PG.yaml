    doi: 10.1097/AOG.0000000000002983
    pmid: '30461695'
    pmcid: null
    url: https://doi.org/10.1097/AOG.0000000000002983
    source_license: ACOG（CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 米国のコンセンサス文書（2018）。超音波所見がなくても癒着胎盤スペクトラムを除外できないため、臨床的危険因子も超音波所見と同等に重要とされる
