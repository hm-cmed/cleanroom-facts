- id: PG-001
  domain: PG
  subdomain: 妊娠悪阻
  assertion:
    plain_statement_ja: 妊娠悪阻は全妊婦の0.5〜2%に発症する。治療では心身の安静と少量頻回の食事・水分補給を基本とし、脱水に対してはブドウ糖を含む輸液にビタミンB1（チアミン）を添加して十分に補液する（チアミン欠乏によるWernicke脳症の予防）。悪心の緩和にはビタミンB6の投与を検討する
    condition:
      region: 日本
      対象: 妊婦
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3161
    source: 日本産科婦人科学会／日本産婦人科医会 編・監修. 産婦人科診療ガイドライン 産科編 2026. 東京：日本産科婦人科学会、2026
