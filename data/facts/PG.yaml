    doi: 10.1016/j.ajog.2017.11.577
    pmid: '29422210'
    pmcid: null
    url: https://doi.org/10.1016/j.ajog.2017.11.577
    source_license: CC 表示なし・非OA（Elsevier）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 病態総説の抄録に基づく骨格であり、診断基準は扱っていない。胎盤機能不全に独立した国際ガイドラインは見当たらず、本項目は病態文献で構成した。胎児の発育評価・診断・分娩時期の管理は第48回 FT（Ⅰ-3-A-③）の範囲。
