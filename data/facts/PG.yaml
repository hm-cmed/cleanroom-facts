- id: PG-030
  domain: PG
  subdomain: 羊水過多症、羊水過少症
  assertion:
    plain_statement_ja: 羊水量の評価には AFI と最大羊水深度（MVP）が用いられるが、いずれも色素希釈法で測った実測羊水量との相関は弱い。妊娠後期の定義として、羊水過多は MVP 8cm超、羊水過少は MVP 2cm未満が受け入れられている。羊水過少を MVP 2cm未満で定義すると、AFI 5cm未満で定義する場合に比べて産科的介入が少なく、周産期転帰は同等であったことが無作為化試験で示されている。
