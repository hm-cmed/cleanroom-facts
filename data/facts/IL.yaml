    source_license: 未確認（BMC 誌。取得範囲にライセンス表示なし）
    legal_basis: B
    source_class: OPEN
    corroboration: null
  uncertainty: 施設・国は取得範囲で確認していない。初期のステロイド量と減量方法は抄録に記載がない。ライセンスは未確認
