- id: AX-018
  domain: AX
  subdomain: 転換症
  assertion:
    plain_statement_ja: 機能性神経障害は、除外診断ではなく、陽性徴候に基づいて診断する（rule-in）疾患である。運動型の22研究と発作型の27研究で、診断に用いる臨床徴候の特異度は64〜100%と報告されている。治療では、運動症状に対するリハビリテーション（理学療法・作業療法）と、各亜型にわたる心理療法が位置づけられる。
