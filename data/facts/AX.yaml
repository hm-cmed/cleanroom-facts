- id: AX-002
  domain: AX
  subdomain: パニック障害
  assertion:
    plain_statement_ja: 世界生物学的精神医学会連合（WFSBP）の不安症・強迫症・心的外傷後ストレス障害の治療ガイドライン Version 3 の Part I は、パニック障害と広場恐怖、全般性不安障害、社交不安障害などを対象とし、1,007件の無作為化比較試験を評価したうえで、SSRIとSNRIを第一選択の薬物療法、認知行動療法を第一選択の精神療法と位置づけている。
    condition:
      region: 国際
      対象: 不安症の成人患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3722
    source: 'Bandelow B, Allgulander C, Baldwin DS, et al. World Federation of Societies of Biological Psychiatry (WFSBP) guidelines for treatment of anxiety, obsessive-compulsive and posttraumatic stress disorders - Version 3. Part I: Anxiety disorders. World J Biol Psychiatry. 2023;24(2):79-117'
    doi: 10.1080/15622975.2022.2086295
    pmid: '35900161'
    pmcid: null
    url: https://doi.org/10.1080/15622975.2022.2086295
    source_license: CC 表示なし
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: WFSBPの推奨は国際的なエビデンスに基づくものであり、個別薬剤の国内適応とは一致しない。パニック障害の国内適応があるSSRIはセルトラリンとパロキセチンであり、エスシタロプラムとフルボキサミンにはパニック障害の国内適応がない（出典リサーチで患者向医薬品ガイド・添付文書を確認）。
