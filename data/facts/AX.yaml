- id: AX-004
  domain: AX
  subdomain: 全般性不安障害
  assertion:
    plain_statement_ja: 日本には全般性不安障害の診療ガイドラインがなく、臨床では多様な国際ガイドラインが使われている。精神科専門医を対象とした国内調査では、回答者の96.8%が全般性不安障害の治療にSSRIを使用し、79.2%がSSRIを第一選択としていた。日本における全般性不安障害の生涯有病率は2.6%と報告されている（世界精神保健調査に基づく値）。
    condition:
      region: 日本
      対象: 日本の全般性不安障害患者
    differential: null
    common_misconception: null
  provenance:
