- id: AX-003
  domain: AX
  subdomain: パニック障害
  assertion:
    plain_statement_ja: 広場恐怖を伴う・伴わないパニック障害の薬物治療に関するネットワークメタ解析（87試験、12,800例）では、三環系抗うつ薬、ベンゾジアゼピン系薬、モノアミン酸化酵素阻害薬、SSRI、SNRIがいずれもプラセボより有意に高い寛解率と関連していた。寛解と有害事象の両面からの順位付けでは、SSRIが高い寛解率と低い有害事象リスクを併せ持つ薬剤群として位置づけられた。
