- id: AX-022
  domain: AX
  subdomain: パニック症
  assertion:
    plain_statement_ja: パニック症（パニック障害）は、予期しないパニック発作が繰り返し起こることを中核とする。発作のうち少なくとも1回については、その後1か月以上にわたり、次のどちらか（または両方）が続くことが求められる。追加の発作が起こることや、その結果（コントロールを失う、心筋梗塞を起こす、気が狂うなど）についての持続的な心配、あるいは発作に関連した不適応的な行動の変化（発作を避けようとして運動や未知の状況を避けるなど）である。さらに、発作が物質（薬物・医薬品など）や他の身体疾患（甲状腺機能亢進症、心肺疾患など）の影響によるものではなく、他の精神疾患ではうまく説明できないことが求められる
    condition:
      region: 国際
      対象: パニック症の人
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-4976
    source: 'American Psychiatric Association. Diagnostic and Statistical Manual of Mental Disorders, Fifth Edition, Text Revision (DSM-5-TR). Washington, DC: American Psychiatric Association Publishing; 2022'
    doi: null
    pmid: null
    pmcid: null
    url: null
    source_license: 表示なし（書籍）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 書籍のため DOI・PMID はない。基準A（反復する予期しない発作）・基準B（1か月以上の心配または行動の変化）・基準C（物質・身体疾患の除外）・基準D（他の精神疾患による説明の除外）の構成は、DSM-5-TR の基準を転載した公的資料（カナダ退役軍人省 Anxiety Disorders EEG、2025年1月版）で照合した。本下書きでは書籍本文を直接照合していないため、登録時に本文で最終照合すること。症状の個別の数値（有病率など）は既存カード AX-008 が担い、本カードには含めていない。国内の診療ガイドライン2025（既存 AX-001）もパニック症を対象とするが、日本語名称「パニック症」の採用経緯そのものは本カードの主張に含めていない
