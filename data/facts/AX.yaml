- id: AX-021
  domain: AX
  subdomain: パニック症
  assertion:
    plain_statement_ja: パニック発作は、強い恐怖または強い不快感が突然高まり、数分以内にピークに達するもので、その間に次の13の症状のうち4つ以上が現れる。動悸・心悸亢進・心拍数の増加、発汗、身震いや震え、息切れ感や息苦しさ、窒息感、胸部の痛みや不快感、嘔気や腹部の不快感、めまい感・不安定感・頭がふらつく感じ・気が遠くなる感じ、悪寒や熱感、異常感覚（麻痺した感じやうずく感じ）、現実感消失（現実でない感じ）や離人感（自分から離れている感じ）、コントロールを失うのではないか・気が狂うのではないかという恐怖、死ぬのではないかという恐怖、である。発作は落ち着いている状態からでも、不安な状態からでも起こりうる。パニック発作そのものは独立した疾患ではなく、他の精神疾患にも付随しうる特定子（スペシファイア）として位置づけられる
    condition:
      region: 国際
      対象: パニック発作のある人
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-4976
    source: 'American Psychiatric Association. Diagnostic and Statistical Manual of Mental Disorders, Fifth Edition, Text Revision (DSM-5-TR). Washington, DC: American Psychiatric Association Publishing; 2022'
    doi: null
    pmid: null
    pmcid: null
    url: null
    source_license: 表示なし（書籍）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 書籍のため DOI・PMID はない。書誌は出典マスターの SRC-4976 の登録内容どおり（American Psychiatric Association Publishing、2022年）。13症状の列挙と「4つ以上」「数分以内にピーク」の構成は DSM-5-TR のパニック発作の基準を転載した公的資料（カナダ退役軍人省 Anxiety Disorders EEG、2025年1月版）で照合した。本下書きでは DSM-5-TR の書籍本文を直接照合していないため、登録時に本文で最終照合すること。文化特異的な症状（耳鳴り、首の痛み、頭痛、抑えられない叫び・号泣など）は必要な4症状には数えないとされる点は、主張には含めていない。13症状を基準の順にすべて列挙しており、DSM の診断基準の項目の選択・配列をそのまま写す形になっている。DSM 由来のカード（MD-009・014・015、SZ-011 など）を「構造だけを述べる」形に見直すときに、あわせて扱う（取り込み側の申し送り、2026-11-10）
