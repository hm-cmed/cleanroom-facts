- id: AX-002
  domain: AX
  subdomain: パニック障害
  assertion:
    plain_statement_ja: 世界生物学的精神医学会連合（WFSBP）の不安症・強迫症・心的外傷後ストレス障害の治療ガイドライン Version 3 の Part I は、パニック障害と広場恐怖、全般性不安障害、社交不安障害などを対象とし、1,007件の無作為化比較試験を評価したうえで、SSRIとSNRIを第一選択の薬物療法、認知行動療法を第一選択の精神療法と位置づけている。
