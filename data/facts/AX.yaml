- id: AX-024
  domain: AX
  subdomain: 社交不安障害
  assertion:
    plain_statement_ja: 社交不安障害は、他人に注視される可能性のある社交場面への、著しい恐怖や不安を中核とする。その場面には、初対面の人と会う・会話をするといった対人交流、人前で食べたり飲んだりするなど観察されること、人前で話すなどの行為が含まれる。中心にあるのは、自分の振る舞いや不安の表れが否定的に評価されること、すなわち恥をかく・困惑する・拒絶される・他人を不快にさせることへの恐れである。社交場面はほぼ常に恐怖や不安を引き起こし、避けられるか、強い恐怖を伴って耐えられる。恐怖は実際の脅威と釣り合いが取れておらず、6か月以上持続し、社会的・職業的な機能の障害や著しい苦痛を引き起こす。物質や他の身体疾患の影響によるものではなく、他の精神疾患ではうまく説明できないことが求められる
    condition:
