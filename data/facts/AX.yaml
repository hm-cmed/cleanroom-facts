- id: AX-001
  domain: AX
  subdomain: パニック障害
  assertion:
    plain_statement_ja: 日本不安症学会と日本神経精神薬理学会の合同委員会によるパニック症の診療ガイドライン（第1版、2025年）は、成人（18歳以上）のパニック症を対象とし、薬物療法では選択的セロトニン再取り込み阻害薬（SSRI）とセロトニン・ノルアドレナリン再取り込み阻害薬であるベンラファキシンをいずれも「弱い推奨（エビデンスの確実性は低）」として提案し、精神療法ではパニック症に特化した認知行動療法を習熟した治療者が行うことを提案している。薬物療法と精神療法のどちらが好ましいかについては推奨を示していない。
    condition:
      region: 日本
      対象: 成人のパニック症患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3721
    source: 日本不安症学会, 日本神経精神薬理学会. パニック症の診療ガイドライン. 不安症研究. 2025;17(1):22-111
    doi: 10.14389/jsad.17.1_22
    pmid: null
    pmcid: null
    url: https://doi.org/10.14389/jsad.17.1_22
    source_license: CC 表示なし（学会誌）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 現行版は第1.2版（2026年10月1日）で、改訂は診療報酬上の取扱いに関する記載の更新が中心であり、クリニカルクエスチョンへの推奨は更新されていない（学会公式ページで確認）。推奨されるベンラファキシンには国内ではパニック障害の適応がなく、国内効能はうつ病の範囲である（本パートでは添付文書の直接照合は行っていない）。パニック障害の国内適応があるSSRIはセルトラリンとパロキセチンである（出典リサーチで患者向医薬品ガイド・添付文書を確認）。
