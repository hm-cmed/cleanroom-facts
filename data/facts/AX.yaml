- id: AX-004
  domain: AX
  subdomain: 全般性不安障害
  assertion:
    plain_statement_ja: 日本には全般性不安障害の診療ガイドラインがなく、臨床では多様な国際ガイドラインが使われている。精神科専門医を対象とした国内調査では、回答者の96.8%が全般性不安障害の治療にSSRIを使用し、79.2%がSSRIを第一選択としていた。日本における全般性不安障害の生涯有病率は2.6%と報告されている（世界精神保健調査に基づく値）。
    condition:
      region: 日本
      対象: 日本の全般性不安障害患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3724
    source: 'Nomoto K, Takashio O, Matsuyama S, et al. Diagnosis and Treatment of Generalized Anxiety Disorder in Japan: Psychiatric Specialist Survey. Neuropsychiatr Dis Treat. 2024;20:1001-1010'
    doi: 10.2147/NDT.S456276
    pmid: '38764746'
    pmcid: null
    url: https://doi.org/10.2147/NDT.S456276
    source_license: CC BY-NC 4.0
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 全般性不安障害を効能とする国内承認薬は確認できておらず、SSRIの使用は適応外の位置づけになる。有病率2.6%は世界精神保健調査に基づく値として出典に記載されたものである。　【承認状況の再点検 2026-10-31（作り手、PMDA・厚生労働省などの公的情報）】ベンラファキシン（イフェクサーSRカプセル）が2026年3月に全般不安症の適応で国内初の承認を取得（PMDA審議結果報告書、2026年3月10日時点では「GADに対して適応を有している薬剤はない」と審査されていた）。「全般性不安障害を効能とする国内承認薬は確認できていない」は失効
  curriculum:
    kokushi: 医学各論 Ⅱ-3-A-②（全般性不安障害<全般不安症>、b）
    core_curriculum: 'PS-02-17-05 (id: JkxnuT8)；PS-02-17-02 (id: JkxnuTw)；TBL-02-16-002 (id: JlAKpy0)'
