    kokushi: 医学各論 Ⅱ-3-A-①（パニック障害<パニック症>、a）
    core_curriculum: 'PS-02-17-05 (id: JkxnuT8)；PS-02-17-02 (id: JkxnuTw)；TBL-01-00-545 (id: JlvnmUM)；TBL-02-16-002 (id: JlAKpy0)'
