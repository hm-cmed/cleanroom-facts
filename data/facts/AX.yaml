  subdomain: 強迫症
  assertion:
    plain_statement_ja: WFSBPガイドライン Version 3 の Part II によれば、強迫症の第一選択はSSRIと認知行動療法であり、インターネットを用いた認知行動療法も能動的対照より優れていた。第二選択にはクロミプラミンがあり、治療抵抗例ではSSRIへの抗精神病薬の増強などが選択肢となる。同ガイドラインは強迫症について291件の無作為化比較試験を評価対象とした。
    condition:
