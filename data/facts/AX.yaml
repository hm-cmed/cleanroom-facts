      region: 国際
      対象: パニック障害の成人患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3723
    source: 'Chawla N, Anothaisintawee T, Charoenrungrueangchai K, et al. Drug treatment for panic disorder with or without agoraphobia: systematic review and network meta-analysis of randomised controlled trials. BMJ. 2022;376:e066084'
    doi: 10.1136/bmj-2021-066084
    pmid: '35045991'
    pmcid: null
    url: https://doi.org/10.1136/bmj-2021-066084
    source_license: CC BY-NC 4.0
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 解析対象の薬剤には、国内でパニック障害の適応を持たない薬剤や国内未承認の薬剤が含まれる。国内でパニック障害の適応があるSSRIはセルトラリンとパロキセチンである。数値は出典の抄録で確認した。
