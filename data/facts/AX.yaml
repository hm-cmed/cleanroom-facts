- id: AX-019
  domain: AX
  subdomain: 身体的苦痛症
  assertion:
    plain_statement_ja: 機能性身体症状は、一般人口の約10%、臨床集団の成人患者の約3分の1にみられ、しばしば慢性化して機能と生活の質を障害する。対応は重症度に応じた段階的なものとされ、初期には基本的評価と安心の供与・助言、症状が持続する場合は身体面と心理社会面の同時評価と情報提供・セルフヘルプ、重症例では身体を対象とする精神療法を含む多面的な治療が行われる。生物心理社会モデルに基づく説明と共感的な態度、自己効力感を高める能動的な介入が中核とされる。
    condition:
      region: 欧州
      対象: 機能性身体症状のある成人患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3739
    source: Roenneberg C, Sattel H, Schaefert R, Henningsen P, Hausteiner-Wiehle C. Functional Somatic Symptoms. Dtsch Arztebl Int. 2019;116(33-34):553-560
    doi: 10.3238/arztebl.2019.0553
    pmid: '31554544'
    pmcid: null
    url: https://doi.org/10.3238/arztebl.2019.0553
    source_license: CC 表示は確認できなかった
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 出題基準の「身体的苦痛症」はICD-11のbodily distress disorderに対応する概念であり、本出典はドイツのS3ガイドラインに基づく「機能性身体症状」の枠組みで書かれており、概念の範囲は完全には一致しない。DSM-5の身体症状症とも区別される。ICD-11では心気症も身体的苦痛症の群に含まれる。身体的苦痛症を効能とする国内承認薬は確認できなかった。国内の診療ガイドラインは確認できなかった。
  curriculum:
    kokushi: 医学各論 Ⅱ-3-E-①（身体的苦痛症<身体症状症>、b）
