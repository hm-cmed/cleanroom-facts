  assertion:
    plain_statement_ja: 社交不安障害で恐怖の対象になる場面は、大きく3つの型に分けられる。会話をする・初対面の人に会うといった「対人交流」の場面、食事や飲水の様子などを見られる「観察される」場面、スピーチなど「人前で行為をする」場面である。恐怖が人前での行為（パフォーマンス）の場面に限られる「行為状況限定型（performance only）」という特定子もある。どの型でも、恐れの中心は場面そのものではなく、その場面で否定的に評価されることにある
