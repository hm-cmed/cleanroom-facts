    doi: 10.1136/bmj.o64
    pmid: '35074803'
    pmcid: null
    url: https://doi.org/10.1136/bmj.o64
    source_license: CC 表示なし
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 出題基準の転換<変換>症は、ICD-11の解離性神経学的症状症に対応し、現在の機能性神経障害と同一の枠組みで扱われる。転換症・機能性神経障害を効能とする国内承認薬は確認できなかった。
