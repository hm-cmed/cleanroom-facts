- id: AX-014
  domain: AX
  subdomain: 心的外傷後ストレス障害
  assertion:
    plain_statement_ja: 米国退役軍人省と米国国防総省のPTSD・急性ストレス障害の診療ガイドライン（2023年版）は34項目の推奨を含み、そのうちPTSDの治療に関する強い推奨は6項目である。PTSDの治療ではマニュアル化された精神療法を薬物療法より優先し、持続エクスポージャー療法、認知処理療法、眼球運動による脱感作と再処理法（EMDR）を推奨している。薬物療法ではパロキセチン、セルトラリン、ベンラファキシンが推奨され、ベンゾジアゼピン系薬と大麻・大麻由来製品は推奨されていない。
    condition:
      region: 米国
      対象: PTSDの成人患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3734
    source: 'Schnurr PP, Hamblen JL, Wolf J, et al. The Management of Posttraumatic Stress Disorder and Acute Stress Disorder: Synopsis of the 2023 U.S. Department of Veterans Affairs and U.S. Department of Defense Clinical Practice Guideline. Ann Intern Med. 2024;177(3):363-374'
    doi: 10.7326/M23-2757
    pmid: '38408360'
    pmcid: null
    url: https://doi.org/10.7326/M23-2757
    source_license: CC 表示なし
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: ガイドライン本体は米国政府資料であり、本カードはその要約論文に基づく。国内でPTSDの適応がある薬剤はセルトラリンとパロキセチンのみであり、ベンラファキシンには国内適応がない（ベンラファキシンの添付文書の直接照合は行っていない）。持続エクスポージャー療法は日本で2016年から保険収載されている（国内総説で確認）。
