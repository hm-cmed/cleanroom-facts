- id: NX-014
  domain: NX
  subdomain: 電気生理検査
  assertion:
    plain_statement_ja: 重症患者を対象とした持続脳波モニタリングの検討では、570例中19%に脳波上の発作が検出され、発作のあった患者の92%は臨床症候を伴わない非痙攣性の発作のみであった。発作の88%は記録開始後24時間以内に検出された。このため、痙攣性てんかん重積状態の後や原因不明の意識障害では、非痙攣性発作の検出には脳波モニタリングが必要であり、短時間の通常脳波で発作が記録されなくても非痙攣性発作を否定できない。
    condition:
      population: 重症患者（意識障害・てんかん重積状態の後など）
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1816
    source: Claassen J, Mayer SA, Kowalski RG, Emerson RG, Hirsch LJ. Detection of electrographic seizures with continuous EEG monitoring in critically ill patients. Neurology. 2004;62(10):1743-1748
    doi: 10.1212/01.wnl.0000125184.88797.62
    pmid: '15159471'
    pmcid: null
    url: https://doi.org/10.1212/01.wnl.0000125184.88797.62
    source_license: Neurology誌（American Academy of Neurology、CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 数値は単施設の連続症例の後ろ向き検討による。通常脳波のてんかん診断における感度・特異度そのものは本カードでは扱わない。
