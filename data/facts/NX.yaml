- id: NX-016
  domain: NX
  subdomain: 画像検査
  assertion:
    plain_statement_ja: 急性期脳梗塞の画像評価では、静脈内血栓溶解療法の適応を判断する前提として、非造影頭部 CT で頭蓋内出血を除外することが推奨される。頭部 CT は短時間で施行でき急性期出血の検出に適する一方、発症早期の虚血変化や後頭蓋窩の病変については、MRI の拡散強調画像の方が検出感度が高い。
    condition:
      population: 急性期脳梗塞が疑われる患者
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1582
    source: 'Powers WJ, Rabinstein AA, Ackerson T, et al. Guidelines for the Early Management of Patients With Acute Ischemic Stroke: 2019 Update. Stroke. 2019;50(12):e344-e418'
    doi: 10.1161/STR.0000000000000211
    pmid: '31662037'
    pmcid: null
    url: https://doi.org/10.1161/STR.0000000000000211
    source_license: AHA/ASAガイドライン（CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ72 2026-11-15）：Alshehri AA, Alkhrayef MN, Alzaidi R, et al. Stroke in Saudi Arabia: epidemiology, prevention, clinical management, and emerging innovations-a narrative review. Front Med. 2026;13:1837691（PMID: 43017436、DOI: 10.3389/fmed.2026.1837691、PMCID: PMC13752831、https://pmc.ncbi.nlm.nih.gov/articles/PMC13752831/）。裏づける部分：候補（CC BY 総説）が、非造影頭部 CT は急性期脳卒中の初期の画像検査として標準であり、出血性脳卒中・頭蓋内出血がないことを確認するために治療の第一歩として施行されること、短時間で施行でき広く利用できる一方、発症早期の虚血変化の検出感度は低いことを再掲する。カードの主張の前半（静脈内血栓溶解療法の適応判断の前提として非造影 CT で頭蓋内出血を除外する）と、CT の早期虚血変化への感度の低さと一致する。数値の照合：数値なし（画像選択の原則のカード）。留保：「発症早期の虚血変化や後頭蓋窩の病変については MRI の拡散強調画像の方が検出感度が高い」という明示は候補に再掲なし。主出典 SRC-1582 の区分は現行 RESTRICTED が正しい（Europe PMC で非OA、Crossref にライセンス登録なし）'
