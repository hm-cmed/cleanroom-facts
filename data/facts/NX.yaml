- id: NX-016
  domain: NX
  subdomain: 画像検査
  assertion:
    plain_statement_ja: 急性期脳梗塞の画像評価では、静脈内血栓溶解療法の適応を判断する前提として、非造影頭部 CT で頭蓋内出血を除外することが推奨される。頭部 CT は短時間で施行でき急性期出血の検出に適する一方、発症早期の虚血変化や後頭蓋窩の病変については、MRI の拡散強調画像の方が検出感度が高い。
    condition:
      population: 急性期脳梗塞が疑われる患者
      region: 国際
