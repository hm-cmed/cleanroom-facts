- id: NX-010
  domain: NX
  subdomain: 失神
  assertion:
    plain_statement_ja: 失神の初期評価で重篤な原因を示唆する高リスク所見（major）として、2018年の ESC ガイドラインは、労作中または仰臥位での失神、突然の動悸に引き続く失神、新規発症の胸部不快感・呼吸困難・腹痛・頭痛、重度の器質的心疾患または冠動脈疾患（心不全、低左室駆出率、心筋梗塞の既往）の存在、原因不明の収縮期血圧90mmHg未満、覚醒時に持続する徐脈（40/分未満、身体鍛錬によるものを除く）、未診断の収縮期雑音、心電図での急性虚血を示す変化や Mobitz II 型・III 度房室ブロックなどを挙げている。
    condition:
      population: 失神患者
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1813
    source: Brignole M, Moya A, de Lange FJ, et al.; ESC Scientific Document Group. 2018 ESC Guidelines for the diagnosis and management of syncope. Eur Heart J. 2018;39(21):1883-1948
    doi: 10.1093/eurheartj/ehy037
    pmid: '29562304'
    pmcid: null
    url: https://doi.org/10.1093/eurheartj/ehy037
    source_license: European Heart Journal（Oxford University Press、CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ72 2026-11-15）：Martone AM, Parrini I, Ciciarello F, et al. Recent Advances and Future Directions in Syncope Management: A Comprehensive Narrative Review. J Clin Med. 2024;13(3):727（PMID: 38337421、DOI: 10.3390/jcm13030727、PMCID: PMC10856004、https://pmc.ncbi.nlm.nih.gov/articles/PMC10856004/）。裏づける部分：候補の Table 3（高リスク失神の特徴）が 2018年 ESC ガイドラインの高リスク所見をほぼ全面的に再掲する：重篤な状態を示す徴候（胸痛、呼吸困難、腹痛、頭痛など）、器質的心疾患、仰臥位または労作中の失神、突然の動悸に引き続く失神、原因不明の血圧90mmHg未満、未診断の収縮期雑音、心電図の major 基準（急性虚血を示す変化、Mobitz II 型・III度房室ブロック、40/分未満の洞性徐脈など）。カードの主張（高リスク所見 major の抜粋）と一致する。数値の照合：閾値（収縮期血圧90mmHg未満、徐脈40/分未満）は候補と一致。留保：「重度の器質的心疾患または冠動脈疾患」の括弧内の内訳（心不全、低左室駆出率、心筋梗塞の既往）は候補では「器質的心疾患」と総称され、個別の再掲はない。主出典 SRC-1813 の区分は現行 RESTRICTED が正しい'
  uncertainty: 高リスク所見は同ガイドラインの表からの抜粋であり、全項目の列挙ではない。前駆症状がない・短い（10秒未満）こと、若年での突然死の家族歴、座位での失神は、器質的心疾患や心電図異常を伴う場合に高リスクとされる minor 所見である。
