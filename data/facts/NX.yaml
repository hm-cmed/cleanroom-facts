    condition:
      population: 意識障害のある患者
      region: 日本
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-4431
    source: 日本脳卒中学会 脳卒中ガイドライン委員会 編. 脳卒中治療ガイドライン2021〔改訂2025〕（第3版）. 協和企画. 2025（ISBN 978-4-87794-241-0）
    doi: null
    pmid: null
    pmcid: null
    url: null
    source_license: 書籍（学会の著作物、CC 表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ72 2026-11-15）：Yumoto T, Naito H, Yorifuji T, Aokage T, Fujisaki N, Nakao A. Association of Japan Coma Scale score on hospital arrival with in-hospital mortality among trauma patients. BMC Emerg Med. 2019;19:65（PMID: 31694575、DOI: 10.1186/s12873-019-0282-x、PMCID: PMC6836363、https://pmc.ncbi.nlm.nih.gov/articles/PMC6836363/）。裏づける部分：候補（CC BY の原著論文）が JCS の構成を再掲する：0（alert）と一桁・二桁・三桁のコードがそれぞれ「刺激しなくても覚醒」「刺激すると覚醒する（刺激をやめると戻る）」「強力な刺激でも覚醒しない」に対応し、各コードが 1・2・3／10・20・30／100・200・300 の3区分に分かれること、JCS 300 が GCS 3（E1V1M1）に相当すること。カードの主張（3-3-9度方式の構成と 300 は深昏睡に相当）と一致する。数値の照合：9区分（1・2・3、10・20・30、100・200・300）は候補とすべて一致。留保：主出典 SRC-4431（書籍）の区分は現行 RESTRICTED が正しい。JCS 原典（太田ら、1974年）の書誌が PubMed・Crossref で照合できない点はカードの uncertainty の記載どおりで、本バッチでも変わらない'
