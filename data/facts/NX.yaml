- id: NX-012
  domain: NX
  subdomain: 髄液検査
  assertion:
    plain_statement_ja: 細菌性髄膜炎が疑われる成人では、免疫不全状態、中枢神経系疾患の既往、発症前1週間以内の新規けいれん、うっ血乳頭、意識レベルの異常、局所神経脱落症状のいずれかがある場合に、腰椎穿刺の前に頭部 CT を行うことが IDSA のガイドラインで推奨されている。CT や腰椎穿刺のために治療開始が遅れる場合は、血液培養を採取した上で経験的な抗菌薬投与を先行させる。
    condition:
      population: 細菌性髄膜炎が疑われる成人
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1815
    source: Tunkel AR, Hartman BJ, Kaplan SL, et al. Practice guidelines for the management of bacterial meningitis. Clin Infect Dis. 2004;39(9):1267-1284
    doi: 10.1086/425368
    pmid: '15494903'
    pmcid: null
    url: https://doi.org/10.1086/425368
    source_license: Clinical Infectious Diseases誌（IDSA/Oxford University Press、CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 本カードは成人の基準であり、小児では同ガイドラインの小児用アルゴリズムで一部異なる。抗菌薬の具体的な薬剤名は挙げていない。
