- id: NX-009
  domain: NX
  subdomain: 失神
  assertion:
    plain_statement_ja: 2018年の ESC 失神ガイドラインでは、失神は反射性失神、起立性低血圧による失神、心原性失神の3つに分類される。反射性失神は悪心・発汗などの前駆症状や、長時間の立位・痛み・咳嗽・排尿などの誘因を伴いやすく、起立性低血圧による失神は立位での発症、降圧薬の開始・増量との時間的関係、自律神経障害やパーキンソニズムの存在が手がかりとなり、心原性失神は労作中・仰臥位での発症、発症直前の突然の動悸、器質的心疾患の存在が手がかりとなる。
    condition:
      population: 失神患者
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1813
    source: Brignole M, Moya A, de Lange FJ, et al.; ESC Scientific Document Group. 2018 ESC Guidelines for the diagnosis and management of syncope. Eur Heart J. 2018;39(21):1883-1948
    doi: 10.1093/eurheartj/ehy037
    pmid: '29562304'
    pmcid: null
    url: https://doi.org/10.1093/eurheartj/ehy037
    source_license: European Heart Journal（Oxford University Press、CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ72 2026-11-15）：Martone AM, Parrini I, Ciciarello F, et al. Recent Advances and Future Directions in Syncope Management: A Comprehensive Narrative Review. J Clin Med. 2024;13(3):727（PMID: 38337421、DOI: 10.3390/jcm13030727、PMCID: PMC10856004、https://pmc.ncbi.nlm.nih.gov/articles/PMC10856004/）。裏づける部分：候補（CC BY 総説）が 2018年 ESC ガイドラインに基づく分類を再掲する：反射性失神（血管迷走神経性＝痛み・恐怖などの情動が誘因、状況性＝咳嗽・排尿など、頸動脈洞症候群）、起立性低血圧による失神（自律神経障害の原因としてパーキンソン病などを挙げる）、心原性失神の三分法と各型の特徴。心原性の手がかり（労作中・仰臥位での発症、突然の動悸に引き続く発症、器質的心疾患）は候補の高リスク所見の表（Table 3）にも再掲がある。カードの主張の骨格と一致する。数値の照合：数値なし（分類と臨床的な手がかりのカード）。留保：反射性失神の前駆症状（悪心・発汗）の明示と、起立性低血圧による失神と降圧薬の開始・増量との時間的関係は、候補に直接の再掲なし。主出典 SRC-1813 の区分は現行 RESTRICTED が正しい（Crossref の版ライセンスは OUP の標準再利用条件へのリンクのみ、Europe PMC で非OA）'
  uncertainty: 起立性低血圧の診断には、起立後3分以内に収縮期血圧が20mmHg以上または拡張期血圧が10mmHg以上低下することを確認するのが同ガイドラインの採用する定義である。
