    doi: 10.1093/ptj/67.2.206
    pmid: '3809245'
    pmcid: null
    url: https://doi.org/10.1093/ptj/67.2.206
    source_license: Physical Therapy誌（CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ72 2026-11-15）：Retkowska-Tomaszewska N, Defort P, Barciszewska AM, Patkowski D. Intrathecal Baclofen in Children with Cerebral Palsy: A Critical Review of Selection Criteria, Rehabilitation Goals, Outcomes, and Complications. J Clin Med. 2026;15(11):4091（PMID: 42278952、DOI: 10.3390/jcm15114091、PMCID: PMC13257492、https://pmc.ncbi.nlm.nih.gov/articles/PMC13257492/）。裏づける部分：候補（CC BY の批判的総説）が Modified Ashworth Scale の段階表を再掲する：0＝筋緊張の亢進なし、1＝軽度の亢進（catch の後に残り可動域の半分未満の最小の抵抗）、1+＝catch の後に可動域の半分以上にわたる最小の抵抗、2＝より著明な亢進だが容易に動く、3＝著明な亢進で他動運動が困難、4＝罹患部が屈曲・伸展で硬直。カードの主張（0〜4、1+ を含む6段階、0と4の定義）と一致する。数値の照合：6段階の構成と両端の定義（0＝亢進なし、4＝硬直）は候補と一致。留保：主出典 SRC-1809 の区分は現行 RESTRICTED が正しい（Europe PMC で非OA、Crossref にライセンス登録なし）'
