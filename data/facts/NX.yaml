- id: NX-006
  domain: NX
  subdomain: 神経学的診察
  assertion:
    plain_statement_ja: 感覚診察は皮膚分節（デルマトーム）に沿って評価するのが原則で、脊髄損傷の神経学的分類の国際標準（ISNCSCI）では、C2からS4-5までの28のデルマトームごとに定められたキー感覚点において、軽触覚とピン痛覚（鋭・鈍の識別）を0（消失）・1（障害あり）・2（正常）の3段階で左右別に評価する。
    condition:
      population: 感覚障害のある患者
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1810
    source: Kirshblum SC, Burns SP, Biering-Sorensen F, et al. International standards for neurological classification of spinal cord injury (revised 2011). J Spinal Cord Med. 2011;34(6):535-546
    doi: 10.1179/204577211X13207446293695
    pmid: '22330108'
    pmcid: null
    url: https://doi.org/10.1179/204577211X13207446293695
    source_license: Journal of Spinal Cord Medicine（© American Spinal Injury Association、CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ72 2026-11-15）：Quinones C, Wilson JP, Kumbhare D, Guthikonda B, Hoang S. Clinical Assessment and Management of Acute Spinal Cord Injury. J Clin Med. 2024;13(19):5719（PMID: 39407779、DOI: 10.3390/jcm13195719、PMCID: PMC11477398、https://pmc.ncbi.nlm.nih.gov/articles/PMC11477398/）。裏づける部分：候補（CC BY 総説）が ISNCSCI の感覚検査を再掲する：軽触覚とピン痛覚（鋭・鈍の識別）を左右両側で評価し、28のデルマトームすべてを評価すること、感覚スコアは 0＝消失、1＝異常（低下または過敏）、2＝正常（頬の感覚との比較）の3段階であること（候補の Table 1）。カードの主張の骨格（デルマトームに沿った評価、28デルマトーム、2つのモダリティ、0・1・2の3段階、左右別）と一致する。数値の照合：28デルマトームと 0・1・2 のスコア定義は候補と一致。留保：「キー感覚点」という用語と、C2からS4-5までという範囲の端点は、候補に明示的な再掲なし。主出典 SRC-1810 の区分は現行 RESTRICTED が正しい（PMC 収載分 PMC3232636 は刊行版でライセンス表示なし）。識別子補完候補あり（補完候補の節参照）'
  uncertainty: ISNCSCI は脊髄損傷の分類のための標準化された評価法であり、デルマトーム評価の枠組みとして示した。デルマトームの分布には重なりと個人差がある。
