    doi: 10.1093/eurheartj/ehy037
    pmid: '29562304'
    pmcid: null
    url: https://doi.org/10.1093/eurheartj/ehy037
    source_license: European Heart Journal（Oxford University Press、CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 高リスク所見は同ガイドラインの表からの抜粋であり、全項目の列挙ではない。前駆症状がない・短い（10秒未満）こと、若年での突然死の家族歴、座位での失神は、器質的心疾患や心電図異常を伴う場合に高リスクとされる minor 所見である。
