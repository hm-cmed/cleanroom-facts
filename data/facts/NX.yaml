    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ72 2026-11-15）：Gulin J, Neudauer LM, Kejžar N, Bajrović FF, Collinet-Adler S, Stupica D. Presentation, Management, and Outcome of Tick-Borne Encephalitis in Patients Referred to Infectious Diseases or Neurology. J Clin Med. 2024;14(1):45（PMID: 39797129、DOI: 10.3390/jcm14010045、PMCID: PMC11722305、https://pmc.ncbi.nlm.nih.gov/articles/PMC11722305/）。裏づける部分：候補（CC BY の原著論文）が、腰椎穿刺の前に画像検査を行うべき所見として、うっ血乳頭、意識レベルの異常、局所神経脱落症状、新規発症のけいれんの4項目を明記し、その推奨が ESCMID の細菌性髄膜炎ガイドラインと整合すると述べる。カードが挙げる IDSA の基準6項目のうち4項目と一致する。数値の照合：数値なし（該当所見の有無で判断するカード）。6項目中4項目が候補と一致。留保：免疫不全状態と中枢神経系疾患の既往の2項目、および「血液培養を採取した上で経験的な抗菌薬投与を先行させる」という手順は、自由全文への再掲が見つからなかった。なお ESCMID ガイドライン自体（Clin Microbiol Infect. 2016）は Crossref の版ライセンスが Elsevier のオープンアクセス利用ライセンス（CC ではない）で、自由区分には当たらない。主出典 SRC-1815 の区分は現行 RESTRICTED が正しい'
