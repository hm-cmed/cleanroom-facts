- id: NX-001
  domain: NX
  subdomain: 神経学的診察
  assertion:
    plain_statement_ja: Glasgow Coma Scale（GCS）は、開眼（E：自発的に開眼する4点から無反応の1点までの4段階）、発語（V：見当識のある5点から無反応の1点までの5段階）、運動（M：命令に従う6点から無反応の1点までの6段階）の3要素で意識レベルを評価する尺度で、合計点は最低3点から最高15点の範囲をとる。
    condition:
      population: 意識障害のある患者
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1806
    source: Teasdale G, Jennett B. Assessment of coma and impaired consciousness. A practical scale. Lancet. 1974;2(7872):81-84
    doi: 10.1016/S0140-6736(74)91639-0
    pmid: '4136544'
    pmcid: null
    url: https://doi.org/10.1016/S0140-6736(74)91639-0
    source_license: The Lancet（Elsevier、テキストマイニング用ライセンスのみでCC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ72 2026-11-15）：Andraos C, Siddiqi A, Brazdzionis J, Siddiqi J. Limitations of the Glasgow Coma Scale: Challenges and Considerations. Cureus. 2025;17:e78900（PMID: 40091938、DOI: 10.7759/cureus.78900、PMCID: PMC11908630、https://pmc.ncbi.nlm.nih.gov/articles/PMC11908630/）。裏づける部分：候補（CC BY 総説）の Table 1 が GCS の全表を再掲する：開眼 4＝自発的に開眼〜1＝無反応、発語 5＝見当識あり〜1＝無反応、運動 6＝命令に従う〜1＝無反応の各段階と、合計点の重症度帯（13–15 軽症・9–12 中等症・3–8 重症）。カードの主張（3要素の段階構成と合計3〜15点）と一致する。数値の照合：各要素の上限・下限（E 4〜1、V 5〜1、M 6〜1）は候補と一致。合計の範囲 3〜15 は候補の重症度帯（3–8／9–12／13–15）から裏づけられる。留保：主出典 SRC-1806 の区分は現行 RESTRICTED が正しい（Crossref の版ライセンスは TDM のみ、Europe PMC でも非OA。区分訂正の節参照）'
  uncertainty: 1974年の原典の構成に基づく。日本では Japan Coma Scale も併用される（NX-002）。小児用などの派生版は本カードでは扱わない。
