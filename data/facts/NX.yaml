- id: NX-015
  domain: NX
  subdomain: 電気生理検査
  assertion:
    plain_statement_ja: 神経伝導検査では、脱髄型の末梢神経障害は、運動神経伝導速度の著明な低下、遠位潜時や F 波潜時の延長、伝導ブロックや時間的分散といった脱髄所見で特徴づけられ、軸索型ではこれらの脱髄所見を欠き、複合筋活動電位（CMAP）の振幅低下が主体となる。ギラン・バレー症候群の電気生理学的分類（Hadden らの基準）でも、運動神経伝導検査の所見に基づいて脱髄型・軸索型などに分類する。
    condition:
      population: 末梢神経障害が疑われる患者
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1817
    source: 'Hadden RD, Cornblath DR, Hughes RA, et al.; Plasma Exchange/Sandoglobulin Guillain-Barré Syndrome Trial Group. Electrophysiological classification of Guillain-Barré syndrome: clinical associations and outcome. Ann Neurol. 1998;44(5):780-788'
    doi: 10.1002/ana.410440512
    pmid: '9818934'
    pmcid: null
    url: https://doi.org/10.1002/ana.410440512
    source_license: Annals of Neurology誌（Wiley、CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ72 2026-11-15）：Chen YH, Wu CL, Weng WC, Wei YC. Predictors of the Short-Term Outcomes of Guillain-Barré Syndrome: Exploring Electrodiagnostic and Clinical Features. Brain Behav. 2025;15:e70257（PMID: 39832157、DOI: 10.1002/brb3.70257、PMCID: PMC11745152、https://pmc.ncbi.nlm.nih.gov/articles/PMC11745152/）。裏づける部分：候補（CC BY の原著研究）はギラン・バレー症候群のコホートで、伝導ブロックと時間的分散を「脱髄所見の代表的な特徴」と位置づけ、運動神経伝導速度の低下、F 波潜時の異常と併せて扱い、軸索側の指標として CMAP の低下を扱う。カードの主張（脱髄型は伝導速度の著明な低下・遠位潜時や F 波潜時の延長・伝導ブロック・時間的分散で特徴づけられ、軸索型は脱髄所見を欠き CMAP 振幅の低下が主体）の骨格と一致する。ギラン・バレー症候群の電気生理学的分類が Hadden らの基準に基づき運動神経伝導検査の所見で行われることは、別の CC BY 論文（Zhai Q, Guo C, Gao Z, Xue F. Re-evaluation of different electrophysiological criteria for Guillain-Barré syndrome in a single cohort from China. Front Neurol. 2026;17:1766901、PMC13013526）が同基準を用いた分類として再掲している。数値の照合：分類基準の具体的な数値カットオフはカードでも扱っておらず、照合対象なし。留保：遠位潜時の延長を脱髄の基準として明示する再掲は候補になく、Hadden 基準の数値の内訳は再評価論文の補足表の範囲で本文の再掲は限られる。主出典 SRC-1817 の区分は現行 RESTRICTED が正しい（Crossref の版ライセンスは Wiley の利用条件へのリンクのみ）'
  uncertainty: 分類基準の具体的な数値カットオフは用いる基準により異なり、本カードでは扱わない。針筋電図は神経原性変化と筋原性変化の鑑別や病期の評価に用いられるが、所見の詳細は各論を参照。
