- id: NX-009
  domain: NX
  subdomain: 失神
  assertion:
    plain_statement_ja: 2018年の ESC 失神ガイドラインでは、失神は反射性失神、起立性低血圧による失神、心原性失神の3つに分類される。反射性失神は悪心・発汗などの前駆症状や、長時間の立位・痛み・咳嗽・排尿などの誘因を伴いやすく、起立性低血圧による失神は立位での発症、降圧薬の開始・増量との時間的関係、自律神経障害やパーキンソニズムの存在が手がかりとなり、心原性失神は労作中・仰臥位での発症、発症直前の突然の動悸、器質的心疾患の存在が手がかりとなる。
    condition:
      population: 失神患者
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1813
    source: Brignole M, Moya A, de Lange FJ, et al.; ESC Scientific Document Group. 2018 ESC Guidelines for the diagnosis and management of syncope. Eur Heart J. 2018;39(21):1883-1948
    doi: 10.1093/eurheartj/ehy037
    pmid: '29562304'
    pmcid: null
    url: https://doi.org/10.1093/eurheartj/ehy037
    source_license: European Heart Journal（Oxford University Press、CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 起立性低血圧の診断には、起立後3分以内に収縮期血圧が20mmHg以上または拡張期血圧が10mmHg以上低下することを確認するのが同ガイドラインの採用する定義である。
  curriculum:
    kokushi: null
    core_curriculum: 'PS-02-03-02 (id: JkxnuPo)；TBL-02-02-021 (id: JlAKpYw)'
