- id: NX-014
  domain: NX
  subdomain: 電気生理検査
  assertion:
    plain_statement_ja: 重症患者を対象とした持続脳波モニタリングの検討では、570例中19%に脳波上の発作が検出され、発作のあった患者の92%は臨床症候を伴わない非痙攣性の発作のみであった。発作の88%は記録開始後24時間以内に検出された。このため、痙攣性てんかん重積状態の後や原因不明の意識障害では、非痙攣性発作の検出には脳波モニタリングが必要であり、短時間の通常脳波で発作が記録されなくても非痙攣性発作を否定できない。
    condition:
      population: 重症患者（意識障害・てんかん重積状態の後など）
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1816
    source: Claassen J, Mayer SA, Kowalski RG, Emerson RG, Hirsch LJ. Detection of electrographic seizures with continuous EEG monitoring in critically ill patients. Neurology. 2004;62(10):1743-1748
    doi: 10.1212/01.wnl.0000125184.88797.62
    pmid: '15159471'
    pmcid: null
    url: https://doi.org/10.1212/01.wnl.0000125184.88797.62
    source_license: Neurology誌（American Academy of Neurology、CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ72 2026-11-15）：Bitar R, Khan UM, Rosenthal ES. Utility and rationale for continuous EEG monitoring: a primer for the general intensivist. Crit Care. 2024;28:244（PMID: 39014421、DOI: 10.1186/s13054-024-04986-0、PMCID: PMC11251356、https://pmc.ncbi.nlm.nih.gov/articles/PMC11251356/）。裏づける部分：候補（CC BY 総説）が持続脳波モニタリングの根拠として、570例を対象とした検討で19%に発作が検出されたことを再掲し、24時間の記録で非痙攣性発作の88%が検出されると述べる。痙攣性てんかん重積状態の後や原因不明の意識障害ではモニタリングが必要で、短時間の通常脳波で発作が記録されなくても非痙攣性発作を否定できないという候補の趣旨は、カードの結論と一致する。数値の照合：570例・19% は候補と一致。88% は候補では「24時間の記録による非痙攣性発作の検出割合」という表現で、カードの「発作の88%は記録開始後24時間以内に検出」と枠組みがやや異なる。発作のあった患者の92%は非痙攣性の発作のみだったという値は候補に再掲なし。留保：主出典 SRC-1816 の区分は現行 RESTRICTED が正しい（Europe PMC で非OA、Crossref にライセンス登録なし）'
  uncertainty: 数値は単施設の連続症例の後ろ向き検討による。通常脳波のてんかん診断における感度・特異度そのものは本カードでは扱わない。
  curriculum:
