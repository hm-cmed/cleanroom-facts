  assertion:
    plain_statement_ja: Modified Ashworth Scale は、痙縮の程度を他動運動時の筋緊張から0（筋緊張の亢進なし）から4（罹患部が屈曲・伸展のいずれでも硬直している）までの、1+ を含む6段階で評価する尺度である。
