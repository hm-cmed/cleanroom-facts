- id: NX-010
  domain: NX
  subdomain: 失神
  assertion:
    plain_statement_ja: 失神の初期評価で重篤な原因を示唆する高リスク所見（major）として、2018年の ESC ガイドラインは、労作中または仰臥位での失神、突然の動悸に引き続く失神、新規発症の胸部不快感・呼吸困難・腹痛・頭痛、重度の器質的心疾患または冠動脈疾患（心不全、低左室駆出率、心筋梗塞の既往）の存在、原因不明の収縮期血圧90mmHg未満、覚醒時に持続する徐脈（40/分未満、身体鍛錬によるものを除く）、未診断の収縮期雑音、心電図での急性虚血を示す変化や Mobitz II 型・III 度房室ブロックなどを挙げている。
    condition:
      population: 失神患者
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1813
