- id: NX-015
  domain: NX
  subdomain: 電気生理検査
  assertion:
    plain_statement_ja: 神経伝導検査では、脱髄型の末梢神経障害は、運動神経伝導速度の著明な低下、遠位潜時や F 波潜時の延長、伝導ブロックや時間的分散といった脱髄所見で特徴づけられ、軸索型ではこれらの脱髄所見を欠き、複合筋活動電位（CMAP）の振幅低下が主体となる。ギラン・バレー症候群の電気生理学的分類（Hadden らの基準）でも、運動神経伝導検査の所見に基づいて脱髄型・軸索型などに分類する。
    condition:
      population: 末梢神経障害が疑われる患者
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1817
    source: 'Hadden RD, Cornblath DR, Hughes RA, et al.; Plasma Exchange/Sandoglobulin Guillain-Barré Syndrome Trial Group. Electrophysiological classification of Guillain-Barré syndrome: clinical associations and outcome. Ann Neurol. 1998;44(5):780-788'
    doi: 10.1002/ana.410440512
    pmid: '9818934'
    pmcid: null
    url: https://doi.org/10.1002/ana.410440512
    source_license: Annals of Neurology誌（Wiley、CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 分類基準の具体的な数値カットオフは用いる基準により異なり、本カードでは扱わない。針筋電図は神経原性変化と筋原性変化の鑑別や病期の評価に用いられるが、所見の詳細は各論を参照。
