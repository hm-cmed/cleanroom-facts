- id: NX-013
  domain: NX
  subdomain: 髄液検査
  assertion:
    plain_statement_ja: 正常の脳脊髄液は無色透明で、初圧は70〜180mmH2O、細胞数は5/mm³以下で単核球が主体、蛋白は15〜45mg/dL、糖は50〜80mg/dLであり、髄液糖/血糖比は約0.6である。細菌性髄膜炎では髄液は混濁し、細胞数は1000/mm³以上で多形核球が優位となり、蛋白は上昇し、糖は低下して、髄液糖/血糖比が0.4以下になると細菌性を強く疑う。ウイルス性髄膜炎では細胞数の増加は単核球優位で、糖はほぼ正常に保たれるのが典型である。
    condition:
      population: 髄液検査を受ける患者
      region: 日本
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1638
    source: 日本神経学会・日本神経治療学会・日本神経感染症学会 監修、「細菌性髄膜炎診療ガイドライン」作成委員会 編『細菌性髄膜炎診療ガイドライン2014』南江堂. 2014
    doi: null
    pmid: null
    pmcid: null
    url: null
    source_license: 学会ガイドライン（書籍、CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 基準値と所見の型は同ガイドラインに掲載された標準的な髄液所見表に基づく。新生児・乳児では基準値が異なる。海外ガイドライン（IDSA）の示す細菌性髄膜炎の典型値（初圧200〜500mmH2O、白血球1000〜5000/mm³、蛋白100〜500mg/dL）とも大枠で一致する。
  curriculum:
    kokushi: null
