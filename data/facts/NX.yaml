- id: NX-008
  domain: NX
  subdomain: 意識障害
  assertion:
    plain_statement_ja: 昏睡の原因は、構造性の脳病変、びまん性の神経機能障害（代謝性・中毒性など）、まれに精神科的原因に大別される。初期対応ではまず生命を脅かす状態を安定化させ、続いて病歴・身体診察・検査所見から治療可能な原因を系統的に検索する。低血糖による昏睡はブドウ糖投与に速やかに反応する一方、治療可能な原因であっても診断と治療が遅れれば不可逆的な脳障害に至りうるため、非痙攣性てんかん重積状態、中毒・感染症、内分泌異常、チアミン欠乏などを見落とさない系統的な確認が重要である。
    condition:
      population: 昏睡・意識障害の患者
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1812
    source: Edlow JA, Rabinstein A, Traub SJ, Wijdicks EFM. Diagnosis of reversible causes of coma. Lancet. 2014;384(9959):2064-2076
    doi: 10.1016/S0140-6736(13)62184-4
    pmid: '24767707'
    pmcid: null
    url: https://doi.org/10.1016/S0140-6736(13)62184-4
    source_license: The Lancet（Elsevier、CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: AIUEO TIPS のような古典的ニーモニックの原典は一次資料で確認できなかったため、本カードは総説が示す構造化された評価の枠組みに基づく。ブドウ糖製剤の用量や製品別の国内承認・保険適用の状況は本カードでは扱わない。個別の原因疾患の診断・治療は各論のカードを参照。
  curriculum:
