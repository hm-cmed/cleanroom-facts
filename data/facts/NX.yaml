- id: NX-004
  domain: NX
  subdomain: 神経学的診察
  assertion:
    plain_statement_ja: 徒手筋力検査で用いられる Medical Research Council（MRC）スケールは、筋力を0（筋収縮なし）から5（正常な筋力）までの6段階で評価する尺度で、3は重力に抗して関節を動かせる段階、4は重力に加えて抵抗にも抗して動かせる段階に相当する。
    condition:
      population: 筋力低下のある患者
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1808
    source: Paternostro-Sluga T, Grim-Stieger M, Posch M, et al. Reliability and validity of the Medical Research Council (MRC) scale and a modified scale for testing muscle strength in patients with radial palsy. J Rehabil Med. 2008;40(8):665-671
    doi: 10.2340/16501977-0235
    pmid: '19020701'
    pmcid: null
    url: https://doi.org/10.2340/16501977-0235
    source_license: Journal of Rehabilitation Medicine（CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ72 2026-11-15）：Alder KD, Pulos N, Shin AY. Outcome of Radial Nerve Palsy in Closed Humeral Shaft Fractures Treated Operatively and Expectantly. J Hand Surg Glob Online. 2026;8(6):101091（PMID: 42604041、DOI: 10.1016/j.jhsg.2026.101091、PMCID: PMC13476691、https://pmc.ncbi.nlm.nih.gov/articles/PMC13476691/）。裏づける部分：候補（CC BY の原著論文）の Table 1 が modified British Medical Research Council スケールの全段階を定義付きで再掲する：0＝触知できる収縮なし、1＝触知できる収縮、2＝重力を除去すれば動く、3＝重力に抗して全可動域を動ける、4＝重力と抵抗に抗して全可動域を動ける、5＝正常な筋力。カードの主張（0〜5の6段階、3は重力に抗する段階、4は抵抗にも抗する段階、5は正常）と一致する。数値の照合：段階の定義は候補と一致（3＝重力に抗して動ける、4＝抵抗にも抗する、5＝正常）。留保：候補の表の表記は modified BMRC だが、段階の定義はカードの MRC スケール原法と同一である。主出典 SRC-1808 の区分は現行 RESTRICTED が正しい（Europe PMC で非OA、Crossref にライセンス登録なし）'
