- id: NX-011
  domain: NX
  subdomain: 頭痛
  assertion:
    plain_statement_ja: 二次性頭痛を見落とさないための危険徴候を体系化した SNNOOP10 リストは、発熱などの全身症状、腫瘍の既往、神経学的異常（意識レベルの低下を含む）、突然の発症、高齢になってからの新規発症、頭痛のパターンの変化または最近発症した新しい頭痛、体位性の頭痛、くしゃみ・咳・運動で誘発される頭痛、うっ血乳頭、進行性の頭痛や非典型的な経過、妊娠・産褥期、眼痛と自律神経症状の合併、外傷後の発症、HIV など免疫系の病態、鎮痛薬の過剰使用または頭痛発症と時期を同じくする新規薬剤、の15項目を挙げている。
    condition:
      population: 頭痛患者
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1814
    source: 'Do TP, Remmers A, Schytz HW, et al. Red and orange flags for secondary headaches in clinical practice: SNNOOP10 list. Neurology. 2019;92(3):134-144'
