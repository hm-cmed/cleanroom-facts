- id: NX-001
  domain: NX
  subdomain: 神経学的診察
  assertion:
    plain_statement_ja: Glasgow Coma Scale（GCS）は、開眼（E：自発的に開眼する4点から無反応の1点までの4段階）、発語（V：見当識のある5点から無反応の1点までの5段階）、運動（M：命令に従う6点から無反応の1点までの6段階）の3要素で意識レベルを評価する尺度で、合計点は最低3点から最高15点の範囲をとる。
    condition:
      population: 意識障害のある患者
      region: 国際
    differential: null
    common_misconception: null
  provenance:
