- id: OX-003
  domain: OX
  subdomain: 特殊健康診断と労働衛生管理の枠組み
  assertion:
    plain_statement_ja: 労働安全衛生法第66条に基づく健康診断には、一般健康診断（雇入時、1年以内ごとの定期、特定業務従事者の健診、海外派遣労働者の健診等）と特殊健康診断がある。特殊健康診断は、じん肺、有機溶剤、鉛、特定化学物質、電離放射線、高圧作業、石綿などを対象とし、原則として雇入・配置替え時とその後6月以内ごとに実施される。健康診断個人票の保存期間は健診の種類によって異なり、原則5年である一方、電離放射線は30年、石綿は40年と定められている。労働衛生管理の枠組みは、作業環境管理・作業管理・健康管理の3管理を柱とする。
    condition:
      region: 日本
      対象: 労働者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-4142
    source: 岡山労働局（厚生労働省）. 健康診断の種類及び報告義務
    doi: null
    pmid: null
    pmcid: null
    url: null
    source_license: 政府標準利用規約
    legal_basis: B
    source_class: GOV_JP
    corroboration: null
  uncertainty: 特殊健康診断の対象業務と頻度には業務ごとの例外があり、本カードは枠組みの範囲に限る。個別の物質・業務の健診項目の詳細は各規則による。
  curriculum:
    kokushi: null
    core_curriculum: 'SO-01-04-01 (id: JkxoNtY)；SO-01-04-02 (id: JkxoNtc)'
