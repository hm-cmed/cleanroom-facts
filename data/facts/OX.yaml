- id: OX-004
  domain: OX
  subdomain: 労災補償の枠組み
  assertion:
    plain_statement_ja: 労働者災害補償保険法は、業務上の事由、複数事業労働者の複数業務要因、または通勤による労働者の負傷、疾病、障害もしくは死亡に対して、迅速かつ公正な保護を図ることを目的とし（第1条）、政府が管掌する保険制度である（第2条）。保険給付は、業務災害に関する保険給付、複数業務要因災害に関する保険給付、通勤災害に関する保険給付および二次健康診断等給付からなる（第7条）。
    condition:
      region: 日本
      対象: 労働者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-4143
    source: 労働者災害補償保険法（昭和22年法律第50号）
    doi: null
    pmid: null
    pmcid: null
    url: null
    source_license: 法令の条文（著作権法第13条により権利の対象とならない）
    legal_basis: B
    source_class: GOV_JP
    corroboration: null
  uncertainty: 個別疾患の認定基準（脳・心臓疾患、精神障害等）は通達によるものであり、本カードは法律の枠組みに限る。認定の側面は第56回（OC）が担う。
