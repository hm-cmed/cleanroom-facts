- id: OX-002
  domain: OX
  subdomain: 職業性疾患の診断の考え方（曝露歴の聴取と業務起因性の判断）
  assertion:
    plain_statement_ja: 職業性疾患の業務起因性の評価は、まず疾患の診断を確定し、次に曝露を評価し、そのうえで業務起因性を評価するという順序で進められる。因果関係の判断は決定的ではなく確率的に行われ、絶対的な判断基準は存在しない。疫学知見の不整合、発症機序の未確立、客観的な職歴資料の喪失、症例の複雑さが評価を難しくする要因であり、疑わしい症例については合理的な論理と文献に基づく個別の詳細な検討が必要とされる。
    condition:
      region: 国際
      対象: 職業性疾患が疑われる患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-4141
    source: 'Kim K, Kim J. A work-relatedness assessment in epidemiological case investigation of occupational cancers: I. Principles. Ann Occup Environ Med. 2020;32:e30'
    doi: 10.35371/aoem.2020.32.e30
    pmid: '33072341'
    pmcid: PMC7533286
    url: https://doi.org/10.35371/aoem.2020.32.e30
    source_license: CC BY-NC 4.0
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN／OPEN／OPEN、作り手の調査バッチ99 2026-11-15）：Kim EA, Lee E, Kang SK, Jeong M. Probability of causation for occupational cancer after exposure to ionizing radiation. Ann Occup Environ Med. 2018;30:3／Song J, Woo KH, Kim YH. Guidelines for recognition of occupational cancers in Korea: the results of scientific review by Korean Society of Occupational and Environmental Medicine (2013–2016). Ann Occup Environ Med. 2018;30:12／Kim HR, Kim B, Jo BS, Lee JW. Silica exposure and work-relatedness evaluation for occupational cancer in Korea. Ann Occup Environ Med. 2018;30:4（PMID: 29435338／29456866／29423227、DOI: 10.1186/s40557-018-0220-5／10.1186/s40557-018-0223-2／10.1186/s40557-018-0216-1、PMCID: PMC5791729／PMC5809845／PMC5791359、https://creativecommons.org/licenses/by/4.0/）。裏づける部分：部分：候補1（CC BY、放射線による職業性がんの原因確率（probability of causation、PC／assigned share）の総説）は、職業性がんの因果関係が確率的に推定されるものであること、補償の判断に確率的な基準（概ね PC 50%超）が使われることを述べ、カードの「因果関係の判断は決定的ではなく確率的に行われる」の要素を放射線領域で再掲する。また、客観的な曝露レベルのデータがないために業務起因性を判断できなかった症例を挙げ、カードの困難要因のうち「客観的な職歴資料の喪失」と重なる。候補2（CC BY、韓国の職業性がん認定ガイドライン特集の総説）は、迅速で公正な補償には認定基準が必要である一方、発がん要因についての情報（曝露の期間・濃度など）が十分でないことを述べ、評価の困難さの要素を裏づける。候補3（CC BY、結晶シリカの業務起因性評価）は、個別の肺がん症例が症例ごとに疫学調査の対象となる運用と、疫学知見の不整合（シリカと胃がんの関連について研究間で結論が異なること）を述べ、「疑わしい症例については個別の詳細な検討が必要」と「疫学知見の不整合」の要素をシリカ領域で裏づける。ただし、評価の順序そのもの（疾患の診断を確定し、次に曝露を評価し、そのうえで業務起因性を評価する）、「絶対的な判断基準は存在しない」という表明、発症機序の未確立・症例の複雑さという困難要因の列挙は、いずれの候補にも再掲がない。数値の照合：数値的主張はカードにない。候補1の「PC 50%超」は放射線領域の補償運用の閾値であり、カードの主張の数値として裏づけ登録しないこと（申し送り参照）。留保：主出典 SRC-4141 は刊行版ライセンスが CC BY-NC 4.0（Crossref の版データ・Europe PMC の個別レコード・PMC 全文のライセンス要素で個別確認）で、現行 RESTRICTED が正しい（区分訂正なし）。カード側の source_license「CC BY-NC 4.0」の記載も実態と一致する。同じ Ann Occup Environ Med でも 2018年の候補3件は刊行版が CC BY 4.0 であり、誌単位ではなく論文ごとにライセンスを確認した。主出典の続編（Part II. Practice、PMC7533287）は刊行版が CC BY-NC 4.0 のため候補にしていない'
  uncertainty: 職業性がんの疫学調査における評価原則を整理した総説に基づく枠組みである。個別疾患の労災認定基準（通達）の側面は第56回（OC）が担う。
