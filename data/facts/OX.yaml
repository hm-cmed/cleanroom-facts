- id: OX-005
  domain: OX
  subdomain: 環境曝露の評価とリスク
  assertion:
    plain_statement_ja: 環境省による化学物質の環境リスク初期評価は、有害性評価、曝露評価、リスクの初期評価の3段階で進められる。閾値がある物質の健康リスクは、曝露量と有害性評価値の比である MOE（曝露マージン）で判定され、MOE が10未満であれば詳細な評価の候補、10以上100未満であれば情報収集の対象、100以上であれば現時点で対応は不要と整理される。評価には、より低用量の有害性データや最大の検出濃度を用いるなど保守的な前提が置かれ、第24次取りまとめまでに健康リスクで334物質、生態リスクで430物質が累積して評価されている。
    condition:
      region: 日本
      対象: 化学物質の環境リスク評価
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-4144
    source: 環境省. 化学物質の環境リスク初期評価 第24次取りまとめ（2025年、『化学物質の環境リスク評価』第24巻）
    doi: null
    pmid: null
    pmcid: null
    url: null
    source_license: 政府標準利用規約
    legal_basis: B
    source_class: GOV_JP
    corroboration: null
  uncertainty: 一般環境における環境経由の曝露を対象とする評価枠組みであり、職業曝露の評価とは対象が異なる。第24次では健康リスク1物質、生態リスク2物質が新たに詳細な評価の候補とされた。
