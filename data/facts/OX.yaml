- id: OX-001
  domain: OX
  subdomain: 中毒の初期対応と解毒薬の総論
  assertion:
    plain_statement_ja: 活性炭による消化管除染は、中等症から生命を脅かす中毒に対して適応となり、摂取後できるだけ速やかに、原則として1時間以内（徐放性製剤では6時間まで）に投与する。用量は成人で50 g、小児で0.5〜1 g/kgが目安とされる。気道が確保されていない意識障害の患者では誤嚥の危険のため禁忌であり、酸・アルカリ、アルコール類、有機溶剤、無機塩類、金属には無効ないし不十分である。下剤とのルーチンの併用は推奨されない。
    condition:
      region: 国際
      対象: 急性中毒患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-4140
    source: Zellner T, Prasa D, Färber E, et al. The Use of Activated Charcoal to Treat Intoxications. Dtsch Arztebl Int. 2019;116(18):311-317
    doi: 10.3238/arztebl.2019.0311
    pmid: '31219028'
    pmcid: PMC6620762
    url: https://doi.org/10.3238/arztebl.2019.0311
    source_license: 全文は PMC で公開されているが、CC ライセンス表示は確認できなかった
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ99 2026-11-15）：Albertson TE, Owen KP, Sutter ME, Chan AL. Gastrointestinal decontamination in the acutely poisoned patient. Int J Emerg Med. 2011;4:65（PMID: 21992527、DOI: 10.1186/1865-1380-4-65、PMCID: PMC3207879、https://creativecommons.org/licenses/by/2.0/）。裏づける部分：部分：候補（CC BY 総説）は、米国臨床中毒学会（AACT）と欧州毒物センター・臨床中毒学会（EAPCCT）のポジションペーパーを引いて、単回活性炭は投与するなら摂取後1時間以内が最も利益が大きく、効果は時間とともに低下すると述べ、カードの「摂取後できるだけ速やかに、原則として1時間以内」の骨格と一致する。また下剤について、ポジションステートメントが活性炭とのルーチンの併用を支持しないことを再掲し、カードの「下剤とのルーチンの併用は推奨されない」と一致する。複数回活性炭は保護された／無傷の気道の患者に限るとし、気道確保と誤嚥リスクの枠組みにも触れる。活性炭に十分に結合しない物質として電解質・金属を挙げる（全腸洗浄の文脈）。ただし、適応の重症度（中等症から生命を脅かす中毒）、用量（成人50 g・小児0.5〜1 g/kg）、徐放性製剤では6時間までとする窓、無効ないし不十分な物質の列挙（酸・アルカリ、アルコール類、有機溶剤、無機塩類、金属）の全体、単回投与で気道が確保されていない意識障害を禁忌とする明示は、候補に再掲がない。数値の照合：カードの数値のうち「1時間以内」は候補の再掲（最も利益が大きい時間枠）と一致する。用量（成人50 g・小児0.5〜1 g/kg・毒物量の10〜40倍）と「徐放性製剤では6時間まで」は候補に再掲がなく照合できない（候補側に矛盾する数値はない）。留保：主出典 SRC-4140 の区分訂正（UNKNOWN→RESTRICTED）が新規にある（区分訂正の節参照）。候補のライセンスは Crossref の版データ（CC BY 2.0）・Europe PMC の個別レコード・PMC 全文のライセンス要素（CC BY 2.0）の3経路で個別確認した。StatPearls の活性炭の章は二次資料のため候補にしていない'
  uncertainty: 本カードの適応・用量はドイツ語圏の中毒センターによる総説に基づく国際的な整理であり、薬用炭の解毒目的の効能・用法は国内の添付文書では未確認である。拮抗薬・解毒薬の国内承認状況は、ヒドロキソコバラミン（効能はシアン及びシアン化合物による中毒）、ナロキソン塩酸塩（効能は麻薬による呼吸抑制ならびに覚醒遅延の改善、投与は静脈内注射）、経口アセチルシステイン（アセトアミノフェン中毒）、フルマゼニル（ベンゾジアゼピン系薬剤による鎮静の解除及び呼吸抑制の改善）が承認されている一方、アセチルシステイン静注製剤の同適応、プラリドキシムヨウ化メチル、メチレンブルー、グルカゴン、炭酸水素ナトリウムの解毒目的の効能は添付文書で未確認であり、適応外使用となる場合がある。急性中毒の標準診療の枠組み自体は第55回（TX-019）が急性中毒標準診療ガイド（SRC-3988）で作成済みであり、本カードは消化管除染の側面に限る。　【承認状況の再点検 2026-10-31（作り手、PMDA・厚生労働省などの公的情報）】薬用炭については、PMDA収載の添付文書（薬用炭「日医工」）の効能・効果に「自家中毒・薬物中毒における吸着及び解毒」が含まれていることを確認した（用法は1日2〜20g）。経口アセチルシステイン内用液も「アセトアミノフェン過量摂取時の解毒」の承認薬（承認番号21400AMZ00471000）であり、「国内の添付文書では未確認」は失効
