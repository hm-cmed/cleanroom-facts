- id: OX-006
  domain: OX
  subdomain: 化学物質の規制と情報伝達（ラベル・SDS）
  assertion:
    plain_statement_ja: 労働安全衛生法の新たな化学物質規制では、化学物質を譲渡・提供する者にはラベル表示と SDS（安全データシート）の交付による危険有害性情報の伝達が、取り扱う事業者にはリスクアセスメントの実施と、その結果に基づくばく露低減措置が義務づけられる。対象物質は、国による GHS 分類で危険性または有害性が確認された物質へ順次拡大され、2026年4月に従来の674物質から約2,900物質となった。規制の考え方は、個別物質ごとに規則で定める方式から、事業者の自律的な管理を基軸とする方式へ移行している。
    condition:
      region: 日本
      対象: 化学物質を取り扱う事業者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-4145
    source: 厚生労働省. 労働安全衛生法の新たな化学物質規制に関する資料（化学物質のリスクアセスメントの的確な実施に向けた制度改善）
    doi: null
    pmid: null
    pmcid: null
    url: https://www.mhlw.go.jp/content/11201250/001308076.pdf
    source_license: 政府標準利用規約
    legal_basis: B
    source_class: GOV_JP
    corroboration: null
  uncertainty: 対象物質への追加は2026年4月以降も GHS 分類の進展に応じて順次行われる。政府による GHS 分類の結果はラベル・SDS 作成の参考情報であり、作成の責任は表示・通知を行う事業者にある。
  curriculum:
    kokushi: null
    core_curriculum: 'SO-01-04-04 (id: JkxoNtk)；SO-01-04-02 (id: JkxoNtc)'
