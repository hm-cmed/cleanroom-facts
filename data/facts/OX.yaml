- id: OX-001
  domain: OX
  subdomain: 中毒の初期対応と解毒薬の総論
  assertion:
    plain_statement_ja: 活性炭による消化管除染は、中等症から生命を脅かす中毒に対して適応となり、摂取後できるだけ速やかに、原則として1時間以内（徐放性製剤では6時間まで）に投与する。用量は成人で50 g、小児で0.5〜1 g/kgが目安とされる。気道が確保されていない意識障害の患者では誤嚥の危険のため禁忌であり、酸・アルカリ、アルコール類、有機溶剤、無機塩類、金属には無効ないし不十分である。下剤とのルーチンの併用は推奨されない。
    condition:
      region: 国際
      対象: 急性中毒患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-4140
    source: Zellner T, Prasa D, Färber E, et al. The Use of Activated Charcoal to Treat Intoxications. Dtsch Arztebl Int. 2019;116(18):311-317
    doi: 10.3238/arztebl.2019.0311
    pmid: '31219028'
    pmcid: PMC6620762
    url: https://doi.org/10.3238/arztebl.2019.0311
    source_license: 全文は PMC で公開されているが、CC ライセンス表示は確認できなかった
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 本カードの適応・用量はドイツ語圏の中毒センターによる総説に基づく国際的な整理であり、薬用炭の解毒目的の効能・用法は国内の添付文書では未確認である。拮抗薬・解毒薬の国内承認状況は、ヒドロキソコバラミン（効能はシアン及びシアン化合物による中毒）、ナロキソン塩酸塩（効能は麻薬による呼吸抑制ならびに覚醒遅延の改善、投与は静脈内注射）、経口アセチルシステイン（アセトアミノフェン中毒）、フルマゼニル（ベンゾジアゼピン系薬剤による鎮静の解除及び呼吸抑制の改善）が承認されている一方、アセチルシステイン静注製剤の同適応、プラリドキシムヨウ化メチル、メチレンブルー、グルカゴン、炭酸水素ナトリウムの解毒目的の効能は添付文書で未確認であり、適応外使用となる場合がある。急性中毒の標準診療の枠組み自体は第55回（TX-019）が急性中毒標準診療ガイド（SRC-3988）で作成済みであり、本カードは消化管除染の側面に限る。
  curriculum:
    kokushi: null
    core_curriculum: 'PS-03-05-06 (id: Jkxnubo)；PS-03-05-07 (id: Jkxnubs)'
