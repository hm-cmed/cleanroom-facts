- id: OX-002
  domain: OX
  subdomain: 職業性疾患の診断の考え方（曝露歴の聴取と業務起因性の判断）
  assertion:
    plain_statement_ja: 職業性疾患の業務起因性の評価は、まず疾患の診断を確定し、次に曝露を評価し、そのうえで業務起因性を評価するという順序で進められる。因果関係の判断は決定的ではなく確率的に行われ、絶対的な判断基準は存在しない。疫学知見の不整合、発症機序の未確立、客観的な職歴資料の喪失、症例の複雑さが評価を難しくする要因であり、疑わしい症例については合理的な論理と文献に基づく個別の詳細な検討が必要とされる。
    condition:
      region: 国際
      対象: 職業性疾患が疑われる患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-4141
    source: 'Kim K, Kim J. A work-relatedness assessment in epidemiological case investigation of occupational cancers: I. Principles. Ann Occup Environ Med. 2020;32:e30'
    doi: 10.35371/aoem.2020.32.e30
    pmid: '33072341'
    pmcid: PMC7533286
    url: https://doi.org/10.35371/aoem.2020.32.e30
    source_license: CC BY-NC 4.0
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 職業性がんの疫学調査における評価原則を整理した総説に基づく枠組みである。個別疾患の労災認定基準（通達）の側面は第56回（OC）が担う。
  curriculum:
    kokushi: null
    core_curriculum: 'SO-01-04-01 (id: JkxoNtY)；SO-01-04-03 (id: JkxoNtg)；CS-01-01-02 (id: Jkxirsg)'
