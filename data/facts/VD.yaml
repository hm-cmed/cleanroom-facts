- id: VD-002
  domain: VD
  subdomain: 僧帽弁閉鎖不全症
  assertion:
    plain_statement_ja: 日本のガイドラインは、心エコーで重症 MR とする目安を、有効逆流弁口面積0.40 cm²以上、逆流量60 mL以上、逆流率50%以上、縮流部幅（vena contracta）0.7 cm以上としている。中等症はそれぞれ0.20〜0.39 cm²、30〜59 mL、30〜49%、0.3〜0.69 cm で、重症度は1つの指標でなく複数の指標を合わせて判定する。
