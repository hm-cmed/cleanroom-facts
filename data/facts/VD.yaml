- id: VD-003
  domain: VD
  subdomain: 僧帽弁閉鎖不全症
  assertion:
    plain_statement_ja: 心不全症状のある重症の一次性 MR では、LVEF が30%を超えていれば弁形成術か弁置換術が推奨される（推奨クラスI）。耐久性のある形成が可能なら形成術が第一選択で、形成が難しい場合に置換術を選び、置換術でも腱索（とくに後尖側）を温存する。
