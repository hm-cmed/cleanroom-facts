- id: VD-021
  domain: VD
  subdomain: 僧帽弁閉鎖不全症
  assertion:
    plain_statement_ja: 僧帽弁の動きによる Carpentier 分類では、I型は弁尖の動きが正常で弁輪拡大（ときに弁尖穿孔）による逆流、II型は弁尖の過剰な動き（逸脱・弁尖翻転）による逆流、IIIa型は収縮期・拡張期とも弁尖の動きが制限されるもの（リウマチ性の肥厚・癒合が典型）、IIIb型は収縮期だけ動きが制限されるもの（虚血や左室拡大による牽引）である。
