- id: VD-020
  domain: VD
  subdomain: 大動脈弁閉鎖不全症
  assertion:
    plain_statement_ja: 慢性の AR は弁尖の異常、大動脈基部の拡大、またはその両方で起こる。弁の形態異常では二尖弁が最も多く、大動脈の拡大を伴いやすい。急性の重症 AR の原因として多いのは感染性心内膜炎と大動脈解離で、まれに経カテーテル手技のあとや鈍的胸部外傷でも起こる。
    condition:
