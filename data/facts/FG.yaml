- id: FG-014
  domain: FG
  subdomain: アニサキス症
  assertion:
    plain_statement_ja: アニサキス症は、虫体が消化管に穿入する腸型、消化管を穿通して移行する異所型（消化管外型）、および死んだ虫体の摂取でも起こるアレルギーの各症候群をとり、腸型・異所型では外科的摘出が必要になることがあり、アレルギーでは抗 IgE 抗体検査が診断の助けになる。
    condition:
