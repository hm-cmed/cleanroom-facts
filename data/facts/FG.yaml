    doi: 10.1086/656238
    pmid: '20804423'
    pmcid: null
    url: https://doi.org/10.1086/656238
    source_license: CCライセンス表示なし
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 胃アニサキス症の臨床像・内視鏡所見は既存カード（GD-081〜085）の範囲とし、本カードでは症候群の整理に限った。抄録ではアルベンダゾールが時に使われるとされるが、アニサキス症への国内承認・保険適用はない（アルベンダゾールの国内承認適応は包虫症のみ）。
