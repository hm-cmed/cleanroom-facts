- id: FG-017
  domain: FG
  subdomain: トキソプラズマ症
  assertion:
    plain_statement_ja: トキソプラズマは世界人口の最大で約3分の1が感染している原虫で、感染は終宿主のネコが排出するオーシストに汚染された食品や水の摂取、または組織シストを含む加熱不十分な食肉の摂取による。初感染は通常は無症状だが、妊娠中の感染は胎児に重い障害を起こし得て、免疫不全者では潜在感染の再活性化が致命的な脳炎を起こす。
    condition:
      region: 国際
      対象: 成人
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2165
    source: Montoya JG, Liesenfeld O. Toxoplasmosis. Lancet. 2004;363(9425):1965-76.
    doi: 10.1016/S0140-6736(04)16412-X
    pmid: '15194258'
    pmcid: null
    url: https://doi.org/10.1016/S0140-6736(04)16412-X
    source_license: CCライセンス表示なし
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 先天感染の管理は医学各論 Ⅰ の範囲とし、本カードは感染経路と疫学に限った。標準治療のピリメタミンとスルファジアジンはいずれも国内未承認で、熱帯病治療薬研究班の保管薬として供給される。スピラマイシン（先天性トキソプラズマ症の発症抑制）は2018年に国内承認された。
  curriculum:
