- id: FG-009
  domain: FG
  subdomain: ニューモシスチス肺炎
  assertion:
    plain_statement_ja: ヒトに感染する Pneumocystis jirovecii は免疫不全宿主における真菌病原体で、環境中のリザーバーは解明されていない。肺炎は空気伝播（院内クラスターを含む）によって、または不十分な治療後の再活性化によって生じる。発症は臓器移植後6か月以内に多く、免疫抑制の強化・長期化、とくに副腎皮質ステロイドの使用やサイトメガロウイルス感染の後にみられる。
    condition:
      region: 国際
      対象: 免疫不全者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2158
    source: Apostolopoulou A, Fishman JA. The Pathogenesis and Diagnosis of Pneumocystis jiroveci Pneumonia. J Fungi. 2022;8(11):1167.
    doi: 10.3390/jof8111167
    pmid: '36354934'
    pmcid: null
    url: https://doi.org/10.3390/jof8111167
    source_license: CC BY 4.0
    legal_basis: B
    source_class: OPEN
    corroboration: null
  uncertainty: 副腎皮質ステロイドは発症の宿主因子として触れたもので、治療の推奨ではない（国内の承認・保険適用は本カードの照合範囲では個別に確認していない）。臨床像・診断の各論は RI-033・034、予防投与の開始基準は RI-035 の範囲とし、本カードでは扱わない。
