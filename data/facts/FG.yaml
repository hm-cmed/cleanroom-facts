      region: 国際
      対象: 一般
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2161
    source: Gaitanis G, Magiatis P, Hantschke M, Bassukas ID, Velegraki A. The Malassezia genus in skin and systemic diseases. Clin Microbiol Rev. 2012;25(1):106-141.
    doi: 10.1128/CMR.00021-11
    pmid: '22232373'
    pmcid: null
    url: https://doi.org/10.1128/CMR.00021-11
    source_license: © American Society for Microbiology（CC表示なし）
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 種数は2012年時点の総説に基づく（その後の総説では種数はさらに増えている）。癜風の臨床像と菌種ごとの位置づけは SD-040 の範囲とし、本カードでは扱わない。出典のライセンスは Crossref・Europe PMC の双方で CC 表示がなく、source_class は UNKNOWN とした。
