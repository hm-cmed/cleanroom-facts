- id: FG-013
  domain: FG
  subdomain: スポロトリコーシス
  assertion:
    plain_statement_ja: スポロトリコーシスは、二形性真菌 Sporothrix schenckii sensu lato による風土性真菌症で、従来は単一種と考えられていたが、その中に複数の隠蔽種が認識されるようになった。感染は通常、真菌に汚染された土壌・植物・有機物の外傷性接種で生じ、花卉栽培・農業・林業などの職業・余暇活動と関連する。人獣共通感染も報告されており、1990年代末以降、ブラジルのリオデジャネイロでは猫を介する流行でヒト2,000例超・動物3,000例超が報告された。
    condition:
      region: 国際
      対象: 一般
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1190
    source: Barros MBL, de Almeida Paes R, Schubach AO. Sporothrix schenckii and Sporotrichosis. Clin Microbiol Rev. 2011;24(4):633-654.
    doi: 10.1128/CMR.00007-11
    pmid: '21976602'
    pmcid: null
    url: https://doi.org/10.1128/CMR.00007-11
    source_license: © American Society for Microbiology（CC表示なし）
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 臨床像は SD-041 の範囲とし、本カードでは扱わない。出典は既存の SRC-1190 を再利用し、書誌・ライセンス・source_class は出典マスターの登録どおりとした。
