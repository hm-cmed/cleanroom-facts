- id: FG-015
  domain: FG
  subdomain: アニサキス症
  assertion:
    plain_statement_ja: アニサキスの終宿主はクジラやアザラシなどの海生哺乳類で、魚介類・イカは中間宿主・待機宿主であり、ヒトは第3期幼虫（体長2〜3 cm）を生食で摂取して感染する。腸型では虫体が腸に穿入して腹痛・悪心・嘔吐を起こし、腸閉塞や腸穿孔を併発することがある。アニサキスは2012年12月から食中毒の病因物質に位置づけられ、診断した医師は24時間以内に保健所へ届け出る。
