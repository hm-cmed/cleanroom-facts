- id: FG-019
  domain: FG
  subdomain: 吸虫症
  assertion:
    plain_statement_ja: 食品媒介吸虫は、第1中間宿主の貝類と、淡水魚・甲殻類・水生植物などの第2中間宿主を介する生活史を持ち、ヒトは第2中間宿主を生または加熱不十分な状態で食べることで感染する。公衆衛生上重要な吸虫（肝吸虫・肺吸虫・腸管吸虫）の感染者は世界で約8,000万人と推計されるが、著者らはこの推計が過小評価の可能性を指摘している。
