  subdomain: 癜風
  assertion:
    plain_statement_ja: Malassezia 属は、1996年の改訂で7種（M. furfur、M. pachydermatis、M. sympodialis、M. globosa、M. obtusa、M. restricta、M. slooffiae）が認められた後、ヒト・動物の健常皮膚および病変皮膚から分離された7つの新種が加わり、2012年の総説時点で14種を含む属である。同属と癜風との病因的な関連は確立しているとされる。
