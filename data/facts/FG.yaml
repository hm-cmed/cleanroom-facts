    doi: null
    pmid: null
    pmcid: null
    url: null
    source_license: 政府標準利用規約
    legal_basis: B
    source_class: GOV_JP
    corroboration: null
  uncertainty: 出典ページは2014年改訂で「更新作業中」の注記があり、ページの URL を特定できなかったため url は null とした。発生件数の新しい推計は既存カード（GD-084）の範囲である。幼虫に有効な駆虫薬は開発されておらず、アニサキス症への駆虫薬の国内承認・保険適用はない。
