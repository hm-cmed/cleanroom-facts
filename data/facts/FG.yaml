- id: FG-016
  domain: FG
  subdomain: アメーバ赤痢
  assertion:
    plain_statement_ja: アメーバ赤痢の治療は、組織内の栄養型に作用するニトロイミダゾール系薬（メトロニダゾールまたはチニダゾール）で急性期病変を治療したうえで、腸管内に残存するシストを除去するためにパロモマイシンなどの腸管内作用薬を続けて用いる二段構えが原則であり、ニトロイミダゾール系薬のみではシストを除去できない。
    condition:
      region: 国際
      対象: 成人
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2164
    source: Shirley DT, Farr L, Watanabe K, Moonah S. A review of the global burden, new diagnostics, and current therapeutics for amebiasis. Open Forum Infect Dis. 2018;5(7):ofy161.
    doi: 10.1093/ofid/ofy161
    pmid: '30046644'
    pmcid: PMC6055529
    url: https://doi.org/10.1093/ofid/ofy161
    source_license: CC BY-NC-ND
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: メトロニダゾールとチニダゾールはアメーバ赤痢への適応で国内承認されており、パロモマイシンも腸管アメーバ症への適応で国内承認されている（2012年承認）。JIHS の古いページにある薬価未収載時代の記述は現行の事実ではない。肝膿瘍の臨床像は既存カード（LV-103・104）の範囲とし、本カードは治療原則に限った。
