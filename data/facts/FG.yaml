  assertion:
    plain_statement_ja: 米国感染症学会（IDSA）は2016年に、カンジダ症の管理に関する診療ガイドラインを更新した。このガイドラインは、カンジダ血症を含む侵襲性カンジダ症を中心に、カンジダ症の診断と治療の方針を病態別に扱うものである。
