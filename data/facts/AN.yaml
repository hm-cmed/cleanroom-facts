- id: AN-004
  domain: AN
  subdomain: 特発性正常圧水頭症
  assertion:
    plain_statement_ja: 特発性正常圧水頭症は、高齢者における歩行障害・認知障害・尿失禁を特徴とする治療可能な症候群であり、日本の診療ガイドライン第3版（2020年、日本正常圧水頭症学会）では、脳室拡大に高位円蓋部・正中部のくも膜下腔の狭小化を伴う画像所見 DESH（disproportionately enlarged subarachnoid-space hydrocephalus）が、画像診断とシャント適応の判断において重要な役割を果たすとされる。
    condition:
      region: 日本
      対象: 特発性正常圧水頭症の高齢患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1671
    source: 'Nakajima M, et al. Guidelines for Management of Idiopathic Normal Pressure Hydrocephalus (Third Edition): Endorsed by the Japanese Society of Normal Pressure Hydrocephalus. Neurol Med Chir (Tokyo). 2021;61(2):63-97'
    doi: 10.2176/nmc.st.2020-0292
    pmid: '33455998'
    pmcid: null
    url: https://doi.org/10.2176/nmc.st.2020-0292
    source_license: CC BY-NC-ND 4.0
    legal_basis: B
    source_class: RESTRICTED
    corroboration: 自由に使える資料による裏づけ（OPEN、作り手の調査バッチ56 2026-11-13）：Yamada S, Ito H, Hagiwara K, et al. CT-based automatic segmentation of key CSF regions for detecting disproportionately enlarged subarachnoid space hydrocephalus. Fluids and Barriers of the CNS. 2026;23(1):83（CC BY、PMID 42337617、DOI 10.1186/s12987-026-00814-5、PMC13289119、新規 SRC 候補）。裏づける部分：候補（CC BY の研究論文）は、DESH を特発性正常圧水頭症に特徴的な画像所見と位置づけ、その構成（脳室拡大、シルビウス裂の拡大に伴う高位円蓋部のくも膜下腔の狭小化）を明記し、診断が日本の診療ガイドライン第3版に基づいて「DESH の存在と Hakim の三徴の少なくとも1症状」で行われたことを述べる。iNPH が治療可能な状態であることも明記される。数値の照合：数値なし（枠組みと定義）。留保：「シャント適応の判断における重要な役割」という点の逐条の再述は候補になく、裏づけは画像診断と第3版ガイドライン上の位置づけが中心。DESH の転帰予測能については否定的な前向き研究もあり、フラグに挙げた。候補は出典マスター未登録のため新規 SRC 登録候補。主出典自体は刊行版が CC BY-NC-ND 4.0 で自由利用にならず、現行の RESTRICTED が正しい。マスター未登録の PMCID（PMC7905302）と license_note の精密化候補を別枠に記録した
  uncertainty: 排尿障害は三徴の一つとして扱い、病態・評価の詳細は本カードでは扱わない。ガイドラインの個別の推奨文（推奨の強さ・エビデンスレベル）は抄録範囲外のため記載していない。（出典内の位置：抄録および第3版ガイドラインの DESH に関する記述）
