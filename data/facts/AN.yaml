- id: AN-026
  domain: AN
  subdomain: 小頭症
  assertion:
    plain_statement_ja: 小頭症は早期の脳発育を妨げるあらゆる要因によって生じ、数百の遺伝性症候群に伴ってみられ、報告された遺伝性病因の割合は15.5〜53.3%である。合併症として、てんかん（約40%）、脳性麻痺（約20%）、知的障害（約50%）、眼科的異常（約20〜50%）が報告されている。
    condition:
      region: 米国
      対象: 小頭症の小児
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2007
    source: 'Ashwal S, et al. Practice parameter: Evaluation of the child with microcephaly. Neurology. 2009;73(11):887-897'
    doi: 10.1212/WNL.0b013e3181b783f7
    pmid: '19752457'
    pmcid: null
    url: https://doi.org/10.1212/WNL.0b013e3181b783f7
    source_license: Neurology（American Academy of Neurology、CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 先天性感染のうちジカウイルス感染症は2016年以降に小頭症の原因として確立したが、本出典（2009年）はそれ以前のものであり、ジカについては専用カードを作らなかった（申し送り）。代謝性疾患の割合は約1%と推定される。（出典内の位置：抄録の文献レビュー結果）
