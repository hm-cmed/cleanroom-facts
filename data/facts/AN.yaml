- id: AN-010
  domain: AN
  subdomain: 脳瘤
  assertion:
    plain_statement_ja: 脳瘤（encephalocele）は神経管閉鎖障害の1つで、頭蓋の欠損部と硬膜を介して頭蓋内組織が頭蓋外へ脱出する先天異常であり、後頭部に最も多く、約90%が正中に生じる。発生頻度は出生3,000〜10,000あたり1例とされ、女児に多い。
    condition:
