- id: AN-025
  domain: AN
  subdomain: 小頭症
  assertion:
    plain_statement_ja: 小頭症は、頭囲が平均より2SDを超えて小さいこと（頭囲 <-2 SD）と定義される神経学的徴候であり、重症小頭症（頭囲 <-3 SD）では約80%に画像異常がみられ、-2〜-3 SD の軽症例（約40%）より発達障害が重度である。
    condition:
      region: 米国
      対象: 小頭症の小児（米国神経学会等の評価パラメータ）
    differential: null
    common_misconception: null
  provenance:
