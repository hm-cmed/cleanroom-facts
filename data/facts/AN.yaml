- id: AN-014
  domain: AN
  subdomain: Chiari奇形
  assertion:
    plain_statement_ja: Chiari奇形は、小脳扁桃が大後頭孔を越えて下垂することを共通の特徴とする後頭蓋窩の異常であり、脊髄空洞は Chiari 奇形に合併することが最も多い。Chiari 奇形の手術の目標は、脳幹圧迫の解除、大後頭孔部の髄液流の正常化、合併する空洞の縮小である。
    condition:
      region: 国際
      対象: Chiari奇形の患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1998
