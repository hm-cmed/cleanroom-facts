- id: AN-001
  domain: AN
  subdomain: 水頭症
  assertion:
    plain_statement_ja: 水頭症は、脳脊髄液の恒常性の破綻により脳室が能動的に拡大する状態であり、後天性のものは中枢神経系の感染や出血によって生じることが多く、髄液流路の閉塞や、髄液の産生・吸収（クリアランス）の炎症性調節障害が関与する。閉塞部位より上流の脳室が拡大するものが閉塞性水頭症である。
    condition:
      region: 国際
      対象: 水頭症の小児患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1989
    source: Kahle KT, et al. Paediatric hydrocephalus. Nat Rev Dis Primers. 2024;10(1):35
    doi: 10.1038/s41572-024-00519-9
    pmid: '38755194'
    pmcid: null
    url: https://doi.org/10.1038/s41572-024-00519-9
    source_license: Nat Rev Dis Primers（Springer Nature、CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ56 2026-11-13）：Liu X, Zhi H, Czosnyka M, et al. Advancing Hydrocephalus Management: Pathogenesis Insights, Therapeutic Innovations, and Emerging Challenges. Aging and Disease. 2024;17(1):185-225（CC BY、PMID 39908266、DOI 10.14336/AD.2024.1434、PMC12727080、新規 SRC 候補）。裏づける部分：候補（CC BY の総説）は水頭症を「脳室系の能動的な拡張（active distension of the ventricular system）であり、髄液の産生・循環・吸収の不均衡から生じる」と定義し、閉塞性水頭症は脳室をつなぐ狭い開口部での髄液流の閉塞（出血後の凝血塊による中脳水道の閉塞など）で閉塞より上流が拡大すること、後天性は出血・感染に伴うことが多いことを明記する。数値の照合：数値なし（定義と機序）。カードの「炎症性調節障害」という表現そのものは候補にないが、炎症が吸収障害に関与する機序の記述はある。留保：候補は出典マスター未登録のため新規 SRC 登録候補。主出典は Springer Nature の著作物（著者原稿が PMC にあるがライセンス表示なし）で、現行の RESTRICTED が正しい。マスター未登録の PMCID（PMC12091269）を補完候補に挙げた'
  uncertainty: 閉塞部位（Monro孔・中脳水道・第4脳室出口部）の内訳の頻度は本出典の抄録では確認できなかった。（出典内の位置：抄録の疾患概念・病態の記述）
