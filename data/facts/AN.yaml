    doi: 10.1212/WNL.0b013e3181b783f7
    pmid: '19752457'
    pmcid: null
    url: https://doi.org/10.1212/WNL.0b013e3181b783f7
    source_license: Neurology（American Academy of Neurology、CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ56 2026-11-13）：Gonzalez-Fernandez MD, Jiménez-Gil K, Garcés-Ramírez L, et al. Epidemiological Surveillance of Genetically Determined Microcephaly in Latin America: A Narrative Review. Epidemiologia. 2025;6(3):37（CC BY、PMID 40700109、DOI 10.3390/epidemiologia6030037、PMC12285932、新規 SRC 候補）。裏づける部分：候補（CC BY の総説）に、小頭症は後頭前頭頭囲が平均より2標準偏差を超えて小さいこと、3標準偏差を超えて小さい場合が重症と分類されることが明記され、カードの定義部分が裏づけられる。数値の照合：定義の閾値（−2 SD、重症 −3 SD）はカードと一致する。重症例で約80%・軽症例で約40%に画像異常がみられるという割合は主出典固有で、候補に再掲がなかった。留保：候補は出典マスター未登録のため新規 SRC 登録候補。主出典は著者原稿が PMC にあるがライセンス表示はなく、現行の RESTRICTED が正しい。マスター未登録の PMCID（PMC2744281）を補完候補に挙げた。なお主出典は現行の PubMed・Europe PMC レコードで [RETIRED]（廃止）と表示されており、フラグに挙げた'
