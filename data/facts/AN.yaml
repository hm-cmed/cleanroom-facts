- id: AN-029
  domain: AN
  subdomain: 脳性麻痺
  assertion:
    plain_statement_ja: 脳性麻痺は高所得国における小児の身体障害の最も多い原因であり、その運動障害の中で痙縮が最も多い。下肢痙縮に対する A 型ボツリヌス毒素注射は、脳性麻痺の局所痙縮に対する第一選択の治療とされ、コクランレビューでは31件の無作為化試験（1,508人）が評価された。
    condition:
      region: 国際
      対象: 下肢痙縮のある脳性麻痺の小児
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2010
    source: Blumetti FC, et al. Botulinum toxin type A in the treatment of lower limb spasticity in children with cerebral palsy. Cochrane Database Syst Rev. 2019;10(10):CD001408
    doi: 10.1002/14651858.CD001408.pub2
    pmid: '31591703'
    pmcid: null
    url: https://doi.org/10.1002/14651858.CD001408.pub2
    source_license: Cochrane Database of Systematic Reviews（Wiley、CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ56 2026-11-13）：Alghadier M, Alsuwayegh A. Efficacy of botulinum toxin type A for spasticity management and motor function in children with cerebral palsy: a systematic review and meta-analysis of randomized controlled trials. Frontiers in Neurology. 2026;17:1751493（CC BY、PMID 41809197、DOI 10.3389/fneur.2026.1751493、PMC12967947、新規 SRC 候補）。裏づける部分：候補（CC BY の系統的レビュー・メタ解析）に、痙縮が脳性麻痺児の最も多い運動表現型（約80%）であること、A 型ボツリヌス毒素が局所の化学的除神経により特定の筋群の痙縮を減らす第一選択の局所的介入として確立していることが明記される。数値の照合：痙縮が最も多いという点と第一選択という位置づけは候補と一致する。「高所得国で小児の身体障害の最も多い原因」という言い回しと、コクランレビューの収載数（31件の無作為化試験・1,508人）は候補に再掲がなかった。留保：候補は出典マスター未登録のため新規 SRC 登録候補。主出典（コクランライブラリ）は PMC に全文があるがライセンス表示はなく、Crossref にもライセンスの登録がなく、現行の RESTRICTED が正しい。マスター未登録の PMCID（PMC6779591）を補完候補に挙げた'
  uncertainty: 国内状況：A型ボツリヌス毒素製剤は脳性麻痺患者の下肢痙縮に伴う尖足等で承認・保険適用があり、日本の小児痙縮・ジストニア診療ガイドラインでも推奨されているが、本作成では添付文書の効能表記の個別確認までは行っておらず、取り込み側で最終確認を要する。バクロフェン髄注（ギャバロン髄注）は2005年に「脳脊髄疾患に由来する重度の痙性麻痺（既存治療で効果不十分な場合に限る）」で国内承認され、保険適用がある（第一三共の公表資料で確認）。ITB の有効性自体を検証した系統的レビューは別に存在するが、本カードの出典ではない。（出典内の位置：抄録の Background）
