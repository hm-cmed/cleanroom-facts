- id: AN-027
  domain: AN
  subdomain: 脳性麻痺
  assertion:
    plain_statement_ja: 脳性麻痺は、発達期の胎児または乳児の脳に生じた非進行性の障害に起因する、活動制限を伴う運動と姿勢の発達の永続的な障害の総称であり、運動障害にはしばしば感覚・知覚・認知・コミュニケーション・行動の障害、てんかん、および二次性の筋骨格系の問題を伴う（2006年の国際ワークショップによる定義・分類の報告）。
    condition:
      region: 国際
      対象: 脳性麻痺の小児
    differential: null
    common_misconception: null
  provenance:
