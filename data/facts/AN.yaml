- id: AN-013
  domain: AN
  subdomain: 脊髄空洞症
  assertion:
    plain_statement_ja: 脊髄空洞症は古典的には、肩・腕・手にかけて温痛覚が失われる一方で、触覚・振動覚・位置覚が保たれる解離性の感覚障害を呈する。これは、脊髄中心部の空洞が前白交連で交叉する脊髄視床路の線維を障害し、後索が保たれるためであり、頸髄の病変では cape（肩掛け）状の分布となる。
