    source: Mihalj M, et al. CSF tap test - Obsolete or appropriate test for predicting shunt responsiveness? A systemic review. J Neurol Sci. 2016;362:78-84
    doi: 10.1016/j.jns.2016.01.028
    pmid: '26944123'
    pmcid: null
    url: https://doi.org/10.1016/j.jns.2016.01.028
    source_license: J Neurol Sci（Elsevier、CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 数値は系統的レビュー（2016年、対象8論文）の抄録に記載された統合値である。タップテストの手技（採取量等）の標準化は未確立とされる。（出典内の位置：抄録の Results）
