  uncertainty: 数値は後頭部脳瘤に焦点を当てた総説（2019年末までの症例報告・症例集積のレビュー）の抄録記載値。潜在性二分頭蓋と嚢胞性二分頭蓋の区別の詳細は本出典の範囲外。（出典内の位置：抄録の Abstract・Results）
