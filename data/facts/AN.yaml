- id: AN-023
  domain: AN
  subdomain: von Hippel-Lindau病
  assertion:
    plain_statement_ja: von Hippel-Lindau（VHL）病は、VHL 遺伝子の病原性バリアントによる多発腫瘍の素因であり、網膜と中枢神経系の血管芽腫、腎細胞癌、褐色細胞腫、膵神経内分泌腫瘍、内リンパ嚢腫瘍などを生じる。サーベイランスは小児期から開始し、網膜・中枢神経系・内耳・腎・神経内分泌臓器・膵を定期的に評価する。
    condition:
      region: 国際
      対象: VHL 病の患者およびそのリスクのある血縁者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2006
    source: 'Binderup MLM, et al. von Hippel-Lindau disease: Updated guideline for diagnosis and surveillance. Eur J Med Genet. 2022;65(8):104538'
    doi: 10.1016/j.ejmg.2022.104538
    pmid: '35709961'
    pmcid: null
    url: https://doi.org/10.1016/j.ejmg.2022.104538
    source_license: CC BY 4.0（Crossref の license 欄で確認）
    legal_basis: B
    source_class: OPEN
    corroboration: null
  uncertainty: 中枢神経系の血管芽腫自体は第28回 BT で作成済みのため、本カードは全身のサーベイランスに絞った。サーベイランスの個別の検査間隔は抄録範囲外。（出典内の位置：抄録の Recommendations）
