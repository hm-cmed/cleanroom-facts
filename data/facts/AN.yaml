- id: AN-012
  domain: AN
  subdomain: 二分脊椎
  assertion:
    plain_statement_ja: 脊髄髄膜瘤は二分脊椎の最頻の形態であり、妊娠26週未満に行う胎児手術（出生前修復）は、出生後修復と比べて、生後12か月までの髄液シャント留置率を82%から40%へ低下させ（相対リスク0.48）、後脳下垂（Chiari II型奇形の所見）の改善と30か月時点の運動機能の改善をもたらしたが、早産と分娩時の子宮離開のリスクが増加した（MOMS試験）。
    condition:
      region: 国際
      対象: 脊髄髄膜瘤の胎児とその母体
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1996
    source: Adzick NS, et al. A randomized trial of prenatal versus postnatal repair of myelomeningocele. N Engl J Med. 2011;364(11):993-1004
    doi: 10.1056/NEJMoa1014379
    pmid: '21306277'
    pmcid: null
    url: https://doi.org/10.1056/NEJMoa1014379
    source_license: New England Journal of Medicine（CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: 自由に使える資料による裏づけ（GOV_US、作り手の調査バッチ56 2026-11-13）：ClinicalTrials.gov 登録レコード NCT00060606（Management of Myelomeningocele Study (MOMS)）（GOV_US、新規 SRC 候補、結果セクション掲載あり）（GOV_US、https://clinicaltrials.gov/study/NCT00060606、新規 SRC 候補）。裏づける部分：MOMS 試験の登録レコードの結果セクションに、主要評価項目の複合アウトカム（生後1年までの死亡または脳室シャントの必要）が出生前手術群66/91例・出生後手術群90/92例と掲載され、30か月時点の発達指標（Bayley MDI と病変レベルの差の複合スコア 199.4 対 166.6）と、自立歩行できた児の数（39/87 対 21/88）も掲載され、運動機能の改善の方向が裏づけられる。数値の照合：登録の複合アウトカムは 66/91（約73%）対 90/92（約98%）で、論文の複合値（68%対98%）と分母の取り方が少し異なる。カードの核であるシャント留置率そのもの（82%→40%、相対リスク0.48）と後脳下垂（Chiari II型）の改善は、登録レコードの結果セクションに掲載がない。留保：候補は出典マスター未登録のため新規 SRC 登録候補。主出典は著者原稿が PMC にあるがライセンス表示はなく、現行の RESTRICTED が正しい。マスター未登録の PMCID（PMC3770179）を補完候補に挙げた
