- id: AN-007
  domain: AN
  subdomain: 水頭症
  assertion:
    plain_statement_ja: 交通性水頭症は、脳室系の機械的閉塞ではなく、髄液の産生・分泌と吸収（クリアランス）の調節障害によって生じる水頭症であり、中枢神経系の出血や感染の後に発症することが多い。
    condition:
      region: 国際
      対象: 交通性水頭症の患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1989
    source: Kahle KT, et al. Paediatric hydrocephalus. Nat Rev Dis Primers. 2024;10(1):35
    doi: 10.1038/s41572-024-00519-9
    pmid: '38755194'
    pmcid: null
    url: https://doi.org/10.1038/s41572-024-00519-9
    source_license: Nat Rev Dis Primers（Springer Nature、CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
