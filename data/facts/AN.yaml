- id: AN-008
  domain: AN
  subdomain: 頭蓋縫合早期癒合症
  assertion:
    plain_statement_ja: 頭蓋縫合早期癒合症は、1つ以上の頭蓋縫合の早期癒合であり、癒合した縫合に応じて特徴的な頭蓋変形を生じる（例：矢状縫合では舟状頭）。変形のパターンから位置的斜頭と鑑別でき、未治療に伴うリスクのため、外科治療は通常、診断後早期に行われる。
    condition:
      region: 国際
      対象: 頭蓋縫合早期癒合症の小児患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1993
    source: Governale LS. Craniosynostosis. Pediatr Neurol. 2015;53(5):394-401
    doi: 10.1016/j.pediatrneurol.2015.07.006
    pmid: '26371995'
    pmcid: null
    url: https://doi.org/10.1016/j.pediatrneurol.2015.07.006
    source_license: Pediatric Neurology（Elsevier、CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: 自由に使える資料による裏づけ（OPEN、作り手の調査バッチ56 2026-11-13）：Al-Murad BM, Radwan MA, Zaki IA, et al. Exploring Different Management Modalities of Nonsyndromic Craniosynostosis. Cureus. 2024;16(5):e60831（CC BY、PMID 38910614、DOI 10.7759/cureus.60831、PMC11190809、新規 SRC 候補）。裏づける部分：候補（CC BY の総説）に、矢状縫合の癒合が舟状頭（boat-shaped deformity, scaphocephaly）と呼ばれる特徴的な変形をもたらすこと、位置的斜頭は真の後頭部斜頭（頭蓋縫合早期癒合）との鑑別が必要で前者は保存的に、後者は外科的に扱われること、早期の正確な診断と介入の重要性が明記される。数値の照合：数値なし（変形のパターンと鑑別・治療の枠組み）。留保：「変形のパターンから鑑別できる」という言い回しそのものは、候補では位置的斜頭との鑑別を要する点として示される。候補は出典マスター未登録のため新規 SRC 登録候補。主出典は Elsevier の著作物で、現行の RESTRICTED が正しい
  uncertainty: 縫合別の頻度（矢状縫合が最多とされる割合）および術式別の手術時期（内視鏡下手術の月齢等）の数値は、本出典の抄録では確認できなかった。（出典内の位置：抄録の診断・治療の記述）
