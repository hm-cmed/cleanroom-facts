    source: Governale LS. Craniosynostosis. Pediatr Neurol. 2015;53(5):394-401
    doi: 10.1016/j.pediatrneurol.2015.07.006
    pmid: '26371995'
    pmcid: null
    url: https://doi.org/10.1016/j.pediatrneurol.2015.07.006
    source_license: Pediatric Neurology（Elsevier、CC表示なし）
    legal_basis: B
