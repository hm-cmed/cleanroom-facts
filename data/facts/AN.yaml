- id: AN-007
  domain: AN
  subdomain: 水頭症
  assertion:
    plain_statement_ja: 交通性水頭症は、脳室系の機械的閉塞ではなく、髄液の産生・分泌と吸収（クリアランス）の調節障害によって生じる水頭症であり、中枢神経系の出血や感染の後に発症することが多い。
