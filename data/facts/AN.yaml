- id: AN-011
  domain: AN
  subdomain: 二分脊椎
  assertion:
    plain_statement_ja: 日本では2000年に厚生省（当時）から通知が出され、妊娠の可能性がある女性が通常の食事からの摂取に加えて栄養補助食品から1日400µgの葉酸を摂取することにより、胎児の神経管閉鎖障害の発症リスクを低減できる可能性が示された。リスク低減のための摂取時期は、およそ妊娠1か月以上前から妊娠3か月までとされている。
    condition:
      region: 日本
      対象: 妊娠の可能性がある女性・妊娠を計画している女性
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1995
    source: 厚生労働省. 葉酸とサプリメント ‐神経管閉鎖障害のリスク低減に対する効果. e-ヘルスネット
    doi: null
    pmid: null
    pmcid: null
    url: https://kennet.mhlw.go.jp/information/information/food/e-05-002
    source_license: 厚生労働省の公的ウェブサイト（政府標準利用規約の適用は取り込み側で要確認）
    legal_basis: B
    source_class: GOV_JP
    corroboration: null
  uncertainty: 葉酸は医薬品ではなく栄養補助食品としての摂取推奨であり、国内承認・保険適用の対象ではない。GOV_JP の区分（政府標準利用規約の適用）は取り込み側で最終確認を要する。海外の無作為化試験（MRC Vitamin Study 等）の効果量は本カードには含めていない。（出典内の位置：e-ヘルスネット「葉酸とサプリメント」の日本の対策に関する記述）
  curriculum:
    kokushi: 医学各論 Ⅸ-10-J-③（二分脊椎、髄膜瘤、c）
    core_curriculum: 'PS-02-03-05 (id: JkxnuP0)'
