- id: AN-029
  domain: AN
  subdomain: 脳性麻痺
  assertion:
    plain_statement_ja: 脳性麻痺は高所得国における小児の身体障害の最も多い原因であり、その運動障害の中で痙縮が最も多い。下肢痙縮に対する A 型ボツリヌス毒素注射は、脳性麻痺の局所痙縮に対する第一選択の治療とされ、コクランレビューでは31件の無作為化試験（1,508人）が評価された。
    condition:
      region: 国際
      対象: 下肢痙縮のある脳性麻痺の小児
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2010
    source: Blumetti FC, et al. Botulinum toxin type A in the treatment of lower limb spasticity in children with cerebral palsy. Cochrane Database Syst Rev. 2019;10(10):CD001408
    doi: 10.1002/14651858.CD001408.pub2
    pmid: '31591703'
    pmcid: null
    url: https://doi.org/10.1002/14651858.CD001408.pub2
    source_license: Cochrane Database of Systematic Reviews（Wiley、CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 国内状況：A型ボツリヌス毒素製剤は脳性麻痺患者の下肢痙縮に伴う尖足等で承認・保険適用があり、日本の小児痙縮・ジストニア診療ガイドラインでも推奨されているが、本作成では添付文書の効能表記の個別確認までは行っておらず、取り込み側で最終確認を要する。バクロフェン髄注（ギャバロン髄注）は2005年に「脳脊髄疾患に由来する重度の痙性麻痺（既存治療で効果不十分な場合に限る）」で国内承認され、保険適用がある（第一三共の公表資料で確認）。ITB の有効性自体を検証した系統的レビューは別に存在するが、本カードの出典ではない。（出典内の位置：抄録の Background）
