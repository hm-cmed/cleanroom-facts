    source_class: GOV_JP
    corroboration: null
  uncertainty: 葉酸は医薬品ではなく栄養補助食品としての摂取推奨であり、国内承認・保険適用の対象ではない。GOV_JP の区分（政府標準利用規約の適用）は取り込み側で最終確認を要する。海外の無作為化試験（MRC Vitamin Study 等）の効果量は本カードには含めていない。（出典内の位置：e-ヘルスネット「葉酸とサプリメント」の日本の対策に関する記述）
