- id: AN-008
  domain: AN
  subdomain: 頭蓋縫合早期癒合症
  assertion:
    plain_statement_ja: 頭蓋縫合早期癒合症は、1つ以上の頭蓋縫合の早期癒合であり、癒合した縫合に応じて特徴的な頭蓋変形を生じる（例：矢状縫合では舟状頭）。変形のパターンから位置的斜頭と鑑別でき、未治療に伴うリスクのため、外科治療は通常、診断後早期に行われる。
    condition:
      region: 国際
      対象: 頭蓋縫合早期癒合症の小児患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1993
    source: Governale LS. Craniosynostosis. Pediatr Neurol. 2015;53(5):394-401
    doi: 10.1016/j.pediatrneurol.2015.07.006
    pmid: '26371995'
    pmcid: null
    url: https://doi.org/10.1016/j.pediatrneurol.2015.07.006
    source_license: Pediatric Neurology（Elsevier、CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 縫合別の頻度（矢状縫合が最多とされる割合）および術式別の手術時期（内視鏡下手術の月齢等）の数値は、本出典の抄録では確認できなかった。（出典内の位置：抄録の診断・治療の記述）
