  subdomain: 二分脊椎
  assertion:
    plain_statement_ja: 脊髄髄膜瘤は二分脊椎の最頻の形態であり、妊娠26週未満に行う胎児手術（出生前修復）は、出生後修復と比べて、生後12か月までの髄液シャント留置率を82%から40%へ低下させ（相対リスク0.48）、後脳下垂（Chiari II型奇形の所見）の改善と30か月時点の運動機能の改善をもたらしたが、早産と分娩時の子宮離開のリスクが増加した（MOMS試験）。
