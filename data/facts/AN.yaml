- id: AN-006
  domain: AN
  subdomain: 特発性正常圧水頭症
  assertion:
    plain_statement_ja: 日本の多施設無作為化試験 SINPHONI-2 では、特発性正常圧水頭症に対する腰部腹腔（LP）シャント術の即時手術群で、3か月時点で modified Rankin Scale 1点以上の改善が65%（32/49）にみられ、手術延期群の5%（2/44）を有意に上回った（p<0.0001）。
    condition:
      region: 日本
      対象: 特発性正常圧水頭症患者（60〜85歳、DESH 所見を有する例）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1992
    source: Kazui H, et al. Lumboperitoneal shunt surgery for idiopathic normal pressure hydrocephalus (SINPHONI-2). Lancet Neurol. 2015;14(6):585-594
    doi: 10.1016/S1474-4422(15)00046-0
    pmid: '25934242'
    pmcid: null
    url: https://doi.org/10.1016/S1474-4422(15)00046-0
    source_license: Lancet Neurology（Elsevier、CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 12か月時点の術後改善率は即時群67%・延期群58%で群間差はなかった。重篤な有害事象は術後12か月で22%に生じ、最も多かったのは脳梗塞（7%）。（出典内の位置：抄録の Results）
  curriculum:
