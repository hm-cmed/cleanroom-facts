- id: AN-006
  domain: AN
  subdomain: 特発性正常圧水頭症
  assertion:
    plain_statement_ja: 日本の多施設無作為化試験 SINPHONI-2 では、特発性正常圧水頭症に対する腰部腹腔（LP）シャント術の即時手術群で、3か月時点で modified Rankin Scale 1点以上の改善が65%（32/49）にみられ、手術延期群の5%（2/44）を有意に上回った（p<0.0001）。
    condition:
      region: 日本
      対象: 特発性正常圧水頭症患者（60〜85歳、DESH 所見を有する例）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1992
    source: Kazui H, et al. Lumboperitoneal shunt surgery for idiopathic normal pressure hydrocephalus (SINPHONI-2). Lancet Neurol. 2015;14(6):585-594
    doi: 10.1016/S1474-4422(15)00046-0
    pmid: '25934242'
    pmcid: null
    url: https://doi.org/10.1016/S1474-4422(15)00046-0
    source_license: Lancet Neurology（Elsevier、CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: 自由に使える資料による裏づけ（OPEN、作り手の調査バッチ56 2026-11-13）：Sahuquillo J, Poca MA. To Shunt or Not to Shunt Patients with Idiopathic Normal Pressure Hydrocephalus? A Reappraisal of an Old Question. Journal of Clinical Medicine. 2020;9(12):4120（CC BY、PMID 33371211、DOI 10.3390/jcm9124120、PMC7766518、新規 SRC 候補）。裏づける部分：候補（CC BY の再評価論文）は SINPHONI-2 を日本の無作為化試験として詳述し、主要評価項目が「無作為化後3か月時点で modified Rankin Scale が1点以上改善すること」であったこと、改善は即時手術群で65%、手術延期群で5%にみられたことを逐条で再掲する。数値の照合：改善率65%対5%はカードと完全に一致する。分母（32/49、2/44）の再掲は候補にない。留保：候補は出典マスター未登録のため新規 SRC 登録候補。主出典は Elsevier の著作物で、現行の RESTRICTED が正しい
  uncertainty: 12か月時点の術後改善率は即時群67%・延期群58%で群間差はなかった。重篤な有害事象は術後12か月で22%に生じ、最も多かったのは脳梗塞（7%）。（出典内の位置：抄録の Results）
