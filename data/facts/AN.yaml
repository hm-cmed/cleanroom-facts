- id: AN-005
  domain: AN
  subdomain: 特発性正常圧水頭症
  assertion:
    plain_statement_ja: 髄液タップテストは、陽性であればシャント有効例の選定に有用（系統的レビューで陽性的中率92%）だが、陰性的中率は37%と低く、陰性でもシャントが有効な症例を除外できない（感度58%、特異度75%、全体の正確度62%）。
    condition:
      region: 国際
      対象: 特発性正常圧水頭症が疑われる患者（シャント適応の評価対象）
    differential: null
