- id: AN-004
  domain: AN
  subdomain: 特発性正常圧水頭症
  assertion:
    plain_statement_ja: 特発性正常圧水頭症は、高齢者における歩行障害・認知障害・尿失禁を特徴とする治療可能な症候群であり、日本の診療ガイドライン第3版（2020年、日本正常圧水頭症学会）では、脳室拡大に高位円蓋部・正中部のくも膜下腔の狭小化を伴う画像所見 DESH（disproportionately enlarged subarachnoid-space hydrocephalus）が、画像診断とシャント適応の判断において重要な役割を果たすとされる。
    condition:
      region: 日本
      対象: 特発性正常圧水頭症の高齢患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1671
    source: 'Nakajima M, et al. Guidelines for Management of Idiopathic Normal Pressure Hydrocephalus (Third Edition): Endorsed by the Japanese Society of Normal Pressure Hydrocephalus. Neurol Med Chir (Tokyo). 2021;61(2):63-97'
    doi: 10.2176/nmc.st.2020-0292
    pmid: '33455998'
    pmcid: null
    url: https://doi.org/10.2176/nmc.st.2020-0292
    source_license: CC BY-NC-ND 4.0
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 排尿障害は三徴の一つとして扱い、病態・評価の詳細は本カードでは扱わない。ガイドラインの個別の推奨文（推奨の強さ・エビデンスレベル）は抄録範囲外のため記載していない。（出典内の位置：抄録および第3版ガイドラインの DESH に関する記述）
  curriculum:
