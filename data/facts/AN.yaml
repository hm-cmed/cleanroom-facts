    doi: null
    pmid: '17370477'
    pmcid: null
    url: null
    source_license: Developmental Medicine and Child Neurology Supplement（Wiley、CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 本出典の PubMed レコードには DOI の記載がなかったため doi は null とした。「2歳までの原因による」という年齢の区切りは定義文自体には含まれず、本カードでは「発達期の胎児または乳児の脳」と表現した。早産・周産期の危険因子の定量データは専用カードを作らなかった（申し送り）。（出典内の位置：定義・分類に関する国際ワークショップ報告）
