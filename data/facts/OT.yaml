- id: OT-022
  domain: OT
  subdomain: 難聴
  assertion:
    plain_statement_ja: 内耳炎は中耳炎の合併症として生じうる。急性内耳炎を合併した患者は強いめまいを呈し、摂食したものを嘔吐するなどの危険徴候を示すため、高用量の抗菌薬を投与し、乳突削開術が可能な病院へ速やかに紹介する必要がある。化膿性内耳炎は、骨膜下膿瘍、顔面神経麻痺、S状静脈洞血栓性静脈炎、脳膿瘍、髄膜炎などと並ぶ化膿性合併症の一つであり、保存的治療の対象からは外して直ちに乳突削開術を行うべきものとされる。
