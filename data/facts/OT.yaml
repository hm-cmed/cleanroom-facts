- id: OT-004
  domain: OT
  subdomain: 外耳疾患
  assertion:
    plain_statement_ja: 耳せつ（急性化膿性限局性外耳炎）は外耳道の限局した炎症であり、びまん性外耳炎とは区別して診断する必要がある。びまん性外耳炎に対する診療ガイドラインでは、疼痛の程度に応じた鎮痛を行うこと、外耳道外への炎症の進展や管理を変える宿主要因（糖尿病、免疫不全など）がない単純な症例では全身抗菌薬を初期治療に用いず点耳薬による局所療法を第一選択とすること、48〜72時間以内に改善しない場合は再評価することが推奨されている。
    condition:
      region: 米国
      study: 診療ガイドライン
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1343
    source: 'Rosenfeld RM, Schwartz SR, Cannon CR, Roland PS, Simon GR, Kumar KA, et al. Clinical practice guideline: acute otitis externa. Otolaryngology–Head and Neck Surgery. 2014;150(1 Suppl):S1-S24.'
    doi: 10.1177/0194599813517083
    pmid: '24491310'
    pmcid: null
    url: https://doi.org/10.1177/0194599813517083
    source_license: ライセンス表示を確認できず
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 出典ガイドラインの推奨はびまん性外耳炎を対象としたもので、耳せつそのものを対象とした推奨ではない。耳せつ特有の治療（切開排膿の適応など）は出典の範囲外。点耳薬・抗菌薬の国内承認・保険適用の個別確認は未実施。
  curriculum:
    core_curriculum: 'PS-02-16-05 (id: JkxnuTo)；TBL-01-00-502 (id: JlvnmO8)'
