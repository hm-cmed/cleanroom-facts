- id: OT-003
  domain: OT
  subdomain: 外耳疾患
  assertion:
    plain_statement_ja: Ramsay Hunt症候群の治療は、抗ウイルス薬（アシクロビルなど）と副腎皮質ステロイドの併用を早期に開始することが原則である。アシクロビル・プレドニゾロン併用療法の解析では、顔面神経麻痺の発症後3日以内に治療を開始した群で完全回復率が75%であったのに対し、発症後4〜7日の開始では48%、7日を超えた開始では30%と、開始が遅れるほど完全回復率が低下した。
    condition:
      region: 海外
      study: 総説（一次研究のまとめを含む）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1342
    source: 'Goswami Y, Gaurkar SS. Ramsay Hunt Syndrome: An Introduction, Signs and Symptoms, and Treatment. Cureus. 2023;15(1):e33688.'
    doi: 10.7759/cureus.33688
    pmid: '36793818'
    pmcid: PMC9925029
    url: https://doi.org/10.7759/cureus.33688
    source_license: CC BY 4.0
    legal_basis: B
    source_class: OPEN
    corroboration: null
  uncertainty: 回復率の数値は一次研究（Murakamiらの後方視的解析）の結果を本総説がまとめたもの。抗ウイルス薬・副腎皮質ステロイドの国内承認・保険適用は未確認。
  curriculum:
    core_curriculum: 'PS-02-16-05 (id: JkxnuTo)'
