  uncertainty: 出典は2004年のWHOモノグラフで、内耳炎の記載は慢性化膿性中耳炎の合併症としての文脈に基づく。ウイルス性内耳炎など他の原因による内耳炎の詳細は含まれない。抗菌薬の国内承認・保険適用は未確認。
