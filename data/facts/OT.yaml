- id: OT-024
  domain: OT
  subdomain: 難聴
  assertion:
    plain_statement_ja: 小児の難聴は頻度が高く、18歳までにほぼ5人に1人の小児が罹患する。聴覚リハビリテーションが行われなければ、言語、発達、教育、認知のアウトカムに悪影響を及ぼす。原因は先天性、遅発性、後天性に分けられ、先天性感染症、症候群性および非症候群性の遺伝性要因、外傷などが含まれる。早期の発見と原因の把握は、予後の予測と家族へのカウンセリングに役立つ。リハビリテーションには、補聴器、人工内耳、骨固定型デバイス、FMシステムなどの支援機器が用いられる。
