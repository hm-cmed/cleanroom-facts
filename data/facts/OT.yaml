    plain_statement_ja: 耳硬化症の診断におけるCTの性能は研究間で幅があり、感度は60〜95%、特異度は75〜100%であった。あぶみ骨手術は内視鏡下と顕微鏡下で気骨導差の閉鎖率は同等であったが、内視鏡下手術では味覚障害の危険が低かった。進行した耳硬化症に対する人工内耳は、概ね良好な聴覚成績を示した。フッ化ナトリウムやビスホスホネートなどの薬物療法については、聴覚成績に対する有効性のエビデンスは一定していない。
