- id: OT-041
  domain: OT
  subdomain: 脳神経疾患
  assertion:
    plain_statement_ja: 舌咽神経痛は、脳神経に血管が接触して異常な感覚・運動症状を生じる神経血管圧迫症候群の一つであり、舌咽神経への血管圧迫によって生じる。三叉神経痛や顔面けいれんに比べてまれであり、病態の把握には神経画像による血管と神経の接触の評価が用いられ、病因・画像・治療の特徴を踏まえて治療が選択される。
    condition:
      region: 国際
      study: 症例報告と文献レビュー
    differential: null
    common_misconception: null
  provenance:
