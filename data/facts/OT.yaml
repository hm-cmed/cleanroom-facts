- id: OT-014
  domain: OT
  subdomain: 中耳疾患
  assertion:
    plain_statement_ja: 好酸球性中耳炎は、粘稠度の高い中耳貯留液を特徴とする難治性の中耳炎で、通常は気管支喘息に合併する。2011年に診断基準が確立され、気管支喘息や好酸球性副鼻腔炎と同様に、2型炎症が病態の中心と考えられている。現在のところ最も有効な治療はステロイドの全身投与と局所投与であり、気管支喘息や好酸球性副鼻腔炎合併例では生物学的製剤による治療も進展している。
