- id: OT-042
  domain: OT
  subdomain: 脳神経疾患
  assertion:
    plain_statement_ja: 成人の反回神経麻痺の原因は病変の部位や障害の程度・機序によって様々であるが、大規模なシリーズでは手術と腫瘍性病変が主な原因とされる。耳鼻科的評価では詳細な病歴聴取が重要であり、頭頸部と胸部を含む反回神経の走行に関する解剖学的知識に基づいて原因を検索し、回復の見込みは神経損傷の種類、程度、部位によって異なることを踏まえて管理方針を決める。
    condition:
      region: 米国
      study: 総説
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1369
    source: 'Myssiorek D. Recurrent laryngeal nerve paralysis: anatomy and etiology. Otolaryngol Clin North Am. 2004;37(1):25-44.'
    doi: 10.1016/S0030-6665(03)00172-5
    pmid: '15062685'
    pmcid: null
    url: https://doi.org/10.1016/S0030-6665(03)00172-5
    source_license: © Elsevier（CC表示なし）
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 反回神経麻痺そのものは呼吸器側（PL-014）が正であり、本カードは耳鼻科側の評価（病歴・原因検索の進め方）に限る。喉頭内視鏡所見の詳細や喉頭筋電図の適応、原因別の割合の具体的数値は、本総説の抄録では確認できなかったため含めていない。2004年の総説であり、その後の診断技術の変化は反映されていない可能性がある。
  curriculum:
