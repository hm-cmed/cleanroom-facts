    doi: 10.1016/j.clineuro.2022.107401
    pmid: '35932589'
    pmcid: null
    url: https://doi.org/10.1016/j.clineuro.2022.107401
    source_license: CC BY 4.0
    legal_basis: B
    source_class: OPEN
    corroboration: null
  uncertainty: 疼痛の分布や誘発因子、第一選択薬、微小血管減圧術の成績などの具体的記載は、本総説の抄録では確認できなかったため含めていない。三叉神経痛との鑑別が重要である点は、他の一次資料でも示されているが、本カードの出典の抄録の範囲を超えるため主張には含めていない。
