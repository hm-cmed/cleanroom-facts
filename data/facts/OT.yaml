    source: 'Chandrasekhar SS, Tsai Do BS, Schwartz SR, Bontempo LJ, Faucett EA, Finestone SA, et al. Clinical Practice Guideline: Sudden Hearing Loss (Update). Otolaryngology–Head and Neck Surgery. 2019;161(1 Suppl):S1-S45.'
