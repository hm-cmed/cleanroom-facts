- id: OT-005
  domain: OT
  subdomain: 外耳疾患
  assertion:
    plain_statement_ja: 耳垢栓塞とは、耳垢の蓄積が症状を引き起こすか、耳の診察を妨げるか、その両方を満たす状態をいう。無症状で耳を十分に診察できる場合は耳垢を定期的に治療しない。治療が必要な場合は、耳垢溶解剤（水や生理食塩水を含む）、洗浄、器具を用いた用手除去のいずれか、または併用で対応し、イヤーキャンドルは推奨されない。抗凝固療法中であること、糖尿病、免疫不全状態、鼓膜が intact でないことなどは、対応を変える要因として評価する。
    condition:
      region: 米国
      study: 診療ガイドライン
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1344
    source: 'Schwartz SR, Magit AE, Rosenfeld RM, Ballachanda BB, Hackell JM, Krouse HJ, et al. Clinical Practice Guideline (Update): Earwax (Cerumen Impaction). Otolaryngology–Head and Neck Surgery. 2017;156(1 Suppl):S1-S29.'
    doi: 10.1177/0194599816671491
    pmid: '28045591'
    pmcid: null
    url: https://doi.org/10.1177/0194599816671491
    source_license: ライセンス表示を確認できず
