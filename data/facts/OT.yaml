  subdomain: 中耳疾患
  assertion:
    plain_statement_ja: 滲出性中耳炎は、急性の耳感染の徴候や症状を伴わずに中耳に液体が貯留した状態であり、診療ガイドラインの対象は生後2か月から12歳の小児である。診断には空気圧耳鏡（pneumatic otoscopy）で中耳貯留液の存在を確認し、診断が不確かな場合はティンパノメトリーを行う。発達上のリスクのない小児では、発症時期が分かればその時点から、不明な場合は診断から3か月間の経過観察が推奨される。全身または経鼻ステロイド、全身抗菌薬、抗ヒスタミン薬や充血除去薬は治療に用いないことが推奨されている。
    condition:
      region: 米国
      study: 診療ガイドライン
    differential: null
    common_misconception: null
  provenance:
