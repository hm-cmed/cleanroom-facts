- id: OT-023
  domain: OT
  subdomain: 難聴
  assertion:
    plain_statement_ja: 音響外傷は、銃声や爆発のような衝撃騒音（インパルス騒音）への曝露によって生じる急性の聴覚障害である。多くの国では衝撃騒音の曝露限度はピーク音圧レベル140dBとされており、120dBを超える騒音は即時的な聴覚障害の原因となりうる。持続騒音への長期間の曝露で生じる騒音性難聴と異なり、単回の強い曝露でも永続的な域値上昇をもたらしうる点が特徴である。
