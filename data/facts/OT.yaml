  subdomain: 脳神経疾患
  assertion:
    plain_statement_ja: 三叉神経痛は、神経血管接触の程度により一次性（古典的または特発性）と、神経血管接触以外の病変による二次性とに分類される。臨床的特徴だけでは二次性を除外できないため、全例で3種類の高解像度シークエンスを組み合わせた MRI を行うべきであり、長期治療の第一選択薬はカルバマゼピンまたはオクスカルバゼピンで、薬物療法で痛みが十分に抑えられない場合や耐容できない場合は手術を提示すべきである。
