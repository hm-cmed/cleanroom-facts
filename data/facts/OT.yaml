- id: OT-013
  domain: OT
  subdomain: 中耳疾患
  assertion:
    plain_statement_ja: 耳管機能不全は、症状と徴候の持続が3か月未満を急性、3か月以上を慢性とし、拡張不全型、気圧変化誘発型、耳管開放型の3つの亜型に分ける国際コンセンサスがある。拡張不全型では、耳閉感、ポッピング音、不快感や痛み、圧迫感、水中にいるような感覚、こもった聴こえなどがみられ、上気道感染やアレルギー性鼻炎の増悪に続いて起こることが多い。耳管開放型では耳閉感と自声強聴が主症状で、臥位や上気道感染時に軽快し運動で悪化することがあり、急な体重減少が誘因となることがある。拡張不全型の診断は、症状に加えて、鼓膜の陥凹やティンパノグラムで示される中耳陰圧などの所見を組み合わせて行う。
    condition:
      region: 国際（コンセンサス）
      study: 国際コンセンサス声明
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1351
    source: 'Schilder AGM, Bhutta MF, Butler CC, Holy C, Levine LH, Kvaerner KJ, et al. Eustachian tube dysfunction: consensus statement on definition, types, clinical presentation and diagnosis. Clinical Otolaryngology. 2015;40(5):407-411.'
    doi: 10.1111/coa.12475
    pmid: '26347263'
    pmcid: PMC4600223
    url: https://doi.org/10.1111/coa.12475
    source_license: CC BY 4.0
    legal_basis: B
    source_class: OPEN
    corroboration: null
