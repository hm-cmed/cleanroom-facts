- id: OT-021
  domain: OT
  subdomain: 難聴
  assertion:
    plain_statement_ja: 特発性突発性感音難聴の初期治療として、発症後2週間以内であれば副腎皮質ステロイドを提案してもよいとされる（選択肢）。ステロイドと併用する高気圧酸素療法は、発症後2週間以内の初期治療、または発症後1か月以内のサルベージ治療として提案してもよい。発症後2〜6週間で回復が不完全な患者には、鼓室内ステロイド療法を提案する。一方、抗ウイルス薬、血栓溶解薬、血管拡張薬、血管作動薬のルーチン投与は行わないことが強く推奨されている。
