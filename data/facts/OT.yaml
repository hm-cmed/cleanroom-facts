- id: OT-035
  domain: OT
  subdomain: 脳神経疾患
  assertion:
    plain_statement_ja: Bell 麻痺は、原因不明の急性発症の一側性顔面神経麻痺であり、最も多い単神経障害である。診断では、病歴と身体診察によって顔面神経麻痺の同定可能な他の原因を除外することが強く推奨され、新規発症例に対して定型的な血液検査や画像検査は行わず、不完全麻痺の症例では電気診断検査も行わない。新たな神経所見の出現や、発症3か月後も回復が不完全な場合は、顔面神経の専門医への再評価・紹介が推奨される。
