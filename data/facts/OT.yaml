- id: OT-006
  domain: OT
  subdomain: 外耳疾患
  assertion:
    plain_statement_ja: 悪性外耳道炎（壊死性外耳炎）は、外耳道の侵襲性感染症で、まれではあるが生命を脅かす疾患であり、高齢者と免疫不全者、とくに糖尿病患者に多くみられる。頭蓋底骨髄炎へ進展し、脳神経麻痺、髄膜炎、硬膜静脈洞血栓症などの重篤な合併症を起こしうる。起因菌は緑膿菌が最も多い。治療の中心は、起因菌に応じた全身抗菌薬の長期投与であり、重症例では外科的治療が必要になることがある。病勢と治療反応の評価には、FDG-PET/CTや側頭骨のCT・MRIが有用である。
    condition:
      region: 海外（ドイツ）
      study: 総説
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1345
    source: Strasser V, Stecher L, Widann G, Steinbichler T. Diagnosis and management of necrotizing otitis externa. HNO. 2026;74(2):123-132.
    doi: 10.1007/s00106-025-01690-5
    pmid: '41384951'
    pmcid: PMC12855364
    url: https://doi.org/10.1007/s00106-025-01690-5
    source_license: CC BY 4.0
    legal_basis: B
    source_class: OPEN
    corroboration: null
  uncertainty: 出典はドイツ語の総説（英語抄録）で、内容は英語抄録で確認した範囲に基づく。抗菌薬の国内承認・保険適用は未確認。
