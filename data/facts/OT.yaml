- id: OT-018
  domain: OT
  subdomain: 難聴
  assertion:
    plain_statement_ja: 薬剤性難聴の原因となる聴器毒性は、薬剤の副作用として内耳または聴神経に生じ、蝸牛あるいは前庭の機能障害を特徴とする。聴器毒性のある薬剤は現代医療で重要な役割を担う一方、永続的な難聴や平衡障害による重大な障害をもたらしうる。投与中の前向きな聴器毒性モニタリングによる早期検出は、治療変更の検討を通じて永続的な難聴や平衡障害を最小化、または予防するために重要であるが、モニタリング手順はプロトコル間でばらつきがあり、標準化が課題となっている。
