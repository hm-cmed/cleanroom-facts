- id: OT-044
  domain: OT
  subdomain: 脳神経疾患
  assertion:
    plain_statement_ja: 頸静脈孔周囲の病変では、第IX・X・XI脳神経の麻痺（頸静脈孔症候群）に第XII脳神経麻痺を伴う Collet-Sicard 症候群を生じ、軟口蓋麻痺を含む嚥下障害と嗄声が最も多い症状である。135例の集積では、原因は腫瘍性が39.6%、血管性が27.6%で、病変部位は頸静脈孔が44.4%、傍咽頭後茎状突起間隙が28.9%であった。
    condition:
      region: 国際（症例集積）
      study: スコーピングレビュー
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1367
    source: 'Aguilera-Pena MP, Castiblanco MA, Osejo-Arcos V, Aponte-Caballero R, Gutierrez-Gomez S, Abaunza-Camacho JF, Guevara-Moriones N, Benavides-Burbano CA, Riveros-Castillo WM, Saavedra JM. Collet-Sicard syndrome: a scoping review. Neurosurg Rev. 2023;46(1):244.'
    doi: 10.1007/s10143-023-02145-7
    pmid: '37707587'
    pmcid: null
    url: https://doi.org/10.1007/s10143-023-02145-7
    source_license: © Springer Nature（exclusive licence、CC表示なし）
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 数値はいずれも抄録に記載された症例集積（135例）の結果である。本資料は第IX〜XII脳神経の合併麻痺を対象としており、軟口蓋麻痺単独の原因や頻度は確認できなかったため含めていない。症例報告の集積であるため、頻度の解釈には報告バイアスの可能性がある。
