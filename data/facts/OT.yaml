- id: OT-002
  domain: OT
  subdomain: 外耳疾患
  assertion:
    plain_statement_ja: Ramsay Hunt症候群は、水痘・帯状疱疹ウイルスが膝神経節に感染して生じる病態で、耳（外耳道・耳介）や口腔の小水疱、耳痛、末梢性顔面神経麻痺を呈し、非外傷性の末梢性顔面神経麻痺の原因として2番目に多い。難聴を伴うこともあり、帯状疱疹を伴わないBell麻痺との鑑別が重要で、早期の診断が予後を左右する。
    condition:
      region: 海外
      study: 総説
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1342
    source: 'Goswami Y, Gaurkar SS. Ramsay Hunt Syndrome: An Introduction, Signs and Symptoms, and Treatment. Cureus. 2023;15(1):e33688.'
    doi: 10.7759/cureus.33688
    pmid: '36793818'
    pmcid: PMC9925029
    url: https://doi.org/10.7759/cureus.33688
    source_license: CC BY 4.0
    legal_basis: B
    source_class: OPEN
    corroboration: null
  uncertainty: 発症頻度の具体的な数値は出典の抄録・本文で確認した範囲に含まれないため記載していない。
  curriculum:
    core_curriculum: 'PS-02-16-05 (id: JkxnuTo)'
    kokushi: 医学各論 Ⅲ-7-A-②（耳性帯状疱疹<Ramsay Hunt症候群>、a）
