- id: OT-020
  domain: OT
  subdomain: 難聴
  assertion:
    plain_statement_ja: 突発性感音難聴は、米国で年間10万人あたり5〜27人に発生し、年間約66,000例の新規患者があるとされ、その90%以上は特発性である。初診時には伝音難聴と感音難聴を鑑別し、発症後14日以内に聴力検査を行って診断を確定すること、後迷路性病変の評価のためにMRIまたは聴性脳幹反応（ABR）を行うことが推奨される。一方、初回評価での日常的な頭部CTや日常的な血液検査は行わないことが強く推奨されている。患者には、疾患の自然経過と治療の利益・リスク、既存エビデンスの限界を説明することが強く推奨されている。
