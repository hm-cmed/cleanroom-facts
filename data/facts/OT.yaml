- id: OT-007
  domain: OT
  subdomain: 外耳疾患
  assertion:
    plain_statement_ja: 外耳道癌は頭頸部癌の中でもまれな腫瘍で、病理学的には扁平上皮癌が主体である。日本の単施設で初回治療を行った外耳道扁平上皮癌73例（modified Pittsburgh分類で病期を評価）では、3年無再発生存率が81.9%、3年疾患特異的生存率が89.1%であり、手術例では切除断端陽性が再発に関する有意な予後因子であった（ハザード比11.97）。標準治療は確立しておらず、手術、放射線治療、化学療法を組み合わせた集学的治療が行われている。
    condition:
      region: 日本
      study: 後方視的研究（単施設、73例）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1346
    source: 'Ooka T, Ariizumi Y, Asakage T, Tsutsumi T. Treatment outcomes of 73 cases of external auditory canal squamous cell carcinoma: A single-center six-year analysis in Japan. Auris Nasus Larynx. 2025;52(2):158-166.'
    doi: 10.1016/j.anl.2025.02.001
    pmid: '39938395'
    pmcid: null
    url: https://doi.org/10.1016/j.anl.2025.02.001
    source_license: ライセンス表示を確認できず
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 数値は日本の単施設の後方視的検討に基づく値。化学療法の個別のレジメンは出典の範囲外で、薬剤の国内承認・保険適用は未確認。
  curriculum:
    core_curriculum: 'PS-02-16-05 (id: JkxnuTo)'
