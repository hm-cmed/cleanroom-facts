- id: OT-001
  domain: OT
  subdomain: 外耳疾患
  assertion:
    plain_statement_ja: 外耳道異物は全年齢でみられる耳科救急疾患であり、異物の種類は年齢によって異なる（未就学児では玩具が多く、成人では昆虫や耳に関連する医療用品が多い）。韓国の単施設で16年間に扱った411例の後方視的検討では、手術的摘出を要したのは10.2%で、未就学児と他院受診歴のある症例で手術率が高く、合併症は全体で1.9%だったが手術例では19.0%に上ったため、初回評価と早期の紹介が重要である。
    condition:
      region: 韓国
      study: 後方視的研究（単施設、411例）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1341
    source: 'Kim SH, Lee DS, Choi SW, Oh SJ, Lee IW, Lee HM. Epidemiological characteristics and surgical management of external auditory canal foreign bodies: A 16-year single center retrospective study. American Journal of Otolaryngology. 2026;47(3):104774.'
    doi: 10.1016/j.amjoto.2025.104774
    pmid: '42068661'
    pmcid: null
    url: https://doi.org/10.1016/j.amjoto.2025.104774
    source_license: ライセンス表示を確認できず
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 数値は韓国の単施設の後方視的検討に基づく値で、日本の疫学データではない。
  curriculum:
    core_curriculum: 'PS-02-16-05 (id: JkxnuTo)'
    kokushi: 医学各論 Ⅲ-7-A-①（外耳道異物、a）
