- id: OT-008
  domain: OT
  subdomain: 中耳疾患
  assertion:
    plain_statement_ja: 水疱性鼓膜炎では難聴を伴うことが多く、単施設の症例集積では81例中50例（62%）に難聴が確認された。文献例と合わせた統合解析では、難聴が確認された症例のうち感音難聴が27%、混合性難聴が55%を占め、純粋な伝音難聴は少数であった。このため、病歴と身体所見だけでは感音難聴を除外できず、正式な聴力検査が必須であり、ステロイド治療は聴力検査の結果を待って遅らせるべきではないとされる。
    condition:
      region: 海外
      study: 症例集積と系統的レビュー
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1347
    source: 'Ungar OJ, Handzel O, Oron Y, Eta RA, Muhanna N, Warshavsky A, et al. The Actual Incidence and Types of Hearing Losses in Bullous Myringitis: Case Series and Systematic Review. Otology & Neurotology. 2021;42(7):1008-1013.'
    doi: 10.1097/MAO.0000000000003160
    pmid: '33883520'
    pmcid: null
    url: https://doi.org/10.1097/MAO.0000000000003160
    source_license: ライセンス表示を確認できず
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 割合は海外の症例集積と文献レビューの統合値。ステロイドの国内承認・保険適用は未確認（鼓膜炎への適応を含む）。
