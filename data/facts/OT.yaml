- id: OT-012
  domain: OT
  subdomain: 中耳疾患
  assertion:
    plain_statement_ja: 慢性化膿性中耳炎は、急性中耳炎に続発して鼓膜穿孔を通し中耳から持続的な耳漏が続く状態で、発展途上国を中心に予防可能な難聴の重要な原因である。診断は耳鏡で鼓膜穿孔と耳漏、中耳粘膜の変化を確認して行う。管理の目標は感染の根絶と鼓膜穿孔の閉鎖であり、耳処置（aural toilet）と点耳治療が基本となる。点耳キノロン薬は他の点耳抗菌薬より耳漏の消失に有効で、耳毒性の危険がないとされる。なお、小児の急性中耳炎の多くは2〜3か月で治癒するため、耳漏が2週間を超えただけでは本症と確定できない。
