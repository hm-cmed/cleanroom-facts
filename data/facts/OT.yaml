- id: OT-017
  domain: OT
  subdomain: 難聴
  assertion:
    plain_statement_ja: 騒音性難聴は、加齢性難聴に次いで多い感音難聴の原因であり、世界人口の約5%が罹患するとされる。診断は騒音曝露歴の聴取と純音聴力検査によって行い、3〜6kHzの範囲のノッチ（切痕）または下方への膨らみが特徴的な聴力像である。職業性曝露の管理では、2000、3000、4000Hzにおける基準聴力からの10dBの確認された域値変動が、永続的難聴の警告指標として用いられる。負担の軽減には予防と早期発見が要である。
