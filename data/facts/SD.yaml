- id: SD-023
  domain: SD
  subdomain: Werner症候群
  assertion:
    plain_statement_ja: Werner 症候群は、RECQ ファミリーの DNA ヘリカーゼをコードする WRN 遺伝子の機能喪失変異による常染色体劣性の疾患で、加速した老化に似た徴候を多臓器に呈する代表的な早老症である。WRN 蛋白は DNA の修復・組換え・複製・転写やテロメアの維持に関わり、その障害によるゲノム不安定性が老化様表現型の基盤とされる。
