- id: SD-037
  domain: SD
  subdomain: 皮膚腺病、硬結性紅斑
  assertion:
    plain_statement_ja: 結核菌感染に伴う皮膚病変には、菌そのものが皮膚に侵入・播種して生じる病変のほか、感染に対する過敏反応として生じる病変（結核疹）がある。硬結性紅斑は過敏反応による病変に位置づけられ、皮膚腺病はリンパ節結核が拡大して皮膚へ穿破した病態である。皮膚生検の病理組織所見が、これらの病変の切り分けに役立つ。
    condition:
