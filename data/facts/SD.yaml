- id: SD-034
  domain: SD
  subdomain: ガス壊疽
  assertion:
    plain_statement_ja: ガス壊疽は、ウェルシュ菌（Clostridium perfringens）をはじめとするクロストリジウム属による筋壊死（クロストリジウム性筋壊死）で、壊死性軟部組織感染症の一型である。外傷や手術創などから菌が侵入し、急速な筋壊死とガス産生、強い全身毒性を来す。治療は緊急の外科的デブリードマン（壊死組織の切除）と抗菌薬の併用が中心となる。
