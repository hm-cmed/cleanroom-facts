- id: SD-033
  domain: SD
  subdomain: 壊死性筋膜炎
  assertion:
    plain_statement_ja: 壊死性筋膜炎は、皮下組織から筋膜に沿って急速に進展する壊死性の軟部組織感染症で、複数の菌による多菌性のものと、A 群レンサ球菌など単一菌によるものとがある。強い疼痛や急速な全身状態の悪化を伴い、治療の要は早期の外科的デブリードマンと広域抗菌薬の併用であり、介入の遅れが死亡率を押し上げる。
