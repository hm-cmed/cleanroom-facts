- id: SD-026
  domain: SD
  subdomain: 蜂巣炎<蜂窩織炎>
  assertion:
    plain_statement_ja: 蜂窩織炎は真皮深層と皮下組織の感染症で、拡大する発赤、熱感、圧痛、腫脹を呈する。診断は主に病歴と身体所見に基づいて行われ、類似した外観を呈する疾患が多い。原因菌が同定できるのは約15%で、その多くはβ溶血性レンサ球菌と黄色ブドウ球菌である。米国では年間約1,450万件が発生すると推定されている。
