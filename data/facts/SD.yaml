  subdomain: スポロトリコーシス
  assertion:
    plain_statement_ja: スポロトリコーシスは二形性真菌 Sporothrix schenckii による感染症で、菌に汚染された土壌、植物、有機物の外傷性接種によって感染し、花卉栽培や農業などの作業との関連が知られる。病変は通常、皮膚、皮下組織と近傍のリンパ管に限局する。診断のゴールドスタンダードは培養であり、ヒトとネコのいずれでも第一選択の治療はイトラコナゾールである。
