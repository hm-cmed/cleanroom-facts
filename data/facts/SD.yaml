- id: SD-029
  domain: SD
  subdomain: ひょう疽
  assertion:
    plain_statement_ja: ひょう疽は指尖腹側の閉鎖された区画（指腹）内に生じる感染症で、腫脹により強い拍動性疼痛を来す。浮腫と膿の貯留による圧迫で周囲組織の血流が妨げられ虚血に陥る危険があり、長期化すると骨・関節・腱へ感染が波及する。切開排膿と抗菌薬による速やかな治療を行わないと、組織の破壊や感染の拡大、全身状態の悪化を来し得る。
