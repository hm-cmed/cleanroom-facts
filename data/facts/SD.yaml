- id: SD-038
  domain: SD
  subdomain: 白癬、カンジダ症
  assertion:
    plain_statement_ja: 白癬（皮膚糸状菌症）は侵される部位によって分類され、体部白癬と頭部白癬は思春期前の小児に多く、股部白癬、足白癬、爪白癬（爪真菌症の最多の型）は思春期以降に多い。臨床所見だけでは湿疹や乾癬など他の疾患と紛らわしく診断が不確実なことがあるため、検査による確認が望ましい。近年出現している新興の白癬は重症化しやすく、専門的な診断検査を要することがある。
