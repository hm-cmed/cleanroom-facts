    source: Lehmann AR, McGibbon D, Stefanini M. Xeroderma pigmentosum. Orphanet J Rare Dis. 2011;6:70.
    doi: 10.1186/1750-1172-6-70
    pmid: '22044607'
    pmcid: PMC3221642
    url: https://doi.org/10.1186/1750-1172-6-70
    source_license: CC BY 2.0
    legal_basis: B
    source_class: OPEN
