- id: SD-044
  domain: SD
  subdomain: 単純ヘルペス
  assertion:
    plain_statement_ja: 単純ヘルペスウイルス（HSV）感染症は一般人口の中に大きな感染源のプールを持つ伝染性の感染症で、口唇や性器などの粘膜皮膚病変を繰り返し来す。免疫抑制状態の宿主では重篤な合併症を生じうる。Fatahzadeh と Schwartz の総説は、粘膜皮膚の HSV 感染症について疫学、病因、症状、診断の特徴と管理の方策をまとめている。
