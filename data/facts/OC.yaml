- id: OC-001
  domain: OC
  subdomain: 金属中毒
  assertion:
    plain_statement_ja: 成人の鉛曝露の医学的管理では、単回の血中鉛濃度が30 µg/dLを超えた場合、または4週間の間隔をあけた2回連続の測定がいずれも20 µg/dL以上だった場合は、鉛曝露のある業務から外すことが推奨される。血中鉛10〜19 µg/dLの人は3か月ごと、10 µg/dL未満が持続する人は6か月ごとの血中鉛測定が推奨される。妊婦は血中鉛が5 µg/dLを超えるような職業性・非職業性の鉛曝露を避けることが望ましい。キレート療法は、症状のある高度曝露では補助的な役割がありうるが、無症状の人には推奨されない。
    condition:
      region: 米国
      対象: 職業性鉛曝露のある成人
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-4034
    source: Kosnett MJ, Wedeen RP, Rothenberg SJ, et al. Recommendations for medical management of adult lead exposure. Environ Health Perspect. 2007;115(3):463-471
    doi: 10.1289/ehp.9784
    pmid: '17431500'
    pmcid: PMC1849937
    url: https://doi.org/10.1289/ehp.9784
    source_license: CC0（全文リポジトリの表示で確認）
    legal_basis: B
    source_class: OPEN
    corroboration: null
  uncertainty: 本カードの閾値と測定間隔は米国の専門家推奨（2007年）であり、国内の制度の数値ではない。国内では鉛中毒予防規則に基づく作業環境管理・作業管理と特殊健康診断（鉛）による健康管理の枠組みがあり、血中鉛濃度による区分で管理されるが、その区分の数値は本カードの出典では確認していない。水銀・カドミウム・マンガンなど他の金属は本カードでは扱っていない。キレート療法に用いる薬剤の国内承認・保険適用の状況は、本カードでは確認していない。
