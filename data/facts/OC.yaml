- id: OC-007
  domain: OC
  subdomain: 職業性腰痛
  assertion:
    plain_statement_ja: 職場における腰痛予防対策指針（2013年改訂）では、人力のみにより物を取り扱う場合の重量の目安は、満18歳以上の男子労働者で体重のおおむね40%以下、女子労働者ではさらにその60%位までとされる。これを超える場合は身長差の少ない労働者2人以上で、各々に重量が均一にかかるように行わせるよう努めることとされる。介護・看護作業では、対象者の抱上げにはリフト等を積極的に使用し、原則として人力による人の抱上げは行わせない。重量物取扱い作業等に常時従事する労働者には、配置時とその後6月以内ごとに1回、医師による腰痛の健康診断を行う。
    condition:
      region: 日本
      対象: 労働者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-4040
    source: 厚生労働省労働基準局長通知「職場における腰痛予防対策の推進について」（平成25年6月18日、基発0618第1号）。別添「職場における腰痛予防対策指針及び解説」
    doi: null
    pmid: null
    pmcid: null
    url: null
    source_license: 政府標準利用規約
    legal_basis: B
    source_class: GOV_JP
    corroboration: null
  uncertainty: 数値は指針本文（別紙）から読み取ったものを含む。腰痛症そのものの診断・治療は神経・運動器の分野（SP）が正であり、本カードでは作業態様・予防・健康管理の側面のみを扱う。就業制限としての重量の基準（女性労働基準規則・年少者労働基準規則による妊婦・年少者の重量表）は就業禁止の枠組みであり、本カードの予防の目安とは異なる。
