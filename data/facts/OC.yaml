- id: OC-010
  domain: OC
  subdomain: 脳血管疾患
  assertion:
    plain_statement_ja: 脳血管疾患（脳内出血、くも膜下出血、脳梗塞、高血圧性脳症）については、血管病変等が自然経過を超えて著しく増悪して発症したといえる業務による明らかな過重負荷があった場合に、労災補償の対象となる。過重負荷の類型は、発症前の長期間にわたる特に過重な業務、発症に近接した短期間（おおむね1週間）の特に過重な業務、発症直前から前日までの間に遭遇した異常な出来事の3つである。長期間の過重業務については、発症前1か月間におおむね100時間、または発症前2か月間ないし6か月間にわたって1か月当たり80時間を超える時間外労働が認められる場合に、業務と発症との関連性が強いと評価でき、評価期間は発症前おおむね6か月間である。
