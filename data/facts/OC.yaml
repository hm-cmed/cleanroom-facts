- id: OC-006
  domain: OC
  subdomain: 農薬中毒
  assertion:
    plain_statement_ja: パラコートは急速だが不完全に吸収され、12〜24時間以内に大部分が未変化体として尿中に排泄される。活性酸素種の生成を介して脂質過酸化等による細胞障害を起こし、肺では肺臓炎と肺線維症、腎・肝にも障害を起こす。予後判定には血漿パラコート濃度、尿・血漿のジチオナイト試験、臨床所見が有用である。吸収を減らすため活性炭とフラー土が投与されるが、胃洗浄は行うべきではない。血液透析・血液吸着が臨床経過を変える可能性は低く、デキサメタゾン・シクロホスファミド等による免疫抑制療法の有効性の証拠は非常に弱い。
    condition:
      region: 国際
      対象: パラコートを摂取した患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-4039
    source: Gawarammana IB, Buckley NA. Medical management of paraquat ingestion. Br J Clin Pharmacol. 2011;72(5):745-757
    doi: 10.1111/j.1365-2125.2011.04026.x
    pmid: '21615775'
    pmcid: PMC3243009
    url: https://doi.org/10.1111/j.1365-2125.2011.04026.x
    source_license: ライセンス表示を確認できず
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 内容は総説の抄録で確認した範囲である。国内ではパラコート製剤について濃度の切り替え（24%製剤から5%製剤へ、1986年以降）と出荷の自粛の経緯が学会誌論文で報告されているが、毒物及び劇物取締法上の指定などの法制度面の一次資料は未確認である。既存出典 SRC-544（Yoon 2009、パラコート中毒の臨床転帰の短報）は接点としてあるが、本カードでは使用していない。
