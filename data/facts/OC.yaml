- id: OC-014
  domain: OC
  subdomain: 心身症
  assertion:
    plain_statement_ja: 職業性ストレスによる健康問題への職場の一次予防の中心は、労働安全衛生法第66条の10に基づくストレスチェック制度である。事業者は、常時使用する労働者に対し1年以内ごとに1回、医師・保健師等による心理的な負担の程度を把握するための検査を行わなければならず（現行は常時50人以上の事業場で義務、常時50人未満の事業場は2028年4月1日から義務化される）、検査結果は実施者から本人に直接通知され、本人の同意なく事業者に提供されることはない。高ストレス等で面接指導が必要とされた労働者から申出があった場合、事業者は医師による面接指導を行わなければならず、申出を理由とする不利益な取扱いは禁止される。
