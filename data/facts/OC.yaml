- id: OC-003
  domain: OC
  subdomain: 有機溶剤中毒
  assertion:
    plain_statement_ja: 有機溶剤中毒予防規則は、有機溶剤による中毒を予防するための省令である。対象となる「有機溶剤等」は、有機溶剤そのものと、有機溶剤を混合物の重量の5%を超えて含有する有機溶剤含有物を指し、対象の有機溶剤は労働安全衛生法施行令別表第六の二に掲げられる。規則は、設備・換気装置による作業環境の整備、有機溶剤作業主任者の選任などの管理、作業環境測定、健康診断（特殊健康診断）、保護具の使用などを事業者に求める構成になっている。
    condition:
      region: 日本
      対象: 有機溶剤を取り扱う事業者と労働者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-4036
    source: 有機溶剤中毒予防規則（昭和47年労働省令第36号）
    doi: null
    pmid: null
    pmcid: null
    url: null
    source_license: 法令本文（著作権法第13条により著作権の目的とならない）
    legal_basis: B
    source_class: GOV_JP
    corroboration: null
  uncertainty: 条文・目次は厚生労働省の法令ページで確認した。2022年以降の化学物質の自律的管理への移行に伴い個別規則には適用除外等の改正が入っており、各条文の最終改正日の逐語確認はしていない。有機溶剤の依存・乱用としての側面は第55回（TX）で扱っており、本カードでは産業曝露による中毒の予防の側面のみを扱う。
