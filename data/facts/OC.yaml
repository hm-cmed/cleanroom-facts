  subdomain: うつ病
  assertion:
    plain_statement_ja: うつ病は、心理的負荷による精神障害の認定基準の対象疾病の代表例であり（ICD-10では気分［感情］障害、F3）、過重労働との関係は脳・心臓疾患の認定基準ではなく精神障害の認定基準によって判断される。すなわち、発病前おおむね6か月の業務による強い心理的負荷の有無で評価され、長時間労働については、発病直前の1か月におおむね160時間を超える時間外労働が「特別な出来事」として心理的負荷が「強」になる一方、月100時間程度の時間外労働は単独では「強」とはならず、業務量の大幅な増加などの出来事と組み合わせて評価される。
