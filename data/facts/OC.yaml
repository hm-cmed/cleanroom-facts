- id: OC-011
  domain: OC
  subdomain: 虚血性心疾患
  assertion:
    plain_statement_ja: 虚血性心疾患等（心筋梗塞、狭心症、心停止（心臓性突然死を含む）、重篤な心不全、大動脈解離）は、脳血管疾患と共通の枠組みで労災認定され、業務による明らかな過重負荷によって血管病変等がその自然経過を超えて著しく増悪して発症した場合に補償の対象となる。重篤な心不全（不整脈によるものを含む）は、令和3年の認定基準改正で対象疾病に追加された。認定に当たっては、労働時間の水準に至らない場合でも、休日のない連続勤務、勤務間インターバルの短さ、心理的負荷や身体的負荷を伴う業務といった労働時間以外の負荷要因もあわせて総合的に評価される。
