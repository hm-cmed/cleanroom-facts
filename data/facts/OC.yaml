- id: OC-009
  domain: OC
  subdomain: VDT作業による障害
  assertion:
    plain_statement_ja: 情報機器作業の労働衛生管理では、一連続作業時間が1時間を超えないようにし、次の連続作業までの間に10分〜15分の作業休止時間を設け、かつ一連続作業時間内において1回〜2回程度の小休止を設けるよう指導される。作業環境の目安として、ディスプレイを用いる場合の書類上およびキーボード上の照度は300ルクス以上とされ、ディスプレイとはおおむね40cm以上の視距離を確保し、画面の上端が眼の高さとほぼ同じかやや下になる高さが望ましいとされる。健康診断は配置前と1年以内ごとに1回実施し、眼疲労を主とする視器症状、上肢・頸肩腕部・腰背部を主とする筋骨格系症状、ストレスに関する症状の自覚症状の調査と、眼科学的検査等を行う。
