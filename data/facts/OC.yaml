    source: Moscato G, Vandenplas O, Gerth van Wijk R, et al.; EAACI Task Force on Occupational Rhinitis. EAACI position paper on occupational rhinitis. Respir Res. 2009;10:16
    doi: 10.1186/1465-9921-10-16
    pmid: '19257881'
    pmcid: PMC2654869
    url: https://doi.org/10.1186/1465-9921-10-16
    source_license: CC BY 2.0（全文公開ページで確認）
    legal_basis: B
    source_class: OPEN
    corroboration: null
  uncertainty: 鼻アレルギーの診断・治療の一般論は Ⅲ・Ⅺ が正であり、本カードは職業性鼻炎の側面に限る。国内の鼻アレルギー診療ガイドラインは2024年版（第10版）が現行であり、既存の SRC-1373（2020年版）は旧版である。
