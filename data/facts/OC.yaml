- id: OC-002
  domain: OC
  subdomain: ガス中毒
  assertion:
    plain_statement_ja: 微生物の活動によって発生する硫化水素による労働災害では、下水道・廃水処理施設・バイオガスプラントなど閉鎖的で換気の不良な空間で高濃度曝露が繰り返し記録され、重症・致死例が多い。硫化水素は呼吸中枢の抑制により急速な意識消失（knockdown）を起こし、高濃度では嗅覚でガスを感知する能力が失われるため、救助に入った者を含む複数の労働者が巻き込まれる事案も多い。予防策として検知技術・換気・安全手順の厳格化が挙げられている。
    condition:
      region: 国際
      対象: 労働者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-4035
    source: Vranová M, Štěpánková L, Kushkevych I, et al. Occupational injuries caused by exposure to hydrogen sulfide generated by microbial activity. Environ Occup Health Pract. 2026;8(1)
    doi: 10.1539/eohp.2025-0048
    pmid: '42798716'
    pmcid: PMC13612910
    url: https://doi.org/10.1539/eohp.2025-0048
    source_license: CC BY-NC（全文リポジトリの表示で確認）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 2026年掲載の総説であり、書誌（誌名・巻号）はEurope PMCで再確認したが、ページ番号は未確認である。一酸化炭素中毒は神経の分野（ND）で作成済みのため本項目では作り直していない。塩素ガスの医学的管理については既存出典 SRC-564（ATSDR の Medical Management Guidelines、GOV_US）が接点になるが、本パートでは使用していない。
