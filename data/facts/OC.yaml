      対象: 労働者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-4043
    source: 厚生労働省労働基準局長通知「血管病変等を著しく増悪させる業務による脳血管疾患及び虚血性心疾患等の認定基準について」（令和3年9月14日、基発0914第1号）
    doi: null
    pmid: null
    pmcid: null
    url: null
    source_license: 政府標準利用規約
    legal_basis: B
    source_class: GOV_JP
    corroboration: null
  uncertainty: 通達全文の逐語照合は未了であり、対象疾病と時間の目安は厚労省のパンフレットと改正ポイントで相互に照合した範囲に限る。「1か月当たりおおむね45時間を超えない場合は関連性が弱い」とする段階評価の正確な文言は、通達原文での再確認が必要である。脳血管疾患の病態・診断・治療は Ⅸ・循環器が正であり、本カードは労災認定の側面に限る。
