- id: OC-022
  domain: OC
  subdomain: じん肺
  assertion:
    plain_statement_ja: じん肺とは、鉱物性粉じんを吸入することによって生じた肺の変化と、これと肺結核の合併した病気をいう（じん肺法第2条）。粉じん作業に従事する労働者にはじん肺健康診断が行われ、その方法はエックス線写真による検査及び粉じん作業についての職歴の調査、胸部に関する臨床検査、結核精密検査並びに心肺機能検査である（同法第3条）。エックス線写真の像は第1型から第4型までに区分され（同法第4条第1項）、健康管理の区分は、じん肺にかかっていないと認められる管理一から、エックス線写真の像が第1型又は第2型で心肺機能の障害その他の症状がないもの等の管理二まで、管理一から管理四までに区分される。
    condition:
      region: 日本
      対象: 粉じん作業に従事する労働者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-429
    source: じん肺法（昭和35年法律第30号、最終改正 平成30年7月6日）
    doi: null
    pmid: null
    pmcid: null
    url: null
    source_license: 法令（著作権法13条により権利の目的とならない）
    legal_basis: B
    source_class: GOV_JP
    corroboration: null
  uncertainty: 管理三・管理四の定義文の逐語確認は未了であり、管理一・管理二は条文テキストで確認した範囲に限った。じん肺の画像所見・病態・治療は Ⅳ が正であり、本カードはじん肺法の健康診断と管理区分の側面に限る。
