- id: OC-012
  domain: OC
  subdomain: 自殺
  assertion:
    plain_statement_ja: 業務による強い心理的負荷で精神障害を発病した労働者が自殺を図った場合、その業務起因性は精神障害の認定の枠組みの中で判断される。精神障害の認定には、認定基準の対象となる精神障害（ICD-10第Ⅴ章のうち主にF20〜F48）を発病していること、発病前おおむね6か月の間に業務による強い心理的負荷が認められること、業務以外の心理的負荷及び個体側要因により発病したとは認められないことの3要件が必要である。発病直前の1か月におおむね160時間を超える時間外労働は「特別な出来事」に当たり、心理的負荷の総合評価は「強」になる。
