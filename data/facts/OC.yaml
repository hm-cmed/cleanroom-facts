- id: OC-018
  domain: OC
  subdomain: 鼻アレルギー<アレルギー性鼻炎>
  assertion:
    plain_statement_ja: 職業性鼻炎は、特定の作業環境に起因し職場外の刺激によらない鼻の炎症性疾患であり、作業関連鼻炎は職業性鼻炎と作業増悪性鼻炎に分けられる。感作物質に曝露される労働者の調査では、職業性鼻炎は職業性喘息の2〜4倍多く、曝露レベルがIgE介在性感作と職業性鼻炎の最も重要な決定因子である。職業性鼻炎は職業性喘息に先行することが多く、サーベイランスは曝露開始後2〜5年に重点を置くことが提案されている。アレルギー性の職業性鼻炎では、原因曝露の完全回避が最も安全で有効な選択肢とされる。
    condition:
      region: 国際
      対象: 労働者
    differential: null
    common_misconception: null
  provenance:
