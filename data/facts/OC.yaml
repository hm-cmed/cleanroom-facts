- id: OC-016
  domain: OC
  subdomain: 職業性喘息
  assertion:
    plain_statement_ja: 職業性喘息は多くの国で最も頻繁に報告される職業性呼吸器疾患であり、頻繁に報告される原因物質にはイソシアネート、小麦粉・穀物粉じん、コロホニーとフラックス、ラテックス、動物由来物質、アルデヒド、木粉じんがある。曝露レベルが発症リスクの主要な決定因子であり、症例を防ぐ最も重要な行動は発生源での曝露の低減である。リスクのある労働者には、呼吸器質問票を中心とする定期的な健康サーベイランス（必要に応じて機能的・免疫学的検査を追加）を行い、職業性喘息が確認された者には、発症早期に原因物質への曝露の完全な回避を助言することが回復の最良の機会となる。
    condition:
      region: 英国
      対象: 労働者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-4047
    source: Nicholson PJ, Cullinan P, Newman Taylor AJ, Burge PS, Boyle C. Evidence based guidelines for the prevention, identification, and management of occupational asthma. Occup Environ Med. 2005;62(5):290-299
    doi: 10.1136/oem.2004.016287
    pmid: '15837849'
    pmcid: PMC1741012
    url: https://doi.org/10.1136/oem.2004.016287
    source_license: 未確認（全文公開ページに CC 表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 英国のエビデンスに基づくガイドラインであり、原因物質の分布や健康管理の制度は日本と異なる場合がある。喘息の診断・薬物治療の一般論は Ⅳ が正であり、本カードは職業曝露と予防の側面に限る。ライセンス表示は全文公開ページで確認できなかったため、購読誌として RESTRICTED とした。
