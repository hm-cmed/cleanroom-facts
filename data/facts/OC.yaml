- id: OC-005
  domain: OC
  subdomain: 農薬中毒
  assertion:
    plain_statement_ja: 急性有機リン農薬中毒の致命率は一般に15%を超える。管理の中心は早期の蘇生であり、アトロピン投与、酸素投与、呼吸補助、輸液により組織への酸素供給を改善することが合意されている。オキシム（プラリドキシム等）の役割は完全には明らかになっておらず、特定の農薬による中毒や中等症の患者にのみ有益な可能性がある。アトロピン・オキシム・ジアゼパムの最適な投与方法は、長年の使用歴にもかかわらず確立していない。
    condition:
      region: 国際
      対象: 有機リン農薬中毒の患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-4038
    source: Eddleston M, Buckley NA, Eyer P, Dawson AH. Management of acute organophosphorus pesticide poisoning. Lancet. 2008;371(9612):597-607
    doi: 10.1016/S0140-6736(07)61202-1
    pmid: '17706760'
    pmcid: PMC2493390
    url: https://doi.org/10.1016/S0140-6736(07)61202-1
    source_license: ライセンス表示を確認できず（全文リポジトリで無料公開あり）
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 致命率と管理の内容は総説の抄録で確認した範囲である。硫酸アトロピンとプラリドキシムヨウ化物は、国内の公的資料（厚生労働科学研究の化学テロ対応資料）で有機リン系中毒の解毒薬として用法とともに記載されるが、同資料には国内製剤の添付文書とは用法・用量が異なる場合がある旨の注意があり、農薬中毒の通常診療における個別製剤の添付文書の効能・効果と用法・用量は本作成では未照合である。
