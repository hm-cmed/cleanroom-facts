- id: OC-004
  domain: OC
  subdomain: 化学物質中毒
  assertion:
    plain_statement_ja: 化学物質による労働災害防止の新たな規制は、国が定める一律の管理から、事業者がリスクアセスメントの結果に基づいて自律的に管理する仕組みへの転換である。リスクアセスメント対象物を製造し、または取り扱う事業者には化学物質管理者の選任が、リスクアセスメント結果に基づき労働者に保護具を使用させる事業場には保護具着用管理責任者の選任が必要になった。あわせて、SDS等による情報伝達の強化、化学物質に関する管理体制の強化、衛生委員会における管理状況のモニタリング、教育の全業種への拡大が柱とされる。
    condition:
      region: 日本
      対象: 化学物質を取り扱う事業者と労働者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-4037
    source: 厚生労働省. 化学物質による労働災害防止のための新たな規制について（労働安全衛生規則等の一部を改正する省令等の施行について、令和4年5月31日付け基発0531第9号に基づく解説資料）
    doi: null
    pmid: null
    pmcid: null
    url: null
    source_license: 政府標準利用規約
    legal_basis: B
    source_class: GOV_JP
    corroboration: null
  uncertainty: 制度の概略は厚生労働省の解説資料で確認した。ラベル表示・SDS交付・リスクアセスメント・ばく露低減措置の対象物質は約2,900物質へ拡大する施行が2026年4月とされていたが、本作成時点で拡大後の対象範囲の逐語確認はしていない。個別物質の中毒は金属・ガス・有機溶剤・農薬の各項目で扱い、本カードでは化学物質管理の一般的枠組みのみを扱う。
