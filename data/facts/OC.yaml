  subdomain: 適応障害
  assertion:
    plain_statement_ja: 適応障害は、心理的負荷による精神障害の認定基準の対象疾病の代表例に含まれ（ICD-10ではF43.2、対象範囲は主にF20〜F48）、業務による強い心理的負荷によって発病した場合は労災認定の対象となりうる。判断は、発病前おおむね6か月の間に起きた出来事を業務による心理的負荷評価表に沿って評価し、心理的負荷の強さを総合的に判断して行われる。令和5年の改正では、顧客や取引先等からの著しい迷惑行為（カスタマーハラスメント）と、感染症等の病気や事故の危険性が高い業務が、評価表の出来事に追加された。
