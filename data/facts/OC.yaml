- id: OC-023
  domain: OC
  subdomain: 酸素欠乏症
  assertion:
    plain_statement_ja: 酸素欠乏症とは酸素濃度18%未満の空気を吸入すると発症する症状をいい、硫化水素中毒とは硫化水素濃度10ppmを超える空気を吸入すると発症する症状をいう（酸素欠乏症等防止規則）。事業者は、酸素欠乏危険作業では作業場所の空気中の酸素濃度を18%以上（酸素欠乏と硫化水素の双方の危険がある第2種酸素欠乏危険作業では、酸素濃度18%以上かつ硫化水素濃度10ppm以下）に保つように換気しなければならず、換気には純酸素を使用してはならない。また、その日の作業を始める前に、酸素の濃度（第2種では酸素及び硫化水素の濃度）を測定しなければならない。
