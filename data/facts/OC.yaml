- id: OC-008
  domain: OC
  subdomain: 頸肩腕障害
  assertion:
    plain_statement_ja: 上肢作業に基づく疾病（上肢障害）の業務上外の認定は、①上肢等に負担のかかる作業を主とする業務に相当期間従事した後に発症したこと、②発症前に過重な業務に就労したこと、③過重な業務への就労と発症までの経過が医学上妥当であること、の3要件をすべて満たす場合に行われる。相当期間は原則として6か月程度以上とされる。過重な業務の目安には、同一事業場の同種労働者と比較しておおむね10%以上業務量が増加した状態が発症直前3か月程度にわたる場合が含まれる。認定基準において頸肩腕症候群は、出現する症状が様々で障害部位が特定できず、それに対応した診断名を下すことができない不定愁訴等を特徴とする疾病として狭義に用いられる。
    condition:
      region: 日本
      対象: 上肢作業に従事する労働者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-4041
    source: 労働省労働基準局長通知「上肢作業に基づく疾病の業務上外の認定基準について」（平成9年2月3日、基発第65号）
    doi: null
    pmid: null
    pmcid: null
    url: null
    source_license: 政府標準利用規約
    legal_basis: B
    source_class: GOV_JP
    corroboration: null
  uncertainty: 平成9年の通達の全文で確認した。平成22年の労働基準法施行規則別表第1の2の改正後も、該当性の判断はこの認定基準によると通知されている。神経・運動器の症候としての側面は神経・運動器の分野が正であり、本カードでは作業態様と労災認定の側面のみを扱う。
