- id: OC-019
  domain: OC
  subdomain: アレルギー性接触皮膚炎
  assertion:
    plain_statement_ja: 職業性接触皮膚炎の原因は、職場の物質、個人防護具、スキンケア製品の3群に分けて評価すると整理しやすい。アレルギー性職業性接触皮膚炎の診断にはパッチテストが必須である。北米の接触皮膚炎グループの後ろ向き解析で臨床的関連性の高い職業性感作物質には、ゴム促進剤（carba mix、thiuram mix、diphenylguanidine)、メチルイソチアゾリノン、ビスフェノールAエポキシ樹脂、ホルムアルデヒド、ニッケル、重クロム酸カリウム、2-ヒドロキシエチルメタクリレート、コバルトがあり、職種別では建設作業のクロム酸塩とエポキシ樹脂、理美容のパラフェニレンジアミン、医療従事者のゴムやグルタルアルデヒドなどが挙げられる。
    condition:
      region: 国際
      対象: 労働者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-4050
    source: 'Houle MC, Holness DL, DeKoven J. Occupational Contact Dermatitis: An Individualized Approach to the Worker with Dermatitis. Curr Dermatol Rep. 2021;10(4):182-191'
    doi: 10.1007/s13671-021-00339-0
    pmid: '34540358'
    pmcid: PMC8439371
    url: https://doi.org/10.1007/s13671-021-00339-0
    source_license: 未確認（全文公開ページでライセンス文を特定できず）
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 北米のデータを中心とした総説であり、感作物質の分布は日本と異なる場合がある（職種別の物質は出典の本文の表から読み取り）。皮膚所見・皮膚科的治療は Ⅲ が正であり、本カードは職業性の原因物質と評価の側面に限る。ライセンス文を特定できなかったため UNKNOWN とした。
