- id: OC-017
  domain: OC
  subdomain: 過敏性肺炎
  assertion:
    plain_statement_ja: 職業性過敏性肺炎は、職場に存在する有機物のみならず無機物への曝露でも生じうる免疫学的な肺疾患であり、機序には特異抗体反応（Ⅲ型）と感作リンパ球による反応（Ⅳ型）がある。急性の病態は肉芽腫形成を伴って非線維性の経過をとるのに対し、慢性では肉芽腫をほとんど形成せず線維化へ進む。原因抗原の同定が遅れて線維化が進んだ慢性型は予後不良であり、職業歴を含む早期の抗原同定と、原因抗原への曝露からの早期の離脱・治療が重要である。
    condition:
      region: 日本
      対象: 労働者
    differential: null
    common_misconception: null
