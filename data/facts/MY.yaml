- id: MY-001
  domain: MY
  subdomain: 結核
  assertion:
    plain_statement_ja: 結核は2024年には世界で推計1,070万人が発症し、123万人が死亡した。世界人口の約4分の1が結核菌に感染していると推定され、感染した人のうち発症するのは約5〜10%である。
    condition:
      region: 国際
      対象: 一般集団
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2146
    source: World Health Organization. Tuberculosis（ファクトシート、2024年データ、2026-03-24更新）
    doi: null
    pmid: null
    pmcid: null
    url: null
    source_license: WHO出版物の標準ライセンス（CC BY-NC-SA IGO系）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 数値は Global Tuberculosis Report 2025 に基づくファクトシート（2024年データ）の値。日本の新登録患者数・年齢分布・治療基準・届出は RI-036〜043 の範囲で、本カードでは扱わない。ページの URL はリサーチメモに記録がなかったため未記載である。ファクトシート個別のライセンス表示はページ上で特定しておらず、WHO 出版物の標準ライセンスに基づく判定で、最終判定は取り込み側に委ねる。
  curriculum:
    kokushi: 医学各論 Ⅻ-3-A-①（結核、a）
    core_curriculum: 'PS-01-03-05 (id: JkxnuLM)；PS-03-03-01 (id: JkxnuUg)'
