- id: MY-004
  domain: MY
  subdomain: 非結核性抗酸菌症
  assertion:
    plain_statement_ja: 人口ベースのデータでは、2000年以降、世界的にヒトの非結核性抗酸菌（NTM）感染症の有病率は増加している。Mycobacterium avium complex（MAC）は北米と東アジアで優位な菌群で、欧州の一部地域では M. kansasii、M. xenopi、M. malmoense が多い。
    condition:
      region: 国際
      対象: 成人
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2149
    source: 'Prevots DR, Marras TK. Epidemiology of human pulmonary infection with nontuberculous mycobacteria: a review. Clin Chest Med. 2015;36(1).'
    doi: 10.1016/j.ccm.2014.10.002
    pmid: '25676516'
    pmcid: PMC4332564
    url: https://doi.org/10.1016/j.ccm.2014.10.002
    source_license: CCライセンス表示なし
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN／GOV_US、作り手の調査バッチ96 2026-11-15）：Ratnatunga CN, Lutzky VP, Kupz A, Doolan DL, Reid DW, Field M, Bell SC, Thomson RM, Miles JJ. The Rise of Non-Tuberculosis Mycobacterial Lung Disease. Front Immunol. 2020;11:303／Dahl VN, Pedersen AA, Norman A, Rasmussen EM, van Ingen J, Andersen AB, Wejse CM, Lillebaek T. Clinical Significance, Species Distribution, and Temporal Trends of Nontuberculous Mycobacteria, Denmark, 1991-2022. Emerg Infect Dis. 2024;30(9):1755-1762（PMID: 32194556／39173666、DOI: 10.3389/fimmu.2020.00303／10.3201/eid3009.240095、PMCID: PMC7062685／PMC11346989、https://creativecommons.org/licenses/by/4.0/）。裏づける部分：部分：候補1（CC BY の総説）は、北米・欧州・アジアのいずれでも過去20年間に NTM 症の発生が増えていること、世界的に最も多い NTM の病原体は MAC であることを再掲する。候補2（デンマークの全国データ、GOV_US）は、1991〜2022年に肺 NTM 症の発生率が増加し続けたこと、M. malmoense がスカンジナビア以外の地域に比べて北欧で際立って多いこと、M. xenopi と M. kansasii はデンマークでは東欧・南欧に比べてまれであること（すなわち東欧・南欧では相対的に多いこと）を再掲する。ただし、MAC が「北米と東アジアで優位」という地域の組み合わせそのものと、欧州の一部地域で kansasii・xenopi・malmoense の3菌種が多いという主出典の形の再掲は、自由な全文にはない（候補2はデンマーク1国のデータと地域間の対比にとどまる）。数値の照合：数値の一致を主張するものではない。候補2の菌種別割合（デンマークで MAC が肺 NTM の58%、M. malmoense 4.2%等）はデンマーク1国の値であり、カードの地域分布の記述の裏づけとして数値そのものは使わないこと。留保：主出典（SRC-2149）の刊行版ライセンスは Crossref の版データで Elsevier の TDM のみで CC 表示はなく、現行 RESTRICTED が正しい。PMC 収載コピー（PMC4332564）は著者稿でライセンス表示はなく、自由とはいえない。識別子補完候補あり（SRC-2149 の PMCID。カード側には記録済みでマスターは null）。候補のライセンスは個別確認した（候補1は Crossref の版データ・Europe PMC の個別レコード・PMC 全文のライセンス要素で CC BY 4.0。候補2は PMC 全文のライセンス要素が米国政府刊行物として public domain と明示し、Europe PMC の個別レコードでも cc by）'
  uncertainty: 日本の肺NTM症の罹患率と菌種の地域分布は RI-047・048 の範囲で、本カードでは扱わない。皮膚のNTM症は SD-035 の範囲である。
