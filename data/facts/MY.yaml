- id: MY-003
  domain: MY
  subdomain: 結核
  assertion:
    plain_statement_ja: 結核は Mycobacterium tuberculosis complex による空気感染症で、感染の経過は肉芽腫内に菌が封じ込められた潜在性結核感染症から、症状を伴う伝染性の活動性結核までスペクトラムをなす。伝染性があるのは活動性肺結核のみである。
    condition:
      region: 国際
      対象: 一般
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2148
    source: Pai M, Behr MA, Dowdy D, et al. Tuberculosis. Nat Rev Dis Primers. 2016;2:16076.
    doi: 10.1038/nrdp.2016.76
    pmid: '27784885'
    pmcid: null
    url: https://doi.org/10.1038/nrdp.2016.76
    source_license: CCライセンス表示なし
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 感染後の各段階への移行率などの数値は本カードでは扱わない。日本の診断・治療基準は RI の範囲、結核性髄膜炎は NI-016・017 の範囲である。
  curriculum:
    kokushi: 医学各論 Ⅻ-3-A-①（結核、a）
    core_curriculum: 'PS-01-03-05 (id: JkxnuLM)；PS-01-03-02 (id: JkxnuLA)'
