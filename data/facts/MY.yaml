- id: MY-001
  domain: MY
  subdomain: 結核
  assertion:
    plain_statement_ja: 結核は2024年には世界で推計1,070万人が発症し、123万人が死亡した。世界人口の約4分の1が結核菌に感染していると推定され、感染した人のうち発症するのは約5〜10%である。
    condition:
      region: 国際
      対象: 一般集団
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2146
    source: World Health Organization. Tuberculosis（ファクトシート、2024年データ、2026-03-24更新）
    doi: null
    pmid: null
    pmcid: null
    url: null
    source_license: WHO出版物の標準ライセンス（CC BY-NC-SA IGO系）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN／OPEN、作り手の調査バッチ96 2026-11-15）：Chen F, Zhang Y, Chen L. Global financing retrenchment threatens the recovery in TB control. IJTLD Open. 2026;3(10):681-682／Myat Y, Cerrone M, Kon OM. What is new in tuberculosis? Clin Med (Lond). 2026;26(5):100634（PMID: 42866169／42575374、DOI: 10.5588/ijtldopen.26.0371／10.1016/j.clinme.2026.100634、PMCID: PMC13657025／PMC13520985、https://creativecommons.org/licenses/by/4.0/）。裏づける部分：部分：候補1（IJTLD Open の編集記事、CC BY）は「2024年には推計1,070万人が発症し、123万人が死亡した（うち HIV 陽性者は15万人）」と、主出典の基になった Global Tuberculosis Report 2025 の値をそのまま再掲する。候補2（Clin Med の総説、CC BY）は「2024年に推計1,070万人が結核を発症した」「世界人口の約4分の1が潜在性結核感染症を有すると推定される」を再掲する。感染した人のうち発症するのは約5〜10%であるという要素は、自由な全文では再掲されない（CDC の一般向けページは「未治療では不活性結核の10人に1人が発症する」とするが、これは未治療の潜在性感染を分母とする別の枠組みの値であり、5〜10%の再掲には数えない。申し送り参照）。数値の照合：一致：発症1,070万人・死亡123万人（2024年）は候補1の再掲と一致し、発症数は候補2も再掲する。世界人口の約4分の1は候補2の再掲と一致する。発症割合5〜10%は候補のいずれにも再掲がない。なお主出典のファクトシート現行版（2026-11-12更新）は2025年データ（発症1,060万人・死亡113万人）に差し替わっており、カードの値はカードが引用する版（2026-03-24更新、2024年データ）の値として正しい（監視事項として申し送り）。留保：主出典（SRC-2146）は WHO のファクトシートで、個別のライセンス表示はページ上に特定できず、マスターの license_note のとおり WHO 出版物の標準ライセンス（CC BY-NC-SA IGO 系、NC・SA を含む）に基づくため自由とはいえず、現行 RESTRICTED が正しい。候補のライセンスはいずれも個別確認した（候補1は PMC 全文のライセンス要素と Europe PMC の個別レコードで CC BY 4.0。Crossref にはライセンス登録なし。候補2は Crossref の版データ・Europe PMC の個別レコード・PMC 全文の表示で CC BY 4.0）'
  uncertainty: 数値は Global Tuberculosis Report 2025 に基づくファクトシート（2024年データ）の値。日本の新登録患者数・年齢分布・治療基準・届出は RI-036〜043 の範囲で、本カードでは扱わない。ページの URL はリサーチメモに記録がなかったため未記載である。ファクトシート個別のライセンス表示はページ上で特定しておらず、WHO 出版物の標準ライセンスに基づく判定で、最終判定は取り込み側に委ねる。
