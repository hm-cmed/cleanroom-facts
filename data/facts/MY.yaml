- id: MY-005
  domain: MY
  subdomain: 非結核性抗酸菌症
  assertion:
    plain_statement_ja: 非結核性抗酸菌（NTM）は150種を超える菌種を含み（2015年時点）、ヒト感染の源は環境である。NTM は土壌と飲料水の自然な微生物叢の一員で、菌種ごとに生態・抗菌薬感受性・病原性が異なるため、分離株の種レベルの同定が重要である。
    condition:
      region: 国際
      対象: 一般
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2150
    source: Falkinham JO 3rd. Environmental sources of nontuberculous mycobacteria. Clin Chest Med. 2015;36(1).
    doi: 10.1016/j.ccm.2014.10.003
    pmid: '25676517'
    pmcid: null
    url: https://doi.org/10.1016/j.ccm.2014.10.003
    source_license: CCライセンス表示なし
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ96 2026-11-15）：Ratnatunga CN, Lutzky VP, Kupz A, Doolan DL, Reid DW, Field M, Bell SC, Thomson RM, Miles JJ. The Rise of Non-Tuberculosis Mycobacterial Lung Disease. Front Immunol. 2020;11:303（PMID: 32194556、DOI: 10.3389/fimmu.2020.00303、PMCID: PMC7062685、https://creativecommons.org/licenses/by/4.0/）。裏づける部分：部分：候補（CC BY の総説）は、NTM が水系・土壌・植生に生息する遍在性の環境腐生菌であること、生息地が自然の水域から市営の配水システムや家庭の配管（飲料水を含む）まで及ぶこと、ヒト感染の源が環境であるという位置づけを再掲する。また、治療による寛解率が感染菌種によって異なること、感染菌種の迅速な同定が研究上の優先事項とされていることも述べ、菌種ごとの性質の違いと種レベルの同定の重要性の骨格は裏づけられる。ただし、菌種ごとに生態・抗菌薬感受性・病原性が異なるという3点の明示的な形では再掲されない。数値の照合：菌種数：カードは「150種を超える（2015年時点）」とし、候補は「170種を超える同定済み菌種」（2020年の総説）とする。候補の値は時点の新しい別の集計であり、カードの2015年時点の値の裏づけとして登録しないこと（方向は一致する。カードの uncertainty 自身が2020年の治療ガイドラインの「190種を超える種・亜種」に言及している）。留保：主出典（SRC-2150）の刊行版ライセンスは Crossref の版データで Elsevier の TDM のみで CC 表示はなく、Europe PMC の個別レコードでも非 OA・PMC 未収載（PMCID は存在しない）で、現行 RESTRICTED が正しい。候補のライセンスは Crossref の版データ・Europe PMC の個別レコード・PMC 全文のライセンス要素で CC BY 4.0 と個別確認した'
  uncertainty: 菌種数は出典の年代により異なり、2020年の治療ガイドラインでは190種を超える種・亜種とされている。肺NTM症の治療はガイドラインの範囲で、本カードでは扱わない。
