- id: MY-003
  domain: MY
  subdomain: 結核
  assertion:
    plain_statement_ja: 結核は Mycobacterium tuberculosis complex による空気感染症で、感染の経過は肉芽腫内に菌が封じ込められた潜在性結核感染症から、症状を伴う伝染性の活動性結核までスペクトラムをなす。伝染性があるのは活動性肺結核のみである。
    condition:
      region: 国際
      対象: 一般
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2148
    source: Pai M, Behr MA, Dowdy D, et al. Tuberculosis. Nat Rev Dis Primers. 2016;2:16076.
    doi: 10.1038/nrdp.2016.76
    pmid: '27784885'
    pmcid: null
    url: https://doi.org/10.1038/nrdp.2016.76
    source_license: CCライセンス表示なし
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（GOV_US／OPEN、作り手の調査バッチ96 2026-11-15）：Centers for Disease Control and Prevention. About Tuberculosis（CDC 公式ページ、2025-01-17版、https://www.cdc.gov/tb/about/index.html）／Esmail H, Barry CE 3rd, Young DB, Wilkinson RJ. The ongoing challenge of latent tuberculosis. Philos Trans R Soc Lond B Biol Sci. 2014;369(1645):20130437（PMID: 24821923（候補2。候補1は政府のウェブページで PMID なし）、DOI: 10.1098/rstb.2013.0437（候補2。候補1は DOI なし）、PMCID: PMC4024230（候補2。候補1は PMCID なし）、https://creativecommons.org/licenses/by/3.0/）。裏づける部分：部分：候補1（CDC、GOV_US）は、結核が空気を介して人から人へ広がること、不活性結核（潜在性結核感染症）と活動性結核という2つの状態があること、不活性結核の人は他者にうつさないこと、感染を広げるのは肺または喉頭の活動性結核の人であることを再掲する。候補2（CC BY の総説）は、感染が制御された静止状態から無症状の活動性に近い状態までを両端とする感染状態のスペクトラムという枠組み、初感染後に細胞性免疫応答が発達して肉芽腫が形成され感染の制御に働くこと、5µm 未満の飛沫核が空気中に浮遊して吸入される空気伝播を再掲する。ただし「伝染性があるのは活動性肺結核のみ」という厳密な形は再掲されず（候補1は肺に加えて喉頭を含む）、Mycobacterium tuberculosis complex という複合体としての明示もない（候補1は主病原体を M. tuberculosis とし、M. bovis 等も人の結核の原因になりうると述べるにとどまる）。数値の照合：数値的主張はカードにない（定性的な枠組みの再掲のみ）。留保：主出典（SRC-2148）の刊行版ライセンスは Crossref の版データで Springer Nature の TDM のみで CC 表示はなく、Europe PMC の個別レコードでも非 OA・PMC 未収載（PMCID は存在しない）で、現行 RESTRICTED が正しい。候補2のライセンスは PMC 全文のライセンス要素（CC BY 3.0）と Europe PMC の個別レコード（cc by）で個別確認した（Crossref の版データには TDM のみの登録）'
  uncertainty: 感染後の各段階への移行率などの数値は本カードでは扱わない。日本の診断・治療基準は RI の範囲、結核性髄膜炎は NI-016・017 の範囲である。
