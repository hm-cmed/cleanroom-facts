- id: MY-005
  domain: MY
  subdomain: 非結核性抗酸菌症
  assertion:
    plain_statement_ja: 非結核性抗酸菌（NTM）は150種を超える菌種を含み（2015年時点）、ヒト感染の源は環境である。NTM は土壌と飲料水の自然な微生物叢の一員で、菌種ごとに生態・抗菌薬感受性・病原性が異なるため、分離株の種レベルの同定が重要である。
    condition:
      region: 国際
      対象: 一般
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2150
    source: Falkinham JO 3rd. Environmental sources of nontuberculous mycobacteria. Clin Chest Med. 2015;36(1).
    doi: 10.1016/j.ccm.2014.10.003
    pmid: '25676517'
    pmcid: null
    url: https://doi.org/10.1016/j.ccm.2014.10.003
    source_license: CCライセンス表示なし
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 菌種数は出典の年代により異なり、2020年の治療ガイドラインでは190種を超える種・亜種とされている。肺NTM症の治療はガイドラインの範囲で、本カードでは扱わない。
  curriculum:
    kokushi: 医学各論 Ⅻ-3-A-②（非結核性抗酸菌症、a）
    core_curriculum: 'PS-01-03-05 (id: JkxnuLM)；PS-01-03-02 (id: JkxnuLA)'
