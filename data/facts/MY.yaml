- id: MY-002
  domain: MY
  subdomain: 結核
  assertion:
    plain_statement_ja: 潜在性結核感染症（LTBI）の世界の負担は、2014年時点で世界人口の23.0%（約17億人）と再推計された。その約80%は東南アジア・西太平洋・アフリカの3地域に集中する。
    condition:
      region: 国際
      対象: 一般集団
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2147
    source: 'Houben RMGJ, Dodd PJ. The Global Burden of Latent Tuberculosis Infection: A Re-estimation Using Mathematical Modelling. PLoS Med. 2016;13(10):e1002152.'
    doi: 10.1371/journal.pmed.1002152
    pmid: '27780211'
    pmcid: null
    url: https://doi.org/10.1371/journal.pmed.1002152
    source_license: CC BY 4.0
    legal_basis: B
    source_class: OPEN
    corroboration: null
  uncertainty: 数理モデルによる再推計で、95%不確実性区間は20.4〜26.4%。同出典では、最近（2年以内）の感染は世界人口の0.8%（約5,550万人）と推計されている。潜在性結核感染症の治療は RI-044・046 の範囲で、本カードでは扱わない。
  curriculum:
    kokushi: 医学各論 Ⅻ-3-A-①（結核、a）
    core_curriculum: 'PS-01-03-05 (id: JkxnuLM)；PS-03-03-01 (id: JkxnuUg)'
