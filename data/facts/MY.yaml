- id: MY-004
  domain: MY
  subdomain: 非結核性抗酸菌症
  assertion:
    plain_statement_ja: 人口ベースのデータでは、2000年以降、世界的にヒトの非結核性抗酸菌（NTM）感染症の有病率は増加している。Mycobacterium avium complex（MAC）は北米と東アジアで優位な菌群で、欧州の一部地域では M. kansasii、M. xenopi、M. malmoense が多い。
    condition:
      region: 国際
      対象: 成人
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2149
    source: 'Prevots DR, Marras TK. Epidemiology of human pulmonary infection with nontuberculous mycobacteria: a review. Clin Chest Med. 2015;36(1).'
    doi: 10.1016/j.ccm.2014.10.002
    pmid: '25676516'
    pmcid: PMC4332564
    url: https://doi.org/10.1016/j.ccm.2014.10.002
    source_license: CCライセンス表示なし
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 日本の肺NTM症の罹患率と菌種の地域分布は RI-047・048 の範囲で、本カードでは扱わない。皮膚のNTM症は SD-035 の範囲である。
  curriculum:
    kokushi: 医学各論 Ⅻ-3-A-②（非結核性抗酸菌症、a）
