- id: MY-006
  domain: MY
  subdomain: Hansen病
  assertion:
    plain_statement_ja: 日本のハンセン病の新規患者は毎年、日本人が数名、在日外国人が約4名で、日本人では沖縄県出身者が半数を占める。原因菌のらい菌（Mycobacterium leprae）はゲノムサイズが3.3 Mbで偽遺伝子が多く、試験管内では培養できない。増殖の至適温度は31℃前後で、皮膚と末梢神経（シュワン細胞）に親和性がある。
    condition:
      region: 日本
      対象: 一般
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2151
    source: 国立健康危機管理研究機構（JIHS）感染症情報提供サイト. ハンセン病（詳細版）. 2016年改訂
    doi: null
    pmid: null
    pmcid: null
    url: null
    source_license: 政府標準利用規約
    legal_basis: B
    source_class: GOV_JP
    corroboration: null
  uncertainty: 治療期間については、WHO ファクトシートの記述（多剤併用療法は少菌型6か月・多菌型12か月）を優先すべきもので、JIHS 詳細版（2016年改訂）の記述とは異なる。本カードの主張は病原体と日本の疫学に限った。多剤併用療法に用いるダプソン・リファンピシン・クロファジミンの国内の承認・保険適用は未確認。届出制度は、らい予防法の廃止（1996年）に伴いなくなっている。ページの URL はリサーチメモに記録がなかったため未記載である。皮膚所見そのものは Ⅲ の範囲である。
  curriculum:
    kokushi: 医学各論 Ⅻ-3-A-③（Hansen病、c）
