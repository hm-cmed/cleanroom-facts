- id: CG-002
  domain: CG
  subdomain: Down症候群
  assertion:
    plain_statement_ja: Down症候群は、21番染色体の過剰なコピー（完全なトリソミーまたは部分的な過剰）によるトリソミー21を原因とし、出生後に生存可能な常染色体異数性の中で最も頻度が高い。21番染色体にはタンパク質をコードする遺伝子が200を超えて存在し、その過剰が知的障害や先天性心疾患をはじめとする多臓器にわたる臨床像の背景となる
    condition:
      region: 国際
      対象: Down症候群の人
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3522
    source: Antonarakis SE, Skotko BG, Rafii MS, et al. Down syndrome. Nat Rev Dis Primers. 2020;6(1):9
    doi: 10.1038/s41572-019-0143-7
    pmid: '32029743'
    pmcid: PMC8428796
    url: https://doi.org/10.1038/s41572-019-0143-7
    source_license: 表示なし
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（CC BY 4.0（OPEN）、作り手の調査バッチ87 2026-11-15）：Izzo A, Mollo N, Nitti M, Paladino S, Calì G, Genesio R, Bonfiglio F, Cicatiello R, Barbato M, Sarnataro V, Conti A, Nitsch L. Mitochondrial dysfunction in down syndrome: molecular mechanisms and therapeutic targets. Mol Med. 2018;24(1):4（PMID: 30134785、DOI: 10.1186/s10020-018-0004-y、PMCID: PMC6016872、https://creativecommons.org/licenses/by/4.0/）。裏づける部分：部分：21トリソミーが「出生後に生存可能な常染色体異数性の中で最も頻度が高い（the most common autosomal aneuploidy compatible with postnatal survival）」ことを再掲する。知的障害を含む複雑な表現型という位置づけも一致する。数値の照合：候補は有病率を新生児700人に1人とし、カードに有病率の数値はないため競合しない。「21番染色体にはタンパク質をコードする遺伝子が200を超えて存在し、その過剰が臨床像の背景となる」という要素は候補に再掲なし（候補は21番染色体遺伝子の過剰発現が病態に関わることは述べるが、遺伝子数の記載はない）。留保：主出典は PMC に著者稿全文（PMC8428796）があるが非OAでライセンス表示はなく、Crossref の刊行版ライセンスもテキストマイニング用のみで CC ではないため自由とはみなさない。現行 UNKNOWN は RESTRICTED への訂正対象（区分訂正の節参照）。識別子補完候補あり（PMID・PMCID）'
  uncertainty: 抄録で確認した範囲に限る。合併症ごとの頻度の数値は本文を照合していないため主張に入れていない。成人期の診療ガイドライン（JAMA 2020）は書誌の一次照合が未了のため使っていない
