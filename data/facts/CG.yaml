- id: CG-002
  domain: CG
  subdomain: Down症候群
  assertion:
    plain_statement_ja: Down症候群は、21番染色体の過剰なコピー（完全なトリソミーまたは部分的な過剰）によるトリソミー21を原因とし、出生後に生存可能な常染色体異数性の中で最も頻度が高い。21番染色体にはタンパク質をコードする遺伝子が200を超えて存在し、その過剰が知的障害や先天性心疾患をはじめとする多臓器にわたる臨床像の背景となる
    condition:
      region: 国際
      対象: Down症候群の人
    differential: null
    common_misconception: null
  provenance:
