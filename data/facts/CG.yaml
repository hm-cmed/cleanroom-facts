- id: CG-004
  domain: CG
  subdomain: Turner症候群
  assertion:
    plain_statement_ja: Turner症候群のケアでは、低身長への対応として成長の領域で成長ホルモン治療が、卵巣機能不全への対応として思春期とエストロゲン治療の領域でエストロゲン補充による思春期の誘導と維持が、それぞれ独立した柱として扱われる。あわせて心血管の健康が独立の領域とされ、合併症のサーベイランスは小児期から成人期まで生涯を通じて継続する枠組みが2024年版ガイドラインで示されている
