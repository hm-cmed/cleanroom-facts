- id: CG-006
  domain: CG
  subdomain: trisomy(13番、18番)
  assertion:
    plain_statement_ja: 13トリソミーと18トリソミーは、認識可能な多発先天異常のパターン、新生児期・乳児期の死亡率の上昇、生存した年長児における著明な認知・運動発達の障害を特徴とする、比較的頻度の高い染色体異常である。従来は新生児期・乳児期早期の技術的支援や手術を差し控える方針が主流だったが、近年は一律の差し控えではなく、緩和ケア中心の対応と、適切な症例への積極的介入の双方の位置づけを症例ごとに検討する議論が進んでいる
    condition:
      region: 国際
      対象: 13トリソミーまたは18トリソミーの小児
    differential: null
    common_misconception: null
  provenance:
