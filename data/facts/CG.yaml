- id: CG-003
  domain: CG
  subdomain: Turner症候群
  assertion:
    plain_statement_ja: Turner症候群は女性100,000人あたり50人にみられ、全ライフステージを通じて複数の臓器に影響するため、多職種によるケアが必要である。国際コンセンサスガイドラインの2024年版は、診断と遺伝、成長、思春期とエストロゲン治療、心血管の健康、移行期、妊孕性の評価とカウンセリング、合併症の生涯を通じたサーベイランス、神経認知と心理の8領域で構成される
    condition:
      region: 国際
      対象: Turner症候群の女児・女性
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3523
    source: Gravholt CH, Andersen NH, Christin-Maitre S, et al; International Turner Syndrome Consensus Group. Clinical practice guidelines for the care of girls and women with Turner syndrome. Eur J Endocrinol. 2024;190(6):G53-G151
    doi: 10.1093/ejendo/lvae050
    pmid: '38748847'
    pmcid: PMC11759048
    url: https://doi.org/10.1093/ejendo/lvae050
    source_license: CC BY-NC 4.0（Crossref・Europe PMC の license 欄で確認）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（CC BY 4.0（OPEN）、作り手の調査バッチ87 2026-11-15）：Turner HE, Johannsen EB, Smyth A, Orchard E, Gravholt CH. Approach to the Patient With Turner Syndrome. J Clin Endocrinol Metab. 2025;111(1):dgaf517（PMID: 40971503、DOI: 10.1210/clinem/dgaf517、PMCID: PMC12712970、https://creativecommons.org/licenses/by/4.0/）。裏づける部分：部分：Turner症候群が全ライフステージを通じて心血管異常、自己免疫疾患、骨格異常、代謝機能障害、神経認知面など複数の臓器・領域に影響し、管理には複数の専門領域の連携が関わることを再掲する。候補は国際ガイドラインに基づく合併症とモニタリングの表を備え、主出典（2024年版ガイドライン）の枠組みに沿った内容である。数値の照合：有病率は候補では「出生女児2,000〜2,500人に1人」（100,000人あたり40〜50人）と幅で示され、カードの「女性100,000人あたり50人」はその上限と一致する。点値としての一致ではないため、裏づけ登録時は幅のある値として扱うこと。2024年版ガイドラインの8領域という構成そのものは候補に再掲なし。留保：主出典の刊行版ライセンスは CC BY-NC 4.0（Crossref・Europe PMC の双方で個別確認）で自由ではなく、現行 RESTRICTED が正しい。マスターの pmid・pmcid は null で、カード側に既記の値を補完候補とした（識別子補完候補の節参照）'
  uncertainty: 国際ガイドラインの現行版は2024年版（Aarhus 会議の proceedings）で、2017年版は旧版のため使っていない。4つの臨床疑問には GRADE 評価が行われているが、個別推奨の強さは本文を照合していないため主張に入れていない
