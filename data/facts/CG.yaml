- id: CG-001
  domain: CG
  subdomain: Down症候群
  assertion:
    plain_statement_ja: Down症候群の健康管理では、米国小児科学会の臨床報告（2022年版）が、出生前から21歳までを年齢帯（出生〜1か月、1か月〜1歳、1〜5歳、5〜12歳、12〜21歳）に分け、各時期に行う評価とスクリーニングを示している。新生児期には先天性心疾患の評価として心エコーが必須とされ、甲状腺機能については新生児スクリーニング結果の確認に加え、生後6か月・12か月の測定と以後毎年の測定が推奨される
    condition:
      region: 米国
      対象: Down症候群の小児・青年
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3521
    source: Bull MJ, Trotter T, Santoro SL, et al; Council on Genetics. Health Supervision for Children and Adolescents With Down Syndrome. Pediatrics. 2022;149(5):e2022057010
    doi: 10.1542/peds.2022-057010
    pmid: '35490285'
    pmcid: null
    url: https://doi.org/10.1542/peds.2022-057010
    source_license: 表示なし（American Academy of Pediatrics の著作物）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 臨床報告の現行版は2022年版で、2011年版は旧版のため使っていない。報告本文の表は直接開いておらず、年齢帯の構成と心エコー・甲状腺測定の要点は、同報告を引用する AAFP の解説および大学クリニックの準拠資料で確認した（二次資料経由の確認を含む）。先天性心疾患の頻度（新生児の最大50%）も同じ経路で確認した数値であり、本文の表での再照合が望ましい
