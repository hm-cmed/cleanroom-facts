- id: CG-004
  domain: CG
  subdomain: Turner症候群
  assertion:
    plain_statement_ja: Turner症候群のケアでは、低身長への対応として成長の領域で成長ホルモン治療が、卵巣機能不全への対応として思春期とエストロゲン治療の領域でエストロゲン補充による思春期の誘導と維持が、それぞれ独立した柱として扱われる。あわせて心血管の健康が独立の領域とされ、合併症のサーベイランスは小児期から成人期まで生涯を通じて継続する枠組みが2024年版ガイドラインで示されている
    condition:
      region: 国際
      対象: Turner症候群の女児・女性
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3523
    source: Gravholt CH, Andersen NH, Christin-Maitre S, et al; International Turner Syndrome Consensus Group. Clinical practice guidelines for the care of girls and women with Turner syndrome. Eur J Endocrinol. 2024;190(6):G53-G151
    doi: 10.1093/ejendo/lvae050
    pmid: '38748847'
    pmcid: PMC11759048
    url: https://doi.org/10.1093/ejendo/lvae050
    source_license: CC BY-NC 4.0（Crossref・Europe PMC の license 欄で確認）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（CC BY 4.0（OPEN）、作り手の調査バッチ87 2026-11-15）：Turner HE, Johannsen EB, Smyth A, Orchard E, Gravholt CH. Approach to the Patient With Turner Syndrome. J Clin Endocrinol Metab. 2025;111(1):dgaf517（PMID: 40971503、DOI: 10.1210/clinem/dgaf517、PMCID: PMC12712970、https://creativecommons.org/licenses/by/4.0/）。裏づける部分：部分：低身長への成長ホルモン治療が小児期・思春期の治療の柱であること、卵巣機能不全に対してエストロゲンによる思春期の誘導と性ホルモン補充が行われること、心血管異常を含む合併症が全生涯を通じて生じ、評価と継続的なモニタリング・管理が長期フォローアップの必須要素であることを再掲する。数値の照合：数値の主張なし（枠組みのカード）。成長ホルモンの開始年齢の具体値（候補の症例では10歳開始）はカードの主張ではない。留保：カードが述べる「成長」「思春期とエストロゲン治療」「心血管の健康」というガイドラインの領域立てそのものは候補に再掲がないが、各要素の実質は候補に再掲がある。主出典の区分・識別子補完候補は CG-003 の行と共通（SRC-3523）'
  uncertainty: 薬剤の国内承認：成長ホルモン（ソマトロピン）は、骨端線閉鎖を伴わないターナー症候群における低身長が国内承認適応に含まれ、保険適用がある（PMDA 添付文書で確認した先行リサーチに基づく）。エストロゲン製剤は国内承認薬であるが、個別製剤の効能・効果の文言は照合していない。各治療の用量・開始時期はガイドライン本文を照合していないため主張に入れていない
