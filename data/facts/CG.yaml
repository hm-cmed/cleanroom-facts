    pmid: '29769693'
    pmcid: PMC7136158
    url: https://doi.org/10.1038/s41574-018-0010-8
    source_license: CC BY 4.0（Crossref・Europe PMC の license 欄で確認）
    legal_basis: B
    source_class: OPEN
    corroboration: null
  uncertainty: 46,XY DSD・46,XX DSD・性染色体 DSD の3群分類は Chicago コンセンサス（2006）以来の枠組みであり、本カードの出典の抄録では確認していないため主張に入れていない（Lee らの2016年総説が候補）。個別疾患の評価手順の詳細は各論に譲る
