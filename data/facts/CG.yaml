- id: CG-008
  domain: CG
  subdomain: 性分化疾患
  assertion:
    plain_statement_ja: 性分化疾患（DSD）は、性の決定と分化に影響する先天性疾患の総称である。小児期の専門施設では多職種による包括的ケアの推奨が広く実装されてきた一方で、思春期以降は成人ケアへのアクセスが難しく、長期経過に関するエビデンスも不足している。欧州の多職種専門家によるコンセンサス声明（2018）は、生涯を通じたケアとデータ収集の枠組みを示している
    condition:
