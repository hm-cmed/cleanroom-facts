- id: CG-001
  domain: CG
  subdomain: Down症候群
  assertion:
    plain_statement_ja: Down症候群の健康管理では、米国小児科学会の臨床報告（2022年版）が、出生前から21歳までを年齢帯（出生〜1か月、1か月〜1歳、1〜5歳、5〜12歳、12〜21歳）に分け、各時期に行う評価とスクリーニングを示している。新生児期には先天性心疾患の評価として心エコーが必須とされ、甲状腺機能については新生児スクリーニング結果の確認に加え、生後6か月・12か月の測定と以後毎年の測定が推奨される
    condition:
      region: 米国
      対象: Down症候群の小児・青年
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3521
    source: Bull MJ, Trotter T, Santoro SL, et al; Council on Genetics. Health Supervision for Children and Adolescents With Down Syndrome. Pediatrics. 2022;149(5):e2022057010
    doi: 10.1542/peds.2022-057010
    pmid: '35490285'
    pmcid: null
    url: https://doi.org/10.1542/peds.2022-057010
    source_license: 表示なし（American Academy of Pediatrics の著作物）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（CC BY 4.0（OPEN）、作り手の調査バッチ87 2026-11-15）：Suárez-Mantilla SN, Africano-Leon ML, Mora-Bautista VM, Vergara-Arenas DC, Bustos-López AT, Serrano-Gomez S. Adherence to the American Academy of Pediatrics Health Supervision Guidelines for Children With Down Syndrome in a Tertiary Care Institution in Northeastern Colombia. Cureus. 2025;17(9):e93426（PMID: 41164047、DOI: 10.7759/cureus.93426、PMCID: PMC12564101、https://creativecommons.org/licenses/by/4.0/）。裏づける部分：部分：AAP の健康管理ガイドラインが年齢帯ごとに評価項目を定めるスケジュールであること、その中で新生児期（生後1か月以内）に先天性心疾患の評価として心エコーを行うこと、甲状腺機能は出生時の確認に加えて生後6か月・12か月に TSH を測定することを、ガイドラインへの遵守度を検証する表の形で再掲する。候補は同ガイドラインが2022年に最新改訂されたことにも触れている。数値の照合：数値の主張はスケジュール項目のみ。候補の表は2011年版から改作されており、年齢帯は1か月未満・1〜12か月・1〜5歳・5〜12歳（13〜21歳の区分への言及あり）で、カードの2022年版の年齢帯（出生〜1か月、1か月〜1歳、1〜5歳、5〜12歳、12〜21歳）と大枠で一致する。12か月以降の毎年の甲状腺測定は候補の表に再掲なし（毎年の記載があるのは血算）。留保：主出典は American Academy of Pediatrics の著作物で、Europe PMC で非OA・全文収載なし、Crossref にライセンス登録はなく、現行 RESTRICTED が正しいことを個別確認した。マスターの pmid は null で、カード側に既記の PMID 35490285 を補完候補とした（識別子補完候補の節参照）'
  uncertainty: 臨床報告の現行版は2022年版で、2011年版は旧版のため使っていない。報告本文の表は直接開いておらず、年齢帯の構成と心エコー・甲状腺測定の要点は、同報告を引用する AAFP の解説および大学クリニックの準拠資料で確認した（二次資料経由の確認を含む）。先天性心疾患の頻度（新生児の最大50%）も同じ経路で確認した数値であり、本文の表での再照合が望ましい
  curriculum:
    kokushi: 医学各論 Ⅰ-4-A-①（Down症候群、a）
    core_curriculum: 'PS-03-01-03 (id: JkxnuUI)；TBL-01-00-441 (id: JlvnmJE)；PS-02-12-04 (id: Jli53IM)'
