    doi: 10.1002/ajmg.c.31527
    pmid: '27643592'
    pmcid: null
    url: https://doi.org/10.1002/ajmg.c.31527
    source_license: 表示なし
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 個別の生存率や手術成績の数値は、同じ特集号の各論文に分散しており本カードでは照合していないため主張に入れていない。18トリソミー単独の総説（Orphanet J Rare Dis 2012）は本カードでは使っていない
