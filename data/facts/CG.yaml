- id: CG-006
  domain: CG
  subdomain: trisomy(13番、18番)
  assertion:
    plain_statement_ja: 13トリソミーと18トリソミーは、認識可能な多発先天異常のパターン、新生児期・乳児期の死亡率の上昇、生存した年長児における著明な認知・運動発達の障害を特徴とする、比較的頻度の高い染色体異常である。従来は新生児期・乳児期早期の技術的支援や手術を差し控える方針が主流だったが、近年は一律の差し控えではなく、緩和ケア中心の対応と、適切な症例への積極的介入の双方の位置づけを症例ごとに検討する議論が進んでいる
    condition:
      region: 国際
      対象: 13トリソミーまたは18トリソミーの小児
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3525
    source: Carey JC. Perspectives on the care and advances in the management of children with trisomy 13 and 18. Am J Med Genet C Semin Med Genet. 2016;172(3):249-250
    doi: 10.1002/ajmg.c.31527
    pmid: '27643592'
    pmcid: null
    url: https://doi.org/10.1002/ajmg.c.31527
    source_license: 表示なし
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（CC BY 4.0（OPEN）、作り手の調査バッチ87 2026-11-15）：Caggiano S, Persia S, D''Amore F, Macchiaiolo M, Fornari M, Clemente V, Paglietti MG, Schiavino A, Butera G, Filippelli S, Zucaro L, Cutrera R. Survival in infants with trisomy 18, palliative care and ethical reflections: a single center considerations. Ital J Pediatr. 2026;52(1)（PMID: 41485045、DOI: 10.1186/s13052-025-02181-7、PMCID: PMC12866181、https://creativecommons.org/licenses/by/4.0/）。裏づける部分：部分：18トリソミーについて、先天異常を伴い従来は致死的な診断とみなされ、米国小児科学会も新生児蘇生の差し控えを検討するよう勧めていた時代があったこと、その後、心臓手術を含む治療的介入の増加とともに1年を超えて生存する児が増え（介入内容により3〜25%）、現在は明確な判断基準がなく、過剰治療と治療放棄の双方を避ける症例ごとの検討が課題であることを再掲する。これはカードの「一律の差し控えではなく、緩和ケア中心の対応と積極的介入の双方を症例ごとに検討する議論が進んでいる」という主張の骨格と一致する。数値の照合：カードに数値の主張はない。候補の生存割合（3〜25%）は介入内容に依存する幅のある値で、カードの主張の裏づけとしては用いない。留保：候補は18トリソミーのみを対象とし、13トリソミーと、生存した年長児における著明な認知・運動発達の障害については再掲がない。主出典は Wiley の利用条件のみで CC ではなく、現行 UNKNOWN は RESTRICTED への訂正対象（区分訂正の節参照）。識別子補完候補あり（PMID）'
  uncertainty: 個別の生存率や手術成績の数値は、同じ特集号の各論文に分散しており本カードでは照合していないため主張に入れていない。18トリソミー単独の総説（Orphanet J Rare Dis 2012）は本カードでは使っていない
