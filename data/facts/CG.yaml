- id: CG-010
  domain: CG
  subdomain: 先天性副腎皮質過形成
  assertion:
    plain_statement_ja: 先天性副腎皮質過形成の最も多い型である21-水酸化酵素欠損症は、新生児マススクリーニング（17-ヒドロキシプロゲステロンの測定）の対象疾患であり、Endocrine Society の診療ガイドライン（2018）はスクリーニングによる早期発見を前提に診療を組み立てている。古典的型のうち塩喪失型では生後早期に副腎クリーゼ（脱水・電解質異常・循環不全）を起こしうるため、スクリーニング陽性時は速やかな精査と全身状態の評価を行い、46,XX では外性器の男性化所見を性分化の評価として確認する
    condition:
      region: 国際
      対象: 新生児
    differential: null
    common_misconception: null
