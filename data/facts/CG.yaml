    plain_statement_ja: アンドロゲン不応症は、アンドロゲン受容体遺伝子の変化によるホルモン抵抗性を本態とし、46,XY における性分化疾患の最も多い原因である。表現型は完全型（CAIS）・部分型（PAIS）・軽症型（MAIS）の3型に分けられ、遺伝型と表現型の相関は乏しい。男性化が乏しいにもかかわらず LH とテストステロンが高値を示すことが、典型的な検査所見である
