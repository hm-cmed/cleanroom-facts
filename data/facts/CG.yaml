- id: CG-005
  domain: CG
  subdomain: Klinefelter症候群
  assertion:
    plain_statement_ja: Klinefelter症候群（47,XXY）では、精子形成が著しく低下しライディッヒ細胞の機能障害を伴うため、無精子症と高ゴナドトロピン性性腺機能低下症が典型的な像である。欧州アンドロロジー学会のガイドライン（2021）は本症候群に対する初の国際ガイドラインであり、生殖機能だけでなく、心血管・代謝・骨の合併症の頻度上昇や神経認知・心理社会的側面を含む包括的な評価と管理を扱う。有病率に比べて診断率はなお低いとされる
    condition:
      region: 国際
      対象: Klinefelter症候群の男性
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3524
    source: Zitzmann M, Aksglaede L, Corona G, et al. European Academy of Andrology guidelines on Klinefelter Syndrome. Andrology. 2021;9(1):145-167
    doi: 10.1111/andr.12909
    pmid: '32959490'
    pmcid: null
    url: https://doi.org/10.1111/andr.12909
    source_license: CC BY-NC-ND 4.0（Crossref・Europe PMC の license 欄で確認）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（CC BY 4.0（OPEN）、作り手の調査バッチ87 2026-11-15）：Anaforoğlu İ. Klinefelter syndrome beyond hypogonadism: multisystem manifestations and a framework for clinical surveillance. Front Endocrinol (Lausanne). 2026;17:1848181（PMID: 42422432、DOI: 10.3389/fendo.2026.1848181、PMCID: PMC13341453、https://creativecommons.org/licenses/by/4.0/）。裏づける部分：部分：Klinefelter症候群（47,XXY）が高ゴナドトロピン性性腺機能低下症、不妊、精巣機能の障害と関連すること、生殖機能にとどまらず心血管・代謝・骨・神経認知など多系統にわたる包括的な評価とサーベイランスが必要であることを再掲する。候補は主出典である欧州アンドロロジー学会の2021年ガイドラインを参照文献として位置づけている。数値の照合：候補は有病率を男児出生450〜600人に1人、最大で75%が生涯未診断のままであるとし、カードの「有病率に比べて診断率はなお低い」という定性的主張と整合する。候補は「無精子症」という語自体は用いておらず、精子形成の障害は精巣形成不全・不妊の記述と、モザイク型では精子形成が比較的保たれるという対比から示される。ライディッヒ細胞の機能障害という表現そのものも候補に再掲なし。主出典が本症候群に対する初の国際ガイドラインであるという位置づけも候補に再掲なし。留保：主出典の刊行版ライセンスは CC BY-NC-ND 4.0（Crossref・Europe PMC の双方で個別確認）で自由ではなく、現行 RESTRICTED が正しい。マスターの pmid は null で、カード側に既記の PMID 32959490 を補完候補とした（識別子補完候補の節参照）。主出典は Europe PMC でも PMCID を持たない'
  uncertainty: 頻度の具体値（新生男児約650人に1人）は別の総説の抄録で確認した値であり、本カードの出典の抄録には数値がないため主張に入れていない。2021年版以降の改訂の有無は未確認
