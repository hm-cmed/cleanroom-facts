- id: CG-005
  domain: CG
  subdomain: Klinefelter症候群
  assertion:
    plain_statement_ja: Klinefelter症候群（47,XXY）では、精子形成が著しく低下しライディッヒ細胞の機能障害を伴うため、無精子症と高ゴナドトロピン性性腺機能低下症が典型的な像である。欧州アンドロロジー学会のガイドライン（2021）は本症候群に対する初の国際ガイドラインであり、生殖機能だけでなく、心血管・代謝・骨の合併症の頻度上昇や神経認知・心理社会的側面を含む包括的な評価と管理を扱う。有病率に比べて診断率はなお低いとされる
