    doi: 10.1038/s41572-019-0143-7
    pmid: '32029743'
    pmcid: PMC8428796
    url: https://doi.org/10.1038/s41572-019-0143-7
    source_license: 表示なし
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 抄録で確認した範囲に限る。合併症ごとの頻度の数値は本文を照合していないため主張に入れていない。成人期の診療ガイドライン（JAMA 2020）は書誌の一次照合が未了のため使っていない
