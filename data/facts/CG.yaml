  assertion:
    plain_statement_ja: Turner症候群は女性100,000人あたり50人にみられ、全ライフステージを通じて複数の臓器に影響するため、多職種によるケアが必要である。国際コンセンサスガイドラインの2024年版は、診断と遺伝、成長、思春期とエストロゲン治療、心血管の健康、移行期、妊孕性の評価とカウンセリング、合併症の生涯を通じたサーベイランス、神経認知と心理の8領域で構成される
