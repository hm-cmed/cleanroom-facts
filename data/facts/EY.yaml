- id: EY-007
  domain: EY
  subdomain: 眼瞼
  assertion:
    plain_statement_ja: 眼瞼内反は眼瞼縁が内側へ転回した状態で、多くは下眼瞼に生じ、最も多い原因は加齢性変化である。睫毛が角膜と結膜を擦るため、刺激感、発赤、粘稠な分泌物を生じる。眼瞼外反は眼瞼縁が外側へ転回した状態で下眼瞼に多く、流涙、刺激感、発赤を生じる。いずれも根本治療は手術で、それまでの間は人工涙液や潤滑軟膏で眼表面を保護する。
    condition:
      region: 全般
      study: 総説
    differential: null
    common_misconception: null
  provenance:
