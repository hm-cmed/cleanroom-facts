- id: EY-011
  domain: EY
  subdomain: 結膜
  assertion:
    plain_statement_ja: 細菌性結膜炎は、結膜充血に膿性から粘液膿性の眼脂を伴うことが特徴で、片眼性にも両眼性にも生じる。淋菌性結膜炎は、高度の眼瞼腫脹、多量の膿性眼脂、耳前リンパ節腫脹を呈する重症型で、上方から始まる角膜浸潤や潰瘍を生じうるため速やかな対応が必要である。治療には局所抗菌薬を用いる。
    condition:
      region: 全般
      study: 診療ガイドライン（Preferred Practice Pattern）
    differential: null
    common_misconception: null
