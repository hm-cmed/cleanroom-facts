- id: EY-009
  domain: EY
  subdomain: 結膜
  assertion:
    plain_statement_ja: ウイルス性結膜炎の代表はアデノウイルスによるもので、急な発症、水様性眼脂、下眼瞼結膜の濾胞反応、結膜浮腫を呈し、片眼から両眼へ順に広がることが多く、耳前リンパ節腫脹を伴うことがある。単純ヘルペスウイルスによるものは片眼性で、眼瞼の小水疱や潰瘍、角膜・結膜の樹枝状上皮病変を伴うことがある。アデノウイルス性には特異的な治療はなく対症療法が中心で、ヘルペス性には抗ウイルス薬を用いる。手指やタオルを介した感染拡大を防ぐ衛生管理が重要である。
