- id: EY-002
  domain: EY
  subdomain: 屈折
  assertion:
    plain_statement_ja: 屈折異常には、球面の異常である近視と遠視、円柱の異常である乱視、両眼の屈折値の差である不同視がある。ドイツの成人では約70%に屈折異常があり、2011年には16歳超の63.4%が眼鏡を、5.3%がコンタクトレンズを使用していた。屈折異常は眼科外来受診の理由の21.1%を占め最も多い。約1mmのピンホールを通して視力が改善すれば、屈折異常などの光学的原因が示唆される。
    condition:
      region: ドイツの疫学数値を含む一般事項
      study: 総説
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1252
    source: 'Schiefer U, Kraus C, Baumbach P, Ungewiß J, Michels R. Refractive errors: Epidemiology, Effects and Treatment Options. Dtsch Arztebl Int. 2016;113(41):693-702'
    doi: 10.3238/arztebl.2016.0693
    pmid: '27839543'
    pmcid: PMC5143802
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC5143802/
    source_license: © Deutscher Ärzte-Verlag（PMC 収載版で CC 表示を確認できず）
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 疫学数値（約70%、63.4%、5.3%、21.1%）はいずれもドイツのデータであり、日本の有病率・受診動向ではない。
