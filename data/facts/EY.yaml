    source: 'Carter SR. Eyelid disorders: diagnosis and management. Am Fam Physician. 1998;57(11):2695-2702'
    doi: null
    pmid: '9636333'
    pmcid: null
    url: https://www.aafp.org/pubs/afp/issues/1998/0601/p2695.xml
    source_license: © American Academy of Family Physicians
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 薬剤（人工涙液・潤滑軟膏）について、国内での承認・保険適用の確認状況：未確認。出典は1998年の総説であり、主張は定義・症状・眼表面保護と手術という今も変わらない基本方針に限定した。術式別の成功率など最近の外科エビデンスは含めていない。DOI は当時の同誌論文に付与がなく null とした。
