- id: EY-029
  domain: EY
  subdomain: 緑内障の検査
  assertion:
    plain_statement_ja: 緑内障の診断精度の検討では、スペクトラルドメインOCTの感度は0.79（95%信頼区間0.75〜0.83）、特異度は0.92（同0.87〜0.96）、Humphrey視野計の感度は0.87（同0.69〜0.95）、特異度は0.82（同0.66〜0.92）であり、眼圧測定単独の感度は0.48（同0.31〜0.66）と低かった。眼圧だけで診断せず、視神経と視野と構造の検査を組み合わせる。
