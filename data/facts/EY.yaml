    source_license: © 2023 American Academy of Ophthalmology（CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 良性・悪性腫瘍の列挙はガイドラインの鑑別診断の表から読み取り、悪性の頻度の順序と脂腺癌に関する注意点は本文で確認した。母斑はガイドラインの鑑別表に含まれていなかったため本カードには含めていない。各腫瘍の頻度の具体的な数値はガイドラインには示されておらず、本カードにも含めていない。切除範囲や再建などの外科治療の詳細は本カードの範囲外である。
