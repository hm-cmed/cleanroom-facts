- id: EY-021
  domain: EY
  subdomain: 角膜
  assertion:
    plain_statement_ja: 角膜周辺部の溝状潰瘍を呈する角膜周辺部潰瘍性角膜炎（PUK）は、角膜周辺部の炎症に上皮欠損と実質の破壊を伴う病態で、宿主の自己免疫の関与、角膜周辺部特有の解剖と生理、環境要因が組み合わさって生じる。原因は局所性と全身性、感染性と非感染性にわたり、血液検査や画像検査を含む精査、内科やリウマチ科との連携、慎重な免疫抑制療法が必要になる。全身疾患を伴わない Mooren 潰瘍もこの枠組みで扱われる。
