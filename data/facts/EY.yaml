- id: EY-048
  domain: EY
  subdomain: 眼瞼炎
  assertion:
    plain_statement_ja: 眼瞼炎は眼瞼縁の慢性の炎症で、部位により前部と後部に分けられる。前部眼瞼炎は眼瞼皮膚、睫毛の基部、睫毛包を侵し、後部眼瞼炎はマイボーム腺を侵すもので、その主たる原因はマイボーム腺機能不全である。症状が朝に悪化するのが典型的であり、経過は再燃と寛解を繰り返す慢性のものである。ケアの基本は眼瞼衛生で、眼瞼清拭は特に前部眼瞼炎に、温罨法は特に後部眼瞼炎（マイボーム腺機能不全）に有用であり、必要に応じて局所抗菌薬などが組み合わされる。
    condition:
      region: 米国
      study: 米国眼科学会の診療ガイドライン（Preferred Practice Pattern）
    differential: null
    common_misconception: null
  provenance:
