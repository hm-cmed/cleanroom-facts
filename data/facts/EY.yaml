- id: EY-027
  domain: EY
  subdomain: 緑内障総論
  assertion:
    plain_statement_ja: 緑内障は視神経と網膜神経線維層の障害により周辺視野や中心視野の永続的な欠損をきたしうる慢性進行性の視神経症であり、眼圧は唯一の修正可能な危険因子である。大きな分類は開放隅角緑内障と閉塞隅角緑内障の2つであり、早期は無症状のことが多い。
