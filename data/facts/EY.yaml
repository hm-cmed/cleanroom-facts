- id: EY-047
  domain: EY
  subdomain: 兎眼症の原因と対処
  assertion:
    plain_statement_ja: 兎眼症は眼瞼の閉瞼が不完全な状態であり、閉瞼を担う眼輪筋を支配する顔面神経と、眼瞼自体の構造のいずれかに障害があると生じる。インドの単施設で前向きに集計された120例では、麻痺性が86例、眼瞼性が34例で、原因はBell麻痺が35.83%と最も多く、次いで集中治療中の患者15%、外傷性顔面神経麻痺10.8%、脳卒中に伴う顔面神経麻痺6.67%、感染に伴う顔面神経麻痺6.67%、瘢痕性5%、眼瞼手術後5%、眼球突出によるもの1.67%などであった。閉瞼不全が続くと露出性角膜症を来し、角膜障害が進行しうる。発症からの期間が短く、角膜障害が瞳孔軸に及ばず、顔面神経の回復が見込める場合は保存的治療で足りる一方、6週間を超える場合や角膜障害が瞳孔軸に及ぶ場合、顔面神経の回復が不良な場合は、外科的治療が重要となる。
    condition:
      region: インド（単施設の三次医療機関）
      study: 前向き研究（120例、2018〜2019年）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1315
    source: 'Rita MRH, Deepa M, Gitanjali VC, Tinu SR, Subbulakshmi B, Sujitha D, et al. Lagophthalmos: An etiological lookout to frame the decision for management. Indian J Ophthalmol. 2022;70(8):3077-3082.'
    doi: 10.4103/ijo.IJO_3017_21
    pmid: '35918976'
    pmcid: PMC9672712
    url: https://doi.org/10.4103/ijo.IJO_3017_21
    source_license: CC BY-NC-SA 4.0
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 定義と原因別割合、保存的治療と外科的治療の振り分けの考え方は抄録で確認した。割合はインドの単施設における前向き集計の値であり、日本の原因別頻度とは異なる可能性がある。外科的治療の具体的な術式の選択は重症度と原因により異なるため、主張文では一般的な振り分けにとどめた。本カードには特定の薬剤名を含めていない。
