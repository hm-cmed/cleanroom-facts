    source: Tan DTH, Dart JKG, Holland EJ, Kinoshita S. Corneal transplantation. Lancet. 2012;379(9827):1749-1761
    doi: 10.1016/S0140-6736(12)60437-1
    pmid: '22559901'
    pmcid: null
    url: https://doi.org/10.1016/S0140-6736(12)60437-1
    source_license: © Elsevier (The Lancet)
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 出典は角膜移植の総説であり、水疱の破裂に伴う疼痛などの症状の詳細は抄録の範囲外のため含めず、内皮機能不全による浮腫という定義と内皮移植の位置づけに限定した。内皮機能不全の原因（手術後、Fuchs 角膜内皮ジストロフィなど）の内訳は本カードに含めていない。
