- id: EY-028
  domain: EY
  subdomain: 原発開放隅角緑内障
  assertion:
    plain_statement_ja: 日本の多治見スタディでは、40歳以上の原発開放隅角緑内障の有病率は3.9%（95%信頼区間3.2〜4.6%）であり、そのうち眼圧21mmHg以下の例の有病率が3.6%を占めた。すなわち日本では眼圧が正常範囲でも視神経と視野の所見から診断される例が大半である。
