- id: EY-018
  domain: EY
  subdomain: 結膜
  assertion:
    plain_statement_ja: 翼状片は、結膜の線維血管性組織が角膜へ侵入する病変である。有病率は1%から30%を超える範囲まで地域差が大きく、赤道に近い地域で最も高い。最も重要な誘因は紫外線曝露で、紫外線が DNA や細胞外マトリックスを障害し角膜輪部の幹細胞の性質を変えることで、結膜組織が角膜へ伸展すると考えられている。
    condition:
      region: 全般（有病率は地域差が大きい）
      study: 総説
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1260
    source: 'Shahraki T, Arabi A, Feizi S. Pterygium: an update on pathophysiology, clinical features, and management. Ther Adv Ophthalmol. 2021;13:25158414211020152'
    doi: 10.1177/25158414211020152
    pmid: '34104871'
    pmcid: PMC8170279
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC8170279/
    source_license: CC BY-NC 4.0
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 有病率の幅（1%から30%超）は出典の総説にまとめられた各地域の報告の範囲であり、単一集団の値ではない。切除術式別の再発率などの数値は本カードに含めていない。
