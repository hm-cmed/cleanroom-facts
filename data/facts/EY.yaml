- id: EY-022
  domain: EY
  subdomain: 角膜
  assertion:
    plain_statement_ja: 水疱性角膜症は、角膜内皮の機能不全によって角膜に浮腫が生じ、上皮に水疱を形成する状態である。治療では、障害された内皮のみを置換する角膜内皮移植が選択肢となり、全層の角膜移植と比べて視機能の回復が速く、予測しやすいとされる。
    condition:
      region: 全般
      study: 総説
    differential: null
    common_misconception: null
  provenance:
