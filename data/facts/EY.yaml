- id: EY-051
  domain: EY
  subdomain: 涙道狭窄・閉塞
  assertion:
    plain_statement_ja: 後天性の鼻涙管閉塞では、涙が涙嚢に貯留して流涙と眼脂を生じ、涙嚢炎の主たる発生機序となる。涙嚢炎は鼻涙管遠位部の閉塞を背景とすることが最も多く、再発を防ぐには閉塞そのものへの対処が必要である。手術は涙嚢鼻腔吻合術（外路、内鼻、レーザーなど）が中心で、その時期は症状と所見、年齢、全身状態によって判断する。
    condition:
      region: 全般
      study: 涙嚢炎の診断と治療に関する総説
    differential: null
    common_misconception: null
