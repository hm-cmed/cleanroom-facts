- id: EY-004
  domain: EY
  subdomain: 眼内異物
  assertion:
    plain_statement_ja: 眼内異物の損傷では、受傷の機序、異物の種類、その後に生じる合併症によって、眼内の病態と視力の転帰は大きく異なる。診断には画像検査が用いられ、治療は外科的な異物除去を中心に組み立てられる。異物の滞留は感染や組織障害などの合併症の原因となるため、早期の評価と対応が重要である。
