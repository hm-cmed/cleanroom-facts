    doi: 10.1007/s11908-012-0238-8
    pmid: '22286338'
    pmcid: null
    url: https://doi.org/10.1007/s11908-012-0238-8
    source_license: © Springer Science+Business Media, LLC 2012（CC表示なし）
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 本出典は第25回 Y1 で EY-016（涙嚢炎）に使用した登録済み出典の再利用である。流涙と涙の貯留、閉塞への対処の必要性は著者版 PDF の本文で確認した。内視鏡下（内鼻）と外路の涙嚢鼻腔吻合術の成功率の比較などの数値は本出典の抄録・本文で確認できなかったため含めていない。個別の抗菌薬名は本カードに記載していないため、個別薬剤の国内承認・保険適用の確認は対象外である。先天鼻涙管閉塞は本カードの対象外である。
