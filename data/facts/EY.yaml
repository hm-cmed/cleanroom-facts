    source_license: © 2023 American Academy of Ophthalmology（CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 内容はガイドライン全文（公式 PDF）で確認した。ガイドライン本文には局所抗菌薬等の薬剤の記載があるが、個別薬剤名は本カードに含めておらず、それらの国内の承認・保険適用は未確認である。ブドウ球菌性・脂漏性といった伝統的な細分類の臨床所見の対比はガイドラインの表に示される内容であり、本カードでは部位による分類にとどめた。
