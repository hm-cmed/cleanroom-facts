      region: 全般
      study: 診療ガイドライン（Preferred Practice Pattern）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1256
    source: Varu DM, Rhee MK, Akpek EK, Amescua G, Farid M, Garcia-Ferrer FJ, Lin A, Musch DC, Mah FS, Dunn SP; American Academy of Ophthalmology Cornea/External Disease Panel. Conjunctivitis Preferred Practice Pattern®. Ophthalmology. 2019;126(1):P94-P169
    doi: 10.1016/j.ophtha.2018.10.020
    pmid: '30366797'
    pmcid: null
    url: https://doi.org/10.1016/j.ophtha.2018.10.020
    source_license: © American Academy of Ophthalmology / Elsevier
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 薬剤（抗ウイルス薬）について、国内での承認・保険適用の確認状況：未確認。アデノウイルスの型別の病型（流行性角結膜炎と咽頭結膜熱の型の対応）は、ガイドライン本文の該当箇所を本調査で逐語確認できていないため含めていない。
