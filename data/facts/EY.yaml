- id: EY-038
  domain: EY
  subdomain: うっ血乳頭
  assertion:
    plain_statement_ja: うっ血乳頭は頭蓋内圧亢進による視神経乳頭の浮腫であり、急性期には視機能が通常保たれる点が他の乳頭浮腫と異なる。50歳未満では特発性頭蓋内圧亢進症が最も多い原因である。疑った場合は血圧を測定し、偽性うっ血乳頭を除外したうえで、脳と眼窩のMRI（静脈造影シーケンスを含む）を行い、その後に腰椎穿刺で初圧と髄液所見を評価する。本カードは所見と評価の進め方のみを扱う。
