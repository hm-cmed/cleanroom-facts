- id: EY-015
  domain: EY
  subdomain: 角膜
  assertion:
    plain_statement_ja: 真菌性角膜炎は細菌性角膜炎より転帰が不良なことが多い。糸状菌による角膜炎では局所ナタマイシンが第一選択で、無作為化比較試験では局所ボリコナゾールより優れ、その差は特にフザリウムによるもので顕著だった。経口ボリコナゾールの追加は全体として転帰を改善せず、有害事象が増えるため推奨されていない。診断には培養のほか、生体内共焦点顕微鏡が補助となる。
