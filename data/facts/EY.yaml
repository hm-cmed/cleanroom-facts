- id: EY-050
  domain: EY
  subdomain: 結膜下出血
  assertion:
    plain_statement_ja: 結膜下出血は急性の眼の充血のよくある原因で、通常は無痛で視力低下を伴わない。若年者では外傷とコンタクトレンズの使用が主な危険因子であり、高齢者では高血圧、糖尿病、動脈硬化などの全身の血管疾患が多い。咳、くしゃみ、嘔吐、力みなどによる急な静脈うっ血や、抗凝固・抗血小板療法も発症に関わる。多くの場合は特別な治療なしに2〜3週間で血液が吸収される。再発を繰り返す場合や持続する場合は、全身性高血圧、出血性疾患、悪性腫瘍、薬剤の副作用について評価が必要である。
    condition:
      region: 国際
      study: 結膜下出血の危険因子に関する総説
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1307
    source: 'Tarlan B, Kiratli H. Subconjunctival hemorrhage: risk factors and potential indicators. Clin Ophthalmol. 2013;7:1163-1170.'
    doi: 10.2147/OPTH.S35062
    pmid: '23843690'
    pmcid: PMC3702240
    url: https://doi.org/10.2147/OPTH.S35062
    source_license: CC BY-NC 3.0
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 危険因子と再発時の評価の必要性は抄録で確認し、2〜3週間での吸収と抗凝固・抗血小板療法との関連は本文で確認した。抗凝固薬・抗血小板薬はクラス名の記載にとどめ、個別薬剤の国内の承認・保険適用は未確認である（本カードはそれらの使用を推奨するものではない）。発症頻度の具体的な数値は出典の本文中で他研究の引用として示されるものであり、本カードには含めていない。
