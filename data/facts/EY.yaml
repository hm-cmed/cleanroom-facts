- id: EY-016
  domain: EY
  subdomain: 涙器
  assertion:
    plain_statement_ja: 涙器の代表的疾患である涙嚢炎は涙嚢の炎症で、最も多い背景は鼻涙管遠位部の閉塞であり、再発を防ぐにはこの閉塞への対処が必要である。分離される菌には黄色ブドウ球菌、肺炎球菌、表皮ブドウ球菌、インフルエンザ菌、緑膿菌があり、グラム陽性菌を対象とした抗菌薬治療を行う。涙嚢鼻腔吻合術（外路・内路・レーザー）などの手術の時期は、症状と所見、年齢、全身状態によって判断する。
