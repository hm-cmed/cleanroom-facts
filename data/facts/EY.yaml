  subdomain: 斜視・斜位の分類と治療原則
  assertion:
    plain_statement_ja: 斜視は視線の偏位の方向によって、内方への偏位である内斜視、外方への偏位である外斜視に分けられ、上下方向の偏位を伴うこともある。常に偏位が顕れる顕性斜視と、融合によって制御され普段は偏位が顕れない斜位とは区別される。外斜視は人口の約1%にみられ、間欠性外斜視が最も多い型である。遠視に伴う調節性内斜視では、まず屈折誤差の矯正が初期治療となり、治療の選択肢には二重焦点眼鏡、プリズム療法、外眼筋手術、ボツリヌス毒素注射などがある。斜視に伴う弱視の治療は、一般に斜視の手術に先行して行われる。
    condition:
      region: 米国
      study: 学会ガイドライン（Preferred Practice Pattern、小児が主対象）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1304
    source: Sprunger DT, Lambert SR, Hercinovic A, Morse CL, Repka MX, Hutchinson AK, Cruz OA, Wallace DK; American Academy of Ophthalmology Preferred Practice Pattern Pediatric Ophthalmology/Strabismus Panel. Esotropia and Exotropia Preferred Practice Pattern®. Ophthalmology. 2023;130(3):P179-P221.
    doi: 10.1016/j.ophtha.2022.11.002
    pmid: '36526451'
    pmcid: PMC10655158
    url: https://doi.org/10.1016/j.ophtha.2022.11.002
    source_license: CC表示なし
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 外斜視の頻度（約1%、間欠性が最多）と内斜視では屈折矯正が初期治療であることはガイドライン本文で確認した。本ガイドラインの主対象は水平斜視であり、上下斜視の詳細な分類は本文の主眼ではないため、主張文では偏位方向の分類にとどめた。ボツリヌス毒素は薬剤名にあたるため注記する。斜視に対するボツリヌス毒素注射の国内の承認・保険適用は未確認である。本ガイドラインは米国の小児診療を前提としており、日本の診療実態との差異は未確認である。
