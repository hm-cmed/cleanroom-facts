- id: EY-025
  domain: EY
  subdomain: 水晶体
  assertion:
    plain_statement_ja: 白内障の治療は手術が基本であり、点眼薬などで水晶体の混濁を消失させる確立した治療はない。標準的な手術は、混濁した水晶体を超音波で乳化吸引して除去し、眼内レンズを挿入する方法で、視機能が日常生活に支障を及ぼす場合に行う。
