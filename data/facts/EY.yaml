- id: EY-049
  domain: EY
  subdomain: 眼瞼腫瘍
  assertion:
    plain_statement_ja: 眼瞼腫瘍の鑑別では、良性腫瘍として扁平上皮乳頭腫、脂腺過形成、血管腫、化膿性肉芽腫などが挙げられ、悪性腫瘍では基底細胞癌と扁平上皮癌が最も多く、次いで悪性黒色腫と脂腺癌が多い。脂腺癌は眼瞼炎や霰粒腫に紛れてみえることがあり、片眼性の慢性眼瞼炎が治療に反応しない場合、同じ部位に繰り返す霰粒腫、局所的な睫毛脱落、眼瞼縁の正常な構造の消失がある場合は癌を疑い、眼瞼の生検を検討する。
    condition:
      region: 米国
      study: 米国眼科学会の診療ガイドライン（Preferred Practice Pattern）の鑑別診断と診断過程の記載
    differential: null
    common_misconception: null
  provenance:
