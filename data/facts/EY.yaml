- id: EY-052
  domain: EY
  subdomain: 春季カタル
  assertion:
    plain_statement_ja: 春季カタル（春季角結膜炎）は小児と若年成人に多い慢性のアレルギー性角結膜炎で、男児に多く、思春期に軽快する傾向がある。強いかゆみと粘稠な眼脂を呈し、上眼瞼結膜の巨大乳頭や、点状表層角膜症、シールド潰瘍などの角膜合併症を伴うことがある。治療は重症度に応じて段階的に行い、肥満細胞安定薬と抗ヒスタミン薬が軽症から中等症の基本となり、重症例ではステロイド点眼がレスキューとして用いられ、シクロスポリンやタクロリムスなどの免疫抑制薬の局所投与も検討される。
    condition:
