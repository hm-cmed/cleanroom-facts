- id: EY-042
  domain: EY
  subdomain: 弱視の定義・分類と治療原則
  assertion:
    plain_statement_ja: 弱視は、通常は眼自体に異常がない状況で生じる片眼性、ときに両眼性の最良矯正視力の低下であり、視覚像の異常な処理によって生じる中枢神経系の発達障害である。原因によって、屈折性（不同視性と、両眼の高度屈折異常による等屈折性）、斜視性、視覚遮断性（白内障などの混濁や眼瞼下垂による視軸の遮断）、遮閉性（逆弱視）に分類される。治療では、屈折矯正のみでも不同視性・斜視性・混合性の弱視や両眼屈折性弱視の視力が改善しうる。中等度の弱視（20/40〜20/80）では、1日2時間の遮閉または週末のアトロピン点眼が初期治療となり、ほかに薬理学的治療、Bangerterフィルター、デジタル治療薬などの選択肢があり、弱視の原因そのものへの対処も併せて行う。
    condition:
      region: 米国
      study: 学会ガイドライン（Preferred Practice Pattern）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1301
    source: Cruz OA, Repka MX, Hercinovic A, Cotter SA, Lambert SR, Hutchinson AK, Sprunger DT, Morse CL, Wallace DK; American Academy of Ophthalmology Preferred Practice Pattern Pediatric Ophthalmology/Strabismus Panel. Amblyopia Preferred Practice Pattern. Ophthalmology. 2023;130(3):P136-P178.
    doi: 10.1016/j.ophtha.2022.11.003
    pmid: '36526450'
    pmcid: PMC10701408
    url: https://doi.org/10.1016/j.ophtha.2022.11.003
    source_license: CC表示なし
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 定義・分類・治療の要点はいずれもガイドライン本文で確認した。視力の範囲（20/40〜20/80）と遮閉時間（1日2時間）は本文の要点表の記載に基づく。本ガイドラインは米国の診療を前提としており、日本の診療実態との差異は未確認である。アトロピンは薬剤名にあたるため注記する。弱視治療を目的としたアトロピン点眼の国内の承認・保険適用は未確認である。デジタル治療薬の国内の承認状況も未確認である。
