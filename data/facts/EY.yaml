  uncertainty: 薬剤（抗菌薬）について、国内での承認・保険適用の確認状況：未確認。PMID は他論文の参考文献リストで PubMed 収載自体は確認できるが、番号の数値を本調査で直接確認できなかったため null とした（DOI で同定可能）。涙小管炎や先天鼻涙管閉塞など涙嚢炎以外の涙器疾患の詳細は本カードに含めていない。
