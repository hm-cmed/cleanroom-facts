- id: EY-020
  domain: EY
  subdomain: 角膜
  assertion:
    plain_statement_ja: 角膜ジストロフィは遺伝性の角膜疾患の総称で、典型的には両眼性・対称性・緩徐進行性で、環境要因や全身疾患とは関係がないとされる。国際分類 IC3D 第3版では、沈着する解剖学的部位により上皮・上皮下、上皮—実質（TGFBI 変異による群）、実質、内皮の群に分け、各疾患には根拠の確かさを示すカテゴリー1（原因遺伝子と変異が判明）からカテゴリー4（存在が確かでないもの）が付けられる。反復性角膜びらんを小児期から繰り返す上皮反復性びらんジストロフィ（原因遺伝子 COL17A1）もこの分類に含まれる。一方、上皮基底膜ジストロフィのように遺伝性が乏しく変性と考えられる病態も、分類の中に残されている。
    condition:
      region: 全般
      study: 国際分類（IC3D 第3版）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1262
    source: Weiss JS, Rapuano CJ, Seitz B, Busin M, Kivelä TT, Bouheraoua N, Bredrup C, Nischal KK, Chawla H, Borderie V, Kenyon KR, Kim EK, Møller HU, Munier FL, Berger T, Lisch W. IC3D Classification of Corneal Dystrophies—Edition 3. Cornea. 2024;43(4):466-527
    doi: 10.1097/ICO.0000000000003420
    pmid: '38359414'
    pmcid: PMC10906208
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC10906208/
    source_license: © Wolters Kluwer（PMC 収載版で CC 表示を確認できず）
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 個別のジストロフィの遺伝子・変異の網羅的な列挙は行わず、分類の枠組みと代表例に限定した。角膜変性（加齢や炎症など二次性の変化）の個別病型は出典の対象外である。
  curriculum:
    core_curriculum: 'PS-02-15-05 (id: JkxnuTU)'
