- id: EY-053
  domain: EY
  subdomain: 強膜炎
  assertion:
    plain_statement_ja: 強膜炎は上強膜炎よりも眼合併症を伴うことが多い。2つの3次紹介施設の585例（強膜炎500例、上強膜炎85例）の検討では、眼合併症は強膜炎の45.0%に、上強膜炎の19.0%に認められ、視力低下は15.8%と2.3%、前部ぶどう膜炎は26.4%と16.5%、眼圧上昇は14.2%と3.5%だった。全身疾患の合併は強膜炎の35.8%に認められ、そのうち結合組織・血管炎性疾患が24.8%を占め、強膜炎が全身疾患の診断に先行した例が38.7%あった。合併症と疾患合併が最も多いのは壊死性強膜炎で、視力低下の危険因子には壊死性強膜炎（オッズ比6.63）と後部強膜炎（同2.33）が含まれる。
    condition:
      region: 国際
      study: 2つの3次紹介施設における後ろ向き症例集積（強膜炎500例、上強膜炎85例）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1309
    source: Sainz de la Maza M, Molina N, Gonzalez-Gonzalez LA, Doctor PP, Tauber J, Foster CS. Clinical characteristics of a large cohort of patients with scleritis and episcleritis. Ophthalmology. 2012;119(1):43-50.
    doi: 10.1016/j.ophtha.2011.07.013
    pmid: '21963265'
    pmcid: null
    url: https://doi.org/10.1016/j.ophtha.2011.07.013
    source_license: CC表示を確認できず
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 数値はいずれも出典の抄録で確認した。対象は3次紹介施設の症例集積であり、日本の頻度とは限らない。抄録では合併する全身疾患は結合組織・血管炎性疾患という分類までしか示されておらず、関節リウマチなど個別の疾患名ごとの頻度は確認できなかったため含めていない。強膜炎の疼痛の性状や治療（免疫抑制療法など）は本カードには含めておらず、個別薬剤の国内承認・保険適用の確認は対象外である。
