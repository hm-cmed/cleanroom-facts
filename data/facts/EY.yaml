- id: EY-043
  domain: EY
  subdomain: 色覚異常の分類・遺伝と検査
  assertion:
    plain_statement_ja: 色覚異常は先天性と後天性に分けられる。先天性色覚異常は男性の最大8%、女性の0.5%にみられ、最も多い赤緑異常はX連鎖劣性の遺伝形式をとることが性差の背景にある。青黄異常は赤緑異常よりまれである。後天性色覚異常は眼疾患や神経疾患、全身疾患に伴って生じるもので、先天性とは区別して原因を検索する必要がある。検査では仮性同色表によるスクリーニングが広く用いられ、異常の型と程度の判定にはアノマロスコープが用いられる。先天性色覚異常への対応の中心は、進路指導を含む適切なカウンセリングである。
    condition:
      region: 国際
      study: 総説
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1302
    source: Simunovic MP. Colour vision deficiency. Eye (Lond). 2010;24(5):747-755.
    doi: 10.1038/eye.2009.251
    pmid: '19927164'
    pmcid: null
    url: https://doi.org/10.1038/eye.2009.251
    source_license: © 2010 Macmillan Publishers Limited. All rights reserved
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 有病率（男性8%、女性0.5%）とX連鎖劣性の遺伝形式、先天性と後天性の区別は抄録で確認した。有病率は主に先天性赤緑異常についての値であり、集団によって異なる。検査法の位置づけは総説本文の記述に基づく。本論文はPMCに収載されておらず、PMCIDは確認できなかったためnullとした。本カードには薬剤名を含めていない。
