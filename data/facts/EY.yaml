- id: EY-001
  domain: EY
  subdomain: 眼球の構造と機能
  assertion:
    plain_statement_ja: 眼球では、入射した光は角膜で屈折し、虹彩が瞳孔の大きさを変えて眼内に入る光の量を調節し、水晶体が網膜上に焦点を合わせる。網膜の視細胞が光を電気信号に変換し、その信号が視神経を通って脳に送られることで視覚が生じる。涙液は角膜表面を滑らかに保ち、焦点形成を助ける。
