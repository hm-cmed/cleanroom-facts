- id: EY-031
  domain: EY
  subdomain: 閉塞隅角緑内障・急性発作
  assertion:
    plain_statement_ja: 急性原発閉塞隅角発作はアジア人に比較的多く、視力を脅かす眼科緊急症である。アジア太平洋緑内障学会等の合意では、速やかな眼圧下降の選択肢としてアルゴンレーザー周辺虹彩形成術、前房穿刺、レーザー瞳孔形成術が適切とされ、条件が整えば早期の水晶体乳化吸引術は網膜神経節細胞のさらなる喪失と進行を防ぐうえで有効とされる。
    condition:
