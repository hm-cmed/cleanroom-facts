- id: EY-023
  domain: EY
  subdomain: 水晶体
  assertion:
    plain_statement_ja: 白内障は、本来透明な水晶体が進行性に混濁する状態で、世界における失明の最も多い原因である。加齢に伴うものが最も多く、混濁の部位によって核白内障、皮質白内障、後嚢下白内障に分けられ、複数の部位の混濁が混在することも多い。原因としては加齢のほか、先天性、外傷、糖尿病などの代謝性疾患、副腎皮質ステロイドなどの薬剤がある。
    condition:
      region: 全般
      study: 総説（Disease Primer）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1265
    source: Lam D, Rao SK, Ratra V, Liu Y, Mitchell P, King J, Tassignon MJ, Jonas J, Pang CP, Chang DF. Cataract. Nat Rev Dis Primers. 2015;1:15014
    doi: 10.1038/nrdp.2015.14
    pmid: '27188414'
    pmcid: null
    url: https://doi.org/10.1038/nrdp.2015.14
    source_license: © Nature Portfolio (Springer Nature)
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 定義（水晶体の進行性混濁）と「失明原因の首位」という位置づけは要約で確認した。分類と原因の詳細は購読制の本文を本調査で逐語確認できておらず、一般的な枠組みの範囲に留めたため、取り込み側での本文確認が望ましい。薬剤（副腎皮質ステロイド）は原因として挙げたもので、本カードでは国内の承認・保険適用の対象ではない。
