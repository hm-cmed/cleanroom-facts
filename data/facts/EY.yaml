- id: EY-013
  domain: EY
  subdomain: 結膜
  assertion:
    plain_statement_ja: 結膜炎の鑑別では所見の組み合わせが手がかりになる。水様性眼脂と濾胞反応、耳前リンパ節腫脹はウイルス性を、膿性・粘液膿性の眼脂は細菌性を、強いかゆみはアレルギー性を示唆する。眼瞼の小水疱や樹枝状の角膜上皮病変があればヘルペス性を考え、多量の膿性眼脂と高度の眼瞼腫脹があれば淋菌性を疑う。
    condition:
      region: 全般
