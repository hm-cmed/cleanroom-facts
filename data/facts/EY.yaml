- id: EY-017
  domain: EY
  subdomain: 眼表面
  assertion:
    plain_statement_ja: ドライアイ（乾性角結膜炎）は、涙液膜の恒常性（ホメオスタシス）の喪失を特徴とする眼表面の多因子疾患で、眼症状を伴い、涙液膜の不安定性と高浸透圧、眼表面の炎症と障害、神経感覚異常が病因的な役割を果たす。分類上、涙液減少型と蒸発亢進型は互いに独立した病態ではなく、連続体として扱われる。
