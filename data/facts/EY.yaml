- id: EY-014
  domain: EY
  subdomain: 角膜
  assertion:
    plain_statement_ja: 感染性角膜炎の診断の基本は角膜擦過物の染色と培養で、細菌性の場合、グラム染色で起炎菌を検出できる割合は60〜75%とされる。細菌性角膜炎の第一選択は局所抗菌薬で、一般に用いられる局所抗菌薬の間に有効性の大きな差はないとされ、すべての角膜潰瘍で培養と感受性検査が推奨される。補助療法としての局所ステロイドは全体では有意な改善を示さなかったが、中心部・深部・大きな潰瘍など一部の条件では有益な可能性が無作為化比較試験の部分集団解析で示されている。単純ヘルペスウイルスによる角膜炎は再発性で、実質型では局所ステロイドと経口アシクロビルの併用が有効とされ、経口アシクロビルは再発をおよそ半減させた。
    condition:
      region: 全般
      study: 総説
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1257
    source: Austin A, Lietman T, Rose-Nussbaumer J. Update on the Management of Infectious Keratitis. Ophthalmology. 2017;124(11):1678-1689
    doi: 10.1016/j.ophtha.2017.05.012
    pmid: '28942073'
    pmcid: PMC5710829
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC5710829/
    source_license: © Elsevier / American Academy of Ophthalmology（著者原稿が PMC 収載）
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 薬剤（局所抗菌薬、副腎皮質ステロイド、アシクロビル）について、国内での承認・保険適用の確認状況：未確認。グラム染色の検出率60〜75%は出典本文から読み取った値。本文は著者原稿版で確認した。
