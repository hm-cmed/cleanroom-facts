- id: EY-054
  domain: EY
  subdomain: 水晶体偏位・脱臼
  assertion:
    plain_statement_ja: 水晶体偏位・脱臼（水晶体亜脱臼を含む）は、全身性疾患を伴う場合と伴わない孤立性の場合がある。遺伝子変異が同定されている関連疾患・病型には、Marfan症候群、Weill-Marchesani症候群、ホモシスチン尿症、Ehlers-Danlos症候群、亜硫酸オキシダーゼ欠損症のほか、全身性疾患を伴わない水晶体偏位の病型が含まれる。本カードは眼の所見としての水晶体偏位・脱臼の原因の範囲のみを扱う。
    condition:
      region: 国際
      study: 水晶体偏位の遺伝学に関する総説
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1310
    source: Sadiq MA, Vanderveen D. Genetics of ectopia lentis. Semin Ophthalmol. 2013;28(5-6):313-320.
    doi: 10.3109/08820538.2013.825276
    pmid: '24138040'
    pmcid: null
    url: https://doi.org/10.3109/08820538.2013.825276
    source_license: CC表示を確認できず
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 本カードは出典の抄録で確認できた関連疾患と遺伝子変異の範囲のみを記載した。境界の方針により、Marfan症候群などの全身像は含めていない。偏位の方向が原因疾患の手がかりになること（方向別の対応）、外傷による脱臼、緑内障や網膜剥離などの眼合併症は、出典の抄録では確認できなかったため本カードには含めておらず、本文または別の一次資料での確認が望ましい。各疾患の原因遺伝子の個別の対応も抄録の範囲外である。
