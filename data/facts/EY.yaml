- id: EY-044
  domain: EY
  subdomain: 視神経萎縮の病像と原因
  assertion:
    plain_statement_ja: 視神経萎縮は多様な視神経症の終末像であり、遺伝性または後天性のさまざまな原因による不可逆的な軸索障害を反映する。片眼性にも両眼性にも生じ、さまざまな程度の暗点、部分的から完全なものまで幅のある視力低下、色覚異常、コントラスト感度の低下を呈し、光干渉断層計では網膜神経線維層と神経節細胞層の菲薄化がみられる。フランスの単施設で非緑内障性視神経萎縮643眼を集計した研究では、原因は炎症性が31%と最も多く、次いで圧迫性13%、遺伝性11%、頭蓋内圧亢進に伴うもの8%、虚血性7%、外傷性6%、中毒・栄養性5%で、原因不明が17%あった。
    condition:
