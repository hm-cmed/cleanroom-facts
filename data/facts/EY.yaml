- id: EY-005
  domain: EY
  subdomain: 眼瞼
  assertion:
    plain_statement_ja: 麦粒腫は眼瞼の腺の急性感染である。外麦粒腫は睫毛包と Zeis 腺のブドウ球菌感染で、眼瞼縁に片眼性の有痛性腫瘤を生じる。内麦粒腫はマイボーム腺の感染で、よりびまん性に広がる。いずれも第一選択は温罨法で、麦粒腫には局所抗菌薬を用いることがあり、改善しない場合は眼科で切開排膿を行う。
