- id: EY-046
  domain: EY
  subdomain: 動眼神経麻痺の原因と瞳孔所見
  assertion:
    plain_statement_ja: 後天性の動眼神経麻痺では眼瞼下垂が高頻度にみられ、複視を伴う。米国の地域住民を対象とした研究で新たに診断された145例では、原因は微小血管性と推定されるものが42%と最も多く、次いで外傷12%、腫瘍による圧迫11%、脳神経外科手術後10%、動脈瘤による圧迫6%であった。瞳孔障害は全体の43%にみられ、圧迫性病変では64%と微小血管性の場合の16%より多かったが、瞳孔障害がないことは圧迫性病変の除外にはならず、瞳孔障害があることも微小血管性の原因を除外しない。このため、動眼神経麻痺では動脈瘤を含む圧迫性病変を鑑別することが重要である。
    condition:
      region: 米国ミネソタ州オルムステッド郡
      study: 地域住民ベースの研究（1978〜2014年に診断された145例）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1305
    source: Fang C, Leavitt JA, Hodge DO, Holmes JM, Mohney BG, Chen JJ. Incidence and Etiologies of Acquired Third Nerve Palsy Using a Population-Based Method. JAMA Ophthalmol. 2017;135(1):23-28.
    doi: 10.1001/jamaophthalmol.2016.4456
    pmid: '27893002'
    pmcid: PMC5462106
    url: https://doi.org/10.1001/jamaophthalmol.2016.4456
    source_license: CC表示を確認できず
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 原因別割合と瞳孔障害・眼瞼下垂の頻度は本論文の抄録に基づく数値で、学会誌の抄録要約でも同じ値を確認した。動脈瘤の部位別の内訳は抄録では確認できなかったため、主張文では「動脈瘤による圧迫」とし、特定の部位名は記載していない。本出典の対象は動眼神経麻痺のみであり、滑車神経麻痺・外転神経麻痺それぞれの特徴は扱っていない。本カードには薬剤名を含めていない。
