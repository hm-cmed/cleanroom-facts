- id: EY-026
  domain: EY
  subdomain: 角膜
  assertion:
    plain_statement_ja: 角膜移植では、角膜全層を置換する全層角膜移植が半世紀以上にわたり主流であった。これに対し、実質の疾患には内皮拒絶の危険をなくす深層層状角膜移植が全層移植に取って代わりつつあり、内皮の疾患には障害された内皮のみを選択的に置換する角膜内皮移植が行われ、視機能の回復が速く予測しやすい。このほか、眼表面の再建や人工角膜も重症例の選択肢となる。
