- id: SM-004
  domain: SM
  subdomain: タバコ依存
  assertion:
    plain_statement_ja: 保険診療による禁煙治療（ニコチン依存症管理料）の対象は、①直ちに禁煙しようと考えている、②ニコチン依存症スクリーニングテスト（TDS）で5点以上、③35歳以上の場合はBrinkman指数（1日の喫煙本数×喫煙年数）が200以上、④禁煙治療を受けることを文書で同意している、の4条件をすべて満たす者である。Brinkman指数は累積喫煙量の指標であり、35歳未満では③の要件は求められない。標準治療は初回診察から12週間に計5回（初回、2・4・8・12週後）行われる。
    condition:
      region: 日本
      対象: 禁煙治療を受ける喫煙者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-4028
    source: 日本循環器学会・日本肺癌学会・日本癌学会・日本呼吸器学会. 禁煙治療のための標準手順書 第7版. 2020年4月
    doi: null
    pmid: null
    pmcid: null
    url: null
    source_license: 学会の著作物（CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: 自由に使える資料による裏づけ（GOV_JP／GOV_JP、作り手の調査バッチ93 2026-11-15）：厚生労働省 e-ヘルスネット「禁煙治療ってどんなもの？」（最終更新日：2024年3月6日）／千葉県「禁煙治療を活用して上手に禁煙を！」（受診週の内訳を担う）（https://kennet.mhlw.go.jp/information/information/tobacco/t-06-007.html／https://www.pref.chiba.lg.jp/kenzu/tabako/kinen.html）。裏づける部分：部分（ほぼ全面）：厚労省 e-ヘルスネットのページは、保険適用の4条件をすべて本文で再掲する（①ニコチン依存症スクリーニングテスト（TDS）で5点以上、②35歳以上の場合はブリンクマン指数200以上、③直ちに禁煙することを希望、④「禁煙治療のための標準手順書」に則った説明を受け文書により同意）。35歳未満では指数要件が求められない点にも触れる（2016年の対象拡大として記載）。標準治療が「12週間に5回」のプログラムであることも本文に明記される。各回の時期（初回・2・4・8・12週後）の内訳は同ページでは流れ図の画像内のみのため、千葉県の公式ページが本文で「初回診察に加えて、初回診察から2週間後、4週間後、8週間後、12週間後の計4回の再診」と明記する部分で補った。数値の照合：一致：TDS 5点以上、ブリンクマン指数200以上（35歳以上の場合）、12週間に計5回（初回・2・4・8・12週後）は候補の記載と一致。留保：主出典は学会の手順書（第7版）で CC 表示はなく、現行 RESTRICTED が正しい。候補はいずれも政府機関の公式ページ（厚生労働省・千葉県）である。監視事項：手順書の現行版は第8.1版（2021年9月）であり、次回改訂時に本体照合を推奨する（申し送り参照）
  uncertainty: 本カードは第7版（2020年4月）の全文で確認した内容である。第8.1版（2021年9月）の存在は二次引用でのみ確認し、本体は未照合のため、第7版からの差分は確認していない。ニコチンパッチとバレニクリンは、ニコチン依存症管理料の算定に伴い処方された場合に限り保険適用となり、ニコチンガムは保険適用がなく一般用医薬品として購入する（同手順書で確認）。
