    pmid: '35279265'
    pmcid: null
    url: https://doi.org/10.1016/S2213-2600(21)00511-7
    source_license: CC BY-NC-ND 4.0（出版社の登録情報で確認）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 有病率とオッズ比は系統的レビュー・モデリング解析の抄録で確認した範囲である。COPDの病態・診断・治療は呼吸器の分野が正であり、本カードでは喫煙との疫学的な関連のみを扱う。
