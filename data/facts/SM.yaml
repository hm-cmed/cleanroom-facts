  assertion:
    plain_statement_ja: 喫煙量と循環器疾患リスクの関係は直線的ではなく、1日1本でもリスクは大きく残る。1日1本の喫煙の相対リスクは冠動脈疾患で男性1.48・女性1.57、脳卒中で男性1.25・女性1.31であり、1日20本の相対リスク（冠動脈疾患で男性2.04・女性2.84、脳卒中で男性1.64・女性2.16）と比べて、1日1本の超過相対リスクは20本の約半分に達する。このため循環器疾患については安全な喫煙量はないと結論づけられている。
