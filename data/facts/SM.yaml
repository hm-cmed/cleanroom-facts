- id: SM-002
  domain: SM
  subdomain: タバコ煙中の有害物質、未成年者の喫煙、受動喫煙
  assertion:
    plain_statement_ja: タバコとタバコ煙は9,500を超える化学物質を含む複合混合物である。国際がん研究機関（IARC）が発がん物質として分類した83物質のうち80物質がタバコ煙中に見いだされる。代表的な発がん物質には、多環芳香族炭化水素のベンゾ[a]ピレン、タバコ特異的ニトロソアミンのNNK（4-(methylnitrosamino)-1-(3-pyridyl)-1-butanone）とNNN（N′-nitrosonornicotine）、芳香族アミンなどがあり、ベンゾ[a]ピレン、NNK、NNNはいずれもIARC分類のグループ1（ヒトに対して発がん性がある）に分類される。
    condition:
      region: 国際
      対象: タバコ煙に曝露される者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-4026
    source: 'Li Y, Hecht SS. Carcinogenic components of tobacco and tobacco smoke: A 2022 update. Food Chem Toxicol. 2022;167:113179'
    doi: 10.1016/j.fct.2022.113179
    pmid: '35643228'
    pmcid: null
    url: https://doi.org/10.1016/j.fct.2022.113179
    source_license: 出版社の著作物（CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN／OPEN、作り手の調査バッチ93 2026-11-15）：Rudwan AH, Al Adhreai E, Ali HE, et al. From Airways to Alveoli: A Review of Smoking-Related Respiratory Disorders. Cureus. 2026;18(2):e104440／Li Y, Hecht SS. Metabolism and DNA Adduct Formation of Tobacco-Specific N-Nitrosamines. Int J Mol Sci. 2022;23(9):5109（PMID: 41918648／35563500、DOI: 10.7759/cureus.104440／10.3390/ijms23095109、PMCID: PMC13034887／PMC9104174、https://creativecommons.org/licenses/by/4.0/）。裏づける部分：部分：候補1（Cureus 2026 総説）は「タバコ製品は9,500を超える化学物質を含む複合混合物である」「IARC は2022年時点でタバコとタバコ煙中の発がん物質83物質を分類した」を主出典と同じ値で再掲し、多環芳香族炭化水素（PAH）とタバコ特異的ニトロソアミン（TSNA）を主要な発がん物質群として挙げる。候補2（主出典と同一著者の総説）は NNK と NNN が IARC により「ヒトに対して発がん性がある」（グループ1）に分類されることを再掲する。83物質の内訳（タバコ煙中に80物質）、ベンゾ[a]ピレンの名指し、芳香族アミン、PAH のグループ1分類そのものは自由な全文で再掲されない。数値の照合：一致：9,500超の化学物質数、IARC 分類83物質（2022年時点）、NNK・NNN のグループ1分類は候補の再掲と一致。カードの値は主出典本体（PMC 収載の著者稿）でも、83物質の内訳（未燃焼タバコ37・タバコ煙80）を含めて照合済み。留保：主出典の刊行版ライセンスは Crossref で Elsevier のテキストマイニング用ライセンスと OA ユーザーライセンス（著者稿向け）のみで CC ではなく、Europe PMC でも非 OA のため、現行 RESTRICTED が正しい。要・正本確認：マスターとカードは巻数を167とするが、PubMed（NLM 記録）・Crossref・Europe PMC はいずれも165を示す（申し送り参照）。候補1のライセンスは PMC 全文のライセンス要素（CC BY 4.0）と Europe PMC の個別レコード（cc by）で個別確認した（Crossref にはライセンス登録なし）。候補2は Crossref の刊行版データでも CC BY 4.0 を確認した'
  uncertainty: 物質数と発がん性分類は2022年の総説の抄録とIARCモノグラフの公開資料で確認した範囲である。国内のたばこ煙の成分分析の実測値を示す政府資料は本体を照合していないため、主張に入れていない。
