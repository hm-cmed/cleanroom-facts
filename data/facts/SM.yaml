- id: SM-009
  domain: SM
  subdomain: 妊婦・胎児への影響
  assertion:
    plain_statement_ja: エコチル調査（日本子どもの健康と環境に関する全国調査、JECS）の妊婦86,638人では、妊娠中期・後期の尿中コチニン濃度で分けた能動喫煙（高濃度）群で、早産の調整オッズ比1.39（95%信頼区間1.19〜1.62）、低出生体重2.27（同2.05〜2.53）、在胎週数に比べて小さい児（SGA）2.39（同2.16〜2.65）であり、低濃度群でもいずれの転帰も上昇し、用量反応関係が示された。
    condition:
      region: 日本
      対象: 妊婦
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-4033
    source: 'Kunori Y, Saijo Y, Yoshioka E, Sato Y, Kanaya T, Nakanishi K, et al. Evaluating association of smoking status during pregnancy with adverse birth outcomes using urinary cotinine concentration: The Japan Environment and Children''s Study (JECS). Environ Res. 2022;215(Pt 2):114302'
    doi: 10.1016/j.envres.2022.114302
    pmid: '36115418'
    pmcid: null
    url: https://doi.org/10.1016/j.envres.2022.114302
    source_license: CC BY-NC 4.0（出版社の登録情報で確認）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ93 2026-11-15）：Avşar TS, McLeod H, Jackson L. Health outcomes of smoking during pregnancy and the postpartum period: an umbrella review. BMC Pregnancy Childbirth. 2021;21:254（PMID: 33771100、DOI: 10.1186/s12884-021-03729-1、PMCID: PMC7995767、https://creativecommons.org/licenses/by/4.0/）。裏づける部分：部分：候補（妊娠中の喫煙の健康影響のアンブレラレビュー）は、妊娠中の喫煙が早産・低出生体重と関連すること（低出生体重はリスク増加が最大級の転帰の一つ）、影響が喫煙本数と関連すること（用量関係）を再掲し、カードの関連の骨格と用量反応の方向を裏づける。エコチル調査固有の設計（尿中コチニンによる曝露分類、妊婦86,638人）と3つの調整オッズ比そのものは自由な全文で再掲されない。主出典を引用する後続論文3件はいずれも CC BY ではない（Hypertens Res は非 OA、Environ Pollut と BJOG は CC BY-NC）。数値の照合：カードの数値は主出典の抄録と一致することを確認した（妊婦86,638人、高濃度群の調整オッズ比：早産1.39［1.19〜1.62］、低出生体重2.27［2.05〜2.53］、SGA 2.39［2.16〜2.65］、低濃度群でもいずれの転帰も上昇）。候補は定性的な骨格のみで、数値の照合には使わない。留保：主出典の刊行版ライセンスは Crossref で CC BY-NC 4.0 のため、現行 RESTRICTED が正しい（カード側の source_license 記載とも一致）。候補のライセンスは Crossref の刊行版データ（CC BY 4.0）、Europe PMC の個別レコード（cc by）、PMC 全文のライセンス要素で個別確認した'
  uncertainty: 曝露の分類は自己申告ではなく尿中コチニン濃度による。ニコチンパッチおよびニコチンガムは国内では妊婦・授乳婦が禁忌とされており（禁煙治療のための標準手順書第7版で確認）、妊娠中の禁煙支援は薬物療法ではなく行動支援が中心になる。妊娠・分娩の管理そのものは周産期の分野が正であり、本カードでは喫煙曝露と出生転帰の関連のみを扱う。
  curriculum:
    kokushi: 医学各論 ⅩⅢ-3-B-③（妊婦・胎児への影響、a）
    core_curriculum: 'GE-04-01-06 (id: JkxpswA)；PS-02-11-05 (id: JkxnuSU)'
