- id: SM-003
  domain: SM
  subdomain: タバコ煙中の有害物質、未成年者の喫煙、受動喫煙
  assertion:
    plain_statement_ja: 2021年度の全国中高生調査では、紙巻タバコの喫煙経験者率は中学1.9%・高校2.7%、月喫煙者率は中学0.2%・高校0.7%であった。学年別では高校3年生の喫煙率は男子1.0%・女子0.6%で、2010年（男子8.6%・女子3.8%）から大きく低下したが、健康日本21（第二次）の目標である未成年者の喫煙0%には達していない。加熱式タバコの月使用者率は中学0.3%・高校0.5%であった。
    condition:
      region: 日本
      対象: 中高生
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-4027
    source: 尾﨑米厚（研究代表者）. 厚生労働科学研究費補助金 総括研究報告書「喫煙、飲酒等生活習慣の実態把握及び生活習慣の改善に向けた研究」（2021年度中高生全国調査を含む）
    doi: null
    pmid: null
    pmcid: null
    url: null
    source_license: 政府の研究事業報告書（個別のCC表示は未確認）
    legal_basis: B
    source_class: GOV_JP
    corroboration: null
  uncertainty: 調査は協力校（中学校18校・高等学校17校）を対象とするもので、全国の無作為抽出ではない。20歳未満の者へのタバコ販売の禁止と販売時の年齢確認の義務、2022年の成人年齢引下げ後も喫煙の年齢制限が20歳に維持されたことは厚生労働省系の健康情報サイトで確認したが、法律の現行題名と改正経緯の逐語確認はしていない。
