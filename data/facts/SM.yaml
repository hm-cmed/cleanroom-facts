  domain: SM
  subdomain: 呼吸器疾患(慢性閉塞性肺疾患<COPD>)、がん、循環器疾患
  assertion:
    plain_statement_ja: 2019年の世界のCOPD有病率（GOLD定義、30〜79歳）は10.3%（約3億9,190万人）と推計された。危険因子としての喫煙のオッズ比は、現在喫煙で3.2（95%信頼区間2.5〜4.0）、喫煙経験で2.3（95%信頼区間2.0〜2.5）であった。
