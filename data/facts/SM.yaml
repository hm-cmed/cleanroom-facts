- id: SM-009
  domain: SM
  subdomain: 妊婦・胎児への影響
  assertion:
    plain_statement_ja: エコチル調査（日本子どもの健康と環境に関する全国調査、JECS）の妊婦86,638人では、妊娠中期・後期の尿中コチニン濃度で分けた能動喫煙（高濃度）群で、早産の調整オッズ比1.39（95%信頼区間1.19〜1.62）、低出生体重2.27（同2.05〜2.53）、在胎週数に比べて小さい児（SGA）2.39（同2.16〜2.65）であり、低濃度群でもいずれの転帰も上昇し、用量反応関係が示された。
    condition:
      region: 日本
      対象: 妊婦
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-4033
    source: 'Kunori Y, Saijo Y, Yoshioka E, Sato Y, Kanaya T, Nakanishi K, et al. Evaluating association of smoking status during pregnancy with adverse birth outcomes using urinary cotinine concentration: The Japan Environment and Children''s Study (JECS). Environ Res. 2022;215(Pt 2):114302'
    doi: 10.1016/j.envres.2022.114302
    pmid: '36115418'
    pmcid: null
    url: https://doi.org/10.1016/j.envres.2022.114302
    source_license: CC BY-NC 4.0（出版社の登録情報で確認）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 曝露の分類は自己申告ではなく尿中コチニン濃度による。ニコチンパッチおよびニコチンガムは国内では妊婦・授乳婦が禁忌とされており（禁煙治療のための標準手順書第7版で確認）、妊娠中の禁煙支援は薬物療法ではなく行動支援が中心になる。妊娠・分娩の管理そのものは周産期の分野が正であり、本カードでは喫煙曝露と出生転帰の関連のみを扱う。
  curriculum:
