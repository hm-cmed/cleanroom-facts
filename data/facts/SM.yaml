- id: SM-004
  domain: SM
  subdomain: タバコ依存
  assertion:
    plain_statement_ja: 保険診療による禁煙治療（ニコチン依存症管理料）の対象は、①直ちに禁煙しようと考えている、②ニコチン依存症スクリーニングテスト（TDS）で5点以上、③35歳以上の場合はBrinkman指数（1日の喫煙本数×喫煙年数）が200以上、④禁煙治療を受けることを文書で同意している、の4条件をすべて満たす者である。Brinkman指数は累積喫煙量の指標であり、35歳未満では③の要件は求められない。標準治療は初回診察から12週間に計5回（初回、2・4・8・12週後）行われる。
    condition:
      region: 日本
      対象: 禁煙治療を受ける喫煙者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-4028
    source: 日本循環器学会・日本肺癌学会・日本癌学会・日本呼吸器学会. 禁煙治療のための標準手順書 第7版. 2020年4月
    doi: null
    pmid: null
    pmcid: null
    url: null
    source_license: 学会の著作物（CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 本カードは第7版（2020年4月）の全文で確認した内容である。第8.1版（2021年9月）の存在は二次引用でのみ確認し、本体は未照合のため、第7版からの差分は確認していない。ニコチンパッチとバレニクリンは、ニコチン依存症管理料の算定に伴い処方された場合に限り保険適用となり、ニコチンガムは保険適用がなく一般用医薬品として購入する（同手順書で確認）。
