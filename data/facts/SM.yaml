- id: SM-001
  domain: SM
  subdomain: タバコ煙中の有害物質、未成年者の喫煙、受動喫煙
  assertion:
    plain_statement_ja: 令和6年国民健康・栄養調査では、現在習慣的に喫煙している者の割合は14.8%（男性24.5%、女性6.5%）で、健康日本21（第三次）の目標値である20歳以上の喫煙率12%には達していない。使用している製品は紙巻たばこが男性65.4%・女性60.0%、加熱式たばこが男性41.4%・女性44.2%であった（複数回答）。望まない受動喫煙（家庭・職場・飲食店）の機会を有する者の割合は26.7%（現在喫煙者を除く）であった。
    condition:
      region: 日本
      対象: 喫煙者および非喫煙者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1056
    source: 厚生労働省. 令和6年国民健康・栄養調査結果の概要. 2025年公表（調査は2024年10〜11月実施）
    doi: null
    pmid: null
    pmcid: null
    url: null
    source_license: 政府標準利用規約
    legal_basis: B
    source_class: GOV_JP
    corroboration: null
  uncertainty: 数値は公表資料（概要）の第6章「飲酒・喫煙に関する状況」から読み取った確定値である。20歳未満の喫煙率は本調査の概要には含まれないため、未成年者の喫煙は SM-003 で別の公的資料を出典として扱う。
