- id: SM-005
  domain: SM
  subdomain: タバコ依存
  assertion:
    plain_statement_ja: ニコチン受容体部分作動薬バレニクリンは、プラセボと比較して禁煙成功を増やす（リスク比2.32、95%信頼区間2.15〜2.51、41試験・17,395人、確実性の高いエビデンス）。重篤な有害事象のリスク比は1.23（95%信頼区間1.01〜1.48）であった。同じくニコチン受容体部分作動薬のシチシンのリスク比は1.30（95%信頼区間1.15〜1.47）である。
    condition:
      region: 国際
      対象: 禁煙を試みる喫煙者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-4029
    source: Livingstone-Banks J, Fanshawe TR, Thomas KH, Theodoulou A, Hajizadeh A, et al. Nicotine receptor partial agonists for smoking cessation. Cochrane Database Syst Rev. 2023;5(5):CD006103
    doi: 10.1002/14651858.CD006103.pub8
    pmid: '37142273'
    pmcid: PMC10169257
    url: https://doi.org/10.1002/14651858.CD006103.pub8
    source_license: CC BY（オープンアクセス版の表示をEurope PMCで確認）
    legal_basis: B
    source_class: OPEN
    corroboration: null
  uncertainty: バレニクリンは国内で2008年1月に承認された薬剤で、ニコチン依存症管理料の算定に伴い処方された場合に保険適用となる。供給については、製剤中のN-ニトロソバレニクリンの検出を受けて2021年6月から出荷停止が続いたが、製造方法の変更について製造販売承認事項一部変更承認が得られ、2025年10月30日に通常出荷が再開された（販売元の案内文書と、厚生労働省の医療用医薬品供給状況報告で当該週に通常出荷へ移行したことを、本作成時に再確認）。シチシンは国内未承認であり、国内の治療選択肢には入らない。
  curriculum:
    kokushi: 医学各論 ⅩⅢ-3-B-①（タバコ依存、a）
