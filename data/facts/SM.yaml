- id: SM-010
  domain: SM
  subdomain: 妊婦・胎児への影響
  assertion:
    plain_statement_ja: 妊娠中の禁煙支援として薬物を使わない心理社会的介入（カウンセリング、健康教育、胎児への影響のフィードバック、禁煙へのインセンティブ、社会的支援、運動）があり、Cochrane 系統的レビューの2026年版では127件の研究（喫煙中または最近禁煙した妊婦47,361人）が統合された。カウンセリングと金銭的インセンティブは妊娠後期の禁煙を増やす可能性が高く、健康教育、フィードバック、社会的支援も禁煙を増やす可能性がある一方、運動にはほとんど差がない可能性が高い。心理社会的介入全体では、低出生体重児（2500 g未満）の割合が減り、平均出生体重が増え、新生児集中治療室への入院が減る可能性があるが、死産にはほとんど差がない可能性が高く、早産への影響は明らかでない。これらの知見は、民族的マイノリティや先住民族の女性では研究が少なく当てはまりが確認できていない。
    condition:
      region: 国際
      対象: 妊娠中に喫煙している、または最近禁煙した女性
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-4801
    source: Freijah I, Jones KA, Coleman T, Perlen SM, Kennedy M, Passey ME, McKenzie JE, Chamberlain C. Psychosocial interventions for supporting women to stop smoking in pregnancy. Cochrane Database of Systematic Reviews. 2026;(4):CD001055
    doi: 10.1002/14651858.CD001055.pub6
    pmid: null
    pmcid: null
    url: https://doi.org/10.1002/14651858.CD001055.pub6
    source_license: 未確認（刊行元のページで CC 表示を確認できず）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ93 2026-11-15）：Heslehurst N, Hayes L, Jones D, et al. The effectiveness of smoking cessation, alcohol reduction, diet and physical activity interventions in changing behaviours during pregnancy: A systematic review of systematic reviews. PLoS One. 2020;15(5):e0232774（PMID: 32469872、DOI: 10.1371/journal.pone.0232774、PMCID: PMC7259673、https://creativecommons.org/licenses/by/4.0/）。裏づける部分：部分：候補（妊娠中の行動介入に関する系統的レビューの系統的レビュー）は、前版の Cochrane レビュー（Chamberlain 2017）の知見を一覧表で再掲し、介入分類（カウンセリング、健康教育、フィードバック、インセンティブ、社会的支援）ごとの比較構成と、カウンセリング等の主要な比較で妊娠後期の禁煙が増加したという結果の方向を示す。これは2026年版の結論の骨格（カウンセリングと金銭的インセンティブが妊娠後期の禁煙を増やす可能性が高い）と整合する。2026年版固有の統合件数（127件・47,361人）と出生アウトカムの所見（低出生体重児の減少、平均出生体重の増加、新生児集中治療室への入院の減少、死産への差なし、早産への影響は不明）は自由な全文で再掲されない。数値の照合：カードの件数（127件・47,361人）は主出典2026年版の抄録と一致することを確認した。候補は2017年版の分類別の結果の方向のみで、2026年版の数値の照合には使わない。留保：主出典の区分訂正（UNKNOWN → RESTRICTED）を提案する（区分訂正の節参照）。カードの uncertainty にある「2026年版の PMID・PMCID は確認できず」は本バッチで決着し、PMID 42011820 と PMCID PMC13097252（PMC 収載は書誌事項と抄録のみで本文なし）を確認した（識別子補完の節参照）。候補のライセンスは Crossref の刊行版データ（CC BY 4.0）、Europe PMC の個別レコード（cc by）、PMC 全文のライセンス要素で個別確認した'
  uncertainty: 本カードは2026年版（pub6）の平易要約・著者結論と試験数に基づく。刊行元のページでは抄録の Main results が旧版（2017年版）の集計のまま表示されていたため、旧版のリスク比等の数値は含めていない。2026年版の PMID・PMCID は作成時点で確認できず null とした（版は DOI で特定した）。薬剤について：本レビューは薬物を使わない介入のみを対象とし薬物療法の効果は評価していない。国内ではニコチン製剤（ニコチンパッチ・ガム）は妊婦・授乳婦に禁忌とされており、妊娠中の禁煙支援は行動支援が中心となる（禁煙治療のための標準手順書第7版に基づく既存カード SM-009 の記載による）。能動喫煙・受動喫煙の転帰そのものは既存カード SM-009 が担う。
