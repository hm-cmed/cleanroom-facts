- id: SM-006
  domain: SM
  subdomain: 呼吸器疾患(慢性閉塞性肺疾患<COPD>)、がん、循環器疾患
  assertion:
    plain_statement_ja: 2019年の世界のCOPD有病率（GOLD定義、30〜79歳）は10.3%（約3億9,190万人）と推計された。危険因子としての喫煙のオッズ比は、現在喫煙で3.2（95%信頼区間2.5〜4.0）、喫煙経験で2.3（95%信頼区間2.0〜2.5）であった。
    condition:
      region: 国際
      対象: 成人
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-4030
    source: 'Adeloye D, Song P, Zhu Y, Campbell H, Sheikh A, Rudan I. Global, regional, and national prevalence of, and risk factors for, chronic obstructive pulmonary disease (COPD) in 2019: a systematic review and modelling analysis. Lancet Respir Med. 2022;10(5):447-458'
    doi: 10.1016/S2213-2600(21)00511-7
    pmid: '35279265'
    pmcid: null
    url: https://doi.org/10.1016/S2213-2600(21)00511-7
    source_license: CC BY-NC-ND 4.0（出版社の登録情報で確認）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ93 2026-11-15）：Al Wachami N, Guennouni M, Iderdar Y, et al. Estimating the global prevalence of chronic obstructive pulmonary disease (COPD): a systematic review and meta-analysis. BMC Public Health. 2024;24:297（PMID: 38273271、DOI: 10.1186/s12889-024-17686-9、PMCID: PMC10811845、https://creativecommons.org/licenses/by/4.0/）。裏づける部分：部分：候補（COPD 有病率の系統的レビュー・メタ解析）は主出典（Adeloye 2022）を引用し、「固定比（GOLD）定義による世界の COPD 有病率は10.3%であった」と主出典の値を再掲する。有病者数（約3億9,190万人）と喫煙のオッズ比（現在喫煙3.2、喫煙経験2.3）は自由な全文で再掲されない。WHO の資料は2019年の患者数（約3億9,200万人）に触れるが、ライセンスが CC BY-NC-SA 3.0 IGO で自由とはみなさず候補にしない。数値の照合：一致：有病率10.3%（GOLD 定義、30〜79歳）は候補の再掲と一致。カードの値は主出典の抄録でも照合済み（10.3%［95%信頼区間8.2〜12.8］が約3億9,190万人に相当、現在喫煙のオッズ比3.2［2.5〜4.0］、喫煙経験2.3［2.0〜2.5］）。有病者数と喫煙のオッズ比は自由な全文では照合できない。留保：主出典の刊行版ライセンスは Crossref で CC BY-NC-ND 4.0 のため、現行 RESTRICTED が正しい（カード側の source_license 記載とも一致）。候補のライセンスは Crossref の刊行版データ（CC BY 4.0）、Europe PMC の個別レコード（cc by）、PMC 全文のライセンス要素で個別確認した'
  uncertainty: 有病率とオッズ比は系統的レビュー・モデリング解析の抄録で確認した範囲である。COPDの病態・診断・治療は呼吸器の分野が正であり、本カードでは喫煙との疫学的な関連のみを扱う。
