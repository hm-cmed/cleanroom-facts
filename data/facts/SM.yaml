- id: SM-002
  domain: SM
  subdomain: タバコ煙中の有害物質、未成年者の喫煙、受動喫煙
  assertion:
    plain_statement_ja: タバコとタバコ煙は9,500を超える化学物質を含む複合混合物である。国際がん研究機関（IARC）が発がん物質として分類した83物質のうち80物質がタバコ煙中に見いだされる。代表的な発がん物質には、多環芳香族炭化水素のベンゾ[a]ピレン、タバコ特異的ニトロソアミンのNNK（4-(methylnitrosamino)-1-(3-pyridyl)-1-butanone）とNNN（N′-nitrosonornicotine）、芳香族アミンなどがあり、ベンゾ[a]ピレン、NNK、NNNはいずれもIARC分類のグループ1（ヒトに対して発がん性がある）に分類される。
    condition:
      region: 国際
      対象: タバコ煙に曝露される者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-4026
    source: 'Li Y, Hecht SS. Carcinogenic components of tobacco and tobacco smoke: A 2022 update. Food Chem Toxicol. 2022;167:113179'
    doi: 10.1016/j.fct.2022.113179
    pmid: '35643228'
    pmcid: null
    url: https://doi.org/10.1016/j.fct.2022.113179
    source_license: 出版社の著作物（CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 物質数と発がん性分類は2022年の総説の抄録とIARCモノグラフの公開資料で確認した範囲である。国内のたばこ煙の成分分析の実測値を示す政府資料は本体を照合していないため、主張に入れていない。
  curriculum:
    kokushi: 医学各論 ⅩⅢ-3-A-①（タバコ煙中の有害物質、未成年者の喫煙、受動喫煙、a）
