- id: SB-004
  domain: SB
  subdomain: 精神病性障害(アルコール精神病、覚醒剤精神病、大麻精神病)
  assertion:
    plain_statement_ja: 定期的なメタンフェタミン使用者309人（シドニー、過去1年間に月1回以上使用）を対象とした調査では、過去1年間に猜疑心、異常な思考内容、幻覚のいずれかの臨床的に有意な精神病症状を経験した者は23%で、精神病のスクリーニングで陽性となった者は13%だった。メタンフェタミン依存のある使用者では、依存のない使用者に比べて精神病症状の経験が約3倍多かった。
    condition:
      region: 国際
      対象: 定期的なメタンフェタミン使用者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3618
    source: McKetin R, McLaren J, Lubman DI, Hides L. The prevalence of psychotic symptoms among methamphetamine users. Addiction. 2006;101(10):1473-1478
    doi: 10.1111/j.1360-0443.2006.01496.x
    pmid: '16968349'
    pmcid: null
    url: https://doi.org/10.1111/j.1360-0443.2006.01496.x
    source_license: CC 表示なし（購読誌）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ95 2026-11-15）：Wearne TA, Cornish JL. A Comparison of Methamphetamine-Induced Psychosis and Schizophrenia: A Review of Positive, Negative, and Cognitive Symptomatology. Front Psychiatry. 2018;9:491（PMID: 30364176、DOI: 10.3389/fpsyt.2018.00491、PMCID: PMC6191498、https://creativecommons.org/licenses/by/4.0/）。裏づける部分：部分：候補（CC BY 総説）は、その引用文献32（＝主出典 McKetin 2006 であることを引用文献リストで照合済み）に帰属させる形で、「治療を求めていないオーストラリアのメタンフェタミン使用者の研究では、評価時点で13%が精神病のスクリーニングで陽性であり、過去1年間に『臨床的に有意な』精神病症状を報告した者は23%だった」と再掲する。対象者309人・過去1年間に月1回以上使用という標本の枠組みと、メタンフェタミン依存のある使用者では依存のない使用者に比べて精神病症状の経験が約3倍多いという比較は、自由な全文では再掲されない。数値の照合：部分一致：23%と13%は候補の再掲と一致する。依存の有無による約3倍という値は候補に再掲がない。候補にある「一般人口の2〜3倍」という記述は比較の枠組みが異なる別の値であり、カードの「依存のない使用者に比べて約3倍」の裏づけとして登録しないこと。留保：主出典（SRC-3618）の刊行版ライセンスは Wiley の利用条件のみで CC 表示はなく（Crossref の版データに CC の登録はなく、Europe PMC の個別レコードでも非 OA）、現行 RESTRICTED が正しい。識別子補完候補あり（SRC-3618 の PMID。カード側には記録済みでマスターは null）。候補のライセンスは Crossref の版データ（CC BY 4.0）と PMC 全文のライセンス要素（CC BY）で個別確認した'
  uncertainty: 横断調査であり、因果関係を示すものではない。数値は出典の抄録で確認した。国内の覚醒剤精神病の臨床像（遷延化や再燃など）は本研究の範囲外。
