    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3616
    source: American Society of Addiction Medicine. The ASAM Clinical Practice Guideline on Alcohol Withdrawal Management. J Addict Med. 2020;14(3S Suppl 1):1-72
    doi: 10.1097/ADM.0000000000000668
    pmid: '32511109'
    pmcid: null
    url: https://doi.org/10.1097/ADM.0000000000000668
    source_license: CC 表示なし（購読誌）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN／OPEN、作り手の調査バッチ95 2026-11-15）：Kumar MS, Vaishnav M, Saha G, Raheja D. Management algorithm for alcohol withdrawal syndrome, alcohol dependence (AD) and AD with anxiety in the Indian population: a narrative review with expert opinion. Front Psychiatry. 2026;17:1758995／Ratner JA, Blaney H, Rastegar DA. Management of alcohol withdrawal syndrome in patients with alcohol-associated liver disease. Hepatol Commun. 2024;8(2):e0372（PMID: 41908117／38251886、DOI: 10.3389/fpsyt.2026.1758995／10.1097/HC9.0000000000000372、PMCID: PMC13021624／PMC10805424、https://creativecommons.org/licenses/by/4.0/）。裏づける部分：部分：候補1（CC BY の管理アルゴリズム論文）は、検索・比較の対象としたガイドラインの一つとして ASAM ガイドラインを挙げ、検証済みの尺度（CIWA-Ar 等）による重症度評価に基づいて入院と外来を振り分ける管理の枠組みと、離脱リスクの同定に家族等からの側副情報を取ることが ASAM の推奨に含まれることを再掲する。候補2（CC BY 総説）は ASAM ガイドラインの推奨をアルコール関連肝疾患という特殊な患者集団へ適用する形で、重症度に基づく入院判断と症状対応型の管理を再掲する。ただし、主出典そのものの範囲表明、すなわち成人のアルコール離脱について重症度に応じた同定と管理を外来と入院の両方の場面について示し、特殊な患者集団への配慮も含むというガイドライン自体の位置づけを、そのまま再掲する自由な全文はない。数値の照合：数値的主張はカードにない（重症度評価の尺度名と管理の枠組みの定性的な再掲のみ）。留保：主出典（SRC-3616）は Crossref の版データにライセンス登録がなく Europe PMC でも非 OA で、現行 RESTRICTED が正しい。これは TX-003 と同一出典であり、バッチ78 で確認済みの結論の再確認（再掲）である。識別子補完候補（PMID 32511109）もバッチ78 で提案済みの再掲（二重計上しない。カード側には記録済みでマスターは null）。候補のライセンスはいずれも Crossref の版データ（CC BY 4.0）と Europe PMC の個別レコード（cc by）で個別確認した'
  uncertainty: ガイドラインの範囲は要約版（J Addict Med. 2020;14(5):376-392）の抄録で確認した。薬物療法の中心はベンゾジアゼピン系薬とされるが、個別の推奨文の逐語確認は本文（購読誌）では未了。ベンゾジアゼピン系薬にアルコール離脱を効能とする国内承認は確認できず、国内で用いる場合は適応外使用になる。
