- id: SB-002
  domain: SB
  subdomain: アルコール依存症
  assertion:
    plain_statement_ja: 米国アディクション医学会（ASAM）のアルコール離脱管理ガイドライン（2020）は、成人のアルコール離脱について、症候群の重症度に応じた同定と管理を、外来と入院の両方の場面について示した指針であり、特殊な患者集団への配慮も含まれる。
    condition:
      region: 米国
      対象: アルコール離脱症状を呈する成人
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3616
    source: American Society of Addiction Medicine. The ASAM Clinical Practice Guideline on Alcohol Withdrawal Management. J Addict Med. 2020;14(3S Suppl 1):1-72
    doi: 10.1097/ADM.0000000000000668
    pmid: '32511109'
    pmcid: null
    url: https://doi.org/10.1097/ADM.0000000000000668
    source_license: CC 表示なし（購読誌）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: ガイドラインの範囲は要約版（J Addict Med. 2020;14(5):376-392）の抄録で確認した。薬物療法の中心はベンゾジアゼピン系薬とされるが、個別の推奨文の逐語確認は本文（購読誌）では未了。ベンゾジアゼピン系薬にアルコール離脱を効能とする国内承認は確認できず、国内で用いる場合は適応外使用になる。
  curriculum:
    kokushi: 医学各論 Ⅱ-1-E-①（アルコール依存症、a）
