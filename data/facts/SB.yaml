- id: SB-005
  domain: SB
  subdomain: 精神病性障害(アルコール精神病、覚醒剤精神病、大麻精神病)
  assertion:
    plain_statement_ja: 欧州11施設の症例対照研究（初回精神病エピソード901人、対照1,237人）では、大麻の毎日使用は未使用と比べて精神病性障害のオッズを上げ（調整オッズ比3.2、95%信頼区間2.2〜4.1）、高力価大麻（THC含有量10%以上）の毎日使用では調整オッズ比4.8（同2.5〜6.3）だった。因果関係を仮定した推計では、高力価大麻がなくなれば初回精神病エピソードの12.2%が防げるとされた。
    condition:
      region: 欧州
      対象: 初回精神病エピソードの患者と一般人口の対照
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3619
    source: 'Di Forti M, Quattrone D, Freeman TP, et al. The contribution of cannabis use to variation in the incidence of psychotic disorder across Europe (EU-GEI): a multicentre case-control study. Lancet Psychiatry. 2019;6(5):427-436'
    doi: 10.1016/S2215-0366(19)30048-3
    pmid: '30902669'
    pmcid: PMC7646282
    url: https://doi.org/10.1016/S2215-0366(19)30048-3
    source_license: CC BY（Europe PMC のライセンス情報で確認）
    legal_basis: B
    source_class: OPEN
    corroboration: null
  uncertainty: 症例対照研究であり、防げた割合の推計は因果関係を仮定したものである。数値は出典の抄録で確認した。
  curriculum:
    kokushi: 医学各論 Ⅱ-1-E-②（精神病性障害(アルコール精神病、覚醒剤精神病、大麻精神病)、b）
    core_curriculum: 'PS-02-17-05 (id: JkxnuT8)；PS-02-17-02 (id: JkxnuTw)；TBL-02-16-005 (id: JlAKpzE)'
