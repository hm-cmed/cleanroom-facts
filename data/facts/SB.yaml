- id: SB-003
  domain: SB
  subdomain: アルコール依存症
  assertion:
    plain_statement_ja: AUDIT（Alcohol Use Disorders Identification Test）は、危険な飲酒と有害な飲酒を早期に見つけるためのスクリーニング検査で、WHOの6か国の共同プロジェクトから開発された。飲酒量、飲酒行動、飲酒関連の問題を尋ねる10項目の質問票で、各項目0〜4点、合計は40点満点であり、開発研究では危険・有害な飲酒の人の92%が8点以上、危険でない飲酒の人の94%が8点未満だった。
    condition:
      region: 国際
      対象: プライマリケアの受診者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3617
    source: 'Saunders JB, Aasland OG, Babor TF, de la Fuente JR, Grant M. Development of the Alcohol Use Disorders Identification Test (AUDIT): WHO collaborative project on early detection of persons with harmful alcohol consumption--II. Addiction. 1993;88(6):791-804'
    doi: 10.1111/j.1360-0443.1993.tb02093.x
    pmid: '8329970'
    pmcid: null
    url: https://doi.org/10.1111/j.1360-0443.1993.tb02093.x
    source_license: CC 表示なし（購読誌）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ95 2026-11-15）：López-González A, Buitrago-López A, Rodríguez Malagón N, et al. Strengthening alcohol consumption screening in primary care for culturally diverse populations in Latin America: Adaptation and content and face validity of the AUDIT in Guaviare, Colombia. PLoS One. 2026;21(9):e0359625（PMID: 42814685、DOI: 10.1371/journal.pone.0359625、PMCID: PMC13626350、https://creativecommons.org/licenses/by/4.0/）。裏づける部分：部分：候補（AUDIT の文化適応研究、CC BY）は、AUDIT が WHO によってプライマリケアにおける危険な飲酒のスクリーニングのために開発されたこと、10項目が3つの領域（飲酒量＝項目1〜3、依存症状＝項目4〜6、有害な飲酒＝項目7〜10）からなること、各項目0〜4点で合計は0〜40点であること、8点以上が危険な飲酒を示すことを再掲する。WHO の6か国の共同プロジェクトという開発経緯と、開発研究の割合（危険・有害な飲酒の人の92%が8点以上、危険でない飲酒の人の94%が8点未満）は、自由な全文では再掲されない。WHO の AUDIT マニュアル（Babor et al., 2001）は全要素を再掲するが © WHO で CC 表示がなく、自由な出典としては使えない。数値の照合：部分一致：10項目・3領域・各項目0〜4点・合計40点満点・8点以上という構造とカットオフは候補の再掲と一致する。開発研究の92%と94%は候補に再掲がない。候補が別の出典から引く感度90%・特異度80%は主出典の92%・94%とは別の値であり、カードの値の裏づけとして登録しないこと。留保：主出典（SRC-3617）の刊行版ライセンスは Wiley の利用条件のみで CC 表示はなく（Crossref の版データに CC の登録はなく、Europe PMC の個別レコードでも非 OA）、現行 RESTRICTED が正しい。識別子補完候補あり（SRC-3617 の PMID。カード側には記録済みでマスターは null）。候補のライセンスは Crossref の版データ（CC BY 4.0）と PMC 全文のライセンス表示（CC BY 4.0）で個別確認した'
  uncertainty: 数値は出典の抄録で確認した。国内の診療でのカットオフの運用は目的や施設で異なる場合がある。
