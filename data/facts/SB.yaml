- id: SB-003
  domain: SB
  subdomain: アルコール依存症
  assertion:
    plain_statement_ja: AUDIT（Alcohol Use Disorders Identification Test）は、危険な飲酒と有害な飲酒を早期に見つけるためのスクリーニング検査で、WHOの6か国の共同プロジェクトから開発された。飲酒量、飲酒行動、飲酒関連の問題を尋ねる10項目の質問票で、各項目0〜4点、合計は40点満点であり、開発研究では危険・有害な飲酒の人の92%が8点以上、危険でない飲酒の人の94%が8点未満だった。
    condition:
      region: 国際
      対象: プライマリケアの受診者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3617
    source: 'Saunders JB, Aasland OG, Babor TF, de la Fuente JR, Grant M. Development of the Alcohol Use Disorders Identification Test (AUDIT): WHO collaborative project on early detection of persons with harmful alcohol consumption--II. Addiction. 1993;88(6):791-804'
    doi: 10.1111/j.1360-0443.1993.tb02093.x
    pmid: '8329970'
    pmcid: null
    url: https://doi.org/10.1111/j.1360-0443.1993.tb02093.x
    source_license: CC 表示なし（購読誌）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 数値は出典の抄録で確認した。国内の診療でのカットオフの運用は目的や施設で異なる場合がある。
  curriculum:
    kokushi: 医学各論 Ⅱ-1-E-①（アルコール依存症、a）
    core_curriculum: 'PS-02-17-05 (id: JkxnuT8)；TBL-01-00-552 (id: JlvnmTg)'
