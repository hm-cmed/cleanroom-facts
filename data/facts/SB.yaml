- id: SB-006
  domain: SB
  subdomain: ギャンブル障害<ギャンブル依存>、ゲーム依存
  assertion:
    plain_statement_ja: ギャンブル障害は、著しい苦痛や機能障害を伴う持続的・反復的なギャンブル行動のパターンを特徴とし、米国の成人における有病率は0.5%と推定されている。他の精神疾患、とりわけ他の嗜癖性障害と併存することが多く、臨床の場でも見逃されやすい。治療では認知行動療法、動機づけ面接、Gamblers Anonymousなどの行動的介入にエビデンスの裏づけがあり、ギャンブル障害そのものを適応とする承認された薬物療法はない。
    condition:
      region: 国際
      対象: 成人
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3620
    source: Potenza MN, Balodis IM, Derevensky J, et al. Gambling disorder. Nat Rev Dis Primers. 2019;5(1):51
    doi: 10.1038/s41572-019-0099-7
    pmid: '31346179'
    pmcid: null
    url: https://doi.org/10.1038/s41572-019-0099-7
    source_license: CC 表示なし（購読誌）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 有病率0.5%は米国の成人の推定で、出典の総説の抄録に基づく。国内の有病率と対策の枠組み（ギャンブル等依存症対策基本法など）は本カードでは扱っていない。ゲーム障害はICD-11でギャンブル障害と同じ嗜癖性障害の群に位置づけられるが、本カードの出典はギャンブル障害の総説であり、ゲーム障害の扱いは申し送りに残した。
  curriculum:
    kokushi: 医学各論 Ⅱ-1-E-③（ギャンブル障害<ギャンブル依存>、ゲーム依存、c）
