- id: SB-001
  domain: SB
  subdomain: アルコール依存症
  assertion:
    plain_statement_ja: アルコール依存症の治療目標について、国内の『新アルコール・薬物使用障害の診断治療ガイドライン』（2018）は、原則として断酒を目標としつつ、重症例などで本人が断酒に同意しない場合には、治療からの脱落を防ぐため「飲酒量の低減」を暫定的な治療目標とすることを新たに推奨した。
    condition:
      region: 日本
      対象: アルコール依存症患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3615
    source: 新アルコール・薬物使用障害の診断治療ガイドライン作成委員会（監修）, 樋口進, 齋藤利和, ほか（編）. 新アルコール・薬物使用障害の診断治療ガイドライン. 新興医学出版社; 2018
    doi: null
    pmid: null
    pmcid: null
    url: null
    source_license: 表示なし（書籍）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 推奨文は、精神神経学雑誌の特集論文でガイドライン本文が引用されている形で確認した。薬剤の国内承認：アカンプロサートは2013年に承認（アルコール依存症患者における断酒維持の補助）、ナルメフェンは2019年に承認（飲酒量の低減。本ガイドライン刊行後の承認）、ジスルフィラムとシアナミドは抗酒薬として承認済み（個別の添付文書の文言は未照合）。ナルトレキソンの国内承認は確認できなかった。急性中毒の身体管理は第55回以降（ⅩⅢ）が正で本カードの範囲外。
  curriculum:
    kokushi: 医学各論 Ⅱ-1-E-①（アルコール依存症、a）
