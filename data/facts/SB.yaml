- id: SB-004
  domain: SB
  subdomain: 精神病性障害(アルコール精神病、覚醒剤精神病、大麻精神病)
  assertion:
    plain_statement_ja: 定期的なメタンフェタミン使用者309人（シドニー、過去1年間に月1回以上使用）を対象とした調査では、過去1年間に猜疑心、異常な思考内容、幻覚のいずれかの臨床的に有意な精神病症状を経験した者は23%で、精神病のスクリーニングで陽性となった者は13%だった。メタンフェタミン依存のある使用者では、依存のない使用者に比べて精神病症状の経験が約3倍多かった。
    condition:
      region: 国際
      対象: 定期的なメタンフェタミン使用者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3618
    source: McKetin R, McLaren J, Lubman DI, Hides L. The prevalence of psychotic symptoms among methamphetamine users. Addiction. 2006;101(10):1473-1478
    doi: 10.1111/j.1360-0443.2006.01496.x
    pmid: '16968349'
    pmcid: null
    url: https://doi.org/10.1111/j.1360-0443.2006.01496.x
    source_license: CC 表示なし（購読誌）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 横断調査であり、因果関係を示すものではない。数値は出典の抄録で確認した。国内の覚醒剤精神病の臨床像（遷延化や再燃など）は本研究の範囲外。
  curriculum:
    kokushi: 医学各論 Ⅱ-1-E-②（精神病性障害(アルコール精神病、覚醒剤精神病、大麻精神病)、b）
