- id: SB-001
  domain: SB
  subdomain: アルコール依存症
  assertion:
    plain_statement_ja: アルコール依存症の治療目標について、国内の『新アルコール・薬物使用障害の診断治療ガイドライン』（2018）は、原則として断酒を目標としつつ、重症例などで本人が断酒に同意しない場合には、治療からの脱落を防ぐため「飲酒量の低減」を暫定的な治療目標とすることを新たに推奨した。
    condition:
      region: 日本
      対象: アルコール依存症患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3615
    source: 新アルコール・薬物使用障害の診断治療ガイドライン作成委員会（監修）, 樋口進, 齋藤利和, ほか（編）. 新アルコール・薬物使用障害の診断治療ガイドライン. 新興医学出版社; 2018
    doi: null
    pmid: null
    pmcid: null
    url: null
    source_license: 表示なし（書籍）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ95 2026-11-15）：So R, Nouso K, Matsushita S, Yoshiji H, Yuzuriha T, et al. Efficacy and safety of a digital therapeutic for alcohol dependence: A multicenter, open-label, randomized controlled trial. Psychiatry Clin Neurosci. 2025;79(10):667-676（PMID: 40719411、DOI: 10.1111/pcn.13874、PMCID: PMC12498122、https://creativecommons.org/licenses/by/4.0/）。裏づける部分：部分：候補（アルコール依存症のデジタル治療アプリの RCT、CC BY）は、その引用文献8として主出典（2018年ガイドライン）を挙げたうえで、「最近の日本の診療ガイドラインは、過度の飲酒による重篤な身体的・精神的・社会的問題のない患者について、飲酒量低減を実現可能な治療目標として記述している」「日本の依存症専門家の多くは飲酒量低減を妥当な中間目標とみなしている」と再掲する。ガイドラインが断酒だけを目標とせず飲酒量低減を治療目標に位置づけたという骨格は裏づけられる。ただし、カードの中心部分、すなわち治療目標は原則として断酒であることと、重症例などで本人が断酒に同意せず説得もうまくいかない場合に治療からの脱落を防ぐため飲酒量低減を暫定的な治療目標とするという推奨の切り分けは、候補では再掲されない（候補が低減を結びつける対象像はガイドラインの軽症側の規定に対応し、カードの重症側の規定とは異なる。申し送り参照）。数値の照合：数値的主張はカードにない。候補の「日本ではアルコール依存症の人の60〜75%が断酒より飲酒量低減の目標を好む」は別の調査の値であり、カードの主張の裏づけとして登録しないこと。留保：主出典（SRC-3615）は市販の書籍で DOI・PMID・PMCID は存在せず CC 表示もないため、現行 RESTRICTED が正しい。カードの推奨内容そのものは、精神神経学雑誌の特集論文（湯本洋介, 樋口進. アルコール依存症の新ガイドラインと治療ゴール. 精神経誌. 2021;123(8):475-481）がガイドラインの推奨事項を引用する形で確認でき、カードの記述（原則として断酒、重症例などで断酒に応じない場合に脱落を避けるため飲酒量低減を提案する）と一致するが、同誌は学会誌で CC 表示がなく自由な出典にはならないため候補に数えない。候補のライセンスは Crossref の版データ（CC BY 4.0）と PMC 全文のライセンス表示（CC BY 4.0）で個別確認した'
  uncertainty: 推奨文は、精神神経学雑誌の特集論文でガイドライン本文が引用されている形で確認した。薬剤の国内承認：アカンプロサートは2013年に承認（アルコール依存症患者における断酒維持の補助）、ナルメフェンは2019年に承認（飲酒量の低減。本ガイドライン刊行後の承認）、ジスルフィラムとシアナミドは抗酒薬として承認済み（個別の添付文書の文言は未照合）。ナルトレキソンの国内承認は確認できなかった。急性中毒の身体管理は第55回以降（ⅩⅢ）が正で本カードの範囲外。
