- id: SB-006
  domain: SB
  subdomain: ギャンブル障害<ギャンブル依存>、ゲーム依存
  assertion:
    plain_statement_ja: ギャンブル障害は、著しい苦痛や機能障害を伴う持続的・反復的なギャンブル行動のパターンを特徴とし、米国の成人における有病率は0.5%と推定されている。他の精神疾患、とりわけ他の嗜癖性障害と併存することが多く、臨床の場でも見逃されやすい。治療では認知行動療法、動機づけ面接、Gamblers Anonymousなどの行動的介入にエビデンスの裏づけがあり、ギャンブル障害そのものを適応とする承認された薬物療法はない。
    condition:
      region: 国際
      対象: 成人
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3620
    source: Potenza MN, Balodis IM, Derevensky J, et al. Gambling disorder. Nat Rev Dis Primers. 2019;5(1):51
    doi: 10.1038/s41572-019-0099-7
    pmid: '31346179'
    pmcid: null
    url: https://doi.org/10.1038/s41572-019-0099-7
    source_license: CC 表示なし（購読誌）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN／OPEN、作り手の調査バッチ95 2026-11-15）：Sharma R, Weinstein A. Gambling disorder comorbidity: a narrative review. Dialogues Clin Neurosci. 2025;27(1):1-18／Bissig L, Mutschler J. Off-label and investigational drugs in the treatment of gambling disorder: a critical review. Front Pharmacol. 2026;17:1806954（PMID: 40177908／42147309、DOI: 10.1080/19585969.2025.2484288／10.3389/fphar.2026.1806954、PMCID: PMC11980244／PMC13176223、https://creativecommons.org/licenses/by/4.0/）。裏づける部分：部分：候補1（併存症の総説、CC BY）は、行動的介入として認知行動療法・動機づけ面接・Gamblers Anonymous を並べて挙げ、「ギャンブル障害を正式な適応とする薬物療法はない」と明記し、物質使用障害・アルコール使用障害をはじめとする他の精神疾患との併存の多さを主題として再掲する。候補2（薬物療法の総説、CC BY）は、「公式に承認された薬物療法はまだない」こと、ガイドラインが認知行動療法と動機づけ面接を最良の実践・第一選択として推奨すること、併存する精神疾患への並行治療の必要性を再掲する。米国の成人における有病率0.5%という推定値と、「臨床の場でも見逃されやすい」という位置づけそのものは、自由な全文では再掲されない。数値の照合：一致する数値なし：カードの有病率0.5%（米国の成人の推定）は候補のいずれにも再掲がない。候補側には他国・他集団の有病率や範囲表示があるが、対象が異なるためカードの値の裏づけとして登録しないこと。留保：主出典（SRC-3620）の刊行版は Springer Nature の TDM ライセンスのみで CC 表示はなく（Crossref の版データ・Europe PMC の個別レコードとも非 OA）、現行 RESTRICTED が正しい。識別子補完候補あり（SRC-3620 の PMID。カード側には記録済みでマスターは null）。候補のライセンスはいずれも Crossref の版データ（CC BY 4.0）と PMC 全文のライセンス表示（CC BY 4.0）で個別確認した'
  uncertainty: 有病率0.5%は米国の成人の推定で、出典の総説の抄録に基づく。国内の有病率と対策の枠組み（ギャンブル等依存症対策基本法など）は本カードでは扱っていない。ゲーム障害はICD-11でギャンブル障害と同じ嗜癖性障害の群に位置づけられるが、本カードの出典はギャンブル障害の総説であり、ゲーム障害の扱いは申し送りに残した。
