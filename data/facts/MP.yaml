  subdomain: 転移性腫瘍
  assertion:
    plain_statement_ja: 心臓転移は原発性心腫瘍の20〜40倍多いとされ、多くは無症状で剖検時に発見される。症状が現れる場合は、心膜転移による心嚢液貯留・心タンポナーデや、心筋転移による不整脈・心不全の形をとる。
