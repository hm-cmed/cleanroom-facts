- id: MP-025
  domain: MP
  subdomain: 心タンポナーデ
  assertion:
    plain_statement_ja: 心膜液の量・分布・循環への影響はまず心エコーで評価する。心タンポナーデでは、心エコーか透視で誘導した緊急の心膜穿刺、または外科的ドレナージ（化膿性心膜炎や出血の場合）を行う。内科治療に反応しない症状のある中等量〜大量の心膜液や、細菌性・腫瘍性が疑われる心膜液も心膜穿刺の対象となる。
