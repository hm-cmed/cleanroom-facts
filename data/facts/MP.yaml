- id: MP-032
  domain: MP
  subdomain: 粘液腫
  assertion:
    plain_statement_ja: Carney 複合は、心臓・皮膚などの粘液腫、口唇や眼の周囲などの色素斑（黒子）、内分泌腫瘍（約25%に原発性色素性結節性副腎皮質病変による Cushing 症候群など）を特徴とする常染色体優性遺伝の疾患で、多くは PRKAR1A 遺伝子の変異による。心臓粘液腫は血流を妨げて突然死の原因となることがあり、切除後も再発しやすい。約30%は新生変異による。
