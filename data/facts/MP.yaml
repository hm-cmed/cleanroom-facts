- id: MP-034
  domain: MP
  subdomain: 虚血性心筋症
  assertion:
    plain_statement_ja: 左室駆出率35%以下で外科治療に適した冠動脈疾患をもつ患者では、CABG に薬物療法を併用する群は薬物療法単独群に比べ、5年時点の心血管死と心血管入院が少なかったが、全死亡には有意差がなかった（STICH試験）。
