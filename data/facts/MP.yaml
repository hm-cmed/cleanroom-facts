- id: MP-023
  domain: MP
  subdomain: 急性心膜炎
  assertion:
    plain_statement_ja: 急性心膜炎は、心膜炎に特徴的な胸痛、心膜摩擦音、広範な ST 上昇または PR 低下、心膜液貯留の4つのうち2つ以上で診断する。CRP・赤沈・白血球などの炎症所見や、CT・MRI での心膜の炎症所見が診断を支持する。
