- id: MP-033
  domain: MP
  subdomain: 虚血性心筋症
  assertion:
    plain_statement_ja: 虚血性心筋症は、慢性の冠動脈疾患（多くは心筋梗塞の既往）による心筋障害を背景に左室拡大と収縮機能低下を来した状態であり、特発性拡張型心筋症との鑑別には冠動脈造影などによる冠動脈疾患の確認が要る。
    condition:
      region: 日本
      対象: 成人
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-4383
    source: 日本循環器学会・日本心不全学会. 心筋症診療ガイドライン（2018年改訂版）英語版. Circ J. 2021;85(9):1590-1689
    doi: 10.1253/circj.CJ-20-0910
    pmid: null
    pmcid: null
    url: https://doi.org/10.1253/circj.CJ-20-0910
    source_license: 未確認
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 「虚血性心筋症」の定義は文献により範囲が異なり、本カードは日本の心筋症診療ガイドライン（2018年改訂版）の定義に寄せた。出典の PMID は確認できなかったため null とした。
