- id: MP-029
  domain: MP
  subdomain: 心臓震盪
  assertion:
    plain_statement_ja: 心臓震盪は、前胸部への鈍的な打撃で心室細動（または心室頻拍）が起こる病態である。動物実験では、T波の上行脚の約15ミリ秒（心周期の約1%）の間に衝撃が加わったときだけ心室細動が起きた。米国の登録（2012年7月までに216例）では95%が男性、平均年齢15歳で、野球が51%を占め、多くはボールなどの硬い投射物によるものだった。
    condition:
      region: 米国（登録研究）
    differential: null
