- id: TR-010
  domain: TR
  subdomain: 眼外傷
  assertion:
    plain_statement_ja: 鈍的眼外傷を含む機械的眼外傷の分類と予後評価には、標準化された用語体系である Birmingham Eye Trauma Terminology（BETT）に基づく分類と、米国およびハンガリーの眼外傷レジストリに登録された多数の症例から開発された Ocular Trauma Score（OTS）が用いられる。OTS は受傷時の所見をもとに、重症眼外傷の機能的転帰（視力予後）を一定の確からしさで予測するための体系であり、開放性（鋭的）外傷と閉鎖性（鈍的）外傷の双方に適用される。
    condition:
      region: 米国・ハンガリー
      study: レジストリに基づく予後予測システムの開発
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1478
    source: Kuhn F, Maisiak R, Mann L, Mester V, Morris R, Witherspoon CD. The Ocular Trauma Score (OTS). Ophthalmology Clinics of North America. 2002;15(2):163-165.
    doi: 10.1016/s0896-1549(02)00007-x
    pmid: '12229231'
    pmcid: null
    url: https://doi.org/10.1016/s0896-1549(02)00007-x
    source_license: ライセンス表示を確認できず
    legal_basis: B
