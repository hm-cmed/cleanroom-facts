- id: TR-002
  domain: TR
  subdomain: 熱傷
  assertion:
    plain_statement_ja: 広範囲熱傷の初期には、熱傷ショックに対する輸液蘇生が救命的であるが、過剰な輸液は全身の浮腫形成を助長し、かえって罹患率と死亡率を高めうる（輸液の過剰投与による弊害）。近年の研究では、内皮グリコカリックスの障害（熱傷性内皮障害）が浮腫形成の重要な機序とされ、晶質液に加えてアルブミンや血漿、高用量アスコルビン酸を用いる方法や、新しいモニタリングと蘇生の評価指標が検討されてきたが、いずれの方法も転帰を明確に改善する証明は得られていない。初期輸液は必要量を見積もりつつ、反応をみて過剰にならないよう調整することが重要である。
    condition:
      region: 海外
      study: 総説
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1455
    source: 'Cartotto R, Burmeister DM, Kubasiak JC. Burn Shock and Resuscitation: Review and State of the Science. Journal of Burn Care & Research. 2022;43(3):567-585.'
    doi: 10.1093/jbcr/irac025
    pmid: '35218662'
    pmcid: null
    url: https://doi.org/10.1093/jbcr/irac025
    source_license: ライセンス表示を確認できず
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 米国の熱傷学会の最新知見をまとめた総説に基づく。輸液量の具体的な計算式（体重と受傷面積を用いる方法）の数値は出典の抄録の範囲外のため含めていない。アルブミン製剤等の国内承認・保険適用は未確認。受傷直後の冷却などの応急処置は出典の対象外。
  curriculum:
    core_curriculum: 'PS-02-16-05 (id: JkxnuTo)'
