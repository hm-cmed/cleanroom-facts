- id: TR-018
  domain: TR
  subdomain: 頭頸部外傷
  assertion:
    plain_statement_ja: 前頭洞骨折の系統的レビューとメタ解析（24論文、2,388例）では、受傷原因の50.7%が交通事故であり、61.8%に頭蓋内損傷の合併があった。鼻前頭流出路に損傷があっても閉塞がなければ、転位例では前壁の再建、転位のない例では保存的管理が可能とされる。流出路の閉塞がある場合は、洞の閉塞術や頭蓋化を検討する。経過観察では6か月時点の CT で洞の再含気化を評価し、内視鏡下副鼻腔手術が再含気化のための救済手段になりうる。
    condition:
      region: 国際
      study: 系統的レビュー・メタ解析（24論文、2,388例）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1465
    source: 'Johnson NR, Roberts MJ. Frontal sinus fracture management: a systematic review and meta-analysis. Int J Oral Maxillofac Surg. 2021;50(1):75-82.'
    doi: 10.1016/j.ijom.2020.06.004
    pmid: '32861554'
    pmcid: null
    url: https://doi.org/10.1016/j.ijom.2020.06.004
    source_license: ライセンス表示を確認できず
    legal_basis: B
    source_class: RESTRICTED
    corroboration: 自由に使える資料による裏づけ（OPEN、作り手の調査バッチ54 2026-11-13）：Hsieh TY, Timbang MR, Strong EB. Current Concepts in Frontal Sinus Fracture Management. Craniomaxillofacial Trauma & Reconstruction. 2026;19(2):21（CC BY、PMID 42029432、DOI 10.3390/cmtr19020021、PMC13108220、新規 SRC 候補）。裏づける部分：前頭洞骨折の管理は前壁・後壁と鼻前頭流出路の状態で決まり、流出路に損傷があっても閉塞がなければ転位例では前壁の再建、転位のない例では保存的管理が可能であること、流出路の閉塞がある場合は洞の閉塞術や頭蓋化を検討すること、経過観察では CT で洞の再含気化を評価し、内視鏡下副鼻腔手術が再含気化のための手段になりうることが本文に示される。数値の照合：カードのメタ解析の割合（受傷原因の50.7%が交通事故、61.8%に頭蓋内損傷の合併）は候補に再掲がない。経過観察の CT の時点は候補では約6週と12か月であり、カードの「6か月時点」とは枠組みが異なる（フラグ3）。留保：裏づけは管理の枠組みにとどまる
