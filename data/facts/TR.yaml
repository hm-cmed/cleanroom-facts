- id: TR-003
  domain: TR
  subdomain: 物理的損傷
  assertion:
    plain_statement_ja: 凍傷の治療では、再凍結を避けることが前提であり、37〜39℃に保った温水で、患部が柔らかくしなやかになるまで（およそ30分）急速に再加温する。患部をこすってはならず、自然乾燥させ、清潔な水疱は吸引除去し、血疱は温存する。イブプロフェン（12 mg/kg/日を1日2回に分けて投与）が用いられ、破傷風予防も行う。深い凍傷では、解凍後24時間以内の血栓溶解療法や、受傷後48時間以内のイロプロスト投与が検討され、血管造影やテクネチウム99m骨シンチグラフィなどの画像評価が切断範囲の決定を助ける。凍瘡（しもやけ）とは異なり、凍傷は組織の凍結による損傷である。
    condition:
      region: 米国
      study: 診療ガイドライン（Wilderness Medical Society、2024年改訂版）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1456
    source: 'McIntosh SE, Freer L, Grissom CK, Rodway GW, et al. Wilderness Medical Society Clinical Practice Guidelines for the Prevention and Treatment of Frostbite: 2024 Update. Wilderness & Environmental Medicine. 2024;35(2):183-197.'
    doi: 10.1177/10806032231222359
    pmid: '38577729'
    pmcid: null
    url: https://doi.org/10.1177/10806032231222359
    source_license: ライセンス表示を確認できず（学会ガイドライン、CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ54 2026-11-13）：Handford C, Buxton P, Russell K, Imray CE, McIntosh SE, Freer L, Cochran A, Imray CH. Frostbite: a practical approach to hospital management. Extreme Physiology & Medicine. 2014;3:7（CC BY、PMID 24764516、DOI 10.1186/2046-7648-3-7、PMC3994495、新規 SRC 候補）。裏づける部分：Wilderness Medical Society と米国アラスカ州の寒冷障害ガイドラインに基づく推奨として、37〜39℃の温水での急速な再加温（15〜30分）、再凍結の回避、患部をこすらないこと、イブプロフェン 12 mg/kg/日を1日2回に分けて投与すること、透明・混濁した水疱は吸引除去し出血性の水疱は温存すること、破傷風予防の確認、血栓溶解療法の適応判断（再加温後も血流がなく冷曝露から24時間以内など）、血管造影とテクネチウム99m三相骨シンチグラフィが予後判定と治療方針の決定に有用であることが本文に明記される。数値の照合：温水の温度 37〜39℃とイブプロフェンの用量 12 mg/kg/日（2回分割）はカードと一致する。再加温の時間は候補では15〜30分で、カードの「およそ30分」はその上限に当たる。留保：イロプロストの「受傷後48時間以内」という時点は候補に明示されず、候補は24時間の窓を超えてもイロプロストを使用しうる旨を述べる。この点は留保'
  uncertainty: 米国のガイドラインの公式要約で推奨内容を確認した。血栓溶解薬およびイロプロストの凍傷に対する国内承認・保険適用は未確認。凍瘡の皮膚疾患としての詳細は扱っていない。
