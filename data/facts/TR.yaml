- id: TR-021
  domain: TR
  subdomain: 頭頸部外傷
  assertion:
    plain_statement_ja: 喉頭・気管損傷はまれだが死亡率の高い損傷であり、鈍的外傷と穿通性外傷に分けられる。鈍的外傷では、頸部前面が硬い物体に打ち付けられる clothesline 型の損傷などが原因となる。救急での最優先は気道の確保であり、外科的気道確保を行う閾値を低くする。評価には軟性喉頭鏡や CT を用い、Schaefer 分類に基づく重症度と気道の状態に応じて、保存的管理か外科的治療かを選択する。回復後には声の安静や言語・嚥下のリハビリが必要になることがある。
