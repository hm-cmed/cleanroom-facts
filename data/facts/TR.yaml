    pmid: '32193796'
    pmcid: PMC7082488
    url: https://doi.org/10.1186/s13244-020-00847-w
    source_license: CC BY 4.0
    legal_basis: B
    source_class: OPEN
    corroboration: null
  uncertainty: Le Fort 分類は低速外傷が主体の時代に考案されたもので、現代では咬合を担う上顎の分節を重視する考え方に重心が移っている旨が同総説で指摘されている。
