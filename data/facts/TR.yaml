- id: TR-002
  domain: TR
  subdomain: 熱傷
  assertion:
    plain_statement_ja: 広範囲熱傷の初期には、熱傷ショックに対する輸液蘇生が救命的であるが、過剰な輸液は全身の浮腫形成を助長し、かえって罹患率と死亡率を高めうる（輸液の過剰投与による弊害）。近年の研究では、内皮グリコカリックスの障害（熱傷性内皮障害）が浮腫形成の重要な機序とされ、晶質液に加えてアルブミンや血漿、高用量アスコルビン酸を用いる方法や、新しいモニタリングと蘇生の評価指標が検討されてきたが、いずれの方法も転帰を明確に改善する証明は得られていない。初期輸液は必要量を見積もりつつ、反応をみて過剰にならないよう調整することが重要である。
    condition:
      region: 海外
      study: 総説
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1455
    source: 'Cartotto R, Burmeister DM, Kubasiak JC. Burn Shock and Resuscitation: Review and State of the Science. Journal of Burn Care & Research. 2022;43(3):567-585.'
    doi: 10.1093/jbcr/irac025
    pmid: '35218662'
    pmcid: null
    url: https://doi.org/10.1093/jbcr/irac025
    source_license: ライセンス表示を確認できず
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ54 2026-11-13）：Arlati S, Aseni P. From Evaporation to Edema: A Scoping Review of Physical and Biological Determinants of Early Fluid Distribution in Major Burns. European Burn Journal. 2026;7(2):21（補助：Yao Y, Hua T, Li Y, Zhang M, Liu W. Fluid management methods for severely burned patients: a narrative review. Journal of Clinical Monitoring and Computing. 2026;40(2):417-427、PMC13053450）（CC BY、PMID 42029575、DOI 10.3390/ebj7020021、PMC13108070、新規 SRC 候補）。裏づける部分：過剰な蘇生は著明な浮腫・腹部コンパートメント症候群・人工呼吸の長期化を招き（fluid creep の概念と、その早期検出指標の検討を含む）、不足と過剰の間の治療域が狭いこと、アルブミンは晶質液で不足する場合のレスキューとして位置づけられること、高用量アスコルビン酸などの補助療法はエビデンスが乏しいことがガイドライン引用の形で明記される。補助候補は尿量をはじめとする従来のモニタリング指標の限界と新しい評価指標の検討を主題とする。数値の照合：数値なし（定性的な主張）。留保：内皮グリコカリックスという語は候補に明示されず、毛細血管透過性・漏出の機序記述にとどまる。血漿は新鮮凍結血漿レスキューの研究引用のレベル'
  uncertainty: 米国の熱傷学会の最新知見をまとめた総説に基づく。輸液量の具体的な計算式（体重と受傷面積を用いる方法）の数値は出典の抄録の範囲外のため含めていない。アルブミン製剤等の国内承認・保険適用は未確認。受傷直後の冷却などの応急処置は出典の対象外。　【承認状況の再点検 2026-10-31（作り手、PMDA・厚生労働省などの公的情報）】アルブミン製剤は承認・保険適用のある血液製剤であり、「未確認」は解消できる
