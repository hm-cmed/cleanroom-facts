- id: TR-024
  domain: TR
  subdomain: 先天異常
  assertion:
    plain_statement_ja: 先天性外耳道閉鎖症は外耳道の形成不全の程度がさまざまで、耳介や中耳の奇形を伴うことがある。外耳道を新しく作る手術は、聴力の改善が骨導デバイスによる補聴を上回らず、術後の外耳道狭窄などの合併症も起こりうるため、第一選択の治療とはならないことが多い。手術を検討する場合は術前評価が重要で、術後狭窄を防ぐ工夫が必要である。
