- id: TR-004
  domain: TR
  subdomain: 物理的損傷
  assertion:
    plain_statement_ja: 成人の電撃傷について、41件の単施設報告（計5,485例）を統合したレビューでは、低電圧損傷が44%、高電圧損傷が38.3%を占めた。外科的・内科的・心的外傷後などの合併症はいずれも高電圧損傷で多く、死亡率は低電圧損傷で2.6%、高電圧損傷で5.2%であった。一方、検死例の報告では低電圧による死亡が高電圧の2.4倍であり、低電圧損傷でも受傷直後の死亡が過小評価されている可能性がある。電圧の高低だけで重症度を判断できないことが示されている。
    condition:
      region: 海外
      study: 系統的レビュー（41件、5,485例）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1457
    source: 'Shih JG, Shahrokhi S, Jeschke MG. Review of Adult Electrical Burn Injury Outcomes Worldwide: An Analysis of Low-Voltage vs High-Voltage Electrical Injury. Journal of Burn Care & Research. 2017;38(1):e293-e298.'
    doi: 10.1097/BCR.0000000000000373
    pmid: '27359191'
    pmcid: PMC5179293
    url: https://doi.org/10.1097/BCR.0000000000000373
    source_license: ライセンス表示を確認できず
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 電圧が記載されていない研究が多く、電圧別に転帰を解析していない研究が44%を占める。長期の心理的転帰やリハビリテーションの転帰を報告した研究は乏しい。小児は出典の対象外。
  curriculum:
    core_curriculum: 'PS-02-16-05 (id: JkxnuTo)'
    kokushi: 医学各論 Ⅲ-11-A-③（電撃傷、a）
