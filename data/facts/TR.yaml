- id: TR-001
  domain: TR
  subdomain: 熱傷
  assertion:
    plain_statement_ja: 熱傷の重症度と死亡リスクは、受傷面積、深度、年齢などによって評価される。日本では1980年代から Burn Index（BI）と Prognostic Burn Index（PBI）が用いられており、BI は全層（III度）熱傷面積（%）に部分層（II度）熱傷面積の半分を加えた値、PBI は BI に年齢を加えた値である。BI が10を超える場合、または PBI が100を超える場合に重症と分類される。世界では ABSI や Baux スコア、Belgian Outcome in Burn Injury（BOBI）スコアなども使われており、寿命と健康寿命が延びた現在の高齢者では、PBI が死亡リスクを過大評価する可能性が指摘されている。
    condition:
      region: 日本
      study: 総説
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1454
    source: Hosio M, Shimizu A, Mizuno H. Comparison of Burn Severity and Mortality Evaluation Tools in Older Patients. Journal of Plastic and Reconstructive Surgery. 2026;5(4):337-343.
    doi: 10.53045/jprs.2025-0022
    pmid: '42548986'
    pmcid: PMC13430245
    url: https://doi.org/10.53045/jprs.2025-0022
    source_license: CC BY-NC-ND 4.0
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ54 2026-11-13）：Endo A, Shiraishi A, Otomo Y, Fushimi K, Murata K. Volume-outcome relationship on survival and cost benefits in severe burn injury: a retrospective analysis of a nationwide registry in Japan. Journal of Intensive Care. 2019;7:7（補助：Prognostic Scoring Systems for Burns: A Comparative Analysis of Their Predictive Accuracies for Mortality in Burn Patients. 2026、PMC13024829）（CC BY、PMID 30733868、DOI 10.1186/s40560-019-0363-7、PMC6354429、新規 SRC 候補）。裏づける部分：日本の全国レジストリ研究で、重症熱傷を Burn Index（BI）10以上と定義して BI を用い、Prognostic Burn Index（PBI）は年齢と BI から算出される重症度指標としてアジアで広く用いられる旨が明記される。補助候補は ABSI・Baux スコア・BOBI を確立した熱傷死亡予測スコアとして扱う。数値の照合：BI 10以上という重症の定義は、カードの「BI が10を超える場合に重症」とほぼ一致する（以上と超の差はある）。BI の算出式（全層面積＋部分層面積の半分）、PBI 100超の閾値、高齢者で PBI が死亡リスクを過大評価しうる点は、候補のいずれにも再掲がなかった。留保：定義と閾値の逐条の裏づけではなく、枠組みと BI の閾値の裏づけにとどまる'
  uncertainty: 高齢者を中心に各指標を比較した総説の本文で定義と分類の閾値を確認した。気道熱傷の有無など、指標に含まれない因子の扱いは出典の本文範囲に限られる。
