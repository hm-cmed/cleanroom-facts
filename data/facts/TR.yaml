- id: TR-011
  domain: TR
  subdomain: 眼外傷
  assertion:
    plain_statement_ja: 鋭的眼外傷（開放性眼外傷）について、リトアニアの大学病院を受診した160例161眼を後方視的に検討した研究では、男女比は8.4対1で、受傷場所は家庭が59.6%と最も多く、次いで屋外14.3%、職場11.8%であった。損傷の種類は穿孔（貫通）損傷が43.5%、眼内異物が39.1%、眼球破裂が13%であった。最終的な矯正視力が0.5以上に回復したのは19.5%にとどまり、48.1%は0.02以下の重度の視力障害を残した。不良な視力転帰は、初診時の視力不良、虹彩離断、低眼圧、硝子体出血、硝子体脱出と関連していた。
    condition:
      region: リトアニア
      study: 後方視的研究（160例、161眼）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1479
    source: Puodžiuvienė E, Valeišaitė G, Žemaitienė R. Clinical Characteristics, Visual Outcomes, and Prognostic Factors of Open Globe Injuries. Medicina (Kaunas). 2021;57(11):1198.
    doi: 10.3390/medicina57111198
    pmid: '34833416'
    pmcid: PMC8618771
    url: https://doi.org/10.3390/medicina57111198
    source_license: CC BY 4.0
    legal_basis: B
    source_class: OPEN
    corroboration: null
  uncertainty: 単施設の後方視的検討であり、日本の受傷状況とは異なる可能性がある。手術手技や手術時期の詳細は出典の範囲外。（本出典は割り当て枠超過分の仮番号 SRC-1479 を使用）
