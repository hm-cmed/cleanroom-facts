- id: TR-029
  domain: TR
  subdomain: 凍傷・凍瘡
  assertion:
    plain_statement_ja: 凍傷は組織の凍結による損傷であり、重症度は伝統的に4段階に分類される。1度はしびれと発赤を生じ、白または黄色の硬くわずかに隆起した局面ができ、組織の死は生じない。2度は透明または乳白色の液体を含む表在性の水疱で、発赤と炎症を伴う。3度は血疱（出血性の水疱）で、損傷が真皮の深層まで及んだことを示す。4度は皮膚の全層を超えて脂肪、筋、腱、骨などの深部組織に及ぶ。現場での分類としては、再加温の後、画像評価の前に、組織喪失が皆無か最小限にとどまる「表在性」（1〜2度に相当）と、組織喪失が見込まれる「深部」（3〜4度に相当）の2つに分ける方法が推奨される。なお、凍結を伴わない表在性の寒冷損傷である frostnip は凍傷とは区別される。
    condition:
      region: 米国
      対象: 凍傷（診療ガイドライン2024年改訂版）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1456
    source: 'McIntosh SE, Freer L, Grissom CK, Rodway GW, et al. Wilderness Medical Society Clinical Practice Guidelines for the Prevention and Treatment of Frostbite: 2024 Update. Wilderness & Environmental Medicine. 2024;35(2):183-197.'
    doi: 10.1177/10806032231222359
    pmid: '38577729'
    pmcid: null
    url: https://doi.org/10.1177/10806032231222359
    source_license: ライセンス表示を確認できず（学会ガイドライン、CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ54 2026-11-13）：Nygaard RM, Colonna E, Poole A, Faucher LD, Paine RE, Sangji N, Lacey A, Bhavsar D, Colling K, Armour A, Fleming I, Wiktor A, Wibbenmeyer L; FROST multicenter study team. Synthesis of Protocols for Frostbite Care From the FROST Study Sites. Journal of Burn Care & Research. 2026;47(5):1405-1425（補助：Handford C, et al. Frostbite: a practical approach to hospital management. Extreme Physiology & Medicine. 2014;3:7、PMC3994495）（CC BY、PMID 42384943、DOI 10.1093/jbcr/irag111、PMC13551621、新規 SRC 候補）。裏づける部分：凍傷は損傷の深さに基づき 1度（frostnip）から4度に分類されること、より単純には再加温後の灌流欠損の有無によって表在性と深部（severe/deep）に分ける分類があること、出血性の水疱は深部損傷と関連し温存されることが本文に示される。数値の照合：数値なし。留保：各度の所見の逐条の定義（2度は透明または乳白色の液体を含む表在性の水疱、3度は血疱で真皮の深層まで、4度は皮膚の全層を超えて深部組織まで）は候補に再掲がない。現場向け2分類の定義も、カードは組織喪失の見込みの有無、候補は再加温後の灌流欠損の有無であり、完全には一致しない'
  uncertainty: 分類の記載は WMS ガイドライン2024年改訂版の公式要約で確認した（分類の読み取りに相当）。深さと予後の対応は、現場向け2分類の定義（組織喪失の見込みの有無）に基づく。凍瘡（しもやけ）そのものの臨床像は同ガイドラインの主対象ではなく、本カードでは扱っていない。薬剤名は含めていない（治療は TR-003 が担う）。
