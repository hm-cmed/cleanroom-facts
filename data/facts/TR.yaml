- id: TR-028
  domain: TR
  subdomain: 褥瘡
  assertion:
    plain_statement_ja: 褥瘡は予防可能な有害事象であり、ICU 患者における有病率は12〜33%と報告される。褥瘡予防の系統的レビューでは、体位変換、リスク評価、皮膚の観察、栄養状態の評価、体圧分散用具の使用、スタッフと患者への教育、多職種チームの関与などを組み合わせた多成分の予防プログラムが用いられ、評価対象となった研究の多くで褥瘡の発生率・有病率の有意な低下が報告された。
    condition:
      region: 国際
      study: 系統的レビュー
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1475
    source: 'Lin F, Wu Z, Song B, Coyer F, Chaboyer W. The effectiveness of multicomponent pressure injury prevention programs in adult intensive care patients: A systematic review. Int J Nurs Stud. 2020;102:103483.'
    doi: 10.1016/j.ijnurstu.2019.103483
    pmid: '31835122'
    pmcid: null
    url: https://doi.org/10.1016/j.ijnurstu.2019.103483
    source_license: ライセンス表示を確認できず
    legal_basis: B
