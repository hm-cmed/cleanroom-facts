    plain_statement_ja: 側頭骨骨折は交通事故などの高エネルギー外傷で生じることが多く、単独で起こることはまれである。初期評価では ATLS に沿った ABC の確保と意識レベル、頭蓋内損傷、頸椎損傷の確認を優先し、その後の評価には高分解能 CT と電気生理学的検査を用いる。問題となる合併症は髄液漏、顔面神経損傷、聴覚・平衡機能の障害であり、対応は即時、短期、長期、遅発性（脳瘤、真珠腫、遅発性髄膜炎など）の時期に分けて考える。
