- id: TR-007
  domain: TR
  subdomain: 眼損傷
  assertion:
    plain_statement_ja: 光線性眼障害の代表である紫外線性角膜炎（光線性角膜炎）は、紫外線曝露によって角膜に炎症が生じる病態で、雪面の反射による雪眼や、溶接作業に伴う眼炎として知られる。300 nmの紫外線は角膜の表層から深層までの3層すべてにアポトーシスを誘導し、その変化は曝露の約5時間後に生じることが示されている。地表に届く紫外線量は太陽高度が最も大きく影響し、季節、緯度、高度、地表の反射などによっても変わるため、高地や雪原、旅行先での急性曝露が問題となりやすい。予防には、直射日光の回避、紫外線を遮断する眼鏡やコンタクトレンズの使用、帽子の着用が挙げられる。
    condition:
      region: 海外
      study: 総説
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1460
    source: 'Izadi M, Jonaidi-Jafari N, Pourazizi M, Alemzadeh-Ansari MH. Photokeratitis induced by ultraviolet radiation in travelers: A major health problem. Journal of Postgraduate Medicine. 2018;64(1):40-46.'
    doi: 10.4103/jpgm.JPGM_52_17
    pmid: '29067921'
    pmcid: PMC5820813
    url: https://doi.org/10.4103/jpgm.JPGM_52_17
    source_license: CC BY-NC-SA（Europe PMCの表示）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 主に旅行者における紫外線性角膜炎を対象とした総説に基づく。赤外線、レーザー光、可視光による網膜障害など、紫外線以外の光線性眼障害は出典の範囲外。
  curriculum:
