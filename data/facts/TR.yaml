  domain: TR
  subdomain: 頭頸部外傷
  assertion:
    plain_statement_ja: 外傷性視神経障害は頭部外傷患者の最大で8%にみられ、より感度の高い検査では中等度から重度の頭部外傷患者の少なくとも半数に視野欠損や視神経萎縮が認められる。治療の系統的レビューでは、静注メチルプレドニゾロンなどの薬物療法にも視神経管減圧術にも有益性を示す証拠はなく、大用量ステロイドについては死亡率の増加を示す強い証拠がある。したがって慣例的な大量ステロイド投与は行うべきでない。眼窩コンパートメント症候群による急性の視神経圧迫は別の病態であり、緊急の対応を要する。
