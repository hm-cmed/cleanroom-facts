- id: TR-006
  domain: TR
  subdomain: 眼損傷
  assertion:
    plain_statement_ja: 角膜・結膜の化学損傷（眼化学外傷）は重症度に幅があり、重症例では視機能に重大な影響が残る。損傷のグレーディングは急性期治療の選択と視力予後の判断に重要であり、受傷直後の洗浄を含む初期対応が不十分だと、急性期の治療が難しくなり、慢性期の病態も治療抵抗性となる。保護眼鏡の着用による予防と、受傷直後の即時洗浄が公衆衛生上の要点であり、角膜輪部幹細胞不全や視力を制限する角膜瘢痕を残す例では、三次医療機関への紹介を考慮する。
    condition:
      region: 海外
      study: 総説
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1459
    source: Bizrah M, Yusuf A, Ahmad S. An update on chemical eye burns. Eye (London). 2019;33(9):1362-1377.
    doi: 10.1038/s41433-019-0456-5
    pmid: '31086244'
    pmcid: PMC7002428
    url: https://doi.org/10.1038/s41433-019-0456-5
    source_license: ライセンス表示を確認できず
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 洗浄に用いる液体の種類や洗浄時間などの具体的な手順は、出典の抄録で確認できた範囲を超えるため含めていない。
