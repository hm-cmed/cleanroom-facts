  assertion:
    plain_statement_ja: 韓国の救急外来を受診した12歳以下の小児の耳・鼻・咽頭を含む耳鼻咽喉科領域の異物1,285例を後方視的に検討した研究では、2〜5歳が52.2%と最も多く、部位は咽頭が59.2%と最多で、異物の種類は骨が最も多かった。実際に異物が確認されたのは全体の51.1%で、そのうち95.1%が耳鼻咽喉科医によって摘出された。年齢によって異物の種類と部位が異なるため、年齢を踏まえた評価が、外耳道・鼻腔を含む異物の診断と管理の助けになる。
