- id: TR-025
  domain: TR
  subdomain: 先天異常
  assertion:
    plain_statement_ja: 先天性感音難聴の原因の約80%は膜迷路の異常であり画像検査では正常に映る。残りの約20%は骨迷路の奇形で、側頭骨の高分解能 CT や MRI で描出できる。内耳奇形は蝸牛の形態に基づいて8つの群に分類され、治療は奇形の形態と蝸牛神経の状態に応じて、補聴器、人工内耳、聴性脳幹インプラントの中から選択する。人工内耳手術では、顔面神経の走行異常、髄液漏、電極の迷入といった合併症に備える必要がある。
