- id: TR-026
  domain: TR
  subdomain: 先天異常
  assertion:
    plain_statement_ja: 口唇口蓋裂は、遺伝因子と環境因子が関与する頻度の高い先天奇形である。出生後は哺乳と栄養の確保が課題となり、専用の哺乳器具が必要になることが多い。手術前には、口唇テーピングや鼻歯槽形成（nasoalveolar molding）によって裂の形態を整える早期介入が行われる。修復手術の術式は裂の広がりと術者の選択によって決まる。修復後も中耳疾患、鼻咽腔閉鎖不全、咬合異常のリスクが高いため、集学的チームによる長期のフォローアップが必要である。
