- id: TR-005
  domain: TR
  subdomain: 物理的損傷
  assertion:
    plain_statement_ja: 褥瘡（圧迫性損傷）の重症度評価には、米国の褥瘡諮問パネル（NPUAP、現NPIAP）によるステージングが用いられる。2016年の改訂では、名称を「圧迫性潰瘍」から「圧迫性損傷（pressure injury）」に改め、ステージはローマ数字ではなくアラビア数字で表記することとされた。定義は、損傷が通常は骨突出部に生じるほか、医療機器などによる圧迫でも生じることを含むよう改められ、ステージ2の定義では湿潤関連皮膚障害との区別が明確化され、深部組織損傷の診断名から「疑い（suspected）」が外された。各ステージの定義は、組織欠損の程度と解剖学的な所見の有無に基づいて記述される。
    condition:
      region: 米国
      study: コンセンサスに基づく分類体系の改訂
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1458
    source: 'Edsberg LE, Black JM, Goldberg M, McNichol L, Moore L, Sieggreen M. Revised National Pressure Ulcer Advisory Panel Pressure Injury Staging System: Revised Pressure Injury Staging System. Journal of Wound, Ostomy and Continence Nursing. 2016;43(6):585-597.'
    doi: 10.1097/WON.0000000000000281
    pmid: '27749790'
    pmcid: PMC5098472
    url: https://doi.org/10.1097/WON.0000000000000281
    source_license: CC BY-NC（Europe PMCの表示）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 米国の分類体系に基づく記載。日本のDESIGN-Rなど国内の評価・分類との対応は出典の範囲外。
  curriculum:
