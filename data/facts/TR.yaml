- id: TR-022
  domain: TR
  subdomain: 先天異常
  assertion:
    plain_statement_ja: 小耳症は耳介の低形成を指し、国際コンセンサスではすべての患者を集学的チームで診療することが推奨されている。重症度分類（Weerda/Aguilar）では、ほぼ正常だがやや小さいものを Grade I、痕跡的で変形があるが構成要素が判別できるものを Grade II、peanut 型の重度低形成を Grade III、無耳症を Grade IV とする。再建の選択肢は無治療、自家肋軟骨によるフレーム再建、多孔性ポリエチレン製インプラント、義耳であり、自家肋軟骨法では軟骨の発育を待つ必要があり、フレーム彫刻の要件を満たすには9歳以上が望ましいとされる。
    condition:
      region: 国際
      study: 国際コンセンサス勧告
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1469
    source: Zhang TY, Bulstrode N, Chang KW, et al. International Consensus Recommendations on Microtia, Aural Atresia and Functional Ear Reconstruction. J Int Adv Otol. 2019;15(2):204-208.
    doi: 10.5152/iao.2019.7383
    pmid: '31418720'
    pmcid: PMC6750779
    url: https://doi.org/10.5152/iao.2019.7383
    source_license: CC BY-NC 4.0
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ54 2026-11-13）：Núñez JAV, Ocampo-Godínez JM, Vàzquez-Vàzquez FC, Apellaniz-Campo A, Villegas EOL, Álvarez-Pérez MA. Innovative Approaches in Microtia Treatment: Advancements in Tissue Engineering and Scaffold Design. Annals of Biomedical Engineering. 2025;53(11):3031-3046（CC BY、PMID 40987946、DOI 10.1007/s10439-025-03851-7、PMC12575449、新規 SRC 候補）。裏づける部分：小耳症の重症度を4段階に分ける分類が表で提示され、Grade I はほぼ正常だがやや小さいもの、Grade II は構成要素の低形成や欠損を伴うもの、Grade III は軟骨の痕跡のみのもの、Grade IV は無耳症とされる。再建の選択肢として自家肋軟骨による再建、多孔性ポリエチレン製インプラント、義耳が本文で扱われる。数値の照合：数値なし。留保：候補はこの4段階を Marx 分類として提示しており、カードの Weerda/Aguilar という帰属とは異なる（フラグ1）。自家肋軟骨法で「9歳以上が望ましい」という時期の目安と、すべての患者を集学的チームで診療するという推奨の明示は候補にない'
  uncertainty: 分類と手術時期の記述は同コンセンサスの本文から読み取ったものである（本文から読み取り）。日本の診療体制における標準的な手術時期との一致は未確認。
