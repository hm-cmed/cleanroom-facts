- id: TR-023
  domain: TR
  subdomain: 先天異常
  assertion:
    plain_statement_ja: 先天性耳瘻孔は、感染を繰り返す場合などに瘻管全体の切除が治療となる。中国の単施設後方視的研究（576例、782耳）では、切除後の再発率は1.67%（13/782耳）で、再手術により全例が治癒した。感染期の手術は手術時間と抜糸までの期間が延長した。術中に拡大鏡（2.5倍の顕微鏡）を用いると再発率が有意に低かった一方、メチレンブルー染色の使用や茎部軟骨の部分切除の有無は再発率に影響しなかった。
    condition:
      region: 中国
      study: 後方視的観察研究（576例、782耳）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1470
    source: 'Li K, Hao Y, Zhao J, et al. Surgical treatment of preauricular fistulas: a 12-year single-center clinical observation. BMC Surg. 2023;23(1):297.'
    doi: 10.1186/s12893-023-02198-x
    pmid: '37775750'
    pmcid: PMC10543263
    url: https://doi.org/10.1186/s12893-023-02198-x
    source_license: CC BY 4.0
    legal_basis: B
    source_class: OPEN
    corroboration: null
  uncertainty: 数値は単一施設の後方視的データであり、施設や術者による差がありうる。
