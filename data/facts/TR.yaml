- id: TR-024
  domain: TR
  subdomain: 先天異常
  assertion:
    plain_statement_ja: 先天性外耳道閉鎖症は外耳道の形成不全の程度がさまざまで、耳介や中耳の奇形を伴うことがある。外耳道を新しく作る手術は、聴力の改善が骨導デバイスによる補聴を上回らず、術後の外耳道狭窄などの合併症も起こりうるため、第一選択の治療とはならないことが多い。手術を検討する場合は術前評価が重要で、術後狭窄を防ぐ工夫が必要である。
    condition:
      region: 韓国
      study: 総説
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1471
    source: Lee MY, Cho YS, Han GC, Oh JH. Current Treatments for Congenital Aural Atresia. J Audiol Otol. 2020;24(4):161-166.
    doi: 10.7874/jao.2020.00325
    pmid: '33070563'
    pmcid: PMC7575916
    url: https://doi.org/10.7874/jao.2020.00325
    source_license: CC BY-NC 4.0
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ54 2026-11-13）：Silva VARD, Pauna HF, Guimarães GC, Lavinsky J, Linder TE, Castilho AM. Application of an active middle ear implant in congenital middle ear malformations: A contemporary review. Brazilian Journal of Otorhinolaryngology. 2025;91(3):101562（CC BY、PMID 39914045、DOI 10.1016/j.bjorl.2025.101562、PMC11848470、新規 SRC 候補）。裏づける部分：外耳道形成術（atresiaplasty）は困難な手術で機能的な結果が不良なことが多く、再狭窄をはじめとする合併症の率が高いため、インプラント型の聴覚補綴が選択されるという位置づけが本文に明記される。術前評価には Jahrsdoerfer の評価尺度が用いられることも示される。数値の照合：数値なし。留保：「手術による聴力改善が骨導デバイスによる補聴を上回らない」という比較の直接の記述は候補になく、手術の成績不良と合併症の高さからの位置づけにとどまる'
