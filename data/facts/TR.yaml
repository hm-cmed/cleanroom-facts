    source_license: ライセンス表示を確認できず
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 骨折の分類（縦骨折・横骨折など）の頻度や、顔面神経麻痺・髄液漏の発生率などの数値は抄録で確認できなかったため含めていない。
