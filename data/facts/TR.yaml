- id: TR-008
  domain: TR
  subdomain: 異物
  assertion:
    plain_statement_ja: 小児における異物の誤嚥と誤飲は3歳未満に最も多くみられる。気道異物は常に生命を脅かす緊急事態であり、迅速な認識と治療を要する。誤飲した異物の多くは合併症なく消化管を自然に通過するが、途中で停滞すると穿孔などの問題を起こしうる。摘出は硬性または軟性の気管支鏡・胃内視鏡によって行われ、計画的な麻酔管理と、術者と麻酔科医の緊密な連携を要する手技であるため、必要な設備と訓練された人員を備えた施設で行うことが望ましい。そして何より、誤嚥・誤飲の予防が最良の治療である。
    condition:
      region: 海外
      study: 総説
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1476
    source: Karišik M. Foreign body aspiration and ingestion in children. Acta Clinica Croatica. 2023;62(Suppl 1):105-112.
    doi: 10.20471/acc.2023.62.s1.13
    pmid: '38746610'
    pmcid: PMC11090237
    url: https://doi.org/10.20471/acc.2023.62.s1.13
    source_license: CC BY-NC-ND（Europe PMCの表示）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ54 2026-11-13）：Fodor L, Ghiga G, Păduraru G, Gimiga N, Bozomitu L, Rotaru BD, Țarcă E, Roșu ST, Trandafir LM. Foreign Body Ingestion in Children: A Narrative Review of Time-Critical Risk Stratification and Contemporary Management. Children (Basel). 2026;13(8):1049（CC BY、PMID 42650386、DOI 10.3390/children13081049、PMC13510863、新規 SRC 候補）。裏づける部分：小児の異物誤飲は6か月から3歳に発生のピークがあり5歳未満に最も多いこと、誤飲した異物の約80〜90%は介入なく自然に通過し、食道や消化管に停滞すると穿孔などの合併症を起こしうること、摘出は鎮静と気道管理のもとで内視鏡により行われ集学的な対応を要すること、予防が管理の必須の要素であることが本文に明記される。数値の照合：自然通過の割合（約80〜90%）は、カードの「多くは合併症なく消化管を自然に通過する」と整合する（カードは割合を明示しない）。留保：候補は誤飲の総説であり、気道異物（誤嚥）が常に生命を脅かす緊急事態であることと、硬性または軟性の気管支鏡による摘出は対象外である'
  uncertainty: 小児を対象とした総説に基づく。ボタン電池、磁石、鋭利な異物など、特定の異物ごとの対応の詳細は出典の範囲外。成人の異物は対象外。（本出典は割り当て枠超過分の仮番号 SRC-1476 を使用）
