- id: TR-027
  domain: TR
  subdomain: 熱傷
  assertion:
    plain_statement_ja: 重症熱傷の初期輸液蘇生は、modified Brooke 法や Parkland 法などの予測式を用いて開始し、尿量をはじめとする指標を見ながら1時間ごとに輸液速度を調整する。過剰な輸液は合併症を増やすため避けるべきであり、プロトコルやフローシート、診療ガイドラインに沿った管理は、投与輸液量と合併症の減少に関連するとされる。
    condition:
      region: 米国
      study: 総説
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1474
    source: Cancio LC, Salinas J, Kramer GC. Protocolized Resuscitation of Burn Patients. Crit Care Clin. 2016;32(4):599-610.
    doi: 10.1016/j.ccc.2016.06.008
    pmid: '27600131'
    pmcid: null
    url: https://doi.org/10.1016/j.ccc.2016.06.008
    source_license: ライセンス表示を確認できず
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ54 2026-11-13）：Tang H, Yu S, Zhang R, Zhu Z, Gui L. Bridging the Evidence-Practice Gap in Early Burn Injury Care: A Comprehensive Evidence Synthesis of Global Guidelines. European Burn Journal. 2026;7(2):34（CC BY、PMID 42345981、DOI 10.3390/ebj7020034、PMC13298258、新規 SRC 候補）。裏づける部分：modified Brooke 法と Parkland 法が重症熱傷の初期輸液の国際的な標準の予測式として位置づけられること、輸液は尿量・血圧・心拍数などの生理学的指標に合わせて調整し、重症例では尿量の1時間ごとのモニタリングが推奨されること、過剰な輸液投与を減らすための臨床意思決定支援の使用が検討されることが、世界のガイドラインの統合として本文に示される。数値の照合：予測式の係数と尿量目標の数値はカード自体が含んでおらず、照合の対象外である。留保：「プロトコルやガイドラインに沿った管理が投与輸液量と合併症の減少に関連する」という関連そのものは、候補では標準化された管理の推奨として述べられるにとどまる'
