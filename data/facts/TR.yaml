- id: TR-022
  domain: TR
  subdomain: 先天異常
  assertion:
    plain_statement_ja: 小耳症は耳介の低形成を指し、国際コンセンサスではすべての患者を集学的チームで診療することが推奨されている。重症度分類（Weerda/Aguilar）では、ほぼ正常だがやや小さいものを Grade I、痕跡的で変形があるが構成要素が判別できるものを Grade II、peanut 型の重度低形成を Grade III、無耳症を Grade IV とする。再建の選択肢は無治療、自家肋軟骨によるフレーム再建、多孔性ポリエチレン製インプラント、義耳であり、自家肋軟骨法では軟骨の発育を待つ必要があり、フレーム彫刻の要件を満たすには9歳以上が望ましいとされる。
    condition:
      region: 国際
      study: 国際コンセンサス勧告
    differential: null
    common_misconception: null
  provenance:
