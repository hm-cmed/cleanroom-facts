- id: TR-016
  domain: TR
  subdomain: 頭頸部外傷
  assertion:
    plain_statement_ja: 顔面外傷の画像評価ではマルチスライス CT が第一選択であり、骨折型の分類が手術計画に直結する。Le Fort 骨折は翼突板と上顎後部の離開を本質とし、基本の3型とその組み合わせで分類される。頬骨上顎複合体骨折で転位があると外側眼窩壁の角度が開大して眼窩容積が増え、眼球陥凹を来すことがある。眼窩骨折では下直筋の嵌頓による複視の評価が重要である。
