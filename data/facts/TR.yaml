- id: TR-015
  domain: TR
  subdomain: 頭頸部外傷
  assertion:
    plain_statement_ja: 鼻骨骨折では、受傷直後の腫脹が評価を妨げるため、腫脹が引いた後の時期に整復の要否を判断する進め方がとられる。アイルランドの前向き研究（400例）では、受傷から整復までの間隔は平均6.1日で、受傷後5週までの整復でも満足度が得られたと報告された。一方、約11%の患者は後日、鼻中隔・鼻形成術を必要とした。
