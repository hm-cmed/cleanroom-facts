  assertion:
    plain_statement_ja: 耳介血腫は、接触スポーツ、事故、暴力などに際して、耳介が引っ張られたり鈍的外傷を受けたりすることで生じる。耳介血腫は、永続的な変形であるカリフラワー耳（いわゆるレスラー耳）を避けるために、迅速な外科的介入を必要とする。カリフラワー耳は結合組織と軟骨から構成される変形である。
