- id: TR-019
  domain: TR
  subdomain: 頭頸部外傷
  assertion:
    plain_statement_ja: 眼窩底骨折は、眼窩縁の骨折を伴わない単独型（pure）と、他の顔面骨折に合併する型（impure）に分けられる。下直筋や眼窩軟部組織の嵌頓は複視や眼心反射（悪心・嘔吐・不整脈）を起こし、牽引試験で評価する。小児の white-eyed blowout fracture では嵌頓した筋の虚血による恒久的障害を防ぐため、24時間以内の手術が緊急に必要とされる。2×2cm を超える骨欠損や壁の50%を超える欠損、2mm を超える眼球陥凹は手術修復の候補となる。
    condition:
      region: 韓国
      study: 総説
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1466
    source: Kim HS, Jeong EC. Orbital Floor Fracture. Arch Craniofac Surg. 2016;17(3):111-118.
    doi: 10.7181/acfs.2016.17.3.111
    pmid: '28913267'
    pmcid: PMC5556798
    url: https://doi.org/10.7181/acfs.2016.17.3.111
    source_license: CC BY-NC 3.0
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 欠損の大きさと眼球陥凹の数値は同総説の本文から読み取ったものである（本文から読み取り）。インプラント材料の選択は術者の経験に依存する部分が大きい。
