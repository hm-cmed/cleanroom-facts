- id: TR-012
  domain: TR
  subdomain: 耳外傷
  assertion:
    plain_statement_ja: 外傷性鼓膜穿孔は、介入の有無にかかわらず自然治癒する割合が高い。5件の研究（393穿孔）を統合したメタ解析では、治癒率はペーパーパッチ（紙片による被覆）を行った群で84.2〜95.2%、経過観察のみの群で76.7〜84.8%であり、プールしたリスク比は1.12（95%信頼区間1.04〜1.21）と、ペーパーパッチの治癒率が経過観察単独よりも高かった。
    condition:
      region: 海外
      study: メタ解析（5件、393穿孔）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1480
    source: 'Simani L, Oron Y, Handzel O, Eta RA, et al. Paper Patching Versus Watchful Waiting of Traumatic Tympanic Membrane Perforations: A Meta-Analysis. Laryngoscope. 2021;131(9):2091-2097.'
    doi: 10.1002/lary.29580
    pmid: '33881175'
    pmcid: null
    url: https://doi.org/10.1002/lary.29580
    source_license: ライセンス表示を確認できず
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 対象は急性の単独外傷性鼓膜穿孔に限られる。聴力の回復と治癒までの期間についての統合値は、出典の抄録には示されていない。（本出典は割り当て枠超過分の仮番号 SRC-1480 を使用）
