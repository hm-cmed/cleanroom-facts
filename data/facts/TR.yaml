    corroboration: 自由に使える資料による裏づけ（OPEN、作り手の調査バッチ54 2026-11-13）：McMahon J, McInnes E, Wan CS, Straiton N, Lam L, Rodgers J, Dickson J, Fulbrook P. Effectiveness of Organisational Strategies for Pressure Injury Prevention and Treatment in Acute Hospital Settings. Journal of Advanced Nursing. 2026;82(3):2004-2021（CC BY、PMID 40470684、DOI 10.1111/jan.17090、PMC12907601、新規 SRC 候補）。裏づける部分：集中治療室を含む急性期病院を対象とする系統的レビューで、多成分の組織的戦略が褥瘡の発生減少に有効でありうることが示され、主出典である Lin らの2020年のレビュー（ICU における多成分の予防プログラムの有効性）がその文脈で引用されている。数値の照合：カードの ICU 患者における有病率 12〜33% と「評価対象となった研究の多くで発生率・有病率の有意な低下」という集計のされ方は候補に再掲がない。候補が別途引用する有病率 12.8%（Li ら2020）は入院成人全体の値で母集団が異なる。留保：裏づけは方向性と枠組みにとどまる
