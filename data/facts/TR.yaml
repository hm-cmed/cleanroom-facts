    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ54 2026-11-13）：Allen NE, Crawford AZ, McGhee CNJ, Meyer JJ. Chemical eye injuries: a 10 year retrospective review of acute presentations and clinical outcomes in Auckland, New Zealand. Scientific Reports. 2024;14(1):8264（補助：First Aid Interventions for Intentional Caustic Chemical Assaults in Adults and Children: A Scoping Review. 2026、PMC13634369）（CC BY、PMID 38594410、DOI 10.1038/s41598-024-58670-y、PMC11004117、新規 SRC 候補）。裏づける部分：眼化学損傷は軽症から重症まで幅があり、現場での洗浄がなかった群では重症化と長期の視力障害が有意に多かった（p=0.0001）こと、重症例はいずれも保護眼鏡を着用しておらず予防と質の高い応急処置が最も重要であると結論で強調されること、角膜輪部幹細胞不全を残した例が三次医療機関で輪部幹細胞移植や角膜移植を要したことが本文に示される。補助候補は腐食性物質による損傷への即時の大量洗浄を応急処置の要点として支持する。数値の照合：数値の再掲ではなく、洗浄の有無と重症化の関連の有意性（p=0.0001）が示される。留保：重症度グレーディングは同研究では Dua 分類を用いており、グレーディングが治療選択と予後判断に重要という一般論の裏づけにとどまる。三次医療機関への紹介の推奨そのものの明示はない'
  uncertainty: 洗浄に用いる液体の種類や洗浄時間などの具体的な手順は、出典の抄録で確認できた範囲を超えるため含めていない。
