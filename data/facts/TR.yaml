- id: TR-018
  domain: TR
  subdomain: 頭頸部外傷
  assertion:
    plain_statement_ja: 前頭洞骨折の系統的レビューとメタ解析（24論文、2,388例）では、受傷原因の50.7%が交通事故であり、61.8%に頭蓋内損傷の合併があった。鼻前頭流出路に損傷があっても閉塞がなければ、転位例では前壁の再建、転位のない例では保存的管理が可能とされる。流出路の閉塞がある場合は、洞の閉塞術や頭蓋化を検討する。経過観察では6か月時点の CT で洞の再含気化を評価し、内視鏡下副鼻腔手術が再含気化のための救済手段になりうる。
    condition:
      region: 国際
      study: 系統的レビュー・メタ解析（24論文、2,388例）
    differential: null
    common_misconception: null
  provenance:
