    doi: 10.1136/thorax-2023-220304
    pmid: null
    pmcid: null
    url: https://thorax.bmj.com/content/78/11/1143
    source_license: © Author(s) (or their employer(s)) 2023. No commercial re-use（論文 PDF の表示）
