    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ78 2026-11-15）：Watson CJ, Simpson MD, Saraiya N, et al. N-Acetylcysteine Dose and Treatment Duration in High-Risk Acetaminophen Ingestions Treated Within Eight Hours: A Retrospective Cohort Study. J Med Toxicol. 2026;22(2):253-262（PMID: 41857443、DOI: 10.1007/s13181-026-01129-5、PMCID: PMC13076740、https://pmc.ncbi.nlm.nih.gov/articles/PMC13076740/）。裏づける部分：候補（CC BY の原著。刊行版ライセンス CC BY 4.0 を Crossref の版データと PMC ページの表示で確認）が、2023年の米国・カナダのコンセンサス声明が定義した「high-risk ingestion」の概念を同声明への帰属を明示して用い、Rumack-Matthew ノモグラムの濃度ライン（300・450・600 mcg/mL）に基づくアセチルシステインの用量層別と、濃度・AST の推移による投与延長の判断を述べており、カードの主張のうち新概念の導入とノモグラム運用の範囲と一致する。数値の照合：ノモグラムの濃度ライン（300・450・600 mcg/mL）は候補の用量層別として再掲あり。急性摂取の定義の見直しの具体的内容、改訂版ノモグラムそのもの、アセチルシステインの中止基準の文言、反復過剰摂取ではノモグラムは使えない点は、候補に再掲なし。留保：主出典 SRC-3981 の刊行版ライセンスは CC BY-NC-ND 4.0 と特定でき（Unpaywall と OpenAlex の双方で刊行版を確認）、現行 RESTRICTED が正しい。JAMA Network Open は CC BY と誤認しやすいが本声明は異なる（申し送り参照）。識別子補完候補あり'
  uncertainty: 米国・カナダの声明に基づく。国内ではアセチルシステイン内用液17.6%が「アセトアミノフェン過量摂取時の解毒」の効能で承認されており（2002年承認）、用法・用量は経口（困難な場合は胃管・十二指腸管）で、初回140 mg/kg、4時間後から70 mg/kgを4時間ごとに17回である（審査資料・添付文書で確認）。静注製剤のアセトアミノフェン解毒の適応は、開いた資料の範囲では確認できなかった（未確認）。国内添付文書にもノモグラムが収載されているが、その治療ラインが本声明の改訂版と同一かは突き合わせていない。
