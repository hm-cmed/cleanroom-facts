- id: TX-002
  domain: TX
  subdomain: 急性アルコール中毒
  assertion:
    plain_statement_ja: 急性アルコール中毒は、アルコール飲料の摂取により生体が精神的・身体的影響を受け、主として一過性に意識障害を生じるものと定義される。意識レベルの低下、嘔吐、呼吸状態の悪化など危険な状態に陥り、若年者・女性・高齢者でリスクが高く、大学生や新社会人では一気飲みにより死亡に至るケースが毎年発生している。周囲の対応としては、本人を1人にせず、衣服をゆるめ、体温低下を防ぐため暖かくし、吐物による窒息を防ぐため横向きに寝かせ、無理に吐かせないことが示され、大いびきをかいて痛覚刺激に反応しない、揺すって呼びかけても反応しない、体が冷たくなっている、呼吸状態が不安定などの兆候があれば、すぐに救急車を呼ぶとされる。
    condition:
      region: 日本
      対象: 急性アルコール中毒の傷病者とその周囲の人
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3972
    source: 厚生労働省. 急性アルコール中毒. e-ヘルスネット（生活習慣病などの情報）
    doi: null
    pmid: null
    pmcid: null
    url: https://kennet.mhlw.go.jp/information/information/alcohol/a-01-001.html
    source_license: 政府標準利用規約
    legal_basis: B
    source_class: GOV_JP
    corroboration: null
  uncertainty: 厚生労働省 e-ヘルスネットの一般向け解説に基づく。救急搬送者数の年次推移などの統計の数値は本カードでは扱っていない。
  curriculum:
