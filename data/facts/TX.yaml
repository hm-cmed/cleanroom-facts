- id: TX-004
  domain: TX
  subdomain: アルコール精神病
  assertion:
    plain_statement_ja: 離脱せん妄（振戦せん妄）はアルコール離脱の最重症型である。アルコール使用障害のある人の約半数が減量・中止時に何らかの離脱症状を呈し、その3〜5%が重症の離脱（せん妄）に進む。離脱せん妄は通常、最終飲酒の約3日後（約72時間）に始まり、1〜8日（典型的には2〜3日）続き、死亡率は最大で約4%とされる。治療は併存症と離脱症状の同定と治療が基本で、ベンゾジアゼピン、輸液、チアミン、総合ビタミンを用い、重症例は ICU で管理する。目標は興奮の制御、痙攣リスクの低減、傷害・死亡のリスクの低減である。
    condition:
      region: 国際
      対象: 離脱せん妄の患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3973
    source: Schuckit MA. Recognition and Management of Withdrawal Delirium (Delirium Tremens). N Engl J Med. 2014;371(22):2109-2113
    doi: 10.1056/NEJMra1407298
    pmid: '25427113'
    pmcid: null
    url: https://doi.org/10.1056/NEJMra1407298
    source_license: CC 表示なし（購読誌）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ78 2026-11-15）：Kaye AD, Staser AN, Mccollins TS, et al. Delirium Tremens: A Review of Clinical Studies. Cureus. 2024;16(4):e57601（PMID: 38707114、DOI: 10.7759/cureus.57601、PMCID: PMC11069634、https://pmc.ncbi.nlm.nih.gov/articles/PMC11069634/）。裏づける部分：候補（CC BY 総説）が、離脱せん妄は通常、最終飲酒の48〜72時間後に生じて約1〜8日続くこと、治療の中心はベンゾジアゼピンと支持療法でチアミンの早期補充が必須であること、重症例では ICU 管理を要しうることを述べ、カードの主張のうち発症・経過と治療の範囲と一致する。数値の照合：発症（48〜72時間）と持続（1〜8日）は候補と整合する（カードの発症は約72時間）。離脱症状を呈する割合（約半数）と重症の離脱に進む割合（3〜5%）は候補に再掲なし。死亡率は候補が「最大20%」（未治療の文脈）としており、カードの「最大で約4%」とは枠組みが異なるため、死亡率の裏づけには使わないこと（申し送り参照）。留保：主出典 SRC-3973 の区分は現行 RESTRICTED が正しい（N Engl J Med。Europe PMC の個別レコードで非 OA）。識別子補完候補あり'
  uncertainty: 発症までの時間には、資料により48〜96時間とする幅がある。アルコール幻覚症は意識清明のもとでの幻覚であり離脱せん妄と鑑別すべき状態だが、その診断と精神科的治療は Ⅱ（精神）の範囲に寄せ、本カードでは扱っていない。Wernicke 脳症そのものは第29回 ND で作成済みであり、ここでは離脱管理に伴うチアミン投与（予防）の範囲に留めた。ベンゾジアゼピン等の個別製剤の国内承認は添付文書で確認する前提である。
  curriculum:
    kokushi: 医学各論 ⅩⅢ-2-A-③（アルコール精神病、a）
    core_curriculum: 'PS-03-05-08 (id: Jkxnubw)；PS-02-17-05 (id: JkxnuT8)'
