  uncertainty: 添付文書の効能・効果、用法・用量、注意の記載に基づく。source_class は規制機関の公式情報提供として GOV_JP としたが、添付文書の class の最終判定は取り込み側に委ねる。点鼻製剤や一般向けの配布の仕組みは、国内では確認できていない。
