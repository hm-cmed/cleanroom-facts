- id: TX-003
  domain: TX
  subdomain: アルコール依存症
  assertion:
    plain_statement_ja: アルコール離脱の身体管理では、入院患者は症状の有無にかかわらず離脱のリスクを層別化し、重症化の予測指標（PAWSS など）を用いる。CIWA-Ar は診断のためではなく、治療反応のモニタリングに用いる。痙攣と離脱せん妄の発生を減らす実績からベンゾジアゼピンが第一選択であり、症状誘発式の投与は固定用量のスケジュールより総投与量と入院期間が短い。チアミンは Wernicke 脳症の予防のため投与し、栄養不良、重症・複雑性の離脱、ICU 管理の患者では非経口製剤が推奨される。
    condition:
      region: 米国
      対象: アルコール離脱の入院患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3616
    source: American Society of Addiction Medicine. The ASAM Clinical Practice Guideline on Alcohol Withdrawal Management. J Addict Med. 2020;14(3S Suppl 1):1-72
    doi: 10.1097/ADM.0000000000000668
    pmid: '32511109'
    pmcid: null
    url: https://doi.org/10.1097/ADM.0000000000000668
    source_license: CC 表示なし（購読誌）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ78 2026-11-15）：Kumar MS, Vaishnav M, Saha G, Raheja D. Management algorithm for alcohol withdrawal syndrome, alcohol dependence (AD) and AD with anxiety in the Indian population: a narrative review with expert opinion. Front Psychiatry. 2026;17:1758995（PMID: 41908117、DOI: 10.3389/fpsyt.2026.1758995、PMCID: PMC13021624、https://pmc.ncbi.nlm.nih.gov/articles/PMC13021624/）。裏づける部分：候補（CC BY の管理アルゴリズム総説）が、CIWA-Ar は離脱の重症度を定量化し治療方針を導く評価尺度であること、ベンゾジアゼピンが重症・複雑性の離脱の第一選択で固定用量・症状誘発式・前倒し投与の regimen があること、チアミンは欠乏・Wernicke 脳症では静注が推奨されることを述べ、カードの主張の骨格と一致する。数値の照合：数値なし（管理方針のカード）。入院患者全員のリスク層別化と PAWSS の使用、症状誘発式が固定用量より総投与量・入院期間が短いという比較、栄養不良・重症・ICU 患者での非経口チアミン推奨という具体化は、候補に再掲なし。留保：主出典 SRC-3616 の区分は現行 RESTRICTED が正しい（J Addict Med、Wolters Kluwer。Crossref にライセンス登録なし、Europe PMC の個別レコードで非 OA）。識別子補完候補あり'
  uncertainty: 米国のガイドライン（2020年版）に基づく。本出典は第51回 SB-002 で登録済みであり、本カードは離脱の身体管理の側面に限る（依存症の診断・精神科的治療の一般論は Ⅱ の範囲）。ベンゾジアゼピンは薬剤群としての記載であり、個別製剤の国内承認・適応は各製剤の添付文書で確認する前提である。
  curriculum:
    kokushi: 医学各論 ⅩⅢ-2-A-②（アルコール依存症、a）
