- id: TX-013
  domain: TX
  subdomain: 解熱鎮痛薬依存・中毒
  assertion:
    plain_statement_ja: サリチル酸中毒に対する体外治療について、EXTRIP ワークグループ（2015年）は、サリチル酸は血液透析・血液灌流で除去可能である（エビデンスレベルB）としたうえで、意識障害がある例、酸素投与を要する急性呼吸窮迫症候群の例、標準治療が奏効しない例では、血中濃度にかかわらず体外治療を推奨した。濃度の閾値は、7.2 mmol/L（100 mg/dL）を超える場合が強い推奨、6.5 mmol/L（90 mg/dL）を超える場合が弱い推奨であり、腎機能障害がある場合は閾値が下がる。望ましい様式は間欠的血液透析とされる。
    condition:
      region: 国際
      対象: サリチル酸中毒の患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3982
    source: 'Juurlink DN, et al.; EXTRIP Workgroup. Extracorporeal Treatment for Salicylate Poisoning: Systematic Review and Recommendations From the EXTRIP Workgroup. Ann Emerg Med. 2015;66(2):165-181'
    doi: 10.1016/j.annemergmed.2015.03.031
    pmid: '25986310'
    pmcid: null
    url: https://doi.org/10.1016/j.annemergmed.2015.03.031
    source_license: CC 表示なし（購読誌）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 推奨の根拠となった文献は84編で、その大半（80編）は症例報告・症例集積であり、推奨全体のエビデンスの質は非常に低いと出典自体が明記している。閾値の数値は出典の抄録と著者稿で確認した。サリチル酸中毒の臨床像と酸塩基管理の詳細は本カードでは扱っておらず、国内標準書（『新版 急性中毒標準診療ガイド』2023）との突き合わせが宿題として残る。
