- id: TX-010
  domain: TX
  subdomain: 向精神薬依存・中毒
  assertion:
    plain_statement_ja: 三環系抗うつ薬の過量服薬は、救急部門でよくみられる薬物中毒の一つである。毒性は、ノルアドレナリン再取り込み阻害、抗コリン作用、心筋へのキニジン様（膜安定化）作用などの薬理作用から生じ、重症像は昏睡、痙攣、呼吸抑制、低血圧と幅広い心電図異常である。心筋と刺激伝導系の脱分極が遅れることで、QRS 延長や房室ブロック、心室性不整脈が起こる。治療の基本は支持療法であり、心毒性に対しては重炭酸ナトリウムが用いられる。
    condition:
      region: 国際
      対象: 三環系抗うつ薬を過量服薬した患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3979
    source: 'Kerr GW, McGuffie AC, Wilkie S. Tricyclic antidepressant overdose: a review. Emerg Med J. 2001;18(4):236-241'
    doi: 10.1136/emj.18.4.236
    pmid: '11435353'
    pmcid: PMC1725608
    url: https://doi.org/10.1136/emj.18.4.236
    source_license: CC 表示なし（購読誌）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 海外の総説（2001年）に基づく古典的な整理である。重炭酸ナトリウムの用量の目安は、ガイドライン級の一次資料では本作成時点で確認しておらず、国内標準書（『新版 急性中毒標準診療ガイド』2023）との突き合わせが宿題として残る。抗不安薬（ベンゾジアゼピン系）の過量は TX-008・TX-009 の範囲とし、本カードは抗うつ薬側に寄せた。SSRI・SNRI の過量やセロトニン症候群は本カードでは扱っていない。
