- id: TX-012
  domain: TX
  subdomain: 解熱鎮痛薬依存・中毒
  assertion:
    plain_statement_ja: アセトアミノフェン中毒の管理について、米国・カナダの4つの臨床中毒学会によるコンセンサス声明（2023年）は、急性摂取の定義の見直し、改訂版の Rumack-Matthew ノモグラムの提示、「massive ingestion」に代わる「high-risk ingestion」の概念、アセチルシステインの中止基準などを示した。治療判断の土台は、摂取後4時間以降の血中濃度をノモグラム上にプロットする考え方であり、反復過剰摂取ではノモグラムは使えない。
    condition:
      region: 米国
      対象: アセトアミノフェンを過量摂取した患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3981
    source: 'Dart RC, et al. Management of Acetaminophen Poisoning in the US and Canada: A Consensus Statement. JAMA Netw Open. 2023;6(8):e2327739'
    doi: 10.1001/jamanetworkopen.2023.27739
    pmid: '37552484'
    pmcid: null
    url: https://doi.org/10.1001/jamanetworkopen.2023.27739
    source_license: CC BY-NC-ND（誌面のオープンアクセス表示で確認）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 米国・カナダの声明に基づく。国内ではアセチルシステイン内用液17.6%が「アセトアミノフェン過量摂取時の解毒」の効能で承認されており（2002年承認）、用法・用量は経口（困難な場合は胃管・十二指腸管）で、初回140 mg/kg、4時間後から70 mg/kgを4時間ごとに17回である（審査資料・添付文書で確認）。静注製剤のアセトアミノフェン解毒の適応は、開いた資料の範囲では確認できなかった（未確認）。国内添付文書にもノモグラムが収載されているが、その治療ラインが本声明の改訂版と同一かは突き合わせていない。
