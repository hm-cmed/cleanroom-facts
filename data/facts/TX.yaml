- id: TX-018
  domain: TX
  subdomain: 毒劇物中毒
  assertion:
    plain_statement_ja: 毒物及び劇物取締法（昭和25年法律第303号）は、毒物・劇物について保健衛生上の見地から必要な取締を行う法律であり、急性毒性に着目して物質を指定し、製造・輸入・販売・取扱いを規制する。「毒物」は法の別表第1に、「劇物」は別表第2に掲げる物（医薬品・医薬部外品・体外診断用医薬品を除く）を指し、毒物の例として黄燐、シアン化ナトリウム、水銀、砒素が、劇物の例としてアンモニア、塩化水素、四塩化炭素、硫酸が挙げられる。医薬品の区分である「毒薬・劇薬」（医薬品医療機器等法の区分）とは別の分類である。
