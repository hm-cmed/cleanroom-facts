    pmcid: PMC3657020
    url: https://doi.org/10.1007/s13181-013-0292-0
    source_license: CC 表示なし（購読誌）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ78 2026-11-15）：Dutta S, Buciuc AG, Barry P, Padilla V. A Narrative Review on Toxidromes in the Psychiatric Population: Implications for Overdose Prevention. J Clin Med. 2025;14(17):6160（PMID: 40943922、DOI: 10.3390/jcm14176160、PMCID: PMC12429776、https://pmc.ncbi.nlm.nih.gov/articles/PMC12429776/）。裏づける部分：候補（CC BY 総説）が、Z ドラッグ（ゾルピデムとザレプロンを例示）はベンゾジアゼピンと同様に GABA-A 受容体への作用を介して中枢抑制を来すこと、鎮静薬トキシドロームの臨床像は鎮静から昏睡に至る中枢抑制であり、対応の中心は支持療法であることを述べ、カードの主張の骨格と一致する。数値の照合：数値なし（機序と臨床像のカード）。ゾピクロンは候補で例示がない。「死亡はまれで多剤併用時に起こりやすい」点と「フルマゼニルが3剤すべての Z ドラッグの鎮静を拮抗する」点は候補に再掲なし（候補のフルマゼニルはベンゾジアゼピンへの拮抗と注意点の文脈で述べられる）。留保：主出典 SRC-3977 の区分は現行 RESTRICTED が正しい（J Med Toxicol、Springer。PMC 収載分 PMC3657020 は著者稿でライセンス表示なし）。識別子補完候補あり'
