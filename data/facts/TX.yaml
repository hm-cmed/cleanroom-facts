- id: TX-016
  domain: TX
  subdomain: 覚醒剤依存・中毒
  assertion:
    plain_statement_ja: メタンフェタミンの急性毒性では、興奮、せん妄、胸痛・動悸・高血圧危機などの心症状、高体温が中心となる。急性期の管理では、ベンゾジアゼピンと抗精神病薬の利益が複数の研究で確認されているが、頻拍と高血圧はこれらでは軽減しないことがある。
    condition:
      region: 国際
      対象: メタンフェタミン急性中毒の患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3985
    source: Coffin PO, Suen LW. Methamphetamine Toxicities and Clinical Management. NEJM Evid. 2023;2(12):EVIDra2300160
    doi: 10.1056/EVIDra2300160
    pmid: '38320504'
    pmcid: PMC11458184
    url: https://doi.org/10.1056/EVIDra2300160
    source_license: CC 表示なし（購読誌。著者原稿が PMC に収載）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 海外の総説（2023年、著者稿で確認）に基づく。覚醒剤精神病・依存の治療は Ⅱ の範囲であり、本カードは急性中毒の身体管理に限る。鎮静に用いる個別薬剤の国内適応は添付文書で確認する前提である。交感神経興奮状態での β 遮断薬の扱いは資料間で見解が分かれるため、主張には含めていない。国内の覚醒剤事犯の検挙人員（令和6年 6,306人）は厚生労働省の会議資料で確認したが、暫定値扱いの公表を含むため主張には含めていない。
