- id: TX-009
  domain: TX
  subdomain: 睡眠薬依存・中毒
  assertion:
    plain_statement_ja: フルマゼニルの国内の効能・効果は「ベンゾジアゼピン系薬剤による鎮静の解除及び呼吸抑制の改善」であり、効能又は効果に関連する注意では、大量にベンゾジアゼピン系薬剤を服薬した中毒患者も投与の対象に含まれる。用法・用量は、初回0.2 mgを緩徐に静脈内投与し、投与後4分以内に望まれる覚醒状態が得られない場合は0.1 mgを追加投与し、以後必要に応じて1分間隔で0.1 mgずつ、総投与量1 mgまで（ICU領域では2 mgまで）投与を繰り返す。長期間ベンゾジアゼピンを投与されているてんかん患者への投与には注意を要し、ベンゾジアゼピン系薬剤と三環系・四環系抗うつ薬を併せて服用している患者では、ベンゾジアゼピンの作用が弱まることで抗うつ薬の中毒症状が顕在化しうる。長期・高用量のベンゾジアゼピン投与例では、急激な投与により離脱症状が出うる。
    condition:
      region: 日本
      対象: ベンゾジアゼピン系薬剤を大量に服薬した中毒患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3978
    source: フルマゼニル静注0.5mgシリンジ「テルモ」添付文書（2023年12月改訂、第1版）. 医薬品医療機器総合機構（PMDA）医薬品添付文書情報
    doi: null
    pmid: null
