- id: TX-004
  domain: TX
  subdomain: アルコール精神病
  assertion:
    plain_statement_ja: 離脱せん妄（振戦せん妄）はアルコール離脱の最重症型である。アルコール使用障害のある人の約半数が減量・中止時に何らかの離脱症状を呈し、その3〜5%が重症の離脱（せん妄）に進む。離脱せん妄は通常、最終飲酒の約3日後（約72時間）に始まり、1〜8日（典型的には2〜3日）続き、死亡率は最大で約4%とされる。治療は併存症と離脱症状の同定と治療が基本で、ベンゾジアゼピン、輸液、チアミン、総合ビタミンを用い、重症例は ICU で管理する。目標は興奮の制御、痙攣リスクの低減、傷害・死亡のリスクの低減である。
    condition:
      region: 国際
      対象: 離脱せん妄の患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3973
    source: Schuckit MA. Recognition and Management of Withdrawal Delirium (Delirium Tremens). N Engl J Med. 2014;371(22):2109-2113
    doi: 10.1056/NEJMra1407298
    pmid: '25427113'
    pmcid: null
    url: https://doi.org/10.1056/NEJMra1407298
    source_license: CC 表示なし（購読誌）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 発症までの時間には、資料により48〜96時間とする幅がある。アルコール幻覚症は意識清明のもとでの幻覚であり離脱せん妄と鑑別すべき状態だが、その診断と精神科的治療は Ⅱ（精神）の範囲に寄せ、本カードでは扱っていない。Wernicke 脳症そのものは第29回 ND で作成済みであり、ここでは離脱管理に伴うチアミン投与（予防）の範囲に留めた。ベンゾジアゼピン等の個別製剤の国内承認は添付文書で確認する前提である。
  curriculum:
    kokushi: 医学各論 ⅩⅢ-2-A-③（アルコール精神病、a）
