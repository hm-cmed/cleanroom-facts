    source: 'Walley AY, Xuan Z, Hackman HH, et al. Opioid overdose rates and implementation of overdose education and nasal naloxone distribution in Massachusetts: interrupted time series analysis. BMJ. 2013;346:f174'
    doi: 10.1136/bmj.f174
    pmid: '23372174'
    pmcid: PMC4688551
    url: https://doi.org/10.1136/bmj.f174
    source_license: CC BY-NC（誌面のオープンアクセス表示で確認）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ78 2026-11-15）：Fischer LS, Asher A, Stein R, et al. Effectiveness of naloxone distribution in community settings to reduce opioid overdose deaths among people who use drugs: a systematic review and meta-analysis. BMC Public Health. 2025;25(1):1135（PMID: 40133970、DOI: 10.1186/s12889-025-22210-8、PMCID: PMC11934755、https://pmc.ncbi.nlm.nih.gov/articles/PMC11934755/）。裏づける部分：候補（CC BY の系統的レビュー）が、マサチューセッツ州の時系列分析について、未実施の地域と比べて、低実施（人口10万人あたり登録1〜100人）の地域年ではオピオイド過量死が27%減少し、高実施（100人を超える）の地域年では46%減少したことを、実施量の層別の定義とともに再掲し、カードの主張のうち研究デザインと効果量の範囲と一致する。数値の照合：カードの調整率比0.73・0.54は、それぞれ27%減・46%減と相補の関係にあり、効果量は候補と一致する。訓練を受けた人数（2,912人）と救助件数（327件）、95%信頼区間、対象が19地域である点は候補に再掲なし。留保：主出典 SRC-3984 の刊行版ライセンスは CC BY-NC と特定でき（Europe PMC の個別レコード）、現行 RESTRICTED が正しい。マスターの license_note は空欄で、特定内容は申し送りに記す。識別子補完候補あり'
  uncertainty: 米国の観察研究であり、国内の実態への外挿はできない。国内ではナロキソンは静注製剤のみであり、点鼻製剤や一般向け配布は確認できていない（TX-014）。国内のオピオイド過量の疫学（救急搬送件数・死亡数）の政府統計は、本作成時点で確認できていない。
