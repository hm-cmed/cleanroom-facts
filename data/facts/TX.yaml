- id: TX-001
  domain: TX
  subdomain: 急性アルコール中毒
  assertion:
    plain_statement_ja: 急性アルコール中毒では、血中アルコール濃度（BAC）の上昇に伴って症状が段階的に進む。目安として、50 mg/dL超で多弁・リラックスなどの軽度酩酊、100 mg/dL超で失調・判断力低下・言語不明瞭、200 mg/dL超で健忘・複視・構音障害・低体温・悪心嘔吐がみられ、400 mg/dL超では呼吸抑制・昏睡に至る。治療の中心はバイタルの安定化と支持療法であり、低血糖、乳酸アシドーシス、電解質異常などの代謝性合併にも注意する。
    condition:
      region: 国際
      対象: 急性アルコール中毒患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3971
    source: Mirijello A, Sestito L, Antonelli M, Gasbarrini A, Addolorato G. Identification and management of acute alcohol intoxication. Eur J Intern Med. 2023;108:1-8
    doi: 10.1016/j.ejim.2022.08.013
    pmid: '35985955'
    pmcid: null
    url: https://doi.org/10.1016/j.ejim.2022.08.013
    source_license: CC 表示なし（Elsevier、購読誌）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ78 2026-11-15）：Baldaçara L, Pettersen AG, Leite VDS, et al. Brazilian Psychiatric Association Consensus for the Management of Acute Intoxication: general management and specific interventions for drugs of abuse. Trends Psychiatry Psychother. 2024;46:e20220571（PMID: 36463505、DOI: 10.47626/2237-6089-2022-0571、PMCID: PMC11332681、https://pmc.ncbi.nlm.nih.gov/articles/PMC11332681/）。裏づける部分：候補（CC BY のコンセンサス文書）の Table 2 が、血中アルコール濃度と症状の段階対応（100 mg/dL超で失調・判断力低下・言語不明瞭、200 mg/dL超で健忘・複視・構音障害・低体温・悪心嘔吐、400 mg/dL超で呼吸抑制・昏睡・死亡）を再掲し、治療は気道確保とバイタルサインの確認・観察を中心とする支持療法であることを述べ、カードの主張の骨格と一致する。数値の照合：100・200・400 mg/dL超の各段階と症状は候補と一致する。第1段階は、候補が多弁・リラックスを「50 mg/dL未満」の行に置くのに対し、カード（主出典の対応表）は50 mg/dL超の側に置いており、境界の置き方が異なる（申し送り参照）。代謝性合併（低血糖・乳酸アシドーシス・電解質異常）の列挙は、候補では中毒全般の初期検査の範囲にとどまる。留保：主出典 SRC-3971 の区分は現行 RESTRICTED が正しい（Eur J Intern Med、Elsevier。Crossref は TDM ライセンスのみ、Europe PMC の個別レコードで非 OA）。識別子補完候補あり（補完候補の節参照）'
  uncertainty: BAC と症状の段階対応は出典の表（原典は Vonghia 2008 の対応表）から読み取った目安であり、耐性や併用薬物で大きくずれる。同総説が治療薬として挙げる metadoxine は国内承認を確認していないため、主張には含めていない。
