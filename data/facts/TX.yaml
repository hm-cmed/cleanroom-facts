- id: TX-005
  domain: TX
  subdomain: 慢性アルコール性臓器障害
  assertion:
    plain_statement_ja: アルコール関連肝疾患は、脂肪肝からアルコール性肝炎、肝線維症・肝硬変へと進展するスペクトラムとして整理される。重症アルコール性肝炎では、MELD スコアが20を超えることが重症の目安とされ、現時点で有効性が示されている薬物治療はステロイドであり、ペントキシフィリンは推奨されない。
    condition:
      region: 米国
      対象: アルコール関連肝疾患の患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3974
    source: 'Jophlin LL, Singal AK, Bataller R, Wong RJ, Sauer BG, Terrault NA, Shah VH. ACG Clinical Guideline: Alcohol-Associated Liver Disease. Am J Gastroenterol. 2024;119(1):30-54'
    doi: 10.14309/ajg.0000000000002572
    pmid: '38174913'
    pmcid: PMC11040545
    url: https://doi.org/10.14309/ajg.0000000000002572
    source_license: CC 表示なし（購読誌。著者原稿が PMC に収載）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ78 2026-11-15）：Wang S, Hu Y, Chu H. Alcohol-Associated Liver Disease: Epidemiology, Pathogenesis, and Emerging Therapeutic Targets. MedComm. 2026;7(11):e71120（PMID: 42996894、DOI: 10.1002/mco2.71120、PMCID: PMC13740686、https://pmc.ncbi.nlm.nih.gov/articles/PMC13740686/）。裏づける部分：候補（CC BY 総説）が、アルコール関連肝疾患は脂肪肝からアルコール性肝炎・線維化・肝硬変へと進展するスペクトラムであること、重症アルコール性肝炎で有効性が示されている薬物治療はステロイドのみで（STOPAH 試験でプレドニゾロンに短期的な利益）、ペントキシフィリンには生存改善がなかったことを述べ、カードの主張の骨格と一致する。数値の照合：重症の目安である MELD スコア20超は候補に再掲なし。ステロイドの位置づけ（唯一有効性が示された薬物治療）とペントキシフィリンの否定的評価は候補と一致する。留保：主出典 SRC-3974 の区分は現行 RESTRICTED が正しい（Am J Gastroenterol、Wolters Kluwer。PMC 収載分 PMC11040545 は著者稿でライセンス表示なし）。識別子補完候補あり'
  uncertainty: 米国のガイドライン（2024年）に基づく。国内の診断基準は日本肝臓学会『アルコール性肝障害（アルコール関連肝疾患）診療ガイド 2022』に整理されているが、基準本文の逐語確認ができていないため、本カードの主張には含めていない。ステロイドは薬剤群としての記載であり、個別製剤の国内適応は添付文書で確認する前提である。
