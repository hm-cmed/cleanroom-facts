- id: TX-006
  domain: TX
  subdomain: 慢性アルコール性臓器障害
  assertion:
    plain_statement_ja: アルコール性（アルコール誘発性）心筋症は、ほかに原因のない拡張型心筋症であり、飲酒量の目安は一般に80 g/日を超える飲酒を5年以上とされる（定義には議論がある）。特異的な心症状はなく、治療の最重要点は断酒であり、断酒した患者では左室駆出率の回復と良好な予後が結びついている。その他の治療は、左室駆出率の低下した心不全（HFrEF）の標準治療に準じる。
    condition:
      region: 国際
      対象: アルコール性心筋症の患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3975
    source: 'Domínguez F, Adler E, García-Pavía P. Alcoholic cardiomyopathy: an update. Eur Heart J. 2024;45(26):2294-2305'
    doi: 10.1093/eurheartj/ehae362
    pmid: '38848133'
    pmcid: null
    url: https://doi.org/10.1093/eurheartj/ehae362
    source_license: CC BY 4.0（全文の表示で確認）
    legal_basis: B
    source_class: OPEN
    corroboration: null
  uncertainty: 飲酒量の目安は出典の総説の記載であり、診断基準として確立した閾値ではない。心筋症そのものの診療は循環器分野の範囲であり、本カードはアルコールという原因の側面に限る。
