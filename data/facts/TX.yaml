- id: TX-010
  domain: TX
  subdomain: 向精神薬依存・中毒
  assertion:
    plain_statement_ja: 三環系抗うつ薬の過量服薬は、救急部門でよくみられる薬物中毒の一つである。毒性は、ノルアドレナリン再取り込み阻害、抗コリン作用、心筋へのキニジン様（膜安定化）作用などの薬理作用から生じ、重症像は昏睡、痙攣、呼吸抑制、低血圧と幅広い心電図異常である。心筋と刺激伝導系の脱分極が遅れることで、QRS 延長や房室ブロック、心室性不整脈が起こる。治療の基本は支持療法であり、心毒性に対しては重炭酸ナトリウムが用いられる。
    condition:
      region: 国際
      対象: 三環系抗うつ薬を過量服薬した患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3979
    source: 'Kerr GW, McGuffie AC, Wilkie S. Tricyclic antidepressant overdose: a review. Emerg Med J. 2001;18(4):236-241'
    doi: 10.1136/emj.18.4.236
    pmid: '11435353'
    pmcid: PMC1725608
    url: https://doi.org/10.1136/emj.18.4.236
    source_license: CC 表示なし（購読誌）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ78 2026-11-15）：Taylor D, Poulou S, Clark I. The cardiovascular safety of tricyclic antidepressants in overdose and in clinical use. Ther Adv Psychopharmacol. 2024;14:20451253241243297（PMID: 38827015、DOI: 10.1177/20451253241243297、PMCID: PMC11141239、https://pmc.ncbi.nlm.nih.gov/articles/PMC11141239/）。裏づける部分：候補（CC BY 総説）が、三環系抗うつ薬の毒性はノルアドレナリン再取り込み阻害、直接のα遮断、心筋へのキニジン様（膜安定化）作用、抗コリン作用の4つの薬理作用によると整理し、房室ブロックと心室性不整脈、低血圧が過量服薬の合併症であり、痙攣・呼吸抑制・昏睡が死亡リスクに関わることを述べ、カードの主張の骨格と一致する。数値の照合：数値なし（機序と重症像のカード）。QRS 延長の明示と、心毒性に対して重炭酸ナトリウムを用いる点は候補に再掲なし。留保：主出典 SRC-3979 の区分は現行 RESTRICTED が正しい（Emerg Med J、BMJ。PMC 収載分 PMC1725608 はアーカイブ分でライセンス表示なし）。識別子補完候補あり'
  uncertainty: 海外の総説（2001年）に基づく古典的な整理である。重炭酸ナトリウムの用量の目安は、ガイドライン級の一次資料では本作成時点で確認しておらず、国内標準書（『新版 急性中毒標準診療ガイド』2023）との突き合わせが宿題として残る。抗不安薬（ベンゾジアゼピン系）の過量は TX-008・TX-009 の範囲とし、本カードは抗うつ薬側に寄せた。SSRI・SNRI の過量やセロトニン症候群は本カードでは扱っていない。
