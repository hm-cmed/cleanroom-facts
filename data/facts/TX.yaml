- id: TX-003
  domain: TX
  subdomain: アルコール依存症
  assertion:
    plain_statement_ja: アルコール離脱の身体管理では、入院患者は症状の有無にかかわらず離脱のリスクを層別化し、重症化の予測指標（PAWSS など）を用いる。CIWA-Ar は診断のためではなく、治療反応のモニタリングに用いる。痙攣と離脱せん妄の発生を減らす実績からベンゾジアゼピンが第一選択であり、症状誘発式の投与は固定用量のスケジュールより総投与量と入院期間が短い。チアミンは Wernicke 脳症の予防のため投与し、栄養不良、重症・複雑性の離脱、ICU 管理の患者では非経口製剤が推奨される。
    condition:
      region: 米国
      対象: アルコール離脱の入院患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3616
    source: American Society of Addiction Medicine. The ASAM Clinical Practice Guideline on Alcohol Withdrawal Management. J Addict Med. 2020;14(3S Suppl 1):1-72
    doi: 10.1097/ADM.0000000000000668
    pmid: '32511109'
    pmcid: null
    url: https://doi.org/10.1097/ADM.0000000000000668
    source_license: CC 表示なし（購読誌）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 米国のガイドライン（2020年版）に基づく。本出典は第51回 SB-002 で登録済みであり、本カードは離脱の身体管理の側面に限る（依存症の診断・精神科的治療の一般論は Ⅱ の範囲）。ベンゾジアゼピンは薬剤群としての記載であり、個別製剤の国内承認・適応は各製剤の添付文書で確認する前提である。
  curriculum:
    kokushi: 医学各論 ⅩⅢ-2-A-②（アルコール依存症、a）
    core_curriculum: 'PS-03-05-08 (id: Jkxnubw)；PS-02-17-05 (id: JkxnuT8)；TBL-01-00-552 (id: JlvnmTg)'
