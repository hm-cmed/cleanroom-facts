- id: TX-011
  domain: TX
  subdomain: 向精神薬依存・中毒
  assertion:
    plain_statement_ja: 三環系抗うつ薬中毒による死亡は、主に不整脈と低血圧による。心毒性の中心は心組織へのキニジン様作用であり、活動電位の第0相の脱分極が遅れることで His-Purkinje 系と心筋の伝導が遅延し、QRS 延長、房室ブロック、心室性不整脈、低血圧を来す。高張重炭酸ナトリウムは伝導を改善しうる治療であり、その作用は細胞外ナトリウム濃度の上昇と細胞外 pH の上昇の双方によると考えられる。アシドーシスは心毒性を悪化させるため酸性血症の患者で特に有益であるが、血中 pH が正常でも有益でありうる。
    condition:
      region: 国際
      対象: 三環系抗うつ薬中毒で心毒性を呈した患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3980
    source: Pentel PR, Benowitz NL. Tricyclic antidepressant poisoning. Management of arrhythmias. Med Toxicol. 1986;1(2):101-121
    doi: 10.1007/BF03259831
    pmid: '3784839'
    pmcid: null
    url: https://doi.org/10.1007/BF03259831
    source_license: CC 表示なし（購読誌）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 1986年の総説に基づく古典的な機序の整理であり、アミトリプチリン中毒の実験研究（Sasyniuk 1986）が重炭酸ナトリウムによる伝導改善を支持する。用量の数値は本カードでは扱っていない。
