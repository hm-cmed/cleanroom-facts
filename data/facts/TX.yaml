- id: TX-017
  domain: TX
  subdomain: 有機溶剤依存・中毒
  assertion:
    plain_statement_ja: 慢性のトルエン乱用では、白質が灰白質より選択的に障害され、脳室周囲・皮質下が皮質より選択的に障害される。画像異常のパターンは、トルエンの脂溶性による分布で説明される。神経心理学的には、処理速度、持続的注意、記憶の検索、遂行機能、言語の障害がみられ、白質病変と整合する（実証研究30件の系統的レビュー）。
    condition:
      region: 国際
      対象: トルエンを乱用する人
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3986
    source: 'Yücel M, Takagi M, Walterfang M, Lubman DI. Toluene misuse and long-term harms: a systematic review of the neuropsychological and neuroimaging literature. Neurosci Biobehav Rev. 2008;32(5):910-926'
    doi: 10.1016/j.neubiorev.2008.01.006
    pmid: '18456329'
    pmcid: null
    url: https://doi.org/10.1016/j.neubiorev.2008.01.006
    source_license: CC 表示なし（購読誌）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 系統的レビュー（2008年）に基づく。対象は乱用による高濃度・間欠的な曝露のパターンであり、慢性の職業性曝露による中毒は第56回 OC の範囲である。混合溶剤（シンナー）としての資料は確認できていない。急性曝露時の不整脈（いわゆる sudden sniffing death）については一次資料の裏づけが取れなかったため、主張には含めていない。
