- id: TX-007
  domain: TX
  subdomain: 妊婦・胎児への影響、胎児性アルコール症候群
  assertion:
    plain_statement_ja: 妊娠中の飲酒について、安全と知られた飲酒量はなく、安全な時期もない。ワイン、ビール、蒸留酒など種類を問わず有害でありうる。妊娠中の飲酒は、流産、早産、死産、乳幼児突然死症候群のリスク上昇と関連し、児に胎児性アルコール・スペクトラム障害（FASD）と総称される、生涯にわたる行動面・知的・身体の障害を生じうる。妊娠の最初の3か月の飲酒は顔貌の異常を、妊娠の全期間の飲酒は成長障害や低出生体重、行動の問題などを起こしうる。脳は妊娠の全期間を通じて発達するため、妊娠中のいつの時点でも飲酒をやめることは児の健康に有益である。
    condition:
      region: 米国
      対象: 妊娠中の女性
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3976
    source: Centers for Disease Control and Prevention. About Alcohol Use During Pregnancy. Alcohol and Pregnancy. CDC
    doi: null
    pmid: null
    pmcid: null
    url: https://www.cdc.gov/alcohol-pregnancy/about/index.html
    source_license: 米国政府資料（CDC 公式ページ）
    legal_basis: B
    source_class: GOV_US
    corroboration: null
  uncertainty: 米国の公的資料に基づく。国内の妊娠中の飲酒の現状値（1.0%、令和5年）は第3期アルコール健康障害対策推進基本計画の概要で確認したが、日本国内の FAS/FASD の有病率の公的推計は確認できていないため、海外の有病率の数値は主張に含めていない。出生後の発達・先天異常としての側面は Ⅰ の領域に残し、本カードは妊娠中の飲酒という曝露の側面に限る。
  curriculum:
    kokushi: 医学各論 ⅩⅢ-2-A-⑤（妊婦・胎児への影響、胎児性アルコール症候群、b）
