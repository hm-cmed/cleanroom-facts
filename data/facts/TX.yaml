    doi: 10.1056/EVIDra2300160
    pmid: '38320504'
    pmcid: PMC11458184
    url: https://doi.org/10.1056/EVIDra2300160
    source_license: CC 表示なし（購読誌。著者原稿が PMC に収載）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ78 2026-11-15）：Dutta S, Buciuc AG, Barry P, Padilla V. A Narrative Review on Toxidromes in the Psychiatric Population: Implications for Overdose Prevention. J Clin Med. 2025;14(17):6160（PMID: 40943922、DOI: 10.3390/jcm14176160、PMCID: PMC12429776、https://pmc.ncbi.nlm.nih.gov/articles/PMC12429776/）。裏づける部分：候補（CC BY 総説）の交感神経興奮トキシドロームの節が、メタンフェタミンを代表的な原因薬物として挙げ、臨床像は高血圧・頻拍・高体温・興奮を中心とし、冠攣縮による心筋虚血などの心合併症を来すこと、対応の中心は支持療法と鎮静でベンゾジアゼピンが第一選択であること、高体温には積極的冷却を行うことを述べ、カードの主張の骨格と一致する。数値の照合：数値なし（臨床像と管理方針のカード）。せん妄の明示、抗精神病薬の利益が複数の研究で確認されている点、「頻拍と高血圧はこれらでは軽減しないことがある」という留保は候補に再掲なし（候補は重症の高血圧・頻脈性不整脈にはα2作動薬や血管拡張薬を用いるとする）。留保：主出典 SRC-3985 の区分は現行 RESTRICTED が正しい（NEJM Evid。PMC 収載分 PMC11458184 は著者稿でライセンス表示なし）。識別子補完候補あり'
  uncertainty: 海外の総説（2023年、著者稿で確認）に基づく。覚醒剤精神病・依存の治療は Ⅱ の範囲であり、本カードは急性中毒の身体管理に限る。鎮静に用いる個別薬剤の国内適応は添付文書で確認する前提である。交感神経興奮状態での β 遮断薬の扱いは資料間で見解が分かれるため、主張には含めていない。国内の覚醒剤事犯の検挙人員（令和6年 6,306人）は厚生労働省の会議資料で確認したが、暫定値扱いの公表を含むため主張には含めていない。
