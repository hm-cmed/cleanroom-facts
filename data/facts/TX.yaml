- id: TX-008
  domain: TX
  subdomain: 睡眠薬依存・中毒
  assertion:
    plain_statement_ja: Z ドラッグ（ゾルピデム、ゾピクロン、ザレプロン）はベンゾジアゼピンと同じ GABA-A 受容体に作用する睡眠薬であり、その中毒は主に鎮静と昏睡で、大半は支持療法で足り、死亡はまれで多剤併用時に起こりやすい。フルマゼニルは、3剤すべての Z ドラッグの鎮静を拮抗すると報告されている。
    condition:
      region: 国際
      対象: Zドラッグを過量服薬した患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3977
    source: Gunja N. The Clinical and Forensic Toxicology of Z-drugs. J Med Toxicol. 2013;9(2):155-162
    doi: 10.1007/s13181-013-0292-0
    pmid: '23404347'
    pmcid: PMC3657020
    url: https://doi.org/10.1007/s13181-013-0292-0
    source_license: CC 表示なし（購読誌）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 海外の総説（2013年）に基づく。Z ドラッグの構成は出典の記載によるもので、個別製剤の国内承認状況は添付文書で確認する必要がある。フルマゼニルの国内の効能・用法は添付文書の範囲に限られる（TX-009）。依存そのものの診断・治療は Ⅱ の範囲であり、本カードは過量服薬時の身体管理に限る。
