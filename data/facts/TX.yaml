- id: TX-014
  domain: TX
  subdomain: 麻薬依存・中毒
  assertion:
    plain_statement_ja: ナロキソンの国内の効能・効果は「麻薬による呼吸抑制ならびに覚醒遅延の改善」であり、国内で承認されているのは静注製剤のみである。用法・用量は、ナロキソン塩酸塩として通常成人1回0.2 mgを静脈内注射し、効果不十分な場合は2〜3分間隔で0.2 mgを1〜2回追加投与する。麻薬の中には本剤より作用時間の長いものがあり呼吸抑制が再発しうること、本剤の拮抗作用は呼吸抑制に対して鎮痛作用への拮抗より強いこと、麻薬依存患者（および依存の母親から生まれた新生児）に投与すると急性の退薬症候を起こしうること、非麻薬性の原因による呼吸抑制には無効であることが、注意として示されている。
