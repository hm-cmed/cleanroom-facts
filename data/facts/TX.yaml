- id: TX-005
  domain: TX
  subdomain: 慢性アルコール性臓器障害
  assertion:
    plain_statement_ja: アルコール関連肝疾患は、脂肪肝からアルコール性肝炎、肝線維症・肝硬変へと進展するスペクトラムとして整理される。重症アルコール性肝炎では、MELD スコアが20を超えることが重症の目安とされ、現時点で有効性が示されている薬物治療はステロイドであり、ペントキシフィリンは推奨されない。
    condition:
      region: 米国
      対象: アルコール関連肝疾患の患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3974
    source: 'Jophlin LL, Singal AK, Bataller R, Wong RJ, Sauer BG, Terrault NA, Shah VH. ACG Clinical Guideline: Alcohol-Associated Liver Disease. Am J Gastroenterol. 2024;119(1):30-54'
    doi: 10.14309/ajg.0000000000002572
    pmid: '38174913'
    pmcid: PMC11040545
    url: https://doi.org/10.14309/ajg.0000000000002572
    source_license: CC 表示なし（購読誌。著者原稿が PMC に収載）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 米国のガイドライン（2024年）に基づく。国内の診断基準は日本肝臓学会『アルコール性肝障害（アルコール関連肝疾患）診療ガイド 2022』に整理されているが、基準本文の逐語確認ができていないため、本カードの主張には含めていない。ステロイドは薬剤群としての記載であり、個別製剤の国内適応は添付文書で確認する前提である。
