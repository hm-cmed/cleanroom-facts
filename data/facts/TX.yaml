    doi: 10.1136/bmj.f174
    pmid: '23372174'
    pmcid: PMC4688551
    url: https://doi.org/10.1136/bmj.f174
    source_license: CC BY-NC（誌面のオープンアクセス表示で確認）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 米国の観察研究であり、国内の実態への外挿はできない。国内ではナロキソンは静注製剤のみであり、点鼻製剤や一般向け配布は確認できていない（TX-014）。国内のオピオイド過量の疫学（救急搬送件数・死亡数）の政府統計は、本作成時点で確認できていない。
