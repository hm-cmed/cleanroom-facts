- id: TX-001
  domain: TX
  subdomain: 急性アルコール中毒
  assertion:
    plain_statement_ja: 急性アルコール中毒では、血中アルコール濃度（BAC）の上昇に伴って症状が段階的に進む。目安として、50 mg/dL超で多弁・リラックスなどの軽度酩酊、100 mg/dL超で失調・判断力低下・言語不明瞭、200 mg/dL超で健忘・複視・構音障害・低体温・悪心嘔吐がみられ、400 mg/dL超では呼吸抑制・昏睡に至る。治療の中心はバイタルの安定化と支持療法であり、低血糖、乳酸アシドーシス、電解質異常などの代謝性合併にも注意する。
    condition:
      region: 国際
      対象: 急性アルコール中毒患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3971
    source: Mirijello A, Sestito L, Antonelli M, Gasbarrini A, Addolorato G. Identification and management of acute alcohol intoxication. Eur J Intern Med. 2023;108:1-8
    doi: 10.1016/j.ejim.2022.08.013
    pmid: '35985955'
    pmcid: null
    url: https://doi.org/10.1016/j.ejim.2022.08.013
    source_license: CC 表示なし（Elsevier、購読誌）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: BAC と症状の段階対応は出典の表（原典は Vonghia 2008 の対応表）から読み取った目安であり、耐性や併用薬物で大きくずれる。同総説が治療薬として挙げる metadoxine は国内承認を確認していないため、主張には含めていない。
