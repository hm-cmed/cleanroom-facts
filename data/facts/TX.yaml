- id: TX-015
  domain: TX
  subdomain: 麻薬依存・中毒
  assertion:
    plain_statement_ja: 米国マサチューセッツ州の19地域を対象とした時系列分析では、過量服薬教育と点鼻ナロキソン配布（OEND）のプログラムで2,912人が訓練を受け、327件の救助が報告された。未実施の地域年と比べて、登録が人口10万人あたり1〜100人の地域年ではオピオイド過量死の調整率比は0.73（95%信頼区間0.57〜0.91）、100人を超える地域年では0.54（同0.39〜0.76）と低かった。
    condition:
      region: 米国
      対象: オピオイド過量のリスクがある人とその周囲の人
    differential: null
    common_misconception: null
  provenance:
