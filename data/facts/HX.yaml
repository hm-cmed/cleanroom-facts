- id: HX-004
  domain: HX
  subdomain: 皮膚生検と病理検査
  assertion:
    plain_statement_ja: 皮膚生検は皮膚病変の確定診断のための基本的な手技であり、病変の種類や部位に応じて適切な生検法を選び、病理診断に適した検体を採取・処理することが診断の質を左右する。Alguire と Mathes の総説は、皮膚科専門医でない内科医が診療で行う皮膚生検について、生検手技の種類と実施の要点をまとめたものである。
    condition:
      region: 米国
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1203
    source: Alguire PC, Mathes BM. Skin biopsy techniques for the internist. J Gen Intern Med. 1998;13(1):46-54.
    doi: 10.1046/j.1525-1497.1998.00009.x
    pmid: '9462495'
    pmcid: PMC1496896
    url: https://doi.org/10.1046/j.1525-1497.1998.00009.x
    source_license: © Society of General Internal Medicine（CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（CC BY（OPEN）、作り手の調査バッチ86 2026-11-15）：Llamas-Velasco M, Rozas-Muñoz E, Fernandez-Flores A, Fernandez-Figueras MT. Basic Principles of Skin Biopsy Optimization in Dermatopathology. Dermatopathology (Basel). 2026;13(3):42（PMID: 42782839、DOI: 10.3390/dermatopathology13030042、PMCID: PMC13605635、https://creativecommons.org/licenses/by/4.0/）。裏づける部分：部分：生検の質は部位の選択、手技の実行、手技の選択（パンチ、シェーブ、切除）によって決まること、病変の種類や疑う診断に応じて手技と部位を選ぶ原則を再掲する。数値の照合：数値の主張なし。留保：カードの「皮膚科専門医でない内科医が行う生検」という主出典の枠組み自体は、皮膚病理の最適化を主題とする候補には再掲なし。主出典の PMC 全文（PMC1496896）の著作権表示は「1998 by the Society of General Internal Medicine」で CC 表示はなく、現行 UNKNOWN は RESTRICTED への訂正対象'
