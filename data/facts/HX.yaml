- id: HX-004
  domain: HX
  subdomain: 皮膚生検と病理検査
  assertion:
    plain_statement_ja: 皮膚生検は皮膚病変の確定診断のための基本的な手技であり、病変の種類や部位に応じて適切な生検法を選び、病理診断に適した検体を採取・処理することが診断の質を左右する。Alguire と Mathes の総説は、皮膚科専門医でない内科医が診療で行う皮膚生検について、生検手技の種類と実施の要点をまとめたものである。
