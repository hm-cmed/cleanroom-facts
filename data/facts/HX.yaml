- id: HX-005
  domain: HX
  subdomain: 真菌検査（KOH直接検鏡）
  assertion:
    plain_statement_ja: KOH直接検鏡は、臨床所見だけでは真菌感染症かどうか判断がつかないときに行うポイントオブケアの検査である。鱗屑などの検体をスライドグラスに載せ、20%水酸化カリウム（KOH）を1滴加えてカバーグラスをかけ、顕微鏡の10倍で観察し、菌糸や出芽酵母を探す。真菌感染の検出における尤度比は2.86と報告され、基準標準である培養の尤度比3.28に近い一方、培養は結果まで6週間を要するのに対し、その場で結果が得られる。KOHで陰性でも培養の実施を検討する。
    condition:
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1204
    source: Ponka D, Baddar F. Microscopic potassium hydroxide preparation. Can Fam Physician. 2014;60(1):57.
    doi: null
    pmid: '24452564'
    pmcid: PMC3994805
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3994805/
    source_license: © College of Family Physicians of Canada（CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（CC BY（OPEN）、作り手の調査バッチ86 2026-11-15）：Gupta AK, Hall DC, Cooper EA, Ghannoum MA. Diagnosing Onychomycosis: What''s New? J Fungi (Basel). 2022;8(5):464（PMID: 35628720、DOI: 10.3390/jof8050464、PMCID: PMC9146047、https://creativecommons.org/licenses/by/4.0/）。裏づける部分：部分：KOH直接検鏡が、診察室で1時間以内に酵母・菌糸の有無を判定できる低コストの検査であることを、爪真菌症の診断法の比較表で再掲する。数値の照合：尤度比（KOH 2.86、基準標準の培養3.28）と培養に6週間を要するという数値は候補に再掲なし。20% KOHを1滴、10倍で観察するという手順の細目も候補にはない。留保：主出典の PMC 全文（PMC3994805）の著作権表示は「Copyright © the College of Family Physicians of Canada」で CC 表示はなく、現行 UNKNOWN は RESTRICTED への訂正対象'
  uncertainty: 尤度比などの数値は出典の本文（PMC 全文）で確認した。出典は爪真菌症の評価に関する研究を引いており、部位によって検査性能が異なる可能性がある。本記事には DOI が付与されていないため DOI は null とした。
