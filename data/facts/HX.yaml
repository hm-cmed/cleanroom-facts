- id: HX-012
  domain: HX
  subdomain: 頸部腫瘤の評価
  assertion:
    plain_statement_ja: 成人の頸部腫瘤はありふれているが、その原因は容易には分からないことが多い。小児では感染が最も多いのに対し、成人の持続する頸部腫瘤の多くは腫瘍性であり、悪性腫瘍は他のどの原因よりも多い。無症状の頸部腫瘤が、扁平上皮癌、リンパ腫、甲状腺癌、唾液腺癌などの頭頸部癌の初発または唯一の臨床所見であることがある。そのため成人の頸部腫瘤は、悪性でないと証明されるまでは悪性として扱い、転移性扁平上皮癌による腫瘤では診断の遅れが病期と予後に直接影響するため、速やかな診断が重要である。
    condition:
      region: 米国
      study: 診療ガイドライン
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1210
    source: 'Pynnonen MA, Gillespie MB, Roman B, Rosenfeld RM, et al. Clinical Practice Guideline: Evaluation of the Neck Mass in Adults. Otolaryngol Head Neck Surg. 2017;157(2_suppl):S1-S30.'
    doi: 10.1177/0194599817722550
    pmid: '28891406'
    pmcid: null
    url: https://doi.org/10.1177/0194599817722550
    source_license: © American Academy of Otolaryngology-Head and Neck Surgery Foundation（SAGE、CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（CC BY 4.0（OPEN）、作り手の調査バッチ86 2026-11-15）：Chowdhury R, Turkdogan S, Alsayegh R, et al. Comprehensive Diagnostic Approach to Head and Neck Masses. J Otorhinolaryngol Hear Balance Med. 2024;5(2):17（DOI: 10.3390/ohbm5020017、https://creativecommons.org/licenses/by/4.0/）。裏づける部分：部分：成人の頸部腫瘤は悪性でないと証明されるまでは悪性として扱うこと、評価は悪性の除外を基本とすること、小児では炎症・感染が多いのに対し高齢の成人では腫瘍性の原因（リンパ腫、扁平上皮癌、転移性腫瘍）が増えることを、主出典（米国耳鼻咽喉科・頭頸部外科学会のガイドライン）を参照しつつ再掲する。数値の照合：数値の主張なし。留保：「成人の持続する頸部腫瘤の多くは腫瘍性であり、悪性腫瘍は他のどの原因よりも多い」「無症状の頸部腫瘤が頭頸部癌の初発または唯一の臨床所見であることがある」という表現そのものは候補に再掲なし。候補は PubMed・PMC 未収載で、ライセンスは Crossref の刊行版データで CC BY 4.0 を個別に確認した。主出典は刊行版ライセンスが利用条件のみで CC ではなく、現行 UNKNOWN は RESTRICTED への訂正対象'
