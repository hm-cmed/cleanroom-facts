- id: HX-006
  domain: HX
  subdomain: 瘙痒の評価
  assertion:
    plain_statement_ja: 成人の全身の瘙痒のうち、原因となる皮膚疾患が見当たらないものでは、皮膚以外の背景疾患が隠れていることがあり、その精査と管理の進め方が課題になる。英国皮膚科医協会の2018年のガイドラインは、基礎にある皮膚疾患のない成人の全身性瘙痒について、精査（investigation）と管理の手順を示したものである。
    condition:
      region: 英国
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1205
    source: Millington GWM, Collins A, Lovell CR, Leslie TA, et al. British Association of Dermatologists' guidelines for the investigation and management of generalized pruritus in adults without an underlying dermatosis, 2018. Br J Dermatol. 2018;178(1):34-60.
    doi: 10.1111/bjd.16117
    pmid: '29357600'
    pmcid: null
    url: https://doi.org/10.1111/bjd.16117
    source_license: © British Association of Dermatologists（Wiley、CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（CC BY 4.0（OPEN）、作り手の調査バッチ86 2026-11-15）：Hashimoto T, Okuno S. Practical guide for the diagnosis and treatment of localized and generalized cutaneous pruritus (chronic itch with no underlying pruritic dermatosis). J Dermatol. 2025;52(2):204-220（PMID: 39663861、DOI: 10.1111/1346-8138.17565、PMCID: PMC11807371、https://creativecommons.org/licenses/by/4.0/）。裏づける部分：全面：原発性の皮疹のない全身性瘙痒は全身疾患（内臓疾患など）を示唆すること、その精査と管理が課題であることを再掲し、主出典である英国皮膚科医協会の2018年ガイドラインを正式名称（基礎にある皮膚疾患のない成人の全身性瘙痒の精査と管理）で明示して、その対象と位置づけを確認する。数値の照合：数値の主張なし。留保：カードの主張はガイドラインの対象と位置づけを示す定性的なものであり、候補の再掲で過不足なくカバーされる。主出典は Crossref の刊行版ライセンスが Wiley の利用条件（vor）とテキストマイニング用のみで CC ではなく、Europe PMC でも非OA。現行 UNKNOWN は RESTRICTED への訂正対象'
