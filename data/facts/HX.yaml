- id: HX-011
  domain: HX
  subdomain: 嗄声と咽頭痛の評価
  assertion:
    plain_statement_ja: 嗄声（発声障害、dysphonia）は、声の質、高さ、大きさ、発声の努力感の変化によってコミュニケーションや生活の質が損なわれる状態で、人口のほぼ3分の1が生涯のどこかで経験する。米国耳鼻咽喉科・頭頸部外科学会の診療ガイドライン（2018年改訂）は、あらゆる年齢の発声障害患者を対象に、評価と治療に関するエビデンスに基づく推奨を示している。咽頭痛を伴う場合は、発声障害の原因となる咽喉頭の病変を念頭に評価を進める。
    condition:
      region: 米国
      study: 診療ガイドライン
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1209
    source: 'Stachler RJ, Francis DO, Schwartz SR, Damask CC, et al. Clinical Practice Guideline: Hoarseness (Dysphonia) (Update). Otolaryngol Head Neck Surg. 2018;158(1_suppl):S1-S42.'
    doi: 10.1177/0194599817751030
    pmid: '29494321'
    pmcid: null
    url: https://doi.org/10.1177/0194599817751030
    source_license: © American Academy of Otolaryngology-Head and Neck Surgery Foundation（SAGE、CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（CC BY（OPEN）、作り手の調査バッチ86 2026-11-15）：Mairesse S, Maniaci A, Briganti G, Lechien JR. Diagnostic Accuracy of Artificial Intelligence in Laryngeal Disorders: An Integrative Review. J Pers Med. 2026;16(6):301（PMID: 42346612、DOI: 10.3390/jpm16060301、PMCID: PMC13301393、https://creativecommons.org/licenses/by/4.0/）。裏づける部分：部分：成人のほぼ3分の1が生涯のどこかで声の障害を経験することを再掲する。数値の照合：「ほぼ3分の1」はカードと一致する。ただし候補の表現は「成人のほぼ3分の1（Nearly one-third of the adult population）」で、カードの「人口のほぼ3分の1」とは母数の表現がわずかに異なる。留保：嗄声の定義（声の質、高さ、大きさ、発声の努力感の変化によってコミュニケーションや生活の質が損なわれる状態）と、2018年改訂ガイドライン自体の位置づけは候補に再掲なし。主出典は刊行版ライセンスが利用条件のみで CC ではなく、現行 UNKNOWN は RESTRICTED への訂正対象'
  uncertainty: 経験頻度（人口のほぼ3分の1）は出典の抄録の記載に基づく。本ガイドラインの主対象は発声障害であり、咽頭痛そのものの鑑別診断（ウイルス性・細菌性咽頭炎など）は対象外のため、本カードの咽頭痛に関する記述は発声障害に伴う範囲に限った。
