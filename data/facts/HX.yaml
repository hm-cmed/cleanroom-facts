- id: HX-010
  domain: HX
  subdomain: 鼻出血の評価と初期対応
  assertion:
    plain_statement_ja: 鼻出血はありふれた問題で、米国では少なくとも60%の人が生涯に一度は経験し、医療機関を受診するのはその約6%とされる。鼻出血は救急外来受診の0.5%を占め、耳鼻咽喉科関連の救急受診の最大で3分の1に達する。米国耳鼻咽喉科・頭頸部外科学会の診療ガイドラインは、重症、持続性、反復性の出血や生活の質に影響する出血を対象とし、対応は自宅でのセルフケアから診療所・救急部門・手術室での処置まで幅広いことを前提に、評価と初期対応の推奨を示している。
    condition:
      region: 米国
      study: 診療ガイドライン
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1208
    source: 'Tunkel DE, Anne S, Payne SC, Ishman SL, et al. Clinical Practice Guideline: Nosebleed (Epistaxis). Otolaryngol Head Neck Surg. 2020;162(1_suppl):S1-S38.'
    doi: 10.1177/0194599819890327
    pmid: '31910111'
    pmcid: null
    url: https://doi.org/10.1177/0194599819890327
    source_license: © American Academy of Otolaryngology-Head and Neck Surgery Foundation（SAGE、CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（CC BY（OPEN）、作り手の調査バッチ86 2026-11-15）：Alkhalifah KM, Alhumaidan NI, Alotaibi TA, et al. A Systematic Review and Meta-Analysis of the Awareness of and Attitudes Toward Epistaxis. Cureus. 2023;15(10):e46590（PMID: 37933345、DOI: 10.7759/cureus.46590、PMCID: PMC10625789、https://creativecommons.org/licenses/by/4.0/）。裏づける部分：部分：鼻出血の疫学のうち、生涯に最大で60%の人が経験し、その約6%が医療機関を受診することを再掲する。数値の照合：60%と約6%はカードと一致する。救急受診の0.5%は、候補では「米国での受診200件に1件（＝0.5%）」という一般の受診を母数とする形で現れ、カードの「救急外来受診の0.5%」とは母数の枠組みが異なる。耳鼻咽喉科関連の救急受診の最大で3分の1という数値は候補に再掲なし。留保：ガイドラインの対象（重症、持続性、反復性の出血や生活の質に影響する出血）と対応の幅（自宅でのセルフケアから手術室での処置まで）は候補に再掲なし。裏づけ登録時は候補の0.5%をカードの救急受診の数値の裏づけとしてそのまま使わないこと。主出典は刊行版ライセンスが利用条件のみで CC ではなく、現行 UNKNOWN は RESTRICTED への訂正対象'
  uncertainty: 頻度の数値（60%、約6%、救急受診の0.5%）は出典の抄録の記載に基づく。個別の止血処置の手順や推奨の強さは本カードには含めていない。
