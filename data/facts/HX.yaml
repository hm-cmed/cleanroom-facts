- id: HX-002
  domain: HX
  subdomain: ダーモスコピー
  assertion:
    plain_statement_ja: ダーモスコピーは、光源を備えた手持ち式の拡大鏡で、表皮から真皮浅層までの構造を詳しく観察する検査である。成人の角化細胞癌（基底細胞癌・有棘細胞癌）の診断精度を検証したコクランの系統的レビューでは、対面評価において基底細胞癌の検出でダーモスコピーは肉眼観察より正確であり、特異度を80%に固定したときの感度はダーモスコピー93%に対して肉眼観察79%と推定された。一方、有棘細胞癌については結論を出すのに十分なデータがなかった。
    condition:
      region: 国際
      study: 系統的レビュー（24研究）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1201
    source: Dinnes J, Deeks JJ, Chuchu N, Matin RN, et al. Visual inspection and dermoscopy, alone or in combination, for diagnosing keratinocyte skin cancers in adults. Cochrane Database Syst Rev. 2018;12(12):CD011901.
    doi: 10.1002/14651858.CD011901.pub2
    pmid: '30521688'
    pmcid: PMC6516870
    url: https://doi.org/10.1002/14651858.CD011901.pub2
    source_license: © The Cochrane Collaboration（Wiley、CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（CC BY（OPEN）、作り手の調査バッチ86 2026-11-15）：Klein CM, Sivesind TE, Dellavalle RP. From the Cochrane Library: Visual Inspection and Dermoscopy, Alone or in Combination, for Diagnosing Keratinocyte Skin Cancers in Adults. JMIR Dermatol. 2024;7:e41657（PMID: 38451581、DOI: 10.2196/41657、PMCID: PMC10958336、https://creativecommons.org/licenses/by/4.0/）。裏づける部分：部分：主出典（コクランレビュー）の主要結果を要約し、対面評価において基底細胞癌の検出でダーモスコピーが肉眼観察より正確であること、有棘細胞癌については結論を出すのに十分なデータがなかったことを再掲する。数値の照合：特異度を80%に固定したときの感度93%（ダーモスコピー）対79%（肉眼観察）は候補に正確に再掲され、相対診断オッズ比8.2も一致する。カード冒頭のダーモスコピーの定義（光源を備えた手持ち式拡大鏡で表皮から真皮浅層までを観察する）は候補に再掲なし。留保：主出典の PMC 全文（PMC6516870）の著作権表示は「Copyright © 2018 The Cochrane Collaboration」で CC ライセンス要素はなく、刊行版も CC ではないため、PMC に全文があっても自由とはみなさない。現行 UNKNOWN は RESTRICTED への訂正対象'
  uncertainty: 感度・特異度の数値は出典（コクランレビュー）の抄録と本文のメタ解析結果から読み取った。本レビューの対象は角化細胞癌であり、悪性黒色腫の診断精度は同じ著者らの別レビューの範囲であるため本カードには含めていない。
