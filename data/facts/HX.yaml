- id: HX-001
  domain: HX
  subdomain: 発疹の診かた
  assertion:
    plain_statement_ja: 全身性の発疹の評価は、包括的な鑑別診断を挙げることから始め、焦点を絞った病歴聴取と皮疹の主要な臨床的特徴の観察で絞り込んでいく。病歴では旅行、環境曝露、アトピー性疾患の個人歴・家族歴などが手がかりになる。皮疹そのものについては、個々の皮疹の色、大きさ、形、鱗屑といった性状と、手掌・足底、顔面、爪、日光曝露部、四肢の屈側・伸側を含む分布と病変のない部位、痒みや痛みの有無、発熱などの全身症状、圧迫による退色やケブネル現象といった皮膚科学的徴候を記載・評価することが鑑別の助けになる。
    condition:
      region: 米国
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1200
    source: 'Ely JW, Seabury Stone M. The generalized rash: part II. Diagnostic approach. Am Fam Physician. 2010;81(6):735-739.'
    doi: null
    pmid: '20229972'
    pmcid: null
    url: https://pubmed.ncbi.nlm.nih.gov/20229972/
    source_license: © American Academy of Family Physicians（CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（CC BY 4.0（OPEN）、作り手の調査バッチ86 2026-11-15）：Elmehallawy GS, Alharbi RA, Kurdi SKA. Drug-Induced Cutaneous Reactions: A Clinically Oriented Review for Frontline Physicians. Cureus. 2026;18(2):e104176（PMID: 41909301、DOI: 10.7759/cureus.104176、PMCID: PMC13019655、https://creativecommons.org/licenses/by/4.0/）。裏づける部分：部分：発疹の評価が、曝露と発症の時間関係を確かめる病歴聴取と、病変の形態・分布・粘膜病変・発熱などの全身所見に重点を置く身体診察からなる構造化されたアプローチであることを再掲する。数値の照合：数値の主張なし。留保：候補は薬疹に特化した総説であり、手掌・足底、顔面、爪、日光曝露部、屈側・伸側といった分布の詳細、圧迫による退色やケブネル現象、アトピー歴・旅行歴といった主出典の個別要素は再掲なし。主出典は © American Academy of Family Physicians で CC 表示がなく、Europe PMC でも非OA・全文なし。現行 UNKNOWN は RESTRICTED への訂正対象（区分訂正の節参照）'
  uncertainty: Am Fam Physician は DOI を付与していないため DOI は null とし、PubMed レコードで書誌と PMID を確認した。本カードは2部構成の第2部（診断アプローチ）に基づき、個別疾患の鑑別表（第1部）は含めていない。
