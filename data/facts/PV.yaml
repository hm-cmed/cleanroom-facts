  subdomain: 心原性肺水腫
  assertion:
    plain_statement_ja: ERS/ATS の2017年の非侵襲的換気ガイドラインは、心原性肺水腫による急性呼吸不全に、バイレベル NIV または CPAP のいずれかを使うことを強く推奨した（エビデンスの確実性は中等度）。心原性ショックと急性冠症候群の患者はこの推奨の対象外である。
