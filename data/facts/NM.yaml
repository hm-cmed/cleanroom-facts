- id: NM-001
  domain: NM
  subdomain: 重症筋無力症
  assertion:
    plain_statement_ja: 重症筋無力症の筋力低下は、運動の反復で増悪し休息で回復する易疲労性と、朝に比べて夕方に悪化する日内変動を特徴とし、初発症状としては眼瞼下垂や複視などの眼症状が最も多い。
    condition:
      population: 重症筋無力症患者
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1761
    source: 日本神経学会（監修）, 「重症筋無力症／ランバート・イートン筋無力症候群診療ガイドライン」作成委員会（編）. 重症筋無力症／ランバート・イートン筋無力症候群診療ガイドライン2022. 南江堂; 2022
    doi: null
    pmid: null
    pmcid: null
    url: null
    source_license: 南江堂（CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 眼症状が初発となる割合の具体的な数値は資料により異なるため、本票では数値を記載していない。
  curriculum:
