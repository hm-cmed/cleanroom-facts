- id: NM-024
  domain: NM
  subdomain: 脊髄性筋萎縮症
  assertion:
    plain_statement_ja: ヌシネルセンはSMN2遺伝子のスプライシングを修飾して全長SMN蛋白の産生を増やすアンチセンス核酸であり、乳児型脊髄性筋萎縮症を対象としたENDEAR試験では、中間解析で運動マイルストーンの改善を示した乳児の割合が対照群より有意に高かった（41%対0%）。
    condition:
      population: 乳児型脊髄性筋萎縮症の乳児
      region: 国際
    differential: null
    common_misconception: null
  provenance:
