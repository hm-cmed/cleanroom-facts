- id: NM-017
  domain: NM
  subdomain: 筋ジストロフィー
  assertion:
    plain_statement_ja: 筋ジストロフィーでは、病気の進行に伴って生じる呼吸不全、心不全、不整脈および嚥下障害が生命予後に強く影響するため、呼吸機能と循環機能の定期的な評価と、補助呼吸管理や心保護療法などの適切な介入が予後を左右する。
