- id: NM-015
  domain: NM
  subdomain: 筋ジストロフィー
  assertion:
    plain_statement_ja: 筋ジストロフィーは、骨格筋に関連する蛋白質の遺伝子異常によって生じる遺伝性筋疾患の総称であり、病型によって遺伝形式（X連鎖性、常染色体優性、常染色体劣性など）、発症時期、進行速度が異なり、いずれの病型についても根本的な治療法は確立しておらず、対症療法と合併症管理が治療の中心である。
    condition:
      population: 筋ジストロフィー患者
      region: 日本
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-249
    source: 厚生労働省. 指定難病 113 筋ジストロフィー 概要、診断基準等（令和8年4月時点の掲載）
    doi: null
    pmid: null
    pmcid: null
    url: null
    source_license: 政府標準利用規約（厚生労働省ホームページ）
    legal_basis: B
    source_class: GOV_JP
    corroboration: null
  uncertainty: 病型ごとの責任遺伝子と臨床像の詳細は同資料の病型表および個別の診断基準を参照する。疾患修飾薬が承認された病型（Duchenne型の一部など）は例外であり、NM-018で扱う。
