- id: NM-018
  domain: NM
  subdomain: 筋ジストロフィー
  assertion:
    plain_statement_ja: ビルトラルセンはジストロフィン遺伝子のエクソン53のスキッピングを誘導するアンチセンス核酸であり、エクソン53スキッピングの対象となる欠失をもつDuchenne型筋ジストロフィーの男児を対象とした第2相試験では、20〜24週間の週1回静脈内投与後に、筋生検で正常の約6%に相当するジストロフィン産生（40 mg/kg群で5.7%、80 mg/kg群で5.9%）が確認された。
    condition:
      population: エクソン53スキッピングの対象となるジストロフィン遺伝子欠失をもつDuchenne型筋ジストロフィー患者
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1772
    source: 'Clemens PR, Engel WK, Connolly AM, et al. Safety, Tolerability, and Efficacy of Viltolarsen in Boys With Duchenne Muscular Dystrophy Amenable to Exon 53 Skipping: A Phase 2 Randomized Clinical Trial. JAMA Neurol. 2020;77(8):982-991'
    doi: 10.1001/jamaneurol.2020.1264
    pmid: '32453377'
    pmcid: null
    url: https://doi.org/10.1001/jamaneurol.2020.1264
    source_license: CC BY-NC-ND 4.0
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: ビルトラルセンは国内では2020年3月に条件付き早期承認制度により世界で初めて承認され、保険適用がある（対象は遺伝子検査でエクソン53スキッピングにより治療可能な欠失が確認された患者）。ナンセンス変異に対するリードスルー薬アタルレンは国内では承認されておらず、欧州でも有効性が確認されなかったとして条件付き承認の更新が見送られ、米国でも承認されていない。
  curriculum:
