- id: NM-013
  domain: NM
  subdomain: Lambert-Eaton筋無力症候群
  assertion:
    plain_statement_ja: Lambert-Eaton筋無力症候群は、シナプス前膜のP/Q型電位依存性カルシウムチャネルに対する自己抗体によりアセチルコリンの放出が障害される疾患で、下肢近位筋優位の筋力低下が短時間の随意運動で一時的に増強する現象（運動後促通）と自律神経症状を伴い、小細胞肺癌の合併が多い。
    condition:
      population: Lambert-Eaton筋無力症候群患者
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1761
