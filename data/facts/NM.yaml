- id: NM-027
  domain: NM
  subdomain: 先天性筋ジストロフィー
  assertion:
    plain_statement_ja: 先天性筋ジストロフィーは、出生時から乳児期早期に筋緊張低下（フロッピーインファント）と運動発達遅滞で発症する筋ジストロフィーの一群であり、日本ではフクチンをコードするFKTN遺伝子の変異による福山型が代表的で、筋症状に加えて脳の形成異常に伴う知的発達障害、けいれん発作、網膜病変などの眼合併症を伴う。
    condition:
      population: 先天性筋ジストロフィーの乳幼児（福山型を中心とする）
      region: 日本
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-249
    source: 厚生労働省. 指定難病 113 筋ジストロフィー 概要、診断基準等（令和8年4月時点の掲載）
    doi: null
    pmid: null
    pmcid: null
    url: null
    source_license: 政府標準利用規約（厚生労働省ホームページ）
    legal_basis: B
    source_class: GOV_JP
    corroboration: null
  uncertainty: 福山型は日本人に創始者変異が多く国外ではまれである。他の代表的病型にメロシン（ラミニンα2）欠損型（LAMA2遺伝子）などがある。根本治療はなく、呼吸・栄養・てんかん発作などの合併症管理が中心である。
  curriculum:
    kokushi: 医学各論 Ⅸ-11-B-①（先天性筋ジストロフィー、b）
