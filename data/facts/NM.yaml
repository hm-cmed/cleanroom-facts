    doi: null
    pmid: null
    pmcid: null
    url: null
    source_license: 南江堂（CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 小細胞肺癌の合併頻度の具体的な割合は資料により幅があるため、本票では数値を記載していない。診断時には合併腫瘍の検索を行い、腫瘍が見つかればその治療が筋症状の改善にもつながる。
