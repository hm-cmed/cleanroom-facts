- id: NM-021
  domain: NM
  subdomain: 周期性四肢麻痺
  assertion:
    plain_statement_ja: 原発性周期性四肢麻痺は、骨格筋のナトリウム・カルシウム・カリウムチャネル遺伝子の変異による常染色体優性遺伝疾患で、低カリウム性と高カリウム性があり、発作の予防には誘因の回避とカリウム調整に加えて炭酸脱水酵素阻害薬などが用いられ、甲状腺中毒性周期性四肢麻痺は甲状腺機能亢進症に伴う二次性の型である。
    condition:
      population: 周期性四肢麻痺患者
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1775
    source: Statland JM, Fontaine B, Hanna MG, et al. Review of the Diagnosis and Treatment of Periodic Paralysis. Muscle Nerve. 2018;57(4):522-530
    doi: 10.1002/mus.26009
    pmid: '29125635'
    pmcid: null
    url: https://doi.org/10.1002/mus.26009
    source_license: CC BY-NC-ND 4.0
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 発作時は血清カリウム値に応じた補正を行う。炭酸脱水酵素阻害薬（アセタゾラミド等）は国内承認薬だが、遺伝子型によっては発作が増悪する場合があり、個別の保険適用範囲は添付文書で確認する。
  curriculum:
    kokushi: 医学各論 Ⅸ-5-D-⑦（周期性四肢麻痺、b）
