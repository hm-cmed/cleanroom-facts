- id: NM-005
  domain: NM
  subdomain: 重症筋無力症
  assertion:
    plain_statement_ja: 胸腺腫を合併しない抗アセチルコリン受容体抗体陽性の全身型重症筋無力症（発症5年以内、18〜65歳）を対象としたMGTX試験では、拡大胸腺摘除術とプレドニゾンの併用群はプレドニゾン単独群より、3年間の時間加重平均QMGスコアが低く（6.15対8.99）、必要プレドニゾン量も少なかった（隔日投与で44 mg対60 mg）。
    condition:
      population: 胸腺腫を合併しない抗AChR抗体陽性全身型重症筋無力症患者（18〜65歳、発症5年以内）
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1763
    source: Wolfe GI, Kaminski HJ, Aban IB, et al. Randomized Trial of Thymectomy in Myasthenia Gravis. N Engl J Med. 2016;375(6):511-522
    doi: 10.1056/NEJMoa1602489
    pmid: '27509100'
    pmcid: null
    url: https://doi.org/10.1056/NEJMoa1602489
    source_license: NEJM（CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 対象は胸腺腫のない例であり、胸腺腫合併例や対象年齢外の患者への外挿には注意を要する。胸腺摘除術は国内でも保険適用のある外科治療である。
  curriculum:
    kokushi: 医学各論 Ⅸ-5-D-①（重症筋無力症、a）
    core_curriculum: 'PS-02-03-05 (id: JkxnuP0)；TBL-01-00-050 (id: JlvnleU)'
