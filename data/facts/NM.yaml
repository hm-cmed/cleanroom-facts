- id: NM-006
  domain: NM
  subdomain: 重症筋無力症
  assertion:
    plain_statement_ja: 終末補体（C5）阻害薬エクリズマブは、抗アセチルコリン受容体抗体陽性の難治性全身型重症筋無力症を対象としたREGAIN試験で評価され、主要評価項目であるMG-ADL総スコア変化の最悪順位解析ではプラセボとの有意差に至らなかった（p=0.0698）が、増悪をきたした患者の割合はエクリズマブ群の方が低かった（10%対24%）。
    condition:
      population: 抗AChR抗体陽性の難治性全身型重症筋無力症患者
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1764
    source: 'Howard JF Jr, Utsugisawa K, Benatar M, et al. Safety and efficacy of eculizumab in anti-acetylcholine receptor antibody-positive refractory generalised myasthenia gravis (REGAIN): a phase 3, randomised, double-blind, placebo-controlled, multicentre study. Lancet Neurol. 2017;16(12):976-986'
    doi: 10.1016/S1474-4422(17)30369-1
    pmid: '29066163'
    pmcid: null
    url: https://doi.org/10.1016/S1474-4422(17)30369-1
    source_license: Elsevier（テキストマイニング用ライセンスのみ、CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: 自由に使える資料による裏づけ（GOV_US、作り手の調査バッチ53 2026-11-13）：ClinicalTrials.gov 登録レコード NCT01997229（REGAIN）（GOV_US、https://clinicaltrials.gov/study/NCT01997229、新規 SRC 候補）。裏づける部分：登録レコードの結果セクションに主要評価項目（MG-ADL 総スコア変化の最悪順位解析）が収載され、非有意の結果が確認できる。数値の照合：p=0.0698 はカードと完全一致。増悪をきたした患者の割合 10% 対 24% は登録レコードに収載がなく裏づけ対象外。留保：主要評価項目の非有意というカードの中心的主張は登録で直接裏づけられる
  uncertainty: エクリズマブは国内では2017年に承認され、効能は抗AChR抗体陽性の全身型重症筋無力症のうち高用量の免疫グロブリン静注療法又は血漿交換療法による症状コントロールが困難な場合に限られる（保険適用あり）。投与に際して髄膜炎菌ワクチンの接種歴の確認が前提となる。
  curriculum:
    kokushi: 医学各論 Ⅸ-5-D-①（重症筋無力症、a）
