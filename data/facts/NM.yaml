- id: NM-004
  domain: NM
  subdomain: 重症筋無力症
  assertion:
    plain_statement_ja: 筋無力症クリーゼは球筋・呼吸筋の筋力低下により呼吸不全をきたす状態であり、気道確保と呼吸管理を行いながら、免疫グロブリン静注療法または血漿交換による速効性治療を実施する。国際コンセンサスガイダンスでは両者はクリーゼ治療の同等の選択肢と位置づけられている。
    condition:
      population: 筋無力症クリーゼを呈する重症筋無力症患者
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1762
    source: 'Narayanaswami P, Sanders DB, Wolfe G, et al. International Consensus Guidance for Management of Myasthenia Gravis: 2020 Update. Neurology. 2021;96(3):114-122'
    doi: 10.1212/WNL.0000000000011124
    pmid: '33144515'
    pmcid: null
    url: https://doi.org/10.1212/WNL.0000000000011124
    source_license: CC BY-NC-ND 4.0
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 免疫グロブリン製剤と血漿交換はいずれも国内で保険適用のある治療である。感染などの増悪誘因の検索と対応を並行して行う。
  curriculum:
    kokushi: 医学各論 Ⅸ-5-D-①（重症筋無力症、a）
