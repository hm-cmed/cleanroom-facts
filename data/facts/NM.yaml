- id: NM-016
  domain: NM
  subdomain: 筋ジストロフィー
  assertion:
    plain_statement_ja: Duchenne型筋ジストロフィーは、ジストロフィン遺伝子の変異によりジストロフィンが欠損するX連鎖性の疾患であり、副腎皮質ステロイドは歩行可能期間の延長などに有効な標準治療として位置づけられ、国際的なケア指針では診断後早期からの多職種による計画的な管理が推奨されている。
    condition:
      population: Duchenne型筋ジストロフィー患者
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1771
    source: 'Birnkrant DJ, Bushby K, Bann CM, et al. Diagnosis and management of Duchenne muscular dystrophy, part 1: diagnosis, and neuromuscular, rehabilitation, endocrine, and gastrointestinal management. Lancet Neurol. 2018;17(3):251-267'
    doi: 10.1016/S1474-4422(18)30024-3
    pmid: '29395989'
    pmcid: null
    url: https://doi.org/10.1016/S1474-4422(18)30024-3
    source_license: Elsevier（テキストマイニング用ライセンスのみ、CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: ステロイド（プレドニゾロン、デフラザコルト等）は国内承認薬で保険適用があるが、開始時期と用量は成長・骨・内分泌への影響とのバランスで個別に判断される。心筋・呼吸管理の詳細は同ケア指針の第2部で扱われ、本票ではNM-017で別に出典を引く。
