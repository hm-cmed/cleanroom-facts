- id: NM-009
  domain: NM
  subdomain: 重症筋無力症
  assertion:
    plain_statement_ja: 胎児性Fc受容体（FcRn）阻害薬ロザノリキシズマブは、抗アセチルコリン受容体抗体陽性または抗MuSK抗体陽性の全身型重症筋無力症を対象としたMycarinG試験において、43日目のMG-ADL総スコアの変化がプラセボより有意に大きかった（7 mg/kg群−3.37、10 mg/kg群−3.40、プラセボ群−0.78）。
    condition:
      population: 抗AChR抗体陽性または抗MuSK抗体陽性の全身型重症筋無力症の成人患者
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1767
    source: 'Bril V, Drużdż A, Grosskreutz J, et al. Safety and efficacy of rozanolixizumab in patients with generalised myasthenia gravis (MycarinG): a randomised, double-blind, placebo-controlled, adaptive phase 3 study. Lancet Neurol. 2023;22(5):383-394'
    doi: 10.1016/S1474-4422(23)00077-7
    pmid: '37059507'
    pmcid: null
    url: https://doi.org/10.1016/S1474-4422(23)00077-7
    source_license: Elsevier（テキストマイニング用ライセンスのみ、CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: ロザノリキシズマブは国内では2023年9月に承認され、効能は全身型重症筋無力症（ステロイド剤又はステロイド剤以外の免疫抑制剤が十分に奏効しない場合に限る）で、保険適用があり、週1回6週間の皮下投与を1サイクルとする。同じ2023年9月に補体C5阻害薬ジルコプランも同じ効能で国内承認されているが、本票では扱っていない。
