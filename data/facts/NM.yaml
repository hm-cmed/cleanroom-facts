- id: NM-008
  domain: NM
  subdomain: 重症筋無力症
  assertion:
    plain_statement_ja: 胎児性Fc受容体（FcRn）阻害薬エフガルチギモドは病原性IgGを含むIgGの分解を促進して血中濃度を低下させ、ADAPT試験では抗アセチルコリン受容体抗体陽性の全身型重症筋無力症において、初回治療サイクルのMG-ADLレスポンダーの割合がプラセボより高かった（68%対30%）。
    condition:
      population: 抗AChR抗体陽性全身型重症筋無力症の成人患者
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1766
    source: 'Howard JF Jr, Bril V, Vu T, et al. Safety, efficacy, and tolerability of efgartigimod in patients with generalised myasthenia gravis (ADAPT): a multicentre, randomised, double-blind, placebo-controlled, phase 3 trial. Lancet Neurol. 2021;20(7):526-536'
    doi: 10.1016/S1474-4422(21)00159-9
    pmid: '34146511'
    pmcid: null
    url: https://doi.org/10.1016/S1474-4422(21)00159-9
    source_license: Elsevier（テキストマイニング用ライセンスのみ、CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: エフガルチギモドは国内では2022年1月に承認され、効能は全身型重症筋無力症（ステロイド剤又はステロイド剤以外の免疫抑制剤が十分に奏効しない場合に限る）で、保険適用がある。国内の効能は抗体の陽性・陰性を問わない点が補体阻害薬と異なる。
