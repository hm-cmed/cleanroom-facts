- id: NM-002
  domain: NM
  subdomain: 重症筋無力症
  assertion:
    plain_statement_ja: 重症筋無力症の診断では、抗アセチルコリン受容体抗体や抗MuSK抗体などの自己抗体測定に加え、反復神経刺激試験における漸減現象（waning）や単線維筋電図のジッター増大といった電気生理学的所見、エドロホニウム試験などの薬理学的試験を組み合わせて評価する。
    condition:
      population: 重症筋無力症が疑われる患者
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1761
    source: 日本神経学会（監修）, 「重症筋無力症／ランバート・イートン筋無力症候群診療ガイドライン」作成委員会（編）. 重症筋無力症／ランバート・イートン筋無力症候群診療ガイドライン2022. 南江堂; 2022
    doi: null
    pmid: null
    pmcid: null
    url: null
    source_license: 南江堂（CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 抗MuSK抗体陽性例では球症状が目立ち胸腺腫の合併がまれであるなど、抗体ごとに臨床像が異なる。抗体陰性例でも電気生理学的所見などから診断しうる。
  curriculum:
    kokushi: 医学各論 Ⅸ-5-D-①（重症筋無力症、a）
