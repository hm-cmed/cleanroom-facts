  subdomain: 内分泌・代謝性ミオパチー
  assertion:
    plain_statement_ja: 内分泌・代謝性ミオパチーは筋症状の型（パターン）として把握すべきものであり、甲状腺機能低下症では浮腫やクレアチンキナーゼ上昇を伴う筋症状を、甲状腺機能亢進症・副甲状腺機能異常・糖質コルチコイド過剰（ステロイドミオパチーを含む）では近位筋優位の筋力低下を呈し、いずれも原因となるホルモン異常を是正することで改善しうる。
    condition:
      population: 内分泌疾患に伴う筋症状を呈する患者
