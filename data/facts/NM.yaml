- id: NM-023
  domain: NM
  subdomain: 脊髄性筋萎縮症
  assertion:
    plain_statement_ja: 脊髄性筋萎縮症は、SMN1遺伝子の欠失・変異により生存運動ニューロン（SMN）蛋白が不足する常染色体劣性遺伝疾患であり、発症時期と到達した運動マイルストーンによって型分類され、診断は遺伝子検査で確定し、国際的な標準ケア指針では多職種による管理が推奨されている。
    condition:
      population: 脊髄性筋萎縮症患者
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1777
    source: 'Mercuri E, Finkel RS, Muntoni F, et al. Diagnosis and management of spinal muscular atrophy: Part 1: Recommendations for diagnosis, rehabilitation, orthopedic and nutritional care. Neuromuscul Disord. 2018;28(2):103-115'
    doi: 10.1016/j.nmd.2017.11.005
    pmid: '29290580'
    pmcid: null
    url: https://doi.org/10.1016/j.nmd.2017.11.005
    source_license: CC BY-NC-ND 4.0
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ53 2026-11-13）：Belančić A, Maria Gkrinia EM, Lam YW, Vitezić D. Therapeutic advances in spinal muscular atrophy: a review of clinical, safety, and economic considerations. Frontiers in Pharmacology. 2026;17（CC BY、PMID 42807701、DOI 10.3389/fphar.2026.1793581、PMC13617402、新規 SRC 候補）。裏づける部分：SMN1 遺伝子のホモ接合性欠失・変異による SMN 蛋白の不足、常染色体劣性遺伝、発症時期による型のスペクトラム（出生前・乳児期発症の0〜1型から成人発症の4型）、多職種ケアの重要性を記載。数値の照合：数値なし。留保：「診断は遺伝子検査で確定」の明示は同総説では間接的（新生児スクリーニングと遺伝子診断の文脈）であり、この点は留保。国内の新生児スクリーニング実施状況はカード側でも未確認のまま（フラグ5）'
  uncertainty: 重症度はSMN2遺伝子のコピー数と相関する。発症前治療の根拠となる新生児スクリーニングの国内実施状況は本作成では確認していない。
