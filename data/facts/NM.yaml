- id: NM-022
  domain: NM
  subdomain: 内分泌・代謝性ミオパチー
  assertion:
    plain_statement_ja: 内分泌・代謝性ミオパチーは筋症状の型（パターン）として把握すべきものであり、甲状腺機能低下症では浮腫やクレアチンキナーゼ上昇を伴う筋症状を、甲状腺機能亢進症・副甲状腺機能異常・糖質コルチコイド過剰（ステロイドミオパチーを含む）では近位筋優位の筋力低下を呈し、いずれも原因となるホルモン異常を是正することで改善しうる。
    condition:
      population: 内分泌疾患に伴う筋症状を呈する患者
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1776
    source: 'Rodolico C, Bonanno C, Pugliese A, et al. Endocrine myopathies: clinical and histopathological features of the major forms. Acta Myol. 2020;39(3):130-135'
    doi: 10.36185/2532-1900-017
    pmid: '33305169'
    pmcid: null
    url: https://doi.org/10.36185/2532-1900-017
    source_license: CC BY-NC-ND 4.0
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 本票は筋症状のパターンのみを扱い、個別の内分泌疾患の診断・治療そのものは扱わない。ステロイドミオパチーでは炎症性筋疾患と異なり筋原性酵素の上昇を伴わないことが多い点が鑑別の手がかりとなる。 本カードのステロイドは原因薬としての言及であり、治療適応の推奨ではない。
  curriculum:
    kokushi: 医学各論 Ⅸ-5-D-⑥（内分泌・代謝性ミオパチー、b）
