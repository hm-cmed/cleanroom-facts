- id: NM-026
  domain: NM
  subdomain: 脊髄性筋萎縮症
  assertion:
    plain_statement_ja: オナセムノゲン アベパルボベクは、アデノ随伴ウイルス9型ベクターを用いてSMN1遺伝子を補充する単回静脈内投与の遺伝子治療であり、1型脊髄性筋萎縮症の乳児15例を対象とした初期の試験では、全例が20か月時点で死亡または永続的換気の導入を回避し、高用量群12例中11例が支持なしで座位を保持できるようになった。
    condition:
