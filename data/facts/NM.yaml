    doi: 10.1136/annrheumdis-2017-211468
    pmid: '29079590'
    pmcid: null
    url: https://doi.org/10.1136/annrheumdis-2017-211468
    source_license: BMJ（テキストマイニング用ライセンスのみ、CC表示なし）
