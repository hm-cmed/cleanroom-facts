  assertion:
    plain_statement_ja: リスジプラムは経口投与されるSMN2スプライシング修飾薬であり、1型脊髄性筋萎縮症の乳児を対象としたFIREFISH試験第2部では、12か月の治療後に支持なしで5秒以上座位を保持できた乳児が29%に達し、これは1型脊髄性筋萎縮症の自然経過では到達しない運動マイルストーンである。
    condition:
