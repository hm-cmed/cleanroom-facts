- id: NM-019
  domain: NM
  subdomain: 筋強直性ジストロフィー
  assertion:
    plain_statement_ja: 筋強直性ジストロフィー1型は、DMPK遺伝子のCTGリピート伸長を原因とする常染色体優性遺伝疾患で、リピートが世代を経て伸長する表現促進を示し、ミオトニアと進行性の筋力低下に加えて、心伝導障害、白内障、耐糖能異常などの多臓器障害を伴う。
