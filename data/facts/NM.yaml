    doi: 10.1056/NEJMoa1702752
    pmid: '29091570'
    pmcid: null
    url: https://doi.org/10.1056/NEJMoa1702752
    source_license: NEJM（CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: ヌシネルセンは国内では2017年7月に承認され、保険適用があり、髄腔内投与を反復する。現在の国内の効能は脊髄性筋萎縮症全般（乳児型以外および遺伝子検査で発症が予測される未発症例を含む）に拡大されている。
