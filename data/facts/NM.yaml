- id: NM-003
  domain: NM
  subdomain: 重症筋無力症
  assertion:
    plain_statement_ja: 重症筋無力症の治療は、コリンエステラーゼ阻害薬による対症療法と、副腎皮質ステロイドや免疫抑制薬による免疫療法を組み合わせて行い、国際コンセンサスガイダンスでは臨床病型と重症度に応じた免疫療法の選択が示されている。
    condition:
      population: 重症筋無力症患者
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1762
    source: 'Narayanaswami P, Sanders DB, Wolfe G, et al. International Consensus Guidance for Management of Myasthenia Gravis: 2020 Update. Neurology. 2021;96(3):114-122'
    doi: 10.1212/WNL.0000000000011124
    pmid: '33144515'
    pmcid: null
    url: https://doi.org/10.1212/WNL.0000000000011124
    source_license: CC BY-NC-ND 4.0
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ53 2026-11-13）：Gerede A, et al. Myasthenia Gravis in Pregnancy: Prenatal and Postnatal Diagnostic Challenges—A Narrative Review. Diagnostics. 2026;16(6)（補助：Takahashi S, Kinno R. Neurology International. 2025;17(10)）（CC BY、PMID 41897632、DOI 10.3390/diagnostics16060899、PMC13024954、新規 SRC 候補）。裏づける部分：アセチルコリンエステラーゼ阻害薬がほぼ全例に用いられ、より重症例ではステロイドや免疫抑制薬を用いる治療構成が総説本文に記載。補助候補も「治療はステロイドと免疫抑制薬による免疫調節療法が中心」と記載。数値の照合：数値なし。留保：「国際コンセンサスガイダンスでは臨床病型・重症度に応じて選択」との帰属部分自体は候補資料の裏づけ対象外で、治療枠組みの再述にとどまる'
  uncertainty: コリンエステラーゼ阻害薬（ピリドスチグミン等）とステロイド・免疫抑制薬はいずれも国内承認薬で保険適用がある。具体的な用量と漸増法は国内ガイドライン（SRC-1761）と添付文書に従う。国内ガイドライン2022では早期からの速効性治療の併用も示されている。
  curriculum:
    kokushi: 医学各論 Ⅸ-5-D-①（重症筋無力症、a）
