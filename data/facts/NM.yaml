    doi: 10.1056/NEJMoa1706198
    pmid: '29091557'
    pmcid: null
    url: https://doi.org/10.1056/NEJMoa1706198
    source_license: NEJM（CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: オナセムノゲン アベパルボベクは国内では2020年3月に2歳未満の脊髄性筋萎縮症を対象として承認された再生医療等製品で、保険適用がある。投与前後に肝機能障害への対応として副腎皮質ステロイドの併用とモニタリングが行われる。
