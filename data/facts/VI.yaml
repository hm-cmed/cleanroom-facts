- id: VI-011
  domain: VI
  subdomain: 麻疹
  assertion:
    plain_statement_ja: 日本は2015年3月に WHO による麻疹の排除達成の認定を受けた。排除後の年間届出数は、2019年に744例と排除後最多となった後、2023年28例、2024年45例、2025年265例（2026年3月18日時点の暫定値）と推移しており、2023年以降の国内発生は海外輸入例を発端とした二次感染例が中心である。麻疹は感染症法の5類感染症で、全数把握の対象である。
    condition:
      region: 日本
      対象: 小児・成人
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2020
    source: 国立感染症研究所（国立健康危機管理研究機構）. 麻しんの発生に関するリスクアセスメント（2026年第一版）. 2026.
    doi: null
    pmid: null
    pmcid: null
    url: https://id-info.jihs.go.jp/risk-assessment/measles/measles_ra_2026_1.pdf
    source_license: 日本の公的資料
    legal_basis: B
    source_class: GOV_JP
    corroboration: null
  uncertainty: 2025年の265例は暫定値であり、確定値では変わりうる。数値は原資料（2026年第一版、2026年3月19日時点の記載）を実際に開いて再確認した。2026年に入ってからも報告は増えており、最新の届出数は本カードの範囲外である。
