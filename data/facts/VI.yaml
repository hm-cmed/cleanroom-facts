- id: VI-026
  domain: VI
  subdomain: サイトメガロウイルス感染症
  assertion:
    plain_statement_ja: 先天性サイトメガロウイルス感染症は先進国で最も頻度の高い先天性感染症であり、日本では2023年に国内初の診療ガイドラインが刊行された。バルガンシクロビル治療の対象は中等度・重度の症候性先天性サイトメガロウイルス感染症が妥当とされ、治療開始時期は生後2か月以内が妥当とされている。
