- id: VI-001
  domain: VI
  subdomain: インフルエンザ
  assertion:
    plain_statement_ja: 季節性インフルエンザは A 型・B 型インフルエンザウイルスによる流行性疾患で、世界的に大きな疾病負担をもたらす。多くの患者は呼吸器症状と筋肉痛（発熱の有無を問わない）の突然の発症から1週間以内に回復するが、一部は重症・致死的合併症を起こす。予防の中心は毎年のワクチン接種である。
    condition:
      region: 国際
      対象: 小児・成人
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2011
    source: Uyeki TM, Hui DS, Zambon M, Wentworth DE, et al. Influenza. Lancet. 2022;400(10353):693-706.
    doi: 10.1016/S0140-6736(22)00982-5
    pmid: '36030813'
    pmcid: null
    url: https://doi.org/10.1016/S0140-6736(22)00982-5
    source_license: CC表示なし（Crossref の license 欄は TDM ライセンスのみ）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 本文は未確認で、主張は抄録で確認できた範囲に限った。世界のインフルエンザ関連呼吸器死亡の推計値（WHO）は一次資料で直接確認できていないため主張に入れていない。国内ではインフルエンザワクチンは承認されており、高齢者などを対象とする定期接種の対象がある。
