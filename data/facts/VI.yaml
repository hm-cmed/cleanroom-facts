- id: VI-004
  domain: VI
  subdomain: RSウイルス感染症
  assertion:
    plain_statement_ja: RSウイルスは小児の急性下気道感染の最も多い原因である。2019年の世界推計では、5歳未満児で RSウイルス関連急性下気道感染が3,300万エピソード、入院が360万件、RSウイルス起因の総死亡が101,400人と推定され、エピソードの95%超と死亡の97%超が低・中所得国で発生した。
