    doi: 10.1097/INF.0000000000004489
    pmid: '39079035'
    pmcid: null
    url: https://doi.org/10.1097/INF.0000000000004489
    source_license: Wolters Kluwer; CC表示なし
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: バルガンシクロビル（バリキサドライシロップ）は2023年3月27日に「症候性先天性サイトメガロウイルス感染症」の適応が追加承認され、保険適用で治療できることを製薬企業の公表資料と医薬品部会資料で確認した。日本の先天性サイトメガロウイルス感染症の頻度（出生の約0.3%）は公表資料レベルの数値で、一次資料では未確認のため主張には含めていない。
