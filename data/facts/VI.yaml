  subdomain: インフルエンザ
  assertion:
    plain_statement_ja: 重症インフルエンザの入院患者を対象とするランダム化比較試験のネットワークメタ解析では、オセルタミビルは入院期間を平均1.63日、ペラミビルは平均1.73日短縮したが、オセルタミビル・ペラミビル・ザナミビルの死亡への効果の確実性は非常に低いと評価された。
