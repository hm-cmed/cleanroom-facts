- id: VI-005
  domain: VI
  subdomain: RSウイルス感染症
  assertion:
    plain_statement_ja: ニルセビマブの単回筋肉内投与（体重5kg未満は50mg、5kg以上は100mg）は、第2b相試験と MELODY 試験の統合解析で、受診を要する RSウイルス下気道感染を79.5%（相対リスク減少、95% CI 65.9–87.7）、RSウイルス下気道感染による入院を77.3%（95% CI 50.3–89.7）減少させた。慢性肺疾患・先天性心疾患のある児や極早産児への有効性は、薬物動態データによる外挿が支持された。
    condition:
      region: 国際
      対象: 乳幼児
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2015
    source: 'Simões EAF, Madhi SA, Muller WJ, et al. Efficacy of nirsevimab against respiratory syncytial virus lower respiratory tract infections in preterm and term infants, and pharmacokinetic extrapolation to infants with congenital heart disease and chronic lung disease: a pooled analysis of randomised controlled trials. Lancet Child Adolesc Health. 2023;7(3):180-189.'
    doi: 10.1016/S2352-4642(22)00321-2
    pmid: '36634694'
    pmcid: null
    url: https://doi.org/10.1016/S2352-4642(22)00321-2
    source_license: CC表示なし（Crossref の license 欄で確認）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 国内承認・保険適用：ニルセビマブ（ベイフォータス）は国内で製造販売承認を受け2024年5月22日に薬価収載されたが、保険給付は重症化リスクの高い乳幼児に限られる（国内状況の詳細は VI-006）。MELODY 試験単独では、入院に対する有効性は62.1%で統計学的に有意ではなかった（95% CI −8.6～86.8、P=0.07）。
