    source: 'Wu H, Wang F, Tang D, Han D. Mumps Orchitis: Clinical Aspects and Mechanisms. Front Immunol. 2021;12:582946.'
    doi: 10.3389/fimmu.2021.582946
    pmid: '33815357'
    pmcid: null
    url: https://doi.org/10.3389/fimmu.2021.582946
    source_license: CC BY（Frontiers）
    legal_basis: B
    source_class: OPEN
    corroboration: null
  uncertainty: 精巣炎の頻度そのものの数値は抄録にはなく本文も未確認のため、主張に入れていない。卵巣炎・膵炎など他の合併症の頻度も同様に未確認である。日本ではムンプスワクチンは任意接種であり、定期接種には含まれていない。
