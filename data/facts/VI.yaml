- id: VI-008
  domain: VI
  subdomain: 流行性耳下腺炎
  assertion:
    plain_statement_ja: ムンプスウイルスは一本鎖・非分節・負センス RNA ウイルスで、パラミクソウイルス科に属する。精巣炎は唾液腺以外の炎症として最も多く、若年成人男性に多い。小児へのワクチン接種は、ムンプスの発症率の低下に高い効果が確認されている。
    condition:
      region: 国際
      対象: 成人
    differential: null
    common_misconception: null
  provenance:
