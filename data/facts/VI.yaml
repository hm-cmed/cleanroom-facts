- id: VI-002
  domain: VI
  subdomain: インフルエンザ
  assertion:
    plain_statement_ja: 成人のインフルエンザに対するオセルタミビル（75mg 1日2回）の投与は、プラセボに比べて全症状消失までの時間を21%短縮し（時間比 0.79、95% CI 0.74–0.85、中央値 97.5時間 対 122.7時間）、抗菌薬を要する下気道合併症を減らした（リスク比 0.56、95% CI 0.42–0.75）。
    condition:
      region: 国際
      対象: 成人
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2012
    source: 'Dobson J, Whitley RJ, Pocock S, Monto AS. Oseltamivir treatment for influenza in adults: a meta-analysis of randomised controlled trials. Lancet. 2015;385(9979):1729-1737.'
    doi: 10.1016/S0140-6736(14)62449-1
    pmid: '25640810'
    pmcid: null
    url: https://doi.org/10.1016/S0140-6736(14)62449-1
    source_license: CC表示なし（Crossref の license 欄は TDM ライセンスのみ）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 国内承認・保険適用：オセルタミビル（タミフル）は国内承認（2000年12月）・保険適用（2001年2月）あり（厚生労働省・中医協資料で確認）。本解析はロシュ社スポンサーの二重盲検 RCT 9件・4,328人の個人データ解析であり、数値は抄録で確認した。
