- id: VI-012
  domain: VI
  subdomain: 風疹
  assertion:
    plain_statement_ja: 先天性風疹症候群（CRS）は、世界で年間約10万例が発生すると推計される。風疹含有ワクチンは有効性・安全性が高く、南北アメリカでは2009年以降、風疹の土着性伝播が中断している。一方、接種プログラムが不完全な地域では伝播が続き、日本を含む近年の大規模流行がその証拠として挙げられている。
    condition:
      region: 国際
      対象: 妊婦
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2021
    source: Lambert N, Strebel P, Orenstein W, Icenogle J, Poland GA. Rubella. Lancet. 2015;385(9984):2297-2307.
    doi: 10.1016/S0140-6736(14)60539-0
    pmid: '25576992'
    pmcid: null
    url: https://doi.org/10.1016/S0140-6736(14)60539-0
    source_license: CC表示なし（Crossref の license 欄は TDM ライセンスのみ）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 妊娠週数ごとの CRS 発症リスクは抄録で確認できず、主張に入れていない。本カードは病原体・感染経路・予防の原則に絞り、妊婦のスクリーニングや管理の詳細は扱わない（医学各論 Ⅰ の範囲）。風疹含有ワクチンは国内で承認され、定期接種に含まれている。
