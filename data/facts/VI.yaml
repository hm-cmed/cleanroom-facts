- id: VI-009
  domain: VI
  subdomain: 麻疹
  assertion:
    plain_statement_ja: 麻疹は今なお世界で年間10万人超の死亡の原因となっている（ワクチン普及前は年間200万人超の死亡）。呼吸器経路で感染し、発熱・咳・鼻炎・結膜炎に続いて特徴的な発疹が現れる。合併症は多くの臓器に及び、肺炎が麻疹関連の罹患・死亡の大部分を占める。患者管理にはビタミン A の投与が含まれ、予防はワクチン接種が最善である。
    condition:
      region: 国際
      対象: 小児
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2018
    source: Moss WJ. Measles. Lancet. 2017;390(10111):2490-2502.
    doi: 10.1016/S0140-6736(17)31463-0
    pmid: '28673424'
    pmcid: null
    url: https://doi.org/10.1016/S0140-6736(17)31463-0
    source_license: CC表示なし（Crossref の license 欄は TDM ライセンスのみ）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 数値と記載は抄録で確認した範囲に限った。亜急性硬化性全脳炎（SSPE）の詳細は NI-026 で作成済みのため本カードでは扱わない。基本再生産数など感染力の定量は抄録で確認できず、主張に入れていない。麻疹含有ワクチンは国内で承認され定期接種である。ビタミンAの麻疹への投与は出典の記載に基づくもので、国内での適応・保険適用は未確認である。
