- id: VI-022
  domain: VI
  subdomain: Epstein-Barrウイルス感染症
  assertion:
    plain_statement_ja: Epstein-Barrウイルスは世界の成人の約90%が感染しており、伝染性単核症の主因である。潜伏期は約6週間と長く、青年期の主な感染源は唾液である。伝染性単核症ではリンパ球増多、咽頭痛、リンパ節腫脹、疲労が数週間続き、長期的な帰結として上咽頭癌やリンパ腫がある。
