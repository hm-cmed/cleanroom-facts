- id: VI-023
  domain: VI
  subdomain: Epstein-Barrウイルス感染症
  assertion:
    plain_statement_ja: 伝染性単核症の初期検査では、リンパ球40%超・異型リンパ球10%超の確認と迅速異好抗体テストが有用で、異好抗体テストの感度は87%、特異度は91%である。治療は対症療法が中心で、抗ウイルス薬と副腎皮質ステロイドのルーチン使用は推奨されず、脾損傷の予防のため発症から3週間は競技への参加を避ける。
