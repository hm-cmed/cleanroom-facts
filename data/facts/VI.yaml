    pmid: '35598608'
    pmcid: null
    url: https://doi.org/10.1016/S0140-6736(22)00478-0
    source_license: CC BY 4.0（Crossref の license 欄と抄録の表記で確認）
    legal_basis: B
    source_class: OPEN
    corroboration: null
  uncertainty: 数値は抄録で確認した2019年の推計値で、不確実性範囲を伴う。日本国内の定点報告数・季節性の最新値は未確認で、主張に入れていない。
