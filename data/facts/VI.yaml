- id: VI-013
  domain: VI
  subdomain: 風疹
  assertion:
    plain_statement_ja: 日本では、2013年に14,344例の風疹患者が届出された大流行の後、2018〜2019年にも各年2,000例を超える流行が発生し、2019年には20歳以上が患者の約94%を占めた。流行に伴って先天性風疹症候群（CRS）の届出も増え、2019〜2021年に6例が届出されたが、2021年第3週以降は届出がない。風疹と CRS はいずれも感染症法の5類感染症で、全数把握の対象である。
