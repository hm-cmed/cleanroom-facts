- id: VI-010
  domain: VI
  subdomain: 麻疹
  assertion:
    plain_statement_ja: 米国の ACIP 勧告では、麻疹・風疹・先天性風疹症候群・ムンプスの予防に MMR ワクチンが用いられ、小児には定期2回接種（1回目は生後12〜15か月、2回目は4〜6歳）が、風疹の予防には生後12か月以上の者への1回接種が推奨されている。
    condition:
      region: 米国
      対象: 小児
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2019
    source: 'McLean HQ, Fiebelkorn AP, Temte JL, Wallace GS. Prevention of measles, rubella, congenital rubella syndrome, and mumps, 2013: summary recommendations of the Advisory Committee on Immunization Practices (ACIP). MMWR Recomm Rep. 2013;62(RR-04):1-34.'
    doi: null
    pmid: '23760231'
    pmcid: null
    url: https://www.cdc.gov/mmwr/preview/mmwrhtml/rr6204a1.htm
    source_license: 米国政府資料
    legal_basis: B
    source_class: GOV_US
    corroboration: null
  uncertainty: この勧告集成には2015年に訂正（MMWR Recomm Rep. 2015;64(9):259）が出ている。日本の MR ワクチン定期接種とは制度・時期の枠組みが異なるため、地域を米国として分けた。曝露後予防などの個別の推奨文は本文未確認で、主張に入れていない。
