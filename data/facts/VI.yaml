    pmcid: null
    url: https://www.jpeds.or.jp/uploads/files/20240522Beyfortus_GL.pdf
    source_license: CC表示なし（学会資料）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 製造販売承認は2024年3月26日（同文書および関連資料で確認）。米国では ACIP が2023年に乳児へのニルセビマブ使用を推奨しており（既存出典 SRC-351）、全乳児を対象とする米国の推奨と、日本の保険給付の範囲は異なる。クレスロビマブの国内承認の情報は一次資料で確認できていないため主張に入れていない。同文書には改訂版（2025年）があり、保険給付の範囲は今後変わりうる。
