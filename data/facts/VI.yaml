- id: VI-007
  domain: VI
  subdomain: 流行性耳下腺炎
  assertion:
    plain_statement_ja: 流行性耳下腺炎（ムンプス）の病原体はパラミクソウイルス（Rubulavirus 属）で、唾液との直接接触と呼吸器飛沫により伝播する。潜伏期間は平均16〜18日（範囲12〜25日）で、感染性のある期間は耳下腺腫脹の発症2日前から5日後までとされ、発症後5日間の隔離がとられる。診断は口腔（頬部）スワブの RT-PCR が主で、IgM 抗体も補助に使われる。米国ではワクチン導入前に年約186,000例が報告されたが、MMR ワクチン2回接種の定期接種化後に症例は99%減少した。
    condition:
      region: 米国
      対象: 小児
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2017
    source: Centers for Disease Control and Prevention. Clinical Overview of Mumps. CDC 公式ウェブページ（2025年1月17日版）.
    doi: null
    pmid: null
    pmcid: null
    url: null
    source_license: 米国政府資料
    legal_basis: B
    source_class: GOV_US
    corroboration: null
  uncertainty: ウェブページは版により内容が更新されうるため、版の日付を出典に明記した。日本ではムンプスワクチンは定期接種ではなく任意接種であり、米国の定期2回接種とは制度が異なる（国内制度は厚生労働省資料で確認。日本の流行状況そのものは本カードでは扱わない）。合併症の頻度の数値は本ページでは確認しておらず、主張に入れていない。
  curriculum:
    kokushi: 医学各論 Ⅻ-1-A-③（流行性耳下腺炎<ムンプス>、a）
    core_curriculum: 'PS-03-03-01 (id: JkxnuUg)；PS-03-03-16 (id: JkxnuVc)；TBL-01-00-612 (id: JlvnmZU)'
