- id: VI-006
  domain: VI
  subdomain: RSウイルス感染症
  assertion:
    plain_statement_ja: 日本では、ニルセビマブ（ベイフォータス）は2024年5月22日に薬価収載され使用可能となった。適応にはリスクのない新生児・乳児を含むが、保険給付は「生後初回または2回目の RSウイルス感染流行期の重篤な RSウイルス感染症のリスクを有する新生児、乳児および幼児における、RSウイルス感染による下気道疾患の発症抑制」に限られ、リスクのない児への予防は保険給付の対象外である。薬価は50mgシリンジ459,147円、100mgシリンジ906,302円である。
    condition:
