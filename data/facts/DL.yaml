- id: DL-022
  domain: DL
  subdomain: 子宮復古不全、産褥熱
  assertion:
    plain_statement_ja: 産褥子宮内膜炎の抗菌薬治療では、クリンダマイシンとアミノグリコシド（ゲンタマイシン）の併用が適切であり、治療失敗はセファロスポリン系との比較で相対リスク0.69、ペニシリン系との比較で相対リスク0.65であった（42試験・4,240人）。静注で改善した単純性子宮内膜炎に経口抗菌薬を追加する利益は証明されていない
    condition:
      region: 国際
      対象: 産褥子宮内膜炎の女性
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3283
    source: Mackeen AD, et al. Antibiotic regimens for postpartum endometritis. Cochrane Database Syst Rev. 2015;(2):CD001067
    doi: 10.1002/14651858.CD001067.pub3
    pmid: '25922861'
    pmcid: PMC7050613
    url: https://doi.org/10.1002/14651858.CD001067.pub3
    source_license: © Cochrane Collaboration（CC 表示なし）
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: クリンダマイシン・ゲンタマイシンの国内承認自体は一般的だが、「産褥子宮内膜炎」としての適応の明記は未確認。産褥子宮内膜炎は腟内細菌叢が分娩過程で子宮内膜腔へ侵入して起こり帝王切開後に多いとされるが、頻度（経腟分娩の最大3%、帝王切開の最大27%）は臨床要約の引用値で一次資料が未照合のため主張に入れていない
