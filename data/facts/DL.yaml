- id: DL-007
  domain: DL
  subdomain: 不正軸進入
  assertion:
    plain_statement_ja: 不正軸進入（asynclitism）は分娩中の胎児頭の斜めの異常位置であり、軽度のものは骨盤径への適応として通常みられるが、著明なものは遷延・閉塞性分娩、器械分娩、帝王切開の原因のひとつとなり、横方位・後頭後方位などの胎頭異常位置に伴うことが多い。内診による従来の診断はバイアスが大きく、分娩時超音波（経腹・経会陰）の方が正確であることを示す証拠が蓄積している
    condition:
      region: 国際
      対象: 分娩中の女性
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3269
    source: 'Malvasi A, et al. Asynclitism and Its Ultrasonographic Rediscovery in Labor Room to Date: A Systematic Review. Diagnostics (Basel). 2022;12(12):2998'
    doi: 10.3390/diagnostics12122998
    pmid: '36553005'
    pmcid: PMC9776610
    url: https://doi.org/10.3390/diagnostics12122998
    source_license: CC BY（PMC 本文で確認）
    legal_basis: B
    source_class: OPEN
    corroboration: null
  uncertainty: 日本語の「不正軸進入」と asynclitism の用語対応は本総説（および Malvasi 2015 の定義）に基づく。国内ガイドラインで不正軸進入を正面から扱う資料は確認できなかった
  curriculum:
    kokushi: 医学各論 Ⅰ-2-E-②（不正軸進入、c）
    core_curriculum: 'PS-02-11-05 (id: JkxnuSU)'
