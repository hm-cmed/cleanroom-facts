  assertion:
    plain_statement_ja: 産後出血に対するトラネキサム酸1 g静注は、出血による死亡を減らした（トラネキサム酸群1.5%対プラセボ群1.9%、相対リスク0.81）。効果は出生後3時間以内の投与で大きく（相対リスク0.69）、子宮摘出は減らなかった。有害事象の増加は認められなかった（WOMAN試験、21か国193施設、20,060人）
