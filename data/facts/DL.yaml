- id: DL-008
  domain: DL
  subdomain: 臍帯下垂、臍帯脱出
  assertion:
    plain_statement_ja: 臍帯脱出の発生率は全分娩の0.1〜0.6%で、非頭位・多胎・早産で高く、人工破膜などの医原性が最大で約50%を占める。診断後は分娩を急ぐのが原則で、通常は帝王切開とし、診断から分娩までの間隔は30分未満が理想とされる。分娩までの間、臍帯圧迫の解除には用手による先進部の挙上と膀胱充満（500〜700 mL）を用い、臍帯の過度の操作は血管攣縮を招くため避ける
    condition:
      region: 国際
      対象: 分娩中・破水後の女性
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3270
    source: Sayed Ahmed WA, Hamdy MA. Optimal management of umbilical cord prolapse. Int J Womens Health. 2018;10:459-465
    doi: 10.2147/IJWH.S130879
    pmid: '30174462'
    pmcid: PMC6109652
    url: https://doi.org/10.2147/IJWH.S130879
    source_license: CC BY-NC 3.0（PMC 本文で確認）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 用語対応は本論文の定義に基づく（cord presentation が臍帯下垂に相当し破水の有無を問わない、prolapse が臍帯脱出）。国内の定義（破水の有無による区別）と完全一致するかは国内資料で未確認。診断から分娩まで30分未満という目標は RCOG Green-top Guideline No. 50（2014）の推奨として本論文が引用したもので、同ガイドライン自体の現行性は未確認のため出典にはしていない。横位・斜位・不安定胎位では37週0日以降の入院を協議するという予防の接点も同ガイドラインに基づく
  curriculum:
    kokushi: 医学各論 Ⅰ-2-G-①（臍帯下垂、臍帯脱出、c）
    core_curriculum: 'PS-02-11-04 (id: JkxnuSQ)；PS-02-11-05 (id: JkxnuSU)'
