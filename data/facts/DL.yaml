- id: DL-009
  domain: DL
  subdomain: 遷延分娩、分娩停止、肩甲難産
  assertion:
    plain_statement_ja: 分娩第1期活動期の停止は、子宮口6 cm以上開大し破水している状態で、十分な子宮収縮のもと4時間、またはオキシトシン増強下で収縮が不十分なまま6時間、頸管開大が進まないことと定義される（ACOG分娩管理ガイドライン、2024）。分娩第2期遷延の目安は、努責が未産婦で3時間を超える場合、経産婦で2時間を超える場合である
    condition:
      region: 米国
      対象: 分娩中の女性
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3263
    source: 'American College of Obstetricians and Gynecologists. First and Second Stage Labor Management: Clinical Practice Guideline No. 8. Obstet Gynecol. 2024;143(1):144-162'
    doi: 10.1097/AOG.0000000000005447
    pmid: '38096556'
    pmcid: null
    url: https://doi.org/10.1097/AOG.0000000000005447
    source_license: CC 表示なし（© ACOG）
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 「十分な子宮収縮」の目安（子宮内圧カテーテルで200 Montevideo units超）は二次要約経由で確認した。日本における分娩遷延・停止の定義と帝王切開への移行判断は産科編2026（刊行版未照合）に委ねられる。オキシトシンは国内承認・保険適用がある
  curriculum:
    kokushi: 医学各論 Ⅰ-2-H-①（遷延分娩、分娩停止、肩甲難産、b）
    core_curriculum: 'PS-02-11-05 (id: JkxnuSU)；TBL-01-00-371 (id: JlvnmCk)'
