- id: DL-021
  domain: DL
  subdomain: 産褥期精神障害
  assertion:
    plain_statement_ja: 米国の周産期メンタルヘルスの指針では、すべての妊産褥婦に検証済みの尺度でうつ・不安のスクリーニングを行う（初診時、妊娠後期、産後受診時）。産後精神病は即時の医療的対応（immediate medical attention）を要する状態である。抗うつ薬を開始する前に双極性障害のスクリーニングを行う（抗うつ薬単剤は躁・精神病・自殺リスクを悪化させうる）
    condition:
      region: 米国
      対象: 妊産褥婦
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3282
    source: 'American College of Obstetricians and Gynecologists. Screening and Diagnosis of Mental Health Conditions During Pregnancy and Postpartum: Clinical Practice Guideline No. 4. Obstet Gynecol. 2023;141(6):1232-1261'
    doi: 10.1097/AOG.0000000000005200
    pmid: '37486660'
    pmcid: null
    url: https://doi.org/10.1097/AOG.0000000000005200
    source_license: CC 表示なし（© ACOG）
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: '日本では産婦健康診査（2017年度開始）で産後2週間・1か月にEPDS等による評価が行われる（国内制度の詳細は産科編2026の関連CQでの照合が必要）。治療・管理の詳細は同じ指針の No. 5（Obstet Gynecol. 2023;141(6):1262-1288、PMID: 37486661）にある。向精神薬の個別の国内承認・授乳期の扱いは添付文書での確認が必要であり、zuranolone・brexanoloneの国内承認は未確認のため、国内承認があるとは書かない'
  curriculum:
