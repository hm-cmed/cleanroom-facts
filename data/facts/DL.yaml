  uncertainty: 子宮破裂率は地域で幅があり、日本の産科編2026のCQ403では0.2〜0.7%とされる（パブリックコメント原案で確認した範囲。刊行版未照合のため日本の値は主張に入れていない）。日本でTOLACを行う条件（緊急帝王切開と子宮破裂に対する緊急手術が可能な体制、既往帝王切開が1回で子宮下節横切開・術後経過良好、子宮腔内に達する手術既往や子宮破裂の既往がないこと、胎児心拍数の連続モニタリング等）も同CQ403に基づき、刊行版での照合が必要。分娩誘発・促進時のプロスタグランジン製剤は国内承認薬であるが、TOLACでは使用しない扱いが同原案に示される
