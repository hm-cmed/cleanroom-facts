- id: DL-003
  domain: DL
  subdomain: 児頭骨盤不均衡<CPD>、狭骨盤
  assertion:
    plain_statement_ja: 児頭骨盤不均衡（CPD）は、胎児頭と母体骨盤の大きさの不釣り合いによる機械的な分娩進行障害であり、未処置では閉塞性分娩となり母児双方を危険にさらす。画像による骨盤計測（radiologic pelvimetry）は分娩転帰との相関が低く予測能に乏しい一方、臨床的な骨盤診査にはなお位置づけがある
    condition:
      region: 国際
      対象: 分娩中の女性
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3265
    source: 'Maharaj D. Assessing cephalopelvic disproportion: back to the basics. Obstet Gynecol Surv. 2010;65(6):387-395'
    doi: 10.1097/OGX.0b013e3181ecdf0c
    pmid: '20633305'
    pmcid: null
    url: https://doi.org/10.1097/OGX.0b013e3181ecdf0c
    source_license: CC 表示なし
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: CPD・狭骨盤に特化した現行ガイドラインは確認できず、本カードは2010年の総説に基づく。日本での評価・分娩様式の判断は産科編2026の分娩管理CQ群（刊行版未照合）で確認が必要
  curriculum:
    kokushi: 医学各論 Ⅰ-2-C-①（児頭骨盤不均衡<CPD>、狭骨盤、b）
