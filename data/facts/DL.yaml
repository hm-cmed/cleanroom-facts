- id: DL-013
  domain: DL
  subdomain: 弛緩出血、子宮内反症、羊水塞栓症、血栓塞栓症
  assertion:
    plain_statement_ja: 「産科危機的出血」は、分娩後異常出血が持続し、ショック指数（SI）1.5以上、非凝固性出血・乏尿・末梢冷感・バイタルサイン異常の出現、産科DICスコア8点以上、フィブリノゲン150 mg/dL未満（単独でも）のいずれかを認めた場合に宣言する。宣言後は、止血処置を行いつつ赤血球製剤と新鮮凍結血漿を1:1以上の比率で投与するか、高次施設へ搬送する。止血手技には子宮腔内バルーンタンポナーデ、子宮圧迫縫合、子宮動脈結紮、動脈塞栓術（IVR）、子宮摘出術があり、原因に応じて選択する
    condition:
      region: 日本
      対象: 分娩時・分娩後の女性
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3274
    source: 日本産科婦人科学会・日本産婦人科医会・日本周産期・新生児医学会・日本麻酔科学会・日本輸血・細胞治療学会. 産科危機的出血への対応指針 2022
    doi: null
    pmid: null
    pmcid: null
    url: null
    source_license: 学会資料（CC 表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 本カードの数値・手順は、産科編2026のCQ416-2のパブリックコメント原案で本指針の内容として確認した範囲であり、指針現物およびガイドライン刊行版での再照合が必要（登録時の決定9）。フィブリノゲン濃縮製剤は2021年9月に「産科危機的出血に伴う後天性低フィブリノゲン血症」で保険適用が認められている。トラネキサム酸の位置づけは DL-015、産科DICの診断は DL-018 を参照。一般の「危機的出血への対応ガイドライン」（2025年改訂）や『輸血療法実践ガイド』（2026）とは別の文書である
