- id: DL-024
  domain: DL
  subdomain: 乳腺炎、乳汁分泌不全
  assertion:
    plain_statement_ja: 産褥期の乳腺炎は単一疾患ではなく、乳管狭窄、炎症性乳腺炎、細菌性乳腺炎、蜂窩織炎・膿瘍、うっ滞・乳瘤・亜急性乳腺炎を含むスペクトラムとして捉え、病態の中心は乳腺の炎症と間質浮腫、乳腺のdysbiosisである。抗菌薬は細菌性乳腺炎に限って用い、炎症性乳腺炎への抗菌薬はマイクロバイオームを乱し細菌性への進展リスクを上げる。深部マッサージ、過度の搾乳、温罨法は推奨されず、氷冷、NSAIDs、需要に応じた授乳継続が基本である
    condition:
      region: 米国
      対象: 授乳中の女性
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1020
    source: 'Mitchell KB, Johnson HM, Rodríguez JM, et al. Academy of Breastfeeding Medicine Clinical Protocol #36: The Mastitis Spectrum, Revised 2022. Breastfeed Med. 2022;17(5):360-376'
    doi: 10.1089/bfm.2022.29207.kbm
    pmid: '35576513'
    pmcid: null
    url: https://doi.org/10.1089/bfm.2022.29207.kbm
    source_license: ライセンス表示を確認できず（出典マスター登録どおり）
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 本プロトコルは Academy of Breastfeeding Medicine の文書で、発行後5年で失効する旨が本文に明記される（2022年版は現行として使用可だが期限に留意）。米国の細菌性乳腺炎の経験的治療（ジクロキサシリン500 mg 1日4回、またはセファレキシン500 mg 1日4回、10〜14日間）は、ジクロキサシリンの国内での入手性・第一選択としての位置づけが未確認であり、国内の抗菌薬選択は添付文書・国内資料で確認が必要なため主張に入れていない。乳汁分泌不全に特化した一次資料は未確認で、本カードは乳腺炎の側面のみを扱った（国内側の受け皿候補は産科編2026のCQ418群だが本文未照合）。乳腺疾患一般は第22回 BR が正
