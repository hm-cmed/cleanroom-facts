- id: DL-006
  domain: DL
  subdomain: 後方後頭位、低在横定位、高在縦定位
  assertion:
    plain_statement_ja: 分娩中に後頭後方位（OP）と診断されても大半は自然に前方へ回旋し、出生時までOPのままであるのは診断例の4〜5%であり、後頭横方位（OT）では3〜8%である。OP・OTは分娩停止と器械分娩の主因のひとつであり、内診による胎向の臨床診断は不正確なことが多いため、経腹超音波による評価が標準的とされる。児頭下降度の指標として、angle of progression 116°超が児頭の嵌入を示唆し、head-perineum distance 35〜38 mmが嵌入の目安になる
    condition:
      region: 国際
      対象: 分娩中の女性
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3268
    source: Dall'Asta A, et al. Intrapartum Ultrasound Guidance to Make Safer Any Obstetric Intervention. Clin Obstet Gynecol. 2024;67(4):730-738
    doi: 10.1097/GRF.0000000000000891
    pmid: '39431493'
    pmcid: PMC11495479
    url: https://doi.org/10.1097/GRF.0000000000000891
    source_license: CC BY 4.0（PMC 本文で確認）
    legal_basis: B
    source_class: OPEN
    corroboration: null
  uncertainty: 数値は出典の本文から読み取った（表・本文から読み取り）。「低在横定位」「高在縦定位」という下降度と胎向を組み合わせた日本の複合概念に直接対応する英語資料はなく、本カードは胎向評価と下降度指標に分解した内容に基づく。用手回転の予防的実施は自然経腟分娩率を上げなかったとする系統的レビュー（Burd 2022）があり、回旋異常への介入判断は別途検討が要る
  curriculum:
    kokushi: 医学各論 Ⅰ-2-E-①（後方後頭位、低在横定位、高在縦定位、b）
    core_curriculum: 'PS-02-11-05 (id: JkxnuSU)；TBL-01-00-372 (id: JlvnmCo)'
