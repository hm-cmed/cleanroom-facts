- id: DL-004
  domain: DL
  subdomain: 骨盤位、横位
  assertion:
    plain_statement_ja: 正期産単胎骨盤位の分娩様式は、本人の希望と術者の経験を考慮して決める。頭位での経腟分娩を希望し禁忌がない妊婦には、予定帝王切開の代替として外回転術を提示すべきであり、外回転術は帝王切開が直ちに可能な施設でのみ試みる。施設のプロトコルに沿えば計画的な経腟骨盤位分娩も妥当な選択肢となりうるが、その場合はリスクについて文書による詳細な説明と同意が必要である
    condition:
      region: 米国
      対象: 正期産単胎骨盤位の妊婦
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3266
    source: 'American College of Obstetricians and Gynecologists. Mode of Term Singleton Breech Delivery: Committee Opinion No. 745. Obstet Gynecol. 2018;132(2):e60-e63'
    doi: 10.1097/AOG.0000000000002755
    pmid: '30045211'
    pmcid: null
    url: https://doi.org/10.1097/AOG.0000000000002755
    source_license: CC 表示なし（© ACOG）
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 本意見書（2018年、2023年 reaffirmed）の対象は骨盤位であり、横位そのものを扱う単独の現行ガイドラインは確認できなかった（横位は臍帯脱出の予防・対応の文脈で DL-008 と接点がある）。日本で骨盤位経腟分娩を選択する条件は産科編2026のCQ402（刊行版未照合）に委ねられる
  curriculum:
    kokushi: 医学各論 Ⅰ-2-D-①（骨盤位、横位、b）
    core_curriculum: 'PS-02-11-04 (id: JkxnuSQ)；PS-02-11-05 (id: JkxnuSU)；TBL-02-10-016 (id: JlAKpq0)'
