  uncertainty: 新基準の各項目の閾値の詳細は原典（暫定版：日本産婦人科・新生児血液学会誌. 2022;32:S13-S14、および同誌. 2023;32:43-49 の報告）での確認が必要。産科DICは線溶亢進型の病態が主体で分娩後異常出血時に発症しやすいとされる。DICの総論（敗血症・造血器腫瘍・固形がん側）は第40回 HS-035 が Ⅰ-2-J-② を両章併記済みであり、DL では産科DICに絞った
