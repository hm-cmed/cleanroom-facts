- id: DL-023
  domain: DL
  subdomain: 子宮復古不全、産褥熱
  assertion:
    plain_statement_ja: '妊娠中・産褥期の敗血症と敗血症性ショックは医療緊急事態であり、治療と蘇生を直ちに開始する（GRADE 1B）。発熱がなくても、感染過程の存在下で説明のつかない臓器障害がある妊産褥婦では敗血症を鑑別に含める（GRADE 1B）。持続する低血圧・低灌流に対する第一選択の昇圧薬はノルエピネフリンである（SMFM Consult Series #47、2019）'
    condition:
      region: 米国
      対象: 妊娠中・産褥期の女性
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3284
    source: 'Society for Maternal-Fetal Medicine; Plante LA, Pacheco LD, Louis JM. SMFM Consult Series #47: Sepsis during pregnancy and the puerperium. Am J Obstet Gynecol. 2019;220(4):B2-B10'
    doi: 10.1016/j.ajog.2019.01.216
    pmid: '30684460'
    pmcid: null
    url: https://doi.org/10.1016/j.ajog.2019.01.216
    source_license: CC 表示なし
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 子宮復古不全そのもの（定義・頻度・胎盤遺残との関係）に特化した一次資料は未確認であり、本カードは産褥熱の重症側面（敗血症）として扱った。復古不全は胎盤・胎胞遺残や子宮内膜炎の背景・鑑別として位置づけられる。ノルエピネフリンは国内承認のある昇圧薬だが、妊産褥婦の敗血症における国内の位置づけは国内資料での確認が必要。同文書には2021年の訂正（Am J Obstet Gynecol. 2021;224(2):224）がある
  curriculum:
    kokushi: 医学各論 Ⅰ-2-K-②（子宮復古不全、産褥熱、b）
