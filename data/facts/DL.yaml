- id: DL-019
  domain: DL
  subdomain: 播種性血管内凝固<DIC>
  assertion:
    plain_statement_ja: 日本血栓止血学会のDIC診療ガイドライン2024の第4部（外傷・熱傷・産科・急性膵炎/肝不全ほか）は産科DICを明示的に対象とし、産科DICに対するフィブリノゲン濃縮製剤、アンチトロンビン濃縮製剤、トラネキサム酸の投与を推奨に含む
    condition:
      region: 日本
      対象: 産科DICの女性
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3280
    source: 'Hayakawa M, et al. Clinical practice guidelines for management of disseminated intravascular coagulation in Japan 2024: part 4 - trauma, burn, obstetrics, acute pancreatitis/liver failure, and others. Int J Hematol. 2025;121(5):633-652'
    doi: 10.1007/s12185-025-03918-0
    pmid: '39890756'
    pmcid: null
    url: https://doi.org/10.1007/s12185-025-03918-0
    source_license: CC 表示なし
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 出血が継続している非凝固性の分娩後異常出血では、産科編2026のCQ416-2（パブリックコメント原案）が遺伝子組換えトロンボモジュリンとアンチトロンビン製剤を原則として推奨せず、合成プロテアーゼ阻害薬（ガベキサート、ナファモスタット）も産科DICに対して使用しないことを推奨するとしている。DIC治療の文脈と止血不能の出血の文脈は異なるため混同しない。フィブリノゲン濃縮製剤は産科危機的出血に伴う後天性低フィブリノゲン血症で保険適用がある。アンチトロンビン濃縮製剤の個別の適応文言は添付文書での確認が必要。血小板濃厚液は血小板数5万/µLを維持するよう投与すると同CQ原案にある。遺伝子組換え活性型第VII因子製剤は適応外使用であり、生命の危険がある重篤例で通常の輸血治療に反応しない症例に限るとされる（同原案）
