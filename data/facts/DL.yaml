- id: DL-011
  domain: DL
  subdomain: 子宮破裂、頸管・腟・会陰裂傷
  assertion:
    plain_statement_ja: 帝王切開既往後の経腟分娩（TOLAC）における子宮破裂の頻度は、米国ACOGの資料では0.5〜0.9%とされ、複数回の帝王切開既往では0.9〜3.7%に上がる。TOLACの成功率（経腟分娩の達成）は60〜80%である
    condition:
