- id: DL-020
  domain: DL
  subdomain: 産褥期精神障害
  assertion:
    plain_statement_ja: 産後精神病の頻度は出生1,000あたり1〜2人で、発症は産後1〜4週（早ければ2〜3日目から）に多く、妄想、気分変動、混乱、解体した行動を呈する。対比として、産後うつは10〜13%、マタニティブルーズは50〜75%にみられる
    condition:
      region: 国際
      対象: 産褥期の女性
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3281
    source: Sit D, Rothschild AJ, Wisner KL. A Review of Postpartum Psychosis. J Womens Health (Larchmt). 2006;15(4):352-368
    doi: 10.1089/jwh.2006.15.352
    pmid: '16724884'
    pmcid: null
    url: https://doi.org/10.1089/jwh.2006.15.352
    source_license: CC 表示なし（PMC に著者原稿）
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 産後精神病の頻度は系統的レビュー（VanderKruik 2017）で0.89〜2.6/1,000と研究間で幅がある。本カードは2006年のレビューの本文で確認した値に基づく。精神疾患としての分類・総論は第Ⅱ章（精神）が担当し、DL では産褥期の側面に絞った（登録時の決定7）
