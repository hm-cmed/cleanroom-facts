- id: DL-012
  domain: DL
  subdomain: 子宮破裂、頸管・腟・会陰裂傷
  assertion:
    plain_statement_ja: 会陰裂傷は、1度（会陰皮膚のみ）、2度（会陰筋まで、肛門括約筋を含まない）、3度（肛門括約筋複合体まで。3aは外肛門括約筋の50%未満、3bは50%超、3cは内外両括約筋）、4度（括約筋複合体と肛門上皮・直腸粘膜まで）に分類され、3度・4度を産科的肛門括約筋損傷（OASIS）という。経腟分娩では53〜79%に何らかの会陰裂傷が生じる。第2期の温罨法は3・4度裂傷を減らすが、1・2度裂傷は減らさない
    condition:
      region: 米国
      対象: 経腟分娩後の女性
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3273
    source: 'American College of Obstetricians and Gynecologists. Prevention and Management of Obstetric Lacerations at Vaginal Delivery: Practice Bulletin No. 198. Obstet Gynecol. 2018;132(3):e87-e102'
    doi: 10.1097/AOG.0000000000002841
    pmid: '30134424'
    pmcid: null
    url: https://doi.org/10.1097/AOG.0000000000002841
    source_license: CC 表示なし（© ACOG）
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 分類は同 bulletin（2018年版、2025年 reaffirmed）の分類表から読み取った（表から読み取り）。OASISの強い危険因子は鉗子分娩・吸引分娩・正中会陰切開・出生体重の増加とされる。頸管裂傷・腟裂傷を単独で扱う一次資料は確認できず、本カードは会陰裂傷の分類を本体とした（頸管・腟裂傷は出血源の確認という文脈で産科出血の資料と組み合わせる）
