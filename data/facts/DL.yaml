- id: DL-010
  domain: DL
  subdomain: 遷延分娩、分娩停止、肩甲難産
  assertion:
    plain_statement_ja: 肩甲難産は、児頭娩出後に通常の下方牽引では肩甲が娩出せず追加の産科手技を要する状態であり、頭位経腟分娩の0.2〜3%に起こる。予測も予防もできない産科緊急事態と位置づけられ、初期対応はMcRoberts手技と恥骨上圧迫であり、子宮底圧迫は避ける
    condition:
      region: 米国
      対象: 経腟分娩中の女性
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3271
    source: 'American College of Obstetricians and Gynecologists. Shoulder Dystocia: Practice Bulletin No. 178. Obstet Gynecol. 2017;129(5):e123-e133'
    doi: 10.1097/AOG.0000000000002043
