- id: DL-018
  domain: DL
  subdomain: 播種性血管内凝固<DIC>
  assertion:
    plain_statement_ja: 日本の産科DICの診断は、2022年7月の暫定版を経て2024年6月に最終版となった新基準で行い、基礎疾患、フィブリノゲン値、FDPまたはDダイマーで評価する。大量出血例（経腟分娩1,000 mL以上・帝王切開2,000 mL以上、212例）の検証では、新基準で産科DICと診断された群はフィブリノゲン150 mg/dL未満が90%（対照5%）、旧産科DICスコア8点以上が100%（対照10%）であり、新基準の妥当性が示された。旧スコア（1985年）は危機的出血の宣言・治療開始の目安として現行指針にも残る位置づけであり、診断基準そのものとは区別する
    condition:
