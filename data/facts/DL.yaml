- id: DL-016
  domain: DL
  subdomain: 弛緩出血、子宮内反症、羊水塞栓症、血栓塞栓症
  assertion:
    plain_statement_ja: 羊水塞栓症は臨床診断であり、確定にも除外にも使える特異的な検査はない（GRADE 1C）。分娩中または分娩直後の女性の突然の心肺虚脱では、鑑別診断に羊水塞栓症を含めるべきであり（GRADE 1C）、心停止例には標準的な一次・二次救命処置による質の高い心肺蘇生を直ちに行う（GRADE 1C）。発生率は約2〜6例/10万分娩とされる
    condition:
      region: 米国
      対象: 分娩中・分娩直後の女性
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3277
    source: 'Society for Maternal-Fetal Medicine; Pacheco LD, Saade G, Hankins GDV, Clark SL. Amniotic fluid embolism: diagnosis and management. Am J Obstet Gynecol. 2016;215(2):B16-B24'
    doi: 10.1016/j.ajog.2016.03.012
    pmid: '26987420'
    pmcid: null
    url: https://doi.org/10.1016/j.ajog.2016.03.012
    source_license: CC 表示なし
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 発生率は資料により1.9〜6.1/10万分娩と幅があり、古典例の致死率は20〜40%以上とされる。研究用の症例定義基準（Clarkらの提案：突然の心肺停止または低血圧と呼吸障害、妊娠修正ISTHスコア3点以上の顕性DIC、分娩中または胎盤娩出後30分以内の発症、分娩中の発熱がないこと）は、本ガイドラインとは別の文献（Am J Obstet Gynecol. 2016;215(4):408-412）であり混同しない。日本では登録・血清診断事業に基づく臨床的診断基準が用いられるが、その正式な原典書誌は未確認。本邦の妊産婦死亡剖検例（1989〜2004年）では羊水塞栓症が24.3%で第1位だったとする報告がある
