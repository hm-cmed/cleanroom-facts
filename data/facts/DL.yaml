- id: DL-025
  domain: DL
  subdomain: 産褥血栓症、肺塞栓症
  assertion:
    plain_statement_ja: 妊娠中・産褥期の女性は非妊娠時に比べて血栓塞栓症のリスクが4〜5倍高く、妊娠関連の血栓塞栓症の約80%は静脈性で、頻度は妊婦1,000人あたり0.5〜2.0である。静脈血栓塞栓症は米国の母体死亡の9.3%を占める主要な死因のひとつであり、リスクと病態に応じた周産期の抗凝固管理（急性期治療と予防）が必要である。経口の直接トロンビン阻害薬および抗Xa薬は妊娠中・授乳期には避ける
    condition:
      region: 米国
      対象: 妊産褥婦
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3285
    source: 'American College of Obstetricians and Gynecologists. Thromboembolism in Pregnancy: ACOG Practice Bulletin No. 196. Obstet Gynecol. 2018;132(1):e1-e17'
    doi: 10.1097/AOG.0000000000002706
    pmid: '29939938'
    pmcid: null
    url: https://doi.org/10.1097/AOG.0000000000002706
    source_license: CC 表示なし（© ACOG）
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 日本の産褥期VTE予防の実務（脱水回避と早期離床、帝王切開での間欠的空気圧迫法・弾性ストッキング、未分画ヘパリン5,000単位1日2回皮下注の開始時期、低分子量ヘパリン・フォンダパリヌクスの予防の保険適用は原則として手術後24時間以降に限られ経腟分娩後の予防投与には保険適用がないこと等）は、産科編2026のCQ003-2・CQ003-3のパブリックコメント原案で確認した範囲であり、刊行版での照合が必要なため主張に入れていない。産褥期のVTEリスクは妊娠期の約5倍で産後最初の3週間がピークとする系統的レビューの報告がある（RCOG Green-top Guideline No. 37a の引用経由）。ワルファリン・ヘパリン類では授乳中止は不要とされるが、未分画ヘパリンの添付文書には禁忌の記載があるため説明が必要とされる（同原案）。Ⅰ-2-J-① 側の血栓塞栓症は、妊娠中・分娩直後の予防と危機的出血の文脈に限定し、産褥期の発症・予防は本カードに寄せて重複を避けた
  curriculum:
    kokushi: 医学各論 Ⅰ-2-K-④（産褥血栓症、肺塞栓症、b）
