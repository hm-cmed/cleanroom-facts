- id: DL-002
  domain: DL
  subdomain: 微弱陣痛、過強陣痛
  assertion:
    plain_statement_ja: 子宮頻収縮（tachysystole）は、30分で平均して10分間に5回を超える子宮収縮と定義され、胎児心拍数減少の有無を併記して評価する（NICHDの2008年ワークショップ報告）。「過刺激（hyperstimulation）」などの用語は定義が曖昧であるため用いないことが示された
    condition:
      region: 米国
      対象: 分娩中の女性
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3264
    source: 'Macones GA, Hankins GDV, Spong CY, Hauth J, Moore T. The 2008 National Institute of Child Health and Human Development workshop report on electronic fetal monitoring: update on definitions, interpretation, and research guidelines. Obstet Gynecol. 2008;112(3):661-666'
    doi: 10.1097/AOG.0b013e3181841395
    pmid: '18757666'
    pmcid: null
    url: https://doi.org/10.1097/AOG.0b013e3181841395
    source_license: CC 表示なし
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: '本定義は米国の分娩時モニタリングの用語標準であり、日本語の「過強陣痛」との厳密な用語対応は国内資料で未確認。子宮収縮薬の減量・中止の具体的基準は産科編2026のCQ413群（刊行版未照合）に委ねられる。同報告には J Obstet Gynecol Neonatal Nurs 同時掲載版（DOI: 10.1111/j.1552-6909.2008.00284.x）があり、本カードは Obstet Gynecol 版の識別子でそろえた'
  curriculum:
    kokushi: 医学各論 Ⅰ-2-B-①（微弱陣痛、過強陣痛、b）
    core_curriculum: 'PS-02-11-01 (id: JkxnuSE)；PS-02-11-05 (id: JkxnuSU)；TBL-01-00-370 (id: JlvnmCc)；TBL-02-10-004 (id: JlAKpqE)'
