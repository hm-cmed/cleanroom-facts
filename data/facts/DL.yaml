- id: DL-005
  domain: DL
  subdomain: 骨盤位、横位
  assertion:
    plain_statement_ja: 正期産の骨盤位に対する外回転術の試行は、出生時の非頭位提示、頭位経腟分娩の不達成、帝王切開をいずれも減らす（Cochrane系統的レビュー、2015年版）
    condition:
      region: 国際
      対象: 正期産骨盤位の妊婦
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3267
    source: Hofmeyr GJ, Kulier R, West HM. External cephalic version for breech presentation at term. Cochrane Database Syst Rev. 2015;(4):CD000083
    doi: 10.1002/14651858.CD000083.pub3
    pmid: '25828903'
    pmcid: PMC6505738
    url: https://doi.org/10.1002/14651858.CD000083.pub3
    source_license: © Cochrane Collaboration（CC 表示なし）
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 合併症は大規模観察研究ではまれとされるが、本カードは本レビューの抄録で確認した範囲に基づく。国内の実施要件（緊急帝王切開が可能な体制、児の成熟など）は産科編2026のCQ402（刊行版未照合）で確認が必要。計画的帝王切開と経腟分娩を比べた別のCochraneレビュー（CD000166）とは混同しない
  curriculum:
    kokushi: 医学各論 Ⅰ-2-D-①（骨盤位、横位、b）
