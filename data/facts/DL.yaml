- id: DL-001
  domain: DL
  subdomain: 微弱陣痛、過強陣痛
  assertion:
    plain_statement_ja: 米国ACOGの分娩管理ガイドライン（2024）では、分娩第1期の活動期は子宮口6 cm開大からとし、潜伏期の遷延のみを理由とする帝王切開は避ける。第1期の進行遷延に対しては、オキシトシンによる陣痛増強が推奨される
    condition:
      region: 米国
      対象: 分娩中の女性
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3263
    source: 'American College of Obstetricians and Gynecologists. First and Second Stage Labor Management: Clinical Practice Guideline No. 8. Obstet Gynecol. 2024;143(1):144-162'
    doi: 10.1097/AOG.0000000000005447
    pmid: '38096556'
    pmcid: null
    url: https://doi.org/10.1097/AOG.0000000000005447
    source_license: CC 表示なし（© ACOG）
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 「微弱陣痛」そのものの収縮回数・持続時間による国内定義は確認できなかった。日本の対応は産科編2026のCQ404（微弱陣痛による分娩進行遷延時の対応）が受け皿となるが、刊行版の本文は未照合。オキシトシンおよびプロスタグランジン製剤はいずれも国内承認・保険適用がある（出典リサーチで確認）
  curriculum:
    kokushi: 医学各論 Ⅰ-2-B-①（微弱陣痛、過強陣痛、b）
    core_curriculum: 'PS-02-11-01 (id: JkxnuSE)；PS-02-11-05 (id: JkxnuSU)；TBL-01-00-370 (id: JlvnmCc)；TBL-02-10-004 (id: JlAKpqE)'
