    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ71 2026-11-15）：Smith EF, Lavery C, Simpson SJ, et al. Pre-COPD, PRISm, and COPD in young adults born preterm. Ann Am Thorac Soc. 2026;23（PMID: 42421199、DOI: 10.1093/annalsats/aaoag182、PMCID: PMC13626232、https://pmc.ncbi.nlm.nih.gov/articles/PMC13626232/）。裏づける部分：候補（CC BY の原著研究）が、COPD の重症度を FEV1 の zスコアで、軽症（z ≥ −2.51）、中等症（−4.1 ≤ z < −2.51）、高度（z < −4.1）と分類しており、カードの zスコアによる3段階の重症度区分の骨格と閾値の組（−2.51 と −4.1）と一致する。数値の照合：境界の表記差がある。候補の軽症は z ≥ −2.51（閉塞例が対象のため実質 −2.51〜−1.645 の範囲）で、カードの軽症（−1.65〜−2.5）と下限の書き方が異なる。中等症と高度の境界はカードが「−4.0 までが中等度、−4.1 未満が高度」（原文の区切りのとおり −4.0 と −4.1 の間に隙間がある）とし、候補は −4.1 を境界に連続して区切る。閾値の組そのものは一致する。留保：主出典 SRC-501 は区分訂正あり（UNKNOWN→RESTRICTED、区分訂正の節参照）'
  uncertainty: ERS/ATS 2022 の記載（欧米の基準、GLI 参照式による LLN）。日本呼吸器学会の基準（1秒率70%未満、%VC 80%未満など）や日本人の参照式（LMS 法）とは判定方法が異なる。日本の基準の出典は未取得。−4.0 と −4.1 の間は原文の区切りのとおり
