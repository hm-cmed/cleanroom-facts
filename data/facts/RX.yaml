- id: RX-003
  domain: RX
  subdomain: 主要症候（胸水）
  assertion:
    plain_statement_ja: BTS 2023 では、胸水/血清の蛋白比が0.5を超える、胸水/血清の LDH 比が0.6を超える、胸水 LDH が血清 LDH の基準上限の3分の2を超える、のいずれか1つを満たせば滲出性胸水とする（Light の基準）。
    condition:
      guideline: BTS Guideline for pleural disease 2023
      region: 英国
    differential: null
    common_misconception: Light の基準は3項目すべてを満たしたときに滲出性と判定する
  provenance:
    source_ref: SRC-370
    source: Roberts ME, Rahman NM, Maskell NA, et al. British Thoracic Society Guideline for pleural disease. Thorax 2023;78:1143-1156
    doi: 10.1136/thorax-2023-220304
    pmid: null
    pmcid: null
    url: https://thorax.bmj.com/content/78/11/1143.full.pdf
    source_license: © Author(s) (or their employer(s)) 2023. No commercial re-use.
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ71 2026-11-15）：Subedi AR, Shrestha TM, Shakya YL, Budha B. Comparative Evaluation of Pleural Fluid Cholesterol and Total Protein Versus Light''s Criteria in Differentiation of Exudates and Transudates: A Cross-Sectional Analysis at Tribhuvan University Teaching Hospital. Clin Respir J. 2025;19(9):e70121（PMID: 40867084、DOI: 10.1111/crj.70121、PMCID: PMC12390823、https://pmc.ncbi.nlm.nih.gov/articles/PMC12390823/）。裏づける部分：候補（CC BY の原著論文）が Light の基準の3項目を逐語で再掲する：胸水/血清蛋白比 >0.5、胸水/血清 LDH 比 >0.6、胸水 LDH が血清 LDH の正常上限の2/3超、のいずれか1つを満たせば滲出液とする。カードの主張（BTS 2023 が採用する Light の基準）と一致する。数値の照合：3閾値（0.5／0.6／3分の2）すべて候補と一致。留保：候補は Light の基準自体の再掲で、BTS 2023 への帰属の明示はない。主出典 SRC-370 の区分は現行 RESTRICTED が正しい（区分訂正の節参照）'
