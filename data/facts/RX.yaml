    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ71 2026-11-15）：Hamrefors V, Westerbergh J, Behndig A, Blomberg A, Brandberg J, Carlén C, et al. Isolated, reduced diffusing capacity for carbon monoxide in the population - relations to symptoms, health status, exposures, co-morbidities and health care visits. BMC Pulm Med. 2026;26:4662（PMID: 42675482、DOI: 10.1186/s12890-026-04662-9、PMCID: PMC13531966、https://pmc.ncbi.nlm.nih.gov/articles/PMC13531966/）。裏づける部分：候補（CC BY の大規模コホート研究）が、DLCO の異常を LLN（GLI 参照式に基づく正常下限）で判定する枠組みを用い、貧血は DLCO 低下に関連する因子で「臨床実務では補正される」と明記する。カードの主張のうち、DLCO を基準範囲（5〜95パーセンタイル相当の LLN 判定）で評価する点と、基準値をヘモグロビンで補正する点と一致する。Russell ら（Open Respir Med J. 2026、CC BY、PMC13678695）のパターン定義でも、孤立性 DLCO 低下は DLCO が LLN 未満として定義される。数値の照合：5〜95パーセンタイルという範囲表記そのものは候補に再掲なし（候補はいずれも LLN による判定）。留保：低下時に VA と KCO を合わせて評価すること、VA が正常で DLCO が低ければ肺血管障害・肺気量の保たれた肺気腫・貧血を考えるという鑑別の枠組みは、自由全文への再掲が見つからなかった'
