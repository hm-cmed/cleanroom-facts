- id: RX-006
  domain: RX
  subdomain: 呼吸機能検査
  assertion:
    plain_statement_ja: ERS/ATS 2022 は、閉塞性換気障害を FEV1/FVC が正常下限（LLN、5パーセンタイル、zスコア−1.645）を下回ることで定義し、健常者の基準範囲には GLI の参照式を使うとした。
    condition:
      guideline: ERS/ATS technical standard on interpretive strategies 2022
      region: 欧米
    differential: null
    common_misconception: 閉塞性換気障害はどの年齢でも FEV1/FVC 70% 未満で一律に判定される
  provenance:
    source_ref: SRC-501
    source: Stanojevic S, Kaminsky DA, Miller MR, et al. ERS/ATS technical standard on interpretive strategies for routine lung function tests. Eur Respir J 2022;60(1):2101499
    doi: 10.1183/13993003.01499-2021
    pmid: null
    pmcid: null
    url: https://publications.ersnet.org/content/erj/60/1/2101499
    source_license: 未確認（頁に PDF Permissions のリンクのみ）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ71 2026-11-15）：Russell ST, Han JE, Kempker JA, Honig E, Kukoyi AT, et al. Adopting Global Lung Function Initiative Reference Equations Alters Pulmonary Function Testing Interpretation. Open Respir Med J. 2026;20:e18743064497297（PMID: 42899075、DOI: 10.2174/0118743064497297260820041654、PMCID: PMC13678695、https://pmc.ncbi.nlm.nih.gov/articles/PMC13678695/）。裏づける部分：候補（CC BY の原著研究）が、現行の ATS/ERS ガイドラインはスパイロメトリー・肺気量・DLCO の参照式として GLI（Global Lung Function Initiative）の参照式を推奨すると明記し、解釈パターンの定義表で閉塞を「FEV1/FVC が LLN 未満」と定義する。カードの2要素（閉塞性換気障害は FEV1/FVC が LLN を下回ることで定義する、健常者の基準範囲には GLI の参照式を使う）と一致する。同様の定義は Smith ら（Ann Am Thorac Soc. 2026、CC BY、PMC13626232）も GLI 参照式を用いて採用する。数値の照合：LLN の数値定義（5パーセンタイル、zスコア −1.645）そのものは候補に数値として明記されていない（GLI における LLN の定義自体は5パーセンタイルである）。なお J Bras Pneumol の Ferreira 2026（PMC13598882）は LLN を5パーセンタイル（z < −1.64）と明記するが、刊行版ライセンスは CC BY-NC 4.0（Crossref の版データで個別確認）のため候補に使えない。留保：主出典 SRC-501 は区分訂正あり（UNKNOWN→RESTRICTED、区分訂正の節参照）'
  uncertainty: ERS/ATS 2022 の記載（欧米の基準、GLI 参照式による LLN）。日本呼吸器学会の基準（1秒率70%未満、%VC 80%未満など）や日本人の参照式（LMS 法）とは判定方法が異なる。日本の基準の出典は未取得
  curriculum:
    core_curriculum: 'PS-02-07-03 (id: JkxnuQ8)；TBL-02-06-021 (id: JlAKpiU)'
