    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ71 2026-11-15）：Lowe J, Cousins M, Hart K, Kotecha SJ, Watkins WJ, Kotecha S, et al. Defining the optimal spirometry cut-off points for optimal bronchodilator response in prematurity-associated lung disease. ERJ Open Res. 2026;12(2):00239-2026（PMID: 42682813、DOI: 10.1183/23120541.00239-2026、PMCID: PMC13531273、https://pmc.ncbi.nlm.nih.gov/articles/PMC13531273/）。裏づける部分：候補（CC BY の研究レター）が、気管支拡張薬反応陽性を「吸入後の FEV1（予測値に対する %）の増加が >10%」と定義し、それが ATS の推奨する方法であることを明記する。カードの主張（反応陽性は FEV1 または FVC の変化量が予測値の10%を超える場合）の FEV1 側と一致し、「予測値の10%」という基準の取り方（吸入前後の値どうしの10%ではない）も候補の定義と整合する。数値の照合：閾値（予測値の10%超）は候補と一致。留保：FVC 側の反応陽性の再掲は候補になし。候補は早産関連肺疾患のコホートを対象とする研究レターで、基準の再掲は方法の節による'
