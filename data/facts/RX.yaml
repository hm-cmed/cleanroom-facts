    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ71 2026-11-15）：Russell ST, Han JE, Kempker JA, Honig E, Kukoyi AT, et al. Adopting Global Lung Function Initiative Reference Equations Alters Pulmonary Function Testing Interpretation. Open Respir Med J. 2026;20:e18743064497297（PMID: 42899075、DOI: 10.2174/0118743064497297260820041654、PMCID: PMC13678695、https://pmc.ncbi.nlm.nih.gov/articles/PMC13678695/）。裏づける部分：候補（CC BY の原著研究）の解釈パターン定義表が、拘束性障害を「FEV1/FVC が LLN 超、かつ TLC が LLN 未満」と定義し、FVC が低くても TLC が保たれる場合は非特異的パターンとして拘束性と区別する。カードの主張（拘束性障害は TLC が LLN を下回ることで定義し、FVC の低下だけでは拘束性といえない）と一致する。PRISm（FEV1/FVC は正常で FEV1 が低下したパターン）の定義は Smith ら（Ann Am Thorac Soc. 2026、CC BY、PMC13626232）が「FEV1/FVC 比は正常だが FEV1 が低下した表現型」として再掲する。数値の照合：数値なし（定義のカード）。留保：主出典 SRC-501 は区分訂正あり（UNKNOWN→RESTRICTED、区分訂正の節参照）'
