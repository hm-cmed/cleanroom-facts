- id: SA-001
  domain: SA
  subdomain: 体軸性脊椎関節炎、強直性脊椎炎
  assertion:
    plain_statement_ja: 体軸性脊椎関節炎は、X線基準を満たす強直性脊椎炎と、X線基準を満たさない体軸性脊椎関節炎（nr-axSpA）の両方を含む概念である。通常20歳代に発症し、男女比はX線基準を満たす型で2:1、nr-axSpAで1:1である。遺伝率は90%超と推定され、最も強い遺伝的関連は HLA-B27 である。病態には TNF-α と IL-17 の関与が治療薬のエビデンスから支持され、画像では MRI が最も重要な手段である。
    condition:
      region: 国際
      対象: 成人
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2991
    source: Sieper J, Poddubnyy D. Axial spondyloarthritis. Lancet. 2017;390(10089):73-84
    doi: 10.1016/S0140-6736(16)31591-4
    pmid: '28110981'
    pmcid: null
    url: https://doi.org/10.1016/S0140-6736(16)31591-4
    source_license: CC 表示なし（Crossref は Elsevier の TDM ライセンスのみ）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ63 2026-11-14）：Shekha M, Shaikh OA, Shaikh G, Ochani S, Ullah K. Upadacitinib for Spondyloarthritis; A new treatment option. Ann Med Surg. 2022;82:104664（PMID: 36268430、DOI: 10.1016/j.amsu.2022.104664、PMCID: PMC9577587、https://pmc.ncbi.nlm.nih.gov/articles/PMC9577587/）。裏づける部分：候補（CC BY の総説）が、体軸性脊椎関節炎は X線基準を満たす型と満たさない型（nr-axSpA）に分かれること、男女比が X線型で2:1・nr-axSpA で1:1 であること、発症は20歳代であること、遺伝率は90%超で最も強い遺伝的関連は HLA-B27 であること、IL-17 と TNF-α が病態に関与することを明記し、カードの中心的主張と一致する。数値の照合：男女比（2:1／1:1）と遺伝率90%超は候補と一致。留保：画像で MRI が最も重要という点は候補では未確認（MRI 所見を伴う nr-axSpA への言及のみ）。主出典 SRC-2991 の区分訂正は別枠に分離した'
  uncertainty: 総説に基づく概念・疫学の記述で、数値は抄録で確認した。分類基準そのものは ASAS 体軸性分類基準（SRC-1798、第30回 SP-022 で使用済み）が正で、本カードでは作り直していない。脊椎病変の詳細も SP が正。
