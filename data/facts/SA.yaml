- id: SA-003
  domain: SA
  subdomain: 末梢性脊椎関節炎
  assertion:
    plain_statement_ja: ASAS の末梢性脊椎関節炎の分類基準は、通常45歳未満で発症し、末梢関節炎、付着部炎、指趾炎のみを呈する患者を対象とする。これらに、乾癬、炎症性腸疾患、先行感染、HLA-B27、ぶどう膜炎、画像上の仙腸関節炎のいずれか1つ以上を伴う場合、または、関節炎、付着部炎、指趾炎、過去の炎症性腰痛、脊椎関節炎の家族歴のうち2つ以上を伴う場合に分類する。検証では感度77.8%、特異度82.9%であった。
    condition:
      region: 国際
      対象: 成人
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2992
    source: Rudwaleit M, van der Heijde D, Landewé R, et al. The ASAS classification criteria for peripheral spondyloarthritis and for spondyloarthritis in general. Ann Rheum Dis. 2011;70(1):25-31
    doi: 10.1136/ard.2010.133645
    pmid: '21109520'
    pmcid: null
    url: https://doi.org/10.1136/ard.2010.133645
    source_license: CC 表示なし
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ63 2026-11-14）：Carron P, De Craemer AS, Van den Bosch F. Peripheral spondyloarthritis: a neglected entity—state of the art. RMD Open. 2020;6(1):e001136（PMID: 32385142、DOI: 10.1136/rmdopen-2019-001136、PMCID: PMC7299516、https://pmc.ncbi.nlm.nih.gov/articles/PMC7299516/）。裏づける部分：候補（CC BY の総説）の表1が ASAS 末梢性脊椎関節炎分類基準を再掲（入口＝末梢関節炎・付着部炎・指趾炎、＋1項目群＝ぶどう膜炎・乾癬・クローン病/大腸炎・先行感染・HLA-B27・画像上の仙腸関節炎、または＋2項目群＝関節炎・付着部炎・指趾炎・炎症性腰痛の既往・家族歴）し、本文に末梢型の感度77.8%・特異度82.9%を明記する。カードの基準構成と性能が一致する。数値の照合：感度77.8%・特異度82.9%は候補と一致。留保：発症45歳未満という入口条件は候補の表では明示されていない。主出典 SRC-2992 の区分訂正は別枠に分離した'
  uncertainty: 基準の構成と感度・特異度は抄録で確認した（対象266例）。反応性関節炎は先行感染を契機とする脊椎関節炎としてこの枠組みに含まれうるが、先行感染の病原体の種類や頻度・予後は一次資料で確認できなかったため、独立のカードは作っていない。
