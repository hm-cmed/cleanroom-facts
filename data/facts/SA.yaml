- id: SA-021
  domain: SA
  subdomain: 反応性関節炎
  assertion:
    plain_statement_ja: 反応性関節炎は、感染を契機として生じる炎症性関節炎であり、脊椎関節炎の一群に分類される。発症には、宿主の感受性と病原体の相互作用が関わると考えられている。診断は、先行する感染の後に生じる関節炎という合致する臨床症候群と、起因病原体の微生物学的確認に基づいて行う。
    condition:
      region: 国際
      対象: 成人
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-4447
    source: Schmitt SK. Reactive Arthritis. Infect Dis Clin North Am. 2017;31(2):265-277
    doi: 10.1016/j.idc.2017.01.002
    pmid: '28292540'
    pmcid: null
    url: https://doi.org/10.1016/j.idc.2017.01.002
    source_license: CC 表示なし
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ63 2026-11-14）：Falagas ME, Stathopoulos P, Kontogiannis DS, Tzvetanova ID. Antibiotics for Rheumatologic Diseases: A Critical Review. Int J Mol Sci. 2025;26(21)／補助：Carron P, De Craemer AS, Van den Bosch F. Peripheral spondyloarthritis: a neglected entity—state of the art. RMD Open. 2020;6(1):e001136（PMID: 32385142、DOI: 10.1136/rmdopen-2019-001136、PMCID: PMC7299516）（PMID: 41226564、DOI: 10.3390/ijms262110527、PMCID: PMC12610879、https://pmc.ncbi.nlm.nih.gov/articles/PMC12610879/）。裏づける部分：主候補（CC BY の総説）が、反応性関節炎は泌尿生殖器のクラミジア感染や消化管のエルシニア・シゲラ・サルモネラ感染の後に生じると明記し、感染を契機とする炎症性関節炎というカードの定義と一致する。補助候補は反応性関節炎を脊椎関節炎の一群に位置づける。数値の照合：数値なし。留保：宿主の感受性と病原体の相互作用という発症の枠組みと、診断が臨床症候群と起因病原体の微生物学的確認に基づく点は候補では明示されていない。主出典 SRC-4447 は現行 RESTRICTED が正しい'
  uncertainty: 反応性関節炎に特化した診療ガイドラインは、国際的にも国内にも存在せず、本カードは総説に基づく。起因病原体の個別の頻度や、HLA-B27 との関連の強さは、総説の抄録では確認できなかったため主張に入れていない。
