- id: SA-002
  domain: SA
  subdomain: 体軸性脊椎関節炎、強直性脊椎炎
  assertion:
    plain_statement_ja: ASAS-EULAR 推奨の2022 update では、2剤以上の NSAIDs で効果不十分かつ ASDAS 2.1以上で、CRP 上昇、仙腸関節の MRI 炎症、X線仙腸関節炎のいずれかの客観的炎症所見がある場合に、生物学的製剤（TNF 阻害薬、IL-17 阻害薬）または標的合成 DMARD（JAK 阻害薬）の適応となる。開始薬は TNF 阻害薬か IL-17 阻害薬が現在の実践であり、再発性のぶどう膜炎や炎症性腸疾患には TNF モノクローナル抗体、目立つ乾癬には IL-17 阻害薬が優先される。
    condition:
      region: 国際
      対象: 成人
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1799
    source: 'Ramiro S, Nikiphorou E, Sepriano A, et al. ASAS-EULAR recommendations for the management of axial spondyloarthritis: 2022 update. Ann Rheum Dis. 2023;82(1):19-34'
    doi: 10.1136/ard-2022-223296
    pmid: '36270658'
    pmcid: null
    url: https://doi.org/10.1136/ard-2022-223296
    source_license: フリー公開だが CC の明示なし
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ63 2026-11-14）：López-Medina C, Montilla-Morales C, Moreno M, et al. Therapeutic management of axial spondyloarthritis: summary of 2024 update of the Spanish clinical practice guideline (ESPOGUIA). Ther Adv Musculoskelet Dis. 2026;18（PMID: 42544184、DOI: 10.1177/1759720X261464260、PMCID: PMC13428830、https://pmc.ncbi.nlm.nih.gov/articles/PMC13428830/）。裏づける部分：候補（CC BY のスペイン診療ガイドライン2024 update の要約）が ASAS-EULAR 推奨と歩調を合わせ、b/tsDMARD 開始前に客観的炎症所見（CRP 上昇または MRI 所見）を確認すること、再発性のぶどう膜炎と炎症性腸疾患では TNF モノクローナル抗体を優先することを明記し、開始条件の一部と優先規則がカードと一致する。数値の照合：ASDAS 2.1 以上という開始の閾値は候補では未確認。留保：NSAIDs 2剤以上で効果不十分という条件と、目立つ乾癬での IL-17 阻害薬優先は候補では明示されていない。主出典 SRC-1799 の区分訂正は別枠に分離した'
  uncertainty: 第30回 SP-023 は本出典の骨格（NSAIDs 第一選択、生物学的製剤の開始条件）のみを扱っており、本カードは JAK 阻害薬を含む2022 update の更新分である。国内承認：ウパダシチニブは強直性脊椎炎（2022年5月に適応追加）と X線基準を満たさない体軸性脊椎関節炎（2023年2月）に国内承認があり、セクキヌマブも両適応が添付文書で確認できる（PMDA 患者向医薬品ガイド・添付文書で確認）。イキセキズマブや TNF 阻害薬各剤など、その他の個別薬剤の適応範囲は未照合。推奨の骨格と開始条件は抄録で確認した。
