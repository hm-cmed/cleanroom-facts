- id: SA-013
  domain: SA
  subdomain: 線維筋痛症
  assertion:
    plain_statement_ja: 線維筋痛症の ACR 2016年改訂診断基準では、5つの領域のうち4領域以上に疼痛がある全身性疼痛があること、症状が同程度のレベルで3か月以上続いていること、広範囲疼痛指数（WPI）が7以上かつ症状重症度スケール（SSS）が5以上、または WPI が4〜6かつ SSS が9以上であること、の全てを満たす場合に診断できる。他の診断の有無にかかわらず診断は成立し、圧痛点の検査は不要である。
