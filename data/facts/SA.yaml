- id: SA-023
  domain: SA
  subdomain: 偽痛風
  assertion:
    plain_statement_ja: 急性CPP結晶関節炎（偽痛風）は、急性発症の単関節炎または少関節炎で、罹患関節の熱感・発赤・腫脹を伴い、痛風発作や化膿性関節炎と鑑別が困難なことが多い。罹患関節は膝関節が最も多く、次いで手関節であり、第1中足趾節関節の痛風様発作はまれである。発熱・悪寒などの全身症状を伴うことが多く、発作の持続は痛風の数日〜1週間より長く、数週間〜数か月に及ぶことがある。急性型は CPPD 病全体の約25%を占める。
    condition:
      region: 国際
      対象: CPPD病の患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-4974
    source: Rosenthal AK, Ryan LM. Calcium pyrophosphate deposition disease. N Engl J Med. 2016;374(26):2575-2584.
    doi: 10.1056/NEJMra1511117
    pmid: '27355536'
    pmcid: PMC6240444
    url: https://doi.org/10.1056/NEJMra1511117
    source_license: Massachusetts Medical Society（著者稿が PMC に収載）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ63 2026-11-14）：Guedes LKN, Figueiredo LQ, Lopes FOA, Ferrari LFF, Bonfiglioli KR. Ultrasonographic Assessment of Calcium Pyrophosphate Deposition Disease: A Comprehensive Review. J Pers Med. 2025;15(7)（PMID: 40710396、DOI: 10.3390/jpm15070280、PMCID: PMC12299270、https://pmc.ncbi.nlm.nih.gov/articles/PMC12299270/）。裏づける部分：候補（CC BY の総説）が、急性 CPP 結晶関節炎（偽痛風）は急性発症の単関節炎または少関節炎で、発熱や急性期蛋白上昇などの全身症状を伴い痛風に似ること、急性関節炎では膝関節の罹患が最も多いことを明記し、カードの臨床像と一致する。数値の照合：急性型が CPPD 病全体の約25%を占めるという割合は候補では未確認。留保：罹患関節で手関節が次に多いこと、第1中足趾節関節の痛風様発作はまれなこと、発作の持続が数週間〜数か月に及ぶことは候補では未確認。主出典 SRC-4974 は現行 RESTRICTED が正しい（PMC 収載は著者稿でライセンス表示なし）'
  uncertainty: 主張は PMC に収載された著者稿の全文で確認した（出版版は購読制）。急性型が約25%という割合は、同総説が引用する推計に基づく。CPP 結晶の同定と分類基準は OS-007 が担い、急性発作の治療は SA-024 が担う。
