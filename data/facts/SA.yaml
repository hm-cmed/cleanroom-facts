- id: SA-015
  domain: SA
  subdomain: 再発性多発軟骨炎
  assertion:
    plain_statement_ja: 再発性多発軟骨炎は、軟骨組織を主座とするまれな炎症性疾患で、耳、鼻、気道、関節を好発部位とし、血管、皮膚、内耳、眼など軟骨以外の臓器も侵しうる。再発を繰り返す経過のため診断の遅れが多い。特異的なマーカーはなく、普遍的に認められた分類基準も存在しないため、診断は臨床パターンの認識による。臨床的に本症と診断されていた患者の8%で、UBA1 変異による VEXAS 症候群が原因と判明している。
    condition:
      region: 国際
      対象: 成人
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3001
    source: 'Mertz P, Sparks J, Kobrin D, et al. Relapsing polychondritis: Best Practice & Clinical Rheumatology. Best Pract Res Clin Rheumatol. 2023;37(1):101867'
    doi: 10.1016/j.berh.2023.101867
    pmid: '37839908'
    pmcid: null
    url: https://doi.org/10.1016/j.berh.2023.101867
    source_license: CC 表示なし
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ63 2026-11-14）：Pan W, Yin L, Wang L, et al. Evaluating clinical heterogeneity in relapsing polychondritis through unsupervised cluster analysis. Arthritis Res Ther. 2026;28(1)（PMID: 42436525、DOI: 10.1186/s13075-026-03857-z、PMCID: PMC13491964、https://pmc.ncbi.nlm.nih.gov/articles/PMC13491964/）。裏づける部分：候補（CC BY）が、再発性多発軟骨炎は鼻梁・耳介の軟骨、眼や気道のプロテオグリカンに富む組織の炎症と破壊を特徴とし、非特異的な臨床像のため診断の遅れが大きいこと、VEXAS 症候群が模倣疾患として現れたことを述べ、カードの臨床像と概ね一致する。数値の照合：臨床的に本症と診断されていた患者の8%が VEXAS 症候群だったという割合は候補では未確認。留保：特異的マーカーがないこと、普遍的な分類基準が存在しないこと、診断が臨床パターンの認識によることは候補では明示されていない。主出典 SRC-3001 の区分訂正は別枠に分離した'
  uncertainty: 近年の総説に基づく。古典的な診断基準（McAdam、Damiani & Levine、Michet）の原著は未照合のため主張に含めていない。疾患活動性の承認された評価指標もないと総説は述べている。
