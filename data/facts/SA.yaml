- id: SA-004
  domain: SA
  subdomain: 末梢性脊椎関節炎
  assertion:
    plain_statement_ja: 乾癬性関節炎の CASPAR 分類基準は、炎症性関節疾患（関節、脊椎、付着部）があることを前提に、現在の乾癬に2点、乾癬の既往または家族歴、指趾炎、傍関節性新生骨形成、リウマトイド因子陰性、爪ジストロフィーに各1点を配し、合計3点以上で分類する。基準の感度は0.914、特異度は0.987であった。
    condition:
      region: 国際
      対象: 成人
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2993
    source: 'Taylor W, et al. Classification criteria for psoriatic arthritis: development of new criteria from a large international study (CASPAR). Arthritis Rheum. 2006;54(8):2665-2673'
    doi: 10.1002/art.21972
    pmid: '16871531'
    pmcid: null
    url: https://doi.org/10.1002/art.21972
    source_license: CC 表示なし（Crossref は Wiley の利用条件のみ）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ63 2026-11-14）：Kannappan R, Kim S, Lau A, Brent LH. Psoriatic Arthritis: From Diagnosis to Treatment. J Clin Med. 2025;14(22):8151（PMID: 41303186、DOI: 10.3390/jcm14228151、PMCID: PMC12653347、https://pmc.ncbi.nlm.nih.gov/articles/PMC12653347/）。裏づける部分：候補（CC BY の総説）が CASPAR 基準の構成（炎症性関節疾患を前提に、乾癬の証拠・爪ジストロフィー・リウマトイド因子陰性・指趾炎・傍関節性新生骨形成から合計3点以上）を再掲し、感度91.4%・特異度98.7%を明記する。カードと一致する。数値の照合：感度0.914・特異度0.987は候補と一致。留保：現在の乾癬に2点を配する重み付けは候補では明示されていない。主出典 SRC-2993 の区分訂正は別枠に分離した'
