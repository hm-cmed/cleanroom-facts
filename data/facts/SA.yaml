- id: SA-014
  domain: SA
  subdomain: 線維筋痛症
  assertion:
    plain_statement_ja: 線維筋痛症の管理について、EULAR の改訂推奨で根拠に基づく強い推奨（strong for）とされた治療は運動療法のみである。管理は段階的に行い、初期は患者教育と非薬物療法を中心とし、効果がなければ、気分障害や不適切な対処に対する心理療法、強い痛みや睡眠障害に対する薬物療法、重い障害に対する集学的リハビリテーションを、個々の必要に応じて加える。
    condition:
      region: 欧州
      対象: 成人
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3000
    source: Macfarlane GJ, Kronisch C, Dean LE, et al. EULAR revised recommendations for the management of fibromyalgia. Ann Rheum Dis. 2017;76(2):318-328
    doi: 10.1136/annrheumdis-2016-209724
    pmid: '27377815'
    pmcid: null
    url: https://doi.org/10.1136/annrheumdis-2016-209724
    source_license: CC 表示なし
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ63 2026-11-14）：Lopez de Coca T, Sebastian-Morello M, González-Mazarío R, Moreno L. Anticholinergic burden in fibromyalgia treatment analysis: Guidelines adherence and pharmacological alerts. Clinics (Sao Paulo). 2026;81（PMID: 41990485、DOI: 10.1016/j.clinsp.2026.100931、PMCID: PMC13094492、https://pmc.ncbi.nlm.nih.gov/articles/PMC13094492/）。裏づける部分：候補（CC BY）が EULAR 推奨に基づく段階的管理を再掲する：初期介入として運動療法などを置き、不十分な場合や睡眠障害がある場合に心理療法・薬物療法を個別化して加える。カードの管理の骨格と一致する。数値の照合：数値なし。留保：「根拠に基づく強い推奨（strong for）は運動療法のみ」という格付けは候補では再掲されず、候補は心理療法と身体活動をまとめて「強く推奨」と言い換えている。主出典 SRC-3000 の区分訂正は別枠に分離した'
  uncertainty: 推奨の骨格は抄録で確認した。国内の診療ガイドラインは日本線維筋痛症学会編の2017年版が確認できる最新版で、これより新しい国内改訂は確認できなかった（書誌のみの確認のため、本カードの出典にはしていない）。薬物療法の個別薬剤の国内承認状況は本カードでは扱っていない。
