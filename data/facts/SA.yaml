- id: SA-022
  domain: SA
  subdomain: 反応性関節炎
  assertion:
    plain_statement_ja: 反応性関節炎の治療では、クラミジアを契機とする例では抗菌薬が有用とされる一方、腸管病原体を契機とする例では抗菌薬の役割は明確でない。腫瘍壊死因子（TNF）阻害薬の位置づけは、まだ定まっていない。経過は数か月で収束する例が多いが、関節外の病変を伴ったり、経過が遷延したりする例もある。
    condition:
      region: 国際
      対象: 成人
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-4447
    source: Schmitt SK. Reactive Arthritis. Infect Dis Clin North Am. 2017;31(2):265-277
    doi: 10.1016/j.idc.2017.01.002
    pmid: '28292540'
    pmcid: null
    url: https://doi.org/10.1016/j.idc.2017.01.002
    source_license: CC 表示なし
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ63 2026-11-14）：Zeng H, Luo B, Zhang Y, Xie Z, Ye Z. Treatment of reactive arthritis with biological agents: a review. Biosci Rep. 2020;40(2)／補助：Falagas ME, Stathopoulos P, Kontogiannis DS, Tzvetanova ID. Antibiotics for Rheumatologic Diseases: A Critical Review. Int J Mol Sci. 2025;26(21)（PMID: 41226564、DOI: 10.3390/ijms262110527、PMCID: PMC12610879）（PMID: 32039436、DOI: 10.1042/BSR20191927、PMCID: PMC7033307、https://pmc.ncbi.nlm.nih.gov/articles/PMC7033307/）。裏づける部分：主候補（CC BY の総説）が、クラミジア起因の反応性関節炎では抗菌薬の併用療法が疾患活動性を下げうること、本症は自然収束するが従来治療に反応しない難治例があることを述べ、補助候補も抗菌薬が有用でありうる一方で研究結果は一様でないとする。カードの治療と経過の骨格と概ね一致する。数値の照合：数値なし。留保：腸管病原体を契機とする例では抗菌薬の役割が明確でないという対比と、TNF 阻害薬の位置づけが定まっていないという表現自体は候補では再掲されていない（候補は難治例への生物学的製剤に前向きの内容）。主出典 SRC-4447 は現行 RESTRICTED が正しい'
  uncertainty: 反応性関節炎に特化した診療ガイドラインは存在せず、本カードは総説に基づく。抗 TNF 薬は国内では反応性関節炎を適応として承認されておらず、抗菌薬の使用は起因病原体ごとの感染症としての国内承認の範囲による。NSAIDs など対症療法の個別の位置づけは、総説の抄録では確認できなかったため本カードには含めていない。
