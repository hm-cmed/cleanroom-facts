- id: SA-020
  domain: SA
  subdomain: リウマチ熱
  assertion:
    plain_statement_ja: 急性リウマチ熱の診断に用いる Jones 基準は、2015年に、1992年以来となる大幅な改訂が行われた。この改訂では、集団ごとのリスク層別（低リスク集団と中等度・高リスク集団）が初めて導入され、リスクの高い集団では臨床像のばらつきが考慮されるようになった。また、ドプラ心エコー図で検出される無症候性（subclinical）心炎が、主要基準である心炎に含められた。
