- id: SA-005
  domain: SA
  subdomain: 末梢性脊椎関節炎
  assertion:
    plain_statement_ja: EULAR の乾癬性関節炎の薬物療法推奨（2023 update）では、末梢関節炎には従来型合成 DMARD の迅速な開始が推奨され、メトトレキサートが優先される。目標未達なら生物学的製剤を開始し、皮膚乾癬が目立つ場合は IL-23 や IL-17 を標的とする製剤へ誘導する。JAK 阻害薬は主に生物学的製剤の失敗後か、生物学的製剤が不適切な場合に提案される。NSAIDs の単独療法は軽症かつ短期間のみで、経口グルココルチコイドは推奨されない。
    condition:
      region: 欧州
      対象: 成人
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2994
    source: 'Gossec L, et al. EULAR recommendations for the management of psoriatic arthritis with pharmacological therapies: 2023 update. Ann Rheum Dis. 2024;83(6):706-719'
    doi: 10.1136/ard-2024-225531
    pmid: '38499325'
    pmcid: PMC11103320
    url: https://doi.org/10.1136/ard-2024-225531
    source_license: CC の明示を確認できず（BMJ の OA ユーザーライセンス表示のみ）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ63 2026-11-14）：Sewerin P, Baraliakos X. 2023 EULAR Recommendations for the Treatment of PsA: Advances and Pending Issues. Mediterr J Rheumatol. 2024;35(2)（PMID: 39211029、DOI: 10.31138/mjr.050424.ert、PMCID: PMC11350422、https://pmc.ncbi.nlm.nih.gov/articles/PMC11350422/）。裏づける部分：候補（CC BY の解説）が EULAR 2023 update の要点を再掲する：NSAIDs 単独療法は軽症かつ短期間のみ、経口グルココルチコイドは推奨されなくなった、皮膚病変が重い場合は IL-12/23・IL-23・IL-17 を標的とする製剤が優先される、JAK 阻害薬は末梢病変では生物学的製剤の失敗後に位置づけられる、疾患修飾療法の早期開始を遅らせない。カードの推奨骨格と一致する。数値の照合：数値なし（推奨の骨格のカード）。留保：メトトレキサート優先の明示は候補では「MTX 投与後の製剤選択」という文脈での言及にとどまる。主出典 SRC-2994 は CC BY-NC で、区分訂正は別枠に分離した'
  uncertainty: 国内承認：ウパダシチニブ（2021年5月に適応追加）、セクキヌマブ、グセルクマブは乾癬性関節炎の適応で国内承認があり、添付文書で確認できる。リサンキズマブ、ビメキズマブ、アプレミラストなど、その他の薬剤の個別の国内適応範囲は未照合。推奨の骨格は抄録で確認した。GRAPPA 推奨2021年版も現行の国際推奨だが、本カードでは EULAR 2023 update を正とした。
