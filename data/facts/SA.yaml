- id: SA-016
  domain: SA
  subdomain: アミロイドーシス
  assertion:
    plain_statement_ja: 全身性アミロイドーシスの中で最も多いのは免疫グロブリン軽鎖（AL）アミロイドーシスだが、野生型トランスサイレチン心アミロイドーシス（ATTRwt）の診断例が増えている。アミロイド線維のタイピングが治療決定の要であり、心アミロイドーシスの評価は心臓 MRI と骨シンチグラフィで可能になった。AL アミロイドーシスの生存は新しい化学療法で大きく改善したが、早期診断はいまだ難しい。
    condition:
      region: 国際
      対象: 成人
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-979
    source: Wechalekar AD, Gillmore JD, Hawkins PN. Systemic amyloidosis. The Lancet. 2016;387:2641-2654
    doi: 10.1016/S0140-6736(15)01274-X
    pmid: '26719234'
    pmcid: null
    url: https://doi.org/10.1016/S0140-6736(15)01274-X
    source_license: ライセンス表示を確認できず
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ63 2026-11-14）：Sclafani M, Russo D, Oikonomou G, et al. Imaging Cardiac Amyloidosis: From Early Diagnosis to Risk Stratification and Evaluation of Treatment Efficacy. J Cardiovasc Dev Dis. 2026;13(8)／補助：Tebenkova A, Gioeva Z, Shakhpazyan N, et al. Comparative Histopathological Characteristics of Duodenal Involvement in Different Types of Amyloidosis. Biomedicines. 2025;13(9)（PMID: 41007759、DOI: 10.3390/biomedicines13092196、PMCID: PMC12467754）（PMID: 42645872、DOI: 10.3390/jcdd13080401、PMCID: PMC13513095、https://pmc.ncbi.nlm.nih.gov/articles/PMC13513095/）。裏づける部分：主候補（CC BY の総説）が、心アミロイドーシスの評価で骨シンチグラフィがトランスサイレチン型の非侵襲的診断を可能にしたこと、心臓 MRI を含む画像評価の役割、疾患の認識が広がり早期診断が重要であることを述べる。補助候補は AL アミロイドーシスが最も多い型であることを明記する。数値の照合：数値なし。留保：野生型トランスサイレチン型の診断例が増えている点、タイピングが治療決定の要という表現、AL の生存が新しい化学療法で改善した点は候補では未確認。主出典 SRC-979 の区分訂正は別枠に分離した'
  uncertainty: 全身性アミロイドーシスの総論の出典として再利用した。原発性（AL）アミロイドーシスの各論は第39回（LY）で作成済みであり、本カードは総論に限る。腎病変は GN、アミロイドニューロパチーは PN が正で、ATTR 心筋症の治療試験（SRC-980）は病型が異なるため混同しないこと。
