- id: BO-027
  domain: BO
  subdomain: 軟部肉腫総論
  assertion:
    plain_statement_ja: 骨・軟部肉腫の生検では診断エラーや手技の問題が少なくなく、生検に起因する問題のために不必要な切断を余儀なくされた症例も報告されている。エラー・合併症・転帰の変更は紹介元施設で行われた生検で治療施設の2〜12倍多く、生検は最終手術を行う治療施設で、その切除計画と整合させて行うべきである。
