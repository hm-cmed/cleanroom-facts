- id: BO-007
  domain: BO
  subdomain: 骨肉腫
  assertion:
    plain_statement_ja: 高悪性度骨肉腫の化学療法では、高用量メトトレキサート・ドキソルビシン・シスプラチンの3剤併用（MAP療法）が最も有効なレジメンの一つとして確立しており、多剤併用化学療法の導入により限局性骨肉腫の長期生存率は20%未満から65〜70%へ改善した。治療には腫瘍の完全切除を伴う手術が組み合わされる。
    condition:
