  assertion:
    plain_statement_ja: 転移性骨腫瘍の管理では、ビスホスホネートや抗 RANKL 抗体デノスマブなどの骨修飾薬が骨折などの骨関連事象の予防・遅延に用いられ、局所の骨痛には放射線治療が選択され、切迫骨折には内固定と術後照射、長管骨・股関節の骨折や脊髄圧迫には手術が適応となる。
