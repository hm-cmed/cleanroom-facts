- id: BO-005
  domain: BO
  subdomain: 骨巨細胞腫
  assertion:
    plain_statement_ja: 抗 RANKL 抗体デノスマブは骨巨細胞腫に有効であり、切除不能例で長期の病勢制御が得られ、手術により重篤な機能障害が見込まれる切除可能例では、投与開始後6か月の時点で92%の患者が手術を受けずに済んだ。
    condition:
      population: 切除不能または手術で重篤な障害が見込まれる骨巨細胞腫患者
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1897
    source: 'Chawla S, Blay JY, Rutkowski P, et al. Denosumab in patients with giant-cell tumour of bone: a multicentre, open-label, phase 2 study. Lancet Oncol. 2019;20(12):1719-1729'
    doi: 10.1016/S1470-2045(19)30663-1
    pmid: '31704134'
    pmcid: null
    url: https://doi.org/10.1016/S1470-2045(19)30663-1
    source_license: © Elsevier（The Lancet Oncology、CC 表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: 自由に使える資料による裏づけ（GOV_US、作り手の調査バッチ57 2026-11-13）：ClinicalTrials.gov 登録レコード NCT00680992（An Open-label, Multi-center, Phase 2 Study of Denosumab in Subjects With Giant Cell Tumor of Bone; Amgen 試験20062004） ClinicalTrials.gov（米国政府）, 結果掲載あり。ライセンス：米国政府レジストリ（GOV_US）。 確認内容：副次評価項目「Percentage of Participants Without Any On-Study Surgery at Month 6 for Cohort 2」の結果が 92.0% と掲載され、カードの「6か月時点で92%が手術を受けずに済んだ」と一致する。／備考：主出典は Chawla ら Lancet Oncol 2019（同試験の最終解析）で、登録結果と数値が一致する。なお当初の候補だった NCT00396279 は別試験であり、対象試験は NCT00680992 である。（新規 SRC 候補）
  uncertainty: デノスマブ（ランマーク皮下注120mg）は国内で2014年5月に「骨巨細胞腫」の効能追加が承認され保険適用があることを、製造販売業者（第一三共）の公表資料と PMDA の審査資料で確認した。投与中止後の再燃や術前投与時の掻爬後の再発については本試験の抄録範囲を超えるため命題に含めていない。
