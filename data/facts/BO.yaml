- id: BO-001
  domain: BO
  subdomain: 骨軟骨腫
  assertion:
    plain_statement_ja: 骨軟骨腫は最も多い良性骨腫瘍であり、85%が単発性で、15%が常染色体優性遺伝の多発性外骨腫症に伴う。成人で軟骨帽の厚さが2cmを超える場合や、骨成長板閉鎖後の疼痛出現・増大は悪性転化を示唆する所見である。
    condition:
      population: 骨軟骨腫患者
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1893
    source: 'Tepelenis K, Papathanakos G, Kitsouli A, et al. Osteochondromas: An Updated Review of Epidemiology, Pathogenesis, Clinical Presentation, Radiological Features and Treatment Options. In Vivo. 2021;35(2):681-691（PMCID: PMC8045119）'
    doi: 10.21873/invivo.12308
    pmid: '33622860'
    pmcid: null
    url: https://doi.org/10.21873/invivo.12308
    source_license: © International Institute of Anticancer Research（In Vivo、CC 表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ57 2026-11-13）：Yu D, Kaempfen A, Burger M, Barlow K, Krieg AH. The most common bone tumors of the upper extremity in childhood and adolescence and their treatment: a review of the current literature. EFORT Open Reviews. 2026;11(4):317-327。ライセンス：CC BY。 DOI: 10.1530/EOR-2025-0149、PMID: 41945572、PMCID: PMC13087867。 確認内容：骨軟骨腫が最も多い良性骨腫瘍の一つであること、骨格成熟後に軟骨帽が2cmを超える場合は二次性軟骨肉腫を疑うことが本文（CC BY 4.0 表示を確認）に記載されている。 未確認要素：単発85%／多発15%という内訳そのものは自由全文では確認できなかった。／Bovée JVMG. Multiple osteochondromas. Orphanet Journal of Rare Diseases. 2008;3:3。ライセンス：CC BY。 DOI: 10.1186/1750-1172-3-3、PMID: 18271966、PMCID: PMC2276198。 確認内容：多発性骨軟骨腫（多発性外骨腫症）が常染色体優性遺伝であること、悪性転化の推定頻度0.5–5%が記載されている。／備考：主出典の区分 RESTRICTED は妥当（In Vivo 誌、PMC の permissions は著者・出版者表示のみで CC 表示なし）。（新規 SRC 候補）'
  uncertainty: 好発部位（長管骨の骨幹端）や有茎性・広基性の形態は抄録の記述に基づく一般像であり、本カードの数値（85%/15%、軟骨帽2cm）はこの総説の記載による。国内の診療指針での扱いは別途確認を要する。
