- id: BO-017
  domain: BO
  subdomain: 脂肪腫
  assertion:
    plain_statement_ja: 四肢の脂肪性腫瘍は最も多い軟部病変で、その大部分は良性の脂肪腫である。ただし筋膜より深部にあり長径5cmを超える脂肪性病変は、異型脂肪性腫瘍や脱分化型脂肪肉腫との鑑別のため、経皮生検（MDM2 遺伝子増幅の検出を含む）による精査を要する。
    condition:
      population: 四肢の脂肪性軟部腫瘍患者
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1908
    source: Le Nail LR, Crenn V, Rosset P, Ropars M. Management of adipose tumors in the limbs. Orthop Traumatol Surg Res. 2022;108(1S):103162
    doi: 10.1016/j.otsr.2021.103162
    pmid: '34863958'
    pmcid: null
    url: https://doi.org/10.1016/j.otsr.2021.103162
    source_license: © Elsevier Masson SAS（著作権表示あり・CC 表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ57 2026-11-13）：Liu H, Wang X, Wang X, Qiu F, Zhou B. Challenges and hope: latest research trends in the clinical treatment and prognosis of liposarcoma. Frontiers in Pharmacology. 2025;16:1529755。ライセンス：CC BY。 DOI: 10.3389/fphar.2025.1529755、PMID: 40421219、PMCID: PMC12104207。 確認内容：異型脂肪性腫瘍／高分化型脂肪肉腫と脱分化型脂肪肉腫の分子的特徴が12q13-15領域（MDM2・CDK4）の増幅であることが明記され、MDM2 増幅検出を含む精査という鑑別方針の根拠を裏づける。 未確認要素：「筋膜より深部・長径5cm超」という精査開始の具体的基準そのものは総説本文では確認できなかった。／備考：主出典 SRC-1908 は Elsevier の OA ユーザーライセンス（CC ではない）であり RESTRICTED の現行区分は妥当。（新規 SRC 候補）'
