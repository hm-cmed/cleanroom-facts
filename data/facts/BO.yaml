    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ57 2026-11-13）：Tsukamoto S, Mavrogenis AF, Masunaga T, et al. Current Concepts in the Treatment of Giant Cell Tumor of Bone: An Update. Current Oncology. 2024;31(4):2112-2132。ライセンス：CC BY。 DOI: 10.3390/curroncol31040157、PMID: 38668060、PMCID: PMC11048866。 確認内容：中間悪性度（intermediate grade）で局所侵襲性が高いこと、好発年齢は約30歳で骨端部に生じること、肺転移が1–9%に生じることが記載されている。／Tsukamoto S, Errani C, Balach T, et al. What''s new on giant cell tumor of bone. SICOT-J. 2026;12:2。ライセンス：CC BY。 DOI: 10.1051/sicotj/2025063、PMID: 41568883、PMCID: PMC12825416。 確認内容：中間悪性度で原発性骨腫瘍の約5%を占め局所侵襲性が高いこと、発症は約30歳で骨端部に多いことが記載されている（PMC の license-ref は CC BY）。／備考：主出典 SRC-1896 の区分訂正は別枠の節に分離した。WHO 第5版以降の「中間型」という用語についてはフラグ参照。（新規 SRC 候補）'
