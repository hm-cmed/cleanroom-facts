- id: BO-004
  domain: BO
  subdomain: 骨巨細胞腫
  assertion:
    plain_statement_ja: 骨巨細胞腫は組織学的には良性だが局所侵襲性を示し転移する能力を持つ腫瘍で、若年成人の長管骨の関節近傍（骨端部）に好発し、一部の患者では肺転移を生じる。
