- id: BO-005
  domain: BO
  subdomain: 骨巨細胞腫
  assertion:
    plain_statement_ja: 抗 RANKL 抗体デノスマブは骨巨細胞腫に有効であり、切除不能例で長期の病勢制御が得られ、手術により重篤な機能障害が見込まれる切除可能例では、投与開始後6か月の時点で92%の患者が手術を受けずに済んだ。
    condition:
      population: 切除不能または手術で重篤な障害が見込まれる骨巨細胞腫患者
