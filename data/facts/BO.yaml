  uncertainty: 粘液型・多形型など他の亜型の頻度と予後は本出典（高分化型・脱分化型の総説）の対象外であり命題に含めていない。脂肪肉腫全体が軟部肉腫の中で多い型であることは、BO-017 の出典（四肢の脂肪性腫瘍は最も多い軟部病変）とも整合するが、本カードでは高分化型・脱分化型に範囲を限った。
