    doi: 10.1200/JCO.2014.59.4895
    pmid: '26304877'
    pmcid: null
    url: https://doi.org/10.1200/JCO.2014.59.4895
    source_license: © American Society of Clinical Oncology（Journal of Clinical Oncology、CC 表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: 自由に使える資料による裏づけ（GOV_US、作り手の調査バッチ57 2026-11-13）：National Cancer Institute. Osteosarcoma and Undifferentiated Pleomorphic Sarcoma of Bone Treatment (PDQ®) — Health Professional Version. NCI PDQ® Cancer Information Summary (cancer.gov), 2026-11-13 閲覧。ライセンス：米国政府著作物（GOV_US）。 https://www.cancer.gov/types/bone/hp/osteosarcoma-treatment-pdq。 確認内容：EURAMOS-1 の骨格は MAP（シスプラチン＋ドキソルビシン＋高用量メトトレキサート）。手術単独では限局性切除可能例の20%未満しか無再発生存が期待できないこと、手術＋化学療法の限局例の転帰、完全切除の必須性が記載されている。 未確認要素：PDQ の数値は「限局例の5年全生存率62–65%」であり、カードの「長期生存率65–70%」（主出典 Isakoff 2015 由来）とは指標の定義が異なる（フラグ参照）。／備考：MAP 療法の骨格、化学療法導入による転帰改善の方向、完全切除の必須性は PDQ で裏づけられる。生存率の数値表現の差異はフラグ参照。（新規 SRC 候補）
