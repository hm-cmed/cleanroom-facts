- id: BO-006
  domain: BO
  subdomain: 骨肉腫
  assertion:
    plain_statement_ja: 骨肉腫は小児・若年に最も多い原発性悪性骨腫瘍で、思春期の成長スパート期（10〜14歳）に発症のピークがあり、長管骨の骨幹端に好発する。部位は大腿骨（42%、うち75%が遠位）、脛骨（19%、うち80%が近位）の順に多い。
    condition:
      population: 骨肉腫患者
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1898
    source: Ottaviani G, Jaffe N. The epidemiology of osteosarcoma. Cancer Treat Res. 2009;152:3-13
    doi: 10.1007/978-1-4419-0284-9_1
    pmid: '20213383'
    pmcid: null
    url: https://doi.org/10.1007/978-1-4419-0284-9_1
    source_license: © Springer（Cancer Treatment and Research 収載の章、CC 表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN／GOV_US、作り手の調査バッチ57 2026-11-13）：National Cancer Institute. Osteosarcoma and Undifferentiated Pleomorphic Sarcoma of Bone Treatment (PDQ®) — Health Professional Version. NCI PDQ® Cancer Information Summary (cancer.gov), 2026-11-13 閲覧。ライセンス：米国政府著作物（GOV_US）。 https://www.cancer.gov/types/bone/hp/osteosarcoma-treatment-pdq。 確認内容：EURAMOS-1 の骨格は MAP（シスプラチン＋ドキソルビシン＋高用量メトトレキサート）。手術単独では限局性切除可能例の20%未満しか無再発生存が期待できないこと、手術＋化学療法の限局例の転帰、完全切除の必須性が記載されている。 未確認要素：PDQ の数値は「限局例の5年全生存率62–65%」であり、カードの「長期生存率65–70%」（主出典 Isakoff 2015 由来）とは指標の定義が異なる（フラグ参照）。／El Motassime A, Vitiello R, Comodo RM, et al. Osteosarcoma: A Comprehensive Morphological and Molecular Review with Prognostic Implications. Biology. 2025;14(10):1407。ライセンス：CC BY。 DOI: 10.3390/biology14101407、PMID: 41154810、PMCID: PMC12561861。 確認内容：思春期の急速な骨成長期にピークを持つ二峰性の年齢分布であること、長管骨の骨幹端（大腿骨遠位・脛骨近位）に好発することが記載されている。PDQ 医療者版にも青年期・若年成人に好発し、半数超が膝周囲の長管骨に生じる旨がある。／備考：部位別割合（大腿骨42%・うち75%が遠位、脛骨19%・うち80%が近位）の内訳そのものは自由全文では確認できず、主出典（Springer 書籍章）に依存する（フラグ参照）。（新規 SRC 候補）'
  uncertainty: 頻度の数値は米国の登録データに基づく本章の記載であり、国内の発生頻度とは異なる可能性がある。高齢者の第二のピーク（Paget 病に続発するものなど）は命題に含めていない。
