  subdomain: 骨軟骨腫
  assertion:
    plain_statement_ja: 骨軟骨腫は最も多い良性骨腫瘍であり、85%が単発性で、15%が常染色体優性遺伝の多発性外骨腫症に伴う。成人で軟骨帽の厚さが2cmを超える場合や、骨成長板閉鎖後の疼痛出現・増大は悪性転化を示唆する所見である。
