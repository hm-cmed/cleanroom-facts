  assertion:
    plain_statement_ja: 骨転移の過半数は乳癌と前立腺癌によるものであり、骨転移は疼痛、病的骨折、脊髄圧迫、高カルシウム血症などの骨関連事象を引き起こし、病的状態の主要な原因となる。骨転移は原発性骨腫瘍よりはるかに頻度が高い。
