- id: BO-023
  domain: BO
  subdomain: 脂肪肉腫
  assertion:
    plain_statement_ja: 高分化型脂肪肉腫と脱分化型脂肪肉腫は合わせて脂肪肉腫の最大の亜群をなし、12q13-15領域（MDM2・CDK4 を含む）の高レベル増幅を共有する。高分化型は転移しないが、脱分化を起こすと局所再発・転移を来しうるより侵襲的な経過をとる。
    condition:
      population: 脂肪肉腫患者
      region: 国際
    differential: null
    common_misconception: null
