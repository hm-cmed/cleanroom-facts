- id: PD-006
  domain: PD
  subdomain: 新生児マススクリーニングの総論
  assertion:
    plain_statement_ja: 日本の新生児マススクリーニング（先天性代謝異常等検査）は、都道府県及び指定都市を実施主体として全ての新生児を対象に血液による検査を行い、異常を早期に発見して治療・生活指導につなげることで知的障害等の発生を予防する事業である。対象は内分泌疾患2疾患（先天性甲状腺機能低下症、先天性副腎過形成症）、アミノ酸代謝異常症、有機酸代謝異常症、脂肪酸代謝異常症、糖代謝異常症（ガラクトース血症）の計20疾患で、タンデムマス法は平成26年度に全ての実施主体へ導入され、平成29年度にカルニチンパルミトイルトランスフェラーゼ-2欠損症が追加されて20疾患となった。重症複合免疫不全症と脊髄性筋萎縮症は令和5年度から実証事業としてモデル的に実施されており、標準の対象20疾患には含まれていない
    condition:
      region: 日本
      対象: 新生児
    differential: null
    common_misconception: null
