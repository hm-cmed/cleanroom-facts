    plain_statement_ja: 帝王切開の適応判断の総論として、WHO の声明は、集団レベルでは帝王切開率が10%を超えても母体・新生児死亡率の低下とは関連しないとし、特定の率の達成を目指すのではなく、帝王切開を必要とする女性に確実に提供することを求めている。施設間や国際間の帝王切開率の監視と比較には、妊婦を5つの産科的特性によって10群に分ける Robson 分類を国際標準として用いることが提案されている
