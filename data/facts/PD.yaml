- id: PD-009
  domain: PD
  subdomain: 妊娠中の薬物使用の注意総論
  assertion:
    plain_statement_ja: 妊娠中の医薬品使用では、胎児への影響を過剰に心配して医師等が必要と判断した薬物治療を控えたり、患者本人が自己判断で服薬を中止したりすると、母体の健康状態が悪化してかえって胎児に悪影響を及ぼすおそれがあるため、個別の薬剤のリスク評価に基づく判断が求められる。国内では、厚生労働省により平成17年10月に国立成育医療研究センターへ「妊娠と薬情報センター」が設置され、医薬品が胎児へ与える影響など最新のエビデンスの収集・評価と、妊婦や妊娠を希望する女性からの相談対応（全国47都道府県の拠点病院に「妊娠と薬外来」を設置）を行い、相談事例の蓄積は添付文書改訂の是非の検討（妊婦・授乳婦を対象とした薬の適正使用推進事業）にも活用されている
