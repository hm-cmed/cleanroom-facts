- id: PD-007
  domain: PD
  subdomain: 出生前診断・胎児スクリーニングの総論（NIPT を含む）
  assertion:
    plain_statement_ja: 出生前スクリーニングの体系では、全ての妊婦に対して年齢やリスクにかかわらず、染色体異数性のスクリーニング検査と診断的検査の双方の選択肢を提示すべきであり、母体血中の cell-free DNA を用いる検査は、一般的な染色体異数性に対するスクリーニング検査の中で最も感度・特異度が高い。スクリーニング検査の結果は診断ではなく、診断の確定には絨毛検査や羊水検査などの診断的検査が必要である
