- id: PD-001
  domain: PD
  subdomain: 妊婦健診と周産期管理の構成
  assertion:
    plain_statement_ja: 日本の妊婦健康診査は、母子保健法に基づく厚生労働省告示の望ましい基準により市町村が実施し、妊婦1人につき出産までに14回程度行われ、その実施に要する費用は市町村が負担する。頻度の目安は妊娠初期から23週までがおおむね4週間に1回、24週から35週までがおおむね2週間に1回、36週から出産までがおおむね1週間に1回で、各回に問診・診察と子宮底長、腹囲、血圧、浮腫、尿（糖及び蛋白）、体重等の検査を行い、妊娠週数に応じた時期に血液型等の検査、感染症等の血液検査、超音波検査（妊娠期間を通じて4回が目安）などの医学的検査を組み合わせる
    condition:
      region: 日本
      対象: 妊婦
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3530
    source: 厚生労働省「妊婦に対する健康診査についての望ましい基準」（平成27年3月31日 厚生労働省告示第226号、令和2年改正）
    doi: null
    pmid: null
    pmcid: null
    url: https://www.mhlw.go.jp/web/t_doc?dataId=82ab4662&dataType=0&pageNo=1
    source_license: 政府標準利用規約（厚生労働省）
    legal_basis: B
    source_class: GOV_JP
    corroboration: null
  uncertainty: 告示本文で確認した基準の枠組みに限る。実際の助成の細部は市町村の運用による。産科編2026の妊婦健診に関する記載は刊行版の本文未照合のため用いていない
