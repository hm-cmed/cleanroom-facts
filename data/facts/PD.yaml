    pmid: '34011889'
    pmcid: null
    url: https://doi.org/10.1097/AOG.0000000000004410
    source_license: © 2021 ACOG
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: ACOG Practice Bulletin No. 229（2021年）の抄録で確認した範囲に限る。個別の母体疾患・胎児疾患ごとのサーベイランス開始時期と頻度の詳細は本文未照合のため主張に入れていない。個別の胎児機能不全への適用は第48回 FT が正
