- id: PD-008
  domain: PD
  subdomain: 出生前診断・胎児スクリーニングの総論（NIPT を含む）
  assertion:
    plain_statement_ja: 日本では、日本医学会に設置された出生前検査認証制度等運営委員会の指針（2022年2月）に基づき、NIPT を実施する医療機関と検査分析機関の認証制度が運用されている。認証医療機関は、遺伝カウンセリングから確定的検査とその後の対応までを自施設で担う基幹施設と、基幹施設との連携のもとで実施する連携施設に分かれ、NIPT の対象疾患は13トリソミー、18トリソミー、21トリソミーとされる。出生前検査は、それだけでは診断を確定できない非確定的検査と、結果に基づいて診断を確定できる確定的検査に大別され、受検には十分な説明と遺伝カウンセリングが不可欠とされ、マススクリーニングとして一律に実施することや推奨することは否定されている
