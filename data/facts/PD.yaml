- id: PD-004
  domain: PD
  subdomain: 母体救急の初期対応総論
  assertion:
    plain_statement_ja: 妊婦の心停止では、妊娠子宮による大動脈・下大静脈の圧迫を解除するための用手的な子宮左方転位を蘇生を通じて継続し、低酸素血症に陥りやすいため気道確保と換気を迅速に行う。除細動のエネルギー量と蘇生に用いる薬剤は非妊婦と同様とし、蘇生に反応しない場合は蘇生開始から4分で蘇生子宮切開（perimortem cesarean delivery）に着手し5分までの娩出を目標として、搬送せず蘇生を行っている現場で実施する
    condition:
      region: 米国
      対象: 妊産婦
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3532
    source: 'Jeejeebhoy FM, Zelop CM, Lipman S, et al. Cardiac Arrest in Pregnancy: A Scientific Statement From the American Heart Association. Circulation. 2015;132(18):1747-1773'
    doi: 10.1161/CIR.0000000000000300
    pmid: '26443610'
    pmcid: null
    url: https://doi.org/10.1161/CIR.0000000000000300
    source_license: © 2015 American Heart Association
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 米国心臓協会の科学ステートメント（2015年）に基づく母体心停止への初期対応の枠組みに限る。個別の薬剤名は主張に含めておらず、国内の母体救命システムの体制の詳細は本カードの対象外
