- id: PD-005
  domain: PD
  subdomain: 母体搬送・新生児搬送
  assertion:
    plain_statement_ja: 日本の周産期医療体制では、母体・新生児搬送の受け皿として、リスクの高い妊娠への医療と高度な新生児医療を担う総合周産期母子医療センター（原則として三次医療圏に1か所）と、比較的高度な周産期医療と24時間体制での周産期救急を担う地域周産期母子医療センターが置かれ、平成29年度までに全都道府県へ配置された。施設数は令和6年4月1日現在で総合112か所・地域296か所であり、ハイリスクの母体と新生児はリスクに応じてこれらのセンターへ搬送される階層的な体制をとる
