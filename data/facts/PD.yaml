- id: PD-002
  domain: PD
  subdomain: 胎児評価法の方法論総論（NST・CTG・BPS）
  assertion:
    plain_statement_ja: 分娩前の胎児サーベイランスは死産のリスク低減を目的とし、胎児心拍パターンの評価（NST、CST）、超音波による biophysical profile（BPS）、臍帯動脈ドプラ血流計測などを組み合わせて胎児の状態を評価する。NST は20分間に2回以上の acceleration がみられる場合に reactive と判定され、BPS は5項目の合計スコアで8〜10が正常、6が equivocal、4以下が異常とされる
    condition:
      region: 米国
      対象: 妊婦
    differential: null
    common_misconception: null
  provenance:
