- id: BL-001
  domain: BL
  subdomain: 造血と血球の分化
  assertion:
    plain_statement_ja: 造血幹細胞は多能性と自己複製能を併せ持つ細胞で、すべての機能的な血液細胞に分化することができ、短命な成熟血球を生涯にわたって補充し続ける
    condition:
      region: 国際
      対象: 成人
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-4987
    source: 'National Institutes of Health. Stem Cell Information: Chapter 5. Hematopoietic Stem Cells (NIH stem cell report, chapter PDF)'
    doi: null
    pmid: null
    pmcid: null
    url: https://webarchive.library.unt.edu/eot2008/20090130203623mp_/http://stemcells.nih.gov/staticresources/info/scireport/PDFs/chapter5.pdf
    source_license: 米国連邦政府の著作物
    legal_basis: B
    source_class: GOV_US
    corroboration: '元の主出典：SRC-2478（Seita J, Weissman IL. Hematopoietic stem cell: self-renewal versus differentiation. Wiley Interdiscip Rev Syst Biol Med. 2010;2(6):640-653.）。自由に使える資料による裏づけ（OPEN、作り手の調査バッチ79 2026-11-15）：Cheng H, Zheng Z, Cheng T. New paradigms on hematopoietic stem cell differentiation. Protein Cell. 2020;11(1):34-44（PMID: 31201709、DOI: 10.1007/s13238-019-0633-0、PMCID: PMC6949320、https://pmc.ncbi.nlm.nih.gov/articles/PMC6949320/）。裏づける部分：候補（CC BY 4.0 総説）が、造血幹細胞は自己複製（self-renewal）と多分化能（multipotent differentiation）という2つの本質的性質によって定義され、すべての血球系譜の細胞を産生できること、造血階層の頂点に位置し、長期造血幹細胞が全系譜の成熟血球に大きく寄与することを述べ、カードの主張の骨格と一致する。数値の照合：数値なし（概念のカード）。「短命な成熟血球を生涯にわたって補充し続ける」という表現そのものは候補に再掲なし（定常状態の造血への長期造血幹細胞の寄与としての記載にとどまる）。留保：主出典 SRC-2478 の区分は現行 RESTRICTED が正しい（Wiley。Crossref の版データは Wiley の利用条件のみ、Europe PMC の個別レコードで非 OA。PMC 収載分 PMC2950323 は著者稿でライセンス表示なし）。識別子補完候補あり（補完候補の節参照）'
  uncertainty: 主張は抄録で確認した範囲（造血系の階層構造の総論）。分化の各段階の詳細は本文未照合のため主張に入れていない
  curriculum:
    kokushi: null
    core_curriculum: 'PS-02-02-01 (id: JkxnuPM)；TBL-02-01-001 (id: JlAKpVg)；TBL-02-01-002 (id: JlAKpVk)；TBL-02-01-003 (id: JlAKpVo)'
