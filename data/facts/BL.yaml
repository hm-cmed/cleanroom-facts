    corroboration: '元の主出典：SRC-2484（Vlaar APJ, Toy P, Fung M, et al. A consensus redefinition of transfusion-related acute lung injury. Transfusion. 2019;59(7):2465-2476.）。自由に使える資料による裏づけ（OPEN、作り手の調査バッチ79 2026-11-15）：Yu Y, Lian Z. Update on transfusion-related acute lung injury: an overview of its pathogenesis and management. Front Immunol. 2023;14:1175387（PMID: 37251400、DOI: 10.3389/fimmu.2023.1175387、PMCID: PMC10213666、https://pmc.ncbi.nlm.nih.gov/articles/PMC10213666/）。裏づける部分：候補（CC BY 総説）が、2019年に Delphi 法による新しい診断基準が確立され、TRALI は ARDS の危険因子がない場合の Type I と、危険因子がある場合の Type II に分けられたことを明記し、カードの主張の中心と一致する。候補は TRALI を先進国における輸血関連死亡の主因の一つとも位置づける。数値の照合：数値なし（定義のカード）。「possible TRALI の廃止」は候補に再掲なし（候補の全文に possible の語自体が現れない）。裏づけ登録時は再定義の2分類の部分を使うこと。留保：主出典 SRC-2484 の区分は現行 RESTRICTED が正しい（Transfusion、Wiley。刊行版ライセンスは CC BY-NC-ND 4.0 で、Crossref の版データと Europe PMC の個別レコードの双方で確認。マスターの license_note とも一致）。識別子補完候補あり'
