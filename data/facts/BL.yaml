  provenance:
    source_ref: SRC-2475
    source: 'Carson JL, Stanworth SJ, Guyatt G, et al. Red Blood Cell Transfusion: 2023 AABB International Guidelines. JAMA. 2023;330(19):1892-1902.'
    doi: 10.1001/jama.2023.12914
    pmid: '37824153'
    pmcid: null
    url: https://doi.org/10.1001/jama.2023.12914
    source_license: Crossref にライセンス登録なし
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査 2026-11-08）：Yadav SK, et al. A Contemporary Review of Blood Transfusion in Critically Ill Patients. Medicina. 2024;60(8):1247.（https://pmc.ncbi.nlm.nih.gov/articles/PMC11356114/）。裏づける部分：制限的閾値7 g/dL対自由な閾値（TRICC 10 g/dL、TRISS 9 g/dL）で死亡率に差がなかったこと、AABB 2023ガイドラインの閾値（一般7、既存心疾患・整形外科8、心臓手術7.5）の整理。数値の照合：不一致（部分）：閾値の方向性は一致するが、カードの集積値（RCT 45件・20,599人、中等度の質、制限的7〜8対自由9〜10）は候補総説に記載なし。候補側の個別試験値（TRICC N=838で7対10、TRISS N=998で7対9）のみ確認。自由に使える資料による裏づけ（OPEN、作り手の調査バッチ79 2026-11-15）：Yadav SK, Hussein G, Liu B, et al. A Contemporary Review of Blood Transfusion in Critically Ill Patients. Medicina (Kaunas). 2024;60(8):1247（PMID: 39202529、DOI: 10.3390/medicina60081247、PMCID: PMC11356114、https://pmc.ncbi.nlm.nih.gov/articles/PMC11356114/）。裏づける部分：候補（CC BY 4.0 総説）が、制限的輸血戦略を Hb 7〜8 g/dL の閾値の枠組みで位置づけ、主要な無作為化試験では制限的戦略を支持する（自由な戦略に有利な）死亡率の差は認められなかったこと、AABB 2023 ガイドラインの閾値（入院患者一般で7 g/dL以下、心臓手術で8 g/dL未満、整形外科手術・既存の心血管疾患で8 g/dL以下など）を表として再掲しており、カードの主張の骨格と一致する。数値の照合：閾値の範囲（制限的7〜8 g/dL）は候補と一致する。自由な閾値（9〜10 g/dL）側の明示、「重要な患者アウトカムを悪化させない」という包括的な結論、および根拠の規模（45試験・20,599人・中等度の確実性）は候補に再掲なし。留保：主出典 SRC-2475 の区分は現行 RESTRICTED が正しい（JAMA。Crossref にライセンス登録なし、Europe PMC の個別レコードで非 OA・PMCID なし）。マスターの PMID（37824153）は個別照会で一致を確認した'
