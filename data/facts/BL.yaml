- id: BL-002
  domain: BL
  subdomain: 貧血の診断アプローチ（MCV 分類・網赤血球）
  assertion:
    plain_statement_ja: 貧血の評価では赤血球指数を含む血算が診断の手がかりとなり、網赤血球数は溶血または失血のスクリーニングとして有用である
    condition:
      region: 国際
      対象: 成人
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2479
    source: 'Cascio MJ, DeLoughery TG. Anemia: Evaluation and Diagnostic Tests. Med Clin North Am. 2017;101(2):263-284.'
    doi: 10.1016/j.mcna.2016.09.003
    pmid: '28189170'
    pmcid: null
    url: https://doi.org/10.1016/j.mcna.2016.09.003
    source_license: Crossref の登録は Elsevier の TDM ライセンスのみ（CC 表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（GOV_US、作り手の調査 2026-11-08）：MedlinePlus (NLM/NIH). Blood Count Tests; Anemia: MedlinePlus Medical Encyclopedia（https://medlineplus.gov/bloodcounttests.html）。裏づける部分：血算が貧血等の診断に用いられること、貧血診断の血液検査として血算と網赤血球数が挙げられること（https://medlineplus.gov/ency/article/000560.htm）。数値の照合：該当なし（数値なし）。自由に使える資料による裏づけ（OPEN、作り手の調査バッチ79 2026-11-15）：Nairz M, Theurl I, Wolf D, Weiss G. Iron deficiency or anemia of inflammation?: Differential diagnosis and mechanisms of anemia of inflammation. Wien Med Wochenschr. 2016;166(13-14):411-423（PMID: 27557596、DOI: 10.1007/s10354-016-0505-7、PMCID: PMC5065583、https://pmc.ncbi.nlm.nih.gov/articles/PMC5065583/）。裏づける部分：候補（CC BY 4.0 総説）が、貧血は血算で検出でき、評価は網赤血球数または網赤血球産生指数（RPI）・赤血球指数・フェリチン・トランスフェリン飽和度に基づいて行うこと、RPI が3を超える場合は溶血性貧血などの再生性（regenerative）の貧血でみられることを述べ、カードの主張の骨格と一致する。数値の照合：RPI の目安（3超）は候補に再掲あり。失血については、候補では鉄欠乏の原因としての記載が中心で、網赤血球が失血のスクリーニングになるという形の再掲はない。候補の主題は鉄欠乏と炎症性貧血の鑑別であり、貧血一般の評価としての裏づけは部分的にとどまる。留保：主出典 SRC-2479 の区分は現行 RESTRICTED が正しい（Med Clin North Am、Elsevier。Crossref は TDM ライセンスのみ、Europe PMC の個別レコードで非 OA・PMCID なし）'
  uncertainty: 主張は抄録で確認した範囲。網赤血球産生指数などの具体的な算出法は本文未照合のため主張に入れていない
