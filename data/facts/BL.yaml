- id: BL-003
  domain: BL
  subdomain: 貧血の診断アプローチ（MCV 分類・網赤血球）
  assertion:
    plain_statement_ja: 成人の貧血の鑑別診断は、平均赤血球容積（MCV）に基づいて小球性・正球性・大球性に細分類することで大幅に絞り込むことができるが、この分類は診断の出発点であって絶対的なものではない
    condition:
      region: 国際
      対象: 成人
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2480
    source: 'Tefferi A. Anemia in adults: a contemporary approach to diagnosis. Mayo Clin Proc. 2003;78(10):1274-1280.'
    doi: 10.4065/78.10.1274
    pmid: '14531486'
    pmcid: null
    url: https://doi.org/10.4065/78.10.1274
    source_license: Crossref の登録は Elsevier の TDM ライセンスのみ（CC 表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（GOV_US、作り手の調査 2026-11-08）：MedlinePlus (NLM/NIH). Blood Count Tests（赤血球指数を含む血算の解説）（https://medlineplus.gov/bloodcounttests.html）。裏づける部分：赤血球指数がCBCに含まれ貧血の原因診断に用いられること、MCVによる小球性・正球性・大球性の分類枠組み（MedlinePlus RBC indices解説の要約が検索で確認できた範囲）。数値の照合：該当なし（カードに数値なし。MedlinePlus側MCV基準範囲の表記ゆれは主張に含まれない）。自由に使える資料による裏づけ（OPEN、作り手の調査バッチ79 2026-11-15）：Nairz M, Theurl I, Wolf D, Weiss G. Iron deficiency or anemia of inflammation?: Differential diagnosis and mechanisms of anemia of inflammation. Wien Med Wochenschr. 2016;166(13-14):411-423（PMID: 27557596、DOI: 10.1007/s10354-016-0505-7、PMCID: PMC5065583、https://pmc.ncbi.nlm.nih.gov/articles/PMC5065583/）。裏づける部分：候補（BL-002と共用の CC BY 4.0 総説）が、赤血球指数のうち MCV と MCH によって小球性低色素性・正球性正色素性・大球性高色素性の貧血に分類できること、赤血球指数は貧血の原因を定めるものではないが診断の作業過程（workup）には有用であることを述べ、カードの「MCV による分類で鑑別を大きく絞り込めるが、分類は出発点であって絶対的ではない」という主張の骨格と一致する。数値の照合：数値なし（分類の枠組みのカード）。候補の分類は MCV と MCH の併用によるもので、主題は鉄欠乏と炎症性貧血の鑑別であり、成人の貧血の鑑別診断全般を扱う主出典の範囲とは部分的に重なる。留保：主出典 SRC-2480 の区分は現行 RESTRICTED が正しい（Mayo Clin Proc。Crossref は TDM ライセンスのみ、Europe PMC の個別レコードで非 OA・PMCID なし）'
  uncertainty: 2003年の総説であり、MCV 分類の枠組み提示のために用いた。各カテゴリーの現在の精査手順は BL-002 など新しい資料側で確認すること
