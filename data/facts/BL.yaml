- id: BL-006
  domain: BL
  subdomain: 鉄代謝の検査
  assertion:
    plain_statement_ja: 炎症がない状況では血清フェリチンは鉄欠乏の最も特異的な検査であり、15 µg/L 未満は貯蔵鉄の欠如、30 µg/L 未満は体内の鉄貯蔵が低い状態を示し、トランスフェリン飽和度20%未満は鉄制限の指標となる
    condition:
      region: 欧州
      対象: 成人
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-164
    source: Snook J, Bhala N, Beales ILP, et al. British Society of Gastroenterology guidelines for the management of iron deficiency anaemia in adults. Gut. 2021;70(11):2030-2051.
    doi: 10.1136/gutjnl-2021-325210
    pmid: '34497146'
    pmcid: PMC8515119
    url: https://doi.org/10.1136/gutjnl-2021-325210
    source_license: CC BY-NC 4.0（Crossref・PubMed の著作権表示で確認）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: 自由に使える資料による裏づけ（GOV_US、作り手の調査 2026-11-08）：Centers for Disease Control and Prevention. Iron-Status Indicators (CDC Nutrition Report資料)（https://www.cdc.gov/nutrition-report/media/pdfs/2026/06/Iron-Indicators-508.pdf）。裏づける部分：血清フェリチンが貯蔵鉄の指標であること、鉄欠乏のカットオフ15 ng/mL（µg/L）以下の部分。WHO 2020ガイドラインの閾値の紹介を含む。数値の照合：不一致（部分）：15 µg/Lは一致（カード15未満／CDC・WHO <15）。30 µg/Lは文脈が異なる：カードはBSGの「貯蔵鉄が低い」閾値、CDC資料では炎症時のカットオフ引き上げ（30または70、年齢群による）として紹介され、成人の炎症時は70がWHO値。トランスフェリン飽和度20%未満は候補資料で確認できず
  uncertainty: 数値はガイドライン本文（PMC 全文）で確認した。英国の成人診療の基準であり、日本の診療指針の基準値とは別に扱うこと。出典マスターではこの文献の PMID が未登録のため、PMID 34497146 の補完を取り込み側に提案する
