  assertion:
    plain_statement_ja: 成人の赤血球輸血では、制限的な輸血閾値（典型的にヘモグロビン7〜8 g/dL）は自由な輸血閾値（9〜10 g/dL）と比べて患者の重要なアウトカムを悪化させないとする中等度の質のエビデンスがある（ランダム化比較試験45件・20,599人）
    condition:
