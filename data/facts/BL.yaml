- id: BL-014
  domain: BL
  subdomain: 血小板・凝固スクリーニングの解釈
  assertion:
    plain_statement_ja: プロトロンビン時間（PT）と活性化部分トロンボプラスチン時間（APTT）は最も頻繁に測定される凝固検査で、抗凝固療法のモニタリングや出血の初期評価に用いられ、延長がみられた場合は結果に影響する因子を踏まえて系統的に評価する必要がある
    condition:
      region: 国際
      対象: 成人
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2489
    source: Kamal AH, Tefferi A, Pruthi RK. How to interpret and pursue an abnormal prothrombin time, activated partial thromboplastin time, and bleeding time in adults. Mayo Clin Proc. 2007;82(7):864-873.
    doi: 10.4065/82.7.864
    pmid: '17605969'
    pmcid: null
    url: https://doi.org/10.4065/82.7.864
    source_license: CC 表示なし
    legal_basis: B
    source_class: RESTRICTED
    corroboration: 自由に使える資料による裏づけ（GOV_US、作り手の調査 2026-11-08）：MedlinePlus (NLM/NIH). Prothrombin Time Test and INR (PT/INR); Partial Thromboplastin Time (PTT) Test（https://medlineplus.gov/lab-tests/prothrombin-time-test-and-inr-ptinr/）。裏づける部分：PTとPTTが併せて行われる代表的な凝固検査であること、PTはワルファリン等の抗凝固薬モニタリングに、PTTはヘパリンモニタリングと出血性素因の確認に用いられること、両者を比較して凝固を評価すること（PTT側 https://medlineplus.gov/lab-tests/partial-thromboplastin-time-ptt-test/）。数値の照合：該当なし（数値なし）
  uncertainty: 主張は抄録で確認した範囲。延長パターンごとの鑑別の進め方（混合試験・因子測定の使い分け）は本文のアルゴリズム未照合のため主張に入れていない
