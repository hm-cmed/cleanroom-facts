    corroboration: '自由に使える資料による裏づけ（GOV_US、作り手の調査 2026-11-08）：Centers for Disease Control and Prevention. Iron-Status Indicators (CDC Nutrition Report資料)（https://www.cdc.gov/nutrition-report/media/pdfs/2026/06/Iron-Indicators-508.pdf）。裏づける部分：血清フェリチンが貯蔵鉄の指標であること、鉄欠乏のカットオフ15 ng/mL（µg/L）以下の部分。WHO 2020ガイドラインの閾値の紹介を含む。数値の照合：不一致（部分）：15 µg/Lは一致（カード15未満／CDC・WHO <15）。30 µg/Lは文脈が異なる：カードはBSGの「貯蔵鉄が低い」閾値、CDC資料では炎症時のカットオフ引き上げ（30または70、年齢群による）として紹介され、成人の炎症時は70がWHO値。トランスフェリン飽和度20%未満は候補資料で確認できず。自由に使える資料による裏づけ（OPEN、作り手の調査バッチ79 2026-11-15）：Dignass A, Farrag K, Stein J. Limitations of Serum Ferritin in Diagnosing Iron Deficiency in Inflammatory Conditions. Int J Chronic Dis. 2018;2018:9394060（PMID: 29744352、DOI: 10.1155/2018/9394060、PMCID: PMC5878890、https://pmc.ncbi.nlm.nih.gov/articles/PMC5878890/）。裏づける部分：候補（CC BY 総説）が、一般集団では WHO が血清フェリチン15 µg/L未満を低値と定義すること、30 µg/L が鉄欠乏を示す最も感度・特異度の高いカットオフ（感度92%・特異度98%、骨髄の貯蔵鉄欠如と相関）として同定されていること、非炎症下での鉄欠乏の標準的な閾値は30 µg/L未満であること、トランスフェリン飽和度20%未満が鉄欠乏の診断基準として用いられること（心不全・慢性腎臓病・炎症性腸疾患の文脈を含む）を述べ、カードの主張の骨格と数値の範囲と一致する。数値の照合：数値自体（15 µg/L・30 µg/L・20%）は候補にも現れるが、対応づけが異なる。カード（BSG）は15 µg/L未満を「貯蔵鉄なし」、30 µg/L未満を「貯蔵鉄低下」とするのに対し、候補は15 µg/L未満を WHO の「低フェリチン」の定義とし、30 µg/L のカットオフを貯蔵鉄欠如への感度・特異度で位置づける。「炎症がない場合に血清フェリチンが最も特異的な検査である」という表現そのものも候補に再掲なし。裏づけ登録時はこの対応づけの違いに留意すること（申し送り参照）。留保：主出典 SRC-164 の区分は現行 RESTRICTED が正しい（Gut、BMJ。刊行版ライセンスは CC BY-NC 4.0 で、Crossref の版データと Europe PMC の個別レコードで確認。マスターの license_note とも一致）。識別子補完候補あり'
  uncertainty: 数値はガイドライン本文（PMC 全文）で確認した。英国の成人診療の基準であり、日本の診療指針の基準値とは別に扱うこと。出典マスターではこの文献の PMID が未登録のため、PMID 34497146 の補完を取り込み側に提案する
