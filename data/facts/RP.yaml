- id: RP-067
  domain: RP
  subdomain: 排卵痛・排卵期出血
  assertion:
    plain_statement_ja: 排卵痛（ミッテルシュメルツ）は、排卵期に生じる下腹部痛である。正常女性で月経周期の中間期に骨盤超音波検査を行った研究では、少量の腹水が周期の40%に認められ、痛みを伴った周期では、その約2/3で排卵の時期に腹水が超音波で確認された。この所見は、排卵に伴って卵胞液などが腹腔内に漏れることが、痛みの一因であることを支持する。
    condition:
      region: 米国
      study: 原著論文（正常女性を対象とした超音波検査による観察研究、1979年）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1546
    source: 'Hann LE, Hall DA, Black EB, Ferrucci JT Jr. Mittelschmerz: Sonographic Demonstration. JAMA. 1979;241(25):2731-2732.'
    doi: 10.1001/jama.241.25.2731
    pmid: '448821'
    pmcid: null
    url: https://doi.org/10.1001/jama.241.25.2731
    source_license: ライセンス表示なし
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 元のカードの「生殖年齢女性の40%以上にみられる」という有病率は、一次資料で確認できなかったため含めていない。本出典の40%は女性の割合ではなく、腹水が認められた周期の割合である。虫垂炎や卵巣嚢胞の破裂・茎捻転、異所性妊娠との鑑別の記述も、本出典の抄録では確認できなかったため含めていない。1979年の研究であり、超音波機器の性能は現在と異なる。
