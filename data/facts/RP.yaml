- id: RP-044
  domain: RP
  subdomain: 緊急避妊
  assertion:
    plain_statement_ja: 緊急避妊は、避妊しなかった性交や避妊の失敗（コンドームの破損、経口避妊薬の飲み忘れなど）の後に妊娠を防ぐために用いる方法である。方法には、エストロゲン・プロゲスチン併用、黄体ホルモン単独、選択的プロゲステロン受容体修飾薬の経口投与と、銅付加子宮内避妊具の挿入がある。
