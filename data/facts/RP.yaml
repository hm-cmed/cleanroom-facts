- id: RP-048
  domain: RP
  subdomain: 更年期障害の病態と症状
  assertion:
    plain_statement_ja: 更年期の移行に伴う症状のうち最も多く報告されるのは、ほてりやのぼせなどの血管運動症状である。これに加えて、腟の乾燥と性交痛、睡眠の困難、気分の悪化が更年期に近づくにつれて増悪し、互いに影響し合って生活の質を下げる。閉経後の認知の変化は、ホルモンよりも加齢と関連することが多いとされる。
