    corroboration: null
  uncertainty: 個別の製剤の用量や投与レジメンの詳細は抄録になく、主張文には入れていない。日本で使用できるエストロゲン・黄体ホルモン製剤の種類と、それぞれの国内承認・保険適用の状況は本出典では確認しておらず未確認である。
