- id: RP-063
  domain: RP
  subdomain: 排卵の機序
  assertion:
    plain_statement_ja: 排卵は、LHサージを契機として卵巣内で進む一連の過程である。LHサージにより、EGF様因子、ステロイド、転写因子、プロスタグランジン、タンパク分解系などの排卵メディエーターの発現が高まり、卵胞の破裂と卵子の放出に至る。これらの機構には動物モデルと共通する部分が多い一方で、誘導される因子の種類や発現パターン、調節機構には種差があり、ヒトの排卵の理解にはヒト検体を用いた研究が必要である。排卵過程の障害は不妊や低妊孕性と関連する。
    condition:
      region: 国際（ヒト卵巣を対象とした研究の総説）
      study: 総説（ヒトおよび動物モデルの排卵研究のレビュー）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1543
    source: Jo M, Brännström M, Akins JW, Curry TE Jr. New insights into the ovulatory process in the human ovary. Hum Reprod Update. 2025;31(1):21-47.
    doi: 10.1093/humupd/dmae027
    pmid: '39331957'
    pmcid: PMC11696709
    url: https://doi.org/10.1093/humupd/dmae027
    source_license: CC BY-NC 4.0
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 元のカードにあった「排卵は次回月経の約14日前に起こる」「排卵後の卵胞は黄体となりプロゲステロンを分泌する」という記述は、本出典の抄録で確認できなかったため含めていない。主張は抄録で確認した範囲に限る。
