- id: RP-065
  domain: RP
  subdomain: 原発性無月経
  assertion:
    plain_statement_ja: 原発性無月経は、初経が発来しない状態をいう。二次性徴の発育が13歳までにみられない場合、乳房発育の開始から5年を経ても初経がない場合、または15歳以上で初経がない場合に、評価を行う。原因としては、ターナー症候群などの染色体異常に伴う原発性卵巣機能不全と、ミュラー管形成不全などの解剖学的異常が多い。初期評価には、妊娠反応と血清LH、FSH、プロラクチン、TSHの測定が含まれる。
    condition:
      region: 米国
