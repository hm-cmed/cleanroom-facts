- id: RP-039
  domain: RP
  subdomain: 不妊症の評価
  assertion:
    plain_statement_ja: 不妊の評価は、避妊をしない定期的な性交を12か月続けても妊娠が成立しない場合に開始し、女性が35歳以上の場合は6か月を目安に開始する。不妊の原因となる病態が既往などから明らかな場合は、期間を待たずに評価を始める。評価は病歴聴取と身体所見から始め、排卵機能、卵管通過性、子宮の形態など、頻度の高い原因を侵襲の少ない方法から系統的に調べる。
