    doi: 10.1097/AOG.0000000000001215
    pmid: '26595586'
    pmcid: null
    url: https://doi.org/10.1097/AOG.0000000000001215
    source_license: ライセンス表示なし（学会ガイドライン）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 元のカードの「平均12.4歳」「通常10〜16歳」という数値は本出典では確認できず、中央値12〜13歳に置き換えた。初経直後は無排卵周期が多いことは、本出典の抄録では確認できなかったため含めていない。日本の集団を対象とした数値ではない。
