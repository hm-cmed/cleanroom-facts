- id: RP-041
  domain: RP
  subdomain: 避妊法の総論
  assertion:
    plain_statement_ja: 避妊法の有効性は、正しく継続して使う完全使用と、実際の一般的な使い方である典型使用とで分けて評価され、両者の妊娠率の差は、その方法が使用者の不正確な使用にどれだけ影響されるかを示す。使用者自身の継続的な努力を必要としない方法ほど、典型使用でも妊娠率は低く保たれる。
    condition:
