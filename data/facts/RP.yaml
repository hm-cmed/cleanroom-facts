- id: RP-064
  domain: RP
  subdomain: 思春期と初経
  assertion:
    plain_statement_ja: 初経年齢の中央値は、先進国の十分に栄養のある集団では12〜13歳で、比較的安定している。初経の時期や思春期の進行は、社会経済的状況、栄養、予防医療へのアクセスといった環境要因の影響を受ける。臨床では、初経で起こることや初経後の月経周期の長さの正常範囲を本人と養育者に説明し、月経周期をバイタルサインの一つとして評価することで、異常な月経パターンを早期に発見できる。
    condition:
      region: 米国を含む先進国（十分に栄養のある集団）
      study: 学会ガイドライン（ACOG 委員会意見）
    differential: null
    common_misconception: null
  provenance:
