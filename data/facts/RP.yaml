- id: RP-040
  domain: RP
  subdomain: 甲状腺機能異常
  assertion:
    plain_statement_ja: 甲状腺機能異常は月経異常の原因となる。甲状腺中毒症（機能亢進）では主に過少月経と頻発月経（多月経）が、甲状腺機能低下症では主に希発月経がみられる。甲状腺機能異常は妊孕性の低下とも関連しており、月経異常や不妊の評価では甲状腺機能の確認が対象となる。
