- id: RP-038
  domain: RP
  subdomain: 女性不妊総論
  assertion:
    plain_statement_ja: 女性不妊の原因は、排卵障害、卵管障害、子宮や子宮内膜の異常、子宮内膜症など多岐にわたり、男性因子や、検査で原因が特定できない原因不明不妊も存在する。不妊の診断的評価は、関連するすべての因子を同定するために、頻度の高い原因から侵襲の少ない方法で、系統的かつ効率的に行うことが原則である。
    condition:
