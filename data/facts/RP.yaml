    corroboration: null
  uncertainty: 各治療の効果の大きさの数値は抄録になく、主張文には入れていない。フェゾリネタントを含む各薬剤の日本における承認・保険適用の状況（更年期症状への適応の有無を含む）は本出典では確認しておらず未確認である。漢方薬は本声明の評価対象の整理には含まれておらず、日本での位置づけは未確認である。
