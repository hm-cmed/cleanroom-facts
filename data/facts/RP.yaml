  uncertainty: 本出典の対象は抗レトロウイルス薬との相互作用に限られ、抗てんかん薬やリファンピシン系抗菌薬など他の酵素誘導薬との相互作用は扱っていないため、主張はその範囲に限った。国内のホルモン避妊薬の承認・保険適用の状況は未確認である。
