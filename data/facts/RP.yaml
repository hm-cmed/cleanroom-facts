- id: RP-066
  domain: RP
  subdomain: 続発性無月経
  assertion:
    plain_statement_ja: 続発性無月経は、それまで規則的だった月経が3か月間停止した場合、または不規則だった月経が6か月間停止した場合をいう。原因の多くは、多嚢胞性卵巣症候群、視床下部性無月経、高プロラクチン血症、原発性卵巣機能不全で説明できる。評価ではすべての症例で妊娠を除外し、初期検査として妊娠反応と血清LH、FSH、プロラクチン、TSHを測定する。視床下部性無月経の患者では摂食障害の有無を評価し、骨密度低下のリスクに注意する。
