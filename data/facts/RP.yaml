- id: RP-004
  domain: RP
  subdomain: 排卵の機序
  assertion:
    plain_statement_ja: 排卵は、卵巣の主席卵胞が破裂して卵子を腹腔内に放出する過程であり、卵管の采部に取り込まれる。卵胞期にエストロゲンが上昇し、周期中期に下垂体からのLHサージ（とFSHの上昇）が起こることが排卵の引き金となる。排卵は月経周期の長さにかかわらず、次回月経の約14日前に起こり、その後に黄体期が続く。排卵後の卵胞は黄体となり、プロゲステロンを分泌する。
