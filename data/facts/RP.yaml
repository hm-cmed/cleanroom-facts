  uncertainty: 国内での卵管手術の実施体制や保険適用（卵管鏡下卵管形成術など国内で用いられる術式の位置づけ）は本調査では未確認である。妊娠率の具体的な数値は出典の結論部で確認した範囲を超えるため主張には含めていない。
