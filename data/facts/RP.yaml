- id: RP-043
  domain: RP
  subdomain: 子宮内避妊具・長時間作用型避妊法
  assertion:
    plain_statement_ja: 子宮内避妊具（IUD）と皮下インプラントからなる長時間作用型の可逆的避妊法（LARC）は、最も有効な可逆的避妊法である。装着後は使用者の継続的な努力を必要としないことが大きな利点で、除去すれば妊孕性は速やかに回復する。
