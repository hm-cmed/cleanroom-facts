- id: RP-032
  domain: RP
  subdomain: 卵子凍結
  assertion:
    plain_statement_ja: 計画的卵子凍結（将来の妊娠に備えてあらかじめ卵子を凍結保存すること）は、新しく発展途上の手技であるが、将来の不妊を避ける助けになりうるものとして倫理的に許容されうるとされる。ただし、有効性や長期的な影響には不確実性が残るため、検討する女性にはその不確実性について十分に情報提供することが不可欠である。
