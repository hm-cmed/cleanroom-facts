- id: RP-033
  domain: RP
  subdomain: ホルモン製剤
  assertion:
    plain_statement_ja: 婦人科で用いるホルモン製剤の中心は、エストロゲン製剤とプロゲスチン（黄体ホルモン）製剤である。エストロゲンには天然型と合成型があり、プロゲスチンには構造や受容体への結合特性、代謝物の活性が異なる多様な種類がある。経口、経皮、腟内、子宮内など投与経路によって薬物動態やホルモン作用、代謝が変わるため、治療目的に応じて製剤の種類と投与経路を使い分ける。
