  subdomain: 神経病性関節症
  assertion:
    plain_statement_ja: 神経病性関節症（Charcot関節）の代表である糖尿病性Charcot足は、末梢神経障害を背景に炎症、外傷、骨代謝の異常が加わって骨と関節の破壊・脱臼・変形が進行する病態で、疼痛を欠くか軽いまま関節破壊が進むことがあり、急性期の治療は免荷が基本である。
