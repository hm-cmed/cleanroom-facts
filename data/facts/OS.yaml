- id: OS-002
  domain: OS
  subdomain: 関節リウマチ
  assertion:
    plain_statement_ja: 日本の関節リウマチ診療ガイドライン2024年改訂版では、治療目標と薬物治療アルゴリズムは2020年版から変更されず、メトトレキサート（MTX）を中心とする従来型合成DMARDで治療を開始し、効果が不十分な場合に生物学的製剤またはJAK阻害薬へ進む段階的治療が示されている。
