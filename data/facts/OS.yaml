- id: OS-020
  domain: OS
  subdomain: Dupuytren拘縮
  assertion:
    plain_statement_ja: Dupuytren拘縮は手掌腱膜の結節と索状の肥厚により指の屈曲拘縮が進行する疾患で、高齢男性、糖尿病、北欧系の家系などが危険因子とされ、治療には手術のほか、拘縮索へのコラゲナーゼ（Clostridium histolyticum 由来）注射による非手術的治療がある。
