    plain_statement_ja: 膝蓋軟骨軟化症は若年者に多くみられる膝前面痛の原因であり、膝蓋大腿関節の関節軟骨の軟化・膨化・浮腫を初期病変とする。初期変化は可逆性の場合もあるが、進行すると膝蓋大腿関節の変形性関節症へ移行しうる。
