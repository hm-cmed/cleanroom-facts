- id: OS-026
  domain: OS
  subdomain: 肩関節周囲炎
  assertion:
    plain_statement_ja: 二次医療に紹介された原発性凍結肩の成人では、麻酔下授動術、関節鏡視下関節包切開、ステロイド注射を併用する早期の体系的理学療法の3群間で、12か月後の Oxford Shoulder Score の平均差はいずれも事前に設定した臨床的目標差を下回り、臨床的に優れた治療法はなかった。重篤な有害事象は関節包切開群で8件、授動術群で2件報告された
    condition:
