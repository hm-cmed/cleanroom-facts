- id: ND-027
  domain: ND
  subdomain: 本態性振戦
  assertion:
    plain_statement_ja: 本態性振戦は、国際Parkinson・運動障害学会の分類コンセンサスでは、両側上肢の動作時振戦が孤立性に3年以上持続し、ジストニア・運動失調・パーキンソニズムなどの他の神経徴候を欠く症候群と定義され、家族歴を伴うことが多く、少量のアルコールで振戦が改善することがあるが、これらは定義の要件には含まれない。
    condition:
      population: 本態性振戦患者
      region: 国際
    differential: null
    common_misconception: null
  provenance:
