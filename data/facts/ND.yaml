- id: ND-056
  domain: ND
  subdomain: 悪性症候群
  assertion:
    plain_statement_ja: 悪性症候群は、抗精神病薬などのドパミン遮断に伴う稀な薬物有害反応であり、発熱、筋強剛、自律神経症状、横紋筋融解（CK上昇）を呈する。治療の第一は原因薬の中止と支持療法であり、ダントロレンやブロモクリプチンなどの薬物療法が併用されることがある。
    condition:
      population: 抗精神病薬等のドパミン遮断薬を使用中の患者
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1700
    source: Pileggi DJ, Cook AM. Neuroleptic Malignant Syndrome. Ann Pharmacother. 2016
    doi: 10.1177/1060028016657553
    pmid: '27423483'
    pmcid: null
    url: https://doi.org/10.1177/1060028016657553
    source_license: Annals of Pharmacotherapy（SAGE、CC 表示なし）
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 頻度と死亡率は抄録で確認（文献集計に基づく値）。鑑別すべきセロトニン症候群では、クローヌス（誘発性・自発性・眼球）と反射亢進が診断の中核徴候となる（Dunkley EJ, et al. QJM. 2003;96(9):635-642、Hunter Serotonin Toxicity Criteria。出典表には未収載）点が、鉛管様の筋強剛を呈する悪性症候群と異なる。ダントロレン、ブロモクリプチンはいずれも国内承認薬だが、悪性症候群への使用は適応外の場合があり保険適用の詳細は添付文書による。
  curriculum:
    kokushi: 医学各論 Ⅸ-4-I-③（悪性症候群、a）
