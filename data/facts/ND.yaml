- id: ND-001
  domain: ND
  subdomain: Alzheimer型認知症
  assertion:
    plain_statement_ja: Alzheimer病は、NIA-AA改訂基準（2024年）では症候群ではなく生物学的過程として定義され、早期に変化するCore 1バイオマーカー（アミロイドPET、承認された脳脊髄液バイオマーカー、高精度の血漿バイオマーカー、特にリン酸化タウ217）の異常があれば、無症状の段階でもAlzheimer病の診断が成立する。
    condition:
      population: Alzheimer病の診断を受ける者（無症状者を含む）
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1651
    source: 'Jack CR Jr, et al. Revised criteria for diagnosis and staging of Alzheimer''s disease: Alzheimer''s Association Workgroup. Alzheimers Dement. 2024;20(8):5143-5169'
    doi: 10.1002/alz.13859
    pmid: '38934362'
    pmcid: null
    url: https://doi.org/10.1002/alz.13859
    source_license: CC BY-NC-ND 4.0（Alzheimer's & Dementia誌）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 本基準は診断・病期分類の原則を示すもので、具体的な診療手順や治療プロトコルを定めるものではないと基準自体が明記している。血漿バイオマーカーの国内臨床実装の状況は本作成では未確認。
