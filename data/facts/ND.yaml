- id: ND-024
  domain: ND
  subdomain: Parkinson症候群
  assertion:
    plain_statement_ja: 特発性正常圧水頭症（iNPH）は、高齢者に歩行障害・認知障害・排尿障害を呈する治療可能な疾患であり、日本の診療ガイドライン第3版では、画像所見のDESH（くも膜下腔の不均等な拡大を伴う水頭症）が診断とシャント術適応の判断に重要な役割を果たし、タップテストなどの髄液排除試験を含む診断アルゴリズムが示されている。
