- id: ND-005
  domain: ND
  subdomain: Alzheimer型認知症
  assertion:
    plain_statement_ja: 早期症候性Alzheimer病を対象とした第III相試験（TRAILBLAZER-ALZ 2）で、ドナネマブの4週毎静脈内投与は、低・中等度タウ病理群において76週時点のiADRSの悪化を抑制し（最小二乗平均変化量の群間差3.25）、ARIA-Eは24.0%（うち症候性52例）に認められた。
