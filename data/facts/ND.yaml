- id: ND-002
  domain: ND
  subdomain: Alzheimer型認知症
  assertion:
    plain_statement_ja: Lancet Commissionの2024年報告では、修正可能な認知症危険因子は14項目となり（2020年報告の12項目に、未治療の視力低下と中年期の高LDLコレステロールが追加された）、これら全てを除去できれば認知症のほぼ半数（約45%）が理論的には予防可能と推定された。
    condition:
      population: 一般人口（全ライフコース）
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1652
    source: 'Livingston G, et al. Dementia prevention, intervention, and care: 2024 report of the Lancet standing Commission. Lancet. 2024;404(10452):572-628'
    doi: 10.1016/S0140-6736(24)01296-0
    pmid: '39096926'
    pmcid: null
    url: https://doi.org/10.1016/S0140-6736(24)01296-0
    source_license: Elsevier（The Lancet、テキストマイニング用ライセンスのみ、CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 約45%は集団寄与割合に基づく理論的推定であり、個人の予防効果を保証する値ではない。数値は本文で確認した（二次資料経由ではない）。
