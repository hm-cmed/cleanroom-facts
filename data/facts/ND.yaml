- id: ND-049
  domain: ND
  subdomain: 球脊髄性筋萎縮症
  assertion:
    plain_statement_ja: 球脊髄性筋萎縮症（Kennedy病）は、X染色体上のアンドロゲン受容体遺伝子第1エクソンにあるCAGリピートが38回以上に異常伸長すること（正常は36以下）で生じ、通常は成人男性に発症する遺伝性の下位運動ニューロン疾患であり、女性は保因者となる。
    condition:
      population: 球脊髄性筋萎縮症の患者および保因者
      region: 国際
    differential: null
    common_misconception: null
  provenance:
