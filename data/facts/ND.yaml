  assertion:
    plain_statement_ja: 認知症疾患診療ガイドライン2017（日本神経学会）では、Alzheimer型認知症の認知機能障害に対する薬物療法の中心はコリンエステラーゼ阻害薬（ドネペジル、ガランタミン、リバスチグミン）とメマンチンであり、病期や忍容性に応じて選択される。
