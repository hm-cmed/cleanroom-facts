- id: ND-025
  domain: ND
  subdomain: 進行性核上性麻痺
  assertion:
    plain_statement_ja: 進行性核上性麻痺のMDS診断基準（MDS-PSP）は、眼球運動障害、姿勢保持障害、無動、認知機能障害の4つの機能ドメインごとに、確実度の異なる3つの特徴を定めて組み合わせる方式であり、古典的なRichardson症候群は、垂直性核上性注視麻痺と、発症早期に転倒を伴う姿勢保持障害を中核とする。
