- id: ND-055
  domain: ND
  subdomain: 低酸素脳症
  assertion:
    plain_statement_ja: 院外心停止後に昏睡状態にある患者を対象としたTTM2試験では、33℃を目標とする低体温管理は、発熱予防を中心とする平温管理と比較して、6か月時点の死亡率を低下させなかった（低体温群50%、平温群48%）。
    condition:
      population: 院外心停止後に自己心拍が再開した昏睡状態の成人患者
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1699
    source: Dankiewicz J, Cronberg T, Lilja G, et al. Hypothermia versus Normothermia after Out-of-Hospital Cardiac Arrest. N Engl J Med. 2021
    doi: 10.1056/NEJMoa2100591
    pmid: '34133859'
    pmcid: null
    url: https://doi.org/10.1056/NEJMoa2100591
    source_license: NEJM（CC 表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 数値は抄録で確認。心停止後の神経学的予後評価は、体温管理と鎮静の影響を除いた時期に複数の指標を組み合わせて行うことが国際的な蘇生後ケアの指針で推奨されているが、その詳細は本カードでは扱わない。体温管理療法そのもの（発熱の予防を含む）は国内の蘇生後ケアでも行われている。
