- id: ND-026
  domain: ND
  subdomain: 大脳皮質基底核変性症
  assertion:
    plain_statement_ja: 大脳皮質基底核症候群（CBS）は大脳皮質基底核変性症の代表的な臨床表現型であり、非対称のレボドパ抵抗性パーキンソニズムに、皮質徴候として肢失行、皮質性感覚障害、他人の手現象を伴うことを特徴とし、病理学的に確認されたCBDの集積では肢失行は57%、他人の手現象は30%に認められた。
    condition:
