    corroboration: null
  uncertainty: 頻度は本文で確認した（表から読み取りではなく本文の記載値）。CBDの臨床表現型はCBSのほか、前頭葉行動・空間症候群、非流暢・失文法型PPA、PSP症候群があり、臨床診断と病理診断は必ずしも一致しない。 レボドパは国内で承認された薬剤であり、本カードはその治療効果の乏しさを鑑別点として述べるものである。
