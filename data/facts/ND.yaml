- id: ND-006
  domain: ND
  subdomain: Alzheimer型認知症
  assertion:
    plain_statement_ja: 日本ではレカネマブの使用に最適使用推進ガイドラインが定められ、対象はアミロイドPETまたは脳脊髄液検査でアミロイド病理を確認した、Alzheimer病による軽度認知障害および軽度の認知症に限られ、投与前・投与中の頭部MRIによるARIAのモニタリング、実施体制の要件、全例市販後調査への登録が求められる。
    condition:
      population: レカネマブ投与を検討する早期Alzheimer病患者
      region: 日本
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1656
