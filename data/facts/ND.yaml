- id: ND-007
  domain: ND
  subdomain: Alzheimer型認知症
  assertion:
    plain_statement_ja: 日本で2024年9月に承認されたドナネマブは、用法が700 mgを4週間隔で3回、その後は1400 mgを4週間隔で投与することとされ、投与開始後12か月を目安に行うアミロイドPET評価でアミロイドβプラークの除去が確認されれば投与を完了し、除去が確認されない場合も投与は原則として最長18か月までとされ、最適使用推進ガイドラインの下で使用される。
    condition:
      population: ドナネマブ投与を検討する早期Alzheimer病患者
      region: 日本
    differential: null
    common_misconception: null
  provenance:
