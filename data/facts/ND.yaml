    source_class: GOV_JP
    corroboration: null
  uncertainty: 出典は日本の指定難病診断基準であり、遺伝学的事実は国際的に共通する。女性化乳房などの軽度のアンドロゲン不全症状や耐糖能異常を合併しうることが同基準に記載されている。リュープロレリン酢酸塩が国内で進行抑制の治療として承認されている旨は本カードの出典外の情報であり、命題には含めなかった。
