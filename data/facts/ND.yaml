- id: ND-037
  domain: ND
  subdomain: Wernicke脳症
  assertion:
    plain_statement_ja: Wernicke脳症はチアミン欠乏による急性の神経精神障害であり、アルコール依存者での臨床診断には栄養欠乏、眼徴候、小脳失調、精神状態の変化または軽度の記憶障害の4徴のうち2つが用いられる。疑った場合は、炭水化物（グルコース）の投与に先立ってチアミンを投与する（EFNSガイドラインでは200 mgを1日3回、静脈内投与が望ましいとされる）。
    condition:
      population: チアミン欠乏のリスクがある患者（アルコール依存者を含む）
      region: 欧州
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1684
    source: Galvin R, Bråthen G, Ivashynka A, et al. EFNS guidelines for diagnosis, therapy and prevention of Wernicke encephalopathy. Eur J Neurol. 2010;17(12):1408-1418
    doi: 10.1111/j.1468-1331.2010.03153.x
    pmid: '20642790'
    pmcid: null
    url: https://doi.org/10.1111/j.1468-1331.2010.03153.x
    source_license: European Journal of Neurology（Wiley、CC 表示なし）
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: チアミン製剤は国内承認・保険収載されている。用量はEFNSガイドラインの推奨であり、国内の添付文書の用法とは別に判断される。古典的3徴（眼球運動障害・失調・意識障害）がすべてそろう例は一部にとどまるため、3徴の完備を診断の必須条件としない。
