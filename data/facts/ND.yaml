    doi: 10.1002/mds.27121
    pmid: '29193359'
    pmcid: null
    url: https://doi.org/10.1002/mds.27121
    source_license: Wiley（Movement Disorders誌、CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: Parkinson病の安静時振戦が随意運動で減弱するのに対し、本態性振戦では動作時振戦が主体であり、この出現様式の違いが鑑別の一助となる（同コンセンサス本文に基づく）。安静時振戦を伴う場合はET-plus（本態性振戦プラス）に分類される。
