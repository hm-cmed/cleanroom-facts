- id: ND-004
  domain: ND
  subdomain: Alzheimer型認知症
  assertion:
    plain_statement_ja: 早期Alzheimer病（アミロイド病理を確認した軽度認知障害・軽度認知症）を対象とした第III相試験（Clarity AD）で、レカネマブ10 mg/kgの2週毎静脈内投与は18か月時点のCDR-SBの悪化をプラセボより抑制し（調整平均変化量1.21対1.66、差−0.45）、ARIA-E（浮腫・滲出）は12.6%、点滴関連反応は26.4%に認められた。
    condition:
      population: アミロイド病理を確認した早期Alzheimer病患者
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1654
    source: van Dyck CH, et al. Lecanemab in Early Alzheimer's Disease. N Engl J Med. 2023;388(1):9-21
    doi: 10.1056/NEJMoa2212948
    pmid: '36449413'
    pmcid: null
    url: https://doi.org/10.1056/NEJMoa2212948
    source_license: NEJM（Massachusetts Medical Society、CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 数値は抄録で確認。ARIA-Hの発現率は抄録に記載がなく本カードには含めていない。レカネマブは国内で2023年9月に承認され保険適用されており、日本での適正使用の条件はND-006を参照。
  curriculum:
    kokushi: 医学各論 Ⅸ-4-A-①（Alzheimer型認知症、a）
