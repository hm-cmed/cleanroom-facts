- id: EV-019
  domain: EV
  subdomain: 急性中毒
  assertion:
    plain_statement_ja: 米国では、洗濯用洗剤ポッド（パック型洗剤）への曝露で2012〜2013年に救急受診した6歳未満の小児は17,230人で、3歳未満が73.5%を占め、曝露経路は経口摂取が79.7%と最も多かった。入院は4.4%、中等度以上の転帰は7.5%で、気管挿管を要した例が102例（0.6%）、死亡が1例あった。家庭用製品による小児の中毒事故は、低年齢児の経口摂取が中心である。
