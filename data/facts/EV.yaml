    url: null
    source_license: 政府標準利用規約
    legal_basis: B
    source_class: GOV_JP
    corroboration: null
  uncertainty: 振動障害の労災認定の基準そのものを示す通達は特定できておらず、本カードは予防対策の範囲に限る。
