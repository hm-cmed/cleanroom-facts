- id: EV-001
  domain: EV
  subdomain: 熱中症
  assertion:
    plain_statement_ja: 熱中症の重症度は、2024年版の国内ガイドラインではⅠ度からⅣ度の4段階に分類され、最重症のⅣ度が新たに加わった。Ⅳ度は深部体温40℃以上かつ重篤な意識障害を目安とする群であり、Ⅲ度とⅣ度では積極的冷却（アクティブクーリング）が推奨される。冷却の方法については複数の方法が検討されたが、特定の冷却法への明確な推奨は示されていない。
    condition:
      region: 日本
      対象: 熱中症患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-4116
    source: 日本救急医学会 熱中症および低体温症に関する委員会（編）. 熱中症診療ガイドライン2024. 日本救急医学会. 2024
    doi: null
    pmid: null
    pmcid: null
    url: null
    source_license: ライセンス表示を確認できず
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: ガイドラインは単行の文書で、DOI・PMIDはない。Ⅳ度の目安や冷却の推奨は、ガイドライン本文を引用する医療記事・自治体資料で確認した範囲であり、ガイドライン本文そのものの逐語での確認はしていない。環境省『熱中症環境保健マニュアル2022』の重症度表は旧版（2015年版）の分類をもとにしており、2024年版とは段階が異なる。
