- id: EV-005
  domain: EV
  subdomain: 凍傷・凍瘡
  assertion:
    plain_statement_ja: 重症凍傷の治療に関する系統的レビュー（対象71論文・978例）では、無作為化比較試験は1件しかなかった。その試験では、プロスタサイクリン類縁体のイロプロストが受傷後48時間以内の投与で有益であり、メタ解析では血栓溶解薬を受傷後24時間以内に投与した群で他の治療より転帰が良かった。一方で、その他の一般的な治療の効き目は確かめられていない。
    condition:
      region: 国際
      対象: 重症凍傷の患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-4120
    source: 'Regli IB, Oberhammer R, Zafren K, Brugger H, Strapazzon G. Frostbite treatment: a systematic review with meta-analyses. Scandinavian Journal of Trauma, Resuscitation and Emergency Medicine. 2023;31(1):96'
    doi: 10.1186/s13049-023-01160-3
    pmid: '38072923'
    pmcid: PMC10712146
    url: https://doi.org/10.1186/s13049-023-01160-3
    source_license: CC BY 4.0（Europe PMC の表示で確認）
    legal_basis: B
    source_class: OPEN
    corroboration: null
  uncertainty: 再加温の手順など凍傷の基本的な治療は既存カード（TR-003）が扱っており、本カードは治療の効き目に関する研究の蓄積の側面に限る。凍瘡（しもやけ）の病態と管理は既存カード（SK-027）が扱う。アルテプラーゼなどの血栓溶解薬の凍傷への使用は国内では適応外である（国内の適応は虚血性脳血管障害の急性期と急性心筋梗塞のみ）。イロプロスト製剤の凍傷に対する国内承認は未確認であり、国内で使える治療としては書いていない。ニフェジピンの凍瘡への国内適応も未確認。
  curriculum:
    kokushi: 医学各論 ⅩⅢ-5-A-③（凍傷・凍瘡、a）
