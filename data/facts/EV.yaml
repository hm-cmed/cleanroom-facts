- id: EV-017
  domain: EV
  subdomain: 熱傷
  assertion:
    plain_statement_ja: 熱傷の応急処置としての流水冷却について、冷却時間20分以上と20分未満を比較した系統的レビュー（観察研究4件）では、熱傷の大きさ・深さ、再上皮化、植皮のいずれの転帰でも20分以上の冷却による利益は認められず、エビデンスの確実性は非常に低いとされた。冷却を行うこと自体は標準的な応急処置として扱われるが、最適な冷却時間は現時点では確定していない。
    condition:
      region: 国際
      対象: 熱傷の応急処置（流水冷却）
    differential: null
    common_misconception: null
  provenance:
