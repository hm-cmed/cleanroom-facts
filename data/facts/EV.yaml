  subdomain: 急性放射線障害
  assertion:
    plain_statement_ja: 急性放射線症候群は、全身または広い範囲が照射された（目安として1 Gyを超える）後に起こり、古典的には造血器型が2〜3 Gy超、消化器型が5〜12 Gy、脳血管型が10〜20 Gyと区分される。経過は、前駆期（0〜2日）、潜伏期（2〜20日）、発症期（21〜60日）に分けられる。
    condition:
      region: 国際
      対象: 急性放射線症候群の患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-4126
    source: López M, Martín M. Medical management of the acute radiation syndrome. Reports of Practical Oncology and Radiotherapy. 2011;16(4):138-146
    doi: 10.1016/j.rpor.2011.05.001
    pmid: '24376971'
    pmcid: PMC3863169
    url: https://doi.org/10.1016/j.rpor.2011.05.001
    source_license: ライセンス表示を確認できず
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 線量区分の境目は資料によって幅がある。G-CSF（フィルグラスチム製剤）は国内で好中球減少症などの適応で承認されているが、急性放射線症候群（造血器型）に対する国内承認・保険適用は未確認のため、治療の主張には入れていない。
