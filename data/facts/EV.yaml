- id: EV-006
  domain: EV
  subdomain: 騒音性難聴
  assertion:
    plain_statement_ja: 職場の騒音対策を示す厚生労働省のガイドラインは2023年4月に改訂され、1992年の旧ガイドラインは廃止された。改訂では、対象となる作業場の定義、騒音の測り方、聴覚保護具の選び方が見直された。運用では等価騒音レベル85 dBが管理の起点の一つとされ、騒音作業にいつも従事する労働者には、1,000 Hzと4,000 Hzの選別聴力検査を含む健康診断が示されている。
    condition:
      region: 日本
      対象: 騒音作業に従事する労働者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-4121
    source: 厚生労働省. 騒音障害防止のためのガイドライン（令和5年4月20日改訂、基発0420第2号）. 厚生労働省. 2023
    doi: null
    pmid: null
    pmcid: null
    url: null
    source_license: 政府標準利用規約
    legal_basis: B
    source_class: GOV_JP
    corroboration: null
  uncertainty: 85 dBの位置づけと選別聴力検査の周波数は、ガイドラインの解説資料で確認した範囲で、ガイドライン本文での逐語確認はしていない。難聴そのものの耳科的な診断・治療は耳鼻咽喉科の分野（第26回）が正であり、本カードは騒音曝露・予防・健康診断の側面に限る。
  curriculum:
