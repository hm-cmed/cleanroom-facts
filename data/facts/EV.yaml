  uncertainty: 国際的な応急処置コンセンサスにおける検討範囲の整理であり、個別の手技の適応は傷病者の状態による。縫合、デブリードマン、感染治療などの創傷の本格的な治療は本カードの範囲外（第Ⅸ章の外傷の範囲）であり、創傷後の破傷風予防についても本カードでは扱わない。
