- id: EV-010
  domain: EV
  subdomain: 高山病
  assertion:
    plain_statement_ja: 急性高地疾患には急性高山病（AMS）、高地脳浮腫（HACE）、高地肺水腫（HAPE）が含まれ、順応していない人が2,500 mを超える高度へ上がると発症のリスクがある。予防の第一はゆっくり上がることで、3,000 mを超えたら睡眠高度の上昇を1日500 m以内にとどめ、3〜4日ごとに睡眠高度を上げない休息日を入れる。予防薬のアセタゾラミドは、成人では125 mgを12時間ごとの投与が基本の用量とされる。
    condition:
      region: 国際
      対象: 高地へ旅行する人
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-4125
    source: 'Luks AM, Beidleman BA, Freer L, et al. Wilderness Medical Society Clinical Practice Guidelines for the Prevention, Diagnosis, and Treatment of Acute Altitude Illness: 2024 Update. Wilderness & Environmental Medicine. 2024;35(1 Suppl):2S-19S'
    doi: 10.1016/j.wem.2023.05.013
    pmid: '37833187'
    pmcid: null
    url: https://doi.org/10.1016/j.wem.2023.05.013
    source_license: ライセンス表示を確認できず
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: アセタゾラミドの高山病・高地疾患への使用は国内では適応外で、国内添付文書の効能・効果に高地疾患は含まれない（米国では急性高山病の予防・症状緩和が適応に含まれる）。デキサメタゾンとニフェジピン（HAPE関係）の高地疾患への国内適応は未確認。睡眠高度の上げ方などの数値はガイドラインの要約資料で確認した範囲で、HACE・HAPEでは薬は下山の代わりにならない。
