- id: EV-012
  domain: EV
  subdomain: 放射線による発がん
  assertion:
    plain_statement_ja: 広島・長崎の原爆被爆者を追跡した寿命調査（線量推定のある86,611人、1950〜2003年）では、固形がん死亡の過剰相対リスクは被ばく線量と直線的な関係を示した。30歳で被ばくし70歳に達した時点での全固形がんの過剰相対リスクは、男女平均で1 Gyあたり0.42（95%信頼区間0.32〜0.53）で、被ばく時年齢が10歳若くなるごとにリスクは約29%増えた。有意な過剰が認められた最も低い線量の範囲は0〜0.20 Gyだった。
    condition:
      region: 日本
      対象: 原爆被爆者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-4127
    source: 'Ozasa K, Shimizu Y, Suyama A, et al. Studies of the mortality of atomic bomb survivors, Report 14, 1950-2003: an overview of cancer and noncancer diseases. Radiation Research. 2012;177(3):229-243'
    doi: 10.1667/RR2629.1
    pmid: '22171960'
    pmcid: null
    url: https://doi.org/10.1667/RR2629.1
    source_license: ライセンス表示を確認できず
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 数値は第14報（死亡の解析）の抄録で確認した範囲。固形がん罹患の解析（Grant 2017）やUNSCEARの福島第一原子力発電所事故の評価は本カードには含めていない。
  curriculum:
