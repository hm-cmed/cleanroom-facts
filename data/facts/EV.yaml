- id: EV-016
  domain: EV
  subdomain: 創傷
  assertion:
    plain_statement_ja: 応急処置に関する2020年の国際コンセンサスでは、生命を脅かす外出血のコントロールとして、直接圧迫に加えて止血帯（ターニケット）、止血ドレッシング、圧迫器具の使用が検討事項とされている。あわせて、閉鎖性の四肢関節損傷への圧迫ラップや、脱落した歯の一時的な保存も応急処置の検討範囲に含まれる。
    condition:
      region: 国際
      対象: 創傷・外出血に対する応急処置
    differential: null
    common_misconception: null
  provenance:
