- id: EV-009
  domain: EV
  subdomain: 減圧症
  assertion:
    plain_statement_ja: 減圧症を含むダイビング事故は、潜水や高圧環境で周囲の圧力が下がることで起こり、命に関わることがある。現場での初期対応は、100%酸素の投与、安静にして横になること、水分を取ること、ダイビング医学の専門家への相談である。重症例で確立した治療は高気圧酸素療法であり、代わりになる治療はなく、基本の治療条件として280 kPaでの高気圧酸素が推奨されている。
    condition:
      region: 国際
      対象: 減圧症などダイビング事故の患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-4124
    source: Jüttner B, Wölfel C, Camponovo C, et al. S2k guideline for diving accidents. GMS German Medical Science. 2023;21:Doc01
    doi: 10.3205/000315
    pmid: '37033772'
    pmcid: PMC10073983
    url: https://doi.org/10.3205/000315
    source_license: CC BY 4.0（Europe PMC の表示で確認）
    legal_basis: B
    source_class: OPEN
    corroboration: null
  uncertainty: 出典はドイツのS2kガイドライン（2023年）で、抄録で確認した範囲。国内の潜水・高気圧環境の制度（高気圧作業安全衛生規則など）との対応は確認していない。
