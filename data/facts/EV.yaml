- id: EV-004
  domain: EV
  subdomain: 偶発性低体温{症}
  assertion:
    plain_statement_ja: 偶発性低体温症は、深部体温が意図せず35℃未満に下がった状態である。心停止に至るリスクが高い目安として、深部体温30℃未満（高齢者や併存疾患の多い患者では32℃未満）、心室性不整脈の存在、収縮期血圧90 mmHg未満が挙げられ、これらに当たる患者や既に心停止した患者は、体外式生命維持（ECLS）ができる施設へ直接運ぶことが勧められる。復温には能動的体外復温が最もよく用いられ、ECLSによる復温は難治性の低体温や心停止の場合に行われる。
    condition:
      region: 国際
      対象: 偶発性低体温症の患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-4119
    source: 'Paal P, Pasquier M, Darocha T, Lechner R, Kosinski S, Wallner B, Zafren K, Brugger H. Accidental Hypothermia: 2021 Update. International Journal of Environmental Research and Public Health. 2022;19(1):501'
    doi: 10.3390/ijerph19010501
    pmid: '35010760'
    pmcid: PMC8744717
    url: https://doi.org/10.3390/ijerph19010501
    source_license: CC BY 4.0（Europe PMC の表示で確認）
    legal_basis: B
    source_class: OPEN
    corroboration: null
  uncertainty: 数値は出典の抄録で確認した範囲。Wilderness Medical Society の偶発性低体温ガイドラインは2019年版が現行で、2024年版は存在しない。国内に低体温症単独の学会ガイドラインがあるかは未確認。
  curriculum:
    kokushi: 医学各論 ⅩⅢ-5-A-②（偶発性低体温{症}、a）
    core_curriculum: 'PS-03-05-10 (id: Jkxnub4)'
