- id: EV-003
  domain: EV
  subdomain: 熱中症
  assertion:
    plain_statement_ja: 2025年6月1日から、WBGT（暑さ指数）が28以上または気温が31℃以上の環境下で、連続1時間以上または1日合計4時間を超えて行われることが見込まれる作業については、事業者に熱中症対策が義務付けられた。義務の内容は、熱中症の発生を早期に把握するための報告体制の整備、重篤化を防ぐための手順の作成、関係者への周知である（労働安全衛生規則第612条の2）。
