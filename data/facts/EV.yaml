- id: EV-013
  domain: EV
  subdomain: 非電離放射線障害
  assertion:
    plain_statement_ja: レーザー光（波長180 nm〜1,000 µm）への曝露の限度を示す国際指針は2013年に改訂された。改訂では、網膜の熱障害に対する限度の決め方が見直され、その根拠として、当たる光の範囲（スポットサイズ）への依存性、短いパルスでのパルス幅への依存性、1,200〜1,400 nm帯での波長への依存性が挙げられている。
    condition:
      region: 国際
      対象: レーザーを扱う作業者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-4128
    source: International Commission on Non-Ionizing Radiation Protection (ICNIRP). ICNIRP Guidelines on Limits of Exposure to Laser Radiation of Wavelengths between 180 nm and 1,000 μm. Health Physics. 2013;105(3):271-295
    doi: 10.1097/HP.0b013e3182983fd4
    pmid: '30522251'
    pmcid: null
    url: https://doi.org/10.1097/HP.0b013e3182983fd4
    source_license: ライセンス表示を確認できず
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 紫外線の曝露限度はICNIRPの2004年の別の指針があり、紫外線による角膜炎（雪目など）は既存カード（TR-007）が扱う。赤外線に直接対応する国際指針は未確認。曝露限度の具体的な数値は抄録に含まれないため主張に入れていない。
  curriculum:
