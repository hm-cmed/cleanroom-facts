- id: EV-015
  domain: EV
  subdomain: 誤嚥
  assertion:
    plain_statement_ja: 人口動態統計（令和6年）では、気道閉塞を生じた食物の誤えんによる死亡は4,383人で、その約91%（3,992人）を65歳以上が占めており、食物による窒息は高齢者に集中している。事故防止のポイントとして、餅などの食品は小さく切ること、飲み物で喉を潤してから食べること、一口の量を無理のない量にしてゆっくりよく噛んで飲み込むことが示されている。
    condition:
      region: 日本
      対象: 高齢者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-4130
    source: 消費者庁. 年末年始、高齢者の事故に注意しましょう！―思いがけない事故のリスクは事前に減らすことができます―（注意喚起、2025年12月23日公表。人口動態統計（令和6年）に基づく）
    doi: null
    pmid: null
    pmcid: null
    url: https://www.caa.go.jp/policies/policy/consumer_safety/caution/caution_084/
    source_license: 政府標準利用規約
    legal_basis: B
    source_class: GOV_JP
    corroboration: null
  uncertainty: 数値は消費者庁の注意喚起が引用する人口動態統計（令和6年）の値である。誤嚥性肺炎の診断・治療は本カードの範囲外であり、成人肺炎診療ガイドライン2024（SRC-352）が接点となる。神経疾患に伴う嚥下障害の側面は第Ⅸ章の範囲である。
