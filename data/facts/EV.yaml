    pmid: '34916091'
    pmcid: null
    url: https://doi.org/10.1016/j.burns.2021.10.007
    source_license: CC BY 4.0
    legal_basis: B
    source_class: OPEN
    corroboration: null
  uncertainty: 冷却の開始時期や水温の詳細は本カードの出典では確定していない。熱傷の重症度評価（BI・PBI）や輸液蘇生は第27回（TR-001・002・027）の範囲であり、本カードは受傷直後の応急処置に限る。
