- id: EV-014
  domain: EV
  subdomain: 誤飲
  assertion:
    plain_statement_ja: ボタン電池の誤飲では、電池が食道に停滞すると放電に伴うアルカリ生成により食道や胃に化学的な損傷が生じ、生命を脅かす合併症に至ることがある。診断では電池の位置を直ちに確認することが重要であり、食道に停滞している場合は速やかに、望ましくは2時間以内に摘出する。摂取後12時間以内であれば、摘出を遅らせないことを前提に、蜂蜜やスクラルファートの投与が損傷軽減のために考慮できる。
    condition:
      region: 国際
      対象: ボタン電池を誤飲した小児
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-4129
    source: 'Mubarak A, Benninga MA, Broekaert I, et al. Diagnosis, Management, and Prevention of Button Battery Ingestion in Childhood: A European Society for Paediatric Gastroenterology Hepatology and Nutrition Position Paper. Journal of Pediatric Gastroenterology and Nutrition. 2021;73(1):129-136'
    doi: 10.1097/MPG.0000000000003048
    pmid: '33555169'
    pmcid: null
    url: https://doi.org/10.1097/MPG.0000000000003048
    source_license: CC 表示なし（購読誌）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 国際的な小児消化器学会のポジションペーパーに基づく整理であり、国内の診療体制や受診経路にそのまま当てはまるものではない。スクラルファートは国内で消化性潰瘍等に承認されている既存薬であるが、ボタン電池誤飲時の損傷軽減を目的とする使用について国内の承認・保険適用は確認されていない。蜂蜜は食品である。小児の異物誤飲の総論は第27回（TR-008・009）が担い、本カードはボタン電池に伴う損傷・中毒の側面に限る。
  curriculum:
    kokushi: 医学各論 ⅩⅢ-5-G-①（誤飲、a）
