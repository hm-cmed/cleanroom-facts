- id: EV-008
  domain: EV
  subdomain: 手腕振動障害
  assertion:
    plain_statement_ja: 振動工具による障害を防ぐための作業管理では、日振動ばく露量A(8)を使う。A(8)の限界値は5.0 m/s²で、これを超えないよう ばく露時間を抑え、低振動工具を選ぶ。対策値は2.5 m/s²で、これを超える場合は同様の対策に努める。対象はチェーンソー、携帯用研削盤、インパクトレンチなどの振動工具を扱う業務である。
    condition:
