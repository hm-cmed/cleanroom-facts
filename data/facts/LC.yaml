  subdomain: 肺癌
  assertion:
    plain_statement_ja: 限局型小細胞肺癌では、エトポシドとシスプラチンに胸部放射線療法を併用する集学的治療が標準で、胸部放射線療法の追加は化学療法単独より絶対生存率を約5%改善する。治療に反応した例への予防的全脳照射は脳転移のリスクを半分以上減らし、メタ解析で3年全生存率を15%から21%に改善した。
