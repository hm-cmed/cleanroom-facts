- id: CM-003
  domain: CM
  subdomain: オウム病
  assertion:
    plain_statement_ja: オウム病の原因菌 Chlamydia psittaci が市中肺炎に占める割合は、各100例以上の57研究を集めたメタ解析で1.03%（95%信頼区間0.79–1.30）であり、研究間の範囲は0〜6.7%だった。
    condition:
      region: 国際
      対象: 市中肺炎患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2083
    source: 'Hogerwerf L, de Gier B, Baan B, van der Hoek W. Chlamydia psittaci (psittacosis) as a cause of community-acquired pneumonia: a systematic review and meta-analysis. Epidemiol Infect. 2017;145(15):3096-3105.'
    doi: 10.1017/S0950268817002060
    pmid: '28946931'
    pmcid: PMC9148753
    url: https://doi.org/10.1017/S0950268817002060
    source_license: CC表示なし
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（CC BY 4.0（OPEN）、作り手の調査バッチ90 2026-11-15）：Wang R, Li N, Tian J, Zeng X. Clinical characteristics of Chlamydia psittaci pneumonia diagnosed by next-generation sequencing: An observational study. Medicine (Baltimore). 2026;105(39):e50850（PMID: 42798109、DOI: 10.1097/MD.0000000000050850、PMCID: PMC13619205、https://creativecommons.org/licenses/by/4.0/）。裏づける部分：部分：候補は主出典（2017年のメタ解析）を引用し、「C. psittaci は市中肺炎の病因の約1%を占め、研究間のばらつきは大きく範囲は0〜6.7%」と再掲する。1.03%（95%信頼区間0.79–1.30）という点値と信頼区間、「各100例以上の57研究」という統合の枠組みは再掲されない。数値の照合：範囲0〜6.7%は完全一致。割合は候補が「約1%」と丸めた形であり、カードの1.03%の点値そのものの再掲ではない。95%信頼区間は照合できない。留保：主出典の刊行版は Crossref では Cambridge の利用条件のみで CC 表示はなく、RESTRICTED は正しい。PMC 収載コピー（PMC9148753）も Europe PMC で非 OA・ライセンス表示なし。マスターの pmcid は null だが、カード側に既記の PMC9148753 が当該論文のものであることを Europe PMC の個別レコードで確認した（識別子補完候補）'
  uncertainty: 鳥類との接触歴や診断の詳細は本カードでは扱わず、市中肺炎における病原体としての位置づけに絞った。
