- id: CM-004
  domain: CM
  subdomain: クラミジア結膜炎
  assertion:
    plain_statement_ja: トラコーマは Chlamydia trachomatis の結膜感染株による疾患で、感染性の失明原因の第1位である。反復する感染の蓄積が病態の基盤で、生涯で少なくとも150回の感染エピソードが睫毛内反の発症に必要とされ、2021年6月時点で世界で180万人がトラコーマにより失明していた。
    condition:
      region: 国際
      対象: 流行地域の住民
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2084
    source: Solomon AW, Burton MJ, Gower EW, et al. Trachoma. Nat Rev Dis Primers. 2022;8(1):32.
    doi: 10.1038/s41572-022-00359-5
    pmid: '35618795'
    pmcid: null
    url: https://doi.org/10.1038/s41572-022-00359-5
    source_license: CC表示なし
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（CC BY 4.0（OPEN）、作り手の調査バッチ90 2026-11-15）：Kempen JH, Abashawl A, Mohammed AA, et al. Evaluation of fluorometholone as adjunctive medical therapy for trachomatous trichiasis surgery (FLAME): a parallel, double-blind, randomised controlled field trial in the Jimma Zone, Ethiopia. Lancet Glob Health. 2026;14(3):e395-e406（PMID: 41539314、DOI: 10.1016/S2214-109X(25)00493-0、PMCID: PMC13034013、https://creativecommons.org/licenses/by/4.0/）。裏づける部分：部分：候補は序文で「トラコーマは感染性の失明原因として世界第1位」「睫毛内反は反復する C. trachomatis 感染と慢性炎症による結膜瘢痕の帰結」を再掲し、カードの位置づけと、反復感染の蓄積が病態の基盤であることを裏づける。生涯で少なくとも150回の感染エピソードが必要という閾値と、2021年6月時点で180万人が失明していたという数値は再掲されない。数値の照合：候補の「約190万人がトラコーマにより視覚障害を有する」は視覚障害者数であり、カードの「失明180万人」（2021年6月時点）とは指標も時点も異なる。候補の数値をカードの数値の裏づけとして登録しないこと。留保：主出典の刊行版ライセンスは Crossref では Springer のテキストマイニング用ライセンスのみ、Europe PMC でも非 OA・PMC 未収載で、RESTRICTED は正しい。候補の刊行版ライセンスは Crossref の版（version of record）データで CC BY 4.0 を個別確認した'
  uncertainty: 眼所見そのものは眼科分野の既存カードの範囲とし、本カードは病原体・反復感染と世界の疫学に絞った。
