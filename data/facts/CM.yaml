- id: CM-001
  domain: CM
  subdomain: クラミジア肺炎
  assertion:
    plain_statement_ja: Chlamydophila pneumoniae は市中肺炎の約10%、気管支炎の約5%の原因と推定される病原体で、感染者の大多数は無症状か軽症である。潜伏期は約21日と長く、咳や倦怠感が抗菌薬治療後も数週間から数か月続くことがある。
    condition:
      region: 国際
      対象: 一般
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2081
    source: Burillo A, Bouza E. Chlamydophila pneumoniae. Infect Dis Clin North Am. 2010;24(1):61-71.
    doi: 10.1016/j.idc.2009.10.002
    pmid: '20171546'
    pmcid: null
    url: https://doi.org/10.1016/j.idc.2009.10.002
    source_license: CC表示なし（Elsevier 誌）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（GOV_US（CDC）／CC BY 4.0（OPEN）、作り手の調査バッチ90 2026-11-15）：CDC. Clinical Overview of Chlamydia pneumoniae Infection. Centers for Disease Control and Prevention（cdc.gov）／Wu T, Wang G, Xu N, Xu K, Chen G. Case Report: A cluster of cases with rash associated with Chlamydia pneumoniae infection. Front Med (Lausanne). 2026;13:1922611（PMID: －／42755900、DOI: －／10.3389/fmed.2026.1922611、PMCID: －／PMC13581956、https://www.cdc.gov/cpneumoniae/hcp/clinical-overview/index.html／https://creativecommons.org/licenses/by/4.0/）。裏づける部分：部分：CDC の臨床家向けページは「呼吸器感染の大多数は無症状か軽症」「潜伏期は一般に3〜4週間」を再掲し、CDC の一般向けページは咳・倦怠感を含む症状が「数週間続くことがある」と述べる。Wu 2026 は序文で「市中肺炎の約10%を占める」を再掲する。気管支炎の約5%という割合、抗菌薬治療後も症状が続くという枠組み、「数か月」に及ぶ持続は再掲されない。数値の照合：市中肺炎の約10%は Wu 2026 と一致する。潜伏期はカードの約21日に対し CDC は3〜4週間で、カードの値はその下限に当たる。気管支炎の約5%は自由な全文で照合できなかった。留保：主出典の刊行版ライセンスは Crossref では Elsevier のテキストマイニング用ライセンスのみ、Europe PMC でも非 OA・PMC 未収載で、RESTRICTED は正しい。マスター・カードの PMID 20171546・DOI・巻ページは個別照会と一致した。Wu 2026 は症例報告集であり、割合は序文での再掲であって一次根拠ではない'
  uncertainty: 肺炎の診療そのものは呼吸器分野の範囲であり、本カードは病原体・疫学の側面に絞った。割合はいずれも推定値である。
