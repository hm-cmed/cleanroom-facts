- id: CM-008
  domain: CM
  subdomain: クラミジア肺炎
  assertion:
    plain_statement_ja: Chlamydophila pneumoniae 感染症の診断は、鼻咽頭検体の培養、血清抗体価の測定、分子生物学的手法によるが、結果は発症や治療開始の時点から遅れて得られることが多く、正確で標準化された迅速診断法は確立していない。治療の第一選択はエリスロマイシン、テトラサイクリン、ドキシサイクリンであり、北米のガイドラインは急性の C. pneumoniae 呼吸器感染症への抗菌薬治療を推奨している。ただし非定型病原体による市中肺炎への治療が転帰を改善するかについては否定的な報告もある。
    condition:
      region: 国際
      対象: 一般
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2081
    source: Burillo A, Bouza E. Chlamydophila pneumoniae. Infect Dis Clin North Am. 2010;24(1):61-71
    doi: 10.1016/j.idc.2009.10.002
    pmid: '20171546'
    pmcid: null
    url: https://doi.org/10.1016/j.idc.2009.10.002
    source_license: CC表示なし
    legal_basis: B
    source_class: RESTRICTED
    corroboration: 自由に使える資料による裏づけ（GOV_US（CDC）、作り手の調査バッチ90 2026-11-15）：CDC. Clinical Overview of Chlamydia pneumoniae Infection. Centers for Disease Control and Prevention（cdc.gov）（https://www.cdc.gov/cpneumoniae/hcp/clinical-overview/index.html）。裏づける部分：部分：CDC は診断法として分子生物学的手法・血清学・培養の3つを挙げ、カードの診断法の列挙と一致する。治療ではマクロライド（アジスロマイシン）を第一選択とし、テトラサイクリン系（ドキシサイクリン）とフルオロキノロンを選択肢に挙げるため、カードのテトラサイクリン・ドキシサイクリンの位置づけは裏づけられる。「正確で標準化された迅速診断法は確立していない」という明示、エリスロマイシンの名指し、北米のガイドラインが抗菌薬治療を推奨するという形の言及、非定型病原体への治療が転帰を改善するかへの否定的報告は再掲されない。数値の照合：数値なし。留保：カードの第一選択の筆頭はエリスロマイシンだが、CDC の第一選択はマクロライド系（アジスロマイシン）であり、薬剤名レベルでは一致しない。主出典は CM-001 と同一（SRC-2081）で、区分は RESTRICTED が正しい。カード側の出典文字列はマスターと同一内容（末尾のピリオド欠落のみ）
  uncertainty: エリスロマイシン、テトラサイクリン、ドキシサイクリンはいずれも国内で承認された抗菌薬である。ドキシサイクリンは国内の添付文書でクラミジア属を適応菌種に含み肺炎への適応があることを PMDA の資料で確認した。他の2剤の適応菌種の範囲は製剤ごとの添付文書による。出典は2010年の総説で、主張は抄録で確認した範囲に限った。集団発生の側面は抄録では確認できず、主張に入れていない。
