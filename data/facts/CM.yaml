- id: CM-006
  domain: CM
  subdomain: Q熱
  assertion:
    plain_statement_ja: Q熱は1937年にオーストラリアで初めて記載された人獣共通感染症で、原因菌 Coxiella burnetii は世界各地に分布する。近年の知見では「急性Q熱／慢性Q熱」という二分法は見直され、持続感染には必ず感染巣が存在するとされる。
    condition:
      region: 国際
      対象: 一般
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2086
    source: 'Eldin C, Mélenotte C, Mediannikov O, et al. From Q Fever to Coxiella burnetii Infection: a Paradigm Change. Clin Microbiol Rev. 2017;30(1):115-190.'
    doi: 10.1128/CMR.00045-16
    pmid: '27856520'
    pmcid: PMC5217791
    url: https://doi.org/10.1128/CMR.00045-16
    source_license: CC表示なし
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（GOV_US（CDC）／CC BY 4.0（OPEN）、作り手の調査バッチ90 2026-11-15）：Anderson A, Bijlmer H, Fournier PE, et al.; CDC and the Q Fever Working Group. Diagnosis and Management of Q Fever — United States, 2013: Recommendations from CDC and the Q Fever Working Group. MMWR Recomm Rep. 2013;62(RR-03):1-30／Wang S, Xu K, Wang G. Delayed diagnosis of persistent Q fever: a case series from China. BMC Infect Dis. 2024;24(1):591（PMID: 23535757／38886677、DOI: －／10.1186/s12879-024-09484-w、PMCID: －／PMC11181675、https://www.cdc.gov/mmwr/preview/mmwrhtml/rr6203a1.htm／https://creativecommons.org/licenses/by/4.0/）。裏づける部分：部分：MMWR は「Q熱は1937年に初めて記載された、世界的な人獣共通感染症である」と述べ（原典として Derrick 1937 を引用）、カードの歴史と分布を再掲する。Wang 2024 は主出典を引用し、「初感染後に C. burnetii は特定の解剖学的部位で持続限局感染（persistent focalized infections）を成立させうる」と述べており、持続感染には感染巣が存在するという要素を裏づける。「急性Q熱／慢性Q熱という二分法が見直された」という見直し自体の明示は、どちらの候補にもない。数値の照合：数値なし（1937年の初記載と世界的分布は両候補の記述と整合する）。留保：MMWR 2013 は二分法見直し以前の文書であり、慢性Q熱を「6か月を超える持続感染」とする旧来の定義を用いている。旧定義の文言をカードの新しい枠組みの裏づけに使わないこと。主出典の刊行版ライセンスは Crossref では ASM の非商用テキストマイニング用ライセンスのみで、PMC 収載コピー（PMC5217791）も非 OA・ライセンス表示はなく、RESTRICTED は正しい。マスターの pmcid は null だが、カード側に既記の PMC5217791 が当該論文のものであることを Europe PMC の個別レコードで確認した（識別子補完候補）'
  uncertainty: 日本では4類感染症（全数把握）だが、日本の届出数の一次資料は確認できなかったため、届出数については主張に入れていない。
