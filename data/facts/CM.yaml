- id: CM-002
  domain: CM
  subdomain: マイコプラズマ肺炎
  assertion:
    plain_statement_ja: 日本では、肺炎マイコプラズマ（Mycoplasma pneumoniae）のマクロライド耐性株の割合は2002–2005年の6.9%から2010–2013年には86.2%まで上昇したが、その後は減少し、2018–2019年には11.3%となった。耐性は主に23S rRNAのA2063G変異による。
    condition:
      region: 日本
      対象: 一般
    differential: null
    common_misconception: null
  provenance:
