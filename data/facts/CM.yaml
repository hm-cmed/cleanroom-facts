- id: CM-009
  domain: CM
  subdomain: マイコプラズマ肺炎
  assertion:
    plain_statement_ja: 肺炎マイコプラズマ感染症は学童期から青年期に多く、最も多い病像は気管気管支炎で、乾性咳嗽や粘液性の痰を伴う咳嗽が数週間にわたり遷延することが特徴である。潜伏期は約3週間と長く、家庭内など濃厚接触の場で緩やかに広がる。中枢神経系をはじめとする肺外症状を伴うことがある。診断は核酸増幅検査が中心的な方法で、血清診断では発症後2週間以上あけて採取したペア血清で4倍以上の抗体価上昇が最も確実であり、単一検体では偽陰性・偽陽性がありうる。治療はマクロライド系抗菌薬が第一選択で、マクロライド耐性や無効例ではテトラサイクリン系（ミノサイクリン、ドキシサイクリン）やフルオロキノロン系（レボフロキサシンなど）が代替薬となる。
    condition:
      region: 国際
      対象: 一般
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-4882
    source: Waites KB, Xiao L, Liu Y, Balish MF, Atkinson TP. Mycoplasma pneumoniae from the Respiratory Tract and Beyond. Clin Microbiol Rev. 2017;30(3):747-809
    doi: 10.1128/CMR.00114-16
    pmid: '28539503'
    pmcid: PMC5475226
    url: https://doi.org/10.1128/CMR.00114-16
    source_license: American Society for Microbiology（CC 表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: 自由に使える資料による裏づけ（GOV_US（CDC）、作り手の調査バッチ90 2026-11-15）：CDC. Clinical Overview of Mycoplasma pneumoniae Infection／CDC. Laboratory Testing for Mycoplasma pneumoniae／CDC. Clinical Care of Mycoplasma pneumoniae Infection（いずれも Centers for Disease Control and Prevention、cdc.gov）（https://www.cdc.gov/mycoplasma/hcp/clinical-overview/／https://www.cdc.gov/mycoplasma/php/laboratories/／https://www.cdc.gov/mycoplasma/hcp/clinical-care/）。裏づける部分：部分：CDC は「学童期の子どもに最も多い」「最も多い病像は気管気管支炎」「肺外症状を伴いうる（合併症に脳炎を挙げる）」「潜伏期は1〜4週間」「濃厚な人―人接触で広がる」「症状は数週間続くことがある」を再掲する。診断では NAAT が望ましい方法であること、血清診断は特異度に限界があり急性期・回復期のペア血清を要することを再掲する。治療ではマクロライドが子どもと成人の第一選択系統とされ、マクロライドで改善しない場合にドキシサイクリン等の代替を検討すること、薬剤クラスとしてテトラサイクリン系・フルオロキノロン系が挙げられる。ペア血清で4倍以上の抗体価上昇が最も確実という基準そのものと、ミノサイクリン・レボフロキサシンの個別薬剤名は再掲されない。数値の照合：潜伏期はカードの約3週間に対し CDC は1〜4週間で範囲内にある。「2週間以上あけて採取したペア血清で4倍以上の抗体価上昇」という数値基準は CDC のページに現れず照合できない。留保：主出典の刊行版ライセンスは Crossref では ASM の非商用テキストマイニング用ライセンスのみで、PMC 収載コピー（PMC5475226）も非 OA・ライセンス表示はなく、RESTRICTED は正しい。マスターの pmcid は null だが、カード側に既記の PMC5475226 が当該論文のものであることを Europe PMC の個別レコードで確認した（識別子補完候補）
  uncertainty: ミノサイクリンとレボフロキサシンは、国内の添付文書で肺炎マイコプラズマ（マイコプラズマ・ニューモニエ）を適応菌種に含み肺炎への適応があることを PMDA の添付文書で確認した。同じテトラサイクリン系でもドキシサイクリンは国内の添付文書の適応菌種にマイコプラズマを含まないため、本症への使用は適応外となる。マクロライド耐性率は地域と時期で大きく異なり、日本の耐性率の推移そのものは既存カード CM-002 が担う。
