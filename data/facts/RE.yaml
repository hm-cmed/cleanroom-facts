- id: RE-018
  domain: RE
  subdomain: 硝子体出血
  assertion:
    plain_statement_ja: 自然発生の硝子体出血の頻度は人口10万人あたり約7例である。原因として最も多いのは増殖糖尿病網膜症（32%）、次いで網膜裂孔（30%）、網膜静脈閉塞症後の増殖性網膜症（11%）、裂孔を伴わない後部硝子体剥離（8%）である。硝子体内の血液は速やかに凝固し、その後およそ1日1%の速さでゆっくり吸収される。吸収されない硝子体出血に対する確立した治療は経毛様体扁平部硝子体切除である。持続する出血の合併症として、ゴーストセル緑内障などの続発緑内障が生じ得る。
