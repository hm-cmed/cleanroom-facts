- id: RE-001
  domain: RE
  subdomain: 糖尿病網膜症の分類
  assertion:
    plain_statement_ja: 糖尿病網膜症の国際臨床重症度分類は5段階からなり、低いリスクの3段階の上に第4段階として重症非増殖糖尿病網膜症、第5段階として増殖糖尿病網膜症が置かれる。糖尿病黄斑浮腫は「明らかに存在する」か「明らかに存在しない」かで分け、検査の条件が整えば中心窩からの距離によってさらに分類する。この分類は Early Treatment Diabetic Retinopathy Study と Wisconsin Epidemiologic Study of Diabetic Retinopathy の知見に基づいて国際的な合意として作られた。
    condition:
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1281
    source: Wilkinson CP, Ferris FL 3rd, Klein RE, et al. Proposed international clinical diabetic retinopathy and diabetic macular edema disease severity scales. Ophthalmology. 2003;110(9):1677-1682.
    doi: 10.1016/S0161-6420(03)00475-5
    pmid: '13129861'
    pmcid: null
    url: https://doi.org/10.1016/S0161-6420(03)00475-5
    source_license: CC表示を確認できず
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 各段階を定義する具体的な眼底所見（微小血管瘤のみ、網膜出血の範囲など）は本論文の分類表に示されているが、本カードでは抄録で確認できた段階構成のみを記載した。日本で用いられる分類（新福田分類など）との対応は本カードには含めていない。糖尿病網膜症の全身管理は DM-028（第21回）を正とし、本カードは眼科的な分類に限る。
