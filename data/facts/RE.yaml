- id: RE-025
  domain: RE
  subdomain: Behçet病の眼病変
  assertion:
    plain_statement_ja: Behçet病の眼病変の中心は再発を繰り返す非肉芽腫性ぶどう膜炎で、眼病変は患者の50〜70%にみられ、初め片眼性でも通常は両眼性となる。トルコの880例（1,567眼）のコホートでは、前部ぶどう膜炎が11%、後部ぶどう膜炎が28.8%、汎ぶどう膜炎が60.2%と汎ぶどう膜炎が最も多かった。前眼部では体位で移動する前房蓄膿がみられ、前房蓄膿は後眼部の関与を示す所見とされる。後眼部では網膜血管炎が主徴で、主に静脈周囲炎の形をとり、閉塞性血管症に伴う網膜・硝子体出血、網膜虚血、新生血管を伴うことがあり、黄斑浮腫が視力障害の主要な合併症となる。発作と寛解を繰り返す経過の中で進行し、10年の経過で最大25%の患者が失明しうる視力を脅かす疾患である。
    condition:
      region: トルコの大規模コホートを含む国際
      study: 総説（トルコの880例コホートの集計を含む）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1311
    source: 'Aboul Naga SH, Hassan LM, El Zanaty RT, Refaat M, Amin RH, Ragab G, Soliman MM. Behçet uveitis: Current practice and future perspectives. Front Med (Lausanne). 2022;9:968345.'
    doi: 10.3389/fmed.2022.968345
    pmid: '36160151'
    pmcid: PMC9490079
    url: https://doi.org/10.3389/fmed.2022.968345
    source_license: Creative Commons Attribution License (CC BY)
    legal_basis: B
    source_class: OPEN
    corroboration: null
  uncertainty: 頻度の数値はいずれも本総説の本文で確認したもので、部位別の割合（11%、28.8%、60.2%）は同総説が集計したトルコの880例コホートの値であり、日本人コホートでの割合は本出典では確認していない。失明の割合（10年で最大25%）も総説本文の記載に基づく。本カードは眼病変のみを扱い、全身像と全身治療の詳細は含めていない。本カードには薬剤名を含めていない。
