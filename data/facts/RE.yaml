- id: RE-004
  domain: RE
  subdomain: 網膜静脈分枝閉塞症
  assertion:
    plain_statement_ja: 網膜静脈分枝閉塞症に伴う黄斑浮腫に対しては、ラニビズマブの硝子体内投与が有効である。第III相試験（BRAVO、397例）で月1回投与を6か月行ったところ、最高矯正視力の改善はラニビズマブ0.3 mg群で平均16.6文字、0.5 mg群で18.3文字、シャム群で7.3文字だった。15文字以上の視力改善を得た割合は0.3 mg群55.2%、0.5 mg群61.1%、シャム群28.8%だった。
    condition:
      region: 国際
      study: 無作為化比較試験（BRAVO）
    differential: null
    common_misconception: null
  provenance:
