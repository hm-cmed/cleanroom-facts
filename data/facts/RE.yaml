    source: Wong TY, Mitchell P. The eye in hypertension. Lancet. 2007;369(9559):425-435.
    doi: 10.1016/S0140-6736(07)60198-6
    pmid: '17276782'
    pmcid: null
    url: https://doi.org/10.1016/S0140-6736(07)60198-6
    source_license: CC表示を確認できず
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: Keith-Wagener-Barker 分類などの段階分類の定義（細動脈狭細化、交叉現象、綿花様白斑、乳頭浮腫の段階づけ）は出典本文の表に示される内容であり、抄録では確認できなかったため本カードには含めていない。分類表を用いる場合は本文の表から読み取りのうえ別途確認が必要である。
