- id: RE-002
  domain: RE
  subdomain: 糖尿病網膜症の眼科治療
  assertion:
    plain_statement_ja: 国際眼科学会（ICO）の糖尿病眼ケアガイドラインは、糖尿病網膜症についてスクリーニング、紹介、経過観察の間隔と、視力を脅かす病態への治療を医療資源の水準に応じて示している。視力を脅かす糖尿病網膜症と糖尿病黄斑浮腫への治療には、レーザー光凝固と硝子体内抗 VEGF 薬が含まれ、特定の状況では硝子体内ステロイドも用いられる。妊娠中や白内障を合併した患者への対応も別途示されている。
    condition:
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1282
    source: 'Wong TY, Sun J, Kawasaki R, et al. Guidelines on Diabetic Eye Care: The International Council of Ophthalmology Recommendations for Screening, Follow-up, Referral, and Treatment Based on Resource Settings. Ophthalmology. 2018;125(10):1608-1622.'
    doi: 10.1016/j.ophtha.2018.04.007
    pmid: '29776671'
    pmcid: null
    url: https://doi.org/10.1016/j.ophtha.2018.04.007
    source_license: CC表示を確認できず
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 本カードはガイドラインの抄録で確認できた治療の枠組みのみを記載し、病期ごとの具体的な治療適応や投与間隔は含めていない。本文中に抗 VEGF 薬とステロイドの硝子体内投与が挙げられているが、各薬剤の糖尿病網膜症・糖尿病黄斑浮腫に対する国内の承認・保険適用は未確認である。血糖・血圧などの全身管理は本カードの範囲外（DM-028 を正とする）。
