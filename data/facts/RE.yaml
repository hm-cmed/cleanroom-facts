- id: RE-024
  domain: RE
  subdomain: ぶどう膜悪性黒色腫
  assertion:
    plain_statement_ja: ぶどう膜悪性黒色腫は成人で最も多い原発性眼内悪性腫瘍であり、皮膚悪性黒色腫で多いBRAFやNRASではなく、通常GNAQまたはGNA11の変異で始まる。ヨーロッパと米国での年間発症率は人口100万人あたり約6人である。眼局所治療は眼球と有用な視力の温存と転移予防を目指し、眼球摘出は各種放射線療法、光治療、局所切除に置き換わってきた。患者のほぼ50%が転移をきたし、転移は通常肝臓で、多くは1年以内に致死的である。
