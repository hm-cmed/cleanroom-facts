- id: RE-026
  domain: RE
  subdomain: 後部ぶどう膜炎の部位分類と鑑別の枠組み
  assertion:
    plain_statement_ja: ぶどう膜炎の解剖学的分類は、構造的合併症の有無ではなく炎症の主座によって行う。後部ぶどう膜炎は炎症の主座が網膜または脈絡膜にあるもので、限局性・多巣性・びまん性の脈絡膜炎、脈絡網膜炎、網脈絡膜炎、網膜炎、神経網膜炎を含む。これに対して炎症の主座が硝子体にあるものは中間部ぶどう膜炎、前房・硝子体・網膜または脈絡膜のすべてに炎症があり主座が定まらないものは汎ぶどう膜炎と区別する。病因の面では、病原体が直接原因となる感染性のものと、免疫介在性のものがあり、後者には全身の免疫介在性疾患に伴うものと眼に限局するものがあるため、部位分類に続いて感染性か非感染性かを分けることが鑑別の出発点になる。
    condition:
      region: 国際
      study: 国際ワークショップの合意による用語標準化
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1312
    source: Standardization of Uveitis Nomenclature (SUN) Working Group. Standardization of uveitis nomenclature for reporting clinical data. Results of the First International Workshop. Am J Ophthalmol. 2005;140(3):509-516.
    doi: 10.1016/j.ajo.2005.03.057
    pmid: '16196117'
    pmcid: PMC8935739
    url: https://doi.org/10.1016/j.ajo.2005.03.057
    source_license: CC表示を確認できず
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 解剖学的分類の内訳は出典の分類表（Table 1）から読み取った内容を含む（表から読み取り）。本出典は用語と部位分類の標準化が目的であり、後部ぶどう膜炎を来す個々の疾患の分類基準や、感染性疾患ごとの検査手順は含めていない。サルコイドーシスには触れていない（RE-019で扱い済みのため）。本カードには薬剤名を含めていない。
