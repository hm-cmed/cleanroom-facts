- id: RE-015
  domain: RE
  subdomain: 黄斑浮腫の治療
  assertion:
    plain_statement_ja: 網膜中心静脈閉塞症（半側静脈閉塞症を含む）に伴う黄斑浮腫への抗 VEGF 療法では、ベバシズマブはアフリベルセプトに対して視力の点で非劣性である。無作為化試験（SCORE2、362例）で4週ごとの硝子体内投与を6か月行ったところ、視力文字スコアの改善はベバシズマブ1.25 mg群で平均18.6文字、アフリベルセプト2.0 mg群で18.9文字であり、非劣性マージン5文字の基準を満たした。
