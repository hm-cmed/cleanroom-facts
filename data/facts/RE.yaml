- id: RE-023
  domain: RE
  subdomain: 網膜芽細胞腫
  assertion:
    plain_statement_ja: 網膜芽細胞腫は小児で最も多い眼内悪性腫瘍であり、RB1遺伝子の両アレル変異、またはMYCNがん遺伝子の増幅が引き金となる。片側性が60〜70%、両側性が30〜40%で、両側性は常に遺伝性であり片側性より早期に発症する。治療は眼球摘出と外照射から、動注・静注化学療法と経瞳孔温熱療法・冷凍凝固・レーザー光凝固等の局所療法を組み合わせた眼球温存へ移行してきた。遺伝子検査、カウンセリング、リスクのある家族のスクリーニングは管理の必須の要素である。
