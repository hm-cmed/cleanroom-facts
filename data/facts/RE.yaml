- id: RE-007
  domain: RE
  subdomain: 高血圧による眼底変化
  assertion:
    plain_statement_ja: 高血圧性網膜症は、血圧上昇に応じて生じる網膜微小血管の変化を指す。その眼底変化は40歳以上の成人にしばしばみられ、従来の危険因子とは独立に、脳卒中の発症、心不全、心血管死亡の予測因子になる。高血圧は網膜静脈・動脈閉塞症や虚血性視神経症など他の網膜血管疾患の主要な危険因子でもあり、糖尿病網膜症の発症と進行のリスクも高める。
    condition:
      region: 国際
    differential: null
    common_misconception: null
  provenance:
