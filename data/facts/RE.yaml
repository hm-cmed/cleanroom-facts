- id: RE-013
  domain: RE
  subdomain: 中心性漿液性脈絡網膜症
  assertion:
    plain_statement_ja: 中心性漿液性脈絡網膜症は、中年男性の視力を脅かす主要な疾患の一つである。病態には脈絡膜と網膜色素上皮が関わり、マルチモーダルイメージングによって多様な病像が明らかになっている。危険因子・併存症として高血圧、冠動脈疾患、心理的ストレスが知られ、ミネラルコルチコイド経路の不適切な活性化がこれらの併存症と本症を結びつける機序として提唱されており、経口のミネラルコルチコイド受容体拮抗薬の生物学的有効性が臨床的に報告されている。
    condition:
