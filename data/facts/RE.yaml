- id: RE-006
  domain: RE
  subdomain: 網膜中心動脈閉塞症
  assertion:
    plain_statement_ja: 網膜中心動脈閉塞症は急性虚血性脳卒中の一型であり、重度の視力障害を来す医学的緊急事態である。発症後は脳血管・心血管イベントの前触れでもあるため、血管危険因子の緊急の評価と治療が必要であり、現在の文献からは組織プラスミノーゲンアクチベータ静注療法が有効である可能性が示唆されている。管理の方法は実務者や施設によってばらつきが大きく、質の高い無作為化比較試験は不足している。
    condition:
      region: 米国
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1286
    source: 'Mac Grory B, Schrag M, Biousse V, et al. Management of Central Retinal Artery Occlusion: A Scientific Statement From the American Heart Association. Stroke. 2021;52(6):e282-e294.'
    doi: 10.1161/STR.0000000000000366
    pmid: '33677974'
    pmcid: null
    url: https://doi.org/10.1161/STR.0000000000000366
    source_license: CC表示を確認できず
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 本カードは米国心臓協会の科学的声明の抄録に基づく。血栓溶解療法の投与可能時間などの具体的な条件は声明本文の検討事項であり、本カードには含めていない。組織プラスミノーゲンアクチベータの網膜中心動脈閉塞症に対する国内の承認・保険適用は未確認である。眼球マッサージや前房穿刺などの従来処置の評価も声明本文の範囲で、本カードでは扱っていない。
