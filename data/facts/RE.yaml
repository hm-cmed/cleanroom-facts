- id: RE-028
  domain: RE
  subdomain: 変性近視（病的近視）のMETA-PM分類
  assertion:
    plain_statement_ja: 変性近視（病的近視）は、眼軸の過度の延長に伴って後極部に変性が生じた状態であり、近視性黄斑症の国際写真分類（META-PM分類）では萎縮の程度により5つのカテゴリーに分けられる。カテゴリー0は近視性網膜変性病変なし、カテゴリー1は豹紋状眼底のみ、カテゴリー2はびまん性脈絡網膜萎縮、カテゴリー3は限局性脈絡網膜萎縮、カテゴリー4は黄斑萎縮である。これとは別に、どのカテゴリーにも生じうるプラス病変として、ラッカークラック、近視性脈絡膜新生血管、Fuchs斑があり、いずれも中心視力の低下と強く関連する。病的近視は、近視性黄斑症がカテゴリー2以上であること、またはプラス病変があることによって定義される整理が用いられている。
    condition:
      region: 国際
      study: 国際的なメタ解析に基づく写真分類と重症度判定の提案（META-PM）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1314
    source: Ohno-Matsui K, Kawasaki R, Jonas JB, et al.; META-analysis for Pathologic Myopia (META-PM) Study Group. International photographic classification and grading system for myopic maculopathy. Am J Ophthalmol. 2015;159(5):877-883.e7.
    doi: 10.1016/j.ajo.2015.01.022
    pmid: '25634530'
    pmcid: null
    url: https://doi.org/10.1016/j.ajo.2015.01.022
    source_license: CC表示を確認できず
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: カテゴリーとプラス病変の内訳は、本分類を転載した総説の分類表から読み取った内容を含む（表から読み取り）。本論文自体は写真による黄斑症分類の提案であり、網膜分離症などの牽引性黄斑症はこの写真分類の対象外のため本カードでは扱っていない（別出典での確認が必要）。眼軸長の具体的な閾値は本分類の定義には含まれないため記載していない。本カードには薬剤名を含めていないため、国内の承認・保険適用に関する注記は不要である。
