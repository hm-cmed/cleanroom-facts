- id: RE-011
  domain: RE
  subdomain: 加齢黄斑変性の診断
  assertion:
    plain_statement_ja: 加齢黄斑変性は世界的に失明の主要な原因である。進行した加齢黄斑変性には新生血管を伴う滲出型（wet）と地図状萎縮を来す萎縮型（late dry）があり、いずれも進行性の視力障害を来す。危険因子には喫煙、栄養因子、心血管疾患のほか、補体、脂質、血管新生、細胞外基質の経路に関わる遺伝子マーカーがある。正確な診断には臨床検査に加えて、眼底写真、造影検査、光干渉断層計（OCT）を組み合わせる。
    condition:
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1290
    source: Lim LS, Mitchell P, Seddon JM, Holz FG, Wong TY. Age-related macular degeneration. Lancet. 2012;379(9827):1728-1738.
    doi: 10.1016/S0140-6736(12)60282-7
    pmid: '22559899'
    pmcid: null
    url: https://doi.org/10.1016/S0140-6736(12)60282-7
    source_license: CC表示を確認できず
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 出典の抄録には、高齢化する集団では20%を超える人が本症を有する可能性があるとの記載があるが、対象集団の定義が抄録では明確でないため本カードの数値としては採用しなかった。ドルーゼンの分類や国際分類の段階の詳細は本文の範囲であり、本カードには含めていない。
