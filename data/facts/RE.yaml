- id: RE-014
  domain: RE
  subdomain: 黄斑前線維症<黄斑前膜>
  assertion:
    plain_statement_ja: 特発性黄斑前膜は、黄斑部の網膜内表面に増殖する線維細胞性の膜である。膜の収縮が視力を脅かす主たる出来事であり、線維性の再構築による。疫学的には有病率が加齢と後部硝子体剥離に関連し、異常な後部硝子体剥離が形成のきっかけとなる重要な出来事と考えられている。臨床的には膜の肥厚としわの増加を伴う段階を経て進行する。病態は筋線維芽細胞の形成と新しいコラーゲンの沈着を伴う線維化の過程である。
    condition:
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1293
    source: Bu SC, Kuijer R, Li XR, Hooymans JM, Los LI. Idiopathic epiretinal membrane. Retina. 2014;34(12):2317-2335.
    doi: 10.1097/IAE.0000000000000349
    pmid: '25360790'
    pmcid: null
    url: https://doi.org/10.1097/IAE.0000000000000349
    source_license: CC表示を確認できず
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 出典は2014年の総説で、抄録で確認できた病態と臨床経過のみを記載した。有病率の具体的な数値、変視症などの自覚症状の頻度、硝子体手術（膜剥離）の適応基準や手術成績は抄録の範囲外であり、本カードには含めていない。二次性の黄斑前膜（糖尿病網膜症や網膜静脈閉塞症に伴うもの）は本カードの対象外である。
