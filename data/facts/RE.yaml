- id: RE-021
  domain: RE
  subdomain: 眼内炎
  assertion:
    plain_statement_ja: 眼内炎は永続的な視力喪失をきたしうる重篤な眼内感染症で、大半は外因性であり白内障手術、硝子体内注射、穿通性眼外傷の合併症として生じる。内因性は細菌や真菌の血行性播種による。ほぼ全例で視力低下を呈し、前房蓄膿と眼内炎症を伴うことが多い。診断は臨床所見が中心で硝子体・前房水培養が支えとなり、治療で最も重要なのは抗菌薬の硝子体内注射であり、一部では硝子体手術による除去が有益である。眼科緊急症として速やかな診断と治療が必要である。
    condition:
      region: グローバル
      study: 細菌性・真菌性眼内炎に関する総説
    differential: null
    common_misconception: null
  provenance:
