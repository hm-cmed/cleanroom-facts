    source: 'Campochiaro PA, Heier JS, Feiner L, et al. Ranibizumab for macular edema following branch retinal vein occlusion: six-month primary end point results of a phase III study. Ophthalmology. 2010;117(6):1102-1112.e1.'
    doi: 10.1016/j.ophtha.2010.02.021
    pmid: '20398941'
    pmcid: null
    url: https://doi.org/10.1016/j.ophtha.2010.02.021
    source_license: CC表示を確認できず
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 数値はいずれも出典の抄録で確認した6か月後の主要評価項目である。ラニビズマブの網膜静脈分枝閉塞症に伴う黄斑浮腫に対する国内の承認・保険適用は未確認である。虚血型・非虚血型の区別や無血管野へのレーザー治療の適応は本カードには含めていない。
