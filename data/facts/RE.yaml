  subdomain: サルコイドーシスの眼病変
  assertion:
    plain_statement_ja: 眼サルコイドーシスの改訂 IWOS 診断基準（2019年）は、次の4要素からなる。(1) 肉芽腫性ぶどう膜炎の他の原因を除外すること、(2) 眼サルコイドーシスを示唆する7つの眼内臨床所見、(3) 疑い例で調べる8つの全身検査所見、(4) 生検結果と眼内所見・全身検査所見の組み合わせによる3つの診断カテゴリーである。この基準は国際ワークショップの合意として、旧基準の限界を踏まえて改訂された。
    condition:
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1298
    source: Mochizuki M, Smith JR, Takase H, et al. Revised criteria of International Workshop on Ocular Sarcoidosis (IWOS) for the diagnosis of ocular sarcoidosis. Br J Ophthalmol. 2019;103(10):1418-1422.
    doi: 10.1136/bjophthalmol-2018-313356
    pmid: '30798264'
    pmcid: null
    url: https://doi.org/10.1136/bjophthalmol-2018-313356
    source_license: CC表示を確認できず
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 7つの眼内臨床所見と8つの全身検査所見の具体的な項目は基準本文の表に示される内容であり、抄録では項目数までしか確認できなかったため、本カードでは項目の内訳を含めていない。項目を転記する場合は本文の表から読み取りのうえ確認が必要である。サルコイドーシスの肺病変などの全身像は本カードの範囲外である。出題基準の表にサルコイドーシスの眼病変の項目がないため kokushi は null とした。
