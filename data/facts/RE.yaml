    doi: 10.1016/S0039-6257(97)84041-6
    pmid: '9265701'
    pmcid: null
    url: https://doi.org/10.1016/S0039-6257(97)84041-6
    source_license: CC表示を確認できず
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
