- id: RE-012
  domain: RE
  subdomain: 加齢黄斑変性の治療
  assertion:
    plain_statement_ja: 新生血管を伴う加齢黄斑変性に対するラニビズマブの硝子体内投与は、視力低下を防ぎ平均視力を改善する。シャム対照試験（MARINA、716例、中心窩下の脈絡膜新生血管）では、12か月時点で15文字未満の視力低下にとどまった割合はラニビズマブ0.3 mg群94.5%、0.5 mg群94.6%、シャム群62.2%だった。15文字以上の視力改善は0.3 mg群24.8%、0.5 mg群33.8%、シャム群5.0%だった。24か月間で、注射に伴う眼内炎は1.0%、重篤なぶどう膜炎は1.3%に認められた。
    condition:
      region: 国際
      study: 無作為化比較試験（MARINA）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1291
    source: Rosenfeld PJ, Brown DM, Heier JS, et al. Ranibizumab for neovascular age-related macular degeneration. N Engl J Med. 2006;355(14):1419-1431.
    doi: 10.1056/NEJMoa054481
    pmid: '17021318'
    pmcid: null
    url: https://doi.org/10.1056/NEJMoa054481
    source_license: © 2006 Massachusetts Medical Society（CC表示なし）
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 数値はいずれも出典の抄録で確認した。対象は minimally classic 型または occult 型の脈絡膜新生血管であり、classic 型主体の病変への結果は別の試験の範囲である。ラニビズマブ以外の抗 VEGF 薬や現在の投与プロトコル（treat-and-extend 等）は本カードには含めていない。ラニビズマブの加齢黄斑変性に対する国内の承認・保険適用は未確認である。
