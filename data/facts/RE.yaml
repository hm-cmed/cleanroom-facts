- id: RE-017
  domain: RE
  subdomain: 網膜色素変性
  assertion:
    plain_statement_ja: 網膜色素変性は視細胞の喪失による遺伝性の網膜ジストロフィーで、眼底に色素沈着を認める。非症候性の網膜色素変性の頻度はおよそ4,000人に1人である。最も多い桿体・錐体ジストロフィー型では、最初の症状は夜盲であり、次いで明所での周辺視野が徐々に狭窄し、数十年を経て失明に至ることがある。診断は夜盲と周辺視野欠損、眼底所見、網膜電図の低電位、所見の進行に基づいて行われる。出典の時点では、病気の進行を止めたり視力を回復させたりする治療はなく、治療は日光防御などによる進行の遅延と、白内障・黄斑浮腫などの合併症の治療に限られていた。
    condition:
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1296
    source: Hamel C. Retinitis pigmentosa. Orphanet J Rare Dis. 2006;1:40.
    doi: 10.1186/1750-1172-1-40
    pmid: '17032466'
    pmcid: PMC1621055
    url: https://doi.org/10.1186/1750-1172-1-40
    source_license: CC BY 2.0
    legal_basis: B
    source_class: OPEN
    corroboration: null
  uncertainty: 出典は2006年の総説であり、頻度（約4,000人に1人）と原因遺伝子数（当時45遺伝子・遺伝子座）は当時の値である。2006年以降に登場した遺伝子治療などの新しい治療の国内承認・保険適用は本カードでは未確認であり、治療に関する記述は出典の時点のものとして読む必要がある。出題基準の表に網膜色素変性の項目がないため kokushi は null とした。
