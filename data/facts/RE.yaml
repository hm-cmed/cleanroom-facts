- id: RE-010
  domain: RE
  subdomain: 網膜剥離の治療
  assertion:
    plain_statement_ja: 裂孔原性網膜剥離の手術には硝子体手術（経毛様体扁平部硝子体切除）と強膜内陥術があり、現在の術式では解剖学的・視機能的に高い成功率が得られる。硝子体手術は特に偽水晶体眼の網膜剥離に対する第一の治療として有効性が示されている。黄斑がまだ剥離していない網膜剥離では、短期間の手術待機が必ずしも不利にならない場合がある。
    condition:
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1289
    source: Schwartz SG, Flynn HW Jr, Mieler WF. Update on retinal detachment surgery. Curr Opin Ophthalmol. 2013;24(3):255-261.
    doi: 10.1097/ICU.0b013e32835f8e6b
    pmid: '23429600'
    pmcid: null
    url: https://doi.org/10.1097/ICU.0b013e32835f8e6b
    source_license: CC表示を確認できず
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 出典は2013年の総説で、抄録で確認できた範囲のみを記載した。気体網膜復位術（pneumatic retinopexy）の適応や、タンポナーデ物質の選択、黄斑剥離の有無による手術緊急度の具体的な基準は抄録の範囲外であり、本カードには含めていない。
