- id: RE-003
  domain: RE
  subdomain: 糖尿病黄斑浮腫
  assertion:
    plain_statement_ja: 中心窩に及ぶ糖尿病黄斑浮腫に対する硝子体内抗 VEGF 療法の無作為化比較試験（Protocol T、660例）では、1年後の視力改善はアフリベルセプト群で平均13.3文字、ベバシズマブ群で9.7文字、ラニビズマブ群で11.2文字だった。全体ではアフリベルセプトが優れたが、この差は主に試験開始時の視力が悪い（文字スコア69未満、約20/50以下）群で生じており、その群では改善がアフリベルセプト18.9文字、ラニビズマブ14.2文字、ベバシズマブ11.8文字だった。開始時視力の低下が軽い群では3剤間に明らかな差はなかった。重篤な有害事象の頻度に群間の有意差はなかった。
    condition:
      region: 国際
      study: 無作為化比較試験（DRCR.net Protocol T）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1283
    source: Diabetic Retinopathy Clinical Research Network; Wells JA, Glassman AR, Ayala AR, et al. Aflibercept, bevacizumab, or ranibizumab for diabetic macular edema. N Engl J Med. 2015;372(13):1193-1203.
    doi: 10.1056/NEJMoa1414264
    pmid: '25692915'
    pmcid: PMC4422053
    url: https://doi.org/10.1056/NEJMoa1414264
    source_license: © 2015 Massachusetts Medical Society（CC表示なし）
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 数値はいずれも出典の抄録で確認した1年後の結果である。用量はアフリベルセプト2.0 mg、ベバシズマブ1.25 mg、ラニビズマブ0.3 mg（米国の試験用量）であり、国内の承認用量とは限らない。各薬剤の糖尿病黄斑浮腫に対する国内の承認・保険適用は未確認である（ベバシズマブの硝子体内投与は出典の試験でも適応外使用の位置づけ）。
