    source: Durand ML. Bacterial and Fungal Endophthalmitis. Clin Microbiol Rev. 2017;30(3):597-613.
    doi: 10.1128/CMR.00113-16
    pmid: '28356323'
    pmcid: PMC5475221
    url: https://doi.org/10.1128/CMR.00113-16
    source_license: ライセンス表示を確認できず（出版社ライセンスはTDM用のみ）
    legal_basis: B
