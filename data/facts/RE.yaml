- id: RE-016
  domain: RE
  subdomain: 未熟児網膜症
  assertion:
    plain_statement_ja: 未熟児網膜症は未熟な網膜組織に起こる病理過程であり、牽引性網膜剥離へ進行して視力障害や失明を来し得る。重症の未熟児網膜症に対しては不良な視力転帰を大きく減らす治療が30年以上前から存在するが、治療を要する重症例を破壊的な変化が起こる前に診断する必要がある。そのため、リスクのある早産児には適切な時期と間隔で繰り返し眼底検査を行い、変化を順序立てて追うスクリーニング体制が求められる。
