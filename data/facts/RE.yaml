    pmid: '26026923'
    pmcid: null
    url: https://doi.org/10.1016/j.preteyeres.2015.05.003
    source_license: CC BY-NC-ND
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 出典は2015年の総説で、抄録で確認できた範囲のみを記載した。自然経過での回復率や、光線力学療法・レーザー治療の適応、慢性型の定義などの具体的な数値・基準は抄録の範囲外であり、本カードには含めていない。ミネラルコルチコイド受容体拮抗薬の本症に対する国内の承認・保険適用は未確認である。
