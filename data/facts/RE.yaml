- id: RE-027
  domain: RE
  subdomain: Vogt-小柳-原田病の眼病変と分類基準
  assertion:
    plain_statement_ja: Vogt-小柳-原田病の眼病変は両側性の脈絡膜炎を基盤とし、早期には多発性の漿液性（滲出性）網膜剥離が特徴で、蛍光眼底造影では多数の点状漏出と色素の貯留がみられ、ときに胞状の剥離となる。早期の分類基準は、特徴的な所見を伴う滲出性網膜剥離があること、または汎ぶどう膜炎に5つの神経症状・所見のうち2つ以上を伴うことのいずれかと、発症前に穿孔性眼外傷や硝子体網膜手術の既往がないことからなる。発症から数か月後の晩期には夕焼け状眼底が現れ、乳頭周囲萎縮や末梢の脱色素性の萎縮病変を伴い、合併症として脈絡膜新生血管と網膜下線維化が生じうる。晩期の分類基準は、早期病変の既往に加えて夕焼け状眼底があること、またはぶどう膜炎に皮膚所見のうち1つ以上を伴うことである。
    condition:
      region: 国際
      study: 汎ぶどう膜炎1,012例（早期156例・晩期103例を含む）での機械学習による分類基準作成
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1313
    source: Standardization of Uveitis Nomenclature (SUN) Working Group. Classification criteria for Vogt-Koyanagi-Harada disease. Am J Ophthalmol. 2021;228:205-211.
    doi: 10.1016/j.ajo.2021.03.036
    pmid: '33845018'
    pmcid: PMC9073858
    url: https://doi.org/10.1016/j.ajo.2021.03.036
    source_license: CC表示を確認できず
    legal_basis: B
