- id: CT-021
  domain: CT
  subdomain: 若年性特発性関節炎<JIA>
  assertion:
    plain_statement_ja: 全身型若年性特発性関節炎に伴うマクロファージ活性化症候群の治療は、高用量の糖質コルチコイド、IL-1 阻害薬、シクロスポリン、およびインターフェロンγ阻害薬に基づくべきであるとされる（EULAR/PReS の Still 病推奨、2024）。これは全身型若年性特発性関節炎と成人発症 Still 病を同一疾患として扱う推奨における位置づけである。
    condition:
      region: 国際
      対象: 全身型若年性特発性関節炎にマクロファージ活性化症候群を伴う患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2905
    source: Fautrel B, Mitrovic S, De Matteis A, et al. EULAR/PReS recommendations for the diagnosis and management of Still's disease, comprising systemic juvenile idiopathic arthritis and adult-onset Still's disease. Ann Rheum Dis. 2024;83(12):1614-1627
    doi: 10.1136/ard-2024-225851
    pmid: '39317417'
    pmcid: PMC11672000
    url: https://doi.org/10.1136/ard-2024-225851
    source_license: CC BY-NC-ND（抄録末尾の権利表示で確認）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ61 2026-11-14）：Baldo F, Erkens RGA, Mizuta M, et al. Current treatment in macrophage activation syndrome worldwide: a systematic literature review to inform the METAPHOR project. Rheumatology. 2025;64(1):32-44（PMID: 39058514、DOI: 10.1093/rheumatology/keae391、PMCID: PMC11701305、https://pmc.ncbi.nlm.nih.gov/articles/PMC11701305/）。裏づける部分：候補（METAPHOR プロジェクトのための世界規模の系統的レビュー、CC BY）で、全身型若年性特発性関節炎に伴うマクロファージ活性化症候群の治療として、高用量の糖質コルチコイド（パルス療法が研究の約6割）、シクロスポリン、IL-1 阻害薬（アナキンラ、179例）、インターフェロンγ阻害薬（エマパルマブ、全身型若年性特発性関節炎の試験）が実際に用いられていることが整理されており、カードの4つの治療要素がすべて含まれていることを確認。数値の照合：数値なし（治療要素のカード）。留保：候補は実臨床の治療実態の整理であり、EULAR/PReS 推奨の文言そのものの再掲ではない。主出典 SRC-2905 は CC BY-NC-ND で現行 RESTRICTED が正しい'
  uncertainty: 登録時の決定により、若年性特発性関節炎に伴うマクロファージ活性化症候群の全身管理は CT の範囲とし、血球貪食性リンパ組織球症の本体は第39回（LY）で作成済みのため作り直していない。IL-1 阻害薬のカナキヌマブは全身型若年性特発性関節炎の適応で国内承認・保険適用がある。インターフェロンγ阻害薬（エマパルマブ）の国内適応は原発性血球貪食性リンパ組織球症の側にあり、マクロファージ活性化症候群への適応は未確認。内容は抄録で確認した。
