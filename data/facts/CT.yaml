- id: CT-020
  domain: CT
  subdomain: 若年性特発性関節炎<JIA>
  assertion:
    plain_statement_ja: 若年性特発性関節炎の ILAR 分類（2001年 Edmonton の第2改訂）は、16歳未満で発症し6週間以上持続する原因不明の関節炎を、全身型、少関節炎型、リウマトイド因子陰性多関節炎型、リウマトイド因子陽性多関節炎型、乾癬性関節炎型、付着部炎関連関節炎型、分類不能関節炎型の7つのカテゴリーに分類する。
    condition:
      region: 国際
      対象: 小児（16歳未満発症）
    differential: null
    common_misconception: null
  provenance:
