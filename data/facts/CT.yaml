- id: CT-019
  domain: CT
  subdomain: 抗リン脂質抗体症候群
  assertion:
    plain_statement_ja: 抗リン脂質抗体症候群の管理に関する EULAR 推奨（2019）は、高リスクの抗リン脂質抗体プロファイル（ループスアンチコアグラント陽性、二重陽性・三重陽性、持続的な高力価）を持つ無症候性の抗体保有者、血栓性・産科の既往のない全身性エリテマトーデスの患者、および産科抗リン脂質抗体症候群のみの非妊娠女性に、低用量アスピリンを推奨する。あわせて心血管・静脈血栓のリスク因子のスクリーニングと管理を行うとされる。
    condition:
      region: 欧州
      対象: 抗リン脂質抗体陽性の患者（無症候性保有者・全身性エリテマトーデスの患者を含む）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2666
    source: Tektonidou MG, Andreoli L, Limper M, et al. EULAR recommendations for the management of antiphospholipid syndrome in adults. Ann Rheum Dis. 2019;78(10):1296-1304
    doi: 10.1136/annrheumdis-2019-215213
    pmid: '31092409'
    pmcid: PMC11034817
    url: https://doi.org/10.1136/annrheumdis-2019-215213
    source_license: BMJ（CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 第40回で登録済みの出典（SRC-2666）を再利用した。血栓性抗リン脂質抗体症候群の治療（ビタミンK拮抗薬など）は第40回 HS-035 で作成済みであり、本カードは無症候性保有者と全身性エリテマトーデスの患者における一次予防の側面に限る。低用量アスピリンは国内で承認・保険適用のある抗血小板薬である。内容は抄録と PMC 全文で確認した。
