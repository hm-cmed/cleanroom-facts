- id: CT-002
  domain: CT
  subdomain: 関節リウマチ
  assertion:
    plain_statement_ja: 関節リウマチに伴う間質性肺疾患の統合有病率は、観察研究56件（関節リウマチ関連間質性肺疾患 11,851例）を統合したメタ解析で 18.7%（95%信頼区間 15.8〜21.6）と推計され、危険因子として男性、高齢、喫煙歴、リウマトイド因子陽性、抗CCP抗体陽性、中〜高疾患活動性などが挙げられた。
    condition:
      region: 国際
      対象: 関節リウマチ患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2902
    source: 'Wang HF, Wang YY, Li ZY, et al. The prevalence and risk factors of rheumatoid arthritis-associated interstitial lung disease: a systematic review and meta-analysis. Ann Med. 2024;56(1):2332406'
    doi: 10.1080/07853890.2024.2332406
    pmid: '38547537'
    pmcid: PMC10984230
    url: https://doi.org/10.1080/07853890.2024.2332406
    source_license: CC BY-NC 4.0（Crossref の license 欄で確認）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ61 2026-11-14）：Gono T. Prevalence and screening of interstitial lung disease in rheumatoid arthritis. Rheumatol Adv Pract. 2026;10(3):rkag062（PMID: 42325419、DOI: 10.1093/rap/rkag062、PMCID: PMC13275310、https://pmc.ncbi.nlm.nih.gov/articles/PMC13275310/）。裏づける部分：候補（CC BY の解説）が引用する別の系統的レビュー・メタ解析（74研究）で、関節リウマチ関連間質性肺疾患の統合有病率が推計されていること、危険因子として男性、高齢（発症時高齢）、喫煙、高力価のリウマトイド因子・抗CCP抗体、高疾患活動性が挙げられることを確認。カードの危険因子の顔ぶれと一致する。数値の照合：候補の統合有病率は 20.6%（95%信頼区間 18.3〜23.2、74研究）で、カードの 18.7%（同 15.8〜21.6、56研究）とは研究集合が異なる別のメタ解析の値であり、同一の値としては一致しない。留保：主出典 SRC-2902 は CC BY-NC で現行 RESTRICTED が正しい'
  uncertainty: メタ解析の異質性は I²=96.4% と大きく、研究間の診断基準のばらつきが背景にある。数値は抄録で確認した。間質性肺疾患そのものの診断・治療の詳細は呼吸器側が正で、本カードは関節リウマチの関節外病変としての頻度と危険因子に限る。
