- id: CT-006
  domain: CT
  subdomain: 成人Still病
  assertion:
    plain_statement_ja: EULAR/PReS 推奨（2024）は、全身型若年性特発性関節炎と成人発症 Still 病は同一疾患であり単一の名称「Still 病」とすべきとし、治療目標を臨床的不活動性疾患と、その6か月以上の維持である寛解に置く。最適な治療戦略は、IL-1 阻害薬または IL-6 阻害薬の早期使用と短期間の糖質コルチコイド併用に基づくとされる。
    condition:
      region: 国際
      対象: Still病（全身型若年性特発性関節炎・成人発症Still病）の患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2905
    source: Fautrel B, Mitrovic S, De Matteis A, et al. EULAR/PReS recommendations for the diagnosis and management of Still's disease, comprising systemic juvenile idiopathic arthritis and adult-onset Still's disease. Ann Rheum Dis. 2024;83(12):1614-1627
    doi: 10.1136/ard-2024-225851
    pmid: '39317417'
    pmcid: PMC11672000
    url: https://doi.org/10.1136/ard-2024-225851
    source_license: CC BY-NC-ND（抄録末尾の権利表示で確認）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ61 2026-11-14）：Ruscitti P, Iacono D, Riccio F, et al. Real-world therapeutic strategies in active adult-onset Still''s disease: clinical insights from the GIRRCS-AOSD study group. Front Immunol. 2026;17:1852661（PMID: 42620353、DOI: 10.3389/fimmu.2026.1852661、PMCID: PMC13485721、https://pmc.ncbi.nlm.nih.gov/articles/PMC13485721/）。裏づける部分：候補の表に EULAR/PReS 推奨の主要項目が再掲され、治療目標の達成・維持のために IL-1 阻害薬と IL-6 阻害薬の使用を優先し、糖質コルチコイドは大幅に制限するか回避すること、生物学的製剤の早期投与が推奨の方向であることを確認。数値の照合：数値なし。留保：全身型若年性特発性関節炎と成人発症 Still 病を単一名称「Still 病」とする点と、寛解（臨床的不活動性疾患の6か月以上の維持）の定義は候補では未確認。主出典 SRC-2905 は CC BY-NC-ND で現行 RESTRICTED が正しい'
  uncertainty: トシリズマブは2019年に、IL-1 阻害薬のカナキヌマブは2025年3月に、いずれも「既存治療で効果不十分な成人発症スチル病（成人Still病）」の適応で国内承認・保険適用を取得したことを確認した。アナキンラの国内承認は未確認。内容は抄録で確認した。　【承認状況の再点検 2026-10-31（作り手、PMDA・厚生労働省などの公的情報）】キネレット皮下注100mgシリンジ（アナキンラ）が2026-06-19に全身型若年性特発性関節炎・成人発症スチル病の効能で承認され、2026-08-13薬価収載（23,702円/筒）、2026-08-20発売。「国内承認は未確認」の状態は解消し、承認済みとなった（PMDA医薬品情報、厚労省新医薬品一覧2026-08-13、Sobi Japan発表）。
