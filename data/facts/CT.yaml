- id: CT-004
  domain: CT
  subdomain: 悪性関節リウマチ
  assertion:
    plain_statement_ja: 悪性関節リウマチは、既存の関節リウマチに血管炎をはじめとする関節外症状を認め、難治性もしくは重症な臨床病態を伴うものをいい、指定難病46である。診断は、2010年 ACR/EULAR 関節リウマチ分類基準を満たすことを前提に、多発性神経炎・皮膚潰瘍・間質性肺炎などの臨床症状10項目のうち3項目以上を満たす場合、または臨床症状1項目以上に加えて生検で小ないし中動脈の壊死性血管炎などの組織所見を認める場合に行う。
