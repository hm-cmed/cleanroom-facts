- id: CT-021
  domain: CT
  subdomain: 若年性特発性関節炎<JIA>
  assertion:
    plain_statement_ja: 全身型若年性特発性関節炎に伴うマクロファージ活性化症候群の治療は、高用量の糖質コルチコイド、IL-1 阻害薬、シクロスポリン、およびインターフェロンγ阻害薬に基づくべきであるとされる（EULAR/PReS の Still 病推奨、2024）。これは全身型若年性特発性関節炎と成人発症 Still 病を同一疾患として扱う推奨における位置づけである。
    condition:
      region: 国際
      対象: 全身型若年性特発性関節炎にマクロファージ活性化症候群を伴う患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2905
    source: Fautrel B, Mitrovic S, De Matteis A, et al. EULAR/PReS recommendations for the diagnosis and management of Still's disease, comprising systemic juvenile idiopathic arthritis and adult-onset Still's disease. Ann Rheum Dis. 2024;83(12):1614-1627
    doi: 10.1136/ard-2024-225851
    pmid: '39317417'
    pmcid: PMC11672000
    url: https://doi.org/10.1136/ard-2024-225851
    source_license: CC BY-NC-ND（抄録末尾の権利表示で確認）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 登録時の決定により、若年性特発性関節炎に伴うマクロファージ活性化症候群の全身管理は CT の範囲とし、血球貪食性リンパ組織球症の本体は第39回（LY）で作成済みのため作り直していない。IL-1 阻害薬のカナキヌマブは全身型若年性特発性関節炎の適応で国内承認・保険適用がある。インターフェロンγ阻害薬（エマパルマブ）の国内適応は原発性血球貪食性リンパ組織球症の側にあり、マクロファージ活性化症候群への適応は未確認。内容は抄録で確認した。
