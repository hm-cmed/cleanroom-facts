- id: CT-002
  domain: CT
  subdomain: 関節リウマチ
  assertion:
    plain_statement_ja: 関節リウマチに伴う間質性肺疾患の統合有病率は、観察研究56件（関節リウマチ関連間質性肺疾患 11,851例）を統合したメタ解析で 18.7%（95%信頼区間 15.8〜21.6）と推計され、危険因子として男性、高齢、喫煙歴、リウマトイド因子陽性、抗CCP抗体陽性、中〜高疾患活動性などが挙げられた。
