- id: CT-001
  domain: CT
  subdomain: 関節リウマチ
  assertion:
    plain_statement_ja: 関節リウマチの薬物治療について、EULAR 推奨の 2025 update は全体原則5項目と推奨9件からなり、初期治療はメトトレキサート（理想的には短期間の糖質コルチコイド併用）とし、3〜6か月で効果が不十分なら生物学的製剤を追加する。JAK 阻害薬は主要心血管イベント・悪性腫瘍・血栓塞栓イベントのリスクを慎重に考慮したうえで選択しうるものとし、持続的寛解後は DMARD の漸減は可能だが中止は再燃を招くことが多いとする。
    condition:
      region: 欧州
      対象: 成人関節リウマチ患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2901
    source: 'Smolen JS, Edwards CJ, Konzett V, et al. EULAR recommendations for the management of rheumatoid arthritis with synthetic and biologic disease-modifying antirheumatic drugs: 2025 update. Ann Rheum Dis. 2026;85(6):991-1009'
    doi: 10.1016/j.ard.2026.01.023
    pmid: '41826212'
    pmcid: null
    url: https://doi.org/10.1016/j.ard.2026.01.023
    source_license: CC BY-NC-ND 4.0（Crossref の license 欄で確認）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 欧州の推奨であり、国内の治療の土台は日本リウマチ学会ガイドライン2024年改訂（SRC-1847）。メトトレキサート、生物学的製剤、JAK 阻害薬はいずれも関節リウマチの適応で国内承認・保険適用がある。推奨に列挙される薬剤のうちリツキシマブの関節リウマチに対する国内適応は本パートでは未確認。2022 update（SRC-1848）は本出典に置き換わった。数値・件数は抄録で確認した。
