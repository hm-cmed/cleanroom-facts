- id: CT-004
  domain: CT
  subdomain: 悪性関節リウマチ
  assertion:
    plain_statement_ja: 悪性関節リウマチは、既存の関節リウマチに血管炎をはじめとする関節外症状を認め、難治性もしくは重症な臨床病態を伴うものをいい、指定難病46である。診断は、2010年 ACR/EULAR 関節リウマチ分類基準を満たすことを前提に、多発性神経炎・皮膚潰瘍・間質性肺炎などの臨床症状10項目のうち3項目以上を満たす場合、または臨床症状1項目以上に加えて生検で小ないし中動脈の壊死性血管炎などの組織所見を認める場合に行う。
    condition:
      region: 日本
      対象: 関節リウマチ患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2903
    source: 厚生労働省. 指定難病 46 悪性関節リウマチ（概要・診断基準等）. 情報提供元：難治性血管炎に関する調査研究班
    doi: null
    pmid: null
    pmcid: null
    url: null
    source_license: 政府標準利用規約（厚生労働省の公的資料）
    legal_basis: B
    source_class: GOV_JP
    corroboration: null
  uncertainty: 厚生労働省の指定難病文書の全文で確認した。前提となる関節リウマチ分類基準の配点そのものは第31回 OS-001 が正である。関節外病変のうち腎病変の側面は GN が正で、補助出典として SRC-601（登録済み）がある。
  curriculum:
