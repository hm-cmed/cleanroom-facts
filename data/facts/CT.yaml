  assertion:
    plain_statement_ja: 全身性強皮症の 2013 ACR/EULAR 分類基準では、中手指節関節より近位まで及ぶ手指の皮膚硬化があれば、それだけで全身性強皮症に分類できる。それがない場合は、手指の皮膚硬化、指尖部病変、毛細血管拡張、爪郭毛細血管異常、間質性肺疾患または肺動脈性肺高血圧症、Raynaud 現象、全身性強皮症関連自己抗体の7項目に重みを付けて加算し、合計9以上で分類する。検証での感度は 0.91、特異度は 0.92 で、1980年 ACR 基準の 0.75、0.72 を上回った。
