    doi: null
    pmid: '14760812'
    pmcid: null
    url: null
    source_license: J Rheumatol（CC表示を確認できず）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ61 2026-11-14）：Compeyrot-Lacassagne S, Beesley RP, Bray L, et al.; British Society for Rheumatology Guideline Steering Group. Holistic management of juvenile idiopathic arthritis across all ages: British Society for Rheumatology Guideline scope. Rheumatol Adv Pract. 2026;10(2):rkag052 補助：Rygg M, Ramos FO, Nordal EB. What have we learned from long-term studies in juvenile idiopathic arthritis? - Prediction, classification, transition. Pediatr Rheumatol. 2025;23(1):18（PMID: 39972461、DOI: 10.1186/s12969-025-01070-x、PMCID: PMC11841258）（PMID: 42256795、DOI: 10.1093/rap/rkag052、PMCID: PMC13235788、https://pmc.ncbi.nlm.nih.gov/articles/PMC13235788/）。裏づける部分：主候補で、ILAR 分類が7つのカテゴリー（全身型、少関節炎型（持続型・進展型）、リウマトイド因子陰性多関節炎型、リウマトイド因子陽性多関節炎型、乾癬性関節炎型、付着部炎関連関節炎型、分類不能関節炎型）からなることが実名で列挙されていることを確認。補助候補でも ILAR 分類が7カテゴリーに分けることが明記されている。数値の照合：数値なし（分類構成のカード）。留保：16歳未満発症・6週間以上持続という定義の部分は両候補では再掲されていない。主出典 SRC-2916 の区分訂正は別枠の節に分離した'
