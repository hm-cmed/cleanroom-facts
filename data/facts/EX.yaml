- id: EX-007
  domain: EX
  subdomain: 甲状腺クリーゼの初期対応
  assertion:
    plain_statement_ja: 甲状腺クリーゼは臨床像で判断し、集中治療のもとで複数の方向から同時に治療する。柱は、抗甲状腺薬で新しいホルモンの合成を止めること（プロピルチオウラシルは負荷量500〜1000 mg の後に250 mg を4時間ごと、またはメチマゾール60〜80 mg/日）、β遮断で末梢の作用を抑えること、ヨウ素でホルモンの放出を止めること（抗甲状腺薬を開始して1時間以上たってから使う）、ヒドロコルチゾン（300 mg を静脈負荷し、その後100 mg を8時間ごと）で相対的な副腎不全に備え T4 から T3 への変換を抑えること、そして発熱や心不全などの全身管理と、感染症などの引き金の治療である。用量は米国甲状腺学会ガイドライン（2016年）の甲状腺クリーゼの薬剤表による。
    condition:
      region: 米国
      study: 甲状腺中毒症の診断と管理のガイドライン（米国甲状腺学会、2016年）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-902
    source: Ross DS, Burch HB, Cooper DS, Greenlee MC, Laurberg P, Maia AL, Rivkees SA, Samuels M, Sosa JA, Stan MN, Walter MA. 2016 American Thyroid Association Guidelines for Diagnosis and Management of Hyperthyroidism and Other Causes of Thyrotoxicosis. Thyroid. 2016;26(10):1343-1421.
    doi: 10.1089/thy.2016.0229
    pmid: '27521067'
    pmcid: null
    url: https://doi.org/10.1089/thy.2016.0229
    source_license: CC BY 4.0 (https://creativecommons.org/licenses/by/4.0/)
    legal_basis: B
    source_class: OPEN
    corroboration: null
  uncertainty: 薬の注記：プロピルチオウラシル、メチマゾール（チアマゾール）、ヨウ化カリウム、ヒドロコルチゾン、β遮断薬の国内承認・保険適用は、本カードでは個別の添付文書で確認していない（未確認）。用量はガイドラインの表から読み取った値で、日本の甲状腺クリーゼ診療指針の用量とは異なる場合がある。
