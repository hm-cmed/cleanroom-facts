- id: EX-003
  domain: EX
  subdomain: 体重減少の評価（内分泌の視点）
  assertion:
    plain_statement_ja: 意図しない体重減少の評価では、甲状腺機能検査を基本検査に含め、甲状腺中毒症、糖尿病、副腎不全といった内分泌の原因を落とさないことが大切である。高齢者では非悪性の原因が悪性より多い一方、悪性腫瘍が最大で約3分の1を占め、原因がはっきりしない例も6〜28%あるとされる。内分泌の視点では、食欲があるのにやせる場合は甲状腺機能亢進や糖尿病を、食欲低下と倦怠感、起立性の症状を伴う場合は副腎不全を考える。
    condition:
      region: 米国
      study: 65歳超の意図しない体重減少を対象とした総説（2021年）
    differential: null
    common_misconception: null
  provenance:
