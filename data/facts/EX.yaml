- id: EX-008
  domain: EX
  subdomain: 粘液水腫性昏睡の初期対応
  assertion:
    plain_statement_ja: 粘液水腫性昏睡（粘液水腫クリーゼ）は、重い甲状腺機能低下が破綻した生命に関わる状態で、感染症と甲状腺ホルモン補充の中断が主な引き金である。意識障害、低体温、低血圧、呼吸抑制などを手がかりに臨床的に疑い、集中治療の場で甲状腺ホルモンの補充をできるだけ早く始める。あわせて、血圧と輸液の管理、副腎不全に備えたステロイドの補充、低体温や呼吸の支持、引き金になった病態の治療を行う。来院時の低血圧や徐脈、人工呼吸の必要性、回復しない低体温、敗血症などは死亡の予測因子とされる。
    condition:
