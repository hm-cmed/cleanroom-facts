- id: EX-010
  domain: EX
  subdomain: 重症低血糖の初期対応
  assertion:
    plain_statement_ja: 重症低血糖は、回復に他者の助けが要る低血糖を指す。意識があって飲み込める場合は速効性の糖質で対応し、飲み込めない、または院外で静脈が確保できない場合はグルカゴンを投与する。低血糖リスクの高い糖尿病患者への診療ガイドライン（Endocrine Society、2023年）では、重症の院外低血糖に使うグルカゴン製剤について、使う前に溶かす操作が要らない製剤を、再構成が必要な製剤より優先することが強く勧められている。初期対応の後は、原因になった薬剤や治療計画を見直し、再発予防と教育につなげる。
    condition:
      region: 国際
      study: 低血糖リスクの高い糖尿病患者の管理の診療ガイドライン（Endocrine Society、2023年）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1055
    source: 'McCall AL, Lieb DC, Gianchandani R, MacMaster H, Maynard GA, Murad MH, Seaquist E, Wolfsdorf JI, Wright RF, Wiercioch W. Management of Individuals With Diabetes at High Risk for Hypoglycemia: An Endocrine Society Clinical Practice Guideline. J Clin Endocrinol Metab. 2023;108(3):529-562'
    doi: 10.1210/clinem/dgac596
    pmid: '36477488'
    pmcid: null
    url: https://doi.org/10.1210/clinem/dgac596
    source_license: © The Endocrine Society
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 薬の注記：グルカゴン製剤（注射用・点鼻）やブドウ糖注射液の国内承認・保険適用と、製剤ごとの国内での発売状況は、本カードでは個別の添付文書で確認していない（未確認）。静脈内ブドウ糖の具体的な投与量は出典の抄録で確認できなかったため書いていない。
