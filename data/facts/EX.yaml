- id: EX-004
  domain: EX
  subdomain: 体重増加の評価（内分泌の視点）
  assertion:
    plain_statement_ja: 体重増加の評価では、まず薬剤性（糖質コルチコイドなど）と生活習慣を確認し、内分泌の原因は手がかりのある場合に絞って調べる。甲状腺機能低下症による体重増加は軽度で、主にはむくみの分とされる。逆に、肥満そのものが原因で TSH が軽く上がることも多く、TSH の軽度上昇だけで甲状腺機能低下症を体重増加の原因と決めない。クッシング症候群は、中心性肥満や高血圧のような非特異的な所見ではなく、あざができやすい、顔の紅潮、近位筋力低下、赤紫色の皮膚線条といった特異的な所見があるときに疑う。
    condition:
      region: 国際
      study: 成人の肥満の背景原因を探す診断アプローチの総説（2019年）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1049
    source: van der Valk ES, van den Akker ELT, Savas M, Kleinendorst L, Visser JA, Van Haelst MM, Sharma AM, van Rossum EFC. A comprehensive diagnostic approach to detect underlying causes of obesity in adults. Obes Rev. 2019;20(6):795-804
    doi: 10.1111/obr.12836
    pmid: '30821060'
    pmcid: PMC6850662
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC6850662/
    source_license: ライセンス表示を確認できず
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（CC BY 4.0（OPEN）、作り手の調査バッチ84 2026-11-15）：Martino MC, Canu L, Bonaventura I, Vitiello C, Sparano C, Cozzolino A. Hypertension and Cushing''s syndrome: hunt for the red flag. J Endocrinol Invest. 2025;48(8):1909-1918（PMID: 40100572、DOI: 10.1007/s40618-024-02453-9、PMCID: PMC12313784、https://creativecommons.org/licenses/by/4.0/）。裏づける部分：部分：クッシング症候群を疑う根拠となる特異的な所見として、あざができやすいこと（easy bruising）、顔の紅潮（facial plethora）、近位筋障害・近位筋力低下、幅の広い赤紫色の皮膚線条（wide violaceous striae）を挙げることを再掲する。数値の照合：数値の主張なし。留保：薬剤性と生活習慣を先に確認する順序、甲状腺機能低下症による体重増加は軽度で主としてむくみの分であること、肥満そのもので TSH が軽く上がることは再掲なし。主出典は刊行版が CC BY-NC-ND 4.0（Crossref の刊行版データと PMC 全文のライセンス表示で確認）であり自由ではない。マスターの license_note「ライセンス表示を確認できず」は実態と異なるため、あわせて注記の更新を提案する。RESTRICTED への訂正対象（D）'
  uncertainty: 本文は PMC で公開されているが、CC ライセンスの表示を本文中で確認できなかったため source_class は UNKNOWN とした。対象は成人で、小児の二次性肥満の評価とは異なる。 本カードに名前の出る薬剤（糖質コルチコイド等）の国内の承認・保険適用は未確認。　【承認状況の再点検 2026-10-31（作り手、PMDA・厚生労働省などの公的情報）】糖質コルチコイドは長期に承認されている医療用医薬品であり、「承認・保険適用は未確認」は解消できる
