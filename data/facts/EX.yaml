- id: EX-004
  domain: EX
  subdomain: 体重増加の評価（内分泌の視点）
  assertion:
    plain_statement_ja: 体重増加の評価では、まず薬剤性（糖質コルチコイドなど）と生活習慣を確認し、内分泌の原因は手がかりのある場合に絞って調べる。甲状腺機能低下症による体重増加は軽度で、主にはむくみの分とされる。逆に、肥満そのものが原因で TSH が軽く上がることも多く、TSH の軽度上昇だけで甲状腺機能低下症を体重増加の原因と決めない。クッシング症候群は、中心性肥満や高血圧のような非特異的な所見ではなく、あざができやすい、顔の紅潮、近位筋力低下、赤紫色の皮膚線条といった特異的な所見があるときに疑う。
    condition:
      region: 国際
      study: 成人の肥満の背景原因を探す診断アプローチの総説（2019年）
    differential: null
    common_misconception: null
  provenance:
