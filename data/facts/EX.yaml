- id: EX-009
  domain: EX
  subdomain: 高カルシウム血症クリーゼの初期対応
  assertion:
    plain_statement_ja: 高カルシウム血症クリーゼは、著しい高カルシウム血症に急性の悪化が重なった内分泌緊急症で、原発性副甲状腺機能亢進症が長く軽いまま経過していた患者に起こることが多い。初期対応は、脱水を直すための十分な輸液で尿中へのカルシウム排泄を促すこと、骨吸収を抑える薬を使うこと、カルシウムを上げる薬剤（サイアザイド系利尿薬など）を止めること、そして原因の確定診断と根本治療（副甲状腺の手術など）へつなげることからなる。早く気づいて介入すれば転帰はよいとされる。
    condition:
      region: 米国
      study: 高カルシウム血症クリーゼの臨床総説（2015年）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1054
    source: 'Ahmad S, Kuraganti G, Steenkamp D. Hypercalcemic Crisis: A Clinical Review. Am J Med. 2015;128(3):239-245'
    doi: 10.1016/j.amjmed.2014.09.030
