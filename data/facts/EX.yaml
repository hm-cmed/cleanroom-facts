- id: EX-001
  domain: EX
  subdomain: ホルモン検査と負荷試験の解釈の原則
  assertion:
    plain_statement_ja: 内分泌検査では、ホルモンは分泌調節（フィードバック）の中で対にして読むのが原則で、末梢ホルモンとその調節ホルモン（例：コルチゾールとACTH）を同時に見て、過剰か欠乏か、一次なのか中枢側なのかを判断する。基礎値だけでは決めにくいときは負荷試験を使い、欠乏が疑わしければ刺激試験で分泌予備能を、過剰が疑わしければ抑制試験でフィードバックが働くかを見る。解釈では採血の時刻（日内変動）、薬剤（例：デキサメタゾンの代謝を早めるCYP3A4誘導薬）や結合蛋白の変化による偽の結果に注意する。例として、クッシング症候群の低用量デキサメタゾン抑制試験では、48時間法の後にコルチゾールが1.8 µg/dL（50 nmol/L）を超えて抑制されなければ内因性クッシング症候群が示唆される。
    condition:
      region: 国際
      study: 内分泌負荷試験の総説（副腎・性腺を中心に小児と成人を対象）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1046
    source: 'Goyal A, Kubihal S, Gupta Y, Jyotsna VP, Khadgawat R. Dynamic Testing for Evaluation of Adrenal and Gonadal Function in Pediatric and Adult Endocrinology: An Overview. Indian J Endocrinol Metab. 2019;23(6):593-601'
    doi: 10.4103/ijem.IJEM_553_19
    pmid: '32042694'
    pmcid: PMC6987775
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC6987775/
    source_license: CC BY-NC-SA 4.0
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（CC BY 4.0（OPEN）、作り手の調査バッチ84 2026-11-15）：Trandafir AI, Carsote M. Dexamethasone Suppression Testing in Patients with Adrenal Incidentalomas with/Without Mild Autonomous Cortisol Secretion: Spectrum of Cortisol Cutoffs and Additional Assays (An Updated Analysis). Biomedicines. 2025;13(9):2169（PMID: 41007734、DOI: 10.3390/biomedicines13092169、PMCID: PMC12467119、https://creativecommons.org/licenses/by/4.0/）。裏づける部分：部分：デキサメタゾン抑制試験後のコルチゾールが1.8 µg/dL以下なら正常に抑制された状態であり、1.8 µg/dLを超えれば陽性で内因性クッシング症候群（または軽度の自律性コルチゾール分泌）を示唆することを再掲する。数値の照合：カットオフ1.8 µg/dLはカードの値と一致する。カードが併記する50 nmol/Lの換算値は候補に記載なし。留保：候補は副腎偶発腫を対象とする一晩法（1 mg）の検討であり、カードの例（クッシング症候群に対する48時間低用量法）とはプロトコルと対象が異なる。カットオフ値そのものは共通だが、裏づけ登録時はこの違いを区別すること。末梢ホルモンと調節ホルモンを対にして読む原則、刺激試験と抑制試験の使い分け、日内変動・CYP3A4誘導薬・結合蛋白による偽の結果への注意は再掲なし。主出典は CC BY-NC-SA 4.0（PMC全文と Europe PMC で確認）で現行の RESTRICTED が正しい（訂正対象外）'
  uncertainty: この出典は副腎と性腺の負荷試験が中心で、甲状腺や副甲状腺など他の軸の負荷試験の手順までは扱っていない。数値は出典の表に示された解釈基準を読み取ったもの。 本カードに名前の出る薬剤（デキサメタゾン等）の国内の承認・保険適用は未確認。　【承認状況の再点検 2026-10-31（作り手、PMDA・厚生労働省などの公的情報）】デキサメタゾンは国内承認薬であり、抑制試験等の負荷試験は保険診療で実施される標準的検査である（PMDA添付文書情報、2026-10-31確認）
