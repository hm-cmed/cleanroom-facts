    source: Gaddey HL, Holder KK. Unintentional Weight Loss in Older Adults. Am Fam Physician. 2021;104(1):34-40
    doi: null
    pmid: '34264616'
    pmcid: null
    url: https://pubmed.ncbi.nlm.nih.gov/34264616/
    source_license: © 2021 American Academy of Family Physicians
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: この出典には DOI が付与されていない（PubMed と誌面で確認）。対象は高齢者で、若年者では原因の内訳が異なりうる。割合は抄録に示された範囲。
