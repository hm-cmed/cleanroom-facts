- id: EX-009
  domain: EX
  subdomain: 高カルシウム血症クリーゼの初期対応
  assertion:
    plain_statement_ja: 高カルシウム血症クリーゼは、著しい高カルシウム血症に急性の悪化が重なった内分泌緊急症で、原発性副甲状腺機能亢進症が長く軽いまま経過していた患者に起こることが多い。初期対応は、脱水を直すための十分な輸液で尿中へのカルシウム排泄を促すこと、骨吸収を抑える薬を使うこと、カルシウムを上げる薬剤（サイアザイド系利尿薬など）を止めること、そして原因の確定診断と根本治療（副甲状腺の手術など）へつなげることからなる。早く気づいて介入すれば転帰はよいとされる。
    condition:
      region: 米国
      study: 高カルシウム血症クリーゼの臨床総説（2015年）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1054
    source: 'Ahmad S, Kuraganti G, Steenkamp D. Hypercalcemic Crisis: A Clinical Review. Am J Med. 2015;128(3):239-245'
    doi: 10.1016/j.amjmed.2014.09.030
    pmid: '25447624'
    pmcid: null
    url: https://doi.org/10.1016/j.amjmed.2014.09.030
    source_license: ライセンス表示を確認できず（Elsevier）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（CC BY 4.0（OPEN）、作り手の調査バッチ84 2026-11-15）：Martin M, Heim C, Mueller M, Mohaupt M. Gestational hypercalcemia: a narrative review of literature. Front Med (Lausanne). 2026;13:1909975（PMID: 42707509、DOI: 10.3389/fmed.2026.1909975、PMCID: PMC13548397、https://creativecommons.org/licenses/by/4.0/）。裏づける部分：部分：脱水の是正と利尿の促進により尿中へのカルシウム排泄を促すことが治療の柱であること、サイアザイド系利尿薬は避ける（中止する）こと、骨吸収を抑える薬としてカルシトニンやビスホスホネートが選択肢となること、原発性副甲状腺機能亢進症が最も多い原因であり副甲状腺摘出が根治的治療であることを再掲する。数値の照合：数値の主張なし（カードはクリーゼの数値基準を採用していない）。留保：候補は妊娠中の高カルシウム血症を対象とする総説であり、一般論としての管理原則の再掲にとどまる。「長く軽いまま経過していた原発性副甲状腺機能亢進症に起こることが多い」という経過の枠組みと、早く気づけば転帰がよいという点は再掲なし。主出典は Crossref のライセンスがテキストマイニング用のみで非OA、RESTRICTED への訂正対象（D）'
  uncertainty: 薬の注記：カルシトニンやビスホスホネート系薬などの国内承認・保険適用は、本カードでは個別の添付文書で確認していない（未確認）。クリーゼの定義（カルシウム値の基準）は文献により統一されておらず、本カードでは特定の数値基準を採用していない。
