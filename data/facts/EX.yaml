- id: EX-002
  domain: EX
  subdomain: 口渇・多尿の評価
  assertion:
    plain_statement_ja: 口渇と多尿では、まず低張性多尿かどうかを確認し、中枢性尿崩症、腎性尿崩症、心因性多飲の3つを分けることが評価の中心になる。従来の水制限試験は診断が合わないことが少なくない。前向き多施設研究（低張性多尿の患者144人、11施設）では、水制限試験の診断精度は76.6%だったのに対し、高張食塩水で刺激したコペプチン（カットオフ4.9 pmol/L超）は96.5%と高かった。コペプチンはバソプレシンの代替指標で、刺激なしの基礎値が高い場合は腎性尿崩症の識別に使える。
    condition:
      region: 国際
      study: 低張性多尿の成人を対象とした前向き多施設診断研究（2018年、11施設、144人）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1047
    source: Fenske W, Refardt J, Chifu I, Schnyder I, Winzeler B, Drummond J, Ribeiro-Oliveira A Jr, Drescher T, Bilz S, Vogt DR, Malzahn U, Kroiss M, Christ E, Henzen C, Fischli S, Tönjes A, Mueller B, Schopohl J, Flitsch J, Brabant G, Fassnacht M, Christ-Crain M. A Copeptin-Based Approach in the Diagnosis of Diabetes Insipidus. N Engl J Med. 2018;379(5):428-439
