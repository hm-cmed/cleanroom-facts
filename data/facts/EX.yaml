    source_license: 学会ガイドライン（CC 表示を確認できず）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 薬の注記：ヒドロコルチゾン注射薬は国内で承認・保険収載されている薬剤だが、本カードでは個別の添付文書による確認は行っていない（未確認）。クリーゼ時の具体的な投与量の段階付けはガイドライン本文の表に依存し、抄録で確認できた範囲を超える用量は書いていない。
