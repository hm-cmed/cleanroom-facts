- id: EX-006
  domain: EX
  subdomain: 副腎クリーゼの初期対応
  assertion:
    plain_statement_ja: 副腎クリーゼが疑われたら、診断の確定を待たずに治療を始める。重い副腎不全の症状や副腎クリーゼの患者では、検査結果が出る前に、静脈からヒドロコルチゾンをストレス量で直ちに投与することが勧められる。あわせて脱水と低血圧への輸液、低血糖や電解質異常の是正、引き金になった感染症などの治療を並行して行う。診断のための短時間コルチコトロピン刺激試験（250 µg）は、患者の状態が許す場合に行う確認試験で、治療開始を遅らせる理由にしない。
    condition:
      region: 国際
      study: 原発性副腎不全の診断と治療の診療ガイドライン（Endocrine Society、2016年）
    differential: null
    common_misconception: null
  provenance:
