- id: EX-012
  domain: EX
  subdomain: 内分泌疾患と電解質異常（総論）
  assertion:
    plain_statement_ja: 内分泌疾患の電解質異常は、異常になった電解質に対応するホルモンを対にして考えると整理できる。水とナトリウムはバソプレシン（ADH）と副腎の機能、カリウムはアルドステロン系、カルシウムとリンは副甲状腺ホルモンとビタミンDが担う。代表例の低ナトリウム血症では、体液量の評価に加えて、SIAD（ADHの不適切な分泌）のほか、副腎不全と甲状腺機能低下症を原因として必ず考える。逆に、低ナトリウム血症と高カリウム血症の組み合わせは副腎不全を、高血圧と低カリウム血症の組み合わせはアルドステロン過剰を疑う手がかりになる。
    condition:
      region: 国際
      study: 低ナトリウム血症の診断・評価・治療に関する専門家パネルの勧告（2013年）を中心とする総論
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1057
    source: 'Verbalis JG, Goldsmith SR, Greenberg A, Korzelius C, Schrier RW, Sterns RH, Thompson CJ. Diagnosis, Evaluation, and Treatment of Hyponatremia: Expert Panel Recommendations. Am J Med. 2013;126(10 Suppl 1):S1-S42'
    doi: 10.1016/j.amjmed.2013.07.006
    pmid: '24074529'
    pmcid: null
    url: https://doi.org/10.1016/j.amjmed.2013.07.006
    source_license: ライセンス表示を確認できず（Elsevier）
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: この出典は低ナトリウム血症が中心で、カリウムやカルシウムの異常の詳細な手順は各論の出典（副腎・副甲状腺のガイドライン）に委ねる。本カードは対応づけの原則を示す総論として作成した。
