- id: EX-003
  domain: EX
  subdomain: 体重減少の評価（内分泌の視点）
  assertion:
    plain_statement_ja: 意図しない体重減少の評価では、甲状腺機能検査を基本検査に含め、甲状腺中毒症、糖尿病、副腎不全といった内分泌の原因を落とさないことが大切である。高齢者では非悪性の原因が悪性より多い一方、悪性腫瘍が最大で約3分の1を占め、原因がはっきりしない例も6〜28%あるとされる。内分泌の視点では、食欲があるのにやせる場合は甲状腺機能亢進や糖尿病を、食欲低下と倦怠感、起立性の症状を伴う場合は副腎不全を考える。
    condition:
      region: 米国
      study: 65歳超の意図しない体重減少を対象とした総説（2021年）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1048
    source: Gaddey HL, Holder KK. Unintentional Weight Loss in Older Adults. Am Fam Physician. 2021;104(1):34-40
    doi: null
    pmid: '34264616'
    pmcid: null
    url: https://pubmed.ncbi.nlm.nih.gov/34264616/
    source_license: © 2021 American Academy of Family Physicians
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（CC BY 4.0（OPEN）、作り手の調査バッチ84 2026-11-15）：Bosch X, Monclús E, Escoda O, Guerra-García M, Moreno P, Guasch N, López-Soto A. Unintentional weight loss: Clinical characteristics and outcomes in a prospective cohort of 2677 patients. PLoS One. 2017;12(4):e0175125（PMID: 28388637、DOI: 10.1371/journal.pone.0175125、PMCID: PMC5384681、https://creativecommons.org/licenses/by/4.0/）。裏づける部分：部分：前向きコホート2,677人で、悪性疾患が原因の33%を占め、非悪性の器質性疾患37%と心理社会的要因16%を合わせた非悪性が悪性を上回ること、内分泌疾患の中では甲状腺中毒症（内分泌疾患の46%）と糖尿病（同39%）が中心であることを再掲する。数値の照合：悪性33%はカードの「最大で約3分の1」と一致する。原因不明は候補では当初原因不明14%という単一コホートの値で、カードの範囲（6〜28%）そのものの再掲ではない。留保：甲状腺機能検査を基本検査に含める手順、食欲の有無による内分泌原因の絞り込み、副腎不全の位置づけは再掲なし。候補は高齢者に限定したコホートではなく全年齢の前向きコホートである点にも留意。主出典は © American Academy of Family Physicians で非OA（DOI自体が付与されていないことも個別照会で再確認）、RESTRICTED への訂正対象（D）'
  uncertainty: この出典には DOI が付与されていない（PubMed と誌面で確認）。対象は高齢者で、若年者では原因の内訳が異なりうる。割合は抄録に示された範囲。
