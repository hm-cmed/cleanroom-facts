- id: EX-014
  domain: EX
  subdomain: 二次性高血圧の評価（内分泌の視点）
  assertion:
    plain_statement_ja: 内分泌性の二次性高血圧で最も頻度が高いのは原発性アルドステロン症で、治療抵抗性の高血圧、低カリウム血症を伴う高血圧、副腎の偶発腫を伴う高血圧、睡眠時無呼吸を伴う高血圧、若くして発症した高血圧や家族歴のある場合に症例発見の対象になる。Endocrine Society のガイドライン（2016年）は、別の日に測った3回とも150/100 mmHg を超える高血圧、通常の降圧薬3剤に抵抗性の高血圧、4剤以上でコントロールされる高血圧などを対象に挙げ、スクリーニングには血漿アルドステロンとレニンの比（ARR）を使う。内分泌の視点ではこのほか、褐色細胞腫、クッシング症候群、甲状腺機能の異常を、症状と所見の手がかりがある場合に調べる。
    condition:
      region: 国際
      study: 原発性アルドステロン症の症例発見・診断・治療の診療ガイドライン（Endocrine Society、2016年）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-888
    source: 'Funder JW, Carey RM, Mantero F, Murad MH, Reincke M, Shibata H, Stowasser M, Young WF Jr. The Management of Primary Aldosteronism: Case Detection, Diagnosis, and Treatment: An Endocrine Society Clinical Practice Guideline. J Clin Endocrinol Metab. 2016;101(5):1889-1916.'
    doi: 10.1210/jc.2015-4061
    pmid: '26934393'
    pmcid: null
    url: https://doi.org/10.1210/jc.2015-4061
    source_license: CC BY-NC-ND 4.0
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: ARR のカットオフや確認試験の手順は測定法に依存し、国内のガイドラインと異なる場合があるため、本カードでは具体的なカットオフ値を書いていない。褐色細胞腫やクッシング症候群の検査の詳細は各論に委ねる。
