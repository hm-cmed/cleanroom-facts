- id: EX-005
  domain: EX
  subdomain: 甲状腺腫の評価
  assertion:
    plain_statement_ja: 甲状腺腫の評価の基本は、病歴と触診（原因、圧迫症状の有無）、甲状腺の超音波検査、TSH の測定の3つである。超音波で腫大を確認してびまん性か結節性かを分け、TSH で機能を判断する。結節がある場合は、自律性機能（熱結節）があるか、良性か悪性かという2つの問いに進み、必要に応じてシンチグラフィや穿刺吸引細胞診を使う。胸骨下に及ぶ腫大や気道圧迫が疑われるときは CT や MRI を考える。
    condition:
      region: 国際
      study: 甲状腺機能正常の甲状腺腫（結節の有無を含む）の診断と治療の総説（2012年、ドイツ）
