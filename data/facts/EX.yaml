- id: EX-013
  domain: EX
  subdomain: 内分泌疾患の周術期管理（総論）
  assertion:
    plain_statement_ja: 内分泌疾患の周術期管理で最も事故につながりやすいのは、副腎不全の見落としとステロイド補充の不足である。原発性・中枢性の副腎不全で生理量の補充を受けている患者は、手術のストレスで副腎クリーゼを起こしうるため、周術期にヒドロコルチゾンのストレス量の補充が要る。他の病気の治療で糖質コルチコイドを使っている患者でも、プレドニゾロン換算で1日5 mg 以上を1か月以上使っている場合は視床下部・下垂体・副腎系の抑制が起こりうる。補充は通常の内服量に追加して行い、内服できない間は注射に切り替える。一般原則として、内分泌疾患の手術では、術前にホルモンの過剰と欠乏の両方を評価し、補充薬を絶食で止めない計画を立てる。
    condition:
      region: 国際
      study: 副腎不全患者の周術期グルココルチコイド管理ガイドライン（英国、2020年）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1058
    source: 'Woodcock T, Barker P, Daniel S, et al. Guidelines for the management of glucocorticoids during the peri-operative period for patients with adrenal insufficiency: Guidelines from the Association of Anaesthetists, the Royal College of Physicians and the Society for Endocrinology UK. Anaesthesia. 2020;75(5):654-663'
    doi: 10.1111/anae.14963
    pmid: '32017012'
    pmcid: null
    url: https://pubmed.ncbi.nlm.nih.gov/32017012/
    source_license: ライセンス表示を確認できず
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 薬の注記：ヒドロコルチゾン等の国内承認・保険適用は、本カードでは個別の添付文書で確認していない（未確認）。出典は副腎不全とステロイド使用患者が中心で、甲状腺や糖尿病の周術期管理の詳細は各論に委ねる。具体的なストレス量の段階表はガイドライン本文の表に依存し、抄録で確認できた範囲を超える用量は書いていない。
