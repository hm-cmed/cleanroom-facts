- id: EX-002
  domain: EX
  subdomain: 口渇・多尿の評価
  assertion:
    plain_statement_ja: 口渇と多尿では、まず低張性多尿かどうかを確認し、中枢性尿崩症、腎性尿崩症、心因性多飲の3つを分けることが評価の中心になる。従来の水制限試験は診断が合わないことが少なくない。前向き多施設研究（低張性多尿の患者144人、11施設）では、水制限試験の診断精度は76.6%だったのに対し、高張食塩水で刺激したコペプチン（カットオフ4.9 pmol/L超）は96.5%と高かった。コペプチンはバソプレシンの代替指標で、刺激なしの基礎値が高い場合は腎性尿崩症の識別に使える。
    condition:
      region: 国際
      study: 低張性多尿の成人を対象とした前向き多施設診断研究（2018年、11施設、144人）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1047
    source: Fenske W, Refardt J, Chifu I, Schnyder I, Winzeler B, Drummond J, Ribeiro-Oliveira A Jr, Drescher T, Bilz S, Vogt DR, Malzahn U, Kroiss M, Christ E, Henzen C, Fischli S, Tönjes A, Mueller B, Schopohl J, Flitsch J, Brabant G, Fassnacht M, Christ-Crain M. A Copeptin-Based Approach in the Diagnosis of Diabetes Insipidus. N Engl J Med. 2018;379(5):428-439
    doi: 10.1056/NEJMoa1803760
    pmid: '30067922'
    pmcid: null
    url: https://doi.org/10.1056/NEJMoa1803760
    source_license: © Massachusetts Medical Society（CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（CC BY 4.0（OPEN）、作り手の調査バッチ84 2026-11-15）：Atila C, Refardt J, Christ-Crain M. Arginine Vasopressin Deficiency and Oxytocin Deficiency in the Endocrine Clinic. J Clin Endocrinol Metab. 2026;111(4):922-937（PMID: 41363127、DOI: 10.1210/clinem/dgaf651、PMCID: PMC13017940、https://creativecommons.org/licenses/by/4.0/）。裏づける部分：部分：低張性多尿の評価が中枢性（AVP欠乏）・腎性（AVP抵抗性）・心因性多飲（原発性多飲）の3者の鑑別を中心とすること、高張食塩水で刺激したコペプチンのカットオフ（4.9 pmol/L超）で原発性多飲とAVP欠乏を鑑別できること、刺激なしの基礎コペプチン高値（21.4 pmol/L超）がAVP抵抗性の識別に使えることを再掲する。数値の照合：カットオフ4.9 pmol/Lはカードと一致する。診断精度は候補が範囲で示し、水制限試験70〜77%（カード76.6%は範囲内）、高張食塩水刺激コペプチン96〜97%（カード96.5%は範囲内）であり、単一の値としての再掲ではない。前向き多施設研究の規模（144人・11施設）は再掲なし。留保：候補は主出典の研究（Fenske 2018）を含む複数の前向き研究を引いて精度を範囲で述べる。裏づけ登録時は候補の範囲表記を用い、カードの単一値（76.6%・96.5%）の裏づけとしては範囲内である旨を明記すること。主出典は Crossref の刊行版ライセンスが NEJM の利用規約のみで非OA、RESTRICTED への訂正対象（D）'
  uncertainty: コペプチン測定は国内のすべての施設で実施できるわけではなく、保険適用の状況は本調査では確認していない。数値は抄録とその報道で確認した範囲。
