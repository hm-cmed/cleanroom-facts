- id: EX-013
  domain: EX
  subdomain: 内分泌疾患の周術期管理（総論）
  assertion:
    plain_statement_ja: 内分泌疾患の周術期管理で最も事故につながりやすいのは、副腎不全の見落としとステロイド補充の不足である。原発性・中枢性の副腎不全で生理量の補充を受けている患者は、手術のストレスで副腎クリーゼを起こしうるため、周術期にヒドロコルチゾンのストレス量の補充が要る。他の病気の治療で糖質コルチコイドを使っている患者でも、プレドニゾロン換算で1日5 mg 以上を1か月以上使っている場合は視床下部・下垂体・副腎系の抑制が起こりうる。補充は通常の内服量に追加して行い、内服できない間は注射に切り替える。一般原則として、内分泌疾患の手術では、術前にホルモンの過剰と欠乏の両方を評価し、補充薬を絶食で止めない計画を立てる。
    condition:
      region: 国際
      study: 副腎不全患者の周術期グルココルチコイド管理ガイドライン（英国、2020年）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1058
    source: 'Woodcock T, Barker P, Daniel S, et al. Guidelines for the management of glucocorticoids during the peri-operative period for patients with adrenal insufficiency: Guidelines from the Association of Anaesthetists, the Royal College of Physicians and the Society for Endocrinology UK. Anaesthesia. 2020;75(5):654-663'
    doi: 10.1111/anae.14963
    pmid: '32017012'
    pmcid: null
    url: https://pubmed.ncbi.nlm.nih.gov/32017012/
    source_license: ライセンス表示を確認できず
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（CC BY 4.0（OPEN）、作り手の調査バッチ84 2026-11-15）：Modha K, Whinney C. Risks and Management of Glucocorticoid Therapy for Patients with Rheumatic Disease Having Surgery. Curr Rheumatol Rep. 2026;28(1)（PMID: 42236615、DOI: 10.1007/s11926-026-01221-3、PMCID: PMC13233973、https://creativecommons.org/licenses/by/4.0/）。裏づける部分：部分：手術のストレスに対して通常量を増量する「ストレス量」補充の考え方、通常量を術前に止めた患者で原因不明の低血圧が生じた報告があること（補充を止めない原則の根拠）、主出典である英国2020年ガイドラインが中等度リスクの手技にヒドロコルチゾン100 mg を提案していること、HPA系抑制のリスクが用量と投与期間に依存することを再掲する。数値の照合：カードの閾値「プレドニゾロン換算1日5 mg以上を1か月以上」は候補に再掲なし。候補が引くヒドロコルチゾン100 mg は主出典由来の値で、カードは具体的な用量段階を主張していないため矛盾はない。留保：候補はリウマチ性疾患で糖質コルチコイドを使う患者の手術を対象とする総説であり、副腎不全そのもので補充中の患者の管理の詳細は主出典に委ねられる。主出典は刊行版が CC BY-NC-ND 4.0（Crossref の刊行版データ・Europe PMC・Unpaywall で確認）であり自由ではない。マスターの license_note「ライセンス表示を確認できず」は実態と異なるため、あわせて注記の更新を提案する。RESTRICTED への訂正対象（D）'
  uncertainty: 薬の注記：ヒドロコルチゾン等の国内承認・保険適用は、本カードでは個別の添付文書で確認していない（未確認）。出典は副腎不全とステロイド使用患者が中心で、甲状腺や糖尿病の周術期管理の詳細は各論に委ねる。具体的なストレス量の段階表はガイドライン本文の表に依存し、抄録で確認できた範囲を超える用量は書いていない。
