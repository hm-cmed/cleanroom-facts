- id: EX-001
  domain: EX
  subdomain: ホルモン検査と負荷試験の解釈の原則
  assertion:
    plain_statement_ja: 内分泌検査では、ホルモンは分泌調節（フィードバック）の中で対にして読むのが原則で、末梢ホルモンとその調節ホルモン（例：コルチゾールとACTH）を同時に見て、過剰か欠乏か、一次なのか中枢側なのかを判断する。基礎値だけでは決めにくいときは負荷試験を使い、欠乏が疑わしければ刺激試験で分泌予備能を、過剰が疑わしければ抑制試験でフィードバックが働くかを見る。解釈では採血の時刻（日内変動）、薬剤（例：デキサメタゾンの代謝を早めるCYP3A4誘導薬）や結合蛋白の変化による偽の結果に注意する。例として、クッシング症候群の低用量デキサメタゾン抑制試験では、48時間法の後にコルチゾールが1.8 µg/dL（50 nmol/L）を超えて抑制されなければ内因性クッシング症候群が示唆される。
    condition:
      region: 国際
      study: 内分泌負荷試験の総説（副腎・性腺を中心に小児と成人を対象）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1046
    source: 'Goyal A, Kubihal S, Gupta Y, Jyotsna VP, Khadgawat R. Dynamic Testing for Evaluation of Adrenal and Gonadal Function in Pediatric and Adult Endocrinology: An Overview. Indian J Endocrinol Metab. 2019;23(6):593-601'
    doi: 10.4103/ijem.IJEM_553_19
    pmid: '32042694'
    pmcid: PMC6987775
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC6987775/
    source_license: CC BY-NC-SA 4.0
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: この出典は副腎と性腺の負荷試験が中心で、甲状腺や副甲状腺など他の軸の負荷試験の手順までは扱っていない。数値は出典の表に示された解釈基準を読み取ったもの。 本カードに名前の出る薬剤（デキサメタゾン等）の国内の承認・保険適用は未確認。
