    pmid: '30067922'
    pmcid: null
    url: https://doi.org/10.1056/NEJMoa1803760
    source_license: © Massachusetts Medical Society（CC表示なし）
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: コペプチン測定は国内のすべての施設で実施できるわけではなく、保険適用の状況は本調査では確認していない。数値は抄録とその報道で確認した範囲。
