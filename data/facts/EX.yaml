- id: EX-011
  domain: EX
  subdomain: 日本の糖尿病・肥満の統計
  assertion:
    plain_statement_ja: 令和6年（2024年）国民健康・栄養調査（厚生労働省、2024年10〜11月実施、全国補正値）では、20歳以上で「糖尿病が強く疑われる者」は12.9%（男性17.7%、女性9.3%）で、推計人数は約1,100万人とされ、1997年以降増えている。「糖尿病の可能性を否定できない者」は8.2%で、推計約700万人である。肥満者（BMI 25 kg/m²以上）の割合は20歳以上で男性32.4%、女性19.3%だった。糖尿病を指摘されたことがある者のうち現在治療を受けている者は67.4%である。「糖尿病が強く疑われる者」の判定は、ヘモグロビンA1cの測定値などを用いた調査上の判定である。
    condition:
      region: 日本
      study: 令和6年国民健康・栄養調査（厚生労働省）。対象は全国から層化無作為抽出された地区の世帯員で、割合は20歳以上・全国補正値、推計人数は人口推計を用いた全国推計
    differential: null
    common_misconception: null
  provenance:
