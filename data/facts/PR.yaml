- id: PR-001
  domain: PR
  subdomain: 境界性パーソナリティ障害<ボーダーラインパターン>
  assertion:
    plain_statement_ja: 米国精神医学会（APA）の境界性パーソナリティ障害の診療ガイドライン（2024年改訂）では、治療の中核は障害の中核的特徴を対象とする構造化された心理療法であり、向精神薬については中核症状への有効性のエビデンスが認められず、使用する場合は期間を限って測定可能な標的症状に絞り、心理療法の補助とすること、少なくとも6か月ごとに薬剤の見直し・調整を行うことが示されている。同ガイドラインの公表資料では、米国人口における有病率は1.4〜2.7%とされている。
    condition:
      region: 米国
      対象: 境界性パーソナリティ障害の成人患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3851
    source: Keepers GA, Fochtmann LJ, Anzia JM, et al. The American Psychiatric Association Practice Guideline for the Treatment of Patients With Borderline Personality Disorder. Am J Psychiatry. 2024;181(11):1024-1028
    doi: 10.1176/appi.ajp.24181010
    pmid: '39482953'
    pmcid: null
    url: https://doi.org/10.1176/appi.ajp.24181010
    source_license: CC 表示なし
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN／OPEN、作り手の調査バッチ97 2026-11-15）：White C, St Rose S, Dwyer JB, et al. Treatment trajectories of patients with borderline personality disorder prescribed pharmacotherapy: real-world insights from a retrospective observational study. BMC Psychiatry. 2026;26(1):351／Tiger A, Molero Y, Brikell I, et al. Central nervous system acting medication used by young adults with borderline personality disorder in Sweden 2006-2019. J Psychopharmacol. 2026;40(9):1343-1351（PMID: 41862841／41693623、DOI: 10.1186/s12888-026-07974-6／10.1177/02698811251413479、PMCID: PMC13127037／PMC13490660、https://creativecommons.org/licenses/by/4.0/）。裏づける部分：部分：候補1（CC BY）は、APA の2024年ガイドラインが心理療法を第一選択の治療として推奨すること、境界性パーソナリティ障害に承認された薬物療法は存在せず薬物療法は心理療法の補助として位置づけられることを、ガイドラインを引用して再掲し、米国の生涯有病率1.4〜2.7%も再掲する。候補2（CC BY）は Keepers et al. 2024 を国際ガイドラインの一つとして引用し、心理療法が推奨される第一選択の治療であることと、処方薬は定期的に評価し利益がなければ中止することがガイドラインの推奨に沿うことを再掲する。ただし「中核的特徴を対象とする構造化された心理療法」という推奨の形そのもの、「中核症状への有効性のエビデンスが認められなかった」というガイドライン自身の結論の文言、「期間を限って測定可能な標的症状に絞る」という運用の細部、「少なくとも6か月ごと」という見直し間隔の数値は、自由な全文には再掲がない。数値の照合：有病率1.4〜2.7%は候補1の再掲と一致する（候補1は米国の生涯有病率としての表記で、カードは APA の公表資料に基づく有病率の表記）。見直し間隔6か月は候補のいずれにも再掲がない。留保：主出典（SRC-3851）の刊行版ライセンスは Crossref の版データに登録がなく、Europe PMC の個別レコードでも非 OA・PMC 未収載で、現行 RESTRICTED が正しい。なおガイドライン全文は APA のサイトで無償公開されているが © APA で CC 表示はなく、無償で読めること（gratis）は自由なライセンス（libre）とは異なるため区分は変わらない。候補のライセンスはいずれも Crossref の版データ・Europe PMC の個別レコード・PMC 全文のライセンス要素で CC BY 4.0 と個別確認した'
  uncertainty: 国内では境界性パーソナリティ障害を対象とする学会の診療ガイドラインは確認できず（2026年10月時点）、本カードは米国のガイドラインに基づく。推奨文の内容は APA の公式発表で確認した範囲に限る。個別の向精神薬の国内承認・適応は本カードでは確認していない（未確認）。
  curriculum:
    kokushi: 医学各論 Ⅱ-6-A-①（境界性パーソナリティ障害<ボーダーラインパターン>、b）
