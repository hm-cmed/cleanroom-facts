- id: PR-005
  domain: PR
  subdomain: 窃視症、露出症、窃触症、小児性愛、フェティシズム
  assertion:
    plain_statement_ja: 世界生物学的精神医学会（WFSBP）のパラフィリア症の薬物療法ガイドライン（2020年）では、使用する薬剤はパラフィリア症の重症度と他者を危険にさらす行動のリスクに応じて決められ、重症のパラフィリア症に対しては GnRH アナログ治療が最も重要な治療と位置づけられて、重症度とリスクのカテゴリーごとに治療レベルを分けたアルゴリズムが提案されている。
    condition:
      region: 国際
      対象: パラフィリア症の成人男性
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3855
    source: Thibaut F, Cosyns P, Fedoroff JP, Briken P, Goethals K, Bradford JMW; WFSBP Task Force on Paraphilias. The World Federation of Societies of Biological Psychiatry (WFSBP) 2020 guidelines for the pharmacological treatment of paraphilic disorders. World J Biol Psychiatry. 2020;21(6):412-490
    doi: 10.1080/15622975.2020.1744723
    pmid: '32452729'
    pmcid: null
    url: https://doi.org/10.1080/15622975.2020.1744723
    source_license: CC 表示なし
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 本ガイドラインの対象は成人男性のみで、女性と青年は含まれていない。同ガイドラインで扱われる薬剤（GnRH アナログ、SSRI、抗アンドロゲン剤など）のパラフィリア症に対する国内承認・保険適用は確認していない（未確認）。パラフィリックな関心や行動の頻度は、苦痛・機能障害等を要件とするパラフィリア症の有病率とは別の概念であり、本カードには含めていない。国内にパラフィリア症を対象とする学会の診療ガイドラインは確認できなかった。
  curriculum:
    kokushi: 医学各論 Ⅱ-6-C-①（窃視症、露出症、窃触症、小児性愛、フェティシズム、c）
