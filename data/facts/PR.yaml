- id: PR-001
  domain: PR
  subdomain: 境界性パーソナリティ障害<ボーダーラインパターン>
  assertion:
    plain_statement_ja: 米国精神医学会（APA）の境界性パーソナリティ障害の診療ガイドライン（2024年改訂）では、治療の中核は障害の中核的特徴を対象とする構造化された心理療法であり、向精神薬については中核症状への有効性のエビデンスが認められず、使用する場合は期間を限って測定可能な標的症状に絞り、心理療法の補助とすること、少なくとも6か月ごとに薬剤の見直し・調整を行うことが示されている。同ガイドラインの公表資料では、米国人口における有病率は1.4〜2.7%とされている。
    condition:
      region: 米国
      対象: 境界性パーソナリティ障害の成人患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3851
    source: Keepers GA, Fochtmann LJ, Anzia JM, et al. The American Psychiatric Association Practice Guideline for the Treatment of Patients With Borderline Personality Disorder. Am J Psychiatry. 2024;181(11):1024-1028
    doi: 10.1176/appi.ajp.24181010
    pmid: '39482953'
    pmcid: null
    url: https://doi.org/10.1176/appi.ajp.24181010
    source_license: CC 表示なし
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 国内では境界性パーソナリティ障害を対象とする学会の診療ガイドラインは確認できず（2026年10月時点）、本カードは米国のガイドラインに基づく。推奨文の内容は APA の公式発表で確認した範囲に限る。個別の向精神薬の国内承認・適応は本カードでは確認していない（未確認）。
  curriculum:
    kokushi: 医学各論 Ⅱ-6-A-①（境界性パーソナリティ障害<ボーダーラインパターン>、b）
    core_curriculum: 'PS-02-17-04 (id: JkxnuT4)；TBL-01-00-548 (id: JlvnmU8)；TBL-02-16-016 (id: JuX-PEk)；PS-02-17-05 (id: JkxnuT8)'
