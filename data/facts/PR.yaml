- id: PR-004
  domain: PR
  subdomain: 放火症、窃盗症
  assertion:
    plain_statement_ja: 窃盗症に対するナルトレキソンの二重盲検プラセボ対照試験（成人25例、8週間）では、ナルトレキソン群（50〜150 mg/日）で窃盗衝動・窃盗行動と全般的な重症度がプラセボ群より有意に大きく改善した。窃盗症については実証的に検証された治療が乏しく、エビデンスはこのような小規模試験に基づく。
    condition:
      region: 米国
      対象: 窃盗症の成人
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3854
    source: Grant JE, Kim SW, Odlaug BL. A double-blind, placebo-controlled study of the opiate antagonist, naltrexone, in the treatment of kleptomania. Biol Psychiatry. 2009;65(7):600-606
    doi: 10.1016/j.biopsych.2008.11.022
    pmid: '19217077'
    pmcid: null
    url: https://doi.org/10.1016/j.biopsych.2008.11.022
    source_license: CC 表示なし
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: ナルトレキソンの国内承認・保険適用は本作成時点で確認していない（未確認）。窃盗症そのものを適応とする国内承認薬も確認していない。単一の小規模試験の結果であり、再現性には限界がある。窃盗症の有病率として流布している数値（0.3〜0.6%など）は一次資料で確認できなかったため、主張には入れていない。
  curriculum:
    kokushi: 医学各論 Ⅱ-6-B-①（放火症、窃盗症、c）
    core_curriculum: 'PS-02-17-05 (id: JkxnuT8)'
