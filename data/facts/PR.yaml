- id: PR-005
  domain: PR
  subdomain: 窃視症、露出症、窃触症、小児性愛、フェティシズム
  assertion:
    plain_statement_ja: 世界生物学的精神医学会（WFSBP）のパラフィリア症の薬物療法ガイドライン（2020年）では、使用する薬剤はパラフィリア症の重症度と他者を危険にさらす行動のリスクに応じて決められ、重症のパラフィリア症に対しては GnRH アナログ治療が最も重要な治療と位置づけられて、重症度とリスクのカテゴリーごとに治療レベルを分けたアルゴリズムが提案されている。
    condition:
      region: 国際
      対象: パラフィリア症の成人男性
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3855
    source: Thibaut F, Cosyns P, Fedoroff JP, Briken P, Goethals K, Bradford JMW; WFSBP Task Force on Paraphilias. The World Federation of Societies of Biological Psychiatry (WFSBP) 2020 guidelines for the pharmacological treatment of paraphilic disorders. World J Biol Psychiatry. 2020;21(6):412-490
    doi: 10.1080/15622975.2020.1744723
    pmid: '32452729'
    pmcid: null
    url: https://doi.org/10.1080/15622975.2020.1744723
    source_license: CC 表示なし
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ97 2026-11-15）：Turner D, Briken P, Grubbs J, et al. The World Federation of Societies of Biological Psychiatry guidelines on the assessment and pharmacological treatment of compulsive sexual behaviour disorder. Dialogues Clin Neurosci. 2022;24(1):10-69（PMID: 37522807、DOI: 10.1080/19585969.2022.2134739、PMCID: PMC10408697、https://creativecommons.org/licenses/by/4.0/）。裏づける部分：部分：候補（同じ WFSBP の強迫的性行動症ガイドライン、CC BY）は、その治療アルゴリズムが主出典（Thibaut et al. 2020）と Briken & Turner 2021 に基づくことを明示し、重症度のレベル（軽症〜重症）ごとに治療を段階づける構造を再掲する。また、パラフィリア症を併存する場合は主出典であるパラフィリア症ガイドラインの治療アルゴリズムを用いるべきこと、CPA や GnRH アゴニストは強い症状と比較的高い性犯罪リスクのある場合に限ること、GnRH アゴニストが SSRI や CPA より性的機能・空想・行動の低下が大きいことを再掲する。ただし、主出典のアルゴリズム自体の段階構成（重症度とリスクのカテゴリーごとに治療レベルを分けたもの）と、「重症のパラフィリア症に対して GnRH アナログ治療が最も重要な治療」という位置づけそのものは候補では再掲されず、主出典への参照に委ねられている。数値の照合：数値的主張はカードにない（定性的な枠組みの再掲のみ）。留保：主出典（SRC-3855）の刊行版ライセンスは Crossref の版データに登録がなく（リンクは similarity-checking のみ）、Europe PMC の個別レコードでも非 OA・PMC 未収載で、現行 RESTRICTED が正しい。候補のライセンスは Crossref の版データ・Europe PMC の個別レコード・PMC 全文のライセンス要素で CC BY 4.0 と個別確認した'
