- id: PR-004
  domain: PR
  subdomain: 放火症、窃盗症
  assertion:
    plain_statement_ja: 窃盗症に対するナルトレキソンの二重盲検プラセボ対照試験（成人25例、8週間）では、ナルトレキソン群（50〜150 mg/日）で窃盗衝動・窃盗行動と全般的な重症度がプラセボ群より有意に大きく改善した。窃盗症については実証的に検証された治療が乏しく、エビデンスはこのような小規模試験に基づく。
    condition:
      region: 米国
      対象: 窃盗症の成人
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3854
    source: Grant JE, Kim SW, Odlaug BL. A double-blind, placebo-controlled study of the opiate antagonist, naltrexone, in the treatment of kleptomania. Biol Psychiatry. 2009;65(7):600-606
    doi: 10.1016/j.biopsych.2008.11.022
    pmid: '19217077'
    pmcid: null
    url: https://doi.org/10.1016/j.biopsych.2008.11.022
    source_license: CC 表示なし
    legal_basis: B
    source_class: RESTRICTED
    corroboration: 自由に使える資料による裏づけ（GOV_US、作り手の調査バッチ97 2026-11-15）：ClinicalTrials.gov 登録レコード NCT00332579：A Double-Blind, Placebo-Controlled Study of Naltrexone in Kleptomania（University of Minnesota、責任者 Jon E. Grant、結果投稿済み）（https://clinicaltrials.gov/study/NCT00332579）。裏づける部分：部分：登録レコードは、主出典の試験そのものについて、二重盲検・無作為化・プラセボ対照であること、対象25例（ナルトレキソン12例・プラセボ13例）、ナルトレキソンの投与量が50〜150 mg/日であること、治療期間が8週間であることを記録し、主要評価項目 K-YBOCS の結果（終了時平均値 3.83 vs 11.46、ナルトレキソン群が低値で良好な方向）が投稿されている。ただし統計学的有意性の検定結果（p値）や全般的な重症度のアウトカムはレコードに投稿されておらず、「有意に大きく改善した」という有意性と全般的な重症度の改善はレコードでは再掲されない。数値の照合：対象25例・用量50〜150 mg/日・治療期間8週間はレコードの記録と一致する。主要評価項目の終了時値はナルトレキソン群が良好な方向だが、レコードにはベースライン値・変化量・p値の投稿がなく、論文の有意性そのものの数値照合はできない。留保：主出典（SRC-3854）の刊行版ライセンスは Crossref の版データで Elsevier の TDM のみで CC 表示はなく、Europe PMC の個別レコードでも非 OA・PMC 未収載で、現行 RESTRICTED が正しい。候補は米国政府の試験登録レコード（GOV_US）で、結果が投稿済みのもののみを用いた
  uncertainty: ナルトレキソンの国内承認・保険適用は本作成時点で確認していない（未確認）。窃盗症そのものを適応とする国内承認薬も確認していない。単一の小規模試験の結果であり、再現性には限界がある。窃盗症の有病率として流布している数値（0.3〜0.6%など）は一次資料で確認できなかったため、主張には入れていない。
