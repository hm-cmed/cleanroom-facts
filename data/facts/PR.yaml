- id: PR-002
  domain: PR
  subdomain: 境界性パーソナリティ障害<ボーダーラインパターン>
  assertion:
    plain_statement_ja: 境界性パーソナリティ障害に対する心理療法の Cochrane 系統的レビュー（無作為化比較試験75件、参加者4,507人）では、心理療法は通常治療に比べて症状の重症度を下げ（標準化平均差 -0.52）、弁証法的行動療法は自傷の減少、メンタライゼーションに基づく治療は自傷と自殺関連のアウトカムの改善と関連したが、いずれもエビデンスの質は低いと評価され、療法の種類の間で効果に明確な差は認められなかった。
    condition:
      region: 国際
      対象: 境界性パーソナリティ障害の患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3852
    source: Storebø OJ, Stoffers-Winterling JM, Völlm BA, et al. Psychological therapies for people with borderline personality disorder. Cochrane Database Syst Rev. 2020;(5):CD012955
    doi: 10.1002/14651858.CD012955.pub2
    pmid: '32368793'
    pmcid: PMC7199382
    url: https://doi.org/10.1002/14651858.CD012955.pub2
    source_license: CC 表示なし
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 数値は抄録で確認した範囲であり、エビデンスの確実性は重症度のアウトカムで中程度、その他は低いと評価されている。国内での各療法の実施体制や保険適用の扱いは本カードでは扱っていない。
  curriculum:
    kokushi: 医学各論 Ⅱ-6-A-①（境界性パーソナリティ障害<ボーダーラインパターン>、b）
    core_curriculum: 'PS-02-17-04 (id: JkxnuT4)；TBL-01-00-548 (id: JlvnmU8)；TBL-02-16-016 (id: JuX-PEk)；PS-02-17-05 (id: JkxnuT8)'
