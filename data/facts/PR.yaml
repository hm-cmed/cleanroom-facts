- id: PR-002
  domain: PR
  subdomain: 境界性パーソナリティ障害<ボーダーラインパターン>
  assertion:
    plain_statement_ja: 境界性パーソナリティ障害に対する心理療法の Cochrane 系統的レビュー（無作為化比較試験75件、参加者4,507人）では、心理療法は通常治療に比べて症状の重症度を下げ（標準化平均差 -0.52）、弁証法的行動療法は自傷の減少、メンタライゼーションに基づく治療は自傷と自殺関連のアウトカムの改善と関連したが、いずれもエビデンスの質は低いと評価され、療法の種類の間で効果に明確な差は認められなかった。
    condition:
      region: 国際
      対象: 境界性パーソナリティ障害の患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3852
    source: Storebø OJ, Stoffers-Winterling JM, Völlm BA, et al. Psychological therapies for people with borderline personality disorder. Cochrane Database Syst Rev. 2020;(5):CD012955
    doi: 10.1002/14651858.CD012955.pub2
    pmid: '32368793'
    pmcid: PMC7199382
    url: https://doi.org/10.1002/14651858.CD012955.pub2
    source_license: CC 表示なし
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN／OPEN、作り手の調査バッチ97 2026-11-15）：Stoffers-Winterling JM, Storebø OJ, Kongerslev MT, et al. Psychotherapies for borderline personality disorder: a focused systematic review and meta-analysis. Br J Psychiatry. 2022;221(3):538-552／Setkowski K, Palantza C, van Ballegooijen W, et al. Which psychotherapy is most effective and acceptable in the treatment of adults with a (sub)clinical borderline personality disorder? A systematic review and network meta-analysis. Psychol Med. 2023;53:3261-3280（PMID: 35088687／37203447、DOI: 10.1192/bjp.2021.204／10.1017/S0033291723000685、https://creativecommons.org/licenses/by/4.0/）。裏づける部分：部分：候補1（CC BY、主出典と著者群が重なる focused review）は、2020年の Cochrane レビューが75件の無作為化比較試験を含んだことと、その結果として通常治療との比較で症状重症度 SMD −0.52（95%CI −0.70〜−0.33）、自傷 SMD −0.32、自殺関連アウトカム SMD −0.34、心理社会的機能 SMD 0.45 が報告されたことを再掲する。さらに候補1自身の再解析でも DBT の自傷への効果（SMD −0.54）と MBT の自傷（RR 0.51）・自殺関連アウトカム（RR 0.10）への効果が同じ方向で得られ、DBT の主要アウトカムのエビデンスの質は低〜中程度と評価されている。候補2（CC BY のネットワークメタ解析）は、Cochrane レビュー（Storebø et al. 2020）が通常治療に対して d=0.52 の有益な効果と自殺企図 RR 0.27 を見いだしたことを再掲し、特定の療法が他より優れるという明確な答えはないという自らの結論で、療法の種類の間に明確な差がないという骨格を裏づける。ただし参加者総数4,507人は自由な全文に再掲がなく、DBT・MBT の効果の点推定値は候補1自身の再解析の値であって主出典自身の値の再掲ではない（申し送り参照）。数値の照合：症状重症度 SMD −0.52 は候補1の再掲と完全一致する。候補2の d=0.52 は有益な効果の大きさとしての正の表記で、絶対値は一致する（符号の付け方が異なる。申し送り参照）。参加者総数4,507人は候補のいずれにも再掲がない。候補1の DBT・MBT の値は候補1自身の再解析値で主出典の値とは対象範囲が異なるため、主出典の数値の裏づけとして登録しないこと。留保：主出典（SRC-3852）は Cochrane レビューで、PMC 収載コピー（PMC7199382）の権利表示は「© 2020 The Cochrane Collaboration. Published by John Wiley & Sons, Ltd.」でライセンス要素はなく、Crossref の版データにもライセンス登録がなく、現行 RESTRICTED が正しい。候補1は PMC 未収載だが、刊行版 PDF 自体に Creative Commons Attribution licence の表示があり、Crossref の版データでも CC BY 4.0 を確認した。候補2は Crossref の版データ・Europe PMC の個別レコード・PMC 全文のライセンス要素で CC BY 4.0 と個別確認した'
  uncertainty: 数値は抄録で確認した範囲であり、エビデンスの確実性は重症度のアウトカムで中程度、その他は低いと評価されている。国内での各療法の実施体制や保険適用の扱いは本カードでは扱っていない。
