- id: PR-003
  domain: PR
  subdomain: 放火症、窃盗症
  assertion:
    plain_statement_ja: フィンランドで裁判前精神鑑定を受けた反復放火の男性90例（1973〜1993年）の記録調査では、DSM-IV-TR の放火症の診断基準を満たしたのは3例のみであり、主な診断はパーソナリティ障害・精神病・知的障害等でアルコール依存の併存が多く、犯行時にアルコール酩酊状態だった者が68%を占めた。放火行動そのものと放火症の診断は区別される。
    condition:
      region: 国際
      対象: 反復放火で精神鑑定を受けた男性
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3853
    source: 'Lindberg N, Holi MM, Tani P, Virkkunen M. Looking for pyromania: characteristics of a consecutive sample of Finnish male criminals with histories of recidivist fire-setting between 1973 and 1993. BMC Psychiatry. 2005;5:47'
    doi: 10.1186/1471-244X-5-47
    pmid: '16351734'
    pmcid: PMC1325224
    url: https://doi.org/10.1186/1471-244X-5-47
    source_license: CC BY 2.0
    legal_basis: B
    source_class: OPEN
    corroboration: null
  uncertainty: 1973〜1993年のフィンランドの男性犯罪者を対象とした記録調査であり、日本の実態とは異なる可能性がある。放火行動の経験率を放火症の有病率と混同しないこと。
  curriculum:
    kokushi: 医学各論 Ⅱ-6-B-①（放火症、窃盗症、c）
    core_curriculum: 'PS-02-17-05 (id: JkxnuT8)'
