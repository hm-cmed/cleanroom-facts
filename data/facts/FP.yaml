- id: FP-004
  domain: FP
  subdomain: ウイルス性食中毒
  assertion:
    plain_statement_ja: ノロウイルスによる食中毒は、令和7年に事件数462件（全事件数の39.4パーセント）、患者数18,566人（全患者数の75.1パーセント）で、患者数が最も多い病因物質であった。潜伏期間は24〜48時間で、主症状は吐き気、嘔吐、下痢、腹痛、発熱は軽度であり、通常1〜2日で治癒する。食中毒としての感染経路には、感染した食品取扱者を介して汚染された食品を食べた場合（近年増加傾向にある）、汚染された二枚貝を生あるいは加熱不十分で食べた場合、汚染された井戸水等を消毒不十分で摂取した場合がある。対策として、二枚貝などの食品は中心部が85〜90℃で90秒以上の加熱が望まれ、消毒には次亜塩素酸ナトリウムなどが有効で、消毒用エタノールや逆性石鹸では不十分とされる。症状のある食品取扱者を食品を直接取り扱う作業に従事させないことが求められ、症状がなくなっても通常1週間程度、長いときには1か月程度ウイルスの排泄が続くことがある。ワクチンはなく、治療は対症療法に限られる。
    condition:
      region: 日本
      対象: ノロウイルス食中毒
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-060
    source: 厚生労働省『ノロウイルスに関するQ&A』（最終改定：令和3年11月19日。発生状況の表は令和8年6月30日更新）
    doi: null
    pmid: null
    pmcid: null
    url: null
    source_license: 政府標準利用規約に準拠（厚生労働省ウェブサイト利用規約）
    legal_basis: B
    source_class: GOV_JP
    corroboration: null
  uncertainty: 出典は出典マスター登録済み（SRC-060）で、Q1〜Q18 の本文を確認した。Q&A 本体の最終改定は令和3年11月19日だが、発生状況の表は令和8年6月30日に更新されたものと明記されている。令和7年の事件数・患者数は同表および令和7年食中毒発生状況の概要から読み取った。
