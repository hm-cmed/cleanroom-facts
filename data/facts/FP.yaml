- id: FP-010
  domain: FP
  subdomain: 節足動物による疾患
  assertion:
    plain_statement_ja: 日本で人を刺すハチ類には、スズメバチ類16種、アシナガバチ類11種、ミツバチ類2種、マルハナバチ類14種がある。ハチ刺症の受診例は8月にピークがあり、約90パーセントが7〜9月に集中する。死亡例の多くは毒そのものの致死量によるものではなく、I 型（IgE）アレルギーによるものと推測され、死亡は男性が女性の約3倍で、40歳以上の中高年や山間部に多く、農林業従事者が高リスクとされた。当時の厚生省への報告では、ハチ刺症による死亡は年により変動し年30〜40人程度であった。巣に遭遇した際の予防行動として、大声を出したり腕を振ったりせず、身をかがめて素早く離れることが挙げられている。
    condition:
      region: 日本
      対象: ハチ刺傷
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3967
    source: IASR（病原微生物検出情報）月報特集 Vol.18 No.8（No.210）. Hymenopteran stings in Japan（日本におけるハチ刺症）. 1997
    doi: null
    pmid: null
    pmcid: null
    url: null
    source_license: 政府標準利用規約に準拠（厚生労働省ウェブサイト利用規約）
    legal_basis: B
    source_class: GOV_JP
    corroboration: null
  uncertainty: 出典は1997年の特集であり、死亡数を含む数値は当時の報告である。近年の国内死亡数（年20人前後とする二次情報がある）は、人口動態統計の原表で確認できていないため主張に入れていない。ハチ刺傷のアナフィラキシーの一般論と毒免疫療法はアレルギーの分野（第42回 AL）が正であり、本カードは発生時期、高リスク者、回避行動という曝露の側面に限る。
