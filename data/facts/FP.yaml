- id: FP-011
  domain: FP
  subdomain: 毒蛇咬傷
  assertion:
    plain_statement_ja: 国内の毒蛇咬傷（マムシ、ハブ、ヤマカガシ）の診断に使える決定的なマーカーやキットはなく、診断はヘビの同定と毒による症状の観察に基づく。マムシ咬傷では腫脹と疼痛が徐々に広がり、毒の血小板凝集作用で血小板数が低下し、毒が直接血管内に入った場合は急激に低下しうる。ハブ咬傷では30分以内に腫脹が現れ、重症では嘔吐、チアノーゼ、意識消失、低血圧を伴う。ヤマカガシ咬傷は、線溶型の重症の播種性血管内凝固（低フィブリノゲン血症と FDP 上昇）を伴う、生命を脅かす出血症状を起こす。かつて推奨された応急処置としての緊縛、切開、吸引は強く推奨されない。3種とも抗毒素による治療が可能であり、副作用への備えが必要である。
    condition:
      region: 日本
      対象: 毒蛇咬傷患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3968
    source: 'Hifumi T, Sakai A, Kondo Y, Yamamoto A, Morine N, Ato M, Shibayama K, Umezawa K, Kiriu N, Kato H, Koido Y, Inoue J, Kawakita K, Kuroda Y. Venomous snake bites: clinical diagnosis and treatment. J Intensive Care. 2015;3(1):16'
    doi: 10.1186/s40560-015-0081-8
    pmid: '25866646'
    pmcid: PMC4393627
    url: https://doi.org/10.1186/s40560-015-0081-8
    source_license: CC BY 4.0（論文全文の著作権表示で確認）
    legal_basis: B
    source_class: OPEN
    corroboration: null
  uncertainty: マムシとハブの抗毒素（乾燥まむしウマ抗毒素注射用6000単位、乾燥はぶウマ抗毒素注射用6000単位）は国内で承認された製剤であることを、それぞれの医薬品添付文書で確認した。ヤマカガシ抗毒素は国内では未承認であり、使用は適応外使用として臨床研究グループへの参加が必要とされる（出典の総説の記載による）。毒蛇咬傷には届出に基づく全国一本の公式統計がなく、発生数・死亡数は文献や調査ごとに幅があるため、単一の数値は主張に入れていない。
