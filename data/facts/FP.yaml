- id: FP-013
  domain: FP
  subdomain: 旅行者下痢症
  assertion:
    plain_statement_ja: 旅行者下痢症の自己治療は機能的な重症度によって位置づけられる。軽症（我慢でき、支障がない）では抗菌薬は推奨されず、水分補給を基本に、次サリチル酸ビスマスやロペラミドを検討する。中等症（つらい、または支障がある）では抗菌薬を使用でき（アジスロマイシン、フルオロキノロン、非侵襲性の場合はリファキシミン）、ロペラミドは単独または補助として使う。重症（生活不能であり、血性下痢はすべて重症として扱う）では抗菌薬が勧められ、アジスロマイシンが優先され、ロペラミドは補助のみで、血便・発熱がある場合に単独では使わない。用量の例として、アジスロマイシン1,000ミリグラム単回（分割可）または500ミリグラムを1日1回、3日間が示されている。抗菌薬は細菌性の場合に経過を約1〜2日短縮するが、耐性菌の定着のリスクを上げる。
    condition:
      region: 国際
      対象: 旅行者下痢症の患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3970
    source: 'Riddle MS, Connor BA, Beeching NJ, et al. Guidelines for the prevention and treatment of travelers'' diarrhea: a graded expert panel report. J Travel Med. 2017;24(Suppl 1):S57-S74'
    doi: 10.1093/jtm/tax026
    pmid: '28521004'
    pmcid: PMC5731448
    url: https://doi.org/10.1093/jtm/tax026
    source_license: PMC 版の著作権表示に基づく米国政府職員の著作物（米国内ではパブリックドメイン）
    legal_basis: B
    source_class: GOV_US
    corroboration: null
  uncertainty: 本出典は学術誌論文であるが、PMC 版の著作権表示が米国政府職員の著作物であることに基づき GOV_US とした。OPEN とする解釈もありうるため、source_class の最終判定は取り込み側に委ねる。薬剤名については、アジスロマイシンは国内で承認された抗菌薬であるが、旅行者下痢症に対する国内の適応・保険適用の範囲は未確認であり、リファキシミンと次サリチル酸ビスマスの国内承認・保険適用の状況も未確認である。本カードの推奨の枠組みは米国指針の記載として扱う。用量は出典の表から読み取った。
