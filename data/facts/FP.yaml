- id: FP-006
  domain: FP
  subdomain: 化学性食中毒
  assertion:
    plain_statement_ja: ヒスタミン食中毒は、食品中のヒスチジンにヒスタミン産生菌（Morganella morganii など）の酵素が作用して生成したヒスタミンが、高濃度に蓄積された食品を食べることで発症するアレルギー様の食中毒である。主な原因食品は、ヒスチジンを多く含むマグロ、カジキ、カツオ、サバ、イワシ、サンマ、ブリ、アジなどの赤身魚とその加工品である。ヒスタミンは熱に安定で、調理加工の工程で除去できないため、一度生成されると食中毒を防ぐことはできず、予防は原材料の段階から喫食までの一貫した温度管理（速やかな冷蔵・冷凍、エラ・内臓の早期除去、鮮度が低下した魚を使わないこと）が中心になる。症状は摂取後数分から60分ほどで、口の周りや耳たぶの紅潮、頭痛、じんま疹、発熱などが現れる。発生は毎年続いており、令和7年は13件、患者数431人であった。
    condition:
      region: 日本
      対象: ヒスタミン食中毒
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3963
    source: 厚生労働省『ヒスタミンによる食中毒について』
    doi: null
    pmid: null
    pmcid: null
    url: null
    source_license: 政府標準利用規約に準拠（厚生労働省ウェブサイト利用規約）
    legal_basis: B
    source_class: GOV_JP
    corroboration: null
  uncertainty: ヒスタミンの生成には細菌が関与するが、食中毒統計の病因物質の分類では「化学物質」に置かれるため、細菌性食中毒ではなく化学性食中毒として扱った。国内では食品中のヒスタミン濃度の基準値は設定されておらず、有害な物質を含む食品の販売等を禁じる食品衛生法第6条第2号と事業者の衛生管理によって管理されている点は、農林水産省『食品安全に関するリスクプロファイルシート（化学物質）ヒスタミン』（2025年11月28日更新）で確認した（同シートは本カードの出典ではない）。発症量（一般に食品100グラムあたり100ミリグラム以上とされる等）は食品安全委員会のファクトシート紹介資料に基づく二次的な確認のため、主張には入れていない。食物アレルギーとの鑑別はアレルギーの分野が正である。
