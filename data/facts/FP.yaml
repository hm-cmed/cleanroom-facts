- id: FP-003
  domain: FP
  subdomain: 細菌性食中毒
  assertion:
    plain_statement_ja: カンピロバクター食中毒は、わが国で発生している細菌性食中毒の中で近年発生件数が最も多く、年間200件、患者数1,000〜2,000人程度で推移し、令和7年は事件数220件、患者数1,226人であった。主な原因は、生の状態や加熱不足の鶏肉（鶏レバーやささみなどの刺身、鶏肉のタタキ、鶏わさなど）と、調理中の取扱い不備による二次汚染であり、殺菌不十分な井戸水・湧水等による水系感染の事例もある。潜伏期間は一般に1〜7日間とやや長く、下痢、腹痛、発熱などを呈し、多くの患者は1週間ほどで治癒するが、感染した数週間後にギラン・バレー症候群を発症する場合がある。予防は、食肉の中心部を75℃以上で1分間以上加熱すること、食肉は他の食品と調理器具や容器を分けて処理・保存すること、食肉を取り扱った後の手洗いと、食肉に触れた調理器具等の使用後の洗浄・殺菌である。
    condition:
      region: 日本
      対象: カンピロバクター食中毒
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-059
    source: 厚生労働省『カンピロバクター食中毒予防について（Q&A）』（作成：平成19年3月5日、最終改正：令和8年5月27日）
    doi: null
    pmid: null
    pmcid: null
    url: https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/kenkou_iryou/shokuhin/syokuchu/campylobacterqa.html
    source_license: 政府標準利用規約に準拠（厚生労働省ウェブサイト利用規約）
    legal_basis: B
    source_class: GOV_JP
    corroboration: null
  uncertainty: 出典は出典マスター登録済み（SRC-059）で、本体ページを直接開いて発生状況・潜伏期間・症状・原因食品・予防策の文言を確認した。年間の発生件数・患者数の数値は、Q&A に掲載された発生状況の表から読み取った。マスター登録には URL がないため、確認したページの URL をカード側に書き、マスターへの補完を申し送りに提案する。
