- id: FP-008
  domain: FP
  subdomain: 自然毒食中毒
  assertion:
    plain_statement_ja: ドクツルタケの毒成分はアマトキシン類（α、β、γ、ε-アマニチン）とファロトキシン類で、アマトキシンは RNA ポリメラーゼ II を阻害する環状ペプチドであり、成熟したドクツルタケ1本に含まれる量で成人が死亡しうる。中毒の経過は、食後6〜24時間にコレラ様の症状（嘔吐、下痢、腹痛）が現れて約1日でいったん治まった後、24〜72時間で内臓細胞の破壊が進み、肝腫大、黄疸、消化管出血など肝・腎機能障害を呈して死亡することがある。ドクツルタケはシロマツタケモドキ、ハラタケ、ツクリタケなどと誤認されやすく、患者数が最も多いツキヨタケはヒラタケ、ムキタケ、シイタケと誤認される。予防の原則は、食用と確実に判断できないキノコは採らない、食べない、売らない、人にあげないことである。
    condition:
      region: 日本
      対象: 毒キノコによる食中毒
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3965
    source: 厚生労働省「自然毒のリスクプロファイル：ドクツルタケ」
