- id: FP-001
  domain: FP
  subdomain: 細菌性食中毒
  assertion:
    plain_statement_ja: 令和7年（2025年）の食中毒は、事件数1,172件、患者数24,727人、死者数2人であった。病因物質別の事件数はノロウイルス462件（39.4パーセント）、アニサキス280件（23.9パーセント）、カンピロバクター・ジェジュニ／コリ220件（18.8パーセント）の順で多く、患者数はノロウイルス18,566人（75.1パーセント）が最も多かった。食中毒統計で病因物質は、細菌、ウイルス、寄生虫、化学物質、植物性自然毒、動物性自然毒などに区分される。原因施設別では飲食店が事件数の56.1パーセントを占めた。
    condition:
      region: 日本
      対象: 食中毒の発生状況
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3961
    source: 厚生労働省健康・生活衛生局食品監視安全課『令和7年食中毒発生状況の概要報告について』（資料1-1）・『令和7年食中毒発生状況の概要』（資料1-2）. 令和8年6月16日（資料出所は厚生労働省「食中毒統計調査」）
    doi: null
    pmid: null
    pmcid: null
    url: null
    source_license: 政府標準利用規約に準拠（厚生労働省ウェブサイト利用規約）
    legal_basis: B
    source_class: GOV_JP
    corroboration: null
  uncertainty: 数値は厚生労働省「食中毒統計調査」に基づく令和7年分の確定値で、資料の表から読み取ったものを含む。サルモネラ属菌・黄色ブドウ球菌・腸炎ビブリオなど個別菌種の令和7年の事件数・患者数は、公表資料の図表からは読み取れなかったため主張に入れていない。
