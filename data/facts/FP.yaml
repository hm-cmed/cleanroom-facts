- id: FP-002
  domain: FP
  subdomain: 細菌性食中毒
  assertion:
    plain_statement_ja: 食品衛生法第63条第1項により、医師は、食品等による中毒の患者を診断し、又はその死体を検案したときは、直ちに最寄りの保健所長に届け出なければならない。同条第2項により、保健所長は、届出を受けたとき等は速やかに都道府県知事等に報告し、政令で定めるところにより調査を行わなければならず、同条第3項により、都道府県知事等は、省令で定める数を超える中毒患者がある場合などには、直ちに厚生労働大臣に報告しなければならない。
    condition:
      region: 日本
      対象: 食中毒の患者を診断した医師
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3962
    source: 食品衛生法（昭和22年法律第233号）第63条
    doi: null
    pmid: null
    pmcid: null
    url: null
    source_license: 法令本文（著作権法第13条により著作権の目的とならない）
    legal_basis: B
    source_class: GOV_JP
    corroboration: null
  uncertainty: 条文は現行法で確認した。法律の文言は「直ちに」であり、診断から24時間以内に文書・電話・口頭で届け出るという期限は、食中毒統計作成要領（平成6年厚生労働省通知の別添）による運用の記述である（同要領は本カードの出典ではない）。改正前の旧法では届出は第58条に置かれていたが、現行の第58条は食品等の回収の届出の規定であり、混同しないこと。
