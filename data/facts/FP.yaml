- id: FP-012
  domain: FP
  subdomain: 旅行者下痢症
  assertion:
    plain_statement_ja: 旅行者下痢症は最も予測可能な旅行関連疾患で、罹患率は行き先と季節により、2週間で旅行者の30〜70パーセントに達する。「沸かす、調理する、皮をむく、でなければ食べない」という伝統的な食事の心得を守っても発症を確実には防げず、心得を守る人でも罹患するため、レストランの衛生状態と地域の衛生インフラが最大の要因と考えられている。予防として、飲食物の慎重な選択、石鹸による手洗い、手洗いができない場面での60パーセント以上のアルコール手指消毒が挙げられる。非抗菌薬の予防として次サリチル酸ビスマスはメキシコでの研究で旅行者下痢症の発生を約50パーセント減らしたが、禁忌が多く、一般に12歳未満には用いられない。予防的抗菌薬は、旧来の研究で罹患率を大きく下げたものの、ほぼすべての旅行者では副作用や耐性菌の保菌などのリスクが利益を上回るため、免疫不全や重大な併存疾患のある短期の高リスク旅行者にまれに検討するに留められる。
    condition:
      region: 国際
      対象: 海外旅行者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3969
    source: 'Connor BA, Leung DT. Travelers'' Diarrhea. In: CDC Yellow Book 2026. 米国疾病予防管理センター（ページ更新：2026年3月24日）'
    doi: null
    pmid: null
    pmcid: null
    url: null
    source_license: 米国連邦政府の著作物（パブリックドメイン）
    legal_basis: B
    source_class: GOV_US
    corroboration: null
  uncertainty: 出典は米国 CDC の Yellow Book 2026年版の章であり、記載は米国の制度と実践を前提とする。薬剤名については、次サリチル酸ビスマス（BSS）とリファキシミンの国内承認・保険適用の状況は本作成時点で未確認である。病原体の内訳や治療の一般論は感染症の分野が正であり、本カードは旅行という曝露の側面（リスク、飲食物と水の注意、予防の位置づけ）に限る。
