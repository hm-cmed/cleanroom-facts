  uncertainty: 毒成分と中毒の経過、誤認しやすい食用種は厚生労働省のドクツルタケ種別ページで確認した。キノコ食中毒の集計については、厚生労働省リスクプロファイル掲載の表を転載した自治体資料で2015〜2024年の集計（事件237件、患者597人、死亡5人、内訳はツキヨタケ110件・患者305人など）を確認したが、表から読み取った数値であり、期間の異なる別集計（2016〜2025年）とは混用しないため主張には入れていない。海外の総説（Wennig 2020 など）は出典にしていない。
