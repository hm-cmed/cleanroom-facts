- id: FP-009
  domain: FP
  subdomain: 節足動物による疾患
  assertion:
    plain_statement_ja: 重症熱性血小板減少症候群（SFTS）は、マダニにより媒介される SFTS ウイルスによる感染症で、国内では2013年1月に患者（2012年秋に発症）が初めて確認されて以降、2020年まで毎年60〜100名程度の患者が報告され、2021年以降は毎年100名を超え、2025年は過去最高の183名の患者が報告されている（2025年11月2日時点）。潜伏期間はマダニに刺されてから6日〜2週間程度とされ、発熱、全身倦怠感、消化器症状が主な初期症状で、血小板減少、白血球減少を伴い、重症化して死亡することもあり、日本の患者の致命率は27パーセントと報告されている。患者は西日本を中心に報告されてきたが、2025年に関東や北海道で感染した症例が報告され、全国的に感染リスクがあると考えられている。マダニは日本紅斑熱なども媒介する。予防は、特にマダニの活動が盛んな春から秋に、草むらや藪などに入る場合に肌の露出を少なくし、屋外活動後に入浴してマダニに刺されていないか確認することであり、吸血中のマダニに気付いた場合は無理に引き抜こうとせず、医療機関（皮膚科など）で除去してもらう。刺された後、数週間程度は体調の変化に注意し、発熱等の症状が現れた場合は速やかに受診して、マダニに刺されたことを医師に伝える。
    condition:
      region: 日本
      対象: マダニ刺咬と SFTS
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3966
    source: 厚生労働省『重症熱性血小板減少症候群（SFTS）に関するQ&A』（第9版、令和8年10月7日作成）
    doi: null
    pmid: null
    pmcid: null
    url: https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/kenkou_iryou/kenkou/kekkaku-kansenshou19/sfts_qa.html
    source_license: 政府標準利用規約に準拠（厚生労働省ウェブサイト利用規約）
    legal_basis: B
    source_class: GOV_JP
    corroboration: null
  uncertainty: 本体ページ（第9版）を直接開いて、発生状況（Q3、Q13）、致命率（Q18）、潜伏期間（Q22）、予防（Q14）と刺咬時の対応（Q15）を確認した。患者数は表からではなく本文の記述による。薬剤名については、抗ウイルス薬ファビピラビルが2024年6月に SFTS への適応で国内承認されていることを同じ Q&A（Q28）で確認した（治療の詳細は診療の手引きの範囲であり本カードでは扱わない）。日本紅斑熱の発生動向の詳細は感染症としての側面であり本カードでは扱わない（Otsuka 2023 は PMID が未確認のため出典にしていない）。ツツガムシ病は第35回 CM-005 で作成済みであり、作り直していない。
  curriculum:
