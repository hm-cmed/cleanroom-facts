- id: FP-007
  domain: FP
  subdomain: 自然毒食中毒
  assertion:
    plain_statement_ja: フグはテトロドトキシンを保有し、その毒性は魚種と部位で大きく異なり、一般に肝臓、卵巣、皮膚で強いため、食べられる部位は種ごとに定められている。症状は食後20分から3時間で現れ、唇のしびれに始まって四肢・全身へ広がる麻痺を呈し、重症では呼吸困難により死亡する。テトロドトキシンに有効な治療薬・解毒剤はなく、人工呼吸による呼吸の確保と適切なケアが救命の中心であり、フグ毒は塩蔵、水晒し、加熱では無毒化しない。国内のフグ食中毒は近年おおむね年10件前後、患者も年10人前後で、年によって死亡例がある。予防の基本は法令等で定められた魚種・部位の遵守であり、釣ったフグの自家調理や譲渡による重症・死亡例があるため、素人による同定・調理は危険である。
    condition:
      region: 日本
      対象: フグ毒による食中毒
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3964
    source: 厚生労働省「自然毒のリスクプロファイル：魚類：フグ毒」
    doi: null
    pmid: null
    pmcid: null
    url: null
    source_license: 政府標準利用規約に準拠（厚生労働省ウェブサイト利用規約）
    legal_basis: B
    source_class: GOV_JP
    corroboration: null
  uncertainty: 厚生労働省のリスクプロファイル本文で確認した範囲。フグの取扱いは1983年の厚生労働省通知により、有毒部位を確実に除去できると認められた者・施設に限る扱いとされているが、通知本文の全文は未確認であり、免許・資格の形態は自治体ごとに異なるため、制度の詳細は主張に入れていない。
