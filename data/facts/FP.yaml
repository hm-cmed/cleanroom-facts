- id: FP-005
  domain: FP
  subdomain: ウイルス性食中毒
  assertion:
    plain_statement_ja: E型肝炎ウイルスは、豚、イノシシ、シカなどの肉や内臓の生食、あるいは加熱不十分な喫食によって食品を介して感染しうる。日本で食品の摂食とE型急性肝炎の直接の関係が初めて確認された事例では、生のシカ肉を食べた4名が6〜7週間後にE型肝炎を発症し、患者から検出されたウイルスと保存されていたシカ肉から検出されたウイルスの遺伝子配列が一致した。妊婦は感染すると劇症肝炎を発症し死亡する率が高いという研究結果があるため、野生動物の肉等の生食は避けることが望ましく、特に妊婦は控えるべきと周知されている。
    condition:
      region: 日本
      対象: E型肝炎ウイルスの食品媒介感染
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-072
    source: 厚生労働省『E型肝炎に関するQ&A』
    doi: null
    pmid: null
    pmcid: null
    url: null
    source_license: 政府標準利用規約に準拠（厚生労働省ウェブサイト利用規約）
    legal_basis: B
    source_class: GOV_JP
    corroboration: null
  uncertainty: 出典は出典マスター登録済み（SRC-072）で、事例と予防の記述は、この Q&A の元となった平成15年8月1日付け通知の本文で確認した。E型肝炎の疾患としての病態・診断・経過は肝炎の分野（第34回 HV）が正であり、本カードは食品媒介の曝露と予防の側面に限る。A型肝炎ウイルスの食品媒介の側面（潜伏期間が長く原因食品の特定が難しいこと、二枚貝と食品取扱者への対策）は本パートではカードにせず、接点として申し送りに残した。
