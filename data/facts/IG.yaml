- id: IG-008
  domain: IG
  subdomain: 抗菌薬
  assertion:
    plain_statement_ja: 抗菌薬を開始する際は、種類だけでなく、適切な量を適切な投与間隔で、適切なタイミングで投与することが重要であり、腎機能に応じた投与計画をもとにオーダーする。不適正使用には、広域抗菌薬の継続（不適切）、感染症が証明できない場合の継続や標準治療期間の超過（不必要）、投与量・投与間隔・投与方法が患者の腎機能等から推奨と異なる場合（最適でない）がある。
