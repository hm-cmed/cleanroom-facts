- id: IG-004
  domain: IG
  subdomain: 敗血症
  assertion:
    plain_statement_ja: 日本版敗血症診療ガイドライン2024（J-SSCG2024）は日本集中治療医学会と日本救急医学会の合同ガイドラインで、9領域・78の臨床課題を扱い、成人と小児の両方を対象とする。公式バンドルでは、敗血症を疑ったら直ちに血液培養（2セット）の採取、感染巣（疑い）からの検体採取、SOFA スコア算出と乳酸値測定、初期輸液（調整晶質液）を行い、低血圧を伴う場合は初期輸液と並行して早期にノルアドレナリンを開始するとされる。
    condition:
      region: 日本
      対象: 成人および小児
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2189
    source: The Japanese Clinical Practice Guidelines for Management of Sepsis and Septic Shock 2024 (J-SSCG2024). J Intensive Care. 2025;13.
    doi: 10.1186/s40560-025-00776-0
    pmid: '40087807'
    pmcid: PMC11907869
    url: https://doi.org/10.1186/s40560-025-00776-0
    source_license: CC BY 4.0
    legal_basis: B
    source_class: OPEN
    corroboration: null
  uncertainty: 出典は英語版（J Intensive Care 2025、CC BY 4.0）で、2012年の初版から4回目の改訂にあたる。推奨は GRADE による42件、good practice statement 7件、background question 22件。バンドルの内容は日本集中治療医学会の公開 PDF で確認した。日本語版は両学会の和文機関誌に2024年12月に公開されたが、その誌面情報（巻号・頁）はリサーチ時点で確定していない。ノルアドレナリンと調整晶質液は国内の通常診療で用いられる薬剤・輸液であり、本カードの主張は新規薬剤の承認状況に依存しないが、個別の承認・保険適用の詳細は本リサーチでは確認していない。
