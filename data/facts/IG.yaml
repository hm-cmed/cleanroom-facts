    doi: 10.1056/NEJMoa1801550
    pmid: '30380384'
    pmcid: PMC7978499
    url: https://doi.org/10.1056/NEJMoa1801550
    source_license: NEJM の利用条件のみ（CC 表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 米国の10州における調査で、2015年は199病院・12,299人、2011年は183病院・11,282人を対象とした。調整後リスク比は 0.84（95%CI 0.74〜0.95）。日本国内の医療関連感染の発生率の一次統計は本リサーチでは未照合のため主張に入れていない。医療関連感染の個別病態の各論は扱わない。
