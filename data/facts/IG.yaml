- id: IG-001
  domain: IG
  subdomain: 敗血症
  assertion:
    plain_statement_ja: 敗血症は「感染に対する制御不能な宿主反応による生命を脅かす臓器障害」と定義され（Sepsis-3）、臨床的には SOFA スコアの2点以上の上昇で表され、院内死亡率10%超と関連する。敗血症性ショックは、低容量血症がない状態で平均動脈圧65 mmHg 以上の維持に昇圧薬を要し、かつ血清乳酸値が2 mmol/L 超の状態で、院内死亡率40%超と関連する。
    condition:
      region: 国際
      対象: 一般
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2186
    source: Singer M, Deutschman CS, Seymour CW, et al. The Third International Consensus Definitions for Sepsis and Septic Shock (Sepsis-3). JAMA. 2016;315(8):801-810.
    doi: 10.1001/jama.2016.0287
    pmid: '26903338'
    pmcid: PMC4968574
    url: https://doi.org/10.1001/jama.2016.0287
    source_license: CCライセンス表示なし
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: Sepsis-3 では旧定義の「重症敗血症（severe sepsis）」の用語は不要とされた。qSOFA（呼吸数22/分以上、意識変容、収縮期血圧100 mmHg 以下のうち2つ以上）は、病院外・救急外来・一般病棟で予後不良の患者を迅速に拾う指標として位置づけられている。数値と定義は抄録で確認した。
  curriculum:
