- id: IG-002
  domain: IG
  subdomain: 敗血症
  assertion:
    plain_statement_ja: Surviving Sepsis Campaign 2026 では、敗血症性ショックまたは敗血症の可能性が高い場合は抗菌薬を直ちに（理想的には認識から1時間以内）投与し、ショックのない possible sepsis では迅速な評価を行い、感染の懸念が続けば3時間以内に投与する。血液培養は抗菌薬投与前に可及的速やかに採取する。敗血症性ショックの初期の平均動脈圧目標は65 mmHg（65歳以上では60〜65 mmHg）で、低灌流・ショックでは最初の3時間以内に晶質液少なくとも30 mL/kg が提案される。スクリーニングには単一のツールとして qSOFA より NEWS、NEWS2、MEWS、SIRS が推奨される。
    condition:
      region: 国際
      対象: 成人
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2187
    source: 'Prescott HC, Antonelli M, Alhazzani W, et al. Surviving Sepsis Campaign: International Guidelines for Management of Sepsis and Septic Shock 2026. Crit Care Med. 2026;54(4):725-812.'
    doi: 10.1097/CCM.0000000000007075
    pmid: '41869847'
    pmcid: null
    url: https://doi.org/10.1097/CCM.0000000000007075
    source_license: CCライセンス表示なし
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: SSC 2026 は2026年3月に刊行された現行版で、推奨は129件（うち46件が新規または改訂）。Intensive Care Medicine 版（DOI 10.1007/s00134-026-08361-1）も同時掲載されている。全文は有料で PubMed に抄録本文が収載されていないため、本カードの主張はガイドラインのハイライト抄録と要約資料で照合できた範囲に限る。βラクタム薬の持続（延長）投与が強い推奨に格上げされたことも要約資料で確認している。本カードは薬剤のクラス名のみで、国内承認・保険適用の確認を要する個別薬剤名は含まない。
