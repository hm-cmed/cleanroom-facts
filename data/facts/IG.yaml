- id: IG-005
  domain: IG
  subdomain: 培養・検体採取
  assertion:
    plain_statement_ja: 血液培養の検出感度を決める最も重要な因子は培養する血液量であり、培養量を20 mL から40 mL に増やすと検出率は19%上がる。1回の敗血症エピソードの評価では2〜4セットの採取が推奨され、1セットは好気・嫌気のペアボトルで構成し、好気ボトルから先に充填する。
    condition:
      region: 国際
      対象: 一般
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2190
    source: Lamy B, Dargère S, Arendrup MC, Parienti JJ, Tattevin P. How to Optimize the Use of Blood Cultures for the Diagnosis of Bloodstream Infections? A State-of-the Art. Front Microbiol. 2016;7:697.
    doi: 10.3389/fmicb.2016.00697
    pmid: '27242721'
    pmcid: PMC4863885
    url: https://doi.org/10.3389/fmicb.2016.00697
    source_license: CC BY
    legal_basis: B
    source_class: OPEN
    corroboration: null
  uncertainty: 検出率の数値は Li ら 1994 のデータとして本文に記載されたもの。低菌量のモデルでは感度約95%には合計少なくとも30 mL の培養が必要と見積もられている。2セットは4ボトルで、1セットあたり20〜30 mL が一つの目安とされる。汚染率は皮膚消毒の進歩で0.5〜1%まで下がった報告がある一方、2.1〜6%が依然として一般的に報告されている。Europe PMC の全文で確認した。
