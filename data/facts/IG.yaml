- id: IG-009
  domain: IG
  subdomain: 抗菌薬
  assertion:
    plain_statement_ja: 経験的治療の評価と抗菌薬の適正化は、治療開始72時間後に行うことが推奨される。治療開始72時間の時点で細菌感染症の証拠がなければ、抗菌薬の中止を検討する。de-escalation（狭域化）とは、培養で検出された細菌のうち原因菌と考えられる細菌をカバーする狭域スペクトラムの抗菌薬への変更をいい、広域抗菌薬からの狭域化は一般に安全に行えると報告されている。
    condition:
      region: 日本
      対象: 入院患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2193
    source: 厚生労働省. 抗微生物薬適正使用の手引き 第四版 医科・入院編. 2026年（令和8年1月16日発行）
    doi: null
    pmid: null
    pmcid: null
    url: https://www.mhlw.go.jp/content/10900000/001630904.pdf
    source_license: 政府刊行物（厚生労働省）。本文テキストに利用規約の明記は確認できず
    legal_basis: B
    source_class: GOV_JP
    corroboration: null
  uncertainty: 72時間という評価タイミングの根拠の一つとして、血液培養は検査開始から48時間以上陰性であれば99.8%は陰性との報告が手引きに引用されている。極めて重症な患者では想定されるすべての微生物をカバーして開始し、培養結果の判明後に狭域化する進め方が手引きに示されている。de-escalation の有効性に関する系統的レビュー（Ohji 2016）は本カードの出典には含めていない。本カードは特定の薬剤の承認・保険適用に関する主張を含まない。
