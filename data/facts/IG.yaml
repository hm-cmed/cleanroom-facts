  assertion:
    plain_statement_ja: 標準予防策は、感染の有無（疑い・確定を問わない）にかかわらず、医療が提供されるあらゆる場面で全ての患者に適用される感染予防の実践群であり、手指衛生、想定される曝露に応じた手袋・ガウン・マスク・眼の防護・フェイスシールドの使用、安全な注射手技などからなる。2007年版のガイドラインでは、呼吸器衛生・咳エチケット、安全な注射手技、脊髄腔穿刺時のマスク着用が標準予防策に新たに加わった。
    condition:
