- id: IG-018
  domain: IG
  subdomain: 免疫不全宿主
  assertion:
    plain_statement_ja: 宿主防御は、物理的バリア、自然免疫（食細胞、NK細胞、補体）、適応免疫（B・Tリンパ球）が統合された系であり、各要素の欠損が特定の感染症への感受性を決める。抗体（液性免疫）または補体の欠損では化膿性の莢膜保有菌による感染症が多く、食細胞の欠損では皮膚および網内系の細菌・真菌感染症を起こす。無脾では肺炎球菌による敗血症が急速に進行し、最大で50%が致命的となりうる。終末補体を阻害するエクリズマブの使用は髄膜炎菌感染症のリスクとなる。
    condition:
      region: 国際
      対象: 免疫不全患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2201
    source: Dropulic LK, Lederman HM. Overview of Infections in the Immunocompromised Host. Microbiol Spectr. 2016;4(4).
    doi: 10.1128/microbiolspec.DMIH2-0026-2016
    pmid: '27726779'
    pmcid: PMC8428766
    url: https://doi.org/10.1128/microbiolspec.DMIH2-0026-2016
    source_license: Crossref の登録は ASM の非商用 TDM ライセンスのみ（CC 表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 主張は PMC 全文で確認した欠損別の対応の範囲に限る。エクリズマブ（販売名：ソリリス）は国内で承認されていることを PMDA で確認した（2010年に発作性夜間ヘモグロビン尿症で承認され、その後、非典型溶血性尿毒症症候群・全身型重症筋無力症・視神経脊髄炎スペクトラム障害の適応が追加されている）。発熱性好中球減少症など個別の病態の扱いは Ⅶ 血液の範囲であり、本カードでは扱わない。
