- id: IG-003
  domain: IG
  subdomain: 敗血症
  assertion:
    plain_statement_ja: 2017年の世界の敗血症発症は推計4,890万件、敗血症関連死亡は1,100万件で、全世界の死亡の19.7%を占めた。年齢調整後の発症率は1990年から2017年で37.0%、死亡率は52.8%低下したが、負担は依然として大きく、サハラ以南アフリカ、オセアニア、南アジア、東アジア、東南アジアで高い。
    condition:
      region: 国際
      対象: 一般集団
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2188
    source: 'Rudd KE, Johnson SC, Agesa KM, et al. Global, regional, and national sepsis incidence and mortality, 1990-2017: analysis for the Global Burden of Disease Study. Lancet. 2020;395(10219):200-211.'
    doi: 10.1016/S0140-6736(19)32989-7
    pmid: '31954465'
    pmcid: PMC6970225
    url: https://doi.org/10.1016/S0140-6736(19)32989-7
    source_license: CC BY 4.0
    legal_basis: B
    source_class: OPEN
    corroboration: null
  uncertainty: Global Burden of Disease Study による推計で、発症数の95%不確実性区間は3,890万〜6,290万件、全死亡に占める割合の区間は18.2〜21.4%。数値は抄録で確認した。
