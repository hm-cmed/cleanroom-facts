- id: IG-019
  domain: IG
  subdomain: 免疫不全宿主
  assertion:
    plain_statement_ja: 臓器移植受者における重篤な感染症のリスクは、疫学的曝露と免疫抑制の正味の状態（net state of immunosuppression）の相互作用で決まる。曝露のパターン、免疫抑制の管理、抗菌薬予防の内容に基づいて、移植後の時期ごとの感染の鑑別診断のタイムラインを作ることができる。
