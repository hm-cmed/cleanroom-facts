      region: 国際
      対象: 臓器移植受者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2202
    source: Fishman JA. Infection in Organ Transplantation. Am J Transplant. 2017;17(4):856-879.
    doi: 10.1111/ajt.14208
    pmid: '28117944'
    pmcid: null
    url: https://doi.org/10.1111/ajt.14208
    source_license: CC BY-NC-ND 4.0（Crossref 登録）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 主張は抄録で確認できる範囲に限る。移植後の時期区分の具体的な月数は抄録の範囲では確認できなかったため主張に入れていない（本文は購読制で未照合）。移植受者では薬物毒性と免疫抑制薬との相互作用が起こりやすいため、微生物学的診断を具体的に確定することが重要である点も同出典の抄録で確認している。
