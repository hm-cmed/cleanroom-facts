- id: IG-010
  domain: IG
  subdomain: 抗菌薬
  assertion:
    plain_statement_ja: 抗菌薬適正使用プログラム（antibiotic stewardship program）は、入院患者（長期療養を含む）を対象に抗菌薬の最適使用を促すための組織的な取り組みである。IDSAとSHEAによる実装ガイドラインは、多職種の専門家パネルの検討に基づき、抗菌薬の最適使用に影響を与えるための最良のアプローチについて、エビデンスに基づく推奨を行っている。
    condition:
      region: 国際
      対象: 入院患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2194
    source: 'Barlam TF, Cosgrove SE, Abbo LM, et al. Implementing an Antibiotic Stewardship Program: Guidelines by the Infectious Diseases Society of America and the Society for Healthcare Epidemiology of America. Clin Infect Dis. 2016;62(10):e51-e77.'
    doi: 10.1093/cid/ciw118
    pmid: '27080992'
