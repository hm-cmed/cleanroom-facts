- id: IG-017
  domain: IG
  subdomain: 感染対策
  assertion:
    plain_statement_ja: 米国の点有病率調査では、医療関連感染を有する入院患者の割合は2015年に3.2%で、2011年の4.0%より低く、年齢・デバイスの有無・入院から調査までの日数・病院規模で調整したリスクも2015年が16%低かった。頻度の高かった感染は肺炎、消化管感染（その大部分は Clostridioides difficile）、手術部位感染で、有病率低下の主因は手術部位感染と尿路感染の減少であった。
    condition:
      region: 米国
      対象: 米国の入院患者
    differential: null
    common_misconception: null
  provenance:
