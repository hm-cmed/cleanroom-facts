- id: IG-006
  domain: IG
  subdomain: 培養・検体採取
  assertion:
    plain_statement_ja: 日本でも血液培養は同時複数セット採取が推奨され、採取セット数は2〜4セット、1セットあたり20〜30 mL が推奨値とされる。同一エピソードでは2〜4セット（総血液量80 mL）の採取でほとんどの陽性例を検出できるとされる。質の指標として、陽性率（推奨範囲5〜15%）とコンタミネーション率（3%未満）の定期的なモニタリングとフィードバックが重要とされ、2014年に同時2セット採取が診療報酬で算定可能となってから2セット採取が全国的に定着してきた。
    condition:
      region: 日本
      対象: 一般
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2191
    source: 大城健哉. 血液培養検査における Diagnostic Stewardship. 日本臨床微生物学会雑誌. 2022;32(1).
    doi: null
    pmid: null
    pmcid: null
    url: null
    source_license: ©日本臨床微生物学会 2022（CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 学会誌の本文を直接開いて確認した。採取部位はコンタミネーションを避けるため血管内留置カテーテルからではなく静脈穿刺が望ましく、皮膚消毒はポビドンヨードより1%クロルヘキシジンアルコール製剤の方が汚染率が低いとされる。採取のタイミングは悪寒・戦慄時や発熱時のほか、菌血症が疑われる症状が認められた時点とされる。出典の DOI は誌面で確認できず（J-STAGE 側の確認が要る）、PubMed 未収載のため PMID もない。
