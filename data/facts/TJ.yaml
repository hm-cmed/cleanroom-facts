- id: TJ-018
  domain: TJ
  subdomain: 慢性硬膜下血腫
  assertion:
    plain_statement_ja: 症候性の亜急性・慢性硬膜下血腫で手術適応のある患者では、手術に中硬膜動脈塞栓術を併用すると、90日以内に再手術を要した血腫の再発・増大は4.1%であり、手術単独の11.3%より低かった（EMBOLISE試験、400例、相対リスク0.36）。
    condition:
      region: 米国
      対象: 手術適応のある症候性亜急性・慢性硬膜下血腫の患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1934
    source: Davies JM, Knopman J, Mokin M, et al; EMBOLISE Investigators. Adjunctive Middle Meningeal Artery Embolization for Subdural Hematoma. N Engl J Med. 2024;391:1890-1900
    doi: 10.1056/NEJMoa2313472
    pmid: '39565988'
    pmcid: null
    url: https://doi.org/10.1056/NEJMoa2313472
    source_license: N Engl J Med（Massachusetts Medical Society、CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 米国の多施設無作為化試験。塞栓には液体塞栓物質が用いられた。中硬膜動脈塞栓術という手技自体の日本国内での承認・保険適用の状況は本調査では未確認であり、本票は米国の試験結果の記述にとどめる。（出典内の位置：抄録）
