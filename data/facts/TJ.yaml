- id: TJ-001
  domain: TJ
  subdomain: 頭部外傷総論
  assertion:
    plain_statement_ja: 重症頭部外傷（GCS 8以下）では、低血圧（収縮期血圧90mmHg未満）と低酸素がそれぞれ独立して転帰を悪化させる二次性脳損傷の要因であり、前向きコホート717例では低血圧が34.6%に生じ、死亡率の150%増加と関連した。このため受傷直後から蘇生期を通じて低血圧と低酸素を回避することが、二次性脳損傷予防の基本である。
    condition:
      region: 国際
      対象: 重症頭部外傷の患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1922
    source: Chesnut RM, Marshall LF, Klauber MR, et al. The role of secondary brain injury in determining outcome from severe head injury. J Trauma. 1993;34(2):216-222
    doi: 10.1097/00005373-199302000-00006
    pmid: '8459458'
    pmcid: null
    url: https://doi.org/10.1097/00005373-199302000-00006
    source_license: J Trauma（Wolters Kluwer、CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: Traumatic Coma Data Bank の前向き検討（1993年）。低血圧・低酸素の定義は同論文の定義（収縮期血圧90mmHg未満、PaO2 60mmHg以下等）による。（出典内の位置：抄録）
