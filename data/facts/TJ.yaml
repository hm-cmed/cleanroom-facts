- id: TJ-005
  domain: TJ
  subdomain: 脳挫傷
  assertion:
    plain_statement_ja: 脳挫傷は前頭葉と側頭葉の下部・下外側面に好発する。打撃部位の直下に生じるものを coup（直撃）損傷、打撃と反対側に生じるものを contrecoup（反衝）損傷といい、後頭部への打撃では前頭葉の反衝損傷が生じやすい。
    condition:
      region: 国際
      対象: 脳挫傷の患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1925
    source: Jirlow U, Hossain I, Korhonen O, Depreitere B, Rostami E. Cerebral contusions - Pathomechanism, predictive factors for progression and historical and current management. Brain Spine. 2024;4:103329
    doi: 10.1016/j.bas.2024.103329
    pmid: '39281852'
    pmcid: PMC11402187
    url: https://doi.org/10.1016/j.bas.2024.103329
    source_license: CC BY-NC-ND 4.0
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 好発部位と coup・contrecoup の機序は同総説の本文（病態機序の節と部位別頻度の表）で確認した。（出典内の位置：本文の病態機序の節）
