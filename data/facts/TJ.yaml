- id: TJ-044
  domain: TJ
  subdomain: 末梢神経損傷
  assertion:
    plain_statement_ja: 損傷した末梢神経の軸索再生の速さは約1mm/日が目安とされるが、この値は再生が始まるまでの潜伏期を含む複合的な値であり単純化である。回復の進行は、Tinel 徴候が損傷部から遠位へ前進することで臨床的に追跡できる。
    condition:
      region: 国際
      対象: 末梢神経損傷患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1961
    source: Duraku LS, Eberlin KR, Moore A, et al. Ten Myths in Nerve Surgery. Plast Reconstr Surg Glob Open. 2024
    doi: 10.1097/GOX.0000000000006017
    pmid: '39534076'
    pmcid: null
    url: https://doi.org/10.1097/GOX.0000000000006017
    source_license: CC BY 4.0
    legal_basis: B
    source_class: OPEN
    corroboration: null
  uncertainty: 同論文は、低グレードの損傷では Tinel 徴候が最大で4mm/日進むこともあると述べ、1mm/日という値を絶対視しない立場である。 （出典内の位置：本文（神経再生速度と Tinel 徴候の節））
