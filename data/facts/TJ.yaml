- id: TJ-002
  domain: TJ
  subdomain: 頭部外傷総論
  assertion:
    plain_statement_ja: Brain Trauma Foundation の重症頭部外傷ガイドライン第4版（2017）は、GCS 3〜8の重症頭部外傷を対象とする国際的な診療ガイドラインであり、二次性脳損傷を防ぐための血圧・頭蓋内圧・脳灌流圧の閾値管理を含む推奨を、治療・モニタリング・閾値の3領域に分けて提示している。
    condition:
      region: 国際
      対象: 重症頭部外傷（GCS 3〜8）の患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1923
    source: Carney N, Totten AM, et al. Guidelines for the Management of Severe Traumatic Brain Injury, Fourth Edition. Neurosurgery. 2017;80(1):6-15
    doi: 10.1227/NEU.0000000000001432
    pmid: '27654000'
    pmcid: null
    url: https://doi.org/10.1227/NEU.0000000000001432
    source_license: Neurosurgery（Oxford University Press、CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 血圧閾値の具体的な数値（年齢別の収縮期血圧の下限）はガイドライン本文の推奨事項に記載されるが、本調査では抄録と公式要約で推奨項目の構成を確認した範囲にとどめ、本票の命題には数値を含めていない。（出典内の位置：抄録および推奨項目の構成）
