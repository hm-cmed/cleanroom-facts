- id: TJ-040
  domain: TJ
  subdomain: 捻挫
  assertion:
    plain_statement_ja: 軟部組織損傷の管理として、従来の RICE・PRICE が急性期のみを対象としていたのに対し、受傷直後の PEACE（保護、挙上、抗炎症手段の回避、圧迫、教育）と数日以降の LOVE（負荷、楽観、血流促進、運動）を組み合わせた PEACE & LOVE が提唱され、回復の全期間を対象とする。
