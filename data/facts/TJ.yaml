- id: TJ-049
  domain: TJ
  subdomain: コンパートメント症候群
  assertion:
    plain_statement_ja: 脛骨骨幹部骨折で前方区画圧を持続測定した前向き研究では、拡張期血圧から区画内圧を差し引いた差圧（ΔP）が30mmHg未満に低下した場合に筋膜切開を行う判断基準により、区画症候群の見逃しはなかった。区画内圧の絶対値だけを基準にすると、不要な筋膜切開が大幅に増える。
    condition:
      region: 国際
      対象: 脛骨骨幹部骨折患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1966
