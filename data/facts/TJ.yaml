- id: TJ-004
  domain: TJ
  subdomain: 頭部外傷総論
  assertion:
    plain_statement_ja: 日本の頭部外傷診療では、日本脳神経外科学会・日本脳神経外傷学会が監修する『頭部外傷治療・管理のガイドライン第4版』（2019年、医学書院）が現行の標準的なガイドラインであり、重症度は GCS で評価され、GCS 13〜15は軽症頭部外傷とされる。
