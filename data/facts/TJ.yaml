- id: TJ-038
  domain: TJ
  subdomain: 開放骨折
  assertion:
    plain_statement_ja: 開放骨折の初期治療では、英国の BOAST 標準（2017年）に基づき、予防的抗菌薬をできる限り早期（受傷後1時間以内が理想）に静脈投与し、創の洗浄とデブリドマンは、高度の汚染がある場合は直ちに、その他の高エネルギー骨折では受傷後12時間以内、低エネルギー骨折では24時間以内に行い、確定的な軟部組織被覆は受傷後72時間以内に完了させる。
