- id: TJ-041
  domain: TJ
  subdomain: 関節内骨折
  assertion:
    plain_statement_ja: 関節内骨折を含む重大な関節損傷では、受傷時に生じた関節面の損傷を起点として外傷後変形性関節症が進行し、重大な靱帯・半月板損傷や関節面損傷を受けた人の40%以上が変形性関節症を発症する。このため関節内骨折では、関節面の段差を残さない解剖学的整復が治療の要となる。
