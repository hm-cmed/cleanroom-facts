- id: TJ-048
  domain: TJ
  subdomain: コンパートメント症候群
  assertion:
    plain_statement_ja: 区画（コンパートメント）症候群は、筋区画内の圧上昇によって局所の循環が障害される状態であり、外傷が最も多い原因である。古典的な徴候として痛み、蒼白、脈拍消失、知覚異常、麻痺の5つ（5P）が挙げられるが、診断の遅れは壊死や拘縮などの重大な後遺症を招くため、臨床経過の早期所見から疑って緊急に介入する必要がある。
    condition:
      region: 国際
      対象: 区画症候群が疑われる患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1965
    source: 'Garner MR, Taylor SA, Gausden E, Lyden JP. Compartment syndrome: diagnosis, management, and unique concerns in the twenty-first century. HSS J. 2014;10(2):143-151'
    doi: 10.1007/s11420-014-9386-8
    pmid: '25050098'
    pmcid: null
    url: https://doi.org/10.1007/s11420-014-9386-8
    source_license: HSS Journal（Springer、CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 5P は古典的な徴候の列挙であり、脈拍消失や麻痺は進行期の所見である。臨床所見の詳細は総説本文の臨床経過の節に基づく。診断の客観的基準（差圧）は TJ-049 を参照。 （出典内の位置：抄録（病態と診断遅延の重大性）および本文（臨床経過の節））
