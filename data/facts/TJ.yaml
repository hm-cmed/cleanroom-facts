  assertion:
    plain_statement_ja: 急性硬膜下血腫は、脳表を走る架橋静脈の断裂によって生じ、頭部CTでは三日月型の高吸収域として描出される。脳挫傷などの脳実質損傷を合併することが多く、硬膜外血腫に比べて転帰が不良な病変である。
