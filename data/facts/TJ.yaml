  uncertainty: 書籍のため DOI・PMID はない。第4版の正式書名は『頭部外傷治療・管理のガイドライン』であり、第3版までの『重症頭部外傷治療・管理のガイドライン』から改題されている。軽症の定義（GCS 13〜15）は同ガイドライン第4版に基づく解説論文（J-STAGE）で確認した。（出典内の位置：ガイドライン第4版の総論・重症度分類）
