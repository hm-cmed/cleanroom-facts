    corroboration: null
  uncertainty: BOAST は英国の学会標準文書で DOI・PMID はない。基準値は BOAST を引用した Cochrane レビューの表でも照合した。日本の診療体制へのそのままの適用は未検証。抗菌薬の具体的な薬剤名は施設のプロトコルによるため本カードでは特定の薬剤を挙げていない。 （出典内の位置：BOAST 本文の基準（抗菌薬・デブリドマン・被覆の timing））
