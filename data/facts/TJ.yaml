- id: TJ-075
  domain: TJ
  subdomain: 複合性局所疼痛症候群
  assertion:
    plain_statement_ja: 複合性局所疼痛症候群の診断に用いるBudapest基準（臨床用）は、従来のIASP基準と比べて感度をほぼ同等に保ちながら（0.99対1.00）、特異度を0.41から0.68へ改善したことが、CRPSタイプ1の患者113例と神経障害性疼痛患者47例を対象とした検証研究で示された。
    condition:
      region: 国際
      対象: 四肢の外傷・手術後に生じた複合性局所疼痛症候群が疑われる患者
    differential: null
    common_misconception: null
  provenance:
