- id: TJ-050
  domain: TJ
  subdomain: 挫滅症候群
  assertion:
    plain_statement_ja: 挫滅（圧挫）症候群は、長時間圧迫された骨格筋が再灌流されることで、高カリウム血症やミオグロビンによる急性腎障害などの全身合併症を来す病態であり、災害時の国際推奨では、救出の段階から大量の輸液を開始して急性腎障害の予防を図ることが中核とされる。
