    source_license: N Engl J Med（Massachusetts Medical Society、CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 国際多施設無作為化試験。治療失敗は再発・残存血腫の増大、再手術・救済手術、重大な障害性脳卒中・心筋梗塞・神経学的死亡の複合評価項目である。日本国内での同手技の承認・保険適用の状況は本調査では未確認。（出典内の位置：抄録）
