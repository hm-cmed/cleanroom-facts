- id: TJ-003
  domain: TJ
  subdomain: 頭部外傷総論
  assertion:
    plain_statement_ja: Glasgow Coma Scale（GCS）は、開眼（4段階）・言語反応（5段階）・運動反応（6段階）の3要素で意識障害の程度を評価する尺度であり、合計点は3〜15点である。
    condition:
      region: 国際
      対象: 意識障害の評価対象となる患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1806
    source: Teasdale G, Jennett B. Assessment of coma and impaired consciousness. A practical scale. Lancet. 1974;2(7872):81-84
    doi: 10.1016/S0140-6736(74)91639-0
    pmid: '4136544'
    pmcid: null
    url: https://doi.org/10.1016/S0140-6736(74)91639-0
    source_license: The Lancet（Elsevier、テキストマイニング用ライセンスのみでCC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: Teasdale と Jennett が1974年に提唱した原著。PubMed に抄録本文が収載されていないため、3要素の段階数は原著の尺度構成に基づく。（出典内の位置：原著論文の尺度定義）
