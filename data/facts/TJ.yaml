- id: TJ-008
  domain: TJ
  subdomain: 脳振盪
  assertion:
    plain_statement_ja: スポーツ関連脳振盪からの競技復帰は、段階的に負荷を上げる段階的復帰戦略（return-to-sport strategy）に従って進め、進行は症状によって制限され（現在の脳振盪に関連する症状の軽度で短時間の増悪を超えない範囲）、無制限の競技復帰の前に学習への完全な復帰（return-to-learn）を終えることが推奨される。
