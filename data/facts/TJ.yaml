    doi: 10.1302/0301-620X.78B1.0780099
    pmid: '8898137'
    pmcid: null
    url: https://doi.org/10.1302/0301-620X.78B1.0780099
    source_license: The Journal of Bone and Joint Surgery (Br)（CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 脛骨骨幹部骨折・前方区画での前向き研究（116例）の結果であり、ほかの部位への外挿は未検証。緊急筋膜切開の遅れは Volkmann 拘縮などの後遺症につながるため、基準を満たせば速やかな切開が予防にもなる。 （出典内の位置：抄録）
