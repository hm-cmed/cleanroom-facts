    source_class: RESTRICTED
    corroboration: null
  uncertainty: 数値（追跡期間・割合）は PubMed 抄録で確認。このコホートでは冠状面5度以上の角状変形を変形治癒として集計しており、部位・変形の種類ごとの許容範囲の基準そのものはこの出典では扱っていない。組み立て時に追加したカード（担当パートの出典枠が埋まっていたため）。
