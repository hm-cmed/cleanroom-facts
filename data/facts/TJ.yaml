- id: TJ-076
  domain: TJ
  subdomain: 変形治癒
  assertion:
    plain_statement_ja: 変形治癒骨折は、骨折が角状・回旋・短縮などの変形を残して癒合した状態である。脛骨骨幹部骨折の長期追跡（受傷後30〜43年、164例）では29%が冠状面で5度以上の角状変形を残して治癒したが、変形そのものと変形性関節症の発症との関連は概して弱く、同側の足関節・距骨下関節の関節症所見の頻度が高いことと、10mm以上の短縮が膝痛と関連することが示された。
    condition:
      region: 英国
      対象: 脛骨骨幹部骨折の成人（長期追跡コホート）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1942
    source: 'Milner SA, Davis TR, Muir KR, Greenwood DC, Doherty M. Long-term outcome after tibial shaft fracture: is malunion important? J Bone Joint Surg Am. 2002;84(6):971-980'
    doi: 10.2106/00004623-200206000-00011
