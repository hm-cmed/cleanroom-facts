    pmid: '20493633'
    pmcid: PMC2914601
    url: https://doi.org/10.1016/j.pain.2010.04.030
    source_license: Pain（Elsevier、CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 研究用のBudapest基準では特異度は0.79であった（同出典）。タイプ1（明らかな末梢神経損傷を伴わない）とタイプ2（伴う）の区別はIASPの分類によるもので、本検証研究の対象はタイプ1である。早期の理学療法の有効性は本出典の検討対象ではない。（出典内の位置：抄録）
