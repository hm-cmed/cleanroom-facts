  uncertainty: 推奨の具体的内容は推奨集本文の推奨項目に基づく（抄録は推奨集の目的と策定過程のみ）。災害時の多数傷病者を主対象とした推奨であり、日常診療における単発の挫滅症候群への適用は状況に応じて判断される。 （出典内の位置：推奨集本文の推奨項目（輸液と全身合併症への対応））
