- id: TJ-036
  domain: TJ
  subdomain: 四肢骨折
  assertion:
    plain_statement_ja: 骨折治療の原則は、解剖学的整復、安定した固定、血行の保持、早期の自動運動である（AO の原則）。絶対的安定が得られた骨折部では仮骨を介さない直接（一次）治癒が、相対的安定のもとでは仮骨を介する間接（二次）治癒が生じる。
