- id: TJ-016
  domain: TJ
  subdomain: 慢性硬膜下血腫
  assertion:
    plain_statement_ja: 慢性硬膜下血腫は高齢者に多く、発生率は10万人年あたり1.7〜20.6と報告されている。外傷を契機として形成された被膜の脆弱な新生血管からの繰り返す出血によって拡大し、手術治療では穿頭術（穿頭洗浄術）が最も一般的に用いられ、再発は10〜20%に生じる。
    condition:
      region: 国際
      対象: 慢性硬膜下血腫の患者（主に高齢者）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1932
    source: 'Feghali J, Yang W, Huang J. Updates in Chronic Subdural Hematoma: Epidemiology, Etiology, Pathogenesis, Treatment, and Outcome. World Neurosurg. 2020;141:339-345'
    doi: 10.1016/j.wneu.2020.06.140
    pmid: '32593768'
    pmcid: null
    url: https://doi.org/10.1016/j.wneu.2020.06.140
    source_license: World Neurosurg（Elsevier、© 2020 Elsevier Inc.、CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 発生率の範囲は同総説が引用する疫学報告による。軽微な外傷でも発症しうることは、高齢者では受傷歴がはっきりしない例があることとあわせて臨床的に知られるが、本票では外傷を契機とする被膜形成の記述までを同総説で確認した範囲とした。（出典内の位置：抄録）
