- id: TJ-006
  domain: TJ
  subdomain: 脳挫傷
  assertion:
    plain_statement_ja: 脳挫傷は受傷後の時間経過とともに画像所見が変化しうる病変であり、多施設後方視研究では、受傷後早期の臨床的増悪は追跡CTにおける正中線偏位の出現・増大と脳槽圧排の進行と関連し、血腫量や浮腫量の増大そのものとは関連しなかった。臨床的増悪と正中線偏位・脳槽圧排の組み合わせが手術を考える指標とされた。
    condition:
      region: 国際
      対象: 脳挫傷の患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1926
    source: 'Iaccarino C, Schiavi P, Picetti E, et al. Patients with brain contusions: predictors of outcome and relationship between radiological and clinical evolution. J Neurosurg. 2014;120(4):908-918'
    doi: 10.3171/2013.12.JNS131090
    pmid: '24506250'
    pmcid: null
    url: https://doi.org/10.3171/2013.12.JNS131090
    source_license: J Neurosurg（American Association of Neurological Surgeons、CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: イタリアの多施設後方視研究（2008〜2011年、11施設）。遅発性に出現する新規血腫については TJ-020 を参照。（出典内の位置：抄録）
