- id: TJ-019
  domain: TJ
  subdomain: 慢性硬膜下血腫
  assertion:
    plain_statement_ja: 症候性慢性硬膜下血腫では、標準治療（手術または保存的管理）に中硬膜動脈塞栓術を併用すると、180日以内の治療失敗は16%であり、標準治療のみの36%より低く、30日以内の重大な障害性脳卒中または死亡は増えなかった（STEM試験、310例）。
