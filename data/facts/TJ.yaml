  uncertainty: 架橋静脈の断裂と三日月型の形状は同ガイドライン本文等の標準的記述に基づく。本調査では抄録で手術適応（TJ-015）を確認しており、本票の特徴の記述は取り込み側での本文照合を推奨する。転帰の比較は定性的な記述であり、死亡率の数値は扱っていない。（出典内の位置：ガイドライン本文の総論部分）
