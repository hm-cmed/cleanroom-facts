- id: TJ-043
  domain: TJ
  subdomain: 末梢神経損傷
  assertion:
    plain_statement_ja: 外傷性末梢神経損傷は、Seddon 分類では伝導障害のみで軸索が保たれる neurapraxia、軸索が断裂するが結合組織の鞘が保たれる axonotmesis、神経幹が完全に断裂する neurotmesis に分類され、Sunderland 分類では結合組織の損傷の程度によりさらに5段階に細分される。修復の要否とタイミングは損傷の型によって異なる。
    condition:
      region: 国際
      対象: 外傷性末梢神経損傷患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1960
    source: Campbell WW. Evaluation and management of peripheral nerve injury. Clin Neurophysiol. 2008;119(9):1951-1965
    doi: 10.1016/j.clinph.2008.03.018
    pmid: '18482862'
    pmcid: null
    url: https://doi.org/10.1016/j.clinph.2008.03.018
    source_license: Clinical Neurophysiology（Elsevier、CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: Sunderland 分類の5段階の詳細は総説本文に基づく。近位の損傷では、遠位の筋が再支配されるまでの距離が長く、不可逆的変化が起こる前に再支配できないことが問題となる（同総説）。 （出典内の位置：抄録（Seddon 分類の3型と修復タイミング）および本文（Sunderland 分類））
