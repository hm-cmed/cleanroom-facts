  subdomain: null
  assertion:
    plain_statement_ja: 心血管疾患の二次予防として低用量アスピリンを服用中の患者が消化性潰瘍出血を起こした場合、再出血リスクが低ければ、内視鏡直後からアスピリンを再開することが推奨される。
    condition:
      region: EU
      guideline: ESGE 2015（2021/2026で表現は要確認）
    differential:
    - 一次予防目的のアスピリンは中止を検討
