  assertion:
    plain_statement_ja: 上部消化管出血の入院患者では、Hb 7 g/dLを閾値とする制限輸血が提案されている。
    condition:
      region: US
      guideline: ACG 2021（条件付き推奨, 低い質）
    differential:
    - 低血圧例や心血管疾患合併例では、より高い閾値を考慮する
    - Villanueva 2013では、制限輸血の死亡率上の利益はChild-Pugh A/Bの肝硬変例（4% vs 12%）でみられたが、Child-Pugh C（38% vs 41%, P=0.91）ではみられなかった。急性冠症候群、脳卒中・TIA、大量出血は除外されていた（Wiki Journal Clubの要約）
    common_misconception: Hb 10 g/dLを保つように輸血するほど予後が良い
  provenance:
