- id: NB-011
  domain: NB
  subdomain: 未熟児無呼吸発作
  assertion:
    plain_statement_ja: 未熟児無呼吸に対するカフェイン療法の大規模無作為化試験（出生体重500から1,250 g の2,006人）では、修正36週の時点で酸素投与を受けていた児の割合はカフェイン群で36%（350/963人）、プラセボ群で47%（447/954人）であり、カフェインは気管支肺異形成の発生率を下げた（調整オッズ比0.63、95%信頼区間0.52から0.76）。陽圧換気の中止はカフェイン群で1週早かった
