- id: NB-023
  domain: NB
  subdomain: 頭蓋内出血
  assertion:
    plain_statement_ja: 早産児の脳室内出血は、神経・グリア前駆細胞に富み高度に血管化した胚芽基質から始まる。その病因は多因子性で、中心となるのは胚芽基質の血管の内在的な脆弱性と脳血流の変動である。血管が脆い理由として、血管新生の途上にある血管に周皮細胞が乏しいこと、基底膜が未熟であること、血管を鞘のように覆うアストロサイトの足突起でGFAPが欠乏していることが挙げられ、VEGFとアンジオポエチン2の高値が急速な血管新生を促している
    condition:
      region: 国際
      対象: 早産児
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3439
    source: 'Ballabh P. Intraventricular hemorrhage in premature infants: mechanism of disease. Pediatr Res. 2010;67(1):1-8'
    doi: 10.1203/PDR.0b013e3181c1b176
    pmid: '19816235'
    pmcid: PMC2799187
    url: https://doi.org/10.1203/PDR.0b013e3181c1b176
    source_license: CC 表示を確認できず
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 重症度分類（Papile分類）の各グレードの定義文は原典（Papile 1978）の本文で未照合のため主張に入れていない。正期産児の頭蓋内出血（分娩外傷に伴う硬膜下出血など）は本カードの範囲外であり、分娩外傷の項目（NB-030）と分けた
