- id: NB-008
  domain: NB
  subdomain: 呼吸窮迫症候群<RDS>
  assertion:
    plain_statement_ja: 細径カテーテルでサーファクタントを投与する低侵襲投与法（LISA）と、挿管して投与後に抜管する INSURE 法を比較した系統的レビュー（在胎36週未満の呼吸窮迫症候群を対象とする無作為化試験16件、1,944人）では、LISA 群で CPAP と人工換気の期間が短く、INSURE 群で生後72時間以内の人工換気、気胸、脳室内出血、死亡のリスクが高かった
    condition:
      region: 国際
      対象: 早産児
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3361
    source: 'Silveira RC, Panceri C, Muñoz NP, et al. Less invasive surfactant administration versus intubation-surfactant-extubation in the treatment of neonatal respiratory distress syndrome: a systematic review and meta-analyses. J Pediatr (Rio J). 2024;100(1):8-24'
    doi: 10.1016/j.jped.2023.05.008
    pmid: '37353207'
    pmcid: PMC10751720
    url: https://doi.org/10.1016/j.jped.2023.05.008
    source_license: CC BY-NC-ND 4.0（Crossref と PMC で確認）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: サーファクタント製剤の国内承認と保険適用の状況は NB-007 と同じである（サーファクテンが薬価収載されている）。レビューに含まれる製剤の内訳と国内製剤との対応は未照合である
  curriculum:
    kokushi: 医学各論 Ⅰ-3-D-①（呼吸窮迫症候群<RDS>、a）
