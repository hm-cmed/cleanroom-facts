- id: NB-005
  domain: NB
  subdomain: 巨大児
  assertion:
    plain_statement_ja: 巨大児（macrosomia）は、在胎期間にかかわらず絶対的な出生体重が一定の閾値（歴史的には4,000 g または4,500 g）を超えた成長を指し、統一された定義は確立していない。在胎期間に対する出生体重が90パーセンタイル以上の LGA とは区別される。出生体重が増えるにつれて、分娩異常、肩甲難産、分娩外傷、新生児の永続的障害の可能性が高まる
    condition:
      region: 米国
      対象: 新生児
    differential: null
    common_misconception: null
  provenance:
