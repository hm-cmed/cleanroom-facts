- id: NB-027
  domain: NB
  subdomain: 低体温症
  assertion:
    plain_statement_ja: 新生児低体温は、資源の限られた環境を対象とした系統的レビューで、病院出生では32%から85%、家庭出生では11%から92%の範囲の有病率が報告され、熱帯地域でも起こるありふれた所見である。低体温そのものが直接の死因となることはまれだが、重症の新生児感染症、早産、仮死といった病態に併存する形で、新生児死亡の相当な割合に関与している
    condition:
