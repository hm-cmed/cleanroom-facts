- id: NB-002
  domain: NB
  subdomain: 新生児仮死
  assertion:
    plain_statement_ja: Apgar スコアは、出生直後の新生児の状態と、蘇生が必要な場合のその反応を報告するための、受け入れられた簡便な方法である。Apgar スコア単独では仮死の証拠とはみなされず、個々の新生児の死亡や神経学的転帰を予測する目的に使うべきではない。蘇生中につけた Apgar スコアは自発呼吸のある児につけたスコアと同等ではなく、同時に行われた蘇生介入を記録できる拡大 Apgar スコア記録様式の使用が推奨されている
