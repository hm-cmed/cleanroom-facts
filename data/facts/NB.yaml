    pmid: '23369256'
    pmcid: PMC3606398
    url: https://doi.org/10.1186/1741-7015-11-24
    source_license: CC BY（Europe PMC のライセンス欄で確認）
    legal_basis: B
    source_class: OPEN
    corroboration: null
  uncertainty: 資源の限られた環境のデータであり、日本の施設出生における頻度を表すものではない。低体温の定義の閾値は研究間で異なっており、統一した定義とデータ収集の必要性が出典でも指摘されている。WHOの新生児保温に関する実践ガイド（1997年）の書誌は未確定のため出典にしていない
