- id: NB-026
  domain: NB
  subdomain: 未熟児網膜症
  assertion:
    plain_statement_ja: 未熟児網膜症は、未熟な網膜組織に起こる病理過程であり、牽引性網膜剥離へと進展して、視力障害や失明の原因になる。重症の未熟児網膜症に対する有効な治療は30年以上前から存在するが、治療が効果を上げるためには、リスクのある早産児を適切な時期と間隔で連続的に検査し、破壊的になる前に変化を捉える必要がある。米国小児科学会の2018年改訂の政策声明は、初回検査と経過観察の時期を含む、効果的な検出プログラムの要件を示したものである
    condition:
