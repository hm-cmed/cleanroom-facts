- id: NB-025
  domain: NB
  subdomain: 頭血腫
  assertion:
    plain_statement_ja: 頭血腫の多くは約30日以内に自然に吸収されるが、石灰化などの合併症が起こりうる。石灰化した頭血腫は、頭蓋の変形による永続的な整容上の変化や心理社会的影響を残しうるため、速やかな評価が勧められる。頭血腫は、分娩外傷や吸引・鉗子の使用がなくても発生しうる
    condition:
      region: 国際
      対象: 新生児、乳児
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3441
    source: Urban S, Pearce J, Malcolm N, Eskandari R. A calcified cephalohematoma in a 1-month-old infant requiring surgery. SAGE Open Med Case Rep. 2025;13:2050313X251401111
    doi: 10.1177/2050313X251401111
    pmid: '41415326'
    pmcid: PMC12708991
    url: https://doi.org/10.1177/2050313X251401111
    source_license: CC BY-NC（Europe PMC のライセンス欄で確認）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 症例報告と、それに付随する総説部分（疫学・治療・予後）に基づく。頭血腫の発生率や頭蓋骨骨折の合併率などの数値は、一次資料で確認できていない。骨膜下に限局して骨縫合を超えないという帽状腱膜下出血との区別は教科書的な鑑別点であり、本出典の抄録では確認していないため主張に入れていない
