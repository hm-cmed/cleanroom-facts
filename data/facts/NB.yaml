    source: Zwiers C, Scheffer-Rath ME, Lopriore E, de Haas M, Liley HG. Immunoglobulin for alloimmune hemolytic disease in neonates. Cochrane Database Syst Rev. 2018;(3):CD003313
    doi: 10.1002/14651858.CD003313.pub2
    pmid: '29551014'
    pmcid: PMC6494160
    url: https://doi.org/10.1002/14651858.CD003313.pub2
    source_license: CC 表示を確認できず
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: AAPの2022年版ガイドラインでも、IVIGの交換輸血回避効果は不明確で壊死性腸炎による有害の可能性が示されたとして、使用を制限する方向に変わっている（同ガイドラインの技術報告書の評価）。IVIGの新生児溶血性疾患への国内承認・保険適用は未確認。新生児側の治療に絞り、胎児側の評価・治療は第48回 FT、母体の感作予防は第46回 PG が正である
