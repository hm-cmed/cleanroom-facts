- id: NB-003
  domain: NB
  subdomain: 低出生体重児、早期産児
  assertion:
    plain_statement_ja: 早産は妊娠37週が完了する前に出生した生児を指す。2020年に世界で推計1,340万人（全出生の9.9%）が早産で出生し、2010年の1,380万人（9.8%）から割合はほぼ横ばいであった。早産児の約65%は南アジアとサハラ以南アフリカに集中する
    condition:
      region: 国際
      対象: 早産児
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3357
    source: 'Ohuma EO, Moller AB, Bradley E, et al. National, regional, and global estimates of preterm birth in 2020, with trends from 2010: a systematic analysis. Lancet. 2023;402(10409):1261-1271'
    doi: 10.1016/S0140-6736(23)00878-4
    pmid: '37805217'
    pmcid: null
    url: https://doi.org/10.1016/S0140-6736(23)00878-4
    source_license: CC BY 3.0 IGO（Crossref の license 欄で確認）
    legal_basis: B
    source_class: OPEN
    corroboration: null
  uncertainty: 低出生体重は出生体重2,500 g 未満を指す。在胎期間による細分類（28週未満、28週から32週未満、32週から37週）は WHO のファクトシートに基づく区分であり、本カードの出典の抄録の範囲では確認していない
  curriculum:
