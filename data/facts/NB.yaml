- id: NB-028
  domain: NB
  subdomain: 先天性甲状腺機能低下症
  assertion:
    plain_statement_ja: 日本では先天性甲状腺機能低下症の新生児マススクリーニングが1979年に始まり、早期診断と早期治療によって知的予後が改善した。発生はかつて出生5,000から8,000人に1人とされたが、軽症の型の診断によって増えている。スクリーニングで陽性となった児については、不必要な治療を避けるため、専門の医療施設で鑑別診断と治療を行うことが求められる。日本のスクリーニングのガイドラインは、2014年版に最近の知見を加えた2021年改訂版が現行である
    condition:
      region: 日本
      対象: 新生児
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1028
    source: Nagasaki K, Minamitani K, Nakamura A, et al. Guidelines for Newborn Screening of Congenital Hypothyroidism (2021 Revision). Clin Pediatr Endocrinol. 2023;32(1):26-51
    doi: 10.1297/cpe.2022-0063
    pmid: '36761493'
    pmcid: null
    url: https://doi.org/10.1297/cpe.2022-0063
    source_license: CC BY-NC-ND 4.0
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
