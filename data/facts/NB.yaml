- id: NB-001
  domain: NB
  subdomain: 新生児仮死
  assertion:
    plain_statement_ja: 2025年版の米国心臓協会と米国小児科学会の新生児蘇生ガイドラインでは、正常な移行を進める新生児には、ほとんどの場合で臍帯結紮を少なくとも60秒遅らせることが有益とされ、出生直後の皮膚接触と体温調節の支援が重視される。支援の範囲は保温や触覚刺激から、高度な気道管理、補助換気、酸素療法、血管内アクセス、エピネフリン、循環血液量の補充までを含み、出生前ケアから回復とフォローアップまでを通した「新生児ケアの連鎖」の枠組みで示されている
    condition:
      region: 米国
      対象: 新生児
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3355
    source: 'Lee HC, Strand ML, Finan E, et al. Part 5: Neonatal Resuscitation: 2025 American Heart Association and American Academy of Pediatrics Guidelines for Cardiopulmonary Resuscitation and Emergency Cardiovascular Care. Circulation. 2025;152(16_suppl_2):S385-S423'
    doi: 10.1161/CIR.0000000000001367
    pmid: '41122887'
    pmcid: null
    url: https://doi.org/10.1161/CIR.0000000000001367
    source_license: © American Heart Association／American Academy of Pediatrics（CC 表示なし。Crossref にライセンス登録なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 日本の新生児蘇生は日本蘇生協議会の JRC 蘇生ガイドライン2025 に基づく新生児蘇生法（NCPR）が国内の標準であり、本カードは米国のガイドラインに基づく。NCPR 2025 の個別の改訂点は標準テキスト第5版での逐語確認が必要なため、主張には含めていない
