  uncertainty: カフェインクエン酸塩（レスピア静注・経口液60mg）は「早産・低出生体重児における原発性無呼吸（未熟児無呼吸発作）」の効能・効果で国内承認され、2014年9月に薬価収載、同年12月に販売が開始された。用法・用量の文言は2020年改訂の添付文書で確認したもので、現行版での再確認が必要である
