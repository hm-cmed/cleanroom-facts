- id: NB-007
  domain: NB
  subdomain: 呼吸窮迫症候群<RDS>
  assertion:
    plain_statement_ja: 早産児の呼吸窮迫症候群の管理では、出生前ステロイドを含む周産期の最適化が前提とされ、分娩室では正常体温の維持、臍帯結紮前の自発呼吸の促進、非侵襲的呼吸サポートの使用、挿管を避けるための細径カテーテルによる早期サーファクタント投与の検討が推奨される。人工換気が必要な場合は肺保護戦略を用い、気管支肺異形成を減らすために期間を最短にする
    condition:
      region: 国際
      対象: 早産児
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3360
    source: 'Sweet DG, Carnielli VP, Greisen G, et al. European Consensus Guidelines on the Management of Respiratory Distress Syndrome: 2025. Neonatology. 2026;123(4):514-539'
    doi: 10.1159/000551062
    pmid: '41802129'
    pmcid: PMC13038240
    url: https://doi.org/10.1159/000551062
    source_license: CC BY-NC 4.0（PMC 全文と Crossref で確認）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 出典は欧州コンセンサスガイドラインの2025年版（第7版）で、CC BY-NC のため RESTRICTED とした。前版の2022年版は CC BY（OPEN）であり、版とライセンスが対応しない。肺サーファクタント製剤は国内ではサーファクテン気管注入用120mg（ウシ肺由来）が新生児呼吸窮迫症候群治療剤として薬価基準に収載され保険適用がある（製造販売承認は2025年1月に田辺三菱製薬から富士製薬工業へ承継された）。効能・効果の正確な文言と用法・用量は現行の電子添付文書での照合が未了である
  curriculum:
    kokushi: 医学各論 Ⅰ-3-D-①（呼吸窮迫症候群<RDS>、a）
