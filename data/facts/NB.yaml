    doi: 10.1097/AOG.0000000000003606
    pmid: '31856124'
    pmcid: null
    url: https://doi.org/10.1097/AOG.0000000000003606
    source_license: © ACOG（CC 表示なし。Crossref にライセンス登録なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 巨大児が疑われる場合の予定帝王切開の閾値など管理の数値は、抄録の範囲では確認できていないため主張に含めていない。定義の文言は ACOG の Bulletin 本文でも確認した
