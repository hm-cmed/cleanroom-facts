- id: NB-013
  domain: NB
  subdomain: 高ビリルビン血症
  assertion:
    plain_statement_ja: 米国小児科学会の高ビリルビン血症診療ガイドライン2022年改訂版は、在胎35週以上の新生児を対象とし、2004年版を置き換えるものである。光線療法と交換輸血の開始閾値は、生後時間に応じた曲線として、在胎週数ごとに細分化され、神経毒性リスク因子の有無によって別々に定められており、2004年版より狭い範囲で引き上げられた。神経毒性リスク因子は、同種免疫性溶血性疾患、その他の溶血性疾患（G6PD欠乏症など）、生後24時間以内の著明な臨床的不安定（敗血症、アシドーシス、窒息、著明な嗜眠、体温不安定）、血清アルブミン3.0 g/dL未満である
    condition:
      region: 米国
      対象: 在胎35週以上の新生児
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3431
    source: 'Kemper AR, Newman TB, Slaughter JL, et al. Clinical Practice Guideline Revision: Management of Hyperbilirubinemia in the Newborn Infant 35 or More Weeks of Gestation. Pediatrics. 2022;150(3):e2022058859'
    doi: 10.1542/peds.2022-058859
    pmid: '35927462'
    pmcid: null
    url: https://doi.org/10.1542/peds.2022-058859
    source_license: CC 表示なし（© 2022 American Academy of Pediatrics）
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 閾値曲線の個別の数値はガイドラインの図に基づくため、実際の適用値は図または2022年版の計算ツールで照合する必要がある。日本の基準は NB-015（早産児）と国内の各基準が別にあり、本カードは米国の枠組みである
