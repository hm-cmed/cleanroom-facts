  uncertainty: スクリーニング対象の具体的な基準値（出生体重・在胎週数の閾値）は本文の表で確認が必要なため主張に入れていない。日本のスクリーニング基準の原典文書は未確認である。治療の適応の詳細は本カードの範囲外だが、硝子体内抗VEGF薬のアフリベルセプトは未熟児網膜症の適応で2022年9月に国内承認されていることを出典リサーチで確認した（ラニビズマブの同じ適応での国内承認は未確認）
