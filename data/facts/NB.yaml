- id: NB-021
  domain: NB
  subdomain: ビタミンK欠乏症
  assertion:
    plain_statement_ja: 古典型のビタミンK欠乏性出血症は生後1週以内に発症し、哺乳の遅れや不足と関連する。出生時のビタミンKは、少量であってもこの型を容易に予防できる。ビタミンK欠乏性出血症の背景として、出生時にはビタミンKの貯蔵が少なく、母乳はビタミンKの濃度が低いため、母乳栄養児がリスクとなることが挙げられる
    condition:
