- id: NB-016
  domain: NB
  subdomain: 新生児溶血性疾患
  assertion:
    plain_statement_ja: 同種免疫性溶血性疾患（Rh不適合・ABO不適合など）の新生児に対する静注用免疫グロブリン（IVIG）のコクランレビュー（9試験、658例）では、全体の解析でIVIG群では交換輸血の必要性が有意に低下した（典型相対リスク0.35、95%信頼区間0.25〜0.49）。しかし、プラセボを用いて盲検化されたバイアスリスクの最も低い2試験では、交換輸血の必要性にも回数にも差がなく、エビデンスの質は低〜非常に低いため、IVIGの効果には十分な確信が持てないと結論された
    condition:
