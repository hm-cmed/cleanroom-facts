- id: NB-004
  domain: NB
  subdomain: 低出生体重児、早期産児
  assertion:
    plain_statement_ja: 日本では出生体重2,500 g 未満の低出生体重児が出生の約1割を占める。人口動態統計の確定数では、2024年は出生686,173人のうち2,500 g 未満が67,134人（約9.8%）、2023年は出生727,288人のうち70,151人（約9.6%）であった
    condition:
      region: 日本
      対象: 新生児
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3358
    source: '厚生労働省. 人口動態統計 確定数 出生 表4-28（性・単産−複産別にみた母の年齢（5歳階級）別出生数・2,500g未満の出生数及び割合）. 統計表ID: 0003411617（e-Stat）'
    doi: null
    pmid: null
    pmcid: null
    url: null
    source_license: 日本の政府統計（政府標準利用規約）
    legal_basis: B
    source_class: GOV_JP
    corroboration: null
  uncertainty: 割合（約9.8%と約9.6%）は表4-28の男女別の実数（2024年は男30,346人と女36,788人）を合算して算出した値で、表の割合欄との突き合わせは未了である。日本の早産（在胎37週未満）の割合は在胎期間別の統計表まで確認できていないため含めていない
