- id: NB-014
  domain: NB
  subdomain: 高ビリルビン血症
  assertion:
    plain_statement_ja: 2022年版で新たに導入された「エスカレーション・オブ・ケア」では、総ビリルビン値が交換輸血の閾値まで2 mg/dL以内に近づいた場合を緊急事態として扱い、新生児集中治療室への移送、最大照度の集中光線療法、静脈内補液と交換輸血の準備を行う。溶血を疑うビリルビン上昇速度の目安は、生後24時間以内は0.3 mg/dL/時超、それ以降は0.2 mg/dL/時超である
