- id: NB-010
  domain: NB
  subdomain: 一過性多呼吸
  assertion:
    plain_statement_ja: 新生児一過性多呼吸は、出生後の胎児肺液の排出がうまくいかないことで起こり、正期産児の呼吸窮迫の最も多い原因で、NICU 入院を要することもある。母児分離、呼吸サポート、不要な抗菌薬曝露の長期化、入院期間の延長につながりうる。肺超音波が診断に役立ち、CPAP による持続的気道陽圧での早期管理が呼吸窮迫の悪化を防ぎうる
    condition:
      region: 国際
      対象: 正期産児
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3363
    source: Alhassen Z, Vali P, Guglani L, Lakshminrusimha S, Ryan RM. Recent Advances in Pathophysiology and Management of Transient Tachypnea of Newborn. J Perinatol. 2021;41(1):6-16
    doi: 10.1038/s41372-020-0757-3
    pmid: '32753712'
    pmcid: PMC11867197
    url: https://doi.org/10.1038/s41372-020-0757-3
    source_license: CC 表示なし（Crossref は TDM のみ。PMC 版は著者稿）
    legal_basis: B
