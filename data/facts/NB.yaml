- id: NB-015
  domain: NB
  subdomain: 高ビリルビン血症
  assertion:
    plain_statement_ja: 日本では早産児の高ビリルビン血症について神戸大学の治療基準があり、2017年に改訂された。改訂の要点は、分類を出生体重ではなく出生時在胎週数・修正在胎週数で行うこと、治療を標準光線療法、集中光線療法、アルブミン療法および／または交換輸血の3段階としたこと、開始の判断は生後7日未満は出生時在胎週数、7日以降は修正在胎週数の、総ビリルビンとアンバウンドビリルビンの基準値で行うことである。改訂の背景には、早産児の慢性ビリルビン脳症がMRIの淡蒼球の異常信号と聴性脳幹反応の異常で臨床診断できるようになり、問題化したことがある
    condition:
      region: 日本
      対象: 早産児
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3432
    source: 'Morioka I. Hyperbilirubinemia in preterm infants in Japan: New treatment criteria. Pediatr Int. 2018;60(8):684-690'
    doi: 10.1111/ped.13635
    pmid: '29906300'
    pmcid: null
    url: https://doi.org/10.1111/ped.13635
    source_license: CC 表示なし
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 基準値の数値表そのものは出典の本文で未照合のため主張に入れていない。日本には単一の全国統一基準はなく施設ごとに異なる基準が使われており、正期産児向けの国内基準（村田・井村基準など）の数値表も原典で未照合である
