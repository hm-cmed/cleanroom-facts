- id: NB-012
  domain: NB
  subdomain: 新生児慢性肺疾患
  assertion:
    plain_statement_ja: 日本の新生児慢性肺疾患は、日齢28の時点で室内気より高い酸素を必要とし、持続する呼吸窮迫症状と、胸部X線でびまん性の不透亮像または気腫性・線維性の所見を伴うものと定義されてきた。先行病態とX線所見から I から VI 型に分類され、III 型は子宮内炎症を背景とし、Wilson-Mikity 症候群でみられる泡状・嚢胞状のX線所見を示す型である
