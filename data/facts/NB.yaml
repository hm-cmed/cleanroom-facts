- id: NB-009
  domain: NB
  subdomain: 胎便吸引症候群<MAS>
  assertion:
    plain_statement_ja: 胎便吸引症候群は、胎便汚染羊水で出生した新生児の呼吸窮迫を特徴とし、正期産・過期産児の罹患と死亡の重要な原因であり続けている。気管内吸引は活発な児にも活発でない児にもルーチンには推奨されなくなっており、管理は支持療法を土台として、サーファクタント、吸入一酸化窒素、高頻度換気などの治療により転帰が改善している
    condition:
      region: 国際
      対象: 正期産児、過期産児
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3362
    source: 'Dini G, Ceccarelli S, Celi F, Semeraro CM, Gorello P, Verrotti A. Meconium aspiration syndrome: from pathophysiology to treatment. Ann Med Surg (Lond). 2024;86(4):2023-2031'
    doi: 10.1097/MS9.0000000000001835
    pmid: '38576961'
    pmcid: PMC10990371
    url: https://doi.org/10.1097/MS9.0000000000001835
    source_license: CC BY-NC-SA 4.0（Crossref で確認）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: サーファクタント製剤の国内承認と保険適用は NB-007 のとおりである。吸入一酸化窒素の国内の効能・効果の文言は未照合のため、国内適応の断定はしていない。本カードは2024年の総説に基づく
