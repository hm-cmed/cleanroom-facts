  uncertainty: 分娩時抗菌薬予防とスクリーニングの実施体制は国により異なり、本カードは米国の枠組みである。在胎34週以下の児については別の報告（同じく2018年）で枠組みが分けられている。経験的抗菌薬の個別の国内承認・用量の照合は行っていない（抗菌薬の使い方の総論はⅫが正）
