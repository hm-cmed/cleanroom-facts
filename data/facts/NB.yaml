- id: NB-018
  domain: NB
  subdomain: 低血糖、低カルシウム血症
  assertion:
    plain_statement_ja: 新生児・乳児の低カルシウム血症は、正期産児または出生体重1500 g超の早産児では総カルシウム8 mg/dL（2 mmol/L）未満またはイオン化カルシウム4.4 mg/dL（1.1 mmol/L）未満、出生体重1500 g未満の児では総カルシウム7 mg/dL（1.75 mmol/L）未満またはイオン化カルシウム4 mg/dL（1 mmol/L）未満と定義される。早発型は一般に無症候性で、高リスクの児では生後24時間と48時間のスクリーニングが勧められ、遅発型は生後72時間以降から生後1週の終わりにかけて発症し、一般に症候性である。症候性の場合は治療することにコンセンサスがあるが、無症候性の場合にどの値から治療を始めるかと治療の選択肢にはなお議論がある
    condition:
