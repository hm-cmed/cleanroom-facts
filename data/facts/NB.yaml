- id: NB-024
  domain: NB
  subdomain: 帽状腱膜下出血
  assertion:
    plain_statement_ja: 帽状腱膜下出血は、新生児の予防可能な病的状態と死亡の重要な原因である。その増加は、近年の吸引分娩の増加と時期を同じくしている。オーストラリアでは過去7年間に3例の死亡が2件の検視審問の対象となり、検視の報告は、リスク因子の同定、早期診断、綿密な観察、積極的な治療に注意を払えば帽状腱膜下出血による新生児死亡は防げると指摘した
    condition:
      region: 国際
      対象: 新生児
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3440
    source: 'Colditz MJ, Lai MM, Cartwright DW, Colditz PB. Subgaleal haemorrhage in the newborn: A call for early diagnosis and aggressive management. J Paediatr Child Health. 2015;51(2):140-146'
    doi: 10.1111/jpc.12698
    pmid: '25109786'
    pmcid: null
    url: https://doi.org/10.1111/jpc.12698
    source_license: CC 表示なし
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 帽状腱膜下腔にたまりうる出血量の具体的な数値や、観察間隔の推奨は、出典の抄録の範囲では確認できていない。骨縫合を超える波動性の頭部腫脹による臨床診断という記載は症例集積（Lee 2018）の抄録に基づくもので、本カードの主張には入れていない
