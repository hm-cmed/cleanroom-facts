- id: NB-020
  domain: NB
  subdomain: 敗血症、髄膜炎
  assertion:
    plain_statement_ja: B群連鎖球菌（GBS）感染症は、新生児の早発型敗血症の最も多い原因であり、若年乳児の遅発型敗血症の重要な原因でもある。周産期のGBS早発型疾患に対して現在利用できる唯一の有効な予防戦略は分娩時抗菌薬予防投与であり、遅発型疾患への有効な予防法はない。米国では、母体のGBS保菌を検出するための普遍的な出生前微生物学的検査と、それに基づく分娩時抗菌薬予防投与が、米国小児科学会と米国産科婦人科学会によって再確認されている
    condition:
      region: 米国
      対象: 新生児、若年乳児
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3437
    source: Puopolo KM, Lynfield R, Cummings JJ; Committee on Fetus and Newborn; Committee on Infectious Diseases. Management of Infants at Risk for Group B Streptococcal Disease. Pediatrics. 2019;144(2):e20191881
    doi: 10.1542/peds.2019-1881
    pmid: '31285392'
    pmcid: null
    url: https://doi.org/10.1542/peds.2019-1881
    source_license: CC 表示なし
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: GBSは生後90日未満の乳児の細菌性髄膜炎の最も多い原因でもあるが、新生児髄膜炎に特化したカードは本回では作っていない（候補は申し送り参照）。母体のスクリーニングと分娩時対応の周産期管理は第47回 PG（Ⅰ-1-D-①）と重複させない。日本のGBSスクリーニングの時期は産科編2026のパブリックコメント原案で36〜37週への変更が示されているが、刊行版では未照合である
  curriculum:
