    doi: 10.1016/j.blre.2008.06.001
    pmid: '18804903'
    pmcid: null
    url: https://doi.org/10.1016/j.blre.2008.06.001
    source_license: Crossref の登録は Elsevier の TDM ライセンスのみ（CC 表示なし）
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 新生児メレナを含む具体的な出血部位や症状の内訳は、出典の抄録の範囲では確認できていないため主張に入れていない（本カードは新生児期の出血症としての古典型の枠組みに限る）。定義と分類そのものは第41回 PB-001、晩発型の臨床像は PB-002 が作成済みで、本カードは新生児期の古典型に範囲を限った。ビタミンK2シロップの予防投与の保険適用の扱いは未確認である（PB-003 と共通）
