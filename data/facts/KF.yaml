    source_class: RESTRICTED
    corroboration: null
  uncertainty: 原因の列挙は出典本文の分類に基づく（抄録では、有機酸の産生亢進が急性代謝性アシドーシスの中心であることを確認した）。重炭酸ナトリウムなど薬剤の国内の承認・保険適用の詳細は、本セッションでは添付文書で確認していない。
