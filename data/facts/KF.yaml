- id: KF-029
  domain: KF
  subdomain: ナトリウム代謝異常
  assertion:
    plain_statement_ja: 低ナトリウム血症は血清ナトリウム135 mmol/L未満と定義され、救急外来を受診する患者の15〜20%にみられる頻度の高い異常である。重症度は、軽度が130〜134 mmol/L、中等度が125〜129 mmol/L、高度が125 mmol/L未満と分類される。治療は原因に応じて行い、重い神経症状がある場合には高張食塩水のボーラス投与が推奨される。
    condition:
