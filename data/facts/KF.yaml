    pmcid: null
    url: https://doi.org/10.1530/EJE-13-1020
    source_license: © European Society of Endocrinology（非CC）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 補正速度の上限はガイドライン本文の要約で確認した。米国の専門家推奨など他の指針では上限の示し方が異なる場合がある。
