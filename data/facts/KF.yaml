- id: KF-033
  domain: KF
  subdomain: カリウム代謝異常
  assertion:
    plain_statement_ja: 低カリウム血症の原因診断では、尿中カリウム排泄をみて腎臓からの喪失か、消化管からの喪失や細胞内への移行かを分け、酸塩基平衡の異常の有無と合わせて原因を絞り込む。重症または有症状の低カリウム血症では、心電図でモニタリングしながら静注による補正を検討し、低マグネシウム血症があれば同時に補正する。
