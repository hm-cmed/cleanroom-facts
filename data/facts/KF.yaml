  assertion:
    plain_statement_ja: 非典型溶血性尿毒症症候群は、補体が介在する血栓性微小血管症による、遺伝性の、生命を脅かす慢性の疾患である。血漿交換や血漿輸注は血液学的な指標を一時的に正常範囲に保ちうるが、全身性の基礎病態そのものを治療するものではない点が、志賀毒素産生性大腸菌による HUS と区別して理解する要点になる。
