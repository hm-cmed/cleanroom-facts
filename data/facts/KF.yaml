  assertion:
    plain_statement_ja: 2005年の日本の健診データ（20歳以上の574,024人、11都道府県）をもとに日本人の式で eGFR を算出した推計では、CKD の病期別有病率はステージ1が0.6%、ステージ2が1.7%、ステージ3が10.4%、ステージ4と5の合計が0.2%で、全国の患者数の推計はステージ3だけで1070万人に達した。CKD の大半は自覚症状に乏しいステージ3が占める。
