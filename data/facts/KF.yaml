- id: KF-036
  domain: KF
  subdomain: リン代謝異常
  assertion:
    plain_statement_ja: リンの恒常性は、腸管からの吸収、骨とのやり取り、腎臓からの排泄のバランスで保たれ、副甲状腺ホルモン、活性型ビタミンD、FGF23が調節に関わる。排泄の中心は腎臓であり、近位尿細管での再吸収が調節点となる。腎機能が低下するとリン排泄が障害されて高リン血症を来し、CKD-MBDの一因となる。
