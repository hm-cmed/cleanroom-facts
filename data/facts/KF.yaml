- id: KF-034
  domain: KF
  subdomain: カルシウム代謝異常
  assertion:
    plain_statement_ja: 高カルシウム血症は一般人口の約1%にみられ、その原因の約90%は原発性副甲状腺機能亢進症と悪性腫瘍である。重症度は、軽度が総カルシウム12 mg/dL未満、重度が14 mg/dL以上とされる。原因診断の第一歩はintact PTHの測定であり、重症または有症状の高カルシウム血症では、輸液による水分補正とビスホスホネートの静注が治療の柱となる。
