- id: EP-039
  domain: EP
  subdomain: 群発頭痛
  assertion:
    plain_statement_ja: 群発頭痛は、ICHD-3では一側の眼窩部、眼窩上部、側頭部のいずれかに15分から180分続く重度から非常に重度の痛みが生じ、同側の結膜充血・流涙、鼻閉・鼻漏、眼瞼浮腫、前額部・顔面の発汗、縮瞳・眼瞼下垂のいずれか、または落ち着きのなさ・不穏を伴い、群発期には1日おきから1日に8回までの頻度で発作が反復する頭痛である。
    condition:
      population: 群発頭痛患者
      region: 国際
    differential: null
    common_misconception: null
  provenance:
