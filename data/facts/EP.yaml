    pmid: '29680205'
    pmcid: null
    url: https://doi.org/10.1016/S1474-4422(18)30107-8
    source_license: © Elsevier（Lancet Neurology、CC 表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 同研究ではラモトリギン 2.9%、レベチラセタム 2.8% と低い頻度であった。国内でもバルプロ酸の添付文書には妊娠中の投与に関する警告があり、妊娠可能な女性への使用について注意喚起がなされている。
