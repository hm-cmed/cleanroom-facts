- id: EP-005
  domain: EP
  subdomain: てんかん
  assertion:
    plain_statement_ja: 成人の初回非誘発性発作のあとでは、発作再発のリスクは最初の 2 年間が最も高く 21〜45% であり、直ちに抗てんかん薬治療を開始すると 2 年以内の再発リスクは低下するものの、3 年を超える長期の発作寛解の予後は改善しない。
