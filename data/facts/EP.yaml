- id: EP-044
  domain: EP
  subdomain: 憤怒けいれん
  assertion:
    plain_statement_ja: 蒼白型の憤怒けいれん（反射性無酸素発作）は、迷走神経を介した反射性の心抑制（心静止）による失神発作であり、てんかん発作ではない。誘因となった痛みや驚愕が見逃されると、てんかんと誤診されやすい。
    condition:
      population: 蒼白型の憤怒けいれんの乳幼児
      region: 国際
