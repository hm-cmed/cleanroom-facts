  subdomain: 憤怒けいれん
  assertion:
    plain_statement_ja: 憤怒けいれん（泣き入りひきつけ）にはチアノーゼ型と蒼白型がある。チアノーゼ型は怒りや不満をきっかけに啼泣し、強制呼気のまま息を止めてチアノーゼを呈し、一時的に意識を失う。蒼白型は痛みや恐怖をきっかけに起こることが多く、啼泣はわずかで無呼吸の期間が短く、蒼白を呈する。病態には自律神経系の調節異常や迷走神経を介した心抑制などが関与するとされ、発作全体は10〜60秒程度で終わり、経過は良性で通常5歳までに自然に消失する。
    condition:
      population: 憤怒けいれんの乳幼児
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1720
    source: 'Leung AKC, Leung AAM, Wong AHC, Hon KL. Breath-Holding Spells in Pediatrics: A Narrative Review of the Current Evidence. Curr Pediatr Rev. 2019;15(1):22-29'
    doi: 10.2174/1573396314666181113094047
    pmid: '30421679'
    pmcid: null
    url: https://doi.org/10.2174/1573396314666181113094047
    source_license: CC BY-NC 4.0
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 発作の持続（10〜60秒）と消失時期（通常5歳まで）は総説の抄録で確認した範囲。「後遺症を残さない」点は、本総説が本症を良性（benign）と位置づけ自然消失を述べる範囲で記載したもので、長期予後の追跡研究そのものは未確認。国内の診療指針での位置づけは未確認。
  curriculum:
