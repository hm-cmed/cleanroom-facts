    pmcid: null
    url: https://doi.org/10.1177/0333102417738202
    source_license: Cephalalgia誌（SAGE、テキストマイニング用ライセンスのみでCC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 治療の基本は原因薬剤の中止と予防治療の導入である。ゲパント系薬は薬剤の使用過多による頭痛を引き起こしにくいと報告されているが、本カードでは扱わない。本カードは使用過多の定義に関するものであり、個別薬剤の国内承認・保険適用の状況は各薬剤のカード（EP-103〜EP-109）を参照。
