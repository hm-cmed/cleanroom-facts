    doi: 10.1177/0333102417738202
    pmid: '29368949'
    pmcid: null
    url: https://doi.org/10.1177/0333102417738202
    source_license: Cephalalgia誌（SAGE、テキストマイニング用ライセンスのみでCC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 反復性の持続時間は30分から7日、慢性では数時間から数日または持続性である。光過敏と音過敏は一方のみが許容され、慢性では軽度の悪心も許容される。
