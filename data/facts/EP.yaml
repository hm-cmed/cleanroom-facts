- id: EP-037
  domain: EP
  subdomain: 緊張型頭痛
  assertion:
    plain_statement_ja: 緊張型頭痛は、ICHD-3では両側性で、圧迫感・締め付け感のある非拍動性の、軽度から中等度の頭痛であり、日常的な身体活動で増悪せず悪心・嘔吐を伴わないもので、頻発反復性では月に1〜14日、慢性では月に15日以上（年に180日以上）が3か月を超えて続くことで区別される。
    condition:
      population: 緊張型頭痛患者
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1721
