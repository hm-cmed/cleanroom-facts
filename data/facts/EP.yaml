- id: EP-036
  domain: EP
  subdomain: 片頭痛
  assertion:
    plain_statement_ja: 薬剤の使用過多による頭痛は、ICHD-3では、既存の一次性頭痛を持つ患者が急性期治療薬を3か月を超えて定期的に過剰使用し、頭痛が月に15日以上生じる状態であり、トリプタン、エルゴタミン、オピオイド、複合鎮痛薬では月に10日以上、単純鎮痛薬やNSAIDsでは月に15日以上の使用が過剰使用の目安となる。
    condition:
      population: 急性期治療薬を頻用する頭痛患者
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1721
