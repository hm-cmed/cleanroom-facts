  assertion:
    plain_statement_ja: Lennox-Gastaut 症候群に対するルフィナミド併用療法の無作為化比較試験では、全発作頻度の減少率の中央値はルフィナミド群 32.7% でプラセボ群 11.7% を上回り、強直・脱力発作（drop attack）の減少率はルフィナミド群 42.5% であったのに対しプラセボ群では 1.4% の増加であった。
