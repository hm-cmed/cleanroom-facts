    pmcid: null
    url: https://doi.org/10.1212/WNL.0000000000001487
    source_license: ライセンス未確認（Neurology 誌、PMC に著者原稿が収載）
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 再発リスクを上げる臨床的要因として、脳の既存病変、脳波のてんかん性異常、画像の有意な異常、夜間発作が同ガイドラインで挙げられている。治療開始の判断は個別のリスクと薬剤の有害事象（7〜31% とされる）を比較して行うとされる。
