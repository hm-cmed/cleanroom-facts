- id: EP-027
  domain: EP
  subdomain: 片頭痛
  assertion:
    plain_statement_ja: 前兆のない片頭痛は、国際頭痛分類第3版（ICHD-3）では、未治療または治療が奏効しない場合に4〜72時間続く発作が5回以上あり、頭痛が一側性、拍動性、中等度から重度の強さ、日常的な身体活動による増悪のうち少なくとも2つを満たし、頭痛中に悪心・嘔吐、または光過敏と音過敏の少なくとも一方を伴うことで診断される。
