- id: EP-003
  domain: EP
  subdomain: てんかん
  assertion:
    plain_statement_ja: EURAP 登録の前向きコホートでは、受胎時にバルプロ酸単剤療法を受けていた女性から生まれた児の大奇形の頻度は 10.3%（1381 例中 142 例）で、検討された 8 剤の中で最も高く、その頻度はバルプロ酸の用量に依存して増加した。
    condition:
      population: 抗てんかん薬単剤療法を受けている妊娠可能な女性・妊婦
