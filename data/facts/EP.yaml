- id: EP-004
  domain: EP
  subdomain: てんかん
  assertion:
    plain_statement_ja: ILAE の 2014 年の実用的臨床定義では、てんかんは、24 時間を超える間隔で 2 回以上の非誘発性（または反射性）発作があること、1 回の非誘発性発作があり今後 10 年間の発作再発の確率が 2 回の非誘発性発作後の一般的な再発リスク（少なくとも 60%）と同等以上であること、てんかん症候群と診断されること、のいずれかを満たす脳の疾患と定義される。
