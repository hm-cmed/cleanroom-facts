    pmcid: null
    url: https://doi.org/10.1111/epi.12550
    source_license: ライセンス未確認（Epilepsia 誌、Wiley、CC 表示なし）
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 同定義では、年齢依存性症候群の適用年齢を過ぎた場合、または発作が 10 年間なく抗てんかん薬を 5 年以上中止している場合に、てんかんは「解消した（resolved）」とみなされる。
