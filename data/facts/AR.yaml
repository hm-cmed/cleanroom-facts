  subdomain: 心房細動
  assertion:
    plain_statement_ja: 4つの大規模試験（計71,683人）のメタ解析では、DOACはワルファリンに比べて脳卒中・全身性塞栓症を19%減らし（相対リスク0.81）、頭蓋内出血をほぼ半分にし（0.48）、全死亡も減らした（0.90）。一方、消化管出血は増えた（1.25）。
