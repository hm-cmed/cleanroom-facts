- id: AR-007
  domain: AR
  subdomain: 心房細動
  assertion:
    plain_statement_ja: HAS-BLEDスコアは、抗凝固療法中の心房細動患者の1年以内の大出血リスクを見積もる指標で、高血圧、腎・肝機能異常、脳卒中、出血の既往や素因、不安定なINR、65歳を超える高齢、薬剤またはアルコールを項目とする。欧州の3,978人で作られ、1年間の大出血は1.5%であった。
    condition:
      region: 欧州
      study: Euro Heart Survey on AF
