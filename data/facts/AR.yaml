- id: AR-029
  domain: AR
  subdomain: 致死性不整脈
  assertion:
    plain_statement_ja: 日本のガイドラインでは、冠動脈疾患（心筋梗塞から40日以上、血行再建から90日以上）で、至適薬物治療を受け、NYHA II度以上、左室駆出率35%以下、非持続性心室頻拍がある患者に、突然死の一次予防としてICDが推奨される（クラスI、レベルA）。非持続性心室頻拍がなくても、NYHA II度以上で駆出率35%以下ならICDを考慮すべきとされる（IIa、B）。
    condition:
