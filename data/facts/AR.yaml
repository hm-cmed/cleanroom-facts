- id: AR-026
  domain: AR
  subdomain: 心室頻拍
  assertion:
    plain_statement_ja: 器質的心疾患に伴う持続性心室頻拍で血行動態が不安定な場合は、ただちに直流通電を行う（クラスI、レベルB）。再発する心室頻拍と突然死の予防には植込み型除細動器（ICD）が推奨され（I、A）、虚血性心疾患による薬剤抵抗性の心室頻拍にはカテーテルアブレーションが推奨される（I、B）。除細動後も不安定な場合はアミオダロンまたはニフェカラントの静注を考慮する（IIa、A）。
