- id: AR-005
  domain: AR
  subdomain: 心房細動
  assertion:
    plain_statement_ja: HELT-E2S2スコアは、日本の3つの心房細動レジストリ（J-RHYTHM、伏見AF、心研データベース）の統合解析から作られ、高血圧・75〜84歳・BMI 18.5未満・持続性または永続性心房細動を各1点、85歳以上と脳梗塞の既往を各2点とする。この解析では、糖尿病・心不全・血管疾患は独立した危険因子とならなかった。
    condition:
