  assertion:
    plain_statement_ja: 診断から1年以内の早期心房細動で心血管疾患を伴う患者2,789人を対象としたEAST-AFNET 4試験では、抗不整脈薬またはアブレーションによる早期リズムコントロールが、通常治療に比べ心血管死・脳卒中・心不全または急性冠症候群による入院の複合を減らした（100人年あたり3.9対5.0、ハザード比0.79）。
