- id: AR-011
  domain: AR
  subdomain: 心房細動
  assertion:
    plain_statement_ja: 通常量の抗凝固薬が使えない80歳以上の日本人の非弁膜症性心房細動患者984人を対象としたELDERCARE-AF試験では、エドキサバン15 mg 1日1回はプラセボに比べ、脳卒中・全身性塞栓症を年6.7%から2.3%に減らした（ハザード比0.34）。大出血は年3.3%対1.8%で有意差はなかったが、消化管出血はエドキサバン群で多かった。
    condition:
