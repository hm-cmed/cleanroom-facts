- id: AR-036
  domain: AR
  subdomain: 上室期外収縮
  assertion:
    plain_statement_ja: 55〜75歳の健康な678人を中央値6.3年追跡したコペンハーゲン・ホルター研究では、過度の上室性期外収縮活動（上室期外収縮30拍/時以上、または20拍以上の連発が1回以上）を示した群は、そうでない群に比べて死亡と脳卒中の複合エンドポイントのハザード比が1.64、心房細動による入院が2.78、脳卒中が2.79であった。
    condition:
      region: 国際
      対象: 55〜75歳の健康な男女678人（ホルター心電図を記録）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-4378
    source: Binici Z, et al. Circulation. 2010;121:1904-1911.
    doi: 10.1161/CIRCULATIONAHA.109.874982
    pmid: '20404258'
    pmcid: null
    url: https://doi.org/10.1161/CIRCULATIONAHA.109.874982
    source_license: CC表示なし（購読誌）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 観察研究による関連であり、因果関係を示すものではない。「過度の上室性期外収縮活動」の定義は本研究独自の基準である。
