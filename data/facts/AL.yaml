- id: AL-002
  domain: AL
  subdomain: アナフィラキシー
  assertion:
    plain_statement_ja: アナフィラキシーの第一選択治療はアドレナリンの筋肉内注射であり、診断は臨床基準による。EAACI ガイドライン（2021年改訂）は、発症後にトリプターゼ測定のための採血を行うこと、アドレナリン自己注射器を携行すること、構造化されたトレーニングを行うことを推奨している。
    condition:
      region: 欧州
      対象: 成人・小児
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2812
    source: 'Muraro A, et al. EAACI guidelines: Anaphylaxis (2021 update). Allergy. 2022;77(2):357-377.'
    doi: 10.1111/all.15032
    pmid: '34343358'
    pmcid: null
    url: https://doi.org/10.1111/all.15032
    source_license: 未確認（Crossref は Wiley の利用条件のみ）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ60 2026-11-14）：Abrams EM, Alqurashi W, Fischer DA, Vander Leek TK, Ellis AK. Anaphylaxis. Allergy Asthma Clin Immunol. 2024;20(Suppl 3):62（PMID: 39654057、DOI: 10.1186/s13223-024-00926-3、PMCID: PMC11629490、https://pmc.ncbi.nlm.nih.gov/articles/PMC11629490/）。裏づける部分：アドレナリン筋注（大腿外側）が第一選択治療であること、診断は臨床基準によること、アドレナリン自己注射器の処方と患者・介護者への教育、個別の緊急行動計画の提供を確認。数値の照合：数値なし。留保：発症後にトリプターゼ測定のための採血を行う点は候補では未確認（EAACI 固有の推奨）。主出典 SRC-2812 の区分訂正は別枠の節に分離した'
  uncertainty: アドレナリン自己注射薬（エピペン）は国内で承認され保険適用がある（PMDA 添付文書で確認。推奨用量は 0.01 mg/kg で、0.15mg製剤は体重15〜30kg、0.3mg製剤は30kg以上）。
