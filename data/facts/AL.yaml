- id: AL-001
  domain: AL
  subdomain: アナフィラキシー
  assertion:
    plain_statement_ja: アナフィラキシーの診断基準（WAO 2020）は2つある。1つは、皮膚・粘膜症状が急性に発症し、呼吸障害、血圧低下・末梢臓器症状、重度の消化器症状のいずれかを伴う場合。もう1つは、既知または可能性の高いアレルゲンへの曝露の後に、皮膚症状がなくても急性の低血圧、気管支攣縮、喉頭症状のいずれかを呈する場合である。
    condition:
      region: 国際
      対象: 成人・小児
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2811
    source: Cardona V, et al. World Allergy Organization anaphylaxis guidance 2020. World Allergy Organ J. 2020;13(10):100472.
    doi: 10.1016/j.waojou.2020.100472
    pmid: '33204386'
    pmcid: PMC7607509
    url: https://doi.org/10.1016/j.waojou.2020.100472
    source_license: CC BY-NC-ND 4.0（Europe PMC で確認）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ60 2026-11-14）：Abrams EM, Alqurashi W, Fischer DA, Vander Leek TK, Ellis AK. Anaphylaxis. Allergy Asthma Clin Immunol. 2024;20(Suppl 3):62（PMID: 39654057、DOI: 10.1186/s13223-024-00926-3、PMCID: PMC11629490、https://pmc.ncbi.nlm.nih.gov/articles/PMC11629490/）。裏づける部分：Table 3 に WAO 2020 診断基準を明記。基準1（皮膚・粘膜症状＋呼吸障害／血圧低下・末梢臓器症状／重度消化器症状）と基準2（既知・可能性の高いアレルゲン曝露後の急性低血圧・気管支攣縮・喉頭症状、皮膚症状なしでも可）の両方を確認。数値の照合：数値なし（基準の定性的主張）。留保：主出典 SRC-2811 は CC BY-NC-ND で現行 RESTRICTED が正しい'
  uncertainty: 診断基準は WAO ガイダンス2020の本文（PMC 全文）で確認した。日本アレルギー学会『アナフィラキシーガイドライン2022』は WAO 2020 に準拠した改訂版だが、原典の書誌詳細は未確認のため出典にはしていない。
