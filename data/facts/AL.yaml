- id: AL-003
  domain: AL
  subdomain: アナフィラキシー
  assertion:
    plain_statement_ja: 日本のアナフィラキシー登録（2015〜2017年、79施設・767例）では、原因は食物が68%、薬剤が12%、食物依存性運動誘発アナフィラキシーが5%、昆虫が4%で、18歳未満が全体の73%を占めた。アドレナリン筋注が行われたのは38%にとどまった。
    condition:
      region: 日本
      対象: 成人・小児
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2813
    source: 'Sato S, et al. Current situation of anaphylaxis in Japan: Data from the anaphylaxis registry of training and teaching facilities certified by the Japanese Society of Allergology. Allergol Int. 2023;72(3):437-443.'
    doi: 10.1016/j.alit.2022.12.003
    pmid: '36588001'
    pmcid: null
    url: https://doi.org/10.1016/j.alit.2022.12.003
    source_license: CC BY-NC-ND 4.0（Europe PMC で確認）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 本論文は二次出版物（secondary publication）である。数値は抄録で確認した。院外発症でのアドレナリン自己注射器の使用は12%だった（同抄録）。アドレナリン自己注射薬は国内承認・保険適用あり（PMDA 添付文書で確認）。
  curriculum:
    kokushi: 医学各論 Ⅺ-1-A-①（アナフィラキシー、a）
    core_curriculum: 'PS-01-03-29 (id: JkxnuM4)；PS-03-02-05 (id: JnGUA2s)；TBL-01-00-554 (id: Jo77KCc)'
