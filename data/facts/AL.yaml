- id: AL-012
  domain: AL
  subdomain: アレルギーの機序
  assertion:
    plain_statement_ja: 過敏反応は Gell-Coombs 分類で4型に分けられる。I型は IgE が介在する即時型で、肥満細胞と好塩基球の脱顆粒によりヒスタミンなどのメディエーターが放出される。II型は細胞表面の分子に対する IgG・IgM による細胞障害性反応、III型は免疫複合体が組織に沈着して起こる炎症、IV型は T細胞が介在する遅延型反応である。
    condition:
      region: 国際
      対象: 全年齢
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2822
    source: Warrington R, Watson W, Kim HL, Antonetti FR. An introduction to immunology and immunopathology. Allergy Asthma Clin Immunol. 2011;7 Suppl 1:S1.
    doi: 10.1186/1710-1492-7-S1-S1
    pmid: '22165815'
    pmcid: PMC3245432
    url: https://doi.org/10.1186/1710-1492-7-S1-S1
    source_license: CC BY 2.0（Crossref の license 欄で確認）
    legal_basis: B
    source_class: OPEN
    corroboration: null
  uncertainty: 分類と各型の機序は出典の本文（PMC 全文）で確認した。IV型の細分類（IVa〜IVd）と薬物過敏反応への応用分類は本カードでは扱っていない。
  curriculum:
