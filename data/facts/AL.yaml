- id: AL-004
  domain: AL
  subdomain: 薬物アレルギー
  assertion:
    plain_statement_ja: 薬物過敏反応は、免疫が介在するアレルギー性反応と、非アレルギー性反応に大別される。過小診断と過大診断の双方が多く、精査なしにアレルギーと分類されると、より高価で効果の低い薬剤が使われることがある。
    condition:
      region: 国際
      対象: 成人
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2814
    source: Demoly P, et al. International Consensus (ICON) on drug allergy. Allergy. 2014;69(4):420-437.
    doi: 10.1111/all.12350
    pmid: '24697291'
    pmcid: null
    url: https://doi.org/10.1111/all.12350
    source_license: 未確認
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ60 2026-11-14）：Warrington R, Silviu-Dan F, Wong T. Drug allergy. Allergy Asthma Clin Immunol. 2018;14(Suppl 2):60（PMID: 30275849、DOI: 10.1186/s13223-018-0289-y、PMCID: PMC6157123、https://pmc.ncbi.nlm.nih.gov/articles/PMC6157123/）。裏づける部分：薬物アレルギーは免疫介在性の反応であり、免疫特異性を欠く非アレルギー性（pseudoallergic）反応と区別されるという大別と、アレルギーと分類されることでより効果が低く毒性が高く高価な代替薬が使われることを確認。数値の照合：数値なし。留保：過小診断と過大診断の双方が多いという点は候補では未確認。主出典 SRC-2814 の区分訂正は別枠の節に分離した'
  uncertainty: 国際コンセンサス（ICON）の抄録で確認した範囲に限る。薬物アレルギーの practice parameter（Khan 2022）は抄録が公開されておらず本文を確認できないため、出典にはしていない。
