- id: AL-011
  domain: AL
  subdomain: 昆虫・ダニアレルギー
  assertion:
    plain_statement_ja: ハチ毒アレルギーによる全身性刺傷反応は、成人で最大7.5%、小児で最大3.4%に報告される。その後の全身性刺傷反応を防ぐ唯一の治療は毒液免疫療法で、中等症から重症の全身性刺傷反応を予防する目的で小児と成人に適応がある。患者はアドレナリン自己注射薬を含む緊急キットを携行する。
    condition:
      region: 欧州
      対象: 成人・小児
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2821
    source: 'Sturm GJ, et al. EAACI guidelines on allergen immunotherapy: Hymenoptera venom allergy. Allergy. 2018;73(4):744-764.'
    doi: 10.1111/all.13262
    pmid: '28748641'
    pmcid: null
    url: https://doi.org/10.1111/all.13262
    source_license: 未確認（Crossref は Wiley の利用条件のみ）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ60 2026-11-14）：Ueberschaar S, Trautmann A, Stoevesandt J. Declining venom immunotherapy: patient characteristics and clinical outcomes. Allergy Asthma Clin Immunol. 2026;22(1):38 補助：Panzera C, Gangemi S, Ricciardi L. Five-Year Real-World Outcomes of Hymenoptera Venom Immunotherapy: Clinical Effectiveness and Immunological Modifications. Toxins. 2026;18(4):187（PMID: 42043051、DOI: 10.3390/toxins18040187、PMCID: PMC13120408）（PMID: 42298678、DOI: 10.1186/s13223-026-01046-w、PMCID: PMC13270586、https://pmc.ncbi.nlm.nih.gov/articles/PMC13270586/）。裏づける部分：主候補で、刺傷を受けた成人の最大7.5%がアナフィラキシーを発症すること、毒液免疫療法が将来の全身性刺傷反応を予防すること、アドレナリン自己注射器を含む緊急キットが提供されることを確認。補助候補は「毒液免疫療法は重篤な全身反応を予防できる唯一の治療」と明記している。数値の照合：成人の最大7.5%は主候補と一致する。小児の最大3.4%は自由全文では未確認。留保：主出典 SRC-2821 の区分訂正は別枠の節に分離した'
