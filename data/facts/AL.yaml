- id: AL-005
  domain: AL
  subdomain: 薬物アレルギー
  assertion:
    plain_statement_ja: ペニシリンアレルギーの申告は米国人口の約10%にみられるが、臨床的に有意な IgE 介在性・T細胞介在性の過敏症は5%未満である。IgE 介在性ペニシリンアレルギーは時間とともに減衰し、10年後には約80%が耐性化する。ペニシリンとセファロスポリンの交差反応性は約2%とされる。
    condition:
      region: 米国
      対象: 成人
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-2815
    source: 'Shenoy ES, et al. Evaluation and Management of Penicillin Allergy: A Review. JAMA. 2019;321(2):188-199.'
    doi: 10.1001/jama.2018.19283
    pmid: '30644987'
    pmcid: null
    url: https://doi.org/10.1001/jama.2018.19283
    source_license: 未確認
    legal_basis: B
    source_class: RESTRICTED
    corroboration: 自由に使える資料による裏づけ（GOV_US、作り手の調査バッチ60 2026-11-14）：Centers for Disease Control and Prevention. Clinical Features of Penicillin Allergy. CDC ウェブページ（Antibiotic Prescribing and Use）. 2025-08-25 更新（https://www.cdc.gov/antibiotic-use/hcp/clinical-signs/index.html）。裏づける部分：ペニシリンアレルギーの申告が米国患者の約10%にみられること、臨床評価では真にアレルギーの者は1%未満であること、IgE 介在性アレルギーは時間とともに減衰し耐性化しうることを確認。数値の照合：申告10%は一致。カードの「臨床的に有意な過敏症は5%未満」に対し候補は「申告を評価すると真のアレルギーは1%未満」で分母・定義が異なり厳密には一致しない。「10年後に約80%が耐性化」は候補では定性表現のみで数値は未確認。交差反応性約2%は候補に記載なし。留保：主出典 SRC-2815 の区分訂正は別枠の節に分離した
  uncertainty: 数値は米国を対象とした総説の抄録に基づく。国内のペニシリンアレルギー申告の頻度は未確認。ペニシリン系・セファロスポリン系抗菌薬は国内承認薬である。
