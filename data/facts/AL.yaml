    source: Ebisawa M, et al. Japanese guidelines for food allergy 2020. Allergol Int. 2020;69(3):370-386.
    doi: 10.1016/j.alit.2020.03.004
    pmid: '33289637'
    pmcid: null
    url: https://doi.org/10.1016/j.alit.2020.03.004
    source_license: CC BY-NC-ND 4.0（Europe PMC で確認）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 主張は日本小児アレルギー学会ガイドラインの英語版（JGFA2020）の抄録で確認した範囲に限る。現行の日本語版は『食物アレルギー診療ガイドライン2021』（書籍）で、本文は直接照合していない。経口免疫療法は同ガイドライン2020年時点で全国一律の保険診療としては未承認とされており、その後の保険適用の状況は未確認。
