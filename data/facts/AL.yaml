- id: AL-006
  domain: AL
  subdomain: 食物アレルギー
  assertion:
    plain_statement_ja: 食物アレルギーの臨床型は、新生児・乳児消化管アレルギー、乳児アトピー性皮膚炎に関連する食物アレルギー、即時型、特殊型（食物依存性運動誘発アナフィラキシーと口腔アレルギー症候群）の4型に分類される。管理では原因食物の完全除去を避け、食べられる形と範囲で可能な限り早期に食べさせることを原則とし、段階的な経口負荷試験で食べられる量を確認する。
    condition:
      region: 日本
      対象: 小児
    differential: null
    common_misconception: null
  provenance:
