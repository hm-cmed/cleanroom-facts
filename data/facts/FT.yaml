- id: FT-014
  domain: FT
  subdomain: 子宮内胎児死亡
  assertion:
    plain_statement_ja: 死産は米国で分娩の160件に1件に起こる、最も多い有害な妊娠転帰の一つである。死産の評価には、胎児の剖検、胎盤・臍帯・卵膜の肉眼的および組織学的検査、遺伝学的評価を含めるべきとされるが、徹底した評価を行っても原因が特定できない症例が一定割合残る。死産後の分娩の方法と時期は、死亡が判明した妊娠週数、母体の産科歴、母体の希望によって決め、情緒的支援と検査結果の明確な伝達が求められる
    condition:
      region: 米国
      対象: 妊婦
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3354
    source: 'American College of Obstetricians and Gynecologists; Society for Maternal-Fetal Medicine. Management of Stillbirth: Obstetric Care Consensus No. 10. Obstet Gynecol. 2020;135(3):e110-e132'
    doi: 10.1097/AOG.0000000000003719
    pmid: '32080052'
    pmcid: null
    url: https://doi.org/10.1097/AOG.0000000000003719
    source_license: © ACOG
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 死産の定義（妊娠週数の区切りを含む）は国や制度で異なり、日本の届出と定義は公的資料（GOV_JP）での照合が未了のため本カードでは扱わない。分娩誘発の薬剤レジメンは RCOG Green-top Guideline No. 55（2025年版）が詳しいが、ミフェプリストン等の国内承認状況が英国と異なるため主張に入れていない
  curriculum:
    kokushi: 医学各論 Ⅰ-3-A-⑨（子宮内胎児死亡、c）
