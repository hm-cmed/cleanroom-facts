- id: FT-008
  domain: FT
  subdomain: 胎児貧血
  assertion:
    plain_statement_ja: 母体赤血球同種免疫で胎児貧血のリスクがある妊娠では、中大脳動脈の収縮期最大血流速度（MCA-PSV）のドプラ計測により、胎児貧血を非侵襲的に評価できる。同種免疫の111例を臍帯穿刺のヘモグロビン値と比較した原著研究では、MCA-PSV の上昇は中等度および重度の胎児貧血を、水腫の有無にかかわらず感度100%で予測し、偽陽性率は12%だった
    condition:
      region: 国際
      対象: 同種免疫のある妊婦
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3348
    source: Mari G, Deter RL, Carpenter RL, et al.; Collaborative Group for Doppler Assessment of the Blood Velocity in Anemic Fetuses. Noninvasive diagnosis by Doppler ultrasonography of fetal anemia due to maternal red-cell alloimmunization. N Engl J Med. 2000;342(1):9-14
    doi: 10.1056/NEJM200001063420102
    pmid: '10620643'
    pmcid: null
    url: https://doi.org/10.1056/NEJM200001063420102
    source_license: CC 表示なし（NEJM）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ75 2026-11-15）：Piura E, Engel O, Doctory N, et al. Velocity Time Integral: A Novel Method for Assessing Fetal Anemia. Children (Basel). 2023;10(7):1090（PMID: 37508587、DOI: 10.3390/children10071090、PMCID: PMC10377850、https://pmc.ncbi.nlm.nih.gov/articles/PMC10377850/）。裏づける部分：候補（CC BY の原著研究）が、主出典（Mari ら 2000）への帰属で、MCA-PSV が中央値の1.5倍を超えることは中等度・重度の胎児貧血を高い感度と低い偽陽性率で示し、同種免疫妊娠における胎児貧血予測の最も受け入れられた手段であることを述べる。カードの主張のうち、MCA-PSV のドプラ計測で胎児貧血を非侵襲的に評価できるという骨格と一致する。数値の照合：感度100%・偽陽性率12%という値そのものは候補に再掲なし（定性的な表現のみ）。他の CC BY 総説でも値の再掲は確認できなかった（申し送りの節参照）。留保：主出典 SRC-3348 の区分は現行 RESTRICTED が正しい（N Engl J Med。Crossref にライセンス登録がなく、Europe PMC の個別レコードで非 OA）。識別子補完候補あり'
  uncertainty: 管理の閾値として広く使われる MCA-PSV 1.50 MoM という数値は本論文の抄録には明示されておらず、本文照合が前提のため主張に入れていない（TAPS の診断基準としての1.5 MoM 超は文脈が異なり FT-005 の出典で確認した）。同種免疫以外の原因による貧血への外挿は本研究では検証されていない
  curriculum:
