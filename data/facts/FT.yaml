- id: FT-004
  domain: FT
  subdomain: 多胎、双胎間輸血症候群
  assertion:
    plain_statement_ja: 双胎間輸血症候群（TTTS）の重症例は、供血児の羊水過少（最大羊水深度2 cm以下）と受血児の羊水過多（同8 cm以上）の併存で定義される。Quintero 分類では、供血児の膀胱が見える Stage I、膀胱が見えない Stage II、重篤なドプラ異常（臍帯動脈の拡張末期血流の消失・逆転、静脈管の逆行性血流、臍帯静脈の拍動性血流）がある Stage III、胎児水腫の Stage IV、一児または両児の死亡の Stage V に分ける
    condition:
      region: 国際
      対象: 一絨毛膜双胎の妊婦
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3344
    source: Quintero RA, Morales WJ, Allen MH, Bornick PW, Johnson PK, Kruger M. Staging of twin-twin transfusion syndrome. J Perinatol. 1999;19(8 Pt 1):550-555
    doi: 10.1038/sj.jp.7200292
    pmid: '10645517'
    pmcid: null
    url: https://doi.org/10.1038/sj.jp.7200292
    source_license: CC 表示なし（Springer Nature）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ75 2026-11-15）：Sorrenti S, Khalil A, D''Antonio F, et al. Counselling in Fetal Medicine: Complications of Monochorionic Diamniotic Twin Pregnancies. J Clin Med. 2024;13(23):7295（PMID: 39685753、DOI: 10.3390/jcm13237295、PMCID: PMC11642260、https://pmc.ncbi.nlm.nih.gov/articles/PMC11642260/）。裏づける部分：候補（CC BY 総説）が TTTS の診断を超音波所見として、供血児の羊水過少（最大羊水深度2 cm未満）と受血児の羊水過多（同8 cm超、妊娠20週以降は10 cm超）の併存とし、Quintero 分類の表を Stage I（羊水過多・過少）、Stage II（供血児の膀胱が見えない）、Stage III（ドプラ異常：臍帯動脈の拡張末期血流の消失・逆転、静脈管の逆行性血流、臍帯静脈の拍動性血流）、Stage IV（胎児水腫）、Stage V（一児または両児の死亡）と再掲する。カードの主張の骨格と一致する。数値の照合：最大羊水深度の閾値は、カードが供血児2 cm以下・受血児8 cm以上であるのに対し、候補は2 cm未満・8 cm超（20週以降は10 cm超）とし、境界の表記と週数による区切りが異なる（申し送りの節参照）。留保：主出典 SRC-3344 の区分は現行 RESTRICTED が正しい（J Perinatol、Springer Nature。Crossref の版ライセンスは TDM のみ、Europe PMC の個別レコードで非 OA）。識別子補完候補あり'
  uncertainty: '1999年の原著で、病期と転帰の関連は抄録で確認した範囲。現在の監視・治療の推奨は SMFM Consult Series #72（2024年、FT-005）が担う'
