- id: FT-007
  domain: FT
  subdomain: 胎児発育不全[fetal growth restriction<FGR>]
  assertion:
    plain_statement_ja: 胎児発育不全（FGR）は、胎盤機能障害をはじめとする病的因子により、胎児が本来の成長のポテンシャルを満たせない状態をいう。FIGO のベストプラクティス・アドバイス（2021年）は、FGR が世界的に死産、新生児死亡、短期および長期の罹患の主要な原因であることを踏まえ、スクリーニング、診断、管理に関する実践的な推奨を、低リソース環境への配慮を含めてまとめている
    condition:
      region: 国際
      対象: 妊婦
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3347
    source: 'Melamed N, Baschat A, Yinon Y, et al. FIGO (international Federation of Gynecology and Obstetrics) initiative on fetal growth: best practice advice for screening, diagnosis, and management of fetal growth restriction. Int J Gynaecol Obstet. 2021;152(Suppl 1):3-57'
    doi: 10.1002/ijgo.13522
    pmid: '33740264'
    pmcid: PMC8252743
    url: https://doi.org/10.1002/ijgo.13522
    source_license: CC BY
    legal_basis: B
    source_class: OPEN
    corroboration: null
  uncertainty: 個別の推奨文（スクリーニング法、監視の間隔、分娩時期など）は本文未照合のため主張に入れていない。診断基準の詳細は Delphi 合意定義（Gordijn 2016、FT-006）が担う
