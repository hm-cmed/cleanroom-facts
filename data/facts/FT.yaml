- id: FT-006
  domain: FT
  subdomain: 胎児発育不全[fetal growth restriction<FGR>]
  assertion:
    plain_statement_ja: 胎児発育不全（FGR）の合意定義（Delphi 手続き、2016年）では、早期 FGR（妊娠32週未満）は、腹囲または推定胎児体重が3パーセンタイル未満、あるいは臍帯動脈の拡張末期血流の消失のいずれかで単独で診断できる。後期 FGR（妊娠32週以降）は腹囲または推定胎児体重の3パーセンタイル未満が単独基準で、これに加えて10パーセンタイル未満に臍帯動脈・子宮動脈ドプラの異常、成長曲線の横断、脳胎盤比の低下などを組み合わせた寄与基準も定められている
    condition:
      region: 国際
      対象: 妊婦
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3346
    source: 'Gordijn SJ, Beune IM, Thilaganathan B, et al. Consensus definition of fetal growth restriction: a Delphi procedure. Ultrasound Obstet Gynecol. 2016;48(3):333-339'
    doi: 10.1002/uog.15884
    pmid: '26909664'
    pmcid: null
    url: https://doi.org/10.1002/uog.15884
    source_license: CC 表示なし（Wiley）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ75 2026-11-15）：SRC-3347：Melamed N, Baschat A, Yinon Y, et al. FIGO (international Federation of Gynecology and Obstetrics) initiative on fetal growth: best practice advice for screening, diagnosis, and management of fetal growth restriction. Int J Gynaecol Obstet. 2021;152(Suppl 1):3-57（マスター登録済み、区分 OPEN）（PMID: 33740264、DOI: 10.1002/ijgo.13522、PMCID: PMC8252743、https://pmc.ncbi.nlm.nih.gov/articles/PMC8252743/）。裏づける部分：候補（CC BY の FIGO イニシアチブ文書で、マスターでは SRC-3347 として OPEN 登録済み）が、Gordijn ら（主出典）への帰属を明示して（「Adapted from Gordijn et al.」）合意定義を Box 1 に再掲する。早期 FGR（妊娠32週未満）は推定胎児体重または腹囲が3パーセンタイル未満、臍帯動脈の拡張末期血流の消失・逆転、または10パーセンタイル未満に臍帯動脈・子宮動脈ドプラ異常の組み合わせ、後期 FGR（妊娠32週以降）は3パーセンタイル未満が単独基準で、これに10パーセンタイル未満・成長曲線の横断（2四分位超）・脳胎盤比低下（5パーセンタイル未満）または臍帯動脈ドプラ異常のうち2つ以上を組み合わせる。カードの主張と一致する。数値の照合：3パーセンタイル未満（単独基準）、10パーセンタイル未満＋寄与基準という構造は候補と一致する。留保：候補は主出典の定義を帰属明示で再掲するガイドライン文書であり、裏づけとしての位置づけが明確である。主出典 SRC-3346 の区分は現行 RESTRICTED が正しい（Ultrasound Obstet Gynecol、Wiley。Crossref の版ライセンスは TDM のみ、Europe PMC の個別レコードで非 OA）。識別子補完候補あり'
  uncertainty: 専門家の合意手続きによる定義で、寄与基準の組み合わせの細部は抄録で確認した範囲に限った。体質的に小さい胎児との区別が難しいことは各ガイドライン共通の課題として挙げられている
