    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3350
    source: Triebwasser JE, Treadwell MC. Prenatal prediction of pulmonary hypoplasia. Semin Fetal Neonatal Med. 2017;22(4):245-249
    doi: 10.1016/j.siny.2017.03.001
    pmid: '28325581'
    pmcid: null
    url: https://doi.org/10.1016/j.siny.2017.03.001
    source_license: CC 表示なし（Elsevier）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ75 2026-11-15）：Avena-Zampieri CL, Hutter J, Rutherford M, et al. Assessment of the fetal lungs in utero. Am J Obstet Gynecol MFM. 2022;4(5):100693（PMID: 35858660、DOI: 10.1016/j.ajogmf.2022.100693、PMCID: PMC9811184、https://pmc.ncbi.nlm.nih.gov/articles/PMC9811184/）。裏づける部分：候補（CC BY 総説）が、肺低形成は胸腔の容量を減らす状態（先天性横隔膜ヘルニア、致死性骨格異形成など）に続発しうること、大きな胸水は肺を圧迫する占拠性病変として働くこと、腎・泌尿生殖器の異常や早産期前期破水などの羊水量が減る状態も肺の発育を損なうこと、肺の大きさの評価が予後予測の指標として広く検討されてきたが先天性横隔膜ヘルニア以外での検証は限られることを述べる。カードの3群の整理（胸腔の容量・運動の制限、腫瘤効果、羊水量の減少）と、出生前予測の有用性と限界の骨格と一致する。数値の照合：数値なし（枠組みのカード）。個別の画像予測法の精度・閾値はカードの主張にも含まれていない。留保：カードの3群への整理そのものを候補が一覧の形で再掲するわけではない（各群の代表例と機序は本文中に分散して記載）。腹壁欠損の明示は候補になかった。主出典 SRC-3350 の区分は現行 RESTRICTED が正しい（Semin Fetal Neonatal Med、Elsevier。Crossref の版ライセンスは TDM のみ、Europe PMC の個別レコードで非 OA）。識別子補完候補あり'
  uncertainty: 個別の画像予測法の精度と閾値は本文未照合のため主張に入れていない。第2三半期の前期破水における危険因子（破水時の妊娠週数と羊水過少）は Vergani 1994 が一次資料だが、本パートでは未使用（申し送り参照）
