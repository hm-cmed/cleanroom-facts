- id: FT-012
  domain: FT
  subdomain: 形態異常
  assertion:
    plain_statement_ja: 胎児の形態異常のスクリーニングでは、妊娠中期のルーチン超音波検査が標準的な評価の機会となる。ISUOG のガイドライン（2022年更新版）は、この妊娠中期ルーチン超音波検査の実施方法を定めたもので、出生前に見つかる形態異常の評価の枠組みの土台になる
    condition:
      region: 国際
      対象: 妊婦
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3352
    source: 'Salomon LJ, Alfirevic Z, Berghella V, et al. ISUOG Practice Guidelines (updated): performance of the routine mid-trimester fetal ultrasound scan. Ultrasound Obstet Gynecol. 2022;59(6):840-856'
    doi: 10.1002/uog.24888
    pmid: '35592929'
    pmcid: null
    url: https://doi.org/10.1002/uog.24888
    source_license: CC 表示なし（Wiley）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 抄録が PubMed に収載されておらず推奨の文言は本文未照合のため、主張は検査の位置づけの範囲に限った。個別の形態異常の評価・管理は各分野が正（水頭症・神経管閉鎖障害は AN、先天性心疾患は循環器）で、出生前診断と胎児スクリーニングの総論（NIPT を含む）は PD（第50回）の範囲
