- id: FT-008
  domain: FT
  subdomain: 胎児貧血
  assertion:
    plain_statement_ja: 母体赤血球同種免疫で胎児貧血のリスクがある妊娠では、中大脳動脈の収縮期最大血流速度（MCA-PSV）のドプラ計測により、胎児貧血を非侵襲的に評価できる。同種免疫の111例を臍帯穿刺のヘモグロビン値と比較した原著研究では、MCA-PSV の上昇は中等度および重度の胎児貧血を、水腫の有無にかかわらず感度100%で予測し、偽陽性率は12%だった
    condition:
      region: 国際
      対象: 同種免疫のある妊婦
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3348
    source: Mari G, Deter RL, Carpenter RL, et al.; Collaborative Group for Doppler Assessment of the Blood Velocity in Anemic Fetuses. Noninvasive diagnosis by Doppler ultrasonography of fetal anemia due to maternal red-cell alloimmunization. N Engl J Med. 2000;342(1):9-14
    doi: 10.1056/NEJM200001063420102
    pmid: '10620643'
    pmcid: null
    url: https://doi.org/10.1056/NEJM200001063420102
    source_license: CC 表示なし（NEJM）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 管理の閾値として広く使われる MCA-PSV 1.50 MoM という数値は本論文の抄録には明示されておらず、本文照合が前提のため主張に入れていない（TAPS の診断基準としての1.5 MoM 超は文脈が異なり FT-005 の出典で確認した）。同種免疫以外の原因による貧血への外挿は本研究では検証されていない
  curriculum:
    kokushi: 医学各論 Ⅰ-3-A-④（胎児貧血、b）
    core_curriculum: 'PS-02-11-05 (id: JkxnuSU)；PS-02-11-03 (id: JkxnuSM)；TBL-02-10-013 (id: JlAKpqo)'
