- id: FT-003
  domain: FT
  subdomain: 胎児機能不全
  assertion:
    plain_statement_ja: 日本産科婦人科学会周産期委員会の胎児心拍数分類は、レベル1（normal）、レベル2（benign variant）、レベル3（mild variant）、レベル4（moderate variant）、レベル5（severe variant）の5段階で評価する。検証研究では判読の再現性は観察者内の重み付きκが0.73〜0.77、観察者間が0.70で主観的3分類より高く、96分娩の検討ではレベルが上がるほど器械分娩・帝王切開の割合が段階的に増え、レベル5では他のレベルより Apgar スコアと臍帯動脈血 pH が低かった
    condition:
      region: 日本
      対象: 妊婦
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3343
    source: 'Hayashi M, Nakai A, Sekiguchi A, Takeshita T. Fetal heart rate classification proposed by the perinatology committee of the Japan Society of Obstetrics and Gynecology: reproducibility and clinical usefulness. J Nippon Med Sch. 2012;79(1):60-68'
    doi: 10.1272/jnms.79.60
    pmid: '22398791'
    pmcid: null
    url: https://doi.org/10.1272/jnms.79.60
    source_license: CC 表示を確認できず
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 出典のライセンス表示を確認できなかったため source_class は UNKNOWN とした。本論文は分類の検証研究であり、各レベルに対応する管理の細部は産科編2026年版などの本文照合が前提のため主張に入れていない
