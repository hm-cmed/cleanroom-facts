- id: FT-014
  domain: FT
  subdomain: 子宮内胎児死亡
  assertion:
    plain_statement_ja: 死産は米国で分娩の160件に1件に起こる、最も多い有害な妊娠転帰の一つである。死産の評価には、胎児の剖検、胎盤・臍帯・卵膜の肉眼的および組織学的検査、遺伝学的評価を含めるべきとされるが、徹底した評価を行っても原因が特定できない症例が一定割合残る。死産後の分娩の方法と時期は、死亡が判明した妊娠週数、母体の産科歴、母体の希望によって決め、情緒的支援と検査結果の明確な伝達が求められる
    condition:
      region: 米国
      対象: 妊婦
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3354
    source: 'American College of Obstetricians and Gynecologists; Society for Maternal-Fetal Medicine. Management of Stillbirth: Obstetric Care Consensus No. 10. Obstet Gynecol. 2020;135(3):e110-e132'
    doi: 10.1097/AOG.0000000000003719
    pmid: '32080052'
    pmcid: null
    url: https://doi.org/10.1097/AOG.0000000000003719
    source_license: © ACOG
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ75 2026-11-15）：Gibbins KJ, Vora NL, Subramaniam A, et al. Addressing Barriers to Autopsy and Genetic Testing in Stillbirth Workup. O&G Open. 2024;1(3):e025（PMID: 41001229、DOI: 10.1097/og9.0000000000000025、PMCID: PMC12456481、https://pmc.ncbi.nlm.nih.gov/articles/PMC12456481/）。裏づける部分：候補（CC BY 総説）が、死産は最も多い重篤な妊娠合併症の一つであること、徹底した評価でも原因が特定できない症例が一定割合残ること、評価の柱は胎盤病理・胎児剖検・遺伝学的検査で、ACOG は全死産例への剖検を推奨していること、遺族へのカウンセリングと意思決定支援が求められることを述べる。カードの主張のうち、評価に剖検・胎盤等の検査・遺伝学的評価を含める点と、原因不明例が残る点、情緒的支援の必要性の骨格と一致する。数値の照合：カードの「米国で分娩の160件に1件」は候補に再掲なし。候補は米国の死産率として2021年の5.73/1,000出生（約175件に1件）を挙げており、データの年次が異なる（申し送りの節参照）。胎盤病理が有用な割合65%・剖検42%は候補側の数値でカードにはない。留保：分娩の方法と時期を妊娠週数・産科歴・母体の希望で決めるという点は候補に明示的な再掲なし。主出典 SRC-3354 の区分は現行 RESTRICTED が正しい（Obstet Gynecol、Wolters Kluwer。Crossref にライセンス登録がなく、Europe PMC の個別レコードで非 OA）。識別子補完候補あり'
  uncertainty: 死産の定義（妊娠週数の区切りを含む）は国や制度で異なり、日本の届出と定義は公的資料（GOV_JP）での照合が未了のため本カードでは扱わない。分娩誘発の薬剤レジメンは RCOG Green-top Guideline No. 55（2025年版）が詳しいが、ミフェプリストン等の国内承認状況が英国と異なるため主張に入れていない
