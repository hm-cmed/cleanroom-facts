- id: FT-005
  domain: FT
  subdomain: 多胎、双胎間輸血症候群
  assertion:
    plain_statement_ja: 一絨毛膜二羊膜双胎では、双胎間輸血症候群（TTTS）の超音波サーベイランスを妊娠16週から開始し、少なくとも2週ごとに分娩まで続ける（GRADE 1C）。胎児鏡下レーザー手術は妊娠16〜26週に現れた Stage II〜IV の TTTS の標準治療で（GRADE 1A）、Stage I は無症状で妊娠継続する場合は少なくとも週1回の監視による待機的管理が勧められる（GRADE 1B）。双胎貧血多血症（TAPS）の出生前診断には、供血児の中大脳動脈収縮期最大血流速度が中央値の1.5倍超かつ受血児が1.0倍未満、または双胎間の差が0.5 MoM 超のいずれかが必要とされる（GRADE 1C）
    condition:
      region: 米国
      対象: 一絨毛膜双胎の妊婦
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3345
    source: 'Society for Maternal-Fetal Medicine; Miller RS, Miller JL, Monson MA, et al. Society for Maternal-Fetal Medicine Consult Series #72: Twin-twin transfusion syndrome and twin anemia-polycythemia sequence. Am J Obstet Gynecol. 2024;231(4):B16-B37'
    doi: 10.1016/j.ajog.2024.07.017
    pmid: '39029545'
    pmcid: null
    url: https://doi.org/10.1016/j.ajog.2024.07.017
    source_license: CC 表示なし（Elsevier）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 推奨文は抄録で確認した範囲。分娩時期の推奨（レーザーで解消した二児生存例では妊娠34〜36週など）や Stage 分類の細部は本文未照合のため主張に入れていない。日本では TTTS に対する胎児鏡下レーザー手術は国民健康保険の適用があり標準的な胎児治療として位置づけられている（Sago & Wada 2020 による。本カードの出典ではない）
  curriculum:
    kokushi: 医学各論 Ⅰ-3-A-②（多胎、双胎間輸血症候群、b）
