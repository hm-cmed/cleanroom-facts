- id: FT-002
  domain: FT
  subdomain: 胎児機能不全
  assertion:
    plain_statement_ja: FIGO の分娩時胎児モニタリング専門家合意ガイドライン（2015年）では、胎児心拍数陣痛図（CTG）を normal、suspicious、pathological の3区分に分類する。normal は基線110〜160 bpm、基線細変動5〜25 bpm、反復性一過性徐脈がない状態で、pathological は基線100 bpm未満、基線細変動の減少・増大またはサイヌソイダルパターン、30分を超える反復性の遅発・遷延一過性徐脈、5分を超える遷延一過性徐脈などに当てはまり、低酸素・アシドーシスの可能性が高い胎児として可逆的原因への即時の対応が求められる。suspicious は正常の特徴を少なくとも1つ欠くが病的所見のない中間の区分である
    condition:
      region: 国際
      対象: 妊婦
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3342
    source: 'Ayres-de-Campos D, Spong CY, Chandraharan E; FIGO Intrapartum Fetal Monitoring Expert Consensus Panel. FIGO consensus guidelines on intrapartum fetal monitoring: Cardiotocography. Int J Gynaecol Obstet. 2015;131(1):13-24'
    doi: 10.1016/j.ijgo.2015.06.020
    pmid: '26433401'
    pmcid: null
    url: https://doi.org/10.1016/j.ijgo.2015.06.020
    source_license: CC 表示なし（Elsevier、© FIGO／Elsevier）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 分類基準は本文（出版社版 PDF）の分類表（Table 1）で確認した（表から読み取り）。再評価の間隔（少なくとも30分ごと）や記録の紙送り速度などの運用の細部は主張に入れていない
