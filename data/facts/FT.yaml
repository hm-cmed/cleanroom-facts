- id: FT-001
  domain: FT
  subdomain: 胎児機能不全
  assertion:
    plain_statement_ja: 米国産科婦人科学会の診療ガイドライン（Clinical Practice Guideline No. 10、2025年）は、分娩第1期・第2期の妊婦を対象に、分娩時胎児心拍パターンの評価と管理についてエビデンスに基づく枠組みを示したもので、用語と分類体系の概説と、波形の評価・管理に関する推奨（強さとエビデンスの質で格付けされる）を含む。作成には modified GRADE の evidence-to-decision 枠組みが用いられた
    condition:
      region: 米国
      対象: 妊婦
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3341
    source: 'American College of Obstetricians and Gynecologists Committee on Clinical Practice Guidelines–Obstetrics. ACOG Clinical Practice Guideline No. 10: Intrapartum Fetal Heart Rate Monitoring: Interpretation and Management. Obstet Gynecol. 2025;146(4):583-599'
    doi: 10.1097/AOG.0000000000006049
    pmid: '40966736'
    pmcid: null
    url: https://doi.org/10.1097/AOG.0000000000006049
    source_license: © 2025 ACOG
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 個別の波形パターンの分類基準値と推奨文は本文未照合のため主張に入れていない。2009年の Practice Bulletin No. 106 との置き換え関係の明文は抄録の範囲では未確認。胎児評価法の方法論総論は PD（第50回）が正で、本カードは胎児機能不全への適用の枠組みに限る
