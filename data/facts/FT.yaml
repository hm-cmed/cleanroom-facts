- id: FT-010
  domain: FT
  subdomain: 肺低形成
  assertion:
    plain_statement_ja: 胎児肺低形成に関連する状態は、胸腔の容量や運動を制限するもの（骨格異形成、腹壁欠損など）、腫瘤効果を持つもの（先天性横隔膜ヘルニア、胸水など）、羊水量が減るもの（早産期前期破水、泌尿生殖器の異常など）の3群に整理される。出生前に重症度を予測することは、家族への説明と産科・新生児管理に役立つが、広く使われる画像による予測法には限界がある
    condition:
      region: 国際
      対象: 肺低形成のリスクがある妊婦
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3350
    source: Triebwasser JE, Treadwell MC. Prenatal prediction of pulmonary hypoplasia. Semin Fetal Neonatal Med. 2017;22(4):245-249
    doi: 10.1016/j.siny.2017.03.001
    pmid: '28325581'
    pmcid: null
    url: https://doi.org/10.1016/j.siny.2017.03.001
    source_license: CC 表示なし（Elsevier）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 個別の画像予測法の精度と閾値は本文未照合のため主張に入れていない。第2三半期の前期破水における危険因子（破水時の妊娠週数と羊水過少）は Vergani 1994 が一次資料だが、本パートでは未使用（申し送り参照）
  curriculum:
    kokushi: 医学各論 Ⅰ-3-A-⑤（肺低形成、b）
