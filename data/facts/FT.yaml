- id: FT-013
  domain: FT
  subdomain: 胎児水腫・胸水・腹水
  assertion:
    plain_statement_ja: '非免疫性胎児水腫（NIHF）は、胎児の遺伝性疾患、先天異常、感染、胎児不整脈、胎盤腫瘍、一絨毛膜双胎の合併症など、多様な原因で生じる。SMFM Consult Series #75（2026年）は、胎児に液体貯留が1か所以上見つかった全ての妊娠に対し、染色体マイクロアレイを含む胎児診断検査を行うことを勧め、感染が鑑別に上がる場合は PCR 検査も行うとしている（いずれも GRADE 1C）。マイクロアレイ等で診断がつかない場合は、エクソームまたはゲノム解析の提示が勧められる（GRADE 1C）。分娩時期は個別化し、早産分娩は産科的適応がある場合に限るとされる（GRADE 1C）'
    condition:
      region: 米国
      対象: 胎児水腫のある妊婦
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3353
    source: 'Society for Maternal-Fetal Medicine; Sparks TN, Norton ME, et al. Society for Maternal-Fetal Medicine Consult Series #75: Evaluation and management of non-immune hydrops fetalis. Pregnancy (Hoboken). 2026;2(2)'
    doi: 10.1002/pmf2.70208
    pmid: '42596935'
    pmcid: PMC13344273
    url: https://doi.org/10.1002/pmf2.70208
    source_license: CC BY-NC
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: '推奨文は抄録で確認した範囲で、頁は未照合（巻号は Europe PMC で確認）。NIHF の定義の細部（異常な液体貯留が2か所以上）は前版の SMFM ガイドライン #7（2015年）の記載で、本版（#75）の本文での逐語確認は未了。胎児胸水に対する胸腔・羊水腔シャントは国内で保険適用のある胎児治療の一つ（Sago & Wada 2020 による。本カードの出典ではない）'
