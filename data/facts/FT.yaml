- id: FT-009
  domain: FT
  subdomain: 胎児貧血
  assertion:
    plain_statement_ja: 胎児母体間輸血は、分娩前または分娩中に胎児血が母体循環に入る現象で、胎児貧血を介して神経学的障害、死産、新生児死亡の原因になりうる。出生前の最も多い現れ方は胎動減少の自覚で、誘因が明らかでないことが多い。診断の標準は Kleihauer-Betke 検査だが限界があり、出生前に検出された場合は臍帯穿刺と子宮内輸血を含む管理が検討される
    condition:
      region: 米国
      対象: 妊婦
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3349
    source: Wylie BJ, D'Alton ME. Fetomaternal hemorrhage. Obstet Gynecol. 2010;115(5):1039-1051
    doi: 10.1097/AOG.0b013e3181da7929
    pmid: '20410781'
    pmcid: null
    url: https://doi.org/10.1097/AOG.0b013e3181da7929
    source_license: © ACOG
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ75 2026-11-15）：Zheng Y, Li D, Li X, Zheng A, Wang F. Spontaneous massive fetomaternal hemorrhage: two case reports and a literature review of placental pathology. BMC Pregnancy Childbirth. 2023;23(1):530（PMID: 37480031、DOI: 10.1186/s12884-023-05826-9、PMCID: PMC10360317、https://pmc.ncbi.nlm.nih.gov/articles/PMC10360317/）。裏づける部分：候補（CC BY の症例報告と文献レビュー）が、胎児母体間輸血は胎児貧血を介して神経学的障害・死産・新生児死亡の原因になりうること、出生前の現れ方として胎動減少・消失が通常みられる所見で、胎動減少が唯一の訴えのこともあること、母体循環中の胎児血球の検出により診断を確定でき、用いる検査として Kleihauer-Betke 検査（ほかにフローサイトメトリー等）が挙げられること、出生前に診断された場合は子宮内輸血で胎児貧血を是正できることを述べる。カードの主張の骨格と一致する。数値の照合：数値なし（定義と診断・管理の枠組みのカード）。留保：Kleihauer-Betke 検査が診断の標準であるという位置づけとその限界、臍帯穿刺を含む管理という細部は候補に明示的な再掲なし。主出典 SRC-3349 の区分は現行 RESTRICTED が正しい（Obstet Gynecol、Wolters Kluwer。Crossref にライセンス登録がなく、Europe PMC の個別レコードで非 OA）。識別子補完候補あり'
  uncertainty: 2010年の総説で、Kleihauer-Betke 検査の限界の詳細や輸血量の推定法は本文による。子宮内輸血の国内の実施体制と保険の扱いは未確認
