- id: FT-005
  domain: FT
  subdomain: 多胎、双胎間輸血症候群
  assertion:
    plain_statement_ja: 一絨毛膜二羊膜双胎では、双胎間輸血症候群（TTTS）の超音波サーベイランスを妊娠16週から開始し、少なくとも2週ごとに分娩まで続ける（GRADE 1C）。胎児鏡下レーザー手術は妊娠16〜26週に現れた Stage II〜IV の TTTS の標準治療で（GRADE 1A）、Stage I は無症状で妊娠継続する場合は少なくとも週1回の監視による待機的管理が勧められる（GRADE 1B）。双胎貧血多血症（TAPS）の出生前診断には、供血児の中大脳動脈収縮期最大血流速度が中央値の1.5倍超かつ受血児が1.0倍未満、または双胎間の差が0.5 MoM 超のいずれかが必要とされる（GRADE 1C）
    condition:
      region: 米国
      対象: 一絨毛膜双胎の妊婦
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3345
    source: 'Society for Maternal-Fetal Medicine; Miller RS, Miller JL, Monson MA, et al. Society for Maternal-Fetal Medicine Consult Series #72: Twin-twin transfusion syndrome and twin anemia-polycythemia sequence. Am J Obstet Gynecol. 2024;231(4):B16-B37'
    doi: 10.1016/j.ajog.2024.07.017
    pmid: '39029545'
    pmcid: null
    url: https://doi.org/10.1016/j.ajog.2024.07.017
    source_license: CC 表示なし（Elsevier）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ75 2026-11-15）：Sorrenti S, Khalil A, D''Antonio F, et al. Counselling in Fetal Medicine: Complications of Monochorionic Diamniotic Twin Pregnancies. J Clin Med. 2024;13(23):7295（PMID: 39685753、DOI: 10.3390/jcm13237295、PMCID: PMC11642260、https://pmc.ncbi.nlm.nih.gov/articles/PMC11642260/）。裏づける部分：候補（CC BY 総説）が、一絨毛膜双胎では妊娠16週から2週ごとの超音波評価を行うこと（候補では ISUOG ガイドラインへの帰属）、胎児鏡下レーザー凝固が TTTS 治療のゴールドスタンダードであること、TAPS の出生前診断基準として供血児側 MCA-PSV が中央値の1.5倍超かつ受血児側が1.0倍未満であることを述べる。カードの主張のうち、サーベイランスの開始時期と間隔、レーザー手術の標準治療としての位置づけ、TAPS 基準の前半と一致する。数値の照合：MCA-PSV の1.5倍超・1.0倍未満は候補と一致する。双胎間の差0.5 MoM 超という TAPS の代替基準、レーザーの適応範囲（妊娠16〜26週・Stage II〜IV）と GRADE の格付け（1C・1A・1B）、Stage I の週1回監視による待機的管理は候補に再掲なし。留保：主出典 SRC-3345 の区分は現行 RESTRICTED が正しい（Am J Obstet Gynecol、Elsevier。Crossref の版ライセンスは TDM のみ、Europe PMC の個別レコードで非 OA）。識別子補完候補あり'
  uncertainty: 推奨文は抄録で確認した範囲。分娩時期の推奨（レーザーで解消した二児生存例では妊娠34〜36週など）や Stage 分類の細部は本文未照合のため主張に入れていない。日本では TTTS に対する胎児鏡下レーザー手術は国民健康保険の適用があり標準的な胎児治療として位置づけられている（Sago & Wada 2020 による。本カードの出典ではない）
