- id: FT-011
  domain: FT
  subdomain: 胎児新生児溶血性疾患<HDFN>、血液型不適合妊娠
  assertion:
    plain_statement_ja: 赤血球同種免疫は、不適合な胎児赤血球が母体循環に入ることで生じ、次回以降の妊娠で胎児貧血、胎児水腫、周産期死亡を起こしうる。RhD 同種免疫の多くは、Rh 免疫グロブリン（抗D免疫グロブリン）の適切な投与により予防できる。2025年の臨床実践ガイドラインは、輸血医療、血液学、母体胎児医学、新生児学の4つの作業部会に患者と倫理の代表を加えた Delphi 過程で、同種免疫妊娠の管理に関する推奨をまとめた
    condition:
      region: 米国
      対象: 同種免疫のある妊婦
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3351
    source: Moise KJ Jr, Markham KB, Spinella PC, et al. A Clinical Practice Guideline for the Management of Pregnancy Alloimmunized to Red Blood Cell Antigens. JAMA Netw Open. 2025;8(11):e2544649
    doi: 10.1001/jamanetworkopen.2025.44649
    pmid: '41284292'
    pmcid: null
    url: https://doi.org/10.1001/jamanetworkopen.2025.44649
    source_license: CC 表示を確認できず（Europe PMC でライセンス欄なし）
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 出典のライセンス表示を Europe PMC で確認できなかったため source_class は UNKNOWN とした（JAMA Network Open は通常 CC BY のため、取り込み側で CC BY が確認できれば OPEN に変わりうる）。抗D人免疫グロブリン製剤は国内承認済みで、妊娠中投与の効能は公知申請を経て追加された経緯がある（投与の主体は母体管理で、感作予防は PG の SRC-3178 が正）。個別の推奨文は本文未照合のため主張に入れていない。ニポカリマブは HDFN の適応では国内未承認で治験中のため本カードでは扱わない
