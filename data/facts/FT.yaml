- id: FT-004
  domain: FT
  subdomain: 多胎、双胎間輸血症候群
  assertion:
    plain_statement_ja: 双胎間輸血症候群（TTTS）の重症例は、供血児の羊水過少（最大羊水深度2 cm以下）と受血児の羊水過多（同8 cm以上）の併存で定義される。Quintero 分類では、供血児の膀胱が見える Stage I、膀胱が見えない Stage II、重篤なドプラ異常（臍帯動脈の拡張末期血流の消失・逆転、静脈管の逆行性血流、臍帯静脈の拍動性血流）がある Stage III、胎児水腫の Stage IV、一児または両児の死亡の Stage V に分ける
    condition:
      region: 国際
      対象: 一絨毛膜双胎の妊婦
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3344
    source: Quintero RA, Morales WJ, Allen MH, Bornick PW, Johnson PK, Kruger M. Staging of twin-twin transfusion syndrome. J Perinatol. 1999;19(8 Pt 1):550-555
    doi: 10.1038/sj.jp.7200292
    pmid: '10645517'
    pmcid: null
    url: https://doi.org/10.1038/sj.jp.7200292
    source_license: CC 表示なし（Springer Nature）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: '1999年の原著で、病期と転帰の関連は抄録で確認した範囲。現在の監視・治療の推奨は SMFM Consult Series #72（2024年、FT-005）が担う'
  curriculum:
    kokushi: 医学各論 Ⅰ-3-A-②（多胎、双胎間輸血症候群、b）
    core_curriculum: 'PS-02-11-05 (id: JkxnuSU)；PS-02-11-03 (id: JkxnuSM)；TBL-01-00-365 (id: JlvnmCA)；TBL-02-10-002 (id: JlAKpp8)'
