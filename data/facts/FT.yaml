- id: FT-009
  domain: FT
  subdomain: 胎児貧血
  assertion:
    plain_statement_ja: 胎児母体間輸血は、分娩前または分娩中に胎児血が母体循環に入る現象で、胎児貧血を介して神経学的障害、死産、新生児死亡の原因になりうる。出生前の最も多い現れ方は胎動減少の自覚で、誘因が明らかでないことが多い。診断の標準は Kleihauer-Betke 検査だが限界があり、出生前に検出された場合は臍帯穿刺と子宮内輸血を含む管理が検討される
    condition:
      region: 米国
      対象: 妊婦
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3349
    source: Wylie BJ, D'Alton ME. Fetomaternal hemorrhage. Obstet Gynecol. 2010;115(5):1039-1051
    doi: 10.1097/AOG.0b013e3181da7929
    pmid: '20410781'
    pmcid: null
    url: https://doi.org/10.1097/AOG.0b013e3181da7929
    source_license: © ACOG
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 2010年の総説で、Kleihauer-Betke 検査の限界の詳細や輸血量の推定法は本文による。子宮内輸血の国内の実施体制と保険の扱いは未確認
