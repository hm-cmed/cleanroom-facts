- id: FT-002
  domain: FT
  subdomain: 胎児機能不全
  assertion:
    plain_statement_ja: FIGO の分娩時胎児モニタリング専門家合意ガイドライン（2015年）では、胎児心拍数陣痛図（CTG）を normal、suspicious、pathological の3区分に分類する。normal は基線110〜160 bpm、基線細変動5〜25 bpm、反復性一過性徐脈がない状態で、pathological は基線100 bpm未満、基線細変動の減少・増大またはサイヌソイダルパターン、30分を超える反復性の遅発・遷延一過性徐脈、5分を超える遷延一過性徐脈などに当てはまり、低酸素・アシドーシスの可能性が高い胎児として可逆的原因への即時の対応が求められる。suspicious は正常の特徴を少なくとも1つ欠くが病的所見のない中間の区分である
    condition:
      region: 国際
      対象: 妊婦
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3342
    source: 'Ayres-de-Campos D, Spong CY, Chandraharan E; FIGO Intrapartum Fetal Monitoring Expert Consensus Panel. FIGO consensus guidelines on intrapartum fetal monitoring: Cardiotocography. Int J Gynaecol Obstet. 2015;131(1):13-24'
    doi: 10.1016/j.ijgo.2015.06.020
    pmid: '26433401'
    pmcid: null
    url: https://doi.org/10.1016/j.ijgo.2015.06.020
    source_license: CC 表示なし（Elsevier、© FIGO／Elsevier）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ75 2026-11-15）：Troha N, Razem K, Luzovec U, Lucovnik M. Comparison of Four Intrapartum Cardiotocography Classifications for Predicting Neonatal Acidemia at Birth. J Pregnancy. 2023;2023:5853889（PMID: 36814692、DOI: 10.1155/2023/5853889、PMCID: PMC9940944、https://pmc.ncbi.nlm.nih.gov/articles/PMC9940944/）。裏づける部分：候補（CC BY の原著研究）が FIGO 分類の表を再掲する。normal は基線110〜160 bpm・基線細変動5〜25 bpm・反復性一過性徐脈なし、suspicious は正常の特徴を少なくとも1つ欠くが病的特徴のないもの、pathological は基線100 bpm未満、基線細変動の減少・増大またはサイヌソイダルパターン、30分を超える反復性の遅発・遷延一過性徐脈（細変動低下があれば20分）または5分を超える遷延一過性徐脈、とカードの主張の分類基準のほぼ全範囲が一致する。数値の照合：基線110〜160 bpm、基線細変動5〜25 bpm、pathological の基線100 bpm未満・30分超（細変動低下時20分）・5分超は候補と一致する。留保：pathological の場合に低酸素・アシドーシスの可能性が高いとして可逆的原因への即時の対応が求められるという管理上の含意は、候補では明示的な再掲なし（候補はアシデミア予測の観点の論文）。主出典 SRC-3342 の区分は現行 RESTRICTED が正しい（刊行版のライセンスは CC BY-NC-ND 4.0 で自由区分に当たらない。Crossref の版データと Europe PMC の個別レコードで確認。マスターの license_note は空欄で、精緻化候補として申し送りに記す）。識別子補完候補あり'
