- id: FT-006
  domain: FT
  subdomain: 胎児発育不全[fetal growth restriction<FGR>]
  assertion:
    plain_statement_ja: 胎児発育不全（FGR）の合意定義（Delphi 手続き、2016年）では、早期 FGR（妊娠32週未満）は、腹囲または推定胎児体重が3パーセンタイル未満、あるいは臍帯動脈の拡張末期血流の消失のいずれかで単独で診断できる。後期 FGR（妊娠32週以降）は腹囲または推定胎児体重の3パーセンタイル未満が単独基準で、これに加えて10パーセンタイル未満に臍帯動脈・子宮動脈ドプラの異常、成長曲線の横断、脳胎盤比の低下などを組み合わせた寄与基準も定められている
    condition:
      region: 国際
      対象: 妊婦
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3346
    source: 'Gordijn SJ, Beune IM, Thilaganathan B, et al. Consensus definition of fetal growth restriction: a Delphi procedure. Ultrasound Obstet Gynecol. 2016;48(3):333-339'
    doi: 10.1002/uog.15884
    pmid: '26909664'
    pmcid: null
    url: https://doi.org/10.1002/uog.15884
    source_license: CC 表示なし（Wiley）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 専門家の合意手続きによる定義で、寄与基準の組み合わせの細部は抄録で確認した範囲に限った。体質的に小さい胎児との区別が難しいことは各ガイドライン共通の課題として挙げられている
  curriculum:
    kokushi: 医学各論 Ⅰ-3-A-③（胎児発育不全[fetal growth restriction<FGR>]、b）
    core_curriculum: 'PS-02-11-05 (id: JkxnuSU)；PS-02-11-03 (id: JkxnuSM)；TBL-02-10-013 (id: JlAKpqo)'
