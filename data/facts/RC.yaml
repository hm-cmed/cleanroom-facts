- id: RC-017
  domain: RC
  subdomain: 再生不良性貧血
  assertion:
    plain_statement_ja: 再生不良性貧血の診断は、血液検査の3項目のうち2項目以上を満たすこと、骨髄検査で低形成を確認すること、鑑別診断を除外することの組み合わせで行う。血液検査の3項目は、ヘモグロビン 10.0 g/dL 未満、好中球 1500/µL 未満、血小板 10万/µL 未満である。
    condition:
      region: 日本
      対象: 成人
    differential: null
    common_misconception: null
  provenance:
