- id: RC-001
  domain: RC
  subdomain: 鉄欠乏性貧血
  assertion:
    plain_statement_ja: 鉄欠乏の判定では血清フェリチンが最も特異的な検査であり、炎症がない状況では15 µg/L未満は貯蔵鉄の欠如を、30 µg/L未満は体内の鉄貯蔵が低い状態を示す。トランスフェリン飽和度20%未満は鉄制限の指標である。
    condition:
      region: 英国
      対象: 成人
    differential: null
    common_misconception: null
  provenance:
