    source: 特発性造血障害に関する調査研究班『再生不良性貧血診療の参照ガイド 令和7年度改訂版』（令和8年＝2026年3月）
    doi: null
    pmid: null
    pmcid: null
    url: null
    source_license: 表示なし
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 令和7年度改訂で診断基準が A（血液検査）＋B（骨髄検査）＋C（鑑別診断の除外）の構造に刷新された。数値基準自体は旧基準と共通である。骨髄所見が必須項目になった点と、臨床症状が診断要件から外された点に注意。参照ガイドは厚生労働科学研究費による公的資料だが、PDF にライセンス表示が確認できなかったため source_class は UNKNOWN とし、GOV_JP とする判断は取り込み側に委ねる。
