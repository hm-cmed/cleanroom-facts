    plain_statement_ja: 先天性心疾患は出生の約1%（米国で年約4万人）にみられ、その約4人に1人は重症（critical）である。重症の先天性心疾患の1年生存率は約75%、18歳までの生存率は約69%で、重症でないもの（それぞれ約97%、約95%）より低い。重症例の1年生存率は1979〜1993年の約67%から1994〜2005年の約83%に改善した。
