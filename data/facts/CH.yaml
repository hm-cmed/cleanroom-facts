- id: CH-005
  domain: CH
  subdomain: 単心房、単心室
  assertion:
    plain_statement_ja: Fontan 手術後の10年生存率はおおむね80%を超えるが、心不全の有病率は術後早期の10〜20%から成人期には約50%に増える。原因には心室機能の低下、肺血管抵抗の上昇による前負荷の不足、蛋白漏出性胃腸症、肝うっ血、心房性不整脈、洞不全などがある。
    condition:
      guideline: JCS 成人先天性心疾患診療ガイドライン（2017年改訂版）（日本語版）
