- id: CH-013
  domain: CH
  subdomain: Fallot四徴症
  assertion:
    plain_statement_ja: 心臓MRIで肺動脈弁逆流の逆流率が40%を超えると重症とされる。Fallot 四徴症の修復後で、重症の肺動脈弁逆流と高度の右室拡大（右室拡張末期容積係数160 mL/m²超、または収縮末期容積係数82 mL/m²超）がある例では、肺動脈弁置換後も右室のリバースリモデリングが起こりにくい。微量の肺動脈弁逆流は健常者の最大75%にみられる。
