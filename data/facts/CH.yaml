- id: CH-007
  domain: CH
  subdomain: 心室中隔欠損症
  assertion:
    plain_statement_ja: 心室中隔欠損症（VSD）は米国で出生1万あたり約42人（年約16,800人）にみられる。小さい欠損は症状がなく自然に閉じることが多いが、大きい欠損では多呼吸、発汗、哺乳時の疲れ、体重増加不良がみられ、修復しなければ心不全、肺高血圧、不整脈、脳卒中を起こしうる。大きい欠損や閉じない欠損はカテーテル治療か開心術で閉鎖する。
