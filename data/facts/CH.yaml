  domain: CH
  subdomain: 総肺静脈還流異常症
  assertion:
    plain_statement_ja: 総肺静脈還流異常症では、肺静脈が左房につながらず、異常な経路（心上部型、心臓型、心下部型）で右心系に戻るため、心房中隔欠損を通って混合血が左心系に流れる。多くは出生直後からチアノーゼや呼吸障害を示し、手術で肺静脈を左房につなぎ直して異常な接続と心房中隔欠損を閉じる。米国では約6,667人に1人（年約540人）にみられる。
