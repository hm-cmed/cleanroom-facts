    doi: null
    pmid: null
    pmcid: null
    url: https://plaza.umin.ac.jp/~jscvs/wordpress/wp-content/uploads/2020/06/JCS2017_ichida_h.pdf
    source_license: 「無断転載を禁ずる」の表示。CC の表示なし
    legal_basis: B
    source_class: RESTRICTED
    corroboration: 'CH-018（指定難病の資料の Fontan 術後症候群）。自由に使える資料による裏づけ（OPEN、作り手の調査バッチ94 2026-11-15）：Jarasvaraparn C, Schooler GR, González IA, Ginde S, Mavis A. Long-Term Care in Fontan Circulation: Surveillance and Management of Fontan-Associated Liver Disease and Protein-Losing Enteropathy. Curr Cardiol Rep. 2026;28(1)（PMID: 42154163、DOI: 10.1007/s11886-026-02378-0、PMCID: PMC13186934、https://creativecommons.org/licenses/by/4.0/）。裏づける部分：部分：候補（Fontan 循環の長期管理の総説、CC BY）は、長期合併症として単心室機能低下による心不全、蛋白漏出性胃腸症、不整脈、Fontan 関連肝疾患（肝うっ血を含む）を挙げ、カードの原因の顔ぶれ（心室機能の低下・蛋白漏出性胃腸症・肝うっ血・心房性不整脈）と定性的に重なる。肺血管抵抗の上昇による前負荷の不足と洞不全の明記、心不全の有病率が成人期に約50%へ増えるという値は再掲されない。数値の照合：不一致（対象が異なる）：候補の10年生存率は「2001年以降の手術例で90〜95%超」であり、カードの「おおむね80%を超える」（時代を問わない一般値）とは対象が異なり一致しない。候補の数値をカードの裏づけとして登録しないこと。心不全の有病率（術後早期10〜20%から成人期約50%）は候補に再掲がない。留保：カードには既存の裏づけ CH-018（指定難病の資料の Fontan 術後症候群）があり、本候補は追加の裏づけである。主出典の区分は CH-002 行のとおり RESTRICTED が正しい。監視事項：主出典の2025年改訂版が刊行済み（申し送り参照）。候補のライセンスは Europe PMC の個別レコード（cc by）と PMC 全文のライセンス要素（CC BY 4.0）で個別確認した'
