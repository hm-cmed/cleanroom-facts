- id: CH-013
  domain: CH
  subdomain: Fallot四徴症
  assertion:
    plain_statement_ja: 心臓MRIで肺動脈弁逆流の逆流率が40%を超えると重症とされる。Fallot 四徴症の修復後で、重症の肺動脈弁逆流と高度の右室拡大（右室拡張末期容積係数160 mL/m²超、または収縮末期容積係数82 mL/m²超）がある例では、肺動脈弁置換後も右室のリバースリモデリングが起こりにくい。微量の肺動脈弁逆流は健常者の最大75%にみられる。
    condition:
      guideline: 英国心エコー図学会（BSE）三尖弁・肺動脈弁の心エコー評価ガイドライン 2020
      region: 英国
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-234
    source: 'Zaidi A, Oxborough D, Augustine DX, et al. Echocardiographic assessment of the tricuspid and pulmonary valves: a practical guideline from the British Society of Echocardiography. Echo Res Pract 2020;7:G95-G122'
    doi: 10.1530/ERP-20-0033
    pmid: null
    pmcid: null
    url: https://doi.org/10.1530/ERP-20-0033
    source_license: CC BY-NC-ND 4.0（リポジトリの表示。著者最終稿）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ94 2026-11-15）：Zhou Z, Huang Y, Han L, et al. Right ventricular dilatation score: a new assessment to right ventricular dilatation in adult patients with repaired tetralogy of Fallot. BMC Cardiovasc Disord. 2023;23(1)（PMID: 37710173、DOI: 10.1186/s12872-023-03487-2、PMCID: PMC10500856、https://creativecommons.org/licenses/by/4.0/）。裏づける部分：部分：候補（Fallot 四徴症修復後の右室拡大の研究、CC BY）は、心臓MRIによる右室容積が肺動脈弁置換の介入判断の基準になることと、ガイドラインの閾値として右室拡張末期容積係数160 mL/m²以上を再掲する。心臓MRIで逆流率40%超を重症とする肺動脈弁逆流の重症度分類と、微量の肺動脈弁逆流が健常者の最大75%にみられるという値は、自由な全文で再掲されない。数値の照合：部分一致：右室拡張末期容積係数160 mL/m²は候補の再掲と一致する。右室収縮末期容積係数は、候補が閾値を80 mL/m²とするのに対しカードは82 mL/m²超であり一致しない。候補の80をカードの82の裏づけとして登録しないこと。別の CC BY の系統的レビュー（Slouha E, et al. Cureus. 2023;15(11):e49577）にも近傍値（収縮末期容積係数82未満で正常化、拡張末期容積係数158・165等）が散在するが、カードの「160超・82超」の組そのものの再掲ではない。留保：主出典（SRC-234）の刊行版ライセンスは CC BY-NC-ND 4.0 で、現行 RESTRICTED が正しい（区分訂正の節参照。Crossref は CC BY 4.0 を記録するが刊行版を優先する）。カードの uncertainty「刊行版の表記は未確認」は本バッチで解消した（申し送り参照）。識別子補完候補あり（SRC-234 の PMID・PMCID）。候補のライセンスは Europe PMC の個別レコード（cc by）と PMC 全文のライセンス要素（CC BY 4.0）で個別確認した'
  uncertainty: 著者最終稿で確認した。刊行版の表記は未確認
