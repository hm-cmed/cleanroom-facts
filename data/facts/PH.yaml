  uncertainty: 周期性四肢運動障害の診断数値（周期性四肢運動指数の基準値など）は ICSD-3-TR 本文で未照合のため、本カードの主張には含めていない。トリアゾラムとバルプロ酸には、周期性四肢運動障害を効能・効果とする国内承認はない。
