- id: PH-005
  domain: PH
  subdomain: 神経性過食症<大食症>
  assertion:
    plain_statement_ja: 神経性過食症の女性外来患者387例を対象とした多施設二重盲検試験では、フルオキセチン60 mg/日がプラセボより、週あたりのむちゃ食いと嘔吐のエピソード数の減少で優れており、20 mg/日は60 mg/日とプラセボの中間の効果であった。抑うつ、炭水化物への渇望、病的な食態度・食行動も有意に改善し、高用量で効果が大きかった。有害事象（不眠、悪心、無力症、振戦）はフルオキセチン群で有意に多かったが、有害事象による中止率に群間差はなかった。
    condition:
      region: 米国
      対象: 神経性過食症の女性外来患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3742
    source: Fluoxetine Bulimia Nervosa Collaborative Study Group. Fluoxetine in the treatment of bulimia nervosa. A multicenter, placebo-controlled, double-blind trial. Arch Gen Psychiatry. 1992;49(2):139-147.
    doi: null
    pmid: '1550466'
    pmcid: null
    url: null
    source_license: CC 表示なし
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: フルオキセチンは日本では医薬品自体が未承認であり、国内で処方できない。本試験は海外の一次資料の知見であり、国内の神経性過食症の治療は心理療法が中心で、同疾患を適応とする国内承認薬はない。リスデキサンフェタミンの国内適応は小児期における注意欠如多動性障害のみであり、過食性障害・神経性過食症のいずれも国内適応はない。本論文には DOI の登録が確認できなかった。
