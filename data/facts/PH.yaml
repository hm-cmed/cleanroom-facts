- id: PH-011
  domain: PH
  subdomain: 睡眠時無呼吸症候群
  assertion:
    plain_statement_ja: 国内ガイドライン（2020年版）では、日中の眠気など強い臨床症状がある場合と、中等症〜重症の閉塞性睡眠時無呼吸に対して、CPAP が第一選択として推奨される（推奨の強さ1、エビデンスレベルA）。口腔内装置は、CPAP の適応でない軽症〜中等症、または CPAP を使用できない場合に提案される。中等症〜重症の閉塞性睡眠時無呼吸は、成人男性の約20%、閉経後女性の約10%を占めるとされる。
    condition:
      region: 日本
      対象: 成人の閉塞性睡眠時無呼吸患者
    differential: null
    common_misconception: null
  provenance:
