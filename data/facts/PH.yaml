- id: PH-015
  domain: PH
  subdomain: 過眠症
  assertion:
    plain_statement_ja: 中枢性過眠症の治療ガイドライン（AASM、2021年版）では、成人ナルコレプシーへの強い推奨はモダフィニル、ピトリサント、オキシベートナトリウム、ソルリアムフェトールの4剤であり、アルモダフィニル、デキストロアンフェタミン、メチルフェニデートは条件付き推奨である。成人の特発性過眠症ではモダフィニルが強く推奨される。
    condition:
      region: 国際
      対象: 成人のナルコレプシー・特発性過眠症患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3749
    source: 'Maski K, Trotti LM, Kotagal S, et al. Treatment of central disorders of hypersomnolence: an American Academy of Sleep Medicine clinical practice guideline. J Clin Sleep Med. 2021;17(9):1881-1893.'
    doi: 10.5664/jcsm.9328
    pmid: '34743789'
    pmcid: null
    url: https://doi.org/10.5664/jcsm.9328
    source_license: © American Academy of Sleep Medicine（CC 表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 国内承認の状況は国際推奨と異なる。モダフィニルの国内の効能・効果は、ナルコレプシー、特発性過眠症、および CPAP 療法等による気道閉塞に対する治療を実施中の閉塞性睡眠時無呼吸症候群に伴う日中の過度の眠気である。ピトリサントは2026年9月にナルコレプシーおよび CPAP 治療中の閉塞性睡眠時無呼吸症候群に伴う日中の過度の眠気で承認され、オベポレクストン（初のオレキシン2受容体作動薬）は2026年8月にナルコレプシー1型で承認された。一方、オキシベートナトリウムとソルリアムフェトールの国内承認は本作成時点で確認できていない。ナルコレプシーの診断数値（反復睡眠潜時検査の平均睡眠潜時、睡眠開始時レム期の回数、脳脊髄液ヒポクレチン-1 の基準値）は ICSD-3-TR 本文で未照合のため、本カードの主張には含めていない。ナルコレプシーは指定難病（医療費助成の対象）ではない。
