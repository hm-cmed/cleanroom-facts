- id: PH-013
  domain: PH
  subdomain: むずむず脚症候群
  assertion:
    plain_statement_ja: AASM の2025年版ガイドラインでは、成人のむずむず脚症候群への強い推奨は、ガバペンチンエナカルビル、ガバペンチン、プレガバリン、静注カルボキシマルトース鉄の4つである。ドパミン作動薬（プラミペキソール、ロピニロール、ロチゴチンなど）は、長期の増強現象（augmentation）のリスクから標準的使用をしないことが条件付きで推奨され、カベルゴリンは使用しないことが強く推奨される。2012年の旧版で中心に置かれたドパミン作動薬の位置づけは大きく転換した。
    condition:
      region: 国際
      対象: 成人のむずむず脚症候群患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3747
    source: 'Winkelman JW, Berkowski JA, DelRosso LM, et al. Treatment of restless legs syndrome and periodic limb movement disorder: an American Academy of Sleep Medicine clinical practice guideline. J Clin Sleep Med. 2025;21(1):137-152'
    doi: 10.5664/jcsm.11390
    pmid: '39324694'
    pmcid: PMC11701286
    url: https://doi.org/10.5664/jcsm.11390
    source_license: © American Academy of Sleep Medicine（CC 表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 国内承認との乖離がある。国内ではプラミペキソールとガバペンチンエナカルビルが「中等度から高度の特発性レストレスレッグス症候群（下肢静止不能症候群）」の効能・効果で承認されている（PMDA の添付文書で確認）。すなわちドパミン作動薬は国内では承認薬でありながら、国際的には増強現象のため標準的使用が推奨されない側に回っている。プレガバリンの同疾患への国内適応は本作成時点で確認できておらず、ロチゴチンの国内適応の有無も未確認である。
