- id: PH-006
  domain: PH
  subdomain: 不眠症
  assertion:
    plain_statement_ja: 欧州不眠症ガイドライン（2023年版）は、不眠症の認知行動療法（CBT-I）を、年齢や併存症を問わず成人の慢性不眠症の第一選択治療とする（グレードA）。睡眠衛生指導は単独の治療としては推奨されない。診断の手順は臨床面接（睡眠歴・病歴の聴取）と睡眠質問票・睡眠日誌を基本とし、アクチグラフィはルーチンの評価には推奨されず鑑別目的には有用であり、終夜睡眠ポリグラフは他の睡眠障害が疑われる場合や治療抵抗性の場合に用いる。
    condition:
      region: 欧州
      対象: 成人の慢性不眠症患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3743
    source: 'Riemann D, Espie CA, Altena E, et al. The European Insomnia Guideline: An update on the diagnosis and treatment of insomnia 2023. J Sleep Res. 2023;32(6):e14035'
    doi: 10.1111/jsr.14035
    pmid: '38016484'
    pmcid: null
    url: https://doi.org/10.1111/jsr.14035
    source_license: CC BY 4.0（Crossref の license 欄と論文の著作権表示で確認）
    legal_basis: B
    source_class: OPEN
    corroboration: null
  uncertainty: 欧州のガイドラインであり、診療体制や保険適用は国内と異なる部分がある。国内の睡眠薬に関するガイドライン（『睡眠薬の適正な使用と休薬のための診療ガイドライン』2013年）はオレキシン受容体拮抗薬の登場前に策定されたもので、現在の薬物療法をカバーしていない。
