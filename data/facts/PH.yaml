  assertion:
    plain_statement_ja: 日本では、CPAP の保険適用の要件は、終夜睡眠ポリグラフで無呼吸・低呼吸が1時間あたり20回以上、または簡易モニターで40回以上であり、あわせて症状があることとされている。
