- id: PH-021
  domain: PH
  subdomain: 心身症
  assertion:
    plain_statement_ja: 心身医学研究のための診断基準（DCPR）は1995年に国際的な研究者グループが導入した枠組みであり、改訂版 DCPR-R（2017年）は、アロスタティック負荷と過負荷、タイプA行動、アレキシサイミア、不適応な疾病行動のスペクトラム、士気の喪失（demoralization）、易刺激性気分、精神障害に続発する身体症状などを評価の構成要素とし、生物学的変数と心理社会的変数の関係を整理する評価（マクロ分析）が介入目標の同定に有用とされる。心身医学的治療の原則は、医学的治療と心理的治療を疾患の全段階で統合する、個別化された全人的アプローチである。
    condition:
      region: 国際
      対象: 心身医学的評価・治療の対象となる患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3754
    source: Fava GA, Cosci F, Sonino N. Current Psychosomatic Practice. Psychother Psychosom. 2017;86(1):13-30.
    doi: 10.1159/000448856
    pmid: '27884006'
    pmcid: null
    url: https://doi.org/10.1159/000448856
    source_license: CC 表示なし
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: DCPR と DCPR-R は心身医学の研究・評価のための枠組みであり、国内の心身症の診断基準そのものではない。国内の概念の土台は日本心身医学会の定義（1991年）である（PH-020）。国際分類（ICD-11、DSM-5）における心身症の対応づけは、書誌が確定した出典での照合が前提となるため、本カードの主張には含めていない。
