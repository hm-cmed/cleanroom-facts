- id: PH-002
  domain: PH
  subdomain: 神経性やせ症<神経性無食欲症>
  assertion:
    plain_statement_ja: 神経性やせ症の治療では、年齢相応の健康な体重・BMIに到達することが主要な目標であり、体重増加が心理面・身体面・生活の質の改善を支える。成人の第一選択の心理療法は、摂食障害に焦点化した認知行動療法（CBT-ED）、MANTRA、専門的支持的臨床管理（SSCM）のいずれかであり、これらが受け入れられない・禁忌・無効な場合に摂食障害に焦点化した力動的心理療法を検討する。小児・青年では神経性やせ症に焦点化した家族療法（FT-AN）を検討する。重度の電解質異常、重度の栄養不良、重度の脱水、臓器不全の徴候がある場合は、救急の身体治療（緊急入院を含む）を行う。
    condition:
      region: 国際
      対象: 神経性やせ症患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3740
    source: 'National Institute for Health and Care Excellence. Eating disorders: recognition and treatment. NICE guideline NG69. 2017'
    doi: null
    pmid: null
    pmcid: null
    url: null
    source_license: CC 表示なし（公式サイトで無料公開、NICE 独自の利用条件）
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 各心理療法の回数・期間の標準（CBT-ED は最大40回、MANTRA は標準20回など）は NICE の推奨本文に基づく。神経性やせ症そのものを効能・効果とする国内承認薬は、本作成時点の確認範囲では見当たらなかった。身体合併症の管理の詳細（再栄養症候群、電解質異常など）は内科各分野の範囲であり、本カードでは要点に留める。
