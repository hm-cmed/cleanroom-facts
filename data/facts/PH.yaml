- id: PH-004
  domain: PH
  subdomain: 神経性過食症<大食症>
  assertion:
    plain_statement_ja: 成人の神経性過食症では、まず神経性過食症に焦点化したガイデッドセルフヘルプ（摂食障害の認知行動療法のセルフヘルプ教材を用い、短時間の支持的セッションで補う）を検討し、それが受け入れられない・禁忌・4週間で無効な場合は、個人の摂食障害に焦点化した認知行動療法（CBT-ED）を検討する。小児・青年では神経性過食症に焦点化した家族療法（FT-BN）が勧められ、それが不適・禁忌・無効な場合に個人の CBT-ED を検討する。薬物療法を神経性過食症の唯一の治療としてはならず、心理療法は体重への効果が限定的であることをすべての患者に説明する。
    condition:
      region: 国際
      対象: 神経性過食症患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3740
    source: 'National Institute for Health and Care Excellence. Eating disorders: recognition and treatment. NICE guideline NG69. 2017'
    doi: null
    pmid: null
    pmcid: null
    url: null
    source_license: CC 表示なし（公式サイトで無料公開、NICE 独自の利用条件）
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 国内では神経性過食症を効能・効果とする承認薬はなく、国内で承認されている SSRI にも同疾患の適応はないため、国内の診療でも心理療法が中心になる。薬物療法で最もエビデンスの強いフルオキセチンは、日本では医薬品自体が未承認である。
