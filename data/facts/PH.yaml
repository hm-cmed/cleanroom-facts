- id: PH-014
  domain: PH
  subdomain: レム<REM>睡眠行動障害
  assertion:
    plain_statement_ja: レム睡眠行動障害の管理の中核は安全な睡眠環境の確保であり、ベッド脇の武器・凶器になりうる物の撤去、鋭い家具を離すかその角を覆うこと、ベッド脇に柔らかいカーペットやマットを敷くこと、重症で制御できない場合はパートナーと別に寝るか枕で隔てることが挙げられる。孤発性のレム睡眠行動障害への薬物療法はいずれも条件付き推奨で、クロナゼパム、即放性メラトニン、プラミペキソールが挙げられ、強い推奨の薬物はない。軽度認知障害を伴う場合はリバスチグミン経皮製剤も条件付き推奨に挙がる。
    condition:
      region: 国際
      対象: レム睡眠行動障害患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3748
    source: 'Howell M, Avidan AY, Foldvary-Schaefer N, et al. Management of REM sleep behavior disorder: an American Academy of Sleep Medicine clinical practice guideline. J Clin Sleep Med. 2023;19(4):759-768.'
    doi: 10.5664/jcsm.10424
    pmid: '36515157'
    pmcid: null
    url: https://doi.org/10.5664/jcsm.10424
    source_license: © American Academy of Sleep Medicine（CC 表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: レム睡眠行動障害を効能・効果とする国内承認薬は確認されておらず、クロナゼパムやメラトニン製剤の使用は国内では適応外使用にあたる。神経変性疾患（Parkinson病、Lewy小体型認知症など）の前駆症状としての側面は ND の各疾患のカードの範囲であり、本カードでは睡眠障害としての側面に限る。
