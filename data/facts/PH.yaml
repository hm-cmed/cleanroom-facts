  uncertainty: 概日リズム睡眠-覚醒障害そのものを効能・効果とする国内承認薬は、本作成時点で確認されていない。ラメルテオンの国内適応は「不眠症における入眠困難の改善」であり、タシメルテオンの国内承認は未確認である。本ガイドラインは内因性の障害を対象とし、外因性の交代勤務障害・時差障害は対象外である。
