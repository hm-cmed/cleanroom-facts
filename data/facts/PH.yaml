- id: PH-017
  domain: PH
  subdomain: 睡眠時遊行症
  assertion:
    plain_statement_ja: 睡眠時遊行症、睡眠時驚愕症、錯乱性覚醒は NREM 睡眠時随伴症の3つの主な現れ方であり、共通の臨床的特徴を持つ。エピソードは通常、入眠後30分〜3時間に起こり、数分以内で終わり、健忘を伴うことが多い。有病率は小児の15〜30%から成人の2〜4%へ年齢とともに低下する。エピソードは最も深い NREM 睡眠からの不完全な覚醒であり、運動・辺縁系の覚醒様活性化と前頭頭頂領域の睡眠持続という脳活動の解離が特徴とされる。
    condition:
      region: 国際
      対象: 睡眠時遊行症を含む NREM 睡眠時随伴症の患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3751
    source: 'Lopez R, Micoulaud-Franchi JA, Peter-Derex L, Dauvilliers Y. Nocturnal agitation: From sleep state dissociation to sleep-related dissociative state. Rev Neurol (Paris). 2023;179(7):675-686.'
    doi: 10.1016/j.neurol.2023.07.003
    pmid: '37625976'
    pmcid: null
    url: https://doi.org/10.1016/j.neurol.2023.07.003
    source_license: CC 表示なし
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 睡眠時遊行症単独の臨床ガイドラインは存在せず、診断基準は睡眠障害の国際分類（ICSD-3-TR）が土台になる。治療（安全確保と誘因の除去が中心）の具体的な推奨文は、一次資料の本文での逐語確認が未了のため、本カードの主張には含めていない。
