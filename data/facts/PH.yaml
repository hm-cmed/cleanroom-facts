- id: PH-018
  domain: PH
  subdomain: 周期性四肢運動障害
  assertion:
    plain_statement_ja: 成人の周期性四肢運動障害に対して、AASM の2025年版ガイドラインが出した推奨は、トリアゾラムを使用しないこととバルプロ酸を使用しないこと（いずれも条件付き推奨）の2件のみであり、積極的に推奨される薬物治療は存在しない。睡眠中にみられる周期性四肢運動そのものは周期性四肢運動障害とは別の現象であり、むずむず脚症候群に高頻度に伴う。
    condition:
      region: 国際
      対象: 成人の周期性四肢運動障害患者
    differential: null
