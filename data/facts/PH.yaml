- id: PH-012
  domain: PH
  subdomain: むずむず脚症候群
  assertion:
    plain_statement_ja: むずむず脚症候群（レストレスレッグス症候群）の管理では、臨床的に問題となる症例の全例で、血清鉄検査（フェリチンとトランスフェリン飽和度）を定期的に行うことが求められる。成人では、フェリチン75 ng/mL以下またはトランスフェリン飽和度20%未満で経口または静注の鉄補充を行い、フェリチン75〜100 ng/mLでは静注のみとする。小児ではフェリチン50 ng/mL未満で鉄補充を行う。治療の第一歩は、アルコール、カフェイン、抗ヒスタミン薬、セロトニン作動薬、抗ドパミン薬、未治療の睡眠時無呼吸などの増悪因子への対応である。
    condition:
      region: 国際
      対象: むずむず脚症候群患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3747
    source: 'Winkelman JW, Berkowski JA, DelRosso LM, et al. Treatment of restless legs syndrome and periodic limb movement disorder: an American Academy of Sleep Medicine clinical practice guideline. J Clin Sleep Med. 2025;21(1):137-152'
    doi: 10.5664/jcsm.11390
    pmid: '39324694'
    pmcid: PMC11701286
    url: https://doi.org/10.5664/jcsm.11390
    source_license: © American Academy of Sleep Medicine（CC 表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 出典は米国のガイドライン（AASM、2025年版）であり、鉄評価の扱いは good practice statement に基づく。鉄補充の国内適応は鉄欠乏性貧血に対するもので、むずむず脚症候群そのものへの適応・保険適用は確認していない（本カードの鉄評価・補充の手順は米国ガイドラインの推奨として記載した）。国内では日本神経治療学会が2024年に診療ガイドラインを公表したとされるが、その書誌（掲載誌・巻号・ページ）は本作成時点で確定できなかった。
