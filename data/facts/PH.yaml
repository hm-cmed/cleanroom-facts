- id: PH-016
  domain: PH
  subdomain: 概日リズム障害
  assertion:
    plain_statement_ja: 内因性の概日リズム睡眠-覚醒障害の治療ガイドライン（AASM、2015年版）で積極的な推奨が得られたのは、戦略的にタイミングを計ったメラトニン投与（睡眠-覚醒相後退障害、全盲の非24時間睡眠-覚醒リズム障害、神経疾患を併存する小児・思春期の不規則睡眠-覚醒リズム障害）と、行動介入を伴う・伴わない光療法（成人の睡眠相前進障害、小児・思春期の睡眠-覚醒相後退障害、認知症のある高齢者）であり、それ以外はエビデンス不足のため推奨なしとされた。認知症のある高齢者の不規則睡眠-覚醒リズム障害へのメラトニンと睡眠促進薬は、使用しないことが推奨される。
    condition:
