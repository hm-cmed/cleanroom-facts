- id: PH-020
  domain: PH
  subdomain: 心身症
  assertion:
    plain_statement_ja: 日本心身医学会の心身症の定義（1991年）は、「身体疾患の中で、その発症や経過に心理社会的な因子が密接に関与し、器質的ないし機能的障害が認められる病態をいう。ただし、神経症やうつ病など、他の精神障害に伴う身体症状は除外する」とするものである。すなわち心身症は精神疾患ではなく身体疾患の病態であり、診断の実務上の条件は、身体疾患の診断が確定していることと、環境の変化に時間的に一致して身体症状が変動することである。この点で、確定した身体疾患を必要としない身体症状症（身体的苦痛症）とは概念が異なる。
    condition:
      region: 日本
      対象: 心身症の患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3753
    source: 日本心身医学会用語委員会. 心身症の定義. 心身医学. 1991;31(7)
    doi: null
    pmid: null
    pmcid: null
    url: null
    source_license: 表示なし（学会の著作物）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 定義文は、総説での引用文と複数の経路で一致を確認したが、原典（『心身医学』31巻7号）の逐語照合は未了である。心身症全体を対象とする国内の診療ガイドラインは、本作成時点の確認範囲では見当たらなかった。対象となる身体疾患そのもの（消化性潰瘍、気管支喘息、潰瘍性大腸炎など）の診療は各臓器分野が正であり、本カードは概念と診断の総論に限る。
