- id: PH-003
  domain: PH
  subdomain: 神経性やせ症<神経性無食欲症>
  assertion:
    plain_statement_ja: 摂食障害の死亡率に関するメタ解析（36研究）では、加重死亡率（1,000人年あたり）は神経性やせ症5.1、神経性過食症1.7、特定不能の摂食障害3.3であり、標準化死亡比はそれぞれ5.86、1.93、1.92であった。神経性やせ症で死亡した人の5人に1人は自殺によるものであり、神経性やせ症は精神障害の中でも死亡リスクが高い疾患の一つである。
    condition:
      region: 国際
      対象: 摂食障害患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3741
    source: Arcelus J, Mitchell AJ, Wales J, Nielsen S. Mortality rates in patients with anorexia nervosa and other eating disorders. A meta-analysis of 36 studies. Arch Gen Psychiatry. 2011;68(7):724-731.
    doi: 10.1001/archgenpsychiatry.2011.74
    pmid: '21727255'
    pmcid: null
    url: https://doi.org/10.1001/archgenpsychiatry.2011.74
    source_license: CC 表示なし
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 数値は2011年のメタ解析の抄録で確認した範囲であり、対象集団や時代によって値は変動しうる。
  curriculum:
