- id: PH-007
  domain: PH
  subdomain: 不眠症
  assertion:
    plain_statement_ja: 欧州不眠症ガイドライン（2023年版）の薬物療法では、ベンゾジアゼピン系薬、ベンゾジアゼピン受容体作動薬、ダリドレキサント、低用量の鎮静性抗うつ薬は4週間までの短期治療に使用でき、オレキシン受容体拮抗薬は3か月以上使用できる場合があるとされる（いずれもグレードA）。一方、即放性メラトニン、ラメルテオン、抗ヒスタミン薬、抗精神病薬、生薬は不眠治療に推奨されない（グレードA）。
