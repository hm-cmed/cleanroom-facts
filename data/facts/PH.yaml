- id: PH-001
  domain: PH
  subdomain: 神経性やせ症<神経性無食欲症>
  assertion:
    plain_statement_ja: 神経性やせ症の評価では、BMIや罹病期間などの単一の指標だけで治療や紹介の要否を決めてはならず、栄養不良や代償行動（嘔吐など）の身体的影響、併存しやすい精神的問題（抑うつ、不安、自傷、強迫症）、物質使用の可能性、身体状態の悪化や自殺リスクによる救急対応の必要性をあわせて評価する。発症リスクが最も高いのは13〜17歳の若年者であり、疑えば直ちに、地域の年齢相応の摂食障害専門サービスへ紹介する。
    condition:
      region: 国際
      対象: 神経性やせ症が疑われる患者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-3740
    source: 'National Institute for Health and Care Excellence. Eating disorders: recognition and treatment. NICE guideline NG69. 2017'
    doi: null
    pmid: null
    pmcid: null
    url: null
    source_license: CC 表示なし（公式サイトで無料公開、NICE 独自の利用条件）
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 出典は英国の NICE ガイドライン NG69（2017年公表、2025年12月に MEED への参照更新あり）であり、紹介体制や専門サービスの構成は国内の実情と異なる。国内の学会ガイドラインは『摂食障害治療ガイドライン』（日本摂食障害学会監修、医学書院、2012年）が確認できた最新であり、それ以降の改訂は確認できていない。
