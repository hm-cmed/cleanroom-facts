    pmid: '38469064'
    pmcid: PMC10900032
    url: https://doi.org/10.1007/s41105-021-00353-6
    source_license: CC BY 4.0（論文ページの Open Access 表示で確認）
    legal_basis: B
    source_class: OPEN
    corroboration: null
  uncertainty: 本出典は国内ガイドライン2020年版の英語ジャーナル版であり、登録時の決定により書籍版（SRC-495）とは別の文献として扱う。英語版は治療・管理のクリニカルクエスチョン（CQ16〜36）のみの掲載で、診断側の CQ は含まれない。治療抵抗性高血圧に対する CPAP の血圧低下効果は既存カード HT-016 の範囲であり、本カードでは扱わない。
