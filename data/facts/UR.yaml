- id: UR-007
  domain: UR
  subdomain: 尿路閉塞
  assertion:
    plain_statement_ja: 尿路閉塞による腎後性腎不全では、閉塞の解除後に閉塞後利尿が生じうる。閉塞後利尿は、尿量200 mL/時以上が2時間以上続くこと、または尿量3 L/日以上と定義され、完全な両側閉塞の解除後では最大で約半数にみられる。危険因子は血清クレアチニン高値と解除前の膀胱内尿量1,500 mL超であり、管理では前1時間の尿量の50%を輸液で補う方法が示されている。
    condition:
      region: 国際
      study: 総説
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-695
    source: Yaxley J, Yaxley W. Obstructive uropathy – acute and chronic medical management. World Journal of Nephrology. 2023;12(1):1-9.
    doi: 10.5527/wjn.v12.i1.1
    pmid: '36704657'
    pmcid: PMC9846865
    url: https://doi.org/10.5527/wjn.v12.i1.1
    source_license: CC BY-NC 4.0
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ51 2026-11-12）：Been RA, Voets PJGM, van Rhijn-Brouwer FCC, Vogtländer NPJ. A lesson for the clinical nephrologist: desmopressin and its unforeseen efficacy in clinical post-obstructive diuresis. J Nephrol. 2024;37(2):515-517／Rigonalli U, Sigg S, Moos SV, Baumeister P, Mattei A, Fankhauser CD, Affentranger A. Prevalence and Clinical Implications of Post-obstruction Hyperdiuresis Among Patients with Urinary Retention: A Mini Review. Eur Urol Open Sci. 2025;73:68-70（CC BY、PMID 37856066（候補2は 40041096）、DOI 10.1007/s40620-023-01782-x（候補2は 10.1016/j.euros.2025.01.017）、PMC11043196（候補2は PMC11879703）、新規 SRC 候補）。裏づける部分：候補1（CC BY の症例レビュー）の全文に、「閉塞後利尿は、閉塞の原因の解除後に200 mL/時を超える利尿が少なくとも2時間続くこと、または24時間で3,000 mLを超えることと定義される」と明記され、カードの定義が裏づけられる。候補2（CC BY のミニレビュー）も同じ定義（200 mL/時が2時間連続、または24時間で3 Lを超える）を挙げ、危険因子として血清クレアチニン高値（オッズ比4.83）と膀胱内尿量の多さ（100 mL増えるごとのオッズ比1.21）を統計的に示した研究を再掲しており、危険因子の方向も裏づけられる。数値の照合：定義（尿量200 mL/時以上が2時間以上、または3 L/日以上）は両候補と一致。頻度はカード「完全な両側閉塞の解除後では最大で約半数」に対し、候補2は尿閉のコホート全体で15〜78%の範囲を示し、対象集団が異なる（両値を記録）。輸液補充はカード「前1時間の尿量の50%を輸液で補う方法」に対し、候補2が再掲する唯一の管理の研究は尿量の67%の補充で、割合が異なる（両値を記録し、フラグにも挙げた）。留保：候補はいずれも出典マスター未登録のため新規 SRC 登録候補'
  uncertainty: 総説に基づく記述であり、輸液補充の具体的方法は施設や患者の状態により異なる。
