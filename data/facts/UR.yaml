  subdomain: 腎・尿路損傷
  assertion:
    plain_statement_ja: 腎および尿路の外傷は、成人と小児の腹部外傷の約10〜20%に生じる。管理は解剖学的な損傷の程度、血行動態、合併損傷を踏まえて決めるものであり、小児では非手術的管理が標準とされ、多職種による対応が求められる。
