- id: UR-032
  domain: UR
  subdomain: 腹圧性尿失禁
  assertion:
    plain_statement_ja: 女性の腹圧性尿失禁に対する中部尿道スリング手術について、系統的レビュー（40試験、参加者6,145人）では、短期の客観的治癒率は経閉鎖孔アプローチで85.7%、恥骨後アプローチで87.2%と同等であり、短期の主観的治癒率は経閉鎖孔アプローチで62〜98%、恥骨後アプローチで71〜97%の範囲であった。
    condition:
      region: 国際
      study: コクランの系統的レビューとメタ解析（2017年版）
