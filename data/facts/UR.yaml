  subdomain: 夜尿症
  assertion:
    plain_statement_ja: 夜尿症は5歳以上の小児にみられる睡眠中の尿失禁で、男児は女児の約2倍多く、5歳時点での頻度は約15%とされる。6か月以上の夜間乾燥期間を一度も得たことのないものを一次夜尿症といい、約80%を占める。背景には夜間多尿、膀胱容量の低下、睡眠からの覚醒障害などが関与し、治療の第一選択はアラーム療法と薬物療法である。
