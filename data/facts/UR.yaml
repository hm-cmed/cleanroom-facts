- id: UR-002
  domain: UR
  subdomain: 尿路結石症
  assertion:
    plain_statement_ja: 尿管結石に対するα遮断薬を用いた薬物的排石療法は、自然排石の確率を高める（排石のリスク比1.49、95%信頼区間1.39〜1.61）。利益は比較的大きな結石で認められ（リスク比1.57）、小さな結石では有意な利益は示されなかった。排石までの期間は平均3.79日短縮し、手術介入と入院のリスクも低下した。
    condition:
      region: 国際
      study: 系統的レビュー・メタ解析（無作為化比較試験55件）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-692
    source: 'Hollingsworth JM, et al. Alpha blockers for treatment of ureteric stones: systematic review and meta-analysis. BMJ. 2016;355:i6112.'
    doi: 10.1136/bmj.i6112
    pmid: '27908918'
    pmcid: null
    url: https://doi.org/10.1136/bmj.i6112
    source_license: 未確認
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ51 2026-11-12）：Almaghthawi MM, Alotaibi EA, Alotaibi MS, Alomari RW, Alsulami YD, Alahamdi MA, Aljaddua SIS, Alruhaili WAA, Hijazi EM, Alkharboosh AS, Almurshed OA, Alshammari AH. Efficacy of alpha-blockers in medical expulsive therapy for ureteral stones: A systematic review and meta-analysis of randomized controlled trials between 2010 and 2025. Arab J Urol. 2026;24(1):1-14（CC BY、PMID 41509089、DOI 10.1080/20905998.2025.2532196、PMC12777816、新規 SRC 候補）。裏づける部分：候補（CC BY の系統的レビュー・メタアナリシス、2010〜2025年の無作為化試験）の全文に、α遮断薬は対照に比べて排石率を高め（70.9%対56.5%）、排石までの期間を短縮し、利益は5 mm未満の小さな結石では控えめで5〜10 mmの結石で大きいことが明記され、主張の方向と結石サイズによる利益の違いが裏づけられる。数値の照合：候補の統合値はカード（主出典の2016年のメタアナリシス）と異なる。排石のリスク比はカード1.49に対し候補1.25（95%信頼区間1.20〜1.32）、大きな結石ではカード1.57に対し候補は5〜10 mmで1.35、排石までの期間の短縮はカード平均3.79日に対し候補は平均差−2.96日。方向は一致するが候補の値が小さく、両値を記録してフラグにも挙げた。手術介入と入院のリスク低下は候補の副次アウトカムに含まれず、その部分を留保する。留保：候補は出典マスター未登録のため新規 SRC 登録候補。主出典 SRC-692 自体は CC BY-NC で自由利用にならない（区分の節に記録）'
  uncertainty: タムスロシンなどのα遮断薬には、国内では尿管結石の排石を効能・効果とする承認がなく、排石目的の使用は適応外となる。保険適用の詳細は本調査では未確認である。また、体外衝撃波結石破砕術や内視鏡的治療の選択基準は本出典の対象範囲外であり、本カードでは扱っていない。
