- id: UR-003
  domain: UR
  subdomain: 尿路結石症
  assertion:
    plain_statement_ja: 初発の特発性カルシウム結石の患者では、食事内容を変えずに水分摂取を増やして尿量2 L/日以上を保つことで、5年間の再発率が27.0%から12.1%に低下し（p=0.008）、再発までの平均期間も25.1か月から38.7か月に延長した。
    condition:
      region: イタリア
      study: 無作為化比較試験（220例、5年追跡）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-693
    source: 'Borghi L, Meschi T, Amato F, Briganti A, Novarini A, Giannini A. Urinary volume, water and recurrences in idiopathic calcium nephrolithiasis: a 5-year randomized prospective study. Journal of Urology. 1996;155(3):839-843.'
    doi: 10.1016/S0022-5347(01)66321-3
    pmid: '8583588'
    pmcid: null
    url: https://doi.org/10.1016/S0022-5347(01)66321-3
    source_license: 未確認
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ51 2026-11-12）：Collingridge A, O''Callaghan M. Seminal papers in urology: urinary volume, water and recurrences in idiopathic calcium nephrolithiasis: a 5-year randomized prospective study. BMC Urol. 2024;24(1):30（CC BY、PMID 38310269、DOI 10.1186/s12894-024-01416-9、PMC10838424、新規 SRC 候補）。裏づける部分：候補（CC BY の古典論文レビュー）の全文に、主出典の試験（初発の特発性カルシウム結石の患者99例を尿量2 L/日以上を目指して水分摂取を増やす群、100例を通常群に割り付けた5年間の無作為化前向き試験）について、再発率が12.1%対27%（p=0.008）、再発までの期間が38.7か月対25か月と再掲され、主張の数値の核が裏づけられる。数値の照合：再発率27.0%から12.1%への低下（p=0.008）はカードと一致。再発までの平均期間はカード25.1か月に対し候補は25か月（±16.4）と概数で示され、38.7か月は一致する。留保：候補は出典マスター未登録のため新規 SRC 登録候補。主出典 SRC-693 の区分訂正（UNKNOWN→RESTRICTED）は区分の節に記録する'
  uncertainty: 対象は代謝異常のない初発の特発性カルシウム結石患者であり、再発例や代謝異常を伴う患者に対する食事療法・薬物療法は本出典では扱われていない。
