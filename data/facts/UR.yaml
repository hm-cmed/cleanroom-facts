- id: UR-011
  domain: UR
  subdomain: 膀胱尿管逆流
  assertion:
    plain_statement_ja: 1回目または2回目の尿路感染症の後にI〜IV度の膀胱尿管逆流と診断された生後2〜71か月の小児607例では、トリメトプリム・スルファメトキサゾール合剤の2年間の予防投与により、再発が予防群39例・プラセボ群72例と減少した（ハザード比0.50、95%信頼区間0.34〜0.74）。一方で腎瘢痕の発生は減らなかった。再発時の大腸菌における同合剤への耐性の割合は予防群63%・プラセボ群19%であった。
    condition:
      region: 米国
      study: 無作為化比較試験（二重盲検・プラセボ対照）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-698
    source: RIVUR Trial Investigators; Hoberman A, Greenfield SP, Mattoo TK, et al. Antimicrobial prophylaxis for children with vesicoureteral reflux. New England Journal of Medicine. 2014;370(25):2367-2376.
    doi: 10.1056/NEJMoa1401811
    pmid: '24795142'
    pmcid: PMC4137319
    url: https://doi.org/10.1056/NEJMoa1401811
    source_license: 未確認
    legal_basis: B
    source_class: RESTRICTED
    corroboration: 自由に使える資料による裏づけ（GOV_US、作り手の調査バッチ51 2026-11-12）：ClinicalTrials.gov 結果レコード NCT00405704（Randomized Intervention for Children With Vesicoureteral Reflux（RIVUR））（GOV_US、新規 SRC 候補、API で取得）（GOV_US、PMID NCT NCT00405704、https://clinicaltrials.gov/study/NCT00405704、新規 SRC 候補）。裏づける部分：登録レコードの結果セクションに、主要アウトカム（2年間の有熱性または症候性の尿路感染症の再発）がトリメトプリム・スルファメトキサゾール合剤群39例・プラセボ群72例（開始時は302例・305例）と掲載され、腎瘢痕のアウトカムも27例対24例と、瘢痕の発生が減らなかったことと整合する数値が掲載される。数値の照合：再発39例対72例はカードと一致。ハザード比0.50（95%信頼区間0.34〜0.74）そのものはレコードに掲載がない。再発時の大腸菌における同合剤への耐性の割合（予防群63%・プラセボ群19%）もレコードになく、レコードにあるのは直腸スワブでの耐性大腸菌の保有（56例対41例）と、耐性大腸菌による再発（19例対11例）で、指標が異なる。その2要素を留保する。留保：候補は出典マスター未登録のため新規 SRC 登録候補。主出典 SRC-698 の区分訂正（UNKNOWN→RESTRICTED）は区分の節に記録する
  uncertainty: トリメトプリム・スルファメトキサゾール合剤の小児膀胱尿管逆流に対する予防投与について、国内承認・保険適用は本調査では未確認である。米国で実施された試験であり、起炎菌の耐性状況は国内と異なる可能性がある。
