    doi: 10.1016/j.ajur.2017.06.008
    pmid: '29736374'
    pmcid: PMC5934505
    url: https://doi.org/10.1016/j.ajur.2017.06.008
    source_license: CC BY-NC-ND 4.0
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 韓国の3施設における成人男性の後ろ向き研究であり、女性・小児の下部尿路結石にはそのまま当てはまらない。
