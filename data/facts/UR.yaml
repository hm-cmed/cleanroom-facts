  uncertainty: 出典のEAU小児泌尿器ガイドライン（2026年版）第19章に基づく。同章は重複系の閉塞性病態（尿管瘤と異所開口）を中心に扱い、完全重複と不完全重複の定義そのものや不完全重複に特有の経過は扱っていないため、本カードは尿管瘤や逆流を伴う重複系の評価と管理に限った。本カードでは予防的抗菌薬を系統の記載にとどめ、特定の薬剤名は含まない。
