- id: UR-001
  domain: UR
  subdomain: 尿路結石症
  assertion:
    plain_statement_ja: 急性の側腹部痛で尿路結石を疑う場合、診断は病歴聴取と生化学的評価に画像検査を組み合わせて行う。画像検査は超音波検査が第一選択で、超音波検査で確定できない場合の標準は非造影CTである。超音波検査の感度・特異度は尿管結石で45%・94%、低線量CTでは感度93.1%・特異度96.6%とされる。結石の成分分析と、結石の大きさや部位などの負荷の評価が治療選択を左右する。
    condition:
      region: 欧州
      study: ガイドライン（2025年版）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-691
    source: Skolarikos A, et al. EAU Guidelines on Urolithiasis. European Urology. 2025;88(1):64-75.
    doi: 10.1016/j.eururo.2025.03.011
    pmid: '40268592'
    pmcid: null
    url: https://doi.org/10.1016/j.eururo.2025.03.011
    source_license: ガイドライン
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ51 2026-11-12）：Mavridis C, Bouchalakis A, Tsagkaraki V, Somani BK, Mamoulakis C, Tokas T. Recurrent Urinary Stone Formers: Imaging Assessment and Endoscopic Treatment Strategies: A Systematic Search and Review. J Clin Med. 2024;13(12):3461（CC BY、PMID 38929988、DOI 10.3390/jcm13123461、PMC11204450、新規 SRC 候補）。裏づける部分：候補（CC BY の系統的レビュー）の全文に、超音波検査は尿管結石では感度45%と低いが特異度94%と高く、容易に利用でき費用対効果に優れるため特定の患者群では第一選択となりうることが明記され、超音波の感度・特異度と第一選択という位置づけが裏づけられる。数値の照合：超音波の尿管結石での感度45%・特異度94%はカードと一致。低線量CTの感度93.1%・特異度96.6%と、超音波で確定できない場合の標準は非造影CTであるという逐条の位置づけ、結石の成分分析と負荷の評価が治療選択を左右するという要素は候補に再掲がなく、その部分を留保する。留保：候補は出典マスター未登録のため新規 SRC 登録候補'
  uncertainty: 欧州のガイドラインに基づく内容であり、日本における画像診断の実施体制や診療報酬上の扱いは本調査では未確認である。
