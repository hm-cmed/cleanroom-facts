- id: UR-030
  domain: UR
  subdomain: 夜尿症
  assertion:
    plain_statement_ja: 夜尿症は5歳以上の小児にみられる睡眠中の尿失禁で、男児は女児の約2倍多く、5歳時点での頻度は約15%とされる。6か月以上の夜間乾燥期間を一度も得たことのないものを一次夜尿症といい、約80%を占める。背景には夜間多尿、膀胱容量の低下、睡眠からの覚醒障害などが関与し、治療の第一選択はアラーム療法と薬物療法である。
    condition:
      region: 米国
      study: 病態・診断・治療に関する総説と単施設の経験（2014年）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-715
    source: 'DiBianco JM, Morley C, Al-Omar O. Nocturnal enuresis: A topic review and institution experience. Avicenna J Med. 2014;4(4):77-86'
    doi: 10.4103/2231-0770.140641
    pmid: '25506580'
    pmcid: PMC4251068
    url: https://doi.org/10.4103/2231-0770.140641
    source_license: CC BY-NC-SA 3.0（PMC 掲載ページの表示）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: '自由に使える資料による裏づけ（OPEN、作り手の調査バッチ51 2026-11-12）：Liao J, Zhu L, Xie D, Wang X, Zhou P. Improving the quality of life of children and parents with nocturnal enuresis: the role of health education. Front Pediatr. 2024;12:1464465（CC BY、PMID 39776645、DOI 10.3389/fped.2024.1464465、PMC11703977、新規 SRC 候補）。裏づける部分：候補（CC BY の総説）の全文に、夜尿症の背景として夜間の尿量の増加、膀胱容量の低下、睡眠からの覚醒の障害が関与することが挙げられ、治療ではアラーム療法が第一選択の一つ、デスモプレシンが第一選択薬の一つと明記され、病態の枠組みと第一選択の治療が裏づけられる。有病率は小児で4〜18%の範囲とされ、カードの「5歳で約15%」はその範囲内にある。数値の照合：5歳時点での頻度約15%は候補の範囲（4〜18%）内にあるが、年齢別の逐条の値ではない。一次夜尿症が約80%を占めるという割合と、男児は女児の約2倍多いという比は、候補に明示がなく、その2要素を留保する。留保：候補は出典マスター未登録のため新規 SRC 登録候補。主出典は CC BY-NC-SA 3.0 で現行の RESTRICTED が正しい。PMCID PMC4251068 は補完候補として区分の節に記録する'
  uncertainty: 頻度の数値は総説の本文から読み取ったもので、引用された疫学研究の集計を含む（二次資料経由）。薬物療法の代表薬であるデスモプレシンについて、夜尿症に対する国内の承認・保険適用の状況は、本調査では未確認である。
