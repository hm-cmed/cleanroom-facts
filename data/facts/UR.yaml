- id: UR-004
  domain: UR
  subdomain: 尿路結石症
  assertion:
    plain_statement_ja: 成人男性の下部尿路結石では、膀胱結石が87.8%、尿道結石が12.2%を占めた。膀胱結石と独立に関連したのは年齢（オッズ比1.075）と前立腺体積（オッズ比1.069）であり、前立腺肥大症による尿の停滞が背景にある。一方、尿道結石は上部尿路結石や水腎症の合併と関連した（オッズ比3.468）。
    condition:
      region: 韓国
      study: 後ろ向き多施設研究（成人男性221例）
