  domain: UR
  subdomain: 尿路閉塞
  assertion:
    plain_statement_ja: 下部尿路閉塞の原因には、結石のほか前立腺肥大症、神経因性膀胱、尿道狭窄、後部尿道弁などがある。下部尿路閉塞の減圧は尿道カテーテル留置で行い、慢性尿閉では残尿量がおよそ300 mLを超える場合にカテーテル留置が検討される。減圧後には約10%で血尿がみられる。
