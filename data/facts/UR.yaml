- id: UR-003
  domain: UR
  subdomain: 尿路結石症
  assertion:
    plain_statement_ja: 初発の特発性カルシウム結石の患者では、食事内容を変えずに水分摂取を増やして尿量2 L/日以上を保つことで、5年間の再発率が27.0%から12.1%に低下し（p=0.008）、再発までの平均期間も25.1か月から38.7か月に延長した。
