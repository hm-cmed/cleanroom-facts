  subdomain: 神経因性膀胱
  assertion:
    plain_statement_ja: 神経因性膀胱の排尿管理の基本は清潔間欠導尿であり、標準的治療と位置づけられる。導尿は1日4〜6回、12〜14 Frのカテーテルを用い、導尿時の膀胱容量が400 mL未満になるよう調整する。排尿筋過活動に対しては抗ムスカリン薬などの薬物療法や、ボツリヌス毒素Aの膀胱内注入も用いられる。
