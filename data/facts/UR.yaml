- id: UR-014
  domain: UR
  subdomain: 尿路感染症
  assertion:
    plain_statement_ja: 女性の急性単純性膀胱炎の第一選択薬は、ニトロフラントイン100 mg 1日2回を5日間、トリメトプリム・スルファメトキサゾール合剤を3日間（地域の耐性率が20%未満の場合）、ホスホマイシン・トロメタモール3 g単回投与、入手可能な地域ではピブメシリナム400 mg 1日2回であり、フルオロキノロン系薬は他の選択肢が使えない場合に温存される。
