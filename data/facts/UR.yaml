- id: UR-005
  domain: UR
  subdomain: 尿路閉塞
  assertion:
    plain_statement_ja: 上部尿路閉塞の原因には結石、腫瘍、腎盂尿管移行部狭窄などがあり、閉塞による上部尿路内圧の上昇は糸球体濾過量と腎血流量を低下させる。完全閉塞では2時間以内に炎症、尿細管萎縮、間質線維化が始まるとされる。閉塞の解除は尿管ステント留置または腎瘻造設による上部尿路の減圧で行い、閉塞性腎症は急性および慢性腎疾患の約10%を占める。
