  subdomain: 馬蹄腎
  assertion:
    plain_statement_ja: 馬蹄腎は最も頻度の高い腎癒合異常で、両側の腎の下極が峡部によって癒合し（下極癒合は90%を超える）、位置異常、回転異常、血管供給の変化を伴う。峡部は通常、機能する腎実質を含む。解剖学的調査での頻度は0.15〜0.48%とされ、下腸間膜動脈が第3腰椎の高さで峡部の腹側にとどまる配置は40%にみられるにとどまる。
