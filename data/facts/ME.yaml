- id: ME-011
  domain: ME
  subdomain: 制度
  assertion:
    plain_statement_ja: 共用試験CBTは、医学生が診療参加型臨床実習を始める前に、臨床実習に必要な知識の修得度を評価するコンピュータ試験で、臨床実習前OSCEとともに医師法に基づく共用試験（臨床実習前共用試験）を構成する。出題は医学教育モデル・コア・カリキュラムの内容に基づき、各大学が作成し実施機関が校閲した問題を蓄積したプールから行われる。実施機関の2024年の公表資料によれば、設問は5選択肢択一240問・多選択肢択一40問・5選択肢択一の4連問40問の合計320問で、6時間で解答する。この中には、難易度や識別力を測るための採点対象外の試行問題が含まれ、受験者ごとに異なる問題セットが項目反応理論（IRT）によって等質になるよう調整される。合格には、CBTとOSCEの両方で、あらかじめ定められた到達基準に達することが必要である。共用試験は、2002年にトライアルが始まり、2005年12月に正式実施が開始された当初は大学間の任意の共通試験だったが、2023年度からは医師法に基づく公的な試験となり、合格が診療参加型臨床実習で医行為を行うための法的な前提となった。
    condition:
      region: 日本
      対象: 医学生（医学部の学生）
    differential: null
    common_misconception: null
  provenance:
