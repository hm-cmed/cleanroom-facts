- id: ME-006
  domain: ME
  subdomain: 評価
  assertion:
    plain_statement_ja: Millerのピラミッドは、臨床能力の評価を4つの階層で整理する枠組みである。下位から、知識を持つ段階（knows）、知識を使って説明や問題への対応ができる段階（knows how）、模擬的な場面で実際にやって見せられる段階（shows how）、日常の診療現場で実際に行う段階（does）とされ、どの階層を評価するかによって適した評価方法が異なる。筆記試験のような方法は下位の階層の評価に適し、上位の階層には、模擬場面での観察評価や診療現場での直接観察が必要になるとされる。
    condition:
      region: 国際
      対象: 教育者
    differential: null
    common_misconception: null
  provenance:
