- id: ME-009
  domain: ME
  subdomain: ティーチング＆ラーニング
  assertion:
    plain_statement_ja: 意図的練習（deliberate practice）を組み込んだシミュレーション基盤型の医学教育は、従来型の臨床教育と比べて、臨床技能の習得アウトカムで優れることがメタ解析で示されている。1990年から2010年までの文献を対象とし、組み入れ基準を満たした14件の研究を統合した結果、効果量は0.71（95%信頼区間 0.65〜0.76）で、シミュレーションと意図的練習を用いた教育の側が技能習得の目標達成で上回った。ただし統合された研究数は少なく、この教育法の導入に当たっては、各教育現場での十分な検討と厳密な評価が必要であると著者らは述べている。
