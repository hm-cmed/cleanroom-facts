    corroboration: EPAとentrustmentの概念は SRC-5110（ten Cate O, et al. 2024年の解説書の章、CC BY 4.0）でも同じ内容で解説されている
  uncertainty: 原著（2005年）は2ページの論説で抄録が公開されていないため、概念の説明はCC BYで公開された2024年の解説（SRC-5110）の範囲で裏づけ、自作の文で記載した。監督レベルの段階分けなど、原著以降の文献で展開された細部は本カードに含めていない。
