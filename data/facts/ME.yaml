    doi: 10.1097/00001888-199009000-00045
    pmid: '2400509'
    pmcid: null
    url: https://doi.org/10.1097/00001888-199009000-00045
    source_license: © Association of American Medical Colleges（Academic Medicine、CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: 令和4年度改訂版の医学教育モデル・コア・カリキュラム（SRC-5101、GOV_JP）第3章でも、学修者評価の重要な概念の一つとしてMillerのピラミッドが紹介されている
  uncertainty: 原著は抄録が公開されておらず本文は購読制のため、主張は4層の名称（概念名）と階層の考え方、および評価方法との対応の方向性に限定し、自作の文で記載した。原著の図表は転載していない。
