  uncertainty: 数値（59件、学習者8,011人、各領域の標準化平均差と信頼区間）は原著の抄録で確認した。統合した研究間の異質性はいずれの解析でも有意であり、研究の方法論の質は中程度と評価されている。対象は医療専門職教育全般で、医師教育に限った結果ではない。
