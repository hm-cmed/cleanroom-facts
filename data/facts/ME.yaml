- id: ME-013
  domain: ME
  subdomain: 教育手法
  assertion:
    plain_statement_ja: 高忠実度シミュレーションを用いた医学教育について、1969年から2003年までの文献を対象としたBEME系統的レビューでは、初めの670件の論文から、シミュレーターを教育介入として用い学習成果を定量的に測った実証研究109件が選ばれ、学習効果と関連する10の特徴が整理された。最も多くの研究で重要とされたのはフィードバックの提供（51件・47%）で、次いで反復練習（43件・39%）、カリキュラムへの統合（27件・25%）、課題の難易度に幅を持たせること（15件・14%）が挙がり、以下、複数の学習方略への適応（11件・10%）、多様な臨床像の再現（11件・10%）、管理された環境（10件・9%）、個別化された学習（10件・9%）、到達目標と成果指標の明確化（7件・6%）、シミュレーターの妥当性（4件・3%）が続いた。対象研究の方法論的な質は全体として弱く、研究間のばらつきが大きいため、結果はメタ解析ではなく質的に統合された。
