- id: ME-037
  domain: ME
  subdomain: アセスメント
  assertion:
    plain_statement_ja: 試験の合格基準（合否の境目）は、受験者の出来とは別に、標準設定という手続きで決める。標準設定は、基準の種類を決め、方法を選び、判定者を選んで、判定を集めて境目の得点を算出する、という段階を踏む。代表的な Angoff 法では、判定者が「最低限できる受験者」を想定し、その受験者が各問題に正答する確率を推定して積み上げる。方法の選択では、試験の目的に合っていること、専門家の判断に基づくこと、データの裏づけがあること、研究の支持があること、透明であること、手続きを尽くすこと、が基準になるとされる。合格基準は値そのものではなく、専門職としての価値判断を一つの得点に表したものと位置づけられる。
    condition:
      region: 国際
      対象: 教育者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-5312
    source: Norcini JJ. Setting standards on educational tests. Med Educ. 2003;37(5):464-469
    doi: 10.1046/j.1365-2923.2003.01495.x
    pmid: '12709190'
    pmcid: null
    url: https://doi.org/10.1046/j.1365-2923.2003.01495.x
    source_license: © Wiley（Medical Education、CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 主張は抄録で確認した範囲（標準設定の手順、方法選択の基準、合格基準の位置づけ）に基づく。Angoff 法以外の方法（対照群法など）の手続きの細部は本カードに含めていない。OSCE での応用法は ME-038 で扱う。
