  uncertainty: 出典内の位置：到達目標の構成と項目名は「I 到達目標」、評価の仕組みは「III 到達目標の達成度評価」の記載。Aの4項目は、社会的使命と公衆衛生への寄与、利他的な態度、人間性の尊重、自らを高める姿勢。Bの9項目は、医学・医療における倫理性、医学知識と問題対応能力、診療技能と患者ケア、コミュニケーション能力、チーム医療の実践、医療の質と安全の管理、社会における医療の実践、科学的探究、生涯にわたって共に学ぶ姿勢。指導ガイドラインは2023年度版（2023年11月一部改訂）が今回確認した最新の版である。
