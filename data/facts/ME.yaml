- id: ME-044
  domain: ME
  subdomain: アセスメント
  assertion:
    plain_statement_ja: 多面評価（360度評価、多源フィードバック）は、同僚医師・協働するスタッフ・患者など、立場の異なる複数の評価者からの評価を集めて医師の遂行を把握する方法で、診療技術だけでなく、コミュニケーションや専門職としての振る舞いといった非技術的な面の評価に使われる。系統的レビュー（43件の研究）では、十分な信頼性を得るにはおおよそ、同僚医師8人、協働者8人、患者25人の評価が必要とされ、この条件で信頼性係数0.90以上、一般化可能性係数0.80以上が得られることが示されている。
