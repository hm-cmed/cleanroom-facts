  assertion:
    plain_statement_ja: '医師憲章（Medical professionalism in the new millennium: a physician charter）は、医師のプロフェッショナリズムを、患者の福利の最優先、患者の自律、社会正義の3つの基本原則と、それらに基づく10の職業的責務で定めた国際的な憲章である。10の責務には、専門的能力の維持、患者への誠実さ、患者の秘密の保持、患者との適切な関係の維持、医療の質の改善、医療へのアクセスの改善、限りある資源の公正な分配、科学的知識への責任、利益相反の管理による信頼の維持、専門職としての責任が含まれる。2002年に米国内科学会系の財団と欧州内科学会連合が共同で公表した。'
