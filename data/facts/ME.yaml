    plain_statement_ja: EPA（Entrustable Professional Activities、信頼して任せられる専門的活動）は、学習者に監督なしで任せられるかどうかで判断される、具体的な診療活動の単位である。コンピテンシーが学習者の資質・能力を抽象的に表すのに対し、EPAは日常の診療で行われる活動そのものを単位とし、指導者は学習者の能力を見て、どの程度の監督のもとでその活動を任せるかを判断する。この「任せられるか」という判断（entrustment）を評価の中心に置くことで、資質・能力の評価を、臨床現場での実際の業務の委任に結びつける考え方として提案された。
