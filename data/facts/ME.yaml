    url: https://doi.org/10.1097/ACM.0b013e318217e119
    source_license: © Association of American Medical Colleges（Academic Medicine、CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 数値（対象研究14件、効果量0.71、95%信頼区間0.65〜0.76）は原著の抄録で確認した。結論は技能習得のアウトカムに関するもので、知識や態度のアウトカム、費用対効果はこのメタ解析の結論の範囲外である。原著の文章は転載せず、数値と方向性のみを自作の文で記載した。
