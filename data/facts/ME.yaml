  assertion:
    plain_statement_ja: 問題基盤型学習（PBL）のアウトカムについて、1972年から1992年までの英語文献を統合したレビューでは、アウトカムごとに方向の異なる結果が報告された。臨床面では、PBLの卒業生は従来型の教育の卒業生と同等か、臨床試験や教員による評価では時に上回る成績であり、学習環境はより育成的で楽しいと評価され、卒業生が家庭医療を選ぶ割合も高く、教員もPBLでの指導を好む傾向があった。一方、基礎科学については、一部の研究でPBLの学生の試験成績が従来型の学生より低く、学生自身も基礎科学の準備が不足していると感じる傾向があった。また、専門家が用いる前方推論とは異なる後方推論のパターンや、知識基盤の不足の可能性も指摘された。PBLは費用がかかるため、学生数の多い学校（100人超の学年規模）では導入が進みにくいとされ、著者らは、カリキュラム全体をPBLに転換することには慎重であるべきだと結論づけた。
