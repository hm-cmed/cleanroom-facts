- id: ME-004
  domain: ME
  subdomain: 制度
  assertion:
    plain_statement_ja: 診療に従事しようとする医師は、2年以上、都道府県知事の指定する病院等において臨床研修を受けなければならない（医師法第16条の2第1項）。臨床研修は、1968年の制度創設以来、受けるよう努めるものとする努力義務であったが、2000年の医師法改正により義務化され、2004年度から必修の制度として開始された。その後、制度は概ね5年ごとに到達目標や臨床研修病院の在り方等の見直しが行われてきている。
    condition:
      region: 日本
      対象: 医師（臨床研修を受ける医師）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-5102
    source: 医師法（昭和23年法律第201号、令和3年法律第49号による改正を含む現行法）
    doi: null
    pmid: null
    pmcid: null
    url: https://laws.e-gov.go.jp/law/323AC0000000201
    source_license: 法令（著作権法13条により権利の目的とならない）
    legal_basis: C
    source_class: GOV_JP
    corroboration: 必修化の経緯（平成12年改正・平成16年度開始）と、概ね5年ごとの見直しの経過は SRC-5105（厚生労働省 医道審議会医師分科会医師臨床研修部会報告書、令和6年3月、GOV_JP）でも述べられている
  uncertainty: 出典内の位置：臨床研修の義務は第16条の2第1項。「概ね5年ごとの見直し」は厚労省の医師臨床研修部会報告書（SRC-5105）の記述によるもので、見直しの周期を直接定めた法令の条文は今回確認できなかった（制度解説の中には法令に定めるとする記述もある）。1968年当時の努力義務の根拠条文の逐語確認はしていない。
