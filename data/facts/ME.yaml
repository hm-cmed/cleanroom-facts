- id: ME-012
  domain: ME
  subdomain: アセスメント
  assertion:
    plain_statement_ja: プログラム的評価は、評価を個々の試験としてではなく、学習の過程全体にわたるプログラムとして設計する考え方である。個々の評価の機会（データポイント）は、それ自体では進級や合否のような重大な判定には用いず、学習とフィードバックの価値を最大化するものとして数多く蓄積する。重大な判定は、複数の方法と時点から得られた多数のデータポイントを集約したうえで、専門家の判断を加えて行う。専門家の判断には主観が伴うため、評価のサンプリングを広げることや、質的研究の基準に由来する手続きによって偏りを減らすことが重視される。訓練・評価・学習者支援を繰り返す過程の中に、集約したデータに基づく中間と最終の評価の機会を組み込む形が、モデルとして提案されている。
    condition:
      region: 国際
      対象: 教育者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-5116
    source: van der Vleuten CPM, Schuwirth LWT, Driessen EW, Dijkstra J, Tigelaar D, Baartman LKJ, van Tartwijk J. A model for programmatic assessment fit for purpose. Med Teach. 2012;34(3):205-214
    doi: 10.3109/0142159X.2012.652239
    pmid: '22364452'
    pmcid: null
    url: https://doi.org/10.3109/0142159X.2012.652239
    source_license: © Taylor & Francis（Medical Teacher、CC表示なし）
    legal_basis: B
