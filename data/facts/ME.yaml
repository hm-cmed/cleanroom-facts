- id: ME-005
  domain: ME
  subdomain: 制度
  assertion:
    plain_statement_ja: 医師臨床研修の到達目標は、2020年度の研修から適用される「臨床研修の到達目標、方略及び評価」に定められ、A. 医師としての基本的価値観（プロフェッショナリズム）4項目、B. 資質・能力9項目、C. 基本的診療業務4項目の3部で構成される。AとBの項目は、卒前の医学教育モデル・コア・カリキュラムの資質・能力とほぼ共通している。Cは臨床研修に固有の部分で、コンサルテーションや医療連携が可能な状況下で、一般外来診療・病棟診療・初期救急対応・地域医療を単独で行えることが2年間の目標とされる。達成度の評価は、各分野・診療科のローテーション終了時に研修医評価票を用いて行う評価と、2年間の研修終了時に行う総括的な判定を組み合わせて行われ、その運用の指針として「医師臨床研修指導ガイドライン」が示されている。
    condition:
      region: 日本
      対象: 医師（初期臨床研修医）
    differential: null
    common_misconception: null
  provenance:
