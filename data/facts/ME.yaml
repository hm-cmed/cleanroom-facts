  assertion:
    plain_statement_ja: 臨床教育におけるフィードバックとは、教育者が学習者の臨床場面での行動を観察し、その観察に基づいて学習者へ情報を返すことで、学習者がその後の実践で自らの行動を改善していけるよう支える働きをいう。フィードバックは臨床技能の修得に欠かせない過程であるが、臨床現場では省略されたり、不適切に行われたりしやすい。効果を上げるためには、フィードバックと評価（判定）とを区別することと、学習者本人ではなく、観察できる行動に焦点を当てることが重要であるとされる。
