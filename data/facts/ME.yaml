- id: ME-036
  domain: ME
  subdomain: アセスメント
  assertion:
    plain_statement_ja: 評価方法の有用性は、信頼性、妥当性、教育への効果、受け入れやすさ、コストの5つの要素の積として考える枠組みが提案されている（van der Vleuten の有用性の式）。積で考えるため、どれか一つの要素がゼロであれば、他の要素がどれほど優れていても有用性全体は成り立たない。各要素への重みづけは一律ではなく、評価の目的や文脈に応じて変えるもので、たとえば進級判定のような重大な決定では信頼性と妥当性が、学習を促す場面では教育への効果が重くなる。
