- id: ME-001
  domain: ME
  subdomain: 制度
  assertion:
    plain_statement_ja: 医学教育モデル・コア・カリキュラムは、各大学が策定するカリキュラムのうち全大学で共通して取り組むべき「コア」の部分を抽出し、モデルとして体系的に整理したもので、学生の学修時間数の3分の2程度を目安とする。令和4年度改訂版（令和4年11月改訂）は令和6年度から令和11年度までの入学生に適用され、医師として求められる基本的な資質・能力を10項目（プロフェッショナリズム、総合的に患者・生活者をみる姿勢、生涯にわたって共に学ぶ姿勢、科学的探究、専門知識に基づいた問題解決能力、情報・科学技術を活かす能力、患者ケアのための診療技能、コミュニケーション能力、多職種連携能力、社会における医療の役割の理解）とした。同改訂版に収載された診療参加型臨床実習実施ガイドラインでは、必ず経験すべき診療科として内科・外科・小児科・産婦人科・精神科・総合診療科・救急科を挙げ、救急科を除く6科は原則として1診療科当たり連続3週間以上、救急科は原則3週間以上（またはそれに相当する期間）の実習を行うこととしている。
    condition:
      region: 日本
      対象: 医学生（医学部の学生）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-5101
    source: 文部科学省. 医学／歯学教育モデル・コア・カリキュラム（令和4年度改訂版）. 2022年11月
    doi: null
    pmid: null
