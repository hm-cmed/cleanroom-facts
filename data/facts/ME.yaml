    legal_basis: B
    source_class: GOV_JP
    corroboration: null
  uncertainty: 出典内の位置：資質・能力の10項目は第1章、診療参加型臨床実習の診療科と期間は診療参加型臨床実習実施ガイドラインの記載。内容は文部科学省の改訂説明資料およびモデル・コア・カリキュラム改訂に関する連絡調整委員会の資料で照合した。provenance の URL は確認に用いた改訂説明資料（厚生労働省のサイトに掲載された文部科学省資料）を指す。本文そのものは医学・歯学共通の文書だが、本カードは医学部分のみを扱う。歯学・薬学・看護学の各コア・カリキュラムは対象外（第2弾以降）。
