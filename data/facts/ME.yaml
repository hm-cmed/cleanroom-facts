- id: ME-038
  domain: ME
  subdomain: アセスメント
  assertion:
    plain_statement_ja: OSCE の合格基準の設定では、判定者の全体評価を利用する経験的な方法が使われる。境界回帰法は、各ステーションについて、チェックリスト得点と判定者の全体評価（合格・境界・不合格など）の関係を回帰で表し、全体評価が「境界」にあたる受験者のチェックリスト得点を推定して、それを合格基準とする方法である。16ステーションの OSCE で Angoff 法と比較した研究では、合格基準の得点は境界回帰法で57.6%、修正 Angoff 法で73.4%（現実チェックなし）・66.0%（同あり）と方法により大きく異なり、境界回帰法の方が基準の信頼性（誤差の小ささ）と信憑性で優れていたと報告されている。
    condition:
      region: 国際
      対象: 教育者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-5313
    source: Kramer A, Muijtjens A, Jansen K, Düsman H, Tan L, van der Vleuten C. Comparison of a rational and an empirical standard setting procedure for an OSCE. Med Educ. 2003;37(2):132-139
    doi: 10.1046/j.1365-2923.2003.01429.x
    pmid: '12558884'
    pmcid: null
    url: https://doi.org/10.1046/j.1365-2923.2003.01429.x
    source_license: © Wiley（Medical Education、CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 数値（合格基準57.6%・73.4%・66.0%、誤差0.6%対2.1%）は原著の抄録で確認した。対象は総合診療の後期研修の OSCE で、学部教育の OSCE にそのまま当てはまる数値ではない。境界群法（境界に位置する受験者群の平均得点を用いる方法）も、判定者の全体評価を用いる同系統の経験的方法である。臨床実習前 OSCE の枠組みは ME-003 で扱うが、同 OSCE でどの標準設定法が用いられているかは本カードの出典の範囲外である。
