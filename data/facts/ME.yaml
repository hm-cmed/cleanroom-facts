- id: ME-015
  domain: ME
  subdomain: 教育手法
  assertion:
    plain_statement_ja: 反転授業（授業の前に動画等で学習し、対面の授業時間は演習等に充てる方法）と従来型の授業を比較した研究のメタ解析では、医療専門職教育の比較研究28件の統合で、学習アウトカムは反転授業の側が有意に高かった（標準化平均差 0.33、95%信頼区間 0.21〜0.46、p<0.001）。対面授業の開始時に小テストを行う取り組みを併用した場合に効果がより大きくなり、学習者の多くは従来型より反転授業を好んだと報告された。
