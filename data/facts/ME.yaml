- id: ME-003
  domain: ME
  subdomain: 制度
  assertion:
    plain_statement_ja: 臨床実習前OSCE（Pre-CC OSCE）は、医学生が診療参加型臨床実習を始める前に、医療面接や身体各部の診察などの技能・態度が一定水準に達しているかを、模擬患者やシミュレーターを用いたステーション形式で評価する試験で、その結果は臨床実習開始の可否の判定に用いられる。課題は6課題が必須で、医療面接（10分）と、その他の課題（各5分）からなる。2023年度からは、共用試験CBTとともに、医師法に基づく共用試験の一部として公的に位置づけられている。これに対し、臨床実習後OSCE（Post-CC OSCE）は臨床実習を終えた6年生を対象に2020年から全国で実施され、ある症候をもつ患者への医療面接・身体診察・臨床推論と指導医への報告を1つの試験室で行う課題で、実施機関が用意する3課題に各大学の独自課題1〜3課題を加えて実施され、結果は卒業判定の資料となる。
    condition:
      region: 日本
      対象: 医学生（医学部の学生）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-5103
    source: 厚生労働省 医道審議会医師分科会. シームレスな医師養成に向けた共用試験の公的化といわゆるStudent Doctorの法的位置づけについて（報告書）. 令和2年5月
    doi: null
    pmid: null
    pmcid: null
    url: https://www.mhlw.go.jp/content/10803000/000672617.pdf
    source_license: 政府標準利用規約（厚生労働省ホームページ）
    legal_basis: B
    source_class: GOV_JP
    corroboration: 課題数・時間・Post-CC OSCEの実施形態の細部は SRC-5104（日本医師会「日医 on-line」特別寄稿、RESTRICTED、事実のみ使用）で確認した
  uncertainty: 出典内の位置：臨床実習前OSCEとCBTの公的化は報告書の検討項目（2）。provenance の URL は厚生労働省が公表した報告書概要を指す。Pre-CC OSCEの開始年度は資料により表記が異なる（報告書案では平成17年、日医寄稿では2006年度）ため主張に含めていない。Post-CC OSCEは医師法に基づく共用試験には含まれず、卒業判定の資料として各大学で用いられる位置づけである。課題数等の細部は日医寄稿に基づくため、実施機関（医療系大学間共用試験実施評価機構）の現行の実施要項での再確認が望ましい。
