- id: ME-004
  domain: ME
  subdomain: 制度
  assertion:
    plain_statement_ja: 診療に従事しようとする医師は、2年以上、都道府県知事の指定する病院等において臨床研修を受けなければならない（医師法第16条の2第1項）。臨床研修は、1968年の制度創設以来、受けるよう努めるものとする努力義務であったが、2000年の医師法改正により義務化され、2004年度から必修の制度として開始された。その後、制度は概ね5年ごとに到達目標や臨床研修病院の在り方等の見直しが行われてきている。
