  uncertainty: 数値（330件から14件、知識スコアの内訳）と効果の方向は原著の抄録で確認した。抄録の結果を順番どおりに訳すことはせず、必要な事実を選んで自分の構成で記載した。対象は保健医療職教育全般であり、医学教育のみの数値ではない。TBLの進め方（iRAT・tRAT・応用演習）は方法の概念名として記載した。
