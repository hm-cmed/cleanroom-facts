- id: ME-039
  domain: ME
  subdomain: アセスメント
  assertion:
    plain_statement_ja: mini-CEX（短時間の診察観察とフィードバック）と DOPS（手技の直接観察評価）は、職場で行う形成的評価として世界的に使われており、その教育効果が系統的レビューで整理されている。26件の研究を対象としたレビューでは、学習者の反応は研究によりまちまちだった一方、遂行（パフォーマンス）の改善については、mini-CEX で標準化平均差0.26、DOPS で同3.33と、肯定的な効果がメタ解析で示された。これより上の段階（行動変容や組織の成果）を見た研究はなかった。また、評価の実施の質や参加者の応答性といった実施上の特性が、教育効果と関連していた。
    condition:
      region: 国際
      対象: 教育者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-5314
    source: 'Lörwald AC, Lahner FM, Nouns ZM, Berendonk C, Norcini J, Greif R, Huwendiek S. The educational impact of Mini-Clinical Evaluation Exercise (Mini-CEX) and Direct Observation of Procedural Skills (DOPS) and its association with implementation: a systematic review and meta-analysis. PLoS One. 2018;13(6):e0198009'
    doi: 10.1371/journal.pone.0198009
    pmid: '29864130'
    pmcid: PMC5986126
    url: https://doi.org/10.1371/journal.pone.0198009
    source_license: CC BY 4.0（PLoS One、Europe PMC の license 欄で確認）
    legal_basis: B
    source_class: OPEN
    corroboration: null
  uncertainty: 数値（26件、標準化平均差0.26 と 3.33）は原著の抄録で確認した。DOPS の効果量は非常に大きく、対象研究の規模や設計の影響を受けている可能性がある。効果の段階づけは Kirkpatrick の4段階を応用した分類（ME-054 参照）によるもので、遂行は第2段階にあたる。対象は学部・卒後の医療専門職の学習者全般である。
