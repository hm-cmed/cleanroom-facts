- id: ME-035
  domain: ME
  subdomain: アセスメント
  assertion:
    plain_statement_ja: 評価の妥当性は、テストそのものの性質ではなく、その得点の解釈と使い方が裏づけられるかどうかで判断する、というのが現代の考え方である。顔面妥当性・内容妥当性・基準連関妥当性といった区別は、構成概念妥当性という一つの概念に統合され、根拠は5つの面から集める。すなわち、内容（項目が構成概念を代表しているか）、反応過程（受験者や観察者の思考過程）、内的構造（信頼性や因子構造）、他の変数との関係（同じ構成概念を測る別の指標との相関）、結果（得点が実際に違いを生むか）である。得点の信頼性は妥当な解釈の必要条件ではあるが、十分条件ではない。
    condition:
      region: 国際
      対象: 教育者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-5310
    source: 'Cook DA, Beckman TJ. Current concepts in validity and reliability for psychometric instruments: theory and application. Am J Med. 2006;119(2):166.e7-16'
    doi: 10.1016/j.amjmed.2005.10.036
    pmid: '16443422'
    pmcid: null
    url: https://doi.org/10.1016/j.amjmed.2005.10.036
    source_license: © Elsevier（The American Journal of Medicine、CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 主張は抄録で確認した範囲（妥当性の統合的概念と5つの根拠源、信頼性との関係）に基づく。Messick の枠組みを基礎とし、Kane の論証に基づく考え方も原著の本文で論じられているが、細部は本カードに含めていない。
