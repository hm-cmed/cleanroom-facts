- id: ME-043
  domain: ME
  subdomain: アセスメント
  assertion:
    plain_statement_ja: 評価には、学習の途中で改善のための情報を返す形成的評価と、進級・修了などの決定に用いる総括的評価とがあり、目的によって設計も扱いも異なる。形成的評価は、学習者が自分の現在地と目標との隔たりを知り、次に何をすべきかを決めるためのもので、結果に重大な帰結を伴わないことが、率直な自己開示とフィードバックの受け入れを支える。総括的評価は、能力の到達を社会に対して保証するためのもので、信頼性や手続きの公正さがより強く求められる。一つの評価に両方の役割を担わせると、学習のための情報収集と、判定のための測定とが競合し、緊張関係が生じると指摘されている。
