- id: ME-007
  domain: ME
  subdomain: 評価
  assertion:
    plain_statement_ja: EPA（Entrustable Professional Activities、信頼して任せられる専門的活動）は、学習者に監督なしで任せられるかどうかで判断される、具体的な診療活動の単位である。コンピテンシーが学習者の資質・能力を抽象的に表すのに対し、EPAは日常の診療で行われる活動そのものを単位とし、指導者は学習者の能力を見て、どの程度の監督のもとでその活動を任せるかを判断する。この「任せられるか」という判断（entrustment）を評価の中心に置くことで、資質・能力の評価を、臨床現場での実際の業務の委任に結びつける考え方として提案された。
    condition:
      region: 国際
      対象: 教育者
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-5109
    source: ten Cate O. Entrustability of professional activities and competency-based training. Med Educ. 2005;39(12):1176-1177
    doi: 10.1111/j.1365-2929.2005.02341.x
    pmid: '16313574'
    pmcid: null
    url: https://doi.org/10.1111/j.1365-2929.2005.02341.x
    source_license: © Wiley（Medical Education、CC表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: EPAとentrustmentの概念は SRC-5110（ten Cate O, et al. 2024年の解説書の章、CC BY 4.0）でも同じ内容で解説されている
  uncertainty: 原著（2005年）は2ページの論説で抄録が公開されていないため、概念の説明はCC BYで公開された2024年の解説（SRC-5110）の範囲で裏づけ、自作の文で記載した。監督レベルの段階分けなど、原著以降の文献で展開された細部は本カードに含めていない。
