- id: ME-011
  domain: ME
  subdomain: アセスメント
  assertion:
    plain_statement_ja: 共用試験CBTは、医学生が診療参加型臨床実習を始める前に、臨床実習に必要な知識の修得度を評価するコンピュータ試験で、臨床実習前OSCEとともに医師法に基づく共用試験（臨床実習前共用試験）を構成する。出題は医学教育モデル・コア・カリキュラムの内容に基づき、各大学が作成し実施機関が校閲した問題を蓄積したプールから行われる。実施機関の2024年の公表資料によれば、設問は5選択肢択一240問・多選択肢択一40問・5選択肢択一の4連問40問の合計320問で、6時間で解答する。この中には、難易度や識別力を測るための採点対象外の試行問題が含まれ、受験者ごとに異なる問題セットが項目反応理論（IRT）によって等質になるよう調整される。合格には、CBTとOSCEの両方で、あらかじめ定められた到達基準に達することが必要である。共用試験は、2002年にトライアルが始まり、2005年12月に正式実施が開始された当初は大学間の任意の共通試験だったが、2023年度からは医師法に基づく公的な試験となり、合格が診療参加型臨床実習で医行為を行うための法的な前提となった。
    condition:
      region: 日本
      対象: 医学生（医学部の学生）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-5102
    source: 医師法（昭和23年法律第201号、令和3年法律第49号による改正を含む現行法）
    doi: null
    pmid: null
    pmcid: null
    url: https://laws.e-gov.go.jp/law/323AC0000000201
    source_license: 法令（著作権法13条により権利の目的とならない）
    legal_basis: C
    source_class: GOV_JP
    corroboration: 実施形態の細部（320問・6時間・設問形式の内訳・IRT・到達基準）は SRC-5115（医療系大学間共用試験実施評価機構の関係者による2024年の解説、RESTRICTED）で確認した。共用試験の開始の経緯（2002年のトライアル、2005年12月の正式実施）は SRC-5114（医学教育白書2006年版、RESTRICTED）による。SRC-5104（日本医師会「日医 on-line」特別寄稿、RESTRICTED）を補助として再利用し、出題の基盤となるカリキュラムは SRC-5101（医学教育モデル・コア・カリキュラム、GOV_JP）である
  uncertainty: 数値（320問・6時間・設問形式の内訳）は、実施機関の関係者による2024年時点の公表解説に基づくもので、年度により変更されうる。2023年度の公的化の前後で、任意の共通試験から医師法に基づく法定の試験へ位置づけが変わり、2025年4月からは医師国家試験の受験資格にも共用試験の合格が位置づけられている（ME-002）。実施機関（CATO）の公式サイトの現行ガイドブックは今回直接取得できなかったため、機構関係者の公表解説と文部科学省の資料で代替確認した。指定試験機関に関する医師法施行規則の条文の逐語確認はしていない。歯学の共用試験CBTも並行して存在するが、本カードは医学の制度を扱う。
