- id: ME-041
  domain: ME
  subdomain: アセスメント
  assertion:
    plain_statement_ja: 評価の専門家会議（オタワ会議）の合意枠組みは、「良い評価」の基準を、個々の評価と、評価プログラム（評価システム）の両方について示している。個々の評価の基準は2010年の合意を引き継ぎ、妥当性、再現性・一貫性、同等性、実施可能性、教育効果、触媒効果（学習と改善を促す効果）、受け入れ可能性の7つである。2018年の枠組みでは、これに加えて評価システム全体に適用する基準が新たに示され、受験者やプログラムの多様化、重大な決定を伴う評価について法的に争われた際の説明可能性、医学教育の国際的な通用性といった、実施上の論点も整理されている。
