    corroboration: 必修化の経緯（平成12年改正・平成16年度開始）と、概ね5年ごとの見直しの経過は SRC-5105（厚生労働省 医道審議会医師分科会医師臨床研修部会報告書、令和6年3月、GOV_JP）でも述べられている
  uncertainty: 出典内の位置：臨床研修の義務は第16条の2第1項。「概ね5年ごとの見直し」は厚労省の医師臨床研修部会報告書（SRC-5105）の記述によるもので、見直しの周期を直接定めた法令の条文は今回確認できなかった（制度解説の中には法令に定めるとする記述もある）。1968年当時の努力義務の根拠条文の逐語確認はしていない。
