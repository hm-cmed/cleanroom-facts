- id: ME-042
  domain: ME
  subdomain: アセスメント
  assertion:
    plain_statement_ja: 多肢選択問題の作問上の欠陥（手がかりを与える書き方や曖昧な表現など）は、知識とは無関係に受験者の得点や合否を左右しうる。看護学生を対象とした高ステークス試験の分析では、全問題の47.3%に作問上の欠陥があり、欠陥のない問題だけで判定すると合格率は94.3%から90.6%に下がった。医学部の基礎科学試験を対象とした別の研究でも、欠陥のある問題は36〜65%を占め、欠陥問題は正規の問題より最大で15ポイント難しくなっていた。欠陥は、測りたい構成概念とは無関係なばらつき（構成概念無関係分散）を試験に持ち込み、評価の妥当性を損なう。
