    plain_statement_ja: 医療専門職教育におけるインターネット基盤学習の効果を統合したメタ解析（対象201件の研究）では、比較の相手によって効果の大きさが大きく異なった。教育介入のない場合との比較では効果が大きく、知識で効果量1.00（95%信頼区間 0.90〜1.10、126件）、技能で0.85（0.49〜1.20、16件）、学習者の行動と患者への効果で0.82（0.63〜1.02、32件）だった。一方、インターネットを用いない従来型の教育との比較では効果は小さく、知識で0.12（0.003〜0.24、63件）、技能で0.09（-0.26〜0.44、12件）、満足度で0.10（有意差なし、43件）にとどまり、著者らは、インターネット基盤学習の効果は従来型の方法と同程度だと結論づけた。研究間のばらつき（異質性）は大きく、I²はすべての解析で79%以上だった。
