- id: ME-002
  domain: ME
  subdomain: 制度
  assertion:
    plain_statement_ja: 2021年の医師法改正（令和3年法律第49号）により、共用試験は公的な位置づけを得た。共用試験は、医学生が臨床実習を開始する前に修得すべき知識・技能を備えているかどうかを評価するために大学が共用する試験で、厚生労働省令で定めるものとされる。共用試験に合格した医学生は、大学が行う臨床実習において、医師の指導監督の下に、知識・技能の修得のために医業（政令で定めるものを除く）を行うことができる（医師法第17条の2、いわゆるStudent Doctorの規定で、2023年4月1日施行）。また2025年4月1日からは、医師国家試験の受験資格として、大学の医学の正規の課程を修めて卒業した者に共用試験への合格が要件として加わった（同法第11条第1号）。施行前に共用試験に相当する試験に合格した者を合格とみなす経過措置が政令で定められている。
    condition:
      region: 日本
      対象: 医学生（共用試験に合格した医学部の学生）
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-5102
    source: 医師法（昭和23年法律第201号、令和3年法律第49号による改正を含む現行法）
    doi: null
    pmid: null
    pmcid: null
    url: https://laws.e-gov.go.jp/law/323AC0000000201
    source_license: 法令（著作権法13条により権利の目的とならない）
    legal_basis: C
    source_class: GOV_JP
    corroboration: 共用試験の公的化とStudent Doctorの法的位置づけは、SRC-5103（厚生労働省 医道審議会医師分科会報告書、令和2年5月、GOV_JP）の提言に基づく改正である
  uncertainty: 出典内の位置：共用試験の定義と受験資格は第11条第1号、Student Doctorは第17条の2。施行時期（第17条の2は令和5年4月1日、第11条の要件追加は令和7年4月1日）と経過措置は、改正法の経過措置を定める政令の概要資料で確認した。共用試験の実施機関を厚生労働大臣の指定する機関とする省令上の定めは、本カードの主張に含めていない。歯科医師法にも並行する仕組みがあるが、本カードは医師（医学）の制度を扱う。
