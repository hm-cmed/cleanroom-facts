    plain_statement_ja: 医学生のうつ病・抑うつ症状と自殺念慮の有病率について、43か国の研究を統合した系統的レビュー・メタ解析では、抑うつ症状の有病率は27.2%（95%信頼区間 24.7〜29.9%）と推定された（横断研究167件・対象116,628人と、縦断研究16件・5,728人。2016年9月までに発表された研究が対象で、調査年は1982年から2015年にわたる）。自殺念慮の有病率は11.1%（95%信頼区間 9.0〜13.7%）だった（横断研究24件・21,002人、15か国）。抑うつ症状のスクリーニングで陽性となった学生のうち、精神科の治療を求めたのは15.7%にとどまった。研究のほとんどは自己記入式の尺度による測定であり、測定方法によって抑うつ症状の推定値は9.3%から55.9%まで幅があった。
