- id: ME-040
  domain: ME
  subdomain: アセスメント
  assertion:
    plain_statement_ja: 職場基盤型評価（WBA）は、診療現場で学習者の仕事ぶりを直接観察して行う評価であり、試験場の評価では測れない実際の遂行を扱う。観察にその場のフィードバックを組み合わせた形成的評価は、学習者の行動を変える力を持つことが研究で示されており、mini-CEX や DOPS などの方法が開発されてきた。一方で、評価を担う教員の参加と訓練が実施の成否を左右し、学習者のニーズに合った、遂行の重要な面に焦点を当てたフィードバックであることが効果を高める条件になる。評価者の負担や参加の確保は、導入時の課題として残されている。
