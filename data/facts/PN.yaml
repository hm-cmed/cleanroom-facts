- id: PN-008
  domain: PN
  subdomain: 慢性炎症性脱髄性多発根ニューロパチー
  assertion:
    plain_statement_ja: 慢性炎症性脱髄性多発根ニューロパチー（CIDP）の2021年改訂 EAN/PNS ガイドラインでは、診断の確度は「CIDP」と「possible CIDP」の2段階に整理され、初回治療として免疫グロブリン静注療法またはコルチコステロイドが強く推奨され、両者が無効な場合には血漿交換が強く推奨される。
    condition:
      population: CIDP（典型型および亜型）患者
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1746
    source: 'Van den Bergh PYK, van Doorn PA, Hadden RDM, et al. European Academy of Neurology/Peripheral Nerve Society guideline on diagnosis and treatment of chronic inflammatory demyelinating polyradiculoneuropathy: Report of a joint Task Force—Second revision. Eur J Neurol. 2021;28(11):3556-3583'
    doi: 10.1111/ene.14959
    pmid: '34327760'
    pmcid: null
    url: https://doi.org/10.1111/ene.14959
    source_license: ライセンス未確認（European Journal of Neurology、Wiley、Crossref の license 欄は利用条件のみで CC 表示なし）
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 国内の免疫グロブリン製剤には「慢性炎症性脱髄性多発根神経炎（多巣性運動ニューロパチーを含む）の筋力低下の改善」の適応がある（添付文書で確認）。維持療法には免疫グロブリン静注・皮下注またはコルチコステロイドが推奨される（同ガイドライン）。
  curriculum:
    kokushi: 医学各論 Ⅸ-5-A-②（Guillain-Barré症候群、慢性炎症性脱髄性多発根ニューロパチー、b）
