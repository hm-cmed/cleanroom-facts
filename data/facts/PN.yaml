- id: PN-001
  domain: PN
  subdomain: 多発ニューロパチー
  assertion:
    plain_statement_ja: 多発ニューロパチーの診断では、神経伝導検査が病型（軸索型か脱髄型か）と重症度を判定するために必須であり、その結果に基づいて鑑別検査を層別化して進める。
    condition:
      population: 多発ニューロパチーが疑われる患者
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1741
    source: 'Lehmann HC, Wunderlich G, Fink GR, Sommer C. Diagnosis of peripheral neuropathy. Neurol Res Pract. 2020;2:20（PMCID: PMC7650053）'
    doi: 10.1186/s42466-020-00064-2
    pmid: '33324924'
    pmcid: null
    url: https://doi.org/10.1186/s42466-020-00064-2
    source_license: CC BY 4.0（Crossref の license 欄および PMC 収載版で確認）
    legal_basis: B
    source_class: OPEN
    corroboration: null
  uncertainty: 主な原因として糖尿病、中毒性（アルコール、化学療法薬など）、免疫介在性、遺伝性が挙げられるが、糖尿病に特化した鑑別・管理は本パートの範囲外とし、DM の範囲に委ねる。
  curriculum:
    kokushi: 医学各論 Ⅸ-5-A-①（多発ニューロパチー、a）
    core_curriculum: 'PS-02-03-05 (id: JkxnuP0)'
