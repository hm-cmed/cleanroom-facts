- id: PN-005
  domain: PN
  subdomain: Guillain-Barré症候群
  assertion:
    plain_statement_ja: Guillain-Barré 症候群の髄液所見の典型像は、蛋白の上昇と細胞数の正常という組み合わせ（蛋白細胞解離）であるが、発症早期には髄液所見も神経伝導検査も正常のことがある。
    condition:
      population: Guillain-Barré 症候群患者
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1743
    source: 'Leonhard SE, Mandarakas MR, Gondim FAA, et al. Diagnosis and management of Guillain-Barré syndrome in ten steps. Nat Rev Neurol. 2019;15(11):671-683（PMCID: PMC6821638）'
    doi: 10.1038/s41582-019-0250-9
    pmid: '31541214'
    pmcid: null
    url: https://doi.org/10.1038/s41582-019-0250-9
    source_license: CC BY 4.0（PMC 収載版の license 表示で確認）
    legal_basis: B
    source_class: OPEN
    corroboration: null
  uncertainty: 髄液所見が正常でも発症早期であれば本症を除外できない。
  curriculum:
