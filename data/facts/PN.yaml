- id: PN-004
  domain: PN
  subdomain: Guillain-Barré症候群
  assertion:
    plain_statement_ja: Guillain-Barré 症候群の患者の約3分の2は発症前6週間以内に感染症の症状を報告し、先行感染として Campylobacter jejuni、サイトメガロウイルス、E型肝炎ウイルス、Mycoplasma pneumoniae、Epstein-Barr ウイルス、ジカウイルスなどが症例対照研究で関連づけられている。
    condition:
      population: Guillain-Barré 症候群患者
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1743
    source: 'Leonhard SE, Mandarakas MR, Gondim FAA, et al. Diagnosis and management of Guillain-Barré syndrome in ten steps. Nat Rev Neurol. 2019;15(11):671-683（PMCID: PMC6821638）'
    doi: 10.1038/s41582-019-0250-9
    pmid: '31541214'
    pmcid: null
    url: https://doi.org/10.1038/s41582-019-0250-9
    source_license: CC BY 4.0（PMC 収載版の license 表示で確認）
    legal_basis: B
    source_class: OPEN
    corroboration: null
  uncertainty: 予後について同資料では、最良の医療下でも死亡率は3〜10%と推定され、発症6か月後に自力歩行が可能な患者は60〜80%とされる（本文で確認）。
  curriculum:
    kokushi: 医学各論 Ⅸ-5-A-②（Guillain-Barré症候群、慢性炎症性脱髄性多発根ニューロパチー、b）
