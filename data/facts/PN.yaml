    source: 'Collins MP, Dyck PJ, Gronseth GS, et al. Peripheral Nerve Society Guideline on the classification, diagnosis, investigation, and immunosuppressive therapy of non-systemic vasculitic neuropathy: executive summary. J Peripher Nerv Syst. 2010;15(3):176-184'
    doi: 10.1111/j.1529-8027.2010.00281.x
    pmid: '21040139'
    pmcid: null
    url: https://doi.org/10.1111/j.1529-8027.2010.00281.x
    source_license: ライセンス未確認（Journal of the Peripheral Nervous System、Wiley、CC 表示なし）
