    source_license: © Massachusetts Medical Society（The New England Journal of Medicine、CC 表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 国内では弱毒生水痘ワクチン（50歳以上の帯状疱疹予防）と組換え帯状疱疹ワクチンが使用でき、2025年4月から65歳を対象に帯状疱疹ワクチンの定期接種が始まっている（厚生労働省・自治体資料で確認）。本試験で用いられたのは弱毒生ワクチンであり、組換えワクチンの帯状疱疹後神経痛予防効果は本試験の対象外である。
