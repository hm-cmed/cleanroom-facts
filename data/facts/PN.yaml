  assertion:
    plain_statement_ja: 神経障害性疼痛の薬物療法では、カルシウムチャネルα2δリガンド（プレガバリン、ガバペンチン）が第一選択薬の一つに位置づけられ、50%の疼痛緩和に対する治療必要数（NNT）はプレガバリン7.7、ガバペンチン7.2である（NeuPSIG の系統的レビュー・メタ解析に基づく推奨）。
    condition:
      population: 神経障害性疼痛患者（帯状疱疹後神経痛を含む）
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1759
    source: 'Finnerup NB, Attal N, Haroutounian S, et al. Pharmacotherapy for neuropathic pain in adults: a systematic review and meta-analysis. Lancet Neurol. 2015;14(2):162-173（PMCID: PMC4493167）'
    doi: 10.1016/S1474-4422(14)70251-0
    pmid: '25575710'
    pmcid: null
    url: https://doi.org/10.1016/S1474-4422(14)70251-0
    source_license: © Elsevier（The Lancet Neurology、CC 表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: プレガバリンは国内で「神経障害性疼痛」（帯状疱疹後神経痛を含む）の適応で承認・保険適用されている（添付文書で確認）。ミロガバリンは2019年に末梢性神経障害性疼痛で国内承認され、その後「神経障害性疼痛」へ適応拡大された（公開資料で確認）。三環系抗うつ薬とセロトニン・ノルアドレナリン再取り込み阻害薬も第一選択に位置づけられる。
