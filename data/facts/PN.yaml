- id: PN-007
  domain: PN
  subdomain: Guillain-Barré症候群
  assertion:
    plain_statement_ja: コルチコステロイドの単独投与は Guillain-Barré 症候群の回復を有意に早めず、長期転帰も改善しない（無作為化試験6件・587例の系統的レビュー）。経口ステロイドについては回復を遅らせる可能性が示されている。
    condition:
      population: Guillain-Barré 症候群患者
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1745
    source: 'Hughes RAC, Brassington R, Gunn AA, van Doorn PA. Corticosteroids for Guillain-Barré syndrome. Cochrane Database Syst Rev. 2016;(10):CD001446（PMCID: PMC6464149）'
    doi: 10.1002/14651858.CD001446.pub5
    pmid: '27775812'
    pmcid: null
    url: https://doi.org/10.1002/14651858.CD001446.pub5
    source_license: ライセンス未確認（Cochrane Database of Systematic Reviews、CC 表示なし）
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 本カードはステロイド単独療法の評価であり、免疫グロブリン静注療法や血漿交換との併用の評価ではない。ステロイド自体は国内承認薬であるが、本症への単独投与を支持するエビデンスはないという内容である。
  curriculum:
