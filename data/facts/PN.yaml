- id: PN-006
  domain: PN
  subdomain: Guillain-Barré症候群
  assertion:
    plain_statement_ja: 歩行に介助を要する重症 Guillain-Barré 症候群（発症2週間以内）では、血漿交換と免疫グロブリン静注療法の有効性は同等であり、血漿交換に免疫グロブリン静注療法を続ける併用療法は単独療法を上回る有意な利点を示さなかった（無作為化試験、評価対象379例）。
    condition:
      population: 発症2週間以内の重症 Guillain-Barré 症候群患者
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1744
    source: Plasma Exchange/Sandoglobulin Guillain-Barré Syndrome Trial Group. Randomised trial of plasma exchange, intravenous immunoglobulin, and combined treatments in Guillain-Barré syndrome. Lancet. 1997;349(9047):225-230
    doi: 10.1016/S0140-6736(96)09095-2
    pmid: '9014908'
    pmcid: null
    url: https://doi.org/10.1016/S0140-6736(96)09095-2
    source_license: © Elsevier（The Lancet、CC 表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 免疫グロブリン製剤は国内でもギラン・バレー症候群の適応を有し、添付文書では400 mg/kg/日を5日間投与する用法が確認できる（献血ベニロン-I・献血ヴェノグロブリンIH の添付文書で確認）。試験で用いられた免疫グロブリン投与量も0.4 g/kg/日×5日間である。
  curriculum:
    kokushi: 医学各論 Ⅸ-5-A-②（Guillain-Barré症候群、慢性炎症性脱髄性多発根ニューロパチー、b）
