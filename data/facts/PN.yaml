- id: PN-015
  domain: PN
  subdomain: アミロイドニューロパチー
  assertion:
    plain_statement_ja: パチシランは、遺伝性トランスサイレチンアミロイドーシスのポリニューロパチーに対する第III相試験（APOLLO、225例）で、18か月時点の神経障害スコア（mNIS+7）の変化量がパチシラン群−6.0点、プラセボ群+28.0点であり、群間差−34.0点と神経障害の進行を有意に抑制した。
    condition:
      population: ポリニューロパチーを伴う遺伝性トランスサイレチンアミロイドーシス患者
      region: 国際
    differential: null
    common_misconception: null
  provenance:
