    doi: 10.1056/NEJMoa1716153
    pmid: '29972753'
    pmcid: null
    url: https://doi.org/10.1056/NEJMoa1716153
    source_license: © Massachusetts Medical Society（The New England Journal of Medicine、CC 表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: パチシラン（オンパットロ）は国内で「トランスサイレチン型家族性アミロイドポリニューロパチー」の適応で承認・保険適用されている（PMDA 資料で確認）。タファミジス（ビンダケル）も同疾患の「末梢神経障害の進行抑制」の適応で2013年に国内承認されている（PMDA 資料で確認）。両剤のポリニューロパチーへの適応は変異型（家族性）が対象であり、野生型への適応は心アミロイドーシス側である。
