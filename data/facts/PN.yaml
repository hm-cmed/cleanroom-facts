- id: PN-024
  domain: PN
  subdomain: Tolosa-Hunt症候群
  assertion:
    plain_statement_ja: Tolosa-Hunt 症候群は、ICHD-3 において、海綿静脈洞・上眼窩裂・眼窩の肉芽腫性炎症（MRI または生検で証明されるもの）による一側性の眼窩・眼窩周囲痛と、同側の第III・IV・VI脳神経のいずれか1つ以上の麻痺を来す疾患と定義され、他の疾患ではよりよく説明できないことが要件となる（除外診断）。
    condition:
      population: 有痛性外眼筋麻痺を呈する患者
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1721
    source: Headache Classification Committee of the International Headache Society (IHS). The International Classification of Headache Disorders, 3rd edition. Cephalalgia. 2018;38(1):1-211
    doi: 10.1177/0333102417738202
    pmid: '29368949'
    pmcid: null
    url: https://doi.org/10.1177/0333102417738202
    source_license: ライセンス未確認（Cephalalgia、SAGE、Crossref の license 欄は TDM 用ライセンスのみ。分類本文は国際頭痛学会が公開）
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 臨床的にはステロイドへの迅速な反応性（疼痛は24〜72時間以内に改善することが多い）が特徴とされるが、ステロイド反応性そのものは ICHD-3 の診断基準には含まれていない。有痛性外眼筋麻痺の鑑別（腫瘍、動脈瘤などの血管病変、感染症、他の炎症性疾患）の除外と経過観察が不可欠である。
  curriculum:
    kokushi: 医学各論 Ⅸ-5-C-③（Tolosa-Hunt症候群、c）
