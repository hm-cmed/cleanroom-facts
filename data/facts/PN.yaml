- id: PN-023
  domain: PN
  subdomain: 帯状疱疹後神経痛
  assertion:
    plain_statement_ja: 60歳以上を対象とした無作為化二重盲検試験（38,546例）で、弱毒生帯状疱疹ワクチンは帯状疱疹の発症を51.3%、帯状疱疹後神経痛の発症を66.5%減少させた。
