- id: PN-003
  domain: PN
  subdomain: 多発ニューロパチー
  assertion:
    plain_statement_ja: 遠位対称性多発ニューロパチーの評価では、スクリーニング検査のうち異常検出率が高いのは、血糖、血清ビタミンB12（メチルマロン酸などの代謝産物の測定を含む）、血清蛋白免疫固定電気泳動である。
    condition:
      population: 遠位対称性多発ニューロパチー患者
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1742
    source: 'England JD, Gronseth GS, Franklin G, et al. Practice Parameter: evaluation of distal symmetric polyneuropathy: role of laboratory and genetic testing (an evidence-based review). Neurology. 2009;72(2):185-192'
    doi: 10.1212/01.wnl.0000336370.51010.a1
    pmid: '19056666'
    pmcid: null
    url: https://doi.org/10.1212/01.wnl.0000336370.51010.a1
    source_license: ライセンス未確認（Neurology 誌、CC 表示なし）
    legal_basis: B
    source_class: UNKNOWN
    corroboration: null
  uncertainty: 本パラメータは遠位対称性多発ニューロパチーを対象とする。血糖値が正常でも、遠位対称性感覚性多発ニューロパチーでは耐糖能異常の検査を考慮しうるとされる。糖尿病そのものの診断・治療は扱わない。
  curriculum:
    kokushi: 医学各論 Ⅸ-5-A-①（多発ニューロパチー、a）
