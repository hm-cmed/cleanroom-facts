- id: PN-011
  domain: PN
  subdomain: 多発単ニューロパチー
  assertion:
    plain_statement_ja: 血管炎性ニューロパチーは、典型的には非対称性・多巣性（多発単ニューロパチー型）で有痛性、下肢優位の軸索型ニューロパチーとして発症し、病理学的な確定診断には神経生検で血管壁の炎症に血管障害を伴う所見を要する。
    condition:
      population: 血管炎性ニューロパチーが疑われる患者
      region: 国際
    differential: null
    common_misconception: null
  provenance:
