- id: PN-014
  domain: PN
  subdomain: アミロイドニューロパチー
  assertion:
    plain_statement_ja: トランスサイレチン型アミロイドニューロパチーは、長さ依存性の小径線維ニューロパチーに自律神経障害を伴う進行性の病像を呈し、両側手根管症候群、原因不明の体重減少、心臓の伝導障害や心肥大などが早期診断の手がかり（レッドフラグ）となる。
