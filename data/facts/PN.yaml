- id: PN-002
  domain: PN
  subdomain: 多発ニューロパチー
  assertion:
    plain_statement_ja: 多発ニューロパチーの多くは長さ依存性であり、感覚・運動症状は手袋・靴下型の遠位対称性分布を示して近位へ上行し、足関節反射は早期から消失する。
    condition:
      population: 多発ニューロパチー患者
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1741
    source: 'Lehmann HC, Wunderlich G, Fink GR, Sommer C. Diagnosis of peripheral neuropathy. Neurol Res Pract. 2020;2:20（PMCID: PMC7650053）'
    doi: 10.1186/s42466-020-00064-2
    pmid: '33324924'
    pmcid: null
    url: https://doi.org/10.1186/s42466-020-00064-2
    source_license: CC BY 4.0（Crossref の license 欄および PMC 収載版で確認）
    legal_basis: B
    source_class: OPEN
    corroboration: null
  uncertainty: 非対称性・多巣性の分布は長さ依存性パターンから外れ、血管炎性ニューロパチー（PN-011）やアミロイドニューロパチー（PN-014）などを示唆する。
  curriculum:
