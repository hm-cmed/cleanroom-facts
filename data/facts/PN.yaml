- id: PN-009
  domain: PN
  subdomain: 腫瘍随伴性ニューロパチー
  assertion:
    plain_statement_ja: 亜急性感覚性ニューロパチー（感覚性ニューロノパチー）は腫瘍随伴性神経症候群の高リスク表現型であり、抗Hu抗体（ANNA-1）と小細胞肺癌に強く関連するため、本症をみたら抗体測定と腫瘍検索を行う必要がある。
    condition:
      population: 亜急性感覚性ニューロパチー患者
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1747
    source: 'Graus F, Vogrig A, Muñiz-Castrillo S, et al. Updated diagnostic criteria for paraneoplastic neurologic syndromes. Neurol Neuroimmunol Neuroinflamm. 2021;8(4):e1014（PMCID: PMC8237398）'
    doi: 10.1212/NXI.0000000000001014
    pmid: '34006622'
    pmcid: null
    url: https://doi.org/10.1212/NXI.0000000000001014
    source_license: CC BY 4.0（PMC 収載版の license 表示で確認）
    legal_basis: B
    source_class: OPEN
    corroboration: null
  uncertainty: 2021年改訂基準では、高リスク抗体は70%を超える頻度で腫瘍に関連する抗体と定義され、表現型・抗体・腫瘍の有無・経過を組み合わせた PNS-Care スコアで definite、probable、possible の確度を判定する。
