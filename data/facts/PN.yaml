- id: PN-010
  domain: PN
  subdomain: 単ニューロパチー
  assertion:
    plain_statement_ja: 単ニューロパチーは単一の末梢神経の障害であり、代表例は絞扼性ニューロパチー（手根管での正中神経障害、肘部での尺骨神経障害、橈骨神経障害など）で、診断では神経圧迫の病態を踏まえ、頸椎神経根症などの類似疾患との鑑別が要点となる。
    condition:
      population: 単ニューロパチー患者
      region: 国際
    differential: null
    common_misconception: null
  provenance:
    source_ref: SRC-1748
    source: Doughty CT, Bowley MP. Entrapment neuropathies of the upper extremity. Med Clin North Am. 2019;103(2):357-370
    doi: 10.1016/j.mcna.2018.10.012
    pmid: '30704687'
    pmcid: null
    url: https://doi.org/10.1016/j.mcna.2018.10.012
    source_license: © Elsevier（Medical Clinics of North America、CC 表示なし）
    legal_basis: B
    source_class: RESTRICTED
    corroboration: null
  uncertainty: 個別の絞扼性ニューロパチー（手根管症候群、肘部管症候群）は B の範囲で別カードとした（PN-016〜PN-019）。外傷性・圧迫性の単ニューロパチーも概念に含まれるが、本出典は絞扼性が中心である。
