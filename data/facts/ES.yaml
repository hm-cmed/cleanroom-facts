- id: ES-009
  domain: ES
  subdomain: GERD・NERD・Barrett食道
  assertion:
    plain_statement_ja: Lyon consensus 2.0では、酸分泌抑制薬を中止して行う逆流モニタリングで、酸曝露時間（AET）が6%を超えればGERDの確定的根拠、4%未満なら生理的範囲、4〜6%は判定保留とする。内視鏡ではLA分類B以上の逆流性食道炎も確定的根拠とされた。
    condition: 24時間pH（・インピーダンス）検査、または延長ワイヤレスpH検査（2日以上で基準を満たす）
    differential: 逆流過敏性食道、機能性胸やけ
    common_misconception: LA分類Aは単独ではGERDの確定根拠にならない
  provenance:
    source_ref: SRC-010
    source: 'Gyawali CP, et al. Updates to the modern diagnosis of GERD: Lyon consensus 2.0. Gut 2024;73(2):361-371'
    doi: 10.1136/gutjnl-2023-330616
    pmid: null
    pmcid: null
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC13425011/
    source_license: CC BY-NC（WUSTL Digital Commonsの記録「Re-use permitted under CC BY-NC」）
