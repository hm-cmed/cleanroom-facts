    corroboration: 自由に使える資料による裏づけ（GOV_US、作り手の調査バッチ42 2026-11-11）：CDC「About Infectious Mononucleosis」（Epstein-Barr virus and Infectious Mononucleosis、2024-05-09 版）（GOV_US、https://www.cdc.gov/epstein-barr/about/mononucleosis.html、新規 SRC 候補）。裏づける部分：CDC のページに、伝染性単核球症は主に EB ウイルスによって起こること、症状として強い倦怠感・咽頭痛・頸部や腋窩のリンパ節腫脹があり、血液ではリンパ球の増加がみられること、多くは 2〜4 週間で回復するが倦怠感が数週間続くことがあることが明記される。数値の照合：症状の持続（数週間）は候補と整合。「EB ウイルスの初感染によって起こる」という限定は CDC のページにはなく、CDC は他のウイルスでも起こりうるとしているため、その部分を留保して B。留保：主出典（SRC-2031）は Crossref で TDM ライセンスのみで、RESTRICTED が正しい
