- id: GU-010
  domain: GU
  subdomain: 前立腺肥大症
  assertion:
    plain_statement_ja: 前立腺肥大症の男性3047例を平均4.5年追跡したMTOPS試験では、ドキサゾシンとフィナステリドの併用はプラセボに比べ臨床的進行のリスクを66%低下させ、各薬剤の単独療法より有意に大きく進行を抑えた。急性尿閉と侵襲的治療の必要性は、フィナステリドを含む治療（併用療法とフィナステリド単独）で低下し、ドキサゾシン単独では低下しなかった。
    condition:
      region: 米国
