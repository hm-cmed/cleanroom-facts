- id: GU-022
  domain: GU
  subdomain: 陰茎癌
  assertion:
    plain_statement_ja: 陰茎癌はまれな癌で、60歳代の男性に多く、発生率は男性10万人あたり1人未満である。組織型は扁平上皮癌が原発性陰茎癌の約95%を占めて最も多く、症例の約半数が HPV 感染と関連する。危険因子には包茎、HPV 感染、喫煙が含まれる。初診時に触知できる鼠径リンパ節を認める症例は28〜64%に上り、5年生存率は全体で約50%、リンパ節転移陽性例では27%である。
