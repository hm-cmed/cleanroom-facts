  assertion:
    plain_statement_ja: 包茎は、陰茎の炎症性疾患や硬化性苔癬などの炎症の後に後天性に生じることがある。後天性包茎の男性では、26%に糖尿病の既往が認められた。小児では包茎があると亀頭炎が多く、5歳未満では包茎のある児の25%に対し、包茎のない児では6%に亀頭炎がみられた。包皮と亀頭の炎症に対する根治的な治療は環状切除である。
