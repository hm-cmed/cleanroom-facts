name: 問題サイトへの通知

# 事実カードが更新されたら、問題サイト（hm-cmed/cleanroom-mcq）に知らせ、問題データを作り直してもらう。
# Settings → Secrets に MCQ_DISPATCH_TOKEN（cleanroom-mcq に書き込めるトークン）がないときは何もしない
# （その場合も、問題サイトは毎日 4:00 に自動で最新版を取り込む）。

on:
  push:
    branches: [main]
    paths: ["data/facts/**", "data/domains.yaml"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: cleanroom-mcq に通知する
        env:
          GH_TOKEN: ${{ secrets.MCQ_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "MCQ_DISPATCH_TOKEN が未設定のため通知しません"; exit 0; fi
          gh api repos/hm-cmed/cleanroom-mcq/dispatches -f event_type=facts-updated
