# 教育コンテンツに必要だが、CCライセンス資料の事実票でカバーできていない項目（ギャップ）
# proposed_resolution:
#   expert_opinion     … 専門家（感染症専門医・感染症専門薬剤師等）の意見で補う。表示ラベルは【専門家の意見】等とし、ガイドライン推奨と混同しない
#   permission_request … 学会ガイドラインの許諾が得られれば事実票化できる
#   regulatory_fact    … 添付文書等の規制情報を事実として記録する（文章は転載しない）
#   data_retrieval     … 公的統計等から数値を取得して事実票化する
#   extraction_pending … CC資料はあるが事実票の抽出が未了
#   out_of_scope_v1    … 初期版では扱わない
# 作成：2026-11-08（Claude下書き）。優先度・質問文は研究者が確認すること。

gaps:

# ============================================================ C1 開始判断・薬剤選択
- gap_id: GAP-C1-RISK
  course: [C1]
  topic: 敗血症・重症感染症で経験的に抗MRSA薬を開始する基準
  needed_content: どの患者背景（MRSA保菌・分離歴、最近の入院・抗菌薬曝露、透析、血管内カテーテル、施設入所、重症度など）があれば経験的に抗MRSA薬を加えるか
  why_not_covered: J-SSCG 2024（CC BY）はCQ2-5で「疑われる場合に加える」とする背景情報のみで、具体的な基準を示していない。国内MRSAガイドラインは許諾照会中
  cc_sources_checked: [JSSCG_2024_JIC, UK_MRSA_GL_2021]
  noncc_sources: [MRSA_GL_JP_2024, JAID_JSC_2023, SSC_2021]
  proposed_resolution: expert_opinion
  expert_questions:
    - 敗血症が疑われる成人で、経験的に抗MRSA薬を加える根拠として、次の各因子をどの程度重視しますか（1：重視しない〜5：非常に重視）。MRSA保菌・分離歴／90日以内の入院／90日以内の静注抗菌薬使用／血液透析／血管内カテーテル留置／敗血症性ショック／人工呼吸管理／長期療養施設入所
    - 上記以外に重視する因子があれば挙げてください
  response_format: 5段階評価＋自由記載
  display_label_if_expert: 【専門家の意見】
  priority: high
  status: open
  notes: 専門医アンケートを研究として実施・公表する場合は、別途倫理審査が必要

